<body>
<main id="app"></main>
<div id="sh" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="card"><div class="k">📜 Need the background?</div><h3 id="shT"></h3><ol id="shB"></ol><div class="row"><button class="btn c" data-a="x">Got it ▸</button></div></div></div>
<script>
/* ===== Background pop-outs (shared by every FRQ) ===== */
const BG={
frq:{t:"How AP FRQs are scored",s:["Each part (A, B, C…) is worth 1 point and is scored on its own. A mistake in Part B can't cost you Part C.","Readers look for the right idea, clearly linked to the question. Fancy writing earns nothing extra.","No thesis, intro, or conclusion needed. Label each part and answer it directly.","Write in complete sentences and do what the task verb asks (Identify, Describe, or Explain).","Never leave a part blank. A wrong answer costs nothing."]},
tea:{t:"The TEA method",s:["T1- Topic: your reason in general words. Turn the question into your claim.","E2- Evidence: the specific proof, like a place, number, or example, ideally from the map or table.","A3- Analysis: why it matters. Explain HOW or WHY your proof backs up your reason, using “because…” or “which leads to…”.","Label each piece T1-, E2-, A3- so the reader can find every point. Describe answers need T1 and E2 plus a short A3. Explain answers need a strong A3."]},
readmap:{t:"How to read a map",s:["Read the title first. It tells you the topic, place, and time.","Check the legend so you know what each color and symbol means.","Look for patterns: what's clustered, what's connected, what points where?","Then ask WHY: who made this, and what story is it telling?"]},
readtable:{t:"How to read a data table",s:["Read the title and every column header, including units (%, per 1,000).","Find the highest and lowest value in each column.","Compare columns: when one goes up, does another go up or down?","When there are two years, look for change over time."]},
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]}
};
/* ===== Task verbs ===== */
const VERBS={
Identify:{d:"Name it. A word or short phrase is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","One sentence max."]},
Describe:{d:"Paint the picture. Give the specific characteristics or pattern, with details someone could check.",l:["Use evidence: a place, a number, or a feature from the stimulus.","Say what it IS or what it LOOKS LIKE. You don't need a deep “why.”","About 1–2 sentences. Use TEA: Topic + Evidence, then a quick Analysis."]},
Explain:{d:"Tell HOW or WHY. Connect a cause to an effect so a reader sees the reasoning, not just a fact.",l:["Use linking words: “because…”, “which leads to…”, “as a result…”.","A fact alone won't score. You need the chain of reasoning.","About 2–3 sentences. Use full TEA."]}
};
/* ===== FRQ registry: each FRQ data file calls addBG() and addFRQ() ===== */
const FRQ=[];
function addBG(o){Object.assign(BG,o)}
function addFRQ(f){FRQ.push(f)}
const UNIT="Unit 6 · Cities and Urban Land Use";
/* Brookhaven Spreads Out: a Unit 6 practice FRQ (original, invented metro area). Data table. */
addBG({
sprawl:{t:"Suburbanization & urban sprawl",s:["Suburbanization is the movement of people and homes from the central city outward to the suburbs that ring it.","In the United States it boomed after World War II: cheap cars, the Interstate Highway System (begun 1956), and FHA and VA government-backed mortgages made a new house far from downtown easy to afford.","Urban sprawl is what that growth looks like on the ground: low-density, car-dependent subdivisions, strip malls, and parking lots spreading over former farmland.","Consequences include long commutes and traffic, air pollution, loss of farmland and habitat, the high cost of stretching roads and sewers outward, and metros sorted by income.","Edge cities (big clusters of offices and malls at highway exits) grew where the sprawl met the beltways."]},
urbanmodels:{t:"Urban land-use models",s:["Burgess concentric zone model (1920s Chicago): rings around a central business district (CBD): a zone of transition with old housing and factories, then working-class homes, then nicer homes, then a commuter zone.","Hoyt sector model (1939): land uses grow in wedges along railroads and major roads, so a high-rent sector can stretch from downtown to the edge.","Harris and Ullman multiple nuclei model (1945): a city has several centers (airport, university, industrial park, suburban business district), not just one downtown.","Galactic or peripheral model: an old core surrounded by a highway beltway with edge cities and suburbs scattered along it, the classic post-1970 American metro.","Latin American city model: a wealthy spine runs out from the CBD, while squatter settlements and disamenity zones sit on the far edge."]},
gentri:{t:"Gentrification",s:["Gentrification happens when wealthier, often younger, residents move into an older lower-income neighborhood near downtown, renovate the housing, and open new businesses.","It is pulled by cheap older homes, short commutes to downtown jobs, walkable streets, and a taste for city life among young professionals and retirees.","Upsides: higher property values, more tax money for the city, new shops, and reinvestment in buildings that had been neglected.","Downsides: rents and property taxes climb, so long-time lower-income residents, especially renters, are displaced, and the neighborhood's culture and businesses change.","Many gentrifying neighborhoods were once redlined, which is why their housing was cheap enough to attract investors in the first place."]},
zoning:{t:"Zoning & single-family-only rules",s:["Zoning is the set of local laws that say what can be built on each piece of land: homes, shops, factories, and how big or tall.","Single-family-only zoning allows just one detached house per lot, so duplexes, townhouses, and apartment buildings are illegal there.","In many U.S. cities most residential land is zoned this way, which caps how many homes can fit even when demand is high.","Because it holds down supply and keeps out cheaper housing types, critics call it exclusionary zoning; it is one reason housing is so expensive in many metros.","Minneapolis and the state of Oregon have ended single-family-only zoning so that duplexes and triplexes can be built on any residential lot."]},
smartgrowth:{t:"Smart growth & New Urbanism",s:["Smart growth is a set of planning policies that fight sprawl by making metros compact, walkable, and transit-friendly.","Tools include urban growth boundaries (Portland, Oregon has had one since 1979) and greenbelts that protect open land at the edge, transit-oriented development around stations, mixed-use zoning, and infill building on vacant or brownfield (former industrial) lots.","New Urbanism is the design movement behind many of these ideas: walkable blocks, homes close to shops and schools, front porches, and a mix of housing types, as in Seaside, Florida and Kentlands, Maryland.","Supporters say these policies cut driving and protect farmland; critics worry that limiting land for building can push housing prices up unless cities also allow more homes inside the boundary."]},
redlining:{t:"Redlining, blockbusting & white flight",s:["In the 1930s a federal agency (the HOLC) drew maps grading neighborhoods for mortgage risk; areas with Black and immigrant residents were colored red and labeled 'hazardous,' so banks refused to lend there. That is redlining.","Blockbusting: real-estate agents frightened white homeowners into selling cheap by warning that Black families were moving in, then resold the homes to Black buyers at high prices.","White flight: millions of white families left central cities for the suburbs from the 1950s to the 1970s, helped by highways and FHA loans that redlined neighborhoods could not get.","The Fair Housing Act of 1968 banned housing discrimination, but the legacy remains: disinvested neighborhoods, lower home values, and a large racial wealth gap.","Today many formerly redlined neighborhoods near downtown are the ones gentrifying."]}
});
addFRQ({k:"Practice FRQ · Data table",
t:"Brookhaven Spreads Out",
d:"Suburbanization, zoning, gentrification, and smart growth. A Unit 6 practice FRQ.",
u:"Unit 6",
st:"Brookhaven Metropolitan Area: Population, Housing, and Commuting by Zone, 1970 and 2020",
intro:"Brookhaven is an invented U.S. metropolitan area of about one million people. Like many American metros, its population has shifted outward since 1970, while a few old neighborhoods near downtown have recently become popular, and expensive, again.",
stim:"<div class=\"tbl\"><table><thead><tr><th>Zone</th><th>Population 1970</th><th>Population 2020</th><th>Median home price 2020</th><th>Percent of workers who drive alone to work</th><th>Percent of residential land zoned single-family only</th></tr></thead><tbody>\n<tr><td>Central city (inside the old core)</td><td>520,000</td><td>445,000</td><td>$395,000</td><td>55%</td><td>25%</td></tr><tr><td>Inner suburbs</td><td>310,000</td><td>325,000</td><td>$265,000</td><td>78%</td><td>62%</td></tr><tr><td>Outer suburbs / exurbs</td><td>95,000</td><td>300,000</td><td>$380,000</td><td>90%</td><td>85%</td></tr>\n<tr><td>Metro total</td><td>925,000</td><td>1,070,000</td><td>$340,000</td><td>72%</td><td>71%</td></tr></tbody></table></div><p class=\"src\">Note: The central city's population fell to 388,000 in 2000, then grew again after 2010, mostly in two renovated neighborhoods near downtown (Millside and the Canal District), where the 2020 median home price was $610,000. Brookhaven and all of its data are invented for practice. Class directions: label each part, and write Describe and Explain parts as T1- (your reason in general words), E2- (the specific proof), A3- (why it matters).</p>",
bg:["sprawl","urbanmodels","readtable"],
nt:[["Which zone grew the most from 1970 to 2020? Which one shrank?","The outer suburbs tripled, from 95,000 to 300,000. The central city LOST 75,000 people (and had dropped even lower, to 388,000, by 2000). The inner suburbs barely moved. Almost all of the metro's growth happened at the edge."],["Read the drive-alone column and the zoning column together. Do they move the same way?","Yes. Both climb as you move outward: 55% and 25% in the center, 78% and 62% in the inner suburbs, 90% and 85% at the edge. Spread-out, single-house neighborhoods and car dependence go together."],["Where are home prices highest? Does anything about that surprise you?","Two different places are expensive: the outer suburbs ($380,000) and the central city ($395,000), while the inner suburbs are cheapest ($265,000). The note explains the center: two renovated downtown districts are at $610,000. New big houses at the edge and renovated old ones in the core are two different kinds of expensive."]],
m:20,
p:[
{v:"Identify",
q:"Identify the process shown by the growth of the outer suburbs and exurbs between 1970 and 2020.",
sk:"Naming urban processes",
s:[["Look at the outer suburbs row. What happened to its population?",["It went from 95,000 in 1970 to 300,000 in 2020: it tripled.","Meanwhile the central city lost people. So where did the metro's growth go?"]],["Name the process: people and homes spreading outward from the city to its edges.",["It starts with 'sub-'.","Suburbanization, also called urban sprawl when it is low-density and car-dependent."]]],
r:{m:"any",i:[["Suburbanization or urban sprawl (also accept decentralization, exurbanization, counterurbanization, outward growth)",/suburban|sprawl|decentraliz|deconcentrat|exurban|counter.?urban|outward|spread/i,"Name the process: suburbanization (urban sprawl), the metro spreading outward into low-density outer suburbs."]]},
mo:"Suburbanization, or urban sprawl: population spreading outward from the central city into low-density outer suburbs.",
b:["sprawl","urbanmodels"],
th:"Isn't this just urbanization? More people, more city.",
co:"Close, but look at WHERE the growth is. Urbanization means people moving into cities. Here the center lost people while the far edges tripled. There's a more specific word for growth at the edge.",
kq:"The far-out suburbs tripled while downtown shrank. What's the name for that kind of growth?",
ml:["Suburbanization and sprawl",["Urbanization is the share of people living in cities going up. Suburbanization is more specific: people and homes moving from the central city outward to its edges.","When that outward growth is low-density and built around the car (big lots, strip malls, highways), geographers call it urban sprawl.","Exurbs are the farthest ring: semi-rural areas where commuters live beyond the built-up suburbs.","In Brookhaven the center lost 75,000 people while the outer suburbs gained 205,000. That outward shift is the fingerprint of suburbanization."],[["Suburbanization","Population and housing moving from the central city to the suburbs."],["Urban sprawl","Low-density, car-dependent growth spreading outward from a city."],["Exurb","A far-out, semi-rural area where city workers live."]]],
wk:["Urbanization.","Urbanization means a bigger share of people living in cities overall. This table shows the center LOSING people while the far edge triples. That specific outward movement is suburbanization (sprawl)."],
mw:"It names the specific process (suburbanization/sprawl) and ties it to what the table shows: outward, low-density growth at the edge.",
fr:"The growth of the outer suburbs from ___ to ___ shows the process of ___.",
qc:["Suburbanization is…",["people and homes moving from the central city outward to its edges","people moving from farms into the central city","a downtown gaining new skyscrapers"],0,"Suburbs ring the city, and suburbanization is growth in that ring."]},

{v:"Describe",
q:"Using the table, describe the relationship between distance from the center of Brookhaven and the percent of workers who drive alone to work.",
sk:"Reading a pattern in data",
s:[["State the pattern in general words. As you move outward, what happens to the drive-alone share?",["Read the drive-alone column top to bottom: center, inner suburbs, outer suburbs.","Farther from the center = a higher percent driving alone."]],["Quote the numbers as proof.",["55% in the central city, 78% in the inner suburbs, 90% in the outer suburbs.","That's a 35-point jump from the core to the edge."]],["Say why the pattern makes sense. What's different about the edge?",["Low-density houses spread far apart, few buses or trains, long distances to jobs and stores.","Downtown has transit, sidewalks, and jobs close by, so more people walk, bike, or ride."]]],
r:{m:"all",i:[["Uses the table's numbers (55%, 78%, 90%)",/55|78|90/,"Quote the table: 55% in the center, 78% in the inner suburbs, 90% in the outer suburbs."],["States the direction of the relationship: farther out means a higher drive-alone share (or closer in means lower)",/farther|further|outer|outward|exurb|edge|away|distance|increas|higher|rise|goes up|climb|closer|center|central|lower|decreas|less|fewer/i,"State the direction: the farther from the center, the higher the share of workers who drive alone."]]},
mo:"T1- The farther a zone is from the center of Brookhaven, the higher the percent of workers who drive alone to work. E2- In the central city only 55% drive alone, in the inner suburbs it rises to 78%, and in the outer suburbs and exurbs it reaches 90%. A3- This fits because the outer zones are low-density and built around the car: homes are far from jobs and shops and there is little bus or rail service, while the center has transit, sidewalks, and jobs close together, so more people can walk, bike, or ride.",
b:["sprawl","readtable"],
th:"Describe the relationship? Isn't that just reading numbers off the table?",
co:"Reading the numbers is step one, and you should do it. But a relationship is two things moving together. Say what happens to driving as distance goes up, then quote the proof.",
kq:"As you go from downtown out to the exurbs, what happens to the share of people who drive alone? Use the numbers.",
ml:["Density and the car",["Where homes are packed close together, jobs and shops are nearby and buses and trains fill up, so fewer people need to drive.","Where homes are spread far apart on big lots, there are too few riders for good transit and everything is too far to walk, so almost everyone drives.","Most U.S. suburbs built after 1950 were designed for cars: cul-de-sacs, wide roads, and huge parking lots.","On the AP exam, 'describe the relationship' means say how two things change together and back it up with numbers from the source."],[["Density","How many people or homes are packed into an area."],["Car-dependent","A place where you basically need a car to get anywhere."]]],
wk:["Most people in Brookhaven drive to work alone.","True, but it's one fact about the whole metro. The question asks how the drive-alone share CHANGES with distance: compare the three zones and quote their numbers."],
mw:"It states the direction (farther out = more driving alone), quotes all three numbers, and explains the pattern with density and transit.",
fr:"T1- The farther from the center, the ___ the percent of workers who drive alone. E2- The central city is ___%, the inner suburbs are ___%, and the outer suburbs are ___%. A3- This happens because ___.",
qc:["Which zone of Brookhaven has the LOWEST drive-alone share?",["The central city (55%)","The inner suburbs (78%)","The outer suburbs (90%)"],0,"Downtown has transit, sidewalks, and nearby jobs, so more people ride, walk, or bike."]},

{v:"Explain",
q:"Explain ONE cause of the growth of Brookhaven's outer suburbs shown in the table.",
sk:"Causes of suburbanization",
s:[["Name a cause in general words. What made it possible or attractive to live far from downtown?",["Think transportation, cheap land, government home loans, or families leaving the city for space, schools, or, in U.S. history, white flight.","Cars and highways are the classic answer."]],["Give specific proof or an example.",["The Interstate Highway System (begun 1956) plus widespread car ownership let workers live 20 or 30 miles from their jobs.","FHA and VA mortgages after World War II made new suburban homes cheap to buy."]],["Explain HOW the cause produced the growth in the table.",["Use 'because… so…'.","Cheap land plus highways meant bigger, newer houses at the edge, so population tripled from 95,000 to 300,000."]]],
r:{m:"all",i:[["Names a cause: cars/highways, cheaper land, government mortgage policy (FHA/VA loans), white flight, schools, more space, lower taxes or crime",/highway|interstate|freeway|road|car|automobile|driv|cheap|land|afford|mortgage|loan|fha|gi bill|veteran|white flight|racial|school|crime|space|yard|bigger|larger|new (home|house)|tax|job/i,"Name a cause: highways and cars, cheaper land at the edge, government mortgage loans, or families leaving the city for space or schools."],["Explains how that cause produced growth at the edge (made moving out possible, cheaper, or attractive)",/because|so |allow|let |made it|possible|easier|commut|attract|move|moved|moving|pull|drew|could live|able to/i,"Explain HOW: for example, highways let workers live far from downtown and still commute, so families moved outward."]]},
mo:"T1- One cause of the outer suburbs' growth is the spread of cars and highways. E2- After the Interstate Highway System began in 1956, most families owned a car, so a worker could live 20 or 30 miles from downtown on cheap land and still commute to a job in the city. A3- Because developers could build bigger, newer houses on inexpensive land at the edge and highways made the daily trip possible, families moved outward, and Brookhaven's outer suburbs tripled from 95,000 to 300,000 people while the center lost population.",
b:["sprawl","redlining"],
th:"Is the answer just 'people like suburbs'? That feels too easy.",
co:"Liking suburbs is the result, not the cause. Ask what CHANGED after 1950 that let millions of families live far from downtown: something they drive, something they borrowed money with, or something they were leaving behind.",
kq:"Why did so many people move to the far edge of Brookhaven after 1970? Explain ONE cause and how it led to that growth.",
ml:["Why America suburbanized",["Before cars, cities had to be compact so people could walk or ride streetcars to work.","After World War II, cheap cars, the Interstate Highway System (1956), and FHA and VA government-backed mortgages made it easy to buy a new house far from downtown.","Land at the edge cost less, so builders put up large, low-density subdivisions like Levittown, New York.","Many white families also left central cities as Black families moved in (white flight), and others left for newer schools, lower crime, or lower taxes.","Each of these causes pulled or pushed people outward, which is exactly what Brookhaven's outer-suburb row shows."],[["Interstate Highway System","The U.S. network of freeways begun in 1956."],["FHA loan","A government-backed mortgage that made buying a home cheap after World War II."],["White flight","White families moving from cities to suburbs, especially in the 1950s to 1970s."]]],
wk:["People wanted to live in the suburbs.","That's a wish, not a cause. What made it POSSIBLE to live far from downtown? Name something specific (highways and cars, cheap land, mortgages) and explain how it led people to move."],
mw:"It names a specific cause (cars and highways), gives dated proof (the 1956 Interstate system), and explains the chain all the way to the table's numbers.",
fr:"T1- One cause of the outer suburbs' growth is ___. E2- For example, ___. A3- This led to growth at the edge because ___, so ___.",
qc:["Which of these most directly made it possible for workers to live 25 miles from downtown?",["Cars and interstate highways","Skyscrapers downtown","Rent control laws"],0,"Highways and cars shrank commute times, so homes could spread far from jobs."]},

{v:"Explain",
q:"Explain how the zoning data in the table could contribute to high housing prices in Brookhaven.",
sk:"Zoning and housing supply",
s:[["What does 'single-family only' zoning forbid? Say it in general words.",["It means no apartments, duplexes, or townhouses on that land: only one detached house per lot.","So it limits how many homes can fit."]],["Use the table as proof.",["85% of the outer suburbs' residential land is single-family only; even the metro total is 71%.","Most of the land can hold only a few homes per acre."]],["Connect limited supply to price.",["Supply and demand: fewer homes can be built, but people keep arriving (the metro grew by 145,000), so buyers compete.","Competition for scarce homes bids prices up: $380,000 in the outer suburbs."]]],
r:{m:"all",i:[["Identifies the constraint: single-family-only zoning blocks apartments and denser housing, limiting the number of homes (supply)",/single.?family|only|limit|restrict|ban|prohibit|not allow|no apartment|apartment|duplex|townhouse|dens|supply|fewer (home|house|unit)|less housing|can.t build|cannot build/i,"Say what zoning blocks: single-family-only zoning means no apartments or townhouses, so fewer homes can be built."],["Explains the link to price: limited supply plus demand leads to competition and higher prices",/demand|supply|scarce|short|compet|bid|fewer|less|not enough|can.t|cannot|rise|rising|increas|up|higher|expensive|drive|push/i,"Explain the price link: fewer homes for the same number of buyers means competition, which pushes prices up."]]},
mo:"T1- Single-family-only zoning limits how many homes can be built, which raises prices. E2- In Brookhaven, 85% of the outer suburbs' residential land and 71% of the metro's allows only one detached house per lot, so apartments, duplexes, and townhouses that could fit many more families are illegal on most of the land. A3- Because the metro added about 145,000 people but zoning keeps the supply of homes small, buyers compete for the few houses available and bid prices up, which helps explain the $380,000 median in the outer suburbs.",
b:["zoning","sprawl"],
th:"How can a zoning rule change what a house costs?",
co:"Think of concert tickets. Same number of fans, but the venue is allowed to sell only half as many seats. What happens to the price? Zoning is the rule that sets how many 'seats' (homes) an area can hold.",
kq:"Most of Brookhaven's land allows only single houses, not apartments. How could that rule make homes more expensive?",
ml:["Zoning and the price of a home",["Zoning is the set of local rules that say what can be built on each piece of land.","Single-family-only zoning allows just one detached house per lot: no duplexes, townhouses, or apartment buildings.","That caps the number of homes an area can hold even when many people want to live there.","With supply held down and demand rising, buyers and renters compete, and prices climb. This is why economists talk about a housing shortage.","Some places, including Minneapolis and the state of Oregon, have ended single-family-only zoning so more homes can be built."],[["Zoning","Local laws about what can be built where."],["Housing supply","The number of homes available to buy or rent."],["Exclusionary zoning","Rules that keep lower-income people out of an area by allowing only expensive housing types."]]],
wk:["Rich people live in the outer suburbs, so houses cost more there.","That describes who lives there, not how ZONING works. The question is about the single-family-only percentage: explain how limiting what can be built limits supply and raises prices."],
mw:"It names the constraint (single-family-only zoning limits supply), quotes the table (85%, 71%), and walks through supply, demand, and price.",
fr:"T1- Single-family-only zoning can raise housing prices because it ___. E2- In Brookhaven, ___% of the outer suburbs' land is zoned single-family only, so ___. A3- With fewer homes and more people, ___, which pushes prices ___.",
qc:["Single-family-only zoning means…",["only one detached house is allowed per lot; no apartments or townhouses","only families with children may live there","houses must be sold to one buyer at a time"],0,"It's a rule about building types, and it caps how many homes an area can hold."]},

{v:"Explain",
q:"Explain how the recent growth and high home prices in some of Brookhaven's central-city neighborhoods could be an example of gentrification, including ONE effect on long-time residents.",
sk:"Gentrification and displacement",
s:[["Define gentrification in general words.",["Wealthier, often younger, people move into an older lower-income neighborhood near downtown and renovate it.","Property values and rents rise as a result."]],["Match the definition to the table and the note.",["The central city shrank until 2000 but is growing again, mostly in two renovated districts (Millside and the Canal District) where the median price is $610,000.","Old, cheap housing close to downtown jobs is exactly what attracts gentrifiers."]],["Explain ONE effect on long-time residents.",["Rents and property taxes climb, so lower-income residents, especially renters, can be pushed out (displacement).","Shops and culture change too, so the neighborhood may stop feeling like theirs."]]],
r:{m:"all",i:[["Describes gentrification: wealthier or younger people moving into and renovating older central neighborhoods, raising values",/gentrif|wealth|rich|affluent|higher.?income|young|professional|renovat|invest|fix|upgrad|move (in|back)|moving (in|back)|new (shop|cafe|business|restaurant)|revitaliz|redevelop/i,"Define it: wealthier people move into older, cheaper central neighborhoods and renovate them, so home values jump."],["Gives one effect on long-time residents: displacement, unaffordable rent or taxes, loss of community or culture",/displac|push|forc|move out|moved out|leave|afford|rent|tax|price out|priced out|lose|lost|cultur|community|character|evict|replac/i,"Add the effect: rising rents and property taxes can push out long-time residents (displacement)."]]},
mo:"T1- The comeback of a few central-city neighborhoods looks like gentrification: wealthier newcomers moving into older, lower-income areas near downtown. E2- Brookhaven's central city shrank from 520,000 to 388,000 by 2000, but since 2010 it has grown again mostly in the renovated Millside and Canal districts, where the median home price is $610,000, far above the inner suburbs' $265,000. A3- As investors and young professionals renovate old homes, rents and property taxes rise, so long-time lower-income residents, especially renters, can be displaced because they can no longer afford to stay in their own neighborhood.",
b:["gentri","redlining","urbanmodels"],
th:"Wait, isn't it GOOD that downtown is growing again?",
co:"It's good for some people and hard on others, and the AP exam wants you to see both. Follow the money: who can afford a $610,000 house, and what happens to the renter who was already living there?",
kq:"A few old downtown neighborhoods are suddenly hot and expensive. Explain how that fits gentrification, and name one thing it does to people who already lived there.",
ml:["Gentrification",["Gentrification is when wealthier people move into an older, lower-income neighborhood near downtown, renovate homes, and open new businesses.","Causes: cheap older housing, short commutes to downtown jobs, walkable streets, and young professionals or empty-nesters who want city life.","Effects for the neighborhood: higher property values, new shops, more tax money for the city, and reinvestment in old buildings.","Effects for long-time residents: rents and property taxes rise, so many are displaced (pushed out), and the neighborhood's culture and businesses change.","In the Burgess model this usually happens in the old zone of transition just outside the CBD."],[["Gentrification","Wealthier newcomers transforming a lower-income urban neighborhood."],["Displacement","When rising costs force residents to move away."]]],
wk:["The city is growing again because it is popular now.","'Popular' isn't a process. Say WHO is moving in and WHY (wealthier people buying and renovating cheap old housing near downtown), then give the effect on the people already there."],
mw:"It defines gentrification, anchors it in the note ($610,000 Millside and Canal districts, growth since 2010), and gives a clear effect: displacement by rising rents and taxes.",
fr:"T1- The recent growth in some central-city neighborhoods could be gentrification, which is when ___. E2- In Brookhaven, ___. A3- One effect on long-time residents is ___, because ___.",
qc:["Which is the most common NEGATIVE effect of gentrification on long-time residents?",["Displacement, as rents and property taxes rise","Lower home values","Fewer new restaurants"],0,"Rising costs can push out the lower-income residents who were there first."]},

{v:"Describe",
q:"Describe ONE smart-growth or New Urbanism policy Brookhaven could adopt to reduce sprawl, and how it would work.",
sk:"Smart growth and New Urbanism",
s:[["Name a policy in general words.",["Options: an urban growth boundary or greenbelt, transit-oriented development, mixed-use zoning, or infill building on empty lots.","Pick the one you can explain in two sentences."]],["Describe specifically what it does.",["Transit-oriented development: rezone land within about a half mile of train or bus stations for apartments, shops, and offices.","Real example: Arlington, Virginia built dense housing and offices around its Metro stations."]],["Describe how that reduces sprawl.",["New homes go INSIDE the existing area, near transit, instead of on farmland at the edge.","Tie it to the table: more people could live where the drive-alone share is 55%, not 90%."]]],
r:{m:"all",i:[["Names a smart-growth or New Urbanism policy: urban growth boundary, greenbelt, transit-oriented development, mixed-use zoning, infill or brownfield redevelopment, denser housing, walkable design",/mixed.?use|transit|tod|train|rail|bus|subway|metro|greenbelt|green belt|growth boundary|ugb|boundary|infill|brownfield|dens|walkab|apartment|duplex|townhouse|upzon|rezon|new urbanism|smart growth|compact|bike|sidewalk|zoning/i,"Name a real policy: an urban growth boundary, transit-oriented development, mixed-use zoning, or infill building."],["Describes how it works to reduce sprawl (keeps growth inside, near transit, denser, less driving, protects land at the edge)",/because|so |instead|rather than|limit|stop|prevent|keep|inside|within|closer|near|walk|fewer cars|less driving|reduce|more (home|housing|people)|use land|already|existing|vacant|empty|farmland|protect|edge/i,"Describe HOW: for example, new homes go inside the existing city near transit instead of on farmland at the edge."]]},
mo:"T1- Brookhaven could use transit-oriented development (TOD) to pull growth inward instead of outward. E2- The city would rezone the land within about a half mile of its rail and bus stations for apartments, townhouses, shops, and offices, the way Arlington, Virginia built dense, walkable neighborhoods around its Metro stations. A3- Because thousands of new homes would be built inside the existing metro next to transit, fewer families would need a new house on farmland at the edge, and more workers could live where the drive-alone share is 55% rather than 90%, which reduces sprawl and traffic.",
b:["smartgrowth","zoning"],
th:"Can a city really stop people from moving to the suburbs?",
co:"Not by force, but it can change the choices. Smart growth makes living inside the city easier and nicer (more homes near transit) and makes building at the edge harder (a growth boundary). Describe one tool and how it tilts the choice.",
kq:"Name ONE tool from smart growth or New Urbanism that Brookhaven could use so it stops spreading outward, and describe how it works.",
ml:["The smart-growth toolbox",["Smart growth means planning policies that fight sprawl by making cities compact, walkable, and transit-friendly.","Urban growth boundary: a line around the metro beyond which new subdivisions are not allowed (Portland, Oregon has used one since 1979). A greenbelt is a protected ring of open land that does the same job.","Transit-oriented development: dense housing, shops, and offices within walking distance of a train or bus station.","Mixed-use zoning and infill: allow homes above shops, and build on vacant or former industrial (brownfield) lots inside the city.","New Urbanism is the design movement behind many of these ideas: walkable blocks, mixed uses, and homes near shops, as in Seaside, Florida or Kentlands, Maryland."],[["Urban growth boundary","A legal line that limits how far a city can spread."],["Transit-oriented development","Dense, walkable building clustered around transit stations."],["Infill","Building on empty or underused land inside the existing city."]]],
wk:["Build more roads so people can get to work faster.","More roads is the opposite of smart growth: wider highways make living even farther out easier, which causes MORE sprawl. Pick a policy that keeps growth inside the city."],
mw:"It names a recognized policy (TOD), describes exactly what changes (rezoning near stations) with a real example, and connects it to less sprawl and less driving.",
fr:"T1- One smart-growth policy Brookhaven could use is ___. E2- It works by ___. A3- This reduces sprawl because ___.",
qc:["An urban growth boundary is…",["a line around a metro area beyond which new development is not allowed","a highway loop around a city","the border between a central city and its first suburb"],0,"It's a legal line that keeps growth inside and protects farmland at the edge."]},

{v:"Explain",
q:"Explain ONE limitation of using data for Brookhaven's three large zones, or the metro total, to understand its housing or transportation problems.",
sk:"Data limits: scale of analysis",
s:[["Think about scale. How many people are lumped into each row?",["Each zone holds 300,000 to 445,000 people, and the metro total holds over a million.","A number for a whole zone is an average, and averages hide the differences inside them."]],["Find proof in the table or the note that an average hides something.",["The central city's median price is $395,000, yet the Millside and Canal districts are at $610,000, so other neighborhoods must be far cheaper.","The 55% drive-alone figure mixes transit-rich downtown with car-dependent edges of the city."]],["Explain why that could mislead a planner or reader.",["You can't tell WHERE the affordability or transit problem actually is.","You'd need neighborhood or census-tract data. Also, where the 'city' line is drawn differs from metro to metro."]]],
r:{m:"all",i:[["Names a limitation: large-scale averages hide variation within zones or neighborhoods, or city/suburb boundaries are defined differently, or rent and income data are missing",/scale|average|aggregat|hide|hidden|mask|lump|general|variation|vary|differ|within|inside|neighborhood|district|block|tract|defin|boundar|border|where|miss|doesn.t show|does not show|no data|rent|income|afford/i,"Name the limit: these zones are huge averages that hide differences between neighborhoods (the $610,000 districts vs. cheaper ones)."],["Explains why it misleads or what data would be needed instead",/because|so |mislead|wrong|can.t|cannot|hard to|unclear|miss|would need|need|should|smaller|zip|tract|neighborhood|local|example|look like|seem/i,"Explain the problem: a planner couldn't tell where the real problem is and would need neighborhood-level data."]]},

/* ===== State & helpers ===== */
const app=document.getElementById('app'),sh=document.getElementById('sh');
let S={f:null,fi:0,k:-1,max:0,p:[],nt:[]};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=i=>String.fromCharCode(65+i);
const TEA=[["T1","Topic · your reason in general words","tT","#22e5ff"],["E2","Evidence · the specific proof","tE","#ffd23f"],["A3","Analysis · why it matters","tA","#ff3fa4"]];
const earned=i=>{const p=S.f.p[i],st=S.p[i],c=st.box.filter(Boolean).length;return p.r.m=="any"?c>0:c==p.r.i.length};
const score=()=>S.p.filter(x=>x.done&&x.ok).length;
const chips=a=>a.map(k=>`<button class="bgc" data-a="bg" data-k="${k}">📜 ${esc(BG[k].t)}</button>`).join('');
function start(i){S={f:FRQ[i],fi:i,k:0,max:0,p:FRQ[i].p.map(()=>({st:1,h:{},a:'',ck:0,box:[],done:0,ok:0,c:0,q:null,cf:null})),nt:FRQ[i].nt.map(()=>({o:0,a:''})),bo:null,cb:0};render(1)}
function go(k){S.k=k;S.max=Math.max(S.max,k);render(1)}
function render(top){const y=scrollY;app.innerHTML=S.k<0?home():hdr()+(S.k==0?stimV():S.k>S.f.p.length?doneV():partV(S.k-1));if(top){scrollTo(0,0);const f=app.querySelector('h2[tabindex]')||app.querySelector('h1[tabindex]');f&&f.focus({preventScroll:true})}else scrollTo(0,y)}
/* ===== Views ===== */
function home(){return `<div class="hero"><div class="sub">GeoArcade presents</div><h1>FRQ<br>Tutor</h1><div class="sub">AP Human Geography · free-response training</div>${UNIT?`<div class="sub" style="color:var(--yl)">${UNIT}</div>`:''}<div class="blink">▶ SELECT A CARTRIDGE ◀</div></div>
<div class="carts">${FRQ.map((f,i)=>[f,i]).sort((a,b)=>(b[0].cls||0)-(a[0].cls||0)).map(([f,i])=>`<button class="cart${f.cls?' cls':''}" data-a="start" data-i="${i}"><span class="k">${f.k}</span><h3>${f.t}</h3><span class="d">${f.d}</span><span class="d">${f.u} · ${f.p.length} parts · about ${f.m} min</span><span class="go">PRESS START ▸</span></button>`).join('')}</div>
<div class="panel"><span class="tag px">How it works</span><div class="how"><div>Study the stimulus and jot what you notice.</div><div>Decode the task verb for each part.</div><div>Think it through with step-by-step hints.</div><div>Write, check against the rubric, compare with a model.</div></div></div>
<div class="panel"><span class="tag px">The TEA method</span><p>For every <b>Describe</b> or <b>Explain</b> part, build your answer in three moves:</p>${chips(["frq","tea"])}<div class="tea" style="margin-top:8px"><div><b class="tT">T1-</b><strong>Topic</strong><br>Your reason in general words.</div><div><b class="tE">E2-</b><strong>Evidence</strong><br>The specific proof: a place, number, or example.</div><div><b class="tA">A3-</b><strong>Analysis</strong><br>Why it matters: the “because… which leads to…”.</div></div></div>`}
function hdr(){const n=S.f.p.length,segs=[["👁",0]].concat(S.f.p.map((_,i)=>[L(i),i+1]),[["★",n+1]]);
const cur=S.k==0?"Stimulus":S.k>n?"Results":`Part ${L(S.k-1)} of ${n}`;
return `<div class="top"><button class="brand" data-a="home">◀ Geo<b>Arcade</b> · FRQ Tutor</button><span class="score" aria-live="polite"><span class="sym">★</span> ${score()}/${n}${S.cb>1?` <span class="sym">🔥</span>${S.cb}`:''}</span></div>
<div class="prog" role="navigation" aria-label="Progress">${segs.map(([t,k])=>{const p=k>0&&k<=n?S.p[k-1]:null,c=k==S.k?'cur':p&&p.done?(p.ok?'ok':'no'):k<=S.max?'v':'';return `<button class="seg ${c}" data-a="go" data-k="${k}" ${k==S.k?'aria-current="step"':''} aria-label="${k==0?'Stimulus':k>n?'Results':'Part '+t+(p&&p.done?(p.ok?', point earned':', not yet'):'')}">${k==0||k>n?`<span class="sym">${t}</span>`:t}</button>`}).join('')}</div>
<div class="plabel"><h1 tabindex="-1" style="font:inherit">${esc(S.f.t)}</h1><span>${cur}</span></div><div class="jump">Tap any letter to jump to that part. Go in order or skip around.</div>`}
function stimBox(){return `<div class="stim"><h3>${esc(S.f.st)}</h3>${S.f.stim}</div>`}
function stimV(){const all=S.nt.every(x=>x.o),nx=S.nt.findIndex(x=>!x.o);
return `<div class="panel"><span class="tag px">Step 1 · Look first</span><p>${esc(S.f.intro)} <b>No questions yet.</b> Strong writers look closely first. Answer 3 quick “notice” questions below.</p></div>${stimBox()}
<div class="row" style="margin-top:8px">${chips(S.f.bg)}</div>
<div class="panel"><span class="tag px">What do you notice? · ${Math.min(nx<0?3:nx+1,3)}/3</span>${S.f.nt.map((n,j)=>nx>=0&&j>nx?'':`<div class="notice"><div class="q">${j+1}. ${esc(n[0])}</div><textarea data-in="nt" data-j="${j}" placeholder="Jot your idea (optional)…" aria-label="Your idea">${esc(S.nt[j].a)}</textarea>${S.nt[j].o?`<div class="take">${esc(n[1])}</div>`:`<div class="row" style="margin-top:8px"><button class="btn o" data-a="nt" data-j="${j}">Compare with tutor</button></div>`}</div>`).join('')}
<div class="row"><button class="btn g" data-a="go" data-k="1">Reveal Part A ▸</button>${all?'':'<span class="note">Tip: compare all three notes first. Good writers always look before they write!</span>'}</div></div>`}
const CARDS=[["❓","Ask"],["🔤","Verb"],["📘","Learn"],["🧠","Think"],["✏️","Write"],["✅","Check"]];
const CAL=[["You weren't sure, but you got it! Trust your thinking more.","Smart move noticing you weren't sure. The Fix-it tips show exactly what to add."],["Nice! You know more than you think.","Close! Compare your answer to the model line by line."],["Confident AND correct. That's mastery!","You felt sure, but the rubric wants more. Always check your answer against the rubric before moving on."]];
const YES=["★ Point earned! Your hard thinking paid off.","★ Point earned! That's exactly what AP readers look for.","★ Point earned! You used evidence like a geographer."];
function mcqV(q,pick,rot,act,extra){const o=q[1].map((t,k)=>[t,k]);for(let r=0;r<rot;r++)o.push(o.shift());
return `<div class="mcq"><p class="mq">${esc(q[0])}</p>${o.map(([t,k])=>`<button class="opt ${pick==null?'':k==0?'good':k==pick?'bad':''}" data-a="${act}" data-o="${k}" ${extra} ${pick===0?'disabled':''}>${esc(t)}</button>`).join('')}
${pick==null?'':pick==0?`<p class="fb y" role="status">✔ Right! ${esc(q[3])}</p>`:`<p class="fb n" role="status">Not quite, and that's OK. ${esc(q[3])}</p>`}</div>`}
function partV(i){const P=S.f.p[i],st=S.p[i],V=VERBS[P.v],tea=P.v!="Identify",n=S.f.p.length,c=st.c;
let h=`<details class="peek"><summary>View stimulus</summary><div>${stimBox()}</div></details>
<div class="sub" role="tablist" aria-label="Steps for Part ${L(i)}">${CARDS.map(([ic,t],k)=>`<button class="sb ${k==c?'on':k<c||(k==5&&st.ck)?'dn':''}" data-a="card" data-i="${i}" data-c="${k}" ${k==5&&!st.ck?'disabled':''} ${k==c?'aria-current="step"':''}><span aria-hidden="true">${ic}</span>${t}</button>`).join('')}</div>`;
const nav=(nx,lab)=>`<div class="row">${c>0?`<button class="btn o" data-a="card" data-i="${i}" data-c="${c-1}">◀ Back</button>`:''}<button class="btn c" data-a="card" data-i="${i}" data-c="${nx}">${lab} ▸</button></div>`;
const qline=`<div class="qmini"><span class="px">Part ${L(i)} · ${P.v}</span><h2 tabindex="-1">${esc(P.q)}</h2></div>`;
if(c==0)h+=`<div class="qbox"><span class="px">Part ${L(i)} · ${P.v}</span><h2 tabindex="-1" style="font-size:19px;line-height:1.45">${esc(P.q)}</h2><div class="plain"><b>In plain words:</b> ${esc(P.kq)}</div></div>
<div class="coach"><div class="av" aria-hidden="true">🧭</div><div><p class="kid">“${esc(P.th)}”</p><p><b>Tutor:</b> ${esc(P.co)}</p></div></div>${nav(1,'Got it! What does “'+P.v+'” mean?')}<button class="link" data-a="card" data-i="${i}" data-c="4">Feeling confident? Try it cold first ▸</button>`;
if(c==1)h+=qline+`<div class="panel"><span class="tag px">Decode the verb</span><div class="verb"><span class="vb">${P.v}</span><div><b>${V.d}</b><ul>${V.l.map(x=>`<li>${x}</li>`).join('')}</ul></div></div><div style="margin-top:8px">${chips(tea?['frq','tea']:['frq'])}</div></div>${nav(2,'Learn what I need')}`;
if(c==2)h+=qline+`<div class="panel"><span class="tag px">Learn what you need</span><h3 class="lt">${esc(P.ml[0])}</h3><ul class="les">${P.ml[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
<div class="voc"><span class="px">Key words</span>${P.ml[2].map(v=>`<p><b>${esc(v[0])}:</b> ${esc(v[1])}</p>`).join('')}</div></div>
<div class="panel"><span class="tag px">Quick check</span><p class="note">Pulling an idea out of your memory makes it stick. Give it a try!</p>${mcqV(P.qc,st.q,(i+S.fi)%3,'mcq',`data-i="${i}"`)}</div>
<p class="note">Want the bigger story?</p>${chips(P.b)}${nav(3,'Think it through')}<button class="link" data-a="card" data-i="${i}" data-c="4">Already know this? Skip to writing</button>`;
if(c==3){h+=qline+`<div class="panel"><span class="tag px">Think it through${tea?' with TEA':''}</span>`;
P.s.slice(0,st.st).forEach((s,j)=>{const t=tea?TEA[j]:[j+1,'Step '+(j+1),'','#22e5ff'],shown=s[1].filter((_,m)=>st.h[j+'-'+m]).length;
h+=`<div class="step" style="color:${t[3]}"><div class="badge">${t[0]}</div><div style="color:var(--ink);flex:1"><div class="lb" style="color:${t[3]}">${t[1]}</div><p class="pr">${esc(s[0])}</p>${s[1].slice(0,shown).map(x=>`<div class="hint">${esc(x)}</div>`).join('')}${shown<s[1].length?`<button class="hb" data-a="hint" data-j="${j}" data-m="${shown}">Hint ${shown+1}/${s[1].length}</button>`:''}</div></div>`});
h+=`</div><div class="row"><button class="btn o" data-a="card" data-i="${i}" data-c="2">◀ Back</button>${st.st<P.s.length?`<button class="btn c" data-a="step" data-i="${i}">Next step ▸</button>`:`<button class="btn c" data-a="card" data-i="${i}" data-c="4">Start writing ▸</button>`}</div>${st.st<P.s.length?`<button class="link" data-a="card" data-i="${i}" data-c="4">I'm ready, skip to writing</button>`:''}`}
if(c==4)h+=qline+`<div class="panel"><span class="tag px">Write it</span>${tea?`<div class="teamini">Label it: <b class="tT">T1-</b> your reason · <b class="tE">E2-</b> specific proof · <b class="tA">A3-</b> why it matters</div>`:`<div class="teamini">Identify = a short, specific answer. One phrase is enough.</div>`}
<details class="peek weak"><summary>Don't fall for this weak answer</summary><div><p class="wa">“${esc(P.wk[0])}”</p><p><b>❌ Why it misses:</b> ${esc(P.wk[1])}</p></div></details>
<textarea id="ans" data-in="ans" data-i="${i}" placeholder="${tea?'Write 2–3 sentences…':'Write a short phrase…'}" aria-label="Your answer">${esc(st.a)}</textarea>
<div class="chips"><button class="chip fr" data-a="frame" data-i="${i}">🧩 Stuck? Use a sentence frame</button>${tea?["For example, ","This is because ","which leads to ","As a result, "].map(c=>`<button class="chip" data-a="ins" data-t="${c}">+ ${c.trim()}</button>`).join(''):''}</div>
${st.w?'<p class="fix" role="alert">⚠ You still have blanks (___) to fill in. Replace each one with your own words first!</p>':''}
<div class="conf"><span>How sure are you?</span>${['😬 Not sure','🙂 Kind of','😎 Very'].map((t,k)=>`<button class="cb ${st.cf===k?'on':''}" data-a="cf" data-i="${i}" data-k="${k}" aria-pressed="${st.cf===k}">${t}</button>`).join('')}</div>
<div class="row"><button class="btn o" data-a="card" data-i="${i}" data-c="3">◀ Back</button><button class="btn" data-a="check" data-i="${i}">Check my answer ▸</button></div></div>`;
if(c==5&&st.ck){const ok=earned(i);h+=qline+`<div class="panel"><span class="tag px">Check it</span><p class="note" style="margin:0 0 6px">Your answer:</p><div class="mine">${esc(st.a)}</div>
<p style="margin-top:12px"><b>What earns the point${P.r.m=="any"?' (any ONE of these)':' (you need ALL of these)'}:</b> Tick each one your answer really does.</p>
<ul class="ck">${P.r.i.map((r,j)=>`<li><label><input type="checkbox" data-a="box" data-i="${i}" data-j="${j}" ${st.box[j]?'checked':''}><span>${esc(r[0])}${st.g[j]?'<small>Tutor spotted this; double-check it.</small>':''}${!st.box[j]&&!(P.r.m=="any"&&st.box.some(Boolean))?`<em class="fix">Fix it: ${esc(r[2])}</em>`:''}</span></label></li>`).join('')}</ul>
<p class="note">The tutor guesses from keywords. <b>You</b> make the final call, so be honest!</p>
<div class="model"><span class="px">Model answer</span>${esc(P.mo)}<p class="why"><b>✅ Why it works:</b> ${esc(P.mw)}</p></div>
<div role="status" class="verdict ${ok?'y':'n'}">${ok?YES[i%3]:'Not yet, and “not yet” is how everyone learns. Use the Fix-it tips, then revise.'}${ok&&S.cb>0?`<span class="combo">🔥 ${S.cb+1} in a row!</span>`:''}</div>${st.cf==null?'':`<p class="cal">${CAL[st.cf][ok?0:1]}</p>`}
<div class="row">${ok?'':`<button class="btn o" data-a="rev" data-i="${i}">✎ Revise</button>`}<button class="btn g" data-a="next" data-i="${i}">${i+1<n?`On to Part ${L(i+1)} ▸`:'See results ▸'}</button></div></div>`}
return h}
function bossV(){const B=S.bo;if(!B)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p>3 lightning questions on what you just learned. Quick recall now helps you remember it next week.</p><div class="row"><button class="btn m" data-a="boss">Start Boss Round ▸</button></div></div>`;
if(B.k>=B.l.length)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p class="big" style="font-size:20px">${B.r==B.l.length?'Boss defeated!':'Boss battle over!'}</p><p style="text-align:center">You got <b>${B.r}/${B.l.length}</b> on the first try.${B.r<B.l.length?' Come back tomorrow and replay. Spacing out practice is how memories stick.':''}</p></div>`;
const i=B.l[B.k],q=S.f.p[i].qc;return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round · ${B.k+1}/${B.l.length}</span>${mcqV(q,B.s,(i+B.k+1)%3,'bq','')}${B.s===0||B.s>0?`<div class="row"><button class="btn m" data-a="bn">${B.k+1<B.l.length?'Next ▸':'Finish ▸'}</button></div>`:''}</div>`}
function doneV(){const n=S.f.p.length,sc=score(),ps=S.f.p.map((p,i)=>[p,i,S.p[i]]),ok=ps.filter(x=>x[2].ok),no=ps.filter(x=>x[2].done&&!x[2].ok),un=ps.filter(x=>!x[2].done);
const rank=sc==n?"GEO LEGEND":sc>=5?"MAP MASTER":sc>=3?"RISING SCOUT":"KEEP PLAYING";
return `<div class="panel" style="text-align:center"><h2 class="big" tabindex="-1">${un.length?'Progress report':'Stage clear!'}</h2><div class="stars" aria-label="${sc} of ${n}">${'★'.repeat(sc)}<span style="opacity:.25">${'★'.repeat(n-sc)}</span></div><div class="rank">${sc}/${n} points · Rank: ${rank}</div></div>

${un.length?`<div class="panel"><span class="tag px" style="color:var(--yl)">Not tried yet</span><ul class="res">${un.map(([p,i])=>`<li><b style="color:var(--yl)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br><button class="link" data-a="go" data-k="${i+1}">Go to Part ${L(i)}</button></li>`).join('')}</ul></div>`:''}
${no.length?`<div class="row"><button class="btn c" data-a="retry">↻ Retry what I missed ▸</button></div>`:''}${bossV()}<div class="row"><button class="btn" data-a="start" data-i="${S.fi}">↻ Replay</button>${FRQ.length>1?`<button class="btn m" data-a="start" data-i="${(S.fi+1)%FRQ.length}">Try “${esc(FRQ[(S.fi+1)%FRQ.length].t)}” ▸</button>`:''}<button class="btn o" data-a="home">Menu</button></div>`}
/* ===== Events ===== */
let opener;function openBG(k){opener=document.activeElement;app.setAttribute('aria-hidden','true');document.getElementById('shT').textContent=BG[k].t;document.getElementById('shB').innerHTML=BG[k].s.map(x=>`<li>${esc(x)}</li>`).join('');sh.classList.add('on');sh.querySelector('[data-a=x]').focus()}
function closeBG(){if(!sh.classList.contains('on'))return;sh.classList.remove('on');app.removeAttribute('aria-hidden');opener&&opener.focus()}
document.addEventListener('click',e=>{if(e.target==sh)return closeBG();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);
case 'home':S.k=-1;return render(1);
case 'go':return go(+b.dataset.k);
case 'bg':return openBG(b.dataset.k);
case 'x':return closeBG();
case 'nt':S.nt[j].o=1;return render();
case 'hint':{const k=S.k-1;S.p[k].h[j+'-'+b.dataset.m]=1;return render()}
case 'step':S.p[i].st++;return render();
case 'card':S.p[i].c=+b.dataset.c;return render(1);
case 'mcq':S.p[i].q=+b.dataset.o;return render();
case 'boss':{const f=S.p.map((x,k)=>k),miss=f.filter(k=>!S.p[k].ok),rest=f.filter(k=>S.p[k].ok);S.bo={l:miss.concat(rest).slice(0,3),k:0,s:null,r:0};return render()}
case 'bq':{const B=S.bo;if(B.s==null&&+b.dataset.o==0)B.r++;if(B.s!==0)B.s=+b.dataset.o;return render()}
case 'bn':S.bo.k++;S.bo.s=null;return render();
case 'frame':{const t=document.getElementById('ans'),f=S.f.p[i].fr;t.value=t.value.trim()?t.value.trim()+'\n'+f:f;S.p[i].a=t.value;t.focus();const c=t.value.indexOf('___',t.value.length-f.length);if(c>=0)t.setSelectionRange(c,c+3);return}
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.includes('___')){st.w=1;render();return document.getElementById('ans').focus()}st.w=0;if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.c=5;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render(1)}
case 'rev':S.p[i].ck=0;S.p[i].done=0;S.p[i].c=4;render(1);return document.getElementById('ans').focus();
case 'next':{const w=S.p[i].done;S.p[i].done=1;S.p[i].ok=earned(i);if(!w)S.cb=S.p[i].ok?S.cb+1:0;return go(i+2)}
case 'cf':S.p[i].cf=+b.dataset.k;return render();
case 'retry':{const m=S.p.findIndex(x=>x.done&&!x.ok);S.p[m].c=4;S.p[m].ck=0;S.p[m].done=0;return go(m+1)}
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeBG();else if(e.key=='Tab'&&sh.classList.contains('on')){e.preventDefault();sh.querySelector('[data-a=x]').focus()}});
render(1);
</script>
