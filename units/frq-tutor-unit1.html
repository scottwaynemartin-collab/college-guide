<body>
<main id="app"></main>
<div id="zm" role="dialog" aria-modal="true" aria-label="Zoomed map"><div class="zt"><span>Pinch or scroll to explore</span><button class="btn c" data-a="zx">Close ✕</button></div><div class="zb" id="zb"></div></div>
<div id="sh" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="card"><div class="k">📜 Need the background?</div><h3 id="shT"></h3><ol id="shB"></ol><div class="row"><button class="btn c" data-a="x">Got it ▸</button></div></div></div>
<script>
const BG={
frq:{t:"How AP FRQs are scored",s:["Each part (A, B, C…) is worth 1 point and is scored on its own. A mistake in Part B can't cost you Part C.","Readers look for the right idea, clearly linked to the question. Fancy writing earns nothing extra.","No thesis, intro, or conclusion needed. Label each part and answer it directly.","Write in complete sentences and do what the task verb asks (Identify, Define, Describe, Explain, Compare, or Explain the degree).","Never leave a part blank. A wrong answer costs nothing."]},
tea:{t:"The TEA method",s:["T1- Topic: your reason in general words. Turn the question into your claim.","E2- Evidence: the specific proof, like a place, number, or example, ideally from the map or table.","A3- Analysis: why it matters. Explain HOW or WHY your proof backs up your reason, using “because…” or “which leads to…”.","Label each piece T1-, E2-, A3- so the reader can find every point. Describe answers need T1 and E2 plus a short A3. Explain answers need a strong A3."]},
readmap:{t:"How to read a map",s:["Read the title first. It tells you the topic, place, and time.","Check the legend so you know what each color and symbol means.","Look for patterns: what's clustered, what's connected, what points where?","Then ask WHY: who made this, and what story is it telling?"]},
readtable:{t:"How to read a data table",s:["Read the title and every column header, including units (%, per 1,000).","Find the highest and lowest value in each column.","Compare columns: when one goes up, does another go up or down?","When there are two years, look for change over time."]},
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]}
};
const VERBS={
Identify:{d:"Name it. One short, specific answer is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","Write it as one short, complete sentence."]},
Describe:{d:"Paint the picture. Give the specific characteristics or pattern, with details someone could check.",l:["Use evidence: a place, a number, or a feature from the stimulus.","Say what it IS or what it LOOKS LIKE. You don't need a deep “why.”","About 1–2 sentences. Use TEA: Topic + Evidence, then a quick Analysis."]},
Explain:{d:"Tell HOW or WHY. Connect a cause to an effect so a reader sees the reasoning, not just a fact.",l:["Use linking words: “because…”, “which leads to…”, “as a result…”.","A fact alone won't score. You need the chain of reasoning.","About 2–3 sentences. Use full TEA."]},
Define:{d:"Give the meaning. Say what the term is in your own words, clearly enough that someone who never heard it would get it.",l:["Use a full sentence: “[Term] is…”","Don't just give an example. The meaning comes first; an example can back it up.","One or two sentences."]},
"Explain the degree":{d:"Say HOW MUCH something is true, then prove it. Pick a level (a great degree, a moderate degree, or a small degree) and explain why it's that much and not more or less.",l:["Start with your level: “Colonization affected ___ to a great degree because…”","Give evidence for your level AND a reason it isn't total (or isn't zero).","About 2–3 sentences. T1- states the degree, E2- proves it, A3- explains why it's that much."]},

addBG({
choropleth:{t:"Types of thematic maps",s:["A thematic map shows one topic (a theme), like income or internet access, instead of just roads and borders.","A choropleth map shades whole areas, like counties or countries, by class: darker or hotter colors usually mean higher values. It works best with rates and percents.","A dot density map places one dot for every set number of things (say, 500 households), so you see counts and where they cluster inside an area.","A graduated (proportional) symbol map puts a circle on each place and makes the circle bigger when the number is bigger.","An isoline map connects points of equal value (like elevation or temperature), and a cartogram stretches or shrinks places by a data value instead of land area."]},
scaleshift:{t:"Why patterns change with scale",s:["Scale of analysis is the size of the units you look at: one country, 50 states, 3,000 counties, or individual neighborhoods.","When data for many places are rolled into one bigger unit, the values get averaged, and places with lots of people pull the average toward their number.","That is why a state can look 'fine' at 18% while some of its counties are over 40%: the crowded metro counties with low rates outweigh the thinly populated rural ones.","Zooming in to a smaller unit reveals clusters, gaps, and outliers that the bigger unit hides. Zooming out smooths them away.","On the AP exam, always ask: at what scale is this data, and what could be hiding inside each unit?"]},
distdecay:{t:"Distance decay & population density",s:["Distance decay is the idea that interaction between places drops off as the distance between them grows. Farther away usually means fewer connections and fewer services.","Population density is the number of people per unit of land. Rural counties have low density: homes are spread far apart.","Networks like roads, water pipes, and fiber-optic internet cost money per mile. In a dense city one mile of cable can serve hundreds of homes; in a rural county it may serve five.","Because companies earn less per mile in low-density places, they build there last or not at all, which leaves rural areas with weaker service.","Lower average incomes in many rural areas can add to the problem, since fewer households can afford a monthly plan even where service exists."]},
gis:{t:"GIS, GPS & remote sensing",s:["GIS (geographic information system) is computer software that stores map data in layers, like clear sheets stacked on a light table, so you can combine and analyze them.","A city might stack layers for roads, population density, income, flood zones, and existing utilities, then ask the software to find spots where several conditions overlap.","GPS (global positioning system) uses satellites to give the exact location of a device. It collects points; GIS analyzes them.","Remote sensing collects information about Earth's surface from a distance, usually from satellites or aircraft, like images of crops, forests, or city growth.","Governments use these tools to plan services and respond to disasters; businesses use them to choose store locations and plan delivery routes."]},
tsc:{t:"Time-space compression",s:["Time-space compression is the idea that new transportation and communication technology shrinks the time it takes to connect distant places, so the world feels smaller.","The telegraph, jet planes, and the internet each made far-away places easier and faster to reach.","It does not shrink actual distance; it reduces the 'friction' of distance. Geographers call this a change in relative distance between places.","Places with weak connections, like rural areas without broadband, are left out of this shrinking world, which is a form of spatial inequality.","Better connections can let people in remote places reach jobs, doctors, and schools without moving, but they can also pull local shoppers toward big online companies."]},
regions:{t:"Three types of regions",s:["A region is an area that shares one or more features. Geographers sort regions into three kinds.","A formal (uniform) region has an official boundary or a shared measurable trait everywhere inside it, like a county, a state, or the French-speaking part of Canada.","A functional (nodal) region is organized around a center, or node, like a metro area tied to its downtown, a pizza delivery zone, or the area a radio station reaches.","A perceptual (vernacular) region exists in people's minds and has fuzzy borders, like 'the South' or 'upstate.'","On the Calderon map, each county is a formal region, while the capital and the suburbs it serves form a functional region."]}
});

d:"Scale of analysis, choropleth maps, and the rural internet gap.",

st:"Percent of Households Without Home Internet, State of Calderon (fictional), 2020: State Scale vs. County Scale",
intro:"Both maps show the same variable for the same fictional state in the same year. The left panel reports one value for the whole state. The right panel divides Calderon into its 12 counties. The capital, Calder City, is marked with a star.",
stim:"<svg viewBox=\"0 0 400 212\" role=\"img\" aria-label=\"Two side-by-side maps of the fictional state of Calderon showing the percent of households without home internet in 2020. Left panel, state scale: the whole state is one rectangle shaded in the 11 to 20 percent class and labeled 18 percent. Right panel, county scale: the same state divided into a grid of 12 counties, 4 across and 3 down, shaded in four classes. Top row: Northfork 41, Pine Ridge 38, Harlow 27, Ashby 33. Middle row: Dry Creek 44, Verano 19, Calder City 6 (the capital, marked with a star), Eastgate 15. Bottom row: Sorrel 24, Lowland 29, Westbrook 9, Millbrook 10. The lowest counties cluster around the capital toward the lower right; the highest are along the western and northern edges. Legend: green 0 to 10 percent, yellow 11 to 20, orange 21 to 30, pink 31 to 45.\">\n<rect width=\"400\" height=\"212\" fill=\"#0a1d3a\"/>\n<g font-family=\"Chakra Petch,sans-serif\" font-weight=\"700\" font-size=\"9\" fill=\"#22e5ff\"><text x=\"14\" y=\"14\">STATE SCALE · 1 UNIT</text><text x=\"212\" y=\"14\">COUNTY SCALE · 12 UNITS</text></g>\n<rect x=\"14\" y=\"24\" width=\"172\" height=\"165\" fill=\"#ffd23f\" stroke=\"#7fe8ff\" stroke-width=\"1.5\"/>\n<g font-family=\"Chakra Petch,sans-serif\" text-anchor=\"middle\" fill=\"#0a1d3a\"><text x=\"100\" y=\"90\" font-size=\"13\" font-weight=\"700\">CALDERON</text><text x=\"100\" y=\"126\" font-size=\"30\" font-weight=\"700\">18%</text><text x=\"100\" y=\"142\" font-size=\"7.5\">of households without home internet</text></g>\n<text x=\"199\" y=\"112\" font-family=\"Chakra Petch,sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#22e5ff\" text-anchor=\"middle\">→</text>\n<g stroke=\"#0a1d3a\" stroke-width=\"1.2\">\n<rect x=\"212\" y=\"24\" width=\"43\" height=\"55\" fill=\"#ff3fa4\"/><rect x=\"255\" y=\"24\" width=\"43\" height=\"55\" fill=\"#ff3fa4\"/><rect x=\"298\" y=\"24\" width=\"43\" height=\"55\" fill=\"#ff8a3d\"/><rect x=\"341\" y=\"24\" width=\"43\" height=\"55\" fill=\"#ff3fa4\"/>\n<rect x=\"212\" y=\"79\" width=\"43\" height=\"55\" fill=\"#ff3fa4\"/><rect x=\"255\" y=\"79\" width=\"43\" height=\"55\" fill=\"#ffd23f\"/><rect x=\"298\" y=\"79\" width=\"43\" height=\"55\" fill=\"#3ddc84\"/><rect x=\"341\" y=\"79\" width=\"43\" height=\"55\" fill=\"#ffd23f\"/>\n<rect x=\"212\" y=\"134\" width=\"43\" height=\"55\" fill=\"#ff8a3d\"/><rect x=\"255\" y=\"134\" width=\"43\" height=\"55\" fill=\"#ff8a3d\"/><rect x=\"298\" y=\"134\" width=\"43\" height=\"55\" fill=\"#3ddc84\"/><rect x=\"341\" y=\"134\" width=\"43\" height=\"55\" fill=\"#3ddc84\"/>\n</g>\n<rect x=\"212\" y=\"24\" width=\"172\" height=\"165\" fill=\"none\" stroke=\"#7fe8ff\" stroke-width=\"1.5\"/>\n<g font-family=\"Chakra Petch,sans-serif\" text-anchor=\"middle\" fill=\"#0a1d3a\" font-size=\"6.5\">\n<text x=\"233.5\" y=\"44\">Northfork</text><text x=\"276.5\" y=\"44\">Pine Ridge</text><text x=\"319.5\" y=\"44\">Harlow</text><text x=\"362.5\" y=\"44\">Ashby</text>\n<text x=\"233.5\" y=\"99\">Dry Creek</text><text x=\"276.5\" y=\"99\">Verano</text><text x=\"319.5\" y=\"99\">Calder City</text><text x=\"362.5\" y=\"99\">Eastgate</text>\n<text x=\"233.5\" y=\"154\">Sorrel</text><text x=\"276.5\" y=\"154\">Lowland</text><text x=\"319.5\" y=\"154\">Westbrook</text><text x=\"362.5\" y=\"154\">Millbrook</text>\n<g font-size=\"11\" font-weight=\"700\"><text x=\"233.5\" y=\"62\">41%</text><text x=\"276.5\" y=\"62\">38%</text><text x=\"319.5\" y=\"62\">27%</text><text x=\"362.5\" y=\"62\">33%</text>\n<text x=\"233.5\" y=\"117\">44%</text><text x=\"276.5\" y=\"117\">19%</text><text x=\"319.5\" y=\"117\">6%</text><text x=\"362.5\" y=\"117\">15%</text>\n<text x=\"233.5\" y=\"172\">24%</text><text x=\"276.5\" y=\"172\">29%</text><text x=\"319.5\" y=\"172\">9%</text><text x=\"362.5\" y=\"172\">10%</text></g>\n<text x=\"319.5\" y=\"131\" font-size=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\".6\">★</text>\n</g>\n<g font-family=\"Chakra Petch,sans-serif\" font-size=\"8\" fill=\"#ffe7a6\" text-anchor=\"middle\"><text x=\"100\" y=\"204\">One number for the whole state</text><text x=\"298\" y=\"204\">Same data, same year, 12 counties</text></g>\n</svg><div class=\"legend\"><span><i style=\"background:#3ddc84\"></i>0–10%</span><span><i style=\"background:#ffd23f\"></i>11–20%</span><span><i style=\"background:#ff8a3d\"></i>21–30%</span><span><i style=\"background:#ff3fa4\"></i>31–45%</span><span>★ State capital (Calder City)</span></div><p class=\"src\">Data and places are invented for practice. The state figure is a population-weighted average: most of Calderon's people live in the metro counties around Calder City, so those low rates pull the state number down. Shapes simplified, not to scale.</p>",
bg:["choropleth","scaleshift","readmap"],
nt:[["Both panels show the SAME state, the SAME year, and the SAME variable. What's the only thing that changed?","The scale of analysis. The left panel treats Calderon as one unit (18%). The right panel splits it into 12 counties. Nothing about the real households changed, only how finely we are looking."],["Find the lowest and highest counties on the right. Where are they on the map?","Calder City (6%), the capital with the star, is lowest, and its neighbors Westbrook (9%) and Millbrook (10%) are also green. The highest, Dry Creek (44%) and Northfork (41%), sit on the far western edge, about as far from the capital as you can get."],["Is 18% a 'middle' number for these counties? Count how many counties are above it and how many are below.","Only 4 counties are at or below 18% and 8 are above it, yet the state figure is 18%. That's because most of Calderon's people live in the low-rate metro counties, so they pull the average down. A state number is a population-weighted average, not a typical county."]],
m:20,
p:[
{v:"Identify",
q:"Identify the type of thematic map used in the county-scale panel of the stimulus.",
sk:"Identifying map types",
s:[["Look at HOW the data are shown. Are the counties shaded, dotted, or marked with circles of different sizes?",["Each whole county is filled with one color.","The legend groups the percents into classes (0–10%, 11–20%, and so on)."]],["Match that style to its name.",["Areas shaded by class = the most common thematic map on the AP exam.","It starts with 'choro-' (from the Greek word for 'area')."]]],
r:{m:"any",i:[["Names it: a choropleth map",/ch?l?oro?pleth|shaded|colou?r.?coded|color.?shaded/i,"Name it: this is a choropleth map (areas shaded by value)."],["Describes the method: areas shaded or colored by data class",/shad|colou?r|fill|class|categor|range|interval/i,"Say how it works: each county is shaded a color based on its data class."]]},
mo:"It is a choropleth map: each county is shaded one color based on which percent class it falls in.",
b:["choropleth","readmap"],
th:"Isn't it just... a map with colors?",
co:"Yes, and that's the answer hiding in plain sight! Maps that color whole areas by their data have a specific name. Check the mini-lesson if it's not coming to you.",
kq:"What kind of map is the county map on the right? Name the type.",
ml:["Spotting a choropleth",["A choropleth map fills in whole areas (countries, states, counties) with a color based on their data value.","The values are grouped into classes, and the legend tells you which color means which range.","It's great for rates and percents, like percent without internet, because it compares places fairly regardless of their size.","Its weakness: a whole county gets one color, even if conditions vary a lot inside it."],[["Thematic map","A map about one topic, like income or internet access."],["Choropleth map","Areas shaded by data class."],["Class","A range of values that share one color on the legend."]]],
wk:["It is a political map of Calderon's counties.","A political map shows borders and names, not data. This map colors each county by a percent, which makes it a thematic map with a specific name."],
mw:"It names the map type precisely and adds a quick phrase showing it knows how the map works.",
fr:"The county-scale map is a ___ map because each county is ___ based on its ___.",
qc:["Which map type shades whole areas by data class?",["Choropleth","Dot density","Graduated symbol"],0,"Choropleth maps color areas by value class. Dot density uses dots; graduated symbols use sized circles."]},
{v:"Describe",
q:"Using the map, describe how the pattern of households without home internet changes between the state scale and the county scale.",
sk:"Comparing patterns across scales",
s:[["Start with the state scale. What does the left panel actually tell you about WHERE the problem is?",["One shape, one color, one number.","At this scale there is no pattern to see: the whole state is 18%."]],["Now the county scale. Pull specific numbers and places from the right panel.",["Find the lowest counties (green) and the highest (pink). Where is each group?","Calder City 6% and Westbrook 9% near the capital; Dry Creek 44% and Northfork 41% on the western edge."]],["Say what the zoom-in reveals that the zoom-out hid.",["Words like 'clustered,' 'range,' and 'hidden' are your friends.","The pattern goes from uniform to a clear high-rural, low-metro cluster."]]],
r:{m:"all",i:[["Describes the state scale as one value or one shade (18%) for the whole state",/18|one (value|number|colou?r|shade|percent)|single|uniform|whole state|entire state|all the same|same everywhere|average|overall|no pattern/i,"Start with the state scale: the whole state is one shade, 18%, so there is no pattern to see."],["Describes the county-scale pattern with evidence: a wide range (6% to 44%), low near the capital or metro, high in rural or edge counties",/\b(?!18\b)\d{1,2} ?(%|per ?cent)|rang(e|es|ing)\b|var(y|ies|iation)|rural|edge|outer|outskirt|border|remote|corner|northfork|pine ridge|harlow|ashby|dry creek|verano|calder city|eastgate|sorrel|lowland|westbrook|millbrook|\b(west|north|east|south)(ern|west|east)?\b|cluster|concentrat|(near|around|close to|next to|by) (the )?(capital|calder|city|metro|center|centre)/i,"Add county evidence: it ranges from 6% in Calder City to 44% in Dry Creek, with high counties clustered on the rural edges."]]},
mo:"T1- At the state scale there is no pattern to see, because the whole state is one shade with a single value of 18%. E2- At the county scale the same data range from 6% in Calder City and 9% in Westbrook, clustered around the capital, up to 41% in Northfork and 44% in Dry Creek along the western and northern edges. A3- Zooming in reveals a clustered pattern of rural counties where more than a third of households lack internet, which the single state number completely hides.",
b:["scaleshift","scale","regions"],
th:"It's the same state. How can the pattern 'change' if nothing changed?",
co:"Great catch, and that's the whole point of the question. The households didn't change. What changed is how finely we are looking. Describe what you can see in each panel and what one panel shows that the other can't.",
kq:"Compare the two panels. What does the state-scale map show about internet access, and what different story does the county-scale map tell? Use numbers.",
ml:["Reading a pattern at two scales",["Scale of analysis is the size of the units the data are divided into. Here: 1 state vs. 12 counties.","At the bigger unit, everything is averaged into one number, so you can't see a pattern at all.","At the smaller unit, you can describe the pattern: clustered (grouped together) or dispersed (spread out), and which places are high or low.","A good description names the range (lowest to highest), where the highs and lows sit, and what word fits the arrangement, like 'clustered around the capital.'"],[["Scale of analysis","The size of the units you study: national, state, county, local."],["Clustered","Grouped close together."],["Dispersed","Spread out evenly."]]],
wk:["At the county scale there are more colors and more details.","That's about the picture, not the pattern. A describe answer needs the actual values (18% vs. 6% to 44%) and WHERE the high and low counties are."],
mw:"It describes the state scale (one value, 18%), gives specific county evidence with places and numbers, and names what the zoom-in reveals (a rural cluster the state figure hides).",
fr:"T1- At the state scale the map shows ___, so ___. E2- At the county scale the values range from ___% in ___ to ___% in ___, with the high counties located ___. A3- Zooming in reveals ___ that the state number hides.",
qc:["A pattern that looks uniform at the state scale but clustered at the county scale is an example of…",["how scale of analysis changes what you see","map projection distortion","a perceptual region"],0,"Changing the size of the units (the scale of analysis) can reveal or hide patterns."]},
{v:"Explain",
q:"Explain ONE reason rural counties in Calderon have higher rates of households without home internet than the counties around the capital.",
sk:"Explaining a rural–urban gap",
s:[["Name the reason in general words. What's different about living in a rural county?",["Think about how far apart homes are, or how much money people make.","Low population density makes internet infrastructure expensive per home."]],["Give specific proof, with a county and a number from the map.",["Dry Creek is 44%; Calder City is 6%.","In a rural county, one mile of fiber-optic cable might pass five homes instead of five hundred."]],["Explain the chain: why does that lead to more homes without internet?",["Use 'because… so…'.","Companies earn less per mile in rural areas, so they build there last or not at all."]]],
r:{m:"all",i:[["Names a reason: low population density / homes spread far apart, high cost of infrastructure per customer, distance from the city, or lower incomes",/densit|spread|dispers|far apart|remote|distance|far (from|away)|sparse|few(er)? (people|homes|houses|households|customers)|cost|expensive|infrastructure|cable|fiber|fibre|tower|wire|line|income|poor|afford|profit/i,"Name the reason: rural homes are spread far apart, so building internet lines costs more per customer (or incomes are lower)."],["Explains the cause-and-effect chain to the higher rate",/(don.t|do not|won.t|will not|wouldn.t|doesn.t|does not|can.t|cannot|not|never|less likely to|unlikely to) (even )?(want to |bother |be able to )?(build|bother|invest|run|lay|extend|reach|expand|serve|offer|provide|connect|install|put|afford|pay|sign up|get|buy|make (a |any |much )?(profit|money))|not worth|unprofitable|not profitable|(less|little|no|low) profit|lose money|per (person|home|house|household|customer|mile|user)|skip|ignore|go without|left without|(more|too|very|so|really) expensive|expensive (to|for)|cost(s|ing)? (more|too much|a lot)|(high|higher|extra) cost|fewer (connections|customers|subscribers|providers)|leads? to|result(s|ing)? in/i,"Add the chain with 'because' or 'so': companies earn less per mile, so they skip rural areas and the rate stays high."]]},
mo:"T1- Rural counties have higher rates of households without internet because their low population density makes internet infrastructure very expensive per customer. E2- In Dry Creek (44%) homes are spread miles apart, so a company must lay far more fiber-optic cable to reach each household than it does in dense Calder City (6%), where one line serves hundreds of homes. A3- Because the company earns less for every mile of cable in a rural county, it builds there last or not at all, so many rural households are left without service and the rate stays high.",
b:["distdecay"],
th:"Can't rural people just buy internet like everyone else?",
co:"Only if a company has run a line to their house, and that's the catch. Think about what it costs to reach a house that's three miles from its nearest neighbor. The mini-lesson walks through it.",
kq:"Why would a county far from the city have a lot more homes without internet? Pick ONE reason and explain how it causes the gap.",
ml:["Density, distance, and the cost of a connection",["Population density is the number of people per unit of land area, for example per square mile. Rural counties have low density: homes sit far apart.","Internet service needs physical infrastructure, like fiber-optic cable or cell towers, and it costs money for every mile built.","In a dense city, one mile of cable can serve hundreds of paying customers. In a rural county it might serve five, so the company earns far less per mile.","Companies build where they make money first, so rural areas get service later, slower, or never. Distance decay plays a role too: places far from the metro interact with it less and get new services later.","Lower rural incomes can add to it: even where service exists, fewer families can afford it."],[["Population density","People per unit of land."],["Infrastructure","The physical systems a place needs, like roads, pipes, and cables."],["Distance decay","Interaction weakens as distance grows."]]],
wk:["Rural counties don't have internet because they are in the country.","That restates the question: 'rural' and 'in the country' mean the same thing. You need the reason (homes far apart, costly cable) and the chain that leads to fewer connections."],
mw:"It names the reason (low density, high cost per customer), proves it with map numbers (Dry Creek 44% vs. Calder City 6%), and explains the chain that leaves rural homes unconnected.",
fr:"T1- Rural counties have higher rates because ___. E2- For example, in ___ (___%) homes are ___, so a company must ___. A3- Because ___, companies ___, which leaves ___.",
qc:["Why does one mile of internet cable cost MORE per customer in a rural county?",["Fewer homes are spread along that mile","Rural land is more expensive","Cable is more expensive in the countryside"],0,"Low population density means each mile of cable reaches fewer paying customers."]},
{v:"Explain",
q:"Using the map, explain ONE limitation of using only the state-level data to make decisions about improving internet access in Calderon.",
sk:"Data limits: scale and averages",
s:[["What does the state number hide? Think about what you can't see at the state scale.",["One number for 12 very different counties.","An average smooths over the places that are doing badly."]],["Prove it with the map. Compare 18% to specific counties.",["Dry Creek is 44%, Northfork is 41%, but Calder City is 6%.","Eight of the 12 counties are above the state figure."]],["Why would that lead to a bad decision?",["Who gets the money, and where does it get built?","Planners might spread funds evenly or underestimate the need, missing the rural counties that need help most."]]],
r:{m:"all",i:[["States the limitation: one state value is an average that hides or masks differences between counties",/hide|hidden|mask|miss|average|generaliz|overlook|ignore|can.t (see|tell)|cannot (see|tell)|doesn.t show|does not show|not show|lose|one (value|number)|single|assum|same everywhere|everyone|uniform|vari|differ/i,"Name the limit: 18% is an average that hides the big differences between counties."],["Uses map evidence and explains the effect on a decision (wrong places, spread too thin, underestimating need)",/\b(44|41|38|33|29|27|24|19|15|10|9|6)\b|dry creek|northfork|pine ridge|harlow|ashby|verano|calder city|eastgate|sorrel|lowland|westbrook|millbrook|decision|decide|money|fund|spend|build|invest|target|priorit|focus|resource|budget|plan|polic|program|waste|wrong|need|underestimat|overestimat/i,"Use the map and the decision: Dry Creek is 44% while the state is 18%, so money could go to the wrong places or the need could be underestimated."]]},
mo:"T1- One limitation is that a single state-level number is an average that hides the differences inside the state, so planners can't see where the problem actually is. E2- The map shows Calderon at 18%, but at the county scale Dry Creek is 44% and Northfork is 41% while Calder City is only 6%, and eight of the 12 counties are above the state figure. A3- Because the 18% figure makes the whole state look moderately connected, a government using it alone might spread money evenly or underestimate the need, instead of targeting counties like Dry Creek and Northfork, where more than 40% of households lack internet.",
b:["scaleshift","scale"],
th:"But 18% is the real number. How can a true number be a limitation?",
co:"It IS true, and it's still a problem. A true average can hide true extremes. Nobody in Calderon actually lives in an '18% county.' Compare that number to the counties and you'll see what gets lost.",
kq:"If the governor only looked at the left panel (18%), what important thing would they miss, and how could that lead to a bad decision? Use numbers from the map.",
ml:["How averages hide the extremes",["A state-level figure is a population-weighted average: counties with more people count more, so the crowded metro counties pull Calderon down to 18%.","Eight of the 12 counties are above 18%, and two are above 40%. The average doesn't describe any real county well.","If leaders only see 18%, they may think the problem is mild or spread money evenly, when it's concentrated in rural counties.","A good limitation answer names what's hidden, proves it with a number from the map, and says what bad decision could follow.","This is a scale problem: data reported for a whole state can't guide decisions that have to be made county by county."],[["Average","A single number that summarizes many values, and can hide the extremes."],["Limitation","Something a source can't show that you'd need to answer the question."],["Scale of analysis","The size of the units in the data."]]],
wk:["The state data is a limitation because it is from 2020 and might be out of date.","The question asks about using STATE-LEVEL data, so the limitation should be about scale, not the year. Compare 18% to the county values and explain what gets hidden."],
mw:"It names what's hidden (county differences), proves it with map numbers (18% vs. 44% and 6%), and explains the decision that could go wrong.",
fr:"T1- One limitation is that the state figure of ___% is an average that hides ___. E2- For example, the map shows ___ at ___% while ___ is only ___%. A3- Because of this, a government using the state number alone might ___, instead of ___.",
qc:["Why is Calderon's state figure (18%) lower than most of its counties?",["Most people live in the low-rate metro counties, which pull the average down","Rural counties were left out of the state count","The state used a different year than the counties"],0,"A state value is weighted by population, so the crowded metro counties dominate it."]},
{v:"Explain",
q:"Explain how a state government agency could use a geographic information system (GIS) to decide where to build new broadband internet infrastructure.",
sk:"Applying geospatial technology",
s:[["What does GIS actually DO? Hint: think of clear sheets stacked on top of each other.",["GIS stores different kinds of map data as layers that can be combined.","It's software for analyzing where things are, not just a GPS dot."]],["Name two or three specific layers the agency would stack.",["This county map (percent without internet) is one layer.","Others: existing fiber lines, population density, income, school and clinic locations."]],["Explain how the overlap leads to a decision.",["Where several layers line up (high need + no fiber + a school), that's a priority.","Use 'so' or 'which lets them…' to reach the decision."]]],
r:{m:"all",i:[["Describes what GIS does: layers, overlays, or combines different spatial data sets to analyze them",/layer|overlay|combin|stack|put together|data ?sets?|data (on|about|for)|add(ing)? (a )?map|compare|analy|query|pattern/i,"Say what GIS does: it layers different map data (need, existing lines, population, income) on top of each other."],["Explains how that analysis leads to a location decision (where need is highest, where building is cheapest, which places to prioritize)",/where|locat|place|priorit|target|choos|decid|identif|find|pinpoint|highest|most|need|cost|cheap|because|so |which lets|allow/i,"Finish the chain: where the layers overlap shows where to build first."]]},
mo:"T1- A state agency could use GIS to layer several kinds of spatial data on top of each other and find the best places to build. E2- For example, it could overlay this county map of households without internet with layers showing existing fiber-optic lines, population density, household income, and the locations of schools and clinics. A3- Where the layers overlap, such as a rural county like Northfork with 41% unconnected, no nearby fiber, and a school, the agency can see where need is highest and building is possible, so it can target its limited money there first.",
b:["gis"],
th:"Isn't GIS the same thing as GPS, like on my phone?",
co:"Close cousins, but no. GPS tells you WHERE one thing is. GIS is the software that stacks thousands of locations and other data into layers so you can analyze them together. The layering is what the question is after.",
kq:"How would a government use GIS mapping software to figure out where to build new internet lines? Name the layers it would combine and how that points to a decision.",
ml:["GIS in one picture: stacked layers",["A geographic information system (GIS) stores map data in layers, each about one thing: roads, counties, population, income, existing cables.","Think of clear plastic sheets stacked on a light table. Where the shapes line up, you learn something new.","The agency could stack the 'percent without internet' layer with 'existing fiber lines' and 'population density' to find counties that are both unconnected and reachable.","It can then ask the software questions, like 'show every county above 30% that has a school and is within 20 miles of a fiber line.'","The answer is a map of priority sites, which turns a huge decision into a targeted list."],[["GIS","Software that stores, layers, and analyzes map data."],["Layer","One set of map data, like roads or income, that can be stacked with others."],["GPS","Satellites that give the exact location of a device."]]],
wk:["The government could use GPS to find out where people live and then build internet there.","That's GPS (finding locations), not GIS (layering and analyzing data). It also skips how the agency would decide WHICH places get built first."],
mw:"It says what GIS does (layers data), names specific layers tied to the map, and explains how the overlap leads to choosing where to build.",
fr:"T1- A state agency could use GIS to ___ different kinds of map data, such as ___. E2- For example, it could combine this county map with layers showing ___ and ___. A3- Where those layers overlap, the agency can see ___, so it can decide to ___.",
qc:["The key feature of GIS that helps planners is that it…",["combines many data layers on one map for analysis","tells a phone its exact location","takes photos of Earth from satellites"],0,"GIS stacks layers of spatial data. GPS gives locations; remote sensing takes the images."]},
{v:"Describe",
q:"Describe ONE way a dot density map or a graduated symbol map of the same data would show the pattern differently from the county choropleth.",
sk:"Comparing thematic map types",
s:[["Pick one map type and say what it shows: a percent or a count?",["Choropleths usually show rates (percent). Dots and sized circles usually show numbers (how many).","Choose: dot density (one dot = so many households) or graduated symbol (bigger circle = more households)."]],["Describe what would look different on the Calderon map.",["Calder City is only 6% but has the most people, so it could have MANY dots or a big circle.","Dry Creek is 44% but has few people, so it might have few dots or a small circle."]],["Say why that difference matters for the viewer.",["It shows WHERE THE MOST unconnected households are, not where the RATE is highest.","Dots can also show clustering inside a county instead of one flat color."]]],
r:{m:"all",i:[["Names the map type: dot density or graduated/proportional symbol",/dot|graduated|proportional|symbol|circle/i,"Name your map: a dot density map or a graduated symbol map."],["Describes a real difference: it shows counts (number of households) instead of a rate, so metro counties could look bigger; or dots show where people cluster inside a county",/number|\bcounts?\b|how many|total|actual|raw|(instead of|not|rather than) (a |the |just )?(rate|percent|per ?cent)|even|spread|within|inside|where (in|people|the)|concentrat|cluster|bigger|larger|smaller|size/i,"Describe the difference: it would show the NUMBER of unconnected households, so Calder City (6% but many people) might show many dots or a big circle."]]},
mo:"T1- A dot density map would show the number of households without internet rather than the percent in each county. E2- If each dot stood for 500 households and the dots were placed where people live, Calder City might have many dots even though its rate is only 6%, while Dry Creek at 44% might have only a few dots because so few people live there. A3- This matters because it shows where the largest total number of unconnected households is, which can be a different place from where the rate is highest, and the dots can hint at clustering inside a county instead of coloring the whole county one shade.",
b:["choropleth"],
th:"Wouldn't it be the same information, just drawn differently?",
co:"Same data, but not the same message. A percent and a count can point to different places. Think about where the most PEOPLE are versus where the highest RATE is.",
kq:"If this same data were drawn as dots or as circles of different sizes, what would look different about the pattern? Describe ONE difference.",
ml:["Rate vs. count: why the map type matters",["A choropleth map is best for rates and percents, because it compares places fairly no matter how big or crowded they are.","A dot density map places one dot per set number of things (say, 500 households). Dots pile up where there are more people and can show clustering inside a county.","A graduated (proportional) symbol map puts a circle on each county and sizes it by the number, so the biggest circle goes to the county with the most unconnected households.","On the Calderon map, Calder City has the lowest percent (6%) but the most people, so it could have lots of dots or a large circle, while rural Dry Creek (44%) might look small.","Always ask: does this map show how many, or what share?"],[["Dot density map","One dot for each set number of things, placed where they are."],["Graduated symbol map","Symbols sized by the data value."],["Rate","A share or percent, not a raw count."]]],
wk:["A dot density map would use dots instead of colors, so it would look different.","That describes the drawing style, not the pattern. Say what the dots would SHOW: counts instead of percents, and where the dots would pile up."],
mw:"It names the map type, describes exactly what would change (counts vs. rates, with Calder City and Dry Creek as proof), and says why that matters.",
fr:"T1- A ___ map would show ___ instead of ___. E2- For example, Calder City (___%) might have ___ because ___, while Dry Creek (___%) might have ___. A3- This matters because ___.",
qc:["Which map type is usually used to show COUNTS placed where things actually are?",["Dot density","Choropleth","Isoline"],0,"Dot density maps put one dot per set number of things. Choropleths shade areas by rate."]},
{v:"Explain",
q:"Explain how improved internet access in Calderon's rural counties is an example of time-space compression, and explain ONE effect it could have on a rural community.",
sk:"Time-space compression and its effects",
s:[["Define the idea in your own words first. What does time-space compression 'shrink'?",["Not the miles. The TIME and effort it takes to connect across distance.","New communication technology makes far places feel closer."]],["Give a specific example of what fast internet lets a rural household do.",["A video visit with a doctor in Calder City instead of a two-hour drive.","Taking an online class, working remotely, selling products online."]],["Explain one effect on the community, as a chain.",["Use 'because… which could…'.","Young people can find work or school without moving away → slows rural population loss."]]],
r:{m:"all",i:[["Connects to time-space compression: distance matters less because places are connected faster or instantly",/shrink|smaller|closer|connect|instant|faster|quick|reduc|less time|overcome|distance|far|relative|friction|minutes|seconds/i,"Link it to the concept: fast internet shrinks the time it takes to reach distant places, so distance matters less."],["Explains one effect on the rural community (remote jobs, telehealth, online school, online businesses, people staying rather than leaving)",/job|work|remote|telehealth|doctor|clinic|health|school|student|class|course|learn|educat|medic|video (call|chat|visit)|business|sell|shop|bank|news|stay|leav|mov(e|ed|ing) away|migrat|young|econom|population/i,"Add the effect: for example, people can reach jobs, doctors, or classes online, so young people may stay instead of moving away."]]},
mo:"T1- Better internet is an example of time-space compression because it shrinks the time it takes to connect a rural place with distant ones, so distance matters less. E2- A family in Dry Creek that once drove two hours to see a specialist in Calder City could have a video visit in minutes, and a student there could take an online course from a university anywhere. A3- One effect is that rural residents can reach jobs, health care, and education without leaving, which could help young people stay in the community and let local businesses sell to customers far away, slowing rural population loss.",
b:["tsc","distdecay"],
th:"Time-space compression sounds like science fiction. What does it have to do with Wi-Fi?",
co:"Ha, it does sound like a movie. But it just means technology makes far places feel closer, and the internet is the biggest example ever. Picture the drive to the doctor from Dry Creek, then picture a video call.",
kq:"How does fast internet make faraway places feel closer for people in a rural county, and what's ONE thing that could change in their community because of it?",
ml:["Time-space compression, explained with Dry Creek",["Time-space compression is the idea that new transportation and communication technology cuts the time it takes to interact across distance, so the world feels smaller.","It doesn't change the miles. It changes relative distance: how connected places feel.","Without broadband, a Dry Creek family is far from everything: doctors, colleges, jobs, and customers. With it, those things are a click away.","Possible effects: remote work and online classes, telehealth, local businesses selling nationwide, and young people staying instead of leaving.","It can cut both ways: local stores may lose shoppers to big online companies."],[["Time-space compression","Technology shrinking the time it takes to connect distant places."],["Relative distance","How far apart places feel based on time, cost, or connection, not miles."],["Telehealth","Seeing a doctor by video or phone."]]],
wk:["Time-space compression means the world is getting smaller because of technology.","That's a definition, not an application. You need to connect it to internet in Calderon's rural counties AND explain one effect on the community."],
mw:"It ties internet access to the concept (shrinking the time to connect across distance), gives concrete examples from Dry Creek, and explains a community effect with a cause-and-effect chain.",
fr:"T1- Better internet is an example of time-space compression because ___. E2- For example, a family in ___ could ___ instead of ___. A3- One effect on the community could be ___, because ___.",
qc:["Time-space compression means that technology…",["reduces the time it takes to connect distant places, so they feel closer","moves places physically closer together","makes rural areas more populated"],0,"The miles don't change; the time and effort to connect across them do."]}
]});
addBG({
u1n_proj:{t:"Map projections & distortion",s:["Every map projection, a way of drawing the round Earth on flat paper, distorts shape, area, distance, or direction.","Mercator (1569) keeps shapes and compass directions true for sailors, but stretches areas more and more toward the poles.","On a Mercator map, Greenland (about 2.2 million km²) looks about as big as Africa (about 30 million km²), though Africa is about 14 times larger.","Gall-Peters keeps area correct but stretches shapes; Robinson compromises, distorting everything a little and nothing a lot."]},
u1n_regions:{t:"Formal, functional & perceptual regions",s:["A formal (uniform) region has an official boundary or one shared, measurable trait throughout, like the state of Louisiana or the Corn Belt.","A functional (nodal) region is tied together by connections to a central node, like a TV station's viewing area or a city's commuter zone.","A perceptual (vernacular) region exists in people's minds and has fuzzy borders, like “the South” or “the Midwest.”","New Orleans is in all three: Louisiana (formal), its own commuter zone (functional), and “the South” (perceptual)."]},
u1n_sitesit:{t:"Location, site & situation",s:["Absolute location is a place's exact spot, given by latitude and longitude: New Orleans is at about 30°N, 90°W.","Relative location describes a place compared to other places: New Orleans is near the mouth of the Mississippi River.","Site is the physical character of the place itself: landforms, water, soil, elevation, and climate.","Situation is the place's location relative to other places: its connections to rivers, roads, trade routes, and other cities."]},
u1n_rs:{t:"Remote sensing vs. GPS vs. GIS",s:["Remote sensing collects information about Earth's surface from a distance, usually from satellites, airplanes, or drones.","Landsat satellites have photographed Earth since 1972, so before-and-after images can reveal floods, burned forests, or growing cities.","GPS uses satellite signals to find the exact location of a device. GIS is software that layers and analyzes map data.","Remote sensing takes the picture, GPS finds the spot, and GIS puts it all together."]},
u1n_hei:{t:"Determinism, possibilism & sustainability",s:["Environmental determinism is the old, rejected idea that the environment, especially climate, controls how people behave and develop.","Possibilism says the environment sets limits, but people choose how to respond through culture and technology.","It goes both ways: levees protect New Orleans but stop the Mississippi from spreading new mud on its delta, one reason coastal Louisiana has lost about 2,000 square miles of land since the 1930s.","Sustainability means meeting today's needs without ruining the environment for future generations, like restoring coastal wetlands that soften storm surges."]},
u1n_data:{t:"Quantitative vs. qualitative data",s:["Quantitative data are numbers you can count or measure: population, income, rainfall, or the number of damaged homes.","Qualitative data are descriptions: interviews, field notes, photos, and people's stories.","Field observation means visiting a place in person to look, listen, and record what you find.","Numbers show how much and where; qualitative data help explain why."]}
});
addFRQ({k:"Practice FRQ · No stimulus",
t:"Mapping the Storm",
d:"Projections, site vs. situation, regions, remote sensing, and people vs. nature.",
u:"Unit 1",
fmt:"No stimulus (like Question 1)",
intro:"You're interning at a Gulf Coast county's emergency-management office before hurricane season. Your supervisor wants you to master the geographer's toolkit: maps, locations, regions, and how people and the environment shape each other.",
stim:"",
bg:["frq","u1n_regions","u1n_proj","u1n_sitesit"],
nt:[["What do you already know about map projections? Why can't a flat map show the round Earth perfectly?","Every flat map distorts shape, area, distance, or direction. Mercator keeps shapes right but blows up places near the poles: Greenland looks as big as Africa, which is really about 14 times larger."],["What do you already know about the three types of regions?","Formal: an official border or one shared trait (a state, the Corn Belt). Functional: tied to a center, or node (a TV market, a delivery zone). Perceptual: lives in people's heads, with fuzzy borders (“the South,” “the Midwest”)."],["What do you already know about absolute vs. relative location, and site vs. situation?","Absolute: exact coordinates (New Orleans is at about 30°N, 90°W). Relative: compared to other places (near the mouth of the Mississippi). Site: the land right there (low, swampy ground). Situation: its connections (a port linking the river to the Gulf)."]],
m:20,
p:[
{v:"Identify",
q:"Identify the type of region that “the South” in the United States is an example of.",
sk:"Types of regions",
s:[["Does “the South” have an official border that everyone agrees on?",["Is there a law or map line saying exactly where the South starts and stops?","Is Texas in the South? Maryland? Florida? People argue about all three."]],["Match it to the type of region that exists in people's minds.",["Formal = official border or one shared trait. Functional = tied to a center. The third type is about feelings and identity.","It starts with “percep-” (as in perception), and its other name is “vernacular.”"]]],
r:{m:"any",i:[["Names it: a perceptual (vernacular) region",/perceptu|vernacular|cognitive|mental (region|map)/i,"Name it: “the South” is a perceptual (vernacular) region."],["Describes it: exists in people's minds, with fuzzy borders",/mind|in (their|people.s|our) heads?|feel|belie|opinion|identit|fuzzy|blurr|vague|unclear|no (official|exact|clear|set)|not official|disagree|who you ask/i,"Say how it works: it exists in people's minds, so its borders are fuzzy."]]},
mo:"“The South” is a perceptual (vernacular) region: it exists in people's minds, so its borders are fuzzy and change depending on who you ask.",
b:["u1n_regions"],
th:"“The South” has states in it, so isn't it just a normal region on the map?",
co:"Good instinct! But ask five people whether Texas or Maryland is “in the South,” and you'll get five answers. A region whose borders live in people's heads has a special name.",
kq:"“The South” doesn't have one official border. What type of region is it? Name the type.",
ml:["The three types of regions",["A formal (uniform) region has an official boundary or one shared trait throughout, like the state of Louisiana.","A functional (nodal) region is organized around a central node, like a city's commuter zone.","A perceptual (vernacular) region is based on what people believe and feel, so its borders are fuzzy, like “the South” or “the Midwest.”","Clue: if people argue about its edges and it's tied to identity, it's perceptual."],[["Perceptual (vernacular) region","A region based on shared identity and feelings, with fuzzy borders."],["Formal region","A region with an official boundary or one shared, measurable trait."]]],
wk:["The South is a formal region because it is made up of states.","States have official borders, but “the South” doesn't: no law says which states are in it. That makes it perceptual, not formal."],
mw:"It names the exact type (perceptual, or vernacular) and shows the borders are fuzzy and live in people's minds.",
fr:"“The South” is a ___ region because its borders ___.",
qc:["Which of these is a PERCEPTUAL region?",["“The Midwest”","The state of Ohio","A pizza shop's delivery zone"],0,"The Midwest's borders depend on who you ask. Ohio is formal; a delivery zone is functional."]},
{v:"Describe",
q:"Describe how the Mercator projection distorts the size of Greenland compared with the size of Africa.",
sk:"Map projections and distortion",
s:[["Name the distortion in general words. What does Mercator do near the poles?",["Mercator keeps shapes right, but something else gets stretched.","The closer a place is to a pole, the more Mercator blows up its area."]],["Give proof: how big do Greenland and Africa LOOK, and how big are they REALLY?",["On Mercator, Greenland looks about as big as Africa.","Really: Greenland is about 2.2 million km²; Africa is about 30 million km², roughly 14 times larger."]],["Describe why it happens or why it matters.",["Greenland is near the North Pole; Africa straddles the equator, where Mercator distorts least.","Mercator-only maps can make people underestimate Africa."]]],
r:{m:"all",i:[["Describes the distortion: Greenland looks about as big as Africa",/greenland[^.!?]*(as big|as large|same size|similar|about the size|bigger|larger|huge|too big|giant|massive|enlarg|exaggerat|stretch|inflat|blow|over.?siz)|(stretch|enlarg|exaggerat|inflat|distort|bigger|larger)[^.!?]*(pole|polar|high latitude)|(pole|polar|high latitude)[^.!?]*(stretch|enlarg|exaggerat|inflat|distort|bigger|larger|huge|too big)/i,"Describe the distortion: on a Mercator map, Greenland looks about as big as Africa."],["Gives the truth or the reason: Africa is about 14 times bigger, or Mercator stretches areas near the poles",/14|fourteen|30 ?million|2\.\d ?million|times (as )?(big|large|bigger|larger)|actual|in reality|real (size|area|life)|true (size|area)|pole|polar|latitude|equator/i,"Add the truth: Africa is really about 14 times bigger, because Mercator stretches areas near the poles."]]},
mo:"T1- The Mercator projection stretches the area of places near the poles, so they look much bigger than they really are. E2- On a Mercator map, Greenland looks about as big as Africa, but Greenland is about 2.2 million km² while Africa is about 30 million km², roughly 14 times larger. A3- Because Greenland is near the North Pole and Africa straddles the equator, people who use only Mercator maps can badly underestimate Africa's true size.",
b:["u1n_proj"],
th:"How can a map be wrong about size? Isn't a map just a picture of Earth?",
co:"Earth is round and paper is flat. Flatten an orange peel and it rips or stretches! Every flat map stretches something, and Mercator stretches the areas near the poles.",
kq:"On a Mercator map, how does Greenland's size compare to Africa's, and how does that compare to real life?",
ml:["Why Mercator makes Greenland huge",["Every map projection distorts shape, area, distance, or direction when it flattens the globe.","Gerardus Mercator made his map in 1569 for sailors: it keeps compass directions and local shapes correct.","To do that, it stretches places more and more toward the poles, so Greenland looks as big as Africa, which is really about 14 times larger.","Gall-Peters keeps area correct but stretches shapes; Robinson compromises, with a little distortion everywhere."],[["Map projection","A way of showing the curved Earth on a flat map."],["Distortion","A change in shape, area, distance, or direction caused by flattening the globe."]]],
wk:["Greenland looks way bigger on the Mercator map.","It only says what the map SHOWS. Add the truth (Africa is actually about 14 times bigger) and why (Mercator stretches places near the poles)."],
mw:"It describes the distortion, gives real numbers (2.2 vs. 30 million km²), and explains it with latitude.",
fr:"T1- The Mercator projection distorts ___ near the poles. E2- For example, Greenland looks ___, but in reality ___. A3- This happens because ___.",
qc:["Which projection keeps the AREA of every country correct?",["Gall-Peters","Mercator","Robinson"],0,"Gall-Peters is an equal-area projection. Mercator keeps shape and direction; Robinson compromises."]},
{v:"Describe",
q:"Describe the difference between a city's site and its situation, using New Orleans or another real city as your example.",
sk:"Site vs. situation",
s:[["Define each term. One is the land right THERE; the other is connections to places AROUND it.",["Site = the physical features of the place itself.","Situation = location compared to other places: rivers, routes, and cities."]],["Give specific proof about one real city's site.",["New Orleans sits on low, swampy land in a bend of the Mississippi River; about half the city is below sea level.","Or try Chicago: flat, marshy land on Lake Michigan."]],["Now describe its situation, and show how the two differ.",["New Orleans is near where the Mississippi meets the Gulf of Mexico, linking the central U.S. to ocean trade.","Use a contrast: “Its site is…, but its situation is….”"]]],
r:{m:"all",i:[["Describes SITE: the physical features of the place itself",/physical|land|terrain|elevat|sea level|swamp|marsh|hill|river|lake|harbou?r|soil|climate|ground|coast|flat|bay|low/i,"Describe the site: the physical land right there, like New Orleans's low, swampy ground."],["Describes SITUATION: location relative to other places and its connections",/relative|in relation|compared to|connect|between|access|route|trade|link|surround|other (places|cities)|nearby|near |close to|port|hub|network/i,"Describe the situation: how the city connects to other places, like New Orleans linking the Mississippi to the Gulf for trade."]]},
mo:"T1- A city's site is the physical land it sits on, while its situation is its location compared to other places. E2- New Orleans's site is low, swampy land in a bend of the Mississippi River, and about half the city is below sea level. Its situation is near the river's mouth on the Gulf of Mexico, which makes it a port linking the central United States to world trade. A3- The site explains New Orleans's flood risk, while the situation explains why people built a major city there anyway.",
b:["u1n_sitesit"],
th:"Aren't site and situation the same thing? They both sound like “where it is.”",
co:"They're cousins, not twins! Site is like describing your house: the yard, the hill it sits on. Situation is like describing your neighborhood: how close you are to school and the highway.",
kq:"Pick a real city (New Orleans works great). Describe the land it sits on, then how it connects to places around it.",
ml:["Site vs. situation",["Site is the physical character of the place itself: landforms, water, soil, elevation, and climate.","Situation is the place's location relative to other places: nearby rivers, roads, trade routes, and cities.","The French founded New Orleans in 1718 on a bend of the Mississippi surrounded by swamps, so its site is low and flood-prone.","Its situation is excellent: near the river's mouth, it became a port shipping goods from the middle of the country to the world."],[["Site","The physical features of a place's exact location."],["Situation","A place's location relative to other places, and its connections to them."]]],
wk:["Site is the city's exact address, and situation is what's going on in the city, like the economy.","Two mix-ups: an exact address is absolute location, and situation isn't “what's happening.” Site is the physical land; situation is its connections."],
mw:"It defines both terms, gives proof for each (swampy land vs. a river-to-Gulf port), and shows why the difference matters.",
fr:"T1- A city's site is ___, while its situation is ___. E2- For example, ___'s site is ___, but its situation is ___. A3- This matters because ___.",
qc:["“Chicago grew because canals and railroads connected it to the rest of the country.” This describes Chicago's…",["situation","site","absolute location"],0,"Connections to other places are situation. Site would be the flat lakeshore land itself."]},
{v:"Explain",
q:"Explain how a county government could use remote sensing to respond to a hurricane after it makes landfall.",
sk:"Remote sensing in a disaster",
s:[["Say what remote sensing IS in general words.",["It's gathering information about Earth from far away.","Think satellites, airplanes, and drones taking images from above."]],["Give an example of what the images would show after a hurricane.",["Compare before-and-after images of the same place.","They can show flooded neighborhoods, destroyed buildings, and roads blocked by debris."]],["Explain how that changes what the government DOES.",["Use “so” or “which lets them…”.","Officials can send rescue crews, water, and generators to the worst-hit areas first."]]],
r:{m:"all",i:[["Says what remote sensing collects: images from satellites, aircraft, or drones",/satellite|aerial|image|photo|picture|drone|plane|aircraft|helicopter|from above|from space|from the sky|from a distance|sensor|radar|infrared|camera/i,"Say what it is: satellites, planes, or drones take images of the area from above."],["Explains the response: finding flooding or damage, then sending rescue, supplies, or repairs there",/flood|damage|destroy|block|road|bridge|rescue|crew|supplies|aid|evacuat|shelter|power|prioriti|send|worst|repair|rebuild/i,"Explain the response: images show where damage is worst, so the county sends rescue crews and supplies there first."]]},
mo:"T1- A county could use remote sensing, which collects images of Earth from satellites, planes, or drones, to see storm damage without sending people into danger. E2- After a hurricane, before-and-after images show flooded neighborhoods, destroyed homes, and blocked roads; NOAA, for example, flies planes over the coast to photograph hurricane damage. A3- Knowing where the worst damage is lets the county send rescue crews, water, and generators there first, saving time and lives.",
b:["u1n_rs"],
th:"Remote sensing? Is that like a TV remote?",
co:"Same “remote” as a TV remote: from a distance! Remote sensing gathers information about a place without being there, usually with cameras on satellites, planes, or drones.",
kq:"After a hurricane, how could county leaders use images taken from above? Explain what they'd show and what the county would do.",
ml:["Remote sensing, GPS, and GIS",["Remote sensing collects information about Earth from a distance, usually with satellites, airplanes, or drones.","Before-and-after images show where floods, fires, or storms did damage, even where roads are cut off.","GPS is different: it pinpoints the exact location of a device, like a rescue boat.","GIS is software that layers map data, like damage images on top of road maps."],[["Remote sensing","Collecting information about Earth's surface from a distance."],["GPS","A satellite system that gives a device's exact location."],["GIS","Software that layers and analyzes map data."]]],
wk:["Remote sensing would help the government know about the hurricane.","Too vague. Say what remote sensing collects (images from above) and what the county would do with them."],
mw:"It says what remote sensing is, what it shows after a storm, and how that changes the response (help goes to the worst areas first).",
fr:"T1- A county could use remote sensing, which ___, to ___. E2- For example, after a hurricane, images could show ___. A3- This helps because officials could ___.",
qc:["A rescue boat's screen shows its exact latitude and longitude. Which tool is that?",["GPS","Remote sensing","A Mercator projection"],0,"GPS pinpoints a device's exact location. Remote sensing gathers images from a distance."]},
{v:"Explain",
q:"Explain ONE reason a functional region, such as a hospital's service area or a city's commuter zone, can change in size over time.",
sk:"How functional regions change",

function start(i,fresh){S={f:FRQ[i],fi:i,k:0,max:0,vis:{0:1},p:FRQ[i].p.map(()=>({st:1,h:{},a:'',ck:0,box:[],done:0,ok:0,c:0,q:null,cf:null})),nt:FRQ[i].nt.map(()=>({o:0,a:''})),bo:null,cb:0};

h+=`<div class="step" style="color:${t[3]}"><div class="badge">${t[0]}</div><div style="color:var(--ink);flex:1"><div class="lb" style="color:${t[3]}">${t[1]}</div><p class="pr">${esc(s[0])}</p>${s[1].slice(0,shown).map(x=>`<div class="hint">${esc(x)}</div>`).join('')}${shown<s[1].length?`<button class="hb" data-a="hint" data-j="${j}" data-m="${shown}">Hint ${shown+1}/${s[1].length}</button>`:''}</div></div>`});
h+=`</div><div class="row"><button class="btn o" data-a="card" data-i="${i}" data-c="2">◀ Back</button>${st.st<P.s.length?`<button class="btn c" data-a="step" data-i="${i}">Next step ▸</button>`:`<button class="btn c" data-a="card" data-i="${i}" data-c="4">Start writing ▸</button>`}</div>${st.st<P.s.length?`<button class="link" data-a="card" data-i="${i}" data-c="4">I'm ready, skip to writing</button>`:''}`}
if(c==4)h+=qline+`<div class="panel"><span class="tag px">Write it</span>${tea?`<div class="teamini">Label it: <b class="tT">T1-</b> your reason · <b class="tE">E2-</b> specific proof · <b class="tA">A3-</b> why it matters</div>`:`<div class="teamini">${P.v=='Define'?'Define = give the meaning in one full sentence: “[Term] is…”':'Identify = one short, specific answer, written as a complete sentence.'}</div>`}
<details class="peek weak" data-pk="weak"><summary>Don't fall for this weak answer</summary><div><p class="wa">“${esc(P.wk[0])}”</p><p><b>❌ Why it misses:</b> ${esc(P.wk[1])}</p></div></details>
<textarea id="ans" data-in="ans" data-i="${i}" placeholder="${tea?'Write 2–3 sentences…':'Write one short sentence…'}" aria-label="Your answer">${esc(st.a)}</textarea>
<div class="chips"><button class="chip fr" data-a="frame" data-i="${i}">🧩 Stuck? Use a sentence frame</button>${tea?["For example, ","This is because ","which leads to ","As a result, "].map(c=>`<button class="chip" data-a="ins" data-t="${c}">+ ${c.trim()}</button>`).join(''):''}</div>
${st.w?'<p class="fix" role="alert">⚠ You still have blanks (___) to fill in. Replace each one with your own words first!</p>':''}
<div class="conf"><span>How sure are you?</span>${['😬 Not sure','🙂 Kind of','😎 Very'].map((t,k)=>`<button class="cb ${st.cf===k?'on':''}" data-a="cf" data-i="${i}" data-k="${k}" aria-pressed="${st.cf===k}">${t}</button>`).join('')}</div>
<div class="row"><button class="btn o" data-a="card" data-i="${i}" data-c="3">◀ Back</button><button class="btn" data-a="check" data-i="${i}">Check my answer ▸</button></div></div>`;
if(c==5&&st.ck){const ok=earned(i);h+=qline+`<div class="panel"><span class="tag px">Check it</span><p class="note" style="margin:0 0 6px">Your answer:</p><div class="mine">${esc(st.a)}</div>
<p style="margin-top:12px"><b>What earns the point${P.r.m=="any"?' (any ONE of these)':' (you need ALL of these)'}:</b> Tick each one your answer really does.</p>
<ul class="ck">${P.r.i.map((r,j)=>`<li><label><input type="checkbox" data-a="box" data-i="${i}" data-j="${j}" ${st.box[j]?'checked':''}><span>${esc(r[0])}${st.g[j]?'<small>Tutor spotted this; double-check it.</small>':''}${!st.box[j]&&!(P.r.m=="any"&&st.box.some(Boolean))?`<em class="fix">Fix it: ${esc(r[2])}</em>`:''}</span></label></li>`).join('')}</ul>
<p class="note">The tutor guesses from keywords. <b>You</b> make the final call, so be honest!</p>
<div class="model"><span class="px">Model answer</span>${esc(P.mo)}<p class="why"><b>✅ Why it works:</b> ${esc(P.mw)}</p></div>
<div role="status" class="verdict ${ok?'y':'n'}">${ok?YES[i%3]:'Not yet, and “not yet” is how everyone learns. Use the Fix-it tips, then revise.'}${ok&&S.cb>0?`<span class="combo">🔥 ${S.cb+1} in a row!</span>`:''}</div>${st.cf==null?'':`<p class="cal">${CAL[st.cf][ok?0:1]}</p>`}
<div class="row">${ok?'':`<button class="btn o" data-a="rev" data-i="${i}">✎ Revise</button>`}<button class="btn g" data-a="next" data-i="${i}">${i+1<n?`On to Part ${L(i+1)} ▸`:'See results ▸'}</button></div></div>`}
return h}
function bossV(){const B=S.bo;if(!B)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p>3 lightning questions on what you just learned. Quick recall now helps you remember it next week.</p><div class="row"><button class="btn m" data-a="boss">Start Boss Round ▸</button></div></div>`;
if(B.k>=B.l.length)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p class="big" style="font-size:20px">${B.r==B.l.length?'Boss defeated!':'Boss battle over!'}</p><p style="text-align:center">You got <b>${B.r}/${B.l.length}</b> on the first try.${B.r<B.l.length?' Come back tomorrow and replay. Spacing out practice is how memories stick.':''}</p></div>`;
const i=B.l[B.k],q=S.f.p[i].qc;return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round · ${B.k+1}/${B.l.length}</span>${mcqV(q,B.s,(i+B.k+1)%3,'bq','')}${B.s===0||B.s>0?`<div class="row"><button class="btn m" data-a="bn">${B.k+1<B.l.length?'Next ▸':'Finish ▸'}</button></div>`:''}</div>`}
function exportTxt(){const n=S.f.p.length;return `${S.f.t} (${S.f.u}) · GeoArcade FRQ Tutor\nScore: ${score()}/${n}\n\n`+S.f.p.map((p,i)=>{const st=S.p[i];return `Part ${L(i)} (${p.v}): ${p.q}\nMy answer: ${st.a.trim()||'(blank)'}\nResult: ${st.done?(st.ok?'point earned':'not yet'):'not attempted'}\n`}).join('\n')}
function doneV(){const n=S.f.p.length,sc=score(),ps=S.f.p.map((p,i)=>[p,i,S.p[i]]),ok=ps.filter(x=>x[2].ok),no=ps.filter(x=>x[2].done&&!x[2].ok),un=ps.filter(x=>!x[2].done);
const rank=sc==n?"GEO LEGEND":sc>=5?"MAP MASTER":sc>=3?"RISING SCOUT":"KEEP PLAYING";
return `<div class="panel" style="text-align:center"><h2 class="big" tabindex="-1">${un.length?'Progress report':'Stage clear!'}</h2><div class="stars" aria-label="${sc} of ${n}">${'★'.repeat(sc)}<span style="opacity:.25">${'★'.repeat(n-sc)}</span></div><div class="rank">${sc}/${n} points · Rank: ${rank}</div></div>
<div class="panel"><span class="tag px" style="color:var(--gr)">Nailed it</span>${ok.length?`<ul class="res">${ok.map(([p,i])=>`<li><b style="color:var(--gr)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span></li>`).join('')}</ul>`:'<p class="note">No points yet. Every replay makes it easier!</p>'}</div>
<div class="panel"><span class="tag px" style="color:var(--rd)">Review these</span>${no.length?`<ul class="res">${no.map(([p,i])=>`<li><b style="color:var(--rd)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br>${chips(p.b)}<button class="link" data-a="go" data-k="${i+1}">Revisit Part ${L(i)}</button></li>`).join('')}</ul>`:(S.p.some(x=>x.done)?'<p>Nothing to review so far. 🏆</p>':'<p class="note">Try a part first, then come back here.</p>')}</div>
${un.length?`<div class="panel"><span class="tag px" style="color:var(--yl)">Not tried yet</span><ul class="res">${un.map(([p,i])=>`<li><b style="color:var(--yl)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br><button class="link" data-a="go" data-k="${i+1}">Go to Part ${L(i)}</button></li>`).join('')}</ul></div>`:''}
<div class="panel"><span class="tag px">Turn it in</span><p>Your answers stay on this device only. Copy them to turn in on Canvas or in a doc.</p><div class="row"><button class="btn c" data-a="copy">📋 Copy my answers</button><span class="note" id="cpmsg" role="status" aria-live="polite"></span></div><details class="peek" id="cpd" data-pk="cpd"><summary>See the text</summary><div><textarea readonly id="cpt" aria-label="Your answers" style="min-height:200px">${esc(exportTxt())}</textarea></div></details></div>
${no.length?`<div class="row"><button class="btn c" data-a="retry">↻ Retry what I missed ▸</button></div>`:''}${bossV()}<div class="row"><button class="btn" data-a="restart" data-i="${S.fi}">${S.rc?'Tap again to erase your answers':'↻ Start over'}</button>${FRQ.length>1?`<button class="btn m" data-a="start" data-i="${(S.fi+1)%FRQ.length}">Try “${esc(FRQ[(S.fi+1)%FRQ.length].t)}” ▸</button>`:''}<button class="btn o" data-a="home">Menu</button></div>`}
let opener;function openBG(k){opener=document.activeElement;app.setAttribute('aria-hidden','true');document.getElementById('shT').textContent=BG[k].t;document.getElementById('shB').innerHTML=BG[k].s.map(x=>`<li>${esc(x)}</li>`).join('');sh.classList.add('on');sh.querySelector('[data-a=x]').focus()}
function closeBG(){if(!sh.classList.contains('on'))return;sh.classList.remove('on');app.removeAttribute('aria-hidden');opener&&opener.focus()}
document.addEventListener('click',e=>{if(e.target==sh)return closeBG();const z=e.target.closest('.stim svg,.stim img');if(z&&!e.target.closest('#zm')){const zb=document.getElementById('zb');zb.innerHTML='';zb.appendChild(z.cloneNode(true));document.getElementById('zm').classList.add('on');return}const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);
case 'restart':if(!S.rc){S.rc=1;return render()}S.rc=0;return start(i,1);
case 'home':save();S.k=-1;return render(1);
case 'go':return go(+b.dataset.k);
case 'bg':return openBG(b.dataset.k);
case 'x':return closeBG();
case 'zx':return document.getElementById('zm').classList.remove('on');
case 'nt':S.nt[j].o=1;return render();
case 'hint':{const k=S.k-1;S.p[k].h[j+'-'+b.dataset.m]=1;return render()}
case 'step':S.p[i].st++;return render();
case 'card':S.p[i].c=+b.dataset.c;return render(1);
case 'mcq':S.p[i].q=+b.dataset.o;return render();
case 'boss':{const f=S.p.map((x,k)=>k),miss=f.filter(k=>!S.p[k].ok),rest=f.filter(k=>S.p[k].ok);S.bo={l:miss.concat(rest).slice(0,3),k:0,s:null,r:0};return render()}
case 'bq':{const B=S.bo;if(B.s==null&&+b.dataset.o==0)B.r++;if(B.s!==0)B.s=+b.dataset.o;return render()}
case 'bn':S.bo.k++;S.bo.s=null;return render();
case 'frame':{const t=document.getElementById('ans'),f=S.f.p[i].fr;if(t.value.includes(f)){t.focus();return}t.value=t.value.trim()?t.value.trim()+'\n'+f:f;S.p[i].a=t.value;t.focus();const c=t.value.indexOf('___',t.value.length-f.length);if(c>=0)t.setSelectionRange(c,c+3);return}
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.includes('___')){st.w=1;render();return document.getElementById('ans').focus()}st.w=0;if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.c=5;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render(1)}
case 'rev':S.p[i].ck=0;S.p[i].done=0;S.p[i].c=4;render(1);return document.getElementById('ans').focus();
case 'next':{const w=S.p[i].done;S.p[i].done=1;S.p[i].ok=earned(i);if(!w)S.cb=S.p[i].ok?S.cb+1:0;return go(i+2)}
case 'cf':S.p[i].cf=+b.dataset.k;return render();
case 'copy':{const m=document.getElementById('cpmsg'),t=exportTxt();const fail=()=>{document.getElementById('cpd').open=true;const ta=document.getElementById('cpt');ta.focus();ta.select();m.textContent='Select the text below and copy it.'};try{navigator.clipboard.writeText(t).then(()=>{m.textContent='✔ Copied! Now paste it into Canvas.'},fail)}catch(e){fail()}return}
case 'retry':{const m=S.p.findIndex(x=>x.done&&!x.ok);S.p[m].c=4;S.p[m].ck=0;S.p[m].done=0;return go(m+1)}
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value;save()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeBG();document.getElementById('zm').classList.remove('on')}else if(e.key=='Tab'&&sh.classList.contains('on')){e.preventDefault();sh.querySelector('[data-a=x]').focus()}});
render(1);
</script>
</body>
</html>
