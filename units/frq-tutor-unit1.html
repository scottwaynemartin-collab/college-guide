<body>
<main id="app"></main>
<div id="sh" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="card"><div class="k">📜 Need the background?</div><h3 id="shT"></h3><ol id="shB"></ol><div class="row"><button class="btn c" data-a="x">Got it ▸</button></div></div></div>
<script>
/* ===== Background pop-outs (shared by every FRQ) ===== */
const BG={
frq:{t:"How AP FRQs are scored",s:["Each part (A, B, C…) is worth 1 point and is scored on its own. A mistake in Part B can't cost you Part C.","Readers look for the right idea, clearly linked to the question. Fancy writing earns nothing extra.","No thesis, intro, or conclusion needed. Label each part and answer it directly.","Write in complete sentences and do what the task verb asks (Identify, Describe, or Explain).","Never leave a part blank. A wrong answer costs nothing."]},
tea:{t:"The TEA method",s:["T1- Topic: your reason in general words. Turn the question into your claim.","E2- Evidence: the specific proof, like a place, number, or example, ideally from the map or table.","A3- Analysis: why it matters. Explain HOW or WHY your proof backs up your reason, using “because…” or “which leads to…”.","Label each piece T1-, E2-, A3- so the reader can find every point. Describe answers need T1 and E2 plus a short A3. Explain answers need a strong A3."]},
readmap:{t:"How to read a map",s:["Read the title first. It tells you the topic, place, and time.","Check the legend so you know what each color and symbol means.","Look for patterns: what's clustered, what's connected, what points where?","Then ask WHY: who made this, and what story is it telling?"]},
readtable:{t:"How to read a data table",s:["Read the title and every column header, including units (%, per 1,000).","Find the highest and lowest value in each column.","Compare columns: when one goes up, does another go up or down?","When there are two years, look for change over time."]},
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]}
};
/* ===== Task verbs ===== */
const VERBS={
Identify:{d:"Name it. A word or short phrase is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","One sentence max."]},
Describe:{d:"Paint the picture. Give the specific characteristics or pattern, with details someone could check.",l:["Use evidence: a place, a number, or a feature from the stimulus.","Say what it IS or what it LOOKS LIKE. You don't need a deep “why.”","About 1–2 sentences. Use TEA: Topic + Evidence, then a quick Analysis."]},
Explain:{d:"Tell HOW or WHY. Connect a cause to an effect so a reader sees the reasoning, not just a fact.",l:["Use linking words: “because…”, “which leads to…”, “as a result…”.","A fact alone won't score. You need the chain of reasoning.","About 2–3 sentences. Use full TEA."]}
};
/* ===== FRQ registry: each FRQ data file calls addBG() and addFRQ() ===== */
const FRQ=[];
function addBG(o){Object.assign(BG,o)}
function addFRQ(f){FRQ.push(f)}
const UNIT="Unit 1 · Thinking Geographically";
/* Two Scales, One State (original): the same variable at state and county scale. Map stimulus. */
addBG({
choropleth:{t:"Types of thematic maps",s:["A thematic map shows one topic (a theme), like income or internet access, instead of just roads and borders.","A choropleth map shades whole areas, like counties or countries, by class: darker or hotter colors usually mean higher values. It works best with rates and percents.","A dot density map places one dot for every set number of things (say, 500 households), so you see counts and where they cluster inside an area.","A graduated (proportional) symbol map puts a circle on each place and makes the circle bigger when the number is bigger.","An isoline map connects points of equal value (like elevation or temperature), and a cartogram stretches or shrinks places by a data value instead of land area."]},
scaleshift:{t:"Why patterns change with scale",s:["Scale of analysis is the size of the units you look at: one country, 50 states, 3,000 counties, or individual neighborhoods.","When data for many places are rolled into one bigger unit, the values get averaged, and places with lots of people pull the average toward their number.","That is why a state can look 'fine' at 18% while some of its counties are over 40%: the crowded metro counties with low rates outweigh the thinly populated rural ones.","Zooming in to a smaller unit reveals clusters, gaps, and outliers that the bigger unit hides. Zooming out smooths them away.","On the AP exam, always ask: at what scale is this data, and what could be hiding inside each unit?"]},
distdecay:{t:"Distance decay & population density",s:["Distance decay is the idea that interaction between places drops off as the distance between them grows. Farther away usually means fewer connections and fewer services.","Population density is the number of people per unit of land. Rural counties have low density: homes are spread far apart.","Networks like roads, water pipes, and fiber-optic internet cost money per mile. In a dense city one mile of cable can serve hundreds of homes; in a rural county it may serve five.","Because companies earn less per mile in low-density places, they build there last or not at all, which leaves rural areas with weaker service.","Lower average incomes in many rural areas can add to the problem, since fewer households can afford a monthly plan even where service exists."]},
gis:{t:"GIS, GPS & remote sensing",s:["GIS (geographic information system) is computer software that stores map data in layers, like clear sheets stacked on a light table, so you can combine and analyze them.","A city might stack layers for roads, population density, income, flood zones, and existing utilities, then ask the software to find spots where several conditions overlap.","GPS (global positioning system) uses satellites to give the exact location of a device. It collects points; GIS analyzes them.","Remote sensing collects information about Earth's surface from a distance, usually from satellites or aircraft, like images of crops, forests, or city growth.","Governments use these tools to plan services and respond to disasters; businesses use them to choose store locations and plan delivery routes."]},
tsc:{t:"Time-space compression",s:["Time-space compression is the idea that new transportation and communication technology shrinks the time it takes to connect distant places, so the world feels smaller.","The telegraph, jet planes, and the internet each made far-away places easier and faster to reach.","It does not shrink actual distance; it reduces the 'friction' of distance. Geographers call this a change in relative distance between places.","Places with weak connections, like rural areas without broadband, are left out of this shrinking world, which is a form of spatial inequality.","Better connections can let people in remote places reach jobs, doctors, and schools without moving, but they can also pull local shoppers toward big online companies."]},
regions:{t:"Three types of regions",s:["A region is an area that shares one or more features. Geographers sort regions into three kinds.","A formal (uniform) region has an official boundary or a shared measurable trait everywhere inside it, like a county, a state, or the French-speaking part of Canada.","A functional (nodal) region is organized around a center, or node, like a metro area tied to its downtown, a pizza delivery zone, or the area a radio station reaches.","A perceptual (vernacular) region exists in people's minds and has fuzzy borders, like 'the South' or 'upstate.'","On the Calderon map, each county is a formal region, while the capital and the suburbs it serves form a functional region."]}

addFRQ({k:"Practice FRQ · Map stimulus",
t:"Two Scales, One State",
d:"Scale of analysis, choropleth maps, and the rural internet gap.",
u:"Unit 1",
st:"Percent of Households Without Home Internet, State of Calderon (fictional), 2020: State Scale vs. County Scale",
intro:"Both maps show the same variable for the same fictional state in the same year. The left panel reports one value for the whole state. The right panel divides Calderon into its 12 counties. The capital, Calder City, is marked with a star.",
stim:"<svg viewBox=\"0 0 400 212\" role=\"img\" aria-label=\"Two side-by-side maps of the fictional state of Calderon showing the percent of households without home internet in 2020. Left panel, state scale: the whole state is one rectangle shaded in the 11 to 20 percent class and labeled 18 percent. Right panel, county scale: the same state divided into a grid of 12 counties, 4 across and 3 down, shaded in four classes. Top row: Northfork 41, Pine Ridge 38, Harlow 27, Ashby 33. Middle row: Dry Creek 44, Verano 19, Calder City 6 (the capital, marked with a star), Eastgate 15. Bottom row: Sorrel 24, Lowland 29, Westbrook 9, Millbrook 10. The lowest counties cluster around the capital toward the lower right; the highest are along the western and northern edges. Legend: green 0 to 10 percent, yellow 11 to 20, orange 21 to 30, pink 31 to 45.\">\n<rect width=\"400\" height=\"212\" fill=\"#0a1d3a\"/>\n<g font-family=\"Chakra Petch,sans-serif\" font-weight=\"700\" font-size=\"9\" fill=\"#22e5ff\"><text x=\"14\" y=\"14\">STATE SCALE · 1 UNIT</text><text x=\"212\" y=\"14\">COUNTY SCALE · 12 UNITS</text></g>\n<rect x=\"14\" y=\"24\" width=\"172\" height=\"165\" fill=\"#ffd23f\" stroke=\"#7fe8ff\" stroke-width=\"1.5\"/>\n<g font-family=\"Chakra Petch,sans-serif\" text-anchor=\"middle\" fill=\"#0a1d3a\"><text x=\"100\" y=\"90\" font-size=\"13\" font-weight=\"700\">CALDERON</text><text x=\"100\" y=\"126\" font-size=\"30\" font-weight=\"700\">18%</text><text x=\"100\" y=\"142\" font-size=\"7.5\">of households without home internet</text></g>\n<text x=\"199\" y=\"112\" font-family=\"Chakra Petch,sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#22e5ff\" text-anchor=\"middle\">→</text>\n<g stroke=\"#0a1d3a\" stroke-width=\"1.2\">\n<rect x=\"212\" y=\"24\" width=\"43\" height=\"55\" fill=\"#ff3fa4\"/><rect x=\"255\" y=\"24\" width=\"43\" height=\"55\" fill=\"#ff3fa4\"/><rect x=\"298\" y=\"24\" width=\"43\" height=\"55\" fill=\"#ff8a3d\"/><rect x=\"341\" y=\"24\" width=\"43\" height=\"55\" fill=\"#ff3fa4\"/>\n<rect x=\"212\" y=\"79\" width=\"43\" height=\"55\" fill=\"#ff3fa4\"/><rect x=\"255\" y=\"79\" width=\"43\" height=\"55\" fill=\"#ffd23f\"/><rect x=\"298\" y=\"79\" width=\"43\" height=\"55\" fill=\"#3ddc84\"/><rect x=\"341\" y=\"79\" width=\"43\" height=\"55\" fill=\"#ffd23f\"/>\n<rect x=\"212\" y=\"134\" width=\"43\" height=\"55\" fill=\"#ff8a3d\"/><rect x=\"255\" y=\"134\" width=\"43\" height=\"55\" fill=\"#ff8a3d\"/><rect x=\"298\" y=\"134\" width=\"43\" height=\"55\" fill=\"#3ddc84\"/><rect x=\"341\" y=\"134\" width=\"43\" height=\"55\" fill=\"#3ddc84\"/>\n</g>\n<rect x=\"212\" y=\"24\" width=\"172\" height=\"165\" fill=\"none\" stroke=\"#7fe8ff\" stroke-width=\"1.5\"/>\n<g font-family=\"Chakra Petch,sans-serif\" text-anchor=\"middle\" fill=\"#0a1d3a\" font-size=\"6.5\">\n<text x=\"233.5\" y=\"44\">Northfork</text><text x=\"276.5\" y=\"44\">Pine Ridge</text><text x=\"319.5\" y=\"44\">Harlow</text><text x=\"362.5\" y=\"44\">Ashby</text>\n<text x=\"233.5\" y=\"99\">Dry Creek</text><text x=\"276.5\" y=\"99\">Verano</text><text x=\"319.5\" y=\"99\">Calder City</text><text x=\"362.5\" y=\"99\">Eastgate</text>\n<text x=\"233.5\" y=\"154\">Sorrel</text><text x=\"276.5\" y=\"154\">Lowland</text><text x=\"319.5\" y=\"154\">Westbrook</text><text x=\"362.5\" y=\"154\">Millbrook</text>\n<g font-size=\"11\" font-weight=\"700\"><text x=\"233.5\" y=\"62\">41%</text><text x=\"276.5\" y=\"62\">38%</text><text x=\"319.5\" y=\"62\">27%</text><text x=\"362.5\" y=\"62\">33%</text>\n<text x=\"233.5\" y=\"117\">44%</text><text x=\"276.5\" y=\"117\">19%</text><text x=\"319.5\" y=\"117\">6%</text><text x=\"362.5\" y=\"117\">15%</text>\n<text x=\"233.5\" y=\"172\">24%</text><text x=\"276.5\" y=\"172\">29%</text><text x=\"319.5\" y=\"172\">9%</text><text x=\"362.5\" y=\"172\">10%</text></g>\n<text x=\"319.5\" y=\"131\" font-size=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\".6\">★</text>\n</g>\n<g font-family=\"Chakra Petch,sans-serif\" font-size=\"8\" fill=\"#ffe7a6\" text-anchor=\"middle\"><text x=\"100\" y=\"204\">One number for the whole state</text><text x=\"298\" y=\"204\">Same data, same year, 12 counties</text></g>\n</svg><div class=\"legend\"><span><i style=\"background:#3ddc84\"></i>0–10%</span><span><i style=\"background:#ffd23f\"></i>11–20%</span><span><i style=\"background:#ff8a3d\"></i>21–30%</span><span><i style=\"background:#ff3fa4\"></i>31–45%</span><span>★ State capital (Calder City)</span></div><p class=\"src\">Data and places are invented for practice. The state figure is a population-weighted average: most of Calderon's people live in the metro counties around Calder City, so those low rates pull the state number down. Shapes simplified, not to scale.</p>",
bg:["choropleth","scaleshift","readmap"],
nt:[["Both panels show the SAME state, the SAME year, and the SAME variable. What's the only thing that changed?","The scale of analysis. The left panel treats Calderon as one unit (18%). The right panel splits it into 12 counties. Nothing about the real households changed, only how finely we are looking."],["Find the lowest and highest counties on the right. Where are they on the map?","Calder City (6%), the capital with the star, is lowest, and its neighbors Westbrook (9%) and Millbrook (10%) are also green. The highest, Dry Creek (44%) and Northfork (41%), sit on the far western edge, about as far from the capital as you can get."],["Is 18% a 'middle' number for these counties? Count how many counties are above it and how many are below.","Only 4 counties are at or below 18% and 8 are above it, yet the state figure is 18%. That's because most of Calderon's people live in the low-rate metro counties, so they pull the average down. A state number is a population-weighted average, not a typical county."]],
m:20,
p:[
{v:"Identify",
q:"Identify the type of thematic map used in the county-scale panel of the stimulus.",
sk:"Identifying map types",
s:[["Look at HOW the data are shown. Are the counties shaded, dotted, or marked with circles of different sizes?",["Each whole county is filled with one color.","The legend groups the percents into classes (0–10%, 11–20%, and so on)."]],["Match that style to its name.",["Areas shaded by class = the most common thematic map on the AP exam.","It starts with 'choro-' (from the Greek word for 'area')."]]],
r:{m:"any",i:[["Names it: a choropleth map",/ch?l?oro?pleth|shaded|colou?r.?coded|color.?shaded/i,"Name it: this is a choropleth map (areas shaded by value)."],["Describes the method: areas shaded or colored by data class",/shad|colou?r|fill|class|categor|range|interval/i,"Say how it works: each county is shaded a color based on its data class."]]},
mo:"It is a choropleth map: each county is shaded one color based on which percent class it falls in.",
b:["choropleth","readmap"],
th:"Isn't it just... a map with colors?",
co:"Yes, and that's the answer hiding in plain sight! Maps that color whole areas by their data have a specific name. Check the mini-lesson if it's not coming to you.",
kq:"What kind of map is the county map on the right? Name the type.",
ml:["Spotting a choropleth",["A choropleth map fills in whole areas (countries, states, counties) with a color based on their data value.","The values are grouped into classes, and the legend tells you which color means which range.","It's great for rates and percents, like percent without internet, because it compares places fairly regardless of their size.","Its weakness: a whole county gets one color, even if conditions vary a lot inside it."],[["Thematic map","A map about one topic, like income or internet access."],["Choropleth map","Areas shaded by data class."],["Class","A range of values that share one color on the legend."]]],
wk:["It is a political map of Calderon's counties.","A political map shows borders and names, not data. This map colors each county by a percent, which makes it a thematic map with a specific name."],
mw:"It names the map type precisely and adds a quick phrase showing it knows how the map works.",
fr:"The county-scale map is a ___ map because each county is ___ based on its ___.",
qc:["Which map type shades whole areas by data class?",["Choropleth","Dot density","Graduated symbol"],0,"Choropleth maps color areas by value class. Dot density uses dots; graduated symbols use sized circles."]},

{v:"Describe",
q:"Using the map, describe how the pattern of households without home internet changes between the state scale and the county scale.",
sk:"Comparing patterns across scales",
s:[["Start with the state scale. What does the left panel actually tell you about WHERE the problem is?",["One shape, one color, one number.","At this scale there is no pattern to see: the whole state is 18%."]],["Now the county scale. Pull specific numbers and places from the right panel.",["Find the lowest counties (green) and the highest (pink). Where is each group?","Calder City 6% and Westbrook 9% near the capital; Dry Creek 44% and Northfork 41% on the western edge."]],["Say what the zoom-in reveals that the zoom-out hid.",["Words like 'clustered,' 'range,' and 'hidden' are your friends.","The pattern goes from uniform to a clear high-rural, low-metro cluster."]]],
r:{m:"all",i:[["Describes the state scale as one value or one shade (18%) for the whole state",/18|one (value|number|colou?r|shade|percent)|single|uniform|whole state|entire state|all the same|same everywhere|average|overall|no pattern/i,"Start with the state scale: the whole state is one shade, 18%, so there is no pattern to see."],["Describes the county-scale pattern with evidence: a wide range (6% to 44%), low near the capital or metro, high in rural or edge counties",/vary|varies|variation|differ|range|higher|lower|highest|lowest|rural|metro|urban|cit|capital|edge|corner|center|west|north|cluster|concentrat|\d{1,2} ?%/i,"Add county evidence: it ranges from 6% in Calder City to 44% in Dry Creek, with high counties clustered on the rural edges."]]},
mo:"T1- At the state scale there is no pattern to see, because the whole state is one shade with a single value of 18%. E2- At the county scale the same data range from 6% in Calder City and 9% in Westbrook, clustered around the capital, up to 41% in Northfork and 44% in Dry Creek along the western and northern edges. A3- Zooming in reveals a clustered pattern of rural counties where more than a third of households lack internet, which the single state number completely hides.",
b:["scaleshift","scale","regions"],
th:"It's the same state. How can the pattern 'change' if nothing changed?",
co:"Great catch, and that's the whole point of the question. The households didn't change. What changed is how finely we are looking. Describe what you can see in each panel and what one panel shows that the other can't.",
kq:"Compare the two panels. What does the state-scale map show about internet access, and what different story does the county-scale map tell? Use numbers.",
ml:["Reading a pattern at two scales",["Scale of analysis is the size of the units the data are divided into. Here: 1 state vs. 12 counties.","At the bigger unit, everything is averaged into one number, so you can't see a pattern at all.","At the smaller unit, you can describe the pattern: clustered (grouped together) or dispersed (spread out), and which places are high or low.","A good description names the range (lowest to highest), where the highs and lows sit, and what word fits the arrangement, like 'clustered around the capital.'"],[["Scale of analysis","The size of the units you study: national, state, county, local."],["Clustered","Grouped close together."],["Dispersed","Spread out evenly."]]],
wk:["At the county scale there are more colors and more details.","That's about the picture, not the pattern. A describe answer needs the actual values (18% vs. 6% to 44%) and WHERE the high and low counties are."],
mw:"It describes the state scale (one value, 18%), gives specific county evidence with places and numbers, and names what the zoom-in reveals (a rural cluster the state figure hides).",
fr:"T1- At the state scale the map shows ___, so ___. E2- At the county scale the values range from ___% in ___ to ___% in ___, with the high counties located ___. A3- Zooming in reveals ___ that the state number hides.",
qc:["A pattern that looks uniform at the state scale but clustered at the county scale is an example of…",["how scale of analysis changes what you see","map projection distortion","a perceptual region"],0,"Changing the size of the units (the scale of analysis) can reveal or hide patterns."]},

{v:"Explain",
q:"Explain ONE reason rural counties in Calderon have higher rates of households without home internet than the counties around the capital.",
sk:"Explaining a rural–urban gap",
s:[["Name the reason in general words. What's different about living in a rural county?",["Think about how far apart homes are, or how much money people make.","Low population density makes internet infrastructure expensive per home."]],["Give specific proof, with a county and a number from the map.",["Dry Creek is 44%; Calder City is 6%.","In a rural county, one mile of fiber-optic cable might pass five homes instead of five hundred."]],["Explain the chain: why does that lead to more homes without internet?",["Use 'because… so…'.","Companies earn less per mile in rural areas, so they build there last or not at all."]]],
r:{m:"all",i:[["Names a reason: low population density / homes spread far apart, high cost of infrastructure per customer, distance from the city, or lower incomes",/densit|spread|dispers|far apart|remote|distance|far (from|away)|sparse|few(er)? (people|homes|houses|households|customers)|cost|expensive|infrastructure|cable|fiber|fibre|tower|wire|line|income|poor|afford|profit/i,"Name the reason: rural homes are spread far apart, so building internet lines costs more per customer (or incomes are lower)."],["Explains the cause-and-effect chain to the higher rate",/because|so |since|therefore|which (means|leads|makes)|lead|result|less likely|not worth|don.t|do not|won.t|per (person|home|household|customer|mile)/i,"Add the chain with 'because' or 'so': companies earn less per mile, so they skip rural areas and the rate stays high."]]},
mo:"T1- Rural counties have higher rates of households without internet because their low population density makes internet infrastructure very expensive per customer. E2- In Dry Creek (44%) homes are spread miles apart, so a company must lay far more fiber-optic cable to reach each household than it does in dense Calder City (6%), where one line serves hundreds of homes. A3- Because the company earns less for every mile of cable in a rural county, it builds there last or not at all, so many rural households are left without service and the rate stays high.",
b:["distdecay"],
th:"Can't rural people just buy internet like everyone else?",
co:"Only if a company has run a line to their house, and that's the catch. Think about what it costs to reach a house that's three miles from its nearest neighbor. The mini-lesson walks through it.",
kq:"Why would a county far from the city have a lot more homes without internet? Pick ONE reason and explain how it causes the gap.",
ml:["Density, distance, and the cost of a connection",["Population density is the number of people per square mile. Rural counties have low density: homes sit far apart.","Internet service needs physical infrastructure, like fiber-optic cable or cell towers, and it costs money for every mile built.","In a dense city, one mile of cable can serve hundreds of paying customers. In a rural county it might serve five, so the company earns far less per mile.","Companies build where they make money first, so rural areas get service later, slower, or never. This is related to distance decay: the farther from the center, the weaker the connection.","Lower rural incomes can add to it: even where service exists, fewer families can afford it."],[["Population density","People per unit of land."],["Infrastructure","The physical systems a place needs, like roads, pipes, and cables."],["Distance decay","Interaction weakens as distance grows."]]],
wk:["Rural counties don't have internet because they are in the country.","That restates the question: 'rural' and 'in the country' mean the same thing. You need the reason (homes far apart, costly cable) and the chain that leads to fewer connections."],
mw:"It names the reason (low density, high cost per customer), proves it with map numbers (Dry Creek 44% vs. Calder City 6%), and explains the chain that leaves rural homes unconnected.",
fr:"T1- Rural counties have higher rates because ___. E2- For example, in ___ (___%) homes are ___, so a company must ___. A3- Because ___, companies ___, which leaves ___.",
qc:["Why does one mile of internet cable cost MORE per customer in a rural county?",["Fewer homes are spread along that mile","Rural land is more expensive","Cable is more expensive in the countryside"],0,"Low population density means each mile of cable reaches fewer paying customers."]},

{v:"Explain",
q:"Using the map, explain ONE limitation of using only the state-level data to make decisions about improving internet access in Calderon.",
sk:"Data limits: scale and averages",
s:[["What does the state number hide? Think about what you can't see at the state scale.",["One number for 12 very different counties.","An average smooths over the places that are doing badly."]],["Prove it with the map. Compare 18% to specific counties.",["Dry Creek is 44%, Northfork is 41%, but Calder City is 6%.","Eight of the 12 counties are above the state figure."]],["Why would that lead to a bad decision?",["Who gets the money, and where does it get built?","Planners might spread funds evenly or underestimate the need, missing the rural counties that need help most."]]],
r:{m:"all",i:[["States the limitation: one state value is an average that hides or masks differences between counties",/hide|hidden|mask|miss|average|generaliz|overlook|ignore|can.t (see|tell)|cannot (see|tell)|doesn.t show|does not show|not show|lose|one (value|number)|single|assum|same everywhere|everyone|uniform|vari|differ/i,"Name the limit: 18% is an average that hides the big differences between counties."],["Uses map evidence and explains the effect on a decision (wrong places, spread too thin, underestimating need)",/18|44|41|38|33|dry creek|northfork|pine ridge|ashby|calder|westbrook|county|counties|rural|metro|decision|decide|money|fund|spend|build|invest|target|priorit|waste|wrong|need|underestimat/i,"Use the map and the decision: Dry Creek is 44% while the state is 18%, so money could go to the wrong places or the need could be underestimated."]]},
mo:"T1- One limitation is that a single state-level number is an average that hides the differences inside the state, so planners can't see where the problem actually is. E2- The map shows Calderon at 18%, but at the county scale Dry Creek is 44% and Northfork is 41% while Calder City is only 6%, and eight of the 12 counties are above the state figure. A3- Because the 18% figure makes the whole state look moderately connected, a government using it alone might spread money evenly or underestimate the need, instead of targeting the rural counties where nearly half of households lack internet.",
b:["scaleshift","scale"],
th:"But 18% is the real number. How can a true number be a limitation?",
co:"It IS true, and it's still a problem. A true average can hide true extremes. Nobody in Calderon actually lives in an '18% county.' Compare that number to the counties and you'll see what gets lost.",
kq:"If the governor only looked at the left panel (18%), what important thing would they miss, and how could that lead to a bad decision? Use numbers from the map.",
ml:["How averages hide the extremes",["A state-level figure is a population-weighted average: counties with more people count more, so the crowded metro counties pull Calderon down to 18%.","Eight of the 12 counties are above 18%, and two are above 40%. The average doesn't describe any real county well.","If leaders only see 18%, they may think the problem is mild or spread money evenly, when it's concentrated in rural counties.","A good limitation answer names what's hidden, proves it with a number from the map, and says what bad decision could follow.","This is a scale problem: data reported at a big scale can't guide decisions that need to be made at a small scale."],[["Average","A single number that summarizes many values, and can hide the extremes."],["Limitation","Something a source can't show that you'd need to answer the question."],["Scale of analysis","The size of the units in the data."]]],
wk:["The state data is a limitation because it is from 2020 and might be out of date.","The question asks about using STATE-LEVEL data, so the limitation should be about scale, not the year. Compare 18% to the county values and explain what gets hidden."],
mw:"It names what's hidden (county differences), proves it with map numbers (18% vs. 44% and 6%), and explains the decision that could go wrong.",
fr:"T1- One limitation is that the state figure of ___% is an average that hides ___. E2- For example, the map shows ___ at ___% while ___ is only ___%. A3- Because of this, a government using the state number alone might ___, instead of ___.",
qc:["Why is Calderon's state figure (18%) lower than most of its counties?",["Most people live in the low-rate metro counties, which pull the average down","Rural counties were left out of the state count","The state used a different year than the counties"],0,"A state value is weighted by population, so the crowded metro counties dominate it."]},

{v:"Explain",
q:"Explain how a state government agency could use a geographic information system (GIS) to decide where to build new broadband internet infrastructure.",
sk:"Applying geospatial technology",
s:[["What does GIS actually DO? Hint: think of clear sheets stacked on top of each other.",["GIS stores different kinds of map data as layers that can be combined.","It's software for analyzing where things are, not just a GPS dot."]],["Name two or three specific layers the agency would stack.",["This county map (percent without internet) is one layer.","Others: existing fiber lines, population density, income, school and clinic locations."]],["Explain how the overlap leads to a decision.",["Where several layers line up (high need + no fiber + a school), that's a priority.","Use 'so' or 'which lets them…' to reach the decision."]]],
r:{m:"all",i:[["Describes what GIS does: layers, overlays, or combines different spatial data sets to analyze them",/layer|overlay|combin|stack|put together|data ?sets?|data (on|about|for)|add(ing)? (a )?map|compare|analy|query|pattern/i,"Say what GIS does: it layers different map data (need, existing lines, population, income) on top of each other."],["Explains how that analysis leads to a location decision (where need is highest, where building is cheapest, which places to prioritize)",/where|locat|place|priorit|target|choos|decid|identif|find|pinpoint|highest|most|need|cost|cheap|because|so |which lets|allow/i,"Finish the chain: where the layers overlap shows where to build first."]]},
mo:"T1- A state agency could use GIS to layer several kinds of spatial data on top of each other and find the best places to build. E2- For example, it could overlay this county map of households without internet with layers showing existing fiber-optic lines, population density, household income, and the locations of schools and clinics. A3- Where the layers overlap, such as a rural county like Northfork with 41% unconnected, no nearby fiber, and a school, the agency can see where need is highest and building is possible, so it can target its limited money there first.",
b:["gis"],
th:"Isn't GIS the same thing as GPS, like on my phone?",
co:"Close cousins, but no. GPS tells you WHERE one thing is. GIS is the software that stacks thousands of locations and other data into layers so you can analyze them together. The layering is what the question is after.",
kq:"How would a government use GIS mapping software to figure out where to build new internet lines? Name the layers it would combine and how that points to a decision.",
ml:["GIS in one picture: stacked layers",["A geographic information system (GIS) stores map data in layers, each about one thing: roads, counties, population, income, existing cables.","Think of clear plastic sheets stacked on a light table. Where the shapes line up, you learn something new.","The agency could stack the 'percent without internet' layer with 'existing fiber lines' and 'population density' to find counties that are both unconnected and reachable.","It can then ask the software questions, like 'show every county above 30% that has a school and is within 20 miles of a fiber line.'","The answer is a map of priority sites, which turns a huge decision into a targeted list."],[["GIS","Software that stores, layers, and analyzes map data."],["Layer","One set of map data, like roads or income, that can be stacked with others."],["GPS","Satellites that give the exact location of a device."]]],
wk:["The government could use GPS to find out where people live and then build internet there.","That's GPS (finding locations), not GIS (layering and analyzing data). It also skips how the agency would decide WHICH places get built first."],
mw:"It says what GIS does (layers data), names specific layers tied to the map, and explains how the overlap leads to choosing where to build.",
fr:"T1- A state agency could use GIS to ___ different kinds of map data, such as ___. E2- For example, it could combine this county map with layers showing ___ and ___. A3- Where those layers overlap, the agency can see ___, so it can decide to ___.",
qc:["The key feature of GIS that helps planners is that it…",["combines many data layers on one map for analysis","tells a phone its exact location","takes photos of Earth from satellites"],0,"GIS stacks layers of spatial data. GPS gives locations; remote sensing takes the images."]},

{v:"Describe",
q:"Describe ONE way a dot density map or a graduated symbol map of the same data would show the pattern differently from the county choropleth.",
sk:"Comparing thematic map types",
s:[["Pick one map type and say what it shows: a percent or a count?",["Choropleths usually show rates (percent). Dots and sized circles usually show numbers (how many).","Choose: dot density (one dot = so many households) or graduated symbol (bigger circle = more households)."]],["Describe what would look different on the Calderon map.",["Calder City is only 6% but has the most people, so it could have MANY dots or a big circle.","Dry Creek is 44% but has few people, so it might have few dots or a small circle."]],["Say why that difference matters for the viewer.",["It shows WHERE THE MOST unconnected households are, not where the RATE is highest.","Dots can also show clustering inside a county instead of one flat color."]]],
r:{m:"all",i:[["Names the map type: dot density or graduated/proportional symbol",/dot|graduated|proportional|symbol|circle/i,"Name your map: a dot density map or a graduated symbol map."],["Describes a real difference: it shows counts (number of households) instead of a rate, so metro counties could look bigger; or dots show where people cluster inside a county",/number|count|how many|total|actual|raw|rate|percent|per ?cent|even|spread|within|inside|where (in|people|the)|concentrat|cluster|bigger|larger|smaller|size|propor/i,"Describe the difference: it would show the NUMBER of unconnected households, so Calder City (6% but many people) might show many dots or a big circle."]]},

return `<div class="panel" style="text-align:center"><h2 class="big" tabindex="-1">${un.length?'Progress report':'Stage clear!'}</h2><div class="stars" aria-label="${sc} of ${n}">${'★'.repeat(sc)}<span style="opacity:.25">${'★'.repeat(n-sc)}</span></div><div class="rank">${sc}/${n} points · Rank: ${rank}</div></div>
<div class="panel"><span class="tag px" style="color:var(--gr)">Nailed it</span>${ok.length?`<ul class="res">${ok.map(([p,i])=>`<li><b style="color:var(--gr)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span></li>`).join('')}</ul>`:'<p class="note">No points yet. Every replay makes it easier!</p>'}</div>
<div class="panel"><span class="tag px" style="color:var(--rd)">Review these</span>${no.length?`<ul class="res">${no.map(([p,i])=>`<li><b style="color:var(--rd)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br>${chips(p.b)}<button class="link" data-a="go" data-k="${i+1}">Revisit Part ${L(i)}</button></li>`).join('')}</ul>`:'<p>Nothing to review so far. 🏆</p>'}</div>
${un.length?`<div class="panel"><span class="tag px" style="color:var(--yl)">Not tried yet</span><ul class="res">${un.map(([p,i])=>`<li><b style="color:var(--yl)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br><button class="link" data-a="go" data-k="${i+1}">Go to Part ${L(i)}</button></li>`).join('')}</ul></div>`:''}
${no.length?`<div class="row"><button class="btn c" data-a="retry">↻ Retry what I missed ▸</button></div>`:''}${bossV()}<div class="row"><button class="btn" data-a="start" data-i="${S.fi}">↻ Replay</button>${FRQ.length>1?`<button class="btn m" data-a="start" data-i="${(S.fi+1)%FRQ.length}">Try “${esc(FRQ[(S.fi+1)%FRQ.length].t)}” ▸</button>`:''}<button class="btn o" data-a="home">Menu</button></div>`}
/* ===== Events ===== */
let opener;function openBG(k){opener=document.activeElement;app.setAttribute('aria-hidden','true');document.getElementById('shT').textContent=BG[k].t;document.getElementById('shB').innerHTML=BG[k].s.map(x=>`<li>${esc(x)}</li>`).join('');sh.classList.add('on');sh.querySelector('[data-a=x]').focus()}
function closeBG(){if(!sh.classList.contains('on'))return;sh.classList.remove('on');app.removeAttribute('aria-hidden');opener&&opener.focus()}
document.addEventListener('click',e=>{if(e.target==sh)return closeBG();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);
case 'home':S.k=-1;return render(1);
case 'go':return go(+b.dataset.k);
case 'bg':return openBG(b.dataset.k);
case 'x':return closeBG();
case 'nt':S.nt[j].o=1;return render();
case 'hint':{const k=S.k-1;S.p[k].h[j+'-'+b.dataset.m]=1;return render()}
case 'step':S.p[i].st++;return render();
case 'card':S.p[i].c=+b.dataset.c;return render(1);
case 'mcq':S.p[i].q=+b.dataset.o;return render();
case 'boss':{const f=S.p.map((x,k)=>k),miss=f.filter(k=>!S.p[k].ok),rest=f.filter(k=>S.p[k].ok);S.bo={l:miss.concat(rest).slice(0,3),k:0,s:null,r:0};return render()}
case 'bq':{const B=S.bo;if(B.s==null&&+b.dataset.o==0)B.r++;if(B.s!==0)B.s=+b.dataset.o;return render()}
case 'bn':S.bo.k++;S.bo.s=null;return render();
case 'frame':{const t=document.getElementById('ans'),f=S.f.p[i].fr;t.value=t.value.trim()?t.value.trim()+'\n'+f:f;S.p[i].a=t.value;t.focus();const c=t.value.indexOf('___',t.value.length-f.length);if(c>=0)t.setSelectionRange(c,c+3);return}
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.includes('___')){st.w=1;render();return document.getElementById('ans').focus()}st.w=0;if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.c=5;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render(1)}
case 'rev':S.p[i].ck=0;S.p[i].done=0;S.p[i].c=4;render(1);return document.getElementById('ans').focus();
case 'next':{const w=S.p[i].done;S.p[i].done=1;S.p[i].ok=earned(i);if(!w)S.cb=S.p[i].ok?S.cb+1:0;return go(i+2)}
case 'cf':S.p[i].cf=+b.dataset.k;return render();
case 'retry':{const m=S.p.findIndex(x=>x.done&&!x.ok);S.p[m].c=4;S.p[m].ck=0;S.p[m].done=0;return go(m+1)}
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeBG();else if(e.key=='Tab'&&sh.classList.contains('on')){e.preventDefault();sh.querySelector('[data-a=x]').focus()}});
render(1);
</script>
</body>
</html>
