<script>
const BG={
frq:{t:"How AP FRQs are scored",s:["Each part (A, B, C…) is worth 1 point and is scored on its own. A mistake in Part B can't cost you Part C.","Readers look for the right idea, clearly linked to the question. Fancy writing earns nothing extra.","No thesis, intro, or conclusion needed. Label each part and answer it directly.","Write in complete sentences and do what the task verb asks (Identify, Describe, or Explain).","Never leave a part blank. A wrong answer costs nothing."]},
tea:{t:"The TEA method",s:["T1- Topic: your reason in general words. Turn the question into your claim.","E2- Evidence: the specific proof, like a place, number, or example, ideally from the map or table.","A3- Analysis: why it matters. Explain HOW or WHY your proof backs up your reason, using “because…” or “which leads to…”.","Label each piece T1-, E2-, A3- so the reader can find every point. Describe answers need T1 and E2 plus a short A3. Explain answers need a strong A3."]},
readmap:{t:"How to read a map",s:["Read the title first. It tells you the topic, place, and time.","Check the legend so you know what each color and symbol means.","Look for patterns: what's clustered, what's connected, what points where?","Then ask WHY: who made this, and what story is it telling?"]},
readtable:{t:"How to read a data table",s:["Read the title and every column header, including units (%, per 1,000).","Find the highest and lowest value in each column.","Compare columns: when one goes up, does another go up or down?","When there are two years, look for change over time."]},
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]}
};
const VERBS={
Identify:{d:"Name it. A word or short phrase is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","One sentence max."]},
Describe:{d:"Paint the picture. Give the specific characteristics or pattern, with details someone could check.",l:["Use evidence: a place, a number, or a feature from the stimulus.","Say what it IS or what it LOOKS LIKE. You don't need a deep “why.”","About 1–2 sentences. Use TEA: Topic + Evidence, then a quick Analysis."]},
Explain:{d:"Tell HOW or WHY. Connect a cause to an effect so a reader sees the reasoning, not just a fact.",l:["Use linking words: “because…”, “which leads to…”, “as a result…”.","A fact alone won't score. You need the chain of reasoning.","About 2–3 sentences. Use full TEA."]}
};
const FRQ=[];
function addBG(o){Object.assign(BG,o)}
function addFRQ(f){FRQ.push(f)}
const UNIT="Unit 5 · Agriculture and Rural Land Use";
addBG({
vonthunen:{t:"The von Thünen model",s:["Johann Heinrich von Thünen was a German landowner who published The Isolated State in 1826 to explain why farms near a city grow different things than farms far away.","He imagined one market city on a flat plain with the same soil and climate everywhere, no rivers or roads, and farmers hauling goods by wagon.","His rings, from the center out: market gardening and dairy, forest (for firewood and lumber), grains and field crops, then livestock ranching.","The big idea: the farther you are from the market, the more it costs to get your product there, so land use changes with distance.","Real places never match the rings exactly, but the logic of distance and transport cost still shows up everywhere."]},
bidrent:{t:"Bid-rent & transport cost",s:["Bid-rent is the most a user is willing to pay for land at a given distance from the market.","Land near the city is expensive because many people want it; land far away is cheap.","A farmer whose product is perishable (milk, lettuce) or bulky (timber) saves the most money by being close, so they can outbid others for near-city land.","A rancher's cattle can walk or ride to market cheaply, so the rancher can't outbid anyone near the city and ends up on cheap distant land.","Put together, those bidding wars create the rings."]},
foodchain:{t:"Global food supply chains",s:["A commodity chain is every step a product takes from the farm to your plate: growing, processing, shipping, selling.","Refrigerated trucks and containers (the “cold chain”) keep food fresh for thousands of miles, so perishables no longer have to be grown nearby.","Interstate highways, container ships, and air freight make long-distance shipping cheap and fast.","That's why a U.S. grocery store sells Chilean grapes in January and Mexican tomatoes year-round.","Large agribusiness companies often own several steps of the chain, which is called vertical integration."]},
greenrev:{t:"The Green Revolution",s:["Starting in the 1940s–1960s, scientists like Norman Borlaug bred high-yield varieties of wheat and rice.","Those seeds only produce big harvests with lots of chemical fertilizer, pesticides, and irrigation water.","Mexico, India, and the Philippines sharply raised their food output, and famine deaths dropped.","Costs: polluted water, drained aquifers, lost crop diversity, and debt for poor farmers who couldn't afford the inputs.","Sub-Saharan Africa benefited least, partly because its main crops and dry climates didn't fit the new seeds."]},
agenviro:{t:"Farming's environmental costs",s:["Fertilizer runoff carries nitrogen and phosphorus into rivers, feeding algae blooms that create oxygen-poor “dead zones,” like the one in the Gulf of Mexico fed by the Mississippi River.","Pumping groundwater for irrigation faster than rain refills it depletes aquifers, such as the Ogallala Aquifer under the U.S. Great Plains.","Irrigating in dry climates leaves salt behind as water evaporates (salinization), which can ruin soil.","Plowing and bare fields speed up soil erosion; the 1930s Dust Bowl is the classic example.","Clearing forest for cattle pasture and soybeans drives deforestation in the Amazon."]},
intensext:{t:"Intensive vs. extensive, commercial vs. subsistence",s:["Intensive agriculture puts lots of labor or money into a small piece of land: dairy farms, vegetable farms, rice paddies.","Extensive agriculture uses a lot of land with little labor per acre: cattle ranching, shifting cultivation, nomadic herding.","Commercial farmers grow crops to sell; subsistence farmers grow food mainly to feed their own families.","Most farms in wealthy countries are commercial; many farms in less developed countries are still subsistence or a mix.","Von Thünen's model assumes commercial farmers selling to one market, which is why it fits some places better than others."]}
});
addFRQ({k:"Practice FRQ · Diagram stimulus",
t:"Rings of Farmland",
d:"The von Thünen model, transport costs, and how modern farming bends the rings.",
u:"Unit 5",
fmt:"One stimulus (like Question 2)",
st:"Agricultural Land Use Around Aldmere, a Fictional Market City",
intro:"This diagram shows land use around a market city in a fictional farming region. Farmers sell their products in the city of Aldmere. A river flows through the region, and a highway crosses it from west to east.",
stim:"<svg viewBox=\"0 0 340 320\" role=\"img\" aria-label=\"Diagram of a fictional farming region drawn in the style of the von Thünen model. A star marks the market city of Aldmere at the center. Four concentric rings surround it: ring 1 dairy and vegetables, ring 2 timber and forest, ring 3 grains and field crops, ring 4 cattle ranching. A river runs from the top edge through the city to the bottom edge, and rings 1 and 3 are stretched into long ovals along the river. A straight highway runs left to right through the city. Where the highway crosses ring 3 on the right sits the secondary market town of Crossford, with a small dairy and vegetable zone around it.\">\n<rect width=\"340\" height=\"320\" fill=\"#0a1d3a\"/>\n<g stroke=\"#7fe8ff\" stroke-width=\"1.2\"><circle cx=\"170\" cy=\"162\" r=\"142\" fill=\"#24304f\" stroke-width=\"1.6\"/>\n<ellipse cx=\"170\" cy=\"162\" rx=\"26\" ry=\"138\" fill=\"#ffd23f\" opacity=\".22\" stroke=\"none\"/>\n<circle cx=\"170\" cy=\"162\" r=\"104\" fill=\"#0a1d3a\"/><circle cx=\"170\" cy=\"162\" r=\"104\" fill=\"#ffd23f\" opacity=\".38\" stroke=\"none\"/>\n<circle cx=\"170\" cy=\"162\" r=\"66\" fill=\"#0a1d3a\"/><circle cx=\"170\" cy=\"162\" r=\"66\" fill=\"#3ddc84\" opacity=\".42\" stroke=\"none\"/>\n<ellipse cx=\"170\" cy=\"162\" rx=\"18\" ry=\"64\" fill=\"#ff3fa4\" opacity=\".32\" stroke=\"none\"/>\n<circle cx=\"170\" cy=\"162\" r=\"34\" fill=\"#0a1d3a\"/><circle cx=\"170\" cy=\"162\" r=\"34\" fill=\"#ff3fa4\" opacity=\".55\" stroke=\"none\"/></g>\n<path d=\"M166 0 C160 60 182 110 170 162 S176 270 172 320\" fill=\"none\" stroke=\"#22e5ff\" stroke-width=\"4\" opacity=\".9\"/>\n<line x1=\"0\" y1=\"162\" x2=\"340\" y2=\"162\" stroke=\"#fff\" stroke-width=\"3\"/><line x1=\"0\" y1=\"162\" x2=\"340\" y2=\"162\" stroke=\"#0c0920\" stroke-width=\"1\" stroke-dasharray=\"6 5\"/>\n<circle cx=\"256\" cy=\"162\" r=\"13\" fill=\"#ff3fa4\" opacity=\".6\" stroke=\"#ffb3dc\" stroke-width=\"1\"/>\n<rect x=\"252\" y=\"158\" width=\"8\" height=\"8\" fill=\"#fff\" stroke=\"#000\"/>\n<polygon points=\"170,153 172.4,158.8 178.6,159.2 173.8,163.2 175.3,169.3 170,166 164.7,169.3 166.2,163.2 161.4,159.2 167.6,158.8\" fill=\"#ffd23f\" stroke=\"#000\" stroke-width=\"1\"/>\n<g font-family=\"Chakra Petch,sans-serif\" font-size=\"9\" font-weight=\"700\" fill=\"#fff\" stroke=\"#0c0920\" stroke-width=\"3\" paint-order=\"stroke\">\n<text x=\"181\" y=\"157\">Aldmere</text><text x=\"256\" y=\"146\" text-anchor=\"middle\">Crossford</text>\n<g fill=\"#ffe7a6\" font-size=\"8.5\" text-anchor=\"end\"><text x=\"170\" y=\"182\" text-anchor=\"middle\">1 dairy</text><text x=\"170\" y=\"191\" text-anchor=\"middle\">&amp; veg.</text><text x=\"158\" y=\"201\">2 timber</text><text x=\"158\" y=\"232\">3 grains &amp;</text><text x=\"158\" y=\"242\">field crops</text><text x=\"158\" y=\"268\">4 cattle ranching</text><text x=\"256\" y=\"186\" text-anchor=\"middle\">dairy &amp; veg.</text></g>\n<g font-size=\"8\" font-style=\"italic\" fill=\"#7fb6ff\"><text x=\"176\" y=\"30\">Tarn River</text><text x=\"4\" y=\"156\" fill=\"#ffe7a6\" font-style=\"normal\">HIGHWAY</text></g></g>\n</svg><div class=\"legend\"><span><i style=\"background:#ff3fa4\"></i>1 Dairy &amp; vegetables</span><span><i style=\"background:#3ddc84\"></i>2 Timber / forest</span><span><i style=\"background:#ffd23f\"></i>3 Grains &amp; field crops</span><span><i style=\"background:#24304f;border:1px solid #7fe8ff\"></i>4 Cattle ranching</span><span><i style=\"background:#22e5ff\"></i>River</span><span><i style=\"background:#fff\"></i>Highway / town</span><span><i style=\"background:#ffd23f;border-radius:50%\"></i>Market city</span></div><p class=\"src\">Diagram created for practice. Aldmere, Crossford, and the Tarn River are fictional. Simplified and not to scale; lighter shading shows where a ring is stretched.</p>",
bg:["vonthunen","bidrent","readmap"],
nt:[["Start at the star and move outward. What's in each ring, and how does each product get to the city?","Ring 1: dairy and vegetables. Ring 2: timber. Ring 3: grains. Ring 4: cattle. Milk and lettuce spoil fast, logs are heavy, grain keeps for months, and cattle can walk. That order is the whole model."],["Look at the lighter shading along the river. Which rings got stretched, and in which direction?","Rings 1 and 3 are pulled into long ovals that follow the river north and south. The rings aren't perfect circles anymore. Something about the river makes distance matter less."],["Find Crossford on the highway. What's around it, and what does it remind you of?","A tiny pink dairy-and-vegetable zone sits around Crossford, inside the grain ring. It looks like a mini version of ring 1. A second market has started its own set of rings."]],
m:20,
p:[
{v:"Identify",
q:"Identify the agricultural activity found in ring 1, the ring closest to the market city.",
sk:"Reading the von Thünen rings",
s:[["Find the star, then look at the first ring around it. Read the label (and the legend).",["The legend lists each ring by number.","Ring 1 is pink and labeled “dairy & veg.”"]],["Say it as a farming activity, in a short phrase.",["Geographers call growing vegetables for a nearby city “market gardening.”","Try: “Ring 1 is ___ farming and ___.”"]]],
r:{m:"any",i:[["Names dairy farming or vegetable/market gardening",/dairy|milk|(milk|dairy) cows?|vegetable|veg|garden|fresh produce|produce (like|such|farm)|(grow(ing|s)?|sell(ing|s)?) produce|fruit|truck farm|horticultur/i,"Name what the label says: dairy farming and vegetable (market) gardening."],["Describes it as perishable or intensive farming near the city",/perishable|fresh|intensive|spoil/i,"Say what kind of farming it is: fresh, perishable products like milk and vegetables."]]},
mo:"Ring 1 is dairy farming and market gardening (growing fresh vegetables) for the city.",
b:["vonthunen"],
th:"Is this a trick? It literally says it on the diagram.",
co:"Not a trick! Identify questions are the free point. Read the label, say it in a full phrase, and move on. Just don't leave it blank.",
kq:"What kind of farming happens in the ring right next to the city? Name it.",
ml:["Identify = read it off the diagram",["Identify questions ask you to name something, not explain it. One clear phrase earns the point.","On a von Thünen-style diagram, the ring touching the city holds the products that must reach the market fastest.","Here ring 1 is labeled dairy and vegetables. Geographers call vegetable farming for a nearby city market gardening (or truck farming).","Writing “milk and fresh vegetables for the city” is also fine. Specific beats vague."],[["Market gardening","Growing vegetables and fruit to sell fresh in a nearby city."],["Dairy farming","Raising cows (or goats) for milk, cheese, and butter."]]],
wk:["Farms.","Every ring is farms. Identify means name the specific activity: dairy and vegetable (market) gardening."],
mw:"It names the exact activity on the label (dairy and vegetables) and uses the geographer's term for it (market gardening).",
fr:"Ring 1, closest to the city, is used for ___ farming and ___.",
qc:["Growing fresh vegetables to sell in a nearby city is called…",["market gardening","ranching","shifting cultivation"],0,"Market gardening (truck farming) is the fresh-produce zone right outside a city."]},
{v:"Explain",
q:"Explain why the agricultural products grown closest to the market are the most perishable or the most expensive to transport.",
sk:"Bid-rent and transport cost",
s:[["Name the general rule. What changes as you get farther from the market?",["Think about the cost of hauling a product to the city.","Transport cost rises with distance, and land cost falls with distance."]],["Give proof with a specific product from ring 1 or ring 2.",["Milk and vegetables spoil in a day or two; logs are heavy and bulky.","Compare with grain (keeps for months) or cattle (can walk to market)."]],["Explain why that means those farmers END UP near the city.",["Who saves the most money by being close? Who can afford to pay the high rent?","Dairy farmers can pay (bid) more for near-city land because being close saves them the most."]]],
r:{m:"all",i:[["Names the trait: perishable (spoils fast) or heavy/bulky products like milk, vegetables, or timber",/perish|spoil|\brot|go(es)? bad|fresh|milk|dairy|vegetable|bulky|heavy|weigh|timber|wood/i,"Name the trait: milk and vegetables spoil fast, and timber is heavy and bulky."],["Explains the logic: transport cost rises with distance, so these farmers gain the most from being close and can outbid others for near-city land (bid-rent)",/(transport|ship|haul|carr(y|ied|ying)|truck|wagon|travel|trip|deliver|move|bring).{0,60}(\bfar(ther|thest)?\b|further|distance|\blong\b|mile|away|cost|expens|money|\bpay)|(\bfar(ther|thest)?\b|further|distance|\blong\b|mile|away).{0,60}(transport|ship|haul|carr(y|ied|ying)|travel|trip|deliver|cost|expens|money|\bpay|spoil|\brot|go(es)? bad|went bad)|\bbid|\brent\b|afford|outbid|pay (more|the most|higher)|\bsav(e|es|ing)\b/i,"Explain the money logic: transport costs rise with distance, so these farmers save the most by being close and can pay the high rent near the city."]]},
mo:"T1- Products that spoil quickly or are heavy to haul are grown closest to the market because transport cost rises with distance from the city. E2- Milk and fresh vegetables can rot within a day or two of harvest, and timber is bulky and heavy to carry by wagon, while grain keeps for months and cattle can walk to market. A3- Because dairy farmers and market gardeners lose the most money from a long trip, they gain the most from being near the city and can afford to pay (bid) more for the expensive land there, which pushes grain and ranching farther out.",
b:["bidrent","vonthunen"],
th:"Wouldn't EVERY farmer want to be close to the city? Why does it matter what they grow?",
co:"Right, everyone wants to be close! But land near the city is expensive, so the question becomes: who benefits enough to pay for it? Think about who loses the most if their product takes a week to arrive.",
kq:"Why do milk, vegetables, and timber end up right next to the city, while grain and cattle end up far away? Explain the cost logic.",
ml:["Bid-rent: who can pay for land near the city?",["Every mile a product travels costs money (fuel, wagons, drivers), so transport cost rises with distance from the market.","Land near the market is expensive because lots of people want it; land far away is cheap.","A dairy farmer whose milk spoils in a day saves the most by being close, so they can outbid a wheat farmer for near-city land.","A rancher's cattle can walk to market, so the rancher gains little from being close and settles for cheap distant land.","Those bidding wars sort farmers into rings by distance."],[["Transport cost","The money it takes to move a product to market."],["Bid-rent","The most a land user is willing to pay for land at a given distance from the market."],["Perishable","Spoils quickly."]]],
wk:["Farmers near the city grow what city people want to buy.","That doesn't explain distance. City people buy bread and beef too, but grain and cattle come from far away. You need the transport-cost and spoilage logic."],
mw:"It states the rule (transport cost rises with distance), gives specific products as proof (milk, vegetables, timber vs. grain and cattle), and explains the bidding result (perishable-product farmers outbid others for near-city land).",
fr:"T1- Products that ___ or are ___ are grown closest to the market because ___. E2- For example, ___ while ___. A3- Because these farmers ___, they can pay ___, which pushes ___.",
qc:["In von Thünen's model, which cost rises as a farm gets farther from the market?",["transport cost","land cost","labor cost"],0,"Farther away means a longer haul. Land cost actually falls with distance."]},
{v:"Describe",
q:"Using the diagram, describe how the river changes the pattern of land use compared with the classic von Thünen model.",
sk:"Modifying the model with a transport route",
s:[["State what the classic model looks like, then what's different here.",["The classic rings are perfect circles on a flat plain with no rivers.","On this diagram, look at the lighter shading along the river."]],["Point to specific evidence on the diagram.",["Rings 1 and 3 are stretched into long ovals that follow the river north and south of Aldmere.","Dairy and vegetables reach into the timber ring along the river; grain reaches into the ranching ring."]],["Say WHY a river would do that.",["Moving goods by boat or barge is cheaper and faster than by wagon.","Along the river, a farm that is far in miles is close in cost, so it can act like a near-city farm."]]],
r:{m:"all",i:[["Describes the change with diagram evidence: rings (1 and 3) are stretched/elongated into ovals along the river instead of perfect circles",/stretch|elongat|extend|oval|longer|further|farther|along the river|follow|not (perfect )?circle|no longer circ/i,"Describe what you see: rings 1 and 3 are stretched into long ovals that follow the river, so the rings aren't perfect circles."],["Links it to cheaper or faster transport along the river (boats/barges lower transport cost)",/cheap|cost|fast|quick|easy|easier|boat|barge|ship|transport|move|haul/i,"Add why: shipping by boat along the river is cheaper and faster, so farms along the river act like they're closer to the city."]]},
mo:"T1- In the classic model the rings are perfect circles, but on this diagram the river stretches the rings into long ovals. E2- The lighter shading shows ring 1 (dairy and vegetables) extending north and south of Aldmere along the Tarn River into the timber ring, and ring 3 (grains) extending along the river into the ranching ring. A3- This happens because moving goods by boat along the river is cheaper and faster than hauling them by wagon, so a farm that is far away in miles but on the river is “close” in transport cost and can grow the same products as farms next to the city.",
b:["vonthunen","bidrent"],
th:"The river is just... water. How does it change where farms are?",
co:"Think of the river as a free highway for boats. Von Thünen's farmers used slow wagons on dirt roads, so a river changes the math completely. Follow the lighter shading and you'll see it.",
kq:"The rings aren't perfect circles here. Describe how the river bends them, using what you see on the diagram, and say why.",
ml:["Rivers and the rings",["Von Thünen's original model assumed a flat plain with no rivers or roads, so every direction cost the same and the rings came out as perfect circles.","He himself noted that a navigable river would change things: boats carry heavy loads far more cheaply than wagons.","Along the river, transport cost per mile is lower, so each ring stretches outward in a long oval following the water.","On this diagram, rings 1 and 3 are stretched along the Tarn River, so dairy farms and grain fields reach farther north and south than east and west."],[["Navigable river","A river deep and calm enough for boats to carry cargo."],["Elongated","Stretched out into a long shape."]]],
wk:["The river gives the farms water, so farmers near the river can grow more crops.","That's irrigation, not the model. The question is about the SHAPE of the rings. Describe how they are stretched along the river and connect it to cheaper transport by boat."],
mw:"It contrasts the classic circles with the stretched ovals, cites the exact rings and direction from the diagram, and explains the cause (cheaper boat transport makes river farms “closer” in cost).",
fr:"T1- In the classic model the rings are ___, but here the river ___. E2- On the diagram, ring ___ and ring ___ are stretched ___ along the river. A3- This happens because transport by ___ is ___, so farms along the river ___.",
qc:["Why does a navigable river stretch the von Thünen rings outward along its course?",["Boats move goods more cheaply than wagons, so river farms are “closer” in cost","River water makes crops grow faster","Farmers like living near water"],0,"The model is about transport cost. Cheap boat transport lowers the cost of distance along the river."]},
{v:"Explain",
q:"Explain how the secondary market town of Crossford along the highway shows how modern transportation changes the von Thünen model.",
sk:"Modern transport and multiple markets",
s:[["Start with what the classic model assumes about markets and roads.",["Von Thünen assumed ONE market city and no highways.","Count the markets on this diagram: Aldmere AND Crossford."]],["Describe exactly what's around Crossford on the diagram.",["A small dairy-and-vegetable zone sits around Crossford, inside the grain ring.","It's like a miniature ring 1 that belongs to a second market."]],["Explain how the highway caused that.",["Fast trucks on the highway cut transport time and cost, letting a town on the highway grow into a market of its own.","Multiple markets mean overlapping mini-ring patterns instead of one neat set of circles."]]],
r:{m:"all",i:[["Identifies what Crossford shows: a second market with its own mini dairy/vegetable zone (ring), breaking the one-market assumption",/second|another|two market|multiple|more than one|mini|(small|smaller|little) (ring|version|set|zone|dairy|market|copy)|own ring|new ring|its own|own market|new market|one market|single market|one cent(er|ral)/i,"Point out Crossford: it's a SECOND market with its own tiny dairy-and-vegetable ring inside the grain ring."],["Explains the role of modern transport: highways/trucks make travel faster and cheaper, so markets and rings form in new places",/highway|road|truck|car|fast|quick|speed|cheap|lower|cost|time|access|reach|connect/i,"Explain the highway's role: trucks move goods fast and cheap, so a town on the highway can become its own market with its own rings."]]},
mo:"T1- Crossford shows that modern transportation breaks the model's assumption of a single market with one set of rings. E2- On the diagram, a small dairy-and-vegetable zone surrounds Crossford where the highway crosses ring 3, forming a miniature ring 1 inside the grain zone. A3- Because trucks on the highway move goods quickly and cheaply, Crossford grew into a second market of its own, so the region now has overlapping sets of rings instead of one neat set of circles around Aldmere.",
b:["vonthunen","foodchain"],
th:"Why does one little town matter? It's tiny compared with the city.",
co:"Size isn't the point. Count the markets: von Thünen allowed exactly one. Crossford is a second market with its own baby ring. Ask what let a second market appear there and not somewhere else.",
kq:"There's a second town on the highway with its own mini dairy zone. Explain how that shows modern roads changing the model.",
ml:["Highways, trucks, and extra markets",["Von Thünen's model assumes one market city, no roads, and wagons, so there is one set of rings.","Modern highways let trucks move goods fast and cheaply in straight lines, so places along a highway are “closer” in time than their miles suggest.","A town on the highway, like Crossford, can collect farm products and grow into a secondary market with its own small rings around it.","In the real world, cities have many suburbs and towns, each pulling the rings in its own direction, so the pattern looks more like overlapping blobs than circles."],[["Secondary market","A smaller town where farmers also sell, in addition to the main city."],["Assumption","Something a model treats as true to keep it simple."]]],
wk:["The highway makes it easier for people to drive to Aldmere.","That's about commuters, not land use. The question wants what Crossford shows about the model: a second market with its own mini ring, created because trucks on the highway cut transport cost."],
mw:"It names the broken assumption (one market), uses diagram evidence (the mini dairy zone around Crossford on the highway), and explains the cause (fast, cheap trucking creates a second market and overlapping rings).",
fr:"T1- Crossford shows that modern transportation ___ the model's assumption of ___. E2- On the diagram, ___ surrounds Crossford where ___. A3- Because trucks on the highway ___, Crossford became ___, so the region has ___.",
qc:["Which assumption of the von Thünen model does the town of Crossford break?",["There is only one market","Farmers want to make a profit","Transport cost rises with distance"],0,"Crossford is a second market, so the one-market assumption is broken. The other two choices are things the model assumes and this diagram still shows. The highway and river bend the rings too, but the question asks about the town."]},
{v:"Explain",
q:"Explain ONE way refrigerated trucking and global shipping have weakened the von Thünen pattern at the national or global scale.",
sk:"Scale and the global food system",
s:[["Name the technology and what it lets food do.",["Refrigerated trucks and containers keep milk, meat, and produce fresh for weeks.","Highways, container ships, and air freight make long distances cheap and fast."]],["Give a specific real-world example.",["U.S. supermarkets sell grapes from Chile in January and tomatoes from Mexico year-round.","Florida and California supply winter vegetables to the whole United States."]],["Explain how that weakens the rings, and name the scale.",["Perishables no longer have to be grown near the city that eats them, so the ring 1 logic breaks down.","At the national or global scale, the whole country (or world) acts like one giant hinterland for every city."]]],
r:{m:"all",i:[["Names the technology: refrigeration/cold chain, refrigerated trucks, container ships, air freight, highways",/refriger|fridge|cold|freez|frozen|truck|contain|ship|cargo|plane|air ?freight|jet|highway|interstate|rail/i,"Name the technology: refrigerated trucks and container ships (the cold chain) keep food fresh over long distances."],["Explains the effect with scale: perishables are grown far away (e.g., Chile, Mexico, California) so the near-city rings weaken at the national or global scale",/\bfar\b|farther|faraway|distant|long.distance|thousand|mile|other (countr|state|continent|side)|another (countr|state|continent)|across the (world|country|globe|ocean)|around the world|all over the (world|globe|country)|overseas|chile|mexico|california|florida|kenya|peru|brazil|china|spain|new zealand|winter|season|year.round|no longer|don.t (need|have)|doesn.t (need|have)|not (need|have) to|anywhere|import/i,"Explain the effect and the scale: perishables like Chilean grapes or Mexican tomatoes travel thousands of miles, so at the global scale fresh food doesn't have to come from the ring next to the city."]]},
mo:"T1- Refrigeration has weakened the model because perishable products no longer have to be grown next to the city that eats them. E2- Refrigerated trucks and container ships keep produce fresh for weeks, so a U.S. supermarket in January sells grapes from Chile and tomatoes from Mexico that traveled thousands of miles. A3- At the national and global scale, this means the ring 1 logic breaks down: the dairy-and-vegetable zone is not a ring around each city but far-off regions like California, Florida, or another country, so the whole world acts as one giant hinterland.",
b:["foodchain","scale"],
th:"Wait, if the model doesn't work anymore, why are we learning it?",
co:"Because the LOGIC still works: distance costs money. What changed is how much. Refrigeration and container ships made distance cheap for perishables. Zoom out to the national or global scale and you'll see the rings dissolve.",
kq:"How do refrigerated trucks and cargo ships mess up the idea that fresh food has to come from right next to the city? Explain ONE way and say what scale you're talking about.",
ml:["The cold chain and scale",["The “cold chain” is the chain of refrigerated trucks, warehouses, and containers that keeps food cold from farm to store.","It lets perishables travel for weeks, so milk, meat, and vegetables can be grown thousands of miles from the city that eats them.","In winter, U.S. stores sell grapes from Chile and tomatoes from Mexico, and California and Florida supply fresh produce to the whole country.","At the local scale, you may still find dairy farms around a city (a “milkshed”), but at the national and global scale the rings mostly disappear.","Always say which scale you mean: local, national, or global."],[["Cold chain","Refrigerated transport and storage that keeps food fresh over long distances."],["Scale","The level of analysis: local, national, or global."],["Milkshed","The area around a city that supplies its milk."]]],
wk:["Trucks are faster than horses, so people can sell more.","That's true but doesn't explain the model. Name the technology (refrigeration), give an example (Chilean grapes in January), and explain how it breaks the near-city ring at the national or global scale."],
mw:"It names the technology (refrigerated trucks and container ships), gives a concrete example with distance (Chile, Mexico, thousands of miles), and explains the effect at a named scale (national/global rings dissolve).",
fr:"T1- ___ has weakened the model because perishable products no longer have to ___. E2- For example, ___ travel from ___ to ___. A3- At the ___ scale, this means ___.",
qc:["Which technology MOST directly lets perishable food be grown far from the city that eats it?",["refrigeration (the cold chain)","the tractor","chemical fertilizer"],0,"Refrigerated trucks and containers keep food fresh for weeks, so distance matters far less."]},
{v:"Describe",
q:"Describe ONE environmental consequence of intensive commercial agriculture in ring 1 or ring 3 of the diagram.",
sk:"Environmental effects of commercial farming",
s:[["Pick a ring and name a consequence in general words.",["Ring 1 (dairy, vegetables) and ring 3 (grains) use lots of fertilizer, pesticides, and water.","Options: polluted water, drained groundwater, salty soil, eroded soil."]],["Give specific detail about HOW it happens.",["Rain washes fertilizer and manure off fields into the river (runoff).","Pumping groundwater for irrigation faster than rain refills it drains the aquifer."]],["Describe the result on the environment.",["Nitrogen feeds algae that use up oxygen and kill fish (a dead zone).","Wells go dry, or salt builds up in the soil and ruins it."]]],
r:{m:"all",i:[["Names a specific environmental consequence: fertilizer/pesticide/manure runoff, water pollution, aquifer or groundwater depletion, soil salinization, soil erosion, or loss of soil fertility",/fertiliz|pesticid|chemical|manure|runoff|run-off|run off|nitrogen|nitrate|phosph|algae|dead zone|pollut|aquifer|groundwater|water table|deplet|salin|salt|erosion|erod|topsoil|soil|habitat|biodivers|methane|emission/i,"Name a specific consequence: fertilizer runoff polluting the river, groundwater depletion from irrigation, soil salinization, or soil erosion."],["Describes how it happens or what it does to the environment (cause → result)",/wash|flow|leak|seep|soak|drain|into the (river|water|tarn|stream|lake|ground)|into (rivers|streams|lakes|groundwater)|stream|lake|kill|fish|oxygen|algae|\bdry|drop|lower|ruin|degrad|harm|damage|poison|contaminat|dirty|blown|blow away|lose|loss|build|wells?\b|drink/i,"Describe the chain: rain washes fertilizer into the river, feeding algae that use up oxygen and kill fish."]]},
mo:"T1- One environmental consequence of intensive farming in ring 3 is water pollution from fertilizer runoff. E2- Grain farmers spread large amounts of nitrogen fertilizer on their fields, and when it rains the extra fertilizer washes off the fields and flows into the Tarn River. A3- The nitrogen feeds huge algae blooms downstream that use up the oxygen in the water and kill fish, creating a “dead zone” like the one at the mouth of the Mississippi River in the Gulf of Mexico.",
b:["agenviro","greenrev","intensext"],
th:"Farming is natural. How can growing food hurt the environment?",
co:"Fair question! Growing a garden is gentle. Growing thousands of acres of one crop with chemical fertilizer and pumped water is a different thing. Follow the water: where does the fertilizer go when it rains?",
kq:"Pick ring 1 or ring 3. Describe ONE way the heavy farming there damages the environment, and how it happens.",
ml:["What intensive commercial farming does to land and water",["Intensive commercial farms put lots of inputs (fertilizer, pesticides, water, machinery) on each acre to get big harvests.","Fertilizer runoff: rain carries nitrogen and phosphorus into rivers and lakes, feeding algae that use up oxygen and create dead zones. The Gulf of Mexico dead zone comes from farms along the Mississippi.","Aquifer depletion: pumping groundwater for irrigation faster than rain refills it drains aquifers like the Ogallala under the Great Plains.","Salinization: in dry areas, irrigation water evaporates and leaves salt in the soil, which eventually kills crops.","Soil erosion: bare, plowed fields lose topsoil to wind and rain, as in the 1930s Dust Bowl."],[["Runoff","Rainwater that flows off fields, carrying fertilizer and soil with it."],["Aquifer","A layer of underground rock or sand that holds water."],["Salinization","Salt building up in soil from evaporating irrigation water."]]],
wk:["Farming in ring 3 uses up a lot of land.","Using land isn't an environmental consequence by itself. Name a specific harm (fertilizer runoff, aquifer depletion, salinization) and describe how it happens."],
mw:"It names a specific consequence (fertilizer runoff), describes the mechanism (rain washes nitrogen into the river), and gives the result with a real example (algae, dead zones, Gulf of Mexico).",
fr:"T1- One environmental consequence of intensive farming in ring ___ is ___. E2- Farmers there ___, and when ___, it ___. A3- This leads to ___, such as ___.",
qc:["Fertilizer washing off fields into rivers is called…",["runoff","salinization","desertification"],0,"Runoff carries nitrogen and phosphorus into waterways, where it feeds algae blooms."]},
{v:"Explain",
q:"Explain ONE limitation of using this model to understand agriculture in a less developed country today.",
sk:"Limits of a model across places",
s:[["List what the model assumes, then find one assumption that doesn't fit a poorer country.",["Assumptions: commercial farmers selling to ONE market, a flat plain, farmers who own their land and chase profit.","Which of those is least true in, say, a rural village in Ethiopia or Bolivia?"]],["Give specific detail about how farming actually works there.",["Many farmers practice subsistence agriculture, growing food to feed their families, not to sell in a city.","Others grow export crops for a port and foreign buyers, or farm steep hills and communal land."]],["Explain why that makes the model misleading.",["If farmers don't sell to a central city, distance to that city doesn't decide what they grow.","So the rings don't form, and the model would predict the wrong land use."]]],
r:{m:"all",i:[["Names an assumption that doesn't fit: subsistence (not commercial) farming, no single market / many small markets, export crops for ports, rugged terrain or varied climate, land tenure (communal land, plantations, landless farmers)",/subsist|own famil|feed (their|them|the) famil|feed themselves|not (to )?sell|no (single |one |central )?market|single market|one market|many market|multiple market|local market|export|\bports?\b|plantation|terrain|mountain|hill|steep|flat|climate|soil|\brain|\bdry|land tenure|tenure|own(s|ed|ing)? (the )?land|communal|landless|government|colonial|tradition|village/i,"Name what doesn't fit: many farmers grow food for their own families (subsistence), there's no single central market, the land isn't flat, or farmers don't own the land."],["Explains why that makes the model misleading there",/because|so |doesn.t|does not|don.t|\bnot\b|can.t|cannot|won.t|wouldn.t|differen|assum|instead|rather|wrong|mislead|fail|fit/i,"Explain the problem: if farmers aren't selling to one city, distance to that city doesn't shape what they grow, so the rings never form."]]},
mo:"T1- One limitation is that the model assumes commercial farmers who sell everything to a single market city, which does not describe many farmers in less developed countries. E2- In rural parts of countries like Ethiopia or Bolivia, many families practice subsistence agriculture, growing maize, teff, or potatoes mainly to feed themselves, often on steep hillsides or communal land rather than a flat plain with one market. A3- Because those farmers are not choosing crops based on transport cost to a central city, distance to the market does not sort their land use into rings, so the model would predict the wrong pattern and miss what actually shapes their farming, such as rainfall, terrain, and land ownership.",
b:["intensext","vonthunen","scale"],
th:"A model is a model. Why wouldn't it work everywhere?",
co:"Models are built from assumptions, and von Thünen's assumptions describe 1820s Germany: commercial farmers, one city, flat land. Ask which of those is least true for a farming village in a poorer country today. That's your limitation.",
kq:"This model was built for farmers selling to one city on flat land. What's ONE reason it might not fit farming in a poorer country today, and why does that matter?",
ml:["When the rings don't form",["A model works only where its assumptions are roughly true. Von Thünen assumed commercial farmers, one market, flat land with uniform soil, and farmers who own land and chase profit.","In many less developed countries, millions of farmers practice subsistence agriculture: they grow food to eat, so distance to a city isn't what decides their crops.","Many regions have dozens of small village markets or sell export crops (coffee, cocoa, cotton) that go to a port and overseas, not to a nearby city.","Mountains, deserts, and uneven rainfall matter more than distance, and land tenure (who owns or controls the land, including plantations and communal land) shapes what gets grown.","A good limitation names the assumption that fails AND says what conclusion goes wrong because of it."],[["Subsistence agriculture","Growing food mainly to feed your own family, not to sell."],["Land tenure","The rules about who owns or has the right to use land."],["Model","A simplified picture of reality built on assumptions."]]],
wk:["The model is old, so it doesn't work anymore.","Being old isn't a limitation by itself; the transport-cost logic still works in many places. Name a specific assumption that fails in a less developed country (subsistence farming, no single market, terrain, land tenure) and explain why that matters."],
mw:"It names the failing assumption (commercial farmers and a single market), gives specific detail (subsistence farming on hillsides and communal land in Ethiopia or Bolivia), and explains the consequence (distance doesn't sort land use, so the model predicts wrongly).",
fr:"T1- One limitation is that the model assumes ___, which does not fit many farmers in less developed countries. E2- For example, in ___, many farmers ___. A3- Because those farmers ___, the model would ___.",
qc:["Which assumption of the von Thünen model is LEAST likely to hold in a rural subsistence-farming region?",["Farmers sell all their products to one central market","Transport takes time","Farmers grow food"],0,"Subsistence farmers grow food for their own families, so there's no single market pulling their land use into rings."]}
]});
addBG({
u5n_greenrev:{t:"The Green Revolution",s:["The Green Revolution spread high-yield seeds, chemical fertilizers, pesticides, irrigation, and farm machines to developing countries in the mid-1900s.","It began in Mexico in the 1940s, where American plant scientist Norman Borlaug bred short, sturdy, high-yield wheat.","In the 1960s it reached India and Pakistan, and in 1966 a research institute in the Philippines released IR8, nicknamed “miracle rice.”","Borlaug won the 1970 Nobel Peace Prize because the extra food helped prevent famines."]},
u5n_revolutions:{t:"The three agricultural revolutions",s:["First (Neolithic), about 10,000 years ago: people domesticated plants and animals in hearths like the Fertile Crescent and settled in villages.","Second, 1700s–1800s, alongside the Industrial Revolution: the seed drill, new crop rotations, and better transportation let fewer farmers feed more people, freeing workers for factories.","Third, from the mid-1900s: the Green Revolution's seeds, chemicals, irrigation, and machines, later joined by GMOs."]},
u5n_agribiz:{t:"Agribusiness & vertical integration",s:["Agribusiness is farming run as a big business, from seeds and chemicals to processing, shipping, and selling.","Vertical integration means one company controls several steps of the same supply chain.","Tyson Foods, for example, supplies chicks and feed to contract farmers, then processes and sells the chicken under its own brand.","Green Revolution farmers came to depend on buying fertilizer and pesticides from these companies."]},
u5n_gmo:{t:"GMOs",s:["A GMO (genetically modified organism) has DNA changed in a lab, often by adding a gene from another species.","Bt corn makes its own insect-killing protein, and Golden Rice was engineered to provide vitamin A.","Supporters say GMOs raise yields; critics worry about corporate control of patented seeds.","GMO crops spread from the mid-1990s, after the original Green Revolution."]},
u5n_subsist:{t:"Subsistence farming & staple crops",s:["Subsistence farmers grow food mainly to feed their own families, not to sell.","Shifting cultivation (slash-and-burn): clear and burn a rainforest plot, farm it a few years, then move on so it can recover, as in the Amazon and Central Africa.","Pastoral nomadism: moving herds of camels, goats, or cattle across dry lands like the Sahel and Mongolia.","In much of sub-Saharan Africa, small rain-fed farms grow staples like cassava, yams, sorghum, and millet, not the irrigated wheat and rice the Green Revolution was built for."]},
u5n_envcost:{t:"Environmental costs of high-input farming",s:["Irrigating thirsty high-yield crops can pump groundwater faster than rain refills it; in India's Punjab the water table has been falling for decades.","In dry places, irrigation water evaporates and leaves salt in the soil (salinization), which can ruin fields.","Heavy pesticide use can poison water and breed resistant pests.","Replacing thousands of local varieties with a few high-yield ones (monoculture) shrinks crop diversity, so one disease can wipe out more."]},
u5n_sustain:{t:"Sustainable farming practices",s:["Sustainable agriculture grows food today while protecting the soil, water, and wildlife farms need tomorrow.","Soil savers: no-till, cover crops, contour plowing, and terracing, like the centuries-old rice terraces of the Philippine Cordilleras.","Crop rotation and organic farming rebuild soil with legumes, compost, and manure instead of synthetic fertilizer.","Community-supported agriculture (CSA) and farmers' markets shorten the distance food travels and support small farms."]},
u5n_fooddesert:{t:"Food deserts & food insecurity",s:["Food insecurity means lacking reliable access to enough affordable, nutritious food, and it happens in rich and poor countries alike.","A food desert is an area, often low-income, where residents live far from a supermarket and healthy food is hard to get.","In cities, many supermarket chains closed stores in poorer neighborhoods and moved to the suburbs, a pattern tied to disinvestment and redlining.","In rural areas, like the Mississippi Delta or the Navajo Nation, too few customers live nearby to support a big store, so families drive far for groceries."]}
});
addFRQ({k:"Practice FRQ · No stimulus",
t:"Miracle Seeds",
d:"The Green Revolution, who it helped and left out, sustainable farming, and food deserts.",
u:"Unit 5",
fmt:"No stimulus (like Question 1)",
intro:"Since 1950 the world's population has more than tripled to over 8 billion, and farmers now grow enough food to feed everyone, yet hundreds of millions of people still go hungry. This FRQ asks how farming changed to feed a growing world, who got left out, and how to keep it going without wearing out the land.",
stim:"",
bg:["u5n_revolutions","u5n_greenrev","u5n_agribiz","tea"],
nt:[["What do you already know about the three agricultural revolutions? Can you put them in order?","First (Neolithic), about 10,000 years ago: domesticating plants and animals. Second, 1700s–1800s with the Industrial Revolution: better tools, so fewer farmers fed more people. Third, from the mid-1900s: the Green Revolution, later joined by GMOs. This FRQ lives in the Third."],["What do you already know about the Green Revolution? Who started it, and where did it spread?","Norman Borlaug bred high-yield wheat in Mexico in the 1940s. In the 1960s it spread to India and Pakistan, along with “miracle rice” from the Philippines. The seeds needed fertilizer, pesticides, and irrigation. Harvests soared, but so did water and chemical use."],["What do you already know about how farming differs around the world, from giant company farms to families growing their own food?","Agribusinesses farm to sell, often with vertical integration, like Tyson controlling chicken from chick to store. Subsistence farmers mainly feed their families: slash-and-burn in rainforests, nomadic herding in dry lands like the Sahel. And even rich countries have places where healthy food is hard to find."]],
m:20,
p:[
{v:"Identify",
q:"Identify ONE agricultural innovation associated with the Green Revolution.",
sk:"Green Revolution technologies",
s:[["What did the Green Revolution bring to the farm? Start with the seeds.",["Scientists bred new seeds that grow far more grain.","They're called high-yield varieties (HYVs) of wheat and rice."]],["Name it in a short phrase. That's all Identify needs.",["Other parts of the package count too: fertilizer, pesticides, irrigation, or tractors.","Try: “High-yield varieties of ___ and ___.”"]]],
r:{m:"any",i:[["Names high-yield seed varieties (HYVs)",/high.?yield|hyv|seed|variet|dwarf|ir8|miracle rice/i,"Name the seeds: high-yield varieties (HYVs) of wheat and rice."],["Names another input: fertilizer, pesticides, irrigation, or machines",/fertili|pesticid|herbicid|insecticid|chemical|irrigat|tube ?well|pump|canal|mechani|tractor|machine|harvester|thresher/i,"Or name another input: chemical fertilizer, pesticides, irrigation, or tractors."]]},
mo:"High-yield varieties (HYVs) of wheat and rice, like the short, sturdy wheat Norman Borlaug bred in Mexico.",
b:["u5n_greenrev","u5n_gmo"],
th:"Innovation? Like an invention?",
co:"Yep! An innovation is any new tool or method. Picture an Indian farm in 1960 and again in 1975. What new stuff showed up?",
kq:"Name ONE new thing farmers started using during the Green Revolution.",
ml:["The Green Revolution package",["The Green Revolution spread new farm technology to developing countries, from Mexico in the 1940s to India and Pakistan in the 1960s.","Its core was high-yield varieties (HYVs): wheat and rice bred to grow much more grain per acre.","Those seeds needed chemical fertilizer, pesticides, and steady irrigation, and many farms also bought tractors and pumps."],[["High-yield variety (HYV)","A crop bred to produce much more food per acre."],["Mechanization","Replacing human or animal labor with machines."]]],
wk:["Farming got better.","That's a result, not an innovation. Name the actual new thing, like high-yield seeds or chemical fertilizer."],
mw:"It names a specific innovation (high-yield varieties), the crops (wheat and rice), and a real example (Borlaug's wheat in Mexico).",
fr:"One innovation of the Green Revolution was ___.",
qc:["Which was NOT part of the original Green Revolution of the 1960s?",["Genetically modified (GMO) crops","High-yield wheat and rice seeds","Chemical fertilizer and irrigation"],0,"GMOs came later, in the 1990s. The original Green Revolution used crossbred high-yield seeds plus chemicals and water."]},
{v:"Describe",
q:"Describe ONE way the Green Revolution changed food production in a specific country, such as India or Mexico.",
sk:"Green Revolution impacts on production",
s:[["Name the change in general words. More food or less?",["Think about yield: how much grain each acre produced.","Wheat and rice yields rose sharply."]],["Give proof from ONE real country.",["India: Punjab farmers planted high-yield wheat with fertilizer and irrigation.","India's wheat harvest about doubled in under ten years."]],["Describe what that led to.",["More grain → fewer shortages and less risk of famine.","India went from relying on food aid to feeding itself."]]],
r:{m:"all",i:[["Names a change: higher yields, more food, or self-sufficiency",/yield|more (food|grain|wheat|rice|crop)|produc|output|harvest|doubl|tripl|increas|rose|grew|self.?suffic|surplus|export|irrigat|fertili|tractor|mechani|two crops|monocult/i,"Name the change: farms grew far more grain per acre (higher yields)."],["Gives proof from a real country (India, Mexico…)",/india|punjab|mexic|pakistan|philippin/i,"Add the place: for example, India's wheat harvest about doubled after Punjab farmers planted high-yield seeds."]]},
mo:"T1- The Green Revolution greatly increased how much food India's farms produced per acre. E2- Starting in the mid-1960s, farmers in the Punjab region planted high-yield wheat with chemical fertilizer and irrigation, and India's wheat harvest about doubled in less than ten years. A3- This turned India from a country that depended on U.S. wheat shipments into one that, by the late 1970s, grew enough grain to feed its own people.",
b:["u5n_greenrev"],
th:"Do I have to know exact numbers?",
co:"Nope! A number helps, but a clear change plus a real place earns the point. Pick India or Mexico and describe what happened to its harvests.",
kq:"Pick ONE country, like India or Mexico. How did the Green Revolution change the amount of food its farms grew?",
ml:["Before and after",["Mexico once imported much of its wheat; with Borlaug's seeds it grew enough for itself by the mid-1950s.","In the mid-1960s India faced droughts and relied on U.S. wheat shipments.","Punjab farmers planted the new wheat and rice with fertilizer and tube-well irrigation, and India's wheat harvest about doubled in less than a decade.","Faster-growing varieties let many farmers raise two crops a year."],[["Yield","How much crop a piece of land produces."],["Food self-sufficiency","Growing enough food to feed your own people without relying on imports."]]],
wk:["The Green Revolution made farming better in India.","“Better” is too vague. Say WHAT changed (much bigger wheat and rice harvests) and give proof, like India's wheat harvest doubling."],
mw:"It names the change (more food per acre), proves it with a real place (Punjab, India's harvest doubling), and describes the result (India could feed itself).",
fr:"T1- The Green Revolution changed food production in ___ by ___. E2- For example, ___. A3- This mattered because ___.",
qc:["Which region became India's “breadbasket” during the Green Revolution?",["Punjab","Kerala","The Himalayas"],0,"Punjab farmers adopted high-yield wheat and rice early, making it India's top grain region."]},
{v:"Explain",
q:"Explain ONE negative environmental consequence of the Green Revolution.",
sk:"Environmental costs of the Green Revolution",
s:[["Name the harm in general words. What did these farms use a LOT of?",["Think water, chemicals, and planting the same crop everywhere.","Options: depleted groundwater, salty soil, pesticide pollution, or lost crop diversity."]],["Give proof: a real place or example.",["In India's Punjab, farmers pump groundwater from tube wells to irrigate rice and wheat.","The water table there keeps dropping, so wells must go deeper."]],["Explain the cause → effect. Why does it matter?",["Thirsty crops → pumping faster than rain refills the aquifer → water runs low.","Without that water, the high yields can't last."]]],
r:{m:"all",i:[["Names a harm: groundwater depletion, salty soil, pollution, or lost crop diversity",/aquifer|groundwater|ground water|water table|water shortage|deplet|drain|salin|salt|soil|erosi|pesticid|chemical|pollut|poison|contamin|runoff|diversit|monocult|waterlog/i,"Name the harm: for example, pumping so much irrigation water that the groundwater runs low."],["Explains how Green Revolution farming causes it",/because|so |since|lead|caus|result|pump|irrigat|need|requir|spray|faster than|replac/i,"Explain the chain: high-yield crops need heavy irrigation, so farmers pump water faster than rain can refill the aquifer."]]},
mo:"T1- One negative environmental consequence of the Green Revolution is the depletion of groundwater. E2- In India's Punjab region, high-yield rice and wheat need heavy irrigation, so farmers pump water from tube wells faster than rain can refill the aquifer, and the water table has dropped year after year. A3- Because the farms depend on that water, a falling water table threatens to make the high yields impossible to keep up, putting future food production at risk.",
b:["u5n_envcost","u5n_greenrev"],
th:"Wait, wasn't the Green Revolution a good thing?",
co:"It's both! It fed millions, but the extra food came from using a lot more water and chemicals. Ask yourself: what happens when you use something up faster than nature can replace it?",
kq:"The Green Revolution grew more food, but it hurt nature too. Name ONE way, and explain how the farming caused it.",
ml:["The hidden costs of high yields",["High-yield seeds need lots of irrigation water and fertilizer to produce big harvests.","In India's Punjab, farmers pump out more groundwater than rain puts back, so the water table keeps falling.","In dry places, irrigation water evaporates and leaves salt behind (salinization), which can ruin fields.","Planting the same few varieties everywhere (monoculture) reduces crop diversity, so one disease can spread farther."],[["Aquifer","An underground layer of rock or sand that holds water."],["Monoculture","Growing just one crop over a large area."]]],
wk:["The Green Revolution was bad for the environment.","That just repeats the question. Name a specific harm, like falling groundwater, and explain how the farming caused it."],
mw:"It names a specific harm (groundwater depletion), uses a real place (Punjab), and explains the chain from thirsty crops to a falling water table.",
fr:"T1- One negative environmental consequence of the Green Revolution is ___. E2- For example, in ___, ___. A3- This happens because ___, which leads to ___.",
qc:["Pumping groundwater faster than rain can refill it causes…",["aquifer depletion","salinization","deforestation"],0,"The underground water supply shrinks, and wells have to go deeper."]},
{v:"Explain",
q:"Explain ONE reason the Green Revolution benefited large farms more than small farms.",
sk:"Who gained from the Green Revolution",
s:[["Name the reason in general words. What did the package cost?",["Seeds, fertilizer, pesticides, pumps, and tractors all cost money before the harvest.","Large farmers had more money and easier access to loans."]],["Give proof of how big and small farmers differed.",["Big landowners could use land as collateral for bank loans; small farmers often borrowed from moneylenders at high interest.","A tube well or tractor pays off on 100 acres, not on 2."]],["Explain the result.",["Big farms earned bigger profits and bought more land.","Many small farmers fell into debt, and some sold their land."]]],
r:{m:"all",i:[["Names a reason: the inputs were costly, and big farmers had more money or credit",/cost|expens|afford|money|capital|cash|price|loan|credit|borrow|debt|rich|wealth|invest|economies of scale|more land|bigger|larger/i,"Name the reason: the high-yield package (seeds, fertilizer, pumps, tractors) was expensive, and big farmers could afford it."],["Explains how that helped large farms or hurt small ones",/debt|lose|lost|sold|sell|landless|inequal|gap|profit|left behind|couldn.t|could not|can.t|cannot|unable|interest|out of business|because|so /i,"Explain the result: small farmers had to borrow, fell into debt, and some lost their land, while big farms profited."]]},
mo:"T1- The Green Revolution helped large farms more because its high-yield package was expensive, and wealthy farmers could afford it more easily. E2- In India, the new seeds only paid off with bought fertilizer, pesticides, and irrigation pumps, and large landowners could get bank loans using their land as collateral, while small farmers often borrowed from moneylenders at high interest. A3- So large farms earned bigger profits and bought more land, while many small farmers fell into debt and some sold their land, widening the gap between rich and poor farmers.",
b:["u5n_agribiz","u5n_greenrev"],
th:"Wouldn't a seed help any farmer, big or small?",
co:"In theory, yes! A seed doesn't care how big the farm is. But it came with a shopping list. Who could pay for all of it?",
kq:"Why did big farms gain more from the Green Revolution than poor farmers with small farms? Explain ONE reason.",
ml:["Why the gains weren't equal",["The high-yield package (seeds, fertilizer, pesticides, water, machines) had to be paid for before the harvest.","Large landowners could use land as collateral for cheaper bank loans; small farmers often paid moneylenders high interest.","Some small farmers fell into debt, sold their land, and became landless laborers, so rural inequality grew."],[["Collateral","Property, like land, that a borrower gives up if they can't repay a loan."],["Landless laborer","A farmworker who owns no land and works others' fields for wages."]]],
wk:["Large farms have more space to grow crops.","True of any farming. It doesn't explain what about the Green Revolution helped them: the costly inputs big farmers could afford."],
mw:"It names the reason (an expensive package), gives proof (bank loans vs. moneylenders), and explains the result (profits for big farms, debt for small ones).",
fr:"T1- The Green Revolution helped large farms more because ___. E2- For example, ___. A3- As a result, ___, while ___.",
qc:["Why did many small farmers fall into debt during the Green Revolution?",["They borrowed to buy seeds, fertilizer, and irrigation","Their governments banned the new seeds","They were forced to grow only cotton"],0,"The package cost money up front, so poorer farmers had to borrow, often at high interest."]},
{v:"Explain",
q:"Explain ONE reason the Green Revolution had less impact in sub-Saharan Africa than in South Asia.",
sk:"Uneven spread of the Green Revolution",
s:[["Name the reason in general words. What were the new seeds designed for?",["The research focused on irrigated wheat and rice.","Many African farmers grow different crops and depend on rain."]],["Give proof about sub-Saharan Africa.",["Staples like cassava, sorghum, millet, and yams got far less research attention.","Little farmland there is irrigated, and fertilizer and credit are scarce."]],["Explain WHY that kept harvests from jumping.",["Seeds not bred for your crop or rainfall can't raise your harvest.","So yields rose far less than in South Asia."]]],
r:{m:"all",i:[["Names a reason: different staples, little irrigation, high costs, or poor roads",/cassava|sorghum|millet|yam|different (crop|staple|food)|staple|irrigat|rain|drought|dry|water|cost|expens|afford|poor|povert|road|infrastruct|transport|credit|loan|soil|climat|divers|conflict|war\b|instab|govern/i,"Name a reason: the new seeds were wheat and rice, but many Africans depend on crops like cassava, sorghum, and millet."],["Explains how that limited the benefits",/because|so |since|didn.t|did not|weren.t|were not|wasn.t|couldn.t|could not|can.t|cannot|without|lack|little|few|less|lower|not (designed|bred|made)|fit|suit/i,"Explain the link: seeds bred for irrigated wheat and rice didn't fit Africa's rain-fed fields of cassava and millet, so yields stayed low."]]},
mo:"T1- The Green Revolution had less impact in sub-Saharan Africa because its high-yield seeds were bred for crops and conditions that didn't match most African farms. E2- Scientists focused on irrigated wheat and rice, but many farmers in sub-Saharan Africa grow staples like cassava, sorghum, and millet on rain-fed fields, and only a small share of the region's farmland is irrigated. A3- Since the new seeds didn't fit Africa's main crops or its dependence on rainfall, yields there rose much less than in South Asia.",
b:["u5n_subsist","u5n_greenrev"],
th:"Isn't Africa just too dry to farm?",
co:"Common idea, but most of sub-Saharan Africa isn't desert: it has savannas and rainforests. The real puzzle is the seeds. What crops were they made for, and what do African farmers grow?",
kq:"The Green Revolution boosted harvests in Asia but not much in Africa south of the Sahara. Explain ONE reason why.",
ml:["Why Africa missed most of the boom",["Early Green Revolution seeds were wheat and rice bred for irrigated land.","Much of sub-Saharan Africa relies on staples like cassava, sorghum, millet, and yams, which got far less research attention.","Most farms there are rain-fed: well under 10 percent of the region's cropland is irrigated.","Poor roads, little credit, and costly fertilizer made the package hard to get, especially for small farmers."],[["Staple crop","The main food that makes up most of what people eat."],["Rain-fed farming","Farming that depends only on rainfall, with no irrigation."]]],
wk:["Africa is a desert, so nothing grows there.","Not true: most of sub-Saharan Africa is savanna, farmland, and rainforest. Give a real reason, like seeds bred for irrigated wheat and rice instead of cassava and millet."],
mw:"It names a clear reason (seeds bred for other crops), gives proof (cassava, sorghum, millet; little irrigation), and explains why yields rose less.",
fr:"T1- The Green Revolution had less impact in sub-Saharan Africa because ___. E2- For example, ___. A3- This limited the benefits because ___.",
qc:["Which crop is a major staple in much of sub-Saharan Africa?",["Cassava","Wheat","Barley"],0,"Cassava, like sorghum, millet, and yams, wasn't a focus of the early Green Revolution, which centered on wheat and rice."]},
{v:"Explain",
q:"Explain ONE example of a sustainable farming practice and how it reduces environmental harm caused by agriculture.",
sk:"Sustainable agriculture",
s:[["Name ONE sustainable practice.",["Sustainable means farming that can keep going without wrecking the soil or water.","Options: no-till, crop rotation, terracing, organic farming, or community-supported agriculture."]],["Give proof: how does it work, and where?",["No-till: planting into last year's crop leftovers instead of plowing, common in the U.S. Midwest, Brazil, and Argentina.","Terracing: step-shaped hillside fields, like the rice terraces of the Philippines."]],["Explain the cause → effect: which harm does it reduce?",["No-till: leftover stalks cover the soil, so wind and rain carry less of it away.","Terraces slow water running downhill, so less soil washes off."]]],
r:{m:"all",i:[["Names a sustainable practice (no-till, crop rotation, terracing, organic, CSA…)",/tillage|no.?till|\btill|rotat|cover crop|terrac|contour|organic|integrated pest|\bipm|drip|agroforest|community.supported|\bcsa|local food|farmers.? market|intercrop|fallow|compost|manure/i,"Name a practice: for example, conservation tillage (no-till farming) or terracing."],["Explains how it reduces a specific harm (erosion, water use, chemicals)",/erosi|erode|wash|blow|soil|water|chemical|pesticid|fertili|nitrogen|pollut|fuel|emission|carbon|miles|distance|reduc|less|lower|protect|prevent|restor|replen/i,"Explain HOW it helps: for example, leaving crop leftovers on the field covers the soil, so less is blown or washed away."]]},
mo:"T1- One sustainable farming practice is conservation tillage, also called no-till farming. E2- Instead of plowing the whole field each year, many farmers in places like the U.S. Midwest, Brazil, and Argentina plant seeds directly into the stalks and leaves left over from last year's crop. A3- Because that leftover plant cover protects the ground from wind and rain, much less soil erodes away, which keeps fields fertile and keeps mud out of nearby rivers.",
b:["u5n_sustain","u5n_envcost"],
th:"Isn't “sustainable” just organic?",
co:"Organic is one kind, but there are lots of others! Sustainable just means the farm can keep producing without using up its soil and water. Pick the one you can explain best.",
kq:"Name ONE real way farmers can grow food while doing less damage to the environment. Explain how it helps.",
ml:["Farming that can last",["Sustainable agriculture protects soil, water, and ecosystems so farms can keep producing in the future.","Conservation tillage (no-till) leaves crop leftovers on the field instead of plowing, which cuts soil erosion.","Crop rotation with legumes like soybeans or clover adds nitrogen back to the soil naturally.","Terracing cuts steps into hillsides so rain can't carry soil downhill."],[["Conservation tillage","Planting with little or no plowing, leaving crop leftovers on the soil."],["Community-supported agriculture (CSA)","Customers pay a local farm up front for a share of its harvest."]]],
wk:["Sustainable farming helps the environment because it is eco-friendly.","That's circular: it just says sustainable is good for nature. Name ONE actual practice, like no-till or terracing, and explain HOW it reduces a specific harm."],
mw:"It names a real practice (no-till), shows where it's used (the U.S. Midwest, Brazil, Argentina), and explains the cause → effect (plant cover → less erosion).",
fr:"T1- One sustainable farming practice is ___. E2- For example, farmers in ___ ___. A3- This reduces environmental harm because ___, which leads to ___.",
qc:["How does terracing reduce environmental harm?",["It slows water running downhill, so less soil erodes","It removes salt from irrigated soil","It lets farmers skip planting seeds"],0,"Steps on a hillside hold water and soil in place."]},
{v:"Explain",

if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);

case 'go':return go(+b.dataset.k);

case 'bq':{const B=S.bo;if(B.s==null&&+b.dataset.o==0)B.r++;if(B.s!==0)B.s=+b.dataset.o;return render()}

case 'frame':{const t=document.getElementById('ans'),f=S.f.p[i].fr;t.value=t.value.trim()?t.value.trim()+'\n'+f:f;S.p[i].a=t.value;t.focus();const c=t.value.indexOf('___',t.value.length-f.length);if(c>=0)t.setSelectionRange(c,c+3);return}
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.includes('___')){st.w=1;render();return document.getElementById('ans').focus()}st.w=0;if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.c=5;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render(1)}
case 'rev':S.p[i].ck=0;S.p[i].done=0;S.p[i].c=4;render(1);return document.getElementById('ans').focus();
case 'next':{const w=S.p[i].done;S.p[i].done=1;S.p[i].ok=earned(i);if(!w)S.cb=S.p[i].ok?S.cb+1:0;return go(i+2)}
case 'cf':S.p[i].cf=+b.dataset.k;return render();
case 'copy':{const m=document.getElementById('cpmsg'),t=exportTxt();const fail=()=>{document.getElementById('cpd').open=true;const ta=document.getElementById('cpt');ta.focus();ta.select();m.textContent='Select the text below and copy it.'};try{navigator.clipboard.writeText(t).then(()=>{m.textContent='✔ Copied! Now paste it into Canvas.'},fail)}catch(e){fail()}return}
case 'retry':{const m=S.p.findIndex(x=>x.done&&!x.ok);S.p[m].c=4;S.p[m].ck=0;S.p[m].done=0;return go(m+1)}
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeBG();else if(e.key=='Tab'&&sh.classList.contains('on')){e.preventDefault();sh.querySelector('[data-a=x]').focus()}});
render(1);
