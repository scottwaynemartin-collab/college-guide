<script>
const BG={
frq:{t:"How AP FRQs are scored",s:["Each part (A, B, C…) is worth 1 point and is scored on its own. A mistake in Part B can't cost you Part C.","Readers look for the right idea, clearly linked to the question. Fancy writing earns nothing extra.","No thesis, intro, or conclusion needed. Label each part and answer it directly.","Write in complete sentences and do what the task verb asks (Identify, Define, Describe, Explain, Compare, or Explain the degree).","Never leave a part blank. A wrong answer costs nothing."]},
tea:{t:"The TEA method",s:["T1- Topic: your reason in general words. Turn the question into your claim.","E2- Evidence: the specific proof, like a place, number, or example, ideally from the map or table.","A3- Analysis: why it matters. Explain HOW or WHY your proof backs up your reason, using “because…” or “which leads to…”.","Label each piece T1-, E2-, A3- so the reader can find every point. Describe answers need T1 and E2 plus a short A3. Explain answers need a strong A3."]},
readmap:{t:"How to read a map",s:["Read the title first. It tells you the topic, place, and time.","Check the legend so you know what each color and symbol means.","Look for patterns: what's clustered, what's connected, what points where?","Then ask WHY: who made this, and what story is it telling?"]},
readtable:{t:"How to read a data table",s:["Read the title and every column header, including units (%, per 1,000).","Find the highest and lowest value in each column.","Compare columns: when one goes up, does another go up or down?","When there are two years, look for change over time."]},
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]}
};
const VERBS={
Identify:{d:"Name it. One short, specific answer is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","Write it as one short, complete sentence."]},

Define:{d:"Give the meaning. Say what the term is in your own words, clearly enough that someone who never heard it would get it.",l:["Use a full sentence: “[Term] is…”","Don't just give an example. The meaning comes first; an example can back it up.","One or two sentences."]},

};

addBG({
u4a_berlin:{t:"The Scramble for Africa & the Berlin Conference",s:["At the Berlin Conference (1884–85), European powers set the rules for claiming African land. No Africans were invited.","Its “effective occupation” rule said a power had to actually control land to claim it, which helped set off the Scramble for Africa.","Only Liberia and Abyssinia (Ethiopia) stayed independent. Ethiopia defeated an Italian invasion at the Battle of Adwa in 1896."]},
u4a_superimposed:{t:"Superimposed & geometric boundaries",s:["A superimposed boundary is drawn by an outside power over an existing cultural landscape, like most colonial borders in Africa.","A geometric boundary is a straight line, often along latitude or longitude, like Egypt and Sudan's border at 22°N.","Other types: antecedent (drawn before settlement), subsequent (after settlement, often following cultural lines), and relic (no longer used).","One border can be two types: a straight colonial line across the Sahara is both geometric and superimposed."]},
u4a_ethnocentrism:{t:"Ethnocentrism & the “civilizing mission”",s:["Ethnocentrism is judging other cultures by your own culture's standards and believing your own is superior.","Many Europeans claimed a duty to “civilize” Africans. The French called it the mission civilisatrice, and racist theories like Social Darwinism were used to justify conquest.","Colonizers often dismissed powerful African states, like the Ashanti Empire and the Sokoto Caliphate, as “primitive.”"]},
u4a_extraction:{t:"Colonies built for extraction",s:["Colonial economies in Africa were built to send raw materials to Europe: Congo rubber, Gold Coast gold and cocoa, Nigerian palm oil, and South African diamonds and gold.","The colony Map 1 calls the Belgian Congo began as King Leopold II's personal colony (1885–1908), where forced rubber collection led to the deaths of huge numbers of Congolese.","Railways usually ran from mines and plantations straight to a port, not between African regions."]},
u4a_conflict:{t:"When borders and nations don't match",s:["A nation is a people with a shared identity; a state is an independent country. Africa's colonial borders rarely matched its nations.","At independence, mostly in the 1950s and 1960s, African states kept the colonial borders, leaving many multinational states.","Nigeria has more than 250 ethnic groups. In 1967 the Igbo-led southeast declared independence as Biafra, and the civil war (1967–70) killed hundreds of thousands to millions, many from starvation.","Sudan's mostly Muslim north and mostly Christian and traditional-religion south fought long civil wars until South Sudan became independent in 2011."]},
u4a_language:{t:"Languages in Africa today",s:["Africa has about 2,000 languages, nearly a third of the world's total, and most Africans grow up speaking an African language at home.","French is an official or working language in about 20 African countries, English is official in over 20, and Portuguese in six, including Angola and Mozambique.","Swahili and Hausa grew as lingua francas through trade long before European rule, and Arabic spread across North Africa with Islam from the 600s.","Ethiopia, never colonized except for a brief Italian occupation (1936–41), governs mainly in Amharic."]},
u4a_religion:{t:"Religion in Africa today",s:["Christianity and Islam, both universalizing religions, are Africa's two largest faiths.","Islam spread across North Africa from the 600s and into West Africa along trans-Saharan trade routes. Christianity spread most widely through European missionaries in the 1800s and 1900s.","Traditional religions are still practiced, often blended with Christianity or Islam (syncretism).","One culture group can hold several faiths: many Yoruba are Muslim, many are Christian, and some follow traditional Yoruba religion."]}
});

xJ0DqfiOjnbmo9AIvpCdHKVmQ9je0o7Ius9cxT/tC3bq0euiqE29p09bM87i21B35376Wzs+NEX+ciB5ohvC1p5G4YSCFDDYF+wchH4zq0EompjGOvffk0EbIIT3qo+lY/3/RMvIyhI2hO0L6paNv1YbwisXk5oQEhejCfXhn+qPUmb73dKBSYvqkJ2Ll2VD2LiYqZBxW8KbIUQG3QdrzSQIE4uIXqo/GlNoGLEbwoGL6f2JfSa8CKFtQsjMYI4lfeq6MdwrDYE9ePfUmcRgF/cCGYBwR0fvhZByBG3sWfw4UyjWTTKM3L+CcYmY4FztNVUNJciLGa/ivjLrIdR7hD2GXwXhYSAdiBSuyoZw9GJuCK9dzLgEFQirJWr4QH9UdUfl3h7C7sCGcEP4MIRUKeBG5olmf/X5gRnpj5IJTgFtCIcuZr6T7Qt26mIiGDwNwpa1I3yYKZQpikIqh0Jv5V85+4awe4zBhnAlhFTroqCOhPBnQhiS9VS63hRcbbsh7DyMYV7FhvDatYQPSQzMrP/4ZYNk3xW5KsSIXywy3WuqsaWhNIQbwnMrk5xf9u0QBtXUQJniaFMq8KYN4QiFZVhgX7BzljD6FV8NIflH8LM1T5rUA/N+TBxH9gU756MNyeD/7oF5P6au2L4Ep8/XG8IN4YbwZR5FOP5sCDeEG8IN4YZwQ/ibF83YDeGGcEO4IdwQbgg3hBvCDeGG8NXLzJWtHTNA9yM+9vWYvmL7EpxfZqGAez/2Yz9e9/gPod270n7sx0ut4vbO92M/Xvv4B4EzoZQ9U6MJAAAAAElFTkSuQmCC\" alt=\"Map of West Africa from about 20°N down to the Atlantic coast, with lines at 20°N, 10°N, 10°W, and 0°. Shading patterns mark where larger culture groups live; the patterns only tell neighbors apart, and no political borders are drawn. In the far north are the Berber and Tuareg. Across the middle, west to east: Wolof and Serer near the western coast, Fulani (in two separate areas), Soninke, Malinke (two areas), Bambara, Bobo, Songhai, Mossi, Gurma, and a large Hausa area in the east. Farther south: Susu, Temne, Senufo, Lobi, Dagomba, Bargu, Nupe, and Tiv. Near the southern coast, west to east: Ngere, Kru, Anyi, Ashanti, Fanti, Ewe, Fon, Yoruba, and Igbo. The groups' edges are irregular and curving, and the groups vary greatly in size.\" style=\"width:100%;height:auto;display:block;background:#fff;border-radius:4px\"><p class=\"src\">Note: Map 2 shows where West Africa's larger culture groups live. It does not show any political borders.</p><p class=\"src\">Remember the class directions: label each part, and write every Describe and Explain part as T1- (your answer in general words) → E2- (the specific proof) → A3- (why it matters).</p>",
bg:["u4a_berlin","u4a_superimposed","readmap","tea"],
nt:[["Start with Map 1. What do you notice about the SHAPES of many borders, and who controls most of the land?","Many borders are ruler-straight, especially across the Sahara. The key shows nearly every territory belongs to a European power; only Liberia and Abyssinia are marked Ind. (independent)."],["Now Map 2. What does it show, and what do the edges of the culture groups look like?","Where West Africa's larger culture groups live, like the Wolof, Fulani, Mossi, Hausa, Yoruba, and Igbo. The edges are irregular because they follow where people live. It shows no political borders at all."],["Put the maps together. Do Map 1's colonial lines in West Africa follow Map 2's culture groups?","Not at all! The Hausa homeland is split between British Nigeria and French West Africa, and the Ewe between the Gold Coast and German Togo. Meanwhile, Nigeria wrapped the Hausa, Yoruba, and Igbo into one colony. That mismatch is the heart of this FRQ."]],
m:20,
p:[
{v:"Describe",
q:"Describe the type of political boundaries shown in Map 1.",
sk:"Superimposed & geometric boundaries",
s:[["Name the type in general words. Who drew these lines, and what shape are they?",["Check the key: almost every label is a European country.","Two AP terms fit: superimposed (drawn by outsiders) and geometric (straight lines)."]],["Point to specific borders on Map 1 as proof.",["Start in the Sahara.","The borders between Algeria, Libya, Egypt, and Sudan are long straight lines."]],["Add a short A3: why does that type of boundary matter?",["Outsiders split up the land among themselves, so they ignored where African culture groups lived."]]],
r:{m:"all",i:[["Names the type: superimposed or geometric",/super.?impos|imposed|geometric|straight|ruler|latitude|longitude|artificial|by (the )?(europe|outsider|foreign|coloniz)|europe\w*[^.]{0,40}(drew|drawn|draw|decid)/i,"Name the type: superimposed (drawn by outsiders) or geometric (straight lines)."],["Gives proof: who drew it, what it ignored, or a Map 1 border",/ignor|without (regard|consider|caring|thinking)|(n.t|not) (consider|care|follow|match|based)|regardless|(divid|split|cut|separat)\w*[^.]{0,30}(group|people|tribe|ethnic|cultur)|latitude|longitude|sahara|desert|algeria|libya|egypt|sudan|bechuana|south west|togo|europe|brit|franc|french|colonizers?|outsider|foreign|berlin/i,"Add proof: point to straight borders on Map 1, like those across the Sahara between Algeria, Libya, and Egypt."]]},
mo:"T1- Map 1 shows mostly superimposed boundaries, and many of them are geometric. E2- European powers like Britain and France drew them as long straight lines, such as the borders that cross the Sahara between Algeria, Libya, Egypt, and Sudan. A3- Because outsiders drew these lines, they ignored the culture groups who already lived there.",
b:["u4a_superimposed","u4a_berlin"],
th:"Type of boundary? Aren't they all just… borders?",
co:"Geographers sort borders by who drew them and how. Look at Map 1's key and those ruler-straight lines. Who held the ruler?",
kq:"What kind of borders does Map 1 show? Name the type and point to proof on the map.",
ml:["Types of boundaries",["Geometric boundaries are straight lines, often along latitude or longitude.","Superimposed boundaries are drawn by an outside power on top of existing cultures, ignoring them.","Most of Africa's colonial borders were both."],[["Superimposed boundary","A border forced onto an area by outsiders."],["Geometric boundary","A straight-line border, often along latitude or longitude."]]],
wk:["The boundaries on Map 1 are the borders between African countries.","That says what the lines are, not their TYPE. Name the type (superimposed or geometric) and point to proof on Map 1."],
mw:"It names the type, points to real borders on Map 1, and says why it matters.",
fr:"T1- Map 1 shows mostly ___ boundaries. E2- For example, the border between ___ and ___ is ___. A3- This matters because ___.",
qc:["A border drawn by outsiders that ignores the cultures already there is…",["superimposed","antecedent","subsequent"],0,"Superimposed means laid on top by outsiders, like most of Africa's colonial borders."]},
{v:"Describe",
q:"Describe ONE way that the European colonial boundaries shown in Map 1 differ from the African cultural boundaries shown in Map 2.",
sk:"Colonial vs. cultural boundaries",
s:[["Name the difference in general words. Compare the SHAPE of the lines on each map.",["Map 1: straight lines. Map 2: what do the culture groups' edges look like?","Colonial lines are straight; cultural boundaries are irregular and follow where groups live."]],["Give proof using BOTH maps: name a group and the colonies it ended up in.",["Find a big group on Map 2, then find the same spot on Map 1.","The Hausa were split between British Nigeria and French West Africa; the Ewe between the Gold Coast and German Togo."]],["Add a short A3: what does the difference show?",["Europeans divided land among themselves, not to match African nations."]]],
r:{m:"all",i:[["Colonial side: straight lines that ignore or split groups",/straight|geometric|ruler|latitude|superimpos|imposed|artificial|ignor|without|(n.t|not|never) (follow|match|line up|care|consider|based)|split|divid|\bcut|separat|together|into (one|the same)|(same|one) (colony|country)|by (the )?(europe|outsider|coloniz)/i,"Describe the colonial side: Map 1's borders are straight lines that ignore or split culture groups."],["Cultural side: irregular edges that follow where groups live",/irregular|curv|wiggl|squiggl|jagged|uneven|wavy|natural|messy|not (straight|geometric)|(aren.t|isn.t) straight|(follow|match|based on)\w*[^.]{0,30}(where|people|group|cultur|ethnic|tribe|live)|where (the )?(people|groups?|they|tribes) (actually |really )?(live|settle)|hausa|yoruba|fulani|\bewe\b|igbo|mossi|wolof|malinke|ashanti|tuareg|songhai|many (different|culture|ethnic|groups|tribes)|several|multiple|smaller/i,"Describe the cultural side too: Map 2's edges are irregular because they follow where groups like the Hausa live."]]},
mo:"T1- The colonial boundaries on Map 1 are mostly straight lines that ignore culture groups, while the cultural boundaries on Map 2 are irregular and follow where each group lives. E2- For example, the Hausa homeland on Map 2 was split between British Nigeria and French West Africa, and the Ewe between the Gold Coast and German Togo. A3- This shows that Europeans drew borders to divide land among themselves, not to match African nations.",
b:["u4a_superimposed","u4a_conflict"],
th:"These maps don't even cover the same area. How do I compare them?",
co:"Good eye! Map 2 is just West Africa, so zoom in on that part of Map 1. Do the lines match?",
kq:"How do Map 1's colonial borders differ from Map 2's culture-group boundaries? Describe ONE difference using both maps.",
ml:["Colonial lines vs. cultural regions",["A culture region's edges are irregular because they follow where a group settled.","Colonial borders divided land among European powers, so they often cut straight through culture regions.","Some groups were split among colonies, like the Hausa and the Ewe, while Nigeria lumped the Hausa, Yoruba, and Igbo together."],[["Culture region","An area where people share a language, customs, and identity."],["Ethnic group","People who share ancestry, culture, and identity."]]],
wk:["Map 1 shows colonies and Map 2 shows culture groups.","That says what each map shows, not how the boundaries differ (straight vs. irregular)."],
mw:"It describes both sides, proves it with groups the borders split, and says what that shows.",
fr:"T1- The colonial boundaries on Map 1 are ___, while the cultural boundaries on Map 2 are ___. E2- For example, the ___ on Map 2 ended up ___. A3- This shows that ___.",
qc:["On Map 2, the edges of the culture groups are mostly…",["irregular, following where each group lives","straight lines along latitude and longitude","the same as Map 1's colonial borders"],0,"Culture regions follow people, so their edges curve. Colonial lines didn't."]},
{v:"Explain",
q:"Explain ONE political outcome for present-day Africans as a result of the European colonial boundaries.",
sk:"Political outcomes of colonial borders",
s:[["Name a political outcome in general words. What happens when borders and nations don't match?",["Political means power and control of territory.","Civil war, separatist movements, border disputes, or weak national unity."]],["Give a specific real example.",["Nigeria: the Igbo region tried to break away as Biafra (1967–70).","Sudan: decades of civil war, then South Sudan's independence in 2011."]],["Explain HOW the colonial borders caused it.",["Use “because… which led to…”.","The borders forced very different groups into one country, or split one group across several."]]],
r:{m:"all",i:[["Names a political outcome (civil war, separatism, border disputes)",/conflict|\bwars?\b|fight|violen|genocide|rebel|separat|secess|seced|break(s|ing)? away|broke away|irredent|reunite|dispute|tension|unstable|instabil|coup|(weak|lack of|little)[^.]{0,20}(national|unity|identity|loyal)|national (identity|unity)|refugee|biafra|south sudan|rwanda|own (country|state)|(hard|difficult)[^.]{0,20}(govern|unite)/i,"Name a political outcome: ethnic conflict, civil war, a separatist movement, or a border dispute."],["Explains how: groups forced together or split apart",/together|(same|one) (country|state|colony|government)|combin|lump|(many|several|different|rival|multiple) (ethnic|cultur|groups|tribes|nations|religio)|(split|divid)\w*[^.]{0,30}(group|people|tribe|ethnic|nation|between|among|across)|across (the )?borders?|(different|two|neighboring|several) (countries|states)|ignor|(n.t|not) (match|follow)|hausa|yoruba|igbo|somali|tutsi|hutu|muslim|christian/i,"Explain HOW: the borders forced different groups into one country, or split one group across several."]]},
mo:"T1- One political outcome is ethnic conflict and civil war inside African countries. E2- Britain's Nigeria combined the Hausa-Fulani north, the Yoruba southwest, and the Igbo southeast, and in 1967 the Igbo region tried to break away as Biafra, starting a civil war (1967–70). A3- Because the borders put peoples with different languages, religions, and histories under one government, competition for power turned violent.",
b:["u4a_conflict"],
th:"Political outcome? Like… elections?",
co:"Think bigger: who controls the country, and does everyone inside the borders want to be in it?",
kq:"Colonial borders are still there today. What's ONE political problem they cause for Africans now, and how?",
ml:["From borders to conflict",["At independence, mostly in the 1950s and 1960s, African states kept the colonial borders, creating many multinational states.","Different groups forced into one state may compete for power, leading to civil war or separatism, like Biafra (1967–70) or South Sudan (2011).","Groups split across borders, like Somalis in Ethiopia and Kenya, may want to reunite, which can cause border disputes."],[["Multinational state","A country that contains several nations or ethnic groups."],["Separatism","A movement by a group to break away and form its own state."]]],
wk:["Colonial boundaries caused a lot of problems in Africa.","Too vague. Name a political outcome (like civil war) and explain how the borders caused it."],
mw:"It names an outcome, proves it with Biafra, and explains how the borders caused it.",
fr:"T1- One political outcome of colonial boundaries is ___. E2- For example, in ___, ___. A3- This happened because the borders ___, which led to ___.",
qc:["Which is a political outcome of colonial borders in Africa?",["South Sudan breaking away from Sudan in 2011","The Sahara Desert growing larger","The spread of cell phones"],0,"Grouping different peoples in one state led to civil war and, in Sudan's case, a new country."]},
{v:"Describe",
q:"Describe ONE way that European colonization of Africa reflected the concept of ethnocentrism.",
sk:"Ethnocentrism and colonization",
s:[["Say what ethnocentrism means, then how Europeans showed it.",["Ethnocentrism = judging other cultures by your own and seeing yours as superior.","Many Europeans called African cultures “uncivilized.”"]],["Give a specific example of colonizers acting on that attitude.",["Who was in the room at the Berlin Conference (1884–85)? Who wasn't?","Or: missionaries and colonial schools pushing Christianity and European languages."]],["Add a short A3: why is that ethnocentric?",["Europeans assumed African cultures didn't count, so they felt entitled to decide for Africans."]]],
r:{m:"all",i:[["Shows the attitude: Europeans saw their culture as superior",/superior|inferior|better|\bbest\b|(more|less) (civilized|advanced)|civiliz|primitive|savage|backward|barbar|heathen|lesser|look\w* down|judg|(right|correct) way|(n.t|not) (respect|value)|dismiss|racis|social darwin|white man.s burden/i,"Show the attitude: Europeans saw their own culture as superior and African cultures as “uncivilized.”"],["Gives a specific example (Berlin Conference, civilizing mission, imposed religion or language)",/berlin|conference|without[^.]{0,20}(africans?|consent)|no africans|(n.t|not|never|no) (invit|ask|consult|includ)\w*[^.]{0,15}africa|africans? (were|was)?\s?(n.t|not|never) (invit|ask|consult|includ)|mission|christian|convert|religio|language|english|french|school|educat|\blaws?\b|border|boundar|ignor|replac|\bban|impos|forc(e|ed|ing) (their|them|africans)|tradition|custom|kingdom|burden|forced labor|slave/i,"Add a specific example: at the Berlin Conference, Europeans divided Africa without inviting a single African."]]},
mo:"T1- European colonization reflected ethnocentrism because Europeans judged African cultures by their own standards and saw their own culture as superior. E2- At the Berlin Conference (1884–85), European leaders set the rules for dividing Africa without inviting a single African, and colonizers later pushed Christianity and European languages on Africans as a so-called “civilizing mission.” A3- This shows ethnocentrism because Europeans assumed African kingdoms and cultures didn't count.",
b:["u4a_ethnocentrism","u4a_berlin"],
th:"Ethno-what? I can't even say it.",
co:"Break it apart: ethno = people or culture, centric = at the center. It means judging everyone by YOUR culture.",
kq:"How did European colonizers show they saw their culture as better than African cultures? Describe ONE example.",
ml:["Ethnocentrism and colonization",["Ethnocentrism means judging other cultures by your own culture's standards and seeing yours as superior.","Many Europeans claimed they were bringing “civilization” to Africa, an idea called the civilizing mission.","At the Berlin Conference (1884–85) no Africans were invited, and colonizers treated complex African kingdoms as if they didn't count."],[["Ethnocentrism","Believing your own culture is superior and judging others by it."],["Cultural relativism","Understanding a culture on its own terms."]]],
wk:["Ethnocentrism is when you think your culture is better than other cultures.","A correct definition, but it never connects to Africa. Add an example, like the Berlin Conference."],
mw:"It shows the attitude, gives specific examples, and explains why that's ethnocentric.",
fr:"T1- European colonization reflected ethnocentrism because Europeans ___. E2- For example, ___. A3- This shows ethnocentrism because ___.",
qc:["Judging another culture by your own culture's standards is called…",["ethnocentrism","cultural relativism","acculturation"],0,"Ethnocentrism puts your own culture at the center and judges others by it."]},
{v:"Explain",
q:"Explain ONE way that the political boundaries shown in Map 1 illustrate a European colonial emphasis on resource extraction.",
sk:"Boundaries and resource extraction",
s:[["Name the pattern in general words. What do many colonies on Map 1 make sure to include?",["Trace the coastal colonies. Which way do they stretch?","Many were drawn to grab a coastline or river mouth."]],["Point to a specific colony on Map 1 as proof.",["Find the Belgian Congo. How does it reach the ocean?","Through a narrow strip at the Congo River's mouth. The Gold Coast and Togo also run inland from the coast."]],["Explain HOW that helped extract resources.",["Coasts and rivers meant ports, so rubber, gold, and cocoa from the interior could be shipped to Europe."]]],
r:{m:"all",i:[["Uses Map 1: colonies drawn to include coasts, rivers, or ports",/coast|ocean|\bseas?\b|atlantic|\bports?\b|harbo|river|congo|gambia|\bniger\b|corridor|strip|narrow|access|outlet|inland|interior|togo|belgian|(around|surround|includ|grab)\w*[^.]{0,40}(resource|mines?\b|gold|diamond|copper|rubber)/i,"Point to Map 1: many colonies, like the Belgian Congo, were drawn to include a coast or river mouth."],["Explains extraction: moving raw materials out to Europe",/resource|raw|material|rubber|cocoa|\bgold\b(?! coast)|diamond|copper|palm|ivory|peanut|cotton|timber|mineral|\bores?\b|\boil\b|\bcrops?\b|export|ship\w* (out|to|back|them|it)|extract|(send|sent|take|took|bring|brought|carr|mov|get|got)\w*[^.]{0,40}(to|back to) (europe|britain|france|belgium|portugal|germany)/i,"Explain the extraction: ports let colonizers ship raw materials like rubber and gold to Europe."]]},
mo:"T1- The boundaries on Map 1 show an emphasis on resource extraction because many colonies were drawn to include a coast or a major river for shipping raw materials out. E2- For example, the huge Belgian Congo reaches the Atlantic through a narrow strip at the mouth of the Congo River, and the Gold Coast and Togo are narrow strips running inland from the shore. A3- This let colonizers move rubber, gold, and cocoa from the interior to ports and on to Europe, instead of linking African communities to each other.",
b:["u4a_extraction"],
th:"How can a border show resource extraction? It's just a line.",
co:"Look at WHERE the lines go. Which colonies grab a piece of coast or a river mouth? Ships can't sail into the middle of a continent.",
kq:"How do the borders on Map 1 show that Europeans mainly wanted Africa's resources? Explain ONE way.",
ml:["Borders built for extraction",["Colonial economies exported raw materials to Europe, so every shipment had to reach a port.","On Map 1, the Gold Coast and Togo are narrow strips running inland from the coast, and Gambia is a thin strip along a river.","The huge Belgian Congo reaches the ocean only through a narrow strip at the Congo River's mouth, its outlet for shipping rubber."],[["Resource extraction","Taking raw materials out of a place to use or sell elsewhere."],["Raw material","An unprocessed resource like rubber, gold, or cocoa."]]],
wk:["Europeans wanted Africa's resources, like gold and rubber.","True, but it never uses Map 1's boundaries. Point to a border feature, like colonies drawn to include coasts."],
mw:"It names the border pattern, points to Map 1, and explains how it moved raw materials to Europe.",
fr:"T1- Map 1's boundaries show resource extraction because many colonies ___. E2- For example, ___. A3- This helped Europeans because ___, which let them ___.",
qc:["Why did so many colonies include at least a stretch of coast?",["To ship raw materials out through ports","To build beach towns for colonists","Because coasts had no culture groups"],0,"Raw materials had to reach a port to be shipped to European factories."]},

{v:"Explain",
q:"Explain a possible limitation of using Map 2 to understand the geography of religion in present-day Africa.",

mo:"T1- One limitation is that Map 2 shows culture groups, not religions, and one culture group can include people of several faiths. E2- For example, the Yoruba include many Muslims, many Christians, and followers of traditional Yoruba religion, but Map 2 shades the whole Yoruba area the same way. A3- Because Islam and Christianity spread across culture-group lines through trade and missionaries, using Map 2 to guess religion would give a false picture of where each faith is practiced today.",

kq:"Why would Map 2 be a weak tool for figuring out where religions are practiced in Africa today? Explain ONE problem.",

wk:["Map 2 doesn't show religion.","That's the start, but Explain needs the why: one culture group, like the Yoruba, can include several religions."],
mw:"It names the limitation, proves it with the Yoruba, and explains how Map 2 alone would mislead.",
fr:"T1- One limitation of Map 2 is that it shows ___, not ___. E2- For example, ___. A3- This is a problem because ___.",

]});
addBG({
u4c_territory:{t:"Territoriality",s:["Territoriality is people's connection to a specific piece of land and their effort to claim, defend, and control it.","Geographer Robert Sack described it as controlling people and things by controlling an area.","It shows up at every scale: a country guarding its border, a city zoning its land, a neighborhood's “residents only” parking.","It helps explain fights over land with deep meaning, like Kashmir, which India and Pakistan both claim."]},
u4c_sovereignty:{t:"Sovereignty & the state",s:["A state is an independent country: a defined territory with a permanent population, a government, and sovereignty.","Sovereignty is a state's supreme authority to govern its own territory without interference from other states.","The idea is often traced to the Peace of Westphalia (1648), which ended the Thirty Years' War in Europe."]},
u4c_unitfed:{t:"Unitary vs. federal states",s:["A unitary state concentrates power in the central government: France, Japan, China.","A federal state divides power between the national government and states or provinces, and the constitution protects each level's powers: the U.S., Germany, India, Canada.","Federal systems often fit large, diverse countries, since regions can make laws that fit local needs.","The United Kingdom is unitary, but it has devolved some powers to Scotland, Wales, and Northern Ireland."]},
u4c_brexit:{t:"Supranationalism & Brexit",s:["Supranationalism is when three or more states give up some sovereignty to an organization, like the European Union (EU), for shared goals.","EU members follow EU law and allow free movement of EU citizens, and the European Court of Justice has the final word on EU law.","In a June 23, 2016 referendum, about 52% of UK voters chose to leave, after a campaign promising to “take back control” of laws, borders, trade, and money.","The UK left the EU on January 31, 2020."]},
u4c_devolution:{t:"Devolution",s:["Devolution is the transfer of power from a state's central government to its regions, often driven by differences in culture, wealth, or distance from the capital.","Scotland got its own parliament in 1999. In a 2014 referendum, about 55% of Scots voted to stay in the UK.","Catalonia held a 2017 independence vote that Spain's courts ruled illegal, and French-speaking Quebec voted by a hair to stay in Canada in 1995.","Belgium became a federal state in 1993, largely because of tension between Dutch-speaking Flanders and French-speaking Wallonia."]},
u4c_cityvote:{t:"City elections: at-large vs. districts",s:["In at-large elections, every voter in a city votes for every council seat, so a citywide majority can win them all.","In district (ward) elections, each district elects one member, so where the lines fall decides who wins.","Voting rights lawsuits, especially under California's Voting Rights Act (2001), have pushed many cities to switch to district elections, which often helps minority neighborhoods win seats.","City maps are redrawn after each census to keep districts equal in population, and they can be packed or cracked too."]},
u4c_fragment:{t:"Political fragmentation",s:["A metropolitan (metro) area is a central city plus its suburbs, tied together by commuting.","Political fragmentation means a metro area is split among many separate local governments, each with its own budget and priorities. The Chicago area alone has hundreds.","That makes transit, roads, and water hard to plan across boundaries.","One fix is a regional authority: WMATA, created in 1967 by Maryland, Virginia, and Washington, D.C., runs one Metro system for the whole region."]}
});

nt:[["What do you already know about territoriality and sovereignty? How are they different?","Territoriality is people's attachment to a piece of land and their urge to control it. Sovereignty is a state's recognized right to govern its own territory without outside interference. One is a feeling and a behavior; the other is official authority."],["What do you already know about unitary and federal states? Can you name one of each?","Unitary: the central government holds most of the power (France, Japan, China). Federal: power is shared with states or provinces (the U.S., Germany, India, Canada). Trick: UNI means one center of power."],["What do you already know about devolution and supranationalism? Which way does each one move power?","Devolution moves power DOWN to regions, like Scotland's parliament (1999). Supranationalism moves some power UP to a group of countries, like the European Union. Brexit was the UK taking power back from the EU."]],

mo:"Territoriality is the connection of people, their culture, and their economy to a specific piece of land, shown when they try to claim, defend, and control that territory.",
b:["u4c_territory"],
th:"Territoriality... is that just a fancy word for territory?",
co:"Close! Territory is the land itself. Territoriality is how people FEEL about that land and ACT on it. Think of a dog guarding its yard, scaled up to a whole country.",
kq:"What does territoriality mean in political geography? Give the meaning in one sentence.",
ml:["Territoriality",["Territory is the land. Territoriality is people's connection to that land and their effort to control it.","The AP course defines it as the connection of people, their culture, and their economic systems to the land.","It shows up at every scale and helps explain border disputes and independence movements."],[["Territoriality","People's connection to a specific piece of land and their effort to claim and control it."],["Territory","The land itself: an area a group or government claims."]]],
wk:["Territoriality is the land that a country owns.","That defines territory, not territoriality. Add the human part: people's attachment to the land and their effort to control it."],

{v:"Describe",

mo:"T1- Sovereignty is a state's supreme authority to govern its own territory and people without interference from other states. E2- A sovereign state like Japan makes its own laws, controls its borders, prints its own money, and signs treaties, and other countries recognize that right. A3- Sovereignty is what makes a place a true state: Puerto Rico has its own government but is not sovereign, because the U.S. Congress has the final say over it.",

ml:["Sovereignty and the state",["A state is an independent country: a defined territory with a permanent population, a government, and sovereignty.","Sovereignty is a state's supreme authority to govern its own territory without outside interference, so it can make laws, control borders, and sign treaties.","Recognition matters: Taiwan governs itself, but only about a dozen countries officially recognize it as a state."],[["State","An independent country with territory, people, a government, and sovereignty."],["Sovereignty","A state's authority to govern itself without outside interference."]]],

mo:"T1- In a unitary state the central government holds most of the power, while in a federal state power is shared between the national government and states or provinces. E2- For example, in unitary France the national government in Paris sets most policy, including one national school curriculum, while in the federal United States each of the 50 states makes many of its own laws, like speed limits. A3- This matters because a federal system lets a large, diverse country give regions control over local issues, while a unitary system keeps laws the same nationwide.",
b:["u4c_unitfed"],
th:"Unitary, federal... I always mix these up.",
co:"Trick: UNI means one, like a unicycle. A unitary state has ONE main center of power. A federal state splits power between levels, like Washington and the 50 states. Now describe BOTH sides!",
kq:"What is ONE way unitary and federal states differ? Say what's true of EACH one.",
ml:["Unitary vs. federal",["In a unitary state, the central government holds most of the power. France, Japan, and China are unitary.","In a federal state, the constitution divides power between the national government and states or provinces. The U.S., Germany, India, and Canada are federal.","Federal systems often fit large, diverse countries; unitary systems often fit smaller or more culturally similar ones."],[["Unitary state","A state where the central government holds most of the power."],["Federal state","A state where power is divided between national and regional governments."]]],
wk:["A federal state shares power between the national government and the states.","That's only half of a comparison. Add the unitary side: in a unitary state, the central government holds most of the power."],

kq:"Why did sovereignty, a country being in charge of itself, push the UK to leave the EU? Explain ONE reason.",
ml:["Supranationalism and Brexit",["Supranationalism is when three or more states give up some sovereignty to an organization, like the EU, for shared benefits.","EU members follow EU laws, let EU citizens live and work in any member country, and let the EU negotiate their trade deals.","Leave campaigners said the UK had lost control of its laws, borders, and trade."],[["Supranationalism","Three or more states sharing some sovereignty in an organization like the EU."],["Referendum","A vote in which citizens decide one question directly."]]],
wk:["The UK left the EU because people voted for Brexit.","That says what happened, not why. Name what the UK wanted control over (laws, borders, trade) and how leaving gave it back."],
mw:"It names what voters felt the UK had lost (laws, borders, courts), gives proof (free movement, the European Court of Justice), and explains how that led to leaving.",
fr:"T1- Sovereignty played a role in Brexit because ___. E2- As an EU member, the UK had to ___. A3- Because many voters wanted ___, ___.",
qc:["The Leave campaign's famous Brexit slogan was…",["“Take back control”","“Stronger together”","“Europe first”"],0,"“Take back control” was a sovereignty argument: control over the UK's own laws, borders, and trade."]},
{v:"Explain",
q:"Explain ONE possible reason why territoriality would play a role in devolution.",
sk:"Territoriality and devolution",
s:[["Name the reason in general words. How does a group feel about the region it sees as its homeland?",["Territoriality = attachment to a specific piece of land + the urge to control it."]],["Give a real example of a region pushing for power.",["Scotland (UK), Catalonia (Spain), Quebec (Canada), or Flanders (Belgium).","Many Scots see Scotland as its own nation, and it got its own parliament in 1999."]],["Explain HOW territoriality leads to devolution.",["Attachment to a homeland → demand to control it → the national government hands power down.","If refused, demands can grow into independence movements, like Catalonia's 2017 vote."]]],
r:{m:"all",i:[["Names the territorial link: a group's attachment to its homeland or region",/attach|connect|\bties?\b|tied|bond|belong|identi|homeland|\bhome\b|loyal|pride|proud|heritage|cultur|language|ethnic|\bnation\b|distinct|unique|own (land|region|territor|area|people|history)|their (land|region|territor|area)|ancest|histor|claim/i,"Name the territorial link: the group feels a deep attachment to its homeland and wants to control it."],["Explains the result: demands for self-rule, autonomy, or independence",/devol|self-?(rule|govern)|autonom|independen|separat|secede|secess|own (parliament|government|legislature|assembly|laws|country|state)|parliament|more (power|control|say|authority)|power (to|from)|govern (itself|themselves|their)|rule themselves|referendum|break away|\bleave\b/i,"Explain the result: that attachment drives demands for self-rule, so power is handed down to the region."]]},
mo:"T1- Territoriality can lead to devolution because a group deeply attached to its homeland wants to control that territory itself. E2- For example, many Scots see Scotland as a distinct nation with its own history and identity, so they pushed for self-rule, and in 1999 the UK opened a Scottish Parliament with power over schools, health care, and policing. A3- Because people want decisions about their land made in their own region, not a distant capital, this attachment pressures the national government to devolve power.",
b:["u4c_devolution","u4c_territory"],
th:"How does a feeling about land turn into a whole new government?",
co:"When a group feels a region is THEIR homeland, with its own language and history, they want decisions about it made there, not in a faraway capital. Push hard enough, and the national government hands power down. That's devolution.",
kq:"How can a group's attachment to its own region lead the national government to hand power down? Explain ONE reason.",
ml:["Territoriality drives devolution",["Devolution is the transfer of power from a state's central government to its regions.","Territoriality gives groups a reason to want that power: they see a region as their homeland and want to control it.","Examples: Scots in Scotland, Catalans in Catalonia (Spain), French speakers in Quebec (Canada), and Dutch speakers in Flanders (Belgium)."],[["Devolution","The transfer of power from a central government to regions."],["Autonomy","Self-government by a region inside a larger state."]]],
wk:["Devolution is when the central government gives power to regions.","A correct definition, but it skips territoriality. Explain how a group's attachment to its homeland makes it push for power."],
mw:"It links territoriality (attachment to a homeland) to devolution (demands for self-rule) and proves it with Scotland.",
fr:"T1- Territoriality can lead to devolution because ___. E2- For example, in ___, ___. A3- As a result, ___.",
qc:["Which is an example of devolution?",["The UK creating a Scottish Parliament","Countries joining the European Union","A city annexing a nearby suburb"],0,"Devolution moves power DOWN from the national government to a region, like Scotland."]},

b:["u4c_cityvote","scale"],

kq:"How can moving district lines inside a city change who wins city council seats? Explain.",
ml:["Redistricting inside a city",["In district elections, each council district elects one member, so the lines decide which neighborhoods vote together.","Cracking splits a group's neighborhood so it's outnumbered everywhere; packing crams it into one district so its extra votes are wasted.","Lines can also create a majority-minority district, where a minority group is most of the voters and can elect a candidate it chooses."],[["At-large election","Every voter in the city votes for every council seat."],["Majority-minority district","A district where a racial or ethnic minority group makes up most of the voters."]]],

mo:"T1- Neighboring governments may struggle to provide transportation because a growing metro area is politically fragmented into many separate cities and counties, each with its own budget and priorities. E2- For example, in 2019 suburban Gwinnett County voted not to join Atlanta's MARTA system, so MARTA trains still don't reach the county. A3- Because no single government runs the whole metro, governments argue over who should pay, and bus and rail routes stop at city or county lines, leaving commuters stuck in traffic as the region grows.",

addBG({
u4t_gerry:{t:"Gerrymandering: packing & cracking",s:["Gerrymandering is drawing district lines on purpose to help one party or group win more seats.","It's named for Massachusetts Governor Elbridge Gerry, who in 1812 signed a map with a salamander-shaped district.","Packing crowds the other side's voters into a few districts, which they win by huge margins.","Cracking splits the other side's voters across many districts so they're a minority in each. Both tricks waste the other side's votes."]},
u4t_census:{t:"Census, reapportionment & redistricting",s:["The U.S. Constitution requires a census, a count of every person, every ten years.","After each census, the House's 435 seats are reapportioned among the states by population. After 2020, Texas gained 2 seats and New York lost 1.","Each state then redistricts: it redraws its lines so every district has about the same population (“one person, one vote”).","Some states, like Texas, have also redrawn maps mid-decade."]},
u4t_vra:{t:"Voting Rights Act & majority-minority districts",s:["The Voting Rights Act of 1965 outlawed racial discrimination in voting, such as literacy tests used to keep Black Southerners from voting.","Section 2 of the law has been used to challenge maps that dilute minority voting power, for example by cracking a minority community.","Starting in the 1980s, courts used it to require some majority-minority districts, where a minority group makes up most of the voters.","Courts have also ruled that race can't be the main factor in drawing lines, and how far Section 2 reaches is still being argued, all the way to the Supreme Court."]},
u4t_commission:{t:"Commissions, compactness & contiguity",s:["In most states, the legislature draws congressional lines, so the party in control can help itself.","An independent redistricting commission is a separate panel that draws the lines instead, as in Arizona, Colorado, and Michigan.","Compactness means a tight, simple shape. Contiguity means every part of a district touches the rest."]},
u4t_federal:{t:"States: federal vs. unitary",s:["In AP Human Geography, a state is an independent country with sovereignty. U.S. states like Westmoor are units inside one country.","A nation is a people with a shared culture. A nation-state is mostly one nation (Japan), a multinational state holds several (the United Kingdom), and a stateless nation (the Kurds) has no state.","A federal state splits power between national and regional governments (the U.S., Germany, India); a unitary state keeps it national (France, China).","Because the U.S. is federal, each state runs its own redistricting, so the rules differ from state to state."]},
u4t_safe:{t:"Safe seats, turnout & polarization",s:["A safe seat is a district one party is almost certain to win. A swing district could go either way.","Voters who always lose may feel their votes don't count, which can lower turnout.","In safe seats, the real race is often the party primary, which can pull candidates toward the extremes and add to polarization."]},
u4t_centri:{t:"Centrifugal & centripetal forces",s:["Centrifugal forces divide a country: conflict between groups, unequal treatment, economic gaps, or distrust of government.","Centripetal forces unify it: a shared identity, national symbols, and trusted institutions like fair elections.","Strong centrifugal forces can lead to devolution, where power shifts to regions, as when Scotland got its own parliament inside the United Kingdom."]}
});

stim:"<h4 style=\"color:var(--yl);margin:14px 0 6px\">Stimulus 1: Two District Plans for Westmoor</h4><svg viewBox=\"0 0 340 180\" role=\"img\" font-family=\"Chakra Petch,sans-serif\" aria-label=\"Two maps, Plan 1 and Plan 2, of the same 5 by 5 grid of 25 equal-population precincts in fictional Westmoor. Each precinct shows the party that won it, A in cyan or B in pink. Rows north to south, precincts west to east. Row 1: A A A A A. Row 2: A B B A A. Row 3: A B B B A. Row 4: A B B B A. Row 5: A A B B A. Party A wins 15 precincts; Party B wins 10, clustered in the center and south. Thick yellow lines split each map into 5 numbered districts of 5 precincts. Plan 1 districts by row: 1 1 2 2 2; 1 1 3 3 2; 1 3 3 3 2; 4 4 4 5 5; 4 4 5 5 5. Plan 2 districts by row: 1 1 2 2 3; 1 1 2 2 3; 5 1 2 3 3; 5 5 5 3 4; 5 4 4 4 4.\"><defs><g id=\"u4tg\"><rect width=\"140\" height=\"140\" fill=\"#22e5ff\"/><path d=\"M28 28h56v28h28v84H56v-28H28z\" fill=\"#ff3fa4\"/><path d=\"M0 28h140M0 56h140M0 84h140M0 112h140M28 0v140M56 0v140M84 0v140M112 0v140\" stroke=\"#0a1d3a\" stroke-opacity=\".45\"/><g font-size=\"8\" font-weight=\"700\" fill=\"#0a1d3a\"><text x=\"3 31 59 87 115\" y=\"10\">AAAAA</text><text x=\"3 31 59 87 115\" y=\"38\">ABBAA</text><text x=\"3 31 59 87 115\" y=\"66\">ABBBA</text><text x=\"3 31 59 87 115\" y=\"94\">ABBBA</text><text x=\"3 31 59 87 115\" y=\"122\">AABBA</text></g></g><path id=\"u4t1\" d=\"M0 0h140v140H0zM28 56v28M56 0v56M56 112v28M84 84v28M112 28v56M56 28h56M28 56h28M0 84h140M56 112h28\"/><path id=\"u4t2\" d=\"M0 0h140v140H0zM28 56v28M28 112v28M56 0v84M84 56v56M112 0v56M112 84v28M0 56h28M84 56h28M28 84h56M112 84h28M28 112h84\"/></defs><rect width=\"340\" height=\"180\" fill=\"#0a1d3a\"/><g font-size=\"12\" font-weight=\"700\" fill=\"#ffe7a6\" text-anchor=\"middle\"><text x=\"84\" y=\"21\">PLAN 1</text><text x=\"256\" y=\"21\">PLAN 2</text></g><use href=\"#u4tg\" x=\"14\" y=\"30\"/><use href=\"#u4tg\" x=\"186\" y=\"30\"/><g fill=\"none\" stroke-linecap=\"square\"><g stroke=\"#0a1d3a\" stroke-width=\"6\"><use href=\"#u4t1\" x=\"14\" y=\"30\"/><use href=\"#u4t2\" x=\"186\" y=\"30\"/></g><g stroke=\"#ffd23f\" stroke-width=\"3\"><use href=\"#u4t1\" x=\"14\" y=\"30\"/><use href=\"#u4t2\" x=\"186\" y=\"30\"/></g></g><g font-size=\"15\" font-weight=\"700\" fill=\"#ffd23f\" stroke=\"#0a1d3a\" stroke-width=\"3.5\" paint-order=\"stroke\" text-anchor=\"middle\"><text x=\"31 143 87 59 115\" y=\"79 79 107 135 163\">12345</text><text x=\"203 259 315 287 231\" y=\"79 79 107 163 135\">12345</text></g></svg><div class=\"legend\"><span><i style=\"background:#22e5ff\"></i>A = precinct won by Party A</span><span><i style=\"background:#ff3fa4\"></i>B = precinct won by Party B</span><span><i style=\"background:#ffd23f\"></i>District border</span><span>1–5 = district number</span></div><p class=\"src\">Fictional state created for practice. Simplified: all 25 precincts have equal populations, and a party wins a district by winning at least 3 of its 5 precincts.</p><h4 style=\"color:var(--yl);margin:14px 0 6px\">Stimulus 2: Election Results in Westmoor Under Each Plan</h4><div class=\"tbl\"><table><thead><tr><th>Result</th><th>Party A</th><th>Party B</th></tr></thead><tbody><tr><td>Statewide vote share</td><td>60%</td><td>40%</td></tr><tr><td>Precincts won (of 25)</td><td>15</td><td>10</td></tr><tr><td>Districts won under Plan 1 (of 5)</td><td>3</td><td>2</td></tr><tr><td>Percent of seats under Plan 1</td><td>60%</td><td>40%</td></tr><tr><td>Districts won under Plan 2 (of 5)</td><td>5</td><td>0</td></tr><tr><td>Percent of seats under Plan 2</td><td>100%</td><td>0%</td></tr></tbody></table></div><p class=\"src\">Fictional data created for practice. Simplified: equal-population precincts, and the same statewide vote under both plans. Remember: label each part, and write Describe and Explain parts as T1- (your reason in general words), E2- (the specific proof), A3- (why it matters).</p>",

nt:[["Stimulus 1: the precinct colors are the same in both maps. How many precincts does each party win, and WHERE are Party B's?","Party A wins 15 cyan precincts and Party B wins 10 pink ones, clustered in the center and south like voters in a city. Only the yellow district lines move between maps."],["Pick a Plan 2 district and count its pink (B) precincts. Try another. What do you notice?","Every Plan 2 district has exactly 2 pink and 3 cyan precincts, so Party B is outnumbered 3 to 2 everywhere. In Plan 1, Districts 3 and 5 have a pink majority."],["Now connect them. In Stimulus 2, what changes for Party B between the plans, and what in Stimulus 1 explains it?","The vote stays 60% to 40%, but Party B drops from 2 seats (40%) to 0 seats (0%). The voters didn't change. Only the lines did. That's the big idea behind gerrymandering."]],

ml:["Packing vs. cracking",["Gerrymandering is drawing district lines on purpose to help one party or group win more seats.","Packing crowds the other side's voters into a few districts, which they win by huge margins.","Cracking splits the other side's voters across many districts so they're a minority in each one."],[["Cracking","Splitting a group's voters across many districts."],["Packing","Crowding a group's voters into as few districts as possible."]]],

let h=`${S.f.stim?`<details class="peek" data-pk="stim"><summary>View stimul${S.f.two?'i':'us'}</summary><div>${stimBox()}</div></details>`:''}
<div class="sub" role="tablist" aria-label="Steps for Part ${L(i)}">${CARDS.map(([ic,t],k)=>`<button class="sb ${k==c?'on':k<c||(k==5&&st.ck)?'dn':''}" data-a="card" data-i="${i}" data-c="${k}" ${k==5&&!st.ck?'disabled':''} ${k==c?'aria-current="step"':''}><span aria-hidden="true">${ic}</span>${t}</button>`).join('')}</div>`;
const nav=(nx,lab)=>`<div class="row navrow">${c>0?`<button class="btn o" data-a="card" data-i="${i}" data-c="${c-1}">◀ Back</button>`:''}<button class="btn c" data-a="card" data-i="${i}" data-c="${nx}">${lab} ▸</button></div>`;
const qline=`<div class="qmini"><span class="px">Part ${L(i)} · ${P.v}</span><h2 tabindex="-1">${esc(P.q)}</h2></div>`;
if(c==0)h+=`<div class="qbox"><span class="px">Part ${L(i)} · ${P.v}</span><h2 tabindex="-1" style="font-size:19px;line-height:1.45">${esc(P.q)}</h2><div class="plain"><b>In plain words:</b> ${esc(P.kq)}</div></div>
<div class="coach"><div class="av" aria-hidden="true">🧭</div><div><p class="kid">“${esc(P.th).replace(/“/g,"‘").replace(/”/g,"’")}”</p><p><b>Tutor:</b> ${esc(P.co)}</p></div></div>${nav(1,'Got it! What does “'+P.v+'” mean?')}<button class="link" data-a="card" data-i="${i}" data-c="4">Feeling confident? Try it cold first ▸</button>`;
if(c==1)h+=qline+`<div class="panel"><span class="tag px">Decode the verb</span><div class="verb"><span class="vb">${P.v}</span><div><b>${V.d}</b><ul>${V.l.map(x=>`<li>${x}</li>`).join('')}</ul></div></div><div style="margin-top:8px">${chips(tea?['frq','tea']:['frq'])}</div></div>${nav(2,'Learn what I need')}`;
if(c==2)h+=qline+`<div class="panel"><span class="tag px">Learn what you need</span><h3 class="lt">${esc(P.ml[0])}</h3><ul class="les">${P.ml[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
<div class="voc"><span class="px">Key words</span>${P.ml[2].map(v=>`<p><b>${esc(v[0])}:</b> ${esc(v[1])}</p>`).join('')}</div></div>
<div class="panel"><span class="tag px">Quick check</span><p class="note">Pulling an idea out of your memory makes it stick. Give it a try!</p>${mcqV(P.qc,st.q,(i+S.fi)%3,'mcq',`data-i="${i}"`)}</div>
<p class="note">Want the bigger story?</p>${chips(P.b)}${nav(3,'Think it through')}<button class="link" data-a="card" data-i="${i}" data-c="4">Already know this? Skip to writing</button>`;
if(c==3){h+=qline+`<div class="panel"><span class="tag px">Think it through${tea?' with TEA':''}</span>`;
P.s.slice(0,st.st).forEach((s,j)=>{const t=tea?TEA[j]:[j+1,'Step '+(j+1),'','#22e5ff'],shown=s[1].filter((_,m)=>st.h[j+'-'+m]).length;
h+=`<div class="step" style="color:${t[3]}"><div class="badge">${t[0]}</div><div style="color:var(--ink);flex:1"><div class="lb" style="color:${t[3]}">${t[1]}</div><p class="pr">${esc(s[0])}</p>${s[1].slice(0,shown).map(x=>`<div class="hint">${esc(x)}</div>`).join('')}${shown<s[1].length?`<button class="hb" data-a="hint" data-j="${j}" data-m="${shown}">Hint ${shown+1}/${s[1].length}</button>`:''}</div></div>`});
h+=`</div><div class="row"><button class="btn o" data-a="card" data-i="${i}" data-c="2">◀ Back</button>${st.st<P.s.length?`<button class="btn c" data-a="step" data-i="${i}">Next step ▸</button>`:`<button class="btn c" data-a="card" data-i="${i}" data-c="4">Start writing ▸</button>`}</div>${st.st<P.s.length?`<button class="link" data-a="card" data-i="${i}" data-c="4">I'm ready, skip to writing</button>`:''}`}
if(c==4)h+=qline+`<div class="panel"><span class="tag px">Write it</span>${tea?`<div class="teamini">Label it: <b class="tT">T1-</b> your reason · <b class="tE">E2-</b> specific proof · <b class="tA">A3-</b> why it matters</div>`:`<div class="teamini">${P.v=='Define'?'Define = give the meaning in one full sentence: “[Term] is…”':'Identify = one short, specific answer, written as a complete sentence.'}</div>`}
<details class="peek weak" data-pk="weak"><summary>Don't fall for this weak answer</summary><div><p class="wa">“${esc(P.wk[0])}”</p><p><b>❌ Why it misses:</b> ${esc(P.wk[1])}</p></div></details>
<textarea id="ans" data-in="ans" data-i="${i}" placeholder="${tea?'Write 2–3 sentences…':'Write one short sentence…'}" aria-label="Your answer">${esc(st.a)}</textarea>
<div class="chips"><button class="chip fr" data-a="frame" data-i="${i}">🧩 Stuck? Use a sentence frame</button>${tea?["For example, ","This is because ","which leads to ","As a result, "].map(c=>`<button class="chip" data-a="ins" data-t="${c}">+ ${c.trim()}</button>`).join(''):''}</div>
${st.w?'<p class="fix" role="alert">⚠ You still have blanks (___) to fill in. Replace each one with your own words first!</p>':''}
<div class="conf"><span>How sure are you?</span>${['😬 Not sure','🙂 Kind of','😎 Very'].map((t,k)=>`<button class="cb ${st.cf===k?'on':''}" data-a="cf" data-i="${i}" data-k="${k}" aria-pressed="${st.cf===k}">${t}</button>`).join('')}</div>
<div class="row"><button class="btn o" data-a="card" data-i="${i}" data-c="3">◀ Back</button><button class="btn" data-a="check" data-i="${i}">Check my answer ▸</button></div></div>`;
if(c==5&&st.ck){const ok=earned(i);h+=qline+`<div class="panel"><span class="tag px">Check it</span><p class="note" style="margin:0 0 6px">Your answer:</p><div class="mine">${esc(st.a)}</div>
<p style="margin-top:12px"><b>What earns the point${P.r.m=="any"?' (any ONE of these)':' (you need ALL of these)'}:</b> Tick each one your answer really does.</p>
<ul class="ck">${P.r.i.map((r,j)=>`<li><label><input type="checkbox" data-a="box" data-i="${i}" data-j="${j}" ${st.box[j]?'checked':''}><span>${esc(r[0])}${st.g[j]?'<small>Tutor spotted this; double-check it.</small>':''}${!st.box[j]&&!(P.r.m=="any"&&st.box.some(Boolean))?`<em class="fix">Fix it: ${esc(r[2])}</em>`:''}</span></label></li>`).join('')}</ul>
<p class="note">The tutor guesses from keywords. <b>You</b> make the final call, so be honest!</p>
<div class="model"><span class="px">Model answer</span>${esc(P.mo)}<p class="why"><b>✅ Why it works:</b> ${esc(P.mw)}</p></div>
<div role="status" class="verdict ${ok?'y':'n'}">${ok?YES[i%3]:'Not yet, and “not yet” is how everyone learns. Use the Fix-it tips, then revise.'}${ok&&S.cb>0?`<span class="combo">🔥 ${S.cb+1} in a row!</span>`:''}</div>${st.cf==null?'':`<p class="cal">${CAL[st.cf][ok?0:1]}</p>`}
<div class="row">${ok?'':`<button class="btn o" data-a="rev" data-i="${i}">✎ Revise</button>`}<button class="btn g" data-a="next" data-i="${i}">${i+1<n?`On to Part ${L(i+1)} ▸`:'See results ▸'}</button></div></div>`}
return h}
function bossV(){const B=S.bo;if(!B)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p>3 lightning questions on what you just learned. Quick recall now helps you remember it next week.</p><div class="row"><button class="btn m" data-a="boss">Start Boss Round ▸</button></div></div>`;
if(B.k>=B.l.length)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p class="big" style="font-size:20px">${B.r==B.l.length?'Boss defeated!':'Boss battle over!'}</p><p style="text-align:center">You got <b>${B.r}/${B.l.length}</b> on the first try.${B.r<B.l.length?' Come back tomorrow and replay. Spacing out practice is how memories stick.':''}</p></div>`;
const i=B.l[B.k],q=S.f.p[i].qc;return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round · ${B.k+1}/${B.l.length}</span>${mcqV(q,B.s,(i+B.k+1)%3,'bq','')}${B.s===0||B.s>0?`<div class="row"><button class="btn m" data-a="bn">${B.k+1<B.l.length?'Next ▸':'Finish ▸'}</button></div>`:''}</div>`}
function exportTxt(){const n=S.f.p.length;return `${S.f.t} (${S.f.u}) · GeoArcade FRQ Tutor\nScore: ${score()}/${n}\n\n`+S.f.p.map((p,i)=>{const st=S.p[i];return `Part ${L(i)} (${p.v}): ${p.q}\nMy answer: ${st.a.trim()||'(blank)'}\nResult: ${st.done?(st.ok?'point earned':'not yet'):'not attempted'}\n`}).join('\n')}
function doneV(){const n=S.f.p.length,sc=score(),ps=S.f.p.map((p,i)=>[p,i,S.p[i]]),ok=ps.filter(x=>x[2].ok),no=ps.filter(x=>x[2].done&&!x[2].ok),un=ps.filter(x=>!x[2].done);
const rank=sc==n?"GEO LEGEND":sc>=5?"MAP MASTER":sc>=3?"RISING SCOUT":"KEEP PLAYING";
return `<div class="panel" style="text-align:center"><h2 class="big" tabindex="-1">${un.length?'Progress report':'Stage clear!'}</h2><div class="stars" aria-label="${sc} of ${n}">${'★'.repeat(sc)}<span style="opacity:.25">${'★'.repeat(n-sc)}</span></div><div class="rank">${sc}/${n} points · Rank: ${rank}</div></div>
<div class="panel"><span class="tag px" style="color:var(--gr)">Nailed it</span>${ok.length?`<ul class="res">${ok.map(([p,i])=>`<li><b style="color:var(--gr)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span></li>`).join('')}</ul>`:'<p class="note">No points yet. Every replay makes it easier!</p>'}</div>
<div class="panel"><span class="tag px" style="color:var(--rd)">Review these</span>${no.length?`<ul class="res">${no.map(([p,i])=>`<li><b style="color:var(--rd)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br>${chips(p.b)}<button class="link" data-a="go" data-k="${i+1}">Revisit Part ${L(i)}</button></li>`).join('')}</ul>`:(S.p.some(x=>x.done)?'<p>Nothing to review so far. 🏆</p>':'<p class="note">Try a part first, then come back here.</p>')}</div>
${un.length?`<div class="panel"><span class="tag px" style="color:var(--yl)">Not tried yet</span><ul class="res">${un.map(([p,i])=>`<li><b style="color:var(--yl)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br><button class="link" data-a="go" data-k="${i+1}">Go to Part ${L(i)}</button></li>`).join('')}</ul></div>`:''}
<div class="panel"><span class="tag px">Turn it in</span><p>Your answers stay on this device only. Copy them to turn in on Canvas or in a doc.</p><div class="row"><button class="btn c" data-a="copy">📋 Copy my answers</button><span class="note" id="cpmsg" role="status" aria-live="polite"></span></div><details class="peek" id="cpd" data-pk="cpd"><summary>See the text</summary><div><textarea readonly id="cpt" aria-label="Your answers" style="min-height:200px">${esc(exportTxt())}</textarea></div></details></div>
${no.length?`<div class="row"><button class="btn c" data-a="retry">↻ Retry what I missed ▸</button></div>`:''}${bossV()}<div class="row"><button class="btn" data-a="restart" data-i="${S.fi}">${S.rc?'Tap again to erase your answers':'↻ Start over'}</button>${FRQ.length>1?`<button class="btn m" data-a="start" data-i="${(S.fi+1)%FRQ.length}">Try “${esc(FRQ[(S.fi+1)%FRQ.length].t)}” ▸</button>`:''}<button class="btn o" data-a="home">Menu</button></div>`}
let opener;function openBG(k){opener=document.activeElement;app.setAttribute('aria-hidden','true');document.getElementById('shT').textContent=BG[k].t;document.getElementById('shB').innerHTML=BG[k].s.map(x=>`<li>${esc(x)}</li>`).join('');sh.classList.add('on');sh.querySelector('[data-a=x]').focus()}
function closeBG(){if(!sh.classList.contains('on'))return;sh.classList.remove('on');app.removeAttribute('aria-hidden');opener&&opener.focus()}
document.addEventListener('click',e=>{if(e.target==sh)return closeBG();const z=e.target.closest('.stim svg,.stim img');if(z&&!e.target.closest('#zm')){const zb=document.getElementById('zb');zb.innerHTML='';zb.appendChild(z.cloneNode(true));document.getElementById('zm').classList.add('on');return}const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);
case 'restart':if(!S.rc){S.rc=1;return render()}S.rc=0;return start(i,1);
case 'home':save();S.k=-1;return render(1);
case 'go':return go(+b.dataset.k);
case 'bg':return openBG(b.dataset.k);
case 'x':return closeBG();
case 'zx':return document.getElementById('zm').classList.remove('on');
case 'nt':S.nt[j].o=1;return render();
case 'hint':{const k=S.k-1;S.p[k].h[j+'-'+b.dataset.m]=1;return render()}
case 'step':S.p[i].st++;return render();
case 'card':S.p[i].c=+b.dataset.c;return render(1);
case 'mcq':S.p[i].q=+b.dataset.o;return render();
case 'boss':{const f=S.p.map((x,k)=>k),miss=f.filter(k=>!S.p[k].ok),rest=f.filter(k=>S.p[k].ok);S.bo={l:miss.concat(rest).slice(0,3),k:0,s:null,r:0};return render()}
case 'bq':{const B=S.bo;if(B.s==null&&+b.dataset.o==0)B.r++;if(B.s!==0)B.s=+b.dataset.o;return render()}
case 'bn':S.bo.k++;S.bo.s=null;return render();
case 'frame':{const t=document.getElementById('ans'),f=S.f.p[i].fr;if(t.value.includes(f)){t.focus();return}t.value=t.value.trim()?t.value.trim()+'\n'+f:f;S.p[i].a=t.value;t.focus();const c=t.value.indexOf('___',t.value.length-f.length);if(c>=0)t.setSelectionRange(c,c+3);return}
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.includes('___')){st.w=1;render();return document.getElementById('ans').focus()}st.w=0;if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.c=5;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render(1)}
case 'rev':S.p[i].ck=0;S.p[i].done=0;S.p[i].c=4;render(1);return document.getElementById('ans').focus();
case 'next':{const w=S.p[i].done;S.p[i].done=1;S.p[i].ok=earned(i);if(!w)S.cb=S.p[i].ok?S.cb+1:0;return go(i+2)}
case 'cf':S.p[i].cf=+b.dataset.k;return render();
case 'copy':{const m=document.getElementById('cpmsg'),t=exportTxt();const fail=()=>{document.getElementById('cpd').open=true;const ta=document.getElementById('cpt');ta.focus();ta.select();m.textContent='Select the text below and copy it.'};try{navigator.clipboard.writeText(t).then(()=>{m.textContent='✔ Copied! Now paste it into Canvas.'},fail)}catch(e){fail()}return}
case 'retry':{const m=S.p.findIndex(x=>x.done&&!x.ok);S.p[m].c=4;S.p[m].ck=0;S.p[m].done=0;return go(m+1)}
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value;save()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeBG();document.getElementById('zm').classList.remove('on')}else if(e.key=='Tab'&&sh.classList.contains('on')){e.preventDefault();sh.querySelector('[data-a=x]').focus()}});
render(1);
</script>
</body>
</html>
