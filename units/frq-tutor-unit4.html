<script>
const BG={
frq:{t:"How AP FRQs are scored",s:["Each part (A, B, C…) is worth 1 point and is scored on its own. A mistake in Part B can't cost you Part C.","Readers look for the right idea, clearly linked to the question. Fancy writing earns nothing extra.","No thesis, intro, or conclusion needed. Label each part and answer it directly.","Write in complete sentences and do what the task verb asks (Identify, Describe, or Explain).","Never leave a part blank. A wrong answer costs nothing."]},
tea:{t:"The TEA method",s:["T1- Topic: your reason in general words. Turn the question into your claim.","E2- Evidence: the specific proof, like a place, number, or example, ideally from the map or table.","A3- Analysis: why it matters. Explain HOW or WHY your proof backs up your reason, using “because…” or “which leads to…”.","Label each piece T1-, E2-, A3- so the reader can find every point. Describe answers need T1 and E2 plus a short A3. Explain answers need a strong A3."]},
readmap:{t:"How to read a map",s:["Read the title first. It tells you the topic, place, and time.","Check the legend so you know what each color and symbol means.","Look for patterns: what's clustered, what's connected, what points where?","Then ask WHY: who made this, and what story is it telling?"]},
readtable:{t:"How to read a data table",s:["Read the title and every column header, including units (%, per 1,000).","Find the highest and lowest value in each column.","Compare columns: when one goes up, does another go up or down?","When there are two years, look for change over time."]},
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]}
};
const VERBS={
Identify:{d:"Name it. A word or short phrase is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","One sentence max."]},
Describe:{d:"Paint the picture. Give the specific characteristics or pattern, with details someone could check.",l:["Use evidence: a place, a number, or a feature from the stimulus.","Say what it IS or what it LOOKS LIKE. You don't need a deep “why.”","About 1–2 sentences. Use TEA: Topic + Evidence, then a quick Analysis."]},
Explain:{d:"Tell HOW or WHY. Connect a cause to an effect so a reader sees the reasoning, not just a fact.",l:["Use linking words: “because…”, “which leads to…”, “as a result…”.","A fact alone won't score. You need the chain of reasoning.","About 2–3 sentences. Use full TEA."]},
Define:{d:"Give the meaning. Say what the term is in your own words, clearly enough that someone who never heard it would get it.",l:["Use a full sentence: “[Term] is…”","Don't just give an example. The meaning comes first; an example can back it up.","One or two sentences."]},
"Explain the degree":{d:"Say HOW MUCH something is true, then prove it. Pick a level (a great degree, a moderate degree, or a small degree) and explain why it's that much and not more or less.",l:["Start with your level: “Colonization affected ___ to a great degree because…”","Give evidence for your level AND a reason it isn't total (or isn't zero).","About 2–3 sentences. T1- states the degree, E2- proves it, A3- explains why it's that much."]},
Compare:{d:"Show how two things are alike or different. Name BOTH things and make the difference (or similarity) clear.",l:["Use comparison words: “while…”, “whereas…”, “unlike…”, “both…”.","Talking about only one side won't score. Mention both.","About 2 sentences. T1- names the difference, E2- gives an example of each, A3- says why it matters."]}
};
const FRQ=[];
function addBG(o){Object.assign(BG,o)}
function addFRQ(f){FRQ.push(f)}
const UNIT="Unit 4 · Political Patterns and Processes";
addBG({
u4c_territory:{t:"Territoriality",s:["Territoriality is people's connection to a specific piece of land and their effort to claim, defend, and control it.","Geographer Robert Sack described it as controlling people and things by controlling an area.","It shows up at every scale: a country guarding its border, a city zoning its land, a neighborhood's “residents only” parking.","It helps explain fights over land with deep meaning, like Kashmir, which India and Pakistan both claim."]},
u4c_sovereignty:{t:"Sovereignty & the state",s:["A state is an independent country: a defined territory with a permanent population, a government, and sovereignty.","Sovereignty is a state's supreme authority to govern its own territory without interference from other states.","The idea is often traced to the Peace of Westphalia (1648), which ended the Thirty Years' War in Europe."]},
u4c_unitfed:{t:"Unitary vs. federal states",s:["A unitary state concentrates power in the central government: France, Japan, China.","A federal state divides power between the national government and states or provinces, and the constitution protects each level's powers: the U.S., Germany, India, Canada.","Federal systems often fit large, diverse countries, since regions can make laws that fit local needs.","The United Kingdom is unitary, but it has devolved some powers to Scotland, Wales, and Northern Ireland."]},
u4c_brexit:{t:"Supranationalism & Brexit",s:["Supranationalism is when three or more states give up some sovereignty to an organization, like the European Union (EU), for shared goals.","EU members follow EU law and allow free movement of EU citizens, and the European Court of Justice has the final word on EU law.","In a June 23, 2016 referendum, about 52% of UK voters chose to leave, after a campaign promising to “take back control” of laws, borders, trade, and money.","The UK left the EU on January 31, 2020."]},
u4c_devolution:{t:"Devolution",s:["Devolution is the transfer of power from a state's central government to its regions, often driven by differences in culture, wealth, or distance from the capital.","Scotland got its own parliament in 1999. In a 2014 referendum, about 55% of Scots voted to stay in the UK.","Catalonia held a 2017 independence vote that Spain's courts ruled illegal, and French-speaking Quebec voted by a hair to stay in Canada in 1995.","Belgium became a federal state in 1993, largely because of tension between Dutch-speaking Flanders and French-speaking Wallonia."]},
u4c_cityvote:{t:"City elections: at-large vs. districts",s:["In at-large elections, every voter in a city votes for every council seat, so a citywide majority can win them all.","In district (ward) elections, each district elects one member, so where the lines fall decides who wins.","Voting rights lawsuits, especially under California's Voting Rights Act (2001), have pushed many cities to switch to district elections, which often helps minority neighborhoods win seats.","City maps are redrawn after each census to keep districts equal in population, and they can be packed or cracked too."]},
u4c_fragment:{t:"Political fragmentation",s:["A metropolitan (metro) area is a central city plus its suburbs, tied together by commuting.","Political fragmentation means a metro area is split among many separate local governments, each with its own budget and priorities. The Chicago area alone has hundreds.","That makes transit, roads, and water hard to plan across boundaries.","One fix is a regional authority: WMATA, created in 1967 by Maryland, Virginia, and Washington, D.C., runs one Metro system for the whole region."]}
});
addFRQ({k:"Released AP FRQ · No stimulus",
t:"Who's in Charge Here?",
d:"Territoriality, sovereignty, and governance, from the EU down to city hall. A real released AP question for extra practice.",
u:"Unit 4",
fmt:"No stimulus (like Question 1)",
intro:"Every government claims a piece of the Earth's surface, but who holds power over it depends on scale: international organizations, national governments, regions, and city councils can all claim a say over the same ground.",
stim:"",
bg:["u4c_territory","u4c_sovereignty","u4c_unitfed","tea"],
nt:[["What do you already know about territoriality and sovereignty? How are they different?","Territoriality is people's attachment to a piece of land and their urge to control it. Sovereignty is a state's recognized right to govern its own territory without outside interference. One is a feeling and a behavior; the other is official authority."],["What do you already know about unitary and federal states? Can you name one of each?","Unitary: the central government holds most of the power (France, Japan, China). Federal: power is shared with states or provinces (the U.S., Germany, India, Canada). Trick: UNI means one center of power."],["What do you already know about devolution and supranationalism? Which way does each one move power?","Devolution moves power DOWN to regions, like Scotland's parliament (1999). Supranationalism moves some power UP to a group of countries, like the European Union. Brexit was the UK taking power back from the EU."]],
m:20,
p:[
{v:"Define",
q:"Define the concept of territoriality in terms of political geography.",
sk:"Defining territoriality",
s:[["Start with the root word: territory. How do people act toward land they see as theirs?",["Picture a country guarding its border, or a group defending its homeland.","Two halves: a connection to a specific piece of land AND an effort to control it."]],["Write one sentence that starts “Territoriality is…”",["Territoriality is people's connection to a specific piece of land and their effort to claim, defend, and control it."]]],
r:{m:"any",i:[["Says people or groups try to claim, control, or defend a specific area",/(control|claim|defend|protect|guard|power over|rul(e|es|ing)|govern|influence|mark|possess|dominat|assert|fight|occupy)[^.]{0,60}(territor|land|area|space|region|place|border|ground|turf)|(territor(?!ial)|land|area|space|region|place|turf)[^.]{0,40}(control|claim|defend|protect|guard|govern|possess|fight)/i,"Add the action: people try to claim, defend, and control a specific piece of land."],["Says people feel attached to, connected to, or identify with a specific area",/(attach|connect|\bties?\b|tied|bond|belong|identi|loyal|emotion|sense of (owner|belong)|feel|relationship)[^.]{0,60}(territor|land|area|space|region|place|homeland|ground|turf)/i,"Or add the connection: people's attachment to a specific piece of land."]]},
mo:"Territoriality is the connection of people, their culture, and their economy to a specific piece of land, shown when they try to claim, defend, and control that territory.",
b:["u4c_territory"],
th:"Territoriality... is that just a fancy word for territory?",
co:"Close! Territory is the land itself. Territoriality is how people FEEL about that land and ACT on it. Think of a dog guarding its yard, scaled up to a whole country.",
kq:"What does territoriality mean in political geography? Give the meaning in one sentence.",
ml:["Territoriality",["Territory is the land. Territoriality is people's connection to that land and their effort to control it.","The AP course defines it as the connection of people, their culture, and their economic systems to the land.","It shows up at every scale and helps explain border disputes and independence movements."],[["Territoriality","People's connection to a specific piece of land and their effort to claim and control it."],["Territory","The land itself: an area a group or government claims."]]],
wk:["Territoriality is the land that a country owns.","That defines territory, not territoriality. Add the human part: people's attachment to the land and their effort to control it."],
mw:"It starts with the term and has both halves: a connection to a specific piece of land and the effort to control it.",
fr:"Territoriality is people's ___ to a specific ___ and their effort to ___ it.",
qc:["Which is the best example of territoriality?",["A country building fences and checkpoints along its border","A river flowing through two countries","A city's population growing quickly"],0,"Territoriality is people acting to claim and control land, like guarding a border."]},
{v:"Describe",
q:"Describe the concept of sovereignty as it relates to the state.",
sk:"Describing sovereignty",
s:[["Name the idea in general words. Who makes the rules inside a country's borders?",["A sovereign state governs its own territory without interference from other states."]],["Give specific proof: what can a sovereign state actually do?",["It makes its own laws, controls its borders, prints money, and signs treaties, and other states recognize that right."]],["Describe why it matters for being a state.",["Sovereignty separates a state from a region or a territory.","Puerto Rico has its own government but isn't sovereign: the U.S. Congress has the final say."]]],
r:{m:"all",i:[["Says what it is: a state's authority to govern its territory",/govern|\brul(e|es|ing)\b|control|power|authorit|in charge|make[s]? (its|their) own|decid|decision|\blaws?\b|self-?(rule|govern)|\bboss/i,"Say what it is: a state's authority to govern and control its own territory."],["Describes the independence: no outside interference",/without|free (from|of)|no (other|outside|foreign|external|one else)|not (be |being )?(controlled|ruled|told)|independen|outside|interfer|foreign|other (countr|state|nation|power|government)|recogni|its own|their own|itself|themselves|(nobody|no one|anyone) else|answer to|self-?(rule|govern)/i,"Describe the independence: no other state or outside power gets to control it."]]},
mo:"T1- Sovereignty is a state's supreme authority to govern its own territory and people without interference from other states. E2- A sovereign state like Japan makes its own laws, controls its borders, prints its own money, and signs treaties, and other countries recognize that right. A3- Sovereignty is what makes a place a true state: Puerto Rico has its own government but is not sovereign, because the U.S. Congress has the final say over it.",
b:["u4c_sovereignty"],
th:"Sovereignty sounds like it's about kings and queens.",
co:"Good instinct: “sovereign” is an old word for a monarch! Today it means a STATE is the boss of its own territory, with no outside power telling it what to do.",
kq:"What does it mean for a state (a country) to have sovereignty? Describe it with an example.",
ml:["Sovereignty and the state",["A state is an independent country: a defined territory with a permanent population, a government, and sovereignty.","Sovereignty is a state's supreme authority to govern its own territory without outside interference, so it can make laws, control borders, and sign treaties.","Recognition matters: Taiwan governs itself, but only about a dozen countries officially recognize it as a state."],[["State","An independent country with territory, people, a government, and sovereignty."],["Sovereignty","A state's authority to govern itself without outside interference."]]],
wk:["Sovereignty is when a country has a government.","Cities have governments too. Describe what makes a state sovereign: it rules its own territory with no outside interference."],
mw:"It describes sovereignty (self-rule without outside interference), proves it with Japan's powers, and contrasts Puerto Rico.",
fr:"T1- Sovereignty is a state's ___ to govern ___ without ___. E2- For example, ___ can ___. A3- This matters because ___.",
qc:["Which power shows that a state is sovereign?",["Making and enforcing its own laws without outside approval","Having a large population","Hosting international sporting events"],0,"Sovereignty means governing yourself with no outside power in charge."]},
{v:"Compare",
q:"Compare ONE difference between unitary states and federal states.",
sk:"Unitary vs. federal states",
s:[["Name the difference in general words. Where is power held in each?",["UNI means one: a unitary state has one main center of power.","Unitary: the central government holds most power. Federal: power is shared with states or provinces."]],["Give a real example of EACH type.",["Unitary: France, Japan, China. Federal: the U.S., Germany, India, Canada."]],["Explain why it matters, using “while,” “whereas,” or “unlike.”",["Federal systems let regions handle local issues, which helps large, diverse countries; unitary systems keep laws the same everywhere."]]],
r:{m:"all",i:[["Unitary side: the central government holds most of the power (e.g., France, Japan, China)",/(unitary|france|japan|china)[^.]{0,90}(central|national gov|\bone (main |single |strong )?(central |national )?(gov|power|cent|level|leader)|single|concentrat|all (of )?(the )?power|most (of )?(the )?(power|decision|control)|(holds|has|keeps|have) (the |all |most )?power|same (laws|rules|everywhere)|uniform|homogen|small|paris|tokyo|beijing|(don.t|do not|doesn.t|does not|no|not) (share|split|divid))|(central|national) gov[^.]{0,60}unitary/i,"Name the unitary side: in a unitary state, the central government holds most of the power (like France)."],["Federal side: power is shared with states or provinces (e.g., the U.S., Germany, India, Canada)",/(federal|united states|\bu\.s\.|america|germany|india\b|canada|brazil|mexico|australia)[^.]{0,90}(shar|split|divid|spread|(state|provincial|regional|local) (gov|level|law|power)|provinces|regions? (have|get|make|can)|own (laws|rules|government|power)|different (laws|rules)|\bvar(y|ies)|larg|\bbig|diverse|levels|50 states|(states|provinces) (have|get|hold|make|can|set|decide))|(shar|split|divid)[^.]{0,60}federal/i,"Name the federal side too: in a federal state, power is shared with states or provinces (like the U.S.)."]]},
mo:"T1- In a unitary state the central government holds most of the power, while in a federal state power is shared between the national government and states or provinces. E2- For example, in unitary France the national government in Paris sets most policy, including one national school curriculum, while in the federal United States each of the 50 states makes many of its own laws, like speed limits. A3- This matters because a federal system lets a large, diverse country give regions control over local issues, while a unitary system keeps laws the same nationwide.",
b:["u4c_unitfed"],
th:"Unitary, federal... I always mix these up.",
co:"Trick: UNI means one, like a unicycle. A unitary state has ONE main center of power. A federal state splits power between levels, like Washington and the 50 states. Now describe BOTH sides!",
kq:"What is ONE way unitary and federal states differ? Say what's true of EACH one.",
ml:["Unitary vs. federal",["In a unitary state, the central government holds most of the power. France, Japan, and China are unitary.","In a federal state, the constitution divides power between the national government and states or provinces. The U.S., Germany, India, and Canada are federal.","Federal systems often fit large, diverse countries; unitary systems often fit smaller or more culturally similar ones."],[["Unitary state","A state where the central government holds most of the power."],["Federal state","A state where power is divided between national and regional governments."]]],
wk:["A federal state shares power between the national government and the states.","That's only half of a comparison. Add the unitary side: in a unitary state, the central government holds most of the power."],
mw:"It states the difference for BOTH types (central vs. shared power), gives an example of each (France, the U.S.), and explains why it matters.",
fr:"T1- In a unitary state ___, while in a federal state ___. E2- For example, ___. A3- This matters because ___.",
qc:["Which pair lists a unitary state and then a federal state?",["Japan, then Germany","Canada, then France","India, then the United States"],0,"Japan keeps power central (unitary); Germany shares it with its 16 states (federal)."]},
{v:"Explain",
q:"Explain ONE possible reason why sovereignty played a role in the UK's withdrawal from the EU.",
sk:"Sovereignty and Brexit",
s:[["Name the reason in general words. What did many British voters feel the UK had handed to the EU?",["EU members share some sovereignty with the EU (supranationalism). Many Leave voters felt the EU had too much say over British laws, borders, and trade."]],["Give specific proof: which EU rules limited the UK?",["Free movement let any EU citizen live and work in the UK. The UK had to follow EU law, and the European Court of Justice had the final word on it."]],["Explain how that led to leaving.",["The Leave campaign promised to “take back control.”","About 52% voted Leave in June 2016, and the UK left on January 31, 2020."]]],
r:{m:"all",i:[["Names what the UK felt it had lost: control of laws, borders, trade, or courts",/\blaws?\b|legislat|\brules?\b|regulat|border|immigra|migra|free movement|trade|tariff|court|judge|justice|money|budget|\bpay|\bfees?\b|fish|decision|polic(y|ies)|parliament/i,"Name what the UK wanted control over: its own laws, borders and immigration, trade, or courts."],["Explains the link: the UK wanted to take back control from the EU",/take back control|(regain|get back|take back|took back|win back|restore|reclaim|bring back)[^.]{0,40}(control|power|sovereign|independen|authority|say)|(its|their|the uk.s|britain.s) own (laws|rules|borders|decisions|trade|courts?|country|immigration)|without (the )?(eu|european|outside|interfer)|independen|govern (itself|themselves)|self-?(rule|govern)|(power|control|sovereignty|independence|say) back|(\beu\b|european union|brussels|european court)[^.]{0,60}(control|power over|authority|overrul|override|above|tell|told|decid|decision|interfer|limit|restrict|forc|ma(de|ke|kes|king)|had to)|(control|power|say)[^.]{0,30}(to|from|over) (the )?(\beu\b|european)|lost (control|power|sovereign)|giv(e|ing|en) up[^.]{0,30}(control|power|sovereign)|had to (follow|obey|accept)|less (control|power|say)/i,"Explain the link: voters wanted the UK, not the EU, in control, so they voted to “take back control.”"]]},
mo:"T1- Sovereignty played a role because many British voters felt EU membership took away the UK's power to make its own decisions. E2- As an EU member, the UK had to follow EU laws, accept free movement of EU citizens across its borders, and follow rulings of the European Court of Justice, so the Leave campaign promised to “take back control.” A3- Because many voters wanted Parliament, not the EU, to control the UK's laws and borders, about 52% voted to leave in June 2016, and the UK left the EU on January 31, 2020.",
b:["u4c_brexit"],
th:"Wait, what is Brexit? And what does sovereignty have to do with it?",
co:"Brexit = BRitain + EXIT: the UK leaving the European Union. EU members share some power with it. So what did British voters feel they'd given away, and what did they want back?",
kq:"Why did sovereignty, a country being in charge of itself, push the UK to leave the EU? Explain ONE reason.",
ml:["Supranationalism and Brexit",["Supranationalism is when three or more states give up some sovereignty to an organization, like the EU, for shared benefits.","EU members follow EU laws, let EU citizens live and work in any member country, and let the EU negotiate their trade deals.","Leave campaigners said the UK had lost control of its laws, borders, and trade."],[["Supranationalism","Three or more states sharing some sovereignty in an organization like the EU."],["Referendum","A vote in which citizens decide one question directly."]]],
wk:["The UK left the EU because people voted for Brexit.","That says what happened, not why. Name what the UK wanted control over (laws, borders, trade) and how leaving gave it back."],
mw:"It names what voters felt the UK had lost (laws, borders, courts), gives proof (free movement, the European Court of Justice), and explains how that led to leaving.",
fr:"T1- Sovereignty played a role in Brexit because ___. E2- As an EU member, the UK had to ___. A3- Because many voters wanted ___, ___.",
qc:["The Leave campaign's famous Brexit slogan was…",["“Take back control”","“Stronger together”","“Europe first”"],0,"“Take back control” was a sovereignty argument: control over the UK's own laws, borders, and trade."]},
{v:"Explain",
q:"Explain ONE possible reason why territoriality would play a role in devolution.",
sk:"Territoriality and devolution",
s:[["Name the reason in general words. How does a group feel about the region it sees as its homeland?",["Territoriality = attachment to a specific piece of land + the urge to control it."]],["Give a real example of a region pushing for power.",["Scotland (UK), Catalonia (Spain), Quebec (Canada), or Flanders (Belgium).","Many Scots see Scotland as its own nation, and it got its own parliament in 1999."]],["Explain HOW territoriality leads to devolution.",["Attachment to a homeland → demand to control it → the national government hands power down.","If refused, demands can grow into independence movements, like Catalonia's 2017 vote."]]],
r:{m:"all",i:[["Names the territorial link: a group's attachment to its homeland or region",/attach|connect|\bties?\b|tied|bond|belong|identi|homeland|\bhome\b|loyal|pride|proud|heritage|cultur|language|ethnic|\bnation\b|distinct|unique|own (land|region|territor|area|people|history)|their (land|region|territor|area)|ancest|histor|claim/i,"Name the territorial link: the group feels a deep attachment to its homeland and wants to control it."],["Explains the result: demands for self-rule, autonomy, or independence",/devol|self-?(rule|govern)|autonom|independen|separat|secede|secess|own (parliament|government|legislature|assembly|laws|country|state)|parliament|more (power|control|say|authority)|power (to|from)|govern (itself|themselves|their)|rule themselves|referendum|break away|\bleave\b/i,"Explain the result: that attachment drives demands for self-rule, so power is handed down to the region."]]},
mo:"T1- Territoriality can lead to devolution because a group deeply attached to its homeland wants to control that territory itself. E2- For example, many Scots see Scotland as a distinct nation with its own history and identity, so they pushed for self-rule, and in 1999 the UK opened a Scottish Parliament with power over schools, health care, and policing. A3- Because people want decisions about their land made in their own region, not a distant capital, this attachment pressures the national government to devolve power.",
b:["u4c_devolution","u4c_territory"],
th:"How does a feeling about land turn into a whole new government?",
co:"When a group feels a region is THEIR homeland, with its own language and history, they want decisions about it made there, not in a faraway capital. Push hard enough, and the national government hands power down. That's devolution.",
kq:"How can a group's attachment to its own region lead the national government to hand power down? Explain ONE reason.",
ml:["Territoriality drives devolution",["Devolution is the transfer of power from a state's central government to its regions.","Territoriality gives groups a reason to want that power: they see a region as their homeland and want to control it.","Examples: Scots in Scotland, Catalans in Catalonia (Spain), French speakers in Quebec (Canada), and Dutch speakers in Flanders (Belgium)."],[["Devolution","The transfer of power from a central government to regions."],["Autonomy","Self-government by a region inside a larger state."]]],
wk:["Devolution is when the central government gives power to regions.","A correct definition, but it skips territoriality. Explain how a group's attachment to its homeland makes it push for power."],
mw:"It links territoriality (attachment to a homeland) to devolution (demands for self-rule) and proves it with Scotland.",
fr:"T1- Territoriality can lead to devolution because ___. E2- For example, in ___, ___. A3- As a result, ___.",
qc:["Which is an example of devolution?",["The UK creating a Scottish Parliament","Countries joining the European Union","A city annexing a nearby suburb"],0,"Devolution moves power DOWN from the national government to a region, like Scotland."]},
{v:"Explain",
q:"Explain how redrawing district boundary lines may affect election results within a city.",
sk:"Redistricting at the city scale",
s:[["Name the effect in general words. Same voters, new lines: what can change?",["Lines decide which neighborhoods vote together, so new lines can change which group or party wins council seats."]],["Give a specific example of HOW new lines change a result.",["Cracking splits a neighborhood among several districts; packing crams it into one.","Or lines can create a majority-minority district, so a minority neighborhood can elect a member it chooses."]],["Explain the result for the city council.",["Votes only count inside each district, so a group can lose (or gain) seats even though nobody changed their vote."]]],
r:{m:"all",i:[["Names HOW: packing, cracking, splitting or combining neighborhoods, or a majority-minority district",/pack|crack|gerrymander|split|divid|spread|separat|break(s|ing)? up|broken up|carv|combin|merg|group(s|ed|ing)? (them |voters |people )?(together|into)|put (them |all |the |voters )?(together|in(to)? (one|the same))|concentrat|dilut|cluster|majority[- ]minority|minority[- ]majority|incumbent|(move|moving|shift|chang)[^.]{0,40}(neighborhood|voters|people|communit|residents|group)/i,"Name HOW: cracking splits a neighborhood across districts, or packing crams it into one."],["Explains the effect on results: which group, party, or candidate wins council seats",/\bwins?\b|winning|\bwon\b|\blos(e|es|ing|t)\b|seats?\b|elect(s|ed|ing)? (a |an |the |its |their |more |fewer |one |someone|anyone|no |nobody|candidates?|members?|representatives?|people|whoever|leaders?)|majority (in|of|on)|minority (in|of|everywhere)|outnumber|represent|control (of )?(the )?council|(more|fewer|less|no) (votes?|power|say|voice|influence|members)|voice|wasted|(change|decide|determine)s? (who|which)/i,"Explain the effect: that group ends up outnumbered and loses council seats."]]},
mo:"T1- Redrawing district lines can change which group wins seats on a city council, even if no one changes how they vote. E2- For example, if a Latino neighborhood with enough voters to control one district is cracked, or split among three districts, its voters become a minority in each and may elect no council member at all. A3- Because votes only count inside each district, where the lines fall decides whether a group's votes add up to a win or get wasted.",
b:["u4c_cityvote","scale"],
th:"We did gerrymandering already. Is this the same thing, just smaller?",
co:"Yes: same tools, smaller map! City council districts get redrawn after every census too. If one neighborhood's voters got split into three pieces, could they still elect someone who speaks for them?",
kq:"How can moving district lines inside a city change who wins city council seats? Explain.",
ml:["Redistricting inside a city",["In district elections, each council district elects one member, so the lines decide which neighborhoods vote together.","Cracking splits a group's neighborhood so it's outnumbered everywhere; packing crams it into one district so its extra votes are wasted.","Lines can also create a majority-minority district, where a minority group is most of the voters and can elect a candidate it chooses."],[["At-large election","Every voter in the city votes for every council seat."],["Majority-minority district","A district where a racial or ethnic minority group makes up most of the voters."]]],
wk:["Redrawing district lines can change the election because the districts are different.","That repeats the question. Explain HOW: cracking splits a neighborhood's voters so they're outnumbered and lose seats."],
mw:"It names the effect (who wins seats), gives a mechanism (cracking a neighborhood three ways), and explains why lines matter.",
fr:"T1- Redrawing district lines can affect city elections because ___. E2- For example, if ___, then ___. A3- As a result, ___.",
qc:["In an at-large city council election…",["every voter in the city votes for every seat","each neighborhood elects its own member","only property owners can vote"],0,"At-large means citywide, so a citywide majority can win every seat."]},
{v:"Explain",
q:"Explain why neighboring local governments may face challenges providing transportation services in a growing metro area.",
sk:"Political fragmentation in a metro area",
s:[["Name the challenge in general words. Is a growing metro area run by one government?",["No: it's split among many separate cities, towns, and counties. That's political fragmentation."]],["Give specific proof of how that causes transportation problems.",["Each government has its own budget and priorities, so they argue over who pays.","In 2019, Gwinnett County voters rejected joining Atlanta's MARTA, so its trains still don't reach the county."]],["Explain the result for people in the metro area.",["Routes stop at city or county lines and commuters sit in traffic, and it gets worse as the metro grows."]]],
r:{m:"all",i:[["Names the cause: fragmentation into many separate governments",/fragment|many (different |separate |small |local |independent )?(gov|cit|town|count|municipal|jurisdiction|suburb|district)|separate|independent|each (city|town|county|government|municipal|jurisdiction|suburb|one|has|have|with)|own (budget|tax|rules|laws|plans?|priorit|money|government|system|needs|interest)|different (budget|tax|rules|laws|plans?|priorit|goals|needs|interest|governments|systems)|jurisdiction|border|boundar|(city|county|state) lines?|disagree|argu|(don.t|do not|won.t|can.t|cannot|may not|might not) (agree|cooperat|coordinat|work together)|coordinat|cooperat|compet/i,"Name the cause: the metro is split among many separate governments, each with its own budget and priorities."],["Explains the effect: fights over who pays, or routes that stop at boundaries",/\bpay|fund|money|cost|\btax|budget|afford|expens|rout|\blines?\b|\bstops?\b|connect|link|schedul|fare|\bgaps?\b|traffic|congest|commut|cross|sprawl|grow|expand|delay|slow/i,"Explain the effect: they argue over who pays, so routes stop at city lines and commuters get stuck."]]},
mo:"T1- Neighboring governments may struggle to provide transportation because a growing metro area is politically fragmented into many separate cities and counties, each with its own budget and priorities. E2- For example, in 2019 suburban Gwinnett County voted not to join Atlanta's MARTA system, so MARTA trains still don't reach the county. A3- Because no single government runs the whole metro, governments argue over who should pay, and bus and rail routes stop at city or county lines, leaving commuters stuck in traffic as the region grows.",
b:["u4c_fragment","scale"],
th:"Why can't the cities just share a bus system? Seems simple.",
co:"It sounds simple until you ask: who pays, who runs it, and whose roads get fixed first? A metro area can have dozens of governments, each with its own budget and voters to please.",
kq:"A growing metro area has many separate cities and counties side by side. Why is it hard for them to run transportation together?",
ml:["Political fragmentation",["Political fragmentation means one metro area is split among many separate local governments: cities, towns, counties, and special districts.","Each has its own budget, taxes, and priorities, so they often disagree about who pays for transit and where routes go.","A common fix is a regional authority, like WMATA, which runs one Metro system for D.C., Maryland, and Virginia."],[["Political fragmentation","A metro area divided among many separate local governments."],["Regional authority","An agency that runs one service, like transit, across many local governments."]]],
wk:["It's hard because growing cities have a lot of traffic.","That's a problem, but not why NEIGHBORING governments struggle. Explain fragmentation: separate governments with their own budgets argue over who pays."],
mw:"It names the cause (political fragmentation), gives a real example (Gwinnett County and MARTA), and explains the effect (funding fights).",
fr:"T1- Neighboring local governments struggle to provide transportation because ___. E2- For example, ___. A3- As a result, ___.",

/* Drawing the Lines (original): redistricting. Two stimuli: map + table.
Precincts AAAAA/ABBAA/ABBBA/ABBBA/AABBA (A 15, B 10). Plan 1 11222/11332/13332/44455/44555 → A 3, B 2. Plan 2 11223/11223/51233/55534/54444 → all 3A-2B → A 5, B 0. */
addBG({
u4t_gerry:{t:"Gerrymandering: packing & cracking",s:["Gerrymandering is drawing district lines on purpose to help one party or group win more seats.","It's named for Massachusetts Governor Elbridge Gerry, who in 1812 signed a map with a salamander-shaped district.","Packing crowds the other side's voters into a few districts, which they win by huge margins.","Cracking splits the other side's voters across many districts so they're a minority in each. Both tricks waste the other side's votes."]},
u4t_census:{t:"Census, reapportionment & redistricting",s:["The U.S. Constitution requires a census, a count of every person, every ten years.","After each census, the House's 435 seats are reapportioned among the states by population. After 2020, Texas gained 2 seats and New York lost 1.","Each state then redistricts: it redraws its lines so every district has about the same population (“one person, one vote”).","Some states, like Texas, have also redrawn maps mid-decade."]},
u4t_vra:{t:"Voting Rights Act & majority-minority districts",s:["The Voting Rights Act of 1965 outlawed racial discrimination in voting, such as literacy tests used to keep Black Southerners from voting.","Section 2 of the law has been used to challenge maps that dilute minority voting power, for example by cracking a minority community.","Starting in the 1980s, courts used it to require some majority-minority districts, where a minority group makes up most of the voters.","Courts have also ruled that race can't be the main factor in drawing lines, and how far Section 2 reaches is still being argued, all the way to the Supreme Court."]},
u4t_commission:{t:"Commissions, compactness & contiguity",s:["In most states, the legislature draws congressional lines, so the party in control can help itself.","An independent redistricting commission is a separate panel that draws the lines instead, as in Arizona, Colorado, and Michigan.","Compactness means a tight, simple shape. Contiguity means every part of a district touches the rest."]},
u4t_federal:{t:"States: federal vs. unitary",s:["In AP Human Geography, a state is an independent country with sovereignty. U.S. states like Westmoor are units inside one country.","A nation is a people with a shared culture. A nation-state is mostly one nation (Japan), a multinational state holds several (the United Kingdom), and a stateless nation (the Kurds) has no state.","A federal state splits power between national and regional governments (the U.S., Germany, India); a unitary state keeps it national (France, China).","Because the U.S. is federal, each state runs its own redistricting, so the rules differ from state to state."]},
u4t_safe:{t:"Safe seats, turnout & polarization",s:["A safe seat is a district one party is almost certain to win. A swing district could go either way.","Voters who always lose may feel their votes don't count, which can lower turnout.","In safe seats, the real race is often the party primary, which can pull candidates toward the extremes and add to polarization."]},
u4t_centri:{t:"Centrifugal & centripetal forces",s:["Centrifugal forces divide a country: conflict between groups, unequal treatment, economic gaps, or distrust of government.","Centripetal forces unify it: a shared identity, national symbols, and trusted institutions like fair elections.","Strong centrifugal forces can lead to devolution, where power shifts to regions, as when Scotland got its own parliament inside the United Kingdom."]}
});

intro:"Westmoor, a fictional U.S. state, has 25 voting precincts with equal populations and 5 seats in the U.S. House of Representatives. After the census, mapmakers proposed two plans for grouping those precincts into 5 districts, using the same voters and votes.",
stim:"<h4 style=\"color:var(--yl);margin:14px 0 6px\">Stimulus 1: Two District Plans for Westmoor</h4><svg viewBox=\"0 0 340 180\" role=\"img\" font-family=\"Chakra Petch,sans-serif\" aria-label=\"Two maps, Plan 1 and Plan 2, of the same 5 by 5 grid of 25 equal-population precincts in fictional Westmoor. Each precinct shows the party that won it, A in cyan or B in pink. Rows north to south, precincts west to east. Row 1: A A A A A. Row 2: A B B A A. Row 3: A B B B A. Row 4: A B B B A. Row 5: A A B B A. Party A wins 15 precincts; Party B wins 10, clustered in the center and south. Thick yellow lines split each map into 5 numbered districts of 5 precincts. Plan 1 districts by row: 1 1 2 2 2; 1 1 3 3 2; 1 3 3 3 2; 4 4 4 5 5; 4 4 5 5 5. Plan 2 districts by row: 1 1 2 2 3; 1 1 2 2 3; 5 1 2 3 3; 5 5 5 3 4; 5 4 4 4 4.\"><defs><g id=\"u4tg\"><rect width=\"140\" height=\"140\" fill=\"#22e5ff\"/><path d=\"M28 28h56v28h28v84H56v-28H28z\" fill=\"#ff3fa4\"/><path d=\"M0 28h140M0 56h140M0 84h140M0 112h140M28 0v140M56 0v140M84 0v140M112 0v140\" stroke=\"#0a1d3a\" stroke-opacity=\".45\"/><g font-size=\"8\" font-weight=\"700\" fill=\"#0a1d3a\"><text x=\"3 31 59 87 115\" y=\"10\">AAAAA</text><text x=\"3 31 59 87 115\" y=\"38\">ABBAA</text><text x=\"3 31 59 87 115\" y=\"66\">ABBBA</text><text x=\"3 31 59 87 115\" y=\"94\">ABBBA</text><text x=\"3 31 59 87 115\" y=\"122\">AABBA</text></g></g><path id=\"u4t1\" d=\"M0 0h140v140H0zM28 56v28M56 0v56M56 112v28M84 84v28M112 28v56M56 28h56M28 56h28M0 84h140M56 112h28\"/><path id=\"u4t2\" d=\"M0 0h140v140H0zM28 56v28M28 112v28M56 0v84M84 56v56M112 0v56M112 84v28M0 56h28M84 56h28M28 84h56M112 84h28M28 112h84\"/></defs><rect width=\"340\" height=\"180\" fill=\"#0a1d3a\"/><g font-size=\"12\" font-weight=\"700\" fill=\"#ffe7a6\" text-anchor=\"middle\"><text x=\"84\" y=\"21\">PLAN 1</text><text x=\"256\" y=\"21\">PLAN 2</text></g><use href=\"#u4tg\" x=\"14\" y=\"30\"/><use href=\"#u4tg\" x=\"186\" y=\"30\"/><g fill=\"none\" stroke-linecap=\"square\"><g stroke=\"#0a1d3a\" stroke-width=\"6\"><use href=\"#u4t1\" x=\"14\" y=\"30\"/><use href=\"#u4t2\" x=\"186\" y=\"30\"/></g><g stroke=\"#ffd23f\" stroke-width=\"3\"><use href=\"#u4t1\" x=\"14\" y=\"30\"/><use href=\"#u4t2\" x=\"186\" y=\"30\"/></g></g><g font-size=\"15\" font-weight=\"700\" fill=\"#ffd23f\" stroke=\"#0a1d3a\" stroke-width=\"3.5\" paint-order=\"stroke\" text-anchor=\"middle\"><text x=\"31 143 87 59 115\" y=\"79 79 107 135 163\">12345</text><text x=\"203 259 315 287 231\" y=\"79 79 107 163 135\">12345</text></g></svg><div class=\"legend\"><span><i style=\"background:#22e5ff\"></i>A = precinct won by Party A</span><span><i style=\"background:#ff3fa4\"></i>B = precinct won by Party B</span><span><i style=\"background:#ffd23f\"></i>District border</span><span>1–5 = district number</span></div><p class=\"src\">Fictional state created for practice. Simplified: all 25 precincts have equal populations, and a party wins a district by winning at least 3 of its 5 precincts.</p><h4 style=\"color:var(--yl);margin:14px 0 6px\">Stimulus 2: Election Results in Westmoor Under Each Plan</h4><div class=\"tbl\"><table><thead><tr><th>Result</th><th>Party A</th><th>Party B</th></tr></thead><tbody><tr><td>Statewide vote share</td><td>60%</td><td>40%</td></tr><tr><td>Precincts won (of 25)</td><td>15</td><td>10</td></tr><tr><td>Districts won under Plan 1 (of 5)</td><td>3</td><td>2</td></tr><tr><td>Percent of seats under Plan 1</td><td>60%</td><td>40%</td></tr><tr><td>Districts won under Plan 2 (of 5)</td><td>5</td><td>0</td></tr><tr><td>Percent of seats under Plan 2</td><td>100%</td><td>0%</td></tr></tbody></table></div><p class=\"src\">Fictional data created for practice. Simplified: equal-population precincts, and the same statewide vote under both plans. Remember: label each part, and write Describe and Explain parts as T1- (your reason in general words), E2- (the specific proof), A3- (why it matters).</p>",
bg:["u4t_gerry","u4t_census","readmap","readtable"],
nt:[["Stimulus 1: the precinct colors are the same in both maps. How many precincts does each party win, and WHERE are Party B's?","Party A wins 15 cyan precincts and Party B wins 10 pink ones, clustered in the center and south like voters in a city. Only the yellow district lines move between maps."],["Pick a Plan 2 district and count its pink (B) precincts. Try another. What do you notice?","Every Plan 2 district has exactly 2 pink and 3 cyan precincts, so Party B is outnumbered 3 to 2 everywhere. In Plan 1, Districts 3 and 5 have a pink majority."],["Now connect them. In Stimulus 2, what changes for Party B between the plans, and what in Stimulus 1 explains it?","The vote stays 60% to 40%, but Party B drops from 2 seats (40%) to 0 seats (0%). The voters didn't change. Only the lines did. That's the big idea behind gerrymandering."]],
m:20,
p:[
{v:"Identify",
q:"Using Stimulus 1, identify the gerrymandering technique used to draw the district boundaries in Plan 2.",
sk:"Packing vs. cracking",
s:[["Count the pink (Party B) precincts in each Plan 2 district. Bunched together or spread out?",["Go district by district: 1, 2, 3, 4, 5.","Every Plan 2 district has exactly 2 pink precincts, so Party B is never the majority."]],["Name the technique. Does it cram the other side together, or split it up?",["Packing = crowd them into a few districts. Cracking = split them up among many.","Splitting a group's voters so they're a minority everywhere is called cracking."]]],
r:{m:"any",i:[["Names cracking",/crack|crak/i,"Use the exact term: cracking."],["Describes cracking: Party B's voters split across districts so they're outnumbered",/(split|spread|divid|scatter|dilut|broke|break)[^.]{0,60}(across|among|between|over|into)[^.]{0,30}(district|five|5|all)/i,"Or describe it: Party B's voters are split across all five districts so they're outnumbered in each."]]},
mo:"Plan 2 uses cracking: Party B's voters are split across all five districts so they are outnumbered in every one.",
b:["u4t_gerry"],
th:"Packing, cracking... they sound the same. Which is which?",
co:"They're opposites! Packing squeezes the other party's voters INTO a few districts. Cracking breaks them APART. Count the pink squares in each Plan 2 district to see which this is.",
kq:"In Plan 2, did the mapmakers squeeze Party B's voters together or split them up? Name the technique.",
ml:["Packing vs. cracking",["Gerrymandering is drawing district lines on purpose to help one party or group win more seats.","Packing crowds the other side's voters into a few districts, which they win by huge margins.","Cracking splits the other side's voters across many districts so they're a minority in each one."],[["Cracking","Splitting a group's voters across many districts."],["Packing","Crowding a group's voters into as few districts as possible."]]],
wk:["Packing, because Party A packed the districts with its own voters.","That mixes up the terms. Packing crowds the OTHER party's voters together. Plan 2 does the opposite: it spreads Party B's voters out so they lose everywhere."],
mw:"It names the right term (cracking) and shows how it works: Party B's voters are split up and outnumbered everywhere.",
fr:"Plan 2 uses ___, because Party B's voters are ___ across ___ districts.",
qc:["Splitting a party's voters across many districts so they're a minority in each one is called…",["cracking","packing","reapportionment"],0,"Cracking breaks a group apart. Packing crams it together."]},
{v:"Describe",
q:"Using Stimulus 1, describe how the district boundaries in Plan 2 divide Party B's voters.",
sk:"Reading district lines on a map",
s:[["Find Party B's precincts first. Where are they?",["They're the pink squares marked B.","One cluster in the center and south of Westmoor, like voters in a city."]],["Follow the yellow lines in Plan 2. How many pink precincts land in each district?",["Count district by district: 1, 2, 3, 4, 5.","Each of the five districts gets exactly 2 pink precincts and 3 cyan ones."]],["Describe what that does to Party B in every district.",["2 out of 5 is less than half.","Party B is outnumbered 3 to 2 everywhere, so it can't win any district."]]],
r:{m:"all",i:[["Describes the split: about 2 Party B precincts in each district",/(^|\b(?!plan\b)\w+\s)(2|two)\s+(pink|party b|b\b|of (the|its|their)\b)|(2|two) (out of|of) (5|five)|each (district|one|of the)|every (district|one)|all (5|five)|five (part|district|section)|slic|wedge|pie\b|piece/i,"Describe the split: each district gets just 2 pink precincts."],["Describes the result: Party B is outnumbered in every district",/minorit|outnumber|3 to 2|three to two|3-2|less than half|fewer|los(e|es|ing|t)\b|can.t win|cannot win|never win|no district|zero|none|not enough|never (has|have|gets?) enough|never (wins?|gets?)|(doesn.t|don.t|won.t|unable to) win|party a (always |still )?(has|have|gets|wins|controls|keeps) (a |the )?(3|three|majority|more|every|all)/i,"Describe the effect: Party B is outnumbered 3 to 2, so it can't win any district."]]},
mo:"T1- Plan 2's district lines split Party B's cluster of voters into five pieces. E2- Party B's 10 precincts are bunched in the center and south, but the lines slice that cluster like a pizza, so each district gets exactly 2 Party B precincts and 3 Party A precincts. A3- Because Party B has only 2 of 5 precincts in every district, it is outnumbered 3 to 2 everywhere and cannot win a single district.",
b:["u4t_gerry","readmap"],
th:"So many lines and colors. Where do I even start?",
co:"Start with just the pink squares: Party B's precincts. Then trace one Plan 2 district at a time and count the pink squares inside. The pattern jumps out fast.",
kq:"Party B's pink precincts are bunched together. How do Plan 2's lines split them up, and what does that do to Party B?",
ml:["Reading a districting map",["A precinct is a small voting area. A district is made of several precincts and elects one representative.","Colors show which party won each precinct; thick yellow lines show district borders. Only the lines move between plans.","Count district by district: whoever wins at least 3 of the 5 precincts wins the district."],[["Precinct","A small local voting area."],["District","An area that elects one representative."]]],
wk:["Plan 2 divides Party B's voters into different districts.","That just repeats the question. Describe HOW they're divided (2 Party B precincts in each district) and what that does (Party B is outnumbered everywhere)."],
mw:"It describes the split, gives map evidence (2 Party B precincts per district), and describes the result (outnumbered everywhere).",
fr:"T1- Plan 2's lines split Party B's voters by ___. E2- On the map, Party B's precincts are ___, but each district gets ___. A3- As a result, Party B ___ in every district.",
qc:["In Stimulus 1, what changes between Plan 1 and Plan 2?",["Only the district lines","The precinct colors","The number of voters"],0,"Same voters, same colors, different lines. That's why the results change."]},
{v:"Explain",
q:"Explain why the boundaries of congressional districts in the United States are redrawn every ten years.",
sk:"Census, reapportionment, and redistricting",
s:[["What happens in the U.S. every ten years, in years ending in 0?",["An official count of every person in the country.","The census."]],["What does that count decide about the House of Representatives?",["The House's 435 seats are split among the states by population.","Growing states can gain seats (Texas gained 2 after 2020); others lose them (New York lost 1). That's reapportionment."]],["Why do states then need new district lines?",["Each district should hold about the same number of people.","States redraw lines (redistricting) to keep districts equal: one person, one vote."]]],
r:{m:"all",i:[["Names the census as the trigger",/census|count(s|ed|ing)? (of )?(the |every |all |each )?(people|population|person|resident|everyone|everybody|citizen|american)|(population|people|everyone) (is |are |gets? |get )?counted|head ?count/i,"Name the trigger: the U.S. Census counts the population every ten years."],["Explains the chain: seats shift between states, so lines are redrawn to keep districts equal",/reapportion|seat|equal|same (number|population|size|amount)|one person|shift|grow|gain|los(e|es|t)\b|mov(e|ing)|migrat|chang/i,"Explain the chain: population shifts change how many seats each state gets, so states redraw lines to keep districts equal."]]},
mo:"T1- District lines are redrawn every ten years because the U.S. Census counts the population every ten years, and populations shift. E2- After each census, the House's 435 seats are reapportioned among the states by population; after 2020, Texas gained two seats and New York lost one. A3- Because a state's population and seat count can change, it must redraw its districts (redistricting) so each has about the same number of people: one person, one vote.",
b:["u4t_census","u4t_federal"],
th:"Why redraw the lines at all? Can't they just leave them?",
co:"People move! Some states grow fast and others barely grow. If the lines never changed, some districts would have way more people than others, and each vote there would count for less. The census starts it all.",
kq:"Why does the U.S. redraw its voting districts every ten years? Explain what starts it and why lines must change.",
ml:["Census → reapportionment → redistricting",["The U.S. Constitution requires a census, a count of every person, every ten years.","The House's 435 seats are then redivided among the states by population. That's reapportionment.","Each state then redraws its district lines so every district has about the same population. That's redistricting, and it's when gerrymandering can happen."],[["Reapportionment","Redividing House seats among the states after a census."],["Redistricting","Redrawing district lines inside a state."]]],
wk:["Because politicians want to change the lines to help their party win.","That's why people GERRYMANDER, not why lines are redrawn every ten years. The required reason is the census and shifting population."],
mw:"It names the trigger (the census), explains reapportionment with real examples, and explains why lines must change (equal population).",
fr:"T1- District boundaries are redrawn every ten years because ___. E2- After each census, ___. A3- States must redraw their districts so that ___.",
qc:["Redividing the 435 House seats among the states after each census is called…",["reapportionment","redistricting","gerrymandering"],0,"Reapportionment shifts seats BETWEEN states. Redistricting redraws lines INSIDE a state."]},
{v:"Explain",
q:"Using both stimuli, explain how Plan 2 produces an election result that does not match the statewide vote.",
sk:"Connecting a map to election results",
s:[["Start with Stimulus 2. Compare each party's share of votes with its share of seats under Plan 2.",["Party A: 60% of votes. Party B: 40%.","Under Plan 2, Party A wins 100% of the seats and Party B wins 0%."]],["Now use Stimulus 1 to find out HOW.",["Count the pink precincts in each Plan 2 district.","Every district has 2 Party B and 3 Party A precincts, so Party A wins all five."]],["Explain why that turns 40% of the votes into zero seats.",["Party B never reaches a majority anywhere.","Its votes are “wasted”: they don't help elect anyone."]]],
r:{m:"all",i:[["Uses Stimulus 2: votes vs. seats (Party B: 40% of votes, 0% of seats)",/100|0 ?%|zero|no seats|none|5 (of|out of) (the )?5|all (5|five)|40 ?%|60 ?%/i,"Quote Stimulus 2: Party B wins 40% of the vote but 0% of the seats."],["Uses Stimulus 1 for the cause: Party B has only 2 of 5 precincts in each district",/crack|crak|split|spread|divid|scatter|minorit|outnumber|wasted|(2|two) (of|out of) (the )?(5|five)|(3|three) (of|out of) (the )?(5|five)|3 to 2|three to two|each district|every district|(^|\b(?!plan\b)\w+\s)(2|two) (party b|pink|b\b)/i,"Use the map to explain HOW: Party B has only 2 of 5 precincts in every Plan 2 district."]]},
mo:"T1- Plan 2 gives Party A every seat because it cracks Party B's voters so they are a minority in every district. E2- Stimulus 2 shows Party B won 40% of the statewide vote but 0% of the seats under Plan 2, and Stimulus 1 shows why: each Plan 2 district has exactly 2 Party B precincts and 3 Party A precincts. A3- Because Party B is outnumbered 3 to 2 in all five districts, its votes are wasted everywhere, so Party A turns 60% of the vote into 100% of the seats.",
b:["u4t_gerry","readtable"],
th:"How can a party get 40% of the votes and zero seats? Isn't that impossible?",
co:"It feels impossible, but it isn't! Votes only count INSIDE each district. If Party B loses every district 3 to 2, it wins nothing. The table shows the mismatch; the map shows how.",
kq:"Party B got 40% of the votes but no seats under Plan 2. Show the mismatch with the table, then use the map to explain HOW.",
ml:["Why seats don't always match votes",["Each U.S. House district elects one representative, usually whoever gets the most votes there. That's winner-take-all.","So a statewide vote total doesn't win seats by itself. What matters is how the votes are spread across districts.","Votes that don't help elect anyone are wasted votes. Cracking makes a party lose narrowly everywhere, so nearly all its votes are wasted."],[["Winner-take-all","Only the top vote-getter in a district wins the seat."],["Wasted votes","Votes that don't help elect a candidate."]]],
wk:["Party A got 60% of the vote but won 100% of the seats.","True, but it only restates Stimulus 2. The question asks HOW, so add Stimulus 1: Party B has only 2 of 5 precincts in every district."],
mw:"It uses BOTH stimuli: the table for the mismatch (40% of votes, 0% of seats) and the map for the cause (2 of 5 precincts per district).",
fr:"T1- Plan 2's result doesn't match the vote because ___. E2- Stimulus 2 shows ___, and Stimulus 1 shows ___. A3- Because Party B is ___ in every district, ___.",
qc:["Under Plan 2, Party B wins 40% of the vote. What share of the seats does it win?",["0%","40%","20%"],0,"Cracking leaves Party B outnumbered in all five districts, so it wins none."]},
{v:"Explain",
q:"Using Stimulus 2, explain ONE effect that a districting plan like Plan 2 could have on voters or on political representation.",
sk:"Effects of gerrymandering",
s:[["Find Party B's Plan 2 numbers in Stimulus 2.",["Check the vote share row and the Plan 2 rows.","Party B: 40% of the vote, 0% of the seats."]],["Name ONE effect on voters or on representation.",["How would a Party B voter feel? Who speaks for them in Congress?","Lower turnout, underrepresentation, safe seats, or polarization."]],["Explain HOW Plan 2 causes that effect.",["Use “because… which leads to…”.","Party B voters lose everywhere, so they may feel their votes don't count and stop voting."]]],
r:{m:"all",i:[["Uses Stimulus 2: Party B wins 40% of the vote but 0 seats",/40|0 ?%|zero|no seats|0 seats|none|100|all (5|five)/i,"Use the table: Party B has 40% of the votes but 0% of the seats."],["Explains an effect: no representation, wasted votes, lower turnout, safe seats, or polarization",/unrepresent|underrepresent|(no|not|without|lack|zero|nobody|no one)[^.]{0,25}represent|voice|ignored|turnout|stop voting|(don.t|not|won.t|less likely to|never) (bother )?(to )?vote|wasted|(don.t|doesn.t|won.t) (count|matter)|safe|compet|polari|extrem|accountab|primar/i,"Explain an effect: Party B voters have no representative, so they may stop voting."]]},
mo:"T1- One effect of a plan like Plan 2 is that a large group of voters ends up with no representation, which can lower voter turnout. E2- Stimulus 2 shows Party B won 40% of the statewide vote but 0% of the seats under Plan 2, so four in ten voters have no representative from the party they chose. A3- Because Party B's voters lose in every district no matter how many show up, many may feel their votes don't count and stop voting.",
b:["u4t_safe","u4t_vra"],
th:"An effect? Like, besides Party A winning?",
co:"Yes, go one step further! Party A winning is the result. An effect is what happens next to real people. Picture a Party B voter after Plan 2. Would they bother voting next time?",
kq:"Plan 2 left Party B with 40% of the votes and 0 seats. Use those numbers to explain ONE way that hurts voters.",
ml:["What gerrymandering does to voters",["A safe seat is a district one party is almost sure to win, so there's little real competition.","Voters who always lose may feel their votes don't count, so turnout can drop.","In safe seats, the real contest is often the party primary, which can pull candidates toward the extremes and add to polarization."],[["Voter turnout","The percent of eligible voters who actually vote."],["Polarization","Parties moving further apart and compromising less."]]],
wk:["Gerrymandering is unfair to Party B.","Too vague. It doesn't use the table or name an effect. Say what happens: Party B gets 40% of the vote but 0% of the seats, so its voters may stop voting."],
mw:"It quotes Stimulus 2 (40% of votes, 0% of seats), names a specific effect (lower turnout), and explains how Plan 2 causes it.",
fr:"T1- One effect of a plan like Plan 2 is ___. E2- Stimulus 2 shows Party B won ___ of the vote but ___ of the seats. A3- Because ___, this leads to ___.",
qc:["A district drawn so one party is almost certain to win is called a…",["safe seat","swing district","majority-minority district"],0,"Safe seats mean little real competition."]},
{v:"Explain",
q:"Explain ONE way that an independent redistricting commission OR a compactness requirement could reduce gerrymandering like the one in Plan 2.",
sk:"Reducing gerrymandering",
s:[["Pick ONE: a commission (WHO draws the lines) or a compactness rule (WHAT SHAPE districts can be).",["In most states, legislators from political parties draw the lines.","An independent commission is a citizen panel that draws them instead."]],["Describe how your choice works.",["Commission: politicians who would benefit don't draw the map.","Compactness: districts must be tight, simple shapes, not long, thin, or snaking."]],["Explain how that makes a plan like Plan 2 harder to draw.",["Who has a reason to crack Party B? The party in power.","Without that self-interest, or without odd shapes, it's harder to slice a city's voters into pieces."]]],
r:{m:"all",i:[["Names the method: an independent commission or a compactness rule",/commission|independent|nonpartisan|non-partisan|bipartisan|citizen|compact/i,"Name your choice: an independent redistricting commission OR a compactness rule."],["Explains how: takes line-drawing away from politicians who benefit, or bans odd shapes that split up voters",/politician|legislat|lawmaker|party in power|majority party|incumbent|self|conflict of interest|own (party|seat|benefit)|themselves|both parties|equal number|odd|weird|strange|snak|stretch|long|thin|tentacle|irregular|together|communit|neighborhood|city|cities|count(y|ies)|split|crack/i,"Explain HOW: it takes map-drawing away from politicians who benefit, or bans long, odd shapes that split voters."]]},
mo:"T1- An independent redistricting commission could reduce gerrymandering by taking map-drawing away from politicians. E2- Arizona, Colorado, and Michigan created commissions of citizens from both major parties plus independents, who draw the maps instead of the state legislature. A3- Because these mapmakers aren't trying to keep their own party in power, they have less reason to crack one party's voters the way Plan 2 cracks Party B.",

${un.length?`<div class="panel"><span class="tag px" style="color:var(--yl)">Not tried yet</span><ul class="res">${un.map(([p,i])=>`<li><b style="color:var(--yl)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br><button class="link" data-a="go" data-k="${i+1}">Go to Part ${L(i)}</button></li>`).join('')}</ul></div>`:''}
<div class="panel"><span class="tag px">Turn it in</span><p>Nothing saves on this page. Copy your answers to paste into Canvas or a doc.</p><div class="row"><button class="btn c" data-a="copy">📋 Copy my answers</button><span class="note" id="cpmsg" role="status" aria-live="polite"></span></div><details class="peek" id="cpd"><summary>See the text</summary><div><textarea readonly id="cpt" aria-label="Your answers" style="min-height:200px">${esc(exportTxt())}</textarea></div></details></div>
${no.length?`<div class="row"><button class="btn c" data-a="retry">↻ Retry what I missed ▸</button></div>`:''}${bossV()}<div class="row"><button class="btn" data-a="start" data-i="${S.fi}">↻ Replay</button>${FRQ.length>1?`<button class="btn m" data-a="start" data-i="${(S.fi+1)%FRQ.length}">Try “${esc(FRQ[(S.fi+1)%FRQ.length].t)}” ▸</button>`:''}<button class="btn o" data-a="home">Menu</button></div>`}
let opener;function openBG(k){opener=document.activeElement;app.setAttribute('aria-hidden','true');document.getElementById('shT').textContent=BG[k].t;document.getElementById('shB').innerHTML=BG[k].s.map(x=>`<li>${esc(x)}</li>`).join('');sh.classList.add('on');sh.querySelector('[data-a=x]').focus()}
function closeBG(){if(!sh.classList.contains('on'))return;sh.classList.remove('on');app.removeAttribute('aria-hidden');opener&&opener.focus()}
document.addEventListener('click',e=>{if(e.target==sh)return closeBG();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);
case 'home':S.k=-1;return render(1);
case 'go':return go(+b.dataset.k);
case 'bg':return openBG(b.dataset.k);
case 'x':return closeBG();
case 'nt':S.nt[j].o=1;return render();
case 'hint':{const k=S.k-1;S.p[k].h[j+'-'+b.dataset.m]=1;return render()}
case 'step':S.p[i].st++;return render();
case 'card':S.p[i].c=+b.dataset.c;return render(1);
case 'mcq':S.p[i].q=+b.dataset.o;return render();
case 'boss':{const f=S.p.map((x,k)=>k),miss=f.filter(k=>!S.p[k].ok),rest=f.filter(k=>S.p[k].ok);S.bo={l:miss.concat(rest).slice(0,3),k:0,s:null,r:0};return render()}
case 'bq':{const B=S.bo;if(B.s==null&&+b.dataset.o==0)B.r++;if(B.s!==0)B.s=+b.dataset.o;return render()}
case 'bn':S.bo.k++;S.bo.s=null;return render();
case 'frame':{const t=document.getElementById('ans'),f=S.f.p[i].fr;t.value=t.value.trim()?t.value.trim()+'\n'+f:f;S.p[i].a=t.value;t.focus();const c=t.value.indexOf('___',t.value.length-f.length);if(c>=0)t.setSelectionRange(c,c+3);return}
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.includes('___')){st.w=1;render();return document.getElementById('ans').focus()}st.w=0;if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.c=5;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render(1)}
case 'rev':S.p[i].ck=0;S.p[i].done=0;S.p[i].c=4;render(1);return document.getElementById('ans').focus();
case 'next':{const w=S.p[i].done;S.p[i].done=1;S.p[i].ok=earned(i);if(!w)S.cb=S.p[i].ok?S.cb+1:0;return go(i+2)}
case 'cf':S.p[i].cf=+b.dataset.k;return render();
case 'copy':{const m=document.getElementById('cpmsg'),t=exportTxt();const fail=()=>{document.getElementById('cpd').open=true;const ta=document.getElementById('cpt');ta.focus();ta.select();m.textContent='Select the text below and copy it.'};try{navigator.clipboard.writeText(t).then(()=>{m.textContent='✔ Copied! Now paste it into Canvas.'},fail)}catch(e){fail()}return}
case 'retry':{const m=S.p.findIndex(x=>x.done&&!x.ok);S.p[m].c=4;S.p[m].ck=0;S.p[m].done=0;return go(m+1)}
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeBG();else if(e.key=='Tab'&&sh.classList.contains('on')){e.preventDefault();sh.querySelector('[data-a=x]').focus()}});
render(1);
</script>
</body>
</html>
