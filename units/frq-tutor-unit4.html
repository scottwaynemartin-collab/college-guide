<script>
const BG={
frq:{t:"How AP FRQs are scored",s:["Each part (A, B, C…) is worth 1 point and is scored on its own. A mistake in Part B can't cost you Part C.","Readers look for the right idea, clearly linked to the question. Fancy writing earns nothing extra.","No thesis, intro, or conclusion needed. Label each part and answer it directly.","Write in complete sentences and do what the task verb asks (Identify, Describe, or Explain).","Never leave a part blank. A wrong answer costs nothing."]},
tea:{t:"The TEA method",s:["T1- Topic: your reason in general words. Turn the question into your claim.","E2- Evidence: the specific proof, like a place, number, or example, ideally from the map or table.","A3- Analysis: why it matters. Explain HOW or WHY your proof backs up your reason, using “because…” or “which leads to…”.","Label each piece T1-, E2-, A3- so the reader can find every point. Describe answers need T1 and E2 plus a short A3. Explain answers need a strong A3."]},
readmap:{t:"How to read a map",s:["Read the title first. It tells you the topic, place, and time.","Check the legend so you know what each color and symbol means.","Look for patterns: what's clustered, what's connected, what points where?","Then ask WHY: who made this, and what story is it telling?"]},
readtable:{t:"How to read a data table",s:["Read the title and every column header, including units (%, per 1,000).","Find the highest and lowest value in each column.","Compare columns: when one goes up, does another go up or down?","When there are two years, look for change over time."]},
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]}
};
const VERBS={
Identify:{d:"Name it. A word or short phrase is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","One sentence max."]},
Describe:{d:"Paint the picture. Give the specific characteristics or pattern, with details someone could check.",l:["Use evidence: a place, a number, or a feature from the stimulus.","Say what it IS or what it LOOKS LIKE. You don't need a deep “why.”","About 1–2 sentences. Use TEA: Topic + Evidence, then a quick Analysis."]},
Explain:{d:"Tell HOW or WHY. Connect a cause to an effect so a reader sees the reasoning, not just a fact.",l:["Use linking words: “because…”, “which leads to…”, “as a result…”.","A fact alone won't score. You need the chain of reasoning.","About 2–3 sentences. Use full TEA."]},
Define:{d:"Give the meaning. Say what the term is in your own words, clearly enough that someone who never heard it would get it.",l:["Use a full sentence: “[Term] is…”","Don't just give an example. The meaning comes first; an example can back it up.","One or two sentences."]},
Compare:{d:"Show how two things are alike or different. Name BOTH things and make the difference (or similarity) clear.",l:["Use comparison words: “while…”, “whereas…”, “unlike…”, “both…”.","Talking about only one side won't score. Mention both.","About 2 sentences. T1- names the difference, E2- gives an example of each, A3- says why it matters."]}
};
const FRQ=[];
function addBG(o){Object.assign(BG,o)}
function addFRQ(f){FRQ.push(f)}
const UNIT="Unit 4 · Political Patterns and Processes";
/* Drawing the Lines (original): redistricting. Two stimuli: map + table.
Precincts AAAAA/ABBAA/ABBBA/ABBBA/AABBA (A 15, B 10). Plan 1 11222/11332/13332/44455/44555 → A 3, B 2. Plan 2 11223/11223/51233/55534/54444 → all 3A-2B → A 5, B 0. */
addBG({
u4t_gerry:{t:"Gerrymandering: packing & cracking",s:["Gerrymandering is drawing district lines on purpose to help one party or group win more seats.","It's named for Massachusetts Governor Elbridge Gerry, who in 1812 signed a map with a salamander-shaped district.","Packing crowds the other side's voters into a few districts, which they win by huge margins.","Cracking splits the other side's voters across many districts so they're a minority in each. Both tricks waste the other side's votes."]},
u4t_census:{t:"Census, reapportionment & redistricting",s:["The U.S. Constitution requires a census, a count of every person, every ten years.","After each census, the House's 435 seats are reapportioned among the states by population. After 2020, Texas gained 2 seats and New York lost 1.","Each state then redistricts: it redraws its lines so every district has about the same population (“one person, one vote”).","Some states, like Texas, have also redrawn maps mid-decade."]},
u4t_vra:{t:"Voting Rights Act & majority-minority districts",s:["The Voting Rights Act of 1965 outlawed racial discrimination in voting, such as literacy tests used to keep Black Southerners from voting.","Section 2 of the law has been used to challenge maps that dilute minority voting power, for example by cracking a minority community.","Starting in the 1980s, courts used it to require some majority-minority districts, where a minority group makes up most of the voters.","Courts have also ruled that race can't be the main factor in drawing lines, and how far Section 2 reaches is still being argued, all the way to the Supreme Court."]},
u4t_commission:{t:"Commissions, compactness & contiguity",s:["In most states, the legislature draws congressional lines, so the party in control can help itself.","An independent redistricting commission is a separate panel that draws the lines instead, as in Arizona, Colorado, and Michigan.","Compactness means a tight, simple shape. Contiguity means every part of a district touches the rest."]},
u4t_federal:{t:"States: federal vs. unitary",s:["In AP Human Geography, a state is an independent country with sovereignty. U.S. states like Westmoor are units inside one country.","A nation is a people with a shared culture. A nation-state is mostly one nation (Japan), a multinational state holds several (the United Kingdom), and a stateless nation (the Kurds) has no state.","A federal state splits power between national and regional governments (the U.S., Germany, India); a unitary state keeps it national (France, China).","Because the U.S. is federal, each state runs its own redistricting, so the rules differ from state to state."]},
u4t_safe:{t:"Safe seats, turnout & polarization",s:["A safe seat is a district one party is almost certain to win. A swing district could go either way.","Voters who always lose may feel their votes don't count, which can lower turnout.","In safe seats, the real race is often the party primary, which can pull candidates toward the extremes and add to polarization."]},
u4t_centri:{t:"Centrifugal & centripetal forces",s:["Centrifugal forces divide a country: conflict between groups, unequal treatment, economic gaps, or distrust of government.","Centripetal forces unify it: a shared identity, national symbols, and trusted institutions like fair elections.","Strong centrifugal forces can lead to devolution, where power shifts to regions, as when Scotland got its own parliament inside the United Kingdom."]}

addFRQ({k:"Practice FRQ · Two stimuli",
t:"Drawing the Lines",
d:"Redistricting, gerrymandering, and fair representation in a fictional state.",
u:"Unit 4",
fmt:"Two stimuli (like Question 3)",
two:1,
st:"Westmoor Redistricting: Two District Plans (Stimulus 1) and Election Results (Stimulus 2)",
intro:"Westmoor, a fictional U.S. state, has 25 voting precincts with equal populations and 5 seats in the U.S. House of Representatives. After the census, mapmakers proposed two plans for grouping those precincts into 5 districts, using the same voters and votes.",
stim:"<h4 style=\"color:var(--yl);margin:14px 0 6px\">Stimulus 1: Two District Plans for Westmoor</h4><svg viewBox=\"0 0 340 180\" role=\"img\" font-family=\"Chakra Petch,sans-serif\" aria-label=\"Two maps, Plan 1 and Plan 2, of the same 5 by 5 grid of 25 equal-population precincts in fictional Westmoor. Each precinct shows the party that won it, A in cyan or B in pink. Rows north to south, precincts west to east. Row 1: A A A A A. Row 2: A B B A A. Row 3: A B B B A. Row 4: A B B B A. Row 5: A A B B A. Party A wins 15 precincts; Party B wins 10, clustered in the center and south. Thick yellow lines split each map into 5 numbered districts of 5 precincts. Plan 1 districts by row: 1 1 2 2 2; 1 1 3 3 2; 1 3 3 3 2; 4 4 4 5 5; 4 4 5 5 5. Plan 2 districts by row: 1 1 2 2 3; 1 1 2 2 3; 5 1 2 3 3; 5 5 5 3 4; 5 4 4 4 4.\"><defs><g id=\"u4tg\"><rect width=\"140\" height=\"140\" fill=\"#22e5ff\"/><path d=\"M28 28h56v28h28v84H56v-28H28z\" fill=\"#ff3fa4\"/><path d=\"M0 28h140M0 56h140M0 84h140M0 112h140M28 0v140M56 0v140M84 0v140M112 0v140\" stroke=\"#0a1d3a\" stroke-opacity=\".45\"/><g font-size=\"8\" font-weight=\"700\" fill=\"#0a1d3a\"><text x=\"3 31 59 87 115\" y=\"10\">AAAAA</text><text x=\"3 31 59 87 115\" y=\"38\">ABBAA</text><text x=\"3 31 59 87 115\" y=\"66\">ABBBA</text><text x=\"3 31 59 87 115\" y=\"94\">ABBBA</text><text x=\"3 31 59 87 115\" y=\"122\">AABBA</text></g></g><path id=\"u4t1\" d=\"M0 0h140v140H0zM28 56v28M56 0v56M56 112v28M84 84v28M112 28v56M56 28h56M28 56h28M0 84h140M56 112h28\"/><path id=\"u4t2\" d=\"M0 0h140v140H0zM28 56v28M28 112v28M56 0v84M84 56v56M112 0v56M112 84v28M0 56h28M84 56h28M28 84h56M112 84h28M28 112h84\"/></defs><rect width=\"340\" height=\"180\" fill=\"#0a1d3a\"/><g font-size=\"12\" font-weight=\"700\" fill=\"#ffe7a6\" text-anchor=\"middle\"><text x=\"84\" y=\"21\">PLAN 1</text><text x=\"256\" y=\"21\">PLAN 2</text></g><use href=\"#u4tg\" x=\"14\" y=\"30\"/><use href=\"#u4tg\" x=\"186\" y=\"30\"/><g fill=\"none\" stroke-linecap=\"square\"><g stroke=\"#0a1d3a\" stroke-width=\"6\"><use href=\"#u4t1\" x=\"14\" y=\"30\"/><use href=\"#u4t2\" x=\"186\" y=\"30\"/></g><g stroke=\"#ffd23f\" stroke-width=\"3\"><use href=\"#u4t1\" x=\"14\" y=\"30\"/><use href=\"#u4t2\" x=\"186\" y=\"30\"/></g></g><g font-size=\"15\" font-weight=\"700\" fill=\"#ffd23f\" stroke=\"#0a1d3a\" stroke-width=\"3.5\" paint-order=\"stroke\" text-anchor=\"middle\"><text x=\"31 143 87 59 115\" y=\"79 79 107 135 163\">12345</text><text x=\"203 259 315 287 231\" y=\"79 79 107 163 135\">12345</text></g></svg><div class=\"legend\"><span><i style=\"background:#22e5ff\"></i>A = precinct won by Party A</span><span><i style=\"background:#ff3fa4\"></i>B = precinct won by Party B</span><span><i style=\"background:#ffd23f\"></i>District border</span><span>1–5 = district number</span></div><p class=\"src\">Fictional state created for practice. Simplified: all 25 precincts have equal populations, and a party wins a district by winning at least 3 of its 5 precincts.</p><h4 style=\"color:var(--yl);margin:14px 0 6px\">Stimulus 2: Election Results in Westmoor Under Each Plan</h4><div class=\"tbl\"><table><thead><tr><th>Result</th><th>Party A</th><th>Party B</th></tr></thead><tbody><tr><td>Statewide vote share</td><td>60%</td><td>40%</td></tr><tr><td>Precincts won (of 25)</td><td>15</td><td>10</td></tr><tr><td>Districts won under Plan 1 (of 5)</td><td>3</td><td>2</td></tr><tr><td>Percent of seats under Plan 1</td><td>60%</td><td>40%</td></tr><tr><td>Districts won under Plan 2 (of 5)</td><td>5</td><td>0</td></tr><tr><td>Percent of seats under Plan 2</td><td>100%</td><td>0%</td></tr></tbody></table></div><p class=\"src\">Fictional data created for practice. Simplified: equal-population precincts, and the same statewide vote under both plans. Remember: label each part, and write Describe and Explain parts as T1- (your reason in general words), E2- (the specific proof), A3- (why it matters).</p>",
bg:["u4t_gerry","u4t_census","readmap","readtable"],
nt:[["Stimulus 1: the precinct colors are the same in both maps. How many precincts does each party win, and WHERE are Party B's?","Party A wins 15 cyan precincts and Party B wins 10 pink ones, clustered in the center and south like voters in a city. Only the yellow district lines move between maps."],["Pick a Plan 2 district and count its pink (B) precincts. Try another. What do you notice?","Every Plan 2 district has exactly 2 pink and 3 cyan precincts, so Party B is outnumbered 3 to 2 everywhere. In Plan 1, Districts 3 and 5 have a pink majority."],["Now connect them. In Stimulus 2, what changes for Party B between the plans, and what in Stimulus 1 explains it?","The vote stays 60% to 40%, but Party B drops from 2 seats (40%) to 0 seats (0%). The voters didn't change. Only the lines did. That's the big idea behind gerrymandering."]],
m:20,
p:[
{v:"Identify",
q:"Using Stimulus 1, identify the gerrymandering technique used to draw the district boundaries in Plan 2.",
sk:"Packing vs. cracking",
s:[["Count the pink (Party B) precincts in each Plan 2 district. Bunched together or spread out?",["Go district by district: 1, 2, 3, 4, 5.","Every Plan 2 district has exactly 2 pink precincts, so Party B is never the majority."]],["Name the technique. Does it cram the other side together, or split it up?",["Packing = crowd them into a few districts. Cracking = split them up among many.","Splitting a group's voters so they're a minority everywhere is called cracking."]]],
r:{m:"any",i:[["Names cracking",/crack|crak/i,"Use the exact term: cracking."],["Describes cracking: Party B's voters split across districts so they're outnumbered",/(split|spread|divid|scatter|dilut|broke|break)[^.]{0,60}(across|among|between|over|into)[^.]{0,30}(district|five|5|all)/i,"Or describe it: Party B's voters are split across all five districts so they're outnumbered in each."]]},
mo:"Plan 2 uses cracking: Party B's voters are split across all five districts so they are outnumbered in every one.",
b:["u4t_gerry"],
th:"Packing, cracking... they sound the same. Which is which?",
co:"They're opposites! Packing squeezes the other party's voters INTO a few districts. Cracking breaks them APART. Count the pink squares in each Plan 2 district to see which this is.",
kq:"In Plan 2, did the mapmakers squeeze Party B's voters together or split them up? Name the technique.",
ml:["Packing vs. cracking",["Gerrymandering is drawing district lines on purpose to help one party or group win more seats.","Packing crowds the other side's voters into a few districts, which they win by huge margins.","Cracking splits the other side's voters across many districts so they're a minority in each one."],[["Cracking","Splitting a group's voters across many districts."],["Packing","Crowding a group's voters into as few districts as possible."]]],
wk:["Packing, because Party A packed the districts with its own voters.","That mixes up the terms. Packing crowds the OTHER party's voters together. Plan 2 does the opposite: it spreads Party B's voters out so they lose everywhere."],
mw:"It names the right term (cracking) and shows how it works: Party B's voters are split up and outnumbered everywhere.",
fr:"Plan 2 uses ___, because Party B's voters are ___ across ___ districts.",
qc:["Splitting a party's voters across many districts so they're a minority in each one is called…",["cracking","packing","reapportionment"],0,"Cracking breaks a group apart. Packing crams it together."]},
{v:"Describe",
q:"Using Stimulus 1, describe how the district boundaries in Plan 2 divide Party B's voters.",
sk:"Reading district lines on a map",
s:[["Find Party B's precincts first. Where are they?",["They're the pink squares marked B.","One cluster in the center and south of Westmoor, like voters in a city."]],["Follow the yellow lines in Plan 2. How many pink precincts land in each district?",["Count district by district: 1, 2, 3, 4, 5.","Each of the five districts gets exactly 2 pink precincts and 3 cyan ones."]],["Describe what that does to Party B in every district.",["2 out of 5 is less than half.","Party B is outnumbered 3 to 2 everywhere, so it can't win any district."]]],
r:{m:"all",i:[["Describes the split: about 2 Party B precincts in each district",/(2|two)\s+(pink|party b|b\b|of (the|its|their)\b)|(2|two) (out of|of) (5|five)|each (district|one|of the)|every (district|one)|all (5|five)|five (part|district|section)|slic|wedge|pie\b|piece/i,"Describe the split: each district gets just 2 pink precincts."],["Describes the result: Party B is outnumbered in every district",/minorit|outnumber|3 to 2|three to two|3-2|less than half|fewer|los(e|es|ing|t)\b|can.t win|cannot win|never win|no district|zero|none|party a (has|gets|wins|controls) (3|three|the majority|more|every|all)/i,"Describe the effect: Party B is outnumbered 3 to 2, so it can't win any district."]]},
mo:"T1- Plan 2's district lines split Party B's cluster of voters into five pieces. E2- Party B's 10 precincts are bunched in the center and south, but the lines slice that cluster like a pizza, so each district gets exactly 2 Party B precincts and 3 Party A precincts. A3- Because Party B has only 2 of 5 precincts in every district, it is outnumbered 3 to 2 everywhere and cannot win a single district.",
b:["u4t_gerry","readmap"],
th:"So many lines and colors. Where do I even start?",
co:"Start with just the pink squares: Party B's precincts. Then trace one Plan 2 district at a time and count the pink squares inside. The pattern jumps out fast.",
kq:"Party B's pink precincts are bunched together. How do Plan 2's lines split them up, and what does that do to Party B?",
ml:["Reading a districting map",["A precinct is a small voting area. A district is made of several precincts and elects one representative.","Colors show which party won each precinct; thick yellow lines show district borders. Only the lines move between plans.","Count district by district: whoever wins at least 3 of the 5 precincts wins the district."],[["Precinct","A small local voting area."],["District","An area that elects one representative."]]],
wk:["Plan 2 divides Party B's voters into different districts.","That just repeats the question. Describe HOW they're divided (2 Party B precincts in each district) and what that does (Party B is outnumbered everywhere)."],
mw:"It describes the split, gives map evidence (2 Party B precincts per district), and describes the result (outnumbered everywhere).",
fr:"T1- Plan 2's lines split Party B's voters by ___. E2- On the map, Party B's precincts are ___, but each district gets ___. A3- As a result, Party B ___ in every district.",
qc:["In Stimulus 1, what changes between Plan 1 and Plan 2?",["Only the district lines","The precinct colors","The number of voters"],0,"Same voters, same colors, different lines. That's why the results change."]},
{v:"Explain",
q:"Explain why the boundaries of congressional districts in the United States are redrawn every ten years.",
sk:"Census, reapportionment, and redistricting",
s:[["What happens in the U.S. every ten years, in years ending in 0?",["An official count of every person in the country.","The census."]],["What does that count decide about the House of Representatives?",["The House's 435 seats are split among the states by population.","Growing states can gain seats (Texas gained 2 after 2020); others lose them (New York lost 1). That's reapportionment."]],["Why do states then need new district lines?",["Each district should hold about the same number of people.","States redraw lines (redistricting) to keep districts equal: one person, one vote."]]],
r:{m:"all",i:[["Names the census as the trigger",/census|count(s|ed|ing)? (of )?(the |every |all |each )?(people|population|person|resident)|head ?count/i,"Name the trigger: the U.S. Census counts the population every ten years."],["Explains the chain: seats shift between states, so lines are redrawn to keep districts equal",/reapportion|seat|equal|same (number|population|size|amount)|one person|shift|grow|gain|los(e|es|t)\b|mov(e|ing)|migrat|chang/i,"Explain the chain: population shifts change how many seats each state gets, so states redraw lines to keep districts equal."]]},
mo:"T1- District lines are redrawn every ten years because the U.S. Census counts the population every ten years, and populations shift. E2- After each census, the House's 435 seats are reapportioned among the states by population; after 2020, Texas gained two seats and New York lost one. A3- Because a state's population and seat count can change, it must redraw its districts (redistricting) so each has about the same number of people: one person, one vote.",
b:["u4t_census","u4t_federal"],
th:"Why redraw the lines at all? Can't they just leave them?",
co:"People move! Some states grow fast and others barely grow. If the lines never changed, some districts would have way more people than others, and each vote there would count for less. The census starts it all.",
kq:"Why does the U.S. redraw its voting districts every ten years? Explain what starts it and why lines must change.",
ml:["Census → reapportionment → redistricting",["The U.S. Constitution requires a census, a count of every person, every ten years.","The House's 435 seats are then redivided among the states by population. That's reapportionment.","Each state then redraws its district lines so every district has about the same population. That's redistricting, and it's when gerrymandering can happen."],[["Reapportionment","Redividing House seats among the states after a census."],["Redistricting","Redrawing district lines inside a state."]]],
wk:["Because politicians want to change the lines to help their party win.","That's why people GERRYMANDER, not why lines are redrawn every ten years. The required reason is the census and shifting population."],
mw:"It names the trigger (the census), explains reapportionment with real examples, and explains why lines must change (equal population).",
fr:"T1- District boundaries are redrawn every ten years because ___. E2- After each census, ___. A3- States must redraw their districts so that ___.",
qc:["Redividing the 435 House seats among the states after each census is called…",["reapportionment","redistricting","gerrymandering"],0,"Reapportionment shifts seats BETWEEN states. Redistricting redraws lines INSIDE a state."]},
{v:"Explain",
q:"Using both stimuli, explain how Plan 2 produces an election result that does not match the statewide vote.",
sk:"Connecting a map to election results",
s:[["Start with Stimulus 2. Compare each party's share of votes with its share of seats under Plan 2.",["Party A: 60% of votes. Party B: 40%.","Under Plan 2, Party A wins 100% of the seats and Party B wins 0%."]],["Now use Stimulus 1 to find out HOW.",["Count the pink precincts in each Plan 2 district.","Every district has 2 Party B and 3 Party A precincts, so Party A wins all five."]],["Explain why that turns 40% of the votes into zero seats.",["Party B never reaches a majority anywhere.","Its votes are “wasted”: they don't help elect anyone."]]],
r:{m:"all",i:[["Uses Stimulus 2: votes vs. seats (Party B: 40% of votes, 0% of seats)",/100|0 ?%|zero|no seats|none|5 (of|out of) (the )?5|all (5|five)|40 ?%|60 ?%/i,"Quote Stimulus 2: Party B wins 40% of the vote but 0% of the seats."],["Uses Stimulus 1 for the cause: Party B has only 2 of 5 precincts in each district",/crack|crak|split|spread|divid|scatter|minorit|outnumber|wasted|(2|two) (of|out of) (the )?(5|five)|(3|three) (of|out of) (the )?(5|five)|3 to 2|three to two|each district|every district|(2|two) (party b|pink|b\b)/i,"Use the map to explain HOW: Party B has only 2 of 5 precincts in every Plan 2 district."]]},
mo:"T1- Plan 2 gives Party A every seat because it cracks Party B's voters so they are a minority in every district. E2- Stimulus 2 shows Party B won 40% of the statewide vote but 0% of the seats under Plan 2, and Stimulus 1 shows why: each Plan 2 district has exactly 2 Party B precincts and 3 Party A precincts. A3- Because Party B is outnumbered 3 to 2 in all five districts, its votes are wasted everywhere, so Party A turns 60% of the vote into 100% of the seats.",
b:["u4t_gerry","readtable"],
th:"How can a party get 40% of the votes and zero seats? Isn't that impossible?",
co:"It feels impossible, but it isn't! Votes only count INSIDE each district. If Party B loses every district 3 to 2, it wins nothing. The table shows the mismatch; the map shows how.",
kq:"Party B got 40% of the votes but no seats under Plan 2. Show the mismatch with the table, then use the map to explain HOW.",
ml:["Why seats don't always match votes",["Each U.S. House district elects one representative, usually whoever gets the most votes there. That's winner-take-all.","So a statewide vote total doesn't win seats by itself. What matters is how the votes are spread across districts.","Votes that don't help elect anyone are wasted votes. Cracking makes a party lose narrowly everywhere, so nearly all its votes are wasted."],[["Winner-take-all","Only the top vote-getter in a district wins the seat."],["Wasted votes","Votes that don't help elect a candidate."]]],
wk:["Party A got 60% of the vote but won 100% of the seats.","True, but it only restates Stimulus 2. The question asks HOW, so add Stimulus 1: Party B has only 2 of 5 precincts in every district."],
mw:"It uses BOTH stimuli: the table for the mismatch (40% of votes, 0% of seats) and the map for the cause (2 of 5 precincts per district).",
fr:"T1- Plan 2's result doesn't match the vote because ___. E2- Stimulus 2 shows ___, and Stimulus 1 shows ___. A3- Because Party B is ___ in every district, ___.",
qc:["Under Plan 2, Party B wins 40% of the vote. What share of the seats does it win?",["0%","40%","20%"],0,"Cracking leaves Party B outnumbered in all five districts, so it wins none."]},
{v:"Explain",
q:"Using Stimulus 2, explain ONE effect that a districting plan like Plan 2 could have on voters or on political representation.",
sk:"Effects of gerrymandering",
s:[["Find Party B's Plan 2 numbers in Stimulus 2.",["Check the vote share row and the Plan 2 rows.","Party B: 40% of the vote, 0% of the seats."]],["Name ONE effect on voters or on representation.",["How would a Party B voter feel? Who speaks for them in Congress?","Lower turnout, underrepresentation, safe seats, or polarization."]],["Explain HOW Plan 2 causes that effect.",["Use “because… which leads to…”.","Party B voters lose everywhere, so they may feel their votes don't count and stop voting."]]],
r:{m:"all",i:[["Uses Stimulus 2: Party B wins 40% of the vote but 0 seats",/40|0 ?%|zero|no seats|0 seats|none|100|all (5|five)/i,"Use the table: Party B has 40% of the votes but 0% of the seats."],["Explains an effect: no representation, wasted votes, lower turnout, safe seats, or polarization",/unrepresent|underrepresent|(no|not|without|lack|zero|nobody|no one)[^.]{0,25}represent|voice|ignored|turnout|stop voting|(don.t|not|won.t|less likely to|never) (bother )?(to )?vote|wasted|(don.t|doesn.t|won.t) (count|matter)|safe|compet|polari|extrem|accountab|primar/i,"Explain an effect: Party B voters have no representative, so they may stop voting."]]},
mo:"T1- One effect of a plan like Plan 2 is that a large group of voters ends up with no representation, which can lower voter turnout. E2- Stimulus 2 shows Party B won 40% of the statewide vote but 0% of the seats under Plan 2, so four in ten voters have no representative from the party they chose. A3- Because Party B's voters lose in every district no matter how many show up, many may feel their votes don't count and stop voting.",
b:["u4t_safe","u4t_vra"],
th:"An effect? Like, besides Party A winning?",
co:"Yes, go one step further! Party A winning is the result. An effect is what happens next to real people. Picture a Party B voter after Plan 2. Would they bother voting next time?",
kq:"Plan 2 left Party B with 40% of the votes and 0 seats. Use those numbers to explain ONE way that hurts voters.",
ml:["What gerrymandering does to voters",["A safe seat is a district one party is almost sure to win, so there's little real competition.","Voters who always lose may feel their votes don't count, so turnout can drop.","In safe seats, the real contest is often the party primary, which can pull candidates toward the extremes and add to polarization."],[["Voter turnout","The percent of eligible voters who actually vote."],["Polarization","Parties moving further apart and compromising less."]]],
wk:["Gerrymandering is unfair to Party B.","Too vague. It doesn't use the table or name an effect. Say what happens: Party B gets 40% of the vote but 0% of the seats, so its voters may stop voting."],
mw:"It quotes Stimulus 2 (40% of votes, 0% of seats), names a specific effect (lower turnout), and explains how Plan 2 causes it.",
fr:"T1- One effect of a plan like Plan 2 is ___. E2- Stimulus 2 shows Party B won ___ of the vote but ___ of the seats. A3- Because ___, this leads to ___.",
qc:["A district drawn so one party is almost certain to win is called a…",["safe seat","swing district","majority-minority district"],0,"Safe seats mean little real competition."]},
{v:"Explain",
q:"Explain ONE way that an independent redistricting commission OR a compactness requirement could reduce gerrymandering like the one in Plan 2.",
sk:"Reducing gerrymandering",
s:[["Pick ONE: a commission (WHO draws the lines) or a compactness rule (WHAT SHAPE districts can be).",["In most states, legislators from political parties draw the lines.","An independent commission is a citizen panel that draws them instead."]],["Describe how your choice works.",["Commission: politicians who would benefit don't draw the map.","Compactness: districts must be tight, simple shapes, not long, thin, or snaking."]],["Explain how that makes a plan like Plan 2 harder to draw.",["Who has a reason to crack Party B? The party in power.","Without that self-interest, or without odd shapes, it's harder to slice a city's voters into pieces."]]],
r:{m:"all",i:[["Names the method: an independent commission or a compactness rule",/commission|independent|nonpartisan|non-partisan|bipartisan|citizen|compact/i,"Name your choice: an independent redistricting commission OR a compactness rule."],["Explains how: takes line-drawing away from politicians who benefit, or bans odd shapes that split up voters",/politician|legislat|lawmaker|party in power|majority party|incumbent|self|conflict of interest|own (party|seat|benefit)|themselves|both parties|equal number|odd|weird|strange|snak|stretch|long|thin|tentacle|irregular|together|communit|neighborhood|city|cities|count(y|ies)|split|crack/i,"Explain HOW: it takes map-drawing away from politicians who benefit, or bans long, odd shapes that split voters."]]},
mo:"T1- An independent redistricting commission could reduce gerrymandering by taking map-drawing away from politicians. E2- Arizona, Colorado, and Michigan created commissions of citizens from both major parties plus independents, who draw the maps instead of the state legislature. A3- Because these mapmakers aren't trying to keep their own party in power, they have less reason to crack one party's voters the way Plan 2 cracks Party B.",
b:["u4t_commission"],
th:"Who even draws these lines? I thought it was just... automatic.",
co:"Nope, real people draw them! In most states it's the state legislature: politicians drawing their own districts. That's like letting one team referee its own game. Explain ONE fix.",
kq:"How could a citizen commission, or a rule that districts be compact, stop a map like Plan 2? Pick ONE and explain how.",
ml:["Fixing gerrymandering",["Independent commissions take map-drawing from the legislature and give it to citizens, often from both parties plus independents.","Compactness rules require tight, simple shapes, so it's harder to stretch a district into a city to split its voters.","Contiguity rules require every part of a district to touch."],[["Compactness","How tight and simple a district's shape is."],["Contiguity","Every part of a district is connected."]]],
wk:["An independent commission would make redistricting fair.","It names a fix but never explains HOW. Add the mechanism: the commission takes map-drawing away from politicians who benefit from cracking the other party's voters."],
mw:"It names one fix, gives real examples, and explains how it reduces cracking (the mapmakers don't benefit from it).",
fr:"T1- One way to reduce gerrymandering is ___. E2- For example, ___. A3- This makes a plan like Plan 2 less likely because ___.",
qc:["A rule that every part of a district must touch the rest of it is called…",["contiguity","compactness","sovereignty"],0,"Contiguous = connected. Compact = a tight, simple shape."]},
{v:"Explain",
q:"Explain how district boundaries like those in Plan 2 could act as a centrifugal force in a country.",
sk:"Centrifugal forces",
s:[["Define it first. Does a centrifugal force pull a country together or push it apart?",["Think of a merry-go-round flinging you outward.","Centrifugal forces divide a country; centripetal forces unify it."]],["How would Party B's voters react to Plan 2?",["40% of the vote, 0 seats. Would they trust the system?","They may feel cheated and lose trust in elections and government."]],["Explain how that reaction weakens the country's unity.",["Distrust → anger, protests, refusing to accept results.","Loyalty to the government weakens, and in extreme cases shut-out groups push for devolution or separation."]]],
r:{m:"all",i:[["Describes a divisive reaction: distrust, anger, feeling unrepresented, or protest",/distrust|trust|faith|anger|angry|\bmad\b|upset|resent|frustrat|unrepresent|underrepresent|not represent|ignored|no voice|left out|shut out|protest|unrest|riot|legitima|rigged|cheat|alienat|give up|stop voting|turnout/i,"Name the reaction: Party B voters feel unrepresented and lose trust in elections and government."],["Connects it to a centrifugal force: it divides people or weakens unity and loyalty",/centrifugal|apart|divid|division|weaken|unity|unif|united|split|separat|secess|devol|loyal|cohes|stabil|polari|tension|conflict/i,"Connect it: that distrust weakens loyalty to the government and pulls the country apart."]]},
mo:"T1- Unfair district boundaries like Plan 2's can act as a centrifugal force because they make a large group of citizens lose trust in their government. E2- Under Plan 2, Party B's voters cast 40% of the votes but win no seats, so they may feel cheated and protest or refuse to accept election results. A3- When many citizens believe the system is rigged, tension between groups grows and loyalty to the government weakens, which pulls the country apart.",
b:["u4t_centri","u4t_federal"],
th:"Centrifugal? Isn't that a science word?",
co:"Good catch, it's borrowed from physics! On a spinning merry-go-round you feel flung outward. Geographers use it for anything that pushes a country's people apart. How would 40% of voters feel after winning zero seats?",
kq:"How could unfair district lines like Plan 2's push a country's people apart instead of together? Explain.",
ml:["Centrifugal vs. centripetal forces",["Centrifugal forces divide a state (a country): unequal treatment, conflict between groups, economic gaps, or distrust of government.","Centripetal forces unify it: a shared national identity, trusted institutions, and fair elections.","Strong centrifugal forces can lead to devolution or even demands for independence, as in Catalonia (Spain)."],[["Centrifugal force","Anything that divides a country or weakens its unity."],["Devolution","Shifting power from the national government to regions."]]],
wk:["A centrifugal force is something that divides a country.","A correct definition, but it never connects to Plan 2. Explain how unfair districts make voters lose trust in government, and how that divides the country."],
mw:"It explains the reaction (lost trust), uses the scenario (40% of the votes, no seats), and connects it to the definition (weaker loyalty).",
fr:"T1- Unfair districts like Plan 2's can be a centrifugal force because ___. E2- For example, under Plan 2 Party B's voters ___. A3- This divides the country because ___.",
qc:["Which of these is a CENTRIPETAL force?",["Elections that most citizens trust","A map that shuts out 40% of voters","A region demanding independence"],0,"Trusted, fair institutions pull a country together. The other two push it apart."]}
]});
addBG({
cashcrop:{t:"Cash crops & plantations",s:["A cash crop is grown to sell, often for export, rather than to feed the farmer's own family.","Colonial powers pushed colonies to specialize in a few crops their home factories needed, like cotton, jute (for sacks and rope), and tea.","Plantations are large estates that grow one crop for export, often with cheap or forced labor. British-owned tea estates in Assam are an example.","Depending on one or two exports leaves a region exposed to world prices it can't control."]},
portcity:{t:"Colonial port cities",s:["Colonizers built port cities as gateways, where raw materials left the colony and manufactured goods came in.","Bombay (Mumbai), Calcutta (Kolkata), and Madras (Chennai) grew from small trading posts into major cities under British rule.","Calcutta was the capital of British India until 1911, when the capital moved to Delhi.","Many former colonies still have a primate city, one city far larger than all the others, that began as a colonial port."]},
famine:{t:"Famines in colonial India",s:["Several deadly famines struck British India in the late 1800s. The Great Famine of 1876–78 alone killed millions of people.","Droughts caused the crop failures, but colonial policy made them worse: grain kept being exported, and relief was limited.","Farmers who grew cash crops had little stored food. They depended on wages and market prices to buy it.","Historians point to these famines as evidence that colonial economic choices shaped life-and-death outcomes."]},
wst:{t:"Wallerstein's world-system theory",s:["Immanuel Wallerstein divided the world economy into the core, the semi-periphery, and the periphery.","Core countries are wealthy and industrialized, and they make high-value goods.","Periphery countries supply raw materials and cheap labor, and they earn far less.","Colonialism helped build this pattern by locking colonies into shipping raw materials to the core.","The theory's big idea: countries are linked, and the core's wealth depends partly on the periphery."]},
uneven:{t:"Uneven development",s:["Development is rarely spread evenly inside a country.","Places that get early investment, such as ports, railways, and factories, attract more businesses and workers, which attracts even more investment.","Geographers call this snowball effect cumulative causation.","The result is a core region that keeps growing while peripheral regions fall behind, and the gap can last for generations."]}
});

,120 283,104\"/></g>\n<g fill=\"none\" stroke=\"#0c0920\" stroke-width=\"1\" stroke-dasharray=\"1 5\"><polyline points=\"78,185 141,164 234,149\"/><polyline points=\"78,185 76,145 122,89\"/><polyline points=\"122,89 153,110 234,149\"/><polyline points=\"93,60 122,89\"/><polyline points=\"93,60 62,95 20,126\"/><polyline points=\"78,185 115,215 153,245\"/><polyline points=\"153,245 126,245\"/><polyline points=\"234,149 256,120 283,104\"/></g>\n<g stroke=\"#ff3fa4\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ar)\" stroke-dasharray=\"4 3\"><path d=\"M74 190 L24 214\"/><path d=\"M16 130 L4 146\"/><path d=\"M236 162 L222 206\"/><path d=\"M158 250 L186 268\"/></g>\n<text x=\"4\" y=\"232\" fill=\"#ff8cc6\" font-size=\"9\" font-family=\"Chakra Petch,sans-serif\" font-weight=\"700\">TO BRITAIN</text>\n<text x=\"200\" y=\"218\" fill=\"#ff8cc6\" font-size=\"9\" font-family=\"Chakra Petch,sans-serif\" font-weight=\"700\">TO BRITAIN</text>\n<g fill=\"#fff\" stroke=\"#000\" stroke-width=\"1\"><rect x=\"117\" y=\"84\" width=\"9\" height=\"9\"/><rect x=\"89\" y=\"56\" width=\"8\" height=\"8\"/><rect x=\"149\" y=\"106\" width=\"8\" height=\"8\"/><rect x=\"137\" y=\"160\" width=\"8\" height=\"8\"/><rect x=\"72\" y=\"141\" width=\"8\" height=\"8\"/><rect x=\"122\" y=\"241\" width=\"8\" height=\"8\"/></g>\n<g fill=\"#22e5ff\" stroke=\"#000\" stroke-width=\"1.2\"><circle cx=\"20\" cy=\"126\" r=\"5.5\"/><circle cx=\"78\" cy=\"185\" r=\"5.5\"/><circle cx=\"153\" cy=\"245\" r=\"5.5\"/><circle cx=\"234\" cy=\"149\" r=\"5.5\"/></g>\n<g font-family=\"Chakra Petch,sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#fff\" stroke=\"#0c0920\" stroke-width=\"3\" paint-order=\"stroke\">\n<text x=\"24\" y=\"120\">Karachi ⚓</text><text x=\"36\" y=\"190\">Bombay ⚓</text><text x=\"159\" y=\"243\">Madras ⚓</text><text x=\"200\" y=\"172\">Calcutta ⚓</text>\n<text x=\"128\" y=\"90\">Delhi</text><text x=\"99\" y=\"55\">Lahore</text><text x=\"160\" y=\"115\">Kanpur</text><text x=\"147\" y=\"165\">Nagpur</text><text x=\"40\" y=\"146\">Ahmedabad</text><text x=\"96\" y=\"262\">Bangalore</text>\n<g font-size=\"9\" fill=\"#ffe7a6\"><text x=\"60\" y=\"79\">WHEAT</text><text x=\"98\" y=\"190\">COTTON</text><text x=\"232\" y=\"128\">JUTE</text><text x=\"276\" y=\"96\">TEA</text></g>\n<g font-size=\"9\" fill=\"#7fb6ff\" font-style=\"italic\"><text x=\"10\" y=\"276\">Arabian Sea</text><text x=\"214\" y=\"246\">Bay of Bengal</text></g>\n<text x=\"306\" y=\"300\" font-size=\"12\">N</text></g>\n<path d=\"M310 290 l5 -14 l5 14 z\" fill=\"#ffd23f\" stroke=\"#000\"/>\n</svg><div class=\"legend\"><span><i style=\"background:#ffd23f\"></i>Railway</span><span><i style=\"background:#22e5ff;border-radius:50%\"></i>Port city</span><span><i style=\"background:#fff\"></i>Inland city</span><span><i style=\"background:#e6b84a\"></i>Wheat</span><span><i style=\"background:#f4f1ff\"></i>Cotton</span><span><i style=\"background:#ff8a3d\"></i>Jute</span><span><i style=\"background:#3ddc84\"></i>Tea</span></div><p class=\"src\">Schematic map created for practice. Simplified, not to scale.</p>",
bg:["raj","cashcrop","readmap"],
nt:[["Trace a few railway lines. Where do most of them END?","Almost every line ends at a coastal port: Karachi, Bombay, Madras, or Calcutta. Few lines link interior cities to each other without heading for the sea."],["What's shaded on the map, and how is each shaded region connected?","The shaded areas are export-crop regions: wheat (Punjab), cotton (Deccan), jute (Bengal), tea (Assam). Each one has a rail line leading to a port."],["Whose map is this? Think about who built these railways, and for what.","The railways were built under British colonial rule. When infrastructure points outward toward ports, ask who it was built to serve."]],
m:20,
p:[
{v:"Identify",
q:"Identify the spatial pattern of the railway network shown on the map.",
sk:"Reading a spatial pattern on a map",
s:[["Trace two or three lines with your finger. Where does each one start, and where does it end?",["Look for the cities marked with an anchor ⚓.","Nearly every line finishes at a coastal port."]],["Put that pattern into one short phrase.",["Words like “converge,” “interior-to-coast,” or “hub-and-spoke” work.","Try this shape: “Lines run from the ___ to the ___.”"]]],
r:{m:"any",i:[["Lines link the interior to coastal ports",/(\b|sea)ports?\b|coast|harbo|\bseas?\b|ocean|shore/i,"Say where the lines END: at coastal port cities."],["Lines converge on a few major cities (e.g., Bombay, Calcutta)",/converg|radiat|hub|funnel|meet (at|in|up)|come together|bombay|calcutta|madras|karachi|mumbai|kolkata|chennai/i,"Name one or two port cities where lines meet, like Bombay or Calcutta."]]},
mo:"The railway lines run from the interior of India and converge on a few coastal port cities, such as Bombay and Calcutta.",
b:["raj"],
th:"What even is a 'spatial pattern'? I just see a bunch of lines.",
co:"Totally normal! A spatial pattern just means how stuff is arranged on the map. You don't need outside facts for this one, just your eyes.",
kq:"Look at where the railroad lines go. What shape or pattern do they make? Name it in a few words.",
ml:["Reading spatial patterns",["Geographers describe where things are and how they're arranged: clustered, spread out, in a line, or pointing toward one place.","When many lines meet at one spot, they converge. That spot is usually important, like a port or a capital.","On this map, ask: do the rails connect interior cities to EACH OTHER, or do they mostly run toward the coast?"],[["Spatial pattern","How things are arranged across space."],["Converge","Come together at one point."],["Interior","Land far from the coast."]]],
wk:["The railroads are all over India.","Too vague. It doesn't say WHAT the pattern is, and 'all over' could describe any map."],
mw:"It names a specific pattern (interior → coast) and points to real places on the map.",
fr:"The railway lines run from the ___ of India to ___ such as ___.",
qc:["When many rail lines meet at one place, geographers say the lines…",["converge","disperse","diffuse"],0,"Converge means come together. On this map, the lines converge on coastal ports."]},
{v:"Describe",
q:"Describe how the pattern of the railway network reflects Great Britain's economic goals in colonial India.",
sk:"Linking infrastructure to colonial economic goals",
s:[["Turn the question into a claim. What was Britain's main economic goal in India?",["Think: what did Britain want FROM India?","Raw materials for British factories, and a market to sell goods back to."]],["Point to something ON THE MAP that shows that goal.",["Look at the shaded crop regions and where their rail lines go.","Example: the jute region in Bengal is linked by rail to the port of Calcutta."]],["Connect your evidence to the goal. Why does that rail pattern help Britain?",["Raw materials have to physically reach the ships.","Rails moved cotton, jute, and tea quickly to ports for shipment to Britain."]]],
r:{m:"all",i:[["Names the goal: extracting raw materials or cash crops for Britain",/raw|resource|crop|cotton|jute|tea|wheat|extract|material/i,"Name the goal: Britain wanted raw materials like cotton, jute, or tea."],["Links the rail pattern to moving goods from the interior to ports for export",/(\b|sea)ports?\b|coast|harbo|ship|export|ocean|\bseas?\b|(to|back to) (great )?(britain|england)/i,"Show how the rails help: they carry goods from the interior to ports to be shipped to Britain."]]},
mo:"T1- The railway pattern reflects Britain's goal of extracting raw materials from India. E2- The lines mostly run from crop-growing regions in the interior, like cotton in the Deccan and jute in Bengal, to the ports of Bombay and Calcutta. A3- This let raw materials move quickly to ships bound for factories in Britain, which is exactly what a colonial economy was built to do.",
b:["raj","cashcrop"],
th:"How am I supposed to know what Britain wanted? I wasn't there.",
co:"You don't need to have been there! The map holds the clue: follow the crops. Open the British imperialism background if you want the story.",
kq:"Britain built these railroads. Based on where they go, what was Britain trying to get out of India?",
ml:["Colonies as raw-material suppliers",["During the Industrial Revolution, British factories needed huge amounts of raw materials, like cotton for cloth mills.","Colonies like India supplied those raw materials cheaply and bought back finished British goods.","Colonial infrastructure was often built to move resources OUT, from farms to ports, rather than to connect local towns."],[["Raw material","An unprocessed resource (cotton, jute, wheat) used to make products."],["Extraction","Taking resources out of a place to use elsewhere."],["Export","Goods shipped out to another country."]]],
wk:["Britain wanted to make India better by building trains.","No economic goal and no map evidence. It never mentions raw materials or ports."],
mw:"It names the goal (raw materials), uses map evidence (crop regions linked to ports), and connects the two.",
fr:"The railways link ___ regions like ___ to ports like ___. This shows Britain wanted to ___ so that ___.",
qc:["Why did British factories need colonies like India?",["For cheap raw materials like cotton","For factory machines","For skilled engineers"],0,"Colonies supplied raw materials; Britain made the finished goods."]},
{v:"Explain",
q:"Explain how colonial rule contributed to the growth of port cities such as Bombay and Calcutta.",
sk:"Colonialism and the growth of port cities",
s:[["What role did port cities play for the colonizers?",["They were the gateway between India and Britain.","They were centers of trade AND of colonial government."]],["What actually brought people and money to those cities?",["Think about jobs at docks, warehouses, rail yards, and offices.","Calcutta was the capital of British India until 1911."]],["How did that cause the cities to grow?",["Jobs → rural-to-urban migration.","Investment + migration → they became the region's largest (even primate) cities."]]],
r:{m:"all",i:[["Names a colonial function: export/trade hub, rail terminus, or administrative center",/trade|export|import|admin|capital|govern|terminal|termin|hub|ship|gateway/i,"Name what the port DID for Britain: trade hub, export point, or capital."],["Explains growth through jobs, investment, or migration",/job|work|employ|migra|invest|moved|move to|people came|population/i,"Show how that grew the city: jobs → people migrating in."]]},
mo:"T1- Colonial rule made Bombay and Calcutta grow because they became the gateways between India and Britain. E2- The rail lines ended there, so these cities handled the exports leaving India and the British goods arriving, which concentrated jobs in shipping, warehouses, banking, and government. A3- Those jobs pulled in rural migrants, and more people brought more businesses, so they became some of South Asia's largest cities.",
b:["portcity"],
th:"Why would a city grow just because it has a port?",
co:"Think of a port city like the busiest bus stop in town. Everything passes through it, so jobs and people pile up there. Let's break it down.",
kq:"Why did cities like Bombay and Calcutta get so big while Britain ruled India? Explain the cause and the effect.",
ml:["How colonial port cities grew",["Every railway on the map ends at a port, so goods and money funneled through a few cities.","Moving goods takes workers: dockworkers, clerks, bankers, merchants, and railway staff.","Jobs attract rural-to-urban migrants, and more people bring more businesses, so the city snowballs.","Calcutta was also the capital of British India until 1911, so government jobs clustered there too."],[["Rural-to-urban migration","Moving from the countryside to a city, usually for jobs."],["Break-of-bulk point","A place where goods switch transport types (train → ship)."]]],
wk:["Bombay and Calcutta grew because they were big cities.","Circular reasoning: they grew because they were big? There's no cause and no process."],
mw:"It walks the whole chain: colonial trade role → jobs → migration → growth.",
fr:"Under British rule, ___ became the main place where goods ___. This created jobs in ___, which led to ___.",
qc:["What usually pulls rural migrants into a growing port city?",["Jobs in trade and shipping","Cheaper farmland","Cooler weather"],0,"Jobs are the main pull factor, and ports created lots of them."]},
{v:"Explain",
q:"Explain ONE way the colonial emphasis on export cash crops affected rural communities in South Asia.",
sk:"Effects of cash-crop agriculture on people",
s:[["Name the effect you'll argue: food supply, money, debt, or famine.",["What happens when farmland grows cotton instead of food?","Possible effects: less food grown, debt, dependence on world prices."]],["Name a specific crop or region from the map.",["Cotton in the Deccan, jute in Bengal, tea in Assam."]],["Explain the chain from cash crop to effect on people.",["Use “because… which led to…”.","Land growing jute or cotton couldn't feed families. When harvests failed or prices fell, farmers couldn't afford food."]]],
r:{m:"all",i:[["Names an effect: less food grown, famine, debt, poverty, or dependence on world prices",/food|famine|hunger|starv|debt|price|depend|poverty|poor/i,"Name a specific effect: less food, famine, debt, or depending on world prices."],["Explains the cause-and-effect link to cash-crop farming",/instead|rather than|in place of|replac|switch|stop(ped)? growing|less (land|farmland)|land (for|used for|to grow) food|(less|not enough|fewer|shortage of) (food|rice|grain)|food shortage|forced|pressur|had to grow|made to grow|world price|market price|price.{0,20}(fell|fall|drop|crash|went down|low)|borrow|loan|\btax|drought|crops? fail|depend|couldn.t (afford|grow|feed)|afford/i,"Add the link: show HOW cash crops caused it, e.g., farmers grew cotton instead of food, or depended on world prices."]]},
mo:"T1- The colonial push for export cash crops made rural families more vulnerable to hunger. E2- Farmers were pressured to grow cotton and jute instead of food crops, so less land produced food and families depended on world prices they couldn't control. A3- Because of this, when prices fell or a drought hit, people couldn't afford food, and drought years turned into deadly famines.",
b:["cashcrop","famine"],
th:"Wait, what's a cash crop? And how could growing crops hurt farmers?",
co:"Great question! A cash crop is grown to SELL, not to eat. The trouble starts when you can't eat what you grow. Check the mini-lesson.",
kq:"Britain pushed Indian farmers to grow crops for export. Pick ONE way that hurt people in the countryside, and explain how.",
ml:["Cash crops vs. food crops",["Subsistence farmers grow food for their own families. Cash-crop farmers grow crops to sell.","When land switches from rice or millet to cotton or jute, families have to BUY food with their crop money.","If world prices drop or a drought hits, they can't afford food. Famines in late-1800s British India killed millions.","Many farmers also borrowed for seed and taxes, which trapped them in debt."],[["Cash crop","A crop grown to sell, often for export."],["Subsistence agriculture","Farming to feed your own family, not to sell."]]],
wk:["Cash crops were bad for farmers.","It says 'bad' but not HOW. An Explain answer needs the cause-and-effect chain."],
mw:"It names a specific effect (hunger and famine) and explains the chain that caused it.",
fr:"Because farmers grew ___ instead of ___, they had to ___. When ___, this led to ___.",
qc:["A cash crop is grown mainly to…",["sell, often for export","feed the farmer's family","feed farm animals"],0,"Cash crops are for selling. Food for the family is subsistence farming."]},
{v:"Describe",
q:"Describe how the economic relationship shown on the map illustrates Wallerstein's world-system theory.",
sk:"Applying world-system theory",
s:[["Label the players. Which was core and which was periphery?",["Core = wealthy, industrial, makes high-value goods.","Britain = core; colonial India = periphery."]],["What flowed out of India, and what flowed back in?",["The map shows raw materials heading to ports.","Raw cotton went to Britain; finished cloth was sold back to India."]],["Why does that flow keep the periphery poorer?",["Who earns more: the raw-material seller or the manufacturer?","Value is added in the core, so wealth piles up there."]]],
r:{m:"all",i:[["Places Britain as the core and India as the periphery",/core|peripher/i,"Label them: Britain = core, India = periphery."],["Describes the flow: raw materials out to the core, manufactured goods or profits kept by the core",/raw|resource|material|crop|cotton|jute|\btea\b|wheat|indigo|commodit|primary|export|cheap|low.value|profit/i,"Describe the flow: raw materials out of India, manufactured goods and profits kept in Britain."]]},
mo:"T1- In world-system theory, Britain was the core and India the periphery. E2- The map shows India sending low-value raw materials like cotton and jute to ports for export to Britain. A3- Britain turned those materials into manufactured goods and kept the higher profits and industrial jobs, which is how the core grows wealthy from the periphery.",
b:["wst"],
th:"Wallerstein? I don't remember this at all.",
co:"No worries. The name sounds scarier than the idea: rich countries make the expensive stuff, poorer ones supply the cheap stuff. Read the mini-lesson, then come back.",
kq:"Use the 'core and periphery' idea to describe the relationship between Britain and India that the map shows.",
ml:["World-system theory in 60 seconds",["Wallerstein said the world economy is one connected system with three tiers.","Core: rich, industrial countries that make high-value goods (colonial Britain).","Periphery: poorer places that supply raw materials and cheap labor (colonial India).","Wealth flows toward the core, because turning raw materials into products is where the money is made."],[["Core","Wealthy, industrial, high-skill economies."],["Periphery","Poorer economies supplying raw materials and low-wage labor."],["Semi-periphery","In-between countries with some industry."]]],
wk:["Wallerstein's theory says there are core and periphery countries.","It defines the theory but never applies it to Britain, India, or the map."],
mw:"It labels each country AND uses the map's flow of raw materials to show the relationship.",
fr:"In world-system theory, Britain was the ___ and India was the ___. India sent ___ to Britain, where ___.",
qc:["In world-system theory, colonial India was part of the…",["periphery","core","semi-periphery"],0,"The periphery supplies raw materials; the core (Britain) made the high-value goods."]},
{v:"Explain",
q:"Explain ONE way the colonial transportation network continues to affect patterns of economic development in South Asia today.",
sk:"Colonial legacy and uneven development",
s:[["What part of the old pattern still shows up today?",["Where are South Asia's biggest economic hubs now?","Mumbai, Kolkata, Chennai, Karachi: the old ports."]],["Name a city or region that is still ahead, or still behind.",["Mumbai is India's financial capital.","Some interior regions without major colonial rail links remain less developed."]],["WHY does old infrastructure keep mattering?",["Infrastructure attracts investment, which attracts more infrastructure: a cycle.","That cycle (cumulative causation) creates uneven development within a country."]]],
r:{m:"all",i:[["Names a present-day pattern: old ports remain top economic hubs, or coast/interior development is uneven",/mumbai|kolkata|chennai|karachi|bombay|calcutta|madras|coast|(\b|sea)ports?\b|uneven|interior|inland|hub/i,"Name today's pattern: old port cities like Mumbai are still the biggest economic hubs."],["Explains why: existing infrastructure keeps attracting investment, industry, and migrants",/infrastructure|invest|attract|industr|business|compan|factor(y|ies)|migra|brings? in|draws? in|pull|cumulative|cycle|head start|already (had|has|have|built|there)|existing|still (go|run|connect|lead|end)/i,"Explain WHY it lasts: existing infrastructure keeps attracting businesses, jobs, and migrants."]]},
mo:"T1- The colonial transportation network still concentrates development in the old port cities. E2- Because colonial railways tied the economy to a few ports, cities like Mumbai and Kolkata got a head start in infrastructure, industry, and finance. A3- That infrastructure keeps attracting new businesses and migrants (cumulative causation), so development is still uneven, with many interior rural regions lagging behind.",
b:["uneven","portcity"],
th:"How would I know what India is like today?",
co:"You know more than you think! Mumbai is India's money capital today. Notice it's one of the old ports on the map? That's your clue.",
kq:"Britain left in 1947. How do those old railways and ports still affect which parts of South Asia are richer or poorer today?",

<div class="panel"><span class="tag px">Turn it in</span><p>Nothing saves on this page. Copy your answers to paste into Canvas or a doc.</p><div class="row"><button class="btn c" data-a="copy">📋 Copy my answers</button><span class="note" id="cpmsg" role="status" aria-live="polite"></span></div><details class="peek" id="cpd"><summary>See the text</summary><div><textarea readonly id="cpt" aria-label="Your answers" style="min-height:200px">${esc(exportTxt())}</textarea></div></details></div>
${no.length?`<div class="row"><button class="btn c" data-a="retry">↻ Retry what I missed ▸</button></div>`:''}${bossV()}<div class="row"><button class="btn" data-a="start" data-i="${S.fi}">↻ Replay</button>${FRQ.length>1?`<button class="btn m" data-a="start" data-i="${(S.fi+1)%FRQ.length}">Try “${esc(FRQ[(S.fi+1)%FRQ.length].t)}” ▸</button>`:''}<button class="btn o" data-a="home">Menu</button></div>`}
let opener;function openBG(k){opener=document.activeElement;app.setAttribute('aria-hidden','true');document.getElementById('shT').textContent=BG[k].t;document.getElementById('shB').innerHTML=BG[k].s.map(x=>`<li>${esc(x)}</li>`).join('');sh.classList.add('on');sh.querySelector('[data-a=x]').focus()}
function closeBG(){if(!sh.classList.contains('on'))return;sh.classList.remove('on');app.removeAttribute('aria-hidden');opener&&opener.focus()}
document.addEventListener('click',e=>{if(e.target==sh)return closeBG();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);
case 'home':S.k=-1;return render(1);
case 'go':return go(+b.dataset.k);
case 'bg':return openBG(b.dataset.k);
case 'x':return closeBG();
case 'nt':S.nt[j].o=1;return render();
case 'hint':{const k=S.k-1;S.p[k].h[j+'-'+b.dataset.m]=1;return render()}
case 'step':S.p[i].st++;return render();
case 'card':S.p[i].c=+b.dataset.c;return render(1);
case 'mcq':S.p[i].q=+b.dataset.o;return render();
case 'boss':{const f=S.p.map((x,k)=>k),miss=f.filter(k=>!S.p[k].ok),rest=f.filter(k=>S.p[k].ok);S.bo={l:miss.concat(rest).slice(0,3),k:0,s:null,r:0};return render()}
case 'bq':{const B=S.bo;if(B.s==null&&+b.dataset.o==0)B.r++;if(B.s!==0)B.s=+b.dataset.o;return render()}
case 'bn':S.bo.k++;S.bo.s=null;return render();
case 'frame':{const t=document.getElementById('ans'),f=S.f.p[i].fr;t.value=t.value.trim()?t.value.trim()+'\n'+f:f;S.p[i].a=t.value;t.focus();const c=t.value.indexOf('___',t.value.length-f.length);if(c>=0)t.setSelectionRange(c,c+3);return}
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.includes('___')){st.w=1;render();return document.getElementById('ans').focus()}st.w=0;if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.c=5;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render(1)}
case 'rev':S.p[i].ck=0;S.p[i].done=0;S.p[i].c=4;render(1);return document.getElementById('ans').focus();
case 'next':{const w=S.p[i].done;S.p[i].done=1;S.p[i].ok=earned(i);if(!w)S.cb=S.p[i].ok?S.cb+1:0;return go(i+2)}
case 'cf':S.p[i].cf=+b.dataset.k;return render();
case 'copy':{const m=document.getElementById('cpmsg'),t=exportTxt();const fail=()=>{document.getElementById('cpd').open=true;const ta=document.getElementById('cpt');ta.focus();ta.select();m.textContent='Select the text below and copy it.'};try{navigator.clipboard.writeText(t).then(()=>{m.textContent='✔ Copied! Now paste it into Canvas.'},fail)}catch(e){fail()}return}
case 'retry':{const m=S.p.findIndex(x=>x.done&&!x.ok);S.p[m].c=4;S.p[m].ck=0;S.p[m].done=0;return go(m+1)}
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeBG();else if(e.key=='Tab'&&sh.classList.contains('on')){e.preventDefault();sh.querySelector('[data-a=x]').focus()}});
render(1);
</script>
</body>
</html>
