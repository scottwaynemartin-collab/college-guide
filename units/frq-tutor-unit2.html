<script>
const BG={
frq:{t:"How AP FRQs are scored",s:["Each part (A, B, C…) is worth 1 point and is scored on its own. A mistake in Part B can't cost you Part C.","Readers look for the right idea, clearly linked to the question. Fancy writing earns nothing extra.","No thesis, intro, or conclusion needed. Label each part and answer it directly.","Write in complete sentences and do what the task verb asks (Identify, Describe, or Explain).","Never leave a part blank. A wrong answer costs nothing."]},
tea:{t:"The TEA method",s:["T1- Topic: your reason in general words. Turn the question into your claim.","E2- Evidence: the specific proof, like a place, number, or example, ideally from the map or table.","A3- Analysis: why it matters. Explain HOW or WHY your proof backs up your reason, using “because…” or “which leads to…”.","Label each piece T1-, E2-, A3- so the reader can find every point. Describe answers need T1 and E2 plus a short A3. Explain answers need a strong A3."]},
readmap:{t:"How to read a map",s:["Read the title first. It tells you the topic, place, and time.","Check the legend so you know what each color and symbol means.","Look for patterns: what's clustered, what's connected, what points where?","Then ask WHY: who made this, and what story is it telling?"]},
readtable:{t:"How to read a data table",s:["Read the title and every column header, including units (%, per 1,000).","Find the highest and lowest value in each column.","Compare columns: when one goes up, does another go up or down?","When there are two years, look for change over time."]},
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]}
};
const VERBS={
Identify:{d:"Name it. A word or short phrase is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","One sentence max."]},
Describe:{d:"Paint the picture. Give the specific characteristics or pattern, with details someone could check.",l:["Use evidence: a place, a number, or a feature from the stimulus.","Say what it IS or what it LOOKS LIKE. You don't need a deep “why.”","About 1–2 sentences. Use TEA: Topic + Evidence, then a quick Analysis."]},
Explain:{d:"Tell HOW or WHY. Connect a cause to an effect so a reader sees the reasoning, not just a fact.",l:["Use linking words: “because…”, “which leads to…”, “as a result…”.","A fact alone won't score. You need the chain of reasoning.","About 2–3 sentences. Use full TEA."]},
Define:{d:"Give the meaning. Say what the term is in your own words, clearly enough that someone who never heard it would get it.",l:["Use a full sentence: “[Term] is…”","Don't just give an example. The meaning comes first; an example can back it up.","One or two sentences."]},
Compare:{d:"Show how two things are alike or different. Name BOTH things and make the difference (or similarity) clear.",l:["Use comparison words: “while…”, “whereas…”, “unlike…”, “both…”.","Talking about only one side won't score. Mention both.","About 2 sentences. T1- names the difference, E2- gives an example of each, A3- says why it matters."]}
};
const FRQ=[];
function addBG(o){Object.assign(BG,o)}
function addFRQ(f){FRQ.push(f)}
const UNIT="Unit 2 · Population and Migration";
addBG({
tfr:{t:"Total Fertility Rate (TFR)",s:["TFR is the average number of children a woman is expected to have in her lifetime.","A TFR of about 2.1 is replacement level, just enough for each generation to replace itself. The extra 0.1 covers children who die young.","Above 2.1, population tends to grow. Below 2.1, it eventually shrinks unless immigrants arrive.","TFR is one of the best single numbers for predicting a country's future population."]},
dtm:{t:"Demographic Transition Model (DTM)",s:["The DTM describes how birth and death rates change as a country develops.","Stage 1: both rates are high, so population barely grows.","Stage 2: death rates drop (better food, medicine, sanitation) but birth rates stay high, so population grows fast.","Stage 3: birth rates fall as the country urbanizes and women gain education.","Stages 4–5: both rates are low, and population levels off or even shrinks."]},
women:{t:"Women's education & fertility",s:["Worldwide, one of the strongest predictors of lower fertility is how many years of school girls complete.","Staying in school tends to delay marriage and first births.","Education opens paid jobs, so each extra child has a higher opportunity cost (the income a mother gives up).","Educated women usually know more about health care and family planning and have more say in family decisions."]},
urban:{t:"Urbanization & family size",s:["On farms, children can help with work, so a big family can be an economic asset.","In cities, children usually don't earn income, and housing, food, and school cost more.","Cities also offer more clinics, contraception, and paid jobs for women.","That's why fertility usually falls as a country becomes more urban."]},
pyramid:{t:"Population pyramids",s:["A population pyramid is a bar graph of a population by age and sex, with the youngest at the bottom.","A wide base means many births, which is common in Stage 2 countries.","When fertility falls, the base narrows and the shape turns more like a beehive or column.","Large age groups (cohorts) move up the pyramid over time like a bulge."]},
dependency:{t:"Dependency ratio",s:["The dependency ratio compares people who usually aren't working (children under 15 and adults 65+) with the working-age population (15–64).","A high elderly dependency ratio means fewer workers paying taxes to support each retiree's pension and health care.","Very-low-fertility countries such as Japan and Italy face rising elderly dependency ratios.","Common responses include encouraging immigration, raising the retirement age, and supporting families who want children."]}
});
addFRQ({k:"Practice FRQ · Data table",
t:"Fewer Babies, Bigger Cities",
d:"Fertility, women's education, and urbanization across four countries.",
u:"Units 2 · 6",
fmt:"One stimulus (like Question 2)",
st:"Selected Population and Development Indicators",
intro:"The table shows data for four countries. (The countries are fictional and the data were created for practice.)",
stim:"<div class=\"tbl\"><table><thead><tr><th>Country</th><th>Total fertility rate 1995</th><th>Total fertility rate 2020</th><th>Female secondary school enrollment, 2020 (%)</th><th>Urban population, 2020 (%)</th><th>Infant mortality, 2020 (per 1,000 births)</th></tr></thead><tbody>\n<tr><td>Norvale</td><td>6.1</td><td>5.4</td><td>22</td><td>24</td><td>68</td></tr>\n<tr><td>Kestria</td><td>5.8</td><td>3.1</td><td>61</td><td>48</td><td>31</td></tr>\n<tr><td>Tamboa</td><td>3.4</td><td>1.9</td><td>88</td><td>71</td><td>12</td></tr>\n<tr><td>Ruzhan</td><td>2.0</td><td>1.3</td><td>97</td><td>82</td><td>3</td></tr></tbody></table></div><p class=\"src\">Total fertility rate = average number of children per woman. Data created for practice.</p>",
bg:["tfr","dtm","readtable"],
nt:[["Which column varies the most from country to country?","TFR in 2020 ranges from 5.4 down to 1.3, about four times different. Female secondary enrollment ranges from 22% to 97%."],["Pick one row. Do the numbers seem to “move together”?","In every row, high female enrollment and a high urban % come with low TFR and low infant mortality. That's a pattern worth testing."],["Which country changed the fastest between 1995 and 2020?","Kestria: its TFR fell from 5.8 to 3.1, nearly cut in half in 25 years."]],
m:20,
p:[
{v:"Identify",
q:"Identify the country in the table that is most likely in Stage 2 of the demographic transition model.",
sk:"Matching data to a DTM stage",
s:[["Recall what Stage 2 looks like: death rates falling, birth rates still high.",["High birth rate → high TFR.","Death rates are only starting to fall, so infant mortality is still fairly high."]],["Find the row with the highest TFR and highest infant mortality.",["Scan the 2020 TFR column top to bottom.","It's the first row."]]],
r:{m:"any",i:[["Norvale",/norvale/i,"Find the country with the highest TFR and the highest infant mortality."]]},
mo:"Norvale.",
b:["dtm"],
th:"I kind of forgot the DTM stages...",
co:"Easy fix: read the mini-lesson below. You only need one idea: Stage 2 = lots of births, with deaths just starting to drop.",
kq:"Which country looks like Stage 2: lots of babies being born, and death rates only starting to fall?",
ml:["Spotting Stage 2 in data",["Stage 2 countries have high birth rates, so look for the highest TFR (around 5 or more).","Death rates are falling, but health care is still limited, so infant mortality is fairly high.","They are usually more rural, because Stage 2 comes before major urbanization.","Stage 3+ countries show falling TFR, more urban populations, and lower infant mortality."],[["TFR","Average number of children per woman."],["Infant mortality","Babies who die before age 1, per 1,000 births."]]],
wk:["Ruzhan.","Ruzhan has the LOWEST TFR (1.3). That fits Stage 4 or 5, not Stage 2."],
mw:"Norvale has the highest TFR (5.4) and infant mortality and is the most rural: all Stage 2 signs.",
fr:"The country most likely in Stage 2 is ___.",
qc:["In DTM Stage 2, birth rates are ___ and death rates are ___.",["high; falling","low; low","falling; high"],0,"Stage 2 = high births, falling deaths, so population booms."]},
{v:"Describe",
q:"Describe the relationship between female secondary school enrollment and total fertility rate shown in the table.",
sk:"Describing a relationship in data",
s:[["Name the relationship. As one goes up, what does the other do?",["Compare the top row to the bottom row.","This is an inverse (negative) relationship."]],["Quote numbers from TWO countries.",["Norvale: 22% enrollment, TFR 5.4.","Ruzhan: 97% enrollment, TFR 1.3."]],["Tie it together in one sentence that covers all four countries.",["“As female enrollment increases, TFR ___.”"]]],
r:{m:"all",i:[["States an inverse/negative relationship (more enrollment, lower TFR)",/inverse|negative|lower|decreas|less|fewer|smaller|fall|drop|declin|opposite|go(es|ing)? down|went down/i,"Say the direction: as enrollment goes UP, TFR goes DOWN (inverse)."],["Supports it with numbers from the table",/\d/,"Add numbers from two countries, like Norvale (22%, 5.4) and Ruzhan (97%, 1.3)."]]},
mo:"T1- The table shows an inverse relationship: as female secondary enrollment rises, TFR falls. E2- Norvale has only 22% enrollment and a TFR of 5.4, while Ruzhan has 97% enrollment and a TFR of just 1.3. A3- This matters because it suggests that keeping girls in school is one of the strongest ways a country lowers its birth rate.",
b:["tfr"],
th:"What does 'relationship' mean? Like, they're dating?",
co:"Ha, kind of! In data, a relationship means: when one number changes, does the other one change too? Compare two columns side by side.",
kq:"Compare the girls-in-school column with the babies-per-woman column. When one goes up, what happens to the other? Use numbers.",
ml:["Describing a relationship in data",["Positive (direct) relationship: both go up together.","Inverse (negative) relationship: one goes up while the other goes down.","Strong answers name the relationship AND quote numbers from at least two rows.","Compare the extremes (top and bottom of the range) to make the pattern obvious."],[["Inverse relationship","As one variable rises, the other falls."],["Female secondary enrollment","Share of teen girls in high-school-level education."]]],
wk:["Education and fertility are related.","It doesn't say HOW they're related and uses no numbers from the table."],
mw:"It names the direction (inverse) and backs it up with data from two countries.",
fr:"As female secondary enrollment ___, TFR ___. For example, ___ has ___% enrollment and a TFR of ___, while ___ has ___.",
qc:["One number goes up while the other goes down. That relationship is…",["inverse (negative)","positive (direct)","no relationship"],0,"Inverse means they move in opposite directions."]},
{v:"Explain",
q:"Explain ONE reason why increased access to education for women leads to lower fertility rates.",
sk:"Explaining education → fertility",
s:[["Pick ONE mechanism to argue.",["Options: delayed marriage, paid careers, knowledge of family planning, more say in decisions."]],["What concretely changes in a woman's life?",["Staying in school until 18 means marrying and having a first child later.","Educated women are more likely to work for wages."]],["Connect it to fewer births.",["Starting later = fewer childbearing years.","Each child costs more when a mother gives up wages (opportunity cost)."]]],
r:{m:"all",i:[["Names a mechanism: delayed marriage, paid work, family-planning knowledge, or decision-making power",/marr|career|job|work|contracep|family planning|birth control|decision|empower|later/i,"Pick ONE mechanism: marrying later, working for wages, or knowing about family planning."],["Explains how that mechanism results in fewer children",/fewer|less|lower|reduc|because|opportunit|so she|so they/i,"Finish the chain: explain how that leads to fewer children."]]},
mo:"T1- Women who stay in school longer tend to have fewer children because they start families later and have more career options. E2- A girl who finishes secondary school usually marries and has her first child years later, and she is more likely to work for wages. A3- Because she starts later and each child costs her more in lost income (opportunity cost), she has fewer children overall.",
b:["women"],
th:"Why would going to school mean having fewer kids? That seems random.",
co:"It's not random once you picture a real girl's life. Say she's in school until 18 and wants to be a nurse. How does that change her plans?",
kq:"Why do women with more education usually have fewer children? Explain ONE reason, step by step.",
ml:["Why education lowers fertility",["Time: girls in school usually marry and start families later, leaving fewer childbearing years.","Money: educated women can earn wages, so each child costs more in lost income (opportunity cost).","Knowledge: education raises awareness of health care and family planning.","Power: educated women often have more say in decisions about family size."],[["Opportunity cost","What you give up when you choose something else."],["Family planning","Choosing the number and timing of children."]]],
wk:["Educated women are smarter, so they have fewer kids.","Not a real mechanism. It doesn't explain WHAT changes in her life to lower fertility."],
mw:"It picks one mechanism (marrying later + working) and walks through how it leads to fewer births.",
fr:"When women stay in school longer, they ___. Because of this, ___, which leads to fewer children.",
qc:["The 'opportunity cost' of having a child means…",["the income or chances a parent gives up","the price of baby clothes","school taxes"],0,"It's what you give up, like wages from a job."]},
{v:"Explain",
q:"Using data from the table, explain how urbanization can contribute to declining fertility rates.",
sk:"Explaining urbanization → fertility with data",
s:[["Why might city families want fewer kids than farm families?",["On a farm, children work. In a city, children ___.","Children shift from economic asset to economic cost."]],["Cite the table: compare % urban and TFR.",["Norvale: 24% urban, TFR 5.4.","Tamboa: 71% urban, TFR 1.9."]],["Explain the chain from city life to fewer births.",["Housing and school cost more in cities.","Cities offer more clinics and contraception, and lower infant mortality means less need for “extra” children."]]],
r:{m:"all",i:[["Uses table data showing more-urban countries have lower TFR",/\d/,"Quote the table: compare a more-urban and a less-urban country."],["Explains why: children cost more or aren't farm labor in cities, or cities offer better access to health care/contraception",/cost|expens|afford|\brent\b|tuition|labor|labour|farm|asset|contracep|birth control|family planning|health|clinic|hospital|doctor|medic|hous|job|career/i,"Explain WHY: in cities kids cost more and don't do farm work, or health care is better."]]},
mo:"T1- More-urban countries have lower fertility because children cost more and help less in cities. E2- In the table, Norvale is 24% urban with a TFR of 5.4, while Tamboa is 71% urban with a TFR of 1.9. A3- In cities, children don't provide farm labor and housing and schooling cost more, so children become an economic cost rather than an asset, which leads families to have fewer.",
b:["urban"],
th:"How do cities make people have fewer kids?",
co:"Picture a family on a farm and a family in a city apartment. Who needs more kids to help out? Who pays more for each kid?",
kq:"More-urban countries in the table have fewer babies. Use the numbers, then explain WHY city life leads to smaller families.",
ml:["Urban life & family size",["On farms, children help with work, so kids can be an economic asset.","In cities, kids usually don't earn money, and rent, food, and school cost more, so kids become an economic cost.","Cities also have more clinics, contraception, and jobs for women.","Better health care lowers infant mortality, so parents don't need extra births to be sure some children survive."],[["Urbanization","Growth in the share of people living in cities."],["Economic asset","Something that brings in value or help."]]],
wk:["Cities are crowded, so people have fewer kids.","No data from the table, and 'crowded' isn't the real reason. Explain costs, jobs, or health care."],
mw:"It quotes the table AND explains the asset-to-cost shift.",
fr:"___ is ___% urban with a TFR of ___, but ___ is ___% urban with a TFR of ___. In cities, children ___, so ___.",
qc:["On a farm a child is often an economic ___; in a city, more of an economic ___.",["asset; cost","cost; asset","cost; cost"],0,"Farm kids help work; city kids mostly cost money."]},
{v:"Describe",
q:"Describe ONE likely change in the shape of Kestria's population pyramid resulting from the change in its total fertility rate between 1995 and 2020.",
sk:"Predicting population pyramid shape",
s:[["What happened to Kestria's TFR?",["1995: 5.8 → 2020: 3.1."]],["Which bars on a pyramid show newborns and young children?",["The base (bottom) bars."]],["Describe the new shape.",["Fewer births → the base narrows.","The large cohorts born in the 1990s move up into working ages, widening the middle (more “beehive”)."]]],
r:{m:"all",i:[["Describes a shape change: narrower base, or a wider working-age middle",/base|bottom|young|child|bab(y|ies)|middle|working|beehive|column|bulge|rectangle|less (like a|of a) (triangle|pyramid)/i,"Describe the shape: the base gets narrower, or the middle gets wider."],["Links it to Kestria's falling TFR (5.8 → 3.1)",/fewer|less|lower|declin|drop|fall|fell|decreas|went down|go(es)? down|smaller|shrink|5\.8|\b6\b.{0,30}\b3\b/i,"Link it to Kestria's TFR dropping from 5.8 to 3.1."]]},
mo:"T1- Kestria's pyramid will get a narrower base because fewer children are being born. E2- Its TFR fell from 5.8 in 1995 to 3.1 in 2020, so each new age group at the bottom is smaller than the one before. A3- Meanwhile the large group born in the 1990s moves up into working ages, so the pyramid becomes a slimmer triangle with a bulge moving up into the working ages. It is not yet the beehive shape of a country near replacement level, because a TFR of 3.1 is still well above 2.1.",
b:["pyramid"],
th:"I have to picture a population pyramid? Help.",
co:"No drawing needed! Just remember: the bottom bars = babies. Fewer babies → what happens to the bottom?",
kq:"Kestria's babies-per-woman dropped a lot. How will the shape of its population pyramid change? Describe it.",
ml:["Reading pyramid shapes",["The bottom bars of a pyramid are the youngest people (ages 0–4).","High fertility = a wide base (a triangle shape).","When fertility drops, fewer babies are born, so the base narrows.","The many kids born earlier grow up, so a bulge moves up into the working-age middle. A country only gets the beehive shape once its TFR falls to about 2.1."],[["Cohort","A group of people born in the same time period."],["Working-age population","People ages 15–64."]]],
wk:["Kestria's pyramid will change shape.","It says the shape changes but not HOW. Say which part gets narrower or wider."],
mw:"It links the data (5.8 → 3.1) to a specific shape change (narrower base, wider middle).",
fr:"Kestria's TFR fell from ___ to ___, so ___. This means the ___ of its pyramid will become ___.",
qc:["Which part of a population pyramid shows the youngest people?",["The base (bottom)","The top","The middle"],0,"The bottom bars are ages 0–4."]},
{v:"Explain",
q:"Explain ONE economic challenge Ruzhan is likely to face as a result of its total fertility rate.",
sk:"Consequences of below-replacement fertility",
s:[["Ruzhan's TFR is 1.3. How does that compare to replacement level?",["Replacement is about 2.1.","Below replacement → the population ages and eventually shrinks."]],["Name the specific economic challenge.",["Labor shortages, pension and health-care costs, a shrinking tax base, a high elderly dependency ratio."]],["Explain why low TFR causes that challenge.",["Fewer young workers enter the labor force while more retirees draw benefits."]]],
r:{m:"all",i:[["Recognizes that TFR is below replacement (≈2.1), so the population ages or shrinks",/replacement|2\.1|aging|ageing|old|elder|shrink|declin/i,"Connect TFR to aging: 1.3 is below replacement (2.1), so the population gets older."],["Explains an economic challenge: labor shortage, pension/health costs, smaller tax base, dependency ratio",/labor|labour|worker|pension|health|tax|depend|retire|social security/i,"Name an economic challenge: labor shortages, pension and health costs, or fewer taxpayers."]]},
mo:"T1- Ruzhan will face an aging population with too few workers because its fertility is below replacement level. E2- Its TFR of 1.3 is well below 2.1, so fewer young people enter the workforce each year while more people retire. A3- This leads to labor shortages and a smaller tax base to pay for pensions and health care, raising the elderly dependency ratio.",
b:["tfr","dependency"],
th:"Fewer kids sounds like a good thing. Why is it a problem?",
co:"Smart thinking, and it can help at first! The problem shows up 20–40 years later. Who's going to work, and who's going to retire?",
kq:"Ruzhan has very few babies (1.3 per woman). Explain ONE money problem this will cause for the country.",
ml:["Life below replacement level",["A TFR of 2.1 replaces each generation. Ruzhan's 1.3 is far below that.","Over time the population ages: more retirees, fewer young workers.","Fewer workers means fewer taxpayers, while pensions and health care for the elderly cost more.","Businesses may struggle to find workers, which slows the economy."],[["Replacement level","A TFR of about 2.1."],["Elderly dependency ratio","People 65+ for every 100 working-age people."]]],
wk:["Ruzhan's population will go down.","That's a population change, not an economic challenge, and it doesn't explain the effect on jobs or money."],
mw:"It connects low TFR → aging → a specific economic problem (labor shortages, pension costs).",
fr:"Ruzhan's TFR of ___ is below ___, so its population will ___. This causes ___ because ___.",
qc:["Replacement-level fertility is about…",["2.1 children per woman","1.0 child per woman","4.0 children per woman"],0,"2.1 replaces each generation; the extra 0.1 covers children who die young."]},
{v:"Explain",
q:"Explain ONE limitation of using national-scale data, such as the data in the table, to understand fertility patterns.",
sk:"Scale of analysis & data limits",
s:[["What does one national number hide?",["Think about differences INSIDE a country."]],["Give a specific kind of variation.",["Urban vs. rural, rich vs. poor regions, ethnic or religious groups."]],["Why does that matter?",["Averages can hide regions with very high or very low fertility.","Policies based on the average may miss the places that need them most."]]],
r:{m:"all",i:[["Names variation hidden by national averages (urban/rural, regional, income, ethnic/religious)",/region|rural|urban|within|inside|province|state|ethnic|relig|income|average|vary|variation|local/i,"Name what's hidden: differences between regions, cities vs. rural areas, or income groups."],["Explains why that hides important patterns or leads to wrong conclusions",/wrong|mislead|inaccura|polic|program|government|leader|decision|target|plan|(n.t|not|never) (be able to )?(see|tell|know|realiz|notice|understand)|(would|could|might|may|to) (think|assume|believe)|make (you|people|them|us|someone) (think|assume|believe)|(miss|hid)(e|es|ing)? (the |some )?(places|areas|regions|groups|people|pockets) (where|that|with)|miss(es|ing)? (where|high|low)|need|help|resource|fund|money|\baid\b/i,"Explain why it matters: the average can hide places with very high or very low fertility."]]},
mo:"T1- One limitation is that national data are averages that hide differences within a country. E2- For example, Kestria's TFR of 3.1 could combine cities near 2.0 with rural regions above 5.0. A3- Because of this, the table can't show where fertility is actually high or why, so policies based on it could miss the places that need them most.",
b:["scale"],
th:"The table looks pretty complete to me...",
co:"It does look tidy! But one number for a whole country is an average. Think about your own state: is every place the same?",
kq:"Each country gets only ONE number. What does that hide, and why is that a problem?",
ml:["Why scale matters",["National data is an average for the whole country.","Inside a country, cities often have much lower fertility than rural areas.","Fertility can also differ by region, income, religion, or ethnic group.","So one national number can hide places with very high or very low fertility and lead to bad conclusions or policies."],[["Scale of analysis","The level you study: local, regional, national, global."],["Aggregate data","Data combined into one total or average."]]],
wk:["The table doesn't have enough countries.","That's about sample size, not scale. The question asks what national-level data hides."],
mw:"It names the hidden variation (cities vs. rural areas) and explains why that leads to wrong conclusions.",
fr:"National data shows only ___, so it hides differences between ___. This matters because ___.",
qc:["A single national average can hide differences between…",["cities and rural areas in the country","two different countries","different years"],0,"National data blends together places inside the country."]}
]});
addBG({
u2t_pushpull:{t:"Push and pull factors",s:["Push factors make people want to leave a place. Pull factors attract them to a new one.","They come in four main kinds: economic (jobs, wages), environmental (drought, floods), political (war, persecution), and social or cultural (family, religion, discrimination).","Economic factors are the most common reason people migrate.","Most moves combine both: a push at home AND a pull somewhere else."]},
u2t_ravenstein:{t:"Ravenstein's laws of migration",s:["In the 1880s, geographer E. G. Ravenstein studied British census records and wrote “laws of migration.”","Most migrants move only a short distance, so the number of migrants drops as distance grows: distance decay.","Long-distance migrants usually head for big cities and job centers.","Many people move in steps (step migration), like village → town → city.","Every migration flow produces a counterflow of people returning home."]},
u2t_chain:{t:"Chain migration",s:["Chain migration happens when people move somewhere because relatives or neighbors from home already live there.","Earlier migrants send back news and money and help newcomers find jobs and housing.","Each newcomer can help the next one, so the “chain” keeps growing.","Over time this can build ethnic enclaves, like Little Havana in Miami."]},
u2t_obstacles:{t:"Intervening obstacles & opportunities",s:["An intervening obstacle is a barrier between a migrant's origin and destination that makes the move harder.","It can be physical (rivers, oceans, deserts, mountains), political (border walls, visas, immigration limits), or economic (the cost of the trip).","As transportation improves, political obstacles like visas and walls matter more than physical ones.","An intervening opportunity is the opposite: a job or safe place found along the way that convinces a migrant to stop there instead."]},
u2t_remit:{t:"Remittances",s:["Remittances are money that migrants send back to family in their home country.","Migrants send more than $600 billion a year to low- and middle-income countries, more than those countries receive in foreign aid.","In Nepal, Honduras, and Tajikistan, remittances equal more than a fifth of GDP.","Families spend the money on food, school, health care, and housing, which boosts local businesses.","Migrants who keep close ties to home like this are called transnational migrants."]},
u2t_forced:{t:"Voluntary vs. forced migration",s:["Voluntary migration is a choice. Forced migration is caused by violence, persecution, disaster, or slavery.","A refugee has crossed an international border to escape persecution for their race, religion, nationality, political opinion, or social group.","An asylum seeker has asked another country for protection and is still waiting for a decision.","An internally displaced person (IDP) was forced to flee but stayed inside their own country.","A slow drought, like Tavira's, blurs the line between the two."]},
u2t_agesex:{t:"Migration, age, and sex",s:["Most migrants are young adults, roughly ages 20 to 35.","When many leave, the origin's population pyramid gets “pinched” in the young-adult bars, leaving children and older people behind.","That raises the dependency ratio and can lower the birth rate.","Destinations gain young workers: in Qatar and the UAE, so many male guest workers have arrived that men far outnumber women.","When skilled people like doctors and engineers leave, the origin suffers brain drain."]}
});

intro:"Stimulus 1 is a flow map of the people who left the country of Tavira in 2023. Stimulus 2 is one of those migrants describing her move in her own words. (Tavira, its neighbors, the numbers, and the person are fictional and were created for practice.)",
stim:"<h4 style=\"color:var(--yl);margin:14px 0 6px\">Stimulus 1: Emigration from Tavira, 2023</h4>\n<svg viewBox=\"0 0 340 260\" role=\"img\" aria-label=\"Flow map of people who left the fictional country of Tavira in 2023; arrow width shows the number of migrants. The widest arrow, 410,000 people, runs north across the Brava River into Montaro, a high-income neighboring country. A medium arrow, 150,000 people, curves west across the ocean to Eldmark, a high-income country about 6,000 km away. The thinnest arrow, 40,000 people, runs south into Pelora, a middle-income neighboring country. A legend shows thick, medium, and thin arrows for about 400,000, 150,000, and 40,000 migrants.\">\n<rect width=\"340\" height=\"260\" fill=\"#0a1d3a\"/>\n<path d=\"M0 24L58 18L84 50L76 104L52 140L0 146z\" fill=\"#24304f\" stroke=\"#7fe8ff\" stroke-width=\"1.5\"/>\n<path d=\"M196 0H340V260H204L186 214L180 168L190 118L176 66z\" fill=\"#24304f\" stroke=\"#7fe8ff\" stroke-width=\"1.5\"/>\n<path d=\"M186 105H340V185H182L180 168L190 118z\" fill=\"#ff3fa4\" fill-opacity=\".22\"/>\n<path d=\"M186 105Q214 98 242 105T298 105T340 105\" fill=\"none\" stroke=\"#22e5ff\" stroke-width=\"3\"/>\n<path d=\"M182 185H340\" stroke=\"#ffe7a6\" stroke-dasharray=\"4 3\"/>\n<g stroke=\"#ffd23f\" fill=\"none\"><path d=\"M240 142V87\" stroke-width=\"14\"/><path d=\"M230 150C170 160 130 80 92 66\" stroke-width=\"5\"/><path d=\"M240 158V212\" stroke-width=\"2\"/></g>\n<g fill=\"#ffd23f\"><path d=\"M226 88H254L240 60z\"/><path d=\"M96 59.5L91 73.5L80.5 62z\"/><path d=\"M235 211H245L240 221z\"/></g>\n<circle cx=\"240\" cy=\"150\" r=\"6\" fill=\"#fff\" stroke=\"#000\"/>\n<g stroke=\"#ffd23f\"><path d=\"M8 212h32\" stroke-width=\"14\"/><path d=\"M8 230h32\" stroke-width=\"5\"/><path d=\"M8 246h32\" stroke-width=\"2\"/></g>\n<g font-family=\"Chakra Petch,sans-serif\" font-weight=\"700\" fill=\"#fff\" stroke=\"#0a1d3a\" stroke-width=\"3\" paint-order=\"stroke\">\n<g font-size=\"12\"><text x=\"256\" y=\"147\">TAVIRA</text><text x=\"262\" y=\"28\">MONTARO</text><text x=\"5\" y=\"96\">ELDMARK</text><text x=\"258\" y=\"230\">PELORA</text></g>\n<g font-size=\"9\" fill=\"#ffe7a6\"><text x=\"256\" y=\"159\">origin</text><text x=\"262\" y=\"40\">high-income</text><text x=\"262\" y=\"50\">neighbor</text><text x=\"5\" y=\"108\">high-income</text><text x=\"5\" y=\"119\">6,000 km away</text><text x=\"258\" y=\"242\">middle-income</text><text x=\"258\" y=\"252\">neighbor</text><text x=\"46\" y=\"216\">400,000</text><text x=\"46\" y=\"233\">150,000</text><text x=\"46\" y=\"249\">40,000</text></g>\n<g font-size=\"12\" fill=\"#ffd23f\"><text x=\"256\" y=\"92\">410,000</text><text x=\"88\" y=\"124\">150,000</text><text x=\"248\" y=\"200\">40,000</text></g>\n<g font-size=\"9\" fill=\"#7fb6ff\" font-style=\"italic\"><text x=\"120\" y=\"36\">OCEAN</text><text x=\"292\" y=\"122\">Brava R.</text></g>\n<text x=\"8\" y=\"198\" font-size=\"8\">ARROW WIDTH = NUMBER OF MIGRANTS</text></g>\n</svg><p class=\"src\">Flow map created for practice. Tavira, Montaro, Eldmark, Pelora, and all numbers are fictional. Tavira's population is about 20 million. Schematic, not to scale.</p>\n<h4 style=\"color:var(--yl);margin:14px 0 6px\">Stimulus 2: “Why I Left Tavira”</h4>\n<div class=\"passage\" style=\"background:#0a0820;border:2px solid var(--ln);padding:12px;font-size:16px;line-height:1.6\"><p>“The drought lasted three years. Our maize died, and the family farm could not feed us anymore. My cousin Elena had already lived in Montaro for six years. She found me a job at the fruit-packing plant where she works. Getting here was the hardest part: we crossed the Brava River at night, where people drown every year, and then walked for hours along the border wall to find a way through. Now I send money home every month so my little brothers can stay in school. Someday, when the rains return, I will go back to Tavira.”</p></div><p class=\"src\">Account by Marisol, age 24, who moved from Tavira to Montaro in 2023. Marisol and her words are fictional and were created for practice.</p>",

{v:"Describe",
q:"Using Stimulus 1, describe the pattern of migration from Tavira and how it reflects the role of distance in migration.",
sk:"Distance decay and Ravenstein's laws",
s:[["Name the pattern. Did MOST people go somewhere near or far?",["Compare arrow widths and read the labels under each country.","Most went next door. Fewer crossed the ocean."]],["Give numbers from the map as proof.",["Montaro (next door): 410,000. Eldmark (6,000 km away): 150,000.","Both are high-income, so the big difference is distance."]],["Connect the pattern to a geography idea about distance.",["Ravenstein said most migrants move only a short distance.","Distance decay: the farther away a place is, the fewer people move there."]]],
r:{m:"all",i:[["Describes the pattern: most went a short distance to neighboring Montaro",/montaro|neighbo|next door|nearby|near|close|short|border/i,"Say where MOST went: to Montaro, right next door."],["Uses map evidence: numbers or arrow widths (410,000 vs. 150,000)",/410|150|40,?000|thick|wid|arrow|more than|fewer|less/i,"Quote the map: 410,000 went to Montaro next door, but only 150,000 to faraway Eldmark."],["Connects to distance: distance decay or Ravenstein",/distance|decay|ravenstein|far|cost|cheap|expens|risk|easier/i,"Tie it to distance: Ravenstein said most migrants move short distances (distance decay)."]]},
mo:"T1- Most migrants from Tavira moved a short distance to a neighboring country, and far fewer made the long trip overseas. E2- In 2023, 410,000 people went next door to Montaro, while only 150,000 crossed the ocean to Eldmark, about 6,000 km away, even though both are high-income countries. A3- This fits Ravenstein's law that most migrants move short distances, an example of distance decay: long moves cost more and feel riskier, so fewer people make them.",
b:["u2t_ravenstein","readmap"],
th:"“Pattern”? It's just three arrows.",
co:"Three arrows is plenty! A pattern is what the arrows have in common. Did most people go somewhere close or somewhere far? Then grab the numbers.",
kq:"Did most people move near or far? Describe that pattern using the map, and say how distance played a role.",
ml:["Ravenstein and distance decay",["In the 1880s, geographer E. G. Ravenstein wrote “laws of migration.” The first: most migrants move only a short distance.","That's distance decay: the farther apart two places are, the less they interact.","Long moves cost more, are riskier, and take people farther from family.","Distance isn't everything: Pelora is next door too but got only 40,000, because Montaro's higher wages pull harder."],[["Distance decay","The farther away a place is, the less interaction (trade, travel, migration) it has with you."],["Ravenstein's laws","1880s rules about migration, like “most migrants move short distances.”"]]],
wk:["Most people went to Montaro.","It names the pattern but stops: no numbers and no link to distance. Add 410,000 vs. 150,000 and explain why distance matters."],
mw:"It describes the pattern (most went next door), proves it with map numbers, and links it to Ravenstein and distance decay.",
fr:"T1- Most migrants from Tavira moved ___. E2- For example, ___ went to ___, but only ___ went to ___. A3- This reflects ___ because ___.",
qc:["“The farther away a place is, the fewer people move there” describes…",["distance decay","chain migration","brain drain"],0,"Interaction drops as distance grows. Ravenstein saw it in migration."]},
{v:"Explain",

r:{m:"all",i:[["Shows what chain migration is: following family or people from home who already moved",/famil|relativ|cousin|already|follow|connect|network|\blink|\bties\b|before/i,"Explain the idea: chain migration means following family or friends who already moved there."],["Uses the passage: cousin Elena already lived there and found her a job",/cousin|elena|six years|job|work|packing|plant/i,"Use the passage: her cousin Elena already lived in Montaro and found her a job."],["Explains how the link helped cause the move",/because|so |help|easier|less risk|safer|support|reason|instead|chose|choos|decid|knew|waiting|place to stay|comfort|more people|others|grow|next/i,"Explain WHY it mattered: a relative and a job waiting made the move easier and less risky."]]},
mo:"T1- Marisol's move is chain migration because she followed a family member who had already settled in Montaro. E2- Her cousin Elena had lived there for six years and found Marisol a job at the fruit-packing plant where she works. A3- Because a relative and a job were waiting, the move was less risky and Montaro was the obvious choice, and now Marisol can help the next relative follow, so the chain keeps growing.",
b:["u2t_chain"],
th:"Chain migration? Like… people chained together?",
co:"Ha, no chains! Think of links: one migrant moves, then helps a relative follow, who helps another. Who was already in Montaro when Marisol arrived?",
kq:"Who was already waiting for Marisol in Montaro, and how did they help? Explain how that makes her part of a “chain.”",
ml:["Chain migration",["Chain migration happens when people move somewhere because relatives or people from their hometown already live there.","Earlier migrants share information, help pay for the trip, and help newcomers find jobs and housing.","That makes the move cheaper and less risky, so new migrants pick the same destination.","Over time, this can build ethnic enclaves in the destination."],[["Chain migration","Migration that follows family or friends who moved earlier."],["Ethnic enclave","A neighborhood where many people share the same ethnic background."]]],
wk:["Marisol moved to Montaro to get a job.","True, but it doesn't show the CHAIN: no mention that her cousin was already there or found her that job."],

qc:["Which is the best example of chain migration?",["A man moves to a city where his brother already works","A family flees a flood to a nearby town","A student moves across the country for college"],0,"Chain migration follows family or friends who already moved there."]},

mo:"T1- One intervening obstacle is the Brava River, a physical barrier between Tavira and Montaro. E2- Marisol says her group crossed it at night, and people drown there every year. A3- Because the crossing is so dangerous, the river discourages some Tavirans from leaving at all and makes the trip deadly for others, so it slows and reduces migration even though Montaro is right next door.",

th:"Intervening… what? I don't even know that word.",

kq:"What got in Marisol's way between Tavira and Montaro? Pick ONE thing and explain how it affects people trying to move.",
ml:["Intervening obstacles",["An intervening obstacle is a barrier between a migrant's home and destination that makes the move harder.","They can be physical (rivers, deserts, oceans), political (walls, visas, laws), or economic (the trip's cost).","Obstacles can stop some migrants, push others onto riskier routes, and even cost lives.","The opposite is an intervening opportunity: a job or safe place found along the way that makes a migrant stop early."],[["Intervening obstacle","A barrier between origin and destination that makes migration harder."],["Intervening opportunity","A chance found along the way that convinces a migrant to stop there instead."]]],
wk:["The border is between Tavira and Montaro.","It points to a location but explains nothing. Name the obstacle (the river or the wall) and explain how it makes migration harder."],
mw:"It names an obstacle from the passage (the Brava River), uses her details (night crossing, drownings), and explains how it slows and reduces migration.",
fr:"T1- One intervening obstacle is ___. E2- In Stimulus 2, Marisol says ___. A3- This affects migration because ___, so ___.",
qc:["A desert that migrants must cross to reach a new country is…",["an intervening obstacle","an intervening opportunity","a pull factor"],0,"It sits between home and the destination and makes the trip harder."]},

function stimBox(){return S.f.stim?`<div class="stim"><h3>${esc(S.f.st)}</h3>${S.f.stim}</div>`:''}
function stimV(){const all=S.nt.every(x=>x.o),nx=S.nt.findIndex(x=>!x.o),ns=!S.f.stim;
return `<div class="panel"><span class="tag px">Step 1 · ${ns?'Warm up':'Look first'}</span><p>${esc(S.f.intro)} <b>No questions yet.</b> ${ns?'This FRQ has no map or table, so everything comes from what you know. Wake up your memory with 3 quick questions first.':S.f.two?'This FRQ has TWO stimuli. Strong writers study both and look for how they connect. Answer 3 quick “notice” questions below.':'Strong writers look closely first. Answer 3 quick “notice” questions below.'}</p></div>${stimBox()}
<div class="row" style="margin-top:8px">${chips(S.f.bg)}</div>
<div class="panel"><span class="tag px">${ns?'What do you already know?':'What do you notice?'} · ${Math.min(nx<0?3:nx+1,3)}/3</span>${S.f.nt.map((n,j)=>nx>=0&&j>nx?'':`<div class="notice"><div class="q">${j+1}. ${esc(n[0])}</div><textarea data-in="nt" data-j="${j}" placeholder="Jot your idea (optional)…" aria-label="Your idea">${esc(S.nt[j].a)}</textarea>${S.nt[j].o?`<div class="take">${esc(n[1])}</div>`:`<div class="row" style="margin-top:8px"><button class="btn o" data-a="nt" data-j="${j}">Compare with tutor</button></div>`}</div>`).join('')}
<div class="row"><button class="btn g" data-a="go" data-k="1">Reveal Part A ▸</button>${all?'':'<span class="note">Tip: compare all three notes first. Good writers always look before they write!</span>'}</div></div>`}
const CARDS=[["❓","Ask"],["🔤","Verb"],["📘","Learn"],["🧠","Think"],["✏️","Write"],["✅","Check"]];
const CAL=[["You weren't sure, but you got it! Trust your thinking more.","Smart move noticing you weren't sure. The Fix-it tips show exactly what to add."],["Nice! You know more than you think.","Close! Compare your answer to the model line by line."],["Confident AND correct. That's mastery!","You felt sure, but the rubric wants more. Always check your answer against the rubric before moving on."]];
const YES=["★ Point earned! Your hard thinking paid off.","★ Point earned! That's exactly what AP readers look for.","★ Point earned! You used evidence like a geographer."];
function mcqV(q,pick,rot,act,extra){const o=q[1].map((t,k)=>[t,k]);for(let r=0;r<rot;r++)o.push(o.shift());
return `<div class="mcq"><p class="mq">${esc(q[0])}</p>${o.map(([t,k])=>`<button class="opt ${pick==null?'':k==0?'good':k==pick?'bad':''}" data-a="${act}" data-o="${k}" ${extra} ${pick===0?'disabled':''}>${esc(t)}</button>`).join('')}
${pick==null?'':pick==0?`<p class="fb y" role="status">✔ Right! ${esc(q[3])}</p>`:`<p class="fb n" role="status">Not quite, and that's OK. ${esc(q[3])}</p>`}</div>`}
function partV(i){const P=S.f.p[i],st=S.p[i],V=VERBS[P.v],tea=!/^(Identify|Define)$/.test(P.v),n=S.f.p.length,c=st.c;
let h=`${S.f.stim?`<details class="peek"><summary>View stimulus${S.f.two?'i':''}</summary><div>${stimBox()}</div></details>`:''}
<div class="sub" role="tablist" aria-label="Steps for Part ${L(i)}">${CARDS.map(([ic,t],k)=>`<button class="sb ${k==c?'on':k<c||(k==5&&st.ck)?'dn':''}" data-a="card" data-i="${i}" data-c="${k}" ${k==5&&!st.ck?'disabled':''} ${k==c?'aria-current="step"':''}><span aria-hidden="true">${ic}</span>${t}</button>`).join('')}</div>`;
const nav=(nx,lab)=>`<div class="row">${c>0?`<button class="btn o" data-a="card" data-i="${i}" data-c="${c-1}">◀ Back</button>`:''}<button class="btn c" data-a="card" data-i="${i}" data-c="${nx}">${lab} ▸</button></div>`;
const qline=`<div class="qmini"><span class="px">Part ${L(i)} · ${P.v}</span><h2 tabindex="-1">${esc(P.q)}</h2></div>`;
if(c==0)h+=`<div class="qbox"><span class="px">Part ${L(i)} · ${P.v}</span><h2 tabindex="-1" style="font-size:19px;line-height:1.45">${esc(P.q)}</h2><div class="plain"><b>In plain words:</b> ${esc(P.kq)}</div></div>
<div class="coach"><div class="av" aria-hidden="true">🧭</div><div><p class="kid">“${esc(P.th)}”</p><p><b>Tutor:</b> ${esc(P.co)}</p></div></div>${nav(1,'Got it! What does “'+P.v+'” mean?')}<button class="link" data-a="card" data-i="${i}" data-c="4">Feeling confident? Try it cold first ▸</button>`;
if(c==1)h+=qline+`<div class="panel"><span class="tag px">Decode the verb</span><div class="verb"><span class="vb">${P.v}</span><div><b>${V.d}</b><ul>${V.l.map(x=>`<li>${x}</li>`).join('')}</ul></div></div><div style="margin-top:8px">${chips(tea?['frq','tea']:['frq'])}</div></div>${nav(2,'Learn what I need')}`;
if(c==2)h+=qline+`<div class="panel"><span class="tag px">Learn what you need</span><h3 class="lt">${esc(P.ml[0])}</h3><ul class="les">${P.ml[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
<div class="voc"><span class="px">Key words</span>${P.ml[2].map(v=>`<p><b>${esc(v[0])}:</b> ${esc(v[1])}</p>`).join('')}</div></div>
<div class="panel"><span class="tag px">Quick check</span><p class="note">Pulling an idea out of your memory makes it stick. Give it a try!</p>${mcqV(P.qc,st.q,(i+S.fi)%3,'mcq',`data-i="${i}"`)}</div>
<p class="note">Want the bigger story?</p>${chips(P.b)}${nav(3,'Think it through')}<button class="link" data-a="card" data-i="${i}" data-c="4">Already know this? Skip to writing</button>`;
if(c==3){h+=qline+`<div class="panel"><span class="tag px">Think it through${tea?' with TEA':''}</span>`;
P.s.slice(0,st.st).forEach((s,j)=>{const t=tea?TEA[j]:[j+1,'Step '+(j+1),'','#22e5ff'],shown=s[1].filter((_,m)=>st.h[j+'-'+m]).length;
h+=`<div class="step" style="color:${t[3]}"><div class="badge">${t[0]}</div><div style="color:var(--ink);flex:1"><div class="lb" style="color:${t[3]}">${t[1]}</div><p class="pr">${esc(s[0])}</p>${s[1].slice(0,shown).map(x=>`<div class="hint">${esc(x)}</div>`).join('')}${shown<s[1].length?`<button class="hb" data-a="hint" data-j="${j}" data-m="${shown}">Hint ${shown+1}/${s[1].length}</button>`:''}</div></div>`});
h+=`</div><div class="row"><button class="btn o" data-a="card" data-i="${i}" data-c="2">◀ Back</button>${st.st<P.s.length?`<button class="btn c" data-a="step" data-i="${i}">Next step ▸</button>`:`<button class="btn c" data-a="card" data-i="${i}" data-c="4">Start writing ▸</button>`}</div>${st.st<P.s.length?`<button class="link" data-a="card" data-i="${i}" data-c="4">I'm ready, skip to writing</button>`:''}`}
if(c==4)h+=qline+`<div class="panel"><span class="tag px">Write it</span>${tea?`<div class="teamini">Label it: <b class="tT">T1-</b> your reason · <b class="tE">E2-</b> specific proof · <b class="tA">A3-</b> why it matters</div>`:`<div class="teamini">Identify = a short, specific answer. One phrase is enough.</div>`}
<details class="peek weak"><summary>Don't fall for this weak answer</summary><div><p class="wa">“${esc(P.wk[0])}”</p><p><b>❌ Why it misses:</b> ${esc(P.wk[1])}</p></div></details>
<textarea id="ans" data-in="ans" data-i="${i}" placeholder="${tea?'Write 2–3 sentences…':'Write a short phrase…'}" aria-label="Your answer">${esc(st.a)}</textarea>
<div class="chips"><button class="chip fr" data-a="frame" data-i="${i}">🧩 Stuck? Use a sentence frame</button>${tea?["For example, ","This is because ","which leads to ","As a result, "].map(c=>`<button class="chip" data-a="ins" data-t="${c}">+ ${c.trim()}</button>`).join(''):''}</div>
${st.w?'<p class="fix" role="alert">⚠ You still have blanks (___) to fill in. Replace each one with your own words first!</p>':''}
<div class="conf"><span>How sure are you?</span>${['😬 Not sure','🙂 Kind of','😎 Very'].map((t,k)=>`<button class="cb ${st.cf===k?'on':''}" data-a="cf" data-i="${i}" data-k="${k}" aria-pressed="${st.cf===k}">${t}</button>`).join('')}</div>
<div class="row"><button class="btn o" data-a="card" data-i="${i}" data-c="3">◀ Back</button><button class="btn" data-a="check" data-i="${i}">Check my answer ▸</button></div></div>`;
if(c==5&&st.ck){const ok=earned(i);h+=qline+`<div class="panel"><span class="tag px">Check it</span><p class="note" style="margin:0 0 6px">Your answer:</p><div class="mine">${esc(st.a)}</div>
<p style="margin-top:12px"><b>What earns the point${P.r.m=="any"?' (any ONE of these)':' (you need ALL of these)'}:</b> Tick each one your answer really does.</p>
<ul class="ck">${P.r.i.map((r,j)=>`<li><label><input type="checkbox" data-a="box" data-i="${i}" data-j="${j}" ${st.box[j]?'checked':''}><span>${esc(r[0])}${st.g[j]?'<small>Tutor spotted this; double-check it.</small>':''}${!st.box[j]&&!(P.r.m=="any"&&st.box.some(Boolean))?`<em class="fix">Fix it: ${esc(r[2])}</em>`:''}</span></label></li>`).join('')}</ul>
<p class="note">The tutor guesses from keywords. <b>You</b> make the final call, so be honest!</p>
<div class="model"><span class="px">Model answer</span>${esc(P.mo)}<p class="why"><b>✅ Why it works:</b> ${esc(P.mw)}</p></div>
<div role="status" class="verdict ${ok?'y':'n'}">${ok?YES[i%3]:'Not yet, and “not yet” is how everyone learns. Use the Fix-it tips, then revise.'}${ok&&S.cb>0?`<span class="combo">🔥 ${S.cb+1} in a row!</span>`:''}</div>${st.cf==null?'':`<p class="cal">${CAL[st.cf][ok?0:1]}</p>`}
<div class="row">${ok?'':`<button class="btn o" data-a="rev" data-i="${i}">✎ Revise</button>`}<button class="btn g" data-a="next" data-i="${i}">${i+1<n?`On to Part ${L(i+1)} ▸`:'See results ▸'}</button></div></div>`}
return h}
function bossV(){const B=S.bo;if(!B)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p>3 lightning questions on what you just learned. Quick recall now helps you remember it next week.</p><div class="row"><button class="btn m" data-a="boss">Start Boss Round ▸</button></div></div>`;
if(B.k>=B.l.length)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p class="big" style="font-size:20px">${B.r==B.l.length?'Boss defeated!':'Boss battle over!'}</p><p style="text-align:center">You got <b>${B.r}/${B.l.length}</b> on the first try.${B.r<B.l.length?' Come back tomorrow and replay. Spacing out practice is how memories stick.':''}</p></div>`;
const i=B.l[B.k],q=S.f.p[i].qc;return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round · ${B.k+1}/${B.l.length}</span>${mcqV(q,B.s,(i+B.k+1)%3,'bq','')}${B.s===0||B.s>0?`<div class="row"><button class="btn m" data-a="bn">${B.k+1<B.l.length?'Next ▸':'Finish ▸'}</button></div>`:''}</div>`}
function exportTxt(){const n=S.f.p.length;return `${S.f.t} (${S.f.u}) · GeoArcade FRQ Tutor\nScore: ${score()}/${n}\n\n`+S.f.p.map((p,i)=>{const st=S.p[i];return `Part ${L(i)} (${p.v}): ${p.q}\nMy answer: ${st.a.trim()||'(blank)'}\nResult: ${st.done?(st.ok?'point earned':'not yet'):'not attempted'}\n`}).join('\n')}
function doneV(){const n=S.f.p.length,sc=score(),ps=S.f.p.map((p,i)=>[p,i,S.p[i]]),ok=ps.filter(x=>x[2].ok),no=ps.filter(x=>x[2].done&&!x[2].ok),un=ps.filter(x=>!x[2].done);
const rank=sc==n?"GEO LEGEND":sc>=5?"MAP MASTER":sc>=3?"RISING SCOUT":"KEEP PLAYING";
return `<div class="panel" style="text-align:center"><h2 class="big" tabindex="-1">${un.length?'Progress report':'Stage clear!'}</h2><div class="stars" aria-label="${sc} of ${n}">${'★'.repeat(sc)}<span style="opacity:.25">${'★'.repeat(n-sc)}</span></div><div class="rank">${sc}/${n} points · Rank: ${rank}</div></div>
<div class="panel"><span class="tag px" style="color:var(--gr)">Nailed it</span>${ok.length?`<ul class="res">${ok.map(([p,i])=>`<li><b style="color:var(--gr)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span></li>`).join('')}</ul>`:'<p class="note">No points yet. Every replay makes it easier!</p>'}</div>
<div class="panel"><span class="tag px" style="color:var(--rd)">Review these</span>${no.length?`<ul class="res">${no.map(([p,i])=>`<li><b style="color:var(--rd)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br>${chips(p.b)}<button class="link" data-a="go" data-k="${i+1}">Revisit Part ${L(i)}</button></li>`).join('')}</ul>`:'<p>Nothing to review so far. 🏆</p>'}</div>
${un.length?`<div class="panel"><span class="tag px" style="color:var(--yl)">Not tried yet</span><ul class="res">${un.map(([p,i])=>`<li><b style="color:var(--yl)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br><button class="link" data-a="go" data-k="${i+1}">Go to Part ${L(i)}</button></li>`).join('')}</ul></div>`:''}
<div class="panel"><span class="tag px">Turn it in</span><p>Nothing saves on this page. Copy your answers to paste into Canvas or a doc.</p><div class="row"><button class="btn c" data-a="copy">📋 Copy my answers</button><span class="note" id="cpmsg" role="status" aria-live="polite"></span></div><details class="peek" id="cpd"><summary>See the text</summary><div><textarea readonly id="cpt" aria-label="Your answers" style="min-height:200px">${esc(exportTxt())}</textarea></div></details></div>
${no.length?`<div class="row"><button class="btn c" data-a="retry">↻ Retry what I missed ▸</button></div>`:''}${bossV()}<div class="row"><button class="btn" data-a="start" data-i="${S.fi}">↻ Replay</button>${FRQ.length>1?`<button class="btn m" data-a="start" data-i="${(S.fi+1)%FRQ.length}">Try “${esc(FRQ[(S.fi+1)%FRQ.length].t)}” ▸</button>`:''}<button class="btn o" data-a="home">Menu</button></div>`}
let opener;function openBG(k){opener=document.activeElement;app.setAttribute('aria-hidden','true');document.getElementById('shT').textContent=BG[k].t;document.getElementById('shB').innerHTML=BG[k].s.map(x=>`<li>${esc(x)}</li>`).join('');sh.classList.add('on');sh.querySelector('[data-a=x]').focus()}
function closeBG(){if(!sh.classList.contains('on'))return;sh.classList.remove('on');app.removeAttribute('aria-hidden');opener&&opener.focus()}
document.addEventListener('click',e=>{if(e.target==sh)return closeBG();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);
case 'home':S.k=-1;return render(1);
case 'go':return go(+b.dataset.k);
case 'bg':return openBG(b.dataset.k);
case 'x':return closeBG();
case 'nt':S.nt[j].o=1;return render();
case 'hint':{const k=S.k-1;S.p[k].h[j+'-'+b.dataset.m]=1;return render()}
case 'step':S.p[i].st++;return render();
case 'card':S.p[i].c=+b.dataset.c;return render(1);
case 'mcq':S.p[i].q=+b.dataset.o;return render();
case 'boss':{const f=S.p.map((x,k)=>k),miss=f.filter(k=>!S.p[k].ok),rest=f.filter(k=>S.p[k].ok);S.bo={l:miss.concat(rest).slice(0,3),k:0,s:null,r:0};return render()}
case 'bq':{const B=S.bo;if(B.s==null&&+b.dataset.o==0)B.r++;if(B.s!==0)B.s=+b.dataset.o;return render()}
case 'bn':S.bo.k++;S.bo.s=null;return render();
case 'frame':{const t=document.getElementById('ans'),f=S.f.p[i].fr;t.value=t.value.trim()?t.value.trim()+'\n'+f:f;S.p[i].a=t.value;t.focus();const c=t.value.indexOf('___',t.value.length-f.length);if(c>=0)t.setSelectionRange(c,c+3);return}
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.includes('___')){st.w=1;render();return document.getElementById('ans').focus()}st.w=0;if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.c=5;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render(1)}
case 'rev':S.p[i].ck=0;S.p[i].done=0;S.p[i].c=4;render(1);return document.getElementById('ans').focus();
case 'next':{const w=S.p[i].done;S.p[i].done=1;S.p[i].ok=earned(i);if(!w)S.cb=S.p[i].ok?S.cb+1:0;return go(i+2)}
case 'cf':S.p[i].cf=+b.dataset.k;return render();
case 'copy':{const m=document.getElementById('cpmsg'),t=exportTxt();const fail=()=>{document.getElementById('cpd').open=true;const ta=document.getElementById('cpt');ta.focus();ta.select();m.textContent='Select the text below and copy it.'};try{navigator.clipboard.writeText(t).then(()=>{m.textContent='✔ Copied! Now paste it into Canvas.'},fail)}catch(e){fail()}return}
case 'retry':{const m=S.p.findIndex(x=>x.done&&!x.ok);S.p[m].c=4;S.p[m].ck=0;S.p[m].done=0;return go(m+1)}
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeBG();else if(e.key=='Tab'&&sh.classList.contains('on')){e.preventDefault();sh.querySelector('[data-a=x]').focus()}});
render(1);
</script>
</body>
</html>
