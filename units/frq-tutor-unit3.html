<script>
const BG={
frq:{t:"How AP FRQs are scored",s:["Each part (A, B, C…) is worth 1 point and is scored on its own. A mistake in Part B can't cost you Part C.","Readers look for the right idea, clearly linked to the question. Fancy writing earns nothing extra.","No thesis, intro, or conclusion needed. Label each part and answer it directly.","Write in complete sentences and do what the task verb asks (Identify, Describe, or Explain).","Never leave a part blank. A wrong answer costs nothing."]},
tea:{t:"The TEA method",s:["T1- Topic: your reason in general words. Turn the question into your claim.","E2- Evidence: the specific proof, like a place, number, or example, ideally from the map or table.","A3- Analysis: why it matters. Explain HOW or WHY your proof backs up your reason, using “because…” or “which leads to…”.","Label each piece T1-, E2-, A3- so the reader can find every point. Describe answers need T1 and E2 plus a short A3. Explain answers need a strong A3."]},
readmap:{t:"How to read a map",s:["Read the title first. It tells you the topic, place, and time.","Check the legend so you know what each color and symbol means.","Look for patterns: what's clustered, what's connected, what points where?","Then ask WHY: who made this, and what story is it telling?"]},
readtable:{t:"How to read a data table",s:["Read the title and every column header, including units (%, per 1,000).","Find the highest and lowest value in each column.","Compare columns: when one goes up, does another go up or down?","When there are two years, look for change over time."]},
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]}
};
const VERBS={
Identify:{d:"Name it. A word or short phrase is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","One sentence max."]},
Describe:{d:"Paint the picture. Give the specific characteristics or pattern, with details someone could check.",l:["Use evidence: a place, a number, or a feature from the stimulus.","Say what it IS or what it LOOKS LIKE. You don't need a deep “why.”","About 1–2 sentences. Use TEA: Topic + Evidence, then a quick Analysis."]},
Explain:{d:"Tell HOW or WHY. Connect a cause to an effect so a reader sees the reasoning, not just a fact.",l:["Use linking words: “because…”, “which leads to…”, “as a result…”.","A fact alone won't score. You need the chain of reasoning.","About 2–3 sentences. Use full TEA."]}
};
const FRQ=[];
function addBG(o){Object.assign(BG,o)}
function addFRQ(f){FRQ.push(f)}
const UNIT="Unit 3 · Cultural Patterns and Processes";
addBG({
linguafranca:{t:"Lingua franca",s:["A lingua franca is a shared language people use when they don't speak the same first language.","The name comes from an old trade language used around the Mediterranean Sea.","Swahili in East Africa and Arabic across the Middle East have both served as lingua francas.","Today English is the most widely used global lingua franca: in business, science, air travel, and the internet."]},
diffusion:{t:"Types of diffusion",s:["Relocation diffusion: people move and bring their language or culture with them.","Expansion diffusion: an idea spreads outward while staying strong where it started.","Its 3 kinds: hierarchical (from powerful people or big cities first), contagious (person to person, like a virus), and stimulus (the idea spreads but gets changed to fit local culture).","English spread by relocation (British colonists) and hierarchical diffusion (elites, schools, and businesses first)."]},
outsource:{t:"Outsourcing & offshoring",s:["Outsourcing means hiring another company to do part of your work. Offshoring means moving work to another country.","Companies offshore to cut labor costs, since wages are lower in many developing countries.","India and the Philippines became call-center hubs because they have many English-speaking workers.","This is part of the new international division of labor: different steps of a business happen in different countries."]},
langfam:{t:"Language families",s:["A language family is a group of languages that grew from one ancient ancestor language.","Indo-European is the biggest family by number of speakers. Its Germanic branch includes English, Dutch, German, and Swedish.","Mandarin belongs to the Sino-Tibetan family and uses tones and characters.","Languages in the same branch share words and grammar, so each is easier for the others' speakers to learn."]},
develop:{t:"Measuring development",s:["GDP per capita is the value of everything a country produces, divided by its population.","HDI (Human Development Index) combines income, education, and life expectancy.","Cultural data, like which language people speak, doesn't directly measure development.","Always ask: does this data actually measure what the question is asking about?"]},
homog:{t:"Cultural homogenization",s:["Globalization spreads the same brands, music, movies, and languages around the world.","When global culture replaces local culture, places can start to look and feel alike.","Ethnologue estimates that about 40% of the world's 7,000+ languages are endangered.","Many communities fight back with revival programs, like teaching Welsh, Māori, or Hawaiian in schools."]}
});
addFRQ({k:"Class FRQ · Data table",
t:"English Goes Global",
d:"Lingua francas, diffusion, and globalization. The Unit 3 FRQ from class.",
u:"Unit 3",
fmt:"One stimulus (like Question 2)",
cls:1,
st:"Number of English Speakers in Selected Countries, 2018 (population above age five)",
intro:"The English language is spoken in many countries, but at very different rates. India and China each have more than 1.3 billion people. India has more English speakers than China, but the number of English speakers is growing in both countries.",
stim:"<div class=\"tbl\"><table><thead><tr><th>Country</th><th>Number of English speakers</th><th>Percent of population who speak English</th></tr></thead><tbody>\n<tr><td>China</td><td>10 million</td><td>less than 1%</td></tr><tr><td>India</td><td>125 million</td><td>12%</td></tr><tr><td>Netherlands</td><td>15 million</td><td>90%</td></tr><tr><td>Nigeria</td><td>79 million</td><td>53%</td></tr>\n<tr><td>Philippines</td><td>92 million</td><td>95%</td></tr><tr><td>Sweden</td><td>8 million</td><td>86%</td></tr><tr><td>United Kingdom</td><td>60 million</td><td>98%</td></tr><tr><td>United States</td><td>296 million</td><td>96%</td></tr></tbody></table></div><p class=\"src\">Source: Ethnologue. Remember the class directions: label each part, and write Describe and Explain parts as T1- (your reason in general words), E2- (the specific proof), A3- (why it matters).</p>",
bg:["linguafranca","diffusion","readtable"],
nt:[["Compare India and China. Similar populations, but how different are their English-speaker numbers?","India has 125 million English speakers (12%). China has 10 million (under 1%). Same-size countries, totally different numbers. History is a big clue."],["Which countries have the highest PERCENT of English speakers? What do they have in common?","The UK (98%) and US (96%) are native-English countries. But the Philippines (95%), Netherlands (90%), and Sweden (86%) aren't! The Philippines was a U.S. colony; the Netherlands and Sweden are small, trade-focused countries."],["Number vs. percent: which country has a LOT of speakers but a LOW percent?","India: 125 million speakers is huge, but it's only 12% because India's population is so big. Always check whether a question is about numbers or percents."]],
m:20,
p:[
{v:"Describe",
q:"Describe ONE historical reason for India's current number of English speakers.",
sk:"Colonial history and language",
s:[["Name the historical reason in general words. Who ruled India for almost 200 years?",["Think back to British imperialism.","Britain colonized India: first the East India Company, then the British Raj (1858–1947)."]],["Give specific proof of HOW English spread in India.",["Where would Indians have needed English under British rule?","English was the language of the colonial government, courts, universities, and business."]],["Why does that history still matter today?",["After independence in 1947, India kept English as an official language.","With hundreds of languages, English became a neutral link between regions."]]],
r:{m:"all",i:[["Names a historical reason: British colonial rule of India",/brit|colon|empire|imperial|raj|east india/i,"Name the history: India was a British colony (the British Raj)."],["Describes how English spread or stayed: used in government, schools, or business, and kept after independence",/govern|admin|school|educat|universit|court|business|official|elite|independen|kept|still/i,"Show HOW: English was used in government and schools, and India kept it after 1947."]]},
mo:"T1- India has many English speakers today because it was a British colony. E2- Under the British Raj (1858–1947), English was the language of government, courts, and universities, so educated Indians had to learn it. A3- After independence, India kept English as an official language, partly as a neutral link between its many regional languages, so it is still widely spoken.",
b:["raj","linguafranca"],
th:"Is this a history question or a language question?",
co:"Both! Language maps are history maps. Ask yourself: who was in charge of India before 1947, and what language did they speak?",
kq:"Why do so many people in India speak English? Give ONE reason from the past and describe it.",
ml:["Colonialism spreads languages",["Colonizers usually made their language the language of power: government, courts, schools, and business.","Britain ruled India for nearly 200 years, first through the East India Company, then the British Raj (1858–1947).","Educated Indians learned English to get government jobs and attend universities.","After independence, India kept English as an official language. With hundreds of languages, English works as a neutral “link” language."],[["Colonialism","One country taking political control of another place."],["Official language","The language a government uses for laws, courts, and schools."]]],
wk:["India speaks English because it is a big country.","Size doesn't explain language. China is just as big and has under 1% English speakers. You need the history."],
mw:"It names the history (British colonial rule), gives specific proof (government, courts, universities), and explains why English lasted after 1947.",
fr:"T1- One historical reason India has many English speakers is ___. E2- For example, under British rule English was used for ___. A3- This still matters today because ___.",
qc:["Which country colonized India and spread English there?",["Great Britain","Portugal","The United States"],0,"Britain ruled India until 1947, and English stayed."]},
{v:"Explain",
q:"Explain ONE contemporary reason why people in China and India are learning English.",
sk:"Globalization and the spread of English",
s:[["Name a reason in general words. “Contemporary” means TODAY, not history.",["Think about jobs, school, the internet, or travel.","English is the global lingua franca of business and technology."]],["Give a specific example of English opening a door.",["Jobs with multinational companies, IT and call-center jobs in India, studying at universities in the US or UK.","In China, English is taught in schools and tested on entrance exams."]],["Explain HOW learning English helps that person.",["Use “because… which leads to…”.","English skills → better-paying jobs or university spots → higher income."]]],
r:{m:"all",i:[["Names a present-day reason: globalization, business, jobs, studying abroad, the internet, or tourism",/global|business|trade|job|work|career|compan|corporat|universit|stud|internet|tech|touris|travel|econom|exam|school/i,"Name a TODAY reason: jobs in global business, studying abroad, the internet, or travel."],["Explains how English helps (more opportunities, higher pay, communicating with the world)",/opportunit|pay|wage|income|money|earn|salar|rich|communicat|talk|speak (with|to)|understand|connect|compete|competit|hire|hired|get (a |better |good )?jobs?|better jobs?|promot|succe|deal|customer|access|leads? to|allow|help|lets? (them|people|you)/i,"Explain HOW English helps: for example, it leads to better-paying jobs with global companies."]]},
mo:"T1- People in China and India are learning English because it is the global lingua franca of business. E2- Multinational companies, tech firms, and call centers hire workers who can speak English with customers and partners around the world. A3- Because English skills open these better-paying jobs, learning English can raise a person's income and help the country compete in the global economy.",
b:["linguafranca","outsource"],
th:"“Contemporary”? What does that even mean?",
co:"Great question! Contemporary just means happening now. So skip the history and think: why would a teenager in Shanghai or Mumbai want English TODAY?",
kq:"Why are people in China and India learning English right now? Explain ONE reason and how English helps them.",
ml:["English and globalization",["Globalization links economies, so companies, scientists, and websites need a shared language.","English is the most widely used lingua franca for international business, science, air travel, and the internet.","In India, English skills open jobs in tech and in customer-service centers that serve the US and UK.","In China, English is a required school subject, and students who want to study abroad need it."],[["Lingua franca","A shared language used by people who speak different first languages."],["Globalization","The growing connection of the world's economies and cultures."]]],
wk:["English is the best language.","That's an opinion, not a reason, and it doesn't explain what English does for people in China or India."],
mw:"It names a present-day reason (global business), gives an example (jobs with multinational companies), and explains the payoff (higher income).",
fr:"T1- People in China and India are learning English because ___. E2- For example, ___. A3- This helps them because ___, which leads to ___.",
qc:["A “lingua franca” is…",["a shared language used by people with different first languages","the oldest language in a region","a language spoken only in France"],0,"It's a common “bridge” language, and today English is the biggest one."]},
{v:"Describe",
q:"Describe ONE barrier to the diffusion of English throughout China.",
sk:"Barriers to diffusion",
s:[["Name a barrier in general words. What could slow English down as it spreads?",["Barriers can be political, cultural, economic, or physical.","Examples: government policy, a very different language, few teachers, distance."]],["Give specific proof about China.",["China's government promotes Mandarin and blocks many English websites (the “Great Firewall”).","Rural interior areas have fewer trained English teachers."]],["Describe how that barrier slows English.",["Fewer chances to hear, read, or practice English → fewer speakers.","Tie it back: that's part of why China has under 1% English speakers."]]],
r:{m:"all",i:[["Names a barrier: government policy, Mandarin emphasis, internet limits, language difference, few teachers, rural access, no British colonial history, or cultural pride",/govern|polic|mandarin|censor|firewall|internet|differen|nothing like|not (like|similar)|unrelated|tone|character|alphabet|teacher|rural|village|access|poor|colon|cultur|pride|proud|nationalis|isolat|distance/i,"Name a barrier: government limits, the Mandarin focus, the Great Firewall, a very different language, or few teachers in rural areas."],["Describes how it slows English from spreading in China",/because|so |less|fewer|limit|prevent|slow|block|harder|hard|difficult|can.t|cannot|keep/i,"Describe HOW it slows English: it means fewer chances to learn, hear, or use it."]]},
mo:"T1- One barrier to English spreading in China is government control over information. E2- China's “Great Firewall” blocks many English-language websites, and the government promotes Mandarin as the national language. A3- Because people in China have fewer chances to see and use English online or in daily life, English spreads slowly, which helps explain why fewer than 1% of people there speak it.",
b:["diffusion"],
th:"A “barrier”? Like a wall?",
co:"Kind of! A barrier to diffusion is anything that slows an idea or language as it spreads. It can be a law, a mountain, a cost, or a very different culture.",
kq:"What is ONE thing that makes it hard for English to spread across China? Describe it.",
ml:["Barriers to diffusion",["Diffusion is how ideas, languages, and products spread from place to place.","Barriers slow diffusion. They can be physical (oceans, mountains, deserts), political (laws, censorship), economic (cost of school), or cultural (pride in your own language).","China's government promotes Mandarin and blocks many English websites.","Mandarin uses characters and tones, so it's very different from English and harder to switch between.","Unlike India, China was never a British colony (except Hong Kong), so English never became a language of government."],[["Diffusion","The spread of something from one place to others."],["Barrier to diffusion","Anything that slows or stops that spread."]]],
wk:["English is hard.","Too vague. Hard for whom, and why? Name a specific barrier in China and describe how it slows English."],
mw:"It names a specific barrier (government control), gives proof (the Great Firewall, Mandarin policy), and describes the effect (fewer chances to use English).",
fr:"T1- One barrier to English spreading in China is ___. E2- For example, ___. A3- This slows English because ___.",
qc:["Which is a POLITICAL barrier to diffusion?",["A government blocking foreign websites","A high mountain range","A long distance between cities"],0,"Political barriers come from governments: laws, censorship, and language policies."]},
{v:"Explain",
q:"Using the table, explain ONE reason for the difference in the percentage of English speakers in the Netherlands compared with the percentage in China.",
sk:"Explaining a difference with data",
s:[["Find the numbers first, then name a reason in general words.",["Netherlands: 90%. China: less than 1%.","Possible reasons: similar language, trade, location, TV and media, schools."]],["Give specific proof about the Netherlands (or China).",["Dutch and English are both Germanic languages, so they share many words.","The Netherlands is small and trade-focused (Rotterdam is Europe's biggest port), close to the UK, and shows English TV with subtitles."]],["Explain WHY that creates such a big difference.",["More exposure + easier learning → more speakers.","China's huge Mandarin-speaking market means most people don't need English day to day."]]],
r:{m:"all",i:[["Uses the table: the Netherlands is 90% vs. China under 1%",/90|\b1 ?(%|per ?cent)|(less than|under|below) (1|one)\b|(almost|nearly) (every|all)|most (dutch|people)|almost no|hardly any|barely any|very few|(much|way|far|a lot) (higher|more|bigger|greater)|higher (percent|share|rate)/i,"Use the table: the Netherlands is 90%, China is less than 1%."],["Explains a reason: similar language, trade/globalization, closeness to the UK, media, schools, or China's huge Mandarin-speaking market",/german|similar|related|famil|trade|port|econom|global|close|near|proxim|europe|tv|television|media|film|subtit|school|educat|market|mandarin|small|large/i,"Explain WHY: Dutch is closely related to English, or the Netherlands depends on trade, or China's huge Mandarin market means less need for English."]]},
mo:"T1- The Netherlands has a much higher share of English speakers (90%) than China (less than 1%) partly because Dutch and English are closely related languages. E2- Both are Germanic languages in the Indo-European family, so they share many words and grammar patterns, while Mandarin uses tones and characters. A3- Because English is much easier for Dutch speakers to learn, and they hear it constantly through trade and English-language TV, a far larger percentage of Dutch people become fluent.",
b:["langfam","diffusion"],
th:"Why would a tiny country speak more English than a giant one?",
co:"That's exactly the puzzle! Size isn't the answer. Think about how close each language is to English, and how much English each country hears every day.",
kq:"The table says 90% of Dutch people speak English but less than 1% of Chinese people do. Use those numbers and explain ONE reason why.",
ml:["Why some places pick up English fast",["English and Dutch are both Germanic languages, so many words look and sound alike (water/water, house/huis).","Mandarin is a Sino-Tibetan language with tones and characters, so it's much further from English.","The Netherlands is small and depends on trade and tourism, so English is useful every day.","Dutch TV shows English-language shows with subtitles instead of dubbing, so kids hear English constantly."],[["Language family","A group of languages that came from one common ancestor."],["Germanic branch","Part of the Indo-European family: English, Dutch, German, Swedish."]]],
wk:["The Netherlands has more English speakers than China.","That just restates the table. It gives no reason at all. The question asks you to explain WHY the percentages are so different."],
mw:"It quotes the table, names a reason (language similarity), and explains how it leads to more English speakers.",
fr:"T1- The Netherlands has ___% English speakers but China has ___ because ___. E2- For example, ___. A3- This creates the difference because ___.",
qc:["English and Dutch are both part of which language branch?",["Germanic","Romance","Sino-Tibetan"],0,"Germanic languages share roots, which makes English easier for Dutch speakers."]},
{v:"Explain",
q:"Explain ONE economic reason why a corporation based in an English-speaking country would locate a call center in a country where English is not the dominant language.",
sk:"Outsourcing and the global economy",
s:[["Name the economic reason in general words. What does a company want to save?",["Companies try to lower their costs.","Wages are much lower in countries like India than in the US or UK."]],["Use the table as proof that the workers exist.",["India has 125 million English speakers.","That's a huge pool of English-speaking workers who earn lower wages."]],["Explain how this helps the company.",["Lower labor costs → lower expenses → higher profits.","Bonus: time-zone differences let call centers answer calls 24 hours a day."]]],
r:{m:"all",i:[["Names an economic reason: lower wages/labor costs, a large English-speaking workforce, time zones, or tax incentives",/wage|labor|labour|cheap|cost|pay|salar|workforce|worker|time ?zone|24|tax|incentive/i,"Name the money reason: workers there earn lower wages, so labor costs less."],["Explains how it benefits the corporation (saves money, raises profits, 24-hour service)",/profit|sav(e|es|ed|ing)|cut|reduc|benefit|money|lower (their |its |the |labor |labour )?(costs?|expenses|spending)|expens|earn more|make more|24|around the clock|all day|overnight|night|competit/i,"Explain the payoff: lower costs mean higher profits for the company."]]},
mo:"T1- A corporation might put a call center in a country like India because labor costs are much lower there. E2- India has about 125 million English speakers, so companies can hire many workers who speak English but earn far lower wages than workers in the United States. A3- Paying lower wages for the same service cuts the company's costs, which raises its profits.",
b:["outsource"],
th:"What's a call center? And why would a company go so far away?",
co:"A call center is the office that answers customer-service calls. Companies go far away for one big reason: money. Follow the money and you'll have your answer.",
kq:"Why would a US or UK company put its customer-service phone center in a country like India? Explain ONE money reason.",
ml:["Outsourcing and offshoring",["Outsourcing means a company hires another company to do part of its work. Offshoring means moving that work to another country.","Wages in India are much lower than in the US or UK.","The table shows India has 125 million English speakers: a huge pool of workers.","Time zones help too: when it's night in the US, it's daytime in India, so calls can be answered around the clock."],[["Offshoring","Moving business work to another country."],["Labor costs","How much a company pays its workers."]]],
wk:["Because people in other countries need jobs.","That's about the workers, not the corporation. The question asks for an economic reason that benefits the company."],
mw:"It names the economic reason (lower labor costs), uses the table (125 million English speakers in India), and explains the payoff (higher profits).",
fr:"T1- A corporation would put a call center in ___ because ___. E2- For example, ___. A3- This helps the company because ___, which leads to ___.",
qc:["The MAIN economic reason companies offshore call centers is…",["lower labor costs","better weather","shorter travel times"],0,"Lower wages mean lower costs and higher profits."]},
{v:"Explain",
q:"Explain ONE limitation of using the data in the table to understand a country's level of economic development.",
sk:"Data limits: language vs. development",
s:[["What does the table actually measure? Is that the same as wealth?",["It measures English speakers, not money, health, or education.","Development is measured with things like GDP per capita or HDI."]],["Find a country that breaks the pattern.",["The Philippines is 95% English-speaking, but it's less developed than China, which is under 1%.","Nigeria (53%) is also less developed than China."]],["Explain why that's a problem for drawing conclusions.",["A high % of English speakers doesn't mean a country is rich.","You'd need economic data, like GDP per capita, to judge development."]]],
r:{m:"all",i:[["States a limitation: language data doesn't measure income, GDP per capita, HDI, health, or education (or it's one year / national averages)",/gdp|income|wealth|rich|poor|money|hdi|health|literacy|educat|life expectancy|per capita|industr|jobs?\b|one year|2018|scale|average|(only|just) (shows?|measures?|tells?|is|about|counts?) (about )?(language|english|speak|how many|the (number|percent))|(n.t|not|never) (necessarily )?(mean|show|tell|measure|prove|equal|indicate|reflect|determine|the same as|related to|connected to|linked to)[^.]{0,40}(develop|rich|wealth|econom)/i,"Say what's missing: the table measures language, not income or development (like GDP per capita or HDI)."],["Explains why that's misleading, ideally with an example (the Philippines is 95% but less developed than China)",/philippines|nigeria|china|because|so |mislead|wrong|can.t|cannot|example|even though|but/i,"Explain with an example: the Philippines is 95% English-speaking but less developed than China."]]},
mo:"T1- One limitation is that the table measures how many people speak English, not how wealthy or developed a country is. E2- For example, the Philippines is 95% English-speaking, but it has a much lower GDP per capita than China, where less than 1% speak English. A3- Because English ability doesn't track development, using this table alone could lead someone to the wrong conclusion about which countries are more developed.",
b:["develop","scale"],
th:"Wait, don't rich countries speak English?",
co:"Some do, like the US and UK. But check the table: the Philippines and Nigeria have lots of English speakers too. Are they richer than China? That's your clue.",
kq:"Can you tell how rich a country is just by how many people speak English? Explain ONE reason this table isn't enough.",
ml:["Measuring development",["Geographers measure development with indicators like GDP per capita (income per person) and HDI (income, education, and life expectancy).","Speaking English is a cultural trait, not a measure of wealth.","The Philippines (95% English) and Nigeria (53%) both have lower incomes per person than China (under 1%).","The table also shows just one year (2018) and national averages, which hide differences inside each country."],[["GDP per capita","The value of a country's economy divided by its population."],["HDI","Human Development Index: combines income, education, and life expectancy."]]],
wk:["The table doesn't show every country.","That's about how many countries are listed, not about measuring development. Explain what kind of data is missing."],
mw:"It names what's missing (economic data), gives a clear example (the Philippines vs. China), and explains how it could mislead.",
fr:"T1- One limitation is that the table only shows ___, not ___. E2- For example, ___. A3- This is a problem because ___.",
qc:["Which of these is an indicator of economic development?",["GDP per capita","Percent who speak English","Number of languages spoken"],0,"GDP per capita measures income per person. Language data doesn't."]},
{v:"Explain",
q:"Explain ONE negative local impact of a global lingua franca on places where a different language is spoken.",
sk:"Globalization's impact on local cultures",
s:[["Name a negative impact in general words.",["Think about what happens to local languages and cultures.","Language loss, cultural loss, or inequality between English speakers and non-speakers."]],["Give a specific example of how it happens.",["Young people switch to English for school, jobs, and the internet and stop using their family's language.","People who don't speak English can be shut out of better-paying jobs."]],["Explain why that matters locally.",["When a language dies, the traditions, stories, and knowledge tied to it can be lost.","This can lead to cultural homogenization, where places start to feel the same."]]],
r:{m:"all",i:[["Names a negative impact: language loss or extinction, loss of local culture, cultural homogenization, or inequality for non-English speakers",/extinct|endanger|die|dying|disappear|lost|loss|lose|tradition|cultur|homogen|identity|inequal|unequal|unfair|disadvantag|left behind|fall behind|gap\b|discriminat|marginal|exclud|left out|shut out|divide/i,"Name the harm: local languages and traditions can fade or die out, or non-English speakers get left behind."],["Explains how the lingua franca causes it locally",/because|so |lead|young|youth|children|kids|switch|stop|instead|replac|job|school|internet|media/i,"Explain HOW: young people switch to English for school and jobs, so the local language stops being passed down."]]},
mo:"T1- One negative local impact of English as a global lingua franca is the loss of local languages. E2- When young people use English for school, jobs, and the internet, they may stop speaking their family's language, so fewer children learn it. A3- As a local language fades, the stories, traditions, and knowledge tied to it can be lost, weakening the place's cultural identity.",
b:["homog","linguafranca"],
th:"How can a language be “negative”? It just helps people talk.",
co:"True, it helps people connect globally. But zoom in to the local scale. What happens to Grandma's language when every kid in town switches to English?",
kq:"English helps the world communicate, but what's ONE way it can hurt a local place that speaks another language? Explain how.",
ml:["When a lingua franca spreads",["A global lingua franca helps people trade and communicate across borders.","But when English becomes the language of school, jobs, and the internet, local languages can lose status.","Young people may stop learning their heritage language, so languages can become endangered or extinct.","Losing a language can mean losing traditions and local knowledge. That's part of cultural homogenization."],[["Language extinction","When no one speaks a language anymore."],["Cultural homogenization","When cultures around the world become more alike."]]],
wk:["English is bad for other countries.","Too vague and too broad. Name a specific local impact and explain how the lingua franca causes it."],
mw:"It names a specific impact (language loss), explains how it happens (young people switch to English), and why it matters (traditions and identity).",
fr:"T1- One negative local impact of a global lingua franca is ___. E2- For example, when ___, ___. A3- This matters because ___.",
qc:["When cultures around the world become more alike, it's called…",["cultural homogenization","cultural relativism","ethnocentrism"],0,"Homogenization means becoming the same. A global lingua franca can speed it up."]}
]});
addBG({
sequent:{t:"Sequent occupance",s:["Sequent occupance is the idea that a place is shaped by every group that has ever lived there, one layer at a time.","Each group leaves its mark on the cultural landscape: buildings, signs, foods, places of worship, street names.","The next group doesn't erase everything. It reuses and adds to what's already there, like a Lutheran church becoming a Catholic parish.","Cultural landscape just means the visible, human-made look of a place."]},
enclave:{t:"Ethnic enclaves",s:["An ethnic enclave (or ethnic neighborhood) is an area where one ethnic group clusters together in a city.","Immigrants settle near people who share their language, religion, and food because it feels safer and makes daily life easier.","Enclaves fill with businesses that serve the group: bakeries, groceries, newspapers, and radio stations in the home language.","Many U.S. cities have had a “Little Italy,” a Chinatown, or a German district. Over time one group moves out and another moves in: ethnic succession."]},
accult:{t:"Acculturation, assimilation, syncretism",s:["Acculturation: a group adopts some traits of the surrounding culture but keeps its own identity (speaking English at work, Spanish at home).","Assimilation: a group blends in so fully that its original culture mostly disappears, often by the third generation.","Syncretism: two cultures mix and create something new. Día de los Muertos itself blends Indigenous Aztec traditions with Catholic All Souls' Day.","Commodification: a cultural practice is turned into something to sell, like a festival run for tourists. When a practice spreads but changes to fit the new group, that's also stimulus diffusion."]},
religionland:{t:"Religion in the landscape",s:["Religion is one of the easiest cultural traits to spot in a landscape: churches, mosques, temples, shrines, and cemeteries.","Universalizing religions like Christianity and Islam try to appeal to everyone, so they spread widely and build in many places.","Ethnic religions like Hinduism and Judaism are tied to one group or place and spread mostly by migration.","Even a single building can show history: a church may change denomination when the neighborhood changes. Festivals and shrines count too."]},
centri:{t:"Centripetal vs. centrifugal forces",s:["Centripetal forces pull a group together: a shared language, religion, media, or celebration.","Centrifugal forces push a group apart: tension between newcomers and old-timers, different languages, or feeling like outsiders in your own area.","An ethnic radio station or newspaper is a classic centripetal force for an immigrant community.","Rapid neighborhood change can be centrifugal when long-time residents feel their culture is being replaced. These terms return in Unit 4."]},
popfolk:{t:"Popular vs. local culture",s:["Local (folk) culture belongs to a specific place or group, is passed down in person, and changes slowly.","Popular culture spreads fast through media and big companies and looks similar everywhere: chain coffee shops, trending music, the same apps.","Globalization helps popular culture spread, which can crowd out local traditions, a process called cultural homogenization.","But the same technology can preserve local culture: communities record recipes, stream festivals, and post heritage-language videos online."]},
});
addFRQ({k:"Practice FRQ · Text stimulus",
t:"Maple Street District",
d:"Sequent occupance, ethnic neighborhoods, diffusion, religion, and centripetal/centrifugal forces in one changing neighborhood.",
u:"Unit 3",
fmt:"One stimulus (like Question 2)",
st:"A Century on Maple Street: One Neighborhood, Three Communities",
intro:"The passage below describes how a single neighborhood in a mid-sized U.S. city changed over one hundred years as different groups moved in and out. Read it closely before you answer.",
stim:"<div class=\"passage\" style=\"background:#0a0820;border:2px solid var(--ln);padding:12px;font-size:16px;line-height:1.6\"><p><strong>1920s.</strong> In the 1920s, Maple Street District was the German heart of Ridgeway, a mid-sized Midwestern city. Immigrants from Saxony and Hanover filled its brick row houses. They built St. Johannes Lutheran Church on the corner of Maple and Third, opened beer gardens along the avenue, and printed a weekly German-language newspaper, the <em>Ridgeway Zeitung</em>.</p><p><strong>1970s.</strong> By the 1970s, most German families had moved to the suburbs. Mexican and Central American families arrived, drawn by factory jobs. The old church building reopened as Our Lady of Guadalupe Catholic Parish. Taquerías and a panadería replaced the beer gardens, a Spanish-language radio station went on the air, and residents began an annual Día de los Muertos festival on Maple Street.</p><p><strong>2020s.</strong> In the 2020s, young professionals moved in. Coffee shops and a yoga studio opened, and rents rose sharply. The festival is now sponsored by the city and draws thousands of tourists, though several long-running restaurants have closed.</p></div><p class=\"src\">Maple Street District and the city of Ridgeway are fictional and were created for practice.</p>",
bg:["sequent","enclave"],
nt:[["What happened to the church building across the three periods?","It was built as a Lutheran church by Germans in the 1920s, then reopened as a Catholic parish in the 1970s. Same building, new religion. That's a layer of history you can see on the street."],["Make a quick list: which businesses or media appear in each period?","1920s: beer gardens, a German newspaper. 1970s: taquerías, a panadería, Spanish radio. 2020s: coffee shops, a yoga studio. Each group fills the neighborhood with places that serve ITS needs."],["In the 2020s, who is the festival for? Compare that with the 1970s.","In the 1970s, residents started it for themselves. In the 2020s, the city sponsors it and tourists come by the thousands. Same festival name, but the audience and purpose have shifted."]],
m:20,
p:[
{v:"Identify",
q:"Identify the type of diffusion that brought German culture to Maple Street District in the 1920s.",
sk:"Identifying relocation diffusion",
s:[["How did German culture physically get to Ridgeway? Did an idea travel, or did people travel?",["Reread the first paragraph: “Immigrants from Saxony and Hanover filled its brick row houses.”","People moved and carried their language, religion, and food with them."]],["Name the type of diffusion in one phrase.",["It's the kind where migrants bring culture to a new place.","It starts with “re-” and rhymes with “location.”"]]],
r:{m:"any",i:[["Relocation diffusion",/relocat/i,"Name the type: relocation diffusion."],["Spread through migration: people moved and brought their culture with them",/^(?![\s\S]*\b(expansion|contagious|hierarchical|stimulus)\b)[\s\S]*(migrat|immigr|moved|move |moving|brought|carried)/i,"Say that German immigrants MOVED to Ridgeway and brought their culture with them. That's relocation diffusion."]]},
mo:"Relocation diffusion: German immigrants moved to Ridgeway and brought their language, religion, and food with them.",
b:["enclave"],
th:"There are like five kinds of diffusion. How do I know which one this is?",
co:"Start with the biggest split: did PEOPLE move, or did an IDEA move while people stayed put? The passage literally says immigrants filled the row houses. That answers it.",
kq:"What kind of diffusion is it when German immigrants move to a new city and bring their culture along? Name it.",
ml:["Relocation vs. expansion diffusion",["Relocation diffusion happens when people migrate and carry their culture to a new place. The culture may fade where they left.","Expansion diffusion happens when an idea spreads outward and stays strong at its source. It has three types: contagious, hierarchical, and stimulus.","Immigrant neighborhoods are the classic example of relocation diffusion: a German church and newspaper appear in a U.S. city because Germans moved there.","Quick test: if the sentence has the word “immigrants” or “moved,” it's almost always relocation."],[["Relocation diffusion","Culture spreads because people move and bring it along."],["Expansion diffusion","An idea spreads outward while staying strong where it began."]]],
wk:["Contagious diffusion, because it spread from person to person.","Contagious diffusion is when an idea spreads between neighbors who stay put. Here the Germans themselves moved to Ridgeway, so the culture traveled WITH people. That's relocation diffusion."],
mw:"It names the exact type (relocation) and shows the evidence: immigrants moved and carried their culture with them.",
fr:"The type of diffusion is ___ diffusion, because German ___ moved to Ridgeway and brought ___ with them.",
qc:["Which situation is relocation diffusion?",["Irish immigrants open a Catholic church in Boston","A dance trend spreads from New York to small towns","A new slang word spreads between classmates"],0,"Relocation diffusion needs people to MOVE. The other two are expansion diffusion (hierarchical and contagious)."]},
{v:"Describe",
q:"Using the passage, describe ONE way the cultural landscape of Maple Street District changed between the 1920s and the 1970s.",
sk:"Describing sequent occupance",
s:[["Name the big-picture change in general words. Which group left, and which arrived?",["Germans moved to the suburbs; Mexican and Central American families moved in.","Geographers call it sequent occupance when one group's layer replaces or covers another's."]],["Pick ONE visible feature from the passage and say what it was before and after.",["The church: Lutheran in the 1920s, Catholic parish in the 1970s.","Or the food: beer gardens → taquerías and a panadería. Or the media: German newspaper → Spanish radio."]],["Say what that change reveals about the neighborhood.",["The buildings stayed, but the signs, foods, and religion changed to fit the new residents.","Each group left its own layer on the same streets."]]],
r:{m:"all",i:[["Names a specific landscape feature from the passage (church, beer gardens, taquerías, newspaper, radio, signs, foods)",/church|lutheran|catholic|parish|guadalupe|beer|taquer|panader|bakery|newspaper|zeitung|radio|sign|language|restaurant|food|shop|store|business/i,"Name a specific thing you could SEE on the street: the church, the beer gardens, the taquerías, or the newspaper."],["Describes the change: what it was before and what it became",/replac|became|become|turn(ed|s)? into|chang(ed|es|ing)? (in)?to|reopen|instead|switch|convert|transform|took over|from .* to|used to|no longer|anymore|now|later/i,"Describe the before-and-after: for example, the Lutheran church became a Catholic parish, or taquerías replaced the beer gardens."]]},
mo:"T1- The cultural landscape changed as the German community was replaced by a Mexican and Central American one, an example of sequent occupance. E2- The passage says St. Johannes Lutheran Church reopened as Our Lady of Guadalupe Catholic Parish, and taquerías and a panadería replaced the beer gardens along the avenue. A3- The buildings stayed on the same corners, but their names, foods, and religion changed to match the new residents, so each group left its own visible layer on Maple Street.",
b:["sequent","enclave"],
th:"“Cultural landscape”? I thought landscape meant mountains and rivers.",
co:"That's the physical landscape. The CULTURAL landscape is everything humans add: buildings, signs, churches, restaurants. So look for the human-made stuff in the passage that changed.",
kq:"Pick one thing on Maple Street that looked different in the 1970s than in the 1920s. Say what it was before and what it became, using the passage.",
ml:["Reading a changing cultural landscape",["The cultural landscape is the visible, human-made look of a place: buildings, signs, places of worship, businesses, and street life.","When a new group moves into an old neighborhood, it reuses the buildings but changes what's inside and on the signs.","Sequent occupance is the name for these stacked layers: Germans built the church, and Latinos reused it as a Catholic parish.","For a Describe question, name the feature, then give the before and the after. That's your evidence."],[["Cultural landscape","The human-made look of a place."],["Sequent occupance","Each group that lives in a place adds its own layer to the landscape."],["Ethnic succession","One ethnic group replacing another in a neighborhood over time."]]],
wk:["The neighborhood got more Mexican people.","That's a change in WHO lived there, not in the landscape. The question wants something you could see on the street, like the church becoming a Catholic parish or taquerías replacing beer gardens."],
mw:"It names the overall change (sequent occupance), uses specific before-and-after details from the passage (the church, the beer gardens), and explains what the layers show.",
fr:"T1- Between the 1920s and the 1970s the cultural landscape changed because ___. E2- For example, the passage says the ___ became ___. A3- This shows that ___.",
qc:["A Lutheran church that later becomes a Catholic parish is the best example of…",["sequent occupance","contagious diffusion","cultural homogenization"],0,"Sequent occupance means each group leaves its own layer on the same place, often reusing older buildings."]},
{v:"Explain",
q:"Explain how the Día de los Muertos festival in the 2020s is an example of a cultural practice changing as it spreads to new groups of people.",
sk:"Acculturation and commodification",
s:[["Name the change in general words. Who ran the festival first, and who runs it now?",["In the 1970s, residents started it for themselves. In the 2020s, the city sponsors it and tourists attend.","Big-idea words that fit: acculturation, commodification, or stimulus diffusion."]],["Give specific proof from the passage.",["“Sponsored by the city” and “draws thousands of tourists.”","Compare that with “residents began an annual festival.”"]],["Explain how spreading to new people changed the festival's purpose or meaning.",["Use “as… / because…” to connect the cause (new audience) to the effect (new purpose).","Honoring family ancestors → entertaining visitors and making money. The name stays; some of the meaning shifts."]]],
r:{m:"all",i:[["Names how the festival changed: city-sponsored, tourists, commercial/commodified, mainstream, bigger, or adopted by outsiders (acculturation or stimulus diffusion)",/city|sponsor|tourist|commerc|commodif|money|profit|bigger|larger|mainstream|popular|accultur|stimulus|adopt|outsider|visitor|non-?(mexican|latin|hispanic)|aren.t (mexican|latin|hispanic)|not (mexican|latin|hispanic)|other (people|groups|cultures)|new (people|groups)|people from (outside|other)|wider|broader|public|everyone/i,"Say HOW it changed: it's now sponsored by the city and draws tourists, so it has become commercialized and mainstream."],["Explains why spreading to new groups changed its meaning or purpose (cause → effect)",/meaning|purpose|los(e|es|ing|s|t)\b|origin|religio|family|ancestor|honou?r|the dead|remember|died|death|sacred|spirit|authentic|tradition|local|audience|entertain|instead|less (about|special|meaningful|personal)|more (about|of a)|show for|party|\bfun\b/i,"Explain the cause → effect: as outsiders adopt the festival, its purpose shifts from honoring ancestors to entertaining visitors, so the meaning changes."]]},
mo:"T1- The Día de los Muertos festival shows how a cultural practice can change as it spreads to new groups, a process called stimulus diffusion, along with commodification. E2- The passage says residents began the festival for their own neighborhood in the 1970s, but by the 2020s it is sponsored by the city and draws thousands of tourists. A3- As outsiders adopt the celebration, its purpose shifts from honoring family ancestors to entertaining visitors and bringing money into the city, so the festival keeps its name but loses some of its original religious meaning.",
b:["accult","popfolk"],
th:"It's the same festival, though. How can it be “changing”?",
co:"Same name, different festival. In the 1970s it was families honoring their dead. Now the city runs it for tourists. Ask: who is it FOR, and what is it FOR? Those answers changed.",
kq:"The festival started as a neighborhood tradition and is now a city-sponsored tourist event. Explain how that shows a cultural practice changing as new people pick it up.",
ml:["When a tradition goes mainstream",["Acculturation is when a group adopts parts of another culture. Stimulus diffusion is when an idea spreads but gets changed to fit the new group that adopts it, which is what happened to the festival.","Commodification means turning a cultural practice into something to sell or market, like a festival that attracts tourist dollars.","Stimulus diffusion is when an idea spreads but gets changed to fit the new group. A tourist festival keeps the skeleton of the original but swaps out some of its meaning.","Día de los Muertos is itself syncretic: it blends Indigenous Aztec traditions with Catholic All Souls' Day."],[["Commodification","Turning culture into a product to sell."],["Acculturation","Adopting traits of another culture while keeping your own identity."],["Stimulus diffusion","An idea spreads but changes to fit the new place."]]],
wk:["The festival is more popular now.","That says it changed, but not HOW it spread to new people or WHY that changed its purpose. Add who runs it now (the city, for tourists) and what that does to the meaning."],
mw:"It names the process (acculturation/commodification), quotes the shift from residents to city sponsorship and tourists, and explains how a new audience changes the festival's purpose.",
fr:"T1- The festival shows a cultural practice changing as it spreads because ___. E2- In the 1970s ___, but in the 2020s ___. A3- As ___ adopt the festival, its purpose shifts from ___ to ___.",
qc:["Turning a cultural tradition into something sold to tourists is called…",["commodification","assimilation","relocation diffusion"],0,"Commodification means making culture into a product. A city-sponsored tourist festival is a classic case."]},
{v:"Describe",
q:"Using the passage, describe ONE way religion is visible in the cultural landscape of Maple Street District.",
sk:"Religion in the cultural landscape",
s:[["Name the religious feature in general words. What kind of thing shows a group's religion on a street?",["A place of worship is the most obvious one.","Festivals and shrines count too."]],["Give the specific detail from the passage.",["St. Johannes Lutheran Church at the corner of Maple and Third, later Our Lady of Guadalupe Catholic Parish.","Or the Día de los Muertos festival held on Maple Street every year."]],["Describe what that feature tells someone walking by.",["The building and its name show which faith the residents practice.","Lutheran = German Protestants. Guadalupe Catholic Parish = Mexican and Central American Catholics."]]],
r:{m:"all",i:[["Names a religious feature from the passage: the church/parish (Lutheran, Catholic, Guadalupe) or the Día de los Muertos festival",/church|parish|lutheran|catholic|guadalupe|d[ií]a de los muertos|day of the dead|festival|altar|shrine|ofrenda|cross|steeple|mural/i,"Name a specific religious feature: the Lutheran church that became Our Lady of Guadalupe Catholic Parish, or the Día de los Muertos festival."],["Describes how it is visible or what it shows about the residents (building, corner, name, celebrated in the street, which faith)",/build|corner|street|sign|name|see|show|stand|locat|celebrat|decorat|paint|public|display|tell|reveal|reflect|faith|protestant|worship/i,"Describe what someone would SEE and what it tells them: a church building and its name show which faith the residents practice."]]},
mo:"T1- Religion is visible on Maple Street through its place of worship. E2- The passage says German immigrants built St. Johannes Lutheran Church at the corner of Maple and Third, and the same building later reopened as Our Lady of Guadalupe Catholic Parish. A3- A church building and its name tell anyone walking by which faith the residents practice, so the landscape shows the shift from German Protestants to Mexican and Central American Catholics.",
b:["religionland","sequent"],
th:"Nobody in the passage says anything about praying. Where's the religion?",
co:"Look for religious PLACES and EVENTS, not people praying. A church is religion you can see. So is a festival honoring the dead.",
kq:"Find one religious thing in the passage that you could see on the street. Describe what it is and what it shows about the people who live there.",
ml:["Spotting religion in a landscape",["Religion is one of the most visible cultural traits: churches, mosques, temples, shrines, cemeteries, and religious festivals all shape the look of a place.","Christianity is a universalizing religion, so it builds places of worship wherever its followers settle. Catholicism and Protestantism are two branches of it, and Lutheran is a denomination within the Protestant branch.","Our Lady of Guadalupe, the Mexican image of the Virgin Mary, is Mexico's most important Catholic symbol, so a parish with that name signals a Mexican community.","Día de los Muertos blends Indigenous and Catholic traditions and fills the street with altars, marigolds, and painted skulls for a few days each year."],[["Universalizing religion","A religion that seeks followers everywhere (Christianity, Islam, Buddhism)."],["Ethnic religion","A religion tied to one group or place (Hinduism, Judaism)."],["Denomination","A division within a branch, like Lutheran or Baptist within Protestantism."]]],
wk:["The people in the neighborhood are religious.","That tells us about the people, not the landscape. The question wants something visible: name the church (or the festival) and describe what it shows."],
mw:"It names the feature (a church), gives the exact detail from the passage (St. Johannes → Our Lady of Guadalupe), and describes what the building reveals about the residents.",
fr:"T1- Religion is visible in the landscape through ___. E2- The passage says ___ at ___. A3- This shows that ___.",
qc:["Which is the BEST example of religion in the cultural landscape?",["A Catholic parish building on a street corner","A family saying grace before dinner","A country's official language"],0,"The landscape is what you can see outdoors. A church building is religion made visible."]},
{v:"Explain",
q:"Explain ONE centrifugal effect that the changes of the 2020s could have on long-time residents of Maple Street District.",
sk:"Centrifugal forces and neighborhood change",
s:[["Name the dividing effect in general words. A centrifugal force pushes a community apart. How might old-timers feel?",["Think: priced out, pushed out, or like outsiders in their own neighborhood.","This overlaps with gentrification, a Unit 6 term."]],["Give specific proof from the passage.",["Rents rose sharply; coffee shops and a yoga studio opened; several long-running restaurants closed.","Who do the new businesses serve: the families who built the neighborhood, or newcomers and tourists?"]],["Explain how that divides the community (cause → effect).",["Because the new places aren't for them, older residents may feel the neighborhood isn't theirs anymore → tension with newcomers.","If they move away, the Latino community shrinks and loses its gathering places."]]],
r:{m:"all",i:[["Names a dividing effect on long-time residents: displacement, being pushed or priced out, losing gathering places, feeling like outsiders, tension or resentment with newcomers, loss of identity (gentrification)",/displac|push|forced|forcing|forces? (them|people|residents|families|out)|priced|afford|leav|move out|move away|\blos(e|es|ing|s|t)\b|divid|divis|tension|conflict|resent|belong|outsider|stranger|identity|eras|gentrif|separat|split|exclud|apart/i,"Name the dividing effect: long-time residents may be priced out, or feel like outsiders as the neighborhood stops serving them."],["Explains the cause → effect using the 2020s changes (rising rents, new businesses, closures, newcomers, tourists)",/rent|price|cost|expens|coffee|yoga|professional|young|wealth|rich|newcomer|new resident|new people|moved in|moving in|new (business|shop|store|neighbor)|tourist|restaurant|clos|festival/i,"Connect it to the passage: because rents rose and restaurants closed as newcomers arrived, older residents lose their places and feel pushed out."]]},
mo:"T1- The changes of the 2020s could act as a centrifugal force by making long-time residents feel their community is being taken from them. E2- The passage says rents rose sharply, coffee shops and a yoga studio opened, and several long-running restaurants closed as young professionals moved in. A3- Because the new businesses serve newcomers and tourists rather than the families who built the neighborhood, older residents may feel like outsiders on their own street, which creates tension between the two groups and divides the community, a pattern geographers connect to gentrification.",
b:["centri","enclave"],
th:"Isn't this just an economics question about rent?",
co:"Rent is the trigger, but the question asks about a CENTRIFUGAL effect: something that pulls the community apart. Follow the chain from rent → closed restaurants → how old-timers feel about their own street.",
kq:"Rents are up, new shops opened, old restaurants closed. Explain ONE way this could divide or push apart the people who've lived on Maple Street for decades.",
ml:["When change pulls a community apart",["A centrifugal force is anything that divides a group or weakens its unity.","Rising rents can push long-time residents and family businesses out, a process called gentrification (Unit 6).","When the taquería where everyone met closes and a yoga studio opens, the community loses a gathering place and may feel the neighborhood is no longer theirs.","Newcomers and old-timers may clash over prices and who the festival is for. Keep the focus on division and identity, not just dollars."],[["Centrifugal force","Something that pushes a group apart or weakens unity."],["Gentrification","Wealthier people moving into a lower-income area, raising rents and changing businesses."],["Displacement","When residents are forced to leave because they can no longer afford to stay."]]],
wk:["Rents went up, so it costs more to live there.","That's the economic fact, but it isn't a centrifugal effect yet. Finish the chain: higher rents close family restaurants and push residents out, so the community feels divided and loses its identity."],
mw:"It names the centrifugal effect (feeling pushed out, tension), quotes the 2020s changes from the passage, and explains how those changes divide old-timers from newcomers.",
fr:"T1- The 2020s changes could be a centrifugal force because ___. E2- The passage says ___ and ___. A3- Because ___, long-time residents may ___, which divides the community.",
qc:["Which is a CENTRIFUGAL force in a neighborhood?",["Long-time residents feeling pushed out by newcomers and rising rents","A community radio station in the residents' language","An annual festival everyone attends"],0,"Centrifugal forces divide. The radio station and the festival are centripetal: they bring people together."]},
{v:"Explain",
q:"Explain how the Spanish-language radio station is an example of a centripetal force for the community that arrived in the 1970s.",
sk:"Centripetal forces and shared media",
s:[["Name the unifying effect in general words. A centripetal force pulls a group together. What does a shared radio station do for people?",["It gives everyone the same news, music, and language every day.","Shared language + shared information = shared identity."]],["Give a specific example of what the station might broadcast.",["News in Spanish, music from Mexico and Central America, announcements about the Día de los Muertos festival or local businesses.","Residents from different countries all hear it in their common language."]],["Explain how that holds the community together (cause → effect).",["Because people share the same information and culture daily, they feel they belong to one community.","It also keeps Spanish alive, even as the neighborhood changes around them."]]],
r:{m:"all",i:[["Names the unifying effect: unites or connects people, builds shared identity or belonging, preserves language and culture, strengthens community",/unit|unif|together|connect|bring|shared|common|identity|communit|belong|bond|pride|preserv|keep(s|ing)? (the |their )?(language|culture|tradition|communit|people|them (together|connected|close))|keep(s|ing)? [^.]{0,25}alive|maintain|strengthen|cohes|solidar/i,"Name the unifying effect: the station brings residents together around a shared language and identity."],["Explains how the station does it: Spanish language, news, music, information, events, listening together",/spanish|language|news|music|inform|event|hear|listen|broadcast|announce|program|because|so |lead|allow|help/i,"Explain HOW: it broadcasts news, music, and local announcements in Spanish, so everyone shares the same information and culture."]]},
mo:"T1- The Spanish-language radio station is a centripetal force because it unites the Mexican and Central American community around a shared language and identity. E2- The station broadcasts news, music, and announcements in Spanish, so residents from different countries all hear about neighborhood events like the Día de los Muertos festival and local businesses in their own language. A3- Because people share the same information and culture every day, the station strengthens their sense of belonging and keeps the community connected, even as the neighborhood changes around them.",
b:["centri","enclave"],
th:"It's just a radio station. How does that “pull people together”?",
co:"Think about what everyone in the neighborhood hears on the same morning: the same news, the same songs, the same festival announcements, all in Spanish. Shared media builds a shared “us.”",
kq:"Explain how a radio station in Spanish helps hold the Latino community together, and what it actually does to make that happen.",
ml:["Ethnic media as glue",["A centripetal force is anything that unites a group: a shared language, religion, celebration, or media.","Immigrant communities have long built their own media, from the German Ridgeway Zeitung in the 1920s to Spanish radio in the 1970s.","Ethnic media spreads news about jobs, church events, and festivals, and it does it in the language people feel at home in.","It helps people from different countries, like Mexico and Guatemala, feel like one community, and it keeps their language in daily use."],[["Centripetal force","Something that unites a group and strengthens its identity."],["Ethnic media","Newspapers, radio, or TV made by and for one ethnic group."]]],
wk:["The radio station plays Spanish music.","That's what it does, not what it does FOR the community. Add the effect: hearing shared news and music in Spanish unites residents and strengthens their identity."],
mw:"It names the unifying effect (shared language and identity), gives concrete examples of what the station broadcasts, and explains how that builds belonging and keeps the community connected.",
fr:"T1- The radio station is a centripetal force because it ___. E2- For example, it broadcasts ___ in Spanish, so residents ___. A3- Because ___, the community feels ___.",
qc:["A newspaper or radio station in an immigrant group's language is best described as a…",["centripetal force","centrifugal force","barrier to diffusion"],0,"Shared media in a shared language pulls a group together. That's centripetal."]},
{v:"Explain",
q:"Explain ONE way globalization or popular culture could threaten the local culture of Maple Street District, AND ONE way technology could help residents preserve it.",
sk:"Popular culture, globalization, and preservation",
s:[["Name the threat in general words. What happens when global chains and tourist crowds arrive in a local neighborhood?",["Local culture can get crowded out and places start to look alike: cultural homogenization.","Family restaurants closing while coffee shops open is a clue in the passage."]],["Now the second half: name a specific technology residents could use to protect their culture.",["Stream the radio station online, post festival videos and recipes on social media, build a digital archive of neighborhood history.","Technology that spreads popular culture can also spread local culture."]],["Connect both halves with cause → effect, and make sure you wrote BOTH.",["Threat: because global brands push out local businesses, the neighborhood loses its distinct look. Preservation: because ___ is online, young people and families who moved away can still ___.","This part is worth one point, but you need both ideas to earn it."]]],
r:{m:"all",i:[["Names a threat from globalization or popular culture: chains or global brands, tourists, commercialization, homogenization, local businesses replaced or lost",/chain|franchis|starbucks|corporat|global brand|homogen|same|alike|replac|los|dilut|mainstream|popular|touris|commerc|outcompet|crowd out|push out|disappear|fade|generic/i,"Name the threat: global chains and tourist crowds could replace family businesses, so the neighborhood starts to look like everywhere else (cultural homogenization)."],["Names a way technology could preserve local culture: internet, social media, streaming, recording, online archive, apps, videos, podcasts",/internet|social media|online|app\b|apps|record|stream|video|podcast|website|digital|archiv|phone|youtube|tiktok|instagram|facebook|share|post|upload/i,"Add the second half: residents could stream the radio station or post festival videos and recipes online so the culture reaches young people and families who moved away."]]},
mo:"T1- Globalization and popular culture can threaten Maple Street's local culture, but technology can also help residents protect it. E2- The passage shows coffee shops and a yoga studio opening for newcomers and tourists while long-running family restaurants close; if global chains keep arriving, the district could start to look like any other trendy neighborhood, a step toward cultural homogenization. A3- At the same time, residents could stream the Spanish-language radio station online and post festival videos and family recipes on social media, so young people and families who moved away can still take part, keeping the traditions alive even if the storefronts change.",
b:["popfolk","accult"],
th:"Two things in one question? Which one do I answer?",
co:"Both, and that's the trap. This part is one point, but the rubric needs a threat AND a technology fix. Write them as two clear sentences so the grader can't miss either one.",
kq:"First, explain one way global or popular culture could hurt the neighborhood's local culture. Second, explain one way technology could help save it. You need both.",
ml:["Globalization: threat and tool",["Popular culture spreads fast through companies and media and tends to look the same everywhere. When it crowds out local traditions, geographers call it cultural homogenization.","On Maple Street, chain-style coffee shops and tourist crowds could replace the family restaurants and the festival's local meaning.","But the same technology that spreads popular culture can protect local culture: communities stream festivals, record elders' stories, and post heritage-language videos.","On the exam, a two-part question needs two clearly labeled answers."],[["Cultural homogenization","Places and cultures becoming more alike because of globalization."],["Popular culture","Culture spread widely through media and business; similar everywhere."],["Local (folk) culture","Culture tied to one place or group, passed down in person."]]],
wk:["Globalization makes everything the same, so the neighborhood will lose its culture.","Good start, but that's only half the question. You also need ONE way technology could help preserve the culture, like streaming the radio station or posting festival videos online."],
mw:"It names the threat (chains and tourists replacing local businesses → homogenization), names a technology fix (streaming the station, posting videos and recipes), and explains the effect of each.",
fr:"T1- Globalization or popular culture could threaten Maple Street's local culture by ___. E2- For example, ___. A3- But residents could use technology to preserve it by ___, which would ___.",
qc:["Globalization spreading the same brands and styles everywhere, so places look alike, is called…",["cultural homogenization","sequent occupance","relocation diffusion"],0,"Homogenization means becoming the same. Technology can speed it up, but it can also help local cultures survive."]}
]});
