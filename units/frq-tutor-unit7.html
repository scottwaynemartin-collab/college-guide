<script>
const BG={
frq:{t:"How AP FRQs are scored",s:["Each part (A, B, C…) is worth 1 point and is scored on its own. A mistake in Part B can't cost you Part C.","Readers look for the right idea, clearly linked to the question. Fancy writing earns nothing extra.","No thesis, intro, or conclusion needed. Label each part and answer it directly.","Write in complete sentences and do what the task verb asks (Identify, Define, Describe, Explain, Compare, or Explain the degree).","Never leave a part blank. A wrong answer costs nothing."]},
tea:{t:"The TEA method",s:["T1- Topic: your reason in general words. Turn the question into your claim.","E2- Evidence: the specific proof, like a place, number, or example, ideally from the map or table.","A3- Analysis: why it matters. Explain HOW or WHY your proof backs up your reason, using “because…” or “which leads to…”.","Label each piece T1-, E2-, A3- so the reader can find every point. Describe answers need T1 and E2 plus a short A3. Explain answers need a strong A3."]},
readmap:{t:"How to read a map",s:["Read the title first. It tells you the topic, place, and time.","Check the legend so you know what each color and symbol means.","Look for patterns: what's clustered, what's connected, what points where?","Then ask WHY: who made this, and what story is it telling?"]},
readtable:{t:"How to read a data table",s:["Read the title and every column header, including units (%, per 1,000).","Find the highest and lowest value in each column.","Compare columns: when one goes up, does another go up or down?","When there are two years, look for change over time."]},
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, set up trading posts in India. From the 1750s on, it used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]}
};
const VERBS={
Identify:{d:"Name it. One short, specific answer is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","Write it as one short, complete sentence."]},
Describe:{d:"Paint the picture. Give the specific characteristics or pattern, with details someone could check.",l:["Use evidence: a place, a number, or a feature from the stimulus.","Say what it IS or what it LOOKS LIKE. You don't need a deep “why.”","About 1–2 sentences. Use TEA: Topic + Evidence, then a quick Analysis."]},
Explain:{d:"Tell HOW or WHY. Connect a cause to an effect so a reader sees the reasoning, not just a fact.",l:["Use linking words: “because…”, “which leads to…”, “as a result…”.","A fact alone won't score. You need the chain of reasoning.","About 2–3 sentences. Use full TEA."]},
Define:{d:"Give the meaning. Say what the term is in your own words, clearly enough that someone who never heard it would get it.",l:["Use a full sentence: “[Term] is…”","Don't just give an example. The meaning comes first; an example can back it up.","One or two sentences."]},
"Explain the degree":{d:"Say HOW MUCH something is true, then prove it. Pick a level (a great degree, a moderate degree, or a small degree) and explain why it's that much and not more or less.",l:["Start with your level: “Colonization affected ___ to a great degree because…”","Give evidence for your level AND a reason it isn't total (or isn't zero).","About 2–3 sentences. T1- states the degree, E2- proves it, A3- explains why it's that much."]},
Compare:{d:"Show how two things are alike or different. Name BOTH things and make the difference (or similarity) clear.",l:["Use comparison words: “while…”, “whereas…”, “unlike…”, “both…”.","Talking about only one side won't score. Mention both.","About 2 sentences. T1- names the difference, E2- gives an example of each, A3- says why it matters."]}

addBG({
devmeasures:{t:"Measures of development",s:["GNI per capita is a country's total income divided by its population. “PPP” (purchasing power parity) adjusts for the fact that a dollar buys more in some countries than in others.","HDI, the Human Development Index, combines income, years of schooling, and life expectancy into one score from 0 to 1. A score of 0.800 or higher counts as “very high” human development.","Other common measures: literacy rate, infant mortality rate, and the share of workers in each economic sector.","Income shows what a country earns; HDI adds health and education, so it says more about how people live (but not who gets the money). When the two disagree, something interesting is going on."]},
rostow:{t:"Rostow's stages of growth",s:["W. W. Rostow (1960) said every country moves through five stages: traditional society, preconditions for take-off, take-off, drive to maturity, and high mass consumption.","Take-off is the big moment: a few industries grow fast, cities swell, and the country starts to industrialize.","High mass consumption is the top stage: most workers are in services, and people spend on cars, electronics, and vacations.","Critics say the model is based on the history of the United States and Western Europe, assumes every country can follow the same path, and ignores how colonialism and global trade can hold countries back.","Wallerstein's world-system theory answers that criticism by looking at the whole world at once: a wealthy core, a semi-periphery, and a periphery that supplies raw materials and cheap labor."]},
gii:{t:"Gender Inequality Index",s:["The Gender Inequality Index (GII) is a UN measure from 0 to 1 that compares women and men. Lower is better; 0 would mean full equality.","It combines three things: reproductive health (maternal deaths and teen births), empowerment (seats in parliament and secondary schooling), and the labor force (people working or looking for work).","Countries with a high GII usually have fewer girls finishing school, fewer women in the labor force, and more teen births.","Development experts argue that educating and employing women is one of the fastest ways to raise a country's HDI, which is why microloans to women, like those from Bangladesh's Grameen Bank, are so popular."]},
commodity:{t:"Commodity dependence",s:["A commodity is a raw product sold in bulk at a world price: oil, copper, coffee, cocoa, cotton.","The UN agency UNCTAD calls a country commodity-dependent when commodities make up more than 60% of its goods exports. Often one product leads: Nigeria and Venezuela, for example, get most of their export earnings from oil.","World prices for commodities swing wildly. Oil fell from over $100 a barrel in 2014 to under $30 in early 2016.","When the price drops, the country's export income, government budget, and jobs can all drop together. Some geographers call this trap the “resource curse.”","The usual advice is to diversify: build manufacturing and services so that one price can't sink the whole economy."]},
sez:{t:"Special economic zones",s:["A special economic zone (SEZ) is an area where a government relaxes its normal rules to attract foreign factories: lower taxes, fewer tariffs, less paperwork.","An export processing zone (EPZ) is a type of SEZ focused on assembling goods for export. Mexico's maquiladoras, many near the U.S. border, work in a similar way: they import parts tax-free and export the finished goods.","Shenzhen, one of China's first SEZs (1980), grew from a small border town of about 30,000 people into a manufacturing city of more than 17 million.","Companies get cheap labor and easy exporting; the host country gets jobs, technology, and foreign investment.","Downsides can include low wages, weak worker protections, pollution, and companies that leave once the tax breaks end."]},
sectors:{t:"Economic sectors",s:["Primary sector: taking things from the earth (farming, fishing, mining). Secondary: making things (factories, construction). Tertiary: services (stores, schools, hospitals, banks).","AP Human Geography also uses two more: quaternary (information and research) and quinary (top-level decision-making).","As a country develops, workers shift from primary to secondary to tertiary. Rich countries usually have under 5% of workers in farming and over 70% in services.","A big share of workers in agriculture usually signals low incomes, because farms in poor countries produce little per worker and most of it is eaten, not sold."]}
});

t:"Measuring Up",
d:"Development indicators, Rostow, commodity dependence, and special economic zones.",
u:"Unit 7",
fmt:"One stimulus (like Question 2)",
st:"Selected Development Indicators for Four Countries, 2023",
intro:"Geographers use many indicators to measure development, because no single number tells the whole story. The table shows six indicators for four countries.",
stim:"<div class=\"tbl\"><table><thead><tr><th>Country</th><th>GNI per capita (PPP, US$)</th><th>HDI (0–1)</th><th>Gender Inequality Index (0–1, lower is better)</th><th>Workers in agriculture (%)</th><th>Workers in services (%)</th><th>Exports from top product (% of export value)</th></tr></thead><tbody>\n<tr><td>Ardena</td><td>48,200</td><td>0.93</td><td>0.08</td><td>2</td><td>78</td><td>9 (machinery)</td></tr><tr><td>Kovar</td><td>14,100</td><td>0.76</td><td>0.35</td><td>18</td><td>55</td><td>20 (electronics)</td></tr>\n<tr><td>Sulmani</td><td>2,100</td><td>0.49</td><td>0.58</td><td>62</td><td>25</td><td>15 (coffee)</td></tr><tr><td>Tessar</td><td>31,400</td><td>0.74</td><td>0.50</td><td>6</td><td>60</td><td>85 (petroleum)</td></tr></tbody></table></div><p class=\"src\">Note: The countries and data are invented for practice. Remember the class directions: label each part, and write Describe and Explain parts as T1- (your reason in general words), E2- (the specific proof), A3- (why it matters).</p>",
bg:["devmeasures","rostow","readtable"],
nt:[["Look at Tessar's GNI per capita, then slide over to its HDI. Does its ranking stay the same?","No! Tessar is #2 in income ($31,400) but drops to #3 in HDI (0.74), below Kovar, which earns less than half as much per person. That mismatch is the heart of this FRQ."],["Run your finger down the agriculture column, then down the HDI column. What happens?","As the share of farm workers rises (2, 6, 18, 62%), HDI mostly falls (0.93, 0.74, 0.76, 0.49). Tessar is the one exception: oil money shrank its farming but didn't lift its HDI."],["Which country gets most of its export money from ONE product? What is the product?","Tessar: 85% of its exports are petroleum. One product, one world price. Keep that in mind for the later parts."]],
m:20,
p:[
{v:"Identify",
q:"Identify the country in the table that is most likely in Rostow's stage of high mass consumption.",
sk:"Matching data to a Rostow stage",
s:[["Recall what high mass consumption looks like: rich, service-based, few farmers.",["It's the TOP stage: high incomes, most workers in services, very few in farming.","Think of the United States or Germany today."]],["Find the row with the highest HDI and the most service workers.",["Scan the HDI column for the highest number, then check the services column.","It's the first row."]]],
r:{m:"any",i:[["Ardena",/ardena/i,"Find the country with the highest GNI per capita, the highest HDI, and the most workers in services."]]},
mo:"Ardena.",
b:["rostow","sectors"],
th:"I remember Rostow had stages, but I forget what the top one is.",
co:"No problem. The top stage is high mass consumption: a rich country where most people work in services and can afford cars, phones, and vacations. Now find the richest, most service-heavy row.",
kq:"Which country is the rich one at the top of Rostow's ladder? Just name it.",
ml:["Rostow's top stage",["Rostow's model has five stages, from traditional society (mostly farming) to high mass consumption (mostly services and shopping).","Countries in high mass consumption typically have very high GNI per capita and HDI, very few farm workers, and most workers in services.","Ardena fits: $48,200 per person, HDI 0.93, 2% in agriculture, 78% in services.","Tessar has a high income too, but 85% of its exports are one raw commodity, which is not what a mature, diversified economy looks like."],[["High mass consumption","Rostow's fifth stage: a wealthy, service-based economy."],["Tertiary sector","Service jobs: stores, schools, hospitals, offices."]]],
wk:["Tessar, because it has a high GNI per capita.","GNI alone is the trap in this table. Tessar's HDI (0.74) is below Kovar's, even though Kovar earns less than half as much, and 85% of its exports are one raw material, so it isn't a mature, diversified economy. Check HDI and the services column too."],
mw:"It names the one country whose numbers all point to the top stage: highest income, highest HDI, almost no farmers, and most workers in services.",
fr:"The country most likely in high mass consumption is ___.",
qc:["Rostow's stage of high mass consumption is marked by…",["most workers in services and high spending on consumer goods","most workers in farming and little trade","a few fast-growing industries just getting started"],0,"It's the top stage: a rich, service-based economy where people buy cars, electronics, and vacations."]},
{v:"Describe",
q:"Using the table, describe the relationship between the percent of workers in agriculture and the Human Development Index (HDI).",
sk:"Describing a relationship in data",
s:[["Say the relationship in general words. When one number goes up, what does the other do?",["Compare the top and bottom of each column.","When agriculture goes UP, HDI usually goes DOWN. That's an inverse (negative) relationship."]],["Prove it with two rows from the table, numbers included.",["Use the two extremes: Sulmani and Ardena.","Sulmani: 62% in agriculture, HDI 0.49. Ardena: 2% in agriculture, HDI 0.93."]],["Say why that relationship makes sense.",["Think about what happens to workers as a country develops.","Workers move from farms to factories and services, which raises incomes, schooling, and life expectancy."]]],
r:{m:"all",i:[["States the direction: higher percent in agriculture goes with lower HDI (inverse/negative relationship)",/invers|negativ|opposite|indirect|(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot).{0,50}(agri\w*|farm\w*).{0,80}(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse)|(agri\w*|farm\w*).{0,50}(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot).{0,80}(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse)|(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse).{0,50}(agri\w*|farm\w*).{0,80}(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot)|(agri\w*|farm\w*).{0,50}(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse).{0,80}(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot)|(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot).{0,30}(hdi|human development|develop\w*).{0,60}(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse).{0,40}(agri\w*|farm\w*)|(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse).{0,30}(hdi|human development|develop\w*).{0,60}(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot).{0,40}(agri\w*|farm\w*)/i,"State the direction: the higher the percent of workers in agriculture, the lower the HDI."],["Uses the table as proof: names countries or quotes numbers (e.g., Sulmani 62% / 0.49 vs. Ardena 2% / 0.93)",/sulmani|ardena|kovar|tessar|62|0\.49|0\.93|0\.76|0\.74|2 ?%|18 ?%|6 ?%/i,"Use the table: Sulmani has 62% in agriculture and an HDI of 0.49, while Ardena has 2% and 0.93."]]},
mo:"T1- The table shows a generally inverse relationship: the higher the percent of workers in agriculture, the lower the HDI tends to be. E2- Sulmani has 62% of its workers in agriculture and the lowest HDI (0.49), while Ardena has only 2% in agriculture and the highest HDI (0.93). A3- This fits the idea that as countries develop, workers shift out of farming into factories and services, which raises incomes, education, and life expectancy.",
b:["sectors","readtable"],
th:"Describe a relationship? Do I just say they're related?",
co:"Almost! A relationship has a direction. Try the sentence: “As ___ goes up, ___ goes ___.” Then prove it with two rows and their actual numbers.",
kq:"When a country has more farm workers, what happens to its HDI? Say the direction and prove it with numbers from the table.",
ml:["Reading a relationship in a table",["Two columns have a relationship if one changes in a predictable way when the other changes.","Positive (direct): both go up together. Inverse (negative): one goes up while the other goes down.","Here, more farm workers generally means a lower HDI, so the relationship is inverse.","To prove it, quote two rows: Sulmani (62% agriculture, HDI 0.49) and Ardena (2%, HDI 0.93).","Note the exception: Tessar has fewer farmers than Kovar (6% vs. 18%) but a slightly lower HDI (0.74 vs. 0.76). Real data is rarely perfect, and exceptions are great material for later parts."],[["Inverse relationship","One number goes up while the other goes down."],["Primary sector","Jobs that take things from the earth: farming, fishing, mining."]]],
wk:["Agriculture and HDI are related.","Related how? A relationship has a direction (as one goes up, the other goes down), and you need numbers from the table as proof."],
mw:"It states the direction (inverse), proves it with two rows and their numbers, and explains why farming and HDI move in opposite directions.",
fr:"T1- The table shows that as the percent of workers in agriculture goes ___, HDI goes ___. E2- For example, ___ has ___% in agriculture and an HDI of ___, while ___ has ___% and ___. A3- This makes sense because ___.",
qc:["If one number goes UP while the other goes DOWN, the relationship is…",["inverse (negative)","positive (direct)","random"],0,"Inverse means opposite directions, like agriculture and HDI in this table."]},
{v:"Explain",
q:"Using the table, explain why a country can have a high GNI per capita but a lower HDI than its income would predict.",
sk:"Income vs. human development",
s:[["Find the mismatch, then name the general reason. Who actually gets the money?",["Tessar: $31,400 per person but HDI 0.74, below Kovar at $14,100.","GNI per capita is an average. It can be high even if most of the money goes to a few people."]],["Give specific proof from Tessar's row.",["85% of Tessar's exports are petroleum. Oil money often flows to the government and a small elite, not to everyone.","Its Gender Inequality Index (0.50) is high, a sign that women in particular are being left behind."]],["Explain why that lowers HDI specifically.",["Remember what HDI measures besides income: schooling and life expectancy.","If oil money isn't spent on schools and hospitals, two of HDI's three parts stay low."]]],
r:{m:"all",i:[["Names a reason: wealth is concentrated or unequal, money comes from one resource (oil), low spending or corruption, or gender inequality",/concentrat|unequal|inequal|few|elite|rich|wealthy|gap|spend|invest|corrupt|govern|oil|petrol|women|gender|gii|average|distribut|one (product|commodity|export|resource)/i,"Name the reason: Tessar's oil wealth is concentrated in a few hands and not spread to most people."],["Explains the link to HDI: money doesn't reach education, health, or life expectancy for most people",/educat|school|literacy|health|hospital|life expectancy|doctor|medic|not reach|doesn.t reach|does not reach|left out|left behind|trickle|most people|ordinary people|regular people|average person|normal people|spen(d|t|ding) (it |the money )?on (the )?(people|citizens|schools|health|education)|invest\w* in (the )?(people|citizens|schools|health|education)|quality of life|standard of living|living standard|live longer|lifespan/i,"Connect it to HDI: if the money isn't spent on schools and health care, education and life expectancy stay low."]]},
mo:"T1- A country can have a high GNI per capita but a lower HDI when its wealth is concentrated in a few hands and not spent on people. E2- Tessar earns $31,400 per person on paper, but 85% of its exports are petroleum, and oil money often flows to the government and a small elite rather than into schools and hospitals; its high Gender Inequality Index (0.50) suggests that women in particular are left out. A3- Because HDI also measures education and life expectancy, not just income, a country that does not invest its oil money in health and schooling scores lower than its GNI alone would predict.",
b:["devmeasures","commodity","gii"],
th:"If they have the money, why wouldn't they be developed?",
co:"Because “per capita” is an average, not a paycheck. If one oil company and a few officials earn almost everything, the average looks great while most families never see it. Follow where the oil money actually goes.",
kq:"Tessar is rich on paper but scores low on HDI. Explain why that happens, using the table.",
ml:["When income and HDI disagree",["GNI per capita divides a country's total income by its population, so a few very rich people can pull the average up.","HDI has three parts: income, years of schooling, and life expectancy. Income is only one third of the score.","Oil-rich countries such as Equatorial Guinea have had a GNI per capita far higher than their HDI would suggest, because oil money went to a small elite.","A high Gender Inequality Index is a clue: when women are kept out of school and work, half the population's health and education lag behind.","So when GNI is high but HDI is low, look for concentrated wealth and low spending on people."],[["GNI per capita","A country's total income divided by its population: an average, not what each person gets."],["HDI","Human Development Index: income + schooling + life expectancy, scored 0 to 1."]]],
wk:["Tessar has a lower HDI because it is a smaller country.","Size has nothing to do with it; the table doesn't even show population. The reason is WHERE the money goes: concentrated oil wealth that isn't spent on schools and health."],
mw:"It names the reason (concentrated wealth), proves it with Tessar's row (85% petroleum, GII 0.50), and connects it to what HDI measures (education and life expectancy).",
fr:"T1- A country can have a high GNI per capita but a lower HDI when ___. E2- For example, Tessar ___. A3- This lowers HDI because HDI also measures ___, and ___.",
qc:["Which of these is NOT one of the three parts of HDI?",["Exports per person","Life expectancy","Years of schooling"],0,"HDI combines income, education, and life expectancy. Exports aren't part of it."]},
{v:"Explain",
q:"Explain ONE way a high Gender Inequality Index can slow a country's economic development.",
sk:"Women's status and development",
s:[["Name the general idea. What does a high GII mean for half the population?",["A high GII means women have less schooling, less paid work, and less political power than men.","If half the population can't fully contribute, the economy loses their skills and work."]],["Give a specific example of what women can't do, using Sulmani (GII 0.58) if you like.",["Girls leave school early; women can't get loans to start businesses; women aren't hired for paid jobs.","Teen births and early marriage keep young women out of school and work."]],["Explain how that leads to slower growth.",["Fewer workers and fewer educated people → less produced → lower incomes.","Educated working women also have fewer, healthier children, which raises the next generation's HDI."]]],
r:{m:"all",i:[["Names a specific barrier women face: schooling, paid jobs, loans/credit, property, political power, health, early marriage or childbirth",/school|educat|literacy|job|work|labor|labour|workforce|employ|business|loan|credit|vote|parliament|polit|health|maternal|pregnan|child|birth|fertil|marri|propert|\bland\b|\bown(s|ed|ing)?\b/i,"Name what women are kept from: school, paid jobs, loans to start businesses, or political power."],["Explains the effect on the economy: fewer workers or skills, less produced, lower incomes, slower growth",/less|fewer|half|lower|slow|lose|loss|waste|miss|smaller|reduc|shrink|product|income|gdp|gni|(can.t|cannot|won.t|doesn.t|don.t) grow|grow(s|th)? (slow|less)|less growth|\btax|spend|invest|poverty|poor|skill|workforce|worker/i,"Explain the payoff: shutting out half the population means fewer workers and skills, so less is produced and incomes grow more slowly."]]},
mo:"T1- High gender inequality (a high GII) can slow development because it keeps women, about half the population, from fully contributing to the economy. E2- A GII as high as Sulmani's (0.58) signals that fewer girls finish secondary school, more have children as teenagers, and fewer women are in the labor force. A3- Because educated, working women earn income, have fewer and healthier children, and start businesses, shutting them out shrinks the workforce and the country's skills, so the economy grows more slowly than it could.",
b:["gii"],
th:"Isn't gender inequality a social issue, not an economic one?",
co:"It's both, and that's the point. Picture an economy that only lets half its people learn and work. Now ask: how much is it leaving on the table?",
kq:"How can treating women unequally make a whole country poorer? Explain ONE way.",
ml:["Why women's status drives development",["The Gender Inequality Index measures gaps between women and men in reproductive health, schooling, political power, and the labor force. Lower is better.","When girls stay in school, they marry later, have fewer and healthier children, and earn more as adults.","When women can get loans, they start small businesses. Grameen Bank in Bangladesh pioneered microloans to women in the 1980s for exactly this reason.","Economists estimate that closing the gender gap in work would add trillions of dollars to the world economy.","So a high GII isn't just unfair; it means a country isn't making full use of its women's skills and work."],[["Gender Inequality Index","A 0-to-1 UN score of the gap between women and men; lower is better."],["Microloan","A very small loan, often to a woman, to start or grow a tiny business."]]],
wk:["Gender inequality is bad for the economy.","That just restates the question. Name a specific thing women are kept from (school, jobs, loans) and explain how that leads to slower growth."],
mw:"It names the general idea (half the population held back), gives specific barriers that Sulmani's high GII signals (school, teen births, work), and explains the chain to slower growth.",
fr:"T1- A high Gender Inequality Index slows development because ___. E2- For example, in Sulmani women ___. A3- This slows the economy because ___, which leads to ___.",
qc:["A LOWER Gender Inequality Index means…",["women and men are closer to equal","women have far fewer rights than men","the country has fewer women than men"],0,"On the GII, 0 is full equality, so lower is better."]},
{v:"Explain",
q:"Explain ONE economic risk for a country whose exports depend heavily on a single commodity.",
sk:"Commodity dependence",
s:[["Name the risk in general words. What does the country have no control over?",["Commodities are sold at a WORLD price the country can't set.","If the price crashes, so does the country's income. There's nothing to fall back on."]],["Give a specific example, using Tessar (85% petroleum) or a real case.",["Oil fell from over $100 a barrel in 2014 to under $30 in 2016, and crashed again in 2020.","Nigeria and Venezuela both rely on oil for most export earnings and both suffered deep crises when prices fell."]],["Explain the chain reaction inside the country.",["Export income falls → government budget shrinks → spending cuts, debt, lost jobs.","This is sometimes called the “resource curse.”"]]],
r:{m:"all",i:[["Names a risk: price shock or volatility, running out of the resource, falling demand, or the resource curse",/price|shock|crash|drop|fall|volatil|swing|fluctuat|run out|deplet|finite|curse|dutch|demand|boom|bust|replace|substitut|renewable|electric|climate|one product|single product|eggs/i,"Name the risk: the world price can crash (or the resource can run out), and the country can't control it."],["Explains the effect on the country: lost income or revenue, budget cuts, debt, unemployment, recession",/because|so |lead|income|revenue|money|budget|debt|unemploy|job|govern|econom|recession|collaps|lose|loss|suffer|hurt|crisis|cut|fall back|nothing else|no other/i,"Explain the damage: when the price falls, export income, government revenue, and jobs can all fall together."]]},
mo:"T1- Depending on one commodity is risky because the whole economy rises and falls with that product's world price, which the country cannot control. E2- Tessar gets 85% of its export earnings from petroleum, so if oil prices crash, as they did from over $100 a barrel in 2014 to under $30 in 2016, its export earnings, government revenue, and oil jobs can all fall sharply together. A3- Because the country has few other exports to fall back on, a price shock can lead to budget cuts, debt, and unemployment, which is one part of what geographers call the resource curse: resource-rich countries often end up less stable and less developed than expected.",
b:["commodity"],
th:"Oil is valuable. How is selling a lot of it a risk?",
co:"It's valuable until the day it isn't. Tessar doesn't set the price of oil; the world market does. Ask yourself what happens to a family budget when 85% of the paycheck can be cut in half overnight.",
kq:"Tessar earns almost all its export money from oil. What ONE economic danger does that create? Explain how it hurts the country.",
ml:["Putting all your eggs in one basket",["A commodity is a raw product sold at a world price: oil, copper, coffee, cocoa.","Commodity prices swing wildly. Oil went from over $100 a barrel in 2014 to under $30 in early 2016, and briefly collapsed again in 2020.","When 85% of exports are one product, a price crash can cut export income, government revenue, and jobs all at once.","Nigeria and Venezuela, both heavily dependent on oil, fell into deep recessions when prices dropped.","Geographers call this pattern the resource curse: rich in a resource, but poorer and less stable because of it."],[["Commodity","A raw product sold in bulk at a world price."],["Resource curse","When depending on one valuable resource leaves a country unstable and underdeveloped."]]],
wk:["Tessar should sell more things.","That's advice, not a risk. The question asks what could go WRONG: name the danger (a price crash) and explain how it hurts the country."],
mw:"It names the risk (price shock), gives proof (Tessar's 85% petroleum and the 2014–2016 oil crash), and traces the chain to budget cuts, debt, and job losses.",
fr:"T1- Depending on one commodity is risky because ___. E2- For example, Tessar ___, so if ___. A3- This hurts the country because ___, which leads to ___.",
qc:["A sudden drop in the world price of a country's main export is called a…",["price shock","trade surplus","tariff"],0,"A price shock is a sudden swing in a commodity's price, and it hits one-product economies hardest."]},
{v:"Explain",
q:"Explain how a special economic zone (SEZ) or export processing zone could help Sulmani move toward Rostow's take-off stage, AND identify one potential downside.",
sk:"SEZs and industrialization",
s:[["Name what an SEZ does in general words.",["It's an area with special rules (low taxes, no tariffs, good roads and power) to attract foreign factories.","Think of Shenzhen in China, or Mexico's maquiladora factories."]],["Give specific proof of how that helps a farming country like Sulmani (62% in agriculture).",["Factories hire workers leaving farms, earn export money, and bring in technology and skills.","Shenzhen went from a small border town of about 30,000 in 1980 to a city of more than 17 million."]],["Connect it to take-off, then add a downside. Use “however” or “but.”",["Take-off = a few fast-growing industries pull the economy out of farming.","Downsides: low wages, pollution, weak worker protections, companies leaving when tax breaks end."]]],
r:{m:"all",i:[["Explains what the SEZ offers or attracts: tax breaks, no tariffs, foreign investment, factories, jobs, exports, technology",/tax|tariff|duty|incentive|foreign|invest|fdi|compan|factor|manufactur|job|employ|export|infrastruct|technolog|skill|industr|secondary/i,"Say what an SEZ does: low taxes and no tariffs attract foreign factories that create jobs and exports."],["Connects it to take-off or industrial growth: moving workers out of farming, a new leading industry, faster growth",/take.?off|rostow|stage|industrial|manufactur|grow|develop|precondition|shift|move|leading sector|urban|secondary/i,"Connect it to Rostow: new factories pull workers out of farming and start the fast industrial growth of take-off."],["Identifies a downside: low wages, exploitation, pollution, weak protections, lost tax revenue, companies leaving, dependence on foreign firms",/\bbut\b|however|downside|negative|drawback|problem|risk|low(er)? (wage|pay)|paid (very |really )?(little|low)|cheap labou?r|exploit|pollut|environment|condition|sweatshop|lose|loss|(compan\w*|firms?|factor\w*|business\w*|they) (might |could |may |would |will |can )?(leave|move|pull out|relocate)|leave (when|if|for)|unstable|dependen|revenue|\bfew\b|unequal|rights|union|foreign (control|own)|profit/i,"Add a downside: for example, wages are often low, pollution rises, or companies leave when the tax breaks end."]]},
mo:"T1- A special economic zone could help Sulmani start to industrialize by attracting foreign factories. E2- Inside the zone, the government offers low taxes, no tariffs on imported parts, and ready-built roads and power, so multinational companies open clothing or electronics plants that hire workers leaving farms, much as the Shenzhen SEZ turned a small border town into a manufacturing giant. A3- Those factories create a new leading sector, export earnings, and job skills that can push Sulmani from Rostow's traditional stage toward take-off; however, the downside is that wages are often low and labor and environmental rules are weak, and if the tax breaks end the companies may simply move to a cheaper country.",
b:["sez","rostow","sectors"],
th:"This question has two parts. Do I need both?",
co:"Yes, both, and that's good news: the downside is the easy half. Explain the help first (factories, jobs, exports), then flip it with “however…” and name one cost.",
kq:"How could a special economic zone kick-start factories in Sulmani and move it toward take-off? And what's one thing that could go wrong?",
ml:["SEZs: a shortcut to take-off?",["A special economic zone is an area with special rules to attract foreign factories: low taxes, no tariffs on imported parts, less red tape, and good roads, ports, and power.","Export processing zones are SEZs focused on assembling goods for export. Mexico's maquiladoras, factories that import parts tax-free and export finished goods, work in a similar way.","Shenzhen, one of China's first SEZs (1980), grew from a border town of about 30,000 people to over 17 million and helped launch China's industrial take-off.","For a farming country like Sulmani, factories pull workers out of agriculture into the secondary sector, bring export income, and teach new skills, which is what Rostow's take-off needs.","But SEZs can mean low wages, long hours, pollution, little tax revenue for the host country, and factories that leave when a cheaper country offers a better deal."],[["Special economic zone","An area with lower taxes and looser rules to attract foreign factories."],["Take-off","Rostow's stage when a few industries grow fast and the economy starts to industrialize."],["Export processing zone","An SEZ where factories assemble goods mainly for export."]]],
wk:["An SEZ would give Sulmani factories and jobs.","That's a start, but it stops too early. Connect the factories to take-off (workers leave farms, industry grows fast) AND name one downside."],
mw:"It explains what the zone offers (tax breaks, infrastructure, foreign factories), connects it to take-off (new leading sector pulling workers from farms), and names a clear downside (low wages, companies leaving).",
fr:"T1- A special economic zone could help Sulmani by ___. E2- For example, the zone would offer ___, so companies would ___. A3- This moves Sulmani toward take-off because ___; however, one downside is ___.",
qc:["Which is a typical feature of a special economic zone?",["Lower taxes and tariffs to attract foreign factories","A ban on all foreign companies","Higher taxes to pay for schools"],0,"SEZs relax the normal rules (taxes, tariffs, paperwork) so that foreign firms will build factories there."]},
{v:"Explain",
q:"Explain ONE limitation of using the data in the table to compare the quality of life of people in these four countries.",
sk:"Data limits and scale",
s:[["What kind of numbers are these? Who do they describe, exactly?",["Every number is ONE national figure for one year: an average (GNI per capita), a percent, or an index.","One number for a whole country can hide huge gaps: rich vs. poor regions, city vs. countryside, men vs. women."]],["Pick a country and show what the average might be hiding.",["Tessar: $31,400 per person on average, but a small oil elite could be very rich while rural families and women (GII 0.50) live on far less.","Or: Sulmani's farmers may grow and trade food that GNI only estimates or undercounts (the informal economy)."]],["Explain why that makes comparing quality of life risky.",["Two countries with similar numbers could feel very different to live in.","You'd need data at a smaller scale (regions, cities, genders) to compare fairly."]]],
r:{m:"all",i:[["Names a limitation: national figures hide regional/urban-rural/gender/rich-poor gaps, informal economy undercounted, only one year, PPP issues, or quality of life factors not measured",/average|hide|hidden|mask|gap|inequal|distribut|rich (and|vs\.?|versus|or) poor|poor (and|vs\.?|versus|or) rich|between (the )?(rich|poor|regions|cities|men|women|urban|rural|groups)|different (regions|parts|areas|groups|people)|parts of the country|urban.{0,15}rural|rural.{0,15}urban|cit(y|ies).{0,15}countryside|gender gap|one year|single year|only (one|a single|2023)|snapshot|over time|informal|unpaid|not counted|uncount|black market|\bppp\b|exchange rate|cost of living|happiness|happy|freedom|human rights|environment|pollut|safety|crime|scale|individual|each person|most people/i,"Name the limitation: these are national figures for one year, so they hide gaps between regions, cities and countryside, and men and women."],["Explains why it misleads, ideally with an example from the table",/because|so |mislead|wrong|example|even though|but|tessar|sulmani|kovar|ardena|could|might|may|can.t|cannot|not tell|don.t know/i,"Explain with an example: Tessar's $31,400 average could mean a rich oil elite and poor rural villages, so the average doesn't tell you how most people live."]]},
mo:"T1- One limitation is that every number in the table is a single national figure for a single year, which hides differences between groups inside each country. E2- For example, Tessar's $31,400 GNI per capita is an average: a small oil elite in the capital may be extremely rich while rural families and women (GII 0.50) live on far less, and Kovar's 55% service workers may be concentrated in a few big cities. A3- Because national figures flatten the gaps between rich and poor regions, genders, and the formal and informal economy, two countries with similar numbers could offer very different lives, so you would need data at a smaller scale to compare quality of life fairly.",
b:["devmeasures","scale"],
th:"But the table HAS the data. What's the limit?",
co:"The table has six numbers per country, and each one squeezes millions of lives into one number. Zoom in: does a farmer in Tessar's countryside live like someone in its oil capital? The average says yes. Reality probably says no.",
kq:"Why can't these six numbers tell you how good life really is in each country? Explain ONE reason, with an example.",
ml:["What national numbers hide",["GNI per capita, HDI, and the other indicators here are national-level figures (averages, percents, or index scores): one number for a whole country, for one year.","One number hides gaps. A country can have a wealthy capital city and desperately poor rural regions and still show a middling average.","They also undercount the informal economy: street vending and farming for your own family are often only estimated in GNI, and unpaid work at home, like cooking and childcare, isn't counted at all.","Quality of life also includes things no column here measures: safety, clean air, political freedom, and happiness.","Geographers fix this by changing scale: compare regions, cities, or genders instead of whole countries, and look at more than one year."],[["National-level data","One number (an average, percent, or index) for a whole country, which can hide big differences inside it."],["Informal economy","Work that isn't officially registered or taxed, so GNI often undercounts it."],["Scale","The level you're looking at: global, national, regional, or local."]]],
wk:["The table only has four countries.","That's about how many rows there are, not about what the numbers can tell you. Explain what the national numbers hide, like gaps between rich and poor regions or men and women."],
mw:"It names the limitation (national figures for one year), shows what they hide with a specific example (Tessar's oil elite vs. rural families), and explains why that makes comparing quality of life unreliable.",
fr:"T1- One limitation is that the numbers in the table are ___, which hide ___. E2- For example, ___. A3- This is a problem because ___, so ___.",
qc:["A country's GNI per capita is $31,400. What does that tell you about a typical rural family there?",["Not much; it's a national average that can hide big gaps","Exactly how much the family earns","That the family has a high quality of life"],0,"Per capita means divided by population. It's an average, and averages can hide huge differences inside a country."]}
]});
addBG({
u7n_weber:{t:"Weber's least-cost theory",s:["Alfred Weber's least-cost theory (1909) says a factory locates where its total costs are lowest.","His three factors: transportation (moving raw materials in and products out), labor (wages), and agglomeration (savings from clustering near similar firms).","Transportation usually matters most. Weber drew it as a triangle between two raw-material sources and one market."]},
u7n_bulk:{t:"Bulk-reducing, bulk-gaining & break-of-bulk",s:["A bulk-reducing (weight-losing) industry makes a product lighter than its inputs, so it locates near its raw materials, like copper smelting.","A bulk-gaining industry makes a product heavier, so it locates near its market, like soft-drink bottling, which adds water.","A break-of-bulk point, like a seaport, is where goods switch from one kind of transportation to another. Factories locate there to avoid loading and unloading twice."]},
u7n_indrev:{t:"The Industrial Revolution",s:["The Industrial Revolution, the shift from hand tools to machines powered by water and steam, began in Great Britain in the late 1700s.","Britain had coal and iron, capital from trade and colonies, rivers and canals, and workers pushed off farms by the Agricultural Revolution.","It spread to Western Europe and the U.S. in the early 1800s, Japan after 1868, and after World War II to newly industrialized countries like South Korea, then China."]},
u7n_deind:{t:"Deindustrialization & the Rust Belt",s:["Deindustrialization is the loss of factory jobs in a region that once depended on them, like the U.S. Rust Belt around the Great Lakes.","U.S. factory jobs peaked at about 19.5 million in 1979, then fell by about a third because of automation, offshoring, and foreign competition.","Some Rust Belt cities, like Pittsburgh, shifted to service and quaternary jobs in hospitals, universities, and tech."]},
u7n_nidl:{t:"The new international division of labor",s:["The new international division of labor (NIDL) splits the steps of making one product among different countries.","Design, research, and marketing usually stay in wealthy core countries, while assembly moves to lower-wage countries.","Nike designs shoes in Oregon but has them made in Vietnam, Indonesia, and China, through outsourcing (hiring other companies) and offshoring (moving work abroad)."]},
u7n_micro:{t:"Microloans",s:["A microloan is a very small loan, often a few hundred dollars or less, for people too poor to borrow from regular banks.","Muhammad Yunus founded Grameen Bank in Bangladesh in 1983. About 97 percent of its borrowers are women, and he and the bank won the 2006 Nobel Peace Prize.","Critics warn about high interest rates and tiny businesses that never grow, so microloans can't end poverty alone."]},
u7n_ecotour:{t:"Ecotourism",s:["Ecotourism is travel to natural areas that aims to protect the environment and benefit local people.","Costa Rica protects about a quarter of its land in parks and reserves. Rwanda charges $1,500 for a mountain gorilla permit and shares park revenue with nearby villages.","Drawbacks: crowds damage fragile places, flights add carbon emissions, and profits can leak away to foreign-owned companies."]},
u7n_sdg:{t:"The UN Sustainable Development Goals",s:["Sustainable development means meeting today's needs without harming future generations' ability to meet theirs.","In 2015, UN members adopted 17 Sustainable Development Goals (SDGs) for 2030, like no poverty (Goal 1), gender equality (Goal 5), decent work (Goal 8), and life on land (Goal 15).","Microloans to women support Goals 1 and 5; well-run ecotourism supports Goals 8 and 15."]}
});
addFRQ({k:"Practice FRQ · No stimulus",
t:"The Factory Floor",
d:"Weber's least-cost theory, the Industrial Revolution, the Rust Belt, microloans, and ecotourism.",
u:"Unit 7",
fmt:"No stimulus (like Question 1)",
intro:"Every factory sits where it does for a reason: close to its raw materials, its customers, or cheap workers. When those costs change, whole industries move, and the places they leave behind have to find a new way to make a living.",
stim:"",
bg:["u7n_weber","u7n_indrev","u7n_deind","tea"],
nt:[["What do you already know about why a factory gets built in one place and not another?","Factories go where total costs are lowest. Weber's least-cost theory names three factors: transportation, labor (wages), and agglomeration (clustering near similar firms). Heavy stuff is costly to ship, so transportation usually matters most."],["What do you already know about where the Industrial Revolution started and where it spread?","It began in Great Britain in the late 1700s with coal, iron, steam engines, and cotton mills. It spread to Western Europe and the U.S. in the early 1800s, Japan after 1868, and later to newly industrialized countries like South Korea, then China."],["What do you already know about the Rust Belt? Where is it, and why that name?","It's the old factory region of the U.S. Northeast and Midwest: Detroit, Pittsburgh, Youngstown. Starting in the 1970s, many steel mills and auto plants closed, leaving rusting factories behind. That's deindustrialization."]],
m:20,
p:[
{v:"Identify",
q:"Identify ONE of the three location factors in Alfred Weber's least-cost theory of industrial location.",
sk:"Weber's least-cost theory",
s:[["Remember Weber's big idea: a factory locates where its total costs are lowest. Which costs?",["Think: moving stuff, paying people, and who the factory's neighbors are.","One factor is about shipping, one about workers, one about clustering."]],["Name ONE of the three. One is enough.",["Shipping = transportation. Wages = labor. Clustering = agglomeration."]]],
r:{m:"any",i:[["Transportation costs",/transport|shipping|\bship|freight|distance/i,"Name transportation costs: moving raw materials in and products to market."],["Labor costs",/labou?r|wage|worker|workforce/i,"Or name labor costs: what the factory pays its workers."],["Agglomeration",/agglomerat|cluster|(near|close to) (other|similar)/i,"Or name agglomeration: the savings from clustering near similar companies."]]},
mo:"Transportation costs: the cost of moving raw materials to the factory and finished products to the market.",
b:["u7n_weber"],
th:"I remember Weber had a triangle, but what were his three factors again?",
co:"You've got the triangle right! Weber asked: where is it cheapest to make this product? Think shipping, wages, and who the factory's neighbors are.",
kq:"Weber said factories go where costs are lowest. Name ONE of his three cost factors.",
ml:["Weber's least-cost theory",["Alfred Weber said in 1909 that a factory locates where its total costs are lowest.","Transportation (moving raw materials in and goods out) usually matters most, but much cheaper labor elsewhere can pull a factory away.","Agglomeration means firms save money by clustering near similar firms, like tech companies in Silicon Valley."],[["Least-cost theory","Weber's idea that factories locate where their total costs are lowest."],["Agglomeration","The clustering of similar businesses in one area so they can share resources and save money."]]],
wk:["Good weather and cheap land.","Those can matter to real companies, but they aren't Weber's factors. Name one of his three: transportation, labor, or agglomeration."],
mw:"It names one of Weber's three factors exactly and adds a few words showing what it means.",
fr:"One location factor in Weber's least-cost theory is ___.",
qc:["Which is one of the three factors in Weber's least-cost theory?",["Agglomeration","Climate","Population density"],0,"Weber's three factors are transportation, labor, and agglomeration."]},
{v:"Describe",
q:"Describe why a bulk-reducing (weight-losing) industry, such as copper smelting, usually locates near its source of raw materials.",
sk:"Bulk-reducing industries",
s:[["Name the general idea. What happens to the weight during processing?",["The finished product weighs much less than the raw materials that went in."]],["Give specific proof about copper.",["Copper ore is usually about 1 percent copper or less. The rest is waste rock.","Crushing and smelting strip away the waste, so the copper is a tiny fraction of the ore's weight."]],["Describe why a spot near the mine is cheapest.",["Why pay to ship tons of waste rock? Process it near the mine and ship only the copper."]]],
r:{m:"all",i:[["Says the finished product weighs less than the raw materials, because waste is removed",/weigh\w* (much |way |a lot |far |so much )?less|los\w* (\w+ ){0,4}(weight|mass|bulk|size|volume)|weight (loss|drops|goes down|is (removed|lost|reduced))|reduc\w* (\w+ ){0,2}(weight|bulk|size|mass)|(less|reduced|smaller) (bulk|mass|volume)|(remov|get rid|separat|throw|leav)\w* (\w+ ){0,3}(waste|rock|weight|impurit|dirt)|heavy (\w+ )?(ore|rock|raw|material|input|waste)|lighter|\blight|waste|rock|smaller|1 ?%|one percent|impurit/i,"Say what happens: processing removes waste, so the finished copper weighs far less than the ore."],["Describes the payoff: processing near the mine cuts transportation (shipping) costs",/transport|\bship|freight|haul|\bmov(e|ing)|carry|truck|rail/i,"Describe the payoff: processing near the mine means you don't pay to ship waste rock, so transportation costs stay low."]]},
mo:"T1- A bulk-reducing industry locates near its raw materials because its finished product weighs much less than its inputs. E2- Copper ore is usually about 1 percent copper or less, so mills and smelters near mines in places like Arizona and Chile remove tons of waste rock to get a little metal. A3- Processing near the mine means only the lighter copper gets shipped, not heavy waste rock, which keeps transportation costs low.",
b:["u7n_bulk","u7n_weber"],
th:"Weight-losing? How does a factory lose weight?",
co:"Ha, not on a treadmill! The product that comes OUT weighs way less than the raw stuff that goes IN. Would you rather ship a truckload of rock, or just the bit of copper inside it?",
kq:"Why do copper smelters get built near copper mines? Describe the reason, using weight.",
ml:["Bulk-reducing vs. bulk-gaining",["A bulk-reducing industry makes a product that weighs less than its raw materials, so it locates near them. Copper ore is about 1 percent copper or less.","A bulk-gaining industry does the opposite: soft-drink bottlers add water, so they locate near customers (the market).","Either way, the goal is to keep transportation costs low."],[["Bulk-reducing industry","An industry whose final product weighs less than its inputs, so it locates near raw materials."],["Bulk-gaining industry","An industry whose final product weighs more than its inputs, so it locates near the market."]]],
wk:["Copper smelters are built near copper mines because that is where the copper is.","That's circular. Describe WHY: the ore loses most of its weight in processing, so shipping it unprocessed wastes money."],
mw:"It names the idea (the product weighs far less than the ore), gives proof (about 1 percent copper), and describes the payoff (cheaper shipping).",
fr:"T1- A bulk-reducing industry locates near its raw materials because ___. E2- For example, copper ore ___. A3- This saves money because ___.",
qc:["Which industry is bulk-GAINING and usually locates near its market?",["Soft-drink bottling","Copper smelting","Lumber milling"],0,"Bottlers add water, making the product heavier, so they locate near customers."]},
{v:"Explain",
q:"Explain ONE reason the Industrial Revolution began in Great Britain in the 1700s.",
sk:"Origins of the Industrial Revolution",
s:[["Name a reason in general words. What did Britain HAVE that factories need?",["Coal and iron, capital from trade and colonies, rivers and canals, and lots of workers."]],["Give specific proof.",["Coal fueled James Watt's improved steam engines, and iron built the machines.","Or: the Bridgewater Canal (1761) carried coal to Manchester and cut its price there roughly in half."]],["Explain HOW that let industry start in Britain first.",["Cheap fuel and iron → steam-powered factories. Money from colonial trade → investment in new mills."]]],
r:{m:"all",i:[["Names a reason: coal, iron, capital, colonies, rivers/canals, workers, inventions, or political stability",/coal|iron|resource|capital|money|wealth|invest|colon|empire|trade|river|canal|coast|labou?r|worker|agricultur|enclosure|invent|steam|stab|cotton|market/i,"Name a reason: Britain had plenty of coal and iron, money from colonial trade, or rivers and canals to move goods."],["Explains how it helped industry start: powered machines, paid for factories, or moved goods cheaply",/because|so |which|led|lead|allow|power|fuel|build|built|pay|fund|invest|gave|give|help|enabl|could|cheap|move|ship|transport|sell|suppl|provid/i,"Explain HOW: for example, coal fueled steam engines and iron built machines, so factories could run there first."]]},
mo:"T1- One reason the Industrial Revolution began in Great Britain is that it had large deposits of coal and iron ore. E2- Coal fueled the steam engines James Watt improved in the 1760s and 1770s, iron built the machines, and canals like the Bridgewater Canal (1761) moved coal cheaply to Manchester. A3- Because fuel and metal were cheap and close by, British owners could build steam-powered factories before any other country.",
b:["u7n_indrev"],
th:"Wasn't it just because Britain invented the steam engine?",
co:"That's part of it, but why did inventors succeed THERE? Look for what Britain had lying around: fuel, metal, money, water routes, and workers.",
kq:"Why did factories and machines take off in Britain before anywhere else? Explain ONE reason.",
ml:["Why Britain went first",["Britain had coal and iron ore: coal fueled steam engines and iron built the machines.","Colonies and trade supplied raw cotton, profits to invest (capital), and markets; rivers and canals made shipping cheap.","The Agricultural Revolution pushed rural workers off the land and into factory jobs."],[["Industrial Revolution","The shift from making goods by hand to making them with machines and new power sources like steam."],["Capital","Money saved up and invested to build businesses, like factories and machines."]]],
wk:["The Industrial Revolution started in Britain because Britain was rich and powerful.","Too vague. Name the specific advantage (coal and iron, colonial trade, canals) and explain how it helped factories start."],
mw:"It names an advantage (coal and iron), gives proof (Watt's steam engines, the Bridgewater Canal), and explains how it let factories start there first.",
fr:"T1- One reason the Industrial Revolution began in Great Britain is ___. E2- For example, ___. A3- This let industry start there first because ___.",
qc:["Which advantage helped Britain industrialize first?",["Large deposits of coal and iron ore","A huge supply of oil","Cheap electricity from dams"],0,"Coal powered steam engines and iron built machines. Oil and electricity came later."]},

s:[["Name a cause in general words. Why would factory jobs disappear?",["Big causes: automation, offshoring to lower-wage countries, and global competition."]],["Give specific proof.",["Robots now do much of the welding and painting on car assembly lines.","Or: after NAFTA (1994) many plants moved to Mexico, and after China joined the World Trade Organization (2001) many moved there."]],["Explain HOW that led to fewer Rust Belt factory jobs.",["Lower costs elsewhere (or machines doing the work) → Rust Belt plants close or lay off workers."]]],

mo:"T1- One cause of deindustrialization in the Rust Belt is offshoring: companies moved factory work to countries where labor costs much less. E2- After NAFTA (1994) and China's entry into the World Trade Organization (2001), many makers of auto parts and appliances opened plants in Mexico and China, where wages were far lower than in Ohio or Michigan. A3- Because the same products could be made more cheaply abroad, companies closed or shrank Rust Belt plants, which led to the loss of hundreds of thousands of factory jobs.",
b:["u7n_deind","u7n_nidl"],
th:"Didn't the factories just close because people stopped buying American stuff?",
co:"Foreign competition is a real cause! Push further: WHY could other countries sell for less? Follow one cause all the way to lost jobs.",
kq:"Why did so many factory jobs disappear from cities like Detroit and Pittsburgh? Explain ONE cause.",
ml:["Why the factory jobs left",["Automation: robots do many factory tasks, so U.S. factories make far more than in 1980 with millions fewer workers.","Offshoring: companies moved production to lower-wage countries, like Mexico after NAFTA (1994) and China after it joined the WTO (2001).","Global competition: in the 1970s and 1980s, Japanese cars and cheaper foreign steel took customers from U.S. automakers and mills."],[["Deindustrialization","The loss of manufacturing jobs and factories in a region."],["Automation","Using machines, robots, and computers to do work people used to do."],["Offshoring","Moving production or other work to another country."]]],
wk:["The factories got old and rusty.","That describes the Rust Belt, not its cause. Name a real cause (automation, offshoring, or foreign competition) and explain how it cost jobs."],
mw:"It names a cause (offshoring), gives specific proof (NAFTA, China joining the WTO), and explains how that cost Rust Belt jobs.",
fr:"T1- One cause of deindustrialization in the Rust Belt is ___. E2- For example, ___. A3- This cut factory jobs because ___, which led to ___.",
qc:["Replacing assembly-line workers with robots is an example of…",["automation","agglomeration","offshoring"],0,"Automation means machines do work people used to do, so plants need fewer workers."]},
{v:"Explain",

r:{m:"all",i:[["Names an effect: job loss, population loss, a shrinking tax base, vacant buildings, or a shift to service jobs",/job|unemploy|work|population|\bleft\b|\bleav|mov(ed|ing) away|migrat|declin|shrink|tax|bankrupt|service|vacan|abandon|empty|brownfield|poverty|poor|crime|hospital|universit/i,"Name the effect: job loss, people moving away, a shrinking tax base, empty buildings, or a shift to service jobs."],["Uses a real Rust Belt city as the example",/detroit|youngstown|pittsburgh|cleveland|flint|gary|buffalo|toledo|akron|dayton|milwaukee|chicago|scranton|erie|rochester|bethlehem|baltimore|canton/i,"Name a real city, like Detroit or Youngstown."],["Explains how losing factories caused the effect",/because|so |which|led|lead|caus|result|after|when|clos|shut|laid off|layoff/i,"Explain the chain: plants closed, so workers lost jobs and moved away, so the city lost tax money."]]},
mo:"T1- One effect of deindustrialization on Detroit, Michigan, was a huge loss of population, which shrank the city's tax base. E2- As auto plants closed or moved away, workers lost their jobs and left: Detroit fell from about 1.85 million people in 1950 to about 640,000 in 2020, leaving tens of thousands of houses vacant. A3- Because far fewer people and businesses paid taxes, the city struggled to pay for streetlights and police, which helped push Detroit into bankruptcy in 2013.",
b:["u7n_deind"],
th:"Do I have to know a specific city? I just know a lot of factories closed.",
co:"You already know one: Detroit, the Motor City! Then follow the dominoes: plants close, workers lose jobs, families move away… what happens next?",
kq:"Pick a real Rust Belt city. What happened after its factories closed? Explain ONE effect and how it happened.",
ml:["After the factories close",["Economic effects: unemployment and a shrinking tax base, so the city has less money for schools, police, and streetlights.","Social effects: people move away, leaving vacant houses, old factory sites that may be polluted (brownfields), and higher poverty. Youngstown, Ohio, shrank from about 170,000 people in 1950 to about 60,000.","Some cities reinvent themselves: Pittsburgh replaced steel jobs with service and quaternary jobs in hospitals, universities, and tech."],[["Tax base","The total value of the property, income, and sales a government can tax to pay for services. When people and businesses leave, it shrinks."],["Brownfield","An old factory or other site where possible pollution makes it harder to reuse or rebuild."]]],
wk:["Detroit became a bad place to live.","That's an opinion, not a specific effect. Name a real effect (like population loss) and explain how closing the auto plants caused it."],
mw:"It names the effect (population loss, a shrinking tax base), uses a real city with real numbers (Detroit), and explains the chain to bankruptcy.",
fr:"T1- One effect of deindustrialization on ___ was ___. E2- For example, when ___, ___. A3- This mattered because ___, which led to ___.",
qc:["Which auto-industry city lost about two-thirds of its population after 1950?",["Detroit, Michigan","Houston, Texas","Phoenix, Arizona"],0,"Detroit, the Motor City, shrank from about 1.85 million people in 1950 to about 640,000 in 2020."]},

mo:"T1- Microloans promote development by lending small amounts to poor people, especially women, who are shut out of regular banks because they have no collateral. E2- Bangladesh's Grameen Bank lends mostly to women, who use the money to buy a milk cow, a sewing machine, or a mobile phone to rent to neighbors, then repay from their sales. A3- Because she now earns her own income, a borrower can spend more on her children's food, health, and schooling and gains a bigger voice in family decisions, which reduces poverty and empowers women.",
b:["u7n_micro","u7n_sdg"],
th:"How can a loan that small change anything?",
co:"Banks doubted it too! But to someone with almost nothing, a small loan can buy a cow or a sewing machine that earns money every day. Follow it forward: her income, her kids, her voice.",
kq:"How can a tiny loan help a poor woman, and her country, develop? Explain how it works.",
ml:["Microloans: small money, big change",["Banks usually want collateral (property they can take if you don't pay), and poor women often own little or none. Many microloans, like Grameen Bank's, don't require collateral.","Grameen Bank in Bangladesh lends mostly to women (about 97 percent of borrowers); it and its founder, Muhammad Yunus, won the 2006 Nobel Peace Prize.","Women tend to spend earnings on their children's food, health, and schooling, so the benefits reach the next generation."],[["Microloan (microcredit)","A very small loan to start or grow a tiny business."],["Collateral","Property a borrower promises to give up if the loan isn't repaid."],["Empowerment","Gaining more control over your own life and choices."]]],
wk:["Microloans give people money.","That's true of every loan. Explain what the money is FOR (starting a small business) and how that leads to development."],
mw:"It explains what the loan does (money for a small business), gives a real example (Grameen Bank), and explains the payoff (income for her children and a bigger voice).",
fr:"T1- Microloans promote development by ___. E2- For example, ___. A3- This helps development because ___, which leads to ___.",
qc:["Grameen Bank, a pioneer of microloans to women, was founded in which country?",["Bangladesh","Brazil","Nigeria"],0,"Muhammad Yunus started Grameen Bank in Bangladesh; about 97 percent of its borrowers are women."]},
{v:"Explain",
q:"Explain ONE way ecotourism can support sustainable development, and explain ONE drawback of ecotourism.",

s:[["Say what ecotourism is and what sustainable development needs.",["Ecotourism = visiting nature in a way that protects it and helps locals. Sustainable development = meeting today's needs without using up what future generations need."]],["Give a specific example of ecotourism paying for protection.",["Costa Rica protects about a quarter of its land in parks and reserves.","Rwanda charges $1,500 for a mountain gorilla permit and shares park money with nearby villages."]],["Explain why that's sustainable, then add a drawback. Use “however.”",["Living forests and gorillas earn money year after year, so locals protect them. Drawbacks: crowds damage fragile places, and profits can go to foreign-owned companies."]]],
r:{m:"all",i:[["Explains how ecotourism brings money or jobs from visitors who come to see nature",/money|income|earn|revenue|\bjob|employ|work|\bfee|permit|\bpay|spend|econom|profit|business|guide|hotel|lodge/i,"Say how it helps: tourists pay to see nature, which brings jobs and income to local people."],["Connects it to sustainability: gives people a reason to protect nature for the future",/protect|conserv|preserv|\bsav|future|long.term|sustain|instead of|rather than|alive|year after year|for years|renew|environment/i,"Connect it to sustainability: because healthy forests and wildlife keep earning money, people protect them for future generations."],["Explains a drawback: crowds damage nature, travel pollution, or profits leaving the community",/however|\bbut\b|drawback|downside|although|damag|harm|crowd|too many|trash|litter|pollut|erosion|disturb|carbon|emission|flight|leak|foreign.?own|seasonal|low.?wage|\bdepend|\brely|displac|greenwash/i,"Add a drawback: for example, crowds of tourists can damage the nature they came to see."]]},
mo:"T1- Ecotourism can support sustainable development because it turns protecting nature into a source of jobs and income. E2- Costa Rica protects about a quarter of its land in parks and reserves, and tourists pay to see its cloud forests, creating jobs for local guides and lodge owners; in Rwanda, visitors pay $1,500 each to see mountain gorillas. A3- Because living forests and gorillas earn money year after year, locals have a reason to protect them for future generations; however, one drawback is that heavy tourism can damage the places visitors come to see: crowds trample trails, disturb wildlife, and lodges and roads clear forest, so if visitor numbers aren't limited, ecotourism can destroy the nature that earns the money.",
b:["u7n_ecotour","u7n_sdg"],
th:"Isn't all tourism good for a country? Why does the “eco” part matter?",
co:"Regular tourism can bulldoze beaches for resorts. In ecotourism, nature IS the attraction, so keeping it healthy keeps the money coming. Two halves here, so save room for a drawback.",
kq:"How can tourists who come to see rainforests or gorillas help a country develop without wrecking nature? And what can go wrong?",
ml:["Ecotourism and sustainability",["Sustainable development balances the economy, society, and the environment so future generations can meet their needs too.","Costa Rica's forests have grown back from about a fifth of the country in the 1980s to about half today, helped by tourism money.","Drawbacks: too many visitors can damage fragile places, flights add carbon emissions, and profits may leak to foreign-owned companies."],[["Sustainable development","Development that meets today's needs without harming future generations' ability to meet theirs."],["Ecotourism","Tourism based on visiting nature in a way that protects it and helps local communities."]]],
wk:["Ecotourism is good because people like to see animals.","Liking animals isn't a development reason. Explain how tourist money makes protecting nature pay, and add a drawback."],
mw:"It explains how ecotourism earns money (jobs, permits), connects it to sustainability (people protect what keeps paying), and adds a drawback.",
fr:"T1- Ecotourism can support sustainable development because ___. E2- For example, in ___, ___. A3- This is sustainable because ___; however, one drawback is ___.",
qc:["Which BEST describes sustainable development?",["Meeting today's needs without harming future generations' ability to meet theirs","Growing the economy as fast as possible","Stopping all development to protect nature"],0,"It balances the economy, society, and the environment, now and for the future."]}

addBG({
cashcrop:{t:"Cash crops & plantations",s:["A cash crop is grown to sell, often for export, rather than to feed the farmer's own family.","Colonial powers pushed colonies to specialize in a few crops their home factories needed, like cotton, jute (for sacks and rope), and tea.","Plantations are large estates that grow one crop for export, often with cheap or forced labor. British-owned tea estates in Assam are an example.","Depending on one or two exports leaves a region exposed to world prices it can't control."]},
portcity:{t:"Colonial port cities",s:["Colonizers built port cities as gateways, where raw materials left the colony and manufactured goods came in.","Bombay (Mumbai), Calcutta (Kolkata), and Madras (Chennai) grew from small trading posts into major cities under British rule.","Calcutta was the capital of British India until 1911, when the capital moved to Delhi.","Many former colonies still have a primate city, one city far larger than all the others, that began as a colonial port."]},
famine:{t:"Famines in colonial India",s:["Several deadly famines struck British India in the late 1800s. The Great Famine of 1876–78 alone killed millions of people.","Droughts caused the crop failures, but colonial policy made them worse: grain kept being exported, and relief was limited.","Farmers who grew cash crops had little stored food. To buy food, they depended on what their crops sold for (or on wages) and on food prices at the market.","Historians point to these famines as evidence that colonial economic choices shaped life-and-death outcomes."]},
wst:{t:"Wallerstein's world-system theory",s:["Immanuel Wallerstein divided the world economy into the core, the semi-periphery, and the periphery.","Core countries are wealthy and industrialized, and they make high-value goods.","Periphery countries supply raw materials and cheap labor, and they earn far less.","Colonialism helped build this pattern by locking colonies into shipping raw materials to the core.","The theory's big idea: countries are linked, and the core's wealth depends partly on the periphery."]},
uneven:{t:"Uneven development",s:["Development is rarely spread evenly inside a country.","Places that get early investment, such as ports, railways, and factories, attract more businesses and workers, which attracts even more investment.","Geographers call this snowball effect cumulative causation.","The result is a core region that keeps growing while peripheral regions fall behind, and the gap can last for generations."]}
});

Nagpur</text><text x=\"40\" y=\"146\">Ahmedabad</text><text x=\"96\" y=\"262\">Bangalore</text>\n<g font-size=\"9\" fill=\"#ffe7a6\"><text x=\"60\" y=\"79\">WHEAT</text><text x=\"98\" y=\"190\">COTTON</text><text x=\"232\" y=\"128\">JUTE</text><text x=\"276\" y=\"96\">TEA</text></g>\n<g font-size=\"9\" fill=\"#7fb6ff\" font-style=\"italic\"><text x=\"10\" y=\"276\">Arabian Sea</text><text x=\"214\" y=\"246\">Bay of Bengal</text></g>\n<text x=\"306\" y=\"300\" font-size=\"12\">N</text></g>\n<path d=\"M310 290 l5 -14 l5 14 z\" fill=\"#ffd23f\" stroke=\"#000\"/>\n</svg><div class=\"legend\"><span><i style=\"background:repeating-linear-gradient(90deg,#ffd23f 0 5px,#0c0920 5px 7px);height:5px;width:18px;border:0;vertical-align:3px\"></i>Railway</span><span><i style=\"background:#22e5ff;border-radius:50%\"></i>Port city</span><span><i style=\"background:#fff\"></i>Inland city</span><span><i style=\"background:#8f7b4c\"></i>Wheat</span><span><i style=\"background:#82879e\"></i>Cotton</span><span><i style=\"background:#a76644\"></i>Jute</span><span><i style=\"background:#33976f\"></i>Tea</span></div><p class=\"src\">Schematic map created for practice. Simplified, not to scale.</p>",

kq:"Look at where the railroad lines go. What shape or pattern do they make? Name it in a few words.",
ml:["Reading spatial patterns",["Geographers describe where things are and how they're arranged: clustered, spread out, in a line, or pointing toward one place.","When many lines meet at one spot, they converge. That spot is usually important, like a port or a capital.","On this map, ask: do the rails connect interior cities to EACH OTHER, or do they mostly run toward the coast?"],[["Spatial pattern","How things are arranged across space."],["Converge","Come together at one point."],["Interior","Land far from the coast."]]],
