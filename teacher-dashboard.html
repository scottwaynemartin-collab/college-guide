<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Dashboard</title>
<!--
  CLASSROOM DASHBOARD — Panther Creek edition. One self-contained file, no network calls.

  PRIVACY: Everything runs inside your browser. Data you paste or import is saved
  in this browser's local storage and never leaves this computer.

  HOW TO CHANGE IT
  - Quick tweaks (cutoff, retest cap, names, which cards show): Settings, no code.
  - Bigger changes: search for "EDIT ME".
      • CONFIG         — defaults, course order, retest rules, platforms.
      • OVERVIEW_CARDS — the cards at the bottom of the Overview page.
      • CHROME_PROMPT  — the instructions you paste into Claude in Chrome.
  - Or ask Claude: "add a ___ to my dashboard".

  DATA FORMATS
    Grades:   Student,Student ID,Class,Platform,<assignment>,<assignment>,...
              Classes look like "APHG 3B" (course + period). Assignments may be prefixed
              with their course, e.g. "APHG · Unit 2 Test", so they count only for that course.
    Optional "School Year" column (e.g. 2025-26) tags older data; it's used only in Compare.
    Profile:  Student,Student ID,Class,8th STAAR %,8th STAAR Level,AP Exam
              Matched on Student ID. Never counted in averages. AP Exam = Paid / Unpaid / Opted out.

  Works inside a claude.ai artifact: no pop-ups (confirm/prompt/alert), no new windows,
  and file downloads fall back to an in-page copy box.
-->
<style>
:root{
  color-scheme:light;
  --bg:#eef2f2;--card:#fff;--card2:#f6f9f9;--ink:#0b0d0e;--ink2:#424d4f;--ink3:#667375;--line:#dce4e4;--line2:#c9d4d4;
  --blk:#050606;--blk2:#121617;--blk3:#1d2324;--on-blk:#f3f7f7;--on-blk2:#a9b6b7;
  --tq:#00b2a9;--tq-ink:#00716b;--tq-soft:#d9f4f2;--tq-hi:#3fe0d6;--silver:#c5cfd0;
  --ok:#00b2a9;--ok-ink:#00665f;--ok-bg:#d9f4f2;
  --watch:#f5a524;--watch-ink:#8a5300;--watch-bg:#fff0d2;
  --help:#e5484d;--help-ink:#b3121f;--help-bg:#fde6e8;
  --drop-ink:#5a3fb8;--drop-bg:#ece8fb;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#8a979a;
  --r3:#e34948;--r2:#ec8f8e;--r1:#f6c9c8;--mid:#e3e8e8;--b1:#9ec5f4;--b2:#5598e7;--b3:#256abf;--empty:#f2f5f5;
  --display:"Helvetica Neue","Arial Narrow",Arial,"Segoe UI",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0c0c;--card:#131718;--card2:#191e1f;--ink:#eef4f4;--ink2:#b8c4c5;--ink3:#8d9a9b;--line:#252c2d;--line2:#323b3c;
  --tq-ink:#3fd6cd;--tq-soft:#0f2e2c;
  --ok-ink:#3fd6cd;--ok-bg:#0f2e2c;--watch-ink:#ffc15c;--watch-bg:#3a2a0d;--help-ink:#ff8a8f;--help-bg:#3d1518;--drop-ink:#b5a6ff;--drop-bg:#272045;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#8d9a9b;
  --r3:#e66767;--r2:#b44a4a;--r1:#5a2b2b;--mid:#2f3637;--b1:#1c4a80;--b2:#2f74c9;--b3:#6da7ec;--empty:#1a1f20;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tq);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--blk);color:var(--on-blk);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:18px 12px;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.mark{width:38px;height:38px;border-radius:10px;background:var(--tq);color:var(--blk);display:grid;place-content:center;font:900 15px/1 var(--display);letter-spacing:-.04em;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.brand b{display:block;font:900 15px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em}
.brand small{display:block;font-size:11px;color:var(--tq-hi);letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-top:2px}
.nav{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:10px 11px;border-radius:10px;color:var(--on-blk2);text-align:left;font-weight:600;min-height:42px}
.nav:hover{background:var(--blk3);color:var(--on-blk)}
.nav[aria-current="page"]{background:var(--tq);color:var(--blk)}
.nav svg{width:18px;height:18px;flex:none}
.nav .ct{margin-left:auto;font-size:11px;font-weight:800;border-radius:7px;padding:1px 7px;background:var(--blk3);color:var(--on-blk)}
.nav[aria-current="page"] .ct{background:var(--blk);color:var(--tq-hi)}
.nav .ct.hot{background:var(--help);color:#fff}
.navlbl{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6f7d7f;padding:16px 11px 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:14px}
.lock{font-size:11px;color:#7d8b8d;padding:8px 11px;line-height:1.45}
.main{min-width:0;display:flex;flex-direction:column}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 28px 10px}
.toprow{display:flex;align-items:center;gap:12px}
.toprow .sp{flex:1}
.seg{display:inline-flex;background:var(--blk);border-radius:12px;padding:4px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;color:var(--on-blk2);font:800 13px/1 var(--sans);padding:9px 14px;border-radius:9px;white-space:nowrap;letter-spacing:.01em}
.seg button:hover{color:#fff}
.seg button[aria-pressed="true"]{background:var(--tq);color:var(--blk)}
.seg button em{font-style:normal;font-weight:700;opacity:.7;margin-left:6px;font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{border:1.5px solid var(--line2);background:var(--card);color:var(--ink2);font:700 12px/1 var(--sans);padding:7px 12px;border-radius:999px;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chips .lbl{font:800 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 2px 0 6px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line2);border-radius:10px;padding:7px 11px;width:250px}
.search:focus-within{border-color:var(--tq)}
.search input{border:0;background:none;outline:none;width:100%;font-size:13px}
kbd{font:700 10px var(--sans);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink3)}
.iconbtn{display:inline-grid;place-content:center;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line2);background:var(--card)}
.menu-btn{display:none}
.content{padding:24px 28px 56px;flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line2);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;min-height:38px;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--tq);border-color:var(--tq);color:var(--blk)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.blk{background:var(--blk);border-color:var(--blk);color:#fff}
.btn.danger{color:var(--help-ink);border-color:var(--help)}
.btn.dangerfill{background:var(--help);border-color:var(--help);color:#fff}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12px}
.link{background:none;border:0;padding:0;color:var(--tq-ink);font-weight:700;font-size:12px}
.link:hover{text-decoration:underline}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{background:var(--blk);color:var(--on-blk);border-radius:20px;padding:26px 26px 22px;position:relative;overflow:hidden;margin-bottom:18px}
.hero:before{content:"";position:absolute;right:-60px;top:-80px;width:360px;height:360px;background:repeating-linear-gradient(135deg,rgba(0,178,169,.20) 0 14px,transparent 14px 34px);transform:rotate(8deg);border-radius:40px;pointer-events:none}
.hero-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;position:relative}
.eyebrow{font:800 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--tq-hi);display:flex;gap:8px;align-items:center}
.eyebrow i{width:8px;height:8px;border-radius:2px;background:var(--tq)}
.phead .eyebrow{color:var(--tq-ink)}
.hero h1{font:900 40px/1 var(--display);text-transform:uppercase;letter-spacing:-.025em;margin:8px 0 6px}
.hero p{margin:0;color:var(--on-blk2);font-size:14px}
.hero p b{color:#fff}
.syncs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--on-blk2);background:var(--blk3);border-radius:999px;padding:4px 10px 4px 8px}
.sync i{width:8px;height:8px;border-radius:2px}
.sync.stale{color:var(--watch);box-shadow:inset 0 0 0 1px rgba(245,165,36,.5)}
.hero .btn{background:var(--blk3);border-color:var(--blk3);color:#fff}
.hero .btn.pri{background:var(--tq);border-color:var(--tq);color:var(--blk)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;position:relative}
.tiles.four{grid-template-columns:repeat(3,1fr) .78fr}
.tile{position:relative;text-align:left;border:0;border-radius:16px;padding:16px 18px 16px;background:var(--blk2);color:var(--on-blk);overflow:hidden;min-height:150px;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px var(--blk3)}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile:hover{box-shadow:inset 0 0 0 2px var(--c)}
.tile[aria-pressed="true"]{background:var(--c);color:var(--blk);box-shadow:none}
.tile[aria-pressed="true"] .tl,.tile[aria-pressed="true"] .tf{color:rgba(0,0,0,.72)}
.tile .tl{font:800 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--on-blk2);display:flex;align-items:center;gap:8px}
.tile .ic{display:grid;place-content:center;width:22px;height:22px;border-radius:6px;background:var(--c);color:var(--blk);font:900 13px/1 var(--sans)}
.tile[aria-pressed="true"] .ic{background:var(--blk);color:var(--c)}
.tile .tn{font:900 64px/1 var(--display);letter-spacing:-.04em;margin:12px 0 4px}
.tile .tf{font-size:12px;color:var(--on-blk2);margin-top:auto;display:flex;justify-content:space-between;gap:8px}
.tile .bar{height:6px;border-radius:3px;background:var(--blk3);margin-top:10px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.tile[aria-pressed="true"] .bar{background:rgba(0,0,0,.18)}
.tile[aria-pressed="true"] .bar i{background:var(--blk)}
.t-ok{--c:var(--ok)}.t-watch{--c:var(--watch)}.t-help{--c:var(--help)}.t-ap{--c:var(--silver)}

/* page head */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.phead h1{font:900 34px/1 var(--display);text-transform:uppercase;letter-spacing:-.025em}
.phead p{margin:6px 0 0;color:var(--ink2);max-width:680px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04);min-width:0;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.ch h2{font:900 14px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.ch .sub{color:var(--ink3);font-size:12px}
.ch .sp{flex:1}
.cb{padding:4px 16px 16px;flex:1}
.w3{grid-column:span 3}.w4{grid-column:span 4}.w5{grid-column:span 5}.w6{grid-column:span 6}.w7{grid-column:span 7}.w8{grid-column:span 8}.w12{grid-column:span 12}
.empty{color:var(--ink3);font-size:13px;padding:26px 8px;text-align:center}
.count{display:inline-grid;place-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:7px;background:var(--ink);color:var(--card);font:800 12px/1 var(--sans)}
.count.help{background:var(--help);color:#fff}

/* tags, pills, badges */
.tag{display:inline-flex;align-items:center;gap:4px;font:800 11px/1 var(--sans);padding:4px 7px;border-radius:6px;white-space:nowrap}
.tag.below{background:var(--help-bg);color:var(--help-ink)}
.tag.missing{background:var(--watch-bg);color:var(--watch-ink)}
.tag.dropping{background:var(--drop-bg);color:var(--drop-ink)}
.tag.gap{background:var(--tq-soft);color:var(--tq-ink)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font:800 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}.pill.watch{background:var(--watch-bg);color:var(--watch-ink)}.pill.help{background:var(--help-bg);color:var(--help-ink)}.pill.none{background:var(--line);color:var(--ink2)}
.staar{display:inline-flex;align-items:center;gap:3px;font:800 9.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:5px;white-space:nowrap;vertical-align:1px;margin-left:6px;border:1.5px solid currentColor}
.staar.s-masters{color:var(--ok-ink);background:var(--ok-bg)}
.staar.s-meets{color:var(--s1);background:transparent}
.staar.s-approaches{color:var(--watch-ink);background:var(--watch-bg)}
.staar.s-dnm{color:var(--help-ink);background:var(--help-bg)}
.apx{display:inline-flex;align-items:center;gap:3px;font:800 9.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:5px;margin-left:4px;background:var(--ink);color:var(--card);vertical-align:1px}

/* roster */
.rhead,.rrow{display:grid;grid-template-columns:minmax(200px,1.7fr) 110px 70px minmax(150px,1.6fr) 104px;gap:12px;align-items:center}
.rhead{font:800 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:6px 10px;border-bottom:1.5px solid var(--ink)}
.rrow{padding:10px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.rrow:hover{background:var(--card2)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-content:center;font:800 12px var(--sans);color:#fff}
.who b{display:flex;align-items:center;font-weight:800;white-space:nowrap;min-width:0}
.who b .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.who b .staar,.who b .apx{flex:none}
.who small{display:block;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font:900 20px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big.help{color:var(--help-ink)}
.minor{font-size:11px;color:var(--ink3)}
.num{font-variant-numeric:tabular-nums}
select.btn{padding-right:30px}

/* grab list & side lists */
.grab{display:flex;flex-direction:column}
.gi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.gi:last-child{border-bottom:0}
.gi:hover{background:var(--card2)}
.gi .tags{margin-top:5px}
.rank{font:900 12px var(--display);color:var(--ink3);width:18px;text-align:right}
.alinks{display:grid;gap:10px}
.alink{display:flex;align-items:center;gap:12px;border:0;background:var(--card2);border-radius:12px;padding:12px 14px;text-align:left;box-shadow:inset 0 0 0 1px var(--line)}
.alink:hover{box-shadow:inset 0 0 0 2px var(--tq)}
.alink .n{font:900 28px/1 var(--display);min-width:44px;letter-spacing:-.03em}
.alink b{display:block;font-weight:800}
.alink small{color:var(--ink3);font-size:12px}
.alink .go{margin-left:auto;font-weight:900;color:var(--tq-ink)}

/* bar chart */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative;height:220px;display:flex;padding-left:34px}
.yax{position:absolute;left:0;top:0;bottom:22px;width:100%;pointer-events:none}
.yax div{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:10px;color:var(--ink3)}
.yax div span{position:absolute;top:-7px;left:0;width:28px;text-align:right}
.yax div.cut{border-top:2px dashed var(--help)}
.yax div.cut span{color:var(--help-ink);font-weight:800}
.bars{position:relative;flex:1;display:flex;align-items:flex-end;gap:3px;padding-bottom:22px}
.bar{flex:1;max-width:60px;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;background:none;border:0;padding:0 1px}
.bar i{display:block;width:100%;max-width:16px;border-radius:4px 4px 0 0;min-height:2px}
.bar:hover i,.bar:focus-visible i{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.bar em{position:absolute;bottom:-20px;left:0;font-size:10px;color:var(--ink3);font-style:normal;white-space:nowrap;max-width:var(--lw,60px);overflow:hidden;text-overflow:ellipsis}

/* platforms */
.srcrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.srcrow:last-child{border-bottom:0}
.srclogo{width:34px;height:34px;border-radius:10px;display:grid;place-content:center;color:#fff;font:900 12px var(--sans);flex:none}
.srcrow b{display:block}
.srcrow small{color:var(--ink3);font-size:11px}
.srcrow .rt{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* heatmap */
.hm-wrap{overflow:auto}
.hm{border-collapse:separate;border-spacing:2px;font-size:11px;width:100%}
.hm th{font-weight:600;color:var(--ink3);text-align:left;white-space:nowrap;padding-right:8px}
.hm th:first-child{width:1%}
.hm thead th{writing-mode:vertical-rl;transform:rotate(180deg);height:96px;vertical-align:bottom;font-size:10px;padding:0 0 4px}
.hm td{height:20px;min-width:16px;border-radius:3px;padding:0;text-align:center;font:800 9px var(--sans)}
.hm td.m{background:repeating-linear-gradient(45deg,var(--help-bg) 0 3px,var(--card) 3px 6px);color:var(--help-ink);box-shadow:inset 0 0 0 1px var(--help)}
.hm td.x{background:var(--empty);color:var(--ink3)}
.hm td.n{background:var(--empty)}
.hm .nm button{background:none;border:0;padding:0;color:var(--ink2);font-size:11px;font-weight:600}
.hm .nm button:hover{color:var(--ink);text-decoration:underline}
.scale{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink3);flex-wrap:wrap;margin-top:10px}
.scale i{width:18px;height:12px;border-radius:2px;display:inline-block}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);padding:14px 16px}
.stat b{display:block;font:900 30px/1 var(--display);letter-spacing:-.03em}
.stat span{font:800 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.stat.accent{background:var(--blk);color:#fff;box-shadow:none}
.stat.accent b{color:var(--tq-hi)}
.stat.accent span{color:var(--on-blk2)}

/* retests */
.tabs{display:inline-flex;background:var(--card);border-radius:10px;padding:3px;gap:2px;box-shadow:inset 0 0 0 1.5px var(--line2)}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:800;font-size:12px;color:var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rcard{background:var(--card);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.rcard .who{cursor:pointer}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:13px;padding:7px 10px;border-radius:9px;background:var(--card2)}
.trow .sc{font:900 15px var(--display);font-variant-numeric:tabular-nums}
.gain{font:800 11px var(--sans);color:var(--ok-ink);background:var(--ok-bg);border-radius:6px;padding:3px 6px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:1px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font:800 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
table.t th button{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t .r{text-align:right}
.namechips{display:flex;gap:4px;flex-wrap:wrap}
.nchip{border:0;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);border-radius:7px;padding:4px 8px;font-size:12px;font-weight:600}
.nchip b{font-weight:900;margin-left:4px}
.nchip:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}

/* power hour */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ph{background:var(--card);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.ph-h{background:var(--blk);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.ph-h h3{font:900 18px/1 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.ph-h .count{background:var(--tq);color:var(--blk);margin-left:auto}
.ph-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.ph-row:last-child{border-bottom:0}
.ph-row.out{opacity:.45}
.ph-row.out .who b{text-decoration:line-through}
.ph-row input{width:18px;height:18px;accent-color:var(--tq)}

/* missing board */
.mm{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 290px;background:var(--card2);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;max-height:70vh}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1.5px solid var(--ink)}
.col-h h3{font:900 15px/1 var(--display);text-transform:uppercase}
.col-h .count{margin-left:auto}
.col-b{padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.mcard{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:10px 12px;border:0;text-align:left;width:100%}
.mcard:hover{box-shadow:0 0 0 2px var(--ink)}
.mcard .who{margin-bottom:8px}
.mtags{display:flex;gap:4px;flex-wrap:wrap}
.mt{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--help-bg);color:var(--help-ink);display:inline-flex;align-items:center;gap:4px}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(5,6,6,.5);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(720px,100%);height:100%;background:var(--bg);overflow:auto}
.dtop{background:var(--blk);color:#fff;padding:20px 22px 18px;position:relative}
.dtop .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dtop h2{font:900 28px/1 var(--display);text-transform:uppercase;letter-spacing:-.02em}
.dtop .minor{color:var(--on-blk2)}
.dtop .x{margin-left:auto;display:flex;gap:6px}
.dtop .btn{background:var(--blk3);border-color:var(--blk3);color:#fff}
.cls-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cc{background:var(--blk2);box-shadow:inset 0 0 0 1px var(--blk3);border-radius:10px;padding:8px 12px;min-width:110px}
.cc span{font:800 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--on-blk2)}
.cc b{display:block;font:900 22px/1.1 var(--display)}
.cc.help b{color:#ff8a8f}.cc.watch b{color:#ffc15c}.cc.ok b{color:var(--tq-hi)}
.dbody{padding:18px 22px 40px;display:flex;flex-direction:column;gap:16px}
.sec h3{font:900 13px var(--display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.plat{display:grid;gap:10px}
.pcol{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);overflow:hidden;min-width:0}
.pcol-h{padding:10px 12px;border-top:5px solid var(--c);display:flex;align-items:baseline;gap:8px}
.pcol-h b{font-weight:800}
.pcol-h .big{margin-left:auto}
.pcol-b{padding:0 12px 10px}
.prow{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow span:first-child{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow b{font-variant-numeric:tabular-nums}
.prow .ms{color:var(--help-ink);font-weight:800}
.profile{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.profile div{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:12px}
.profile span{display:block;font:800 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.profile b{display:block;font:900 20px/1.15 var(--display);margin-top:4px}
.spark{width:100%;height:auto;display:block;overflow:visible}
.spark .ln{fill:none;stroke:var(--tq);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:var(--tq);opacity:.12}
.spark .gr{stroke:var(--line);stroke-width:1}
.spark .ct{stroke:var(--help);stroke-width:1.5;stroke-dasharray:4 4}
.spark circle{stroke:var(--card);stroke-width:2}
.spark .hit{fill:transparent}
.panel{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:14px}
.notes .n{border-left:3px solid var(--tq);padding:4px 10px;margin:8px 0;font-size:13px}
.notes .n small{display:block;color:var(--ink3);font-size:11px}
textarea.in,input.in{width:100%;border:1.5px solid var(--line2);border-radius:10px;padding:8px 11px;background:var(--card);color:var(--ink);font-size:13px}
textarea.code{font:12px/1.5 var(--mono);min-height:220px;resize:vertical}
.modal-wrap{justify-content:center;align-items:flex-start;padding:6vh 16px;overflow:auto}
.modal{width:min(760px,100%);background:var(--card);border-radius:16px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.small{width:min(460px,100%)}
.modal .dh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.modal .dh h2{font:900 20px var(--display);text-transform:uppercase}
.modal .dh .x{margin-left:auto}
.modal p{color:var(--ink2);margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:12px}
.field input,.field select,.field textarea{border:1.5px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 11px;font-size:13px;color:var(--ink);font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.cols{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.cols label{display:grid;grid-template-columns:22px 1fr 110px 70px;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px}
.cols label:last-child{border-bottom:0}
.cols input[type=number]{width:70px;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;background:var(--card)}
.cols .smp{color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink2);margin-bottom:12px}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:30px 18px;text-align:center;background:var(--card2)}
.drop.over{border-color:var(--tq);background:var(--tq-soft)}
.drop h3{font:900 18px var(--display);text-transform:uppercase;margin-bottom:8px}
.prompt{white-space:pre-wrap;font:12px/1.55 var(--mono);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:270px;overflow:auto;color:var(--ink2)}
.paste textarea{width:100%;min-height:150px;border:1.5px solid var(--line2);border-radius:10px;padding:10px 12px;font:12px/1.5 var(--mono);background:var(--card);color:var(--ink);resize:vertical}
.toggle{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.toggle input{width:17px;height:17px;accent-color:var(--tq)}
.banner{display:flex;gap:10px;align-items:center;background:var(--watch-bg);color:var(--watch-ink);border-radius:12px;padding:9px 14px;font-size:12px;font-weight:700;margin-bottom:14px}
.banner .sp{flex:1}
.welcome{background:var(--blk);color:#fff;border-radius:20px;padding:40px 34px;position:relative;overflow:hidden}
.welcome:before{content:"";position:absolute;right:-80px;top:-60px;width:420px;height:420px;background:repeating-linear-gradient(135deg,rgba(0,178,169,.22) 0 16px,transparent 16px 38px);border-radius:50px;transform:rotate(10deg)}
.welcome h1{font:900 48px/1 var(--display);text-transform:uppercase;letter-spacing:-.03em;max-width:640px;position:relative;margin:10px 0 12px}
.welcome h1 em{font-style:normal;color:var(--tq)}
.welcome p{color:var(--on-blk2);max-width:600px;position:relative;margin:0 0 20px}
.welcome .actions{position:relative}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px;position:relative}
.step{background:var(--blk2);border-radius:14px;padding:16px;box-shadow:inset 0 0 0 1px var(--blk3)}
.step b{display:grid;place-content:center;width:26px;height:26px;border-radius:8px;background:var(--tq);color:var(--blk);font:900 13px var(--sans);margin-bottom:10px}
.step h3{font:800 14px var(--sans);margin-bottom:4px}
.step p{font-size:12px;margin:0;color:var(--on-blk2)}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--blk);color:#fff;font-size:12px;line-height:1.4;padding:7px 10px;border-radius:8px;max-width:280px;opacity:0;transition:opacity .08s;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blk);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:90;opacity:0;transition:.2s;pointer-events:none;box-shadow:inset 0 -3px 0 var(--tq)}
#toast.on{opacity:1}

/* compare */
.gchart{position:relative;height:200px;display:flex;padding-left:34px;margin-top:4px}
.ggroups{position:relative;flex:1;display:flex;gap:8px;padding-bottom:22px}
.gg{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
.gbars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;position:relative}
.gb{width:min(16px,28%);border-radius:4px 4px 0 0;min-height:2px}
.gb:hover{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.gg>em{position:absolute;bottom:-20px;font:800 10px var(--sans);color:var(--ink3);font-style:normal}
.stu{position:absolute;left:8%;right:8%;height:0;border-top:3px solid var(--ink);z-index:2}
.stu:after{content:"";position:absolute;left:50%;top:-6px;width:8px;height:8px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
.delta{font-weight:800;font-variant-numeric:tabular-nums}.delta.up{color:var(--ok-ink)}.delta.down{color:var(--help-ink)}
/* AP projection */
.apb{display:inline-grid;place-content:center;min-width:28px;height:28px;padding:0 6px;border-radius:8px;font:900 15px/1 var(--display)}
.apb.big{min-width:44px;height:44px;font-size:24px;border-radius:12px}
.apb.a5{background:#00857e;color:#fff}.apb.a4{background:var(--tq);color:var(--blk)}.apb.a3{background:var(--line);color:var(--ink)}.apb.a2{background:var(--help-bg);color:var(--help-ink);box-shadow:inset 0 0 0 1.5px var(--help)}.apb.a1{background:var(--help);color:#fff}
.tag.ap{background:var(--ink);color:var(--card)}
.dist{display:flex;flex-direction:column;gap:6px}
.drow{display:grid;grid-template-columns:30px 1fr 54px;gap:10px;align-items:center;font-size:12px}
.drow .tr{height:16px;border-radius:4px;background:var(--empty);overflow:hidden}
.drow .tr i{display:block;height:100%;border-radius:0 4px 4px 0}
.drow b{text-align:right;font-variant-numeric:tabular-nums}
.d5{background:#00857e}.d4{background:var(--tq)}.d3{background:#9aa7a9}.d2{background:#ec8f8e}.d1{background:var(--help)}
.apgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.aprow{display:grid;grid-template-columns:1fr 58px 58px 58px 44px;gap:8px;align-items:center;padding:8px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;font-size:12px}
.aprow:hover{background:var(--card2)}
.aprow.head{font:800 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);cursor:default}
.aprow.head:hover{background:none}
.aprow .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.aprow.flag{background:color-mix(in srgb,var(--help-bg) 55%,transparent)}

/* in-page print area (no new windows, so it works inside artifacts) */
#printArea{display:none}
#printArea .hd{border-bottom:4px solid #00b2a9;padding-bottom:10px;margin-bottom:16px}
#printArea .hd small{color:#556;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
#printArea h1{font:900 30px/1.05 var(--display);text-transform:uppercase;margin:4px 0 0;letter-spacing:-.02em}
#printArea h2{font:900 16px var(--display);text-transform:uppercase;background:#050606;color:#fff;padding:6px 10px;margin:18px 0 6px}
#printArea table{width:100%;border-collapse:collapse;font-size:12px}
#printArea td,#printArea th{padding:6px 8px;border-bottom:1px solid #dce4e4;text-align:left}
#printArea th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#556}
#printArea .r{text-align:right}
#printArea .box{display:inline-block;width:12px;height:12px;border:1.5px solid #000;margin-right:8px;vertical-align:-2px}
#printArea section{break-inside:avoid}

@media (max-width:1180px){.w4,.w5,.w7,.w8{grid-column:span 12}.w3,.w6{grid-column:span 6}.strip{grid-template-columns:repeat(2,1fr)}.tiles.four{grid-template-columns:repeat(4,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;z-index:60;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .2s;box-shadow:6px 0 24px rgba(0,0,0,.35)}
  aside.open{transform:none}
  .menu-btn{display:inline-grid}
  .top{padding:10px 14px 8px}
  .toprow{flex-wrap:wrap}
  .search{order:5;width:100%}
  .content{padding:14px 14px 48px}
  .hero{padding:20px 16px 16px;border-radius:16px}
  .hero h1{font-size:30px}
  .tiles,.tiles.four{gap:8px;grid-template-columns:repeat(3,1fr)}
  .tiles.four .t-ap{grid-column:span 3;min-height:0;flex-direction:row;align-items:center;gap:12px}
  .tiles.four .t-ap .tn{font-size:30px;margin:0}
  .tiles.four .t-ap .tf,.tiles.four .t-ap .bar{display:none}
  .tile{min-height:118px;padding:12px 10px 12px 14px}
  .tile .tn{font-size:40px;margin:8px 0 2px}
  .tile .tl{font-size:10px;letter-spacing:.08em}
  .tile .ic{display:none}
  .tile .tf span:last-child{display:none}
  .w3,.w6{grid-column:span 12}
  .rhead{display:none}
  .rrow{grid-template-columns:1fr auto;grid-template-areas:"who avg" "tags st";row-gap:8px}
  .rrow>:nth-child(1){grid-area:who}.rrow>:nth-child(2){grid-area:avg;text-align:right}.rrow>:nth-child(3){display:none}.rrow>:nth-child(4){grid-area:tags}.rrow>:nth-child(5){grid-area:st;justify-self:end}
  .phead h1{font-size:28px}
  .strip{grid-template-columns:repeat(2,1fr)}
  .row2,.row3,.steps{grid-template-columns:1fr}
  .profile{gap:6px}.profile div{padding:9px}.profile b{font-size:15px}.profile span{font-size:9px;letter-spacing:.06em}
  .who b{flex-wrap:wrap;white-space:normal;row-gap:2px}.who b .staar{margin-left:0}.who b .nm{margin-right:6px}
  .welcome{padding:28px 20px}.welcome h1{font-size:34px}
  .cols label{grid-template-columns:22px 1fr 70px}.cols .smp{display:none}
  .col{flex-basis:84vw}
  .plat{grid-template-columns:1fr!important}
  .apgrid{grid-template-columns:1fr}
  .aprow{grid-template-columns:1fr 46px 46px 40px}.aprow>:nth-child(3){display:none}
}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block;color:#000;background:#fff;font:13px/1.5 var(--sans)}
  body:not(.printing) aside,body:not(.printing) .top,body:not(.printing) .actions{display:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side" aria-label="Main navigation"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="layer"></div>
<div id="printArea"></div>
<input type="file" id="fileIn" accept=".csv,.tsv,.txt" multiple hidden>

<script>
/* =====================================================================
   EDIT ME: CONFIG — defaults. Settings (inside the dashboard) override these.
   ===================================================================== */
const CONFIG = {
  title: 'Classroom',
  school: 'Panther Creek',
  teacherName: '',
  atRisk: 70,                 // below this = Needs Help, and goes on the Power Hour list
  watchBand: 10,              // within this many points above the cutoff = Watch
  retestCap: 80,              // Frisco caps retests at 80, so only scores under 80 qualify
  retestPattern: '\\b(test|exam|progress check|assessment)\\b',   // which assignments count as tests
  missingForHelp: 3,          // this many missing = Needs Help even with a passing average
  dropPts: 8,                 // last 3 scores this far below earlier ones = "dropping"
  gapPts: 15,                 // platform averages this far apart = "platform gap"
  staleDays: 7,
  scale: [[90,'A'],[80,'B'],[70,'C'],[60,'D'],[0,'F']],
  courseOrder: ['APHG','AP World','AP Euro'],
  currentYear: '',            // blank = automatic (Aug–Jul), e.g. "2026-27"
  // AP projection — Proficiency Scaling reference: composite % → AP score
  apScale: [[85,5],[70,4],[55,3],[40,2],[0,1]],
  apRecency: 0.5,             // Unit N counts 1 + (N-1)×this, so recent units weigh more
  mcWeight: {'APHG':0.5, 'AP World':0.4, 'AP Euro':0.4, default:0.5},   // MC share when writing % exists
  // Platform colors come from a colorblind-checked palette; keep this order.
  sources: [
    {id:'Gradebook',    color:'var(--s1)', short:'GB'},
    {id:'Canvas',       color:'var(--s2)', short:'CV'},
    {id:'AP Classroom', color:'var(--s3)', short:'AP'},
    {id:'Other',        color:'var(--s4)', short:'··'},
  ],
};
/* 8th-grade STAAR performance levels, best first */
const STAAR = [
  {id:'masters',    label:'Masters',      short:'Masters'},
  {id:'meets',      label:'Meets',        short:'Meets'},
  {id:'approaches', label:'Approaches',   short:'Approaches'},
  {id:'dnm',        label:'Did Not Meet', short:'DNM'},
];
const AP_EXAM = {paid:'Paid', unpaid:'Unpaid', opted:'Opted out'};

/* ---------- storage (browser only) ---------- */
const KEY = 'classroomDashboard.v1';
const blank = () => ({students:{}, idmap:{}, assignments:{}, scores:{}, notes:{}, profiles:{}, imports:[], mappings:{}, settings:{}, hidden:[], sample:false, seq:0, prev:null});
let DB = load();
function load(){ try{ return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){ return blank(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('Could not save — browser storage is unavailable or full'); } }
const S = () => Object.assign({}, CONFIG, DB.settings);
function curYear(){ if (S().currentYear) return S().currentYear; const d = new Date(), y = d.getFullYear() - (d.getMonth() < 7 ? 1 : 0); return `${y}-${String((y+1)%100).padStart(2,'0')}`; }
Object.values(DB.assignments).forEach(a => { if (!a.year) a.year = curYear(); });

function copyText(text, what){
  const ok = () => toast(`${what} copied`);

}

function normName(raw){
  let n = String(raw||'').trim().replace(/\s+/g,' ');
  if (n.includes(',')) { const [last, first] = n.split(',').map(s=>s.trim()); n = `${first} ${last}`; }
  return n;
}
const nameKey = n => normName(n).toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

/* ---------- courses & periods ---------- */
const PERIOD_RE = /^(\d{1,2}[A-Z]?|[A-Z]\d{1,2})$/i;
function splitClass(c){
  const t = String(c||'').trim().split(/\s+/);
  if (t.length > 1 && PERIOD_RE.test(t[t.length-1])) return {course: t.slice(0,-1).join(' '), period: t[t.length-1].toUpperCase()};
  return {course: String(c||'').trim(), period: ''};
}
function allClasses(){ const c=new Set(); Object.values(DB.students).forEach(s=>s.classes.forEach(x=>c.add(x))); return [...c].sort(classSort); }
function courses(){ return [...new Set(allClasses().map(c=>splitClass(c).course))].sort(courseSort); }
function coursesAll(){ const c = new Set(courses()); Object.values(DB.students).forEach(s => Object.values(s.past||{}).flat().forEach(x => c.add(splitClass(x).course))); Object.values(DB.assignments).forEach(a => { const p = String(a.name).split(/\s+·\s+/); if (p.length>1) c.add(p[0].trim()); }); return [...c].sort(courseSort); }
function aCourseMap(){ const crs = coursesAll(), aC = {}; Object.values(DB.assignments).forEach(a => aC[a.id] = assignCourse(a.name, crs)); return aC; }
function courseSort(a,b){ const o=S().courseOrder, i=o.indexOf(a), j=o.indexOf(b); return (i<0?99:i)-(j<0?99:j) || a.localeCompare(b); }
function classSort(a,b){ const A=splitClass(a), B=splitClass(b); return courseSort(A.course,B.course) || A.period.localeCompare(B.period,undefined,{numeric:true}); }
function assignCourse(name, crs){
  const parts = String(name).split(/\s+·\s+/);
  if (parts.length < 2) return null;
  const p = parts[0].trim().toLowerCase();
  return crs.find(c => c.toLowerCase() === p) || null;
}
const NOT_GRADED_WORK = /correction|turn in here|lock ?down browser test|make sure (yours|it) works|fill in the blank review/i;   // completion items, never tests
const isTest = name => !NOT_GRADED_WORK.test(bare(name)) && new RegExp(S().retestPattern, 'i').test(bare(name));
/* Compare & AP projection: assignment type and unit from the name */
const TYPES = [{id:'pc', label:'Progress Check', sub:'MCQ'}, {id:'test', label:'Unit Test', sub:'MC test / retest / MCQ'}, {id:'writing', label:'Writing', sub:'SAQ / LEQ / DBQ / FRQ'}];
function typeOf(name){ const b = bare(name); if (NOT_GRADED_WORK.test(b)) return null; if (/\b(saq|leq|dbq|frq)s?\b/i.test(b)) return 'writing'; if (/progress check|\bpc\b/i.test(b)) return /vocab/i.test(b) ? null : 'pc'; if (/\b(test|retest|mcq?|mc test)\b/i.test(b)) return 'test'; return null; }
function unitOf(name){ const b = bare(name), m = b.match(/\b(?:unit|u)\s*0?(\d{1,2})\b/i) || b.match(/\btopics?(?:\s+check)?:?\s*(\d{1,2})\.\d/i); return m ? +m[1] : null; }
function apProject(course, pts){
  const st = S(), w = p => { const u = unitOf(p.a.name); return u ? 1 + (u-1)*st.apRecency : 1; };
  const wavg = arr => { const W = arr.reduce((t,p)=>t+w(p),0); return arr.reduce((t,p)=>t+p.p*w(p),0)/W; };
  const mc = pts.filter(p => !p.m && p.a.source==='AP Classroom' && typeOf(p.a.name)!=='writing');
  if (!mc.length) return null;
  const wr = pts.filter(p => !p.m && typeOf(p.a.name)==='writing');
  const mcPct = wavg(mc), wrPct = wr.length ? wavg(wr) : null, mw = st.mcWeight[course] ?? st.mcWeight.default ?? .5;
  const comp = wrPct==null ? mcPct : mcPct*mw + wrPct*(1-mw);
  return {mcPct, wrPct, comp, mw, score:(st.apScale.find(([min])=>comp>=min) || [0,1])[1], nMc:mc.length, nWr:wr.length};
}

function upsertStudent(name, id, cls, year){
  name = normName(name);
  const key = (id && DB.idmap[id]) || (name && nameKey(name));
  if (!key) return null;
  const st = DB.students[key] || (DB.students[key] = {name, ids:[], classes:[]});
  if (id && !st.ids.includes(id)) { st.ids.push(id); DB.idmap[id] = key; }
  const list = (year && year !== curYear()) ? ((st.past ||= {})[year] ||= []) : st.classes;
  if (cls) String(cls).split(/\s+and\s+|;/).map(s=>s.trim()).filter(Boolean).forEach(c => { if (!list.includes(c)) list.push(c); });
  return key;
}
function parseScore(raw, outOf){
  const v = String(raw ?? '').trim();
  if (!v || v === '-') return null;
  if (/^(m|mi|mis|msg|missing|z)$/i.test(v)) return {p:0, m:true};
  if (/^(ex|exc|excused|exempt)$/i.test(v)) return {p:null, x:true};
  let m = v.match(/^(-?[\d.]+)\s*\/\s*([\d.]+)$/);
  if (m) { const p = +m[2] ? +m[1] / +m[2] * 100 : null; return p==null?null:{p, m: p===0}; }
  m = v.match(/^(-?[\d.]+)\s*%$/);
  if (m) return {p:+m[1], m: +m[1]===0};
  const n = parseFloat(v.replace(/[^\d.\-]/g,''));
  if (isNaN(n) || !/\d/.test(v)) return null;
  const p = outOf ? n / outOf * 100 : n;
  return {p, m: n === 0};
}
const visibleAssignments = () => Object.values(DB.assignments).filter(a=>!a.hidden && yearOf(a)===curYear()).sort((a,b)=>a.order-b.order);

function classStats(key, cls, assigns, aC){
  const course = cls ? splitClass(cls).course : null, sc = DB.scores[key] || {};
  const pts = [], bySrc = {};
  for (const a of assigns){
    if (course && aC[a.id] && aC[a.id] !== course) continue;
    const v = sc[a.id]; if (!v || v.x || v.p == null) continue;
    pts.push({a, p:v.p, m:!!v.m}); (bySrc[a.source] ||= []).push(v.p);
  }
  const avg = mean(pts.map(x=>x.p));
  let drop = null, recent = null, prior = null;
  if (pts.length >= 6){ recent = mean(pts.slice(-3).map(x=>x.p)); prior = mean(pts.slice(0,-3).map(x=>x.p)); drop = recent - prior; }
  const perf = {}; pts.forEach(x => { if (!x.m) (perf[x.a.source] ||= []).push(x.p); });   // gap compares performance, so missing work is left out
  const ps = Object.entries(perf).filter(([,v])=>v.length>=2).map(([k,v])=>({k, avg:mean(v)})).sort((a,b)=>b.avg-a.avg);
  const gap = ps.length >= 2 ? {d: ps[0].avg - ps[ps.length-1].avg, hi: ps[0], lo: ps[ps.length-1]} : null;
  return {cls, course, period: cls ? splitClass(cls).period : '', avg, pts, missing: pts.filter(x=>x.m).map(x=>x.a), drop, recent, prior, gap, proj: apProject(course, pts),
    bySrc: Object.fromEntries(Object.entries(bySrc).map(([k,v])=>[k,{avg:mean(v), n:v.length}]))};
}
function summarize(key, s, cs){
  const st = S(), cut = st.atRisk;
  const withAvg = cs.filter(c=>c.avg!=null);
  const worst = withAvg.length ? withAvg.reduce((a,b)=>a.avg<b.avg?a:b) : null;
  const seen = new Set(), missing = [], pts = [];
  cs.forEach(c => { c.pts.forEach(p => { if (!seen.has(p.a.id)){ seen.add(p.a.id); pts.push(p); if (p.m) missing.push({a:p.a, cls:c.cls}); } }); });
  pts.sort((x,y)=>x.a.order-y.a.order);
  const multi = cs.length > 1, reasons = [];
  cs.forEach(c => { if (c.avg!=null && c.avg<cut) reasons.push({t:'below', icon:'▼', label:`Below ${cut}`+(multi?` · ${c.course}`:''), tip:`${c.cls}: average ${pct(c.avg)}`, w:(cut-c.avg)*2+12}); });
  if (missing.length >= 2) reasons.push({t:'missing', icon:'⧗', label:`${missing.length} missing`, tip:missing.slice(0,6).map(m=>bare(m.a.name)).join(', ')+(missing.length>6?'…':''), w:missing.length*4});
  const dr = cs.filter(c=>c.drop!=null && c.drop <= -st.dropPts).sort((a,b)=>a.drop-b.drop)[0];
  if (dr) reasons.push({t:'dropping', icon:'↘', label:`Dropping ${fmt(dr.drop,0)}`, tip:`${dr.cls||'All work'}: last 3 average ${p0(dr.recent)} vs ${p0(dr.prior)} before`, w:-dr.drop});
  const gp = cs.filter(c=>c.gap && c.gap.d >= st.gapPts).sort((a,b)=>b.gap.d-a.gap.d)[0];
  if (gp) reasons.push({t:'gap', icon:'⇅', label:`Platform gap ${fmt(gp.gap.d,0)}`, tip:`${gp.gap.hi.k} ${p0(gp.gap.hi.avg)} vs ${gp.gap.lo.k} ${p0(gp.gap.lo.avg)}`, w:gp.gap.d/3});
  cs.forEach(c => { if (c.proj && c.proj.score <= 2) reasons.push({t:'ap', icon:'◆', label:`AP proj ${c.proj.score}`+(multi?` · ${c.course}`:''), tip:`${c.cls}: AP Classroom MC ${p0(c.proj.mcPct)}${c.proj.wrPct!=null?` · writing ${p0(c.proj.wrPct)}`:''} → composite ${p0(c.proj.comp)}`, w:(3-c.proj.score)*6}); });
  const status = !worst ? 'none' : (reasons.some(r=>r.t==='below') || missing.length >= st.missingForHelp) ? 'help'
    : (worst.avg < cut + st.watchBand || reasons.length) ? 'watch' : 'ok';
  return {key, name:s.name, ids:s.ids, classes:cs.map(c=>c.cls).filter(Boolean), cs, worst, avg:mean(pts.map(p=>p.p)), pts, missing, reasons, status, profile:prof(key),
    need: reasons.reduce((t,r)=>t+r.w,0) + (status==='help'?20:status==='watch'?5:0)};
}
function buildModel(){
  const aC = aCourseMap();
  const assigns = visibleAssignments();
  const inScope = c => { if (!c) return UI.course==='all' && UI.period==='all'; const sp = splitClass(c); return (UI.course==='all' || sp.course===UI.course) && (UI.period==='all' || c===UI.period); };
  const staarOk = key => UI.staar==='all' || (UI.staar==='none' ? !staarOf(key) : prof(key)?.staarLevel===UI.staar);
  const studs = [];
  for (const [key, s] of Object.entries(DB.students)){
    if (!staarOk(key) || (!s.classes.length && s.past)) continue;
    const enr = (s.classes.length ? s.classes : ['']).filter(inScope);
    if (enr.length) studs.push(summarize(key, s, enr.map(c => classStats(key, c, assigns, aC))));
  }
  const scopeAssigns = assigns.filter(a => UI.course==='all' || !aC[a.id] || aC[a.id]===UI.course);
  const counts = {ok:0, watch:0, help:0, none:0, unpaid:0};
  studs.forEach(s => { counts[s.status]++; if (s.profile?.apExam==='unpaid') counts.unpaid++; });
  return {studs, assigns:scopeAssigns, aC, counts};
}

function retestRows(m){
  const cap = S().retestCap, out = [], seen = new Set();
  m.studs.forEach(s => s.cs.forEach(c => c.pts.forEach(p => {
    const k = s.key + '|' + p.a.id;
    if (!p.m && p.p < cap && isTest(p.a.name) && !seen.has(k)){ seen.add(k); out.push({s, cls:c.cls, a:p.a, p:p.p}); }
  })));
  return out;
}
function powerHour(m){
  const cut = S().atRisk, groups = {};
  m.studs.forEach(s => s.cs.forEach(c => { if (c.avg!=null && c.avg < cut) (groups[c.cls||'No class'] ||= []).push({s, c}); }));
  return Object.entries(groups).sort((a,b)=>classSort(a[0],b[0])).map(([cls, rows]) => ({cls, rows: rows.sort((a,b)=>a.c.avg-b.c.avg)}));
}
function missingBoard(m){
  const cols = {}, byA = {};
  m.studs.forEach(s => s.cs.forEach(c => { if (!c.missing.length) return;
    (cols[c.cls||'No class'] ||= []).push({s, list:c.missing});

  }));
  return { cols: Object.entries(cols).sort((a,b)=>classSort(a[0],b[0])).map(([cls, items]) => ({cls, items: items.sort((a,b)=>b.list.length-a.list.length), n: items.reduce((t,i)=>t+i.list.length,0)})),
           most: Object.values(byA).sort((a,b)=>b.n-a.n) };
}

function viewRetests(m){
  const rows = retestRows(m).filter(r=>matchQ(r.s)), cap = S().retestCap;
  const studs = [...new Set(rows.map(r=>r.s.key))];
  const gain = mean(rows.map(r=>cap-r.p));
  const tests = Object.values(rows.reduce((g,r)=>{ (g[r.a.id] ||= {a:r.a, rows:[]}).rows.push(r); return g; }, {})).sort((a,b)=>b.rows.length-a.rows.length);
  let body;
  if (!rows.length) body = `<div class="card"><div class="empty">✓ No test or progress check under ${cap} in ${esc(scopeLabel())}.</div></div>`;
  else if (UI.retestBy==='student'){
    const by = {}; rows.forEach(r => (by[r.s.key] ||= {s:r.s, list:[]}).list.push(r));
    body = `<div class="rgrid">${Object.values(by).sort((a,b)=>b.list.length-a.list.length || a.s.name.localeCompare(b.s.name)).map(({s,list})=>`<div class="rcard">
      <div class="who" data-student="${esc(s.key)}">${avatar(s.key,s.name)}<span style="min-width:0">${nameLine(s)}<small>${esc(s.classes.join(' · '))}</small></span><span class="count" style="margin-left:auto">${list.length}</span></div>
      <div class="tlist">${list.sort((a,b)=>a.p-b.p).map(r=>`<div class="trow"><span><span class="dot" style="background:${srcColor(r.a.source)}"></span>${esc(bare(r.a.name))}</span><span class="sc">${p0(r.p)}</span><span class="gain" data-tip="Up to ${cap} on retest">+${Math.round(cap-r.p)}</span></div>`).join('')}</div></div>`).join('')}</div>`;
  } else {
    body = `<div class="card"><div class="cb" style="padding-top:12px;overflow:auto"><table class="t"><thead><tr><th>Test</th><th>Platform</th><th class="r">Under ${cap}</th><th>Students</th></tr></thead><tbody>
      ${tests.map(t=>`<tr><td><b>${esc(bare(t.a.name))}</b><div class="minor">${esc(t.a.name.includes('·')?t.a.name.split('·')[0].trim():'')}</div></td><td><span class="dot" style="background:${srcColor(t.a.source)}"></span>${esc(t.a.source)}</td><td class="r"><b>${t.rows.length}</b></td>
        <td><div class="namechips">${t.rows.sort((a,b)=>a.p-b.p).map(r=>`<button class="nchip" data-student="${esc(r.s.key)}">${esc(r.s.name)}<b>${p0(r.p)}</b></button>`).join('')}</div></td></tr>`).join('')}</tbody></table></div></div>`;
  }
  return `${sampleBanner()}<div class="phead"><div><div class="eyebrow"><i></i>${esc(scopeLabel())}</div><h1>Retests</h1>
      <p>Tests and progress checks scored under ${cap}. Frisco caps retests at ${cap}, so anyone below it has points to gain.</p></div>
    <div class="actions"><div class="tabs" role="group" aria-label="Group by"><button aria-pressed="${UI.retestBy==='student'}" data-retestby="student">By student</button><button aria-pressed="${UI.retestBy==='test'}" data-retestby="test">By test</button></div>

    <div class="strip"><div class="stat accent"><b>${rows.length}</b><span>Retests open</span></div><div class="stat"><b>${studs.length}</b><span>Students</span></div><div class="stat"><b>${tests.length}</b><span>Tests involved</span></div><div class="stat"><b>${gain==null?'—':'+'+Math.round(gain)}</b><span>Avg points to gain</span></div></div>
    ${body}`;
}

function viewCompare(m){
  const cur = curYear(), aC = m.aC, all = coursesAll();
  const course = UI.course!=='all' ? UI.course : (courses()[0] || all[0]);
  if (!course) return `<div class="phead"><div><h1>Compare years</h1></div></div><div class="card"><div class="empty">No data yet.</div></div>`;
  const multi = all.length > 1;
  const as = Object.values(DB.assignments).filter(a => !a.hidden && (aC[a.id] ? aC[a.id]===course : !multi))
    .map(a => ({a, type:typeOf(a.name), unit:unitOf(a.name), year:yearOf(a)})).filter(x => x.type && x.unit);
  const years = [...new Set(as.map(x=>x.year))].sort((a,b)=> a===cur ? -1 : b===cur ? 1 : b.localeCompare(a));
  const ycol = y => ['var(--s1)','var(--s2)','var(--s3)','var(--s4)'][Math.min(years.indexOf(y),3)];
  const curKeys = new Set(m.studs.map(s=>s.key));
  const stuKey = curKeys.has(UI.cmpStudent) ? UI.cmpStudent : '';
  const cell = (type, unit, year, only) => {
    const ids = as.filter(x=>x.type===type && x.unit===unit && x.year===year).map(x=>x.a.id); if (!ids.length) return null;
    const ps = [];
    for (const [k, sc] of Object.entries(DB.scores)){
      if (only ? k!==only : (year===cur && !curKeys.has(k))) continue;
      ids.forEach(id => { const v = sc[id]; if (v && !v.x && !v.m && v.p!=null) ps.push(v.p); });
    }
    return ps.length ? {avg:mean(ps), n:ps.length, k:ids.length} : null;
  };
  const types = UI.cmpType==='all' ? TYPES : TYPES.filter(t=>t.id===UI.cmpType);
  const prior = years.find(y=>y!==cur);
  const overall = y => mean(as.filter(x=>x.year===y && types.some(t=>t.id===x.type)).flatMap(x=>Object.entries(DB.scores).filter(([k])=>y!==cur||curKeys.has(k)).map(([,sc])=>sc[x.a.id]).filter(v=>v&&!v.x&&!v.m&&v.p!=null).map(v=>v.p)));
  const oc = overall(cur), op = prior ? overall(prior) : null;
  const stuOpts = m.studs.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const card = t => {
    const units = [...new Set(as.filter(x=>x.type===t.id).map(x=>x.unit))].sort((a,b)=>a-b);
    if (!units.length) return `<section class="card ${types.length>1?'w4':'w12'}"><div class="ch"><h2>${t.label}</h2><span class="sub">${t.sub}</span></div><div class="cb"><div class="empty">No ${t.label.toLowerCase()} assignments with a unit in the name yet.</div></div></section>`;
    const groups = units.map(u => {
      const st = stuKey ? cell(t.id, u, cur, stuKey) : null;
      return `<div class="gg"><div class="gbars">${years.map(y => { const c = cell(t.id, u, y); return c ? `<span class="gb" style="height:${Math.max(1,c.avg)}%;background:${ycol(y)}" data-tip="<b>${t.label} · Unit ${u}</b><br>${esc(y)}: class average ${pct(c.avg)}<br>${c.n} scores on ${plural(c.k,'assignment')}"></span>` : `<span class="gb" style="height:0"></span>`; }).join('')}
        ${st?`<i class="stu" style="bottom:${st.avg}%" data-tip="<b>${esc(DB.students[stuKey].name)}</b><br>Unit ${u}: ${pct(st.avg)}"></i>`:''}</div><em>U${u}</em></div>`;
    }).join('');
    const rows = units.map(u => { const c = years.map(y=>cell(t.id,u,y)), st = stuKey ? cell(t.id,u,cur,stuKey) : null;
      const d = c[0] && years[0]===cur && c[1] ? c[0].avg - c[1].avg : null;
      return `<tr><td><b>U${u}</b></td>${c.map(x=>`<td class="r num">${x?p0(x.avg):'—'}</td>`).join('')}${prior?`<td class="r">${d==null?'—':`<span class="delta ${d>=0?'up':'down'}">${d>=0?'+':''}${Math.round(d)}</span>`}</td>`:''}${stuKey?`<td class="r num"><b>${st?p0(st.avg):'—'}</b></td>`:''}</tr>`; }).join('');
    return `<section class="card ${types.length>1?'w4':'w12'}"><div class="ch"><h2>${t.label}</h2><span class="sub">${t.sub}</span></div><div class="cb">
      <div class="gchart"><div class="yax">${[100,75,50,25,0].map(v=>`<div style="top:${100-v}%"><span>${v}</span></div>`).join('')}</div><div class="ggroups">${groups}</div></div>
      <table class="t" style="margin-top:10px"><thead><tr><th>Unit</th>${years.map(y=>`<th class="r"><span class="dot" style="background:${ycol(y)}"></span>${esc(y)}</th>`).join('')}${prior?'<th class="r">Δ</th>':''}${stuKey?'<th class="r">Student</th>':''}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
  };
  return `${sampleBanner()}<div class="phead"><div><div class="eyebrow"><i></i>${esc(course)}${UI.period!=='all'?' · '+esc(UI.period)+' (this year)':''}</div><h1>Compare years</h1>
      <p>Class average per unit for each assignment type, ${cur} against earlier years. Missing work isn't counted here, so years compare fairly.${UI.course==='all'?` Showing ${esc(course)}: pick another course above.`:''}</p></div>
    <div class="actions"><div class="tabs" role="group" aria-label="Assignment type"><button aria-pressed="${UI.cmpType==='all'}" data-cmptype="all">All</button>${TYPES.map(t=>`<button aria-pressed="${UI.cmpType===t.id}" data-cmptype="${t.id}">${t.label}</button>`).join('')}</div>
      <label class="sr" for="cmpStu">Student</label><select class="btn sm" id="cmpStu"><option value="">Overlay a student…</option>${stuOpts.map(s=>`<option value="${esc(s.key)}" ${s.key===stuKey?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div></div>
    <div class="strip"><div class="stat accent"><b>${p0(oc)}</b><span>${cur} average</span></div><div class="stat"><b>${op==null?'—':p0(op)}</b><span>${prior?esc(prior)+' average':'No earlier year loaded'}</span></div>
      <div class="stat"><b>${oc!=null&&op!=null?`<span class="delta ${oc>=op?'up':'down'}">${oc>=op?'+':''}${Math.round(oc-op)}</span>`:'—'}</b><span>Change</span></div><div class="stat"><b>${years.length}</b><span>${plural(years.length,'school year')} loaded</span></div></div>
    ${!prior?`<div class="banner" style="background:var(--tq-soft);color:var(--tq-ink)">Load earlier years from Import: set <b>School year</b> (e.g. 2025-26) before pasting, or add a "School Year" column.<span class="sp"></span><button class="btn sm" data-go="import">Import →</button></div>`:''}
    <div class="legend">${years.map(y=>`<span><i style="background:${ycol(y)}"></i>${esc(y)}${y===cur?' (this year)':''}</span>`).join('')}${stuKey?`<span><i style="background:var(--ink);transform:rotate(45deg);width:8px;height:8px"></i>${esc(DB.students[stuKey].name)}</span>`:''}</div>
    <div class="grid">${types.map(card).join('')}</div>`;
}

function viewAP(m){
  const rows = []; m.studs.filter(matchQ).forEach(s => s.cs.forEach(c => { if (c.proj) rows.push({s, c}); }));
  const sc = S().apScale, rng = n => { const i = sc.findIndex(([,v])=>v===n), lo = sc[i][0], hi = i ? sc[i-1][0]-1 : 100; return n===1 ? `under ${sc[sc.length-2][0]}%` : `${lo}–${hi}%`; };
  const dist = list => `<div class="dist">${[5,4,3,2,1].map(n=>{ const k = list.filter(r=>r.c.proj.score===n).length; return `<div class="drow" data-tip="${k} projected ${n} (${rng(n)})"><span class="apb a${n}" style="min-width:26px;height:22px;font-size:12px">${n}</span><span class="tr"><i class="d${n}" style="width:${list.length?k/list.length*100:0}%"></i></span><b>${k} <span class="minor">${list.length?Math.round(k/list.length*100):0}%</span></b></div>`; }).join('')}</div>`;
  const groups = Object.entries(rows.reduce((g,r)=>{ (g[r.c.cls||'No class'] ||= []).push(r); return g; }, {})).sort((a,b)=>classSort(a[0],b[0]));
  const low = rows.filter(r=>r.c.proj.score<=2), pass = rows.filter(r=>r.c.proj.score>=3);
  return `${sampleBanner()}<div class="phead"><div><div class="eyebrow"><i></i>${esc(scopeLabel())}</div><h1>AP projection</h1>
      <p>Projected 1–5 from AP Classroom MC % (Unit N counts ${1}+(N−1)×${S().apRecency}), blended with writing % when there is any. Proficiency scaling: 5 = ${rng(5)}, 4 = ${rng(4)}, 3 = ${rng(3)}, 2 = ${rng(2)}, 1 = ${rng(1)}. Missing work isn't counted. It's an estimate, not a College Board prediction.</p></div>
    <div class="actions"><button class="btn" data-act="copy-ap">Copy 1–2 list</button><button class="btn blk" data-act="print-ap">${PRINT}</button></div></div>
    <div class="strip"><div class="stat accent"><b>${rows.length?Math.round(pass.length/rows.length*100)+'%':'—'}</b><span>Projected 3 or higher</span></div><div class="stat"><b>${rows.length?fmt(mean(rows.map(r=>r.c.proj.score)),1):'—'}</b><span>Average projected score</span></div><div class="stat"><b style="color:var(--help-ink)">${low.length}</b><span>Projected 1–2</span></div><div class="stat"><b>${rows.length}</b><span>Projections (student × class)</span></div></div>
    ${rows.length ? `<div class="grid" style="margin-bottom:16px"><section class="card w5"><div class="ch"><h2>Distribution</h2><span class="sub">${esc(scopeLabel())}</span></div><div class="cb">${dist(rows)}</div></section>
      <section class="card w7"><div class="ch"><h2>Projected 1–2</h2><span class="count help">${low.length}</span></div><div class="cb">${low.length?`<div class="namechips">${low.sort((a,b)=>a.c.proj.comp-b.c.proj.comp).map(r=>`<button class="nchip" data-student="${esc(r.s.key)}">${esc(r.s.name)} <span class="minor">${esc(r.c.cls)}</span><b>${r.c.proj.score}</b></button>`).join('')}</div>`:'<div class="empty">✓ No one projected below 3.</div>'}</div></section></div>
    <div class="apgrid">${groups.map(([cls, list])=>`<section class="ph"><div class="ph-h"><h3>${esc(cls)}</h3><span class="minor" style="color:var(--on-blk2);margin-left:auto">avg ${fmt(mean(list.map(r=>r.c.proj.score)),1)} · ${Math.round(list.filter(r=>r.c.proj.score>=3).length/list.length*100)}% 3+</span></div>
      <div style="padding:12px 14px">${dist(list)}</div>
      <div class="aprow head"><span>Student</span><span class="n">MC</span><span class="n">Writing</span><span class="n">Blend</span><span class="n">Proj</span></div>
      ${list.sort((a,b)=>a.c.proj.comp-b.c.proj.comp).map(r=>{ const pj=r.c.proj; return `<button class="aprow${pj.score<=2?' flag':''}" data-student="${esc(r.s.key)}"><span class="who" style="min-width:0">${avatar(r.s.key,r.s.name,26)}<span style="min-width:0">${nameLine(r.s)}</span></span>
        <span class="n" data-tip="${pj.nMc} AP Classroom MC scores">${p0(pj.mcPct)}</span><span class="n" data-tip="${pj.nWr} writing scores">${pj.wrPct==null?'—':p0(pj.wrPct)}</span><span class="n">${p0(pj.comp)}</span><span class="n">${apBadgeScore(pj.score)}</span></button>`; }).join('')}</section>`).join('')}</div>`
      : `<div class="card"><div class="empty">No AP Classroom multiple-choice scores in ${esc(scopeLabel())} yet. Import AP Classroom data (Platform = AP Classroom).</div></div>`}`;
}

function viewAssignments(m){
  const studs = m.studs, ids = new Set(m.assigns.map(a=>a.id)), cur = curYear();
  const rows = Object.values(DB.assignments).filter(a=>ids.has(a.id) || ((a.hidden || yearOf(a)!==cur) && (UI.course==='all' || !m.aC[a.id] || m.aC[a.id]===UI.course))).map(a => {
    const ps = (yearOf(a)===cur ? studs.map(s=>(DB.scores[s.key]||{})[a.id]) : Object.values(DB.scores).map(sc=>sc[a.id])).filter(v=>v && !v.x && v.p!=null);
    return {a, avg:mean(ps.map(v=>v.p)), n:ps.length, miss:ps.filter(v=>v.m).length};
  });
  const [k, dir] = UI.asort, key = {order:r=>r.a.order, name:r=>bare(r.a.name), source:r=>r.a.source, avg:r=>r.avg, n:r=>r.n, miss:r=>r.miss}[k];
  rows.sort((x,y)=>{ const a=key(x), b=key(y); if (a==null) return 1; if (b==null) return -1; return (typeof a==='string'?a.localeCompare(b):a-b)*dir; });
  const th = (k2, l, r) => `<th class="${r?'r':''}"><button data-asort="${k2}">${l}${UI.asort[0]===k2?(UI.asort[1]>0?' ↑':' ↓'):''}</button></th>`;
  return `${sampleBanner()}<div class="phead"><div><h1>Assignments</h1><p>${rows.length} in ${esc(scopeLabel())}. Rename, hide from averages, or delete.</p></div></div>
    <div class="card"><div class="cb" style="padding-top:12px;overflow:auto">${rows.length?`<table class="t"><thead><tr>${th('order','#',1)}${th('name','Assignment')}<th>Course</th><th>Year</th>${th('source','Platform')}${th('avg','Average',1)}${th('n','Graded',1)}${th('miss','Missing',1)}<th>Counted</th><th></th></tr></thead><tbody>
    ${rows.map(({a,avg,n,miss})=>`<tr style="${a.hidden?'opacity:.5':''}"><td class="r num">${a.order}</td><td><b>${esc(bare(a.name))}</b>${typeOf(a.name)?` <span class="tag gap">${TYPES.find(t=>t.id===typeOf(a.name)).label.toUpperCase()}${unitOf(a.name)?' · U'+unitOf(a.name):''}</span>`:''}</td><td>${esc(m.aC[a.id]||'All')}</td><td>${yearOf(a)===cur?'<b>'+esc(cur)+'</b>':esc(yearOf(a))}</td><td><span class="dot" style="background:${srcColor(a.source)}"></span>${esc(a.source)}</td><td class="r num"><b>${p0(avg)}</b></td><td class="r num">${n}</td><td class="r num">${miss||''}</td>
      <td><label style="display:inline-flex;gap:6px;align-items:center;font-size:12px"><input type="checkbox" data-hide="${esc(a.id)}" ${a.hidden?'':'checked'}>${a.hidden?'Hidden':'Yes'}</label></td>
      <td style="white-space:nowrap"><button class="btn sm" data-rename="${esc(a.id)}">Rename</button> <button class="btn sm danger" data-del="${esc(a.id)}" aria-label="Delete ${esc(a.name)}">Delete</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No assignments yet.</div>'}</div></div>`;
}

/* ---------- CSV parsing & importing ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.match(/\t/g)||[]).length > (first.match(/,/g)||[]).length ? '\t' : (first.match(/;/g)||[]).length > (first.match(/,/g)||[]).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if (c==='"') q = true;
    else if (c===delim){ row.push(cell); cell=''; }
    else if (c==='\n' || c==='\r'){ if (c==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
const CANVAS_SKIP = /^(Student|ID|SIS User ID|SIS Login ID|Integration ID|Root Account|Section)$|(Current|Final|Unposted) (Score|Grade|Points)|Override/i;
function isCanvas(rows){ const h = rows[0]||[]; return h[0]==='Student' && h.includes('Section') && (h.includes('SIS User ID') || h.includes('SIS Login ID')); }
function importCanvas(rows, file, stay, year){
  const h = rows[0], idI = h.includes('SIS User ID') ? h.indexOf('SIS User ID') : h.indexOf('ID'), secI = h.indexOf('Section');
  const pp = rows.find(r=>/points possible/i.test(r[0]||''));
  const assigns = h.map((name,i)=>({name,i})).filter(c=>c.name && !CANVAS_SKIP.test(c.name)).map(c => {
    const m = c.name.match(/^(.*)\s\((\d+)\)$/);
    return {...c, id:'Canvas:' + (m ? m[2] : c.name), title: m ? m[1] : c.name, outOf: pp ? parseFloat(pp[c.i]) || null : null};
  }).filter(c => !pp || !/read only/i.test(pp[c.i]||''));
  const data = rows.slice(1).filter(r=>r[0] && !/points possible/i.test(r[0]) && !/^student,\s*test$|test student/i.test(r[0]))
    .map(r=>({name:r[0], id: idI>=0 ? r[idI] : '', cls: secI>=0 ? r[secI] : '', cells: r}));
  commit({file, source:'Canvas', stay, year, assigns: assigns.map(a=>({id:a.id, name:a.title, outOf:a.outOf, col:a.i})), data});
}

/* Profile layout: Student, Student ID, Class, 8th STAAR %, 8th STAAR Level, AP Exam (never counted in averages) */
function isProfile(rows){ const h = rows[0].map(x=>x.trim().toLowerCase()); return h.some(x=>/staar/.test(x)) || h.some(x=>/^ap exam/.test(x)); }
function importProfile(rows, file, stay){
  const h = rows[0].map(x=>x.trim().toLowerCase()), col = re => h.findIndex(x=>re.test(x));
  const nameI = col(/^student( name)?$|^name$/), idI = col(/student id|^id$/), clsI = col(/^class$/), pctI = col(/staar.*(%|pct|percent|score)/), lvlI = col(/staar.*level/), apI = col(/^ap exam/);
  let n = 0, created = 0;
  rows.slice(1).forEach(r => {
    const id = idI>=0 ? (r[idI]||'').trim() : '', name = nameI>=0 ? r[nameI] : '';
    if (!id && !(name||'').trim()) return;
    const existed = (id && DB.idmap[id]) || DB.students[nameKey(name)];
    const key = upsertStudent(name, id, clsI>=0 ? r[clsI] : ''); if (!key) return;
    if (!existed) created++;
    const pv = pctI>=0 ? parseFloat(String(r[pctI]).replace(/[^\d.]/g,'')) : NaN;
    DB.profiles[key] = Object.assign(DB.profiles[key] || {}, {
      staarPct: isNaN(pv) ? (DB.profiles[key]?.staarPct ?? null) : pv,
      staarLevel: lvlI>=0 && normStaar(r[lvlI]) ? normStaar(r[lvlI]) : (DB.profiles[key]?.staarLevel || ''),
      apExam: apI>=0 && normAp(r[apI]) ? normAp(r[apI]) : (DB.profiles[key]?.apExam || ''),
    });
    n++;
  });
  DB.imports.push({file: file.startsWith('Pasted ') ? 'Pasted profile data' : file, source:'Profile', at: Date.now(), students: n, assignments: 0});
  const msg = `Imported ${plural(n,'student profile')}${created?` (${created} new student${created===1?'':'s'})`:''}`;
  save(); toast(msg);
  if (stay){ UI.lastResult = (UI.lastResult ? UI.lastResult + '\n' : '') + '✓ ' + msg; render(); return; }
  go('overview');
}

  const maxOf = i => Math.max(...body.map(r=>parseFloat(r[i])).filter(n=>!isNaN(n)), 0);

function snapshot(){ const out = {}; Object.keys(DB.students).forEach(k => { const v = studentFull(k).avg; if (v!=null) out[k] = v; }); return {at: Date.now(), avgs: out}; }
function normYear(v){ v = String(v||'').trim(); if (!v) return ''; const m = v.match(/(\d{2,4})\s*[-–\/]\s*(\d{2,4})/); if (m){ const a = m[1].length===2 ? 2000+ +m[1] : +m[1]; return `${a}-${String((a+1)%100).padStart(2,'0')}`; } const y = v.match(/^(\d{4})$/); return y ? `${+y[1]-1}-${y[1].slice(2)}` : v; }
function resolveId(base, year){ const a = DB.assignments[base]; if (a ? yearOf(a)===year : year===curYear()) return base; const i = base.indexOf(':'); return base.slice(0,i) + ':' + year + base.slice(i); }
function commit({file, source, assigns, data, stay, year}){
  year = normYear(year) || curYear();
  if (!DB.sessionAt || Date.now()-DB.sessionAt > 30*60e3) DB.prev = Object.keys(DB.students).length ? snapshot() : null;
  DB.sessionAt = Date.now();
  const touched = new Set();
  assigns.forEach(a => { a.id = resolveId(a.id, year); if (!DB.assignments[a.id]) DB.assignments[a.id] = {id:a.id, name:a.name, source, order: ++DB.seq, hidden:false, year}; });
  data.forEach(d => {
    const key = upsertStudent(d.name, d.id, d.cls, year); if (!key) return;
    touched.add(key);
    const sc = DB.scores[key] ||= {};
    assigns.forEach(a => { const v = parseScore(d.cells[a.col], a.outOf); if (v) sc[a.id] = v; });
  });
  DB.imports.push({file, source, year, at: Date.now(), students: touched.size, assignments: assigns.length});
  const msg = `Imported ${plural(touched.size,'student')} · ${plural(assigns.length,'assignment')} from ${source}${year!==curYear()?` (${year})`:''}`;
  save(); toast(msg);
  if (stay){ UI.lastResult = (UI.lastResult ? UI.lastResult + '\n' : '') + '✓ ' + msg; render(); return; }

}

function isStandard(rows){ const h = rows[0].map(x=>x.trim().toLowerCase()); return /^student( name)?$/.test(h[0]) && h.includes('class'); }
function importStandard(rows, file, fallback, stay, year){
  const h = rows[0].map(x=>x.trim()), lc = h.map(x=>x.toLowerCase());
  const idI = lc.findIndex(x=>/^student id$|^id$/.test(x)), clsI = lc.indexOf('class'), platI = lc.indexOf('platform'), yrI = lc.findIndex(x=>/^(school )?year$/.test(x));
  const pp = rows.find(r=>/points possible/i.test(r[0]||''));
  const cols = h.map((name,i)=>({name,i})).filter(c=>c.name && ![0,idI,clsI,platI,yrI].includes(c.i));
  const body = rows.slice(1).filter(r=>r[0] && r[0].trim() && !/points possible|class average/i.test(r[0]));
  const groups = {};
  body.forEach(r => { const pl = platI>=0 && r[platI] ? matchSource(r[platI]) : fallback, yr = (yrI>=0 && normYear(r[yrI])) || normYear(year) || curYear(); (groups[pl+'|'+yr] ||= []).push(r); });
  Object.entries(groups).forEach(([g, rs]) => { const [source, yr] = g.split('|'); commit({file: file.startsWith('Pasted ') ? `Pasted ${source} data` : file, source, stay, year: yr,
    assigns: cols.filter(c=>rs.some(r=>(r[c.i]||'').trim())).map(c=>({id: source+':'+c.name.toLowerCase(), name:c.name, outOf: pp ? parseFloat(pp[c.i])||null : null, col:c.i})),
    data: rs.map(r=>({name:r[0], id: idI>=0 ? (r[idI]||'').trim() : '', cls: clsI>=0 ? r[clsI] : '', cells:r}))}); });
}
function matchSource(v){ v = String(v).trim().toLowerCase(); const f = S().sources.find(s=>s.id.toLowerCase()===v) || S().sources.find(s=>v.includes(s.id.toLowerCase().split(' ')[0])); return f ? f.id : (/ap/.test(v) ? 'AP Classroom' : 'Other'); }
function guessSource(name){ return /canvas/i.test(name)?'Canvas':/\bap\b|ap[ _-]?classroom|college ?board/i.test(name)?'AP Classroom':'Gradebook'; }
function routeImport(rows, label, fallback, stay, year){
  if (isCanvas(rows)) importCanvas(rows, label, stay, year);
  else if (isProfile(rows)) importProfile(rows, label, stay);
  else if (isStandard(rows)) importStandard(rows, label, fallback, stay, year);
  else return false;
  return true;
}
function importPaste(){
  const text = $('#pasteBox').value.trim(), srcSel = $('#pasteSrc').value; UI.pasteSrc = srcSel;
  if (!text) return toast('Paste some data first');

const queue = [];
async function handleFiles(files){ for (const f of files) queue.push({name:f.name, text: await f.text()}); nextFile(); }
function nextFile(){
  if ($('#layer').innerHTML) return;
  const f = queue.shift(); if (!f) return;
  const rows = parseCSV(f.text);
  if (rows.length < 2) { toast(`${f.name}: no rows found`); return nextFile(); }
  const year = normYear(UI.pasteYear) || curYear();
  if (routeImport(rows, f.name, guessSource(f.name), false, year)) nextFile(); else openMapper(rows, f.name, null, year);
}
function wireDrop(){
  const d = $('#drop'); if (!d) return;
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e, ev=>{ev.preventDefault(); d.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e, ev=>{ev.preventDefault(); d.classList.remove('over');}));
  d.addEventListener('drop', ev => handleFiles([...ev.dataTransfer.files]));
}
