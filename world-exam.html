l service exams"},"answer":"D","rationales":{"A":"Incorrect. Korea's Joseon kings, who took power in 1392, promoted Neo-Confucian learning and limited Buddhist monasteries.","B":"Incorrect. Theravada Buddhism spread in Sri Lanka and mainland Southeast Asia, not as China's official religion.","C":"Incorrect. Chinese emperors kept choosing scholar-officials through exams.","D":"Correct. In 1313, Yuan rulers made Zhu Xi's explanations of the Four Books, key Confucian texts, the standard guide for China's civil service exams, which began again in 1315. His ideas stayed central to the exams until 1905."},"explanation":"Zhu Xi was a leading Neo-Confucian thinker. Under the Yuan dynasty, his explanations of the Four Books became the standard guide for China's civil service exams. His teachings also spread to Korea and Japan.","reasoning":"Causation"},{"id":"U1-E06","set":"X2","topic":"1.1","lo":"B","skill":"4.A","difficulty":"hard","stem":"Zhu Xi's ideas in the passage are best understood in the context of","options":{"A":"the arrival of Christian missionaries at the court of the Song emperor","B":"the Mongol conquest that ended the Song dynasty in 1279","C":"a Confucian response to the long popularity of Buddhism in China","D":"the spread of Islam into China through Arab merchants in Quanzhou"},"answer":"C","rationales":{"A":"Incorrect. The passage is about Zhu Xi's response to Buddhism and Daoism, not to Christianity.","B":"Incorrect. Zhu Xi died in 1200, decades before the Mongols ended the Song dynasty.","C":"Correct. Buddhism had been popular in China for centuries. Neo-Confucians like Zhu Xi borrowed some Buddhist ideas about the mind. But they said family and social duties come first.","D":"Incorrect. Muslim merchants did live in Song ports, but Zhu Xi is answering Buddhism and Daoism, not Islam."},"explanation":"Buddhism had shaped Chinese life for about a thousand years. Neo-Confucianism was partly an answer to it. It kept family duty at the center of life."},{"id":"U1-E07","set":"X3","topic":"1.2","lo":"E","skill":"3.A","difficulty":"easy","stem":"Which of the following best describes Arnold's argument about how Islam spread in Sumatra and nearby islands?","options":{"A":"It spread mainly because Muslim armies from India conquered the island.","B":"It spread chiefly through the work of merchants and religious teachers.","C":"It reached the hill peoples first and the coastal towns much later.","D":"It spread after Sumatra's rulers began paying tribute to Mecca."},"answer":"B","rationales":{"A":"Incorrect. Arnold admits that the sword was sometimes used, but he says nothing about armies from India. He stresses traders and preachers.","B":"Correct. Arnold credits \"Saracen merchants,\" missionaries sent from Mecca, and traders who married local women. He says \"preaching and persuasion rather than force\" were the main features.","C":"Incorrect. Arnold says the reverse: the townspeople of Parlak were Muslim, while \"the hill-people\" were not.","D":"Incorrect. The Sharif of Mecca sent missionaries. The passage does not say that Sumatra paid tribute to Mecca."},"explanation":"Arnold stresses trade, marriage, and religious teaching. He admits that force was sometimes used, but he gives peaceful work the larger role. Traders married local women and learned the language, and missionaries persuaded rulers to convert."},{"id":"U1-E08","set":"X3","topic":"1.2","lo":"E","skill":"3.B","difficulty":"medium","stem":"Arnold uses Ibn Battuta's report about legal experts from Persia and an embassy to Delhi as evidence that","options":{"A":"Persian armies had conquered Sumatra by the middle of the 1300s","B":"the sultans of Delhi ruled Sumatra as a province of their empire","C":"Ibn Battuta converted the ruler of Samudra to Islam in 1345","D":"Samudra's ruler had ties with other parts of the Islamic world"},"answer":"D","rationales":{"A":"Incorrect. The Persians at the court were legal scholars, not soldiers.","B":"Incorrect. An embassy is a diplomatic visit. It does not mean that Delhi ruled Sumatra.","C":"Incorrect. The ruler Ibn Battuta met was already a Muslim when Ibn Battuta arrived.","D":"Correct. Arnold says these details show \"that Sumatra was already in touch with several parts of the Muhammadan world.\""},"explanation":"Legal experts came from Persia, and a noble went to Delhi as an ambassador. Arnold uses these facts to show that Samudra's Muslim court had ties across Dar al-Islam, the wider Muslim world."},{"id":"U1-E09","set":"X3","topic":"1.2","lo":"E","skill":"3.D","difficulty":"medium","stem":"Which of the following, if true, would most strengthen Arnold's argument about how Islam spread?","options":{"A":"In West Africa, too, Islam spread first among traders and town rulers, mostly without conquest.","B":"Muslim armies conquered most of Spain within a few years in the early 700s.","C":"The ruler of Samudra made war on his non-Muslim neighbors until they paid him tribute.","D":"The Hindu-Buddhist kingdom of Majapahit was the strongest power on Java in the 1300s."},"answer":"A","rationales":{"A":"Correct. If Islam spread the same peaceful way in another trading region, Arnold's claim about traders and missionaries looks stronger. In West Africa, rulers in places like Mali became Muslim through contact with merchants.","B":"Incorrect. Conquest in Spain says nothing in favor of trade spreading Islam in Sumatra. If anything, it points the other way.","C":"Incorrect. Wars to force neighbors to submit would weaken Arnold's claim, not strengthen it. Arnold himself admits that \"sometimes indeed the sword has been drawn.\"","D":"Incorrect. The strength of a Hindu-Buddhist kingdom on Java tells us nothing about how Islam spread in Sumatra."},"explanation":"Arnold argues that merchants and teachers did more than armies to spread Islam in Sumatra. Evidence that Islam spread the same way in another trading region would make his case stronger.","reasoning":"Comparison"},{"id":"U1-E10","set":"X4","topic":"1.3","lo":"G","skill":"3.A","difficulty":"easy","stem":"Kabir's main point in the poems is that","options":{"A":"Hindus should give up their beliefs and convert to Islam","B":"God is found through inner devotion, not temples or rituals","C":"high-caste people are closer to God than low-caste people","D":"true seekers of God must leave society and live as monks"},"answer":"B","rationales":{"A":"Incorrect. Kabir calls himself the child of both Allah and Ram. He does not ask Hindus to convert.","B":"Correct. Kabir says God is \"beside thee,\" not \"in temple nor in mosque,\" and tells listeners to \"look within your heart.\"","C":"Incorrect. Kabir says \"it is needless to ask of a saint the caste to which he belongs.\"","D":"Incorrect. Kabir says God is not found in \"Yoga and renunciation,\" that is, in giving up ordinary life."},"explanation":"Kabir taught that God lives in every heart. Holy places, ceremonies, and caste do not bring people closer to God. Love and devotion do."},{"id":"U1-E11","set":"X4","topic":"1.3","lo":"G","skill":"1.B","difficulty":"medium","stem":"The ideas expressed in the poems are most closely associated with which religious movement?","options":{"A":"Theravada Buddhism","B":"Neo-Confucianism","C":"The Bhakti movement","D":"Zoroastrianism"},"answer":"C","rationales":{"A":"Incorrect. Theravada Buddhism honored monks who left ordinary life to meditate. Kabir rejects \"renunciation\" as the way to God.","B":"Incorrect. Neo-Confucianism grew in China and focused on social relationships, not on finding God in the heart.","C":"Correct. Bhakti poets like Kabir sang in everyday languages about loving devotion to God. Some also rejected caste ranking and empty rituals.","D":"Incorrect. Kabir's poems use Hindu and Muslim names for God, not Zoroastrian ideas."},"explanation":"These poems reflect the Bhakti movement's focus on loving devotion to God. Kabir, like some other Bhakti poets, also rejected caste ranking."},{"id":"U1-E12","set":"X4","topic":"1.3","lo":"G","skill":"4.A","difficulty":"hard","stem":"Kabir's references to both Hindus and Muslims are best understood in the context of which development already under way in South Asia by c. 1450?","options":{"A":"The Vijayanagara kings' defense of Hindu rule in southern India","B":"The spread of Buddhism from Tibet into the cities of northern India","C":"Muslim rulers and Sufi teachers living among Hindus in north India","D":"A ban on Hindu worship issued by the Mongol rulers of Persia"},"answer":"C","rationales":{"A":"Incorrect. Vijayanagara was a Hindu kingdom in the far south. Kabir lived in Banaras, in the north, and his poems speak to both Hindus and Muslims.","B":"Incorrect. Buddhism had largely faded from northern India by Kabir's time. The poems speak of Hindus and Muslims.","C":"Correct. Muslim sultans had ruled Delhi since the early 1200s. Sufi teachers and Hindu devotional poets lived side by side, and Kabir drew on both traditions.","D":"Incorrect. The Mongol rulers of Persia did not govern northern India."},"explanation":"By Kabir's time, Muslim rulers had governed much of northern India for over two centuries. Hindu and Muslim ideas met there. Kabir uses Hindu and Muslim names for God."},{"id":"U1-E13","set":"X5","topic":"1.4","lo":"I","skill":"1.B","difficulty":"easy","stem":"Which purpose of resettlement is most directly supported by Cieza's description of spies among the settlers?","options":{"A":"Reducing resistance in newly conquered provinces","B":"Punishing criminals by sending them away from the capital","C":"Increasing food supplies by settling unused farmland","D":"Giving local chiefs more freedom from imperial officials"},"answer":"A","rationales":{"A":"Correct. Spies among the settlers reported the conquered people's \"conversations and schemes\" to the governors and to Cuzco. That helped the Incas stop plots before they became revolts.","B":"Incorrect. Cieza describes the settlers as loyal subjects from peaceful areas, not as criminals.","C":"Incorrect. The Incas did sometimes move people to farm new land. But spies watching for plots point to control, not food.","D":"Incorrect. The spies reported to imperial governors. That tightened control over local chiefs instead of loosening it."},"explanation":"The Incas moved loyal settlers into newly conquered provinces. Spies among them reported possible plots to imperial officials. This helped Inca rulers find and stop rebellions."},{"id":"U1-E14","set":"X5","topic":"1.4","lo":"I","skill":"3.B","difficulty":"easy","stem":"Which experience does Cieza give as evidence that the quipus could keep exact records?","options":{"A":"He compared the quipus with written books kept by Inca priests in Cuzco.","B":"He learned to read the quipus himself while living with the Inca nobles.","C":"A local lord showed him quipu records of goods given to the Spaniards.","D":"He checked the quipus against Spanish tax records sent from Mexico."},"answer":"C","rationales":{"A":"Incorrect. Cieza describes knotted cords. He does not say he compared them with written books.","B":"Incorrect. Cieza says a local lord explained the quipus to him. He does not say he learned to read them.","C":"Correct. Cieza says the lord Guacarapora showed him records of everything given to the Spaniards. The records were so exact that Cieza \"was quite astonished.\"","D":"Incorrect. The passage does not mention any records from Mexico."},"explanation":"Cieza admits he doubted the quipus at first. Then a local lord showed him exact records kept in knots. That changed his mind."},{"id":"U1-E15","set":"X5","topic":"1.4","lo":"I","skill":"2.C","difficulty":"hard","stem":"Which of the following is a limitation of Cieza's account as evidence about Inca rule?","options":{"A":"Cieza relied partly on Inca nobles, who may have played down the harsh side of Inca rule.","B":"Cieza wrote centuries after the Inca Empire fell, using its ruins as evidence.","C":"Cieza was an Inca official who wanted to hide the empire's treatment of rebels.","D":"Cieza did not visit the Andes and based his account on rumors he heard in Spain."},"answer":"A","rationales":{"A":"Correct. Inca nobles had reasons to make their former rulers look wise and fair. Conquered peoples who were forced to move might have told a different story.","B":"Incorrect. Cieza wrote about 1550, less than 20 years after the Spanish invasion of 1532, and he talked with living people.","C":"Incorrect. Cieza was a Spanish soldier and writer, not an Inca official.","D":"Incorrect. Cieza traveled in Peru himself and describes his visit to Marcavillca."},"explanation":"Some of Cieza's informants had belonged to the Inca ruling class. Their accounts may favor their old rulers. Cieza added his own observations, but Inca rule had ended before he arrived, so historians check his account against other evidence."},{"id":"U1-E16","set":"X5","topic":"1.7","lo":"N","skill":"5.A","difficulty":"hard","stem":"The Inca policies described in the passage contrast most clearly with the Mexica Empire's greater reliance on","options":{"A":"replacing local rulers with governors and officials sent from the capital","B":"resettling whole conquered families near the workshops of the capital","C":"collecting tribute through local rulers they usually left in power","D":"demanding military service in place of tribute in goods"},"answer":"C","rationales":{"A":"Incorrect. Mexica rulers sometimes placed governors in conquered towns, but they mostly left local rulers in place. The Incas relied more on officials and settlers sent by the central government.","B":"Incorrect. Moving conquered families was an Inca policy, as the passage shows. The Mexica did not resettle conquered peoples near workshops.","C":"Correct. The Mexica usually left conquered city-states under their own rulers, who collected tribute and sent it on. The Incas also used local leaders, but they did more to reshape conquered areas by moving whole communities.","D":"Incorrect. The Mexica demanded soldiers and also goods. Military service did not replace tribute in goods."},"explanation":"Both empires used local leaders. The Incas also moved some communities and spread a shared language alongside local ones. The Mexica relied more on tribute collected through existing local rulers.","reasoning":"Comparison"},{"id":"U1-E17","set":"X6","topic":"1.5","lo":"J","skill":"1.B","difficulty":"easy","stem":"Ibn Battuta's account best supports which claim about the Mali Empire?","options":{"A":"Its rulers had rejected Islam in favor of traditional religions.","B":"Its rulers combined Islamic practices with older West African traditions.","C":"Its government was run by a council of Arab merchants from North Africa.","D":"Its rulers had given up older court customs after converting to Islam."},"answer":"B","rationales":{"A":"Incorrect. Ibn Battuta describes crowded mosques and children learning the Quran by heart.","B":"Correct. Mali's people filled the mosques and memorized the Quran. The court also kept older customs, like the poets' ceremony, which came from \"prior to the introduction of Islam.\"","C":"Incorrect. The passage shows the sultan (the mansa) holding court with his musicians, poets, and armed guards. It does not mention any council of Arab merchants.","D":"Incorrect. Ibn Battuta says the poets' custom came from before Islam \"and that they have kept it up.\""},"explanation":"Mali's kings were Muslim, which linked them to North Africa and the Middle East. They also kept older customs, like praise poetry. These customs built their power at home."},{"id":"U1-E18","set":"X6","topic":"1.5","lo":"J","skill":"2.B","difficulty":"medium","stem":"Ibn Battuta's criticisms in the last paragraph most likely reflect","options":{"A":"his wish to stop Mali's ruler from selling gold to Europeans","B":"his belief that the people of West Africa had not yet heard of Islam","C":"his view, as a scholar from Morocco, of how proper Muslims should behave","D":"his effort to win a high government position from the ruler of Mali"},"answer":"C","rationales":{"A":"Incorrect. The passage does not mention trade with Europe.","B":"Incorrect. Ibn Battuta praises Mali's crowded mosques and Quran lessons, so he knew its people were Muslims.","C":"Correct. Ibn Battuta was trained in Islamic law. He judged women's dress and the dust ceremony by the rules he knew from Morocco.","D":"Incorrect. He is describing customs he observed; nothing suggests he is seeking a job from the mansa."},"explanation":"Ibn Battuta admired Mali's justice and its faithful prayer. But he disliked customs that did not fit his idea of Muslim behavior. His criticisms show his own point of view."},{"id":"U1-E19","set":"X6","topic":"1.5","lo":"J","skill":"5.B","difficulty":"medium","stem":"The wealth of Mali's court, shown by the gold described in the passage, came mainly from","options":{"A":"tribute paid to Mali by the Mamluk sultans of Egypt","B":"control of trade across the Sahara in gold and salt","C":"taxes on spices shipped from India to the Swahili coast","D":"selling horses raised in West Africa to North African buyers"},"answer":"B","rationales":{"A":"Incorrect. Mansa Musa passed through Mamluk Egypt on his way to Mecca, but Egypt did not pay tribute to Mali.","B":"Correct. Mali controlled gold fields and the trade routes across the Sahara. Gold went north; salt, horses, and cloth came south.","C":"Incorrect. The Swahili coast is in East Africa, far from Mali. That trade made cities like Kilwa rich.","D":"Incorrect. Horses went the other way. Traders brought them south across the Sahara to sell in West Africa."},"explanation":"Mali grew rich by taxing trade across the Sahara. Gold went north, and salt came south. The same trade brought Muslim scholars like Ibn Battuta.","reasoning":"Causation"},{"id":"U1-E20","set":"X7","topic":"1.6","lo":"L","skill":"3.C","difficulty":"easy","stem":"Which of the following best describes a similarity between the two sources?","options":{"A":"Both protect nobles' powers against a central ruler.","B":"Both give the pope the power to choose kings and emperors.","C":"Both free serfs and give peasants the right to own land.","D":"Both create a standing army paid for by royal taxes."},"answer":"A","rationales":{"A":"Correct. Magna Carta lets 25 barons force the king to keep his promises. The Golden Bull lets the prince electors choose the emperor and keep mines and tolls.","B":"Incorrect. In Source 2 the electors, not the pope, choose the king, and Source 1 does not mention the pope.","C":"Incorrect. Neither source frees serfs. Magna Carta protects \"freemen.\"","D":"Incorrect. Neither source creates a royal army; both limit the ruler's power."},"explanation":"In England and in the Holy Roman Empire, powerful nobles got their rights written down. These rules kept rulers from gaining too much power.","reasoning":"Comparison"},{"id":"U1-E21","set":"X7","topic":"1.6","lo":"L","skill":"3.C","difficulty":"hard","stem":"Which of the following best describes a difference between the political arrangements in the two sources?","options":{"A":"English barons chose each new king; the electors served as advisers to the emperor.","B":"English barons controlled the royal mines; the electors controlled the Church courts.","C":"English barons relied on the pope to limit the king; the electors approved the emperor's taxes.","D":"English barons could enforce the charter against the king; the electors chose the ruler."},"answer":"D","rationales":{"A":"Incorrect. Magna Carta does not let the barons choose the king. In Source 2, the electors choose the ruler; they are not just his advisers.","B":"Incorrect. The Golden Bull, not Magna Carta, gives rights to mines, and it gives them to the electors. Neither excerpt says the electors controlled Church courts.","C":"Incorrect. Neither excerpt relies on the pope. Magna Carta, not the Golden Bull, requires consent for certain payments.","D":"Correct. Clause 61 lets 25 barons force King John to keep his promises. The Golden Bull names the prince electors who choose the king of the Romans, the future emperor."},"explanation":"Both documents limited rulers, but in different ways. English barons could force the king to keep the charter. The German electors chose the ruler himself.","reasoning":"Comparison"},{"id":"U1-E22","set":"X7","topic":"1.6","lo":"L","skill":"5.B","difficulty":"medium","stem":"The principle stated in clause 12 of Source 1 is most closely connected to which later development in England?","options":{"A":"Parliament's growing role in approving taxes","B":"The king's growing power to tax without the nobles' consent","C":"The end of serfdom in England in the 1200s","D":"The pope's power to approve or reject English taxes"},"answer":"A","rationales":{"A":"Correct. Clause 12 says the king needs \"common counsel\" to raise certain taxes. Over time, kings called Parliaments to give that agreement, and Parliament's power grew.","B":"Incorrect. Clause 12 limited the king's power to tax. Over time, kings had to ask for consent more often, not less.","C":"Incorrect. Clause 12 is about taxes on the barons and the realm, not serfs. Serfdom lasted in England long after 1215.","D":"Incorrect. Clause 12 says taxes need the \"common counsel\" of the realm, not the pope's approval."},"explanation":"Clause 12 said the king needed the \"common counsel\" of the realm before raising scutage or certain aids. This clause was left out when Magna Carta was reissued in 1216, but the idea lived on. Later kings called Parliaments to agree to new taxes, and Parliament grew stronger.","reasoning":"Continuity and Change"},{"id":"U1-E23","set":"X8","topic":"1.6","lo":"M","skill":"1.B","difficulty":"easy","stem":"The scene in the painting best illustrates which feature of European society from c. 1200 to c. 1450?","options":{"A":"Most people were peasants who farmed land on a lord's estate.","B":"Most people lived in large cities and worked for merchant guilds.","C":"Most peasants owned their own farms and did not work for a lord.","D":"Farm work was done mainly by paid laborers hired by city merchants."},"answer":"A","rationales":{"A":"Correct. Peasants plow, prune vines, and tend sheep in the fields below a lord's castle. Europe was mostly a farming society, and much land was organized into manors.","B":"Incorrect. The painting shows country fields, and most Europeans lived in the countryside, not in cities.","C":"Incorrect. Most peasants farmed land that belonged to a lord, and they owed him work, fees, or crops.","D":"Incorrect. Most farm workers were peasants tied to a lord's land, not workers hired by merchants."},"explanation":"Most Europeans in this period were peasants. Their work produced food and wealth on estates controlled by nobles. Some peasants were serfs; others had more rights."},{"id":"U1-E24","set":"X8","topic":"1.6","lo":"M","skill":"2.B","difficulty":"hard","stem":"The painting was most likely intended to","options":{"A":"protest the harsh treatment of peasants by French nobles","B":"teach peasants new farming methods in their own language","C":"persuade knights to join a crusade","D":"honor its rich owner by showing his orderly lands"},"answer":"D","rationales":{"A":"Incorrect. The peasants work calmly. The painting does not show suffering or protest.","B":"Incorrect. The book was a costly prayer book made for a duke's private use. Its pictures were not lessons for farmers.","C":"Incorrect. The painting shows farm work, not war or a crusade.","D":"Correct. The book was a costly prayer book made for the Duke of Berry, a royal prince. Its calendar page shows his castle above calm, busy fields, a flattering picture of his lands."},"explanation":"This page comes from the calendar of a costly prayer book made for the duke. It links the month of March with seasonal farm work and shows his lands as calm and orderly. Real peasant life was often harder."},{"id":"U1-E25","set":"X8","topic":"1.6","lo":"L","skill":"5.B","difficulty":"medium","stem":"Which development from c. 1200 to c. 1450 most strongly challenged the kind of local power represented by the castle?","options":{"A":"The granting of country estates to knights in return for military service","B":"The growth of the dues that peasants owed to the owners of estates","C":"The inheritance of noble titles and family estates from father to son","D":"Kings' growing use of royal courts and taxes to extend their power"},"answer":"D","rationales":{"A":"Incorrect. Granting estates to knights created more local lords. It built up local power instead of challenging it.","B":"Incorrect. Higher dues from peasants made estate owners richer and stronger, not weaker.","C":"Incorrect. Passing titles and lands down within noble families helped local power last. It did not challenge it.","D":"Correct. In England and France, kings built up royal courts and collected more taxes in this period. Over time, royal government reached into lands that lords had once run on their own."},"explanation":"Castles were homes and forts for lords who ruled their own areas. In this period, some kings expanded royal courts and collected more taxes. In France, kings began collecting regular taxes during the Hundred Years' War. These changes reached into areas where nobles had held local power.","reasoning":"Continuity and Change"}]}},"2":{"unit":2,"title":"Networks of Exchange","period":"c. 1200–1450","examWeighting":"8–10%","blurb":"The Silk Roads, the Mongol Empire, Indian Ocean and trans-Saharan trade, and the cultural and environmental effects of connecting Afro-Eurasia.","version":"2026-11-07a","schemaNotes":"Every question has a set id; data.stimuli[set] holds its source (passage | pair | image | table | bar). Options A-D. LO letters follow the Fall 2026 AP World CED (Unit 2: Learning Objectives A-L).","topics":[{"id":"2.1","name":"The Silk Roads","lo":["A"]},{"id":"2.2","name":"The Mongol Empire and the Making of the Modern World","lo":["B","C","D"]},{"id":"2.3","name":"Exchange in the Indian Ocean","lo":["E","F","G"]},{"id":"2.4","name":"Trans-Saharan Trade Routes","lo":["H","I"]},{"id":"2.5","name":"Cultural Consequences of Connectivity","lo":["J"]},{"id":"2.6","name":"Environmental Consequences of Connectivity","lo":["K"]},{"id":"2.7","name":"Comparison of Economic Exchange","lo":["L"]}],"stimuli":{"X1":{"type":"passage","paragraphs":["In the first place, you must let your beard grow long and not shave. And at Tana* you should furnish yourself with a dragoman. And you must not try to save money in the matter of dragomen by taking a bad one instead of a good one. For the additional wages of the good one will not cost you so much as you will save by having him. …","The road you travel from Tana to Cathay is perfectly safe, whether by day or by night, according to what the merchants say who have used it. Only if the merchant, in going or coming, should die upon the road, everything belonging to him will become the perquisite of the lord of the country in which he dies, and the officers of the lord will take possession of all. …","And there is another danger: this is when the lord of the country dies, and before the new lord who is to have the lordship is proclaimed; during such intervals there have sometimes been irregularities practised on the Franks, and other foreigners. … And neither will the roads be safe to travel until the other lord be proclaimed who is to reign in room of him who is deceased.","Cathay is a province which contained a multitude of cities and towns. Among others there is one in particular, that is to say the capital city, to which is great resort of merchants, and in which there is a vast amount of trade; and this city is called Cambalec. …","Whatever silver the merchants may carry with them as far as Cathay the lord of Cathay will take from them and put into his treasury. And to merchants who thus bring silver they give that paper money of theirs in exchange. This is of yellow paper, stamped with the seal of the lord aforesaid. … And with this money you can readily buy silk and all other merchandize that you have a desire to buy. And all the people of the country are bound to receive it. And yet you shall not pay a higher price for your goods because your money is of paper."],"attribution":"Francesco Balducci Pegolotti, agent of the Bardi banking company of Florence, Italy, The Practice of Commerce, a handbook for merchants, written about 1340","translation":"Translated by Henry Yule, revised by Henri Cordier, Cathay and the Way Thither, vol. III (1914); adapted","footnotes":[{"mark":"*","text":"Tana was an Italian trading post at the mouth of the Don River, on the Sea of Azov (an arm of the Black Sea). Cathay was the European name for northern China, and Cambalec is Beijing."}],"glossary":[{"t":"dragoman","d":"an interpreter and guide"},{"t":"perquisite","d":"something a ruler has the right to take"},{"t":"Franks","d":"Pegolotti's word for western Europeans"},{"t":"proclaimed","d":"officially announced"},{"t":"in room of","d":"in place of"},{"t":"great resort of merchants","d":"many merchants come there"}]},"X2":{"type":"pair","items":[{"label":"Source 1","paragraphs":["For some years I continued averse from mentioning this event, deeming it so horrible that I shrank from recording it … To whom, indeed, can it be easy to write the announcement of the death-blow of Islam and the Muslims …? …","… For these were a people who emerged from the confines of China, and attacked the cities of Turkistan, like Kashghar and Balasaghun, and thence advanced on the cities of Transoxiana, such as Samarqand, Bukhara and the like, taking possession of them … and of them one division then passed on into Khurasan, until they had made an end of taking possession, and destroying, and slaying, and plundering … and all this in less than a year; this is a thing whereof the like hath not been heard. …","Moreover they need no commissariat, nor the conveyance of supplies, for they have with them sheep, cows, horses, and the like quadrupeds, the flesh of which they eat, [needing] naught else. …","… As for these Tartars*, their achievements were only rendered possible by the absence of any effective obstacle; and the cause of this absence was that Muhammad Khwarazmshah had overrun the [Muslim] lands, slaying and destroying their Kings, so that he remained alone ruling over all these countries; wherefore, when he was defeated by the Tartars, none was left in the lands to check those or protect these …"],"attribution":"Ibn al-Athir, Muslim historian in Mosul (in today's Iraq), The Complete History, from his entry for the year 1220–1221","translation":"Translated by Edward G. Browne, A Literary History of Persia, vol. II (1906); adapted","footnotes":[{"mark":"*","text":"\"Tartars\" (Tatars) is the name Ibn al-Athir and many other writers of the time used for the Mongols."}],"glossary":[{"t":"averse from","d":"unwilling to do"},{"t":"Turkistan, Transoxiana, Khurasan","d":"regions of Central Asia and eastern Persia"},{"t":"commissariat","d":"a system for bringing food and supplies to an army"},{"t":"quadrupeds","d":"four-legged animals"},{"t":"naught","d":"nothing"},{"t":"Khwarazmshah","d":"the ruler of the Khwarazmian Empire, a Muslim state in Central Asia and Persia"}]},{"label":"Source 2","paragraphs":["… Under the tolerant rule of the Ilkhans, Buddhist and Moslem, Christian and Jew succeeded each other in the highest positions of the state with surprising swiftness, while all races of the known world mingled in Tabriz, the cosmopolitan capital. …","… Chinese influences soon made themselves strongly felt in Hulagu's dominions. … The Chinese quarter in Tabriz became an important section of this new capital of the Mongol domain.","With the fall of Bagdad, Tabriz soon took its place as the leading commercial center of Western Asia … There were treaties in 1305 and 1320 between Venice and the court of Tabriz, and the latter treaty gave to Venetians elaborate privileges with regard to residence and trade."],"attribution":"Thomas Francis Carter, American historian of China, The Invention of Printing in China and Its Spread Westward, 1925","translation":"Adapted","glossary":[{"t":"Ilkhans","d":"the Mongol rulers of Persia, descendants of Hulagu"},{"t":"cosmopolitan","d":"full of people from many different places"},{"t":"Hulagu","d":"a grandson of Chinggis Khan who conquered Persia and Baghdad in the 1250s"},{"t":"dominions","d":"the lands a ruler controls"},{"t":"privileges","d":"special rights"}]}]},"X3":{"type":"passage","paragraphs":["Formerly it was not called a kingdom … There also was no king, but only a chief, the country belonging to Siam, to which they had to pay a tribute of 40 taels of gold, and if they failed to do this, they were attacked for it.","In the year 1409 the imperial envoy Chéng Ho [Zheng He] brought an order from the emperor and gave to the chief of this country two silver seals, a cap, a girdle and a long robe; he erected a stone and raised the place to a city, after which the land was called the kingdom of Malacca. From this time the Siamese did not venture to molest it any more, and the chief of the country, having become king by the imperial favour, went with his wife to the court (of China) to present his thanks and to bring a tribute of products of his country. …","There is a large brook passing before the residence of the king on its way to the sea; the king has made a bridge over it, on which he has constructed about twenty pavilions, in which the sale of all kinds of articles is conducted.","The king and the people are Mahomedans* and they carefully observe the tenets of this religion. …","… Tin is found in two places of the mountains, and the king has appointed officers to control the mines. … In all their trading transactions they use these pieces of tin instead of money. …","… When the government ships (of the mission to which the author belonged) were on their home voyage, they visited this place as well to repair as to load native products; they waited here for a favourable southwind and in the middle of the fifth month they put to sea on their voyage home. …"],"attribution":"Ma Huan, Chinese Muslim interpreter who sailed with the fleets of Admiral Zheng He, describing Malacca, a port on the strait between the Malay Peninsula and Sumatra, from his General Account of the Shores of the Ocean, begun in 1416","translation":"Translated by W. P. Groeneveldt, Notes on the Malay Archipelago and Malacca (1876); adapted","footnotes":[{"mark":"*","text":"\"Mahomedans\" is the translator's word for Muslims."}],"glossary":[{"t":"Siam","d":"the Thai kingdom of Ayutthaya, north of Malacca"},{"t":"taels","d":"a Chinese unit of weight for gold and silver"},{"t":"envoy","d":"a person sent by a ruler to deliver messages and gifts"},{"t":"girdle","d":"a belt"},{"t":"molest","d":"attack or bother"},{"t":"tenets","d":"beliefs and rules"},{"t":"fifth month","d":"in the Chinese calendar, about June"}]},"X4":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Catalan_Atlas_BNF_Sheet_6_Mansa_Musa.jpg/960px-Catalan_Atlas_BNF_Sheet_6_Mansa_Musa.jpg","width":960,"height":685,"alt":"A section of an old hand-drawn map showing a crowned king seated on a throne, holding up a round gold object and a scepter, surrounded by small drawings of towns.","caption":"This section of a hand-drawn map shows lands south of the Sahara. A king sits on a throne in the center. He wears a gold crown, holds up a round gold object in one hand, and holds a scepter in the other. Small drawings of towns surround him. Labels in Catalan name several of them, including Tagaza (Taghaza), Tenbuch (Timbuktu), Ciutat de Melli (the city of Mali), and Geugeu (Gao). A note in Catalan at the upper right names the king as Musse Melly.","attribution":"Abraham Cresques (attributed), Jewish mapmaker on the island of Majorca (in today's Spain), detail from the Catalan Atlas, a map of the known world drawn on parchment, 1375","credit":"Bibliothèque nationale de France, Paris. Public domain image via Wikimedia Commons.","description":"A pale map covered with thin red, green, and black lines that cross one another. In the center, a dark-skinned king with a beard sits on a gold throne with red cushions. He wears a gold crown and a long light robe. His right hand holds up a round gold object, and his left hand holds a tall scepter topped with a lily-shaped ornament. Around him are small drawings of towns: domed and walled buildings on colored mounds, some with flags. The large word GINYIA is written in red and blue letters to the left. Lines of Catalan writing appear at the upper left and upper right. A band of wavy blue-gray lines, standing for water, runs along the bottom.","glossary":[{"t":"Catalan","d":"the language of Catalonia and Majorca, in eastern Spain"},{"t":"scepter","d":"a decorated rod that a ruler holds as a sign of power"},{"t":"parchment","d":"animal skin prepared for writing and drawing"}]},"X5":{"type":"passage","paragraphs":["Calicut is a perfectly secure harbour, which, like that of Ormuz, brings together merchants from every city and from every country; in it are to be found abundance of precious articles brought thither from maritime countries, and especially from Abyssinia, Zirbad, and Zanguebar; from time to time ships arrive there from the shores of the House of God and other parts of the Hedjaz, and abide at will, for a greater or longer space, in this harbour; the town is inhabited by Infidels*, and situated on a hostile shore. It contains a considerable number of Mussulmauns, who are constant residents, and have built two mosques, in which they meet every Friday to offer up prayer. They have one Kadi, a priest, and for the most part they belong to the sect of Schafei.","Security and justice are so firmly established in this city, that the most wealthy merchants bring thither from maritime countries considerable cargoes, which they unload, and unhesitatingly send into the markets and the bazaars, without thinking in the meantime of any necessity of checking the account or of keeping watch over the goods. The officers of the custom-house take upon themselves the charge of looking after the merchandise, over which they keep watch day and night. When a sale is effected, they levy a duty on the goods of one-fortieth part; if they are not sold, they make no charge on them whatsoever.","In other ports a strange practice is adopted. When a vessel sets sail for a certain point, and suddenly is driven by a decree of Divine Providence into another roadstead, the inhabitants, under the pretext that the wind has driven it there, plunder the ship. But at Calicut, every ship, whatever place it may come from, or wherever it may be bound, when it puts into this port is treated like other vessels, and has no trouble of any kind to put up with. …","… From Calicut are vessels continually sailing for Mecca, which are for the most part laden with pepper. The inhabitants of Calicut are adventurous sailors: they are known by the name of Tchini-betchegan (son of the Chinese), and pirates do not dare to attack the vessels of Calicut. In this harbour one may find everything that can be desired. …"],"attribution":"Abd al-Razzaq Samarqandi, Persian official sent as an ambassador to India by Shah Rukh, the Timurid ruler of Herat, describing Calicut, on the southwest coast of India, which he reached in 1442","translation":"Translated from Persian into French by Étienne Quatremère, and into English by R. H. Major, India in the Fifteenth Century (1857); adapted","footnotes":[{"mark":"*","text":"\"Infidels\" is the translation's word for people who are not Muslims. Calicut's ruler, the Samari (Zamorin), was a Hindu."}],"glossary":[{"t":"Ormuz","d":"Hormuz, a port at the mouth of the Persian Gulf"},{"t":"Abyssinia, Zirbad, Zanguebar","d":"Ethiopia; the lands east of India; the East African coast"},{"t":"the House of God, the Hedjaz","d":"the Kaaba in Mecca; the region of Arabia around Mecca and Medina"},{"t":"Mussulmauns","d":"Muslims"},{"t":"Kadi","d":"a judge of Islamic law"},{"t":"sect of Schafei","d":"the Shafi'i school of Islamic law"},{"t":"custom-house","d":"the office that collects taxes on goods at a port"},{"t":"duty","d":"a tax on goods"},{"t":"roadstead","d":"a place where ships can anchor"},{"t":"Divine Providence","d":"God's will"}]},"X6":{"type":"bar","title":"Estimated Rise in Pay Rates for Threshing Grain in Five Regions of England, 1350–1400, Compared with Rates Before 1348","categories":["Eastern\nCounties","Midland\nCounties","Southern\nCounties","Western\nCounties","Northern\nCounties"],"series":[{"name":"Percent rise in pay, 1350–1400","values":[60,73,48,37,59]}],"yLabel":"Percent rise","text":"Threshing is beating harvested grain to separate the seeds from the stalks. The economic historian who made these estimates studied records of the wages paid on English farms and estates. Each figure combines the pay for threshing wheat, barley, and oats, and shows how much higher the average pay from 1350 to 1400 was than the pay before 1348. The figures are rates paid for the work, not yearly earnings, and they are not adjusted for changes in prices.","source":"James E. Thorold Rogers, Six Centuries of Work and Wages: The History of English Labour (London, 1884), p. 233"},"X7":{"type":"passage","paragraphs":["Of all the medieval writers, probably the one most influential in introducing the new numerals to the scholars of Europe was Leonardo Fibonacci, of Pisa. … Situated practically at the mouth of the Arno, Pisa formed with Genoa and Venice the trio of the greatest commercial centers of Italy at the opening of the thirteenth century. …","Leonardo's father was a commercial agent at Bugia*, … and at the close of the twelfth century it was a center of African commerce. It was here that Leonardo was taken as a child, and here he went to school to a Moorish** master. When he reached the years of young manhood he started on a tour of the Mediterranean Sea, and visited Egypt, Syria, Greece, Sicily, and Provence, meeting with scholars as well as with merchants, and imbibing a knowledge of the various systems of numbers in use in the centers of trade. All these systems, however, he says he counted almost as errors compared with that of the Hindus. Returning to Pisa, he wrote his Liber Abaci in 1202 … In this work the numerals are explained and are used in the usual computations of business. Such a treatise was not destined to be popular, however, because it was too advanced for the mercantile class, and too novel for the conservative university circles. …","… It must be remembered, however, that there was great difficulty in spreading knowledge at this time, some two hundred and fifty years before printing was invented***. … Although the bankers of Florence were forbidden to use these numerals [in their account books] in 1299, … the numerals really made much headway from about 1275 on."],"attribution":"David Eugene Smith and Louis Charles Karpinski, American historians of mathematics, The Hindu-Arabic Numerals, 1911","translation":"Adapted","footnotes":[{"mark":"*","text":"Bugia (also called Bougie) is today's Béjaïa, a port on the coast of Algeria in North Africa."},{"mark":"**","text":"\"Moorish\" is the authors' word for a North African Muslim."},{"mark":"***","text":"The authors mean printing in Europe, which began in the mid-1400s. Printing from carved wooden blocks was centuries older in China."}],"glossary":[{"t":"numerals","d":"the symbols used to write numbers"},{"t":"imbibing","d":"taking in"},{"t":"Liber Abaci","d":"Latin for \"Book of Calculation\""},{"t":"computations","d":"calculations"},{"t":"treatise","d":"a long written study of a subject"},{"t":"mercantile class","d":"merchants"},{"t":"headway","d":"progress"}]},"X8":{"type":"passage","paragraphs":["… this land of Samarqand is not alone rich in food stuffs but also in manufactures, such as factories of silk … Thus trade has always been fostered by Timur* with the view of making his capital the noblest of cities: and during all his conquests wheresoever he came he carried off the best men of the population to people Samarqand, bringing thither together the master-craftsmen of all nations. Thus from Damascus he carried away with him all the weavers of that city, those who worked at the silk looms. Further the bow-makers who produce those cross-bows which are so famous: likewise armourers: also the craftsmen in glass and porcelain, who are known to be the best in all the world. From Turkey he had brought … all men of other crafts wheresoever he found them, such as the silver-smiths and the masons. … Lastly hemp and flax had been sown and grown for the purpose in the Samarqand lands, where never before this crop had been cultivated.","… The markets of Samarqand further are amply stored with merchandise imported from distant and foreign countries. From Russia and Tartary come leathers and linens, from Cathay silk stuffs that are the finest in the whole world … Thence too is brought musk which is found in no other land but Cathay, with balas rubies and diamonds …, also pearls, lastly rhubarb with many other spiceries. The goods that are imported to Samarqand from Cathay indeed are of the richest and most precious of all those brought thither from foreign parts, for the craftsmen of Cathay are reputed to be the most skilful by far beyond those of any other nation …","From India there are brought to Samarqand the lesser spiceries, which indeed are the most costly of the kind, such as nutmegs and cloves and mace with cinnamon both in the flower and as bark, with ginger and manna: all these with many other kinds that are never to be found in the markets of Alexandria. …","… During the month of June of this year, immediately before the date of our coming to Samarqand, there had arrived a caravan of eight hundred camels bringing merchandise from China. …"],"attribution":"Ruy González de Clavijo, ambassador sent by King Henry III of Castile (in Spain) to the court of Timur, describing Samarkand, which he visited in 1404","translation":"Translated by Guy Le Strange, Clavijo: Embassy to Tamerlane, 1403–1406 (1928); adapted","footnotes":[{"mark":"*","text":"Timur (also called Tamerlane) was a conqueror from Central Asia who ruled from Samarkand from 1370 to 1405. His armies took Damascus, in Syria, in 1401."}],"glossary":[{"t":"manufactures","d":"goods made by workers"},{"t":"factories","d":"here, workshops"},{"t":"fostered","d":"encouraged"},{"t":"armourers","d":"makers of armor"},{"t":"masons","d":"builders who work with stone"},{"t":"hemp and flax","d":"plants grown to make rope and linen cloth"},{"t":"Tartary","d":"the steppe lands north of Samarkand"},{"t":"Cathay","d":"China"},{"t":"musk","d":"a costly perfume taken from a kind of deer"},{"t":"balas rubies","d":"reddish gemstones"},{"t":"rhubarb","d":"here, a dried root used as medicine"},{"t":"spiceries","d":"spices"},{"t":"manna","d":"a sweet, dried plant juice used as medicine"},{"t":"Alexandria","d":"a port city in Egypt"}]},"P1":{"type":"passage","paragraphs":["… [The Emperor] makes [his money] after this fashion. He makes them take of the bark of a certain tree, in fact of the Mulberry Tree … What they take is a certain fine white bast or skin which lies between the wood of the tree and the thick outer bark, and this they make into something resembling sheets of paper, but black. When these sheets have been prepared they are cut up into pieces of different sizes. … All these pieces of paper are issued with as much solemnity and authority as if they were of pure gold or silver … Any one forging it would be punished with death. …","With these pieces of paper, made as I have described, he causes all payments on his own account to be made; and he makes them to pass current universally over all his kingdoms and provinces and territories, and whithersoever his power and sovereignty extends. And nobody, however important he may think himself, dares to refuse them on pain of death. And indeed everybody takes them readily, for wheresoever a person may go throughout the Great Kaan's* dominions he shall find these pieces of paper current, and shall be able to transact all sales and purchases of goods by means of them just as well as if they were coins of pure gold. And all the while they are so light that ten bezants' worth does not weigh one golden bezant.","Furthermore all merchants arriving from India or other countries, and bringing with them gold or silver or gems and pearls, are prohibited from selling to any one but the Emperor. … the Emperor then pays a liberal price for them in those pieces of paper. … And with this paper-money they can buy what they like anywhere over the Empire, whilst it is also vastly lighter to carry about on their journeys. …","Now you have heard the ways and means whereby the Great Kaan may have, and in fact has, more treasure than all the Kings in the World …"],"attribution":"Marco Polo, Venetian merchant who lived in China under Mongol rule from 1275 to 1292, describing the paper money of the Great Khan; his book was written down by Rustichello of Pisa in 1298","translation":"Translated by Henry Yule, revised by Henri Cordier (1903); adapted","footnotes":[{"mark":"*","text":"The Great Kaan (Khan) is Khubilai Khan, Great Khan of the Mongols from 1260 to 1294, who completed the Mongol conquest of China in 1279."}],"glossary":[{"t":"bast","d":"the soft inner layer of tree bark"},{"t":"solemnity","d":"seriousness"},{"t":"forging","d":"making fake copies"},{"t":"pass current","d":"be accepted as money"},{"t":"sovereignty","d":"supreme power to rule"},{"t":"dominions","d":"the lands a ruler controls"},{"t":"bezant","d":"a gold coin used around the Mediterranean"},{"t":"liberal","d":"generous"}]},"P2":{"type":"table","title":"The Route from Tana to Cambalec (Beijing), Stage by Stage, as Listed in a Florentine Merchant's Handbook, about 1340","columns":["Stage of the route (modern name)","Travel time","How goods were carried"],"rows":[["Tana to Gittarchan (Astrakhan)","25 days (10–12 days by horse-wagon)","Ox-wagon or horse-wagon"],["Gittarchan to Sara (Sarai)","1 day","By river"],["Sara to Saracanco (Saraichik)","8 days","By river (or by land)"],["Saracanco to Organci (Urgench)","20 days","Camel-wagon"],["Organci to Oltrarre (Otrar)","35–40 days","Camel-wagons"],["Oltrarre to Armalec (Almaliq)","45 days","Pack-asses"],["Armalec to Camexu (Zhangye, in Gansu)","70 days","Asses"],["Camexu to a river (name left blank in the manuscript)","45 days","On horseback"],["Down the river to Cassai (Hangzhou)","Not given","By river"],["Cassai to Cambalec (Beijing)","30 days","Not given"]],"text":"Tana was an Italian trading post at the mouth of the Don River, on the Sea of Azov (an arm of the Black Sea). Cambalec was the capital of Cathay (northern China). The author, Francesco Balducci Pegolotti, was an agent of a Florentine banking company; he gathered this information for other merchants. He adds that at Organci \"there is a ready sale for goods\" and that at Cassai the merchant can sell his silver for paper money, \"for that is a most active place of business.\"","source":"Francesco Balducci Pegolotti, The Practice of Commerce, about 1340, translated by Henry Yule, revised by Henri Cordier, Cathay and the Way Thither, vol. III (London: Hakluyt Society, 1914), pp. 146–149. Modern names added in parentheses."},"P3":{"type":"passage","paragraphs":["A certain woman from Metz in Lorraine, Paquette by name, and who had been made a prisoner in Hungary, found us out, and she gave us the best food she could. … she told us that there was in Caracarum [Karakorum] a certain master goldsmith, William by name, a native of Paris …","… Mangu* had at Caracarum a great palace … In the entry of this great palace, it being unseemly to bring in there skins of milk and other drinks, master William the Parisian had made for him a great silver tree, and at its roots are four lions of silver, each with a conduit through it, and all belching forth white milk of mares. …","Of the city of Caracarum you must know that, exclusive of the palace of the Chan, it is not as big as the village of Saint Denis** … There are two quarters in it; one of the Saracens*** in which are the markets, and where a great many Tartars gather on account of the court, which is always near this (city), and on account of the great number of ambassadors; the other is the quarter of the Cathayans, all of whom are artisans. … There are there twelve idol temples of different nations, two mahummeries in which is cried the law of Machomet, and one church of Christians in the extreme end of the city."],"attribution":"William of Rubruck, Franciscan friar from Flanders, describing his stay in 1254 at Karakorum, the capital of the Mongol Empire, from the report of his journey that he wrote for King Louis IX of France","translation":"Translated by W. W. Rockhill (1900); adapted","footnotes":[{"mark":"*","text":"Mangu (Möngke) Khan, grandson of Chinggis Khan and Great Khan of the Mongol Empire from 1251 to 1259; \"the Chan\" also means him."},{"mark":"**","text":"a small town just outside Paris"},{"mark":"***","text":"Rubruck uses older words: \"Saracens\" for Muslims, \"Tartars\" for Mongols, \"Cathayans\" for people from northern China, \"idol temples\" for Buddhist and other non-Christian, non-Muslim temples, \"mahummeries\" for mosques, and \"the law of Machomet\" for Islam."}],"glossary":[{"t":"Metz in Lorraine","d":"a city in what is now eastern France"},{"t":"unseemly","d":"not proper"},{"t":"conduit","d":"a pipe"},{"t":"mares","d":"female horses"},{"t":"quarters","d":"neighborhoods"},{"t":"artisans","d":"skilled craftworkers"}]},"P4":{"type":"passage","paragraphs":["Now you must know that from this city of Cambaluc [Beijing] proceed many roads and highways leading to a variety of provinces … And the messengers of the Emperor in travelling from Cambaluc, be the road whichsoever they will, find at every twenty-five miles of the journey a station which they call Yamb, or, as we should say, the \"Horse-Post-House.\" … At some of these stations, moreover, there shall be posted some four hundred horses standing ready for the use of the messengers …","… For it is a fact that on all these posts taken together there are more than 300,000 horses kept up, specially for the use of the messengers. And the great buildings that I have mentioned are more than 10,000 in number, all richly furnished, as I told you. …","… Moreover, there are also at those stations other men … who are employed for expresses when there is a call for great haste in sending despatches to any governor of a province, or to give news when any Baron has revolted, or in other such emergencies; and these men travel a good two hundred or two hundred and fifty miles in the day, and as much in the night. … And each of them carries with him a gerfalcon tablet, in sign that he is bound on an urgent express; so that if perchance his horse break down, or he meet with other mishap, whomsoever he may fall in with on the road, he is empowered to make him dismount and give up his horse. …","Now all these numbers of post-horses cost the Emperor nothing at all; and I will tell you the how and the why. Every city, or village, or hamlet, that stands near one of those post-stations, has a fixed demand made on it for as many horses as it can supply, and these it must furnish to the post. …"],"attribution":"Marco Polo, Venetian merchant who lived in China under Mongol rule from 1275 to 1292 and said he served Khubilai Khan, describing the Mongol post system; his book was written down by Rustichello of Pisa in 1298","translation":"Translated by Henry Yule, revised by Henri Cordier (1903); adapted","glossary":[{"t":"expresses / despatches","d":"urgent messages"},{"t":"Baron","d":"a noble or high official"},{"t":"gerfalcon tablet","d":"a metal badge with a falcon on it that showed the rider was on the emperor's business"},{"t":"empowered","d":"given the right"},{"t":"hamlet","d":"a very small village"},{"t":"furnish","d":"supply"}]},"P5":{"type":"passage","paragraphs":["We now arrive at the epoch of the Mongols, during whose predominance the communication of China with the western nations was less impeded by artificial obstacles than it has been at any other period of history. … It was in the days of the Mongols also that China first became really known to Europe, and that by a name which, though especially applied to the northern provinces, also came to bear a more general application, Cathay.","… Marino Sanuto, the Venetian, writing about 1306 …, alludes to the many merchants who had already gone to India to make their purchases and come back safely. … we find mention of a merchant of Pisa owning a ship in the Indian seas. … John Marignolli mentions that when he was in Malabar about 1347-8, his interpreter was a youth who had been rescued from pirates in the Indian seas by a merchant of Genoa. And from the same authority we find that there was a fondaco or factory, and warehouse for the use of the Christian merchants, attached to one of the Franciscan convents at Zaytun*.","But, as regards Christian intercourse, missions and merchants alike disappear from the field soon after the middle of the fourteenth century, as the Mongol dynasty totters and comes down. … For the new rulers of China revert to the old indigenous policy and hold foreigners at arm's length; whilst Islam has recovered its ground and extended its grasp over Middle Asia …"],"attribution":"Henry Yule, British historian of geography, \"Preliminary Essay\" in Cathay and the Way Thither, first published in 1866","translation":"Revised edition by Henri Cordier (1915); adapted","footnotes":[{"mark":"*","text":"Zaytun is Quanzhou, a port in southern China. Malabar is the southwest coast of India."}],"glossary":[{"t":"epoch","d":"period of time"},{"t":"predominance","d":"period of greatest power"},{"t":"impeded","d":"blocked or slowed"},{"t":"alludes to","d":"mentions"},{"t":"fondaco or factory","d":"a trading post where foreign merchants lived and stored their goods"},{"t":"intercourse","d":"contact"},{"t":"totters","d":"becomes weak and unsteady"},{"t":"indigenous","d":"native; here, traditional Chinese"},{"t":"Middle Asia","d":"Central Asia"}]},"P6":{"type":"passage","paragraphs":["… The king of China is a Tatar, one of the descendants of Tinkiz [Chingiz] Khan. In every Chinese city there is a quarter for Muslims in which they live by themselves, and in which they have mosques both for the Friday services and for other religious purposes. The Muslims are honoured and respected. …","When a Muhammadan* merchant enters any town in China, he is given the choice between staying with some specified merchant among the Muslims domiciled there, or going to a hostelry. If he chooses to stay with the merchant, his money is taken into custody and put under the charge of the resident merchant. The latter then pays from it all his expenses with honesty and charity. When the visitor wishes to depart, his money is examined, and if any of it is found to be missing, the resident merchant who was put in charge of it is obliged to make good the deficit. …","China is the safest and best regulated of countries for a traveller. A man may go by himself a nine months' journey, carrying with him large sums of money, without any fear on that account. The system by which they ensure his safety is as follows. At every post-station in their country they have a hostelry controlled by an officer, who is stationed there with a company of horsemen and footsoldiers. After sunset or later in the evening the officer visits the hostelry with his clerk, registers the names of all travellers staying there for the night, seals up the list, and locks them into the hostelry. …","… The port of Zaytun [Quanzhou] is one of the largest in the world, or perhaps the very largest. I saw in it about a hundred large junks; as for small junks, they could not be counted for multitude. … The Muslims live in a town apart from the others."],"attribution":"Ibn Battuta, Muslim scholar and judge from Morocco, describing China under the Mongol Yuan dynasty, which he said he visited in the 1340s, from his book of travels, written down in 1355","translation":"Translated by H. A. R. Gibb (1929); adapted","footnotes":[{"mark":"*","text":"\"Muhammadan\" is the translation's word for Muslim."}],"glossary":[{"t":"Tatar","d":"here, Mongol"},{"t":"quarter","d":"a neighborhood of a city"},{"t":"domiciled","d":"living"},{"t":"hostelry","d":"an inn"},{"t":"custody","d":"safekeeping"},{"t":"make good the deficit","d":"pay back what is missing"},{"t":"junks","d":"large Chinese sailing ships"},{"t":"multitude","d":"a very large number"}]},"P7":{"type":"passage","paragraphs":["[GUJARAT.] … The native products comprise great quantities of indigo, red kino, myrobolans and foreign cotton stuffs of every colour. Every year these goods are transported to the Ta-shi* countries for sale.","[THE ZANZIBAR COAST.] … The inhabitants are of Ta-shi stock and follow the Ta-shi religion. They wrap themselves in blue foreign cotton stuffs and wear red leather shoes. … The products of the country consist of elephants' tusks, native gold, ambergris and yellow sandal-wood. Every year Hu-ch'a-la [Gujarat] and the Ta-shi localities along the sea-coast send ships to this country with white cotton cloth, porcelain, copper, and red cotton to trade.","[THE BERBERA COAST.] The country of Pi-p'a-lo contains four cities … The land produces many camels and sheep, and the people feed themselves with the flesh and milk of camels and with baked cakes. The (other) products are ambergris, big elephants' tusks and big rhinoceros horns. … The land is also rich in putchuck, liquid storax gum, myrrh, and tortoise shell of extraordinary thickness, for which there is a great demand in other countries."],"attribution":"Zhao Rugua, Song dynasty official in charge of foreign trade at the port of Quanzhou, China, Records of Foreign Peoples, 1225, entries on three lands of the western Indian Ocean","translation":"Translated by Friedrich Hirth and W. W. Rockhill (1911); headings and place names in brackets added; adapted","footnotes":[{"mark":"*","text":"Ta-shi was the Chinese name for the Arabs. Gujarat is on the northwest coast of India; the Zanzibar and Berbera coasts are on the east coast of Africa."}],"glossary":[{"t":"indigo","d":"a blue dye made from a plant"},{"t":"red kino, myrobolans, putchuck, storax","d":"plant products used as dyes, medicines, and perfumes"},{"t":"stuffs","d":"cloth"},{"t":"stock","d":"family background or ancestry"},{"t":"ambergris","d":"a waxy substance from sperm whales, used in perfume"},{"t":"sandal-wood","d":"a sweet-smelling wood"},{"t":"myrrh","d":"a sweet-smelling tree resin burned as incense"}]},"P8":{"type":"passage","paragraphs":["… In the fifth year of Yung-lo (A.D. 1407) the eunuch Cheng Ho [Zheng He] and others conveyed to the king letters patent conferring on him (the title of vassal king) and different gifts to his highest officers …","The king [the Zamorin] reveres the Buddha and shows respect to elephants and cows. … The king is a Nan-p'i [Nair]*. He does not eat beef. His highest officers are Moslims, they do not eat pork. Formerly the king made a pact with the Moslims, mutually forbidding to eat (beef and pork). …","All the affairs of the country are conducted by two high officers who are, at present, Musulmans. … There are some twenty to thirty mosques. …","In their usages they like sincerity. All the merchandize brought here by Chinese junks is under the control of the two high officers who send brokers to come to an understanding as to prices, which are not subsequently changed. And their mode of counting is to rely solely on the bending of the fingers, and they do not make an error of a fraction. …"],"attribution":"Ma Huan, Chinese Muslim interpreter who sailed with the fleets of Admiral Zheng He, describing Calicut, on the southwest coast of India, from his General Account of the Shores of the Ocean, begun in 1416","translation":"Translated by W. W. Rockhill, in the journal T'oung Pao, vol. 16 (1915); adapted","footnotes":[{"mark":"*","text":"The Nairs were a warrior and landholding group on the Malabar coast of southwest India. Ma Huan uses \"the Buddha\" for the Hindu gods worshiped at Calicut."}],"glossary":[{"t":"Yung-lo","d":"the reign of the Yongle Emperor of Ming China (1403–1424)"},{"t":"eunuch","d":"a man who had been castrated and who served in the emperor's palace"},{"t":"letters patent","d":"an official document that grants a title"},{"t":"vassal king","d":"a king who accepts a more powerful ruler as his overlord"},{"t":"Moslims / Musulmans","d":"Muslims"},{"t":"usages","d":"customs"},{"t":"brokers","d":"agents who arrange deals between buyers and sellers"}]},"P9":{"type":"passage","paragraphs":["Chéng Ho [Zheng He] was a man from Yün-nan … At first he served in the palace of the Prince of Yen (afterwards emperor under the name Ch'éng-tsu) and having acquired military merit, he was gradually raised to the rank of first eunuch.","When the emperor Ch'éng-tsu (1403—1424) feared that Hwui-ti (his predecessor, whom he had driven from the throne) was concealing himself in some country over the sea, he wanted to trace him and at the same time to display his military force in foreign countries, in order to show that China was rich and strong.","In the 6th month of the year 1405 he ordered Chéng Ho, his companion Wang Ching-hung and others to go as envoys to the western ocean. They took with them 27800 soldiers, a large quantity of gold and silks, and made sixty two large ships … They sailed from Su-chou to Fukien and from there they went first to Champa and next to the various barbarian* countries, making known the orders from the Emperor. They made presents to the princes and chiefs and those who would not submit, were compelled by force. …","… Chéng Ho had now served three emperors; he had been sent as envoy seven times and had visited Champa, Java, … Siam, Calicut, Malakka, … Sumatra, … Ceylon, … Hormus, … the Maldive islands, … Magadoxu, … Bengal, Arabia … altogether more than thirty different countries. He had brought back numberless valuable things, but what China had spent on them was not little either."],"attribution":"History of the Ming Dynasty, the official history of the Ming written by scholar-officials of the Qing dynasty and completed in 1739, from its biography of Zheng He","translation":"Translated by W. P. Groeneveldt, Notes on the Malay Archipelago and Malacca (1876); adapted","footnotes":[{"mark":"*","text":"\"Barbarian\" is the official history's word for peoples outside China."}],"glossary":[{"t":"Yün-nan","d":"Yunnan, a province in southwest China"},{"t":"eunuch","d":"a man who had been castrated and who served in the emperor's palace"},{"t":"Ch'éng-tsu","d":"the Yongle Emperor of the Ming dynasty"},{"t":"envoys","d":"people sent by a ruler to deliver messages and gifts"},{"t":"Champa","d":"a kingdom in what is now southern Vietnam"},{"t":"submit","d":"accept the emperor's authority"},{"t":"Hormus, Magadoxu","d":"Hormuz, a port on the Persian Gulf, and Mogadishu, a port in East Africa"}]},"P10":{"type":"passage","paragraphs":["At Sijilmasa I bought camels and a four months' supply of forage for them. Thereupon I set out … [in February 1352] with a caravan including, amongst others, a number of the merchants of Sijilmasa. After twenty-five days we reached Taghaza, an unattractive village, with the curious feature that its houses and mosques are built of blocks of salt, roofed with camel skins. … In the sand is a salt mine; they dig for the salt, and find it in thick slabs … A camel will carry two of these slabs. No one lives at Taghaza except the slaves of the Massufa tribe, who dig for the salt; they subsist on dates imported from Dar'a and Sijilmasa, camels' flesh, and millet imported from [the lands south of the Sahara]*. [The West Africans] come up from their country and take away the salt from there. At Iwalatan a load of salt brings eight to ten mithqals; in the town of Malli it sells for twenty to thirty, and sometimes as much as forty. [The West Africans] use salt as a medium of exchange, just as gold and silver is used [elsewhere]; they cut it up into pieces and buy and sell with it. The business done at Taghaza, for all its meanness, amounts to an enormous figure in terms of hundredweights of gold-dust.","… Water supplies are laid in at Taghaza for the crossing of the desert which lies beyond it, which is a ten-nights' journey with no water on the way except on rare occasions. …","… The takshif is a name given to any man of the Massufa tribe who is hired by the persons in the caravan to go ahead to Iwalatan, carrying letters from them to their friends there, so that they may take lodgings for them. These persons then come out a distance of four nights' journey to meet the caravan, and bring water with them. … For there is no visible road or track in these parts—nothing but sand blown hither and thither by the wind. … The guide there is one who has made the journey frequently in both directions … We hired the takshif on this journey for a hundred gold mithqals; he was a man of the Massufa. …","Thus we reached the town of Iwalatan [Walata] after a journey from Sijilmasa of two months to a day. Iwalatan is the northernmost province of [Mali], and the sultan's representative there was one Farba Husayn …"],"attribution":"Ibn Battuta, Muslim scholar and judge from Morocco, describing his journey across the Sahara to the Mali Empire in 1352, from his book of travels, written down in 1355","translation":"Translated by H. A. R. Gibb (1929); adapted","footnotes":[{"mark":"*","text":"Gibb's 1929 translation uses older words for West Africa and its people that are now considered offensive. They are replaced here with words in brackets."}],"glossary":[{"t":"Sijilmasa","d":"a caravan city on the northern edge of the Sahara, in Morocco"},{"t":"forage","d":"food for animals"},{"t":"Massufa","d":"a Berber people of the Sahara"},{"t":"subsist on","d":"live on"},{"t":"Dar'a","d":"the Draa valley in southern Morocco"},{"t":"mithqals","d":"units of gold, each a little more than 4 grams"},{"t":"Iwalatan / Malli","d":"Walata, a town at the southern edge of the Sahara, and the capital city of Mali"},{"t":"meanness","d":"poor and shabby look"},{"t":"hundredweights","d":"units of weight of about 100 pounds each"}]},"P11":{"type":"passage","paragraphs":["As to the people of Mali, they surpassed the other Blacks* in those countries in wealth and numbers. They extended their dominions, and conquered the Susu, as well as the kingdom of Ghanah in the vicinity of the Ocean towards the west. The Mohammedans say, that the first King of Mali was Baramindanah. He performed the pilgrimage to Mekkah, and enjoined his successors to do the same.","But the great King of Mali who conquered the Susu, and took their country, was named Mari Jatah, which means, in the language of that country, Amir Lion …","… Mansa Musa, son of Abu Bekr, ascended the throne. He was an excellent prince, and performed the pilgrimage in 724 [1324]. The number of people employed to carry his baggage and provisions amounted to 12,000, all dressed in tunics of figured cotton, or the silk called El-Yemeni. The Haji Tunis, interpreter of this nation in Kahirah (Cairo), said that Mansa Musa brought with him to Egypt no less than 80 loads of Tibar (gold dust), each weighing 300 pounds. He brought the whole on camels, though in his own kingdom camels are not used, baggage being there carried on the backs of slaves. Mansa Musa, on his return, conceived the idea of building himself a fine palace. Abu Ishak** showed him a model, and erected the edifice … for which he received 12,000 mithkals of gold. Mansa Musa maintained an intimate and friendly correspondence with Sultan Abu-l-Hasan, of Al-Maghreb …"],"attribution":"Ibn Khaldun, Muslim historian from North Africa who lived in Cairo from 1382, The Book of Lessons, a history of the Arabs and Berbers written in the late 1300s","translation":"Translated by William Desborough Cooley, The Negroland of the Arabs Examined and Explained (1841); adapted","footnotes":[{"mark":"*","text":"Cooley's 1841 translation uses \"Blacks\" for the peoples of West Africa south of the Sahara and \"Mohammedans\" for Muslims. Ghanah is the older kingdom of Ghana."},{"mark":"**","text":"a poet from Granada, in Muslim Spain"}],"glossary":[{"t":"dominions","d":"the lands a ruler controls"},{"t":"enjoined","d":"ordered"},{"t":"Amir","d":"prince or commander"},{"t":"Haji","d":"a title for a Muslim who has made the pilgrimage to Mecca"},{"t":"figured cotton","d":"cotton cloth with woven patterns"},{"t":"edifice","d":"a large building"},{"t":"mithkals","d":"units of gold, each a little more than 4 grams"},{"t":"Al-Maghreb","d":"Morocco, in northwest Africa"}]},"P12":{"type":"passage","paragraphs":["… according to a custom which they have, they were wont and still continue to make copies from that book in such wise that no change or alteration can find its way into the text. And therefore when they desire that any book containing matter of value to them should be well written and should remain correct, authentic and unaltered, they order a skilful calligraphist to copy a page of that book on a tablet in a fair hand. Then all the men of learning carefully correct it, and inscribe their names on the back of the tablet. Then skilled and expert engravers are ordered to cut out the letters. And when they have thus taken a copy of all the pages of the book, numbering all (the blocks) consecutively, they place these tablets in sealed bags, like the dies in a mint, and entrust them to reliable persons appointed for this purpose …","Then when anyone wants a copy of this book he goes before this committee and pays the dues and charges fixed by the Government. Then they bring out these tablets, impose them on leaves of paper like the dies used in minting gold, and deliver the sheets to him. Thus it is impossible that there should be any addition or omission in any of their books …"],"attribution":"Rashid al-Din, Persian chief minister to the Mongol rulers of Persia, describing how the Chinese make books, from his world history, Compendium of Chronicles, completed about 1310","translation":"Translated by Edward G. Browne (1920) from a history of 1317 that copied Rashid al-Din's description, as quoted in Thomas Francis Carter, The Invention of Printing in China and Its Spread Westward (1925); adapted","glossary":[{"t":"were wont","d":"used to"},{"t":"authentic","d":"true to the original"},{"t":"calligraphist","d":"an expert in beautiful handwriting"},{"t":"tablet","d":"a flat board"},{"t":"engravers","d":"workers who carve letters or pictures into wood or metal"},{"t":"consecutively","d":"in order"},{"t":"dies in a mint","d":"stamps used to press designs onto coins"},{"t":"dues","d":"fees"}]},"P13":{"type":"pair","items":[{"label":"Source 1","paragraphs":["I say, then, that the years of the beatific incarnation of the Son of God had reached the tale of one thousand three hundred and forty-eight when in the illustrious city of Florence, the fairest of all the cities of Italy, there made its appearance that deadly pestilence, which, whether disseminated by the influence of the celestial bodies, or sent upon us mortals by God in His just wrath by way of retribution for our iniquities, had had its origin some years before in the East, whence, after destroying an innumerable multitude of living beings, it had propagated itself without respite from place to place, and so, calamitously, had spread into the West.","In Florence, despite all that human wisdom and forethought could devise to avert it, as the cleansing of the city from many impurities by officials appointed for the purpose, the refusal of entrance to all sick folk, and the adoption of many precautions for the preservation of health; despite also humble supplications addressed to God, and often repeated both in public procession and otherwise, by the devout; towards the beginning of the spring of the said year the doleful effects of the pestilence began to be horribly apparent …","… Tedious were it to recount, how citizen avoided citizen, how among neighbours was scarce found any that shewed fellow-feeling for another, how kinsfolk held aloof, and never met, or but rarely … fathers and mothers were found to abandon their own children, untended, unvisited, to their fate, as if they had been strangers."],"attribution":"Giovanni Boccaccio, Italian writer, introduction to The Decameron, a book of stories begun in 1348 and finished about 1353, describing the plague in Florence","translation":"Translated by J. M. Rigg (1903); adapted","glossary":[{"t":"the beatific incarnation of the Son of God","d":"the birth of Jesus, from which Christians count the years"},{"t":"reached the tale of","d":"reached the number"},{"t":"pestilence","d":"a deadly epidemic disease"},{"t":"disseminated","d":"spread"},{"t":"celestial bodies","d":"the stars and planets"},{"t":"retribution for our iniquities","d":"punishment for our sins"},{"t":"propagated","d":"spread"},{"t":"supplications","d":"prayers asking for help"},{"t":"doleful","d":"sad and painful"},{"t":"aloof","d":"distant"}]},{"label":"Source 2","paragraphs":["One of the celebrated sanctuaries at Damascus is the Mosque of the Footprints (al-Aqdam), which lies two miles south of the city, alongside the main highway which leads to the Hijaz, Jerusalem, and Egypt. It is a large mosque, very blessed, richly endowed, and very highly venerated by the Damascenes. … I saw a remarkable instance of the veneration in which the Damascenes hold this mosque during the great pestilence, on my return journey through Damascus in the latter part of July 1348. The viceroy Arghun Shah ordered a crier to proclaim through Damascus that all the people should fast for three days and that no one should cook anything eatable in the market during the daytime. … So the people fasted for three successive days, the last of which was a Thursday, then they assembled in the Great Mosque, amirs, sharifs, qadis, theologians, and all the other classes of the people, until the place was filled to overflowing, and there they spent the Thursday night in prayers and litanies.","After the dawn prayer next morning they all went out together on foot, holding Korans in their hands, and the amirs barefooted. The procession was joined by the entire population of the town, men and women, small and large; the Jews came with their Book of the Law and the Christians with their Gospel, all of them with their women and children. The whole concourse, weeping and supplicating and seeking the favour of God through His Books and His Prophets, made their way to the Mosque of the Footprints, and there they remained in supplication and invocation until near midday."],"attribution":"Ibn Battuta, Muslim scholar and judge from Morocco, describing Damascus, in Syria, during the plague of 1348, from his book of travels, written down in 1355","translation":"Translated by H. A. R. Gibb (1929); adapted","glossary":[{"t":"sanctuaries","d":"holy places"},{"t":"Hijaz","d":"the region of Arabia around Mecca and Medina"},{"t":"veneration","d":"deep respect"},{"t":"Damascenes","d":"the people of Damascus"},{"t":"viceroy","d":"a governor who rules for a king; here, for the Mamluk sultan of Egypt"},{"t":"amirs, sharifs, qadis, theologians","d":"commanders, descendants of the Prophet Muhammad, judges, and religious scholars"},{"t":"litanies","d":"long prayers"},{"t":"Koran","d":"the Quran, the holy book of Islam"
