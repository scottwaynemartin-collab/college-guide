"A":"The Boxers attacked foreign things. Shibusawa wanted to use Western methods.","C":"Young Italy sought political unification. Adopting Western business and industrial methods was not its main program.","D":"These nobles wanted to keep the old system, not build modern businesses."},"hint":"Compare how each group hoped to make its country stronger.","reasoning":"Comparison"},{"id":"U5-P37","set":"P13","topic":"5.8","lo":"I","skill":"3.A","difficulty":"easy","stem":"Marx and Engels's main argument in the passage is that","options":{"A":"factory owners and workers share the same interests and should cooperate","B":"workers should go back to small workshops run by master craftsmen","C":"factory owners and wage workers have opposing interests, so workers should unite","D":"governments should leave the economy alone so that free markets can work well for everyone"},"answer":"C","explanation":"Marx and Engels say history is a story of fights between classes. Now, they say, owners and workers face each other as enemies. They call on workers everywhere to unite.","whyNot":{"A":"The authors call the two classes \"two great hostile camps.\"","B":"They describe the old workshops as replaced by factories. They call for workers to unite, not to go back.","D":"That is the laissez-faire view. Marx and Engels attacked capitalism."},"hint":"How many \"great classes\" do the authors see, and how do they get along?"},{"id":"U5-P38","set":"P13","topic":"5.8","lo":"I","skill":"4.A","difficulty":"medium","stem":"The Communist Manifesto was written in the context of","options":{"A":"harsh factory conditions and growing political unrest in 1840s Europe","B":"the Chartist movement's success in winning the vote for most British working men","C":"the unification of the German states into one empire under the kingdom of Prussia","D":"the freeing of Russia's serfs, which had created a large new class of factory workers"},"answer":"A","explanation":"In the 1840s, factory workers faced long hours and crowded cities, and unrest was spreading. The Manifesto came out in early 1848, just as revolutions broke out across Europe.","whyNot":{"B":"Parliament rejected the Chartists' petitions in the 1840s. Many working men won the vote only after 1867.","C":"Germany was unified in 1871, more than 20 years later.","D":"Russia freed its serfs in 1861, more than ten years after the Manifesto."},"hint":"What were factory workers' lives like in the 1840s? What happened in Europe in 1848?"},{"id":"U5-P39","set":"P13","topic":"5.8","lo":"I","skill":"5.B","difficulty":"medium","stem":"Ideas like those in the passage most directly influenced","options":{"A":"the spread of laissez-faire policies that limited the government's role in Britain's economy","B":"socialist parties and labor movements that grew in Europe in the late 1800s","C":"the Qing dynasty's Self-Strengthening Movement","D":"the Catholic Church's defense of Europe's monarchies"},"answer":"B","explanation":"In the late 1800s, socialist parties formed in many countries, such as Germany's Social Democratic Party. Many used Marx's ideas to demand rights and power for workers.","whyNot":{"A":"Laissez-faire means less government role in the economy. Marx and Engels wanted workers to take power.","C":"Self-strengtheners were Qing officials trying to protect the empire, not followers of Marx.","D":"Marx and Engels attacked old rulers and the churches that supported them."},"hint":"Who would answer the call for \"working men of all countries\" to unite?","reasoning":"Causation"},{"id":"U5-P40","set":"P14","topic":"5.8","lo":"I","skill":"3.A","difficulty":"easy","stem":"Zhang Zhidong's main argument is that China should","options":{"A":"copy Japan by writing a constitution and creating an elected parliament","B":"replace Confucian learning with Western religion and Western law","C":"adopt Western technology while keeping Confucian moral values","D":"overthrow the Qing dynasty and set up a republic like those in the West"},"answer":"C","explanation":"Zhang says \"Chinese learning is moral. Western learning is practical.\" China could use foreign machines and railways and still keep Confucian values.","whyNot":{"A":"Zhang accepts foreign machines and railways, but he says government should rest on Chinese learning and \"loyalty and protection.\"","B":"Zhang says Chinese learning should guide morals. Only practical matters should be Western.","D":"Zhang was a Qing official who wanted to strengthen the empire, not end it."},"hint":"Which foreign changes does Zhang accept, and which Chinese values does he want to keep?"},{"id":"U5-P41","set":"P14","topic":"5.8","lo":"I","skill":"4.A","difficulty":"medium","stem":"Zhang's book is best understood in the context of","options":{"A":"China's success in ending its unequal treaties with the Western powers","B":"China's defeat by Japan in 1895, which showed the Qing army's weakness","C":"the founding of the Republic of China after the fall of the Qing","D":"Britain's decision to return Hong Kong to Qing rule"},"answer":"B","explanation":"Japan defeated China in 1894–1895. The loss shocked Qing leaders, because Japan had modernized quickly. Zhang wrote in 1898 to push for reform.","whyNot":{"A":"China was still bound by unequal treaties in 1898, and foreign powers were taking more land and rights.","C":"The Qing fell in 1911–1912, after this book was written.","D":"Britain did not give Hong Kong back. In 1898 it leased even more land next to Hong Kong."},"hint":"Think about what happened to China's army and navy in the mid-1890s. Why would that push an official to call for change?"},{"id":"U5-P42","set":"P14","topic":"5.8","lo":"I","skill":"3.A","difficulty":"hard","stem":"Which obstacle to reform is most directly illustrated by the critics Zhang describes in the first paragraph?","options":{"A":"concern that foreign experts would keep Chinese workers from learning new skills","B":"concern that factories would compete with farms for scarce workers","C":"concern that stronger provincial armies would break free of the Qing court","D":"concern that foreign methods lacked the authority of the Confucian classics"},"answer":"D","explanation":"The critics reject foreign methods because they are \"not specially mentioned in the Six Classics.\" Respect for the classics made many officials slow to accept Western ideas. Zhang argues that China can use foreign technology while keeping Confucian values.","whyNot":{"A":"Zhang's critics do not talk about foreign experts. They object that foreign methods are not in the classics.","B":"The passage does not mention farms or a shortage of workers.","C":"Regional armies were a real worry for the Qing, but Zhang's critics object to foreign methods, not to armies."},"hint":"What reason do the critics give for rejecting foreign methods?"},{"id":"U5-P43","set":"P15","topic":"5.8","lo":"I","skill":"3.C","difficulty":"easy","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Source 1 supports government ownership of the mills; Source 2 supports private ownership.","B":"Source 1 treats low wages as the main problem; Source 2 treats unsafe machines as the main problem.","C":"Source 1 claims that shorter hours would cut the mills' output; Source 2 claims that shorter hours would raise output.","D":"Source 1 presents long hours as harmful; Source 2 argues that a law on hours would hurt owner-worker relations."},"answer":"D","explanation":"The family links long hours to illness and exhaustion. Bright argues that a law limiting hours would damage relations between owners and workers.","whyNot":{"A":"Neither source discusses who should own the mills. Bright, a mill owner, opposes a law about hours.","B":"The mother would accept shorter hours \"without additional wages.\" Bright does not discuss safety.","C":"Neither source argues about output. The family talks about health, and Bright talks about owners' feelings toward workers."},"hint":"What does each source say about hours of work?","reasoning":"Comparison"},{"id":"U5-P44","set":"P15","topic":"5.8","lo":"I","skill":"2.B","difficulty":"medium","stem":"Bright's point of view in Source 2 is best explained by","options":{"A":"his position as a mill owner who opposed government rules for business","B":"his belief that Parliament should protect workers who could not bargain for themselves","C":"his Quaker faith, which led him to call for laws to protect children in the mills","D":"his work as a leader of a trade union of cotton spinners"},"answer":"A","explanation":"Bright owned a cotton mill and believed in laissez-faire, the idea that government should stay out of business. He argued that owners like him would care for workers on their own.","whyNot":{"B":"Bright argues against a law limiting hours. He wants owners and workers to settle such matters themselves.","C":"Bright was a Quaker, but in this speech he opposes a law to limit the hours of young workers.","D":"Bright speaks for the \"capitalists,\" the owners. A union leader would speak for the workers."},"hint":"Check the attribution. What did Bright own?"},{"id":"U5-P45","set":"P15","topic":"5.8","lo":"I","skill":"5.B","difficulty":"medium","stem":"Testimony like that in Source 1 most directly contributed to which of the following?","options":{"A":"the Combination Acts, which banned workers from forming unions","B":"a law giving adult men a ten-hour workday in 1833","C":"Factory Acts that limited the hours and work of children in British mills","D":"a law that set a minimum wage for British factory workers"},"answer":"C","explanation":"The Factory Act of 1833 banned most mill work for children under 9 and limited hours for older children. It also created factory inspectors. Later laws, like the Ten Hours Act of 1847, went further.","whyNot":{"A":"The Combination Acts came in 1799–1800, before this testimony, and were repealed in 1824.","B":"The 1833 law protected children. A ten-hour limit came in 1847, and it covered women and young people.","D":"Britain had no minimum wage law in this period. The factory laws limited hours and set rules for children."},"hint":"Government commissioners collected this testimony. What did Parliament do next?","reasoning":"Causation"},{"id":"U5-P46","set":"P16","topic":"5.9","lo":"J","skill":"3.B","difficulty":"easy","stem":"Which of the following claims is best supported by the chart?","options":{"A":"By 1891 most people in England and Wales lived in cities of 10,000 or more.","B":"The percentage of Scotland's population living in cities fell between 1851 and 1891.","C":"Scotland was more urban than England and Wales in each year shown.","D":"The city share grew faster in Scotland than in England and Wales after 1851."},"answer":"A","explanation":"The share for England and Wales reached 61.7 percent in 1891. That means more than half of the people there lived in cities of 10,000 or more.","whyNot":{"B":"Scotland's share rose from 32.2 to 49.9 percent.","C":"The bar for England and Wales is taller in every year shown.","D":"England and Wales rose 22.2 percentage points after 1851. Scotland rose 17.7 percentage points."},"hint":"Which claim can you prove from the percentages alone?"},{"id":"U5-P47","set":"P16","topic":"5.10","lo":"K","skill":"5.B","difficulty":"medium","stem":"The change shown in the chart was most directly caused by","options":{"A":"laws that forced many people living in cities to move back to farms in the countryside","B":"a large rise in the number of farm jobs in the British countryside","C":"factory jobs that drew people from the countryside into industrial towns","D":"the decline of coal mining and ironworks near British towns"},"answer":"C","explanation":"Factories, mines, and railways offered more jobs in towns. Many rural people moved to find work there. This helped raise the share of people living in cities.","whyNot":{"A":"This would help explain a falling city share. The chart shows a rising share.","B":"Farming needed fewer workers in this period, which pushed people toward towns.","D":"Coal and iron industries grew in this period, and they helped towns grow."},"hint":"Where were the new jobs in the 1800s?","reasoning":"Causation"},{"id":"U5-P48","set":"P16","topic":"5.9","lo":"J","skill":"1.B","difficulty":"medium","stem":"Which expectation became especially influential among urban middle-class families in nineteenth-century Britain?","options":{"A":"that wives would run the family's factories and banks alongside their husbands","B":"that wives would manage the home and children while husbands earned the main income","C":"that daughters would work long shifts in textile mills to help support the family","D":"that families would move to the countryside so that women could farm family land"},"answer":"B","explanation":"Many middle-class families promoted an ideal in which men earned the main income and women managed the home. Not all families followed this ideal. Many women also earned money or helped run family businesses.","whyNot":{"A":"Men held most business and political positions. Some women did help run businesses, but that was not the middle-class ideal.","C":"Mill work was common for working-class girls and women. It was not the ideal for middle-class daughters.","D":"Moving to farm was not the usual ideal for urban middle-class families. The chart itself does not show what work women did."},"hint":"The question asks about an ideal. How could that differ from what every woman actually did?","reasoning":"Continuity and Change"}],"exam":{"title":"Unit 5 Practice Exam: Revolutions","timeMinutes":25,"questionCount":25,"directions":"Each set of questions refers to a source: a primary source, a historian's writing, an image, or data. For each question, choose the best answer. Use the source and your knowledge of world history from c. 1750 to c. 1900. There is no penalty for guessing.","questions":[{"id":"U5-E01","set":"X1","topic":"5.1","lo":"A","skill":"4.A","difficulty":"hard","stem":"Articles 10 and 16 most directly reflect the ideas of Enlightenment writers such as","options":{"A":"Thomas Hobbes","B":"Voltaire and Montesquieu","C":"Edmund Burke","D":"Bishop Jacques-Bénigne Bossuet"},"answer":"B","rationales":{"A":"Incorrect. Hobbes wanted one supreme authority. It could be a single ruler or an assembly. Article 16 calls for separate powers.","B":"Correct. Article 10 protects religious opinions, as Voltaire urged. Article 16 calls for \"the separation of powers,\" Montesquieu's best-known idea.","C":"Incorrect. Burke defended tradition and opposed the French Revolution and its new declarations of rights.","D":"Incorrect. Bossuet taught that kings receive their power directly from God. That is the opposite of separating powers."},"explanation":"Enlightenment writers wanted to limit a ruler's power. Voltaire called for freedom of religion. Montesquieu said power should be split among separate parts of government."},{"id":"U5-E02","set":"X1","topic":"5.2","lo":"C","skill":"5.B","difficulty":"medium","stem":"The principle in Article 1 most directly contributed to which of the following developments in the 1790s?","options":{"A":"the return of absolute power to the French king","B":"calls for equal rights and an end to slavery in the colony of Saint-Domingue","C":"Britain's decision to give most adult men the right to vote in elections for Parliament","D":"the end of serfdom in the Russian Empire"},"answer":"B","rationales":{"A":"Incorrect. The French king lost his power in the 1790s and was executed in 1793.","B":"Correct. Free people of color in the French colony demanded equal rights in 1790, and enslaved people rose up in 1791. Both used the language of the French Revolution.","C":"Incorrect. Most British men could not vote until the late 1800s.","D":"Incorrect. Russia freed its serfs in 1861, about 70 years later."},"explanation":"The claim that people are born with equal rights helped people in Saint-Domingue challenge racial rules and slavery. Free people of color demanded equal rights, and enslaved people rose in revolt in 1791.","reasoning":"Causation"},{"id":"U5-E03","set":"X1","topic":"5.1","lo":"B","skill":"5.A","difficulty":"medium","stem":"Which of the following people would most likely have argued that the declaration did not go far enough?","options":{"A":"Olympe de Gouges","B":"Klemens von Metternich","C":"King Louis XVI","D":"Napoleon Bonaparte"},"answer":"A","rationales":{"A":"Correct. De Gouges wrote a Declaration of the Rights of Woman in 1791. She argued that women were citizens too, so the declaration fell short.","B":"Incorrect. Metternich worked to restore monarchies across Europe after 1815. He thought the Revolution went much too far.","C":"Incorrect. The king wanted to keep his power, which the National Assembly was working to limit.","D":"Incorrect. Napoleon later took power for himself, limited elections and the press, and brought back slavery in the French colonies in 1802. He did not argue that the declaration should give rights to more people."},"explanation":"The declaration gave rights to \"man and citizen\" but said nothing about women. Olympe de Gouges answered with her Declaration of the Rights of Woman and of the Female Citizen.","reasoning":"Comparison"},{"id":"U5-E04","set":"X2","topic":"5.2","lo":"C","skill":"4.A","difficulty":"medium","stem":"The proclamation was issued most directly in response to","options":{"A":"Napoleon's attempt to retake the colony and restore French control","B":"a British invasion that had ended slavery on the island","C":"France's 1794 decision to abolish slavery in its colonies","D":"Spain's attempt to take the colony after its army invaded in the 1790s"},"answer":"A","rationales":{"A":"Correct. In 1802 Napoleon sent an army to retake Saint-Domingue, and many feared he would bring back slavery. Dessalines's army defeated it.","B":"Incorrect. British troops invaded in the 1790s but were driven out, and they did not end slavery.","C":"Incorrect. The 1794 decree ended slavery and won support for France. The break came when Napoleon threatened that freedom.","D":"Incorrect. Spanish forces fought in the colony in the 1790s, but Spain gave up its claims in 1795. In 1804 the enemy was France."},"explanation":"Napoleon's army captured Toussaint Louverture, and the French seemed ready to bring back slavery. Dessalines's forces drove the French out, and he declared independence so they could never \"enslave us\" again.","reasoning":"Causation"},{"id":"U5-E05","set":"X2","topic":"5.2","lo":"C","skill":"2.B","difficulty":"hard","stem":"The third paragraph was most likely intended to","options":{"A":"call on enslaved people across the Caribbean to rise up and join the new state of Haiti","B":"assure nearby slaveholding colonies that Haiti would not stir up revolts there","C":"ask France to recognize Haiti in exchange for trade rights","D":"invite free people of color from the other islands to settle in Haiti"},"answer":"B","rationales":{"A":"Incorrect. Dessalines says the opposite: \"let our neighbours breathe in peace.\"","B":"Correct. Britain and Spain held nearby islands worked by enslaved people, and they feared Haiti's example. Dessalines promised to leave them in peace.","C":"Incorrect. The paragraph is about the neighboring islands, not France.","D":"Incorrect. The paragraph says nothing about inviting settlers. It promises to leave the neighboring islands alone."},"explanation":"Haiti was a new and fragile country surrounded by slaveholding colonies. Promising not to spread revolution may have helped it avoid attacks and keep trade going."},{"id":"U5-E06","set":"X2","topic":"5.2","lo":"C","skill":"5.A","difficulty":"medium","stem":"The Haitian Revolution differed from most Latin American independence movements in that it","options":{"A":"drew on Enlightenment ideas about liberty and natural rights","B":"won independence from a European colonial power","C":"was led largely by formerly enslaved people and ended slavery","D":"was led mainly by colonial-born white elites"},"answer":"C","rationales":{"A":"Incorrect. Both drew on these ideas, so this is a similarity, not a difference.","B":"Incorrect. Latin American movements also won independence, from Spain and Portugal.","C":"Correct. In Haiti, enslaved people rose up, defeated France, and ended slavery for good.","D":"Incorrect. That describes many Spanish American movements, not Haiti."},"explanation":"In Haiti, formerly enslaved people led a movement that abolished slavery and won independence. Colonial-born white elites led many independence movements in Spanish America, and slavery lasted for decades in some places.","reasoning":"Comparison"},{"id":"U5-E07","set":"X3","topic":"5.10","lo":"K","skill":"3.B","difficulty":"easy","stem":"Which of the following claims is best supported by the chart?","options":{"A":"Japan's share of world manufacturing grew faster than any other country's share.","B":"The United Kingdom made the largest share of the world's manufactured goods in both 1750 and 1900.","C":"China and India–Pakistan lost shares of world manufacturing, while the United Kingdom and the United States gained.","D":"Russia's share of world manufacturing fell by more than half between 1750 and 1900."},"answer":"C","rationales":{"A":"Incorrect. Japan's share fell, from 3.8 to 2.4 percent.","B":"Incorrect. China had the largest share in 1750, and the United States had it in 1900.","C":"Correct. China and India–Pakistan fell from a combined 57.3 percent to 7.9 percent. The United Kingdom and the United States rose from 2.0 percent to 42.1 percent.","D":"Incorrect. Russia's share rose, from 5.0 to 8.8 percent."},"explanation":"These are shares of world manufacturing, not amounts. China and India–Pakistan made more than half of the world's manufactured goods in 1750 but less than 8 percent in 1900. The United Kingdom and the United States together made more than 40 percent in 1900.","reasoning":"Continuity and Change"},{"id":"U5-E08","set":"X3","topic":"5.4","lo":"E","skill":"5.B","difficulty":"hard","stem":"The change in China's share between 1750 and 1900 shown in the chart was most directly caused by","options":{"A":"a Japanese conquest of China's main manufacturing regions","B":"a sharp fall in world demand for manufactured goods","C":"a Qing decision in the 1750s to open China's ports to free trade with European merchants","D":"the much faster growth of machine production in industrializing countries"},"answer":"D","rationales":{"A":"Incorrect. Japan did not conquer large parts of China until the 1930s.","B":"Incorrect. World demand for manufactured goods grew greatly in this period.","C":"Incorrect. In the 1750s the Qing limited Western trade to the port of Canton. China was forced to open more ports only after the Opium Wars.","D":"Correct. China still made most goods by hand. Factories in Britain, the United States, and other countries made far more, far faster."},"explanation":"China kept making goods, but industrial countries made many times more. As world output grew, China's part of the total shrank.","reasoning":"Causation"},{"id":"U5-E09","set":"X3","topic":"5.3","lo":"D","skill":"5.B","difficulty":"medium","stem":"The rise in the United Kingdom's share between 1750 and 1900 was helped most by","options":{"A":"coal and iron deposits, capital to invest, and raw materials from overseas","B":"government ownership of most of Britain's factories and mines","C":"large numbers of enslaved Africans brought to work in British textile factories","D":"the use of electric power in British factories during the 1700s"},"answer":"A","rationales":{"A":"Correct. These were the main ingredients of early industry, and Britain had all of them.","B":"Incorrect. Most British factories and mines were owned by private businesses.","C":"Incorrect. British factories hired wage workers. Enslaved people in the Americas grew much of the raw cotton, but they did not work in British factories.","D":"Incorrect. Electric power spread in the late 1800s, long after Britain began to industrialize."},"explanation":"Britain had what early factories needed: coal to run steam engines, iron to build machines, money to invest, and raw cotton from overseas trade and colonies. These advantages helped it industrialize first.","reasoning":"Causation"},{"id":"U5-E10","set":"X4","topic":"5.8","lo":"I","skill":"3.C","difficulty":"easy","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Source 1 calls for laws to limit child labor, while Source 2 opposes such laws.","B":"Source 1 focuses on adult men's wages, while Source 2 focuses on children's health.","C":"Source 1 calls factory work pleasant, while Source 2 calls it a loss of freedom.","D":"Source 1 blames workers for their poverty, while Source 2 blames the government."},"answer":"C","rationales":{"A":"Incorrect. Ure praises factory work and does not ask for limits. Engels is the critic.","B":"Incorrect. Ure writes about children, and Engels writes about the rules that every mill worker had to follow.","C":"Correct. Ure says the children were \"cheerful and alert.\" Engels says the factory is a kind of \"slavery.\"","D":"Incorrect. Ure does not discuss poverty here, and Engels blames the bourgeoisie, the factory owners."},"explanation":"Ure describes factory children as cheerful and healthy. Engels describes strict rules, fines, and long hours. The two writers give very different views of factory work.","reasoning":"Comparison"},{"id":"U5-E11","set":"X4","topic":"5.8","lo":"I","skill":"2.B","difficulty":"medium","stem":"Ure's account in Source 1 was most likely intended to","options":{"A":"defend factory owners against reformers who wanted laws to limit child labor","B":"persuade Parliament to pass a law that would ban children from working in mills","C":"encourage factory workers to form labor unions","D":"warn parents about the dangers of factory machinery"},"answer":"A","rationales":{"A":"Correct. In the 1830s reformers were pushing for shorter hours for children. Ure showed the mills in a good light to argue that such laws were not needed.","B":"Incorrect. Ure praises children's work in the mills, so he is not asking for a ban.","C":"Incorrect. Ure defends the factory system. He does not ask workers to organize.","D":"Incorrect. Ure says he saw no children being beaten and describes them as cheerful. He does not warn parents about dangerous machines."},"explanation":"Ure wrote in 1835, during a fight over factory laws. By describing cheerful children, he defended the factory system and its owners."},{"id":"U5-E12","set":"X4","topic":"5.8","lo":"I","skill":"5.B","difficulty":"medium","stem":"The ideas in Source 2 most directly contributed to","options":{"A":"the spread of laissez-faire economics in Britain","B":"the growth of socialist and communist ideas about the working class","C":"the rise of nationalist movements in Italy and Germany","D":"the Chartist movement's first demand that working men get the vote"},"answer":"B","rationales":{"A":"Incorrect. People who wanted the government to stay out of business defended factory owners. Engels attacked the owners.","B":"Correct. Engels later wrote The Communist Manifesto (1848) with Karl Marx. His study of workers in Manchester helped shape their ideas.","C":"Incorrect. Engels writes about class, not about nations.","D":"Incorrect. The Chartist movement began in 1838, before Engels wrote, and it focused on voting rights."},"explanation":"Engels saw the factory system as a struggle between owners and workers. That idea became the center of Marxist socialism.","reasoning":"Causation"},{"id":"U5-E13","set":"X4","topic":"5.9","lo":"J","skill":"4.A","difficulty":"hard","stem":"The working conditions described in both sources are best understood in the context of","options":{"A":"the domestic system, in which families spun and wove cloth in their own homes","B":"serfdom, in which peasants were legally bound to the land of a lord and owed him labor","C":"the factory system, in which workers' families, including children, worked for wages","D":"the guild system, in which master craftsmen trained apprentices for many years"},"answer":"C","rationales":{"A":"Incorrect. Both sources describe work in mills, not at home.","B":"Incorrect. Engels compares factory work to slavery to show how much power owners had. He is describing wage labor, not serfdom or people legally owned by employers.","C":"Correct. Working-class families in Britain often needed everyone's pay. So children and women worked in the mills.","D":"Incorrect. Guilds were an older way of organizing crafts. Mills hired workers for wages."},"explanation":"Both writers describe wage work in mills. In working-class families, children often worked so the family could get by, which is why child labor was so hotly debated."},{"id":"U5-E14","set":"X5","topic":"5.6","lo":"G","skill":"4.A","difficulty":"medium","stem":"The reforms described in the passage are best understood in the context of","options":{"A":"efforts to strengthen Japan after Western powers forced it to open its ports","B":"the unequal treaties' requirement that Japan build factories run by Western firms","C":"the Tokugawa shogunate's policy of tightly limiting trade with foreign merchants","D":"a samurai revolt that forced the government to send its foreign advisers home"},"answer":"A","rationales":{"A":"Correct. U.S. warships under Matthew Perry forced Japan to open in 1853–1854, and unequal treaties followed. Meiji leaders built industry so Japan could resist Western powers.","B":"Incorrect. The unequal treaties set low tariffs and gave foreigners special rights. They did not require Japan to build factories.","C":"Incorrect. The passage shows the opposite. After the shogunate fell, the new government opened Japan to foreign goods and ideas.","D":"Incorrect. Samurai did rebel in 1877, but the government defeated them and kept hiring foreign experts."},"explanation":"Western pressure showed Japan's leaders that their country was in danger. After the Meiji Restoration of 1868, they brought in foreign machines and knowledge to make Japan strong."},{"id":"U5-E15","set":"X5","topic":"5.6","lo":"G","skill":"5.A","difficulty":"medium","stem":"The Meiji government's establishment of model factories and technical schools was most similar to which of the following?","options":{"A":"Britain's reliance on private owners and free markets to build its industry","B":"the British East India Company's rule over much of India","C":"the Indian Rebellion of 1857 against British rule","D":"Muhammad Ali's state-run factories and modernized army in Egypt"},"answer":"D","rationales":{"A":"Incorrect. British industry grew mostly through private business. Meiji Japan used the state to start industries.","B":"Incorrect. The Company was a foreign power ruling India, not a government modernizing its own country.","C":"Incorrect. The rebellion was a revolt against foreign rule. The passage is about a government building industry.","D":"Correct. Both governments used state power to bring in Western machines and experts, so their countries could stand up to European powers."},"explanation":"This is called state-sponsored industrialization. In both places, leaders feared that Europe would take control. They wanted modern industry fast so their countries could stay strong.","reasoning":"Comparison"},{"id":"U5-E16","set":"X5","topic":"5.6","lo":"G","skill":"5.B","difficulty":"easy","stem":"The developments described in the passage most directly contributed to which of the following by 1910?","options":{"A":"Japan's loss of its independence to the Western powers that had forced it to sign unequal treaties","B":"Japan's rise to become the world's largest exporter of cotton cloth, ahead of Britain","C":"a close alliance between Japan and Qing China against the Western powers","D":"Japan's rise as a regional power that defeated China and Russia in war"},"answer":"D","rationales":{"A":"Incorrect. Japan kept its independence, and by 1911 it had ended the unequal treaties.","B":"Incorrect. Japan's cotton industry grew, but Britain was still the world's largest exporter of cotton cloth in this period.","C":"Incorrect. Japan went to war with China in 1894–1895 and took Taiwan.","D":"Correct. Industry gave Japan modern weapons, ships, and railways. Japan defeated China in 1894–1895 and Russia in 1904–1905."},"explanation":"Japan's new strength let it build an empire of its own. It took Taiwan in 1895 and made Korea a colony in 1910.","reasoning":"Causation"},{"id":"U5-E17","set":"X6","topic":"5.8","lo":"I","skill":"4.A","difficulty":"medium","stem":"The decree was issued in the context of","options":{"A":"recent Ottoman victories that had won back lands from Russia near the Black Sea","B":"demands by Ottoman factory workers for laws to limit their working hours","C":"Ottoman military defeats and losses of territory that pushed leaders to reform","D":"the influence of Marxist socialism on young Ottoman officials"},"answer":"C","rationales":{"A":"Incorrect. By 1839 the Ottomans were losing land, not winning it back. The decree itself speaks of \"weakness and poverty.\"","B":"Incorrect. The empire had few factories in 1839, and the decree is about safety, taxes, and the army, not work hours.","C":"Correct. By 1839 the Ottomans had lost Greece and had been beaten by the armies of Muhammad Ali, the ruler of Egypt.","D":"Incorrect. Marx and Engels did not publish The Communist Manifesto until 1848, nine years after this decree."},"explanation":"The decree itself admits that \"weakness and poverty\" had replaced the empire's old strength. Ottoman leaders hoped new laws on safety, taxes, and the army would turn things around.","reasoning":"Causation"},{"id":"U5-E18","set":"X6","topic":"5.2","lo":"C","skill":"2.B","difficulty":"medium","stem":"The statement that the decree's rights \"shall extend to all our subjects, of whatever Religion or sect\" most directly reflects an effort to","options":{"A":"convert the empire's Christian and Jewish subjects to Islam","B":"give each religious group in the empire its own country","C":"take away the legal rights of the empire's Muslim subjects","D":"build loyalty to the Ottoman state among people of every faith"},"answer":"D","rationales":{"A":"Incorrect. The decree promises equal security to all religions. It does not ask anyone to convert.","B":"Incorrect. The decree tries to hold the empire together, not split it apart.","C":"Incorrect. The decree extends rights to all subjects. It does not take them away from Muslims.","D":"Correct. Nationalism was spreading among Christian peoples in the Balkans. Reformers hoped equal treatment would keep people of all faiths loyal to the empire."},"explanation":"This idea, called Ottomanism, asked all subjects to see themselves as Ottomans first. It was a response to nationalist movements that were pulling the empire apart."},{"id":"U5-E19","set":"X6","topic":"5.8","lo":"I","skill":"2.B","difficulty":"medium","stem":"The plan to share the decree with \"the Ambassadors of the friendly Powers\" was most likely meant to","options":{"A":"promise European merchants lower tariffs on the goods they sold in the empire","B":"place the empire's religious courts under the supervision of European judges","C":"announce that European bankers would take over the collection of Ottoman taxes","D":"show European powers that the empire could reform, and so win their support"},"answer":"D","rationales":{"A":"Incorrect. Trade rules were set in a separate 1838 treaty with Britain. This decree is about security, taxes, and the army.","B":"Incorrect. The decree says nothing about religious courts or European judges.","C":"Incorrect. European creditors did not take control of any Ottoman revenues until 1881. The decree promises a regular tax system run by the state.","D":"Correct. In 1839 the Ottomans needed help from Britain and other powers against Muhammad Ali of Egypt. Showing the ambassadors the reforms helped win that support."},"explanation":"European powers could threaten or support the Ottoman Empire. Sharing the decree with their ambassadors helped Ottoman leaders show that their state was willing and able to reform."},{"id":"U5-E20","set":"X7","topic":"5.7","lo":"H","skill":"3.A","difficulty":"easy","stem":"Smith's main argument in the passage is that","options":{"A":"pursuing private gain through investment and trade can also benefit society","B":"governments should protect home industries with high taxes on foreign goods","C":"a nation grows rich mainly by collecting more gold and silver than its rivals","D":"workers should own the factories together and share the profits equally"},"answer":"A","rationales":{"A":"Correct. Smith says a person who intends \"only his own gain\" is \"led by an invisible hand\" to help society, without meaning to.","B":"Incorrect. Smith says if another country makes something cheaper, \"better buy it of them.\"","C":"Incorrect. That is the mercantilist view, which Smith criticizes.","D":"Incorrect. That is a socialist idea. Smith defends private \"capital\" and trade."},"explanation":"Smith argues that seeking profit can also benefit other people. He favors trade that gives consumers cheaper goods, and he criticizes mercantilism for helping producers at consumers' expense."},{"id":"U5-E21","set":"X7","topic":"5.7","lo":"H","skill":"5.B","difficulty":"medium","stem":"Ideas like Smith's most directly contributed to which of the following in the 1800s?","options":{"A":"the creation of new chartered companies with monopolies on colonial trade","B":"the founding of communist governments in several European countries","C":"Britain's repeal of the Corn Laws and its move toward free trade","D":"the Tokugawa shogunate's strict limits on foreign trade"},"answer":"C","rationales":{"A":"Incorrect. Smith attacked trade monopolies. Britain ended the East India Company's trade monopolies in 1813 and 1833.","B":"Incorrect. Communist movements grew from criticisms of capitalism. Smith defended private markets.","C":"Correct. In 1846 Britain repealed the Corn Laws, its taxes on imported grain. Western European countries began to abandon mercantilism, partly because of Smith's ideas.","D":"Incorrect. The Tokugawa limits began in the 1630s, long before Smith wrote."},"explanation":"Smith's ideas about free trade spread in the 1800s. Britain cut its taxes on imports and became the leading supporter of free trade.","reasoning":"Causation"},{"id":"U5-E22","set":"X7","topic":"5.8","lo":"I","skill":"5.A","difficulty":"hard","stem":"Which nineteenth-century thinker would most directly challenge Smith's view that the pursuit of private gain can benefit society?","options":{"A":"David Ricardo","B":"Karl Marx","C":"Herbert Spencer","D":"Jean-Baptiste Say"},"answer":"B","rationales":{"A":"Incorrect. Ricardo built on Smith's ideas. He argued that countries gain from trade by specializing according to their relative costs.","B":"Correct. Marx argued that owners kept part of the value that workers created. He saw the interests of owners and workers as opposed.","C":"Incorrect. Spencer believed free competition was good for society, so he agreed with Smith about free markets.","D":"Incorrect. Say was a French economist who spread and defended Smith's ideas."},"explanation":"Smith thought self-interest could help everyone. Marx thought capitalism split people into owners and workers whose interests clashed.","reasoning":"Comparison"},{"id":"U5-E23","set":"X8","topic":"5.9","lo":"J","skill":"4.A","difficulty":"medium","stem":"The scene in the image is best understood in the context of","options":{"A":"the decline of London's population as factories moved to the countryside","B":"a royal ban on building new houses, which kept London's population small","C":"government programs that built houses with gardens for factory workers","D":"rapid urban growth that crowded workers into cheap housing"},"answer":"D","rationales":{"A":"Incorrect. London grew quickly in the 1800s. It did not lose people.","B":"Incorrect. No such ban limited London in the 1800s. The city grew to more than 3 million people by 1871.","C":"Incorrect. Large public housing programs came later. These are crowded private row houses.","D":"Correct. London's population grew from about 1 million in 1801 to over 3 million by 1871. Builders packed workers into rows of small, cheap houses."},"explanation":"Industrial cities grew faster than housing, water, and sewers could keep up. The image shows the crowded homes of London's working poor."},{"id":"U5-E24","set":"X8","topic":"5.5","lo":"F","skill":"5.B","difficulty":"easy","stem":"The railway shown in the image is an example of a technology that most directly contributed to","options":{"A":"a drop in the demand for coal and iron, because canals carried most freight","B":"faster movement of people and goods, which helped trade and cities grow","C":"a shift of British factories from cities to rural streams that supplied water power","D":"a decline in steamship trade between Britain and its colonies"},"answer":"B","rationales":{"A":"Incorrect. Trains burned coal and ran on iron rails, so railways raised the demand for both. They also took freight away from canals.","B":"Correct. Steam railways carried freight and passengers quickly and cheaply. They linked factories, ports, and cities and helped cities spread.","C":"Incorrect. Steam engines and railways let factories gather in cities and towns. Factories did not move back to rural streams.","D":"Incorrect. Railways carried goods to ports, which helped steamship trade grow rather than decline."},"explanation":"Railways spread across Britain after 1830 and then around the world. They moved raw materials, goods, and workers, and they helped industrial cities grow.","reasoning":"Causation"},{"id":"U5-E25","set":"X8","topic":"5.8","lo":"I","skill":"5.B","difficulty":"medium","stem":"Conditions like those shown in the image most directly led to which of the following in the late 1800s?","options":{"A":"public health and housing reforms, such as new sewers and building rules","B":"the removal of city building rules so that builders could put up houses faster","C":"the end of child labor in Britain's textile mills","D":"laws that stopped people from moving from the countryside into London"},"answer":"A","rationales":{"A":"Correct. Crowding and disease led British reformers and governments to build sewers, bring in clean water, and pass public health and housing laws.","B":"Incorrect. Reformers added rules for safer buildings. They did not remove them.","C":"Incorrect. Factory laws limited children's work, but they came from concerns about the mills, not housing. Child labor did not end in this period.","D":"Incorrect. Britain passed no such laws. People kept moving to cities for jobs."},"explanation":"Outbreaks of cholera and other diseases showed the dangers of crowded cities. Reformers pushed for sewers, clean water, and rules for safer housing.","reasoning":"Causation"}]}}}};</script>
<script>/* World Compass · AP Practice Exam · stimulus renderer
   Everything here is driven by the JSON stimulus object; nothing is hard-coded per question.
   Supported stimulus.type: passage | pair | image | table | bar (plus the GeoArcade map types, kept for later units).
   Anything else -> "source unavailable" card. render(stim, {glossary:true}) adds the practice-only "Words to know". */
window.PE_STIM = (function () {
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let uid = 0;
  const nid = () => 'st' + (++uid) + '_' + Math.random().toString(36).slice(2, 6);
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : (parseFloat(v) || 0);
  const fmt = v => Number.isInteger(v) ? v.toLocaleString('en-US') : (+v).toLocaleString('en-US', { maximumFractionDigits: 1 });
  const r1 = v => Math.round(v * 10) / 10;

  function render(stim, opt) {
    if (!stim || typeof stim !== 'object') return unavailable();
    opt = opt || {};
    try {
      switch (stim.type) {
        case 'passage': return passage(stim, opt);
        case 'pair': return pair(stim, opt);
        case 'image': return image(stim, opt);
        case 'table': return table(stim);
        case 'bar': return bar(stim);
        case 'districtMap': return districtMap(stim);
        case 'schematicMap': return schematicMap(stim);
        case 'rings': return rings(stim);
        default: return unavailable(stim.type);
      }
    } catch (e) {
      if (window.console && console.warn) console.warn('stimulus render failed', e);
      return unavailable(stim.type);
    }
  }

  function unavailable(type) {
    return `<figure class="stim unavail" role="note"><div>⚠︎ Source unavailable${type ? ` <span class="muted">(${esc(type)})</span>` : ''}</div><div class="small muted">You can still answer the question. Tell your AP World History teacher which question this is.</div></figure>`;
  }
  const title = t => t ? `<figcaption class="stim-title">${esc(t)}</figcaption>` : '';
  const source = s => s ? `<div class="stim-source">Source: ${esc(s)}</div>` : '';


  /* ---------- text sources (AP World) ---------- */
  // Paragraph text is plain; a "\n" inside a paragraph is a line break (poems). Footnote marks stay inline (e.g. "kaan*").
  const para = t => `<p>${esc(t).replace(/\n/g, '<br>')}</p>`;
  function glossaryHTML(g) {
    if (!g || !g.length) return '';
    return `<details class="gloss"><summary>Words to know <span class="n">${g.length}</span></summary><dl>${g.map(x => `<div><dt>${esc(x.t)}</dt><dd>${esc(x.d)}</dd></div>`).join('')}</dl></details>`;
  }
  function passageBody(s, opt, label) {
    const fns = (s.footnotes || []).map(f => `<div class="fn"><span class="m">${esc(f.mark || '*')}</span>${esc(f.text)}</div>`).join('');
    return `${label ? `<div class="psg-lbl">${esc(label)}</div>` : ''}${s.title ? `<div class="psg-title">${esc(s.title)}</div>` : ''}
      <blockquote class="psg-text${s.verse ? ' verse' : ''}">${(s.paragraphs || []).map(para).join('')}</blockquote>
      ${fns ? `<div class="fns">${fns}</div>` : ''}
      <div class="attr">${s.attribution ? `<span class="who">${esc(s.attribution)}</span>` : ''}${s.translation ? `<span class="tr">${esc(s.translation)}</span>` : ''}</div>
      ${opt.glossary ? glossaryHTML(s.glossary) : ''}`;
  }
  function passage(s, opt) {
    return `<figure class="stim psg" aria-label="Source">${passageBody(s, opt, s.label || '')}</figure>`;
  }
  function pair(s, opt) {
    const items = s.items || [];
    return `<div class="pairset">${items.map((it, i) => `<figure class="stim psg" aria-label="${esc(it.label || 'Source ' + (i + 1))}">${passageBody(it, opt, it.label || ('Source ' + (i + 1)))}</figure>`).join('')}</div>`;
  }
  function image(s, opt) {
    const id = nid();
    const ratio = s.width && s.height ? ` style="aspect-ratio:${num(s.width)}/${num(s.height)}"` : '';
    return `<figure class="stim simg" aria-label="Image source">${s.title ? `<div class="psg-title">${esc(s.title)}</div>` : ''}
      <div class="imgbox"${ratio}><img src="${esc(s.src)}" alt="${esc(s.alt || '')}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.closest('.imgbox').classList.add('broken')"><div class="imgfail" role="note"><b>The image didn't load.</b> ${esc(s.description || s.alt || '')}</div></div>
      ${s.caption ? `<p class="icap">${esc(s.caption)}</p>` : ''}
      <div class="attr">${s.attribution ? `<span class="who">${esc(s.attribution)}</span>` : ''}${s.credit ? `<span class="tr">${esc(s.credit)}</span>` : ''}</div>
      ${s.description ? `<details class="gloss"><summary>Image description</summary><p class="idesc" id="${id}">${esc(s.description)}</p></details>` : ''}
      ${opt.glossary ? glossaryHTML(s.glossary) : ''}</figure>`;
  }

  /* ---------- table ---------- */
  function tableHTML(t, caption) {
    const cols = t.columns || [], rows = t.rows || [];
    return `<div class="tscroll"><table class="stab"${caption ? ` aria-label="${esc(caption)}"` : ''}><thead><tr>${cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  function table(s) {
    return `<figure class="stim stim-table">${title(s.title)}${tableHTML(s, s.title)}${s.text ? `<p class="stim-text">${esc(s.text)}</p>` : ''}${s.note ? `<p class="stim-note">${esc(s.note)}</p>` : ''}${source(s.source)}</figure>`;
  }

  /* ---------- grouped bar chart (inline SVG) ---------- */
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const f = raw / p;
    const m = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return m * p;
  }
  function bar(s) {
    const cats = s.categories || [], series = s.series || [];
    const maxV = Math.max(1, ...series.flatMap(sr => (sr.values || []).map(num)));
    const yMax = num(s.yMax) > 0 ? num(s.yMax) : niceStep(maxV / 5) * 5;
    const W = 640, H = 380, m = { t: 20, r: 18, b: 56, l: 70 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const step = niceStep(yMax / 5);
    const y = v => m.t + ph - (v / yMax) * ph;
    const gw = pw / Math.max(1, cats.length), n = Math.max(1, series.length);
    const bw = Math.min(58, (gw * 0.72) / n), groupW = bw * n;
    const id = nid(), tid = id + 't', did = id + 'd';
    let grid = '';
    for (let v = 0; v <= yMax + 1e-9; v += step) {
      grid += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${r1(y(v))}" y2="${r1(y(v))}"/><text class="tick" x="${m.l - 9}" y="${r1(y(v) + 4)}" text-anchor="end">${fmt(v)}</text>`;
    }
    let bars = '';
    cats.forEach((c, ci) => {
      const x0 = m.l + ci * gw + (gw - groupW) / 2;
      series.forEach((sr, si) => {
        const v = num((sr.values || [])[ci]);
        const x = x0 + si * bw, h = Math.max(0, ph * (v / yMax));
        bars += `<rect class="bar s${si}" x="${r1(x + 3)}" y="${r1(y(v))}" width="${r1(bw - 6)}" height="${r1(h)}" rx="3"><title>${esc(c)} · ${esc(sr.name)}: ${fmt(v)}</title></rect>`;
        if (si === 1) bars += `<rect x="${r1(x + 3)}" y="${r1(y(v))}" width="${r1(bw - 6)}" height="${r1(h)}" rx="3" fill="url(#${id}h)" pointer-events="none"/>`;
        bars += `<text class="val" x="${r1(x + bw / 2)}" y="${r1(y(v) - 6)}" text-anchor="middle">${fmt(v)}</text>`;
      });
      const cx = r1(m.l + ci * gw + gw / 2), lines = String(c).split('\n');
      bars += `<text class="cat" x="${cx}" y="${H - m.b + 22}" text-anchor="middle">${lines.map((ln, li) => `<tspan x="${cx}" dy="${li ? 15 : 0}">${esc(ln)}</tspan>`).join('')}</text>`;
    });
    const axes = `<line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t + ph}"/><line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ph}" y2="${m.t + ph}"/>`;
    const ylab = s.yLabel ? `<text class="ylab" transform="translate(16 ${r1(m.t + ph / 2)}) rotate(-90)" text-anchor="middle">${esc(s.yLabel)}</text>` : '';
    const legend = `<div class="legend" aria-hidden="true">${series.map((sr, i) => `<span class="lg"><i class="sw s${i}"></i>${esc(sr.name)}</span>`).join('')}</div>`;
    const desc = `Grouped bar chart with ${cats.length} categories and ${series.length} series. ` + cats.map((c, ci) => `${String(c).replace(/\n/g, ' ')}: ` + series.map(sr => `${sr.name} ${fmt(num((sr.values || [])[ci]))}`).join(', ')).join('. ') + '.';
    const srTable = `<div class="sr-only"><table><caption>${esc(s.title || 'Chart data')}</caption><thead><tr><th scope="col">Category</th>${series.map(sr => `<th scope="col">${esc(sr.name)}</th>`).join('')}</tr></thead><tbody>${cats.map((c, ci) => `<tr><th scope="row">${esc(String(c).replace(/\n/g, ' '))}</th>${series.map(sr => `<td>${fmt(num((sr.values || [])[ci]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    return `<figure class="stim stim-bar">${title(s.title)}${legend}<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid} ${did}"><title id="${tid}">${esc(s.title || 'Bar chart')}</title><desc id="${did}">${esc(desc)}</desc><defs><pattern id="${id}h" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,.55)" stroke-width="2"/></pattern></defs>${grid}${axes}${bars}${ylab}</svg></div>${srTable}${s.text ? `<p class="stim-text">${esc(s.text)}</p>` : ''}${source(s.source)}</figure>`;
  }

  /* ---------- district maps ---------- */
  function districtMap(s) {
    const g = s.grid || {}, R = num(g.rows) || (g.blueShare || []).length, C = num(g.cols) || ((g.blueShare || [])[0] || []).length;
    const bs = g.blueShare || [];
    const cell = 50, pad = 4, W = C * cell + pad * 2, H = R * cell + pad * 2;
    const plans = (s.plans || []).map((p, pi) => {
      const dmap = {};
      (p.districts || []).forEach((d, di) => d.forEach(rc => { dmap[rc[0] + ',' + rc[1]] = di; }));
      let cells = '', borders = '';
      const X = c => pad + c * cell, Y = r => pad + r * cell;
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        const v = num((bs[r] || [])[c]);
        const blue = v >= 50;
        cells += `<rect class="pc ${blue ? 'blue' : 'orange'}" x="${X(c)}" y="${Y(r)}" width="${cell}" height="${cell}"/><text class="pval" x="${X(c) + cell / 2}" y="${Y(r) + cell / 2 + 5}" text-anchor="middle">${fmt(v)}</text>`;
        const me = dmap[r + ',' + c];
        const diff = (rr, cc) => rr < 0 || cc < 0 || rr >= R || cc >= C || dmap[rr + ',' + cc] !== me;
        if (diff(r - 1, c)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r)}" x2="${X(c) + cell}" y2="${Y(r)}"/>`;
        if (diff(r, c - 1)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r)}" x2="${X(c)}" y2="${Y(r) + cell}"/>`;
        if (diff(r + 1, c)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r) + cell}" x2="${X(c) + cell}" y2="${Y(r) + cell}"/>`;
        if (diff(r, c + 1)) borders += `<line class="dline" x1="${X(c) + cell}" y1="${Y(r)}" x2="${X(c) + cell}" y2="${Y(r) + cell}"/>`;
      }
      const did = nid();
      const desc = (p.districts || []).map((d, di) => `District ${di + 1}: ` + d.map(rc => `row ${rc[0] + 1} column ${rc[1] + 1} (${fmt(num((bs[rc[0]] || [])[rc[1]]))}% Blue)`).join(', ')).join('. ');
      return `<figure class="dplan"><svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${did}"><title id="${did}">${esc(p.name || 'Plan ' + (pi + 1))}. ${esc(desc)}</title><g>${cells}</g><g>${borders}</g></svg><figcaption>${esc(p.name || 'Plan ' + (pi + 1))}</figcaption></figure>`;
    });
    const legend = `<div class="legend"><span class="lg"><i class="sw pblue"></i>Majority Blue Party (≥ 50)</span><span class="lg"><i class="sw porange"></i>Majority Orange Party (&lt; 50)</span><span class="lg"><i class="sw dline"></i>District boundary</span></div>`;
    return `<figure class="stim stim-dmap dmap">${title(s.title)}${s.note ? `<p class="stim-note">${esc(s.note)}</p>` : ''}<div class="dplans">${plans.join('')}</div>${legend}${s.resultsTable ? `<div class="dresults">${title(s.resultsTable.title)}${tableHTML(s.resultsTable, s.resultsTable.title)}</div>` : ''}${source(s.source)}</figure>`;
  }

  /* ---------- schematic maps ---------- */
  const pts = poly => (poly || []).map(p => `${r1(num(p[0]))},${r1(num(p[1]))}`).join(' ');
  function bbox(poly) {
    const xs = poly.map(p => num(p[0])), ys = poly.map(p => num(p[1]));
    return { x1: Math.min(...xs), y1: Math.min(...ys), x2: Math.max(...xs), y2: Math.max(...ys) };
  }
  const contains = (a, b) => a.x1 <= b.x1 && a.y1 <= b.y1 && a.x2 >= b.x2 && a.y2 >= b.y2 && (a.x2 - a.x1) * (a.y2 - a.y1) > (b.x2 - b.x1) * (b.y2 - b.y1);
  function wrap(text, max) {
    const words = String(text || '').split(/\s+/), lines = []; let cur = '';

    const feats = Array.isArray(s.features) ? s.features : [];
    const id = nid();
    const L = { claims: '', zones: '', hatchZones: '', land: '', lines: '', markers: '', labels: '', arrows: '', scale: '', brackets: '' };
    const owners = [];
    const ownerIdx = o => { const k = ownerKey(o); let i = owners.indexOf(k); if (i < 0) { owners.push(k); i = owners.length - 1; } return i; };
