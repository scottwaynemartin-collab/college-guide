mericas. Regions follow the database's categories; mainland North America is the area that later became the United States and Canada. The second period extends past 1750.","source":"Trans-Atlantic Slave Trade Database estimates, Slave Voyages (slavevoyages.org), Emory University"},"P14":{"type":"pair","items":[{"label":"Source 1","paragraphs":["The discovery of America, and that of a passage to the East Indies by the Cape of Good Hope, are the two greatest and most important events recorded in the history of mankind. … By uniting in some measure the most distant parts of the world, by enabling them to relieve one another's wants, to increase one another's enjoyments, and to encourage one another's industry, their general tendency would seem to be beneficial. To the natives, however, both of the East and West Indies, all the commercial benefits which can have resulted from those events have been sunk and lost in the dreadful misfortunes which they have occasioned. These misfortunes, however, seem to have arisen rather from accident than from anything in the nature of those events themselves. At the particular time when these discoveries were made, the superiority of force happened to be so great on the side of the Europeans, that they were enabled to commit with impunity every sort of injustice in those remote countries. …"],"attribution":"Adam Smith, Scottish economist, The Wealth of Nations, 1776","translation":"Adapted","glossary":[{"t":"East and West Indies","d":"Asia and the Americas"},{"t":"with impunity","d":"without being punished"}]},{"label":"Source 2","paragraphs":["The discovery of gold and silver in America, the extirpation, enslavement and entombment in mines of the native population, the beginning of the conquest and looting of the East Indies, the turning of Africa into a [hunting ground for enslaved people], signalled the rosy dawn of the era of capitalist production. … On their heels treads the commercial war of the European nations, with the globe for a theatre. …","These methods [colonies, national debt, taxes, and tariffs] depend in part on brute force, for example, the colonial system. But they all employ the power of the State, the concentrated and organized force of society, to hasten … the process of transformation of the feudal mode of production into the capitalist mode. … Force is the midwife of every old society pregnant with a new one."],"attribution":"Karl Marx, German philosopher and critic of capitalism, Capital, Volume 1, 1867","translation":"Translated by Samuel Moore and Edward Aveling (1887); offensive 1887 wording replaced in brackets; adapted","glossary":[{"t":"extirpation","d":"destruction; wiping out"},{"t":"entombment in mines","d":"being worked to death in mines"},{"t":"rosy dawn","d":"Marx is being sarcastic: the \"bright beginning\" was actually violent"},{"t":"capitalist production","d":"an economy in which private owners invest money to make profit"},{"t":"feudal mode of production","d":"an older economy of lords and peasants"}]}]}},"practice":[{"id":"U4-P01","set":"P1","topic":"4.2","lo":"C","skill":"3.A","difficulty":"easy","stem":"The answer \"in search of Christians and of spices\" in the first paragraph best reflects which motives for Portuguese exploration?","options":{"A":"Religious and commercial goals: finding Christian allies and reaching the spice trade","B":"A wish to escape religious persecution at home and settle in new lands","C":"A plan to conquer and colonize the interior of the Indian subcontinent","D":"Scientific curiosity about the plants, animals, and peoples of the Southern Hemisphere"},"answer":"A","explanation":"\"Christians\" points to religion: the Portuguese hoped to find Christian allies and spread their faith. \"Spices\" points to money: they wanted to buy spices at the source instead of through Muslim and Venetian middlemen.","whyNot":{"B":"The Portuguese were not fleeing persecution; they were sent by their king.","C":"Nothing here mentions conquering inland India; the Portuguese wanted ports and trade.","D":"The crew says they came for Christians and spices, not to study nature."},"hint":"Split the phrase in two. What does \"Christians\" tell you? What does \"spices\" tell you?"},{"id":"U4-P02","set":"P1","topic":"4.4","lo":"F","skill":"3.A","difficulty":"medium","stem":"The reaction to the Portuguese gifts in the second paragraph best shows that","options":{"A":"Calicut was a rich trading center whose officials found the Portuguese gifts too poor","B":"the people of Calicut had never before met or traded with merchants from foreign lands","C":"the Portuguese were welcomed as the most powerful traders in the Indian Ocean world","D":"Indian rulers preferred to trade with Christian merchants rather than Muslim ones"},"answer":"A","explanation":"The officials compared these gifts with richer gifts from other merchants. Their reaction shows how wealthy Calicut was, and that the Portuguese did not meet the court's expectations.","whyNot":{"B":"Merchants from Tunis were already in Calicut, and the officials compared the gifts with those from Mecca. The people of Calicut knew foreign traders well.","C":"The passage does not show Portuguese power in Indian Ocean trade. It shows local officials judging their gifts too poor.","D":"Muslim merchants were already trading in Calicut, and the officials compared the gifts with those from Mecca."},"hint":"Why would officials laugh at hats, cloth, and honey? What were they used to getting?"},{"id":"U4-P03","set":"P1","topic":"4.1","lo":"A","skill":"4.A","difficulty":"medium","stem":"Vasco da Gama's ability to sail from East Africa to Calicut was most directly aided by","options":{"A":"a treaty in which Ming China opened the Indian Ocean to European ships","B":"Ming Chinese warships that escorted the Portuguese fleet across the ocean","C":"sea charts given to the Portuguese by the ruler of Calicut","D":"a local pilot hired in East Africa who knew the monsoon wind patterns"},"answer":"D","explanation":"At Malindi in East Africa, da Gama hired a pilot who knew how to use the monsoon winds to cross the Indian Ocean. Europeans' ocean travel depended on knowledge from other peoples.","whyNot":{"A":"Ming China made no such treaty, and China did not control the Indian Ocean.","B":"Ming China's treasure fleets had stopped sailing by the 1430s, and they never escorted Portuguese ships.","C":"Calicut was da Gama's destination. Its ruler did not help him get there."},"hint":"Da Gama sailed around Africa. Who in the Indian Ocean already knew how to cross it?"},{"id":"U4-P04","set":"P2","topic":"4.2","lo":"C","skill":"2.B","difficulty":"easy","stem":"Columbus most likely emphasized the gold, spices, and cotton of the islands in order to","options":{"A":"warn other European rulers to keep their ships away from the Caribbean","B":"persuade the Taíno to trade their gold for Spanish goods","C":"show that the islands' people were already Christians","D":"convince the Spanish monarchs to keep paying for his voyages"},"answer":"D","explanation":"Columbus wanted the king and queen to pay for more voyages. Describing gold, spices, and cotton made the islands sound like a great investment.","whyNot":{"A":"The letter was printed and shared across Europe; it advertises riches instead of warning others away.","B":"The letter is written to a Spanish official, not to the Taíno.","C":"Columbus hopes the islanders \"might be led to become Christians,\" so they were not Christians yet."},"hint":"Who was paying for the voyages? What would make them want to pay again?"},{"id":"U4-P05","set":"P2","topic":"4.2","lo":"C","skill":"3.A","difficulty":"easy","stem":"Based on the third paragraph, Columbus hoped that his voyage would lead to","options":{"A":"a peaceful partnership in which the islands' people kept their land","B":"converts to Christianity and new wealth for Spain from the islands","C":"the end of Spain's wars with the Muslim states of North Africa","D":"a trade treaty between Spain and the emperor of China"},"answer":"B","explanation":"Columbus promised \"all the gold they require\" and talked about \"turning so many nations to our holy faith.\" He mixed religious goals with the hope of riches.","whyNot":{"A":"Columbus offers to ship the islanders as slaves, so he did not plan for them to keep control of their land.","C":"The paragraph does not mention North Africa.","D":"The paragraph talks about gold, spices, cotton, slaves, and converts, not a treaty with China."},"hint":"Find two kinds of rewards Columbus promises: one religious and one about money."},{"id":"U4-P06","set":"P2","topic":"4.3","lo":"D","skill":"5.B","difficulty":"medium","stem":"Which of the following was a long-term result of the encounter that Columbus describes?","options":{"A":"The Taíno formed a strong empire that resisted Spain for centuries","B":"Spain gave up its Caribbean claims to focus on trade with Asia","C":"The Taíno population collapsed because of disease and forced labor","D":"European crops failed to grow in the Americas, so colonists starved"},"answer":"C","explanation":"Disease, violence, hunger, and forced labor caused a steep drop in the Taíno population. Taíno people survived, and their descendants and cultures continue today.","whyNot":{"A":"Taíno communities suffered severe population losses. They did not form an empire that resisted Spain.","B":"Spain kept and expanded its Caribbean colonies.","D":"European crops and animals spread widely in the Americas as part of the Columbian Exchange."},"hint":"What effects did disease and Spanish rule have on Taíno communities after 1492?","reasoning":"Causation"},{"id":"U4-P07","set":"P3","topic":"4.3","lo":"D","skill":"5.B","difficulty":"easy","stem":"The most important cause of the trend shown in the table was","options":{"A":"epidemics of smallpox, measles, and other diseases new to the Americas","B":"large-scale migration of Indigenous people from Mexico to the Caribbean","C":"a series of volcanic eruptions that destroyed farmland in central Mexico","D":"the Spanish practice of shipping large numbers of Indigenous workers to labor in Spain"},"answer":"A","explanation":"The biggest killer was disease. Smallpox, measles, and other illnesses from Europe and Africa spread through people who had never been exposed to them. War, famine, and forced labor made the epidemics even deadlier.","whyNot":{"B":"Migration to the Caribbean does not explain a population loss this large. Epidemics, violence, hunger, and forced labor caused far greater losses.","C":"Volcanoes did not cause this decline.","D":"Some Indigenous people were taken to Europe, but that does not explain the population loss shown here."},"hint":"This is part of the Columbian Exchange. What invisible things crossed the ocean with Europeans?","reasoning":"Causation"},{"id":"U4-P08","set":"P3","topic":"4.4","lo":"F","skill":"5.B","difficulty":"medium","stem":"The trend shown in the table most directly contributed to which of the following in the Americas?","options":{"A":"the end of Spanish silver mining in central Mexico","B":"a shift by Indigenous survivors from farming to herding","C":"greater use of enslaved Africans and other forced labor","D":"large-scale migration of free workers from China to Mexico"},"answer":"C","explanation":"As Indigenous populations fell, colonists looked for more workers for mines and farms. They brought in more enslaved Africans and kept forcing Indigenous people to work.","whyNot":{"A":"Silver mining continued despite the population decline.","B":"Most surviving Indigenous people kept farming.","D":"Free Chinese workers did not migrate to Mexico in large numbers."},"hint":"How did colonists respond to these population losses?","reasoning":"Causation"},{"id":"U4-P09","set":"P3","topic":"4.3","lo":"D","skill":"2.C","difficulty":"easy","stem":"Which of the following is a limitation of the table as evidence?","options":{"A":"The figures are estimates from partial records, and other historians dispute them.","B":"The table shows only the population of the Caribbean islands, not Mexico.","C":"The table begins after the Spanish conquest was already over.","D":"The figures come from Aztec census takers who greatly exaggerated how many people died."},"answer":"A","explanation":"The note says these are estimates and that some historians think the starting number is too high. No one counted everyone in 1518, so historians argue about the exact numbers, even though all agree the drop was enormous.","whyNot":{"B":"The title says central Mexico.","C":"The table starts in 1518, before the conquest began in 1519.","D":"The note says the figures come from historians using Spanish tax and tribute records."},"hint":"Read the note under the table. Are these exact counts?"},{"id":"U4-P10","set":"P4","topic":"4.4","lo":"F","skill":"3.B","difficulty":"medium","stem":"Barbosa's description of Rander and Malacca best supports which of the following claims?","options":{"A":"Asian merchants still traded widely across the Indian Ocean after the Portuguese came.","B":"The Portuguese had already taken over nearly all Indian Ocean trade by the early 1500s.","C":"Indian Ocean trade was carried on mainly by Christian merchants from Europe.","D":"Trade between India and China had largely stopped by the early 1500s."},"answer":"A","explanation":"Barbosa, a Portuguese official, describes rich Muslim and Hindu merchants with their own big ships trading all over Asia. The Portuguese arrived, but Asian merchants kept trading.","whyNot":{"B":"Barbosa describes Muslim and Hindu merchants with their own ships trading widely, so the Portuguese had not taken over.","C":"The merchants Barbosa describes are Muslim and Hindu, not European Christians.","D":"Barbosa says goods from China could be found at Rander, so that trade continued."},"hint":"Who owns the ships in Barbosa's description?"},{"id":"U4-P11","set":"P4","topic":"4.4","lo":"F","skill":"5.B","difficulty":"easy","stem":"The trading activity described in the passage was most directly a continuation of","options":{"A":"the new Atlantic trade that linked Europe, West Africa, and the Americas","B":"the Silk Roads caravan trade run by the Mongol Empire","C":"the Hanseatic League's trade around the Baltic Sea","D":"older Indian Ocean networks of Muslim, Hindu, and other merchants"},"answer":"D","explanation":"Merchants had used the monsoon winds to trade across the Indian Ocean for centuries. Barbosa describes that same old network still running.","whyNot":{"A":"The places named (Malacca, Bengal, Sumatra, China) are in the Indian Ocean world, not the Atlantic.","B":"This is sea trade between ports, and the Mongol Empire had broken up by the 1300s.","C":"The Hanseatic League traded in northern Europe."},"hint":"Look at the place names. Which ocean are they in?","reasoning":"Continuity and Change"},{"id":"U4-P12","set":"P4","topic":"4.4","lo":"E","skill":"4.A","difficulty":"hard","stem":"Barbosa says merchants lived in Malacca \"up to now.\" This phrase most likely refers to the fact that","options":{"A":"China's Ming dynasty had recently conquered Malacca and closed it to foreign merchants","B":"an earthquake had recently destroyed most of Malacca's harbor","C":"Asian merchants stayed even after Portugal captured the city in 1511","D":"the Dutch East India Company had taken over Malacca's trade"},"answer":"C","explanation":"Portugal captured Malacca in 1511, a few years before Barbosa finished his book. \"Up to now\" means \"still, even today.\" Asian merchants kept living and trading there under Portuguese rule.","whyNot":{"A":"China did not conquer Malacca.","B":"Malacca's harbor kept operating.","D":"The Dutch did not take Malacca until 1641, long after Barbosa wrote."},"hint":"Barbosa finished his book around 1518. What happened to Malacca in 1511? Did the merchants leave?"},{"id":"U4-P13","set":"P5","topic":"4.4","lo":"E","skill":"3.A","difficulty":"easy","stem":"The passage suggests that an alliance with the Spaniards appealed to the Tlaxcalans mainly because","options":{"A":"they had long resisted the Mexica Empire and wanted to stay independent of it","B":"they had converted to Christianity and wished to serve the Spanish king","C":"they hoped the Spaniards would help them fight Spain's rivals in Europe","D":"they needed Spanish ships to carry salt and cotton across the Caribbean"},"answer":"A","explanation":"The Tlaxcalans say they had always fought to stay free of Moctezuma, who blocked them on all sides. An alliance with the Spaniards gave them a chance against their old enemy.","whyNot":{"B":"The passage says nothing about the Tlaxcalans becoming Christians.","C":"The Tlaxcalans' enemy was Moctezuma's empire, not European states.","D":"They mention lacking salt because the Mexica blocked it, not because they wanted ships."},"hint":"Who had the Tlaxcalans been fighting for generations?"},{"id":"U4-P14","set":"P5","topic":"4.4","lo":"E","skill":"5.B","difficulty":"easy","stem":"The alliance described in the passage most directly contributed to","options":{"A":"the Spanish defeat of the Mexica Empire in 1521","B":"the Spanish conquest of the Inca Empire in the 1530s","C":"a Mexica and Tlaxcalan alliance against the Spanish","D":"the crown's decision to make Tlaxcala independent of New Spain"},"answer":"A","explanation":"Thousands of Tlaxcalan and other Indigenous allies fought alongside the Spaniards. These alliances, along with disease and the siege, helped bring down Tenochtitlan in 1521.","whyNot":{"B":"The Inca were conquered by a different Spanish force in Peru; the Tlaxcalans fought in Mexico.","C":"The Tlaxcalans joined the Spanish against the Mexica, their longtime enemy.","D":"Tlaxcala received some special privileges, but it stayed part of New Spain."},"hint":"Which empire did the Tlaxcalans want to be free of, and what happened to it?","reasoning":"Causation"},{"id":"U4-P15","set":"P5","topic":"4.4","lo":"E","skill":"2.B","difficulty":"hard","stem":"Cortés's purpose in writing to the king most likely led him to","options":{"A":"play down the size and power of Moctezuma's empire","B":"present his actions as gaining loyal new subjects for the king","C":"describe the Tlaxcalans as stronger than the Mexica","D":"hide the fact that the Tlaxcalans had fought against him"},"answer":"B","explanation":"Cortés had gone to Mexico without full permission, so he wanted the king's approval. He shows the Tlaxcalans asking to join \"the royal service of Your Majesty,\" making himself look like he was winning subjects for the king.","whyNot":{"A":"Cortés stresses Moctezuma's \"great power,\" which makes his own success look bigger.","C":"The Tlaxcalans say they had to defend themselves against the Mexica, who surrounded them, so they were not stronger.","D":"Cortés openly says the Tlaxcalans asked pardon for their \"past errors\" of fighting him."},"hint":"Cortés wanted royal support. How might that goal shape his account?"},{"id":"U4-P16","set":"P6","topic":"4.5","lo":"I","skill":"5.B","difficulty":"medium","stem":"In trade with Asia, much of the silver described in the second paragraph was used by Europeans to","options":{"A":"repay loans from Chinese bankers who had paid for Spain's voyages","B":"buy enslaved workers in Asia to send to the silver mines of Potosí","C":"pay tribute to the Ottoman sultan in exchange for use of Mediterranean ports","D":"buy silk and porcelain from Chinese merchants"},"answer":"D","explanation":"Asian merchants wanted silver. Europeans used silver from the Americas to buy silk, porcelain, spices, and other goods. China's demand for silver was huge.","whyNot":{"A":"Chinese bankers did not pay for Spain's voyages. Spain borrowed mostly from European bankers, such as those in Genoa.","B":"Potosí's workers were mostly Indigenous Andeans. Asian captives did not supply the mines.","C":"Spain did not pay tribute to the Ottomans."},"hint":"Europeans wanted Asian goods. What could they pay with?","reasoning":"Causation"},{"id":"U4-P17","set":"P6","topic":"4.4","lo":"F","skill":"1.B","difficulty":"medium","stem":"Much of the labor described in the third paragraph was supplied through the mita, a system that","options":{"A":"brought indentured servants from Spain who worked in exchange for free passage","B":"paid free Indigenous workers wages set by supply and demand in the market","C":"adapted the Inca labor tax to force Indigenous men to work in the mines in turns","D":"relied on enslaved people captured in Africa as the main source of labor in the mines"},"answer":"C","explanation":"The Inca had a labor tax called the mit'a. The Spanish changed it into the mita, which forced Indigenous villages to send men to work in the silver mines for set periods. This is an example of continuity and change.","whyNot":{"A":"The mita drafted Indigenous Andeans, not Spanish servants.","B":"The mita required men to serve. Getting some pay did not make that service voluntary.","D":"The Potosí mines relied mostly on Indigenous Andean workers, not enslaved Africans."},"hint":"This system existed before the Spanish arrived. Which empire ruled the Andes before Spain?","reasoning":"Continuity and Change"},{"id":"U4-P18","set":"P6","topic":"4.4","lo":"E","skill":"2.A","difficulty":"medium","stem":"Acosta's statement that heaven gave the Kings of Spain power \"environing the whole world\" most likely reflects","options":{"A":"his view, as a Spanish Jesuit, that Spain's empire showed God's favor","B":"his criticism of the Spanish crown for spending too much on wars in Europe","C":"his belief that Spain should share its American silver with Portugal","D":"his support for Indigenous rebels who wanted to end Spanish rule"},"answer":"A","explanation":"Acosta was a Spanish Catholic priest. He saw Spain's huge, silver-rich empire as a sign that God favored the Spanish kings.","whyNot":{"B":"Acosta praises the kings' power here; he does not criticize their spending.","C":"Nothing in the passage suggests sharing silver with Portugal.","D":"Acosta describes Spain's power as a gift from heaven, not something to overthrow."},"hint":"Think about who Acosta was and who he served."},{"id":"U4-P19","set":"P7","topic":"4.4","lo":"E","skill":"3.A","difficulty":"medium","stem":"The passage best supports which claim about Kongo and Angola in the 1500s?","options":{"A":"Kongo's rulers stopped trading with the Portuguese once the king became a Christian.","B":"Kongo's rulers controlled early trade with the Portuguese, including the slave trade.","C":"The Portuguese had conquered Kongo and Angola by the early 1500s.","D":"Kongo and Angola traded mainly with Muslim merchants from the Indian Ocean coast."},"answer":"B","explanation":"Trade at Luanda happened \"by permission of the King of Kongo.\" At first, African rulers, not the Portuguese, decided who could trade. Portugal tried to conquer land only later.","whyNot":{"A":"The passage says the Lord of Angola kept trading with the Portuguese after Kongo's king became a Christian.","C":"The passage says Portugal began trying to conquer land only later, under Paulo Dias de Novais.","D":"The trade in the passage ran through Luanda and São Tomé, an Atlantic trade with the Portuguese."},"hint":"Who gave permission for trade at the port of Luanda?"},{"id":"U4-P20","set":"P7","topic":"4.5","lo":"K","skill":"1.B","difficulty":"easy","stem":"The conversion of Kongo's king described in the passage is an example of which broader development?","options":{"A":"the spread of Islam into Central Africa through the trans-Saharan caravan trade routes","B":"the spread of Christianity by sea, often adopted by rulers seeking trade and allies","C":"the decline of Christianity across Africa after Ethiopia was conquered","D":"the rejection of European religious teachings by most African rulers"},"answer":"B","explanation":"Portuguese ships brought Christian missionaries along with trade. Kongo's rulers became Christian, which also helped them build ties with Portugal.","whyNot":{"A":"Kongo's king became Christian, not Muslim, and the contact came by sea from Portugal.","C":"Christian rule survived in Ethiopia despite major wars, and the passage describes Christianity spreading in Kongo.","D":"Kongo's king accepted Christianity, so this is not a rejection."},"hint":"What religion did the Portuguese bring, and how did they arrive?"},{"id":"U4-P21","set":"P7","topic":"4.4","lo":"G","skill":"1.B","difficulty":"easy","stem":"The enslaved people sent to São Tomé, as described in the passage, were most often forced to work","options":{"A":"on sugar plantations on Atlantic islands and later in Brazil","B":"in silver mines in the Andes run by Spanish colonial officials","C":"in cotton textile workshops in the Indian region of Gujarat","D":"on rice farms in southern China owned by Portuguese merchants"},"answer":"A","explanation":"São Tomé was an early sugar colony worked by enslaved Africans. The same plantation system then spread to Brazil and the Caribbean.","whyNot":{"B":"The Andean mines relied mostly on Indigenous Andean workers drafted through the mita.","C":"Gujarat's textile workers were local Indian artisans.","D":"Portuguese merchants did not run rice farms in China."},"hint":"What crop did the Portuguese grow with enslaved labor on Atlantic islands?"},{"id":"U4-P22","set":"P8","topic":"4.5","lo":"H","skill":"3.A","difficulty":"easy","stem":"Mun's main argument is that a kingdom becomes wealthy by","options":{"A":"buying as many foreign goods as it can so that prices at home stay low","B":"collecting gifts and tribute from weaker nations instead of trading","C":"selling more abroad than it buys, so the difference comes in as gold and silver","D":"lending its gold and silver to foreign rulers in return for high rates of interest"},"answer":"C","explanation":"Mun's rule is to sell more to foreigners than you buy from them. The extra comes back as gold and silver. This idea is called mercantilism.","whyNot":{"A":"Mun says to sell more to foreigners than we buy from them, the opposite of buying as much as possible.","B":"Mun says gifts and wealth taken from other nations are \"uncertain and of small consideration.\"","D":"Mun does not discuss lending money to foreign rulers."},"hint":"Look for the word \"rule\" in the first paragraph."},{"id":"U4-P23","set":"P8","topic":"4.5","lo":"H","skill":"5.B","difficulty":"medium","stem":"Ideas like Mun's most directly encouraged European states to","options":{"A":"remove tariffs and other limits so they could trade freely with foreign nations","B":"charter trading companies and seek colonies for raw materials and markets","C":"end their competition with one another for colonies overseas","D":"forbid the sale of manufactured goods to their own colonies"},"answer":"B","explanation":"If wealth comes from selling more than you buy, colonies help: they supply cheap raw materials and buy finished goods. States chartered companies like the English and Dutch East India Companies to win this trade.","whyNot":{"A":"Mercantilists wanted to limit imports, not remove all tariffs.","C":"Mercantilism made competition for colonies stronger.","D":"Mercantilists wanted colonies to buy the home country's goods."},"hint":"How could colonies help a country sell more than it buys?","reasoning":"Causation"},{"id":"U4-P24","set":"P8","topic":"4.5","lo":"H","skill":"3.D","difficulty":"hard","stem":"Which of the following views most directly challenges Mun's argument?","options":{"A":"A country's wealth depends on the goods its people make and use, not on stored gold and silver.","B":"A state should protect its farmers and craftsmen from foreign competition by taxing imports.","C":"A state should give selected trading companies the sole right to trade in a region.","D":"Colonies should supply raw materials to industries in the home country and buy its goods."},"answer":"A","explanation":"Mun measures a nation's wealth by the treasure (gold and silver) it brings home. The correct choice uses a different measure: the goods people make and use. Adam Smith made this argument in 1776.","whyNot":{"B":"Taxing imports to protect home producers fits Mun's mercantilist goals; it does not challenge them.","C":"Trading companies with special rights, like the East India Company Mun worked for, fit mercantilism.","D":"Using colonies to supply raw materials and buy finished goods was a mercantilist idea."},"hint":"Which choice changes the way a country's wealth is measured?"},{"id":"U4-P25","set":"P9","topic":"4.5","lo":"H","skill":"3.A","difficulty":"medium","stem":"Day's main argument in the passage is that","options":{"A":"the Dutch directors at home planned from the start to conquer Java","B":"the Dutch carefully avoided war in Asia because their trade depended on peace with local rulers","C":"Dutch officials in Asia came to see military force as necessary to protect the Company's trade","D":"Javanese rulers forced the Dutch to leave the island by the middle of the 1600s"},"answer":"C","explanation":"Day argues the Dutch came only to trade, but officials like Coen decided they had to use force to protect that trade. Coen said trade and war could not be separated.","whyNot":{"A":"Day says the directors' orders were to avoid war; expansion came from officials on the spot.","B":"Day says officials found it \"morally impossible\" to obey orders to avoid war.","D":"The Dutch stayed and expanded on Java."},"hint":"Read Coen's quotation at the end. What two things did he say go together?"},{"id":"U4-P26","set":"P9","topic":"4.5","lo":"H","skill":"1.B","difficulty":"easy","stem":"The Dutch East India Company was a joint-stock company, which means that it","options":{"A":"was owned and run directly by the government of the Netherlands","B":"raised money by selling shares to investors who shared its profits and risks","C":"was a loose group of merchants who shared ships but each kept their own separate profits","D":"was a religious order that paid for missions with profits from trade"},"answer":"B","explanation":"A joint-stock company sells shares (stock) to many investors. They pool their money, share the risks, and split the profits. This let companies like the VOC pay for expensive voyages.","whyNot":{"A":"The VOC got powers from the government, but private investors owned it.","C":"In a joint-stock company, investors pool money and share the profits.","D":"The VOC was a business, not a religious order."},"hint":"Think about what \"stock\" means."},{"id":"U4-P27","set":"P9","topic":"4.5","lo":"H","skill":"5.A","difficulty":"medium","stem":"Coen's view of trade and war was most similar to the actions of","options":{"A":"the Tokugawa shogunate, which strictly limited contact with European merchants","B":"the Ming dynasty, which ended Zheng He's great naval voyages in the 1430s","C":"the Mughal emperor Akbar, who ended the jizya tax on non-Muslim subjects","D":"the Portuguese, who used warships and forts to control Indian Ocean ports"},"answer":"D","explanation":"Like Coen, the Portuguese used armed ships and forts to control ports and sea lanes in the Indian Ocean. Both mixed trade with military force.","whyNot":{"A":"The Tokugawa limited trade; they did not use force to win it overseas.","B":"The Ming ended their voyages instead of using them to win trade by force.","C":"Akbar's tax policy was about religion and loyalty, not using force to control trade."},"hint":"Which group also used cannons and forts to control trade at sea?","reasoning":"Comparison"},{"id":"U4-P28","set":"P10","topic":"4.4","lo":"E","skill":"3.A","difficulty":"easy","stem":"The passage shows that the Qing government viewed Christianity as","options":{"A":"a valuable teaching that should replace the ideas of Confucius","B":"the new official religion of the Qing emperor and his court","C":"a dangerous teaching, though its missionaries' math skills were useful","D":"a harmless teaching that ordinary people should be free to follow if they wished"},"answer":"C","explanation":"The edict calls Christianity \"corrupt\" and says the law will not excuse spreading it. But it admits the government employs the missionaries because they know mathematics.","whyNot":{"A":"The passage calls Christianity \"corrupt\" and praises Confucian teaching.","B":"Christianity is called corrupt; the emperors supported Confucian ideas.","D":"The passage warns people to stop \"strange sects\" like floods and fires."},"hint":"Find the word \"but\" in the third paragraph."},{"id":"U4-P29","set":"P10","topic":"4.4","lo":"E","skill":"5.A","difficulty":"medium","stem":"The Qing policy reflected in the passage was most similar to","options":{"A":"the Mughal emperor Akbar's welcoming of scholars from many faiths","B":"Spain's use of Catholic missionaries to convert the Indigenous peoples of the Americas","C":"the Kongo king's adoption of Christianity as the royal religion","D":"the Tokugawa shogunate's ban on Christianity and limits on contact with Europeans"},"answer":"D","explanation":"Both the Qing and the Tokugawa saw Christianity as a threat and limited European influence in their lands.","whyNot":{"A":"Akbar welcomed discussion among people of different faiths. This Qing passage restricts Christianity.","B":"Spain spread Christianity; the Qing tried to stop it.","C":"Kongo's king adopted Christianity; the Qing rejected it."},"hint":"Which other Asian state restricted Christians and Europeans?","reasoning":"Comparison"},{"id":"U4-P30","set":"P10","topic":"4.7","lo":"M","skill":"4.B","difficulty":"hard","stem":"The edict's support for \"the teaching of the learned\" (Confucianism) reflects the Qing emperors' effort to","options":{"A":"replace Confucianism with Buddhism as the main belief of the empire","B":"present themselves, as Manchu rulers, as protectors of Confucian tradition","C":"adopt European science and mathematics in place of traditional Chinese learning","D":"convince Manchu nobles to give up their own culture"},"answer":"B","explanation":"Qing rulers were Manchus from northeast Asia. Most of their subjects were Han Chinese. Supporting Confucian traditions helped the Qing claim the right to rule China.","whyNot":{"A":"The edict lists Buddhism among other teachings but praises the \"teaching of the learned\" (Confucianism).","C":"The edict uses missionaries for math but rejects their teaching.","D":"The Qing kept Manchu privileges and identity while supporting Confucian ideas."},"hint":"The Qing emperors were not Han Chinese. Why would they defend Chinese traditions?"},{"id":"U4-P31","set":"P11","topic":"4.6","lo":"L","skill":"3.A","difficulty":"easy","stem":"Hackett's main argument is that the Pueblo Revolt was caused primarily by","options":{"A":"a drought that forced the Pueblo people to move south","B":"Spanish efforts to suppress Pueblo religion and customs","C":"Pueblo anger over the arrival of English settlers","D":"competition between Pueblo towns over trade with Spain"},"answer":"B","explanation":"Hackett says the Spanish tried to wipe out Pueblo religion and customs, even punishing religious leaders like Popé. That anger led to the revolt.","whyNot":{"A":"Hackett does not mention drought in this passage.","C":"The colonists in New Mexico were Spanish, not English.","D":"Hackett describes Pueblo towns uniting, not competing."},"hint":"What were the Spanish trying to stop the Pueblo from doing?","reasoning":"Causation"},{"id":"U4-P32","set":"P11","topic":"4.6","lo":"L","skill":"5.A","difficulty":"easy","stem":"The Pueblo Revolt was most similar to which of the following?","options":{"A":"the Spanish conquest of the Mexica with Tlaxcalan allies","B":"the Japanese government's expulsion of Portuguese merchants","C":"Akbar's alliances with Hindu Rajput nobles in Mughal India","D":"Metacom's War against English colonists in New England"},"answer":"D","explanation":"Both were uprisings by Indigenous peoples against European colonists who threatened their land, religion, and way of life.","whyNot":{"A":"The conquest of the Mexica was a colonial conquest, not resistance to it.","B":"Japan's expulsion was a strong state's policy, not an uprising against colonists.","C":"Akbar's alliances brought groups into his empire; they were not a revolt."},"hint":"Look for another Indigenous uprising against colonists.","reasoning":"Comparison"},{"id":"U4-P33","set":"P11","topic":"4.6","lo":"L","skill":"2.C","difficulty":"medium","stem":"A historian studying the Pueblo Revolt would most likely point out which limitation of the passage?","options":{"A":"Hackett was a Pueblo religious leader who had a personal reason to exaggerate.","B":"Hackett wrote his account many years before the Pueblo Revolt took place.","C":"Hackett relied on Spanish colonial records that may leave out or distort Pueblo views.","D":"Hackett based his account only on Pueblo oral stories that were told centuries later."},"answer":"C","explanation":"Hackett used records made by Spanish officials. Some include Pueblo testimony, but Spanish questioning and translation could shape what was written. Pueblo views may be missing or twisted.","whyNot":{"A":"Hackett was an American historian, not a Pueblo leader.","B":"Hackett wrote in 1911, long after the revolt of 1680.","D":"The attribution says Hackett used Spanish colonial records."},"hint":"Check the attribution. Whose records did Hackett read?"},{"id":"U4-P34","set":"P12","topic":"4.7","lo":"M","skill":"3.A","difficulty":"easy","stem":"Busbecq claims that the Ottoman Empire's success came from","options":{"A":"giving the highest offices to members of old noble families","B":"promoting officials based on ability rather than family background","C":"relying on European advisers to run the government","D":"allowing officials to buy their positions from the sultan"},"answer":"B","explanation":"Busbecq says Ottoman officials rose by merit, not birth, and that \"this is the reason that they are successful.\"","whyNot":{"A":"Busbecq says the opposite: \"No distinction is attached to birth among the Turks.\"","C":"Busbecq does not mention European advisers.","D":"He says the sultan ignores wealth when he appoints officials."},"hint":"Find the sentence that starts \"This is the reason.\""},{"id":"U4-P35","set":"P12","topic":"4.7","lo":"M","skill":"1.B","difficulty":"medium","stem":"The system Busbecq describes was based in part on the devshirme, which","options":{"A":"gave land and high office only to the sons of old Turkish noble families","B":"let Christian nobles in the Balkans keep their lands in exchange for taxes","C":"chose officials through written exams on Islamic law and the Quran","D":"took Christian boys from the Balkans and trained them to serve the sultan"},"answer":"D","explanation":"Through the devshirme, the Ottomans took boys from Christian families in the Balkans. The boys became Muslims and trained as soldiers (Janissaries) and officials. They owed everything to the sultan, not to a noble family.","whyNot":{"A":"The devshirme drew from Christian village families, not Turkish nobles.","B":"The devshirme took boys for the sultan's service; it was not a tax deal with nobles.","C":"The devshirme did not work through written exams."},"hint":"Where did the Ottomans get the boys who became Janissaries?"},{"id":"U4-P36","set":"P12","topic":"4.7","lo":"M","skill":"2.B","difficulty":"hard","stem":"Busbecq's comparison in the second paragraph was most likely meant to","options":{"A":"persuade the sultan to adopt the European way of choosing officials by noble birth","B":"criticize European societies in which birth, not ability, decided who held power","C":"convince Habsburg rulers to give the Ottomans more territory","D":"praise European nobles for their loyalty to their kings"},"answer":"B","explanation":"Busbecq was a European diplomat writing a private letter. He contrasts Ottoman promotion by merit with what he describes as Europe's focus on noble birth. The comparison criticizes European leaders.","whyNot":{"A":"Busbecq praises the Ottoman system over Europe's, not the reverse.","C":"He is admiring Ottoman methods, not asking for land to be given up.","D":"He says Europe gives \"no opening\" for merit, which is a criticism."},"hint":"Is Busbecq praising or criticizing \"us\" (Europeans)?"},{"id":"U4-P37","set":"P13","topic":"4.7","lo":"M","skill":"3.A","difficulty":"easy","stem":"According to the passage, Akbar removed the jizya mainly because","options":{"A":"Muslim religious scholars at court demanded that the tax be ended","B":"non-Muslims now served the empire loyally and the treasury was already rich","C":"Hindu Rajput armies had defeated the Mughals and forced him to end it","D":"the tax was too hard to collect in the empire's far-off provinces"},"answer":"B","explanation":"Abu'l-Fazl gives two reasons: people of other religions now served the empire loyally, and the treasury had plenty of money.","whyNot":{"A":"The passage says the decree was issued in spite of disapproval, not because of a demand.","C":"The passage presents the decree as a gift, not a forced surrender.","D":"The passage does not mention problems collecting the tax."},"hint":"Look for \"At the present day\" and \"Moreover.\" Each starts a reason."},{"id":"U4-P38","set":"P13","topic":"4.7","lo":"M","skill":"5.A","difficulty":"medium","stem":"Akbar's policy toward non-Muslims was most similar to which of the following?","options":{"A":"Spain's expulsion of its Jewish subjects in 1492 and later of Muslim converts","B":"the Tokugawa shogunate's persecution of Japanese Christians","C":"the Ottoman Empire's acceptance of Jews expelled from Spain and Portugal","D":"Qing China's restrictions on Christian missionaries"},"answer":"C","explanation":"Both Akbar and the Ottoman sultans made room for people of other religions to strengthen their empires. The Ottomans welcomed Jews who were forced out of Spain and Portugal.","whyNot":{"A":"Spain pushed out religious minorities; Akbar included them.","B":"The Tokugawa persecuted a religious minority; Akbar welcomed his.","D":"The Qing restricted a foreign religion; Akbar welcomed other faiths."},"hint":"Find another empire that welcomed a religious minority.","reasoning":"Comparison"},{"id":"U4-P39","set":"P13","topic":"4.6","lo":"L","skill":"5.B","difficulty":"hard","stem":"Emperor Aurangzeb later brought back the jizya in 1679. This reversal most directly contributed to","options":{"A":"the rapid conversion of most of India's Hindus to Islam","B":"a long era of peace and unity across the Mughal Empire","C":"a successful Mughal conquest of the neighboring Safavid Empire in Persia","D":"greater resentment among many non-Muslim subjects of Mughal rule"},"answer":"D","explanation":"The tax was a separate burden on non-Muslim subjects. It added to anger toward Aurangzeb's rule. Maratha resistance had begun earlier and was also about land and political power.","whyNot":{"A":"Most Hindus did not convert; Hindus remained the majority in India.","B":"Aurangzeb's reign was full of wars and revolts.","C":"The Mughals did not conquer Safavid Persia."},"hint":"How might people react to a tax charged to members of certain religions?","reasoning":"Causation"},{"id":"U4-P40","set":"P14","topic":"4.8","lo":"N","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes a similarity between the two sources?","options":{"A":"Both say the voyages helped Indigenous peoples more than they helped Europe.","B":"Both say the voyages had little lasting effect on the economies of Europe.","C":"Both say Europeans used force against the peoples of the Americas and Asia.","D":"Both say the natives' misfortunes happened mainly by accident."},"answer":"C","explanation":"Smith says Europeans used their \"superiority of force\" to commit injustice. Marx lists enslavement, looting, and conquest. Both agree force was used.","whyNot":{"A":"Smith says the natives suffered \"dreadful misfortunes,\" and Marx describes enslavement and looting.","B":"Both writers describe major effects; Marx says they began capitalism.","D":"Both writers describe deliberate uses of force. Smith treats Europe's greater power at that time as a chance circumstance of history."},"hint":"Find what each writer says happened to the native peoples.","reasoning":"Comparison"},{"id":"U4-P41","set":"P14","topic":"4.8","lo":"N","skill":"3.C","difficulty":"hard","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Smith blames a temporary imbalance of power; Marx sees force as built into capitalism's rise.","B":"Smith praises the mercantile system; Marx praises free trade among nations.","C":"Smith says the voyages hurt Europe; Marx says they mostly helped the natives.","D":"Smith writes mainly about the Americas, while Marx focuses mostly on events in Asia and Africa."},"answer":"A","explanation":"Smith says trade can bring benefits. He blames European abuses on Europe's greater military power at that time. Marx describes force and plunder as central to capitalism's growth.","whyNot":{"B":"Neither excerpt makes this claim. Smith does not defend mercantilism here, and Marx describes how colonial force helped capitalism grow.","C":"Neither writer says the voyages mostly helped the natives.","D":"Smith mentions both the East and West Indies, and Marx mentions America too."},"hint":"Compare what each writer says about the role of force in overseas trade.","reasoning":"Comparison"},{"id":"U4-P42","set":"P14","topic":"4.5","lo":"I","skill":"3.D","difficulty":"medium","stem":"Which of the following developments from 1450 to 1750 would Marx most likely use as evidence for his argument?","options":{"A":"the Mughal emperor Akbar's decision to remove the jizya tax","B":"the Tokugawa ban on Japanese ships sailing to foreign lands","C":"the spread of the potato from the Andes as a new food crop across northern Europe","D":"forced labor in silver mines and on sugar plantations producing for Europe"},"answer":"D","explanation":"Marx argues that capitalism began with force: enslavement and forced labor in mines and on plantations. Silver and sugar produced by forced labor fit his argument.","whyNot":{"A":"Akbar's tax policy is about religion and loyalty, not plunder that built capitalism.","B":"Japan limiting trade does not show Europeans gaining wealth by force.","C":"The potato's spread was a benefit of exchange, not an example of force."},"hint":"Marx talks about \"enslavement and entombment in mines.\" What fits that?"},{"id":"U4-P43","set":"P15","topic":"4.1","lo":"A","skill":"1.B","difficulty":"easy","stem":"The large ship on the left side of the screen is best understood as evidence of","options":{"A":"Japanese shipbuilding methods that European sailors later copied for their own ocean voyages","B":"oared galleys that let European crews travel without depending on the winds","C":"European ship designs, like the carrack, built to carry big cargoes across oceans","D":"Chinese treasure ships that carried the Portuguese merchants to Japan"},"answer":"C","explanation":"Carracks carried large cargoes on long sea voyages. They helped Europeans sail directly to Asia around Africa. Europe and Asia had been linked by trade long before these voyages.","whyNot":{"A":"The ship is the Portuguese ship, painted by a Japanese artist; Europeans did not copy Japanese designs.","B":"The ship has tall masts and sails; it is not an oared galley.","D":"The caption says it is a Portuguese carrack, not a Chinese ship."},"hint":"Read the caption. What kind of ship is it?"},{"id":"U4-P44","set":"P15","topic":"4.5","lo":"K","skill":"1.B","difficulty":"easy","stem":"The priests shown greeting the merchants best illustrate which development in the period 1450–1750?","options":{"A":"Catholic missionaries traveling with European traders to spread Christianity","B":"Buddhist monks from Japan traveling to Europe to spread their teachings","C":"the Japanese government's success in keeping all foreigners out of Japan","D":"Protestant merchants refusing to let Catholic priests board their ships"},"answer":"A","explanation":"European ships carried missionaries along with merchants. Jesuits and other Catholic priests converted many people in Japan in the late 1500s.","whyNot":{"B":"The priests in the scene are Catholic Jesuits and friars, not Buddhist monks.","C":"The screen shows foreigners arriving and being greeted, not kept out.","D":"The priests are greeting Portuguese (Catholic) merchants, not being refused."},"hint":"Who are the people in black and gray robes?"},{"id":"U4-P45","set":"P15","topic":"4.4","lo":"E","skill":"5.B","difficulty":"medium","stem":"The kind of contact shown in the screen changed in the 1630s when the Tokugawa shogunate","options":{"A":"invited Spanish settlers to build a large colony around the port of Nagasaki","B":"made Catholic Christianity the official religion of all Japan","C":"expelled the Portuguese and tightened limits on Christians and foreign trade","D":"sent Japanese fleets to capture the Portuguese ports in India"},"answer":"C","explanation":"Christianity had been banned since 1614, and the Tokugawa enforced the ban harshly in the 1630s. Portuguese merchants were expelled in 1639. From 1641, Dutch and Chinese merchants traded at Nagasaki under strict rules, and Japan kept some regional trade, such as with Korea.","whyNot":{"A":"The Tokugawa did not invite Spanish colonists; they expelled the Spanish in 1624.","B":"The Tokugawa banned and persecuted Christianity.","D":"Japan banned its own ships from sailing abroad."},"hint":"Think about the Tokugawa rules about Christians and foreign ships.","reasoning":"Continuity and Change"},{"id":"U4-P46","set":"P16","topic":"4.4","lo":"G","skill":"5.B","difficulty":"medium","stem":"The overall increase shown in the chart from the 1600s to the 1700s was most directly caused by","options":{"A":"the growth of factories in mainland North America that needed workers","B":"the growth of sugar and other cash-crop plantations in Brazil and the Caribbean","C":"a decline in Africa's population caused by diseases from the Americas","D":"new Spanish laws requiring colonists to use enslaved Africans in their silver mines"},"answer":"B","explanation":"Sugar, tobacco, coffee, and other cash crops grew on huge plantations. Planters in Brazil and the Caribbean bought more and more enslaved Africans to do the work.","whyNot":{"A":"Factories were not a major reason; enslaved people were sent mostly to plantations.","C":"This option places the disease deaths in Africa. Disease among Indigenous Americans was a different factor, and it raised colonists' demand for enslaved workers.","D":"The chart shows fewer arrivals from Africa in the Spanish Americas in the 1700s, and the mines relied mostly on Indigenous workers."},"hint":"Which regions grew the most? What crop were they famous for?","reasoning":"Causation"},{"id":"U4-P47","set":"P16","topic":"4.4","lo":"G","skill":"3.B","difficulty":"easy","stem":"Which of the following claims is best supported by the chart?","options":{"A":"Mainland North America received more enslaved Africans than any other region.","B":"The number of enslaved Africans arriving rose in every region from the 1600s to the 1700s.","C":"The Spanish Americas received the most enslaved Africans in both centuries.","D":"Brazil and the Caribbean received far more enslaved Africans than mainland North America."},"answer":"D","explanation":"Brazil and the Caribbean received millions of enslaved Africans. Mainland North America received far fewer.","whyNot":{"A":"Mainland North America had the smallest numbers in the 1600s and was far behind Brazil and the British Caribbean in the 1700s.","B":"Direct arrivals from Africa to the Spanish Americas fell from about 226,000 to 146,000.","C":"Brazil received the most in both centuries."},"hint":"Compare the tallest bars with the bars for mainland North America."},{"id":"U4-P48","set":"P16","topic":"4.5","lo":"J","skill":"5.B","difficulty":"hard","stem":"The trade shown in the chart most directly affected societies in West and Central Africa by","options":{"A":"ending slavery inside Africa, since European traders shipped the captives abroad","B":"leading most African states to stop trading with Europeans","C":"spreading Christianity across most of West Africa by 1750","D":"leaving some communities with more women than men, since more men were taken"},"answer":"D","explanation":"European traders bought more enslaved men than women. Many African communities were left with more women than men, which changed families and work.","whyNot":{"A":"Slavery inside Africa continued; not all captives were sold abroad.","B":"Many African states kept trading with Europeans throughout this period.","C":"Christianity spread in a few places like Kongo, not across most of West Africa."},"hint":"Were men and women taken in equal numbers?","reasoning":"Causation"}],"exam":{"title":"Unit 4 Practice Exam: Transoceanic Interconnections","timeMinutes":25,"questionCount":25,"directions":"Each set of questions refers to a source: a primary source, a historian's writing, an image, or data. For each question, choose the best answer. Use the source and your knowledge of world history from c. 1450 to c. 1750. There is no penalty for guessing. Some sources use historical labels or insulting descriptions of other peoples and religions; these words show the writers' views.","questions":[{"id":"U4-E01","set":"X1","topic":"4.2","lo":"B","skill":"2.B","difficulty":"medium","stem":"Zurara's purpose in describing Prince Henry's reasons was most likely to","options":{"A":"persuade other European rulers to join Portugal in a crusade against the Ottoman Empire","B":"present Prince Henry's voyages as both religiously and financially worthwhile to Portugal","C":"warn Portuguese merchants about the dangers of sailing beyond Cape Bojador","D":"criticize the Portuguese crown for spending too much on voyages of exploration"},"answer":"B","rationales":{"A":"Incorrect. The passage never asks other rulers for help, and the Ottomans are not mentioned. Henry complains that no Christian ruler helped him, but that is not a plea for a crusade.","B":"Correct. Zurara was the royal chronicler. He lists trade profits and spreading the faith as Henry's goals, which makes the voyages look noble and useful.","C":"Incorrect. Zurara presents sailing past Cape Bojador as a goal worth reaching, not as a warning.","D":"Incorrect. A royal chronicler praising a prince is not criticizing royal spending."},"explanation":"Zurara worked for the Portuguese crown. He makes the voyages sound good for God and for Portugal's money: new trade, new allies, and new converts."},{"id":"U4-E02","set":"X1","topic":"4.1","lo":"A","skill":"4.A","difficulty":"easy","stem":"The voyages that Prince Henry sponsored were made possible in part by Portuguese use of","options":{"A":"large oared galleys like those used in Mediterranean sea battles","B":"lateen sails and compasses adopted through contact with other regions","C":"treasure ships copied from the fleets of the Ming admiral Zheng He","D":"detailed coastal maps bought from the rulers of the Mali Empire"},"answer":"B","rationales":{"A":"Incorrect. Oared galleys worked in the calm Mediterranean but could not make long ocean voyages. The Portuguese used sailing ships such as the caravel.","B":"Correct. The lateen sail and the magnetic compass came to Europeans through contact with the Islamic world and Asia. Together with new ship designs like the caravel, they made long ocean voyages possible.","C":"Incorrect. Zheng He's voyages ended in the 1430s, and the Portuguese did not copy his giant treasure ships.","D":"Incorrect. There is no evidence that these voyages depended on coastal maps bought from Mali's rulers."},"explanation":"Portuguese sailors used tools from other cultures. The lateen sail came from the Indian Ocean and Mediterranean world. The compass came from China. Muslim scholars improved star charts and astrolabes."},{"id":"U4-E03","set":"X1","topic":"4.2","lo":"C","skill":"5.B","difficulty":"medium","stem":"The second reason described in the passage most directly contributed to which of the following developments in the period 1450–1750?","options":{"A":"The Portuguese conquest of large inland territories in West Africa by the early 1500s","B":"The end of Muslim merchants' role in Indian Ocean trade after the Portuguese arrived","C":"The building of a Portuguese trading-post empire along the coasts of Africa and Asia","D":"A decision by Portuguese kings to forbid trade with non-Christian peoples"},"answer":"C","rationales":{"A":"Incorrect. Portugal mostly held coastal forts and ports in Africa; it did not conquer large inland West African states in the early 1500s.","B":"Incorrect. Muslim, Gujarati, and other Asian merchants kept trading in the Indian Ocean after the Portuguese arrived.","C":"Correct. Hoping for trade profits, Portugal built forts and trading posts instead of conquering large inland areas. Examples are Elmina in West Africa and Goa and Malacca in Asia.","D":"Incorrect. Portugal traded with many non-Christian peoples in Africa and Asia; profit was one of its main goals."},"explanation":"The second reason is about trade and profit. That goal led the Portuguese to set up a chain of trading posts and forts along the coasts of Africa and Asia: a trading-post empire.","reasoning":"Causation"},{"id":"U4-E04","set":"X2","topic":"4.3","lo":"D","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Source 1 blames the decline on European diseases, while Source 2 blames it mainly on Spanish greed.","B":"Source 1 says Hispaniola had few people before 1492, while Source 2 says the islands were very crowded.","C":"Source 1 praises the encomienda for spreading Christianity, while Source 2 calls the system cruel.","D":"Source 1 blames the decline on Spanish greed and forced labor, while Source 2 also stresses disease."},"answer":"D","rationales":{"A":"Incorrect. This reverses the excerpts. Las Casas does not mention disease in this excerpt; Bourne does.","B":"Incorrect. Las Casas says Hispaniola once had three million people (his own estimate), so he describes a crowded island, not an empty one.","C":"Incorrect. Las Casas says the duty to teach Christianity was only a pretense, so he does not praise the encomienda.","D":"Correct. Las Casas blames greed for gold and deadly work in mines and fields. Bourne agrees there was cruelty but argues that new diseases, such as smallpox, were another major cause."},"explanation":"Las Casas (Source 1) blames Spanish greed and forced labor. Bourne (Source 2) agrees there was cruelty but argues that new diseases, like smallpox, were another major cause.","reasoning":"Comparison"},{"id":"U4-E05","set":"X2","topic":"4.4","lo":"F","skill":"1.B","difficulty":"easy","stem":"The labor system described in the third paragraph of Source 1 is best understood as an example of","options":{"A":"indentured servitude, in which European migrants worked for years in exchange for their passage","B":"chattel slavery, in which enslaved people were treated as property that could be bought and sold","C":"the hacienda system, in which large private estates produced crops or livestock using several kinds of labor","D":"the encomienda system, which granted colonists Indigenous labor or tribute in return for Christian teaching"},"answer":"D","rationales":{"A":"Incorrect. Indentured servants were mostly Europeans who agreed to work for a set time; the passage describes Indigenous people forced to work.","B":"Incorrect. Encomienda granted claims to tribute or labor. It did not legally make colonists the owners of those people, though workers were often badly abused.","C":"Incorrect. A hacienda was a large estate. This passage is about grants of Indigenous labor to colonists.","D":"Correct. Las Casas describes Indigenous people being \"divided\" among Spaniards on the condition that they be taught the Catholic religion. That is the encomienda system."},"explanation":"Under encomienda, colonists received the right to collect tribute or labor from Indigenous communities. In return they were supposed to protect them and teach them Christianity. Las Casas describes how colonists abused this system."},{"id":"U4-E06","set":"X2","topic":"4.4","lo":"E","skill":"2.B","difficulty":"hard","stem":"The 1689 English edition of Source 1 was most likely published in order to","options":{"A":"support English Protestant claims that Catholic Spain was especially cruel","B":"encourage English colonists to copy Spanish ways of governing Indigenous peoples","C":"persuade the Spanish king to pass new laws protecting Indigenous people","D":"recruit English missionaries to convert the Indigenous people of the Caribbean"},"answer":"A","rationales":{"A":"Correct. The title uses \"Popery,\" an insult for Catholicism. England and Spain were Protestant and Catholic rivals, so publishers used Las Casas's book to make Catholic Spain look cruel.","B":"Incorrect. The book shows Spanish rule as destructive, so it would not encourage the English to copy it.","C":"Incorrect. Las Casas wrote to the Spanish king in 1542. This English edition came out in London more than 100 years later, for English readers.","D":"Incorrect. Nothing in the edition's title or purpose is about recruiting missionaries."},"explanation":"The English title calls the book proof of \"Popery,\" an insult for the Catholic Church. This wording points to an English Protestant purpose: using Spanish violence as evidence against Catholic rule."},{"id":"U4-E07","set":"X2","topic":"4.3","lo":"D","skill":"3.D","difficulty":"hard","stem":"Which of the following, if true, would best support the argument in the second paragraph of Source 2?","options":{"A":"Spanish colonists in the Caribbean brought in enslaved Africans to replace their Indigenous workers.","B":"Spanish missionaries baptized hundreds of thousands of Indigenous people in the 1500s.","C":"Indigenous populations also fell sharply in regions where Spaniards had little direct control.","D":"Spanish laws such as the New Laws of 1542 tried to limit the encomienda system."},"answer":"C","rationales":{"A":"Incorrect. This shows a result of the population decline, not its cause.","B":"Incorrect. Baptisms say nothing about why the population fell.","C":"Correct. If people died even where few Spaniards were present, disease is a likely cause, because infections could spread beyond Spanish rule. This supports Bourne's argument that disease was a major cause.","D":"Incorrect. Laws against abuse would show official policy, but they would not show why the population declined."},"explanation":"Bourne argues that disease was a major cause of the decline. Evidence that people died even in places with few Spaniards would support him, because disease can spread without soldiers or masters present.","reasoning":"Causation"},{"id":"U4-E08","set":"X3","topic":"4.5","lo":"I","skill":"5.B","difficulty":"medium","stem":"The increase shown in the chart between 1541 and 1600 was most directly caused by","options":{"A":"the Spanish conquest of gold-producing kingdoms along the coast of West Africa","B":"a rise in Chinese silver exports to Spain by way of Manila","C":"new Spanish laws that finally ended the smuggling of treasure throughout the Caribbean islands","D":"the opening of huge silver mines, such as Potosí, worked largely by Indigenous people"},"answer":"D","rationales":{"A":"Incorrect. Spain did not conquer West African gold kingdoms; its treasure came from the Americas.","B":"Incorrect. Silver flowed the other way: from the Americas to China, because China had high demand for it.","C":"Incorrect. Spain never ended smuggling, and stopping smuggling would not create this much new treasure.","D":"Correct. Potosí (opened 1545) and Mexican mines such as Zacatecas (1546) produced huge amounts of silver. Potosí relied on forced Indigenous labor through the mita; Mexican mines used paid, forced, and enslaved workers."},"explanation":"Silver output grew as mining expanded at Potosí in the Andes and Zacatecas in Mexico after the 1540s. Potosí used drafted workers as well as paid workers. Wage labor was especially important at Zacatecas.","reasoning":"Causation"},{"id":"U4-E09","set":"X3","topic":"4.5","lo":"I","skill":"5.B","difficulty":"medium","stem":"Much of the silver represented in the chart eventually ended up in which of the following places?","options":{"A":"West Africa, where Spanish merchants traded it for gold and ivory","B":"The Ottoman Empire, which collected it as tribute from Spain's rulers","C":"The Americas, where it was sent back to pay Indigenous miners' wages","D":"China, where the Ming state collected taxes in silver"},"answer":"D","rationales":{"A":"Incorrect. Spain did not trade silver to West Africa for gold; West African gold had flowed north for centuries.","B":"Incorrect. Spain's rulers did not pay tribute to the Ottomans; they were rivals.","C":"Incorrect. Miners were paid, if at all, in the Americas. Spain did not ship silver back across the Atlantic to pay them.","D":"Correct. China's huge economy wanted silver, partly because the Ming government required taxes to be paid in silver. Europeans used American silver to buy Chinese silk and porcelain."},"explanation":"American silver went around the world. A large share ended up in China, which had a giant economy and demanded silver for taxes and trade. Europeans used it to buy Chinese goods."},{"id":"U4-E10","set":"X3","topic":"4.5","lo":"I","skill":"2.C","difficulty":"easy","stem":"Which of the following is a limitation of the chart for measuring how much American gold and silver reached Europe?","options":{"A":"It counts only registered treasure, so gold and silver that was smuggled is left out.","B":"It shows only gold, so the much larger flow of silver is left out of the totals.","C":"It begins only after the Spanish conquest of the Inca Empire had been completed.","D":"It measures all of the treasure in British pounds sterling instead of in Spanish silver pesos."},"answer":"A","rationales":{"A":"Correct. The title says the chart shows registered imports: treasure that was officially recorded and taxed. Smuggling was common, so the real amount was larger.","B":"Incorrect. The chart covers both gold and silver.","C":"Incorrect. The chart starts in 1503, decades before the conquest of the Inca Empire (1530s).","D":"Incorrect. The chart measures the treasure in pesos, not British pounds."},"explanation":"The chart only counts treasure that was officially recorded. Lots of silver was smuggled to avoid taxes, so the chart shows less than what really arrived."},{"id":"U4-E11","set":"X4","topic":"4.4","lo":"E","skill":"4.A","difficulty":"medium","stem":"The ordinance was most likely issued in response to","options":{"A":"the arrival of British warships demanding that Japan open its ports to trade","B":"a Ming Chinese invasion of Japan launched from the Korean peninsula","C":"the spread of Christianity, which Tokugawa rulers saw as a threat to their power","D":"a decline in Japanese silver mining that forced Japan to stop trading"},"answer":"C","rationales":{"A":"Incorrect. British warships forcing Asian ports open happened in the 1800s, not the 1630s.","B":"Incorrect. Ming China did not invade Japan in this period.","C":"Correct. Portuguese and Spanish missionaries had converted many Japanese. The Tokugawa feared Christians might be loyal to foreigners, so the ordinance rewards people who report Christians and missionaries.","D":"Incorrect. Japan was a major silver producer in this period, and it kept trading with the Dutch and Chinese."},"explanation":"The ordinance restricts overseas travel and punishes Christian activity. The Tokugawa saw Christianity, brought by European missionaries, as a danger to their control."},{"id":"U4-E12","set":"X4","topic":"4.4","lo":"E","skill":"5.A","difficulty":"medium","stem":"The policy described in the passage was most similar to which of the following?","options":{"A":"The Spanish crown's use of the encomienda system in the Caribbean","B":"The Portuguese crown's support for Christian missionaries in Africa and Asia","C":"The Ottoman use of Christian boys from the Balkans as soldiers and officials","D":"Ming China's bans on private overseas trade and limits on foreign contact"},"answer":"D","rationales":{"A":"Incorrect. The encomienda forced Indigenous people to work for Spanish colonists; it did not limit contact with foreigners.","B":"Incorrect. Portugal spread Christianity; the ordinance tries to stop it.","C":"Incorrect. The devshirme used people of other backgrounds in government; it was not a policy of shutting out foreign influence.","D":"Correct. Like the Tokugawa, Ming China tried to control contact with outsiders by banning private sea trade."},"explanation":"Both Tokugawa Japan and Ming China tried to protect their power by tightly controlling contact and trade with outsiders.","reasoning":"Comparison"},{"id":"U4-E13","set":"X4","topic":"4.4","lo":"E","skill":"1.B","difficulty":"medium","stem":"Despite policies like the one in the passage, Japan after 1640 continued to","options":{"A":"allow Portuguese Jesuits to open schools in Japan's major cities","B":"trade on a limited scale with Dutch and Chinese merchants at Nagasaki","C":"send Japanese merchant ships to trade throughout Southeast Asia","D":"depend on silver from Spanish America to pay its samurai officials"},"answer":"B","rationales":{"A":"Incorrect. The Portuguese were expelled in 1639, and Jesuits were banned.","B":"Correct. Japan did not cut off all trade. Dutch merchants traded from the small island of Dejima at Nagasaki, and Chinese merchants also traded there under strict control.","C":"Incorrect. The ordinance banned Japanese ships from going abroad.","D":"Incorrect. Japan produced plenty of its own silver; it did not depend on American silver."},"explanation":"Japan's \"closed country\" policy was really controlled trade. The Dutch and Chinese could still trade at Nagasaki, but only under tight rules.","reasoning":"Continuity and Change"},{"id":"U4-E14","set":"X5","topic":"4.7","lo":"M","skill":"1.B","difficulty":"easy","stem":"The painting most directly reflects which of the following developments in the Spanish Americas?","options":{"A":"The end of social differences between Spaniards and Indigenous people after the conquest","B":"The arrival of Asian immigrants who became the colony's wealthiest elite","C":"Social categories based on a person's mix of Spanish, Indigenous, and African ancestry","D":"A law that only people born in Spain could marry or own land in the colonies"},"answer":"C","rationales":{"A":"Incorrect. The painting shows differences between groups, not the end of them.","B":"Incorrect. The painting is about Spanish, Indigenous, and African ancestry; Asian immigrants were not the colony's elite.","C":"Correct. Each panel labels a family by its mix of Spanish, Indigenous, and African ancestry. This shows the casta system that grew in Spanish America.","D":"Incorrect. Colonial law did not limit marriage or landholding to people born in Spain, and a painted family group does not show a law."},"explanation":"Every panel names a family's mix of Spanish, Indigenous, and African ancestry. This is the casta system, a set of social categories that grew out of mixing in Spanish America."},{"id":"U4-E15","set":"X5","topic":"4.7","lo":"M","skill":"2.B","difficulty":"hard","stem":"Paintings such as this one were most likely made in order to","options":{"A":"show colonial society as an orderly ranking that favored people classified as Spanish","B":"protest the cruel treatment of enslaved Africans on the sugar plantations of the Caribbean","C":"record the religious ceremonies of Indigenous peoples before the conquest","D":"encourage Spanish settlers in the colonies to move back to Spain"},"answer":"A","rationales":{"A":"Correct. The top rows show richly dressed families, and the lower rows show plainer, working families. The painting presents a neat ranking with people classified as Spanish on top. These were social labels, and real life was messier than the paintings show.","B":"Incorrect. The painting shows family groups and labels, not plantation work or a protest.","C":"Incorrect. It shows colonial families, not religious ceremonies from before the conquest.","D":"Incorrect. Nothing in the painting encourages anyone to leave the colonies."},"explanation":"The painting presents colonial society as an ordered ranking. People classified as Spanish get the favored places. These were social labels, not fixed groups, and real lives were more complex than the painting suggests."},{"id":"U4-E16","set":"X5","topic":"4.7","lo":"M","skill":"5.A","difficulty":"hard","stem":"The social hierarchy shown in the painting was most similar to which of the following in the period 1450–1750?","options":{"A":"Qing China's rules that favored Manchus over the Han Chinese majority","B":"The Mughal emperor Akbar's decision to end the jizya tax on non-Muslims","C":"The Ottoman practice of promoting officials based on their skill and merit","D":"The Tokugawa shogunate's ban on Japanese people traveling abroad"},"answer":"A","rationales":{"A":"Correct. The Qing gave the Manchu minority special privileges over the Han majority. Like the casta system, people's place in society depended partly on which group they were born into.","B":"Incorrect. Akbar's policy reduced differences between religious groups instead of ranking them.","C":"Incorrect. Promotion by merit is the opposite of ranking people by ancestry.","D":"Incorrect. A travel ban does not rank people into social groups by birth."},"explanation":"Both systems ranked people partly by the group they were born into. Spaniards were on top in New Spain. Manchus were on top in Qing China.","reasoning":"Comparison"},{"id":"U4-E17","set":"X6","topic":"4.5","lo":"H","skill":"3.A","difficulty":"easy","stem":"Which of the following best describes Haring's argument?","options":{"A":"Spain's monopoly worked because the yearly fleets kept silver safe from pirates and rivals.","B":"Spain's own factories supplied most of the goods that colonists in the Americas bought.","C":"Spanish colonists strongly supported the monopoly because it kept the prices of imported goods low.","D":"Spain's strict trade monopoly failed as foreign goods and smugglers took over its colonial trade."},"answer":"D","rationales":{"A":"Incorrect. Haring calls the system a failure, not a success.","B":"Incorrect. Haring says the opposite: Spanish industry was ruined, and foreign goods made up five-sixths of the fleets' cargoes.","C":"Incorrect. Haring says colonists welcomed smugglers because they sold goods at reasonable prices, which suggests the monopoly kept prices high.","D":"Correct. Haring says foreign goods made up five-sixths of the fleets' cargoes and smugglers sold directly to colonists, so Spain's rivals got the trade."},"explanation":"Haring argues that Spain's tight control backfired. Spain could not make enough goods, so foreign goods filled its fleets and smugglers sold to colonists. Spain's rivals ended up with the trade."},{"id":"U4-E18","set":"X6","topic":"4.5","lo":"H","skill":"1.B","difficulty":"easy","stem":"The \"rigid and complicated commercial system\" described in the third paragraph is best understood as an example of","options":{"A":"mercantilist policies used by European states to control colonial trade","B":"free-trade policies that let merchants of all nations use Spanish ports freely","C":"the tribute system that Ming China used to manage its foreign trade","D":"the trading-post empire that the Portuguese built along Asian coasts"},"answer":"A","rationales":{"A":"Correct. Mercantilism meant a state tried to control trade with its colonies to gain gold and silver and keep rivals out. Spain's monopoly through Seville is a clear example.","B":"Incorrect. Spain's system was the opposite of free trade; it tried to shut foreigners out.","C":"Incorrect. The tribute system was China's way of managing foreign relations, not Spain's.","D":"Incorrect. The passage is about Spain's control of trade with the Americas, not Portuguese posts in Asia."},"explanation":"Spain tried to control colonial trade through approved ports and official fleets. Using trade rules to build the state's wealth was part of mercantilism."},{"id":"U4-E19","set":"X6","topic":"4.5","lo":"H","skill":"3.D","difficulty":"hard","stem":"Which of the following additional findings would most directly qualify Haring's conclusion that Spain's commercial system failed?","options":{"A":"Colonists often paid lower prices for smuggled goods than for legally imported goods.","B":"Foreign-made goods filled a growing share of the fleets sailing from Seville.","C":"The crown kept collecting large revenues from the regulated trade with the colonies.","D":"Spanish officials repeatedly issued new rules against unlicensed foreign trade."},"answer":"C","rationales":{"A":"Incorrect. This helps explain why smuggling grew, so it supports Haring's argument.","B":"Incorrect. This supports Haring's point that Spain depended on foreign goods.","C":"Correct. If the crown still earned large revenues, the system did not fail in every way. This finding limits (qualifies) Haring's conclusion without disproving his evidence.","D":"Incorrect. Repeated new rules show the problem kept happening; they do not show the system worked."},"explanation":"A system could fail to keep out foreign goods and still raise a lot of money for the crown. That finding would limit Haring's conclusion without proving his evidence wrong."},{"id":"U4-E20","set":"X7","topic":"4.6","lo":"L","skill":"3.A","difficulty":"easy","stem":"The Wampanoag grievances described in the passage most directly reflect conflict over","options":{"A":"English efforts to force the Wampanoag to work in silver mines","B":"Wampanoag demands for a larger share of the profits from the Atlantic slave trade","C":"English expansion onto Native lands and English control of courts and leaders","D":"disputes between Catholic and Protestant missionaries in New England"},"answer":"C","rationales":{"A":"Incorrect. There were no silver mines in New England, and the passage does not mention mining.","B":"Incorrect. The passage does not mention the slave trade.","C":"Correct. The complaints are about land sales, English cattle ruining Wampanoag corn, unfair courts, and the English choosing new Wampanoag leaders.","D":"Incorrect. The passage does not mention missionaries or religious disputes."},"explanation":"Every complaint in the passage is about English colonists taking land, letting cattle wreck Native farms, using unfair courts, and picking Native leaders. These were fights over land and power."},{"id":"U4-E21","set":"X7","topic":"4.6","lo":"L","skill":"5.A","difficulty":"medium","stem":"The war that began soon after this meeting (Metacom's War, 1675–1676) was most similar to which of the following?","options":{"A":"The Fronde, a revolt by French nobles against the growing power of the king","B":"Queen Nzinga's resistance to Portuguese expansion in Ndongo and Matamba","C":"Japan's expulsion of Portuguese merchants and missionaries in the 1630s","D":"The Dutch Revolt by Protestant provinces against their Spanish Habsburg king"},"answer":"B","rationales":{"A":"Incorrect. The Fronde was a revolt by French nobles, not Indigenous people resisting colonists.","B":"Correct. Both were armed resistance by local peoples against Europeans who wanted their land and power. Nzinga fought Portuguese expansion in Central Africa for decades.","C":"Incorrect. Japan's expulsion was a government policy by a s
