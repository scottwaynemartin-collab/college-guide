 argued that Christianity and this trade should spread together.","whyNot":{"A":"Livingstone calls for \"commerce and Christianity,\" not conquest.","B":"Livingstone says the opposite: Africans are \"very desirous of trading.\"","D":"Livingstone says the opposite: Christianity and commerce \"should ever be inseparable.\""},"hint":"What two goals does Livingstone name, and how does he think they are connected?"},{"id":"U6-P05","set":"P2","topic":"6.3","lo":"C","skill":"4.A","difficulty":"hard","stem":"Livingstone's warning about \"the management of Indian affairs\" most likely refers to","options":{"A":"Parliament's law of 1813 that made the East India Company let Christian missionaries work in India","B":"Britain's two wars against the Sikh kingdom of the Punjab in the 1840s, which added it to British India","C":"the East India Company's defeat of the Maratha states in 1818, which made it the strongest power in India","D":"the recent uprising of Indian soldiers and civilians against the East India Company"},"answer":"D","explanation":"In May 1857, Indian soldiers in the Company's army rebelled, and the revolt spread across northern India. Livingstone spoke that December. He blamed what he saw as a company that cared about trade but not about Christianity. Many rebels, though, feared that the British were attacking their religions.","whyNot":{"A":"Letting missionaries in would fit Livingstone's principle. He is warning about what happened when that principle was neglected.","B":"The Sikh wars added land to British India. They were not a sign that Britain had separated trade from religion.","C":"Defeating the Marathas was a British success. Livingstone points to a bad \"result\" that should serve as a warning."},"hint":"Livingstone says trade and Christianity should go together. Where had a British company put trade first, and what had just gone wrong there?"},{"id":"U6-P06","set":"P2","topic":"6.2","lo":"B","skill":"5.B","difficulty":"medium","stem":"Livingstone's call to \"carry out the work which I have begun\" contributed most directly to which of the following later in the 1800s?","options":{"A":"more missionary and trading activity in Central Africa that helped open the way for colonial rule","B":"regular steamship trade on the Zambezi River beginning in the 1860s","C":"the end of the slave trade inside Africa by the 1860s because of missionary pressure","D":"Britain's decision to leave Central Africa to Portugal, which already held the nearby coasts of Angola and Mozambique"},"answer":"A","explanation":"Livingstone's speech led to a new mission, the Universities' Mission to Central Africa. After he died in 1873, Scottish missionaries and traders followed his routes to Lake Nyasa. British officials later pointed to their work to back Britain's claim to the area. In 1891 Britain made it a protectorate, a land under British control.","whyNot":{"B":"Livingstone's own Zambezi expedition of 1858–1864 found rapids that blocked steamships. The river did not become a steady trade route.","C":"The slave trade inside Africa continued long after the 1860s. The slave market at Zanzibar did not close until 1873.","D":"Britain did not leave the area to Portugal. In 1890 it stopped Portugal's plan to join Angola and Mozambique. In 1891 it took the lands near Lake Nyasa for itself."},"hint":"Livingstone wanted Africa to stay \"open\" to Europeans. What happened in Africa in the 1880s and 1890s?","reasoning":"Causation"},{"id":"U6-P07","set":"P3","topic":"6.2","lo":"B","skill":"2.B","difficulty":"medium","stem":"Articles XXXIV and XXXV were intended mainly to","options":{"A":"limit European powers to the African coasts and keep them out of the interior","B":"divide Africa into fixed borders that each European power agreed to accept","C":"set rules so that European powers could claim African land without fighting one another","D":"require each European power to win the written consent of local African rulers before claiming their land"},"answer":"C","explanation":"The powers wanted to avoid \"disputes\" over new land claims. So Article XXXIV said a power must tell the others about a claim. Article XXXV said it must set up real control there.","whyNot":{"A":"The articles explain how to make claims official. They do not ban moving inland, and the powers soon pushed deep into the interior.","B":"The conference did not draw a map of Africa. These articles set rules for future claims, and most borders were settled later in separate treaties.","D":"The articles say a power must notify \"the other Signatory Powers,\" not African rulers."},"hint":"To whom must a power send its \"notification\"? Why would that matter?"},{"id":"U6-P08","set":"P3","topic":"6.2","lo":"B","skill":"2.C","difficulty":"easy","stem":"A historian studying how Africans experienced the partition of Africa would find the General Act limited mainly because","options":{"A":"no African states took part in making the agreement","B":"it was a secret agreement that was not published until long after the partition","C":"it ignores the slave trade, which many Africans wanted ended","D":"it deals with the Congo River basin but not with any other part of Africa"},"answer":"A","explanation":"The first paragraph lists the states at the conference. It names European powers, the United States, and the Ottoman Empire. No African state is on the list. So the act records the plans of outside powers. It does not record African views.","whyNot":{"B":"The act was published and printed in official collections such as this one. Its problem is who made it, not secrecy.","C":"Article VI says the powers will \"help in suppressing slavery, and especially the slave trade.\"","D":"Article VI covers the Congo basin, but Articles XXXIV and XXXV set rules for claims on \"the coasts of the African Continent.\""},"hint":"Reread the first paragraph. Whose plans does the document record?"},{"id":"U6-P09","set":"P3","topic":"6.2","lo":"B","skill":"3.D","difficulty":"medium","stem":"Article VI's promise to watch over \"the preservation of the native tribes\" was most directly contradicted by which development in the decades after 1885?","options":{"A":"the opening of mission schools and clinics by Catholic and Protestant groups in Central Africa","B":"forced labor and violence used to collect rubber in King Leopold II's Congo Free State","C":"British naval patrols that stopped slave ships off the coast of East Africa","D":"European explorers' mapping of the Congo River and its main branches"},"answer":"B","explanation":"Around the time of the Berlin Conference, the European powers recognized King Leopold II's control of the Congo. His agents and companies forced people to gather rubber. They took hostages, beat people, and killed them. These acts went against the act's promise to protect \"the native tribes.\"","whyNot":{"A":"Mission schools fit Article VI, which promises to protect groups \"instructing the natives.\"","C":"Stopping slave ships fits Article VI's promise to \"help in suppressing slavery.\"","D":"Article VI promises to protect explorers. Mapping rivers does not go against it."},"hint":"Three choices describe things Article VI promised to protect or support. Find those three first."},{"id":"U6-P10","set":"P4","topic":"6.3","lo":"C","skill":"3.A","difficulty":"easy","stem":"Source 1 tries to win support for the uprising mainly by","options":{"A":"claiming that British policies threatened both Hindu and Muslim religious practices","B":"promising peasants that they would own the land they farmed after the British left","C":"praising British laws that ended sati and allowed Hindu widows to remarry","D":"appealing to Indian weavers and merchants who had lost business to British cloth"},"answer":"A","explanation":"The proclamation lists missionary books, laws about widows and sati, and greased cartridges. It calls the English enemies of both Hindus and Muslims. It wants the two groups to unite.","whyNot":{"B":"Source 1 says nothing about giving land to peasants.","C":"Source 1 attacks these laws as attempts \"to destroy the religion of natives of India.\"","D":"Some rebel proclamations spoke to weavers and merchants, but this one focuses on religion and the princes' lands."},"hint":"Which two groups does the proclamation keep naming, and what does it say they have in common?"},{"id":"U6-P11","set":"P4","topic":"6.3","lo":"C","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes how Source 2 responds to the complaints in Source 1?","options":{"A":"It promises not to interfere with religion and to respect the princes' rights.","B":"It agrees to repeal the laws that banned sati and allowed widows to remarry.","C":"It admits that the army's cartridges had been greased with animal fat.","D":"It announces that the East India Company will continue to govern India."},"answer":"A","explanation":"Source 1 says the British were attacking Indians' religion and taking princes' lands. Source 2 answers both points. Officials must not interfere with religion. The Crown wants \"no extension\" of its lands.","whyNot":{"B":"Source 2 promises not to interfere with religion, but it does not repeal any laws. The ban on sati stayed in force.","C":"Source 2 never mentions the cartridges.","D":"Source 2 says the opposite. The Crown takes over \"the government of the territories in India\" from the Company."},"hint":"Match each promise in Source 2 to a complaint in Source 1.","reasoning":"Comparison"},{"id":"U6-P12","set":"P4","topic":"6.2","lo":"B","skill":"4.B","difficulty":"medium","stem":"Source 2 best reflects which broader development of the 1800s?","options":{"A":"Britain granting its colonies in South and Southeast Asia the right to elect their own governments","B":"European governments taking direct control of colonies that private companies had governed","C":"European powers dividing Africa among themselves at the Berlin Conference","D":"a decline in British power in South Asia after the uprising of 1857"},"answer":"B","explanation":"In 1858 the British Crown took India from the East India Company. Other governments did the same. In 1800 the Dutch government took over the Dutch East India Company's lands in Indonesia. Germany took German East Africa from a private company in 1891, and Britain took the Royal Niger Company's lands in 1900.","whyNot":{"A":"India gained no self-government. The Crown appointed a viceroy to rule in its name.","C":"Source 2 is about India, and it came decades before the Berlin Conference. It describes a change in who ruled an existing colony.","D":"British power in India grew stronger after 1858. The Crown now ruled directly."},"hint":"Who governed India before this proclamation, and who governed it afterward?","reasoning":"Comparison"},{"id":"U6-P13","set":"P5","topic":"6.3","lo":"C","skill":"3.A","difficulty":"easy","stem":"The proclamation's main argument is that","options":{"A":"China should adopt Western machines and weapons to resist the British","B":"the Qing emperor was a good ruler who had been misled by bad officials","C":"the Manchus were foreign rulers who had no right to govern the Chinese people","D":"land should be divided equally among China's peasant families"},"answer":"C","explanation":"The proclamation says the empire \"belongs to the Chinese, and not to the Tartars.\" By \"Tartars\" it means the Manchus. It points to Manchu rules on hair and clothing. It also says a few Manchus rule many Chinese.","whyNot":{"A":"The proclamation says nothing about Western machines or the British. Its target is the Manchus.","B":"The proclamation attacks the whole Manchu government, not only a few officials.","D":"The Taiping did later issue plans for sharing land, but this proclamation is about Manchu rule."},"hint":"Who are the \"Tartars,\" and what does the proclamation say they took from the Chinese?"},{"id":"U6-P14","set":"P5","topic":"6.3","lo":"C","skill":"4.B","difficulty":"medium","stem":"The Taiping Rebellion grew in the context of","options":{"A":"Qing weakness after defeat in the Opium War, along with poverty and natural disasters","B":"Japan's invasion of northern China soon after the Meiji Restoration","C":"a sharp rise in rice prices after the Qing began selling grain to Britain","D":"a Qing decision to stop collecting land taxes from peasants in the south"},"answer":"A","explanation":"After losing the Opium War (1839–1842), the Qing looked weak. Southern China also suffered from crowding, floods, and hunger. Hong Xiuquan's Taiping movement drew on this anger and on Christian ideas he had read in missionary pamphlets.","whyNot":{"B":"Japan did not go to war with China until 1894, decades after the rebellion began in 1850.","C":"China did not ship grain to Britain. Its main exports were tea and silk, and silver was flowing out to pay for opium.","D":"Peasants in the south complained of heavy taxes and greedy officials, as the proclamation says."},"hint":"The proclamation complains about how the government handled \"drought and inundations.\" What else had weakened the Qing by 1850?","reasoning":"Causation"},{"id":"U6-P15","set":"P5","topic":"6.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"Which of the following was a result of the Qing government's fight against the Taiping?","options":{"A":"Western powers pulled their merchants out of China's ports until the fighting ended","B":"The Qing gave peasants in the south ownership of the lands they farmed","C":"The Qing ended the civil service exams in order to win back the support of the scholar-gentry","D":"Regional armies led by Chinese officials gained power at the court's expense"},"answer":"D","explanation":"The court needed new armies to beat the Taiping. Chinese officials such as Zeng Guofan and Li Hongzhang raised them in the provinces. The rebels were crushed by 1864. But power moved from the court to these regional leaders.","whyNot":{"A":"Western merchants stayed in the treaty ports. Some Western officers even led troops for the Qing, such as the \"Ever Victorious Army.\"","B":"The Qing did not give land to peasants. Taiping plans for sharing land were never carried out either.","C":"The exams were not ended until 1905. The Taiping held their own exams, but the Qing kept theirs."},"hint":"The Qing won, but who did most of the fighting for them?","reasoning":"Causation"},{"id":"U6-P16","set":"P6","topic":"6.3","lo":"C","skill":"3.A","difficulty":"easy","stem":"Wovoka's message promises his followers that","options":{"A":"if they fought the U.S. Army, the spirits would protect them from soldiers' bullets","B":"if they moved to Nevada, the U.S. government would give them new hunting lands","C":"if they became farmers and gave up their old ways, white settlers would leave","D":"if they danced and lived peacefully, the dead would return and a new world would come"},"answer":"D","explanation":"Wovoka tells his followers to dance, not to fight, and to keep working for the whites for now. He promises that \"the dead are all alive again\" and that a new world will bring \"no more sickness.\"","whyNot":{"A":"Wovoka says \"You must not fight.\" In 1890, before this message, some Lakota believed that special \"ghost shirts\" would stop bullets. That idea is not in this message.","B":"The message says nothing about moving or about new land from the government.","C":"Wovoka tells his followers to dance and bathe, not to give up their ways."},"hint":"What does Wovoka say will happen \"when the time comes\"?"},{"id":"U6-P17","set":"P6","topic":"6.3","lo":"C","skill":"5.A","difficulty":"hard","stem":"Wovoka's promise that the dead would return and the world would be made new was most similar to the promise of which movement?","options":{"A":"the 1857 uprising in India, which began when soldiers refused cartridges they believed broke religious rules","B":"the Xhosa cattle-killing movement in southern Africa in 1856–1857","C":"the Taiping Rebellion, whose leader mixed Christian ideas with Chinese traditions in a plan to overthrow the Qing dynasty","D":"Samori Touré's long war against the French in West Africa, fought with modern firearms"},"answer":"B","explanation":"Both movements arose after outsiders had taken land and herds. In both, a prophet promised that the dead would return and the world would be made new if people obeyed sacred commands.","whyNot":{"A":"The 1857 uprising began over cartridges and religious rules. It was an armed revolt, not a promise that the dead would return.","C":"The Taiping also used Christian ideas, but their leader promised a new kingdom won by armies, not the return of the dead.","D":"Samori fought a long military campaign. He did not promise that the dead would return."},"hint":"Think about which movements were led by prophets, and what each prophet promised.","reasoning":"Comparison"},{"id":"U6-P18","set":"P6","topic":"6.2","lo":"B","skill":"4.B","difficulty":"medium","stem":"The message was written in the context of","options":{"A":"the Indian Removal Act of 1830, which forced the Cherokee and other Southeastern nations to move west of the Mississippi River","B":"the Little Bighorn battle of 1876, which ended the Plains wars with a victory for Native nations","C":"U.S. expansion that had confined many Plains peoples to reservations and destroyed the buffalo herds","D":"the Dawes Act of 1887, which returned the buffalo-hunting lands to the Plains nations"},"answer":"C","explanation":"By the 1880s, settlers, railroads, and the U.S. Army had pushed Plains peoples onto reservations, and hunters had killed almost all the buffalo. Many people found hope in Wovoka's promise of a renewed world.","whyNot":{"A":"The Removal Act came 60 years earlier and moved Southeastern nations, not Plains peoples. By 1890 the Plains peoples faced reservations and the loss of the buffalo.","B":"Lakota and Cheyenne warriors won at the Little Bighorn in 1876, but the army soon forced them onto reservations.","D":"The Dawes Act broke up reservation land into family plots and opened the rest to settlers. It took land away."},"hint":"Wovoka promises a new world. What had gone wrong in the old one for Native peoples by 1890?","reasoning":"Causation"},{"id":"U6-P19","set":"P7","topic":"6.2","lo":"B","skill":"2.B","difficulty":"easy","stem":"According to the preamble, Britain sought the treaty mainly because","options":{"A":"a growing number of British subjects had settled in New Zealand","B":"Māori chiefs had asked Britain to defend them from a French invasion","C":"gold had been discovered in New Zealand and Britain wanted the mines","D":"Britain needed a naval base to protect its trade with China"},"answer":"A","explanation":"The preamble gives the reason. Many British subjects \"have already settled in New Zealand.\" More settlers were still coming from Europe and Australia.","whyNot":{"B":"Some chiefs had asked the British king for protection years earlier, but the preamble gives settlement as the reason.","C":"The preamble does not mention gold. New Zealand's first small gold rush came in 1852, years after the treaty.","D":"The preamble says nothing about ships, bases, or China."},"hint":"What reason does the preamble give for making this treaty?"},{"id":"U6-P20","set":"P7","topic":"6.2","lo":"B","skill":"2.C","difficulty":"hard","stem":"A historian studying what the Māori chiefs believed they were agreeing to would find this English text limited because","options":{"A":"most chiefs signed a Māori-language version that used different words for what they gave up","B":"the English text was written many years after the chiefs signed the treaty, by settlers who wanted land","C":"the treaty does not say anything about who would own Māori land","D":"Hobson had no authority to make an agreement for the British Crown"},"answer":"A","explanation":"More than 500 chiefs signed copies written in the Māori language. Only 39 signed the English copy. The Māori copy gave Britain the right to govern, but it also promised the chiefs they would keep their full power as chiefs. So many chiefs did not think they had given up their power.","whyNot":{"B":"The English text was written in 1840, when the treaty was signed.","C":"Article the Second deals directly with Māori lands, forests, and fisheries.","D":"The preamble says the Queen appointed an official \"properly authorised\" to make the treaty. Hobson was that official."},"hint":"A limitation is a reason to be careful. Think about the language of this text and the language most chiefs read."},{"id":"U6-P21","set":"P7","topic":"6.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"The treaty's terms on land, including the Crown's right of \"pre-emption,\" most directly contributed to which development in New Zealand?","options":{"A":"a rapid rise in the Māori population as settlers brought new crops, livestock, and Western medicine","B":"disputes over land sales that led to wars between Māori and British forces in the mid-1800s","C":"a ban on European settlement on the North Island to protect Māori farms","D":"Māori chiefs' freedom to sell land to French and American settlers"},"answer":"B","explanation":"Under pre-emption, only the Crown could buy Māori land, and settlers kept wanting more of it. Disputes over land sales led to the New Zealand Wars (1845–1872), during which the government seized millions of acres.","whyNot":{"A":"The Māori population fell sharply in the 1800s because of disease, war, and loss of land.","C":"Settlers poured into the North Island, and conflict over land grew there.","D":"Pre-emption meant only the Crown could buy Māori land. Chiefs could not sell freely to others."},"hint":"Who wanted to buy land, and who was allowed to buy it from the Māori?","reasoning":"Causation"},{"id":"U6-P22","set":"P8","topic":"6.4","lo":"D","skill":"1.B","difficulty":"medium","stem":"The system described in the passage required Javanese farmers to","options":{"A":"pay their taxes in silver coins that Dutch officials shipped back to the Netherlands each year","B":"sell their crops to whichever European merchant offered the best price","C":"leave their villages to work in Dutch-owned factories in Java's cities","D":"grow export crops for the government, which set the price it paid them"},"answer":"D","explanation":"Multatuli says the government forces the farmer to grow certain crops. It punishes him for selling to anyone else. It also sets the price. Historians call this the Cultivation System. The Dutch began it in Java in 1830.","whyNot":{"A":"The passage is about crops, not coins. Farmers paid with their labor and their harvests.","B":"Multatuli says the government punishes a farmer who sells \"to any purchaser but itself.\"","C":"The farmers stayed on their land. The problem was what they were forced to grow there."},"hint":"Reread the second paragraph. List the three things the government does to the farmer."},{"id":"U6-P23","set":"P8","topic":"6.2","lo":"B","skill":"2.C","difficulty":"medium","stem":"Multatuli's account would be most useful to a historian studying","options":{"A":"criticism of colonial rule inside the Netherlands in the mid-1800s","B":"the views of Javanese farmers, given in their own words","C":"the exact amounts of coffee, sugar, and indigo that Java exported to Europe each year","D":"the reasons the Dutch government first set up the system in 1830"},"answer":"A","explanation":"Multatuli had been a Dutch official. His novel caused an uproar in the Netherlands. It shows how some Dutch people criticized colonial rule. It does not give the farmers' own words or exact numbers.","whyNot":{"B":"The farmers do not speak in the passage. A former Dutch official speaks for them.","C":"The passage gives no export figures. It is a novel that makes a moral argument.","D":"Multatuli describes how the system worked and why it was unjust, not why the government started it."},"hint":"Who wrote the novel, and who were its first readers?"},{"id":"U6-P24","set":"P8","topic":"6.2","lo":"B","skill":"3.A","difficulty":"medium","stem":"According to the passage, the Dutch were able to control Java's farmers with few European officials because they","options":{"A":"brought in Chinese and Indian contract workers to replace Javanese farmers","B":"posted Dutch soldiers in the villages to make farmers grow the export crops on time","C":"let the Dutch East India Company keep its own army on the island","D":"paid Javanese nobles a share of the profits to make their people grow the crops"},"answer":"D","explanation":"Multatuli says \"the Javanese obeys his chiefs.\" So the Dutch gave the chiefs \"a part of the gain.\" The chiefs then made their people grow the crops. Many colonies with few Europeans were ruled through local leaders like this.","whyNot":{"A":"Multatuli describes Javanese farmers growing the crops themselves, under orders passed down through their chiefs.","B":"Multatuli says the Dutch worked through the chiefs, whom \"the Javanese obeys,\" not through soldiers in the fields.","C":"The Dutch East India Company was shut down in 1799. By the 1800s the Dutch government ruled Java."},"hint":"Reread the end of the first paragraph. Whom do the Javanese obey?","reasoning":"Causation"},{"id":"U6-P25","set":"P9","topic":"6.8","lo":"I","skill":"3.D","difficulty":"hard","stem":"Casement's comments on sleeping sickness in the last paragraph most directly qualify which claim?","options":{"A":"that the Congo's population was falling in the regions Casement visited","B":"that the forest guards' main duty was to force people to collect rubber","C":"that the Congolese saw sleeping sickness as one cause of their high death rate","D":"that forced rubber collection alone explains the Congo's falling population"},"answer":"D","explanation":"Casement says sleeping sickness was an important cause of the Congo's population loss. He adds that the Congolese blamed other causes even more. So the population fell for more than one reason. That qualifies, or limits, a claim that violence alone was to blame.","whyNot":{"A":"The disease evidence supports this claim. Casement says the population was \"gradually reduced.\"","B":"Casement says this was the guards' \"sole duty.\" The disease evidence does not limit it.","C":"Casement supports this claim. He says the natives see the disease as \"one of the inducing causes.\""},"hint":"To qualify a claim means to limit it. Which claim does the evidence about disease limit?"},{"id":"U6-P26","set":"P9","topic":"6.4","lo":"D","skill":"4.A","difficulty":"medium","stem":"The demand for rubber that drove events in the Congo came mainly from","options":{"A":"European navies that used rubber to waterproof the wooden hulls of their warships and supply boats","B":"factories in Europe and the United States that made tires, belts, and wire coverings","C":"Chinese merchants who resold rubber goods to buyers across East Asia","D":"Arab and Swahili merchants who shipped rubber to markets around the Indian Ocean"},"answer":"B","explanation":"Factories needed rubber for bicycle and car tires, machine belts, and the covering on electric wires. At first, wild rubber from the Amazon and the Congo filled this need. Later, plantations in Asia took over.","whyNot":{"A":"By the 1890s navies built steel ships. Rubber's main buyers made tires, belts, hoses, and wire coverings.","C":"Most Congo rubber went to Antwerp and on to European and American factories.","D":"Arab and Swahili traders in the eastern Congo dealt mainly in ivory and enslaved people. Congo rubber went west to Antwerp, for European and American factories."},"hint":"Think about new industrial products of the late 1800s. Which ones needed rubber?","reasoning":"Causation"},{"id":"U6-P27","set":"P9","topic":"6.2","lo":"B","skill":"5.B","difficulty":"medium","stem":"Reports such as Casement's contributed most directly to","options":{"A":"Belgium's government taking control of the Congo from King Leopold II in 1908","B":"Leopold II's decision to grant the Congo its independence in 1908","C":"France's purchase of the Congo, which bordered its own Central African colony","D":"an international treaty, signed by the colonial powers, that banned forced labor in African colonies by 1910"},"answer":"A","explanation":"Casement's report and campaigns by E. D. Morel and others caused an outcry in Europe and the United States. In 1908 Belgium took the Congo away from Leopold II and made it a Belgian colony.","whyNot":{"B":"The Congo did not become independent until 1960.","C":"France had the right to buy the Congo if Leopold ever sold it, but Belgium took it over instead.","D":"Forced labor went on in many colonies for decades. No treaty banned it by 1910."},"hint":"Public anger can push a government to act. Which choice shows a government stepping in?","reasoning":"Causation"},{"id":"U6-P28","set":"P10","topic":"6.5","lo":"E","skill":"3.A","difficulty":"easy","stem":"The passage best supports which claim about South America in the 1800s?","options":{"A":"British investors paid for many of its railways, often through loans to governments.","B":"South American governments paid for most of their railways with their own tax money.","C":"Spanish and Portuguese companies built and owned most of its railways.","D":"American investors put up most of the money, while British firms sent the engineers."},"answer":"A","explanation":"Mulhall says most railways were built \"with British capital.\" Some were built by companies in London. Others were built by governments with loans from England.","whyNot":{"B":"Mulhall says that even government railways were paid for \"in the shape of loans\" from England.","C":"Mulhall names \"English or American engineers\" and an \"English company,\" not Spanish or Portuguese firms.","D":"Mulhall says the money was \"British capital.\" He names \"English or American engineers.\""},"hint":"Where does Mulhall say the money for South America's railways came from?"},{"id":"U6-P29","set":"P10","topic":"6.4","lo":"D","skill":"1.B","difficulty":"medium","stem":"Peru's guano trade, described in the last paragraph, is best understood as an example of","options":{"A":"a free-trade treaty in which Peru and Britain ended taxes on each other's goods","B":"an export economy built on one natural resource that was sold to industrializing countries","C":"a mercantilist system in which Spain controlled the trade of its American colonies through licensed ports","D":"a government plan to build factories that would replace goods imported from Europe"},"answer":"B","explanation":"Guano was a rich fertilizer. Farmers in Britain and other countries bought huge amounts of it. Peru's government came to depend on guano sales. It also borrowed money against them.","whyNot":{"A":"Mulhall describes loans backed by guano sales, not a trade treaty.","C":"Peru had won independence from Spain in the 1820s.","D":"The passage describes loans backed by guano exports. It does not describe a plan to build factories to replace imported goods."},"hint":"Who bought Peru's guano, and how did Peru's government use the money it earned?"},{"id":"U6-P30","set":"P10","topic":"6.5","lo":"E","skill":"5.A","difficulty":"hard","stem":"The situation Mulhall describes in Peru in the 1870s was most similar to","options":{"A":"Japan's industrial growth, which its government paid for mainly with taxes on its own farmers","B":"the Ottoman Tanzimat reforms, which reorganized the empire's laws, courts, and schools","C":"China's Self-Strengthening Movement, in which Qing officials built arsenals and shipyards","D":"Egypt's heavy debts to European lenders, which led to British control of Egypt in 1882"},"answer":"D","explanation":"Like Peru, Egypt borrowed from European lenders against its exports. In Egypt's case, the export was cotton. When Egypt could not pay, Britain and France took over its money matters. Britain then occupied Egypt in 1882.","whyNot":{"A":"Japan paid for growth mostly with its own taxes and avoided heavy foreign debt, so it kept control of its affairs.","B":"The Tanzimat were reforms of Ottoman law and government. They were not loans backed by an export, as in Peru.","C":"Self-strengthening was a reform program run by Qing officials. It did not lead to foreign control through debt."},"hint":"Look for another country that borrowed against its exports and then could not repay.","reasoning":"Comparison"},{"id":"U6-P31","set":"P11","topic":"6.5","lo":"E","skill":"4.A","difficulty":"easy","stem":"The treaty was signed at the end of a war that began after","options":{"A":"the Qing emperor refused to receive a British ambassador at his court in Beijing","B":"Britain demanded the right to send Christian missionaries into the Chinese interior","C":"Qing officials seized and destroyed British merchants' opium at Guangzhou","D":"the Qing government raised its taxes on British cotton cloth sold in China"},"answer":"C","explanation":"In 1839 Lin Zexu seized and destroyed more than 20,000 chests of British opium at Guangzhou. Britain sent warships, and the First Opium War lasted until this treaty in 1842.","whyNot":{"A":"In 1793 the emperor met Britain's ambassador but turned down his requests. In 1816 another ambassador was sent away without meeting the emperor. No war followed either time. The war came after the opium was destroyed in 1839.","B":"Rights for missionaries came in later treaties, such as the Treaty of Tianjin in 1858.","D":"The war was about opium, not taxes on cloth."},"hint":"Which product were British merchants smuggling into China in the 1830s?","reasoning":"Causation"},{"id":"U6-P32","set":"P11","topic":"6.5","lo":"E","skill":"3.A","difficulty":"medium","stem":"Article V shows that Britain wanted to","options":{"A":"give a small group of licensed Chinese merchants control of trade with Britain","B":"limit British merchants to trading at the single port of Guangzhou","C":"end the rule that British merchants must trade through licensed Chinese firms","D":"make the Hong Merchants pay for the opium that Qing officials destroyed"},"answer":"C","explanation":"Under the old Canton System, foreigners could trade only at Guangzhou. They could deal only with a few licensed firms, the Cohong. Article V ended that rule for British merchants. They could now trade with \"whatever persons they please\" at the open ports.","whyNot":{"A":"That describes the old system that Article V ended.","B":"Article II opens five ports to British merchants, not one.","D":"Article V is about whom British merchants may trade with. It says nothing about opium. (Payment for the destroyed opium came in Article IV, which is not shown.)"},"hint":"What were British merchants \"compelled\" to do before the treaty?"},{"id":"U6-P33","set":"P11","topic":"6.5","lo":"E","skill":"5.A","difficulty":"medium","stem":"The terms of the treaty were most similar to those of","options":{"A":"the Berlin Conference's rules, which set out how European powers could claim African coasts","B":"the Treaty of Paris of 1783, in which Britain recognized the independence of the United States","C":"the Ottoman decree of 1839, which promised safety of life and property to the sultan's Christian and Muslim subjects alike","D":"the treaties Western powers forced on Japan in the 1850s, which opened ports and fixed its tariffs"},"answer":"D","explanation":"Western powers forced treaties on Japan after Commodore Perry's visit in 1853–1854. Like the Treaty of Nanjing, they opened ports to foreign trade and took away some control over tariffs. Later treaties with both countries gave foreigners special legal rights. People in Asia called them \"unequal treaties.\"","whyNot":{"A":"The Berlin rules were agreed among outside powers about Africa. The Treaty of Nanjing was forced on China after it lost a war.","B":"That treaty recognized a new nation. The Treaty of Nanjing took land and trade rights from China.","C":"The sultan made this decree himself, for his own people. No foreign power forced it on him after a war."},"hint":"What made the Treaty of Nanjing \"unequal\"? Look for a choice with the same features.","reasoning":"Comparison"},{"id":"U6-P34","set":"P12","topic":"6.5","lo":"E","skill":"2.B","difficulty":"easy","stem":"The cartoonist most likely intended to show that","options":{"A":"foreign powers were carving China into areas of control that China could not stop","B":"China was dividing its lands among its allies to pay the costs of a recent war","C":"Britain, Germany, and Japan were working together to protect China from Russia's advance into Manchuria","D":"France was leading the effort to divide China among the great powers"},"answer":"A","explanation":"The pie is China. The rulers of Britain, Germany, and Russia hold knives over it. The figure for Japan studies its share. The Qing official can only throw up his hands.","whyNot":{"B":"The Qing official throws up his hands in alarm. The pie is being cut by foreign rulers, not handed out by China.","C":"Russia's Tsar Nicholas II sits at the table with a knife, cutting along with the others.","D":"The figure for France holds no knife. The French cartoonist shows Germany, stabbing the pie, as the most aggressive."},"hint":"What are the people at the table doing to the pie, and how does the man behind them react?"},{"id":"U6-P35","set":"P12","topic":"6.5","lo":"E","skill":"4.B","difficulty":"medium","stem":"The cartoon was drawn in response to","options":{"A":"the opening of China's first five treaty ports to foreign trade at the end of the Opium War","B":"China's victory over France in a war over Vietnam in the 1880s","C":"foreign powers' seizure of Chinese ports after China's defeat by Japan in 1895","D":"a Qing decision to sell parts of China to foreign powers to pay for railways"},"answer":"C","explanation":"Japan beat China in 1895. Then other powers rushed to grab Chinese ports. Germany seized Jiaozhou Bay in 1897. Russian warships moved into Port Arthur that December, and Russia leased it in 1898.","whyNot":{"A":"The first treaty ports opened in 1842. The labels Kiao-Tchéou and Port-Arthur refer to ports that Germany and Russia moved into in late 1897.","B":"France won control of Vietnam in 1885. The cartoon shows rulers taking pieces of China itself.","D":"The Qing did not sell territory. Foreign powers forced China to lease ports to them."},"hint":"The labels on the pie name two ports. When and how did foreign powers get them?","reasoning":"Causation"},{"id":"U6-P36","set":"P12","topic":"6.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"Foreign actions like those shown in the cartoon contributed most directly to","options":{"A":"China's creation of an elected national parliament during the Hundred Days' Reform of 1898","B":"the Boxer Rebellion, an uprising against foreigners in northern China in 1899–1901","C":"an agreement in the 1890s that ended the shipping of Indian opium to China","D":"the Qing court's alliance with Britain against Germany and Russia"},"answer":"B","explanation":"Many Chinese were angry about foreign ports, railways, and missionaries. The Boxers attacked foreigners and Chinese Christians. In 1900, troops from eight foreign nations marched into Beijing to crush them.","whyNot":{"A":"Reformers in 1898 proposed many changes, but the empress dowager Cixi stopped them after about 100 days. China had no parliament then.","C":"Opium shipments from India continued until an agreement in 1907 began to phase them out.","D":"The Qing court did not ally with Britain. In 1900 it backed the Boxers against the foreign powers."},"hint":"How might ordinary Chinese react to foreigners taking ports and building railways in China?","reasoning":"Causation"},{"id":"U6-P37","set":"P13","topic":"6.6","lo":"G","skill":"3.A","difficulty":"easy","stem":"According to Campbell, the contract system of Chinese emigration arose mainly because","options":{"A":"the Qing government sent its subjects abroad to earn wages and pay taxes for the empire","B":"Chinese merchants in Southeast Asia sent for relatives to help run family businesses","C":"plantation owners in the Americas sought new workers as slavery came to an end","D":"factory owners in Britain needed more workers for their textile mills"},"answer":"C","explanation":"Campbell says slavery was ending. So owners in the \"New World\" tried to replace enslaved Africans with Asian contract workers. Chinese workers went to places such as Cuba and Peru. Indian workers went to British colonies such as Trinidad.","whyNot":{"A":"Campbell says \"the principals\" in the system \"were foreigners,\" not the Qing government.","B":"Campbell says the contract system was run by foreigners who hired workers for \"lands beyond the seas,\" not by Chinese merchant families.","D":"Campbell points to the \"New World,\" not to British factories."},"hint":"Reread the first paragraph. What was ending in the \"New World,\" and who needed workers?","reasoning":"Causation"},{"id":"U6-P38","set":"P13","topic":"6.7","lo":"H","skill":"5.B","difficulty":"medium","stem":"Campbell's statement that the emigration was \"almost exclusively male\" suggests which effect on the communities that migrants left behind?","options":{"A":"Clan elders in southern China forbade young men to go overseas.","B":"Women took on more work and responsibility in families whose men were overseas.","C":"Southern China's cities grew quickly as village women moved there to replace the men.","D":"Village leaders in southern China took over the farms of men who went overseas."},"answer":"B","explanation":"When men went abroad, wives and mothers often ran the farm and the household. Many families also came to depend on the money that the men sent home.","whyNot":{"A":"Campbell describes a large emigration of men from Kwangtung, so young men were not kept at home.","C":"Campbell says nothing about women moving to cities. Wives and mothers usually stayed and took on more work at home.","D":"Families usually kept their land. Wives and parents worked it, often with money the men sent home."},"hint":"If most migrants were men, how would daily life change in their home villages?","reasoning":"Causation"},{"id":"U6-P39","set":"P13","topic":"6.7","lo":"H","skill":"1.B","difficulty":"medium","stem":"The limits on Chinese migration that Campbell mentions in the second paragraph are best illustrated by","options":{"A":"Britain's ban on Chinese workers in its Southeast Asian colonies","B":"the Chinese Exclusion Act, passed by the United States in 1882","C":"the Qing government's encouragement of emigration to the Americas","D":"Peru's grant of citizenship to Chinese contract workers in the 1850s"},"answer":"B","explanation":"Several English-speaking countries limited Chinese migration. The United States banned Chinese laborers in 1882. Canada made Chinese immigrants pay a head tax from 1885. Australian colonies passed similar laws.","whyNot":{"A":"Britain welcomed Chinese workers and merchants in colonies such as Singapore and Malaya.","C":"Campbell describes limits set by the countries that received Chinese migrants. Choice C is about China's own policy, not a limit set by those countries.","D":"Chinese contract workers in Peru had few rights and were often badly abused."},"hint":"Campbell names three English-speaking places. Which choice describes one of them?"},{"id":"U6-P40","set":"P14","topic":"6.6","lo":"F","skill":"3.A","difficulty":"easy","stem":"Which of the following is best supported by the chart?","options":{"A":"Immigration to the Americas fell sharply in the 1880s and recovered in the 1890s.","B":"Immigration in 1861–1865 was about twice as high as in 1856–1860.","C":"Yearly immigration to the Americas was much higher in the 1880s than in the 1840s.","D":"The highest yearly average shown came in the period 1896–1900."},"answer":"C","explanation":"In 1841–1845 about 138,000 immigrants arrived each year. In the 1880s the average was 650,000 to 710,000 a year, roughly five times as many.","whyNot":{"A":"The bars are tallest in the 1880s. They are lower in the 1890s.","B":"The two bars are almost the same height, about 213,000 and 207,000.","D":"The highest bar is 1886–90, at about 709,000. The bar for 1896–1900 is lower."},"hint":"Compare the bar for 1841–45 with the bars for the 1880s."},{"id":"U6-P41","set":"P14","topic":"6.6","lo":"F","skill":"5.B","difficulty":"medium","stem":"The rise in immigration to the Americas after 1880 shown in the chart was caused mainly by","options":{"A":"the end of the U.S. Civil War, which reopened the American South to immigrants","B":"the arrival of large numbers of Chinese contract workers in the United States","C":"the opening of the Panama Canal, which made the voyage to South America faster","D":"population growth and rural poverty in Europe, combined with cheaper steamship travel"},"answer":"D","explanation":"Europe's population was growing fast. Many peasants lost land or work as farming changed. Steamships made the trip faster and cheaper. So millions left for jobs in the United States, Argentina, Brazil, and Canada.","whyNot":{"A":"The Civil War ended in 1865. That helps explain the rise in 1866–70, not the bigger jump after 1880.","B":"The United States banned Chinese laborers in 1882. Most of the rise came from European migrants.","C":"The Panama Canal did not open until 1914, long after this rise."},"hint":"Think about both sides of the ocean. What pushed people out of Europe, and what made the trip easier?","reasoning":"Causation"},{"id":"U6-P42","set":"P14","topic":"6.7","lo":"H","skill":"5.B","difficulty":"easy","stem":"Which of the following was a common result of the migration shown in the chart?","options":{"A":"Immigrants to the Americas came mostly from Asia rather than from Europe.","B":"Many immigrants formed ethnic neighborhoods in cities such as New York and Buenos Aires.","C":"Immigrants gave up their home languages and customs within a few years of arriving.","D":"Nativist movements in the United States faded as more immigrants arrived."},"answer":"B","explanation":"Newcomers often settled near people from their home country or region. Neighborhoods like Little Italy in New York and La Boca in Buenos Aires had their own churches, newspapers, and shops.","whyNot":{"A":"Most immigrants to the Americas in these years came from Europe, especially Italy, Germany, Ireland, and eastern Europe.","C":"Many immigrants kept their languages, religions, and customs, often in their own neighborhoods.","D":"Nativist groups grew stronger. Some pushed for limits on immigrants, such as the Chinese Exclusion Act of 1882."},"hint":"Where did many newcomers choose to live, and why?","reasoning":"Causation"},{"id":"U6-P43","set":"P15","topic":"6.7","lo":"H","skill":"3.C","difficulty":"easy","stem":"In Source 2, the example of the young man who wants to become a lawyer refers to which part of Source 1?","options":{"A":"the ten-year halt on the entry of Chinese laborers","B":"Section 14's ban on Chinese immigrants becoming citizens","C":"the definition of \"Chinese laborers\" in Section 15","D":"the preamble's claim that Chinese laborers endanger \"good order\""},"answer":"B","explanation":"Section 14 says no court \"shall admit Chinese to citizenship.\" Courts were where immigrants became citizens. So a Chinese immigrant could not become a citizen. The writer says that is why he cannot become a lawyer, even after an American education.","whyNot":{"A":"The young man came \"when a lad\" and already lives in the United States. The entry ban is not his problem.","C":"Section 15 defines laborers. The young man's problem is that he cannot become a citizen.","D":"The writer does not answer the preamble's claim in this example."},"hint":"Why does the writer say the young man \"cannot be a lawyer\"?","reasoning":"Comparison"},{"id":"U6-P44","set":"P15","topic":"6.7","lo":"H","skill":"4.B","difficulty":"medium","stem":"Source 1 was passed most directly in response to","options":{"A":"a sharp drop in Chinese immigration after the California Gold Rush came to an end","B":"a request from the Qing government that the United States stop its people from leaving China","C":"railway companies' demands for laws that would keep Chinese workers on their construction crews in the West","D":"anti-Chinese campaigns by white workers in the western United States who blamed Chinese for low wages"},"answer":"D","explanation":"Times were hard in the 1870s. White workers' groups in California blamed Chinese immigrants for taking jobs and lowering wages. Politicians answered with the 1882 law.","whyNot":{"A":"Chinese immigration grew in the 1860s and 1870s as Chinese workers built railways and worked in mines and on farms.","B":"In 1880 the Qing agreed to let the United States limit Chinese laborers, but they did not ask for a ban.","C":"Railway companies had hired Chinese workers and did not lead the push for exclusion."},"hint":"The preamble says the coming of Chinese laborers \"endangers the good order of certain localities.\" Who in those places was demanding action?","reasoning":"Causation"},{"id":"U6-P45","set":"P15","topic":"6.7","lo":"H","skill":"5.A","difficulty":"medium","stem":"Source 1 is most similar to which of the following?","options":{"A":"Britain's use of Indian indentured workers on Caribbean plantations","B":"Argentina's offer of paid passages to attract European immigrants","C":"laws in Australian colonies that restricted immigration from China","D":"Japan's agreement to send contract farm workers to Hawaii"},"answer":"C","explanation":"Australian colonies also passed laws in the 1880s to keep out Chinese immigrants. After 1901, the new nation of Australia kept this \"White Australia\" policy.","whyNot":{"A":"Indenture brought Asian workers into a colony. Source 1 kept Chinese laborers out.","B":"Argentina tried to attract immigrants, while Source 1 shut a group out.","D":"Japan helped its people go abroad to work. Source 1 blocked people from coming in."},"hint":"Focus on the purpose of Source 1. Then check the purpose of each choice.","reasoning":"Comparison"},{"id":"U6-P46","set":"P16","topic":"6.8","lo":"I","skill":"3.A","difficulty":"medium","stem":"Naoroji's main argument in the passage is that","options":{"A":"British rule harmed India mainly by ending traditional customs such as sati","B":"India would be better off if Britain sent more British officials to govern it","C":"India's poverty came mainly from the customs and rulers it had before 1750","D":"British rule brought India some benefits, but its costs were greater"},"answer":"D","explanation":"Naoroji first lists benefits. These include the end of sati, English schools, and law and order. Then he names the costs. He says the \"drain\" of nearly £30 million a year or more and the loss of jobs outweigh the benefits.","whyNot":{"A":"Naoroji praises the end of sati as a benefit.","B":"Naoroji says the opposite. Each extra European official pushes out an Indian who could do the job.","C":"Naoroji blames the \"present system\" of British rule, not India's earlier rulers."},"hint":"Naoroji gives two lists. How does he weigh one against the other?"},{"id":"U6-P47","set":"P16","topic":"6.8","lo":"I","skill":"2.B","difficulty":"hard","stem":"Naoroji's praise of British education and law in the first paragraph was most likely meant to","options":{"A":"show British readers that he judged fairly before criticizing their rule","B":"show Indian readers that protest against British rule was no longer needed","C":"argue that British reforms had already ended poverty in India","D":"persuade Indian princes to support British rule in return for honors"},"answer":"A","explanation":"Naoroji wrote in English and had served in Parliament. He was speaking to British readers. By admitting the benefits first, he seemed fair. That made his charge that British rule was \"un-British\" harder to brush aside.","whyNot":{"B":"Naoroji goes on to protest the \"drain\" and the loss of jobs. He clearly thought protest was still needed.","C":"Naoroji's book is about India's poverty. He calls the drain \"impoverishing,\" which means it was making India poorer.","D":"Naoroji writes about the Indian people as a whole and the costs of British rule, not about rewards for princes."},"hint":"Who was Naoroji trying to convince? Why might a writer start with praise?"},{"id":"U6-P48","set":"P16","topic":"6.8","lo":"I","skill":"3.D","difficulty":"medium","stem":"Which of the following, if true, would most directly support Naoroji's argument about the \"drain\"?","options":{"A":"New universities opened in Bombay, Calcutta, and Madras in 1857, teaching in the English language.","B":"Taxes collected from Indians covered the salaries and pensions of British officials living in Britain.","C":"British courts in India followed written codes of law that applied across the colony.","D":"Indian merchants traded with East Africa and Southeast Asia across the Indian Ocean."},"answer":"B","explanation":"Naoroji's \"drain\" meant wealth leaving India and not coming back. Payments to Britain for officials' pay, pensions, and other costs were a big part of it. They were called the \"Home Charges.\"","whyNot":{"A":"New universities fit Naoroji's list of benefits. They do not show wealth leaving India.","C":"Written law codes fit his praise of \"law and order.\" They do not show wealth leaving India.","D":"Indian Ocean trade by Indian merchants does not show wealth being drained to Britain."},"hint":"Naoroji's \"drain\" means wealth leaving India and not coming back. Test each choice: does it show that?"}],"exam":{"title":"Unit 6 Practice Exam: Consequences of Industrialization","timeMinutes":25,"questionCount":25,"directions":"Each set of questions refers to a source: a primary source, a historian's writing, an image, or data. For each question, choose the best answer. Use the source and your knowledge of world history from c. 1750 to c. 1900. There is no penalty for guessing. Some sources use historical labels or insulting descriptions of other peoples and religions; these words show the writers' views.","questions":[{"id":"U6-E01","set":"X1","topic":"6.1","lo":"A","skill":"1.B","difficulty":"easy","stem":"Kipling's poem most directly expresses which justification for imperialism?","options":{"A":"Nations had to fight rivals for colonies because stronger races would replace weaker ones in a struggle.","B":"Western nations had a duty to govern and improve peoples they considered less civilized.","C":"Industrial nations needed colonies as markets for their extra factory goods.","D":"Colonies were needed as naval bases and coaling stations to protect sea trade."},"answer":"B","rationales":{"A":"Incorrect. That is Social Darwinism. Kipling describes thankless service, not a struggle in which weaker peoples die out.","B":"Correct. The poem calls empire a hard duty to \"serve your captives' need.\"","C":"Incorrect. Kipling says colonizers work \"to seek another's profit,\" not their own.","D":"Incorrect. The poem says nothing about ships, bases, or trade routes."},"explanation":"Kipling calls empire a \"burden\" that colonizers carry for others. He claims they end famine, cure sickness, and lead people \"toward the light.\" This idea is called the civilizing mission."},{"id":"U6-E02","set":"X1","topic":"6.2","lo":"B","skill":"4.A","difficulty":"hard","stem":"When the poem was first published in 1899, it was most likely addressed to","options":{"A":"Americans debating whether to rule the Philippines after the Spanish-American War","B":"British leaders deciding whether to take over India from the East India Company","C":"German leaders preparing to claim colonies in Africa after the Berlin Conference","D":"British leaders deciding whether to go to war with the Boer republics in South Africa"},"answer":"A","rationales":{"A":"Correct. The United States took the Philippines from Spain in 1898, and Americans were arguing over whether to keep them.","B":"Incorrect. The British Crown took over India in 1858, about 40 years before the poem.","C":"Incorrect. Germany claimed its African colonies in the 1880s. The poem speaks of \"new-caught\" peoples in 1899.","D":"Incorrect. The poem is about ruling newly conquered peoples, not a war against other white settlers. The Boer War also began later, in October 1899."},"explanation":"Filipinos fought against U.S. rule from 1899 to about 1902. Kipling's poem urged Americans to keep the islands and rule their \"new-caught\" peoples. Its subtitle was \"The United States and the Philippine Islands.\"","reasoning":"Causation"},{"id":"U6-E03","set":"X1","topic":"6.1","lo":"A","skill":"3.D","difficulty":"hard","stem":"Which of the following, if true, would most directly challenge Kipling's claim that colonizers worked \"To seek another's profit, / And work another's gain\"?","options":{"A":"Missionaries in many colonies opened schools and hospitals that served local people free of charge.","B":"Colonial governments often forced local people to grow crops or gather rubber for European firms.","C":"Many European soldiers and officials in Africa and Asia died of tropical diseases.","D":"Colonized peoples in the Philippines and elsewhere fought against foreign rule."},"answer":"B","rationales":{"A":"Incorrect. Schools and hospitals fit Kipling's picture of colonizers serving others.","B":"Correct. Forced labor that made European companies rich shows colonizers seeking their own profit.","C":"Incorrect. Deaths from disease fit Kipling's claim that empire was a costly burden for colonizers.","D":"Incorrect. Resistance fits Kipling's warning about \"the hate of those ye guard.\" It does not show who profited."},"explanation":"Kipling says colonizers worked for other people's good. Evidence that colonies made Europeans rich at local people's cost would challenge him. Forced crops in Java and forced rubber work in the Congo are examples."},{"id":"U6-E04","set":"X2","topic":"6.5","lo":"E","skill":"2.B","difficulty":"easy","stem":"Lin's main purpose in writing the letter was to","options":{"A":"announce that China would stop selling tea and silk to British merchants","B":"ask Britain to pay China for the opium that Qing officials had destroyed","C":"persuade the British ruler to stop British merchants from selling opium in China","D":"invite British merchants to trade at more Chinese ports in exchange for peace"},"answer":"C","rationales":{"A":"Incorrect. Lin hints that China could hold back its tea and rhubarb, but he does not announce a cutoff. His main request is that the queen stop the opium trade.","B":"Incorrect. It was Britain that later made China pay for the destroyed opium, in the Treaty of Nanjing.","C":"Correct. Lin asks the queen to stop the trade and to have the opium plant pulled up in her Indian lands.","D":"Incorrect. Lin wants foreigners to obey Chinese law. He does not offer them more ports."},"explanation":"Lin asks the queen to stop British merchants from selling this \"poisonous drug\" in China. He also asks her to have the opium plant in India \"plucked up by the very root.\""},{"id":"U6-E05","set":"X2","topic":"6.5","lo":"E","skill":"4.B","difficulty":"medium","stem":"The trade Lin describes is best understood in the context of","options":{"A":"a growing flow of silver from Britain into China that was making the Qing rich","B":"Britain's ban on Chinese tea to protect tea grown on plantations in India","C":"British efforts to pay for Chinese tea with opium that was grown in British-ruled India","D":"a Qing policy of trading tea for large amounts of British factory goods"},"answer":"C","rationales":{"A":"Incorrect. Before about 1820, silver flowed into China to pay for tea. By the 1830s opium sales had reversed the flow, and silver was leaving China.","B":"Incorrect. Britain kept buying huge amounts of Chinese tea. Tea from India did not compete seriously until later in the 1800s.","C":"Correct. Lin notes that the opium came from British-ruled India. Money from selling it in China helped British traders pay for tea, so they shipped less silver from Britain.","D":"Incorrect. China bought few British factory goods in the 1830s. That is why British traders turned to opium."},"explanation":"Britain bought huge amounts of Chinese tea, but China bought few British goods. Indian farmers grew opium under an East India Company monopoly. Private traders smuggled it into China. Silver from opium sales then helped pay for tea, and silver flowed out of China.","reasoning":"Causation"},{"id":"U6-E06","set":"X2","topic":"6.5","lo":"E","skill":"3.B","difficulty":"medium","stem":"In the second paragraph, Lin supports his argument mainly by","options":{"A":"repeating the proposal of some Qing officials to make opium legal and tax it","B":"arguing that China needs British goods as much as Britain needs Chinese tea","C":"offering lower taxes on British cotton cloth if the opium trade comes to an end","D":"claiming that Britain bans opium at home while its own merchants sell it in China"},"answer":"D","rationales":{"A":"Incorrect. Some Qing officials had suggested making opium legal, but Lin wants it banned.","B":"Incorrect. Lin says foreign countries could not \"exist a single day\" without China's tea and rhubarb. He presents Britain as depending on China, not the reverse.","C":"Incorrect. Lin offers no deal on taxes. He appeals to the queen's sense of fairness.","D":"Correct. Lin says opium is \"prohibited with the utmost strictness\" in Britain and uses this claim to show that the British know it is harmful."},"explanation":"Lin claims that opium \"is prohibited with the utmost strictness\" in Britain. In fact, opium was legal and sold openly in Britain at the time. Lin uses his claim to argue that the British know opium is harmful and should not send it to China."},{"id":"U6-E07","set":"X3","topic":"6.2","lo":"B","skill":"4.B","difficulty":"easy","stem":"The cartoon best reflects which development of the late 1800s?","options":{"A":"the rapid partition of Africa among European powers","B":"the abolition of slavery across the British Empire in the 1830s","C":"the opening of the Suez Canal, which shortened the sea route from Britain to India","D":"Portugal's success in building a colony that stretched across southern Africa"},"answer":"A","rationales":{"A":"Correct. Rhodes's giant body spanning Africa from south to north reflects the scramble for African land.","B":"Incorrect. Britain ended slavery in its empire in the 1830s, decades before this 1892 cartoon. The cartoon shows a man claiming land across a map.","C":"Incorrect. The Suez Canal opened in 1869 and mattered for the sea route to India. The cartoon shows a man claiming the whole length of Africa by land.","D":"Incorrect. Portugal hoped to link Angola and Mozambique, but Britain blocked the plan in 1890."},"explanation":"From the 1880s to 1914, European powers took over almost all of Africa. The cartoon shows Rhodes stretched from Africa's southern tip to its far north. It is as if Britain could claim the whole length of the continent.","reasoning":"Causation"},{"id":"U6-E08","set":"X3","topic":"6.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"The cartoon most directly illustrates which feature of British expansion in Africa?","options":{"A":"Businessmen and chartered companies often led the way in taking land.","B":"British officials in London planned new colonies first, and traders and settlers followed later.","C":"Britain kept to coastal trading posts and left the interior to African rulers.","D":"British settlers in southern Africa tried to stop expansion to the north."},"answer":"A","rationales":{"A":"Correct. Rhodes was a mining businessman whose chartered company conquered land in Africa.","B":"Incorrect. Britain often followed its traders, companies, and settlers. Rhodes acted first, and the government backed him later.","C":"Incorrect. The cartoon shows Rhodes striding over the whole continent, not just the coast. His company conquered lands far inland.","D":"Incorrect. Settler leaders such as Rhodes pushed hardest for expansion to the north."},"explanation":"Rhodes made a fortune in diamonds. His British South Africa Company got a royal charter in 1889. It conquered the lands later called Rhodesia. Rhodes was also prime minister of the Cape Colony, so he held business and government power at once."},{"id":"U6-E09","set":"X3","topic":"6.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"Expansion led by Rhodes in the 1890s most directly contributed to","options":{"A":"a decline in mining in southern Africa as investors moved their money north","B":"wars with African peoples, such as the Ndebele, in the lands later called Rhodesia","C":"the end of British rule in Egypt, which blocked the Cape-to-Cairo plan","D":"an alliance between Britain and the Boer republics to divide the lands north of the Limpopo River"},"answer":"B","rationales":{"A":"Incorrect. Diamond and gold mining in southern Africa grew quickly in the 1880s and 1890s.","B":"Correct. Rhodes's company fought the Ndebele in 1893. It fought Ndebele and Shona risings again in 1896–1897.","C":"Incorrect. Britain kept control of Egypt into the 1900s.","D":"Incorrect. Relations with the Boers grew worse. Rhodes backed a failed raid on the Transvaal in 1895, and war followed in 1899."},"explanation":"In 1890 the company sent armed settlers into Shona lands. Its troops used machine guns against the Ndebele in 1893. The 1896–1897 rising is often called the First Chimurenga, a Shona word for \"struggle.\" The conquered lands were named Rhodesia after Rhodes.","reasoning":"Causation"},{"id":"U6-E10","set":"X4","topic":"6.8","lo":"I","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Hobson says imperialism helps British workers, while Lugard says it harms them.","B":"Hobson blames politicians' ambitions for imperialism, while Lugard blames groups of financiers.","C":"Hobson writes about British families settling abroad, while Lugard writes about trade.","D":"Hobson says empire mainly enriches investors, while Lugard says it benefits both Europeans and Africans."},"answer":"D","rationales":{"A":"Incorrect. Hobson says imperialism costs \"the tax-payer\" and the nation. Lugard says Europe's \"industrial classes\" benefit.","B":"Incorrect. Lugard says British Africa was not acquired \"by groups of financiers.\" It is Hobson who points to investors.","C":"Incorrect. Hobson's excerpt is about investors, wars, and costs, not settlement.","D":"Correct. Hobson points to investors, while Lugard describes a \"dual mandate\" that helps both sides."},"explanation":"Hobson asks \"Cui bono?\" (\"Who benefits?\") and answers \"The investor.\" Lugard says Europe is in Africa \"for the mutual benefit\" of its own industries and of Africans.","reasoning":"Comparison"},{"id":"U6-E11","set":"X4","topic":"6.8","lo":"I","skill":"2.C","difficulty":"medium","stem":"Lugard's argument in Source 2 is most likely shaped by","options":{"A":"his belief, shared by many missionaries, that the main purpose of empire was to spread Christianity","B":"his career as a colonial governor whose work in Africa the book defends","C":"his agreement with economists such as Hobson that empire mainly served investors","D":"his years as a soldier, which led him to present conquest as the main source of progress"},"answer":"B","rationales":{"A":"Incorrect. Lugard's excerpt does not mention religion. He stresses railways, trade, and government.","B":"Correct. As a former governor, Lugard had a personal stake in showing that British rule did good.","C":"Incorrect. Lugard says British Africa was not acquired \"by groups of financiers.\" That is the opposite of Hobson's view.","D":"Incorrect. Lugard was a soldier, but this excerpt praises railways, trade, and the end of the slave trade, not conquest."},"explanation":"Lugard had helped build British rule in Uganda and Nigeria. Writing in 1922, he had reasons to show that this rule was fair and helpful, so he stresses railways, trade, and the end of the slave trade."},{"id":"U6-E12","set":"X4","topic":"6.5","lo":"E","skill":"3.D","difficulty":"hard","stem":"Hobson's argument in Source 1 is best illustrated by which development?","options":{"A":"Britain's occupation of Egypt in 1882 after Egypt fell behind on its debts to European lenders","B":"Britain's abolition of slavery in its colonies in 1833 after a long public campaign by reformers","C":"the settlement of British farmers in New Zealand after the Treaty of Waitangi in 1840","D":"Japan's government-led effort to build modern industries in the 1870s and 1880s"},"answer":"A","rationales":{"A":"Correct. Hobson argues that investors push governments to protect their money abroad, as happened in Egypt.","B":"Incorrect. Ending slavery came from a campaign to help enslaved people. It was not about investors asking the government to protect their money.","C":"Incorrect. Settlement could involve investors, but this choice does not show a government acting to protect money lent abroad.","D":"Incorrect. Japan's industrial growth was led by its own government, not by foreign investors."},"explanation":"Egypt borrowed heavily from European lenders. When it could not repay, Britain and France took over its money matters. In 1882 Britain occupied Egypt. Hobson saw this as a government protecting investors."},{"id":"U6-E13","set":"X4","topic":"6.8","lo":"I","skill":"3.D","difficulty":"medium","stem":"Which of the following, if true, would most directly challenge Lugard's claim that British rule in Africa served the \"mutual benefit\" of Europeans and Africans?","options":{"A":"British engineers built railways linking the ports of Nigeria and the Gold Coast to farming areas inland.","B":"British laws in its African colonies banned the buying and selling of enslaved people.","C":"Cash taxes pushed many Africans to work for low wages or to grow export crops instead of food.","D":"Exports of cotton and cocoa from Britain's African colonies grew in the early 1900s."},"answer":"C","rationales":{"A":"Incorrect. New railways support Lugard's claim about \"railways and roads.\"","B":"Incorrect. Laws against the slave trade support Lugard's claim that Britain ended \"the slave-trade.\"","C":"Correct. If taxes pushed Africans into low-paid work, or into growing export crops instead of food, much of the gain went to Europeans rather than to Africans.","D":"Incorrect. Growing exports fit Lugard's claim that trade grew. They do not show whether Africans shared in the gains."},"explanation":"Lugard says British rule brought \"mutual benefit\" to Europeans and Africans. If taxes pushed many Africans into low-paid work, or into growing export crops instead of food, much of the gain went to Europeans. That would challenge his claim."},{"id":"U6-E14","set":"X5","topic":"6.4","lo":"D","skill":"3.A","difficulty":"easy","stem":"Which of the following is best supported by the chart?","options":{"A":"Europe brought in more cotton from these four sources in 1864 than in 1860.","B":"Cotton from India and Egypt partly made up for the loss of U.S. cotton.","C":"Brazil was the largest of the four sources of cotton for Europe in 1864.","D":"Cotton from Egypt fell between 1860 and 1864."},"answer":"B","rationales":{"A":"Incorrect. The four sources gave about 4.8 million bales in 1860 but only about 2.2 million in 1864.","B":"Correct. As cotton from the United States almost disappeared, cotton from India and Egypt rose sharply.","C":"Incorrect. India was the largest source in 1864, with about 1.4 million bales. Brazil sent 127,000.","D":"Incorrect. Egypt's cotton rose from 135,000 bales to 427,000."},"explanation":"Cotton from the United States fell from about 4.1 million bales to about 241,000. At the same time, India's rose from 552,000 to almost 1.4 million, and Egypt's rose from 135,000 to 427,000."},{"id":"U6-E15","set":"X5","topic":"6.4","lo":"D","skill":"5.B","difficulty":"medium","stem":"The change in cotton from the United States between 1860 and 1864 was caused mainly by","options":{"A":"a sharp drop in Europe's demand for cotton cloth","B":"a British ban on goods produced by enslaved people","C":"the Civil War and the Union navy's blockade of Southern ports","D":"the spread of the boll weevil, an insect that ate Southern cotton"},"answer":"C","rationales":{"A":"Incorrect. European mills wanted cotton badly, and prices soared. The problem was supply, not demand.","B":"Incorrect. Britain did not ban slave-grown cotton. Its mills used it until the war cut off supply.","C":"Correct. The war and the blockade cut off most cotton shipments from the South.","D":"Incorrect. The boll weevil did not reach the United States until the 1890s."},"explanation":"During the U.S. Civil War (1861–1865), the Union blockaded Southern ports, and the Confederacy at first held back cotton to pressure Britain. Shipments to Europe almost stopped.","reasoning":"Causation"},{"id":"U6-E16","set":"X5","topic":"6.4","lo":"D","skill":"1.B","difficulty":"medium","stem":"The changes in Europe's sources of cotton shown in the chart best illustrate which feature of the global economy in the 1800s?","options":{"A":"Colonies in Asia and Africa built their own cotton mills to compete with Britain.","B":"European mills stopped using cotton and switched to wool and linen when U.S. cotton was cut off.","C":"European countries refused to buy cotton from lands that they did not rule as colonies.","D":"Industrial countries depended on several regions of the world for factory raw materials."},"answer":"D","rationales":{"A":"Incorrect. The chart shows raw cotton arriving in Europe. It gives no figures for cotton mills in India or Egypt.","B":"Incorrect. Europe still brought in about 2.2 million bales from these four sources in 1864. The mills kept using cotton and changed suppliers.","C":"Incorrect. In 1864 Europe still bought cotton from places it did not rule, such as Egypt, Brazil, and the United States.","D":"Correct. European mills needed raw cotton from abroad and switched suppliers when one source failed."},"explanation":"Europe's mills could not grow their own cotton. When the U.S. Civil War cut off American cotton, the mills bought more from India and Egypt. This shows that industrial countries depended on raw materials from many parts of the world.","reasoning":"Continuity and Change"},{"id":"U6-E17","set":"X6","topic":"6.3","lo":"C","skill":"4.B","difficulty":"medium","stem":"The cattle-killing movement described in the passage arose most directly in the context of","options":{"A":"British expansion onto Xhosa land after a series of frontier wars","B":"the Zulu kingdom's conquest of the Xhosa under the ruler Shaka","C":"the Boers' Great Trek into the lands north of the Orange River","D":"the discovery of diamonds in the hills of the Xhosa homeland"},"answer":"A","rationales":{"A":"Correct. The spirits promised to drive \"the English from the land,\" which shows that British expansion was the key context.","B":"Incorrect. Shaka's wars of the 1820s changed southern Africa, but the Zulu did not conquer the Xhosa. The passage names the English as the enemy.","C":"Incorrect. The Great Trek of the 1830s took Boers north, away from the Xhosa frontier. The passage is about the British.","D":"Incorrect. Diamonds were first found in 1867, far to the northwest, about ten years after these events."},"explanation":"Britain had fought several wars against the Xhosa. In 1847 it turned part of their land into British Kaffraria. Lost land, lost wars, and cattle disease set the stage for Nongqause's prophecy.","reasoning":"Causation"},{"id":"U6-E18","set":"X6","topic":"6.3","lo":"C","skill":"2.C","difficulty":"hard","stem":"Theal's claim that some leaders planned the movement \"solely for purposes of war\" is best explained by","options":{"A":"his interviews with Xhosa survivors who described the leaders' war plans","B":"his point of view, which sided with the colonists against the Xhosa chiefs","C":"his sympathy for the Xhosa chiefs, whom he wanted to defend against British critics","D":"his use of written war plans that the Xhosa chief Kreli had signed"},"answer":"B","rationales":{"A":"Incorrect. Theal names no Xhosa witnesses. He repeats what \"many of the colonists suspected.\"","B":"Correct. Theal took the colonists' side. He repeats what \"many of the colonists suspected\" and calls the believers' actions \"superstition.\"","C":"Incorrect. Theal's words, such as \"superstition\" and \"instigator,\" show little sympathy for the chiefs.","D":"Incorrect. Theal points to no written plans. He relies on what colonists suspected."},"explanation":"Theal worked for the Cape Colony's government and took the colonists' side. Historians today have found little proof that the chiefs planned a war. They think the movement grew out of lost land, cattle disease, and despair."},{"id":"U6-E19","set":"X6","topic":"6.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"Which of the following was a result of the events described in the passage?","options":{"A":"Xhosa chiefs signed a treaty that made the Kei River a permanent border closed to settlers.","B":"Britain gave up British Kaffraria and pulled its troops back from the eastern frontier of the Cape.","C":"Xhosa chiefs gained new power by leading a successful war against the colony.","D":"Famine pushed many Xhosa survivors into work in the Cape Colony, and settlers took Xhosa land."},"answer":"D","rationales":{"A":"Incorrect. No such treaty was made. Colonial officials took more Xhosa land after the famine and gave it to settlers.","B":"Incorrect. Britain kept British Kaffraria and joined it to the Cape Colony in 1866.","C":"Incorrect. The famine weakened many chiefdoms, and no successful war followed. Xhosa resistance to the colony went on later, as in the war of 1877–1878.","D":"Correct. The famine weakened Xhosa communities. Colonial officials pushed survivors into colonial labor and gave their land to settlers."},"explanation":"Tens of thousands of Xhosa died. Survivors fled into the colony looking for food, and many were sent to work for white farmers. The colonial government then settled Europeans on Xhosa land.","reasoning":"Causation"},{"id":"U6-E20","set":"X7","topic":"6.6","lo":"F","skill":"5.B","difficulty":"easy","stem":"The \"Irish Exodus\" of 1847 and 1848 was caused most directly by","options":{"A":"British laws that banned Irish Catholics from owning land","B":"the closing of Ireland's linen factories by British competitors","C":"American railway companies' offers of free passage to Irish workers","D":"a famine that followed a disease that destroyed the potato crop"},"answer":"D","rationales":{"A":"Incorrect. Most laws that kept Catholics from owning land had ended by the 1790s. The disaster of the 1840s was a famine.","B":"Incorrect. Ireland's linen industry around Belfast was growing. Most people who fled in 1847 were poor farm families.","C":"Incorrect. Few emigrants got free passage. Maguire calls the departure a \"blind and desperate rush.\"","D":"Correct. The potato blight caused the Great Famine, which drove the desperate emigration Maguire describes."},"explanation":"From 1845 to 1852, a plant disease ruined Ireland's potato crops. About one million people died. More than a million left, mostly for North America.","reasoning":"Causation"},{"id":"U6-E21","set":"X7","topic":"6.7","lo":"H","skill":"3.D","difficulty":"hard","stem":"Maguire's description of who sent money home could best be used to qualify which claim about migration in the 1800s?","options":{"A":"Most migrants were men, while women stayed behind in their home societies.","B":"Many migrants kept close ties with their families in their homelands.","C":"Migrants often paid for relatives to join them in
