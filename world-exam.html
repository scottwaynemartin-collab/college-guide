<html lang="en">

<title>AP Practice Exam · AP World History: Modern · World Compass</title>

<style>/* ===================================================================
   World Compass · AP Practice Exam (AP World History: Modern)
   Tokens first (light, then html.dm dark), then components, then the
   World Compass theme layer and the source (passage/image) styles.
   =================================================================== */
:root{
  --navy:#1E2761;--navy-2:#2B3780;--gold:#C9A227;--gold-ink:#866C1A;--gold-2:#E3C464;--gold-soft:#F6EBC4;
  --paper:#F4F5F9;--paper-2:#EBEDF4;--card:#FFFFFF;
  --ink:#1A1D2E;--ink-2:#4A4F68;--ink-3:#61667D;
  --line:#D8DBE6;--line-2:#C3C8D9;
  --l1:#1E2761;--l1-soft:#E8EAF4;--l1-deep:#1E2761;
  --l2:#C9A227;--l2-soft:#F6EBC4;--l2-deep:#866C1A;
  --l3:#7E2433;--l3-soft:#F6E7E9;--l3-deep:#7E2433;
  --sun:#C9A227;--sun-soft:#F6EBC4;--mint:#0F6E6A;--mint-soft:#E1F1F0;--pink:#7E2433;--pink-soft:#F6E7E9;
  --red:#B42318;--red-soft:#FBE9E7;--green:#1E7F4F;--green-soft:#E4F3EA;
  --r:14px;--r-sm:10px;--r-lg:20px;
  --sh:0 1px 2px rgba(30,39,97,.06),0 6px 18px rgba(30,39,97,.08);
  --sh-lg:0 2px 4px rgba(30,39,97,.10),0 14px 34px rgba(30,39,97,.16);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:Arial,Helvetica,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --green-deep:#17613C;--red-deep:#912018;--amber:#8A5A00;--amber-soft:#FBF0D5;--amber-line:#E7C979;
  --focus:#C9A227;
  /* unit palette: the World Compass home page's unit colors */
  --u1:#7E2433;--u1-soft:#F6E7E9;--u1-deep:#7E2433;
  --u2:#0F6E6A;--u2-soft:#E1F1F0;--u2-deep:#0F6E6A;
  --u3:#1F5E3B;--u3-soft:#E3F0E8;--u3-deep:#1F5E3B;
  --u4:#0F4C81;--u4-soft:#E2ECF6;--u4-deep:#0F4C81;
  --u5:#A4262C;--u5-soft:#F9E6E7;--u5-deep:#A4262C;
  --u6:#9A5B1E;--u6-soft:#F6ECE0;--u6-deep:#8A5019;
  --u7:#3F4A5C;--u7-soft:#E8EAEE;--u7-deep:#3F4A5C;
  --u8:#5B2C83;--u8-soft:#EEE6F5;--u8-deep:#5B2C83;
  --u9:#C2410C;--u9-soft:#FBE9DF;--u9-deep:#A8380A;
  /* stimulus colors */
  --stim-water:#DCE6F3;--stim-land:#EDE6D3;--stim-land-stroke:#B9AF93;--stim-power:#D8D2E6;--stim-small:#FBF7EA;
  --zone-0:#8DB4F0;--zone-1:#ADCAF5;--zone-2:#CDDFF9;--zone-3:#E8F0FD;
  --pc-blue:#CFE0FF;--pc-orange:#FFD9C7;
  --bar-1:#1E2761;--bar-2:#C9A227;--chart-grid:#E3E5EE;
  --claim-a:#0F4C81;--claim-b:#7E2433;--lane:#1A1D2E;--conflict:#B42318;--base-n:#5B2C83;--base-s:#0F6E6A;
  --psg-bg:#FFFFFF;--psg-rule:#C9A227;
}
html.dm{
  --navy:#0B0E22;--navy-2:#1B2046;--gold:#E3C464;--gold-ink:#E3C464;--gold-2:#F0D98C;--gold-soft:#3A3214;
  --paper:#0E1126;--paper-2:#161A36;--card:#171B39;
  --ink:#ECEEF8;--ink-2:#C3C7DE;--ink-3:#9AA0BF;
  --line:#2A3058;--line-2:#3A4170;
  --l1:#E3C464;--l1-soft:#262B52;--l1-deep:#E3C464;
  --l2:#E3C464;--l2-soft:#3A3214;--l2-deep:#F0D98C;
  --l3:#F0A9B4;--l3-soft:#3A1820;--l3-deep:#F0A9B4;
  --sun:#E3C464;--sun-soft:#3A3214;
  --red:#E5534B;--red-soft:#3A1416;--green:#3FB27A;--green-soft:#12301F;
  --green-deep:#8BE0B2;--red-deep:#F6A39D;--amber:#F2C25B;--amber-soft:#3A2E10;--amber-line:#7A6224;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  --sh-lg:0 2px 4px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.45);
  --u1-soft:#3A1820;--u1-deep:#F0A9B4;--u2-soft:#0F3534;--u2-deep:#7FD6CF;--u3-soft:#143524;--u3-deep:#8FD8AE;
  --u4-soft:#102C4A;--u4-deep:#9CC6F0;--u5-soft:#3D1517;--u5-deep:#F4A3A6;--u6-soft:#3A2614;--u6-deep:#E9B98A;
  --u7-soft:#262C38;--u7-deep:#C2CBDB;--u8-soft:#2C1A42;--u8-deep:#CDB2EC;--u9-soft:#3D1E10;--u9-deep:#F6B08E;
  --stim-water:#172B4D;--stim-land:#3A3550;--stim-land-stroke:#6B668A;--stim-power:#3B3560;--stim-small:#2A2548;
  --bar-1:#9CC6F0;--bar-2:#E3C464;--chart-grid:#2A3058;
  --psg-bg:#141833;--psg-rule:#B8962C;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
html,body{margin:0;background:var(--paper)}
body{color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,.disp{font-family:var(--display);font-weight:600;letter-spacing:-.01em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
a{color:var(--l1-deep)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700}
.skip:focus{top:12px}
.app{min-height:100%;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:22px 20px 56px}
@media (max-width:640px){main{padding:14px 14px 48px}}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(251,248,242,.88);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}

.bar-in{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;min-height:60px}
@media (max-width:640px){.bar-in{padding:8px 12px;gap:8px}}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:19px;color:var(--ink);text-align:left;min-height:44px;padding:0 4px;border-radius:12px}
.brand svg{width:32px;height:32px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);line-height:1;margin-bottom:3px}
.brand .bt{line-height:1.05}
.bar-ctx{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-2);font-size:14px;min-width:0}
.bar-ctx{flex:0 1 auto}.bar-ctx .ellip{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sp{flex:1}
.bar-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.brand .bt{display:none}.brand small{display:none}.bar-ctx{font-size:13px}}

/* unit pill used in the bar and cards */
.upill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--uc-soft);color:var(--uc-deep);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.02em;white-space:nowrap}
.upill i{width:8px;height:8px;border-radius:50%;background:var(--uc);display:inline-block}

/* ---------- buttons ---------- */
.act{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;font-weight:700;font-size:15px;line-height:1.2;border:2px solid transparent;transition:transform .12s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;white-space:nowrap;text-decoration:none}
.act:active{transform:translateY(1px)}
.act:disabled{opacity:.45;transform:none}
.act.primary{background:var(--ink);color:#fff;box-shadow:var(--sh)}
.act.primary:hover:not(:disabled){box-shadow:var(--sh-lg);transform:translateY(-1px)}
html.dm .act.primary{background:var(--gold);color:#0E1126}
.act.blue{background:var(--l1);color:#fff;box-shadow:var(--sh)}
.act.blue:hover:not(:disabled){background:var(--l1-deep);transform:translateY(-1px)}
html.dm .act.blue{color:#fff}
.act.unit{background:var(--uc);color:var(--uc-text,#fff);box-shadow:var(--sh)}
.act.unit:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--sh-lg)}
.act.ghost{background:var(--card);color:var(--ink);border-color:var(--line-2)}
.act.ghost:hover:not(:disabled){border-color:var(--ink-3);transform:translateY(-1px)}
.act.soft{background:var(--paper-2);color:var(--ink-2)}
.act.soft:hover:not(:disabled){background:var(--line)}
.act.quiet{background:transparent;color:var(--ink-2);padding:8px 12px;font-weight:700}
.act.quiet:hover:not(:disabled){background:var(--paper-2)}
.act.sm{min-height:40px;padding:8px 14px;font-size:14px}
@media (pointer:coarse),(max-width:899px){.act.sm,.seg button,.tchip{min-height:44px}}
.act.wide{width:100%}
.act .ic{width:18px;height:18px;flex:none}
.act[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts.center{justify-content:center}
.acts.between{justify-content:space-between}
.acts.end{justify-content:flex-end}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:7px;border:1px solid var(--line-2);background:var(--paper-2);font:700 12px/1 var(--mono);color:var(--ink-2)}

/* ---------- surfaces ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
@media (max-width:640px){.panel{padding:16px;border-radius:16px}}
.panel.flat{box-shadow:none}
.eyebrow{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.tag-meta{display:inline-flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.tag-meta b{font-weight:800;color:var(--ink-3)}
.note{font-size:13.5px;color:var(--ink-3);line-height:1.5}

/* ---------- start screen ---------- */
.hero{text-align:center;padding:26px 0 22px;position:relative}
.hero h1{font-size:clamp(34px,6vw,54px);font-weight:600;color:var(--ink);letter-spacing:-.02em}
.hero h1 .gl{background:linear-gradient(90deg,var(--l1),var(--l3) 55%,var(--l2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin:10px auto 0;max-width:620px;font-size:17px;color:var(--ink-2)}
.kpis{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0 6px}
.kpi{display:flex;flex-direction:column;align-items:center;min-width:132px;padding:12px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.kpi .v{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;color:var(--ink)}
.kpi .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}
.ucd{position:relative;min-width:0;display:flex;flex-direction:column;gap:12px;padding:20px 20px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.ucd::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--uc)}
.ucd.live:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.ucd .uh{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ucd .un{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--uc-soft);color:var(--uc-deep);font-family:var(--display);font-weight:600;font-size:18px}
.ucd h3{font-size:21px;line-height:1.15;color:var(--ink)}
.ucd .best{font-size:12.5px;font-weight:800;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.ucd .best .ok{color:var(--green-deep)}
.ucd .ubtns{display:grid;gap:8px;margin-top:auto}
.ucd .ubtns .act{justify-content:space-between;padding:10px 14px;min-width:0;white-space:normal;flex-wrap:wrap;text-align:left;row-gap:2px}
.ucd .ubtns .act small{font-weight:600;font-size:12.5px;opacity:.85;white-space:nowrap}
.ucd.soon{background:var(--paper-2);border-style:dashed;box-shadow:none;opacity:.78}
.ucd.soon::before{opacity:.5}
.ucd.soon .soonpill{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);color:var(--ink-3)}
.resume{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);padding:5px 10px;border-radius:999px}
.how{margin-top:26px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;align-items:stretch}
@media (max-width:860px){.how{grid-template-columns:1fr}}
.how .panel{display:flex;flex-direction:column;gap:8px}
.how h3{font-size:19px}
.how .stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--l1-soft);color:var(--l1-deep);font-family:var(--display);font-weight:600;font-size:15px}
.how p{color:var(--ink-2);font-size:14.5px}
.note-line{margin-top:16px;text-align:center;font-size:13.5px;color:var(--ink-3)}
.foot{padding:22px 20px 26px;text-align:center;font-size:13px;color:var(--ink-3);font-weight:600;border-top:1px solid var(--line)}
.foot a{color:var(--ink-2)}

/* ---------- practice ---------- */
.phead{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.phead h2{font-size:26px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 13px;border-radius:999px;background:var(--card);border:1.5px solid var(--line-2);color:var(--ink-2);font-weight:700;font-size:14px;transition:.15s;text-align:left}
@media (pointer:coarse){.tchip{min-height:44px}}
.tchip:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.tchip .n{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-3);font-size:12px;font-weight:800}
.tchip .id{font-family:var(--display);font-weight:600;color:var(--uc-deep)}
.tchip[aria-pressed="true"]{background:var(--uc-soft);border-color:var(--uc);color:var(--ink)}
.tchip[aria-pressed="true"] .n{background:var(--uc);color:#fff}
.prog{height:10px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.prog > span{display:block;height:100%;width:0;border-radius:999px;background:var(--uc);transition:width .35s ease}
.prog-row{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:800;color:var(--ink-3)}
.prog-row .prog{flex:1}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:24px;max-width:860px;margin:0 auto}
@media (max-width:640px){.qcard{padding:16px;border-radius:16px}}
.stem{font-size:18px;line-height:1.5;color:var(--ink);margin:14px 0 18px;font-weight:500}
.qn{font-family:var(--display);font-weight:600;color:var(--ink-3);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.qn:focus,.qn:focus-visible{outline:none}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;width:100%;min-height:56px;padding:12px 14px;text-align:left;border-radius:14px;border:2px solid var(--line-2);background:var(--card);color:var(--ink);font-size:16px;line-height:1.45;transition:transform .12s,border-color .15s,background .15s,box-shadow .15s}
.opt .ltr{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:17px}
.opt .mk{font-weight:800;font-size:14px;white-space:nowrap;display:none;align-items:center;gap:6px}
.opt:hover:not(:disabled){border-color:var(--uc,var(--ink-3));transform:translateY(-1px);box-shadow:var(--sh)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.6}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ok .ltr{background:var(--green);color:#fff}
.opt.ok .mk{display:inline-flex;color:var(--green-deep)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .ltr{background:var(--red);color:#fff}
.opt.bad .mk{display:inline-flex;color:var(--red-deep)}
@media (max-width:480px){.opt{grid-template-columns:34px 1fr;padding:10px 12px;font-size:15px}.opt .ltr{width:34px;height:34px;font-size:15px}.opt .mk{grid-column:2;justify-self:start}}
.fbk{margin-top:18px;border-radius:16px;padding:16px 18px;border:1.5px solid;display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:start}
.fbk.ok{background:var(--green-soft);border-color:#9ED9B3;color:var(--ink)}
.fbk.bad{background:var(--red-soft);border-color:#F3A7A7;color:var(--ink)}
html.dm .fbk.ok{border-color:#297A41}html.dm .fbk.bad{border-color:#7A2929}
.fbk .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff;font-weight:900;font-size:20px;position:relative}
.fbk.ok .ico{background:var(--green)}
.fbk.bad .ico{background:var(--red)}
.fbk h4{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2;margin-bottom:4px}
.fbk .exp{font-size:16px;line-height:1.55;color:var(--ink)}
.fbk .body{min-width:0}
.whynot{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.5;color:var(--ink-2)}
.whynot b{color:var(--ink)}
html.dm .whynot{background:rgba(255,255,255,.06)}
details.more{margin-top:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);overflow:hidden}
html.dm details.more{background:rgba(255,255,255,.04)}
details.more summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;font-size:14.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-height:44px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-left:2px;flex:none}
details.more[open] summary::before{transform:rotate(45deg)}
details.more .inner{padding:0 14px 14px;display:grid;gap:10px}
.wn{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.wn .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.wn.correct .ltr{background:var(--green);color:#fff}
.pnext{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.pnext .hint{font-size:13px;color:var(--ink-3);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (pointer:coarse){.pnext .hint{display:none}}
/* celebration (practice correct) */
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--c);animation:burst .7s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}}
/* summary */
.sumhead{text-align:center;padding:10px 0 18px}
.sumhead .big{font-family:var(--display);font-weight:600;font-size:54px;line-height:1;color:var(--ink)}
.sumhead .big small{font-size:24px;color:var(--ink-3)}
.sumhead p{color:var(--ink-2);margin-top:6px}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(110px,1.3fr) 2fr auto;align-items:center;gap:12px;font-size:14px}
@media (max-width:560px){.row{grid-template-columns:1fr auto;gap:6px 10px}.row .lbl{grid-row:1}.row .cnt{grid-row:1;grid-column:2}.row .trk{grid-column:1/-1;grid-row:2}}
.row .lbl{font-weight:700;color:var(--ink-2);min-width:0}
.row .lbl b{font-family:var(--display);font-weight:600;color:var(--ink);margin-right:6px}
.row .trk{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.row .trk > span{display:block;height:100%;border-radius:999px;background:var(--green)}
.row .trk > span.mid{background:var(--sun)}
.row .trk > span.low{background:var(--red)}
.row .cnt{font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- exam (calm) ---------- */
.exam main{max-width:1200px}
.xtop{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.xtop-in{max-width:1200px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;min-height:58px}
@media (max-width:640px){.xtop-in{padding:6px 10px;gap:8px}}
.xtop .who{font-weight:700;color:var(--ink-2);font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.xtop .qpos{font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink);white-space:nowrap}
.short{display:none}
@media (max-width:640px){.xtop .who .ellip,.xtop .upill{display:none}.xtop .long{display:none}.xtop .short{display:inline}.xtop .qpos{font-size:17px}.xtop .act.sm{padding:8px 11px}.xtop .timer{padding:0 10px;font-size:16px}.xtop .timer svg{display:none}}
@media (max-width:360px){.xtop .who{display:none}}
.timer{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--paper-2);color:var(--ink);font:700 18px/1 var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums;border:1.5px solid transparent}
.timer svg{width:16px;height:16px}
.timer.warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.timer.crit{background:var(--red-soft);color:var(--red-deep);border-color:#F3A7A7;animation:tick 1s steps(2) infinite}
html.dm .timer.crit{border-color:#7A2929}
@keyframes tick{50%{border-color:var(--red)}}
.xintro{max-width:720px;margin:0 auto;display:grid;gap:18px}
.xintro h2{font-size:30px}
.xintro .facts{display:flex;flex-wrap:wrap;gap:8px}
.xintro .facts span{padding:7px 12px;border-radius:999px;background:var(--paper-2);font-weight:700;font-size:13.5px;color:var(--ink-2)}
.xintro .dir{font-size:16px;line-height:1.6;color:var(--ink);padding:18px 20px;border-left:4px solid var(--ink);background:var(--card);border-radius:0 14px 14px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.xintro ul{margin:0;padding-left:20px;color:var(--ink-2);font-size:15px;display:grid;gap:6px}
.xwrap{display:grid;gap:22px;align-items:start}
.xwrap.has-stim{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.xwrap.has-stim{grid-template-columns:minmax(0,11fr) minmax(0,10fr)}}
.xq{max-width:760px;margin:0 auto;width:100%}
.xwrap.has-stim .xq{margin:0}
.scol{min-width:0}
@media (min-width:900px){.scol .sticky{position:sticky;top:72px;max-height:calc(100vh - 84px);overflow:auto;padding-right:2px}}
.setlabel{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-2);margin-bottom:10px}
.stoggle{display:none}
@media (max-width:899px){.stoggle{display:inline-flex;margin-bottom:10px}.scol.off .stimwrap{display:none}}
.xq .qn{margin-bottom:4px}
.xq .stem{font-size:17.5px;margin:10px 0 18px}
.xopts{display:grid;gap:10px}
.xopt{display:grid;grid-template-columns:36px 1fr;align-items:center;gap:14px;width:100%;min-height:52px;padding:12px 14px;text-align:left;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);font-size:16px;line-height:1.45;transition:border-color .15s,background .15s,box-shadow .15s}
.xopt .ltr{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:15.5px;background:var(--card);transition:.15s}
.xopt:hover{border-color:var(--ink-3)}
.xopt[aria-checked="true"]{border-color:var(--ink);background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--ink)}
.xopt[aria-checked="true"] .ltr{background:var(--ink);border-color:var(--ink);color:var(--card)}
html.dm .xopt[aria-checked="true"]{background:rgba(255,255,255,.06)}
.xnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.xnav .mid{display:flex;gap:8px;flex-wrap:wrap}
.flagged-note{font-size:13px;color:var(--amber);font-weight:800}
/* navigator drawer + modal */
.veil{position:fixed;inset:0;background:rgba(14,17,38,.5);z-index:40;display:flex;justify-content:flex-end;animation:fade .15s ease}
.veil.center{justify-content:center;align-items:center;padding:16px}
@keyframes fade{from{opacity:0}}
.drawer{width:min(380px,92vw);height:100%;background:var(--card);box-shadow:var(--sh-lg);padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.drawer h3{font-size:20px;display:flex;justify-content:space-between;align-items:center}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.navq{position:relative;display:grid;place-items:center;min-height:46px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink-2);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.navq.ans{background:var(--ink);border-color:var(--ink);color:var(--card)}
.navq.cur{box-shadow:0 0 0 3px var(--l1-soft),0 0 0 5px var(--l1)}
.navq.flag::after{content:"⚑";position:absolute;top:-7px;right:-5px;font-size:13px;line-height:1;color:var(--amber);background:var(--card);border-radius:50%;padding:1px 2px}
.navq.flag{border-color:var(--amber-line)}
.navkey{display:grid;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.navkey span{display:flex;align-items:center;gap:8px}
.navkey i{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--card);display:inline-block}
.navkey i.ans{background:var(--ink);border-color:var(--ink)}
.navkey i.flag{border-color:var(--amber);background:var(--amber-soft)}
.sheet{width:min(520px,100%);background:var(--card);border-radius:var(--r);box-shadow:var(--sh-lg);padding:22px;display:grid;gap:14px;animation:rise .18s ease}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.sheet h3{font-size:22px}
.sheet .list{display:grid;gap:8px;font-size:15px;color:var(--ink-2)}
.sheet .list b{color:var(--ink)}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums span{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:9px;background:var(--paper-2);font-weight:800;font-size:13.5px;color:var(--ink-2)}
.nums span.f{background:var(--amber-soft);color:var(--amber)}
/* score report */
.score{max-width:900px;margin:0 auto;display:grid;gap:18px}
.score-hero{text-align:center;padding:26px 20px 22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);position:relative;overflow:hidden}
.score-hero .big{font-family:var(--display);font-weight:600;font-size:72px;line-height:1;color:var(--ink);letter-spacing:-.02em}
.score-hero .big small{font-size:28px;color:var(--ink-3);font-weight:600}
.score-hero .pct{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink-2);margin-top:4px}
.score-hero .sub{margin-top:8px;color:var(--ink-3);font-size:14px;font-weight:600}
.apbadge{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:16px auto 0;padding:12px 22px;border-radius:16px;background:var(--sun-soft);border:1px solid var(--amber-line)}
.apbadge .n{font-family:var(--display);font-weight:600;font-size:36px;line-height:1;color:var(--ink)}
.apbadge .l{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.apbadge .d{font-size:12px;color:var(--ink-3);font-weight:600;max-width:320px;line-height:1.4;margin-top:4px}
.score .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.score .two{grid-template-columns:1fr}}
.score h3{font-size:19px;margin-bottom:12px}
.copybox{display:grid;gap:8px}
.copybox textarea{width:100%;min-height:160px;font:13px/1.45 var(--mono);padding:12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--paper-2);color:var(--ink);resize:vertical}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
/* review */
.review{max-width:900px;margin:0 auto;display:grid;gap:16px}
.rvhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rvhead h2{font-size:26px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line)}
.seg button{min-height:38px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.rv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;border-left-width:5px}
.rv.ok{border-left-color:var(--green)}
.rv.bad{border-left-color:var(--red)}
.rv.skip{border-left-color:var(--line-2)}
@media (max-width:640px){.rv{padding:16px}}
.rv header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rv .rn{font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink)}
.rvb{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-weight:800;font-size:12.5px}
.rvb.ok{background:var(--green-soft);color:var(--green-deep)}
.rvb.bad{background:var(--red-soft);color:var(--red-deep)}
.rvb.skip{background:var(--paper-2);color:var(--ink-3)}
.rv .stem{font-size:16.5px;margin:10px 0 12px}
.rvopts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rvopts li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;font-size:15px;line-height:1.45;color:var(--ink-2);border:1px solid transparent}
.rvopts li .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.rvopts li .mk{display:block;font-size:12.5px;font-weight:800;margin-top:2px}
.rvopts li.is-correct{background:var(--green-soft);border-color:#9ED9B3;color:var(--ink)}
.rvopts li.is-correct .ltr{background:var(--green);color:#fff}
.rvopts li.is-correct .mk{color:var(--green-deep)}
.rvopts li.is-pick{background:var(--red-soft);border-color:#F3A7A7;color:var(--ink)}
.rvopts li.is-pick .ltr{background:var(--red);color:#fff}
.rvopts li.is-pick .mk{color:var(--red-deep)}
html.dm .rvopts li.is-correct{border-color:#297A41}html.dm .rvopts li.is-pick{border-color:#7A2929}
.rv .fbk{margin-top:14px}
.rat{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.rat .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.rat.correct .ltr{background:var(--green);color:#fff}
.rv details.more summary{font-size:14px}
.empty{text-align:center;padding:30px;color:var(--ink-3);font-weight:600}

/* ---------- stimulus ---------- */
.stim{margin:0 0 6px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;display:grid;gap:12px;min-width:0}
.stim>*{min-width:0;max-width:100%}
.exam .stim{border-color:var(--line);box-shadow:none}
.practice .stim{background:var(--paper-2);border-color:transparent}
html.dm .practice .stim{background:rgba(255,255,255,.04)}
.stim-title{font-family:var(--body);text-transform:uppercase;font-weight:800;letter-spacing:.06em;font-size:12.5px;color:var(--ink);line-height:1.45}
.stim-source{font-size:12px;color:var(--ink-3);font-style:italic}
.stim-text,.stim-note,.stim-desc{font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.stim-note{padding:10px 12px;border-radius:10px;background:var(--paper);border:1px dashed var(--line-2)}
html.dm .stim-note{background:rgba(255,255,255,.04)}
.stim.unavail{align-items:center;justify-items:center;text-align:center;padding:22px;border-style:dashed;color:var(--ink-3);font-weight:700}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.stab{border-collapse:collapse;width:100%;min-width:320px;font-size:14px;line-height:1.4}
.stab th,.stab td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.stab thead th{font-weight:800;color:var(--ink);background:var(--paper-2);border-bottom:2px solid var(--line-2);font-size:13px}
.stab tbody th{font-weight:700;color:var(--ink)}
.stab tbody tr:nth-child(even) td,.stab tbody tr:nth-child(even) th{background:var(--paper)}
html.dm .stab tbody tr:nth-child(even) td,html.dm .stab tbody tr:nth-child(even) th{background:rgba(255,255,255,.03)}
.stab td,.stab th{color:var(--ink-2)}
.stab tbody th{color:var(--ink)}
.dresults .stim-title{font-size:13.5px}
/* chart */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2);font-weight:600;align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:7px}
.legend .sw{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.08)}
.legend .sw.s0{background:var(--bar-1)}
.legend .sw.s1{background:var(--bar-2);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)}
.legend svg{width:22px;height:16px;display:block;flex:none}
.chart{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scrollhint{font-size:12px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin:-6px 0 -4px}
.scrollhint::before{content:"↔";font-size:14px}
.chart svg{display:block;width:100%;min-width:460px;height:auto;font-family:var(--body)}
.chart .grid{stroke:var(--chart-grid);stroke-width:1}
.chart .axis{stroke:var(--ink-3);stroke-width:1.2}
.chart .tick,.chart .cat{fill:var(--ink-2);font-size:13px;font-weight:600}
.chart .ylab{fill:var(--ink-3);font-size:12.5px;font-weight:700}
.chart .val{fill:var(--ink);font-size:12.5px;font-weight:800}
.chart .bar.s0{fill:var(--bar-1)}
.chart .bar.s1{fill:var(--bar-2)}
.chart .bar{stroke:none}
/* district maps */
.dplans{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.dplan{margin:0;display:grid;gap:6px;justify-items:center;flex:0 1 250px;max-width:100%}
.dplan svg{width:100%;height:auto;display:block}
.dplan figcaption{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink)}
.dmap .pc{stroke:var(--card);stroke-width:1.5}
.dmap .pc.blue{fill:var(--pc-blue)}
.dmap .pc.orange{fill:var(--pc-orange)}
.dmap .pval{fill:var(--ink);font-size:15px;font-weight:800;font-family:var(--body)}
.dmap .dline{stroke:var(--ink);stroke-width:4;stroke-linecap:square;fill:none}
.legend .sw.pblue{background:var(--pc-blue)}
.legend .sw.porange{background:var(--pc-orange)}
.legend .sw.dline{height:0;border:0;border-top:4px solid var(--ink);border-radius:0;width:18px}
/* schematic maps */
.smap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.smap svg{display:block;width:100%;min-width:560px;height:auto;font-family:var(--body);border-radius:12px;border:1px solid var(--line)}
.smap .water{fill:var(--stim-water)}
.smap .land{fill:var(--stim-land);stroke:var(--stim-land-stroke);stroke-width:1.5}
.smap .land.power{fill:var(--stim-power);stroke:#8E85B0}
.smap .land.small{fill:var(--stim-small);stroke:#9A917A}
html.dm .smap .land.small{stroke:#6B668A}
.smap .island{fill:var(--stim-land);stroke:var(--stim-land-stroke);stroke-width:1.5}
.smap .lbl{fill:var(--ink);font-weight:700;font-size:15px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;font-family:var(--display)}
html.dm .smap .lbl{stroke:#0E1126}
.smap .lbl.big{font-size:19px}
.smap .lbl.sm{font-size:12.5px;font-family:var(--body);font-weight:700}
.smap .sub{fill:var(--ink-2);font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round;text-anchor:middle}
html.dm .smap .sub{stroke:#0E1126}
.smap .zone{stroke:var(--ink-3);stroke-width:1}
.smap .zone.z0{fill:var(--zone-0)}.smap .zone.z1{fill:var(--zone-1)}.smap .zone.z2{fill:var(--zone-2)}.smap .zone.z3{fill:var(--zone-3)}
.smap .hatchline{stroke:var(--ink-2);stroke-width:1.6}
.smap .bracket{stroke:var(--ink);stroke-width:2;fill:none}
.smap .claim.a{fill:var(--claim-a)}
.smap .claim.b{fill:var(--claim-b)}
.smap .claim-hatch{stroke:var(--claim-b);stroke-width:3}
.smap .line{stroke:var(--ink);stroke-width:2;fill:none}
.smap .lane{stroke:var(--lane);stroke-width:3;fill:none}
.smap .conflict{fill:var(--conflict);stroke:#fff;stroke-width:1}
.smap .baseN{fill:var(--base-n);stroke:#fff;stroke-width:1.2}
.smap .baseS{fill:var(--base-s);stroke:#fff;stroke-width:1.2}
.smap .arrow{stroke:var(--ink);stroke-width:3;fill:none}
.smap .arrowhead{fill:var(--ink)}
.smap .scale{stroke:var(--ink);stroke-width:2}
.smap .scalelbl{fill:var(--ink);font-size:12px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:3px}
html.dm .smap .scalelbl{stroke:#0E1126}
.legend .sw.power{background:var(--stim-power)}

/* ---------- Unit 5: ring diagram + house/road symbols ---------- */

html.dm .smap.rings .rcity{fill:#E9E5FF;stroke:#0E1126}html.dm .smap.rings .rcl{fill:#0E1126}

/* ===================================================================

   =================================================================== */
h1,h2,h3{font-weight:700;letter-spacing:-.005em}

a{color:var(--navy-2)}
html.dm a{color:var(--gold-2)}

.bar,.xtop{background:var(--navy);border-bottom:2px solid var(--gold);color:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}

.brand{color:#fff}

.bar-ctx{color:#D9DCF0}
.bar .act.quiet,.xtop .act.quiet{color:#E6E8F6}

.bar .upill,.xtop .upill{background:rgba(255,255,255,.12);color:#fff}

/* buttons */
.act{border-radius:10px}

/* home */
.hero{text-align:left;padding:0;margin:0 0 30px;background:var(--navy);color:#fff;border-radius:var(--r-lg);overflow:hidden;position:relative;box-shadow:var(--sh-lg)}
html.dm .hero{background:#121636;border:1px solid var(--line)}
.hero{background-image:radial-gradient(ellipse 60% 90% at 92% 105%,rgba(201,162,39,.30),rgba(201,162,39,0) 70%)}
html.dm .hero{background-image:radial-gradient(ellipse 60% 90% at 92% 105%,rgba(227,196,100,.16),rgba(227,196,100,0) 70%)}
.hero-in{display:flex;align-items:center;gap:34px;padding:36px 36px 32px;position:relative;z-index:1}
.hero .rose{flex:0 0 132px;width:132px;height:132px}
.hero .rose svg{width:100%;height:100%;display:block}

.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(42px,5.6vw,68px);line-height:.98;color:#fff;margin:8px 0 10px;letter-spacing:-.01em}
.hero .sub{margin:0;max-width:60ch;font-size:17px;color:#C9CDEA}
.hero .kpis{justify-content:flex-start;gap:26px;margin:22px 0 0}
.hero .kpi{background:none;border:0;box-shadow:none;padding:0;min-width:0;align-items:flex-start}
.hero .kpi .v{font-family:var(--display);font-weight:700;font-size:36px;color:var(--gold-2)}

@media (max-width:760px){.hero-in{flex-direction:column;text-align:center;padding:28px 20px 24px;gap:16px}.hero .rose{flex-basis:96px;width:96px;height:96px}.hero .kpis{justify-content:center;gap:18px}.hero .kpi{align-items:center}.hero .sub{margin:0 auto}}
.period{margin:0 0 30px}
.period-head{display:flex;align-items:baseline;gap:14px;margin:0 0 14px}
.period-head h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:0;color:var(--navy);white-space:nowrap}
html.dm .period-head h2{color:var(--ink)}
.period-head .dates{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);white-space:nowrap}
.period-head .rule{flex:1;height:2px;background:linear-gradient(90deg,var(--gold-2),rgba(201,162,39,.12))}
@media (max-width:640px){.period-head{flex-wrap:wrap}.period-head h2{white-space:normal;font-size:25px}.period-head .rule{display:none}}
.ugrid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-top:0}
.ucd{border-radius:14px}
.ucd::before{height:5px}
.ucd .un{width:auto;height:auto;background:none;color:var(--uc-deep);font-family:var(--display);font-weight:700;font-size:44px;line-height:.9;border-radius:0}
.ucd h3{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.02;color:var(--navy)}
html.dm .ucd h3{color:var(--ink)}
.ucd .wt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--uc-deep);background:var(--uc-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.ucd .ublurb{font-size:13.5px;color:var(--ink-3);margin:-4px 0 0;line-height:1.45}
.ucd.soon{opacity:.7}
.ucd.soon h3{font-size:22px}
.how{margin-top:8px}
.how h3{font-family:var(--display);font-size:24px;color:var(--navy)}
html.dm .how h3{color:var(--ink)}
.how .stepn{background:var(--gold-soft);color:var(--gold-ink)}
.foot{font-weight:400}
/* practice + headings */
.phead h2,.xintro h2,.rvhead h2{font-family:var(--display);font-size:34px;color:var(--navy)}
html.dm .phead h2,html.dm .xintro h2,html.dm .rvhead h2{color:var(--ink)}
.tchip{border-radius:10px}
.tchip .id{color:var(--uc-deep)}
.stem{font-weight:400;font-size:17.5px}
.qcard{max-width:none;padding:24px 26px}
.pmain{max-width:1240px}
.pmain .xwrap:not(.has-stim) .qcard{max-width:820px;margin:0 auto}
.opt{border-radius:12px;border-width:1.5px}
.opt .ltr{border-radius:50%;width:36px;height:36px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--navy-2)}
html.dm .opt:hover:not(:disabled){border-color:var(--gold)}
.fbk{border-radius:12px}
.fbk h4{font-family:var(--display);font-weight:700;font-size:22px}
.phint{margin-top:14px;border:1px dashed var(--amber-line);background:var(--amber-soft);border-radius:12px;overflow:hidden}
.phint summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:700;font-size:14.5px;color:var(--amber);min-height:44px;display:flex;align-items:center}
.phint summary::-webkit-details-marker{display:none}
.phint p{padding:0 14px 14px;margin:0;font-size:15px;line-height:1.55;color:var(--ink)}
/* split view (practice + exam): source left, question right, like Bluebook */
.xwrap.has-stim{gap:24px}
@media (min-width:900px){
  .xwrap.has-stim{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
  .scol .sticky{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding-right:6px;overscroll-behavior:contain}
  .pmain .scol .sticky{top:76px}
}
.scol-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.setlabel{font-family:var(--body);font-weight:700;font-size:14px;color:var(--ink-2);margin:0;font-style:italic}
.scol .sticky::-webkit-scrollbar{width:8px}.scol .sticky::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
/* exam choices with the cross-out tool */
.xq .stem{font-size:17.5px}
.xrow{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center}
.xopt{border-radius:12px}
.xopt .ltr{font-size:14.5px}
.xopt[aria-checked="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--l1-soft)}
.xopt[aria-checked="true"] .ltr{background:var(--navy);border-color:var(--navy);color:#fff}
html.dm .xopt[aria-checked="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:rgba(227,196,100,.08)}
html.dm .xopt[aria-checked="true"] .ltr{background:var(--gold);border-color:var(--gold);color:#0E1126}
.elim{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;color:var(--ink-3);font-size:12px;font-weight:700;border:1.5px solid transparent}
.elim svg{width:22px;height:22px}
.elim:hover{color:var(--ink);border-color:var(--line-2)}
.xrow.out .xopt{opacity:.55}
.xrow.out .xopt .txt{text-decoration:line-through;text-decoration-thickness:2px}
.xrow.out .elim{color:var(--navy);border-color:var(--line-2)}
html.dm .xrow.out .elim{color:var(--gold)}
.navq.ans{background:var(--navy);border-color:var(--navy);color:#fff}
.navq.cur{box-shadow:0 0 0 3px var(--gold-soft),0 0 0 5px var(--gold)}
html.dm .navq.ans{background:var(--gold);border-color:var(--gold);color:#0E1126}
.navkey i.ans{background:var(--navy);border-color:var(--navy)}
html.dm .navkey i.ans{background:var(--gold);border-color:var(--gold)}
.xintro .dir{border-left-color:var(--gold)}
.exam main{padding-bottom:84px}
/* score */
.score-hero .big,.sumhead .big{font-family:var(--display);font-weight:700;color:var(--navy)}
html.dm .score-hero .big,html.dm .sumhead .big{color:var(--ink)}
.score-hero::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--navy),var(--gold))}
.apbadge{background:var(--gold-soft);border-color:var(--amber-line)}
.apbadge .n{font-family:var(--display);font-weight:700;font-size:44px;color:var(--navy)}

.row .trk>span{background:var(--green)}
.row .trk>span.mid{background:var(--gold)}

/* ===================================================================
   Sources: passages, paired passages, images
   =================================================================== */
.stim{border-radius:12px}
.practice .stim{background:var(--psg-bg);border:1px solid var(--line)}
.psg{padding:20px 22px 16px;background:var(--psg-bg);border:1px solid var(--line);border-top:3px solid var(--psg-rule);gap:10px}
.psg-lbl{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.psg-title{font-family:var(--display);font-weight:700;font-size:21px;color:var(--navy);line-height:1.15}
html.dm .psg-title{color:var(--ink)}

.psg-text p{margin:0 0 .85em}
.psg-text p:last-child{margin-bottom:0}
.psg-text.verse p{margin-bottom:1em;padding-left:1.2em}
.fns{display:grid;gap:4px;padding-top:6px}
.fn{font-size:13.5px;line-height:1.45;color:var(--ink-2);display:flex;gap:6px}
.fn .m{font-weight:700;color:var(--gold-ink);flex:none}
.attr{display:grid;gap:3px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.45}

.attr .tr{color:var(--ink-3);font-size:12.5px}
.pairset{display:grid;gap:14px}
.gloss{border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
html.dm .gloss{background:rgba(255,255,255,.03)}
.gloss summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:700;font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-height:44px}
.gloss summary::-webkit-details-marker{display:none}
.gloss summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-left:2px}
.gloss[open] summary::before{transform:rotate(45deg)}
.gloss summary .n{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font-size:12px}
.gloss dl{margin:0;padding:0 12px 12px;display:grid;gap:8px}
.gloss dl div{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:10px;font-size:14px;line-height:1.45}
.gloss dt{font-weight:700;color:var(--ink)}
.gloss dd{margin:0;color:var(--ink-2)}
.gloss .idesc{margin:0;padding:0 12px 12px;font-size:14px;line-height:1.55;color:var(--ink-2)}
@media (max-width:520px){.gloss dl div{grid-template-columns:1fr;gap:2px}}
.simg{padding:16px 16px 14px;gap:10px}
.imgbox{position:relative;width:100%;background:var(--paper-2);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.imgbox img{display:block;width:100%;height:100%;object-fit:contain}
.imgbox .imgfail{display:none;padding:18px;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.imgbox.broken{aspect-ratio:auto!important}
.imgbox.broken img{display:none}
.imgbox.broken .imgfail{display:block}
.stab{font-size:14.5px}
.stim-title{font-family:var(--display);text-transform:none;letter-spacing:0;font-weight:700;font-size:20px;color:var(--navy)}
html.dm .stim-title{color:var(--ink)}
.stim-source{font-style:normal;color:var(--ink-3);font-size:12.5px}
@media (max-width:640px){.psg{padding:16px 15px 13px}.psg-text{font-size:16.5px;line-height:1.62}}

/* polish pass */
h1,h2,h3,.big,.kpi .v,.ucd .un,.apbadge .n,.rv .rn,.fbk h4,.psg-title,.stim-title{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
main{padding-bottom:96px}
.exam .psg,.review .psg{border-top-color:var(--psg-rule)}
.exam .stim.psg{border-color:var(--line);border-top-color:var(--psg-rule)}

  .bar-in{min-height:54px;flex-wrap:nowrap}

  .bar-ctx .ellip{display:none}
  .brand svg{width:30px;height:30px}

}
.upill i{background:var(--gold-2)}

.icap{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.simg .imgbox{max-height:72vh}
.simg .imgbox img{max-height:72vh}

/* Bluebook-style tools: highlighter + hide timer */
mark.hl{background:#FCE68A;color:inherit;border-radius:2px;padding:0 1px;cursor:pointer;box-shadow:0 0 0 1px rgba(201,162,39,.35)}
html.dm mark.hl{background:#7A6224;color:#FFF7DA}
.hlbtn{position:fixed;z-index:80;min-height:40px;padding:8px 14px;border-radius:999px;background:var(--navy);color:#fff;font:700 14px/1 var(--body);box-shadow:var(--sh-lg);border:2px solid var(--gold)}
html.dm .hlbtn{background:var(--gold);color:#0E1126;border-color:var(--gold-2)}
.hl-tip{margin:8px 2px 0;font-size:12.5px;color:var(--ink-3)}
@media (pointer:coarse){.hl-tip{display:none}}
.timer.hid .digits{display:none}
.timer.hid::after{content:"Timer hidden";font:700 13px/1 var(--body);letter-spacing:0}
.tmr-tg{min-height:36px;padding:6px 10px;font-size:13px}
@media (max-width:640px){.tmr-tg{display:none}}
</style>

<script>window.PE_DATA={"units":{"1":{"unit":1,"title":"The Global Tapestry","period":"c. 1200–1450","examWeighting":"8–10%","blurb":"Song China, Dar al-Islam, South and Southeast Asia, the Mexica and Inca, African states, and medieval Europe.","version":"2026-11-07b","schemaNotes":"Every question has a set id; data.stimuli[set] holds its source (passage | pair | image | table | bar). Options A-D. LO letters follow the Fall 2026 AP World CED (Unit 1: Learning Objectives A-N).","topics":[{"id":"1.1","name":"Developments in East Asia from c. 1200 to c. 1450","lo":["A","B","C"]},{"id":"1.2","name":"Developments in Dar al-Islam from c. 1200 to c. 1450","lo":["D","E","F"]},{"id":"1.3","name":"Developments in South and Southeast Asia from c. 1200 to c. 1450","lo":["G","H"]},{"id":"1.4","name":"State Building in the Americas","lo":["I"]},{"id":"1.5","name":"State Building in Africa","lo":["J"]},{"id":"1.6","name":"Developments in Europe from c. 1200 to c. 1450","lo":["K","L","M"]},{"id":"1.7","name":"Comparison in the Period from c. 1200 to c. 1450","lo":["N"]}],"stimuli":{"X1":{"type":"passage","paragraphs":["[Srivijaya]* lies between [Cambodia] and [Java]. Its rule extends over fifteen chou (provinces, or towns). It lies due south of [Quanzhou]. …","They are skilled at fighting on land or water. … In facing the enemy and braving death they have not their equal among other nations. …","Exclusive of the native products, which include tortoise-shell, camphor, … cloves, sandal-wood and cardamoms, there are also pearls, frankincense, rose-water, … myrrh, … elephants' tusks, … amber, foreign cotton stuffs and sword blades. All these (latter) are products of the Arab … foreigners. The foreign traders … who gather together in this country give in exchange gold, silver, porcelain-ware, silk brocades, skeins of silk, silk gauzes, sugar, iron, … rice, … rhubarb and camphor.","This country, lying in the ocean and controlling the straits … through which the foreigners' sea and land … traffic in either direction must pass, in olden times used an iron chain as a barrier to keep the pirates of other countries in check. … If a merchant ship passes by without entering, their boats go forth to make a combined attack, and all are ready to die (in the attempt). This is the reason why this country is a great shipping centre. …","During the … period of the present dynasty (960–963) it sent tribute three times. … In … (1003) it reported to the Throne that a Buddhist temple had been erected in the country, there to pray for the Emperor's life, and a wish was expressed that a name and a bell be bestowed upon it. … Down to … (1004–1022) and … (1078–1094) this country sent a number of tribute missions, when Imperial messages with cordial assurances were conveyed to it."],"attribution":"Zhao Rugua, Song dynasty official in charge of foreign trade at the port of Quanzhou, China, Records of Foreign Peoples, 1225","translation":"Translated by Friedrich Hirth and W. W. Rockhill (1911); place names modernized; adapted","footnotes":[{"mark":"*","text":"Srivijaya was a trading kingdom based on the island of Sumatra (in today's Indonesia), beside the Strait of Malacca. \"The present dynasty\" is the Song dynasty of China (960–1279)."}],"glossary":[{"t":"chou","d":"a Chinese word for a province or district"},{"t":"camphor, cloves, sandal-wood, cardamoms","d":"spices, medicines, and sweet-smelling woods"},{"t":"frankincense, myrrh","d":"sweet-smelling tree resins burned as incense"},{"t":"brocades, gauzes","d":"kinds of fine silk cloth"},{"t":"the Throne","d":"the Chinese emperor"},{"t":"cordial assurances","d":"friendly promises"}]},"X2":{"type":"passage","paragraphs":["What we call Moral Law is not something out of the ordinary which has to be sought. … It is no more than the ordinary principles of everyday life, by which we know that this is right and that is wrong. … In the present day the Buddhists talk of a Tao which is to be apprehended suddenly. But Tao is not a thing which can be felt and handled.","The Moral Law is the Law followed by all in the past and in the present. The kindness of the father, the filial obedience of the son, the benevolence of the sovereign, and the loyalty of the minister, are one principle common to all people. Virtue is the reception of this Law in one's own person; just as, when the sovereign cannot but be benevolent and the minister loyal, it is because they have received this Moral Law within themselves, and therefore manifest this disposition. …","… the Buddhists and Taoists discard human relationships, and yet they pay reverence to their teacher as to a father, they regard their younger brethren as sons, their seniors as elder brother teachers, and their juniors as younger brother teachers. The only thing is that they are all imitations."],"attribution":"Zhu Xi (1130–1200), Chinese scholar and teacher, sayings recorded by his students in the late 1100s and later collected in The Complete Works of Zhu Xi","translation":"Translated by J. Percy Bruce, The Philosophy of Human Nature (1922); adapted","glossary":[{"t":"Moral Law / Tao","d":"the Way: the right way for people to live"},{"t":"apprehended","d":"grasped or understood"},{"t":"filial obedience","d":"the respect and obedience children owe their parents"},{"t":"sovereign","d":"ruler"},{"t":"minister","d":"an official who serves the ruler"},{"t":"disposition","d":"way of acting"},{"t":"brethren","d":"fellow members of a religious community, such as monks"}]},"X3":{"type":"passage","paragraphs":["… Marco Polo, who spent five months on the north coast of Sumatra in 1292, speaks of all the inhabitants being idolaters, except in the petty kingdom of Parlak on the north-east corner of the island, where, too, only the townspeople were Muhammadans*, for \"this kingdom, you must know, is so much frequented by the Saracen merchants that they have converted the natives to the Law of Mahomet,\" but the hill-people were all idolaters …","In the beginning of the fourteenth century,** the Sharif of Mecca sent a mission to convert the people of Sumatra. … [The ruler of Samudra] was persuaded by Shaykh Isma'il to embrace Islam, and took the name of Maliku-s Salih. … When Ibn Batutah visited the island in 1345, he found … Maliku-z Zahir, reigning at Samudra. This prince displayed all the state of Muhammadan royalty … he was a zealous and orthodox Muslim, fond of holding discussions with jurisconsults and theologians, and his court was frequented by poets and men of learning. Ibn Batutah gives us the names of two jurisconsults who had come thither from Persia and also of a noble who had gone on an embassy to Delhi on behalf of the king—which shows that Sumatra was already in touch with several parts of the Muhammadan world.","… But there is evidence enough to show the existence of peaceful missionary efforts to spread the faith of Islam [in the Malay Archipelago] during the last six hundred years: sometimes indeed the sword has been drawn in support of the cause of religion, but preaching and persuasion rather than force and violence have been the main characteristics of this missionary movement. The marvellous success that has been achieved has been largely the work of traders, who won their way to the hearts of the natives, by learning their language, adopting their manners and customs, and began quietly and gradually to spread the knowledge of their religion by first converting the native women they married and the persons associated with them in their business relations. Instead of holding themselves apart in proud isolation, they gradually melted into the mass of the population, … making such skilful compromises in the doctrines and practices of their faith as were needed to recommend it to the people they wished to attract."],"attribution":"Thomas W. Arnold, British historian who taught at a Muslim college in India, The Preaching of Islam: A History of the Propagation of the Muslim Faith, published in 1896","translation":"Adapted","footnotes":[{"mark":"*","text":"Arnold, writing in 1896, uses older terms: \"Muhammadans\" and \"Saracens\" for Muslims, \"the Law of Mahomet\" for Islam, \"idolaters\" for followers of local religions, and \"natives\" for the local people."},{"mark":"**","text":"Arnold follows a later tradition here. The tombstone of Maliku-s Salih (Malik al-Salih) gives his death as 1297, so his conversion came before 1300."}],"glossary":[{"t":"Sumatra","d":"a large island in today's Indonesia, along the Strait of Malacca"},{"t":"Malay Archipelago","d":"the islands of today's Indonesia, Malaysia, and the Philippines"},{"t":"Samudra","d":"a port kingdom on the north coast of Sumatra"},{"t":"Sharif of Mecca","d":"the ruler of the holy city of Mecca"},{"t":"orthodox","d":"following the accepted teachings"},{"t":"jurisconsults","d":"experts in Islamic law"},{"t":"embassy","d":"an official visit by a representative of one ruler to another"}]},"X4":{"type":"passage","paragraphs":["O servant, where dost thou seek Me? Lo! I am beside thee. I am neither in temple nor in mosque: I am neither in Kaaba nor in Kailash: Neither am I in rites and ceremonies, nor in Yoga and renunciation. If thou art a true seeker, thou shalt at once see Me … Kabîr says, \"O Sadhu! God is the breath of all breath.\"","It is needless to ask of a saint the caste to which he belongs; For the priest, the warrior, the tradesman, and all the thirty-six castes, alike are seeking for God. … The barber has sought God, the washerwoman, and the carpenter … Hindus and Moslems alike have achieved that End, where remains no mark of distinction.","If God be within the mosque, then to whom does this world belong? If Ram be within the image which you find upon your pilgrimage, then who is there to know what happens without? Hari is in the East: Allah is in the West. Look within your heart, for there you will find both Karim and Ram … Kabîr is the child of Allah and of Ram: He is my Guru, He is my Pir."],"attribution":"Kabir (c. 1440–1518), poet and religious teacher from the city of Banaras in northern India, three songs credited to him and passed down by his followers","translation":"Translated by Rabindranath Tagore, Songs of Kabir (1915); adapted","glossary":[{"t":"dost thou / thou shalt","d":"do you / you will"},{"t":"Kaaba","d":"the holy shrine in Mecca toward which Muslims pray"},{"t":"Kailash","d":"a Himalayan mountain sacred to Hindus as the home of the god Shiva"},{"t":"renunciation","d":"giving up the comforts of ordinary life for religion"},{"t":"Sadhu","d":"a Hindu holy man"},{"t":"Ram, Hari","d":"Hindu names for God"},{"t":"Allah, Karim","d":"Muslim names for God"},{"t":"Guru / Pir","d":"a Hindu religious teacher / a Muslim religious teacher"}]},"X5":{"type":"passage","paragraphs":["Mitimaes is the name of those who are transported from one land to another. The first kind of mitimaes, as instituted by the Incas, were those who were moved to other countries, after a new province had been conquered. A certain number of the conquered people were ordered to people another land of the same climate and conditions as their original country. … At the same time, an equal number of settlers was taken from a part which had been peaceful and civilized for a long time, and sent into the newly conquered province … Among the colonists there were spies, who took note of the conversations and schemes of the natives*, and supplied the information to the governors, who sent it to Cuzco without delay, to be submitted to the Inca.","… Selecting the best language, the Incas ordered, on pain of serious punishment, that all the natives of the empire should understand the tongue that was spoken at Cuzco, as well the men as the women. … So completely was this policy enforced, that in a few years the language was understood and used over an extent of more than twelve hundred leagues. Yet although this language was used, all the tribes also spoke their own …","… The system of the Peruvians was by quipus. These were long ropes made of knotted cords … Each ruler of a province was provided with accountants who were called quipucamayos, and by these knots they kept account of what tribute was to be paid in the district, with respect to silver, gold, cloth, flocks, down to fire-wood and other minute details. … I was incredulous respecting this system of counting … But when I was at Marcavillca, in the province of Xauxa, I asked the lord Guacarapora to explain it in such a way as that my mind might be satisfied, and that I might be assured that it was true and accurate. He ordered his servants to bring the quipus … He told me to observe that all that he, for his part, had delivered to the Spaniards from the time that the Governor Don Francisco Pizarro arrived in the valley, was duly noted down without any fault or omission. Thus I saw the accounts for the gold, the silver, the clothes, the corn, sheep, and other things; so that in truth I was quite astonished."],"attribution":"Pedro de Cieza de León, Spanish soldier who traveled in Peru from 1547 to 1550, The Second Part of the Chronicle of Peru, written about 1550 from his travels and from interviews with Inca nobles and other Andean informants","translation":"Translated by Clements R. Markham (1883); adapted","footnotes":[{"mark":"*","text":"Cieza uses \"natives\" for the Andean peoples the Incas conquered."}],"glossary":[{"t":"Cuzco","d":"the capital of the Inca Empire"},{"t":"leagues","d":"an old unit of distance, about 3 miles each"},{"t":"accountants / quipucamayos","d":"record keepers"},{"t":"incredulous","d":"unwilling to believe"},{"t":"Xauxa","d":"a valley in the central Andes (today's Jauja, Peru)"},{"t":"corn, sheep","d":"here, maize and llamas"},{"t":"Francisco Pizarro","d":"the Spanish leader who began the conquest of the Inca Empire in 1532"}]},"X6":{"type":"passage","paragraphs":["On certain days the sultan holds audiences in the palace yard, where there is a platform under a tree, with three steps; this they call the pempi. … The sultan comes out of a door in a corner of the palace, carrying a bow in his hand and a quiver on his back. On his head he has a golden skull-cap … The sultan is preceded by his musicians, who carry gold and silver guimbris [two-stringed guitars], and behind him come three hundred armed slaves. …","… [The poets] stand in front of the sultan … and recite their poems. I was told that their poetry is a kind of sermonizing in which they say to the sultan: \"This pempi which you occupy was that whereon sat this king and that king, and such and such were this one's noble actions and such and such the other's. So do you too do good deeds whose memory will outlive you.\" … I was told that this practice is a very old custom amongst them, prior to the introduction of Islam, and that they have kept it up.","The negroes* possess some admirable qualities. They are seldom unjust, and have a greater abhorrence of injustice than any other people. … There is complete security in their country. Neither traveller nor inhabitant in it has anything to fear from robbers or men of violence. … On Fridays, if a man does not go early to the mosque, he cannot find a corner to pray in, on account of the crowd. … Yet another is their zeal for learning the Koran by heart.","Among their bad qualities are the following. The women servants, slave-girls, and young girls go about in front of everyone naked … Then there is their custom of putting dust and ashes on their heads, as a mark of respect …"],"attribution":"Ibn Battuta, Muslim scholar and judge from Morocco, describing his stay in the capital of the Mali Empire in 1352–1353, from his book of travels, written down in 1355","translation":"Translated by H. A. R. Gibb (1929); adapted","footnotes":[{"mark":"*","text":"Gibb's 1929 translation uses \"negroes,\" a word now considered offensive, for Black Africans."}],"glossary":[{"t":"sultan / mansa","d":"king; the ruler of Mali was called the mansa"},{"t":"audiences","d":"formal meetings where a ruler receives visitors"},{"t":"sermonizing","d":"preaching a moral lesson"},{"t":"abhorrence","d":"strong hatred"},{"t":"Koran","d":"the Quran, the holy book of Islam"}]},"X7":{"type":"pair","items":[{"label":"Source 1","paragraphs":["12. No scutage or aid shall be imposed in our realm unless by the common counsel of our realm; except for redeeming our body, and knighting our eldest son, and marrying once our eldest daughter. …","39. No freeman shall be taken, or imprisoned, or disseized, or outlawed, or exiled, or in any way harmed—nor will we go upon or send upon him—save by the lawful judgment of his peers or by the law of the land.","61. … the barons, namely, may elect at their pleasure twenty five barons from the realm, who ought, with all their strength, to observe, maintain and cause to be observed, the peace and privileges which we have granted to them … And if we do not amend that error … those twenty five barons, with the whole land in common, shall distrain and oppress us in every way in their power,—namely, by taking our castles, lands and possessions …"],"attribution":"Magna Carta (Great Charter), agreement that King John of England was forced to accept by his rebellious barons, 1215","translation":"Translated by Ernest F. Henderson, Select Historical Documents of the Middle Ages (1896); adapted","glossary":[{"t":"scutage / aid","d":"payments that vassals owed the king"},{"t":"common counsel","d":"advice and agreement"},{"t":"redeeming our body","d":"paying a ransom if the king were captured"},{"t":"disseized","d":"having one's land taken away"},{"t":"peers","d":"equals; people of the same rank"},{"t":"distrain","d":"seize property to force someone to act"}]},{"label":"Source 2","paragraphs":["… they [the electors*] shall not disperse from the said city of Frankfort until the majority of them shall have elected a temporal head for the world and for the Christian people; a king, namely, of the Romans and prospective emperor. …","… our successors the kings of Bohemia, also each and all future prince electors, ecclesiastical and secular, may justly hold and lawfully possess … all the gold and silver mines and mines of tin, copper, lead, iron and any other kind of metal, and also of salt … And they may also have the Jew taxes and enjoy the tolls which have been decreed and assigned to them in the past …"],"attribution":"The Golden Bull, decree issued by Holy Roman Emperor Charles IV with the agreement of the leading German princes, 1356","translation":"Translated by Ernest F. Henderson, Select Historical Documents of the Middle Ages (1896); adapted","footnotes":[{"mark":"*","text":"the seven prince electors: the archbishops of Mainz, Trier, and Cologne, the king of Bohemia, and the rulers of the Palatinate, Saxony, and Brandenburg"}],"glossary":[{"t":"temporal","d":"worldly; having to do with government rather than religion"},{"t":"king of the Romans","d":"the title of the elected German king before he was crowned emperor"},{"t":"ecclesiastical and secular","d":"church leaders and non-church rulers"},{"t":"tolls","d":"fees for using roads, rivers, or bridges"},{"t":"Jew taxes","d":"special taxes collected from Jewish communities"}]}]},"X8":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/Les_Tr%C3%A8s_Riches_Heures_du_duc_de_Berry_mars.jpg/960px-Les_Tr%C3%A8s_Riches_Heures_du_duc_de_Berry_mars.jpg","width":960,"height":1550,"alt":"A painted page showing peasants plowing, pruning vines, and herding sheep in fields below a large walled castle, with a half-circle calendar of the sky at the top.","caption":"This page shows the month of March. In the front, a peasant guides a plow pulled by two oxen. On the left, workers prune grapevines inside a walled field. On the right, a man takes seed from a sack. Farther back, a shepherd and his dog watch a flock of sheep. Behind them rises the Château (castle) de Lusignan, which belonged to the Duke of Berry. The half-circle at the top is a calendar showing the days of the month and the star signs for March.","attribution":"The Limbourg brothers, Dutch painters working for the Duke of Berry, a French royal prince, \"March,\" from the Très Riches Heures (Very Rich Hours), a hand-painted prayer book, begun c. 1412–1416 and finished by a later painter","credit":"Musée Condé, Chantilly, France. Public domain image via Wikimedia Commons.","description":"A tall painted page. At the bottom, a peasant in a gray tunic steers a wooden plow pulled by two oxen across a brown field. In the middle, three or four workers bend over grapevines in a walled vineyard on the left, and on the right a man scoops seed from a white sack. Farther up, a shepherd with a dog walks beside a flock of sheep. At the top of the landscape stands a large castle with white walls, round towers, and blue roofs. Above it, a blue half-circle with gold stars shows a calendar, the signs of the fish and the ram, and the sun in a chariot.","glossary":[{"t":"prayer book (book of hours)","d":"a book of daily prayers with a calendar, written and painted by hand"},{"t":"peasant","d":"a poor farmer or farm worker"},{"t":"prune","d":"cut back plants so they grow better"}]},"P1":{"type":"passage","paragraphs":["… you arrive at the most noble city of Kinsay, a name which is as much as to say in our tongue \"The City of Heaven\" … for the city is beyond dispute the finest and the noblest in the world. In this we shall speak according to the written statement which the Queen of this Realm* sent to Bayan the conqueror of the country for transmission to the Great Kaan**, in order that he might be aware of the surpassing grandeur of the city and might be moved to save it from destruction or injury. …","The document aforesaid also went on to state that there were in this city twelve guilds of the different crafts, and that each guild had 12,000 houses in the occupation of its workmen. … And yet all these craftsmen had full occupation, for many other cities of the kingdom are supplied from this city with what they require. The document aforesaid also stated that the number and wealth of the merchants, and the amount of goods that passed through their hands, was so enormous that no man could form a just estimate thereof. …","… The waters of the latter [the river] fill a number of canals of all sizes which run through the different quarters of the city … Both streets and canals are so wide and spacious that carts on the one and boats on the other can readily pass to and fro, conveying necessary supplies to the inhabitants. … In each of the squares is held a market three days in the week, frequented by 40,000 or 50,000 persons, who bring thither for sale every possible necessary of life …"],"attribution":"Marco Polo, Venetian merchant who lived in China under Mongol rule from 1275 to 1292, describing Hangzhou, which had been the capital of the Song dynasty; his book was written down by the author Rustichello of Pisa in 1298","translation":"Translated by Henry Yule, revised by Henri Cordier (1903); adapted","footnotes":[{"mark":"*","text":"the Song empress dowager, grandmother of the boy emperor; she surrendered the city to the Mongol general Bayan in 1276"},{"mark":"**","text":"Khubilai Khan, the Mongol ruler of China"}],"glossary":[{"t":"Kinsay","d":"Hangzhou, a city in southern China"},{"t":"grandeur","d":"greatness and beauty"},{"t":"guilds","d":"associations of craftsmen who work in the same trade"},{"t":"just estimate","d":"accurate count"}]},"P2":{"type":"passage","paragraphs":["May it please your Majesty, I am informed that in consequence of the recent birth of a princess, a demand has been made on the Treasury for no less than 8,000 pieces of silk. Now the rigour of winter is just at its height, and the wretched workmen of the Dyeing Department, forced to break ice before they can get water, will suffer unspeakable hardships in supplying the amount required. And judging by your Majesty's known sentiments of humanity and thrift, I cannot believe that this wasteful corvée is to be imposed …","I have also noticed that the relatives of the Lady Chang* have of late participated too frequently in the Imperial bounty. I am, it is true, but a poor Censor; yet whenever I see anything calculated to impair the prestige of the Son of Heaven, it becomes my duty to speak, that the divine wrath may be averted in time. …","… The fact is that the Imperial bounty is too lavishly bestowed, and that extravagance is rife in the palace. Your Majesty suffers thereby: the State suffers thereby; and it is my duty to speak, trusting that your Majesty will take immediate steps to rectify these abuses."],"attribution":"Ouyang Xiu (1007–1072), Chinese scholar-official who passed the highest civil service examination, memorial (formal letter of advice) to the Song emperor, written in the mid-1000s while he held a post that Giles translates as \"Censor\"","translation":"Translated by Herbert A. Giles, Gems of Chinese Literature (1923); adapted","footnotes":[{"mark":"*","text":"the emperor's favorite consort (a wife ranked below the empress)"}],"glossary":[{"t":"Censor","d":"a government official whose job was to watch for and report wrongdoing"},{"t":"rigour","d":"harshness"},{"t":"thrift","d":"careful use of money"},{"t":"corvée","d":"unpaid labor that people were forced to do for the government"},{"t":"bounty","d":"gifts"},{"t":"Son of Heaven","d":"a title of the Chinese emperor"},{"t":"prestige","d":"respect"},{"t":"rife","d":"common; widespread"},{"t":"rectify","d":"fix"},{"t":"wrath","d":"great anger"}]},"P3":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Along_the_River_During_the_Qingming_Festival_%28detail_of_original%29.jpg/960px-Along_the_River_During_the_Qingming_Festival_%28detail_of_original%29.jpg","width":960,"height":480,"alt":"A crowded arched wooden bridge over a river, lined with vendors under umbrellas, with a large boat passing beneath it and shops along both banks.","caption":"This section of a long painted scroll shows a busy arched wooden bridge over a river. Crowds cross the bridge, and vendors sell goods from stalls and under umbrellas on and beside it. A large cargo boat is passing under the bridge while its crew works the mast and ropes and people lean over the railing to watch. Along the banks are shops, restaurants, and inns. Porters carry loads on poles over their shoulders, and carts and donkeys move goods along the road.","attribution":"Zhang Zeduan (attributed), Chinese court painter, Along the River During the Qingming Festival, hand scroll (ink and color on silk), Song dynasty, early 1100s (detail)","credit":"Palace Museum, Beijing. Public domain image via Wikimedia Commons.","description":"A brownish painting on silk. In the center an arched wooden bridge crosses a wide river. Dozens of people crowd the bridge, and small stalls with umbrellas line its sides. To the right, a large wooden boat with a crew of men is passing under the bridge. Smaller boats are tied up along the far bank. In the foreground and on the far bank are tiled-roof buildings: shops, an inn, and restaurants with tables. On the road at the lower left, people walk beside carts, an ox, and donkeys, and porters carry baskets hung from poles.","glossary":[{"t":"hand scroll","d":"a very long painting on silk or paper that is unrolled one section at a time"},{"t":"Qingming Festival","d":"a spring festival when Chinese families visit and clean their ancestors' graves"},{"t":"porters","d":"workers who carry loads"}]},"P4":{"type":"passage","paragraphs":["… I applied myself to the study of Sufism. … The aim which the Sufis set before them is as follows: To free the soul from the tyrannical yoke of the passions, to deliver it from its wrong inclinations and evil instincts, in order that in the purified heart there should only remain room for God and for the invocation of His holy name. …","… I saw that Sufism consists in experiences rather than in definitions, and that what I was lacking belonged to the domain, not of instruction, but of ecstasy and initiation. …","… Examining my actions, the most fair-seeming of which were my lecturing and professorial occupations, I found to my surprise that I was engrossed in several studies of little value, and profitless as regards my salvation. I probed the motives of my teaching and found that, in place of being sincerely consecrated to God, it was only actuated by a vain desire of honour and reputation. … At last I left Bagdad, giving up all my fortune. …","… I learnt from a sure source that the Sufis are the true pioneers on the path of God; that there is nothing more beautiful than their life, nor more praiseworthy than their rule of conduct, nor purer than their morality. The intelligence of thinkers, the wisdom of philosophers, the knowledge of the most learned doctors of the law would in vain combine their efforts in order to modify or improve their doctrine and morals; it would be impossible."],"attribution":"Abu Hamid al-Ghazali (1058–1111), Muslim scholar who taught at the leading college in Baghdad, Deliverance from Error, an account of his own religious search written in the early 1100s","translation":"Translated by Claud Field, The Confessions of Al Ghazzali (1909); adapted","glossary":[{"t":"Sufism","d":"a form of Islam whose followers, called Sufis, used prayer, chanting, and self-discipline in their search for God"},{"t":"yoke of the passions","d":"control by strong desires"},{"t":"invocation","d":"calling on"},{"t":"ecstasy","d":"an overwhelming feeling of joy and closeness to God"},{"t":"initiation","d":"being accepted and trained by a teacher"},{"t":"consecrated / actuated","d":"devoted / moved to act"},{"t":"doctors of the law","d":"experts in Islamic law"}]},"P5":{"type":"pair","items":[{"label":"Source 1","paragraphs":["We maintain that the business of philosophy is nothing other than to look into creation
