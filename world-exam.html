},{"t":"Book of the Law","d":"the Torah, the Jewish holy book"},{"t":"concourse","d":"crowd"},{"t":"invocation","d":"calling on God"}]}]},"P14":{"type":"passage","paragraphs":["[SUGAR-CANE.] The propagation of the sugar-cane from India westward is well known. … The Arabs in the Middle Ages introduced it into Egypt, Sicily, and the south of Spain, where it flourished until the abundance of sugar in the colonies caused it to be abandoned. …","[THE ORANGE.] … there was a Sanskrit name for the orange—nagarunga, nagrunga. It is from this that the word orange came, for the Hindus turned it into narungee …, the Arabs into narunj …, the Italians into naranzi, arangi … the Arabs, who carried the orange tree with them towards the West, were first acquainted with the bitter orange, and gave it the name narunj, and their physicians from the tenth century prescribed the bitter juice of this fruit. … [It] advanced from the coast of the Persian Gulf, and by the end of the ninth century had reached Arabia, through Oman, Bassora, Irak, and Syria, according to the Arabian author Massoudi. The Crusaders saw the bitter orange tree in Palestine. It was cultivated in Sicily from the year 1002, probably a result of the incursions of the Arabs. It was they who introduced it into Spain, and most likely also into the east of Africa. …","[RICE.] … The Arabs introduced the species into Spain, as we see from the Spanish name arroz. Rice was first cultivated in Italy in 1468, near Pisa. …"],"attribution":"Alphonse de Candolle, Swiss botanist, Origin of Cultivated Plants, first published in French in 1883","translation":"English translation (New York: D. Appleton, 1886); headings in brackets added; adapted","glossary":[{"t":"propagation","d":"spread"},{"t":"flourished","d":"grew well"},{"t":"the colonies","d":"here, the European colonies in the Americas, where sugar was later grown in huge amounts"},{"t":"Sanskrit","d":"an ancient language of India"},{"t":"prescribed","d":"ordered as a medicine"},{"t":"Bassora, Irak","d":"Basra and Iraq"},{"t":"Massoudi","d":"al-Masudi, an Arab historian and geographer of the 900s"},{"t":"incursions","d":"invasions or raids"}]},"P15":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Caravane_sur_la_Route_de_la_soie_-_Atlas_catalan.jpg/960px-Caravane_sur_la_Route_de_la_soie_-_Atlas_catalan.jpg","width":960,"height":810,"alt":"A line of camels loaded with packs, with men on foot behind them and riders on horses wearing pointed hats, crossing rocky ground on an old map dotted with town symbols.","caption":"This section of a hand-drawn map shows a caravan crossing rocky ground. Camels loaded with packs walk in front, with men on foot walking behind and beside them. Behind them ride men on horses, wearing tall pointed hats in many colors. Below the caravan are small drawings of walled towns with flags. A note in Catalan above the caravan says that it set out from the empire of Sarra to go to Catayo.","attribution":"Abraham Cresques (attributed), Jewish mapmaker on the island of Majorca (in today's Spain), detail from the Catalan Atlas, a map of the known world drawn on parchment, 1375","credit":"Bibliothèque nationale de France, Paris. Public domain image via Wikimedia Commons.","description":"A pale map crossed by thin red and green lines. Across the middle, four dark gray camels walk to the left. One wears a red and orange saddle cloth, and others carry boxes and packs. Men in short green and red coats walk behind them. Farther back, a group of bearded men ride blue, gray, and black horses. They wear tall pointed hats in red, green, blue, and orange, and long poles stick up behind them. The caravan walks on a band of brown, rocky ground. Below are small drawings of towers and walled towns, some with dark flags, each with a name written in red. A wavy blue line, standing for a river, runs across the top.","glossary":[{"t":"caravan","d":"a group of merchants and pack animals traveling together"},{"t":"Sarra","d":"Sarai, a city on the lower Volga River, north of the Caspian Sea"},{"t":"Catayo","d":"Cathay, the European name for northern China"},{"t":"parchment","d":"animal skin prepared for writing and drawing"}]},"P16":{"type":"passage","paragraphs":["… It is more than probable that the great pestilence was conveyed to Europe by the trading caravans coming from the East … In the country along one of the trade routes, by which caravans reached the Italian ports established on the Crimea, it is certain that the plague was raging with great virulence in 1346, the year before its appearance in Europe. Moreover, Gabriele de' Mussi, a notary of Piacenza, … has described the way in which the infection was conveyed in the ships of traders from Caffa*, a Genoese settlement in the Crimea. … here it is only necessary to report what he gathered from the survivors about the outbreak of the plague among the Tartar tribes and its appearance at Caffa.","\"In the year 1346,\" he writes, \"in eastern parts an immense number of Tartars** and Saracens fell victims to a mysterious and sudden death. … A place in the East called Tana, … under the rule of the Tartars, to which Italian merchants much resorted, was besieged by a vast horde of Tartars and was in a short time taken.\" The Christian merchants violently expelled from the city were then received for the protection of their persons and property within the walls of Caffa, which the Genoese had built in that country.","\"The Tartars followed these fugitive Italian merchants, and, surrounding the city of Caffa, besieged it likewise. … Suddenly 'the death,' as it was called, broke out in the Tartar host, and thousands were daily carried off by the disease … Then they turned their vengeance on the besieged, and in the hope of communicating the infection to their Christian enemies, by the aid of the engines of war, they projected the bodies of the dead over the walls into the city. …\""],"attribution":"Francis Aidan Gasquet, English historian and monk, The Great Pestilence (A.D. 1348–9), Now Commonly Known as the Black Death, 1893, quoting an account by the Italian notary Gabriele de' Mussi (died 1356)","translation":"De' Mussi's Latin translated by Gasquet; adapted","footnotes":[{"mark":"*","text":"Caffa (today's Feodosia) was a Genoese port on the Black Sea coast of the Crimea. Tana (near today's Azov) was an Italian trading post at the mouth of the Don River, on the Sea of Azov, an arm of the Black Sea."},{"mark":"**","text":"\"Tartars\" is de' Mussi's word for the Mongols, and \"Saracens\" is his word for Muslims."}],"glossary":[{"t":"conveyed","d":"carried"},{"t":"virulence","d":"deadly strength"},{"t":"notary","d":"an official who writes and records legal papers"},{"t":"Crimea","d":"a peninsula on the northern side of the Black Sea"},{"t":"host","d":"army"},{"t":"engines of war","d":"catapults and other machines for attacking a city"},{"t":"projected","d":"threw"}]}},"practice":[{"id":"U2-P01","set":"P1","topic":"2.1","lo":"A","skill":"3.A","difficulty":"easy","stem":"Polo's main point in the passage is that the Great Khan","options":{"A":"paid for his wars with the gold and silver taken from the many cities he conquered","B":"issued paper money in his capital while the provinces kept using coins","C":"switched to silver coins because paper money was too easy to forge","D":"grew very rich by issuing paper money that people across his lands had to accept"},"answer":"D","explanation":"Polo explains how the Khan made money out of tree bark. Everyone had to accept it, and merchants had to trade their gold and gems for it. That is how Polo says the Khan got \"more treasure than all the Kings in the World.\"","whyNot":{"A":"Polo does not talk about war loot. He says the Khan's treasure came from his paper money and the gold and gems he bought with it.","B":"Polo says the paper money passed \"over all his kingdoms and provinces and territories,\" not just in the capital.","C":"Polo says the Khan did use paper, and forgers were \"punished with death.\" He does not say the Khan switched to coins."},"hint":"Read the last paragraph. What does Polo say the Khan gained from this system?"},{"id":"U2-P02","set":"P1","topic":"2.1","lo":"A","skill":"4.A","difficulty":"medium","stem":"The paper money Polo describes is best understood in the context of","options":{"A":"the Mongols' invention of printing in China in the 1200s","B":"Khubilai Khan's copying of paper money first issued by the Ilkhans of Persia","C":"the use of paper money in China since the Song dynasty","D":"a decline in trade within China under Mongol rule"},"answer":"C","explanation":"Paper money was not a Mongol idea. Song China used it in the 1000s and 1100s. The Mongols kept the system going after they conquered China.","whyNot":{"A":"Printing was much older than the Mongols. Chinese printers were carving wooden blocks by the 800s.","B":"It went the other way. The Ilkhans of Persia copied Chinese paper money in 1294, long after China first used it.","D":"Polo describes busy trade. Merchants could buy what they liked \"anywhere over the Empire.\""},"hint":"Was paper money new in China when Polo arrived? Think about the dynasty before the Mongols.","reasoning":"Continuity and Change"},{"id":"U2-P03","set":"P1","topic":"2.1","lo":"A","skill":"2.B","difficulty":"easy","stem":"Polo most likely explained in such detail how the paper money was made and used because","options":{"A":"he was preparing a report on Mongol taxes for the government of Venice","B":"he hoped Italian bankers would begin accepting the Khan's paper money","C":"he wanted to warn merchants that the Khan's money was worthless","D":"paper money was unfamiliar to most of his readers in Europe"},"answer":"D","explanation":"Most Europeans paid with gold and silver coins, so paper money was strange to them. Polo had to explain step by step how bark could become money.","whyNot":{"A":"Polo's book was written down by Rustichello for readers in Europe. It was not a report for the Venetian government, and it is not mainly about taxes.","B":"Polo says the paper money was good in the Khan's own lands. He does not suggest that bankers in Italy should take it.","C":"Polo says the opposite. Everybody \"takes them readily,\" and merchants can buy what they like with them."},"hint":"Who was Polo's book written for? Would money made of paper seem normal to them?"},{"id":"U2-P04","set":"P2","topic":"2.1","lo":"A","skill":"3.A","difficulty":"easy","stem":"The table best supports which conclusion about travel between Tana and Cambalec?","options":{"A":"Most of the journey was made by ship, with short trips over land at the start and the end.","B":"Merchants could make the whole journey in less than three months.","C":"Camels carried the goods on most stages of the route.","D":"The journey used several kinds of transport, including wagons, animals, and boats."},"answer":"D","explanation":"The route changed as the land changed. Merchants used ox-wagons and horse-wagons on the steppe, camels across the dry lands, and boats on rivers. They switched animals and carriers many times.","whyNot":{"A":"The table lists river trips, but most stages went over land by wagon, ass, or horse.","B":"Add up the days. The stages listed come to well over 250 days, or more than eight months.","C":"Camel-wagons appear on two stages. Ox-wagons, asses, horses, and boats are used on the others."},"hint":"Look down the third column. How many different ways of carrying goods do you see?"},{"id":"U2-P05","set":"P2","topic":"2.1","lo":"A","skill":"4.B","difficulty":"medium","stem":"Pegolotti's comments that Organci has \"a ready sale for goods\" and that Cassai is \"a most active place of business\" best reflect which development?","options":{"A":"The decline of Central Asian cities after the Mongol conquests of the early 1200s","B":"The growth of trading cities where merchants met to buy and sell goods","C":"The control of Central Asian markets by Florentine banking companies","D":"The growth of sea trade that drew merchants away from overland routes"},"answer":"B","explanation":"Cities along the trade routes grew because merchants met there to buy, sell, and change money. Pegolotti tells merchants which cities are best for doing business.","whyNot":{"A":"Some cities were damaged by the conquests, but Pegolotti describes busy markets more than 100 years later.","C":"Pegolotti worked for a Florentine bank, but he is giving advice to merchants. He does not say Florentine companies ran these markets.","D":"Sea trade did grow, but Pegolotti describes busy markets on the overland route itself."},"hint":"Why would a merchant's guide point out certain cities? What happened in those places?"},{"id":"U2-P06","set":"P2","topic":"2.7","lo":"L","skill":"5.A","difficulty":"hard","stem":"Compared with Indian Ocean trade in the same period, the overland trade shown in the table","options":{"A":"carried smaller loads at a higher cost, so it favored light, costly goods","B":"depended more on the seasonal monsoon winds to set the timing of each trip","C":"relied less on trading cities where merchants could buy and sell along the way","D":"moved bulky goods such as grain and timber more cheaply than ships could"},"answer":"A","explanation":"Animals and wagons could carry only so much. A ship could carry far more, and more cheaply. So overland traders chose goods that were light and worth a lot, like silk.","whyNot":{"B":"Monsoon winds set the timing of voyages at sea. Caravans and wagons did not depend on them.","C":"Pegolotti names cities along the way, such as Organci and Cassai, where merchants could sell goods. Overland trade depended on such cities.","D":"It was the other way. Ships carried bulky goods more cheaply than animals and wagons could, so overland traders chose light goods like silk."},"hint":"How many loads could a wagon or a camel carry, compared with a big ship?","reasoning":"Comparison"},{"id":"U2-P07","set":"P3","topic":"2.2","lo":"C","skill":"3.A","difficulty":"easy","stem":"Rubruck's description of Karakorum best supports which claim?","options":{"A":"The Mongol court allowed churches in Karakorum but did not allow mosques.","B":"People of many faiths and homelands lived and worked in the Mongol capital.","C":"Karakorum was one of the largest cities in the world in the 1250s.","D":"Most people in Karakorum were Mongol herders who raised sheep and horses."},"answer":"B","explanation":"Karakorum was small, but it was crowded with people from across the empire. Muslim merchants, Chinese craftsmen, a French goldsmith, and many envoys all lived there. The Mongols let them follow their own religions.","whyNot":{"A":"Rubruck lists two mosques (\"mahummeries\") as well as a church and twelve temples.","C":"Rubruck says the city was smaller than the village of Saint Denis.","D":"Rubruck describes a Muslim quarter of markets and a quarter of artisans from China, not a town of herders."},"hint":"Count the different groups and places of worship Rubruck mentions."},{"id":"U2-P08","set":"P3","topic":"2.2","lo":"C","skill":"4.A","difficulty":"medium","stem":"The presence of Paquette and the Parisian goldsmith at the Mongol court is best explained by","options":{"A":"French merchants who had settled in Karakorum to buy silk","B":"Mongol campaigns in eastern Europe that brought captives back to Mongolia","C":"missionaries sent by the pope to convert the Mongol khans","D":"an alliance between the Crusader states and the Mongol khans against Mamluk Egypt"},"answer":"B","explanation":"Mongol armies attacked Poland and Hungary in 1241. They took many prisoners, especially skilled workers, back to Mongolia. The khans put these craftsmen to work.","whyNot":{"A":"Rubruck says Paquette was taken prisoner. She did not come to trade.","C":"Rubruck himself was a missionary, but Paquette and William came to Mongolia in other ways.","D":"Some Europeans hoped for such an alliance, but it did not bring European craftsmen to Karakorum."},"hint":"Paquette was taken prisoner far from home. What events in eastern Europe in the 1240s could explain that?"},{"id":"U2-P09","set":"P3","topic":"2.5","lo":"J","skill":"2.B","difficulty":"medium","stem":"Rubruck most likely compared Karakorum to the village of Saint Denis in order to","options":{"A":"show that the Mongol capital was larger than any city in France","B":"explain why so many ambassadors gathered in the city","C":"show the king how much the city had grown under Mongol rule","D":"help his French readers picture the size of the city"},"answer":"D","explanation":"Rubruck wrote for the king of France. Saint Denis was a small town near Paris that the king knew well. Comparing Karakorum to it helped the king imagine a place he had never seen.","whyNot":{"A":"Rubruck says the opposite. Karakorum was \"not as big as the village of Saint Denis.\"","B":"Rubruck explains the ambassadors by the court nearby. The comparison with Saint Denis is about size.","C":"Rubruck compares Karakorum with a French town at one moment. He says nothing about how the city had grown over time."},"hint":"Who was Rubruck writing for? What would those readers already know?"},{"id":"U2-P10","set":"P4","topic":"2.2","lo":"B","skill":"1.B","difficulty":"easy","stem":"The system described in the passage most directly helped the Mongol rulers to","options":{"A":"collect taxes in silver from foreign merchants","B":"move large armies quickly from one province to another","C":"control the prices merchants charged in provincial markets","D":"send orders and news quickly across a huge empire"},"answer":"D","explanation":"Fresh horses waited at every station, so messengers could ride very far in a day. The Khan could learn quickly about trouble, such as a revolt, and send orders back.","whyNot":{"A":"The stations served the Emperor's messengers. Polo does not say they collected taxes from merchants.","B":"The stations kept horses for the Emperor's messengers, not for moving whole armies.","C":"Polo says nothing about prices. The stations served messengers carrying news and orders."},"hint":"What did the riders carry, and how fast did they go?"},{"id":"U2-P11","set":"P4","topic":"2.2","lo":"B","skill":"3.B","difficulty":"easy","stem":"Polo's statement that the post-horses \"cost the Emperor nothing at all\" is based on which feature of the system?","options":{"A":"Merchant guilds donated horses in return for lower taxes.","B":"Towns and villages near the stations had to supply the horses.","C":"The army supplied horses it had captured from enemies.","D":"Provincial governors paid for the horses out of their own household wealth."},"answer":"B","explanation":"Polo says every city, village, or hamlet near a station had to supply as many horses as it could. The system still cost something, but local people paid that cost, not the Emperor.","whyNot":{"A":"Polo does not mention merchants giving horses. He says the places near the stations had to supply them.","C":"Polo says nothing about captured horses. The horses came from places near the stations.","D":"Polo does not say officials paid. The demand fell on every \"city, or village, or hamlet\" near a station."},"hint":"Read the last paragraph. Who had to supply the horses?"},{"id":"U2-P12","set":"P4","topic":"2.2","lo":"B","skill":"5.A","difficulty":"medium","stem":"The post system described in the passage is most similar to","options":{"A":"the Aztec system of collecting tribute from conquered city-states","B":"the Grand Canal that carried grain from southern to northern China","C":"the Inca system of roads and relay runners in the Andes","D":"the caravanserai that sheltered merchants along the Silk Roads"},"answer":"C","explanation":"Both the Mongols and the Incas ruled huge lands. Both built roads with stations and used relays of runners or riders. News and orders could cross the empire fast.","whyNot":{"A":"Aztec tribute moved goods to the ruler. It was not a relay system for carrying messages.","B":"The Grand Canal moved grain and goods by boat, not messages by relay riders.","D":"Caravanserai sheltered merchants and their goods. They were not a relay system for a ruler's messages."},"hint":"What job did the post stations do for the ruler? Look for a choice that did the same job in another empire.","reasoning":"Comparison"},{"id":"U2-P13","set":"P5","topic":"2.2","lo":"D","skill":"3.A","difficulty":"medium","stem":"Yule's main argument in the passage is that","options":{"A":"Mongol rule made travel and trade between Europe and Asia easier for a time","B":"the Mongols blocked European merchants from reaching the markets of India and China","C":"European contact with China grew steadily from about 1300 to about 1500","D":"Christian missions in China became stronger after Mongol rule ended"},"answer":"A","explanation":"Yule argues that the Mongol period was a short opening. In his account, European merchants and missionaries traveled to China, and that contact faded when the Mongol dynasty fell.","whyNot":{"B":"Yule says the opposite. Contact was \"less impeded\" under the Mongols than at any other time.","C":"Yule says contact faded after the middle of the 1300s, as the Mongol dynasty fell.","D":"Yule says missions \"disappear from the field\" after Mongol rule ended."},"hint":"What does Yule say about contact during Mongol rule? What happened after it?","reasoning":"Continuity and Change"},{"id":"U2-P14","set":"P5","topic":"2.2","lo":"D","skill":"3.B","difficulty":"medium","stem":"Yule's evidence in the second paragraph comes mainly from","options":{"A":"official histories written by Chinese scholars under the Yuan dynasty","B":"trade records kept by the Mongol khans at their capitals","C":"writings by European travelers, merchants, and missionaries of the time","D":"archaeologists' digs at the ruins of Mongol cities"},"answer":"C","explanation":"Yule names Marino Sanuto of Venice and the friar John Marignolli. He also cites stories about Italian merchants. These are European writings from the 1300s.","whyNot":{"A":"Yule names Europeans: Sanuto, Marignolli, and the friars. He does not cite Chinese histories here.","B":"Yule does not cite any Mongol records in this paragraph.","D":"Yule cites written accounts, not objects dug from the ground."},"hint":"Look at the names Yule gives. Who were they, and where were they from?"},{"id":"U2-P15","set":"P5","topic":"2.3","lo":"F","skill":"3.D","difficulty":"hard","stem":"Which of the following developments in the early 1400s would most challenge Yule's claim that China's new rulers held \"foreigners at arm's length\"?","options":{"A":"The Ming government banned private Chinese merchants from trading with foreign lands by sea.","B":"Ming fleets led by Zheng He sailed to distant lands and brought foreign envoys back to China.","C":"Ming emperors built stronger defenses along China's northern frontier.","D":"Italian merchants stopped making the overland trip to China."},"answer":"B","explanation":"The Ming did limit private trade. But the Ming court also sent huge fleets to Southeast Asia, India, Arabia, and East Africa, and foreign envoys came back with them. Those voyages show that the Ming did not shut out the world.","whyNot":{"A":"A ban on private sea trade supports Yule's claim. It shows the Ming limiting contact.","C":"Stronger northern defenses fit Yule's claim that the Ming kept foreigners away.","D":"This supports Yule's claim that \"merchants alike disappear from the field.\""},"hint":"What does \"at arm's length\" mean? To challenge a claim, look for a fact that goes against it."},{"id":"U2-P16","set":"P6","topic":"2.3","lo":"F","skill":"5.A","difficulty":"medium","stem":"The Muslim quarters in Chinese cities that Ibn Battuta describes are most similar to","options":{"A":"the Mongol garrisons stationed in conquered cities to keep order","B":"the guilds of craftsmen that ran the workshops of Song cities","C":"Arab and Persian merchant communities on the Swahili coast","D":"the monasteries that Buddhist monks built along the Silk Roads"},"answer":"C","explanation":"Merchants who settled far from home often formed their own communities. These are called diasporic communities. Muslim merchants did this in Chinese ports, and Arab and Persian merchants did it on the East African coast. Over time, many members were born in their new homes.","whyNot":{"A":"Garrisons were soldiers. The quarters Ibn Battuta describes were neighborhoods of Muslim merchants and their families.","B":"Guilds were groups of workers in one trade. The Muslim quarters were neighborhoods of people who shared a faith, not a trade.","D":"Monasteries were homes for monks. They were not neighborhoods where merchant families lived."},"hint":"Who lived in the Muslim quarters, and how were they tied to other lands?","reasoning":"Comparison"},{"id":"U2-P17","set":"P6","topic":"2.2","lo":"C","skill":"3.A","difficulty":"medium","stem":"Ibn Battuta's description of the hostelries at the post-stations best supports which claim about China under Mongol rule?","options":{"A":"The government worked to keep travelers and their money safe.","B":"Foreign travelers were not allowed to move from one city to another.","C":"Merchants paid heavy fees to the officers at each station.","D":"Travelers had to hire soldiers to guard them on the roads."},"answer":"A","explanation":"Officers at each station wrote down every traveler's name, sealed the list, and locked the travelers in for the night. Horsemen and foot soldiers were posted there too. Ibn Battuta says this made travel safe, even for someone carrying \"large sums of money.\"","whyNot":{"B":"Ibn Battuta says a man could travel \"a nine months' journey\" in China.","C":"Ibn Battuta does not mention fees at the stations.","D":"The officers and soldiers belonged to the stations. Travelers did not hire them."},"hint":"What does the officer do each evening? Why would he do it?"},{"id":"U2-P18","set":"P6","topic":"2.3","lo":"F","skill":"5.B","difficulty":"medium","stem":"The arrangements for visiting Muslim merchants described in the second paragraph most directly helped long-distance trade by","options":{"A":"giving visitors trusted hosts who looked after their money","B":"letting Muslim merchants avoid the taxes charged by the Mongols","C":"letting visitors store their goods in the mosques of the Muslim quarter","D":"giving Muslim merchants control of the government's post-stations"},"answer":"A","explanation":"A visiting merchant could stay with a Muslim merchant who lived in the city. The host kept his money safe and had to repay anything that went missing. This trust made it easier to trade far from home.","whyNot":{"B":"Ibn Battuta does not say Muslim merchants paid no taxes.","C":"Ibn Battuta says the host merchant kept the visitor's money. He does not say goods were kept in mosques.","D":"Government officers ran the post-stations. The Muslim merchants hosted visitors in their own homes."},"hint":"What happened if a visitor's money went missing?","reasoning":"Causation"},{"id":"U2-P19","set":"P7","topic":"2.3","lo":"E","skill":"3.A","difficulty":"medium","stem":"Taken together, the three entries best support which claim about the western Indian Ocean around 1225?","options":{"A":"Chinese merchants controlled the trade between India and the coast of East Africa.","B":"Gujarat, Arabia, and East Africa were linked by trade in cloth, ivory, and gold.","C":"East African merchants sailed to China each year to sell gold and ivory.","D":"Gujarat traded with China and Southeast Asia rather than with Arabia."},"answer":"B","explanation":"Zhao describes a web of trade. Gujarat made cotton cloth and dyes for Arab markets. Ships from Gujarat and Arabia brought cloth and porcelain to East Africa and took away ivory, gold, and ambergris.","whyNot":{"A":"Zhao says ships from Gujarat and the Arab coast carry this trade. He does not say Chinese merchants run it.","C":"Zhao lists East Africa's goods, but he does not say East Africans sailed to China.","D":"Zhao says Gujarat's goods \"are transported to the Ta-shi countries for sale.\" Ta-shi means the Arabs."},"hint":"Make a list: what goods leave each place, and where do they go?"},{"id":"U2-P20","set":"P7","topic":"2.3","lo":"F","skill":"4.A","difficulty":"medium","stem":"Zhao's description of the people of the Zanzibar coast as \"of Ta-shi stock\" and following \"the Ta-shi religion\" is best understood in the context of","options":{"A":"the Abbasid Caliphate's conquest and direct rule of the East African coast","B":"the spread of Islam into East Africa from Mali by way of the Sahara","C":"the settlement of Arab and Persian merchants in East African port towns","D":"the Christian kingdom of Ethiopia's control of the Swahili coast"},"answer":"C","explanation":"Swahili towns grew from African communities. Local people traded with Arab and Persian merchants, and some of these merchants settled and married into local families. Over time many people became Muslim. Zhao, writing from China, called them all Arabs.","whyNot":{"A":"The Abbasids never ruled the East African coast. Its towns were run by local rulers.","B":"Mali is in West Africa. Islam came to the East African coast by sea, across the Indian Ocean.","D":"Ethiopia was an inland Christian kingdom. The coast's towns had Muslim rulers."},"hint":"How did Islam reach towns on the East African coast?"},{"id":"U2-P21","set":"P7","topic":"2.6","lo":"K","skill":"5.B","difficulty":"medium","stem":"Trade like that described in the passage also contributed to which development in the period c. 1200–1450?","options":{"A":"The spread of tea drinking from China to the East African coast","B":"The spread of sugar-cane farming from East Africa to India","C":"The spread of crops such as bananas and citrus fruits in Africa","D":"The spread of the bubonic plague from East Africa to China"},"answer":"C","explanation":"Ships that carried goods across the Indian Ocean also carried plants. Bananas, first brought to Africa from Southeast Asia centuries earlier, kept spreading across the continent. Citrus fruits moved along the same sea routes.","whyNot":{"A":"Chinese porcelain reached East Africa, but tea drinking did not spread there in this period.","B":"It went the other way. Sugar-cane spread west from India, carried by traders and farmers.","D":"The plague spread from Central Asia along trade routes. It did not start in East Africa."},"hint":"Besides goods, what else could ships carry from one coast to another?","reasoning":"Causation"},{"id":"U2-P22","set":"P8","topic":"2.3","lo":"F","skill":"3.A","difficulty":"medium","stem":"The passage best supports which claim about Calicut in the early 1400s?","options":{"A":"Its ruler, who was not a Muslim, relied on Muslim officials to run its trade.","B":"Its ruler had recently become a Muslim in order to win the support of Arab merchants.","C":"Chinese officials set the prices of the goods sold in its markets.","D":"Its merchants refused to trade with the crews of Chinese junks."},"answer":"A","explanation":"Calicut's king was a Hindu, but his two highest officers were Muslims. They managed the port's trade, including deals with Chinese ships. People of different faiths worked together for trade.","whyNot":{"B":"Ma Huan says the king reveres \"the Buddha\" (his word for the Hindu gods) and \"does not eat beef.\" His officers are the Muslims.","C":"Calicut's two high officers sent brokers to agree on prices with the Chinese.","D":"Calicut's officers handled \"all the merchandize brought here by Chinese junks.\""},"hint":"What religion does the king follow? What about his top officers?"},{"id":"U2-P23","set":"P8","topic":"2.3","lo":"F","skill":"4.A","difficulty":"medium","stem":"Zheng He's visit to Calicut in 1407, described in the first paragraph, is best understood in the context of","options":{"A":"Ming plans to conquer the ports of India and rule them directly","B":"the Ming emperor's wish to spread Islam to the lands of the Indian Ocean","C":"Ming efforts to stop Japanese pirates from raiding China's coast","D":"Ming efforts to bring foreign rulers into China's tribute system"},"answer":"D","explanation":"Zheng He gave the king a title as a \"vassal king\" of China, along with gifts. In return, rulers sent tribute to the Ming court. This showed China's power and opened the way for trade.","whyNot":{"A":"Zheng He gave titles and gifts. The Ming did not try to rule India's ports.","B":"Zheng He and Ma Huan were Muslims, but the voyages served the emperor's goals, not the spread of Islam.","C":"Pirate raids worried the Ming, but they were on China's own coast. Zheng He's visit gave Calicut's king a title and gifts."},"hint":"What did Zheng He give the king, and what did the Ming expect in return?"},{"id":"U2-P24","set":"P8","topic":"2.3","lo":"F","skill":"2.B","difficulty":"medium","stem":"Ma Huan most likely recorded details such as how prices were set and how merchants counted in order to","options":{"A":"persuade the Ming emperor to stop sending fleets abroad","B":"inform Chinese readers about doing business in a foreign port","C":"record the tribute that Calicut owed to the Ming emperor","D":"warn Chinese traders that Calicut's merchants were dishonest"},"answer":"B","explanation":"Ma Huan was an interpreter on Zheng He's ships. His book told Chinese readers about the lands the fleets visited, including useful facts about trade, money, and prices.","whyNot":{"A":"Ma Huan sailed with the fleets and describes their work. Nothing here argues against the voyages.","C":"Prices and finger-counting are about trade in the market, not about tribute owed to the emperor.","D":"Ma Huan says the people \"like sincerity\" and \"do not make an error of a fraction.\""},"hint":"Ma Huan was part of the fleet. What would other Chinese officials and traders want to know?"},{"id":"U2-P25","set":"P9","topic":"2.3","lo":"F","skill":"3.A","difficulty":"easy","stem":"According to the passage, the emperor sent Zheng He's fleets mainly to","options":{"A":"conquer lands overseas where Chinese farmers could settle","B":"find new supplies of silver to back the empire's paper money","C":"trace a rival and show foreign lands that China was rich and strong","D":"spread Confucian teachings to the kings and chiefs of foreign countries"},"answer":"C","explanation":"The History of the Ming gives two reasons. The emperor wanted to find the ruler he had overthrown. He also wanted foreign lands to see China's wealth and power.","whyNot":{"A":"The fleets used force against rulers who resisted, but they did not set up colonies for settlers.","B":"The passage does not mention silver or paper money.","D":"The passage says the envoys made known \"the orders from the Emperor,\" not Confucian teachings."},"hint":"Read the second paragraph. What two goals does it give?"},{"id":"U2-P26","set":"P9","topic":"2.3","lo":"F","skill":"2.C","difficulty":"hard","stem":"Which of the following is the most likely limitation of the passage as a source about Zheng He's voyages?","options":{"A":"Its writers may have shared later officials' doubts about the voyages' cost.","B":"Its writers were palace eunuchs who wanted to praise Zheng He.","C":"It was written during the voyages, before anyone knew how they would end.","D":"It describes the first voyage but leaves out the later ones."},"answer":"A","explanation":"The history was written by Qing scholar-officials long after the voyages. Many Confucian officials disliked the voyages, which were led by palace eunuchs and cost a great deal. The last sentence, \"what China had spent on them was not little,\" shows that view.","whyNot":{"B":"The attribution says scholar-officials of the Qing dynasty wrote it. They were not palace eunuchs, and the last sentence questions the cost.","C":"The history was completed in 1739, more than 300 years after the voyages.","D":"The passage says Zheng He was sent as envoy seven times and lists more than thirty countries he visited."},"hint":"A limitation is a reason to be careful. Who wrote this history, and what does the last sentence suggest?"},{"id":"U2-P27","set":"P9","topic":"2.3","lo":"F","skill":"5.B","difficulty":"medium","stem":"Which of the following best explains why the Ming stopped sending fleets like those described in the passage after the 1430s?","options":{"A":"Rulers in Southeast Asia and India refused to receive any more Chinese envoys.","B":"Officials judged the voyages too costly and turned to defending the north.","C":"The fleets had failed to reach any lands beyond Southeast Asia.","D":"Storms sank most of the treasure ships on the last voyage."},"answer":"B","explanation":"The voyages were very expensive. Many officials thought the money was better spent at home, especially on defense against the Mongols in the north. After Zheng He died, the great fleets stopped.","whyNot":{"A":"Many rulers welcomed the envoys and sent tribute to China.","C":"The fleets went far past Southeast Asia. The passage names Calicut, Hormuz, Mogadishu, and Arabia.","D":"The fleet came home from its last voyage in 1433. The voyages ended because of their cost and court politics, not storms."},"hint":"The last sentence of the passage gives a clue. What else was the Ming worried about?","reasoning":"Causation"},{"id":"U2-P28","set":"P10","topic":"2.4","lo":"H","skill":"3.A","difficulty":"easy","stem":"The first paragraph best supports which claim about trans-Saharan trade?","options":{"A":"West African traders carried salt north to sell in Morocco.","B":"Salt was cheap in Mali because it was mined close to the capital.","C":"Traders in Mali used gold coins, not salt, in everyday buying and selling.","D":"Salt from the Sahara mines sold for more the farther south it was carried."},"answer":"D","explanation":"A load of salt sold for 8 to 10 mithqals at Walata, at the southern edge of the desert, and for 20 to 40 in the city of Mali, farther south. West Africa had gold but little salt, so salt was worth more the farther it traveled from the mines.","whyNot":{"A":"Ibn Battuta says the people of the south \"come up\" and \"take away the salt.\" Salt went south.","B":"Taghaza is in the desert, far north of Mali's capital. A load sold for 8 to 10 mithqals at Walata but for 20 to 40 in the town of Malli.","C":"Ibn Battuta says people in Mali \"cut it up into pieces and buy and sell with it.\""},"hint":"Compare the price of a load of salt at Iwalatan (Walata) and in the town of Malli."},{"id":"U2-P29","set":"P10","topic":"2.7","lo":"L","skill":"5.A","difficulty":"medium","stem":"Trans-Saharan trade as described in the passage differed most from Indian Ocean trade in the same period in that it","options":{"A":"carried luxury goods instead of everyday goods such as food, cloth, and salt","B":"relied on river boats for most of the distance between Morocco and Mali","C":"relied mainly on camels and desert guides rather than on ships and seasonal winds","D":"used gold coins minted in Mali instead of salt as its main money"},"answer":"C","explanation":"Both networks needed knowledge of nature. Indian Ocean sailors timed voyages to the monsoon winds. Desert caravans needed camels, experienced guides, and messengers like the takshif, who went ahead to arrange water and lodging.","whyNot":{"A":"Salt, an everyday good, was a main good in this trade, along with gold.","B":"Ibn Battuta's caravan crossed the desert by camel. He describes sand and water stops, not river boats.","D":"Ibn Battuta says people in Mali used salt as money. He gives prices in gold mithqals but does not describe coins made in Mali."},"hint":"How did each network move goods, and what did travelers need to know?","reasoning":"Comparison"},{"id":"U2-P30","set":"P10","topic":"2.4","lo":"I","skill":"5.B","difficulty":"medium","stem":"Trade like that described in the passage most directly contributed to which development in West Africa in the period c. 1200–1450?","options":{"A":"The spread of Christianity south across the Sahara from North Africa","B":"The growth of the Mali Empire and of trading cities such as Timbuktu","C":"A decline in West African gold mining as salt became more valuable","D":"The rise of Great Zimbabwe as the main supplier of gold to North Africa"},"answer":"B","explanation":"Mali's rulers grew rich by taxing the gold and salt trade. Trading cities like Walata, Timbuktu, and Gao grew along the routes. Muslim merchants and scholars came with the caravans.","whyNot":{"A":"Islam, not Christianity, spread with the trans-Saharan trade.","C":"Gold was what West Africa traded for salt. Gold mining kept going.","D":"Great Zimbabwe was in southern Africa. Its gold went to the Indian Ocean coast, not across the Sahara."},"hint":"Who collected taxes on this trade? What happened to the towns along the routes?","reasoning":"Causation"},{"id":"U2-P31","set":"P11","topic":"2.4","lo":"I","skill":"3.A","difficulty":"easy","stem":"Ibn Khaldun's account best supports which claim about the rulers of Mali?","options":{"A":"They sent armies north to conquer the Muslim kingdom of Morocco.","B":"They practiced Islam and kept ties with other Muslim states.","C":"They made Arabic the everyday language of most people in Mali.","D":"They were appointed to their thrones by the Mamluk sultans of Egypt."},"answer":"B","explanation":"Several of Mali's kings made the pilgrimage to Mecca. Mansa Musa also wrote letters to the sultan of Morocco. Islam linked Mali to the wider Muslim world.","whyNot":{"A":"Mansa Musa kept up a \"friendly correspondence\" with the sultan of Morocco. Ibn Khaldun describes no war against Morocco.","C":"Ibn Khaldun mentions \"the language of that country,\" not Arabic, as the people's language.","D":"Mali's kings passed the throne within their own family. Egypt did not choose them."},"hint":"What journeys and letters does Ibn Khaldun mention?"},{"id":"U2-P32","set":"P11","topic":"2.5","lo":"J","skill":"5.B","difficulty":"medium","stem":"Abu Ishak's work for Mansa Musa, described in the last paragraph, best illustrates which result of Mali's ties to the Muslim world?","options":{"A":"The arrival of Muslim scholars and builders in Mali's cities","B":"The spread of West African building styles north to Muslim Spain","C":"Mali's adoption of camels to carry goods within the kingdom","D":"Egypt's growing control over the government of Mali"},"answer":"A","explanation":"Mansa Musa's pilgrimage linked Mali with skilled people from other Muslim lands. Ibn Khaldun says Abu Ishak, a poet from Granada, put up a fine palace for the king. Musa also brought Muslim scholars back to Mali.","whyNot":{"B":"It went the other way. Abu Ishak came from Spain to Mali.","C":"Ibn Khaldun says camels \"are not used\" in Mali, where baggage was carried on people's backs.","D":"Mali kept its own kings. Mansa Musa visited Egypt as a guest."},"hint":"Where was Abu Ishak from, and what did he do for Mansa Musa?","reasoning":"Causation"},{"id":"U2-P33","set":"P11","topic":"2.4","lo":"I","skill":"3.B","difficulty":"medium","stem":"Ibn Khaldun's information about the gold Mansa Musa brought to Egypt comes mainly from","options":{"A":"his own visit to the court of Mali during the pilgrimage","B":"the written records of Mali's royal treasury","C":"what an interpreter for Mali's people in Cairo told him","D":"a letter that Mansa Musa sent to the sultan of Morocco"},"answer":"C","explanation":"Ibn Khaldun names his source: the Haji Tunis, the interpreter for Mali's people in Cairo. He wrote decades after the pilgrimage, so he relied on what people told him.","whyNot":{"A":"Ibn Khaldun lived in North Africa and Egypt. He does not say he visited Mali.","B":"Ibn Khaldun names a person, not written records, as his source.","D":"The passage mentions letters between the two rulers, but not as the source of this report."},"hint":"How does Ibn Khaldun show where he got this fact?"},{"id":"U2-P34","set":"P12","topic":"2.5","lo":"J","skill":"3.A","difficulty":"easy","stem":"According to Rashid al-Din, Chinese printers who made copies of important books","options":{"A":"used movable metal type that had first been made in Persia","B":"copied books by hand in offices run by the government","C":"sold printed books freely in markets without government control","D":"carved each page onto a tablet and used it to print copies"},"answer":"D","explanation":"This was block printing. A writer copied a page, and carvers cut away the wood around the letters so the writing stood up from the board. Printers inked the board and laid paper on it to make each copy.","whyNot":{"A":"Rashid describes whole pages carved on tablets, not separate pieces of type from Persia.","B":"A calligraphist wrote each page once, but engravers carved it and the tablets printed the copies.","C":"A committee kept the tablets, and buyers paid \"dues and charges fixed by the Government.\""},"hint":"Follow the steps: who writes, who carves, and how is a copy made?"},{"id":"U2-P35","set":"P12","topic":"2.2","lo":"D","skill":"4.A","difficulty":"medium","stem":"Rashid al-Din's description of Chinese printing is best understood in the context of","options":{"A":"the Abbasid caliphs' support for scholars in Baghdad","B":"the conversion of the Yuan emperors of China to Islam","C":"Venetian treaties that gave Italian merchants rights in Tabriz","D":"close ties between Mongol-ruled Persia and Mongol-ruled China"},"answer":"D","explanation":"Mongol khans ruled both Persia and China. Officials, envoys, and scholars moved between the two. That is how a Persian minister learned so much about China.","whyNot":{"A":"The Abbasid caliphate in Baghdad ended when the Mongols took the city in 1258, about fifty years before Rashid wrote.","B":"The Yuan emperors of China did not become Muslims. Some Ilkhans of Persia did.","C":"Venice did trade in Tabriz, but Italian merchants did not bring knowledge of Chinese printing."},"hint":"Think about who ruled Persia when Rashid al-Din wrote. How could a Persian official learn so much about China?"},{"id":"U2-P36","set":"P12","topic":"2.5","lo":"J","skill":"2.A","difficulty":"medium","stem":"Rashid al-Din's point of view about printing is best described as a belief that it","options":{"A":"made books cheap enough for ordinary people to buy","B":"kept important books correct and unchanged","C":"spread Chinese ideas to Persia and the Islamic world","D":"replaced the work of skilled calligraphists"},"answer":"B","explanation":"Rashid praises printing because no one could add or leave out words. He says it is \"impossible that there should be any addition or omission.\" To him, printing protected accuracy.","whyNot":{"A":"Printing did make books cheaper, but Rashid does not mention this. He stresses accuracy.","C":"Rashid's writing did help Persians learn about China, but he does not say printing is for this. He stresses accuracy.","D":"Rashid says a calligraphist still copies each page first."},"hint":"Read the last sentence. What does Rashid think printing protects?"},{"id":"U2-P37","set":"P13","topic":"2.6","lo":"K","skill":"3.C","difficulty":"easy","stem":"Which of the following best describes a similarity between the two sources?","options":{"A":"Both describe people turning to public prayer in response to the plague.","B":"Both say the plague was a punishment sent by God for people's sins.","C":"Both describe officials closing the city to sick travelers.","D":"Both describe Christians and Muslims praying together for relief."},"answer":"A","explanation":"In Florence, people held \"public procession\" and prayers. In Damascus, the whole city fasted and marched to a mosque. In both places people turned to God for help.","whyNot":{"B":"Only Source 1 suggests the plague may have come from God's anger, and it also names the stars.","C":"Only Source 1 says the sick were kept out of the city.","D":"Only Source 2 describes people of different faiths together. Source 1 is about Christian Florence."},"hint":"Find what the people of each city did to try to stop the plague.","reasoning":"Comparison"},{"id":"U2-P38","set":"P13","topic":"2.6","lo":"K","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Source 1 blames the plague on foreign merchants, while Source 2 blames it on the stars.","B":"Source 1 describes city officials acting, while Source 2 describes people acting without their rulers.","C":"Source 1 says the plague came from the West, while Source 2 says it came from the far East.","D":"Source 1 stresses people deserting each other, while Source 2 stresses people uniting."},"answer":"D","explanation":"Both writers mention public prayer. But Boccaccio stresses that even parents abandoned their children, while Ibn Battuta stresses Muslims, Jews, and Christians marching together. The writers highlight different responses.","whyNot":{"A":"Source 1 suggests the stars or God's anger. Neither source blames merchants.","B":"In Damascus the viceroy ordered the fast, and amirs and qadis joined the procession.","C":"Source 1 says the plague began \"in the East\" and spread \"into the West.\""},"hint":"Both writers describe prayer. What else does each one stress about how people treated each other?","reasoning":"Comparison"},{"id":"U2-P39","set":"P13","topic":"2.6","lo":"K","skill":"1.B","difficulty":"medium","stem":"Source 1's statement that Florence refused \"entrance to all sick folk\" best illustrates which response to the plague?","options":{"A":"Groups of flagellants marching from town to town to beg God's mercy","B":"City governments hiring doctors to treat the sick in public hospitals","C":"City governments trying to stop the disease by controlling who could enter","D":"Town leaders blaming Jewish communities for spreading the disease on purpose"},"answer":"C","explanation":"Florence kept sick people out of the city. In 1377, Ragusa (Dubrovnik) went further and made travelers from places with plague wait outside the city before they could enter. That waiting rule was an early form of quarantine.","whyNot":{"A":"Flagellants did march in some lands, but this statement describes a rule made by Florence's officials.","B":"Some cities did hire doctors, but refusing entrance to the sick is about controlling who could come in.","D":"Some towns did blame Jews and attacked them, but Boccaccio describes keeping the sick out."},"hint":"What did the officials of Florence do at the city gates?"},{"id":"U2-P40","set":"P14","topic":"2.6","lo":"K","skill":"3.A","difficulty":"easy","stem":"De Candolle's main point in the passage is that","options":{"A":"Arab traders and conquerors carried crops from Asia west to the Mediterranean","B":"Crusaders were the first to bring sugar-cane and oranges from Asia to Europe","C":"Italian merchants brought rice from China to Italy along the Silk Roads","D":"the Mongol conquests carried Asian crops into Spain and Sicily"},"answer":"A","explanation":"Sugar-cane, the bitter orange, and rice came from South and Southeast Asia. Arab traders, farmers, and armies carried them to Egypt, Sicily, and Spain.","whyNot":{"B":"De Candolle says the Crusaders saw the orange in Palestine. The Arabs had already brought it to Sicily by 1002.","C":"De Candolle says the Arabs brought rice to Spain, and rice reached Italy only in 1468.","D":"The Arabs brought these crops west centuries before the Mongol conquests."},"hint":"Trace the path of each crop. Where did it start, and who carried it?"},{"id":"U2-P41","set":"P14","topic":"2.6","lo":"K","skill":"3.B","difficulty":"medium","stem":"Which evidence does de Candolle use to support his claim about how the orange spread west?","options":{"A":"Orange seeds that archaeologists found in the tombs of ancient Egypt","B":"Records of orange sales kept by merchants in the markets of Venice","C":"His own experiments growing different kinds of oranges in Spain","D":"The way the fruit's name changed from Sanskrit to Arabic to Italian"},"answer":"D","explanation":"De Candolle uses the fruit's name as a clue. The Sanskrit name nagarunga became narunj in Arabic and naranzi in Italian. He argues that the name traveled with the fruit, so it points to the path the orange took.","whyNot":{"A":"De Candolle does not mention seeds from Egyptian tombs for the orange.","B":"The passage does not mention market records from Venice.","C":"De Candolle uses old names and writings, not his own experiments."},"hint":"Look at the strange words in the second paragraph. What do they show?"},{"id":"U2-P42","set":"P14","topic":"2.6","lo":"K","skill":"5.A","difficulty":"medium","stem":"The spread of crops described in the passage is most similar to which other development before 1450?","options":{"A":"The adoption of fast-ripening Champa rice by farmers in China","B":"The clearing of forests to make new farmland in western Europe","C":"The building of farming terraces on steep slopes in the Andes","D":"The use of chinampas, or floating gardens, in the Valley of Mexico"},"answer":"A","explanation":"Champa rice came from Champa, in what is now Vietnam. It grew fast and resisted drought. Like oranges and sugar, it was a crop that moved from one region to another and changed farming there. The other choices changed the land, not where a crop was grown.","whyNot":{"B":"Clearing forests added farmland, but it did not move a crop from one region to another.","C":"Terraces changed the land so it could be farmed. They did not move a crop to a new region.","D":"Chinampas were a way to farm in shallow lakes. They did not move a crop from one region to another."},"hint":"Does each choice move a crop to a new place, or change the land so it can be farmed?","reasoning":"Comparison"},{"id":"U2-P43","set":"P15","topic":"2.1","lo":"A","skill":"1.A","difficulty":"easy","stem":"Along routes like the one shown, caravans most often stopped for the night at","options":{"A":"caravanserai, roadside inns built for travelers and their animals","B":"Buddhist monasteries, where monks sold silk to passing caravans","C":"fondacos, warehouses that Italian merchants kept in port cities","D":"military forts, where soldiers inspected and taxed the caravans' goods"},"answer":"A","explanation":"Caravanserai had a courtyard for animals and rooms for merchants and their goods. Many were built about a day's travel apart along main routes. They made long journeys easier and safer.","whyNot":{"B":"Some monasteries hosted travelers, but they were not the usual stopping places or silk markets for caravans.","C":"Fondacos were trading posts in port cities, such as the one at Zaytun. They were not stops along overland routes.","D":"Soldiers guarded some routes, and some inns had thick walls like forts. But caravanserai were built to shelter merchants, their goods, and their animals."},"hint":"Caravans needed a safe place to rest and keep their animals and goods. What were those places called?"},{"id":"U2-P44","set":"P15","topic":"2.2","lo":"B","skill":"5.B","difficulty":"medium","stem":"Long caravan journeys like the one shown became harder and riskier in the late 1300s mainly because","options":{"A":"Chinese silk lost its value once Italian cities began weaving silk","B":"the Mongol khanates broke apart and the Yuan dynasty fell","C":"the Ottoman Turks took Constantinople and closed the routes to the east","D":"Portuguese ships had opened a sea route around Africa to India"},"answer":"B","explanation":"Mongol rule had helped keep the long routes open. In the mid-1300s the khanates fought among themselves and the plague spread. In 1368 the Ming drove the Mongols out of China. Wars and new rulers made some routes harder to use, but caravans still reached cities like Samarkand.","whyNot":{"A":"Italian cities did weave silk, but demand for Chinese silk stayed high.","C":"The Ottomans did not take Constantinople until 1453, long after the late 1300s.","D":"Portuguese ships did not reach India by sailing around Africa until 1498."},"hint":"Who kept these long routes safe? What happened to them after about 1350?","reasoning":"Causation"},{"id":"U2-P45","set":"P15","topic":"2.7","lo":"L","skill":"5.A","difficulty":"medium","stem":"The way goods moved in the image is most similar to the way goods moved","options":{"A":"across the Indian Ocean between Gujarat and East Africa","B":"along the Grand Canal between southern and northern China","C":"between the Italian city-states and the ports of Flanders","D":"across the Sahara between North Africa and Mali"},"answer":"D","explanation":"Both the Silk Roads and the trans-Saharan routes crossed long stretches of dry land between trading cities. Merchants joined camel caravans to carry goods long distances and to stay safe.","whyNot":{"A":"Goods crossed the Indian Ocean by ship, timed to the monsoon winds.","B":"Goods on the Grand Canal moved on boats and barges, not on camels.","C":"Goods moved between Italy and Flanders mostly by sea, or by road and river, not in camel caravans."},"hint":"Look at how the goods travel and the kind of land they cross. Which other route had the same problems to solve?","reasoning":"Comparison"},{"id":"U2-P46","set":"P16","topic":"2.6","lo":"K","skill":"3.A","difficulty":"easy","stem":"Gasquet's main argument in the first paragraph is that","options":{"A":"the plague started among Italian merchants at Caffa and then spread to the Mongols","B":"the plague spread to Europe from North Africa across the Mediterranean","C":"the plague most likely reached Europe along trade routes from the East","D":"the plague reached Europe with pilgrims returning from Mecca and Jerusalem"},"answer":"C","explanation":"Gasquet says trading caravans from the East most likely carried the plague, and de' Mussi says ships from Caffa carried it on. The disease reached the Black Sea ports first and then Italy.","whyNot":{"A":"Gasquet says the plague was raging among the Tartars in the East first.","B":"Gasquet points to caravans from the East and ships from Caffa, in the Crimea, not to North Africa.","D":"Gasquet points to trade caravans and ships, not pilgrims."},"hint":"What does Gasquet say the trading caravans and ships carried besides goods?","reasoning":"Causation"},{"id":"U2-P47","set":"P16","topic":"2.6","lo":"K","skill":"2.C","difficulty":"medium","stem":"A historian would most likely be careful about using de' Mussi's account of the siege of Caffa because","options":{"A":"de' Mussi was a Mongol official who wanted to blame the Italian merchants","B":"de' Mussi wrote in the Mongol language, so his words passed through many translators","C":"de' Mussi wrote from what survivors told him rather than from what he saw","D":"de' Mussi wrote more than a century after the siege took place"},"answer":"C","explanation":"De' Mussi lived in Piacenza, in Italy, and did not see the siege. Gasquet says he reported \"what he gathered from the survivors.\" His report shows what people were saying, but historians need other evidence to check the details.","whyNot":{"A":"Gasquet calls de' Mussi \"a notary of Piacenza,\" in Italy. He was not a Mongol official.","B":"The attribution says de' Mussi wrote in Latin, which Gasquet translated. He did not write in the Mongol language.","D":"The siege was in 1346, and de' Mussi died in 1356. He wrote within a few years of the events."},"hint":"What could de' Mussi know for himself, and what did he hear from others?"},{"id":"U2-P48","set":"P16","topic":"2.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"The events at Tana and Caffa described in the passage best illustrate which development in the 1340s?","options":{"A":"Mongol rulers sometimes turned against the foreign merchants in their lands.","B":"Italian city-states sent armies to conquer the Mongol lands north of the Black Sea.","C":"The Ottoman Empire drove the Mongols out of the Crimea.","D":"Genoa and Venice ended their trade with the ports of the Black Sea."},"answer":"A","explanation":"The Golden Horde, a Mongol khanate, had let Italian merchants trade at Tana and Caffa. In the 1340s its army attacked both towns. Trade under the Mongols paid well, but it depended on the khans' goodwill.","whyNot":{"B":"The Italians defended Caffa, but they did not try to conquer the steppe.","C":"The Ottomans did not take Caffa until 1475.","D":"Italian merchants went on trading at Caffa and other Black Sea ports after the siege."},"hint":"Who besieged Tana and Caffa, and who lived inside them?"}],"exam":{"title":"Unit 2 Practice Exam: Networks of Exchange","timeMinutes":25,"questionCount":25,"directions":"Each set of questions refers to a source: a primary source, a historian's writing, an image, or data. For each question, choose the best answer. Use the source and your knowledge of world history from c. 1200 to c. 1450. There is no penalty for guessing. Some sources use historical labels or insulting descriptions of other peoples and religions; these words show the writers' views.","questions":[{"id":"U2-E01","set":"X1","topic":"2.2","lo":"C","skill":"4.A","difficulty":"easy","stem":"Pegolotti's claim that the road from Tana to Cathay was \"perfectly safe\" is best understood in the context of","options":{"A":"Mamluk Egypt's control of the caravan routes across Central Asia","B":"Mongol khanates' rule over most of the lands between the Black Sea and China","C":"the Byzantine Empire's protection of merchants who traveled east from Constantinople","D":"the conversion of the peoples of the steppe to Christianity by Franciscan friars"},"answer":"B","rationales":{"A":"Incorrect. The Mamluks ruled Egypt and Syria and fought the Mongols. They did not control routes in Central Asia.","B":"Correct. The Golden Horde, the Chagatai Khanate, and the Yuan dynasty ruled the lands along Pegolotti's route. Their rule kept the roads open.","C":"Incorrect. By the 1300s the Byzantine Empire was small and weak. It could not protect roads that ran thousands of miles to the east.","D":"Incorrect. A few friars worked in Central Asia, but most steppe peoples did not become Christian. Pegolotti's warnings are about rulers, not religion."},"explanation":"In the 1300s the Mongol khanates still ruled the steppe from the Black Sea to China. Their peace, sometimes called the Pax Mongolica, let merchants travel the whole way in relative safety."},{"id":"U2-E02","set":"X1","topic":"2.7","lo":"L","skill":"5.A","difficulty":"medium","stem":"The exchange of silver for paper money described in the last paragraph is most similar to which other commercial practice of the period c. 1200–1450?","options":{"A":"Cowrie shells, which merchants used as money in the markets of Mali","B":"Commenda contracts, which let investors share the risks and profits of a trading voyage","C":"Gold dinars, which Muslim rulers minted for use in long-distance trade","D":"Bills of exchange, which let merchants pay with paper instead of carrying coins"},"answer":"D","rationales":{"A":"Incorrect. Cowrie shells were a kind of money, but they were objects that still had to be carried. They did not replace metal money with paper.","B":"Incorrect. A commenda let investors share the risk and profit of a trading trip. It did not replace heavy coins with paper.","C":"Incorrect. Gold dinars were metal coins. Carrying heavy coins is what paper money and bills of exchange helped merchants avoid.","D":"Correct. A bill of exchange was a written order telling a banker in another city to pay. Like the Khan's paper money, it let merchants trade without carrying heavy metal."},"explanation":"Merchants handed their silver to the Khan's treasury and got paper money that was lighter to carry. Bills of exchange also let merchants trade without carrying heavy coins, though the two worked in different ways.","reasoning":"Comparison"},{"id":"U2-E03","set":"X1","topic":"2.1","lo":"A","skill":"3.D","difficulty":"medium","stem":"Which detail in the passage most directly qualifies Pegolotti's claim that the road was \"perfectly safe\"?","options":{"A":"His advice to pay more for a good dragoman instead of a bad one","B":"His warning about what can happen when the lord of a country dies","C":"His statement that the lord of Cathay takes the merchants' silver","D":"His description of Cambalec as a city with a vast amount of trade"},"answer":"B","rationales":{"A":"Incorrect. The advice about dragomen is about getting good help for the money. It does not say the road is dangerous.","B":"Correct. Pegolotti says that after a lord dies, \"neither will the roads be safe to travel\" until a new lord is proclaimed. So the road was not safe at all times.","C":"Incorrect. The lord takes the silver but gives paper money in exchange, and Pegolotti says prices are no higher. This is not a danger on the road.","D":"Incorrect. The busy trade at Cambalec explains why merchants made the trip. It says nothing about danger on the road."},"explanation":"Pegolotti says the road is safe while a ruler is firmly in power. But he warns that when a ruler dies, the roads are not safe until a new one is named. His claim did not hold at all times."},{"id":"U2-E04","set":"X2","topic":"2.2","lo":"D","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Source 1 stresses the destruction of the Mongol conquests, while Source 2 stresses the mixing of cultures under Mongol rule.","B":"Source 1 describes Mongol rule after the conquests, while Source 2 describes the conquests themselves.","C":"Source 1 explains why the Mongol conquests succeeded, while Source 2 explains why the Ilkhans' rule later collapsed.","D":"Source 1 says the Mongols depended on supplies from local farmers, while Source 2 says they depended on trade."},"answer":"A","rationales":{"A":"Correct. Ibn al-Athir calls the conquest \"the death-blow of Islam.\" Carter describes peoples of many faiths and lands mingling in Mongol Persia.","B":"Incorrect. It is the reverse. Source 1 describes the invasion of 1220–1221, and Source 2 describes Persia later, under the Ilkhans.","C":"Incorrect. Source 1 does explain the Mongols' quick success, but Source 2 describes Persia under the Ilkhans, not the end of their rule.","D":"Incorrect. Source 1 says the Mongols \"need no commissariat\" because they brought their own herds."},"explanation":"Ibn al-Athir lived through the first Mongol attacks on the Muslim world. Carter, writing 700 years later, looked at what happened after the conquests, when Persia became a crossroads of cultures.","reasoning":"Comparison"},{"id":"U2-E05","set":"X2","topic":"2.2","lo":"B","skill":"2.C","difficulty":"medium","stem":"Source 1 would be most useful to a historian studying","options":{"A":"how many people lived in each city the Mongols captured","B":"how Mongol commanders planned their campaigns into Central Asia","C":"the religious beliefs that the Mongol rulers of Persia later adopted","D":"how Muslim writers of the time reacted to the Mongol invasions"},"answer":"D","rationales":{"A":"Incorrect. Ibn al-Athir describes the cities the Mongols took, but he gives no counts of their people here.","B":"Incorrect. Ibn al-Athir wrote in Mosul, far from the Mongol leaders. He describes what they did, not how they planned it.","C":"Incorrect. Ibn al-Athir died in 1233, before the Ilkhans began to rule Persia in the 1250s. He could not describe the religions they chose later.","D":"Correct. Ibn al-Athir shows his own horror. He says he \"shrank from recording\" the events and calls them a calamity for Islam."},"explanation":"Ibn al-Athir was a Muslim historian writing as the Mongols swept into Muslim lands. His fear and grief show how one Muslim writer of the time reacted to the invasions."},{"id":"U2-E06","set":"X2","topic":"2.2","lo":"D","skill":"5.B","difficulty":"medium","stem":"The developments described in Source 2 most directly contributed to which of the following?","options":{"A":"A sharp drop in trade between Persia and the Italian city-states","B":"The replacement of Persian by Chinese as the language of the Ilkhan court","C":"The transfer of Chinese knowledge and techniques to Persia and the Islamic world","D":"The rise of Tabriz as the capital of a united Mongol Empire"},"answer":"C","rationales":{"A":"Incorrect. Carter says the opposite. Venice signed treaties with Tabriz in 1305 and 1320 that gave its merchants special rights.","B":"Incorrect. Persian stayed the language of government and learning. Rashid al-Din wrote his history in Persian.","C":"Correct. Chinese officials, engineers, and craftsmen worked in Mongol Persia. Ideas such as block printing came west with them.","D":"Incorrect. Tabriz was the capital of the Ilkhans of Persia. By then the Mongol Empire had split into separate khanates."},"explanation":"Mongol rule linked Persia and China. Scholars, officials, and craftsmen moved between them. Persian writers learned about Chinese printing, medicine, and farming.","reasoning":"Causation"},{"id":"U2-E07","set":"X2","topic":"2.2","lo":"D","skill":"3.D","difficulty":"hard","stem":"Which of the following, if true, would most support the argument of Source 2?","options":{"A":"Mongol armies destroyed many of Baghdad's libraries when they took the city in 1258.","B":"Mamluk armies defeated the Mongols at Ain Jalut in 1260 and stopped their advance into Egypt.","C":"The plague spread from the Golden Horde to Italian ports on the Black Sea in the 1340s.","D":"The Ilkhans issued paper money in Tabriz in 1294, copying the notes of Mongol-ruled China."},"answer":"D","rationales":{"A":"Incorrect. The attack on Baghdad shows Mongol destruction. That fits Source 1 better than Source 2.","B":"Incorrect. Ain Jalut is about the limits of Mongol military power. It says nothing about mixing cultures in Persia.","C":"Incorrect. The spread of the plague is about disease along trade routes, not about cultural exchange in Persia.","D":"Correct. Persian paper money with Chinese writing on it shows Chinese influence in Persia, just as Carter argues."},"explanation":"Carter argues that Chinese, Muslim, and European influences met in Mongol Persia. A Persian copy of Chinese paper money is a strong example. The plan soon failed, but it shows how closely the two Mongol states were linked."},{"id":"U2-E08","set":"X3","topic":"2.3","lo":"F","skill":"3.A","difficulty":"easy","stem":"The passage suggests that Malacca's ruler welcomed the visit of Zheng He in 1409 mainly because","options":{"A":"Zheng He's soldiers drove Siamese troops out of Malacca by force","B":"the Ming emperor gave Malacca control of trade with Java","C":"recognition by the Ming emperor protected Malacca from Siam","D":"Chinese merchants agreed to stop trading at other ports nearby"},"answer":"C","rationales":{"A":"Incorrect. The passage describes gifts, seals, and a new title, not fighting. Siam simply stopped bothering Malacca after the visit.","B":"Incorrect. The passage does not mention Java or any grant of trade rights.","C":"Correct. Malacca had paid tribute to Siam. After Zheng He's visit, \"the Siamese did not venture to molest it any more.\"","D":"Incorrect. Chinese ships kept trading at many ports. The passage does not mention such an agreement."},"explanation":"Ma Huan says Malacca had paid gold to Siam. After Zheng He brought the emperor's seals and raised it to a kingdom, Siam stopped bothering it. Malacca's ruler then sent tribute to the Ming court, which built close ties with China."},{"id":"U2-E09","set":"X3","topic":"2.3","lo":"G","skill":"5.B","difficulty":"medium","stem":"The fleet's long stay at Malacca on its way home, described in the last paragraph, is best explained by the fact that","options":{"A":"Ming law forbade ships to sail home during the winter months","B":"Siam's navy blocked the strait to ships for part of each year","C":"sailors timed their voyages to the seasonal monsoon winds","D":"Ming ships had to wait for Malay pilots who knew the way to China"},"answer":"C","rationales":{"A":"Incorrect. The fleet left in the fifth month, about June. Ma Huan says it was waiting for a favourable wind, not for a legal sailing season.","B":"Incorrect. The passage says Siam stopped threatening Malacca after 1409. It does not mention a blockade.","C":"Correct. Monsoon winds blow one way for part of the year and the other way the rest of the year. Ships had to wait for \"a favourable southwind\" to sail north to China.","D":"Incorrect. Ma Huan says the ships waited for \"a favourable southwind.\" He does not mention waiting for pilots."},"explanation":"Indian Ocean sailors depended on the monsoons. Winds from the south and southwest blow in summer, which carried ships north toward China. Ports like Malacca grew because ships stopped there to wait for the right wind.","reasoning":"Causation"},{"id":"U2-E10","set":"X3","topic":"2.3","lo":"E","skill":"5.A","difficulty":"medium","stem":"Malacca's development as described in the passage is most similar to that of","options":{"A":"Great Zimbabwe, an inland state that grew rich from the gold trade of southern Africa","B":"Kilwa, a Swahili city-state that grew rich from Indian Ocean trade","C":"Mali, a West African empire that grew from trade across the Sahara","D":"the Delhi Sultanate, which grew by conquering lands in northern India"},"answer":"B","rationales":{"A":"Incorrect. Great Zimbabwe traded gold through the coast, but it was an inland state, not a port.","B":"Correct. Like Malacca, Kilwa was a port city with Muslim rulers. It grew by serving ships and merchants that crossed the Indian Ocean.","C":"Incorrect. Mali was a large inland empire built on caravan trade, not a port city.","D":"Incorrect. The Delhi Sultanate grew through conquest by land, not by serving sea trade."},"explanation":"Both Malacca and Kilwa were small port states whose wealth came from Indian Ocean trade. Both had Muslim rulers and drew merchants from many lands.","reasoning":"Comparison"},{"id":"U2-E11","set":"X4","topic":"2.4","lo":"I","skill":"4.A","difficulty":"easy","stem":"The way the mapmaker portrayed the king of Mali is best understood in the context of","options":{"A":"Mali's use of cowrie shells and copper as money in its everyday markets","B":"the fame of Mali's gold and of Mansa Musa's pilgrimage to Mecca in 1324","C":"the arrival of Italian merchants who traded directly at the court of Mali","D":"the fall of Mali's power after an invasion of its lands from Morocco"},"answer":"B","rationales":{"A":"Incorrect. Markets in Mali did use cowries and copper, but the map shows the king holding gold. That points to Mali's fame for gold.","B":"Correct. Mansa Musa crossed Egypt with huge amounts of gold on his way to Mecca. Stories of his wealth spread to North Africa and Europe.","C":"Incorrect. European merchants did not trade at Mali's court in this period. News of Mali reached Europe through North African traders.","D":"Incorrect. Morocco's invasion came in 1591, more than 200 years after this map, and it struck Songhai, not Mali."},"explanation":"Mansa Musa's pilgrimage made Mali famous. He brought so much gold through Cairo that people talked about it for years. About fifty years later, a European mapmaker still showed Mali's king holding gold."},{"id":"U2-E12","set":"X4","topic":"2.4","lo":"H","skill":"2.A","difficulty":"medium","stem":"The towns labeled on the map, such as Tagaza and Tenbuch, suggest that news about West Africa most likely reached the mapmaker through","options":{"A":"merchants who traveled the trade routes across the Sahara","B":"maps of the empire sent to Europe by the royal scribes of Mali","C":"European sailors who had explored the rivers of West Africa","D":"Muslim pilgrims from Mali who stopped in Majorca on their way to Mecca"},"answer":"A","rationales":{"A":"Correct. Taghaza's salt mines and Timbuktu's markets were stops on the caravan routes. Majorca traded with North African ports where traders shared such news.","B":"Incorrect. There is no record that Mali's court sent maps to Europe.","C":"Incorrect. No European ship is known to have reached West Africa's rivers and come back by 1375. Portuguese voyages got there in the 1400s.","D":"Incorrect. Pilgrims from Mali crossed the Sahara and went through Cairo. Majorca, in the western Mediterranean, was not on their way to Mecca."},"explanation":"Majorca was a busy port that traded with North Africa. News about the caravan towns of the Sahara could reach mapmakers there through traders. The map suggests this link, but it does not name its sources."},{"id":"U2-E13","set":"X4","topic":"2.5","lo":"J","skill":"2.C","difficulty":"medium","stem":"The map would be most useful to a historian as evidence of","options":{"A":"the borders of the Mali Empire at the height of its power","B":"how the people of Mali themselves saw and honored their king","C":"the route that Mansa Musa followed on his pilgrimage to Mecca","D":"what news of West Africa's wealth had reached Europe by 1375"},"answer":"D","rationales":{"A":"Incorrect. Maps of this time did not show borders exactly, and this one marks towns, not boundary lines.","B":"Incorrect. The map was made in Majorca by a European mapmaker, not by artists from Mali.","C":"Incorrect. The map shows the king and nearby towns. It does not trace his journey.","D":"Correct. A European mapmaker chose to show Mali's king holding gold. That shows what news of the region had reached Europe."},"explanation":"The map shows what news about Africa had reached a mapmaker in Majorca. He knew the names of West African trading towns and showed Mali as a land of gold."},{"id":"U2-E14","set":"X5","topic":"2.3","lo":"E","skill":"3.A","difficulty":"easy","stem":"Abd al-Razzaq's description best supports which claim about Calicut in the 1440s?","options":{"A":"Its trade and customs were run by officials sent from Ming China.","B":"Its Muslim residents were not allowed to build mosques.","C":"Its people plundered the ships that storms drove into its harbor.","D":"It drew merchants and goods from East Africa, Arabia, and beyond."},"answer":"D","rationales":{"A":"Incorrect. Calicut's own officers ran the custom-house. The passage does not mention Chinese officials.","B":"Incorrect. The Muslims of Calicut had built two mosques.","C":"Incorrect. Abd al-Razzaq says other ports did this. At Calicut such ships were treated like any other.","D":"Correct. Abd al-Razzaq names goods from Abyssinia, Zirbad, and Zanguebar and ships from the Hedjaz."},"explanation":"Calicut sat on the main sea routes of the Indian Ocean. Ships and goods from East Africa, Arabia, and the lands to the east met there to trade."},{"id":"U2-E15","set":"X5","topic":"2.3","lo":"E","skill":"5.B","difficulty":"medium","stem":"Abd al-Razzaq's description suggests that Indian Ocean ports attracted merchants when their rulers","options":{"A":"used their navies to force passing ships to stop in their ports","B":"became Muslims to win the trust of Muslim merchants","C":"kept order and charged a small duty when goods were sold","D":"let foreign merchants trade without paying any duties"},"answer":"C","rationales":{"A":"Incorrect. Some states, such as Srivijaya earlier, forced ships to stop. Abd al-Razzaq says ships came to Calicut because it was safe.","B":"Incorrect. Abd al-Razzaq says the town was \"inhabited by Infidels,\" his word for non-Muslims, and its ruler was a Hindu. Merchants still came.","C":"Correct. Abd al-Razzaq says \"security and justice\" made merchants trust Calicut, and the duty of one-fortieth was charged at the sale.","D":"Incorrect. Calicut's officers charged a duty of one-fortieth on goods that were sold."},"explanation":"Merchants risked a great deal on long voyages. They chose ports where their goods were safe and taxes were fair and clear. Calicut offered both, so it grew rich.","reasoning":"Causation"},{"id":"U2-E16","set":"X5","topic
