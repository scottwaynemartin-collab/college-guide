stly through private business. Meiji Japan used the state to start industries.","B":"Incorrect. The Company was a foreign power ruling India, not a government modernizing its own country.","C":"Incorrect. The rebellion was a revolt against foreign rule. The passage is about a government building industry.","D":"Correct. Both governments used state power to bring in Western machines and experts, so their countries could stand up to European powers."},"explanation":"This is called state-sponsored industrialization. In both places, leaders feared that Europe would take control. They wanted modern industry fast so their countries could stay strong.","reasoning":"Comparison"},{"id":"U5-E16","set":"X5","topic":"5.6","lo":"G","skill":"5.B","difficulty":"easy","stem":"The developments described in the passage most directly contributed to which of the following by 1910?","options":{"A":"Japan's loss of its independence to the Western powers that had forced it to sign unequal treaties","B":"Japan's rise to become the world's largest exporter of cotton cloth, ahead of Britain","C":"a close alliance between Japan and Qing China against the Western powers","D":"Japan's rise as a regional power that defeated China and Russia in war"},"answer":"D","rationales":{"A":"Incorrect. Japan kept its independence, and by 1911 it had ended the unequal treaties.","B":"Incorrect. Japan's cotton industry grew, but Britain was still the world's largest exporter of cotton cloth in this period.","C":"Incorrect. Japan went to war with China in 1894–1895 and took Taiwan.","D":"Correct. Industry gave Japan modern weapons, ships, and railways. Japan defeated China in 1894–1895 and Russia in 1904–1905."},"explanation":"Japan's new strength let it build an empire of its own. It took Taiwan in 1895 and made Korea a colony in 1910.","reasoning":"Causation"},{"id":"U5-E17","set":"X6","topic":"5.8","lo":"I","skill":"4.A","difficulty":"medium","stem":"The decree was issued in the context of","options":{"A":"recent Ottoman victories that had won back lands from Russia near the Black Sea","B":"demands by Ottoman factory workers for laws to limit their working hours","C":"Ottoman military defeats and losses of territory that pushed leaders to reform","D":"the influence of Marxist socialism on young Ottoman officials"},"answer":"C","rationales":{"A":"Incorrect. By 1839 the Ottomans were losing land, not winning it back. The decree itself speaks of \"weakness and poverty.\"","B":"Incorrect. The empire had few factories in 1839, and the decree is about safety, taxes, and the army, not work hours.","C":"Correct. By 1839 the Ottomans had lost Greece and had been beaten by the armies of Muhammad Ali, the ruler of Egypt.","D":"Incorrect. Marx and Engels did not publish The Communist Manifesto until 1848, nine years after this decree."},"explanation":"The decree itself admits that \"weakness and poverty\" had replaced the empire's old strength. Ottoman leaders hoped new laws on safety, taxes, and the army would turn things around.","reasoning":"Causation"},{"id":"U5-E18","set":"X6","topic":"5.2","lo":"C","skill":"2.B","difficulty":"medium","stem":"The statement that the decree's rights \"shall extend to all our subjects, of whatever Religion or sect\" most directly reflects an effort to","options":{"A":"convert the empire's Christian and Jewish subjects to Islam","B":"give each religious group in the empire its own country","C":"take away the legal rights of the empire's Muslim subjects","D":"build loyalty to the Ottoman state among people of every faith"},"answer":"D","rationales":{"A":"Incorrect. The decree promises equal security to all religions. It does not ask anyone to convert.","B":"Incorrect. The decree tries to hold the empire together, not split it apart.","C":"Incorrect. The decree extends rights to all subjects. It does not take them away from Muslims.","D":"Correct. Nationalism was spreading among Christian peoples in the Balkans. Reformers hoped equal treatment would keep people of all faiths loyal to the empire."},"explanation":"This idea, called Ottomanism, asked all subjects to see themselves as Ottomans first. It was a response to nationalist movements that were pulling the empire apart."},{"id":"U5-E19","set":"X6","topic":"5.8","lo":"I","skill":"2.B","difficulty":"medium","stem":"The plan to share the decree with \"the Ambassadors of the friendly Powers\" was most likely meant to","options":{"A":"promise European merchants lower tariffs on the goods they sold in the empire","B":"place the empire's religious courts under the supervision of European judges","C":"announce that European bankers would take over the collection of Ottoman taxes","D":"show European powers that the empire could reform, and so win their support"},"answer":"D","rationales":{"A":"Incorrect. Trade rules were set in a separate 1838 treaty with Britain. This decree is about security, taxes, and the army.","B":"Incorrect. The decree says nothing about religious courts or European judges.","C":"Incorrect. European creditors did not take control of any Ottoman revenues until 1881. The decree promises a regular tax system run by the state.","D":"Correct. In 1839 the Ottomans needed help from Britain and other powers against Muhammad Ali of Egypt. Showing the ambassadors the reforms helped win that support."},"explanation":"European powers could threaten or support the Ottoman Empire. Sharing the decree with their ambassadors helped Ottoman leaders show that their state was willing and able to reform."},{"id":"U5-E20","set":"X7","topic":"5.7","lo":"H","skill":"3.A","difficulty":"easy","stem":"Smith's main argument in the passage is that","options":{"A":"pursuing private gain through investment and trade can also benefit society","B":"governments should protect home industries with high taxes on foreign goods","C":"a nation grows rich mainly by collecting more gold and silver than its rivals","D":"workers should own the factories together and share the profits equally"},"answer":"A","rationales":{"A":"Correct. Smith says a person who intends \"only his own gain\" is \"led by an invisible hand\" to help society, without meaning to.","B":"Incorrect. Smith says if another country makes something cheaper, \"better buy it of them.\"","C":"Incorrect. That is the mercantilist view, which Smith criticizes.","D":"Incorrect. That is a socialist idea. Smith defends private \"capital\" and trade."},"explanation":"Smith argues that seeking profit can also benefit other people. He favors trade that gives consumers cheaper goods, and he criticizes mercantilism for helping producers at consumers' expense."},{"id":"U5-E21","set":"X7","topic":"5.7","lo":"H","skill":"5.B","difficulty":"medium","stem":"Ideas like Smith's most directly contributed to which of the following in the 1800s?","options":{"A":"the creation of new chartered companies with monopolies on colonial trade","B":"the founding of communist governments in several European countries","C":"Britain's repeal of the Corn Laws and its move toward free trade","D":"the Tokugawa shogunate's strict limits on foreign trade"},"answer":"C","rationales":{"A":"Incorrect. Smith attacked trade monopolies. Britain ended the East India Company's trade monopolies in 1813 and 1833.","B":"Incorrect. Communist movements grew from criticisms of capitalism. Smith defended private markets.","C":"Correct. In 1846 Britain repealed the Corn Laws, its taxes on imported grain. Western European countries began to abandon mercantilism, partly because of Smith's ideas.","D":"Incorrect. The Tokugawa limits began in the 1630s, long before Smith wrote."},"explanation":"Smith's ideas about free trade spread in the 1800s. Britain cut its taxes on imports and became the leading supporter of free trade.","reasoning":"Causation"},{"id":"U5-E22","set":"X7","topic":"5.8","lo":"I","skill":"5.A","difficulty":"hard","stem":"Which nineteenth-century thinker would most directly challenge Smith's view that the pursuit of private gain can benefit society?","options":{"A":"David Ricardo","B":"Karl Marx","C":"Herbert Spencer","D":"Jean-Baptiste Say"},"answer":"B","rationales":{"A":"Incorrect. Ricardo built on Smith's ideas. He argued that countries gain from trade by specializing according to their relative costs.","B":"Correct. Marx argued that owners kept part of the value that workers created. He saw the interests of owners and workers as opposed.","C":"Incorrect. Spencer believed free competition was good for society, so he agreed with Smith about free markets.","D":"Incorrect. Say was a French economist who spread and defended Smith's ideas."},"explanation":"Smith thought self-interest could help everyone. Marx thought capitalism split people into owners and workers whose interests clashed.","reasoning":"Comparison"},{"id":"U5-E23","set":"X8","topic":"5.9","lo":"J","skill":"4.A","difficulty":"medium","stem":"The scene in the image is best understood in the context of","options":{"A":"the decline of London's population as factories moved to the countryside","B":"a royal ban on building new houses, which kept London's population small","C":"government programs that built houses with gardens for factory workers","D":"rapid urban growth that crowded workers into cheap housing"},"answer":"D","rationales":{"A":"Incorrect. London grew quickly in the 1800s. It did not lose people.","B":"Incorrect. No such ban limited London in the 1800s. The city grew to more than 3 million people by 1871.","C":"Incorrect. Large public housing programs came later. These are crowded private row houses.","D":"Correct. London's population grew from about 1 million in 1801 to over 3 million by 1871. Builders packed workers into rows of small, cheap houses."},"explanation":"Industrial cities grew faster than housing, water, and sewers could keep up. The image shows the crowded homes of London's working poor."},{"id":"U5-E24","set":"X8","topic":"5.5","lo":"F","skill":"5.B","difficulty":"easy","stem":"The railway shown in the image is an example of a technology that most directly contributed to","options":{"A":"a drop in the demand for coal and iron, because canals carried most freight","B":"faster movement of people and goods, which helped trade and cities grow","C":"a shift of British factories from cities to rural streams that supplied water power","D":"a decline in steamship trade between Britain and its colonies"},"answer":"B","rationales":{"A":"Incorrect. Trains burned coal and ran on iron rails, so railways raised the demand for both. They also took freight away from canals.","B":"Correct. Steam railways carried freight and passengers quickly and cheaply. They linked factories, ports, and cities and helped cities spread.","C":"Incorrect. Steam engines and railways let factories gather in cities and towns. Factories did not move back to rural streams.","D":"Incorrect. Railways carried goods to ports, which helped steamship trade grow rather than decline."},"explanation":"Railways spread across Britain after 1830 and then around the world. They moved raw materials, goods, and workers, and they helped industrial cities grow.","reasoning":"Causation"},{"id":"U5-E25","set":"X8","topic":"5.8","lo":"I","skill":"5.B","difficulty":"medium","stem":"Conditions like those shown in the image most directly led to which of the following in the late 1800s?","options":{"A":"public health and housing reforms, such as new sewers and building rules","B":"the removal of city building rules so that builders could put up houses faster","C":"the end of child labor in Britain's textile mills","D":"laws that stopped people from moving from the countryside into London"},"answer":"A","rationales":{"A":"Correct. Crowding and disease led British reformers and governments to build sewers, bring in clean water, and pass public health and housing laws.","B":"Incorrect. Reformers added rules for safer buildings. They did not remove them.","C":"Incorrect. Factory laws limited children's work, but they came from concerns about the mills, not housing. Child labor did not end in this period.","D":"Incorrect. Britain passed no such laws. People kept moving to cities for jobs."},"explanation":"Outbreaks of cholera and other diseases showed the dangers of crowded cities. Reformers pushed for sewers, clean water, and rules for safer housing.","reasoning":"Causation"}]}},"6":{"unit":6,"title":"Consequences of Industrialization","period":"c. 1750–1900","examWeighting":"12–15%","blurb":"Rationales for empire, the conquest of Africa and Asia, resistance to empire, export economies, economic imperialism, and global migration.","version":"2026-11-08c","schemaNotes":"Every question has a set id; data.stimuli[set] holds its source (passage | pair | image | table | bar). Options A-D. LO letters follow the Fall 2026 AP World CED (Unit 6: Learning Objectives A-I).","topics":[{"id":"6.1","name":"Rationales for Imperialism from 1750 to 1900","lo":["A"]},{"id":"6.2","name":"State Expansion from 1750 to 1900","lo":["B"]},{"id":"6.3","name":"Indigenous Responses to State Expansion from 1750 to 1900","lo":["C"]},{"id":"6.4","name":"Global Economic Development from 1750 to 1900","lo":["D"]},{"id":"6.5","name":"Economic Imperialism from 1750 to 1900","lo":["E"]},{"id":"6.6","name":"Causes of Migration in an Interconnected World","lo":["F","G"]},{"id":"6.7","name":"Effects of Migration","lo":["H"]},{"id":"6.8","name":"Causation in the Imperial Age","lo":["I"]}],"stimuli":{"X1":{"type":"passage","paragraphs":["Take up the White Man's burden—\nSend forth the best ye breed—\nGo bind your sons to exile\nTo serve your captives' need;\nTo wait in heavy harness,\nOn fluttered folk and wild—\nYour new-caught, sullen peoples,\nHalf-devil and half-child.*","Take up the White Man's burden—\nIn patience to abide,\nTo veil the threat of terror\nAnd check the show of pride;\nBy open speech and simple,\nAn hundred times made plain,\nTo seek another's profit,\nAnd work another's gain.","Take up the White Man's burden—\nThe savage wars of peace—\nFill full the mouth of Famine\nAnd bid the sickness cease;\nAnd when your goal is nearest\nThe end for others sought,\nWatch Sloth and heathen Folly\nBring all your hope to nought.","…","Take up the White Man's burden—\nAnd reap his old reward:\nThe blame of those ye better,\nThe hate of those ye guard—\nThe cry of hosts ye humour\n(Ah, slowly!) toward the light:—\n'Why brought ye us from bondage,\nOur loved Egyptian night?'"],"attribution":"Rudyard Kipling, British writer, \"The White Man's Burden,\" poem first published in February 1899","translation":"Text from Kipling's collection The Five Nations (London, 1903); adapted","footnotes":[{"mark":"*","text":"Kipling's descriptions of colonized peoples, such as \"half-devil and half-child,\" reflect racist views that were common among supporters of empire in his time."}],"glossary":[{"t":"ye","d":"you"},{"t":"bind your sons to exile","d":"send your young men to live far from home"},{"t":"fluttered","d":"nervous and stirred up"},{"t":"sullen","d":"silent and resentful"},{"t":"Sloth","d":"laziness"},{"t":"nought","d":"nothing"},{"t":"humour","d":"go along with in order to keep content"},{"t":"Our loved Egyptian night","d":"in the Bible, the Israelites, after being freed from slavery in Egypt, sometimes complained and wished they could go back"}],"verse":true},"X2":{"type":"passage","paragraphs":["We find that your country is distant from us about sixty or seventy thousand miles,* that your foreign ships come hither striving the one with the other for our trade, and for the simple reason of their strong desire to reap a profit. … By what principle of reason then, should these foreigners send in return a poisonous drug, which involves in destruction those very natives of China? Without meaning to say that the foreigners harbor such destructive intentions in their hearts, we yet positively assert that from their inordinate thirst after gain, they are perfectly careless about the injuries they inflict upon us! …","We have heard that in your own country opium is prohibited with the utmost strictness and severity:—this is a strong proof that you know full well how hurtful it is to mankind. Since then you do not permit it to injure your own country, you ought not to have the injurious drug transferred to another country, and above all others, how much less to the Inner Land! Of the products which China exports to your foreign countries, there is not one which is not beneficial to mankind in some shape or other. … Not to speak of our tea and rhubarb, things which your foreign countries could not exist a single day without, if we of the Central Land were to grudge you what is beneficial, and not to compassionate your wants, then wherewithal could you foreigners manage to exist? …","Moreover, we have heard that in London the metropolis where you dwell, as also in Scotland, Ireland, and other such places, no opium whatever is produced. It is only in sundry parts of your colonial kingdom of Hindostan, such as Bengal, Madras, Bombay, Patna, Malwa, Benares, … and other places where the very hills are covered with the opium plant … You, the queen of the said honorable nation, ought immediately to have the plant in those parts plucked up by the very root!"],"attribution":"Lin Zexu, imperial commissioner sent by the Qing emperor to end the opium trade at Guangzhou (Canton), letter to Queen Victoria of Britain, written with two other Qing officials, 1839","translation":"English translation printed in the Chinese Repository, vol. 8 (Guangzhou, February 1840); adapted","footnotes":[{"mark":"*","text":"The letter counts in Chinese miles (li). The English editors noted that this equals about 20,000 to 23,000 English miles."}],"glossary":[{"t":"hither","d":"here"},{"t":"inordinate","d":"far too great"},{"t":"the Inner Land / the Central Land","d":"China"},{"t":"rhubarb","d":"a plant whose dried root was sold as a medicine"},{"t":"grudge you","d":"refuse to give you"},{"t":"compassionate your wants","d":"feel sorry for your needs"},{"t":"wherewithal","d":"how"},{"t":"sundry","d":"various"},{"t":"Hindostan","d":"India"}]},"X3":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Punch_Rhodes_Colossus.png/960px-Punch_Rhodes_Colossus.png","width":960,"height":1244,"alt":"A black-and-white cartoon of a giant man with a mustache standing with his legs spread wide across a map of Africa, one foot at the southern tip and one in the far north, his arms stretched out, a rifle slung on his shoulder, and a thin line like a wire running from his hands down to the ground.","caption":"A giant man stands with his legs spread wide over a map of Africa. One foot rests at the southern tip of the continent and the other in the far north. He wears a jacket, straps, and tall boots, and a rifle hangs from his shoulder. He holds a hat high in one hand and stretches out his other arm. A thin line, like a wire, runs from his hands down toward the ground near each foot. The island of Madagascar appears at lower right.","attribution":"Edward Linley Sambourne, British cartoonist, \"The Rhodes Colossus: Striding from Cape Town to Cairo,\" cartoon of Cecil Rhodes, prime minister of the Cape Colony in southern Africa, in Punch, a London humor magazine, December 10, 1892","credit":"Public domain image via Wikimedia Commons.","description":"A pen drawing seen from slightly below. A huge man with a mustache stands over Africa, which is drawn like a map seen from above, with clouds around his chest. His right boot is planted at the southern tip of the continent and his left foot in the far north. He wears a jacket, a belt with a pouch, shoulder straps, and laced boots that reach his knees. A rifle is slung over his shoulder and hangs down by his leg. His right arm is raised high, holding a hat, and his left arm points out to the side. A thin line runs from each hand down to the ground near each foot, like a wire strung between the two ends of the continent. Madagascar is drawn at the lower right. The artist's signature is at the bottom right.","glossary":[{"t":"colossus","d":"a gigantic statue; the Colossus of Rhodes was a huge ancient statue said to have stood over the harbor of the Greek island of Rhodes"}]},"X4":{"type":"pair","items":[{"label":"Source 1","paragraphs":["Although the new Imperialism has been bad business for the nation, it has been good business for certain classes and certain trades within the nation. The vast expenditure on armaments, the costly wars, the grave risks and embarrassments of foreign policy, the stoppage of political and social reforms within Great Britain, though fraught with great injury to the nation, have served well the present business interests of certain industries and professions. …","Aggressive Imperialism, which costs the tax-payer so dear, which is of so little value to the manufacturer and trader, which is fraught with such grave incalculable peril to the citizen, is a source of great gain to the investor who cannot find at home the profitable use he seeks for his capital, and insists that his Government should help him to profitable and secure investments abroad.","If, contemplating the enormous expenditure on armaments, the ruinous wars, … by which modern Governments seek to extend their territorial power, we put the plain, practical question, Cui bono? the first and most obvious answer is, The investor."],"attribution":"J. A. Hobson, British economist and journalist, Imperialism: A Study, 1902","translation":"Adapted","glossary":[{"t":"armaments","d":"weapons and military supplies"},{"t":"fraught with","d":"full of"},{"t":"capital","d":"money used to start or run a business or to make loans"},{"t":"Cui bono?","d":"Latin for \"Who benefits?\""}]},{"label":"Source 2","paragraphs":["In accepting responsibility for the control of these new lands, England obeyed the tradition of her race. British Africa was acquired not by groups of financiers, nor yet … by the efforts of her statesmen, but in spite of them. It was the instinct of the British democracy which compelled us to take our share. …","Let it be admitted at the outset that European brains, capital, and energy have not been, and never will be, expended in developing the resources of Africa from motives of pure philanthropy; that Europe is in Africa for the mutual benefit of her own industrial classes, and of the native races in their progress to a higher plane; that the benefit can be made reciprocal, and that it is the aim and desire of civilised administration to fulfil this dual mandate.","By railways and roads, by reclamation of swamps and irrigation of deserts, and by a system of fair trade and competition, we have added to the prosperity and wealth of these lands, and checked famine and disease. We have put an end to the awful misery of the slave-trade and inter-tribal war, to human sacrifice and the ordeals of the witch-doctor.* Where these things survive they are severely suppressed. We are endeavouring to teach the native races to conduct their own affairs with justice and humanity, and to educate them alike in letters and in industry."],"attribution":"Frederick Lugard, British soldier and colonial official who governed Nigeria in the early 1900s, The Dual Mandate in British Tropical Africa, 1922","translation":"Adapted","footnotes":[{"mark":"*","text":"Lugard's phrases \"native races\" and \"witch-doctor\" are his own. They reflect the low opinion of African peoples and beliefs held by many British officials of his time."}],"glossary":[{"t":"financiers","d":"bankers and investors"},{"t":"British democracy","d":"here, the British voting public"},{"t":"philanthropy","d":"giving help to others with no gain for oneself"},{"t":"mutual / reciprocal","d":"shared by both sides"},{"t":"mandate","d":"a duty or order"},{"t":"reclamation of swamps","d":"draining wet land so that it can be farmed"},{"t":"ordeals","d":"painful tests used to decide whether a person was guilty"}]}]},"X5":{"type":"bar","title":"Raw Cotton Brought into Europe from Four Sources, 1860 and 1864","categories":["United\nStates","India","Egypt","Brazil"],"series":[{"name":"1860 (thousands of bales)","values":[4058,552,135,48]},{"name":"1864 (thousands of bales)","values":[241,1374,427,127]}],"yLabel":"Thousands of bales (400 pounds each)","text":"The figures count raw cotton brought into all of Europe each year, in thousands of bales of 400 pounds each. Ellison's column \"East Indies\" is shown here as \"India.\" Other sources, such as Turkey, the West Indies, and China and Japan, are not shown. Together they sent about 44,000 bales in 1860 and 466,000 bales in 1864.","source":"Thomas Ellison, The Cotton Trade of Great Britain (London, 1886), table of cotton imports into Europe, 1860–1883, p. 91"},"X6":{"type":"passage","paragraphs":["The spread of the lung sickness among cattle from the Cape Colony into British Kaffraria* in 1855 tended to increase the disposition of the people for war. It made its appearance first among the herds of Pato and Umhala, and was attributed by the people to witchcraft caused by the white man. …","Matters were in this condition when one morning in May 1856 a girl about thirteen or fourteen years of age, named Nongqause, daughter of a councillor of Kreli,** went to draw water from a little stream that flowed past her home. On her return, she informed her father's brother … that she had seen by the river some men who differed greatly in appearance from those she was accustomed to meet. … The inveterate enemies of the white man, they announced themselves as having come from battle fields beyond the sea, to aid the Xosas with their invincible power in driving the English from the land. … And first, he [the uncle, Umhlakaza] must tell the people to abandon dealing in witchcraft, to kill fat cattle and eat.","Kreli heard the message with joy. It may be that he really believed the assertions of Umhlakaza, or perhaps, as many of the colonists suspected, he was the instigator of the whole scheme. …","… Not a goat, ox, or cow out of all their herds must be left living, every grain of corn in their granaries must be destroyed, no garden must be planted … On a certain day countless herds of cattle, not subject to disease and more beautiful than any they were called upon to kill, should issue from the earth and cover the pastures far and wide. …","… It is certain that most of them acted under the influence of superstition alone, though there is no doubt that some of the leaders viewed the entire proceeding as calculated solely for purposes of war. To throw the whole Xosa tribe with its Tembu allies, fully armed and in a famishing state, upon the colony, was the end kept steadily in view by these. …","… The lowest computation fixes the number of those who perished on both sides of the Kei at twenty-five thousand, ordinary calculations give double that number."],"attribution":"George McCall Theal, Canadian-born historian who became keeper of the government archives of the Cape Colony, History of South Africa since September 1795, vol. 3, 1908","translation":"Adapted","footnotes":[{"mark":"*","text":"British Kaffraria was a colony that Britain set up in 1847 on Xhosa land east of the Cape Colony. Its name comes from an old word that Europeans used for Black southern Africans, especially the Xhosa. The word is now considered a slur."},{"mark":"**","text":"Kreli (Sarhili) was the king of the Gcaleka Xhosa and the highest-ranking Xhosa chief."}],"glossary":[{"t":"lung sickness","d":"a deadly disease of cattle"},{"t":"disposition","d":"readiness"},{"t":"Xosas","d":"Theal's spelling of Xhosa, a Bantu-speaking people of southern Africa"},{"t":"inveterate","d":"long-standing"},{"t":"instigator","d":"the person who starts something"},{"t":"famishing","d":"starving"},{"t":"computation","d":"estimate"},{"t":"the Kei","d":"the Kei River, in Xhosa territory"}]},"X7":{"type":"passage","paragraphs":["I have more than once referred to the unfavourable circumstances under which the vast majority of the Irish arrived in America, and the difficulties with which, in a special degree, they had to contend; but the picture would be most imperfect were not some reference made to the disastrous emigration of the years 1847 and 1848—to that blind and desperate rush across the Atlantic known and described, and to be recognised for time to come, as the Irish Exodus. …","It is difficult to realise to the mind the magnitude of the pecuniary sacrifices made by the Irish in America, either to bring out their relatives to their adopted country, or to relieve the necessities and improve the circumstances of those who could not leave or who desired to remain in the old country. … As a mere fact, more than 24,000,000l.* have been sent by the Irish to pay for passages and outfits and fares to distant places; to enable those 'at home' to pay a high rent, perhaps in a time of scarcity; to support parents too old, or too feeble, or too prejudiced, to venture across the sea …","The great ambition of the Irish girl is to send 'something' to her people as soon as possible after she has landed in America; and in innumerable instances the first tidings of her arrival in the New World are accompanied with a remittance, the fruits of her first earnings in her first place. …","With all banks and offices through which money is sent to Ireland the months of December and March are the busiest portions of the year. The largest amount is then sent; then the offices are full of bustling, eager, indeed clamorous applicants … who are mostly females, and chiefly 'girls in place.'"],"attribution":"John Francis Maguire, Irish journalist and member of the British Parliament, The Irish in America, 1868, written after a tour of the United States and Canada","translation":"Adapted","footnotes":[{"mark":"*","text":"Maguire's estimate of all the money sent home over about 25 years, up to 1868. It includes money from Irish emigrants in Australia as well as in North America."}],"glossary":[{"t":"Exodus","d":"a mass departure"},{"t":"pecuniary","d":"having to do with money"},{"t":"24,000,000l.","d":"24 million British pounds"},{"t":"outfits","d":"clothes and supplies for a journey"},{"t":"tidings","d":"news"},{"t":"remittance","d":"money sent to someone far away"},{"t":"girls in place","d":"young women working as servants in other people's homes"}]},"X8":{"type":"passage","paragraphs":["… The English settlers could not get on at all with their plantations in the absence of a stable labour force. They therefore opened negotiations with the Government of India and requested their help for the supply of labour. That Government complied with their request, and the first batch of indentured labourers from India reached Natal on 16th November 1860 …","When the news that indentured labourers had gone to Natal reached Mauritius, Indian traders having connection with such labourers were induced to follow them there. … An Indian trader in Mauritius, the late Sheth Abubakar Amod, thought of opening a shop in Natal. … Abubakar Sheth carried on trade and purchased land, and the story of his prosperity reached Porbandar, his native place, and the country around. Other Memans consequently reached Natal. Borahs from Surat followed them. These traders needed accountants, and Hindu accountants from Gujarat and Kathiawad accompanied them.","… The labourers went to Natal under indenture for a period of five years. They were under no obligation to labour after the expiry of that period, and were entitled to work as free labourers or trade in Natal, and settle there, if they wished. … They found that if they grew only vegetables in Natal, they could earn good incomes, and that their earnings would be still better if they owned a small piece of land. … But the European planters did not relish this new development. They felt they now had competitors in a field in which they believed they had a monopoly. …","… while on the one hand the Europeans demanded more and more labourers and easily took in as many of them as went from India, on the other hand they started an agitation to harass ex-indentured labourers in a variety of ways. … One set of agitators demanded that the labourers who completed their indentures should be sent back to India … A second set advocated the imposition of a heavy annual capitation tax on the labourers who did not re-indenture themselves at the end of the first period of five years."],"attribution":"Mohandas K. Gandhi, Indian lawyer who lived in South Africa from 1893 to 1914, Satyagraha in South Africa, first published in Gujarati in the 1920s","translation":"Translated by Valji Govindji Desai (Madras, 1928); adapted","glossary":[{"t":"indenture / indentured labourers","d":"a labor contract that bound a worker to one employer for a set number of years; workers under such a contract"},{"t":"Natal","d":"a British colony in southeastern Africa"},{"t":"Mauritius","d":"a British island colony in the Indian Ocean"},{"t":"Sheth","d":"a title of respect for a merchant"},{"t":"Porbandar","d":"a port town in western India"},{"t":"Memans, Borahs","d":"Muslim merchant communities from western India"},{"t":"Gujarat, Kathiawad","d":"regions of western India"},{"t":"agitation","d":"a public campaign"},{"t":"capitation tax","d":"a tax charged on each person"},{"t":"re-indenture","d":"sign a new labor contract"}]},"P1":{"type":"passage","paragraphs":["You will see that my view—and I think it may be called the scientific view of a nation—is that of an organized whole, kept up to a high pitch of internal efficiency by insuring that its numbers are substantially recruited from the better stocks, and kept up to a high pitch of external efficiency by contest, chiefly by way of war with inferior races,* and with equal races by the struggle for trade-routes and for the sources of raw material and of food supply. This is the natural history view of mankind, and I do not think you can in its main features subvert it. …","I say it is possible for a small rural community to stand apart from the world-contest and to stagnate, if no more powerful nation wants its possessions. But are we such a community? Is it not a fact that the daily bread of our millions of workers depends on their having somebody to work for? that if we give up the contest for trade-routes and for free markets and for waste lands, we indirectly give up our food-supply? Is it not a fact that our strength depends on these and upon our colonies, and that our colonies have been won by the ejection of inferior races, and are maintained against equal races only by respect for their and our present power? …","… Mankind as a whole, like the individual man, advances through pain and suffering only. The path of progress is strewn with the wreck of nations; traces are everywhere to be seen of the hecatombs of inferior races, and of victims who found not the narrow way to the greater perfection. Yet these dead peoples are, in very truth, the stepping-stones on which mankind has arisen to the higher intellectual and deeper emotional life of to-day."],"attribution":"Karl Pearson, British mathematician and scientist, National Life from the Standpoint of Science, a lecture given in Newcastle, England, in 1900 and published in 1901","translation":"Adapted","footnotes":[{"mark":"*","text":"Pearson's ranking of \"inferior\" and \"equal\" races reflects racist ideas that were common among European scientists of his time. Scientists today reject these ideas."}],"glossary":[{"t":"efficiency","d":"strength and ability to get things done"},{"t":"recruited from the better stocks","d":"born to the families Pearson thought were best"},{"t":"subvert","d":"overturn"},{"t":"stagnate","d":"stop growing or changing"},{"t":"waste lands","d":"lands Pearson thought were unused"},{"t":"ejection","d":"forcing out"},{"t":"hecatombs","d":"mass killings"}]},"P2":{"type":"passage","paragraphs":["In going back to that country [Central Africa] my object is to open up traffic along the banks of the Zambesi, and also to preach the Gospel. The natives of Central Africa are very desirous of trading, but their only traffic is at present in slaves, of which the poorer people have an unmitigated horror: it is therefore most desirable to encourage the former principle, and thus open a way for the consumption of free productions, and the introduction of Christianity and commerce. By encouraging the native propensity for trade, the advantages that might be derived in a commercial point of view are incalculable; nor should we lose sight of the inestimable blessings it is in our power to bestow upon the unenlightened African,* by giving him the light of Christianity. Those two pioneers of civilization—Christianity and commerce—should ever be inseparable; and Englishmen should be warned by the fruits of neglecting that principle as exemplified in the result of the management of Indian affairs. By trading with Africa, also, we should at length be independent of slave-labour, and thus discountenance practices so obnoxious to every Englishman. …","I beg to direct your attention to Africa;—I know that in a few years I shall be cut off in that country, which is now open; do not let it be shut again! I go back to Africa to try to make an open path for commerce and Christianity; do you carry out the work which I have begun."],"attribution":"David Livingstone, Scottish missionary and explorer, lecture to students and teachers at Cambridge University, England, December 4, 1857","translation":"From Dr. Livingstone's Cambridge Lectures, edited by William Monk (Cambridge, 1858); adapted","footnotes":[{"mark":"*","text":"Livingstone's phrase \"the unenlightened African\" reflects the European belief of his time that African cultures were inferior, a view historians reject."}],"glossary":[{"t":"traffic","d":"trade"},{"t":"Zambesi","d":"the Zambezi River in southern Central Africa"},{"t":"the Gospel","d":"the Christian message"},{"t":"unmitigated","d":"complete"},{"t":"free productions","d":"goods made by free people, not enslaved people"},{"t":"propensity","d":"natural liking"},{"t":"discountenance","d":"discourage"},{"t":"obnoxious","d":"offensive"},{"t":"cut off","d":"here, die"}]},"P3":{"type":"passage","paragraphs":["[The heads of state of Britain, Germany, Austria-Hungary, Belgium, Denmark, Spain, the United States, France, Italy, the Netherlands, Portugal, Russia, Sweden-Norway, and the Ottoman Empire,] wishing, in a spirit of good and mutual accord, to regulate the conditions most favourable to the development of trade and civilization in certain regions of Africa, and to assure to all nations the advantages of free navigation on the two chief rivers of Africa flowing into the Atlantic Ocean; being desirous, on the other hand, to obviate the misunderstanding and disputes which might in future arise from new acts of occupation … on the coast of Africa; and concerned, at the same time, as to the means of furthering the moral and material well-being of the native populations, have resolved … to meet for those purposes in Conference at Berlin …","Article VI. All the Powers exercising sovereign rights or influence in the aforesaid territories* bind themselves to watch over the preservation of the native tribes, and to care for the improvement of the conditions of their moral and material well-being, and to help in suppressing slavery, and especially the slave trade. They shall, without distinction of creed or nation, protect and favour all religious, scientific, or charitable institutions, and undertakings created and organized for the above ends, or which aim at instructing the natives and bringing home to them the blessings of civilization. … Christian missionaries, scientists and explorers, with their followers, property, and collections, shall likewise be the objects of especial protection. …","Article XXXIV. Any Power which henceforth takes possession of a tract of land on the coasts of the African Continent outside of its present possessions, or which, being hitherto without such possessions, shall acquire them, as well as the Power which assumes a Protectorate there, shall accompany the respective act with a notification thereof, addressed to the other Signatory Powers of the present Act, in order to enable them, if need be, to make good any claims of their own.","Article XXXV. The Signatory Powers of the present Act recognize the obligation to insure the establishment of authority in regions occupied by them on the coasts of the African Continent sufficient to protect existing rights, and, as the case may be, freedom of trade and of transit under the conditions agreed upon."],"attribution":"General Act of the Berlin Conference, signed by representatives of fourteen states, February 26, 1885","translation":"English text as printed in Edward Hertslet, The Map of Africa by Treaty, 3rd ed., vol. 2 (London, 1909); adapted","footnotes":[{"mark":"*","text":"Article VI applied to the Congo River basin and the nearby lands named earlier in the treaty."}],"glossary":[{"t":"accord","d":"agreement"},{"t":"obviate","d":"prevent"},{"t":"acts of occupation","d":"taking control of land"},{"t":"sovereign rights","d":"the right to rule"},{"t":"creed","d":"religion"},{"t":"hitherto","d":"until now"},{"t":"Protectorate","d":"a territory controlled by a stronger state without being fully annexed"},{"t":"Signatory Powers","d":"the states that signed the treaty"},{"t":"make good","d":"press or prove"}]},"P4":{"type":"pair","items":[{"label":"Source 1","paragraphs":["… Let this fact be thoroughly impressed upon your minds—that, for years past, with a view to destroy the religion of natives of India, the English have compiled books, and have disseminated them, through missionaries, throughout Hindostan. … Firstly, they have promulgated a law that a Hindoo widow must re-marry.* Secondly, they have forcibly suspended the rites of suttee (burning of widows with the dead bodies of their husbands on the funeral pyre), and passed laws prohibiting those rites. Thirdly, they have often pressed us to embrace their religion, on promises of future advancement under their government … They have made it a standing rule, that when a rajah dies without leaving any male issue by his married wife, to confiscate his territory, and they do not allow his adopted son to inherit it … They have already seized the territories of Nagpore and Lucknow. …","… The English told the Brahmins, and other Hindoos serving in their army, to bite suet-greased cartridges. When the Mussulmans serving in the army saw that the English were plotting to undermine the religion of the Brahmins, they also refused to bite the greased cartridges. …","As all the Hindoos and Mohammedans of India have found out that the destruction of the Englishmen is the only way by which we can save our lives and religion, we have printed this proclamation. … These Englishmen are enemies of the Hindoos as well as of the Mussulmans. …"],"attribution":"Proclamation addressed to Hindu princes, issued during the uprising of 1857 in the name of Khan Bahadur Khan, the rebel ruler of Bareilly in northern India; a British translation was used as evidence at the 1858 trial of the last Mughal emperor, Bahadur Shah II","translation":"As printed in Charles Ball, The History of the Indian Mutiny (London, 1858–1859); adapted","footnotes":[{"mark":"*","text":"A law of 1856 allowed Hindu widows to remarry. It did not require them to."}],"glossary":[{"t":"disseminated","d":"spread"},{"t":"Hindostan","d":"India"},{"t":"promulgated","d":"announced as law"},{"t":"rajah","d":"a Hindu prince or king"},{"t":"male issue","d":"sons"},{"t":"Nagpore and Lucknow","d":"Nagpur and Lucknow, capitals of two Indian states"},{"t":"Brahmins","d":"members of the highest-ranking Hindu caste"},{"t":"suet","d":"hard animal fat"},{"t":"Mussulmans / Mohammedans","d":"old English words for Muslims"}]},{"label":"Source 2","paragraphs":["Whereas, for divers weighty reasons, we have resolved … to take upon ourselves the government of the territories in India, heretofore administered in trust for us by the Honourable East India Company. …","We hereby announce to the native princes of India, that all treaties and engagements made with them by or under the authority of the East India Company are by us accepted, and will be scrupulously maintained … We desire no extension of our present territorial possessions … We shall respect the rights, dignity, and honour of native princes as our own …","Firmly relying ourselves on the truth of Christianity, and acknowledging with gratitude the solace of religion, we disclaim alike the right and the desire to impose our convictions on any of our subjects. … we do strictly charge and enjoin all those who may be in authority under us that they abstain from all interference with the religious belief or worship of any of our subjects on pain of our highest displeasure.","And it is our further will that, so far as may be, our subjects, of whatever race or creed, be freely and impartially admitted to office in our service, the duties of which they may be qualified by their education, ability, and integrity duly to discharge."],"attribution":"Queen Victoria of Britain, proclamation to the princes, chiefs, and people of India, November 1, 1858","translation":"As printed in A. Berriedale Keith, editor, Speeches and Documents on Indian Policy, 1750–1921, vol. 1 (London, 1922); adapted","glossary":[{"t":"divers","d":"various"},{"t":"heretofore","d":"until now"},{"t":"scrupulously","d":"carefully and exactly"},{"t":"solace","d":"comfort"},{"t":"disclaim","d":"give up any claim to"},{"t":"enjoin","d":"order"},{"t":"creed","d":"religion"}]}]},"P5":{"type":"passage","paragraphs":["We conceive that the empire belongs to the Chinese, and not to the Tartars; the food and raiment found therein belong to the Chinese, and not to the Tartars; the men and women inhabiting this region are subjects and children of the Chinese, and not of the Tartars. But, alas! ever since the Ming dynasty lost its influence, the Manchoos availed themselves of the opportunity to throw China into confusion, and deprive the Chinese of their empire …","… China is the head, Tartary is the feet; China is the land of spirits, Tartary the land of demons. Why may China be deemed the land of spirits? Because the true Spirit, the great God, our heavenly Father, made heaven and earth, the land and the sea (and the Chinese honour him); therefore from of old China has been termed the land of spirits. …","… The Chinese have a form peculiarly their own; but these Manchoos have commanded them to shave the hair round their heads, and wear a long tail behind, thus causing the Chinese to assume the appearance of brute animals. The Chinese have a dress peculiar to themselves, but these Manchoos have caused them to wear knobs on their caps, with Tartar clothes … thus causing the Chinese to forget their origin. … Whenever drought and inundations occur, the government manifests no compassion; but quietly sees our people scattered abroad or dying of hunger … Offices are to be obtained by bribes, crimes are to be bought off with money, rich fellows engross all authority …","… According to our calculations, the Manchoos cannot be above a hundred thousand, and we Chinese amount to more than fifty millions;* but for fifty millions to be ruled over by a hundred thousand is disgraceful."],"attribution":"Yang Xiuqing, called the \"Eastern King,\" a top leader of the Taiping Rebellion in China, proclamation issued in 1852 as the Taiping army marched north","translation":"English translation printed in Augustus F. Lindley, Ti-Ping Tien-Kwoh: The History of the Ti-Ping Revolution, vol. 1 (London, 1866); adapted","footnotes":[{"mark":"*","text":"Both numbers are far too low. China had more than 400 million people at the time, and the Manchus numbered a few million."}],"glossary":[{"t":"conceive","d":"believe"},{"t":"Tartars / Manchoos","d":"the proclamation's words for the Manchus, the people from northeast of China whose rulers founded the Qing dynasty"},{"t":"raiment","d":"clothing"},{"t":"Ming dynasty","d":"the Chinese dynasty that ruled before the Qing"},{"t":"demons","d":"the Taiping word for their enemies and for the idols they rejected"},{"t":"knobs on their caps","d":"the badges of rank on Qing officials' hats"},{"t":"inundations","d":"floods"},{"t":"engross","d":"take over"}]},"P6":{"type":"passage","paragraphs":["When you get home you must make a dance to continue five days. Dance four successive nights, and the last night keep up the dance until the morning of the fifth day, when all must bathe in the river and then disperse to their homes. You must all do in the same way. …","Grandfather [the messiah] says, when your friends die you must not cry. You must not hurt anybody or do harm to anyone. You must not fight. Do right always. It will give you satisfaction in life. …","Do not tell the white people about this. Jesus is now upon the earth. He appears like a cloud. The dead are all alive again. I do not know when they will be here; maybe this fall or in the spring. When the time comes there will be no more sickness and everyone will be young again.","Do not refuse to work for the whites and do not make any trouble with them until you leave them. When the earth shakes [at the coming of the new world] do not be afraid. It will not hurt you."],"attribution":"Message of Wovoka (also called Jack Wilson), a Paiute religious leader in Nevada, to Cheyenne and Arapaho visitors, August 1891; written down in English by a young Arapaho man","translation":"Rewritten in standard English by James Mooney, ethnologist for the U.S. government, in The Ghost-Dance Religion and the Sioux Outbreak of 1890 (Washington, 1896); adapted","glossary":[{"t":"successive","d":"one after another"},{"t":"disperse","d":"scatter; go separate ways"},{"t":"messiah","d":"a savior sent by God"},{"t":"ethnologist","d":"a scientist who studies cultures"}]},"P7":{"type":"passage","paragraphs":["Her Majesty Victoria, Queen of the United Kingdom of Great Britain and Ireland, regarding with her Royal favour the Native chiefs and tribes in New Zealand, and anxious to protect their just rights and property, and to secure to them the enjoyment of peace and good order, has deemed it necessary in consequence of the great number of Her Majesty's subjects who have already settled in New Zealand, and the rapid extension of emigration both from Europe and Australia which is still in progress, to constitute and appoint a functionary properly authorised to treat with the aborigines of New Zealand for the recognition of Her Majesty's sovereign authority over the whole or any part of those Islands. …","Article the First. The chiefs of the Confederation of the United tribes of New Zealand, and the separate and independent chiefs who have not become members of the Confederation, cede to Her Majesty the Queen of England, absolutely and without reservation, all the rights and powers of sovereignty which the said confederation or individual chiefs respectively exercise or possess …","Article the Second. Her Majesty, the Queen of England, confirms and guarantees to the chiefs and tribes of New Zealand, and to the respective families and individuals thereof the full, exclusive, and undisturbed possession of their lands and estates, forests, fisheries, and other properties which they may collectively or individually possess, so long as it is their wish and desire to retain the same in their possession; but the chiefs of the United tribes and the individual chiefs yield to Her Majesty the exclusive right of pre-emption over such lands as the proprietors thereof may be disposed to alienate, at such prices as may be agreed upon …","Article the Third. In consideration thereof Her Majesty, the Queen of England, extends to the natives of New Zealand her Royal protection, and imparts to them all the rights and privileges of British subjects."],"attribution":"Treaty of Waitangi, English-language text prepared for the British Crown by William Hobson, the Crown's representative, February 1840; Māori chiefs began signing the treaty at Waitangi, New Zealand, on February 6, 1840","translation":"As printed in T. Lindsay Buick, The Treaty of Waitangi (Wellington, 1914); adapted","glossary":[{"t":"Native chiefs / aborigines / natives","d":"the treaty's words for the Māori, the Polynesian people who lived in New Zealand before Europeans arrived"},{"t":"functionary","d":"an official"},{"t":"treat with","d":"make an agreement with"},{"t":"sovereign authority / sovereignty","d":"the highest power to rule"},{"t":"Confederation of the United tribes","d":"an alliance of Māori chiefs in northern New Zealand"},{"t":"cede","d":"give up"},{"t":"pre-emption","d":"the right to buy something before anyone else may; here, the Crown's right to be the only buyer of any land the Māori chose to sell"},{"t":"alienate","d":"sell or give away"}]},"P8":{"type":"passage","paragraphs":["The revenue of the Javanese grandees may be divided into four parts. In the first place, their fixed monthly pay; secondly, a fixed sum as indemnification for their bought-up rights, which have passed to the Dutch Government; thirdly, a premium on the productions of their regency,—as coffee, sugar, indigo, cinnamon, etc.; and lastly, the arbitrary disposal of the labour and property of their subjects. … The Javanese is by nature a husbandman; the ground whereon he is born, which gives much for little labour, allures him to it, and, above all things, he devotes his whole heart and soul to the cultivating of his rice-fields, in which he is very clever. … But there came foreigners from the West, who made themselves masters of the country. They wished to profit by the fertility of the soil, and ordered the native to devote a part of his time and labour to the cultivation of other things which should produce higher profits in the markets of Europe. To persuade the lower orders to do so, they only had to follow a very simple policy. The Javanese obeys his chiefs; to win the chiefs, it was only necessary to give them a part of the gain,—and success was complete.","To be convinced of the success of that policy we need only consider the immense quantity of Javanese products sold in Holland; and we shall also be convinced of its injustice, for, if anybody should ask if the husbandman himself gets a reward in proportion to that quantity, then I must give a negative answer. The Government compels him to cultivate certain products on his ground; it punishes him if he sells what he has produced to any purchaser but itself; and it fixes the price actually paid. …","To the European officials, also, a premium is paid in proportion to the produce. It is a fact that the poor Javanese is thus driven by a double force; that he is driven away from his rice-fields; it is a fact that famine is often the consequence of these measures; but the flags of the ships, laden with the harvest that makes Holland rich, are flapping gaily at Batavia, at Samarang, at Soorabaya …"],"attribution":"Multatuli (pen name of Eduard Douwes Dekker), former Dutch colonial official on the island of Java, Max Havelaar, a novel published in the Netherlands in 1860","translation":"Translated by Baron Alphonse Nahuys (Edinburgh, 1868); adapted","glossary":[{"t":"Javanese grandees / chiefs","d":"Javanese nobles who governed districts (regencies) under the Dutch"},{"t":"indemnification for their bought-up rights","d":"payment for powers they had given up"},{"t":"premium","d":"a bonus payment"},{"t":"indigo","d":"a plant used to make blue dye"},{"t":"arbitrary disposal","d":"use as they pleased"},{"t":"husbandman","d":"farmer"},{"t":"allures","d":"attracts"},{"t":"the lower orders","d":"ordinary people"},{"t":"Batavia, Samarang, Soorabaya","d":"port cities on Java"}]},"P9":{"type":"passage","paragraphs":["[The La Lulanga Company] … employs a considerable number of armed men equally termed \"forest guards.\" These men are quartered throughout the lower course of the Lulongo River, and I found that, as with the A.B.I.R., the sole duty they performed was to compel by force the collection of india-rubber or the supplies which each factory needed. As the district in which the La Lulanga Society carries on these operations is one that had already been subjected to still more comprehensive handling by two of the large Concession Companies, who only abandoned it when, as one of their agents informed me, it was nearly exhausted, the stock of rubber vines in it to-day is drawing to an end, and it is only with great difficulty that the natives are able to produce the quantity sufficient to satisfy their local masters. … Murder and mutilation were charged against several of them [the guards] by name by the natives of certain townships close to the head-quarters of this Company, who sought me in the hope that I might help them. These people in several cases said that they had not complained elsewhere because they had felt that it was useless. As long as the rubber tax imposed upon them endured in its present compulsory form with the sanction of the authorities, they said it was idle to draw attention to acts which were but incidental to its collection. …","In the case of the A.B.I.R. Society, it is said that a portion of the profits are paid into the public revenues of the Congo Government (who hold certain shares in the undertaking), and that these figure annually in the Budget as \"produit de porte-feuille.\" In making this explanation to me, an agent of one of the Upper Congo trading Companies said the term should more correctly be \"produit de porte-fusil,\" and to judge from the large numbers of armed men I saw employed, the correction was not inapposite.","… The population of the Lower Congo has been gradually reduced by the unchecked ravages of this, as yet, undiagnosed and incurable disease [sleeping sickness], and as one cause of the seemingly wholesale diminution of human life which I everywhere observed in the regions revisited, a prominent place must be assigned to this malady. The natives certainly attribute their alarming death-rate to this as one of the inducing causes, although they attribute, and I think principally, their rapid decrease in numbers to other causes as well."],"attribution":"Roger Casement, British consul (diplomat) in the Congo Free State, report to the British government on a journey up the Congo River in 1903, published by the British Parliament in 1904","translation":"Adapted","glossary":[{"t":"quartered","d":"housed; stationed"},{"t":"A.B.I.R.","d":"a company that held rights to collect rubber in a large area of the Congo"},{"t":"india-rubber","d":"rubber"},{"t":"factory","d":"here, a trading post"},{"t":"Concession Companies","d":"private companies granted rights by the Congo Free State to exploit large areas"},{"t":"sanction","d":"approval"},{"t":"produit de porte-feuille","d":"French for \"income from shares\""},{"t":"produit de porte-fusil","d":"French for \"income from the rifle-carrier\""},{"t":"not inapposite","d":"fitting"},{"t":"diminution","d":"shrinking"},{"t":"malady","d":"disease"},{"t":"inducing causes","d":"causes"}]},"P10":{"type":"passage","paragraphs":["Most of the railways in this continent have been constructed by English or American engineers, with British capital, some for account of joint-stock companies in London; others for Government account, in which case also the money came from England, in the shape of loans. …","Great Southern of Buenos Ayres built by Peto and Betts in 1865, has since been prolonged, and represents with the branches a total outlay of 2,000,000l. sterling, for 270 miles. It is managed by Mr. Cooper and owned by an English company …","[In Peru] Between 1822 and 1825 three 6 per cent loans were contracted in London … No interest was paid from 1825 till after the fortunate discovery of guano at the Chincha Islands (1842).* … In 1852 Gen. Mendiburu was sent to London to effect a Guano loan … all secured by guano … The Chincha Islands on being measured were reported to contain … guano, worth 76 millions sterling … In 1870 a railway loan for 12 millions sterling was launched by Schroders … The coupons are two years unpaid, and the stock of guano is running very low. The bonds are at one-tenth of their written value."],"attribution":"Michael G. Mulhall, Irish-born journalist who ran an English-language newspaper in Buenos Aires, The English in South America, 1878","translation":"Adapted","footnotes":[{"mark":"*","text":"Peruvians had used guano as fertilizer for centuries. What was new around 1840 was selling it to Europe."}],"glossary":[{"t":"capital","d":"money invested in a business"},{"t":"joint-stock companies","d":"businesses owned by many investors who buy shares"},{"t":"for Government account","d":"paid for by a South American government"},{"t":"outlay","d":"money spent"},{"t":"contracted","d":"arranged"},{"t":"l. / sterling","d":"British pounds"},{"t":"guano","d":"seabird droppings, used as fertilizer, that piled up on dry islands off Peru"},{"t":"coupons","d":"interest payments owed to people who bought a government's bonds"},{"t":"bonds","d":"certificates showing that a government owes money to the holder"}]},"P11":{"type":"passage","paragraphs":["Article II. His Majesty the Emperor of China agrees that British Subjects, with their families and establishments, shall be allowed to reside, for the purpose of carrying on their Mercantile pursuits, without molestation or restraint at the Cities and Towns of Canton, Amoy, Foochow-fu, Ningpo, and Shanghai, and Her Majesty the Queen of Great Britain, etc., will appoint Superintendents or Consular Officers, to reside at each of the above-named Cities or Towns …","Article III. It being obviously necessary and desirable, that British Subjects should have some Port whereat they may careen and refit their Ships, when required, and keep Stores for that purpose, His Majesty the Emperor of China cedes to Her Majesty the Queen of Great Britain, etc., the Island of Hongkong, to be possessed in perpetuity by Her Britannic Majesty, Her Heirs and Successors, and to be governed by such Laws and Regulations as Her Majesty the Queen of Great Britain, etc., shall see fit to direct.","Article V. The Government of China having compelled the British Merchants trading at Canton to deal exclusively with certain Chinese Merchants called Hong Merchants (or Cohong) who had been licensed by the Chinese Government for that purpose, the Emperor of China agrees to abolish that practice in future at all Ports where British Merchants may reside, and to permit them to carry on their mercantile transactions with whatever persons they please …","Article X. His Majesty the Emperor of China agrees to establish at all the Ports which are by the 2nd Article of this Treaty to be thrown open for the resort of British Merchants, a fair and regular Tariff of Export and Import Customs and other Dues, which Tariff shall be publicly notified and promulgated for general information …"],"attribution":"Treaty of Nanjing (Nanking), signed by representatives of Britain and Qing China, August 29, 1842","translation":"English text as printed in Treaties, Conventions, etc., between China and Foreign States, 2nd ed., vol. 1 (Shanghai: Inspector General of Customs, 1917); adapted","glossary":[{"t":"Mercantile pursuits","d":"trade"},{"t":"molestation","d":"being bothered or harmed"},{"t":"Consular Officers","d":"officials who look after their country's merchants in a foreign port"},{"t":"careen","d":"tip a ship on its side to clean and repair its bottom"},{"t":"cedes","d":"gives up"},{"t":"in perpetuity","d":"forever"},{"t":"Tariff","d":"a list of taxes charged on goods coming in or going out"},{"t":"promulgated","d":"announced publicly"}]},"P12":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/China_imperialism_cartoon.jpg/960px-China_imperialism_cartoon.jpg","width":960,"height":1314,"alt":"A color cartoon of five figures with knives seated around a large round pie labeled CHINE, while a man in Qing official dress stands behind them with his hands thrown up.","caption":"Five figures gather around a large pie labeled \"Chine\" (French for China). From left to right they are Queen Victoria of Britain, Kaiser Wilhelm II of Germany, Tsar Nicholas II of Russia, a woman representing France, and a man representing Japan. Victoria, Wilhelm, and Nicholas hold knives, and Wilhelm stabs his into the pie. Two slices are labeled \"Kiao-Tchéou\" and \"Port-Arthur.\" Behind them, a man in the dress of a Qing official throws up his hands. He is drawn with exaggerated features and long fingernails, an insulting stereotype of Chinese people that was common in European cartoons of the time.","attribution":"Henri Meyer, French illustrator, \"En Chine: Le gâteau des Rois et… des Empereurs\" (\"In China: The Cake of Kings and… of Emperors\"), cartoon on the front page of the illustrated supplement of Le Petit Journal, a Paris newspaper, January 16, 1898","credit":"Bibliothèque nationale de France. Public domain image via Wikimedia Commons.","description":"A brightly colored drawing. In front, a huge round pie or cake with \"CHINE\" written across it sits on a table, already marked into slices. On the left, an old queen with a small crown and a lace veil holds a knife and rests her ringed hand on the pie. Next to her, a scowling man in a spiked German helmet drives a knife straight down into the slice labeled \"Kiao-Tchéou.\" Beside him, a bearded man in a white cap holds a knife near the slice labeled \"Port-Arthur.\" Behind him, a young woman in a red cap with a red, white, and blue ribbon rests her hand on his shoulder and looks down at the pie. On the right, a man with a topknot rests his chin on his hand and studies the pie; a sword lies on the table in front of him. Standing behind them all, a man in a Qing official's hat and robe, with a long braid, raises both hands with long fingernails in alarm.","glossary":[{"t":"gâteau des Rois","d":"a \"kings' cake,\" a French pastry eaten in January"},{"t":"Kiao-Tchéou","d":"Jiaozhou Bay, on the coast of Shandong in northern China"},{"t":"Port-Arthur","d":"a port in northeast China, today called Lüshun"}]},"P13":{"type":"passage","paragraphs":["The principals in the contract system of emigration were foreigners. … As a result of slave emancipation or in anticipation of it, an attempt was made by the exploiters of the sparsely populated \"New World\" to replace the African slave by the Asiatic indentured labourer—Indian or Chinese. In China the system was established after 1845. Since that date foreigners have at different periods gone to China to engage the services of Chinese under written contract to work for a number of years in lands beyond the seas—the terms of the original contract having penal sanctions in the country into which the coolies* have been introduced. … The coolies have not infrequently been subjected to serious wrongs …","… By the credit-ticket system also was made possible the large emigration of Southern Chinese to U.S.A., Canada and Australasia which commenced during the fifties of last century and continued until it was gradually restricted or prohibited by the legislatures of these English-speaking states. …","… The majority of the Chinese emigrants have been natives of the Kwangtung Province, so that although their numbers are insignificant when compared with the total population of China the effects on the social institutions of the south of this almost exclusively male emigration may have been considerable."],"attribution":"Persia Crawford Campbell, Australian historian, Chinese Coolie Emigration to Countries within the British Empire, 1923","translation":"Adapted; the second paragraph comes from a page earlier in the book","footnotes":[{"mark":"*","text":"\"Coolie\" was a term used in the 1800s and early 1900s for Asian laborers, especially contract laborers. It is now considered offensive."}],"glossary":[{"t":"principals","d":"the people in charge"},{"t":"emancipation","d":"freeing"},{"t":"exploiters","d":"here, people who developed land for profit"},{"t":"indentured labourer","d":"a worker bound by contract to one employer for a set number of years"},{"t":"penal sanctions","d":"punishments such as fines or jail"},{"t":"credit-ticket system","d":"a system in which a broker paid a migrant's fare and the migrant paid it back out of later wages"},{"t":"Australasia","d":"Australia and New Zealand"},{"t":"Kwangtung","d":"Guangdong, a province in southern China"}]},"P14":{"type":"bar","title":"Average Yearly Number of Immigrants Arriving in the Americas from Other Continents, 1841–1900","categories":["1841–\n45","1846–\n50","1851–\n55","1856–\n60","1861–\n65","1866–\n70","1871–\n75","1876–\n80","1881–\n85","1886–\n90","1891–\n95","1896–\n1900"],"series":[{"name":"Immigrants per year (average for each five-year period)","values":[138453,298660,397348,212898,207017,405324,410442,259913,652425,709036,650057,528032]}],"yLabel":"Immigrants per year","text":"The figures add up the port records of 7 to 11 countries and colonies in the Americas, including the United States, Canada, Brazil, Uruguay, and, from 1857, Argentina. The places counted change over time, and only immigrants who were not citizens of the country they entered are counted. The compilers warned that the records have gaps and give only a rough picture.","source":"Imre Ferenczi and Walter F. Willcox, International Migrations, vol. 1, Statistics (New York: National Bureau of Economic Research, 1929), Text Table 1, p. 168"},"P15":{"type":"pair","items":[{"label":"Source 1","paragraphs":["Whereas, in the opinion of the Government of the United States the coming of Chinese laborers to this country endangers the good order of certain localities within the territory thereof: Therefore,","Be it enacted … That from and after the expiration of ninety days next after the passage of this act, and until the expiration of ten years next after the passage of this act, the coming of Chinese laborers to the United States be, and the same is hereby, suspended; and during such suspension it shall not be lawful for any Chinese laborer to come, or, having so come after the expiration of said ninety days, to remain within the United States. …","SEC. 14. That hereafter no State court or court of the United States shall admit Chinese to citizenship; and all laws in conflict with this act are hereby repealed.","SEC. 15. That the words \"Chinese laborers\", wherever used in this act, shall be construed to mean both skilled and unskilled laborers and Chinese employed in mining."],"attribution":"Chinese Exclusion Act, law passed by the United States Congress, May 6, 1882","translation":"As printed in The Statutes at Large of the United States, vol. 22 (Washington, 1883); adapted","glossary":[{"t":"localities","d":"places"},{"t":"enacted","d":"made into law"},{"t":"suspended","d":"stopped for a time"},{"t":"construed","d":"understood"}]},{"label":"Source 2","paragraphs":["Sir: A paper was presented to me yesterday for inspection, and I found it to be specially drawn up for subscription among my countrymen toward the Pedestal Fund of the Bartholdi Statue of Liberty. … But the word liberty makes me think of the fact that this country is the land of liberty for men of all nations except the Chinese. I consider it as an insult to us Chinese to call on us to contribute toward building in this land a pedestal for a statue of Liberty. That statue represents Liberty holding a torch which lights the passage of those of all nations who come into this country. But are the Chinese allowed to come? As for the Chinese who are here, are they allowed to enjoy liberty as men of all other nationalities enjoy it? Are they allowed to go about everywhere free from the insults, abuse, assaults, wrongs and injuries from which men of other nationalities are free?","If there be a Chinaman* who came to this country when a lad, who has passed through an American institution of learning of the highest grade, who has so fallen in love with American manners and ideas that he desires to make his home in this land, and who, seeing that his countrymen demand one of their own number to be their legal adviser, representative, advocate and protector, desires to study law, can he be a lawyer? By the law of this nation, he, being a Chinaman, cannot become a citizen, and consequently cannot be a lawyer. …","Liberty, we Chinese do love and adore thee; but let not those who deny thee to us, make of thee a graven image and invite us to bow down to it."],"attribution":"Saum Song Bo, Chinese American writer in New York City, letter to the editor of the New York Sun, 1885","translation":"Reprinted in The American Missionary, vol. 39 (October 1885); adapted","footnotes":[{"mark":"*","text":"\"Chinaman\" was a common term in the 1800s. It is now considered offensive."}],"glossary":[{"t":"subscription","d":"a request for donations"},{"t":"Pedestal Fund","d":"money raised to build the stone base for the Statue of Liberty"},{"t":"advocate","d":"a person who speaks for someone in court"},{"t":"graven image","d":"an idol (a phrase from the Bible)"}]}]},"P16":{"type":"passage","paragraphs":["The present advanced humanitarian civilisation of Britain could not but exercise its humane influence to abolish the customs of sati and infanticide, earning the everlasting blessings of the thousands who have been and will be saved thereby. The introduction of English education, with its great, noble, elevating, and civilising literature and advanced science, will for ever remain a monument of good work done in India and a claim to gratitude upon the Indian people. … Britain may well claim credit for law and order, which, however, is as much necessary for the existence of British rule in India as for the good of the Indian people; for freedom of speech and press, and for other benefits flowing therefrom. …","I now come to the faults of the present un-British system of Government, which unfortunately \"more than counterbalances the benefits.\" … These evils have ever since gone on increasing, and more and more counterbalancing the increased produce of the country, making now the evil of the \"bleeding\" and impoverishing drain by the foreign dominion nearly or above £30,000,000 a year in a variety of subtle ways and shapes …","… For every European employed beyond absolute necessity, each native capable of filling the same position is displaced in his own country. … There is, thus, a triple evil—loss of wealth, wisdom, and work to India—under the present system of administration."],"attribution":"Dadabhai Naoroji, Indian merchant and political leader who served in the British Parliament from 1892 to 1895, Poverty and Un-British Rule in India, 1901","translation":"Adapted","glossary":[{"t":"humane","d":"kind"},{"t":"sati","d":"the custom in which a widow was burned, or burned herself, on her husband's funeral fire"},{"t":"infanticide","d":"the killing of babies"},{"t":"counterbalances","d":"outweighs"},{"t":"impoverishing","d":"making poor"},{"t":"foreign dominion","d":"rule by a foreign power"},{"t":"native","d":"here, an Indian"}]}},"practice":[{"id":"U6-P01","set":"P1","topic":"6.1","lo":"A","skill":"1.B","difficulty":"easy","stem":"Pearson's ideas in the passage are best described as an example of","options":{"A":"the civilizing mission, which claimed that Europeans had a duty to improve the peoples they ruled","B":"Marxism, which explained history as a struggle between social classes inside each society","C":"Social Darwinism, which applied ideas about natural selection to struggles among nations and races","D":"liberalism, which held that free trade among nations would make wars less likely"},"answer":"C","explanation":"Social Darwinists used Darwin's ideas about nature to explain human groups. They said stronger groups win and weaker ones lose. Pearson says a nation stays strong through \"war with inferior races.\" He says progress comes through \"pain and suffering.\"","whyNot":{"A":"Pearson does not talk about helping or improving other peoples. He says nations get ahead by defeating and pushing out \"inferior races.\"","B":"Marx wrote about a struggle between classes. Pearson writes about a struggle between races and nations.","D":"Pearson does not expect trade to bring peace. He calls trade one more \"contest\" between nations."},"hint":"Pearson says nations rise through struggle and that weaker peoples are pushed aside. Which set of ideas fits that view?"},{"id":"U6-P02","set":"P1","topic":"6.1","lo":"A","skill":"5.B","difficulty":"medium","stem":"In the late 1800s, ideas like Pearson's were most often used to","options":{"A":"argue that colonies should be prepared for self-government under European guidance","B":"promote Christian missions that aimed to convert colonized peoples","C":"justify European conquest of lands in Africa and Asia","D":"persuade European workers to join international socialist groups"},"answer":"C","explanation":"Supporters of empire claimed that races they called \"inferior\" could rightly be ruled or pushed aside by stronger ones. This helped them defend taking land in Africa and Asia in the late 1800s.","whyNot":{"A":"Pearson says some races are better than others and that colonies are held by \"power.\" People used ideas like his to defend conquest and lasting rule, not self-rule.","B":"Missions were defended with religious arguments. Pearson's ideas are about racial struggle, not religion.","D":"Pearson wants Britain's workers to back their nation's contest for trade and colonies, not to join workers from other countries."},"hint":"Reread the second paragraph. What does Pearson think Britain must keep doing to stay strong?","reasoning":"Causation"},{"id":"U6-P03","set":"P1","topic":"6.1","lo":"A","skill":"3.B","difficulty":"medium","stem":"In the second paragraph, Pearson argues that Britain must compete for colonies and trade routes mainly because","options":{"A":"its navy needs coaling stations to protect the sea route to India","B":"Christian missionaries working in Africa and Asia need the protection of British forces","C":"British investors need safe places abroad to lend their money","D":"its industrial workers depend on overseas markets and imported food"},"answer":"D","explanation":"Pearson asks if Britain's \"millions of workers\" could get their \"daily bread\" without trade and colonies. He links empire to Britain's factories and food supply.","whyNot":{"A":"Coaling stations were a real reason for some colonies, but Pearson's second paragraph is about workers' \"daily bread\" and markets.","B":"Pearson does not mention religion or missionaries. His reasons are about race and the economy.","C":"Pearson's second paragraph says nothing about investors or loans. It is about workers' jobs and food."},"hint":"Look at the questions Pearson asks about Britain's \"millions of workers.\""},{"id":"U6-P04","set":"P2","topic":"6.1","lo":"A","skill":"3.A","difficulty":"easy","stem":"Livingstone's main argument in the passage is that","options":{"A":"Britain should conquer Central Africa to keep Africans from trading with other European nations","B":"Africans had little interest in trade and would have to be forced to work for European merchants","C":"spreading Christianity and trade together would weaken the slave trade and benefit Africans and Britain","D":"missionaries should keep away from trade so that the pursuit of profit would not corrupt their religious work"},"answer":"C","explanation":"Livingstone calls Christianity and trade \"two pioneers of civilization.\" He wanted trade in goods made by free people to replace the slave trade. He
