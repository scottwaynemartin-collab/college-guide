l service exams"},"answer":"D","rationales":{"A":"Incorrect. Korea's Joseon kings, who took power in 1392, promoted Neo-Confucian learning and limited Buddhist monasteries.","B":"Incorrect. Theravada Buddhism spread in Sri Lanka and mainland Southeast Asia, not as China's official religion.","C":"Incorrect. Chinese emperors kept choosing scholar-officials through exams.","D":"Correct. In 1313, Yuan rulers made Zhu Xi's explanations of the Four Books, key Confucian texts, the standard guide for China's civil service exams, which began again in 1315. His ideas stayed central to the exams until 1905."},"explanation":"Zhu Xi was a leading Neo-Confucian thinker. Under the Yuan dynasty, his explanations of the Four Books became the standard guide for China's civil service exams. His teachings also spread to Korea and Japan.","reasoning":"Causation"},{"id":"U1-E06","set":"X2","topic":"1.1","lo":"B","skill":"4.A","difficulty":"hard","stem":"Zhu Xi's ideas in the passage are best understood in the context of","options":{"A":"the arrival of Christian missionaries at the court of the Song emperor","B":"the Mongol conquest that ended the Song dynasty in 1279","C":"a Confucian response to the long popularity of Buddhism in China","D":"the spread of Islam into China through Arab merchants in Quanzhou"},"answer":"C","rationales":{"A":"Incorrect. The passage is about Zhu Xi's response to Buddhism and Daoism, not to Christianity.","B":"Incorrect. Zhu Xi died in 1200, decades before the Mongols ended the Song dynasty.","C":"Correct. Buddhism had been popular in China for centuries. Neo-Confucians like Zhu Xi borrowed some Buddhist ideas about the mind. But they said family and social duties come first.","D":"Incorrect. Muslim merchants did live in Song ports, but Zhu Xi is answering Buddhism and Daoism, not Islam."},"explanation":"Buddhism had shaped Chinese life for about a thousand years. Neo-Confucianism was partly an answer to it. It kept family duty at the center of life."},{"id":"U1-E07","set":"X3","topic":"1.2","lo":"E","skill":"3.A","difficulty":"easy","stem":"Which of the following best describes Arnold's argument about how Islam spread in Sumatra and nearby islands?","options":{"A":"It spread mainly because Muslim armies from India conquered the island.","B":"It spread chiefly through the work of merchants and religious teachers.","C":"It reached the hill peoples first and the coastal towns much later.","D":"It spread after Sumatra's rulers began paying tribute to Mecca."},"answer":"B","rationales":{"A":"Incorrect. Arnold admits that the sword was sometimes used, but he says nothing about armies from India. He stresses traders and preachers.","B":"Correct. Arnold credits \"Saracen merchants,\" missionaries sent from Mecca, and traders who married local women. He says \"preaching and persuasion rather than force\" were the main features.","C":"Incorrect. Arnold says the reverse: the townspeople of Parlak were Muslim, while \"the hill-people\" were not.","D":"Incorrect. The Sharif of Mecca sent missionaries. The passage does not say that Sumatra paid tribute to Mecca."},"explanation":"Arnold stresses trade, marriage, and religious teaching. He admits that force was sometimes used, but he gives peaceful work the larger role. Traders married local women and learned the language, and missionaries persuaded rulers to convert."},{"id":"U1-E08","set":"X3","topic":"1.2","lo":"E","skill":"3.B","difficulty":"medium","stem":"Arnold uses Ibn Battuta's report about legal experts from Persia and an embassy to Delhi as evidence that","options":{"A":"Persian armies had conquered Sumatra by the middle of the 1300s","B":"the sultans of Delhi ruled Sumatra as a province of their empire","C":"Ibn Battuta converted the ruler of Samudra to Islam in 1345","D":"Samudra's ruler had ties with other parts of the Islamic world"},"answer":"D","rationales":{"A":"Incorrect. The Persians at the court were legal scholars, not soldiers.","B":"Incorrect. An embassy is a diplomatic visit. It does not mean that Delhi ruled Sumatra.","C":"Incorrect. The ruler Ibn Battuta met was already a Muslim when Ibn Battuta arrived.","D":"Correct. Arnold says these details show \"that Sumatra was already in touch with several parts of the Muhammadan world.\""},"explanation":"Legal experts came from Persia, and a noble went to Delhi as an ambassador. Arnold uses these facts to show that Samudra's Muslim court had ties across Dar al-Islam, the wider Muslim world."},{"id":"U1-E09","set":"X3","topic":"1.2","lo":"E","skill":"3.D","difficulty":"medium","stem":"Which of the following, if true, would most strengthen Arnold's argument about how Islam spread?","options":{"A":"In West Africa, too, Islam spread first among traders and town rulers, mostly without conquest.","B":"Muslim armies conquered most of Spain within a few years in the early 700s.","C":"The ruler of Samudra made war on his non-Muslim neighbors until they paid him tribute.","D":"The Hindu-Buddhist kingdom of Majapahit was the strongest power on Java in the 1300s."},"answer":"A","rationales":{"A":"Correct. If Islam spread the same peaceful way in another trading region, Arnold's claim about traders and missionaries looks stronger. In West Africa, rulers in places like Mali became Muslim through contact with merchants.","B":"Incorrect. Conquest in Spain says nothing in favor of trade spreading Islam in Sumatra. If anything, it points the other way.","C":"Incorrect. Wars to force neighbors to submit would weaken Arnold's claim, not strengthen it. Arnold himself admits that \"sometimes indeed the sword has been drawn.\"","D":"Incorrect. The strength of a Hindu-Buddhist kingdom on Java tells us nothing about how Islam spread in Sumatra."},"explanation":"Arnold argues that merchants and teachers did more than armies to spread Islam in Sumatra. Evidence that Islam spread the same way in another trading region would make his case stronger.","reasoning":"Comparison"},{"id":"U1-E10","set":"X4","topic":"1.3","lo":"G","skill":"3.A","difficulty":"easy","stem":"Kabir's main point in the poems is that","options":{"A":"Hindus should give up their beliefs and convert to Islam","B":"God is found through inner devotion, not temples or rituals","C":"high-caste people are closer to God than low-caste people","D":"true seekers of God must leave society and live as monks"},"answer":"B","rationales":{"A":"Incorrect. Kabir calls himself the child of both Allah and Ram. He does not ask Hindus to convert.","B":"Correct. Kabir says God is \"beside thee,\" not \"in temple nor in mosque,\" and tells listeners to \"look within your heart.\"","C":"Incorrect. Kabir says \"it is needless to ask of a saint the caste to which he belongs.\"","D":"Incorrect. Kabir says God is not found in \"Yoga and renunciation,\" that is, in giving up ordinary life."},"explanation":"Kabir taught that God lives in every heart. Holy places, ceremonies, and caste do not bring people closer to God. Love and devotion do."},{"id":"U1-E11","set":"X4","topic":"1.3","lo":"G","skill":"1.B","difficulty":"medium","stem":"The ideas expressed in the poems are most closely associated with which religious movement?","options":{"A":"Theravada Buddhism","B":"Neo-Confucianism","C":"The Bhakti movement","D":"Zoroastrianism"},"answer":"C","rationales":{"A":"Incorrect. Theravada Buddhism honored monks who left ordinary life to meditate. Kabir rejects \"renunciation\" as the way to God.","B":"Incorrect. Neo-Confucianism grew in China and focused on social relationships, not on finding God in the heart.","C":"Correct. Bhakti poets like Kabir sang in everyday languages about loving devotion to God. Some also rejected caste ranking and empty rituals.","D":"Incorrect. Kabir's poems use Hindu and Muslim names for God, not Zoroastrian ideas."},"explanation":"These poems reflect the Bhakti movement's focus on loving devotion to God. Kabir, like some other Bhakti poets, also rejected caste ranking."},{"id":"U1-E12","set":"X4","topic":"1.3","lo":"G","skill":"4.A","difficulty":"hard","stem":"Kabir's references to both Hindus and Muslims are best understood in the context of which development already under way in South Asia by c. 1450?","options":{"A":"The Vijayanagara kings' defense of Hindu rule in southern India","B":"The spread of Buddhism from Tibet into the cities of northern India","C":"Muslim rulers and Sufi teachers living among Hindus in north India","D":"A ban on Hindu worship issued by the Mongol rulers of Persia"},"answer":"C","rationales":{"A":"Incorrect. Vijayanagara was a Hindu kingdom in the far south. Kabir lived in Banaras, in the north, and his poems speak to both Hindus and Muslims.","B":"Incorrect. Buddhism had largely faded from northern India by Kabir's time. The poems speak of Hindus and Muslims.","C":"Correct. Muslim sultans had ruled Delhi since the early 1200s. Sufi teachers and Hindu devotional poets lived side by side, and Kabir drew on both traditions.","D":"Incorrect. The Mongol rulers of Persia did not govern northern India."},"explanation":"By Kabir's time, Muslim rulers had governed much of northern India for over two centuries. Hindu and Muslim ideas met there. Kabir uses Hindu and Muslim names for God."},{"id":"U1-E13","set":"X5","topic":"1.4","lo":"I","skill":"1.B","difficulty":"easy","stem":"Which purpose of resettlement is most directly supported by Cieza's description of spies among the settlers?","options":{"A":"Reducing resistance in newly conquered provinces","B":"Punishing criminals by sending them away from the capital","C":"Increasing food supplies by settling unused farmland","D":"Giving local chiefs more freedom from imperial officials"},"answer":"A","rationales":{"A":"Correct. Spies among the settlers reported the conquered people's \"conversations and schemes\" to the governors and to Cuzco. That helped the Incas stop plots before they became revolts.","B":"Incorrect. Cieza describes the settlers as loyal subjects from peaceful areas, not as criminals.","C":"Incorrect. The Incas did sometimes move people to farm new land. But spies watching for plots point to control, not food.","D":"Incorrect. The spies reported to imperial governors. That tightened control over local chiefs instead of loosening it."},"explanation":"The Incas moved loyal settlers into newly conquered provinces. Spies among them reported possible plots to imperial officials. This helped Inca rulers find and stop rebellions."},{"id":"U1-E14","set":"X5","topic":"1.4","lo":"I","skill":"3.B","difficulty":"easy","stem":"Which experience does Cieza give as evidence that the quipus could keep exact records?","options":{"A":"He compared the quipus with written books kept by Inca priests in Cuzco.","B":"He learned to read the quipus himself while living with the Inca nobles.","C":"A local lord showed him quipu records of goods given to the Spaniards.","D":"He checked the quipus against Spanish tax records sent from Mexico."},"answer":"C","rationales":{"A":"Incorrect. Cieza describes knotted cords. He does not say he compared them with written books.","B":"Incorrect. Cieza says a local lord explained the quipus to him. He does not say he learned to read them.","C":"Correct. Cieza says the lord Guacarapora showed him records of everything given to the Spaniards. The records were so exact that Cieza \"was quite astonished.\"","D":"Incorrect. The passage does not mention any records from Mexico."},"explanation":"Cieza admits he doubted the quipus at first. Then a local lord showed him exact records kept in knots. That changed his mind."},{"id":"U1-E15","set":"X5","topic":"1.4","lo":"I","skill":"2.C","difficulty":"hard","stem":"Which of the following is a limitation of Cieza's account as evidence about Inca rule?","options":{"A":"Cieza relied partly on Inca nobles, who may have played down the harsh side of Inca rule.","B":"Cieza wrote centuries after the Inca Empire fell, using its ruins as evidence.","C":"Cieza was an Inca official who wanted to hide the empire's treatment of rebels.","D":"Cieza did not visit the Andes and based his account on rumors he heard in Spain."},"answer":"A","rationales":{"A":"Correct. Inca nobles had reasons to make their former rulers look wise and fair. Conquered peoples who were forced to move might have told a different story.","B":"Incorrect. Cieza wrote about 1550, less than 20 years after the Spanish invasion of 1532, and he talked with living people.","C":"Incorrect. Cieza was a Spanish soldier and writer, not an Inca official.","D":"Incorrect. Cieza traveled in Peru himself and describes his visit to Marcavillca."},"explanation":"Some of Cieza's informants had belonged to the Inca ruling class. Their accounts may favor their old rulers. Cieza added his own observations, but Inca rule had ended before he arrived, so historians check his account against other evidence."},{"id":"U1-E16","set":"X5","topic":"1.7","lo":"N","skill":"5.A","difficulty":"hard","stem":"The Inca policies described in the passage contrast most clearly with the Mexica Empire's greater reliance on","options":{"A":"replacing local rulers with governors and officials sent from the capital","B":"resettling whole conquered families near the workshops of the capital","C":"collecting tribute through local rulers they usually left in power","D":"demanding military service in place of tribute in goods"},"answer":"C","rationales":{"A":"Incorrect. Mexica rulers sometimes placed governors in conquered towns, but they mostly left local rulers in place. The Incas relied more on officials and settlers sent by the central government.","B":"Incorrect. Moving conquered families was an Inca policy, as the passage shows. The Mexica did not resettle conquered peoples near workshops.","C":"Correct. The Mexica usually left conquered city-states under their own rulers, who collected tribute and sent it on. The Incas also used local leaders, but they did more to reshape conquered areas by moving whole communities.","D":"Incorrect. The Mexica demanded soldiers and also goods. Military service did not replace tribute in goods."},"explanation":"Both empires used local leaders. The Incas also moved some communities and spread a shared language alongside local ones. The Mexica relied more on tribute collected through existing local rulers.","reasoning":"Comparison"},{"id":"U1-E17","set":"X6","topic":"1.5","lo":"J","skill":"1.B","difficulty":"easy","stem":"Ibn Battuta's account best supports which claim about the Mali Empire?","options":{"A":"Its rulers had rejected Islam in favor of traditional religions.","B":"Its rulers combined Islamic practices with older West African traditions.","C":"Its government was run by a council of Arab merchants from North Africa.","D":"Its rulers had given up older court customs after converting to Islam."},"answer":"B","rationales":{"A":"Incorrect. Ibn Battuta describes crowded mosques and children learning the Quran by heart.","B":"Correct. Mali's people filled the mosques and memorized the Quran. The court also kept older customs, like the poets' ceremony, which came from \"prior to the introduction of Islam.\"","C":"Incorrect. The passage shows the sultan (the mansa) holding court with his musicians, poets, and armed guards. It does not mention any council of Arab merchants.","D":"Incorrect. Ibn Battuta says the poets' custom came from before Islam \"and that they have kept it up.\""},"explanation":"Mali's kings were Muslim, which linked them to North Africa and the Middle East. They also kept older customs, like praise poetry. These customs built their power at home."},{"id":"U1-E18","set":"X6","topic":"1.5","lo":"J","skill":"2.B","difficulty":"medium","stem":"Ibn Battuta's criticisms in the last paragraph most likely reflect","options":{"A":"his wish to stop Mali's ruler from selling gold to Europeans","B":"his belief that the people of West Africa had not yet heard of Islam","C":"his view, as a scholar from Morocco, of how proper Muslims should behave","D":"his effort to win a high government position from the ruler of Mali"},"answer":"C","rationales":{"A":"Incorrect. The passage does not mention trade with Europe.","B":"Incorrect. Ibn Battuta praises Mali's crowded mosques and Quran lessons, so he knew its people were Muslims.","C":"Correct. Ibn Battuta was trained in Islamic law. He judged women's dress and the dust ceremony by the rules he knew from Morocco.","D":"Incorrect. He is describing customs he observed; nothing suggests he is seeking a job from the mansa."},"explanation":"Ibn Battuta admired Mali's justice and its faithful prayer. But he disliked customs that did not fit his idea of Muslim behavior. His criticisms show his own point of view."},{"id":"U1-E19","set":"X6","topic":"1.5","lo":"J","skill":"5.B","difficulty":"medium","stem":"The wealth of Mali's court, shown by the gold described in the passage, came mainly from","options":{"A":"tribute paid to Mali by the Mamluk sultans of Egypt","B":"control of trade across the Sahara in gold and salt","C":"taxes on spices shipped from India to the Swahili coast","D":"selling horses raised in West Africa to North African buyers"},"answer":"B","rationales":{"A":"Incorrect. Mansa Musa passed through Mamluk Egypt on his way to Mecca, but Egypt did not pay tribute to Mali.","B":"Correct. Mali controlled gold fields and the trade routes across the Sahara. Gold went north; salt, horses, and cloth came south.","C":"Incorrect. The Swahili coast is in East Africa, far from Mali. That trade made cities like Kilwa rich.","D":"Incorrect. Horses went the other way. Traders brought them south across the Sahara to sell in West Africa."},"explanation":"Mali grew rich by taxing trade across the Sahara. Gold went north, and salt came south. The same trade brought Muslim scholars like Ibn Battuta.","reasoning":"Causation"},{"id":"U1-E20","set":"X7","topic":"1.6","lo":"L","skill":"3.C","difficulty":"easy","stem":"Which of the following best describes a similarity between the two sources?","options":{"A":"Both protect nobles' powers against a central ruler.","B":"Both give the pope the power to choose kings and emperors.","C":"Both free serfs and give peasants the right to own land.","D":"Both create a standing army paid for by royal taxes."},"answer":"A","rationales":{"A":"Correct. Magna Carta lets 25 barons force the king to keep his promises. The Golden Bull lets the prince electors choose the emperor and keep mines and tolls.","B":"Incorrect. In Source 2 the electors, not the pope, choose the king, and Source 1 does not mention the pope.","C":"Incorrect. Neither source frees serfs. Magna Carta protects \"freemen.\"","D":"Incorrect. Neither source creates a royal army; both limit the ruler's power."},"explanation":"In England and in the Holy Roman Empire, powerful nobles got their rights written down. These rules kept rulers from gaining too much power.","reasoning":"Comparison"},{"id":"U1-E21","set":"X7","topic":"1.6","lo":"L","skill":"3.C","difficulty":"hard","stem":"Which of the following best describes a difference between the political arrangements in the two sources?","options":{"A":"English barons chose each new king; the electors served as advisers to the emperor.","B":"English barons controlled the royal mines; the electors controlled the Church courts.","C":"English barons relied on the pope to limit the king; the electors approved the emperor's taxes.","D":"English barons could enforce the charter against the king; the electors chose the ruler."},"answer":"D","rationales":{"A":"Incorrect. Magna Carta does not let the barons choose the king. In Source 2, the electors choose the ruler; they are not just his advisers.","B":"Incorrect. The Golden Bull, not Magna Carta, gives rights to mines, and it gives them to the electors. Neither excerpt says the electors controlled Church courts.","C":"Incorrect. Neither excerpt relies on the pope. Magna Carta, not the Golden Bull, requires consent for certain payments.","D":"Correct. Clause 61 lets 25 barons force King John to keep his promises. The Golden Bull names the prince electors who choose the king of the Romans, the future emperor."},"explanation":"Both documents limited rulers, but in different ways. English barons could force the king to keep the charter. The German electors chose the ruler himself.","reasoning":"Comparison"},{"id":"U1-E22","set":"X7","topic":"1.6","lo":"L","skill":"5.B","difficulty":"medium","stem":"The principle stated in clause 12 of Source 1 is most closely connected to which later development in England?","options":{"A":"Parliament's growing role in approving taxes","B":"The king's growing power to tax without the nobles' consent","C":"The end of serfdom in England in the 1200s","D":"The pope's power to approve or reject English taxes"},"answer":"A","rationales":{"A":"Correct. Clause 12 says the king needs \"common counsel\" to raise certain taxes. Over time, kings called Parliaments to give that agreement, and Parliament's power grew.","B":"Incorrect. Clause 12 limited the king's power to tax. Over time, kings had to ask for consent more often, not less.","C":"Incorrect. Clause 12 is about taxes on the barons and the realm, not serfs. Serfdom lasted in England long after 1215.","D":"Incorrect. Clause 12 says taxes need the \"common counsel\" of the realm, not the pope's approval."},"explanation":"Clause 12 said the king needed the \"common counsel\" of the realm before raising scutage or certain aids. This clause was left out when Magna Carta was reissued in 1216, but the idea lived on. Later kings called Parliaments to agree to new taxes, and Parliament grew stronger.","reasoning":"Continuity and Change"},{"id":"U1-E23","set":"X8","topic":"1.6","lo":"M","skill":"1.B","difficulty":"easy","stem":"The scene in the painting best illustrates which feature of European society from c. 1200 to c. 1450?","options":{"A":"Most people were peasants who farmed land on a lord's estate.","B":"Most people lived in large cities and worked for merchant guilds.","C":"Most peasants owned their own farms and did not work for a lord.","D":"Farm work was done mainly by paid laborers hired by city merchants."},"answer":"A","rationales":{"A":"Correct. Peasants plow, prune vines, and tend sheep in the fields below a lord's castle. Europe was mostly a farming society, and much land was organized into manors.","B":"Incorrect. The painting shows country fields, and most Europeans lived in the countryside, not in cities.","C":"Incorrect. Most peasants farmed land that belonged to a lord, and they owed him work, fees, or crops.","D":"Incorrect. Most farm workers were peasants tied to a lord's land, not workers hired by merchants."},"explanation":"Most Europeans in this period were peasants. Their work produced food and wealth on estates controlled by nobles. Some peasants were serfs; others had more rights."},{"id":"U1-E24","set":"X8","topic":"1.6","lo":"M","skill":"2.B","difficulty":"hard","stem":"The painting was most likely intended to","options":{"A":"protest the harsh treatment of peasants by French nobles","B":"teach peasants new farming methods in their own language","C":"persuade knights to join a crusade","D":"honor its rich owner by showing his orderly lands"},"answer":"D","rationales":{"A":"Incorrect. The peasants work calmly. The painting does not show suffering or protest.","B":"Incorrect. The book was a costly prayer book made for a duke's private use. Its pictures were not lessons for farmers.","C":"Incorrect. The painting shows farm work, not war or a crusade.","D":"Correct. The book was a costly prayer book made for the Duke of Berry, a royal prince. Its calendar page shows his castle above calm, busy fields, a flattering picture of his lands."},"explanation":"This page comes from the calendar of a costly prayer book made for the duke. It links the month of March with seasonal farm work and shows his lands as calm and orderly. Real peasant life was often harder."},{"id":"U1-E25","set":"X8","topic":"1.6","lo":"L","skill":"5.B","difficulty":"medium","stem":"Which development from c. 1200 to c. 1450 most strongly challenged the kind of local power represented by the castle?","options":{"A":"The granting of country estates to knights in return for military service","B":"The growth of the dues that peasants owed to the owners of estates","C":"The inheritance of noble titles and family estates from father to son","D":"Kings' growing use of royal courts and taxes to extend their power"},"answer":"D","rationales":{"A":"Incorrect. Granting estates to knights created more local lords. It built up local power instead of challenging it.","B":"Incorrect. Higher dues from peasants made estate owners richer and stronger, not weaker.","C":"Incorrect. Passing titles and lands down within noble families helped local power last. It did not challenge it.","D":"Correct. In England and France, kings built up royal courts and collected more taxes in this period. Over time, royal government reached into lands that lords had once run on their own."},"explanation":"Castles were homes and forts for lords who ruled their own areas. In this period, some kings expanded royal courts and collected more taxes. In France, kings began collecting regular taxes during the Hundred Years' War. These changes reached into areas where nobles had held local power.","reasoning":"Continuity and Change"}]}},"4":{"unit":4,"title":"Transoceanic Interconnections","period":"c. 1450–1750","examWeighting":"12–15%","blurb":"Ships, silver, the Columbian Exchange, maritime empires, resistance, and new social hierarchies.","version":"2026-11-07a","schemaNotes":"Every question has a set id; data.stimuli[set] holds its source (passage | pair | image | table | bar). Options A-D. LO letters follow the Fall 2026 AP World CED (Unit 4: Learning Objectives A-N).","topics":[{"id":"4.1","name":"Technological Innovations","lo":["A"]},{"id":"4.2","name":"Exploration: Causes and Events","lo":["B","C"]},{"id":"4.3","name":"Columbian Exchange","lo":["D"]},{"id":"4.4","name":"Maritime Empires Established","lo":["E","F","G"]},{"id":"4.5","name":"Maritime Empires Maintained and Developed","lo":["H","I","J","K"]},{"id":"4.6","name":"Internal and External Challenges to State Power","lo":["L"]},{"id":"4.7","name":"Changing Social Hierarchies","lo":["M"]},{"id":"4.8","name":"Continuity and Change, 1450–1750","lo":["N"]}],"stimuli":{"X1":{"type":"passage","paragraphs":["… [Prince Henry] had also a wish to know the land that lay beyond the isles of Canary and that Cape called Bojador, for up to his time … neither by writings, nor by the memory of man, was known with any certainty the nature of the land beyond that Cape. … And this was the first reason of his action.","The second reason was that if there chanced to be in those lands some population of Christians, or some havens into which it would be possible to sail without peril, many kinds of merchandise might be brought to this realm, which would find a ready market … because no other people of these parts traded with them … and also the products of this realm might be taken there, which traffic would bring great profit to our countrymen.","The third reason was that, as it was said that the power of the Moors in that land of Africa was very much greater than was commonly supposed … the said Lord Infant* exerted himself to cause this to be fully discovered, and to make it known how far the power of those infidels extended.","The fourth reason was because during the one and thirty years that he had warred against the Moors, he had never found a Christian king, nor a lord outside this land, who for the love of our Lord Jesus Christ would aid him in the said war. Therefore he sought to know if there were in those parts any Christian princes … who would aid him against those enemies of the faith.","The fifth reason was his great desire to make increase in the faith of our Lord Jesus Christ and to bring to him all the souls that should be saved."],"attribution":"Gomes Eanes de Zurara, royal chronicler of Portugal, Chronicle of the Discovery and Conquest of Guinea, 1453","translation":"Translated by C. Raymond Beazley and Edgar Prestage (1896); adapted","footnotes":[{"mark":"*","text":"Prince Henry of Portugal (1394–1460), son of King João I, who sponsored Portuguese voyages down the West African coast"}],"glossary":[{"t":"Cape Bojador","d":"a cape on the northwest coast of Africa that Portuguese ships first sailed past in 1434"},{"t":"havens","d":"safe harbors"},{"t":"Moors / infidels","d":"Zurara's words for Muslims of North Africa"},{"t":"realm","d":"kingdom (here, Portugal)"},{"t":"traffic","d":"trade"}]},"X2":{"type":"pair","items":[{"label":"Source 1","paragraphs":["… Of three millions of persons which lived in Hispaniola itself, there is at present but the inconsiderable remnant of scarce three hundred. …","Now the ultimate end and scope that incited the Spaniards to … the desolation of this people was gold only, that thereby growing rich in a short time, they might arrive at once at such degrees and dignities as were in no ways consistent with their persons. …","[The Spaniards] divided among themselves the young men, women, and children … one obtained thirty, another forty, to this man one hundred were given … upon this pretense, and with this condition, that he should see them instructed in the Catholic religion. … They sent the men to the mines to dig and bring away the gold, which is an intolerable labor; but the women they made use of to till the ground. … The men died in mines, hunger-starved and oppressed with labor, and the women perished in the fields … Thus an infinite number of inhabitants that formerly peopled this island … dwindled away to nothing."],"attribution":"Bartolomé de las Casas, Spanish Dominican friar, A Brief Account of the Destruction of the Indies, written 1542 for King Charles I of Spain","translation":"From an English translation published in London in 1689 under the title Popery* Truly Displayed in Its Bloody Colours; spelling modernized and adapted","footnotes":[{"mark":"*","text":"\"Popery\" was an insulting word that English Protestants used for the Roman Catholic Church."}],"glossary":[{"t":"Hispaniola","d":"the Caribbean island that today holds Haiti and the Dominican Republic"},{"t":"remnant","d":"a small part that is left"},{"t":"pretense","d":"a false reason given to cover the real one"}]},{"label":"Source 2","paragraphs":["The rapid melting away of the population of the West Indies during the first quarter of a century of the Spanish rule … is the most familiar instance of the kind, through the impassioned descriptions of Las Casas, which were translated into the principal languages of Europe; and, as a consequence, it is generally believed that the Spaniards were cruel and destructive above all other colonists. … That the wars of subjugation were very destructive of life is only too clear; that famine followed war to prolong its ravages is equally certain; that the average Spaniard recklessly and cruelly overworked the Indians there is no doubt.","Nevertheless, there were other and more subtle causes in operation. Diseases were imported by the whites, which were mitigated for them by some degree of acquired immunity, but which raged irresistibly through a population without that defence. Of these new diseases small-pox was one of the most destructive. In the epidemic of small-pox in 1518 the natives, Peter Martyr* reports, died like sheep. … Small-pox appeared in Mexico at the beginning of the conquest … sweeping off in some provinces half the population."],"attribution":"Edward Gaylord Bourne, historian at Yale University, Spain in America, 1450–1580, published in 1904","translation":"Adapted","footnotes":[{"mark":"*","text":"Peter Martyr, an Italian scholar at the Spanish court who wrote about the Americas in the early 1500s. Bourne, writing in 1904, uses older terms: \"the whites\" for Europeans and \"natives\" for Indigenous people."}],"glossary":[{"t":"subjugation","d":"conquest"},{"t":"mitigated","d":"made less severe"},{"t":"acquired immunity","d":"protection from a disease built up by earlier exposure to it"}]}]},"X3":{"type":"bar","title":"Average Annual Registered Imports of American Gold and Silver into Spain, 1503–1660","categories":["1503–20","1521–40","1541–60","1561–80","1581–1600","1601–20","1621–40","1641–60"],"series":[{"name":"Average imports per year (millions of pesos)","values":[0.2,0.3,1.4,2.7,6.1,5.5,4.3,1.8]}],"yLabel":"Millions of pesos per year","text":"Gold and silver are combined by their money value (1 peso = 450 maravedís, a Spanish unit of account). Most of the silver came from mines at Potosí (in the Andes) and Zacatecas (in Mexico).","source":"Calculated from Earl J. Hamilton, American Treasure and the Price Revolution in Spain, 1501–1650 (1934), p. 34; yearly averages for each 20-year period (first period 18 years), rounded"},"X4":{"type":"passage","paragraphs":["1. No Japanese ships shall ever be sent to foreign lands.","2. No Japanese shall be permitted to go abroad, and if there be discovered anyone who has a secret intention to go abroad he shall be put to death. …","3. If any Japanese residing abroad comes back to Japan, even for a short time, he shall be put to death.","4. Rewards are to be given to those who report to the authorities about the Christians: those who give information about the foreign missionaries shall be given 200 to 300 silver coins according to their merits. …","5. Children and grandchildren of the foreign Christian missionaries shall not be permitted to remain in Japan, and anyone secretly giving shelter to such persons shall be put to death. …"],"attribution":"Ordinance issued by the Tokugawa shogunate to the governors of the port of Nagasaki, Japan, 1636","translation":"From Takekoshi Yosaburō, The Economic Aspects of the History of the Civilization of Japan (English edition, 1930); adapted","glossary":[{"t":"shogunate","d":"the government of the shogun, Japan's top military ruler (here, the Tokugawa family)"},{"t":"ordinance","d":"an official order or law"},{"t":"missionaries","d":"people sent to spread a religion; here, Catholic priests from Portugal and Spain"}]},"X5":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Casta_painting_all.jpg/960px-Casta_painting_all.jpg","width":960,"height":1353,"alt":"A painting divided into sixteen panels, each showing a mother, a father, and a child, with a written label under each family.","caption":"Each panel shows a family. The label assigns colonial social categories to the parents and the child. The first three labels in the top row read: \"Spaniard with Indian woman: Mestizo\"; \"Mestizo with Spanish woman: Castizo\"; \"Castizo with Spanish woman: Spaniard.\" Families in the top rows wear fine European-style clothing. Families in the lower rows wear plainer clothes, carry goods or tools, and some are barefoot. The labels use colonial terms: \"Indian\" meant an Indigenous person, and \"Mulatto,\" a term now considered offensive, meant a person of mixed Spanish and African ancestry.","attribution":"Unknown artist, Las Castas (The Castes), oil painting made in New Spain (colonial Mexico), eighteenth century","credit":"Museo Nacional del Virreinato, Tepotzotlán, Mexico. Public domain image via Wikimedia Commons.","description":"Sixteen small family portraits arranged in four rows of four. In each, a man and a woman stand with a child, and a label below names the mixture of Spanish, Indigenous, and African ancestry the painter assigned to each person. The couples in the first row are dressed in rich cloaks, lace, and fine fabrics. Moving down the rows, the clothing becomes simpler, people carry baskets, fruit, or tools, and several figures in the bottom rows are barefoot.","glossary":[{"t":"New Spain","d":"Spain's colony in Mexico and nearby lands"},{"t":"Mestizo","d":"a person of mixed Spanish and Indigenous ancestry"},{"t":"Mulatto","d":"a colonial term for a person of mixed Spanish and African ancestry"}]},"X6":{"type":"passage","paragraphs":["Under the later Hapsburgs*, with the increasing demands of the colonies on the one hand, and the utter ruin of Spanish industry on the other, the dependence of the Seville export commerce upon foreign manufactures was complete. They supplied five sixths of the cargoes of the outbound fleets. …","The most serious and widespread development of contraband trade, however, was in merchandise introduced into the colonies directly from foreign markets. Portuguese, French, Dutch and other interlopers smuggled their cargoes into the West Indies, through the closed port of Buenos Aires, or even to the Pacific shores of Spanish America. The illicit trader was eagerly welcomed by the colonists, for he supplied their needs at reasonable prices. …","A flood of restrictions, a jealous monopoly, on the one hand—on the other, a flourishing contraband trade of outsiders …—such is the story of Spanish-American commerce in the sixteenth and the seventeenth centuries. The Crown of Castile sought to extend Spanish power, and monopolize all the treasure of the Indies, by means of a rigid and complicated commercial system. Yet in the end, it saw the trade of the New World pass into the hands of its rivals … and its riches diverted at their very source."],"attribution":"Clarence H. Haring, American historian, Trade and Navigation between Spain and the Indies in the Time of the Hapsburgs, published in 1918","translation":"Adapted","footnotes":[{"mark":"*","text":"the ruling family of Spain from 1516 to 1700; \"later Hapsburgs\" refers to the 1600s"}],"glossary":[{"t":"contraband","d":"smuggled goods"},{"t":"interlopers","d":"traders who were not allowed to trade there"},{"t":"illicit","d":"illegal"},{"t":"monopoly","d":"complete control of a trade by one group"},{"t":"outbound fleets","d":"the yearly convoys of ships sailing from Seville to the Americas"}]},"X7":{"type":"passage","paragraphs":["They said they had been the first in doing good to the English, and the English the first in doing wrong. They said when the English first came, their king's father* was as a great man and the English as a little child. He kept other Indians from wronging the English, and gave them corn and showed them how to plant, and was free to do them any good, and had let them have a hundred times more land than now the king had for his own people. …","Another grievance was if twenty of their honest Indians testified that an Englishman had done them wrong, it was as nothing, and if but one of their worst Indians testified against any Indian or their king when it pleased the English, that was sufficient. Another grievance was when their kings sold land, the English would say it was more than they agreed to. … Now whom the English had owned for king or queen they would disinherit, and make another king that would give or sell them their land, so that now they had no hopes left to keep any land.","Another grievance: the English cattle and horses still increased, so that when they removed thirty miles from where the English had anything to do, they could not keep their corn from being spoiled, they never being used to fence. …"],"attribution":"John Easton, deputy governor of the English colony of Rhode Island, report of a meeting with Metacom (called King Philip by the English), leader of the Wampanoag people, June 1675","translation":"Spelling modernized; adapted","footnotes":[{"mark":"*","text":"Massasoit, Metacom's father, who allied with the Plymouth colonists in 1621"}],"glossary":[{"t":"grievance","d":"a complaint about unfair treatment"},{"t":"testified","d":"spoke as a witness in court"},{"t":"disinherit","d":"remove from power"},{"t":"owned","d":"recognized"},{"t":"removed","d":"moved"},{"t":"they never being used to fence","d":"they had never needed fences"}]},"X8":{"type":"passage","paragraphs":["From what I can recollect of these battles, they appear to have been raids of one little state or district on the other, to obtain prisoners or booty. Perhaps they were incited to this by those traders who brought the European goods I mentioned amongst us. Such a mode of obtaining slaves in Africa is common; and I believe more are procured this way, and by kidnapping, than any other. When a trader wants slaves, he applies to a chief for them, and tempts him with his wares. … Accordingly he falls on his neighbours, and a desperate battle ensues. If he prevails and takes prisoners, he gratifies his avarice by selling them. …","… Those prisoners which were not sold or redeemed we kept as slaves: but how different was their condition from that of the slaves in the West Indies! With us they do no more work than other members of the community, even their masters; their food, clothing and lodging were nearly the same as theirs, (except that they were not permitted to eat with those who were free-born); and there was scarce any other difference between them, than a superior degree of importance which the head of a family possesses in our state. … Some of these slaves have even slaves under them as their own property."],"attribution":"Olaudah Equiano, formerly enslaved African, describing his childhood in West Africa in the 1750s, The Interesting Narrative of the Life of Olaudah Equiano, published in London in 1789","translation":"Adapted","glossary":[{"t":"booty","d":"goods taken by force"},{"t":"incited","d":"pushed or encouraged"},{"t":"procured","d":"gotten"},{"t":"redeemed","d":"freed after a payment (ransomed)"},{"t":"West Indies","d":"the islands of the Caribbean"}]},"P1":{"type":"passage","paragraphs":["[Vasco da Gama] sent one of the convicts to Calicut, and those with whom he went took him to two Moors from Tunis, who could speak Castilian and Genoese*. The first greeting that he received was in these words: \"May the Devil take thee! What brought you hither?\" They asked what he sought so far away from home, and he told them that we came in search of Christians and of spices. …","On Tuesday the captain got ready the following things to be sent to the king, namely, twelve pieces of striped cloth, four scarlet hoods, six hats, four strings of coral, a case containing six wash-hand basins, a case of sugar, two casks of oil, and two of honey. … [The king's officials] came, and when they saw the present they laughed at it, saying that it was not a thing to offer to a king, that the poorest merchant from Mecca, or any other part of India, gave more, and that if he wanted to make a present it should be in gold. … When they had gone there came certain Moorish merchants, and they all made fun of the present which the captain desired to be sent to the king."],"attribution":"Journal of a member of Vasco da Gama's crew, describing the Portuguese fleet's arrival at Calicut, India, May 1498","translation":"Translated by E. G. Ravenstein (1898); adapted","footnotes":[{"mark":"*","text":"Castilian = Spanish; Genoese = the language of the city of Genoa, in present-day Italy"}],"glossary":[{"t":"Calicut","d":"a wealthy port city on the southwest coast of India, ruled by a Hindu king"},{"t":"Moors","d":"the journal's word for Muslims"},{"t":"convicts","d":"prisoners the Portuguese brought along to do dangerous jobs"}]},"P2":{"type":"passage","paragraphs":["Española is a wonder. … The harbors on the coast, and the number and size and wholesomeness of the rivers, most of them bearing gold, surpass anything that would be believed by one who had not seen them. … In this island there are many spices and extensive mines of gold and other metals. … They have neither iron, nor steel, nor arms, nor are they competent to use them … because they are timid to a surprising degree.","I gave away a thousand good and pretty articles which I had brought with me in order to win their affection, and that they might be led to become Christians, and be well inclined to love and serve their Highnesses* and the whole Spanish nation, and that they might aid us by giving us things of which we stand in need, but which they possess in abundance. …","Their Highnesses may see that I shall give them all the gold they require, if they will give me but a very little assistance; spices also, and cotton, as much as their Highnesses shall command to be shipped … and slaves, as many … as their Highnesses shall command to be shipped. … All Christendom ought to rejoice … for the great exaltation which may come to them in turning so many nations to our holy faith, and also for the temporal benefits which will bring great refreshment and gain, not only to Spain, but to all Christians."],"attribution":"Christopher Columbus, letter written on his return voyage to Luis de Santángel, a royal official who had helped pay for the voyage, February 1493; the letter was printed and spread across Europe that year","translation":"Translated by R. H. Major (1870); adapted","footnotes":[{"mark":"*","text":"King Ferdinand and Queen Isabella of Spain"}],"glossary":[{"t":"Española","d":"Hispaniola, the Caribbean island today shared by Haiti and the Dominican Republic"},{"t":"temporal","d":"worldly (money and goods, as opposed to religious)"}]},"P3":{"type":"table","title":"Estimated Indigenous Population of Central Mexico, 1518–1605","columns":["Year","Estimated population"],"rows":[["1518","25.2 million"],["1532","16.8 million"],["1548","6.3 million"],["1568","2.65 million"],["1585","1.9 million"],["1595","1.375 million"],["1605","1.075 million"]],"text":"These are estimates by historians Sherburne F. Cook and Woodrow Borah, based mainly on Spanish tax and tribute records. Some historians think the 1518 figure is too high, but historians agree that the Indigenous population of central Mexico fell catastrophically in the 1500s.","source":"Sherburne F. Cook and Woodrow Borah, studies of the population of central Mexico, 1960s"},"P4":{"type":"passage","paragraphs":["… There is a river on the hither side of which stands a Muslim town named Rander, wherein are very fair houses and open places. It is a very pleasant and wealthy place, for the Muslim inhabitants thereof trade in their own ships with Malacca, Bengal, Tenasserim, Pegu, Martaban and Sumatra, in spices of divers sorts and drugs and silks in great abundance, musk, benzoin, porcelain and many other wares. Those who dwell here have many great and fair vessels, which carry on this trade, and whosoever would have at his disposal things from Malacca and China, let him go to this place, where he will find them in greater perfection than in any other place soever. …","[In Malacca] dwell up to now great wholesale merchants of every kind, both Muslims and Hindus, many of them from Coromandel, men of great estates and owning many great ships which they call junks. They trade everywhere in goods of all kinds. … They go to Tenasserim, Pegu, Bengal, Pulicat, Coromandel, Malabar and Cambay, so much so that this city of Malacca is the richest seaport with the greatest number of wholesale merchants and abundance of shipping and trade that can be found in the whole world."],"attribution":"Duarte Barbosa, Portuguese official who worked in India from about 1500 to 1516, The Book of Duarte Barbosa, completed about 1518","translation":"Translated by M. Longworth Dames (1918–1921); place names and terms modernized (\"Moorish\" to Muslim, \"Heathen\" to Hindu); adapted","glossary":[{"t":"Rander","d":"a port in Gujarat, western India"},{"t":"Malacca","d":"a port on the strait between the Malay Peninsula and Sumatra, captured by the Portuguese in 1511"},{"t":"Coromandel","d":"the southeast coast of India"},{"t":"junks","d":"large Asian sailing ships"},{"t":"wholesale merchants","d":"merchants who buy and sell goods in very large amounts"}]},"P5":{"type":"passage","paragraphs":["The following day, Xicotencatl, Captain General of this province*, came to see me … with about fifty of its chiefs, praying me … that I would admit them to the royal service of Your Majesty and to my friendship, and would pardon them the past errors, because they had not understood who we were. He said that they had exerted all their forces … to escape being subjected to anyone, since at no time had this province ever been so … on the contrary, they had always lived free and independent, since immemorial times, and had always defended themselves against the great power of Moctezuma, of his father, and grandfather, who held that country subjected, but had never been able to hold them in subjection, though they had them surrounded on all sides, so that no one could go out of the country. He said also that they ate no salt, since there was none in their country, nor were they allowed to go to buy it anywhere else. … They had endured it, and held it as better thus to be free, rather than be subjected to anyone. They had wanted to do the same with me, but seeing clearly that neither their forces nor their tricks could help them, they had decided that, rather than die, … they would become vassals** of Your Highness."],"attribution":"Hernán Cortés, Spanish conquistador, letter to King Charles I of Spain (Holy Roman Emperor Charles V), 1520, describing events of September 1519","translation":"Translated by F. A. MacNutt (1908); names modernized; adapted","footnotes":[{"mark":"*","text":"Tlaxcala, an independent state east of Tenochtitlan, the Mexica (Aztec) capital"},{"mark":"**","text":"subjects who owe loyalty and service to a ruler"}],"glossary":[{"t":"Moctezuma","d":"Moctezuma II, ruler of the Mexica (Aztec) Empire"},{"t":"subjected","d":"ruled by someone else"},{"t":"immemorial","d":"so long ago no one remembers"}]},"P6":{"type":"passage","paragraphs":["The force of silver, which draws unto it the desire of all things, has peopled this mountain more than any other place in all these kingdoms. …","At this day the King receives for his fifth* yearly, from the mines of Potosí, a million of silver. … In the fleet in which I came in the year 1587, there were eleven millions transported in the two fleets of Peru and Mexico, whereof two thirds were in that of Peru, and almost one half for the King. I thought good to set this down … to show the power which His heavenly Majesty has given to the Kings of Spain … who (by the especial favor of heaven) have joined the East with the West Indies, environing the whole world with their power.","They labor in these mines in continual darkness … without knowledge of day or night. … They carry up this metal upon their shoulders, by ladders. A man carries ordinarily the weight of two arrobas** of metal upon his shoulders … and so go they up the ladder holding it with both their hands … a fearful thing, and which breeds an amazement to think upon it, so great is the desire of silver, that for the gain thereof men endure any pains."],"attribution":"José de Acosta, Spanish Jesuit priest who lived in Peru from 1572 to 1586, The Natural and Moral History of the Indies, 1590","translation":"Translated by Edward Grimston (1604); spelling modernized; adapted","footnotes":[{"mark":"*","text":"the royal fifth: the king's one-fifth share of the silver mined at Potosí at this time"},{"mark":"**","text":"about 50 pounds (23 kilograms)"}],"glossary":[{"t":"Potosí","d":"a huge silver mountain and mining city in the Andes (in today's Bolivia)"},{"t":"a million / eleven millions","d":"pesos, Spanish silver coins"},{"t":"East and West Indies","d":"Asia and the Americas"},{"t":"environing","d":"surrounding"}]},"P7":{"type":"passage","paragraphs":["… Though formerly ruled by a governor under the King of Kongo, this governor [of Angola**] has, since the king became a Christian, made himself absolute ruler. Having seized all the lands he ruled, and in time conquered some of the surrounding provinces, he is now a great and rich prince, and hardly less powerful than the King of Kongo, to whom he pays tribute or not, according as he chooses.","It came to pass that after Dom João II of Portugal planted the faith of Christ in the Kingdom of Kongo, and the king became a Christian, the Lord of Angola was always friendly towards him, being to some extent a vassal, and their people trading together. He sent tribute every year to the King of Kongo, and trade was carried on at the port of Luanda between the Portuguese and the people of Angola by permission of the King of Kongo. Slaves were bought and exchanged for other merchandise, all being sent to the island of São Tomé*. … Trade becoming successful, they began to send vessels themselves from Lisbon to Angola, and also a governor, Paulo Dias de Novais by name. … To this Paulo Dias, Dom Sebastião, King of Portugal, granted the power of conquering thirty-three leagues of country … where he was to take all he could gain for himself and his heirs."],"attribution":"Filippo Pigafetta, Italian writer, A Report of the Kingdom of Kongo, 1591, based on the accounts of Duarte Lopes, a Portuguese merchant who lived in Kongo in the 1570s and 1580s","translation":"Translated by Margarite Hutchinson (1881); names modernized; adapted","footnotes":[{"mark":"*","text":"a Portuguese island colony in the Gulf of Guinea, off the coast of Central Africa"},{"mark":"**","text":"here, the kingdom of Ndongo, south of Kongo; the Portuguese named it after its ruler's title, ngola"}],"glossary":[{"t":"vassal","d":"a lesser ruler who owes loyalty and payments to a stronger one"},{"t":"tribute","d":"payments made to show loyalty to a more powerful ruler"},{"t":"leagues","d":"an old distance unit; 33 leagues is roughly 100 miles"}]},"P8":{"type":"passage","paragraphs":["Although a kingdom may be enriched by gifts received, or by purchase taken from some other nations, yet these are things uncertain and of small consideration when they happen. The ordinary means therefore to increase our wealth and treasure is by foreign trade, wherein we must ever observe this rule: to sell more to strangers yearly than we consume of theirs in value.","For suppose that when this kingdom is plentifully served with the cloth, lead, tin, iron, fish and other native commodities, we do yearly export the overplus to foreign countries to the value of twenty-two hundred thousand pounds*, by which means we are enabled beyond the seas to buy and bring in foreign wares for our use and consumption to the value of twenty hundred thousand pounds. By this order duly kept in our trading, we may rest assured that the kingdom shall be enriched yearly two hundred thousand pounds, which must be brought to us in so much treasure, because that part of our stock which is not returned to us in wares must necessarily be brought home in treasure."],"attribution":"Thomas Mun, English merchant and director of the English East India Company, England's Treasure by Foreign Trade, written about 1630 and published in 1664","translation":"Spelling modernized; adapted","footnotes":[{"mark":"*","text":"pounds sterling, English money"}],"glossary":[{"t":"purchase","d":"here, wealth seized from others (loot), not buying"},{"t":"strangers","d":"foreigners"},{"t":"treasure","d":"gold and silver"},{"t":"wares","d":"goods for sale"},{"t":"overplus","d":"the extra goods left after the kingdom's own needs are met"},{"t":"stock","d":"the nation's total wealth"}]},"P9":{"type":"passage","paragraphs":["The Dutch began their career in the East with no idea other than that of buying cheap and selling dear; their ideas and aims were purely commercial. The experience of a few years taught them that in a country like Java they could not deal satisfactorily with individual traders and that they must deal with governments. They were forced, before they knew it, to become politicians, seeking their commercial ends through diplomatic channels, and warriors, upholding the gains that had been given them by treaty. …","The series of instructions to the Governors General … bade the chief executive in Asia never to make war unless forced. … It seems to have been morally impossible for the Dutch officials to obey these directions in the face of all the temptations to break them. Men of vigor, like Governor General Coen*, who did much to shape the Company's military policy in its early period, came to the conclusion that trade and war were inseparable. … Coen wrote to the directors in 1614 \"that trade in Asia must be conducted and maintained under protection and favor of your own weapons, and that the weapons must be supplied from the profits enjoyed by the trade, so that trade cannot be maintained without war or war without trade.\""],"attribution":"Clive Day, historian at Yale University, The Policy and Administration of the Dutch in Java, published in 1904","translation":"Coen's letter translated from Dutch by Clive Day; \"India\" changed to \"Asia\" in Day's text and Coen's letter, to match its meaning; adapted","footnotes":[{"mark":"*","text":"Jan Pieterszoon Coen (1587–1629), leader of the Dutch East India Company (VOC) in Asia, who founded the Dutch base at Batavia (today's Jakarta) on Java in 1619"}],"glossary":[{"t":"bade","d":"ordered"},{"t":"the Company","d":"the Dutch East India Company (VOC), a joint-stock company chartered in 1602"},{"t":"Java","d":"a large island in today's Indonesia"},{"t":"inseparable","d":"unable to be pulled apart"}]},"P10":{"type":"passage","paragraphs":["With respect to books which were not written by the sages … which alarm the age, and astonish the common people … these all contain strange teachings which should be rooted out. …","From of old three teachings have been handed down. Besides the teaching of the learned [Confucianism], there are those of Dao and Fo [Daoism and Buddhism]. …","The teaching of the Western Ocean, which honors Tianzhu*, ranks also among those that are corrupt; but because these men understand mathematics, therefore the government employs them: of this you ought to be aware. To walk in these by-roads and deceive the people is what the law will not excuse. …","Soldiers and people! act according to the sacred instructions of the late emperor**; and stop the progress of these strange sects as you would that of floods, fires, robbers, and thieves. Indeed the injury of floods, fires, robbers, and thieves ends with the body; but that of false religions reaches the human heart."],"attribution":"The Yongzheng Emperor of Qing China, Amplified Instructions on the Sacred Edict, 1724, explaining its seventh rule, \"Degrade strange religions, in order to exalt the orthodox [Confucian] teaching\"; these instructions were read aloud to the public twice a month across the empire","translation":"Translated by William Milne (1817); names modernized; adapted","footnotes":[{"mark":"*","text":"\"Lord of Heaven,\" the Chinese name for the Christian God; \"the teaching of the Western Ocean\" is Roman Catholic Christianity, brought by Jesuit missionaries"},{"mark":"**","text":"the Kangxi Emperor (ruled 1661–1722), who issued the original Sacred Edict in 1670"}],"glossary":[{"t":"sages","d":"wise teachers of the past, especially Confucius"},{"t":"sects","d":"religious groups outside the approved teaching"},{"t":"by-roads","d":"side paths; wrong ways"}]},"P11":{"type":"passage","paragraphs":["In the first place, the efforts of the Spaniards to suppress not only the religious beliefs but also the ancient habits and customs of the Indians in other respects, and to make them conform to European methods of living, created friction between the two races*. The Indians, however, continued well grounded in their native religious beliefs and practices, and the Spaniards found it practically impossible to suppress them either by the number of missionaries brought in, or by the severity of the punishments inflicted. In 1675 these \"superstitious practices\" reached such alarming extremes that Governor Treviño determined to stamp them out for good. Having captured forty-seven medicine men, who were alleged to be guilty of sorcery and witchcraft, he hanged three of them … and inflicted severe punishment upon the others, among whom was a certain native named Popé. …","On being released from captivity in 1675, he returned to his pueblo, full of resentment for the Spaniards. He at once began making preparations for a general revolt. … Other influences, such as the belief that the Spaniards could all be driven out of the country, and the almost universal desire to return to their ancient customs, all operated to make the revolt of the Indians general."],"attribution":"Charles W. Hackett, historian, \"The Revolt of the Pueblo Indians of New Mexico in 1680,\" published in 1911, based on Spanish colonial records","translation":"Adapted","footnotes":[{"mark":"*","text":"Hackett, writing in 1911, uses \"Indians\" for the Pueblo peoples and \"two races\" for Pueblos and Spaniards. \"Superstitious practices\" was the Spanish officials' label for Pueblo religion."}],"glossary":[{"t":"pueblo","d":"a town of the Pueblo peoples of what is now New Mexico"},{"t":"medicine men","d":"Pueblo religious leaders and healers"},{"t":"general","d":"widespread; involving nearly everyone"}]},"P12":{"type":"passage","paragraphs":["The Sultan's hall was crowded with people, among whom were several officers of high rank. Besides these there were all the troopers of the Imperial guard … and a large force of Janissaries*; but there was not in all that great assembly a single man who owed his position to anything except his valor and his merit. No distinction is attached to birth among the Turks; the respect to be paid to a man is measured by the position he holds in the public service. … In making his appointments the Sultan pays no regard to any claims on the score of wealth or rank … he considers each case on its own merits, and examines carefully into the character, ability, and disposition of the man whose promotion is in question. It is by merit that men rise in the service. … Those who receive the highest offices from the Sultan are for the most part the sons of shepherds or herdsmen, and so far from being ashamed of their parentage, they actually glory in it. …","This is the reason that they are successful in their undertakings, that they lord it over others, and are daily extending the bounds of their empire. These are not our ideas; with us there is no opening left for merit; birth is the standard for everything; the prestige of birth is the sole key to advancement in the public service."],"attribution":"Ogier Ghiselin de Busbecq, ambassador of the Habsburg ruler Ferdinand I to the court of Ottoman Sultan Suleiman I, private letter written in 1555","translation":"Translated by C. T. Forster and F. H. B. Daniell (1881); adapted","footnotes":[{"mark":"*","text":"elite Ottoman infantry soldiers who served the sultan"}],"glossary":[{"t":"merit","d":"skill and good work"},{"t":"prestige of birth","d":"the respect a person gets for coming from a noble family"},{"t":"Turks","d":"Busbecq's word for the Ottomans"}]},"P13":{"type":"passage","paragraphs":["One of the great gifts which His Majesty the Shahanshah* made at the beginning of this year was the remission of the jizya** throughout India. … In spite of the disapproval of statesmen, and of the great revenue, and of much chatter on the part of the ignorant, this sublime decree was issued. …","When this tax was imposed in former times … the reason for it was that they [earlier rulers], on account of heart-rooted hatred, were set on the contempt and destruction of those of other faiths. … At the present day, when … those who belong to other religions have, like those of one mind and one religion, bound up the waist of devotion and service, and exert themselves for the advancement of the empire, how should they be classed with that old faction [non-Muslims seen as enemies in earlier times] and be the subjects of contempt? Moreover the main cause of levying the tax in old times was the neediness of the rulers. At this day, when there are thousands of treasures in the storehouses of the world-wide government … why should a just and wise mind apply itself to collecting this tax?"],"attribution":"Abu'l-Fazl, adviser and official historian of the Mughal emperor Akbar, the Akbarnama, written in the 1590s, describing a decree of 1564","translation":"Translated by Henry Beveridge (1907–1912); adapted","footnotes":[{"mark":"*","text":"\"King of kings,\" a title for Akbar (ruled 1556–1605)"},{"mark":"**","text":"a tax that Islamic states placed on non-Muslim subjects; in Mughal India most of the people who paid it were Hindus"}],"glossary":[{"t":"remission","d":"canceling a tax or debt"},{"t":"bound up the waist of devotion and service","d":"worked loyally"},{"t":"decree","d":"an official order from a ruler"},{"t":"revenue","d":"money the government collects"}]},"P15":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Nanban-Screens-by-Kano-Naizen-c1600.png/1280px-Nanban-Screens-by-Kano-Naizen-c1600.png","width":1280,"height":554,"alt":"A wide Japanese folding screen painted on gold showing a large European sailing ship, a crowd of Portuguese merchants with servants carrying goods, and priests in dark robes greeting them near Japanese shops.","caption":"On the left, a large Portuguese carrack (a three-masted ocean-going ship) lies at anchor while small boats bring people and cargo ashore. In the center, Portuguese merchants in tall hats and baggy trousers walk in a procession; attendants, several of them African (servants or enslaved people), carry chests and goods. On the right, Catholic priests in black and gray robes come out to greet them beside Japanese shops and a building used as a church.","attribution":"Kanō Naizen, Japanese painter, Arrival of the Southern Barbarians*, folding screen (ink, color, and gold leaf on paper), c. 1600","credit":"Kobe City Museum, Japan. Public domain image via Wikimedia Commons. *\"Southern Barbarians\" (Nanban) was the Japanese name for the Portuguese and Spanish, who came to Japan from the south.","description":"A very wide painting on a gold background. A dark three-masted European ship with flags sits in the water at left, with sailors in its rigging. Along the beach in the middle, a parade of Portuguese merchants wearing hats and puffed trousers is led by a richly dressed man under a parasol; attendants carry boxes, bundles, and a covered chair, and a white horse is led along. At right, Jesuit priests in black robes and friars in gray meet the arrivals near a row of Japanese shops, while Japanese people look on.","glossary":[{"t":"carrack","d":"a large sailing ship used by the Portuguese and Spanish for long ocean voyages"},{"t":"Jesuits","d":"an order of Catholic priests known for missionary work and education"}]},"P16":{"type":"bar","title":"Estimated Arrivals of Enslaved Africans Carried Directly from Africa, Selected Regions of the Americas","categories":["Brazil","British\nCaribbean","French\nCaribbean","Spanish\nAmericas","Dutch\nAmericas","Mainland\nN. America"],"series":[{"name":"1601–1700 (thousands)","values":[784,310,39,226,124,15]},{"name":"1701–1800 (thousands)","values":[1989,1813,995,146,295,295]}],"yLabel":"Thousands of people","text":"Estimates count people who survived the voyage from Africa and landed in each region. They do not count later voyages between ports in the Americas. Regions follow the database's categories; mainland North America is the area that later became the United States and Canada. The second period extends past 1750.","source":"Trans-Atlantic Slave Trade Database estimates, Slave Voyages (slavevoyages.org), Emory University"},"P14":{"type":"pair","items":[{"label":"Source 1","paragraphs":["The discovery of America, and that of a passage to the East Indies by the Cape of Good Hope, are the two greatest and most important events recorded in the history of mankind. … By uniting in some measure the most distant parts of the world, by enabling them to relieve one another's wants, to increase one another's enjoyments, and to encourage one another's industry, their general tendency would seem to be beneficial. To the natives, however, both of the East and West Indies, all the commercial benefits which can have resulted from those events have been sunk and lost in the dreadful misfortunes which they have occasioned. These misfortunes, however, seem to have arisen rather from accident than from anything in the nature of those events themselves. At the particular time when these discoveries were made, the superiority of force happened to be so great on the side of the Europeans, that they were enabled to commit with impunity every sort of injustice in those remote countries. …"],"attribution":"Adam Smith, Scottish economist, The Wealth of Nations, 1776","translation":"Adapted","glossary":[{"t":"East and West Indies","d":"Asia and the Americas"},{"t":"with impunity","d":"without being punished"}]},{"label":"Source 2","paragraphs":["The discovery of gold and silver in America, the extirpation, enslavement and entombment in mines of the native population, the beginning of the conquest and looting of the East Indies, the turning of Africa into a [hunting ground for enslaved people], signalled the rosy dawn of the era of capitalist production. … On their heels treads the commercial war of the European nations, with the globe for a theatre. …","These methods [colonies, national debt, taxes, and tariffs] depend in part on brute force, for example, the colonial system. But they all employ the power of the State, the concentrated and organized force of society, to hasten … the process of transformation of the feudal mode of production into the capitalist mode. … Force is the midwife of every old society pregnant with a new one."],"attribution":"Karl Marx, German philosopher and critic of capitalism, Capital, Volume 1, 1867","translation":"Translated by Samuel Moore and Edward Aveling (1887); offensive 1887 wording replaced in brackets; adapted","glossary":[{"t":"extirpation","d":"destruction; wiping out"},{"t":"entombment in mines","d":"being worked to death in mines"},{"t":"rosy dawn","d":"Marx is being sarcastic: the \"bright beginning\" was actually violent"},{"t":"capitalist production","d":"an economy in which private owners invest money to make profit"},{"t":"feudal mode of production","d":"an older economy of lords and peasants"}]}]}},"practice":[{"id":"U4-P01","set":"P1","topic":"4.2","lo":"C","skill":"3.A","difficulty":"easy","stem":"The answer \"in search of Christians and of spices\" in the first paragraph best reflects which motives for Portuguese exploration?","options":{"A":"Religious and commercial goals: finding Christian allies and reaching the spice trade","B":"A wish to escape religious persecution at home and settle in new lands","C":"A plan to conquer and colonize the interior of the Indian subcontinent","D":"Scientific curiosity about the plants, animals, and peoples of the Southern Hemisphere"},"answer":"A","explanation":"\"Christians\" points to religion: the Portuguese hoped to find Christian allies and spread their faith. \"Spices\" points to money: they wanted to buy spices at the source instead of through Muslim and Venetian middlemen.","whyNot":{"B":"The Portuguese were not fleeing persecution; they were sent by their king.","C":"Nothing here mentions conquering inland India; the Portuguese wanted ports and trade.","D":"The crew says they came for Christians and spices, not to study nature."},"hint":"Split the phrase in two. What does \"Christians\" tell you? What does \"spices\" tell you?"},{"id":"U4-P02","set":"P1","topic":"4.4","lo":"F","skill":"3.A","difficulty":"medium","stem":"The reaction to the Portuguese gifts in the second paragraph best shows that","options":{"A":"Calicut was a rich trading center whose officials found the Portuguese gifts too poor","B":"the people of Calicut had never before met or traded with merchants from foreign lands","C":"the Portuguese were welcomed as the most powerful traders in the Indian Ocean world","D":"Indian rulers preferred to trade with Christian merchants rather than Muslim ones"},"answer":"A","explanation":"The officials compared these gifts with richer gifts from other merchants. Their reaction shows how wealthy Calicut was, and that the Portuguese did not meet the court's expectations.","whyNot":{"B":"Merchants from Tunis were already in Calicut, and the officials compared the gifts with those from Mecca. The people of Calicut knew foreign traders well.","C":"The passage does not show Portuguese power in Indian Ocean trade. It shows local officials judging their gifts too poor.","D":"Muslim merchants were already trading in Calicut, and the officials compared the gifts with those from Mecca."},"hint":"Why would officials laugh at hats, cloth, and honey? What were they used to getting?"},{"id":"U4-P03","set":"P1","topic":"4.1","lo":"A","skill":"4.A","difficulty":"medium","stem":"Vasco da Gama's ability to sail from East Africa to Calicut was most directly aided by","options":{"A":"a treaty in which Ming China opened the Indian Ocean to European ships","B":"Ming Chinese warships that escorted the Portuguese fleet across the ocean","C":"sea charts given to the Portuguese by the ruler of Calicut","D":"a local pilot hired in East Africa who knew the monsoon wind patterns"},"answer":"D","explanation":"At Malindi in East Africa, da Gama hired a pilot who knew how to use the monsoon winds to cross the Indian Ocean. Europeans' ocean travel depended on knowledge from other peoples.","whyNot":{"A":"Ming China made no such treaty, and China did not control the Indian Ocean.","B":"Ming China's treasure fleets had stopped sailing by the 1430s, and they never escorted Portuguese ships.","C":"Calicut was da Gama's destination. Its ruler did not help him get there."},"hint":"Da Gama sailed around Africa. Who in the Indian Ocean already knew how to cross it?"},{"id":"U4-P04","set":"P2","topic":"4.2","lo":"C","skill":"2.B","difficulty":"easy","stem":"Columbus most likely emphasized the gold, spices, and cotton of the islands in order to","options":{"A":"warn other European rulers to keep their ships away from the Caribbean","B":"persuade the Taíno to trade their gold for Spanish goods","C":"show that the islands' people were already Christians","D":"convince the Spanish monarchs to keep paying for his voyages"},"answer":"D","explanation":"Columbus wanted the king and queen to pay for more voyages. Describing gold, spices, and cotton made the islands sound like a great investment.","whyNot":{"A":"The letter was printed and shared across Europe; it advertises riches instead of warning others away.","B":"The letter is written to a Spanish official, not to the Taíno.","C":"Columbus hopes the islanders \"might be led to become Christians,\" so they were not Christians yet."},"hint":"Who was paying for the voyages? What would make them want to pay again?"},{"id":"U4-P05","set":"P2","topic":"4.2","lo":"C","skill":"3.A","difficulty":"easy","stem":"Based on the third paragraph, Columbus hoped that his voyage would lead to","options":{"A":"a peaceful partnership in which the islands' people kept their land","B":"converts to Christianity and new wealth for Spain from the islands","C":"the end of Spain's wars with the Muslim states of North Africa","D":"a trade treaty between Spain and the emperor of China"},"answer":"B","explanation":"Columbus promised \"all the gold they require\" and talked about \"turning so many nations to our holy faith.\" He mixed religious goals with the hope of riches.","whyNot":{"A":"Columbus offers to ship the islanders as slaves, so he did not plan for them to keep control of their land.","C":"The paragraph does not mention North Africa.","D":"The paragraph talks about gold, spices, cotton, slaves, and converts, not a treaty with China."},"hint":"Find two kinds of rewards Columbus promises: one religious and one about money."},{"id":"U4-P06","set":"P2","topic":"4.3","lo":"D","skill":"5.B","difficulty":"medium","stem":"Which of the following was a long-term result of the encounter that Columbus describes?","options":{"A":"The Taíno formed a strong empire that resisted Spain for centuries","B":"Spain gave up its Caribbean claims to focus on trade with Asia","C":"The Taíno population collapsed because of disease and forced labor","D":"European crops failed to grow in the Americas, so colonists starved"},"answer":"C","explanation":"Disease, violence, hunger, and forced labor caused a steep drop in the Taíno population. Taíno people survived, and their descendants and cultures continue today.","whyNot":{"A":"Taíno communities suffered severe population losses. They did not form an empire that resisted Spain.","B":"Spain kept and expanded its Caribbean colonies.","D":"European crops and animals spread widely in the Americas as part of the Columbian Exchange."},"hint":"What effects did disease and Spanish rule have on Taíno communities after 1492?","reasoning":"Causation"},{"id":"U4-P07","set":"P3","topic":"4.3","lo":"D","skill":"5.B","difficulty":"easy","stem":"The most important cause of the trend shown in the table was","options":{"A":"epidemics of smallpox, measles, and other diseases new to the Americas","B":"large-scale migration of Indigenous people from Mexico to the Caribbean","C":"a series of volcanic eruptions that destroyed farmland in central Mexico","D":"the Spanish practice of shipping large numbers of Indigenous workers to labor in Spain"},"answer":"A","explanation":"The biggest killer was disease. Smallpox, measles, and other illnesses from Europe and Africa spread through people who had never been exposed to them. War, famine, and forced labor made the epidemics even deadlier.","whyNot":{"B":"Migration to the Caribbean does not explain a population loss this large. Epidemics, violence, hunger, and forced labor caused far greater losses.","C":"Volcanoes did not cause this decline.","D":"Some Indigenous people were taken to Europe, but that does not explain the population loss shown here."},"hint":"This is part of the Columbian Exchange. What invisible things crossed the ocean with Europeans?","reasoning":"Causation"},{"id":"U4-P08","set":"P3","topic":"4.4","lo":"F","skill":"5.B","difficulty":"medium","stem":"The trend shown in the table most directly contributed to which of the following in the Americas?","options":{"A":"the end of Spanish silver mining in central Mexico","B":"a shift by Indigenous survivors from farming to herding","C":"greater use of enslaved Africans and other forced labor","D":"large-scale migration of free workers from China to Mexico"},"answer":"C","explanation":"As Indigenous populations fell, colonists looked for more workers for mines and farms. They brought in more enslaved Africans and kept forcing Indigenous people to work.","whyNot":{"A":"Silver mining continued despite the population decline.","B":"Most surviving Indigenous people kept farming.","D":"Free Chinese workers did not migrate to Mexico in large numbers."},"hint":"How did colonists respond to these population losses?","reasoning":"Causation"},{"id":"U4-P09","set":"P3","topic":"4.3","lo":"D","skill":"2.C","difficulty":"easy","stem":"Which of the following is a limitation of the table as evidence?","options":{"A":"The figures are estimates from partial records, and other historians dispute them.","B":"The table shows only the population of the Caribbean islands, not Mexico.","C":"The table begins after the Spanish conquest was already over.","D":"The figures come from Aztec census takers who greatly exaggerated how many people died."},"answer":"A","explanation":"The note says these are estimates and that some historians think the starting number is too high. No one counted everyone in 1518, so historians argue about the exact numbers, even though all agree the drop was enormous.","whyNot":{"B":"The title says central Mexico.","C":"The table starts in 1518, before the conquest began in
