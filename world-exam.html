{"id":"U3-P11","set":"P4","topic":"3.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"The methods described in the second paragraph show that the Russian state tried to","options":{"A":"win conquered peoples' loyalty by letting them choose their own local leaders","B":"convert the native peoples to Orthodox Christianity before taxing them","C":"keep conquered peoples under control with settlers and outside officials","D":"rule through native princes who paid tribute but kept their own armies"},"answer":"C","explanation":"Fletcher says the tsar settled Russians among the native peoples, appointed Russian officials, split the land into small pieces, and taxed the people heavily. He presents each step as a way to keep the conquered peoples weak and under Moscow's control.","whyNot":{"A":"Fletcher says the officials were \"of his own Russe people\" and were changed often.","B":"Fletcher says nothing about religion. Every method he lists is about control and taxes.","D":"The tsar made sure the people had \"neither armour nor money,\" so they kept no armies."},"hint":"List Fletcher's four methods. What do they have in common?"},{"id":"U3-P12","set":"P4","topic":"3.1","lo":"A","skill":"5.B","difficulty":"medium","stem":"Russian expansion into Siberia, described in the passage, was driven mainly by","options":{"A":"the search for silver mines like those the Spanish found in America","B":"demand for valuable furs that could be taxed and sold abroad","C":"a need for new farmland to feed Moscow's growing population","D":"the search for a northern sea route to trade with China"},"answer":"B","explanation":"Siberia's forests were full of sable, fox, and other fur animals. Russian traders, Cossacks, and soldiers moved east, built forts, and forced native peoples to pay tribute in furs, which sold for high prices in Europe and Asia.","whyNot":{"A":"Russia found little silver in Siberia in this period. Furs were the main prize.","C":"Some Russians did farm in southern Siberia, but valuable furs were the main early prize.","D":"The push across Siberia went overland along rivers, and its main prize was furs, not a sea route."},"hint":"What could Siberia offer that buyers in Europe and Asia would pay high prices for?","reasoning":"Causation"},{"id":"U3-P13","set":"P5","topic":"3.2","lo":"B","skill":"1.B","difficulty":"easy","stem":"The reforms described in the passage were part of Peter's broader effort to","options":{"A":"strengthen the Orthodox Church's power over Russian society","B":"modernize Russia by adopting Western European customs and ideas","C":"protect old Russian customs from Western European influence","D":"win the support of the boyars by respecting their traditions"},"answer":"B","explanation":"After touring Western Europe in 1697–1698, Peter wanted Russia to look and act like the powers of the West. Shaving beards and wearing Western clothes were public signs of this change. He also built a new army, a navy, and a new capital, St. Petersburg.","whyNot":{"A":"Priests spread opposition to the reforms, and Peter later put the Church under a council he controlled.","C":"Peter did the reverse. He ordered \"the French fashion\" in place of old Russian dress.","D":"Peter forced the boyars to give up their traditional dress."},"hint":"Where had Peter traveled just before these reforms, and what did he admire there?"},{"id":"U3-P14","set":"P5","topic":"3.1","lo":"A","skill":"5.B","difficulty":"medium","stem":"Peter's efforts to Westernize Russia, such as the reforms in the passage, contributed most directly to","options":{"A":"Russia's rise as a major European power after defeating Sweden","B":"the freeing of Russia's serfs to work in new factories","C":"Russia's conquest of Constantinople and the Black Sea straits","D":"a decline in the tsar's power over the boyars and the other nobles"},"answer":"A","explanation":"Peter also changed Russia's army, government, and taxes. His new army and navy defeated Sweden in the Great Northern War (1700–1721). Russia gained land on the Baltic Sea, where Peter built St. Petersburg. Russia was now one of Europe's great powers.","whyNot":{"B":"Serfdom grew stronger under Peter, and many new factories used serf labor. Serfdom ended in 1861.","C":"Peter fought the Ottomans but did not take Constantinople. His lasting gains were on the Baltic.","D":"Peter made the tsar more powerful. He forced nobles to serve the state and obey his orders."},"hint":"What war did Peter's new army and navy fight in the early 1700s?","reasoning":"Causation"},{"id":"U3-P15","set":"P5","topic":"3.2","lo":"B","skill":"2.C","difficulty":"medium","stem":"Which of the following is a limitation of the passage as evidence of how Russians reacted to Peter's reforms?","options":{"A":"Rousset lived far from Russia and does not say how he learned of these reactions.","B":"Rousset describes the reactions of older Russians but not of younger ones.","C":"Rousset leaves out the role of priests in stirring up opposition.","D":"Rousset does not explain what the tsar's new rules required."},"answer":"A","explanation":"A limitation is a reason to be careful with a source. Rousset wrote from the Netherlands and does not name his sources here; in fact, he never visited Russia. Historians would check his account against Russian decrees, letters, and other records.","whyNot":{"B":"Rousset also says the young men \"followed the new custom with the more readiness.\"","C":"Rousset says the complaints \"came from the priests.\"","D":"Rousset describes both the beard tax and the order to wear \"the French fashion.\""},"hint":"Where did Rousset live, and does he say where his information came from?"},{"id":"U3-P16","set":"P6","topic":"3.2","lo":"B","skill":"1.B","difficulty":"easy","stem":"Evliya's description best illustrates which of the following?","options":{"A":"Ottoman wealth came mainly from trade with Western Europe.","B":"Rulers used monumental architecture to show their power and piety.","C":"Religious buildings were paid for mainly by Sufi orders, not the sultan.","D":"Ottoman builders depended on Byzantine Christian masters to design mosques."},"answer":"B","explanation":"Suleiman gathered thousands of master builders and used costly stone brought from as far as Egypt. A grand mosque showed the sultan's wealth and his devotion to Islam, which helped make his rule seem rightful.","whyNot":{"A":"The passage measures the columns' value in tribute from Egypt. It says nothing about trade with Europe.","C":"Evliya says Sultan Suleiman built the mosque and gathered its builders.","D":"Evliya says the masters came from \"the dominions of the house of 'Osman,\" and the Byzantine Empire had ended in 1453."},"hint":"Why would a sultan want everyone in his capital to see a building like this?"},{"id":"U3-P17","set":"P6","topic":"3.2","lo":"B","skill":"4.A","difficulty":"medium","stem":"Evliya's comparison of the mosque's dome with the dome of Aya Sofiyah most likely reflects","options":{"A":"the Ottomans' rejection of older building styles as un-Islamic","B":"the influence of Persian architects whom the Ottomans brought from Tabriz","C":"Ottoman builders' lack of skill in raising large domes before Suleiman's reign","D":"the Ottomans' wish to match or surpass the Byzantine past of their capital"},"answer":"D","explanation":"The Ottomans conquered Constantinople, the Byzantine capital, in 1453 and made it their own capital. Hagia Sophia was its most famous building. A dome to rival it helped present the Ottomans as worthy heirs of the city's earlier rulers.","whyNot":{"A":"Comparing the domes shows that the Ottomans admired the older building and wanted to rival it, not reject it.","B":"Some artisans did come from Tabriz after 1514, but Evliya compares the dome with Aya Sofiyah, not with Persian work.","C":"Ottoman builders had raised large domes before, and Evliya stresses the skill of the \"perfect masters\" Suleiman gathered."},"hint":"When was Aya Sofiyah built, and who ruled the city before the Ottomans?"},{"id":"U3-P18","set":"P6","topic":"3.3","lo":"C","skill":"1.B","difficulty":"medium","stem":"The names written on the four piers most directly reflect","options":{"A":"the sultan's claim to be descended from the Prophet's family","B":"Suleiman's effort to win Shi'a subjects by honoring 'Ali and his sons","C":"the sultan's wish to honor Osman, the founder of his own dynasty","D":"the Ottoman dynasty's identity as Sunni Muslims"},"answer":"D","explanation":"Sunni Muslims honor all of the first four caliphs. Shi'a Muslims believe 'Ali should have led first and do not accept the three caliphs before him as rightful leaders. Placing Abu Bekr, 'Omar, and 'Osman on the piers showed the Ottomans' Sunni faith.","whyNot":{"A":"The Ottomans did not claim descent from Muhammad. It was the Safavids who claimed descent from 'Ali.","B":"The piers also honor Abu Bekr, 'Omar, and 'Osman, whom Shi'a Muslims do not accept as rightful caliphs. That is a Sunni list.","C":"The glossary explains that this 'Osman is the caliph Uthman, one of the first four caliphs."},"hint":"Look at which names are on the piers. What religious tradition does that list fit?"},{"id":"U3-P19","set":"P7","topic":"3.2","lo":"B","skill":"2.B","difficulty":"easy","stem":"The huge halo behind Jahangir's head was most likely meant to","options":{"A":"show that the emperor had become a Christian","B":"show that the emperor's authority came from God","C":"celebrate the emperor's victory over the rulers shown below him","D":"honor the Hindu sun god whom the emperor worshiped"},"answer":"B","explanation":"Mughal artists drew on Persian, Indian, and European art to show royal power. Mughal writers described the emperor as shining with a light from God, and the halo shows Jahangir glowing with that light.","whyNot":{"A":"Halos appear in Christian art, but Jahangir stayed a Muslim. Mughal artists borrowed the halo to show God's blessing.","C":"No battle is shown, and the kings below are visitors, not prisoners.","D":"The sun and moon praise the emperor's own power. The painting does not show him worshiping a Hindu god."},"hint":"In art, what does a glowing circle around a person's head usually mean?"},{"id":"U3-P20","set":"P7","topic":"3.2","lo":"B","skill":"2.B","difficulty":"easy","stem":"Bichitr's choice to show Jahangir handing a book to a Sufi shaikh while kings wait below was most likely meant to","options":{"A":"show that the emperor took orders from Sufi leaders in matters of state","B":"celebrate the emperor's alliances with the Ottoman sultan and the English king","C":"present the emperor as a pious Muslim ruler who valued holy men above worldly power","D":"warn Sufi leaders that the emperor would take control of their shrines"},"answer":"C","explanation":"Mughal emperors honored Sufi saints, such as the Chishti saints of Ajmer. By showing Jahangir favoring a holy man over kings, the painting presents him as both a mighty ruler and a devout Muslim.","whyNot":{"A":"Jahangir gives the shaikh a gift from his throne. He honors the shaikh but does not take orders from him.","B":"The kings stand below and wait. The painting ranks them beneath the holy man instead of celebrating them as allies.","D":"The emperor is giving the shaikh a gift, a sign of respect, not a threat."},"hint":"To whom does Jahangir turn, and who is left waiting?"},{"id":"U3-P21","set":"P7","topic":"3.4","lo":"D","skill":"5.A","difficulty":"medium","stem":"Jahangir's use of art to strengthen his authority was most similar to","options":{"A":"Louis XIV's building of the palace of Versailles to display royal glory","B":"Martin Luther's use of printed pamphlets with woodcut pictures to attack the pope","C":"Jesuit missionaries' use of European paintings to teach Christianity in China","D":"Safavid potters' copying of Chinese porcelain designs to sell to European buyers"},"answer":"A","explanation":"Rulers in many empires used art and buildings to look powerful and blessed. Jahangir used paintings like this one, and Louis XIV built a huge palace. Both wanted subjects and rivals to see their greatness.","whyNot":{"B":"Luther used pictures to attack the pope's power, not to build up a ruler's own power.","C":"The Jesuits used art to spread their religion, not to praise a ruler.","D":"The potters made art to sell, not to show a ruler's greatness."},"hint":"For each choice, ask: Who made or ordered the art, and whose power was it meant to build up?","reasoning":"Comparison"},{"id":"U3-P22","set":"P8","topic":"3.2","lo":"B","skill":"1.B","difficulty":"easy","stem":"The system Ricci describes best illustrates which of the following?","options":{"A":"Recruiting officials through exams on Confucian learning","B":"Choosing officials from families that held their posts by birth","C":"Training enslaved boys from conquered peoples to serve as officials","D":"Selling government offices to wealthy merchant families"},"answer":"A","explanation":"Ming China chose many of its officials through written exams on the Confucian classics. Passing earned a degree, respect, and a chance at government jobs. The exams gave the emperor educated officials who owed their posts to the state.","whyNot":{"B":"Ricci says none are admitted to government \"but the Learned,\" who earn degrees by exam.","C":"That was the Ottoman devshirme. Ricci describes free men taking written exams.","D":"Ricci describes degrees won by examination, not offices bought with money."},"hint":"According to Ricci, who is allowed into government?"},{"id":"U3-P23","set":"P8","topic":"3.4","lo":"D","skill":"5.A","difficulty":"medium","stem":"Compared with the Ottoman devshirme, the Ming system described in the passage placed more emphasis on","options":{"A":"hereditary claims to government offices held by noble families","B":"military training for boys raised in the ruler's household","C":"recommendations from powerful local families and officials","D":"performance on written exams in classical learning"},"answer":"D","explanation":"The Ming exams tested knowledge of the Chinese classics. The devshirme forced selected Christian boys into Ottoman service, where they trained as soldiers or palace officials. Neither was its empire's only path into government.","whyNot":{"A":"Ricci describes competitive exams. Offices were not inherited.","B":"That describes the devshirme, which trained boys in the sultan's household. Ricci says \"Soldiery is of no such reckoning\" in China.","C":"Ricci says candidates had to pass written exams. He does not describe recommendations."},"hint":"How did each empire find its future officials?","reasoning":"Comparison"},{"id":"U3-P24","set":"P8","topic":"3.2","lo":"B","skill":"2.B","difficulty":"medium","stem":"Ricci's detailed description of the exams was most likely written for","options":{"A":"Chinese officials who needed rules for running the exams","B":"European readers who wanted to know how China was governed","C":"Ming emperors who were planning to reform the exams","D":"the pope, to argue that Jesuits should run China's schools"},"answer":"B","explanation":"Ricci's account was printed in Latin and then in English, so it was meant mainly for European readers. Europeans were curious about the huge empire that missionaries and traders were reaching.","whyNot":{"A":"Chinese officials already knew the system. Ricci explains it as something new and strange.","C":"Ricci was a foreign missionary, not an adviser on the exams.","D":"Ricci describes the Chinese system with respect. He does not argue that Jesuits should replace it."},"hint":"Look at the attribution. In what languages was this account published?"},{"id":"U3-P25","set":"P9","topic":"3.2","lo":"B","skill":"2.B","difficulty":"easy","stem":"The passage was most likely intended to","options":{"A":"announce a new tax to pay for the emperor's wars on the frontier","B":"explain why the emperor was forgiving unpaid taxes in famine years","C":"warn local officials that the emperor would raise tax rates","D":"persuade ordinary people that paying taxes was a duty that helped them"},"answer":"D","explanation":"These lessons were read aloud to ordinary people. The passage says that taxes pay for officials, soldiers, canals, and granaries that protect the people. In return, people should pay willingly.","whyNot":{"A":"The passage says the tax amount had been fixed since the dynasty began. It announces no new tax.","B":"The passage urges people to pay their taxes, not to wait for them to be forgiven.","C":"The passage promises that \"not a thread or a hair too much\" will be taken."},"hint":"Who was supposed to hear this passage? What did the government want them to do?"},{"id":"U3-P26","set":"P9","topic":"3.2","lo":"B","skill":"5.B","difficulty":"hard","stem":"Qing taxes were collected largely in silver, as late Ming taxes had been. This practice depended most directly on","options":{"A":"the discovery of rich new silver mines in northern China","B":"a ban on foreign trade that kept silver inside China","C":"large inflows of silver from Japan and Spanish America","D":"silver paid by Russian merchants trading furs at the border"},"answer":"C","explanation":"China sold silk, porcelain, and tea to the world and was paid in silver. Much of it came from Japan. Much more came from Spanish mines in the Americas, by way of Manila and other trade routes. This flow let Ming and Qing rulers collect taxes in silver.","whyNot":{"A":"China had few large silver mines of its own. Most of its silver came from abroad.","B":"Silver came into China through foreign trade. A trade ban would have cut off the supply.","D":"Trade with Russia was small. Far more silver came by sea from Japan and the Americas."},"hint":"Where did most of the world's silver come from in the 1500s and 1600s?","reasoning":"Causation"},{"id":"U3-P27","set":"P9","topic":"3.2","lo":"B","skill":"3.A","difficulty":"medium","stem":"Which of the following claims does the passage best support?","options":{"A":"Qing rulers let each province set its own tax rates.","B":"Qing rulers said the state cared for the people, who owed it loyalty.","C":"The Qing government spent most of its taxes on the emperor's palaces and court.","D":"Qing rulers believed taxes should rise as the population grew."},"answer":"B","explanation":"The passage lists the ways taxes \"promote your interests\" and says the people \"must reciprocate.\" This fits the Confucian idea that a ruler should care for his people like a father, and the people should be loyal.","whyNot":{"A":"The passage says there has been \"a fixed amount of taxes\" since the dynasty began.","C":"The passage says taxes are \"not for the private uses of the Government.\"","D":"The passage stresses a fixed amount of taxes. In 1712 the Kangxi Emperor had in fact frozen the head tax."},"hint":"Find the word \"reciprocate.\" What does the passage say each side owes the other?"},{"id":"U3-P28","set":"P10","topic":"3.2","lo":"B","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes the relationship between the two sources?","options":{"A":"Source 1 calls royal power sinful; Source 2 defends the nobles' right to resist a king who abuses power.","B":"Source 1 shows how Louis XIV controlled nobles; Source 2 gives a religious reason for royal power.","C":"Both sources argue that kings must share power with an elected assembly.","D":"Both sources describe how Louis XIV raised taxes to pay for Versailles."},"answer":"B","explanation":"Saint-Simon shows a practical way the king kept nobles weak: keeping them at court where he could watch them. Bossuet explains why the king deserved such power: his throne is \"the throne of God himself.\"","whyNot":{"A":"Saint-Simon describes the king's methods without calling them sinful, and Bossuet says kings are sacred.","C":"Neither source mentions an assembly. Bossuet says kings answer to God.","D":"Neither source discusses taxes."},"hint":"State each writer's main point in a few words before comparing them.","reasoning":"Comparison"},{"id":"U3-P29","set":"P10","topic":"3.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"Louis XIV's methods described in Source 1 were most directly intended to","options":{"A":"weaken the independent power of nobles by keeping them under the king's eye","B":"train nobles as professional army officers loyal to the king","C":"persuade the nobles to give up their old exemptions from paying the royal taxes","D":"give nobles a voice in royal decisions through an assembly"},"answer":"A","explanation":"Nobles who lived at Versailles competed for the king's favor instead of building power in their own lands. Louis noticed who came and who stayed away, and those who stayed away fell into \"certain disgrace.\"","whyNot":{"B":"Louis did build a professional army, but Saint-Simon describes court life, favors, and disgrace, not military training.","C":"Saint-Simon does not mention taxes. The nobles stayed free of France's main tax, the taille.","D":"Louis XIV ruled without calling France's assembly of estates. Saint-Simon shows the king, not the nobles, deciding."},"hint":"What happened to nobles who did not come to court?"},{"id":"U3-P30","set":"P10","topic":"3.4","lo":"D","skill":"5.A","difficulty":"medium","stem":"Bossuet's ideas in Source 2 are most similar to which of the following?","options":{"A":"Luther's teaching that baptized Christians share in the priesthood","B":"The Chinese idea that emperors ruled under the Mandate of Heaven","C":"The English Parliament's claim that kings must obey the law and share power","D":"Akbar's invitations to scholars of many faiths to debate at his court"},"answer":"B","explanation":"Bossuet says a king's power comes from God, and God will judge how he uses it. In China, the Mandate of Heaven also said that heaven gave rulers their power and could take it away from bad rulers.","whyNot":{"A":"Luther's idea gives spiritual standing to believers. Bossuet raises the king above everyone.","C":"Parliament wanted to limit the king's power. Bossuet says the king answers only to God.","D":"Akbar's debates were about religious ideas, not about where a ruler's power comes from."},"hint":"Underline the words Bossuet uses to say where a king's power comes from.","reasoning":"Comparison"},{"id":"U3-P31","set":"P11","topic":"3.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"Leo's description of Timbuktu's scholars best illustrates which of the following?","options":{"A":"Songhai rulers distrusted the scholars and kept them away from the court.","B":"Songhai rulers backed Islamic learning, which added to their authority.","C":"Timbuktu's scholars chose each new Songhai ruler.","D":"Timbuktu's learning depended on scholars sent from Mamluk Egypt."},"answer":"B","explanation":"Leo says the ruler paid Muslim scholars and judges. Supporting Islamic learning could win a ruler respect and strengthen his authority. Timbuktu became famous for its books and schools.","whyNot":{"A":"Leo says the scholars are \"bountifully maintained at the king's cost,\" so the king supported them.","C":"Leo says the king pays the scholars. Nothing shows the scholars choosing kings.","D":"Leo says books came from Barbary (North Africa). He says nothing about scholars sent from Egypt."},"hint":"Who pays the learned men? Why would a ruler want to do that?"},{"id":"U3-P32","set":"P11","topic":"3.1","lo":"A","skill":"3.A","difficulty":"medium","stem":"Leo's description of the king's army best supports which claim?","options":{"A":"The king's army relied mainly on muskets bought from North African merchants.","B":"The king bred his own war horses in large numbers near Timbuktu.","C":"The king avoided war and depended on merchants to defend the city.","D":"The king used cavalry and raids to force neighboring peoples to pay tribute."},"answer":"D","explanation":"Songhai's rulers kept a strong cavalry force. They raided peoples who refused to pay tribute and sold captives to merchants. Horses from North Africa helped make this army powerful.","whyNot":{"A":"Leo's footmen \"shoot poisoned arrows.\" He mentions no guns.","B":"Leo says \"very few horses\" are bred there; the best come from Barbary.","C":"Leo describes 3,000 horsemen and frequent \"skirmishes\" with those who refuse tribute."},"hint":"What does the king's army do to people who refuse to pay tribute?","reasoning":"Causation"},{"id":"U3-P33","set":"P11","topic":"3.2","lo":"B","skill":"2.C","difficulty":"medium","stem":"Leo's account is most useful to historians as evidence of","options":{"A":"the religious beliefs of ordinary farmers in the villages of the Songhai countryside","B":"how European missionaries viewed Islam in Africa","C":"trade and court life in West Africa as seen by a North African visitor","D":"the Songhai rulers' own explanations of their policies"},"answer":"C","explanation":"Leo saw Timbuktu's markets and court for himself. As a visitor from Morocco, he noticed prices, trade goods, and court customs. The passage says little about life in the villages.","whyNot":{"A":"Leo describes the city and the court, not village farmers.","B":"Leo was a scholar from North Africa, not a European missionary.","D":"Leo was an outside visitor. He reports what he saw, not the rulers' own words."},"hint":"Which subjects does this passage describe in detail?"},{"id":"U3-P34","set":"P12","topic":"3.3","lo":"C","skill":"3.A","difficulty":"medium","stem":"Luther's main argument in the passage is that","options":{"A":"the pope's supporters use false claims of power to block Church reform","B":"German princes should accept the pope's authority over questions of religion","C":"monks, nuns, and priests deserve a higher place in society than princes","D":"peasants should rise up against lords who support the pope in Rome"},"answer":"A","explanation":"Luther says the pope's supporters hid behind \"three walls\" to avoid reform: that the Church is above rulers, that only the pope can explain the Bible, and that only the pope can call a council. He argues that all baptized Christians are priests, so the clergy are not above everyone else. This opened the way for rulers to reform the Church.","whyNot":{"B":"Luther attacks the claim that \"the spiritual power is above the temporal.\"","C":"Luther calls the idea of a separate Spiritual Estate \"a very fine, hypocritical device.\"","D":"Luther speaks to the nobles and asks them to act. He does not call on peasants to revolt."},"hint":"What are the \"three walls,\" and what does Luther want to do to them?"},{"id":"U3-P35","set":"P12","topic":"3.3","lo":"C","skill":"2.B","difficulty":"medium","stem":"Luther addressed this work to the German nobility most likely because he","options":{"A":"believed the German nobles had a duty to defend the pope's authority","B":"wanted the nobles to pay for St. Peter's Basilica","C":"believed the nobles had already left the Catholic Church","D":"hoped princes would use their power to reform the Church"},"answer":"D","explanation":"Luther needed protectors. Princes could shield reformers and take charge of churches in their own lands. Frederick the Wise of Saxony did protect Luther after the pope and the emperor condemned him.","whyNot":{"A":"Luther attacks the pope's claims. He wants the nobles to reform the Church, not defend the pope.","B":"Luther criticized raising money for St. Peter's. He did not ask nobles to pay for it.","C":"In 1520 the German princes were still Catholic. Luther was trying to win them over."},"hint":"What could powerful nobles do that a monk could not?"},{"id":"U3-P36","set":"P12","topic":"3.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"Ideas like those in the passage contributed most directly to","options":{"A":"rulers in northern Europe breaking with Rome and forming state churches","B":"the reunion of Western Christianity under the pope","C":"a decline in the control that rulers had over religion within their own lands","D":"the end of Catholic missions outside Europe"},"answer":"A","explanation":"Many German princes, the kings of Denmark and Sweden, and later the English crown broke with the pope and set up churches under their own control. The Peace of Augsburg (1555) let rulers in the Holy Roman Empire choose either Catholicism or Lutheranism for their lands.","whyNot":{"B":"The Reformation divided Western Christianity. It did not reunite it.","C":"The opposite happened. Protestant rulers took control of the churches in their lands.","D":"Catholic missions grew. Jesuits and other orders went to Asia and the Americas."},"hint":"Luther said rulers had a right to reform the Church. What did many rulers then do?","reasoning":"Causation"},{"id":"U3-P37","set":"P13","topic":"3.3","lo":"C","skill":"3.A","difficulty":"easy","stem":"Which of the following claims is best supported by the chart?","options":{"A":"The order's membership fell during the 1600s.","B":"The order grew faster from 1680 to 1749 than from 1556 to 1615.","C":"The Jesuit order grew more than tenfold between 1556 and 1615.","D":"The order had more than 30,000 members by 1749."},"answer":"C","explanation":"In 1556 the order had about 1,000 members. By 1615 it had 13,112, about thirteen times as many. Growth continued, but more slowly, through 1749.","whyNot":{"A":"Membership rose from 13,112 in 1615 to 17,665 in 1680.","B":"It added about 4,900 members from 1680 to 1749, but about 12,100 from 1556 to 1615.","D":"The chart shows 22,589 members in 1749."},"hint":"Test each choice against the chart. For a choice about how many times bigger, divide one number by the other."},{"id":"U3-P38","set":"P13","topic":"3.3","lo":"C","skill":"4.A","difficulty":"medium","stem":"The growth shown in the chart is best understood in the context of","options":{"A":"the Catholic Reformation's response to the spread of Protestantism","B":"Protestant rulers' closing of monasteries and Catholic religious orders","C":"the Council of Trent's ban on founding new religious orders","D":"the spread of Enlightenment ideas in Catholic universities"},"answer":"A","explanation":"The Jesuits were founded in 1540 to defend and spread the Catholic faith. They opened schools, preached, and sent missionaries around the world. Their growth was part of the Catholic Church's answer to Protestant reformers.","whyNot":{"B":"Closing orders would shrink them. The chart shows a Catholic order growing.","C":"Trent did not ban new orders. The pope had approved the Jesuits in 1540.","D":"The Enlightenment came mostly after 1700, and many of its writers criticized religious orders."},"hint":"What was happening to the Catholic Church in Europe in the mid-1500s?"},{"id":"U3-P39","set":"P13","topic":"3.3","lo":"C","skill":"3.D","difficulty":"medium","stem":"Which additional evidence would best support the argument that the growth shown in the chart helped spread Catholicism beyond Europe?","options":{"A":"Records showing that most early missions in Spanish Mexico were run by Franciscan and Dominican friars","B":"Records of nobles paying to build Jesuit colleges in European cities","C":"Records of Jesuit teachers and missionaries working in Asia and the Americas","D":"Records of Jesuit priests serving as advisers to Catholic kings in Europe"},"answer":"C","explanation":"The chart shows how many Jesuits there were, not where they worked. Records of Jesuits teaching and preaching in places such as Japan, China, India, Brazil, and New France would link the order's growth to the spread of Catholicism.","whyNot":{"A":"Missions run by other religious orders do not show that the Jesuits' growth spread Catholicism.","B":"Colleges in Europe show growth inside Europe, not the spread of Catholicism beyond it.","D":"Advising kings in Europe does not show the faith spreading outside Europe."},"hint":"The chart shows numbers only. What would you need to know to connect those numbers to places outside Europe?"},{"id":"U3-P40","set":"P14","topic":"3.3","lo":"C","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes the relationship between the two sources?","options":{"A":"Source 1 urges rulers to enforce Islamic law; Source 2 shows a ruler protecting a popular religious teacher.","B":"Source 1 defends the sacred thread and caste rituals; Source 2 shows a ruler honoring a Sikh guru at court.","C":"Both sources argue that religious teachers should obey the emperor and stay out of politics.","D":"Source 1 values inner devotion over ritual; Source 2 shows a ruler treating a growing faith as a threat."},"answer":"D","explanation":"Nanak's hymns stress kindness, truth, and sincere devotion over outward rituals. Jahangir sees Guru Arjun, a later leader of the community Nanak founded, as a threat and orders his death. Together the sources show a new faith and a ruler's hostile response.","whyNot":{"A":"Nanak says a true Muslim is kind and just; he does not ask rulers to enforce laws. Jahangir orders Arjun's death.","B":"Nanak asks for a thread made of mercy and truth, not the usual ritual thread. Jahangir has Arjun put to death.","C":"Neither source says this. Nanak speaks about true faith, and Jahangir writes as an angry ruler."},"hint":"Sum up each source in a few words. Then test each choice against both summaries.","reasoning":"Comparison"},{"id":"U3-P41","set":"P14","topic":"3.3","lo":"C","skill":"2.B","difficulty":"medium","stem":"Jahangir's description of Arjun's followers as \"simple-hearted\" and \"stupid\" most likely reflects","options":{"A":"his respect for holy men of many faiths, which he shared with the Sufis","B":"the policy of tolerance that his father Akbar had followed","C":"his view that the Sikh movement threatened Islam and his own authority","D":"his anger that Arjun had refused to pay the Mughal land tax"},"answer":"C","explanation":"Jahangir was angry that Arjun drew Muslim followers and had honored Khusrau, the prince who rebelled. His insulting words show how he saw the Guru: as a dangerous rival to his faith and his throne.","whyNot":{"A":"Jahangir did honor Sufi shaikhs, but here he calls Arjun's following a \"vain affair\" and orders his death.","B":"Akbar welcomed teachers of many faiths. Jahangir's words show hostility instead.","D":"Jahangir says nothing about taxes. He is angry about Arjun's popularity and his support for Khusrau."},"hint":"Why would an emperor be bothered by a popular religious teacher who had met his rebel son?"},{"id":"U3-P42","set":"P14","topic":"3.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"Events like the one described in Source 2 contributed most directly to","options":{"A":"the Sikhs' merger with the Chishti Sufi order in the Punjab","B":"the Sikhs' withdrawal from public life to focus on private prayer","C":"the Sikhs' growing military tradition to defend their community","D":"an alliance between the Sikh gurus and the Mughal emperor Aurangzeb"},"answer":"C","explanation":"After Arjun's death, his son Guru Hargobind began to keep armed followers. In 1699 Guru Gobind Singh founded the Khalsa, a community of Sikhs pledged to defend their faith. Conflict with Mughal rulers shaped these changes.","whyNot":{"A":"The Sikhs remained a separate community led by their own gurus.","B":"The opposite happened. Later gurus kept armed followers and took a public role.","D":"Conflict grew worse. Aurangzeb had the ninth guru, Tegh Bahadur, executed in 1675."},"hint":"How might a religious community respond after its leader is executed by the state?","reasoning":"Causation"},{"id":"U3-P43","set":"P15","topic":"3.3","lo":"C","skill":"2.B","difficulty":"medium","stem":"Bada'uni's description of Akbar's religious views most likely reflects","options":{"A":"his disapproval of Akbar's openness to faiths other than Islam","B":"his support for Akbar's plan to make Hinduism the official state religion","C":"his admiration for Akbar's search for truth among many teachers","D":"the praise of Akbar's tolerance in Abu'l-Fazl's official history"},"answer":"A","explanation":"Bada'uni complains that Akbar \"picked and chose from any one except a Moslem.\" He believed Islam was the one true faith. His critical history shows how some Muslims at court saw Akbar's policies. Working for the emperor did not mean agreeing with him.","whyNot":{"B":"Akbar did not make Hinduism the state religion, and Bada'uni praises no such plan.","C":"Bada'uni complains that Akbar \"picked and chose from any one except a Moslem.\" He does not admire it.","D":"Abu'l-Fazl praised Akbar's policies. Bada'uni complains about them."},"hint":"Which words show how the writer feels about the emperor's choices?"},{"id":"U3-P44","set":"P15","topic":"3.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"Akbar's religious policies described in the passage most likely helped him to","options":{"A":"enforce Islamic law more strictly across his empire","B":"end the influence of Jesuit missionaries at his court","C":"strengthen the power of Sunni scholars over the emperor","D":"win the loyalty of an empire where most subjects were not Muslim"},"answer":"D","explanation":"Most of Akbar's subjects were Hindus. By honoring teachers of many faiths, marrying Rajput princesses, and ending the jizya tax on non-Muslims, he gained the support of Hindu nobles and soldiers. This helped hold his empire together.","whyNot":{"A":"That describes Aurangzeb, a later emperor. Bada'uni says Akbar found wise men \"in all religions.\"","B":"Akbar invited Jesuits to his court to join debates.","C":"Akbar reduced their power, which is why scholars like Bada'uni were unhappy."},"hint":"Think about who most of Akbar's subjects were."},{"id":"U3-P45","set":"P15","topic":"3.4","lo":"D","skill":"5.A","difficulty":"medium","stem":"Akbar's approach to religion, as described by Bada'uni, was most similar to","options":{"A":"Philip II of Spain's efforts to stamp out Protestantism in the Netherlands","B":"Louis XIV's decision in 1685 to end the toleration of Protestants in France","C":"Jahangir's order to execute the Sikh leader Guru Arjun, whom he saw as a rival","D":"Ottoman sultans letting Christian and Jewish groups run some of their affairs"},"answer":"D","explanation":"The Ottomans let Christian and Jewish communities handle some religious and family matters through their own leaders, as long as they paid taxes and stayed loyal. Like Akbar, they allowed religious diversity to keep peace in a mixed empire.","whyNot":{"A":"Philip II used force to defend Catholicism. Akbar welcomed many faiths.","B":"In 1685 Louis XIV took away the rights of Protestants in France. That was the opposite of tolerance.","C":"Jahangir punished a religious leader he saw as a threat. That is the opposite of Akbar's openness."},"hint":"How did Akbar treat teachers of other religions? Which choice shows a ruler treating other faiths in the same way?","reasoning":"Comparison"},{"id":"U3-P46","set":"P16","topic":"3.2","lo":"B","skill":"1.B","difficulty":"easy","stem":"The passage best illustrates which method Safavid rulers used to legitimize their power?","options":{"A":"claiming descent from the Mongol khans, as earlier Persian rulers had","B":"building grand mosques and squares in their capital","C":"claiming a sacred status through descent from 'Ali","D":"winning Venetian support against the Ottomans"},"answer":"C","explanation":"The Safavids claimed descent from 'Ali, whom Shi'a Muslims deeply honor. Many of their followers treated the shah as holy, even seeking water he had washed in. This religious devotion strengthened the shah's power.","whyNot":{"A":"D'Alessandri says the people revere the shah \"on account of his descent from the line of Ali,\" not from the Mongols.","B":"Later shahs did build in Isfahan, but this passage is about the people's religious devotion to the shah.","D":"Venice did seek Persian help, but the passage is about how Persians saw their own ruler."},"hint":"Why does d'Alessandri say the people worship the king?"},{"id":"U3-P47","set":"P16","topic":"3.1","lo":"A","skill":"3.D","difficulty":"hard","stem":"A historian would most likely question d'Alessandri's explanation of why the shah left Tabriz for Qazvin because","options":{"A":"Ottoman armies had attacked and occupied Tabriz, near the Ottoman border","B":"Tabriz was the shah's birthplace and the main center of his family's support","C":"Qazvin was the holy city where the Safavid family's Sufi order began","D":"Qazvin had been destroyed by the Uzbeks shortly before"},"answer":"A","explanation":"Tabriz lies in the far northwest, close to the Ottoman Empire, and Ottoman armies took it several times in the 1500s. Shah Tahmasp moved his capital east to Qazvin, where it was safer. D'Alessandri repeats a story he heard instead.","whyNot":{"B":"Tahmasp was born near Isfahan, and his family's home base was Ardabil, not Tabriz.","C":"The Safavid Sufi order began at Ardabil, not Qazvin.","D":"Qazvin became the Safavid capital and was not destroyed. The main threat came from the Ottomans in the west."},"hint":"D'Alessandri repeats what \"it is said.\" What other reason might a shah have had for moving his capital in the mid-1500s?"},{"id":"U3-P48","set":"P16","topic":"3.3","lo":"C","skill":"4.A","difficulty":"medium","stem":"The people's devotion to the shah described in the passage is best explained by","options":{"A":"the shah's conversion of Persia from Shi'a to Sunni Islam","B":"the shah's lowering of taxes on farmers and the common people","C":"the Safavids' roots as leaders of a revered Sufi order","D":"the shah's victories over the Mughals at Kandahar"},"answer":"C","explanation":"Before they ruled Persia, the Safavid family led a Sufi brotherhood at Ardabil. Their Kizilbash followers saw them as holy guides. They kept that respect after Isma'il became shah in 1501.","whyNot":{"A":"The Safavids did the reverse. They made Shi'a Islam Persia's official faith.","B":"D'Alessandri ties the people's devotion to the shah's descent from 'Ali, not to taxes.","D":"Safavid armies did fight the Mughals over Kandahar, but battles do not explain why people treated the shah as holy."},"hint":"How did the Safavid family first gain followers, before they ruled Persia?","reasoning":"Continuity and Change"}],"exam":{"title":"Unit 3 Practice Exam: Land-Based Empires","timeMinutes":25,"questionCount":25,"directions":"Each set of questions refers to a source: a primary source, a historian's writing, an image, or data. For each question, choose the best answer. Use the source and your knowledge of world history from c. 1450 to c. 1750. There is no penalty for guessing. Some sources use historical labels or insulting descriptions of other peoples and religions; these words show the writers' views.","questions":[{"id":"U3-E01","set":"X1","topic":"3.1","lo":"A","skill":"1.B","difficulty":"medium","stem":"The passage best illustrates which of the following developments in the period c. 1450 to c. 1750?","options":{"A":"Rulers in South Asia depended on cannons and muskets bought from Portuguese traders.","B":"Armies in South Asia gave up mounted archers in favor of foot soldiers with guns.","C":"Rulers of land-based empires combined gunpowder weapons with cavalry to win new lands.","D":"War elephants allowed large armies to overpower smaller forces armed with guns."},"answer":"C","rationales":{"A":"Incorrect. Babur's gunner and guns came with him overland from Central Asia, and he copied an Ottoman way of linking carts. \"Firingi\" names a style of gun; the passage does not mention the Portuguese.","B":"Incorrect. Babur's mounted turning-parties and archers did much of the fighting. Guns were added to cavalry, not used instead of it.","C":"Correct. Babur's gunners fired from behind carts and shields while his horsemen surrounded the enemy and \"rained arrows\" on him.","D":"Incorrect. Babur reports that Ibrahim had about 1,000 elephants and a much larger army, yet lost in half a day."},"explanation":"Babur's win at Panipat in 1526 began the Mughal Empire. Like the Ottomans and Safavids, the Mughals used guns along with older strengths, such as skilled horsemen.","reasoning":"Causation"},{"id":"U3-E02","set":"X1","topic":"3.1","lo":"A","skill":"2.B","difficulty":"medium","stem":"Babur's comments about Ibrahim in the second paragraph were most likely meant to","options":{"A":"show that Ibrahim's army had already been weakened by Safavid attacks before the battle","B":"explain that Babur won because his own army was larger and better paid","C":"portray his rival as greedy and unfit to rule, making Babur's conquest seem justified","D":"argue that hired troops from Hindustan were more loyal than his own soldiers"},"answer":"C","rationales":{"A":"Incorrect. The passage says nothing about Safavid attacks. Babur blames Ibrahim's own greed.","B":"Incorrect. Babur stresses the enemy's size, about 100,000 men. He does not claim that his own army was larger.","C":"Correct. Babur says Ibrahim was \"ruled by avarice\" and would not share his treasure with his soldiers. This portrays his rival as a poor ruler and makes Babur's conquest seem justified.","D":"Incorrect. Babur does not compare the loyalty of different troops. He criticizes Ibrahim for not rewarding his soldiers."},"explanation":"Babur wrote his memoir to tell his own story. Showing his enemy as a greedy, careless ruler made his own victory look deserved, even blessed by God."},{"id":"U3-E03","set":"X1","topic":"3.4","lo":"D","skill":"5.A","difficulty":"hard","stem":"Babur's methods at Panipat were most similar to which of the following?","options":{"A":"The Ottoman defeat of Safavid horsemen at the Battle of Chaldiran in 1514","B":"The Safavid army's reliance on charges by Kizilbash cavalry in the early 1500s","C":"Ming China's use of the Great Wall to hold back Mongol horsemen","D":"The Songhai army's reliance on cavalry and archers in the 1500s"},"answer":"A","rationales":{"A":"Correct. At Chaldiran, Ottoman cannons and muskets fired from behind linked carts and broke the Safavid cavalry. This is the same \"Ottoman fashion\" Babur's gunner copied.","B":"Incorrect. The Kizilbash horsemen were like Ibrahim's side: a mounted force that faced guns. They lost at Chaldiran.","C":"Incorrect. The Great Wall was a fixed defense. Babur used guns, carts, and horsemen to attack and win a battle.","D":"Incorrect. Songhai's army fought with horsemen and arrows and had no guns. Babur combined guns, carts, and horsemen."},"explanation":"Military ideas spread among the Islamic empires of this period. Ottoman methods reached Babur's army, and the Mughals used them to build an empire in India.","reasoning":"Comparison"},{"id":"U3-E04","set":"X2","topic":"3.3","lo":"C","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Source 1 calls for ending the papacy, while Source 2 says councils should rule the Church instead of the pope.","B":"Source 1 challenges promises made for purchased pardons, while Source 2 upholds indulgences but condemns abuses.","C":"Source 1 approves of paying for indulgences to build churches, while Source 2 orders the Church to stop granting them.","D":"Source 1 is addressed to Catholic bishops, while Source 2 is addressed to the German princes."},"answer":"B","rationales":{"A":"Incorrect. Luther questions the pope's use of money but does not call for ending the papacy here. Trent does not place councils above the pope.","B":"Correct. Luther says those who think pardons make them \"sure of their own salvation\" will be damned. Trent says indulgences must be \"retained\" but orders \"all evil gains\" abolished.","C":"Incorrect. It is the reverse. Luther attacks building St. Peter's with poor believers' money, and Trent keeps indulgences.","D":"Incorrect. Neither source names these audiences. Luther wrote his theses for a debate at his university, and Trent's decree speaks to the whole Church."},"explanation":"Luther's attack on indulgences in 1517 started the Protestant Reformation. Years later, the Council of Trent answered the Protestants. It kept indulgences but tried to stop people from selling them for money.","reasoning":"Comparison"},{"id":"U3-E05","set":"X2","topic":"3.3","lo":"C","skill":"4.A","difficulty":"easy","stem":"Source 2 was written most directly in response to","options":{"A":"Protestant movements that rejected papal authority and many Catholic practices","B":"Spanish missionaries' protests against the forced labor of Indigenous peoples in America","C":"the Ottoman sultans' wars against the Habsburg rulers in central Europe","D":"the arrival of Jesuit missionaries in Japan and China"},"answer":"A","rationales":{"A":"Correct. Trent condemns those who call indulgences \"useless\" and complains that their name is \"blasphemed by heretics.\" Those critics were Protestants.","B":"Incorrect. Missionaries such as Las Casas did protest forced labor in the Americas, but that issue had nothing to do with indulgences.","C":"Incorrect. The Ottoman–Habsburg wars were a real threat to Catholic Europe, but this decree is about Church teaching on indulgences.","D":"Incorrect. Jesuits carried Catholic teaching to Asia, but this decree answers critics inside Europe."},"explanation":"The Council of Trent met from 1545 to 1563. It was the center of the Catholic Reformation, the Church's answer to the Protestant Reformation. It restated Catholic beliefs and set out reforms."},{"id":"U3-E06","set":"X2","topic":"3.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"The debate shown in the two sources contributed most directly to which of the following?","options":{"A":"the reunion of the Catholic and Orthodox churches under the leadership of the pope","B":"a lasting split in Western Christianity between Catholic and Protestant churches","C":"a sharp decline in Catholic missionary work outside Europe","D":"an end to religious wars in Europe by the middle of the 1500s"},"answer":"B","rationales":{"A":"Incorrect. The Catholic and Orthodox churches stayed separate. This debate was within Western Christianity.","B":"Correct. Trent restated the teachings that Protestants rejected, so the two sides did not reunite. Europe stayed divided into Catholic and Protestant lands.","C":"Incorrect. Catholic missions grew. Jesuits and other orders spread Catholicism in Asia and the Americas.","D":"Incorrect. Religious wars went on long after 1563, including the Thirty Years' War (1618–1648)."},"explanation":"Before 1517 most Western Europeans belonged to one church. After the Reformation, much of northern Europe became Protestant while southern Europe stayed Catholic, and both kept spreading their faith.","reasoning":"Causation"},{"id":"U3-E07","set":"X3","topic":"3.2","lo":"B","skill":"2.B","difficulty":"easy","stem":"The dragon designs on the emperor's robe and throne were most likely meant to","options":{"A":"show the Manchu clan symbols the emperor's family had used before conquering China","B":"honor the Buddhist monasteries that had supported the emperor's family","C":"record the emperor's conquest of the island of Taiwan","D":"link the emperor to long-standing Chinese symbols of imperial power"},"answer":"D","rationales":{"A":"Incorrect. The dragon was an old Chinese symbol of the emperor, used for many centuries before the Manchus.","B":"Incorrect. Nothing in the portrait points to Buddhist monasteries as the source of the emperor's power.","C":"Incorrect. The portrait shows no battle or place. Dragons stood for the emperor in general, not for one event.","D":"Correct. For many centuries the dragon had stood for the Chinese emperor. A ruler covered in dragons and seated on a dragon throne looked like a true Chinese emperor."},"explanation":"Rulers often used art to look powerful and rightful. Formal court portraits like this one showed the emperor on the dragon throne, wearing robes in colors and patterns reserved for the imperial family."},{"id":"U3-E08","set":"X3","topic":"3.2","lo":"B","skill":"4.A","difficulty":"medium","stem":"The portrait was produced in the context of","options":{"A":"a Ming government effort to end the Manchu threat along its northern border","B":"Manchu rulers' efforts to win the loyalty of China's Han Chinese majority","C":"the Revolt of the Three Feudatories, which ended Qing rule in southern China","D":"a Qing policy that kept Han Chinese out of government offices"},"answer":"B","rationales":{"A":"Incorrect. The Ming dynasty fell in 1644, before Kangxi became emperor in 1661. This is a Qing portrait.","B":"Correct. The Qing were Manchus from the northeast who took Beijing in 1644 and conquered the rest of China over the next decades. Kangxi presented himself as a proper Chinese emperor to win over the Han Chinese.","C":"Incorrect. That revolt by three Han Chinese generals (1673–1681) failed. Kangxi crushed it and kept control of the south.","D":"Incorrect. The Qing kept Han Chinese officials and the exam system. Many top offices were shared by a Manchu and a Han official."},"explanation":"The Qing rulers were Manchus, but most people they ruled were Han Chinese. To be accepted, the Qing kept the Confucian exams, honored Chinese customs, and used Chinese symbols of the emperor, while also keeping Manchu traditions."},{"id":"U3-E09","set":"X3","topic":"3.4","lo":"D","skill":"5.A","difficulty":"medium","stem":"The portrait's purpose is most similar to which of the following?","options":{"A":"Luther's use of printed pamphlets to win support for reforming the Church","B":"Shah Abbas's creation of a paid army loyal to the shah himself","C":"Jesuit missionaries' use of Western astronomy to win favor at the Qing court","D":"Mughal emperors' building of grand tombs and mosques such as the Taj Mahal"},"answer":"D","rationales":{"A":"Incorrect. Luther's pamphlets attacked the pope's power. They were not a ruler's art meant to show his right to rule.","B":"Incorrect. A paid army was a military way to build loyalty, not art or architecture.","C":"Incorrect. The Jesuits used science to gain a hearing for their faith, not to glorify the emperor.","D":"Correct. Like the portrait, the Taj Mahal and other Mughal monuments used art and buildings to display the ruler's glory and right to rule."},"explanation":"Many rulers used art and buildings to show they had the right to rule. Qing portraits, Mughal tombs and mosques, and the palace of Versailles all sent the same message: this ruler is great.","reasoning":"Comparison"},{"id":"U3-E10","set":"X4","topic":"3.2","lo":"B","skill":"1.B","difficulty":"easy","stem":"Lybyer's description best illustrates which of the following developments?","options":{"A":"Hereditary nobles gained control of the army and the provinces.","B":"Merchants bought government offices to raise their social status.","C":"Rulers trained military and government elites who owed their rise to the ruler.","D":"Religious scholars replaced military leaders as the chief officials of the state."},"answer":"C","rationales":{"A":"Incorrect. Lybyer says the system paid \"no regard for ancestry,\" so it did not rely on hereditary nobles.","B":"Incorrect. The recruits did not buy their posts. They were chosen and trained for their ability.","C":"Correct. Lybyer says the system took slaves and farm boys and made them generals, governors, and ministers. They owed their careers to the sultan.","D":"Incorrect. The system produced soldiers and generals as well as scholars, and the army stayed central to Ottoman power."},"explanation":"Through the devshirme, Ottoman officials forcibly took boys from Christian families, mostly in the Balkans. The boys were made Muslims and trained to be Janissaries or officials. With no noble families to back them, they depended on the sultan."},{"id":"U3-E11","set":"X4","topic":"3.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"Ottoman sultans used the system Lybyer describes mainly in order to","options":{"A":"convert the empire's Christian majority in the Balkans to Islam","B":"give conquered Balkan peoples a share in governing their home provinces","C":"reward old Turkish noble families with the top posts in the government","D":"limit the power of noble families and keep central control of the army"},"answer":"D","rationales":{"A":"Incorrect. The devshirme took selected boys. It was not a plan to convert all the empire's Christians.","B":"Incorrect. Recruits were taken \"forever from parents\" and served wherever the sultan sent them, not as leaders of their home communities.","C":"Incorrect. The system did the reverse. It gave top posts to trained slaves so that noble families would not control them.","D":"Correct. Lybyer says recruits were taken from their parents, had \"no certain hold on property,\" and had \"no definite promise\" for their children. They could not easily become a rival noble class."},"explanation":"Rulers in many empires worried about powerful nobles. The Ottoman sultans built a ruling class of men who owed their whole careers to the sultan, which kept power in his hands."},{"id":"U3-E12","set":"X4","topic":"3.2","lo":"B","skill":"5.B","difficulty":"hard","stem":"Which of the following changes in the late 1500s and 1600s weakened the system Lybyer describes?","options":{"A":"Sultans began choosing grand viziers mainly from old Turkish-born Muslim families.","B":"Sultans began hiring European mercenaries in place of the Janissaries.","C":"Janissaries were allowed to marry and enroll their sons in the corps.","D":"Most Balkan Christians converted, leaving few boys to recruit."},"answer":"C","rationales":{"A":"Incorrect. Men of many backgrounds still served as viziers. The bigger change was inside the Janissary corps.","B":"Incorrect. The Janissaries stayed at the core of the army until a sultan abolished them in 1826. The change came from inside the corps.","C":"Correct. Lybyer says members were not supposed to have families or pass anything to their children. Once Janissaries married and enrolled their sons, more places went to soldiers' families instead of to trained recruits.","D":"Incorrect. Most Balkan Christians kept their faith. The devshirme faded for other reasons."},"explanation":"Over the late 1500s and 1600s, many Janissaries married, ran businesses, and enrolled their sons, and other Muslim-born men joined too. The devshirme was used less and less after the mid-1600s. The corps grew larger, less disciplined, and harder for sultans to control.","reasoning":"Continuity and Change"},{"id":"U3-E13","set":"X5","topic":"3.3","lo":"C","skill":"1.B","difficulty":"easy","stem":"Shah Isma'il's policy described in the first paragraph is best understood as an effort to","options":{"A":"keep peace in Tabriz by tolerating both Sunni and Shi'a Muslims","B":"restore the authority of the caliphs over the whole Muslim world","C":"make Shi'a Islam the state faith and force Sunnis to accept it","D":"convert the Christian peoples of the Caucasus to Islam by force"},"answer":"C","rationales":{"A":"Incorrect. Isma'il refused to tolerate Sunnis. He threatened to \"leave not one of them alive.\"","B":"Incorrect. Isma'il ordered the public cursing of the first three caliphs. He did not try to restore their authority.","C":"Correct. Isma'il ordered that Shi'a Islam be \"the only tolerated creed\" and threatened death to anyone who refused.","D":"Incorrect. The passage is about the Muslims of Tabriz, most of whom were Sunni, not about Christians."},"explanation":"The Safavids made Shi'a Islam the state religion of Persia. This gave their new dynasty a strong identity and set Persia apart from its Sunni neighbors, the Ottomans and the Uzbeks. Iran remains mostly Shi'a today."},{"id":"U3-E14","set":"X5","topic":"3.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"The policies described in the passage contributed most directly to","options":{"A":"long Safavid–Ottoman wars that deepened the split between Sunni and Shi'a","B":"a Safavid alliance with the Uzbeks against the Ottoman Turks","C":"an Ottoman–Safavid alliance against the Portuguese traders in the Persian Gulf","D":"the return of most Persians to Sunni Islam soon after Isma'il's death"},"answer":"A","rationales":{"A":"Correct. Browne says relations with the Sunni Ottomans were \"uniformly hostile.\" The two empires fought on and off for more than a century, and religion made the rivalry more bitter.","B":"Incorrect. Browne says relations with the Sunni Uzbeks were also \"uniformly hostile.\"","C":"Incorrect. The Ottomans and Safavids were enemies. They did not ally against the Portuguese.","D":"Incorrect. Persia stayed Shi'a after Isma'il died in 1524."},"explanation":"Ottoman–Safavid wars began with the Battle of Chaldiran in 1514 and went on, off and on, until a peace treaty in 1639. Each side called the other an enemy of true Islam, and the fighting hardened the divide between Sunni and Shi'a Muslims.","reasoning":"Causation"},{"id":"U3-E15","set":"X5","topic":"3.3","lo":"C","skill":"2.B","difficulty":"medium","stem":"Selim's letter, described in the third paragraph, was most likely intended to","options":{"A":"invite Isma'il to join the Ottomans in a war against the Habsburgs in Europe","B":"propose a trade agreement for Persian silk","C":"offer to accept Isma'il as caliph in exchange for peace","D":"justify an Ottoman invasion by presenting it as a defense of Sunni Islam"},"answer":"D","rationales":{"A":"Incorrect. The letter threatens Isma'il. It does not invite him to be an ally.","B":"Incorrect. The letter is about religion and land, not trade.","C":"Incorrect. Selim saw himself as the defender of Sunni Islam and called Isma'il a heretic. He was not offering Isma'il any religious title.","D":"Correct. Selim calls Isma'il's beliefs \"heresies,\" demands that he stop cursing Abu Bakr and 'Umar, and threatens to invade. Religion gave Selim a reason for war."},"explanation":"Ottoman and Safavid rulers both used religion to rally support. Selim invaded a few months after this letter and defeated Isma'il at Chaldiran in August 1514."},{"id":"U3-E16","set":"X5","topic":"3.4","lo":"D","skill":"5.A","difficulty":"medium","stem":"Isma'il's religious policy differed most from that of the Mughal emperor Akbar, who","options":{"A":"required his subjects to follow Sunni law in worship and daily life","B":"welcomed teachers of many faiths and ended the jizya tax on non-Muslims","C":"forced his Hindu subjects to convert to Shi'a Islam or leave","D":"banned Sufi brotherhoods and their shrines from his empire"},"answer":"B","rationales":{"A":"Incorrect. Akbar did not force Sunni practice on his mostly Hindu subjects.","B":"Correct. Akbar held debates among Muslims, Hindus, Jains, Christians, and others, and he ended the jizya in 1564. Isma'il used force against Sunni Muslims who resisted.","C":"Incorrect. Akbar did not force conversion. Most of his subjects remained Hindu.","D":"Incorrect. Akbar respected Sufis. He walked to the shrine of a Sufi saint at Ajmer."},"explanation":"Rulers chose different ways to manage religious diversity. Isma'il used force to impose Shi'a Islam on Persia's Sunni Muslims. Akbar, who ruled a mostly Hindu land, chose tolerance to win the loyalty of his diverse subjects.","reasoning":"Comparison"},{"id":"U3-E17","set":"X6","topic":"3.1","lo":"A","skill":"3.A","difficulty":"hard","stem":"The data in the table best support which of the following claims?","options":{"A":"Lands taken from the Mamluks in 1516–1517 supplied over half the listed income.","B":"Anatolia and Greece, the empire's oldest lands, supplied over half the listed income.","C":"Upper Mesopotamia, taken from the Safavids after 1514, supplied more income than Syria.","D":"Syria provided more income than Anatolia and Greece."},"answer":"A","rationales":{"A":"Correct. Egypt and Syria, which Selim I took from the Mamluks in 1516–1517, together supplied 2,300,000 of the 3,750,000 ducats listed, more than 60 percent.","B":"Incorrect. Anatolia and Greece gave 1,300,000 of the 3,750,000 ducats listed, about 35 percent.","C":"Incorrect. Upper Mesopotamia gave 150,000 ducats, much less than Syria's 700,000.","D":"Incorrect. Syria gave 700,000 ducats, about half as much as Anatolia and Greece."},"explanation":"Egypt alone sent the sultan more than any other region listed. Its Nile farmland and trade made it very valuable. Conquest brought the Ottomans not only land but also large new revenues."},{"id":"U3-E18","set":"X6","topic":"3.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"Revenues like those in the table were used mainly to","options":{"A":"pay the sultan's salaried troops, such as the Janissaries, and his court","B":"pay regular cash salaries to cavalrymen serving under the timar system","C":"repay loans from Venetian and Genoese bankers","D":"pay tribute to the Habsburgs to keep peace on the Danube frontier"},"answer":"A","rationales":{"A":"Correct. The Janissaries and other troops of the sultan's household were paid in cash from the treasury, and the palace and court in Istanbul were costly too.","B":"Incorrect. Timar cavalrymen lived on the taxes from their own assigned lands, not on cash salaries from the treasury.","C":"Incorrect. The Ottoman state did not depend on loans from Italian bankers in this period.","D":"Incorrect. It was the reverse. After 1547 the Habsburgs paid the sultan a yearly tribute for their part of Hungary."},"explanation":"The Janissaries and other household troops were paid in cash, in peace and in war. A steady flow of taxes from rich provinces like Egypt let the sultan keep a large standing army."},{"id":"U3-E19","set":"X6","topic":"3.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"Which of the following was an Ottoman method of collecting revenues like those in the table?","options":{"A":"Depending on hereditary zamindars to gather the land revenue","B":"Selling the right to collect certain taxes to private bidders","C":"Combining taxes into one silver payment under the \"Single Whip\"","D":"Collecting tribute in furs from the forest peoples of the north"},"answer":"B","rationales":{"A":"Incorrect. Zamindars were local landholders who collected revenue in Mughal India.","B":"Correct. In tax farming, a bidder paid the state for the right to collect a tax and kept whatever he collected beyond that amount. The Ottomans used it widely.","C":"Incorrect. The Single Whip reform was a policy of Ming China.","D":"Incorrect. Fur tribute was a Russian method in Siberia, not an Ottoman one."},"explanation":"Empires needed reliable ways to collect taxes. The Ottomans used tax farming, the Mughals used zamindars, and the Ming collected taxes in silver. Each method helped pay for armies and officials."},{"id":"U3-E20","set":"X7","topic":"3.1","lo":"A","skill":"5.B","difficulty":"easy","stem":"The Moroccan victory described in the passage is best explained by","options":{"A":"the small size of the Songhai army compared with the invading Moroccan force","B":"the Songhai army's lack of horsemen to face the Moroccan cavalry","C":"a revolt by Timbuktu's scholars against the Songhai rulers","D":"the invaders' firearms and their army organized on the Ottoman model"},"answer":"D","rationales":{"A":"Incorrect. It was the reverse. Fewer than 4,000 Moroccans defeated 12,000 horsemen and 30,000 foot soldiers.","B":"Incorrect. Lugard says Songhai sent 12,000 horsemen, more than the whole Moroccan force.","C":"Incorrect. The passage says nothing about a revolt in Timbuktu before the battle.","D":"Correct. The Moroccans were \"well armed with muskets,\" which the Songhai armies lacked, and their army was \"reformed on the model of the Turks.\""},"explanation":"Like Babur in India, the Moroccan general won with a small army armed with guns. Here, guns and training helped a small force defeat a much larger one, though guns alone did not guarantee victory.","reasoning":"Causation"},{"id":"U3-E21","set":"X7","topic":"3.1","lo":"A","skill":"4.A","difficulty":"medium","stem":"The conflict described in the passage is best understood in the context of","options":{"A":"rivalries over control of trans-Saharan trade in goods such as salt and gold","B":"European competition for colonies and trading forts in the interior of West Africa","C":"the spread of the Sunni–Shi'a conflict into West Africa","D":"the Mali Empire's conquest of Songhai lands"},"answer":"A","rationales":{"A":"Correct. Morocco's \"cause of quarrel\" was the Taghaza salt mines, the main salt supply of the region. Morocco's sultan also wanted the gold that came from West Africa.","B":"Incorrect. In the 1500s Europeans traded on the coast. They did not yet compete for colonies inland.","C":"Incorrect. Both Morocco and Songhai were Sunni Muslim states. Their quarrel was over salt and trade.","D":"Incorrect. By the 1500s Mali was weak, and Songhai had taken over much of its land."},"explanation":"Songhai grew rich from the trade routes that crossed the Sahara, and Morocco's sultan wanted those riches. After the conquest, the Songhai Empire broke apart into smaller states."},{"id":"U3-E22","set":"X7","topic":"3.1","lo":"A","skill":"2.C","difficulty":"medium","stem":"Which of the following is a limitation of the passage as evidence about the Songhai defeat?","options":{"A":"The writer lived 300 years later and saw West Africa through a British imperial lens.","B":"The writer gives the size of the Moroccan force but not of the Songhai army.","C":"The writer does not explain why Morocco and Songhai went to war.","D":"The writer says little about how the Moroccan army was armed and trained."},"answer":"A","rationales":{"A":"Correct. Shaw wrote in 1905, while her husband governed Northern Nigeria for Britain. Her phrase \"rich and supine populations\" and her image of wolves among \"flocks of sheep\" show a colonial view of Africans as weak.","B":"Incorrect. Shaw gives both: fewer than 4,000 Moroccans against 12,000 horsemen and 30,000 foot soldiers.","C":"Incorrect. Shaw names the cause: the quarrel over the salt mines of Tegazza.","D":"Incorrect. Shaw describes the Moroccans' muskets, discipline, and army \"reformed on the model of the Turks.\""},"explanation":"A limitation is a reason to use a source with care. Shaw's account is useful, but her colonial point of view shaped how she described Africans. She also got the date of the battle wrong. Historians compare her account with the Timbuktu histories themselves."},{"id":"U3-E23","set":"X8","topic":"3.2","lo":"B","skill":"3.A","difficulty":"medium","stem":"Bernier's main argument in the passage is that","options":{"A":"the Mughal emperors were too weak to collect taxes from their distant provinces","B":"peasants in India were better off than peasants in France","C":"giving grant holders more power over peasants would raise the king's income","D":"temporary revenue grants led officials to squeeze peasants and harm farming"},"answer":"D","rationales":{"A":"Incorrect. Bernier says the grant holders had power \"almost absolute\" over peasants. The problem was harsh collection, not weak collection.","B":"Incorrect. Bernier says French peasants had protectors, such as parliaments and judges, while Indian peasants had none.","C":"Incorrect. Bernier argues the opposite. He says the king would gain if private property in land were recognized.","D":"Correct. Bernier says the grant holders \"may be deprived of it in a single moment,\" so they \"draw from the soil all the money we can, though the peasant should starve.\""},"explanation":"Bernier believed that people work hard only when they can keep what they earn. Because grant holders could lose their grants at any moment, they took all they could. Historians check his claim that the emperor owned all the land against Mughal records."},{"id":"U3-E24","set":"X8","topic":"3.2","lo":"B","skill":"3.D","difficulty":"hard","stem":"Which of the following kinds of evidence would most directly challenge Bernier's claim that there was no private property in land in Mughal India?","options":{"A":"Records showing that the emperor assigned provincial tax income to officers","B":"Records showing that local families inherited and sold rights to land","C":"Reports that revenue collectors made heavy demands on farmers","D":"Orders moving officers from one land grant to another after a few years"},"answer":"B","rationales":{"A":"Incorrect. Assigning tax income to officers fits Bernier's description. It does not show who owned the land.","B":"Correct. Rights to land that families inherited and sold would be private property. Such records would directly challenge Bernier's claim.","C":"Incorrect. Heavy demands show a burden on farmers, which Bernier also describes. They do not show who owned the land.","D":"Incorrect. Frequent transfers show that grants were temporary, which agrees with Bernier."},"explanation":"Bernier said the king owned all the land. Historians have found records of zamindars and other local families who inherited, bought, and sold rights to land in Mughal India. Such evidence shows that Bernier's claim was too broad."},{"id":"U3-E25","set":"X8","topic":"3.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"Mughal emperors used the land grants described in the first paragraph mainly in order to","options":{"A":"turn the empire's nobles into landowners who could pass their grants to their sons","B":"pay the emperor's officers in cash from a central treasury instead of in land revenue","C":"keep officers dependent on the emperor by giving them grants that could be taken back","D":"let peasants buy the land they farmed in return for lower taxes"},"answer":"C","rationales":{"A":"Incorrect. Most grants were not owned or passed down. Grant holders feared their work would benefit \"neither ourselves nor our children.\"","B":"Incorrect. The grants were given \"as an equivalent for their pay,\" in place of cash salaries.","C":"Correct. Bernier says the grants were given \"in lieu of their salary,\" and holders \"may be deprived of it in a single moment.\" Grants that could be moved or taken away kept officers loyal to the emperor.","D":"Incorrect. Bernier says the king was \"proprietor of the land\" and that private property was not recognized."},"explanation":"Mughal emperors paid their officers with jagirs, the right to collect the revenue of an area. Most jagirs were moved every few years and were not passed down to sons. This kept nobles from building local power and tied them to the emperor."}]}},"4":{"unit":4,"title":"Transoceanic Interconnections","period":"c. 1450–1750","examWeighting":"12–15%","blurb":"Ships, silver, the Columbian Exchange, maritime empires, resistance, and new social hierarchies.","version":"2026-11-07a","schemaNotes":"Every question has a set id; data.stimuli[set] holds its source (passage | pair | image | table | bar). Options A-D. LO letters follow the Fall 2026 AP World CED (Unit 4: Learning Objectives A-N).","topics":[{"id":"4.1","name":"Technological Innovations","lo":["A"]},{"id":"4.2","name":"Exploration: Causes and Events","lo":["B","C"]},{"id":"4.3","name":"Columbian Exchange","lo":["D"]},{"id":"4.4","name":"Maritime Empires Established","lo":["E","F","G"]},{"id":"4.5","name":"Maritime Empires Maintained and Developed","lo":["H","I","J","K"]},{"id":"4.6","name":"Internal and External Challenges to State Power","lo":["L"]},{"id":"4.7","name":"Changing Social Hierarchies","lo":["M"]},{"id":"4.8","name":"Continuity and Change, 1450–1750","lo":["N"]}],"stimuli":{"X1":{"type":"passage","paragraphs":["… [Prince Henry] had also a wish to know the land that lay beyond the isles of Canary and that Cape called Bojador, for up to his time … neither by writings, nor by the memory of man, was known with any certainty the nature of the land beyond that Cape. … And this was the first reason of his action.","The second reason was that if there chanced to be in those lands some population of Christians, or some havens into which it would be possible to sail without peril, many kinds of merchandise might be brought to this realm, which would find a ready market … because no other people of these parts traded with them … and also the products of this realm might be taken there, which traffic would bring great profit to our countrymen.","The third reason was that, as it was said that the power of the Moors in that land of Africa was very much greater than was commonly supposed … the said Lord Infant* exerted himself to cause this to be fully discovered, and to make it known how far the power of those infidels extended.","The fourth reason was because during the one and thirty years that he had warred against the Moors, he had never found a Christian king, nor a lord outside this land, who for the love of our Lord Jesus Christ would aid him in the said war. Therefore he sought to know if there were in those parts any Christian princes … who would aid him against those enemies of the faith.","The fifth reason was his great desire to make increase in the faith of our Lord Jesus Christ and to bring to him all the souls that should be saved."],"attribution":"Gomes Eanes de Zurara, royal chronicler of Portugal, Chronicle of the Discovery and Conquest of Guinea, 1453","translation":"Translated by C. Raymond Beazley and Edgar Prestage (1896); adapted","footnotes":[{"mark":"*","text":"Prince Henry of Portugal (1394–1460), son of King João I, who sponsored Portuguese voyages down the West African coast"}],"glossary":[{"t":"Cape Bojador","d":"a cape on the northwest coast of Africa that Portuguese ships first sailed past in 1434"},{"t":"havens","d":"safe harbors"},{"t":"Moors / infidels","d":"Zurara's words for Muslims of North Africa"},{"t":"realm","d":"kingdom (here, Portugal)"},{"t":"traffic","d":"trade"}]},"X2":{"type":"pair","items":[{"label":"Source 1","paragraphs":["… Of three millions of persons which lived in Hispaniola itself, there is at present but the inconsiderable remnant of scarce three hundred. …","Now the ultimate end and scope that incited the Spaniards to … the desolation of this people was gold only, that thereby growing rich in a short time, they might arrive at once at such degrees and dignities as were in no ways consistent with their persons. …","[The Spaniards] divided among themselves the young men, women, and children … one obtained thirty, another forty, to this man one hundred were given … upon this pretense, and with this condition, that he should see them instructed in the Catholic religion. … They sent the men to the mines to dig and bring away the gold, which is an intolerable labor; but the women they made use of to till the ground. … The men died in mines, hunger-starved and oppressed with labor, and the women perished in the fields … Thus an infinite number of inhabitants that formerly peopled this island … dwindled away to nothing."],"attribution":"Bartolomé de las Casas, Spanish Dominican friar, A Brief Account of the Destruction of the Indies, written 1542 for King Charles I of Spain","translation":"From an English translation published in London in 1689 under the title Popery* Truly Displayed in Its Bloody Colours; spelling modernized and adapted","footnotes":[{"mark":"*","text":"\"Popery\" was an insulting word that English Protestants used for the Roman Catholic Church."}],"glossary":[{"t":"Hispaniola","d":"the Caribbean island that today holds Haiti and the Dominican Republic"},{"t":"remnant","d":"a small part that is left"},{"t":"pretense","d":"a false reason given to cover the real one"}]},{"label":"Source 2","paragraphs":["The rapid melting away of the population of the West Indies during the first quarter of a century of the Spanish rule … is the most familiar instance of the kind, through the impassioned descriptions of Las Casas, which were translated into the principal languages of Europe; and, as a consequence, it is generally believed that the Spaniards we
