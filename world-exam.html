":"2.3","lo":"F","skill":"2.A","difficulty":"medium","stem":"Abd al-Razzaq's statement that Calicut \"is inhabited by Infidels, and situated on a hostile shore\" most likely reflects","options":{"A":"an attack on his ship by pirates who sailed out of Calicut","B":"his point of view as a Muslim envoy visiting a land with a Hindu ruler","C":"the wars that Calicut's rulers were fighting against the Ming fleets of Zheng He","D":"his warning that Calicut's officials cheated foreign merchants"},"answer":"B","rationales":{"A":"Incorrect. He says pirates \"do not dare to attack the vessels of Calicut.\" He describes no attack on himself.","B":"Correct. Abd al-Razzaq was a Muslim official from Persia. To him a land ruled by non-Muslims was \"hostile,\" even though he praises its safety and justice.","C":"Incorrect. Zheng He's fleets visited Calicut peacefully, and the passage mentions no war.","D":"Incorrect. He says the opposite: \"Security and justice are so firmly established in this city.\""},"explanation":"Abd al-Razzaq served a Muslim ruler and saw the world through his faith. He calls Calicut's people \"Infidels,\" yet he still admires how safely trade was run there."},{"id":"U2-E17","set":"X6","topic":"2.6","lo":"K","skill":"3.A","difficulty":"easy","stem":"The data in the chart best support which conclusion?","options":{"A":"Pay for threshing rose in each of the five regions shown.","B":"Pay for threshing rose the most in the Western Counties.","C":"Pay for threshing fell in the Southern Counties.","D":"Pay for threshing rose by about the same amount in each region."},"answer":"A","rationales":{"A":"Correct. Each bar shows a rise, from 37 percent to 73 percent.","B":"Incorrect. The Western Counties had the smallest rise, 37 percent. The Midland Counties had the largest, 73 percent.","C":"Incorrect. The Southern Counties show a rise of 48 percent, not a fall.","D":"Incorrect. The rises range from 37 to 73 percent. The largest is about twice the smallest."},"explanation":"Rogers's estimates show higher threshing rates in every region from 1350 to 1400 than before 1348. The size of the rise differed from place to place."},{"id":"U2-E18","set":"X6","topic":"2.6","lo":"K","skill":"5.B","difficulty":"medium","stem":"The changes shown in the chart were most likely caused by","options":{"A":"new threshing machines that made each worker's labor worth more","B":"new laws that required English landowners to raise the wages they paid workers","C":"a shortage of workers after the plague killed a large share of the population","D":"a sharp rise in England's population in the years after 1348"},"answer":"C","rationales":{"A":"Incorrect. Threshing was still done by hand with flails. Machines for threshing came centuries later.","B":"Incorrect. The Statute of Labourers (1351) tried to hold wages at the old rates, and it largely failed.","C":"Correct. The Black Death reached England in 1348. With fewer workers left, those who survived could demand more pay.","D":"Incorrect. England's population fell sharply after 1348. It did not rise."},"explanation":"The plague killed perhaps a third or more of England's people. Landowners still needed crops harvested and grain threshed, so they had to pay the fewer workers who were left much more.","reasoning":"Causation"},{"id":"U2-E19","set":"X6","topic":"2.6","lo":"K","skill":"5.B","difficulty":"medium","stem":"The trend shown in the chart most directly contributed to which long-term change in England?","options":{"A":"A gradual weakening of serfdom as peasants won better terms","B":"A lasting increase in the labor services peasants owed to lords","C":"A shift of English farmland from sheep raising to growing grain","D":"Royal laws that kept wages at their pre-plague levels for the long term"},"answer":"A","rationales":{"A":"Correct. With workers scarce, many lords lowered rents and let peasants pay money instead of labor services so they would not leave.","B":"Incorrect. Some lords tried to hold peasants more tightly at first, but over time labor services shrank and serfdom grew weaker.","C":"Incorrect. With fewer workers, many landowners did the opposite. They turned grain fields into pasture for sheep, which needed less labor.","D":"Incorrect. The Statute of Labourers tried to hold wages down, but wages stayed higher, as the chart shows."},"explanation":"Scarce labor gave peasants more bargaining power. Lords and the king first tried to hold down wages and keep peasants in place. Over time, many lords accepted money rent instead of labor, and serfdom faded in England during the 1400s.","reasoning":"Causation"},{"id":"U2-E20","set":"X7","topic":"2.5","lo":"J","skill":"3.A","difficulty":"medium","stem":"The authors' main argument in the passage is that","options":{"A":"European universities quickly adopted the new numerals soon after Leonardo published his book","B":"Leonardo invented a new number system to help the merchants of Pisa","C":"printing was the main reason the new numerals spread through Europe","D":"trade contacts in North Africa and the Mediterranean helped bring the numerals to Europe"},"answer":"D","rationales":{"A":"Incorrect. The authors say the book was too new for the universities, which did not like change.","B":"Incorrect. Leonardo did not invent the numerals. He says he learned the system \"of the Hindus.\"","C":"Incorrect. The authors say this was about 250 years before printing came to Europe, so printing could not have spread the numerals then.","D":"Correct. Leonardo's father worked for merchants in a North African port. Leonardo learned the numerals there and on trips to trading cities."},"explanation":"Leonardo grew up in a North African trading port and traveled to merchant cities around the Mediterranean. There he learned the Hindu-Arabic numerals and brought them back to Italy."},{"id":"U2-E21","set":"X7","topic":"2.5","lo":"J","skill":"3.D","difficulty":"hard","stem":"Which additional evidence would best help a historian find out how widely Italian merchants used the new numerals in the 1200s?","options":{"A":"Copies of Leonardo's book that once belonged to merchants in Pisa","B":"Account books kept by merchants in several Italian cities","C":"Maps of the routes merchants took between Italy and North Africa","D":"Laws that set which goods merchants could sell in Florence's markets"},"answer":"B","rationales":{"A":"Incorrect. A copy owned by merchants in Pisa shows that some merchants had the book. It does not show how widely merchants used the numerals in their work.","B":"Correct. Account books show the numbers merchants actually wrote in their work. Books from several cities would show how widely the numerals were used.","C":"Incorrect. Maps show where merchants traveled, not which numbers they wrote.","D":"Incorrect. Rules about which goods could be sold say nothing about which numbers merchants wrote."},"explanation":"To learn how merchants worked, a historian should look at what merchants themselves wrote. Their account books would show whether they used the new numerals, and books from several cities would show how far the practice had spread."},{"id":"U2-E22","set":"X7","topic":"2.5","lo":"J","skill":"3.B","difficulty":"medium","stem":"Which evidence from the passage best shows that some Europeans resisted using the new numerals?","options":{"A":"Florence's bankers were forbidden to use them in 1299.","B":"Knowledge spread slowly in the years before printing reached Europe.","C":"Leonardo counted other number systems almost as errors.","D":"The numerals made much headway from about 1275 on."},"answer":"A","rationales":{"A":"Correct. A ban almost 100 years after Leonardo's book shows that some people still distrusted the numerals.","B":"Incorrect. This describes how hard it was to copy and share books. It does not show people refusing to use the numerals.","C":"Incorrect. Here Leonardo rejects other number systems in favor of the Hindu numerals. That is support for the numerals, not resistance.","D":"Incorrect. Making headway means more people were using the numerals. It does not show resistance to them."},"explanation":"Leonardo's book appeared in 1202. Yet in 1299, Florence banned its bankers from using the new numerals in their account books. The ban shows resistance in record keeping, even though the authors say the numerals were making headway by then."},{"id":"U2-E23","set":"X8","topic":"2.1","lo":"A","skill":"3.A","difficulty":"easy","stem":"Clavijo's description best supports which claim about Samarkand around 1404?","options":{"A":"It drew goods mainly from China, India, and the steppe.","B":"Its markets were filled with goods made in western Europe.","C":"Its rulers had cut off trade with China after Mongol rule ended.","D":"Its wealth came from silver mines near the city."},"answer":"A","rationales":{"A":"Correct. Clavijo lists silk and musk from Cathay, spices from India, and leather and linen from Russia and Tartary.","B":"Incorrect. Clavijo names Cathay, India, Russia, and Tartary. He does not say European goods filled the markets.","C":"Incorrect. A caravan of 800 camels had just arrived from China.","D":"Incorrect. Clavijo stresses trade and crafts. He does not mention silver mines."},"explanation":"Samarkand sat on the Silk Roads between China, India, Persia, and the steppe. Timur made it richer by encouraging trade and by forcing captured craftsmen to move there."},{"id":"U2-E24","set":"X8","topic":"2.2","lo":"D","skill":"5.A","difficulty":"medium","stem":"Timur's practice of moving skilled workers to Samarkand, described in the first paragraph, was most similar to the practice of","options":{"A":"Ming emperors who sent fleets to bring foreign rulers into their tribute system","B":"Mali's rulers who welcomed Muslim scholars and builders to their courts","C":"Mongol khans who moved captured craftsmen to Karakorum and other capitals","D":"Abbasid caliphs who paid scholars to translate Greek works in Baghdad"},"answer":"C","rationales":{"A":"Incorrect. The Ming fleets used gifts and force to win tribute from foreign rulers. They did not move captured workers to China.","B":"Incorrect. Mali's rulers invited scholars and builders, who came by choice and were paid. Timur took his craftsmen by force.","C":"Correct. The Mongol khans also took skilled captives to work in their capitals. Some came from China and some from eastern Europe.","D":"Incorrect. The Abbasids paid scholars to translate books. That supported learning, but it did not move captured workers."},"explanation":"Timur, who claimed ties to Chinggis Khan's family, followed a Mongol habit. Conquerors carried off the best craftsmen by force to build up their own cities.","reasoning":"Comparison"},{"id":"U2-E25","set":"X8","topic":"2.1","lo":"A","skill":"5.A","difficulty":"hard","stem":"The last paragraph of the passage best supports which conclusion about the decades after the Mongol Empire broke apart?","options":{"A":"Overland trade between China and Central Asia continued under new rulers.","B":"Sea trade had replaced the overland routes between China and Central Asia.","C":"The Ming rulers of China had closed the country's borders to caravans.","D":"Caravans from China now traveled straight through to the Black Sea ports."},"answer":"A","rationales":{"A":"Correct. In 1404, decades after Mongol rule in China ended, a caravan of eight hundred camels arrived in Samarkand from China.","B":"Incorrect. Sea trade grew, but the caravan of eight hundred camels shows that overland trade with China went on.","C":"Incorrect. The Ming limited some foreign contacts, but a caravan bringing goods from China had just reached Samarkand.","D":"Incorrect. Clavijo says the caravan came to Samarkand. He says nothing about caravans going on to the Black Sea."},"explanation":"The Mongol Empire had split apart, and the Ming had ruled China since 1368. Yet caravans still crossed Central Asia. Trade on the Silk Roads changed and sometimes slowed, but it did not stop.","reasoning":"Continuity and Change"}]}},"3":{"unit":3,"title":"Land-Based Empires","period":"c. 1450–1750","examWeighting":"12–15%","blurb":"Gunpowder empires (Ottoman, Safavid, Mughal), Qing China, Russia, Songhai, and Europe: expansion, ways of ruling, and religious change.","version":"2026-11-07a","schemaNotes":"Every question has a set id; data.stimuli[set] holds its source (passage | pair | image | table | bar). Options A-D. LO letters follow the Fall 2026 AP World CED (Unit 3: Learning Objectives A-D).","topics":[{"id":"3.1","name":"Empires Expand","lo":["A"]},{"id":"3.2","name":"Empires: Administration","lo":["B"]},{"id":"3.3","name":"Empires: Belief Systems","lo":["C"]},{"id":"3.4","name":"Comparison in Land-Based Empires","lo":["D"]}],"stimuli":{"X1":{"type":"passage","paragraphs":["At our next camp it was ordered that every man in the army should collect carts, each one according to his circumstances. Seven hundred carts … were brought in. The order given to Ustad 'Ali-quli* was that these carts should be joined together in Ottoman fashion, but using ropes of raw hide instead of chains, and that between every two carts 5 or 6 mantelets should be fixed, behind which the matchlockmen were to stand to fire. …","People estimated the army opposing us at 100,000 men; Ibrahim's elephants and those of his amirs were said to be about 1000. In his hands was the treasure of two forbears. … Ibrahim could neither content his braves, nor share out his treasure. How should he content his braves when he was ruled by avarice and had a craving insatiable to pile coin on coin? …","… From that same position [in front of the centre] Ustad 'Ali-quli made good discharge of firingi shots; Mustafa the commissary for his part made excellent discharge of zarb-zan shots from the left hand of the centre. Our right, left, centre and turning-parties having surrounded the enemy, rained arrows down on him and fought ungrudgingly. … By God's mercy and kindness, this difficult affair was made easy for us! In one half-day, that armed mass was laid upon the earth."],"attribution":"Babur, ruler of Kabul who invaded northern India, memoir describing the Battle of Panipat against Ibrahim Lodi, sultan of Delhi, April 1526","translation":"Translated from the Turki by Annette S. Beveridge, The Babur-nama in English (1922 edition); adapted","footnotes":[{"mark":"*","text":"Babur's master gunner"}],"glossary":[{"t":"mantelets","d":"movable wooden shields"},{"t":"matchlockmen","d":"soldiers armed with matchlocks, an early kind of musket"},{"t":"amirs","d":"nobles and army commanders"},{"t":"forbears","d":"ancestors (here, Ibrahim's father and grandfather)"},{"t":"braves","d":"soldiers"},{"t":"avarice","d":"greed"},{"t":"firingi, zarb-zan","d":"two kinds of small cannon (firingi means \"Frankish,\" that is, European-style)"},{"t":"commissary","d":"an officer in charge of supplies"},{"t":"turning-parties","d":"groups of horsemen sent around the sides of the enemy army"}]},"X2":{"type":"pair","items":[{"label":"Source 1","paragraphs":["27. They preach man, who say that the soul flies out of purgatory as soon as the money thrown into the chest rattles.","28. It is certain that, when the money rattles in the chest, avarice and gain may be increased, but the suffrage of the Church depends on the will of God alone. …","32. Those who believe that, through letters of pardon, they are made sure of their own salvation, will be eternally damned along with their teachers. …","36. Every Christian who feels true compunction has of right plenary remission of pain and guilt, even without letters of pardon. …","43. Christians should be taught that he who gives to a poor man, or lends to a needy man, does better than if he bought pardons. …","86. Again; why does not the Pope, whose riches are at this day more ample than those of the wealthiest of the wealthy, build the one Basilica of St. Peter with his own money, rather than with that of poor believers?"],"attribution":"Martin Luther, German monk and professor of theology, the Ninety-Five Theses, Wittenberg, 1517","translation":"Translated by Henry Wace and C. A. Buchheim, First Principles of the Reformation (1883); adapted","glossary":[{"t":"preach man","d":"teach human ideas instead of God's word"},{"t":"purgatory","d":"in Catholic teaching, a place where souls are cleansed of sin before entering heaven"},{"t":"suffrage","d":"here, the Church's prayers and help for souls"},{"t":"letters of pardon","d":"written indulgences, documents that promised to reduce punishment for sins"},{"t":"compunction","d":"sorrow for one's sins"},{"t":"plenary remission","d":"full release"},{"t":"pain","d":"here, punishment for sin"}]},{"label":"Source 2","paragraphs":["Whereas the power of conferring Indulgences was granted by Christ to the Church; and she has, even in the most ancient times, used the said power, delivered unto her of God; the sacred holy Synod teaches, and enjoins, that the use of Indulgences, for the Christian people most salutary, and approved of by the authority of sacred Councils, is to be retained in the Church; and It condemns with anathema those who either assert, that they are useless; or who deny that there is in the Church the power of granting them.","In granting them, however, It desires that, in accordance with the ancient and approved custom in the Church, moderation be observed; lest, by excessive facility, ecclesiastical discipline be enervated. And being desirous that the abuses which have crept therein, and by occasion of which this honourable name of Indulgences is blasphemed by heretics, be amended and corrected. It ordains generally by this decree, that all evil gains for the obtaining thereof, … be wholly abolished."],"attribution":"Council of Trent, a meeting of Catholic bishops called by the pope, Decree concerning Indulgences, December 1563","translation":"Translated by J. Waterworth, The Canons and Decrees of the Council of Trent (1848); adapted","glossary":[{"t":"Synod","d":"a council of church leaders"},{"t":"enjoins","d":"orders"},{"t":"salutary","d":"helpful; good for the soul"},{"t":"anathema","d":"a formal curse that cuts a person off from the Church"},{"t":"excessive facility","d":"granting them too easily"},{"t":"ecclesiastical discipline be enervated","d":"Church rules be weakened"},{"t":"heretics","d":"people the Church judged to hold false beliefs"},{"t":"evil gains","d":"dishonest profits"}]}]},"X3":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Portrait_of_the_Kangxi_Emperor_in_Court_Dress.jpg/960px-Portrait_of_the_Kangxi_Emperor_in_Court_Dress.jpg","width":960,"height":1519,"alt":"A painted portrait of an older man seated on a large carved throne, wearing a yellow robe covered with embroidered dragons and a red hat with a gold ornament.","caption":"An older man sits facing straight ahead on a wide throne carved with dragons. He wears a yellow robe embroidered with dragons, clouds, and waves, a long necklace of red beads with a few blue and green beads, and a red hat topped with a tall ornament of gold and pearls. The throne stands on a raised platform above a floor covered with patterned carpets.","attribution":"Unknown Qing court painter, Portrait of the Kangxi Emperor in Court Dress, hanging scroll, color on silk, painted late in the emperor's reign (he ruled 1661–1722)","credit":"Palace Museum, Beijing. Public domain image via Wikimedia Commons.","description":"A tall hanging scroll on a plain golden-brown background. An older man with a thin mustache and short beard sits upright, facing the viewer. One hand rests on his knee, and the other holds the bead necklace at his waist. His long yellow robe and wide collar are covered with embroidered dragons, swirling clouds, and waves at the hem. He wears a long necklace of mostly red beads and a round red hat topped with a tall ornament of gold and pearls. Behind and beside him rises a carved golden throne decorated with dragon heads. The throne sits on a stepped platform covered with richly patterned carpets.","glossary":[{"t":"court dress","d":"formal robes worn for ceremonies at the emperor's court"},{"t":"hanging scroll","d":"a painting on silk or paper, mounted so that it can be rolled up or hung on a wall"}]},"X4":{"type":"passage","paragraphs":["Perhaps no more daring experiment has been tried on a large scale upon the face of the earth than that embodied in the Ottoman Ruling Institution. … The Ottoman system deliberately took slaves and made them ministers of state; it took boys from the sheep-run and the plow-tail and made them courtiers and the husbands of princesses; it took young men whose ancestors had borne the Christian name for centuries, and made them rulers in the greatest of Mohammedan states, and soldiers and generals in invincible armies whose chief joy was to beat down the Cross and elevate the Crescent. It never asked its novices, \"Who was your father?\" or \"What do you know?\" or even \"Can you speak our tongue?\"; but it studied their faces and their frames and said, \"You shall be a soldier, and if you show yourself worthy, a general,\" or, \"You shall be a scholar and a gentleman, and if the ability lies in you, a governor and a prime minister.\"","Grandly disregarding that fabric of fundamental customs which is called \"human nature,\" and those religious and social prejudices which are thought to be almost as deep as life itself, the Ottoman system took children forever from parents, discouraged family cares among its members through their most active years, allowed them no certain hold on property, gave them no definite promise that their sons and daughters would profit by their success and sacrifice, raised and lowered them with no regard for ancestry or previous distinction, taught them a strange law, ethics, and religion, and ever kept them conscious of a sword raised above their heads which might put an end at any moment to a brilliant career along a matchless path of human glory."],"attribution":"Albert Howe Lybyer, American historian, The Government of the Ottoman Empire in the Time of Suleiman the Magnificent, published in 1913; Lybyer's dramatic wording reflects his own point of view","translation":"Adapted","glossary":[{"t":"Ruling Institution","d":"Lybyer's name for the sultan's household of servants who ran the army and the government"},{"t":"sheep-run, plow-tail","d":"a sheep pasture and the handle of a plow; that is, poor farm families"},{"t":"Mohammedan","d":"an old word for Muslim"},{"t":"the Cross, the Crescent","d":"symbols of Christianity and of Islam"},{"t":"novices","d":"beginners in training"},{"t":"frames","d":"bodies"},{"t":"prejudices","d":"fixed opinions held without good reason"}]},"X5":{"type":"passage","paragraphs":["… Shah Isma'il resolved that, with his assumption of the kingly rank, the Shi'a faith should become not merely the State religion but the only tolerated creed. This decision caused anxiety even to some of the Shi'a divines of Tabriz, who, on the night preceding Isma'il's coronation, represented to him that of the two or three hundred thousand inhabitants of that city at least two-thirds were Sunnis; that the Shi'a formula had not been publicly uttered from the pulpit since the time of the Imams themselves; and that if the majority of the people refused to accept a Shi'a ruler, it would be difficult to deal with the situation which would then arise. To this Shah Isma'il replied, \"I am committed to this action; God and the Immaculate Imams are with me, and I fear no one; by God's help, if the people utter one word of protest, I will draw the sword and leave not one of them alive.\" Nor did he content himself with glorifying 'Ali and his descendants, but ordained the public cursing of the first three Caliphs of the Sunnis, Abu Bakr, 'Umar and 'Uthman, and that all who heard the cursing should respond \"May it be more, not less!\" … or suffer death in case of refusal.","… [Isma'il's] foreign relations … were chiefly with three Powers, … the Timurids …; the formidable Uzbeks of Transoxiana; and the Ottoman Turks. With the last two, rigid Sunnis in both cases, the relations of Persia were, and continued to be, uniformly hostile. …","… [A letter] from Sultan Salim to Shah Isma'il, … dated … April, 1514 … , written in the most arrogant and offensive tone, calls on Isma'il to repent of his heresies and evil practices, especially the cursing of \"the two Shaykhs\" (Abu Bakr and 'Umar), and threatens, should he continue obdurate, to invade and wrest from him \"the lands which he has usurped by violence.\""],"attribution":"Edward G. Browne, British historian of Persia, A History of Persian Literature in Modern Times (A.D. 1500–1924), published in 1924, based on Persian and Ottoman chronicles and letters","translation":"Adapted","glossary":[{"t":"Shah Isma'il","d":"founder of the Safavid dynasty, crowned shah of Persia (Iran) at Tabriz in 1501"},{"t":"creed","d":"set of religious beliefs"},{"t":"divines","d":"religious scholars"},{"t":"represented to him","d":"warned him"},{"t":"formula","d":"fixed words used in prayer"},{"t":"the Imams","d":"early leaders from 'Ali's family, honored by Shi'a Muslims"},{"t":"Caliphs","d":"leaders of the Muslim community after the death of Muhammad"},{"t":"Uzbeks of Transoxiana","d":"a Turkic people who ruled Central Asia around Bukhara and Samarkand"},{"t":"Sultan Salim","d":"Selim I, Ottoman sultan from 1512 to 1520"},{"t":"obdurate","d":"stubborn"},{"t":"usurped","d":"taken without any right"}]},"X6":{"type":"table","title":"Estimated Yearly Income of the Ottoman Sultan from Kharaj (Tribute), Selected Regions, 1530s","columns":["Region","Ducats per year"],"rows":[["Egypt","1,600,000"],["Anatolia and Greece","1,300,000"],["Syria","700,000"],["Upper Mesopotamia (mostly today's southeastern Turkey)","150,000"]],"text":"The estimate comes from a pamphlet by Junis Bey, chief interpreter at the Ottoman court, which also reports the views of Alvise Gritti, a Venetian merchant in Istanbul. Lybyer dated it to between 1530 and 1537, most likely 1533. He judged it the lowest estimate of the sultan's income and probably the most accurate for the regions it covers. Kharaj here means the tax or tribute each region sent to the sultan; Lybyer defines kharaj as a tax or tribute, in money or in goods, on lands held by non-Muslims. A ducat was a gold coin. Baghdad, taken by the Ottomans in 1534, is not listed. Only regions are shown; a smaller amount from other sources is left out. The table shows only income that reached the sultan, not all taxes collected in the empire.","source":"Albert Howe Lybyer, The Government of the Ottoman Empire in the Time of Suleiman the Magnificent (1913), p. 179 (Italian original printed in Appendix II, p. 273)"},"X7":{"type":"passage","paragraphs":["Djouder Pasha was the commander-in-chief of the Moorish army. He had at his disposal for the purposes of an expedition to the Soudan only a small force of something under 4000 men, but they were well armed with muskets—which were apparently unknown to the western armies of the Soudan—they were well mounted, well disciplined, well equipped with tents and medical stores, and, … sufficiently well provisioned. Their organisation had been reformed on the model of the Turks, with whom the armies of Morocco had had more than one occasion to measure their strength.","A little steel-coloured man with blue eyes, at the head of such a force, was in a position to play, if he chose, amid the rich and supine populations of the Soudan, a part not unlike that of the leader of a pack of wolves among flocks of sheep. …","… Morocco found its cause of quarrel with Songhay in the possession of the salt mines of Tegazza. … They furnished the principal salt supply of the Soudan, and their possession was therefore a matter of supreme importance to Songhay. …","… To the last moment the officials of Songhay refused to believe that the Moorish army would succeed in reaching the river. Finally, however, an army of 12,000 horse and 30,000 foot was put in motion. On the 12th of April, 1591*, the forces met at a place called Tenkoudibo, which I have not been able to identify, … The battle resulted in the absolute defeat of the Songhay army. The cavalry was routed, the chivalry of Songhay fled. …"],"attribution":"Flora Shaw (Lady Lugard), British journalist married to Frederick Lugard, the British high commissioner (governor) of Northern Nigeria, A Tropical Dependency: An Outline of the Ancient History of the Western Soudan, published in 1905; her account of the war follows the Tarikh al-Sudan, a history written in Timbuktu in the 1600s","translation":"Adapted","footnotes":[{"mark":"*","text":"Historians date the battle, fought at Tondibi near the Niger River, to March 13, 1591."}],"glossary":[{"t":"Moorish","d":"Moroccan"},{"t":"the Soudan","d":"the writer's name for the grasslands of West Africa south of the Sahara (not the modern country of Sudan)"},{"t":"provisioned","d":"supplied with food"},{"t":"supine","d":"weak and passive"},{"t":"Tegazza","d":"Taghaza, a salt-mining town in the Sahara"},{"t":"the river","d":"the Niger River"},{"t":"horse, foot","d":"cavalry, infantry"},{"t":"routed","d":"badly defeated and scattered"},{"t":"chivalry","d":"here, the noble horsemen"}]},"X8":{"type":"passage","paragraphs":["… the King, as proprietor of the land, makes over a certain quantity to military men, as an equivalent for their pay; and this grant is called jah-ghir, or, as in Turkey, timar … Similar grants are made to governors, in lieu of their salary, and also for the support of their troops, on condition that they pay a certain sum annually to the King out of any surplus revenue that the land may yield. …","The persons thus put in possession of the land, whether as timariots, governors, or contractors, have an authority almost absolute over the peasantry, … and nothing can be imagined more cruel and oppressive than the manner in which it is exercised. There is no one before whom the injured peasant, artisan, or tradesman can pour out his just complaints; no great lords, parliaments, or judges of local courts, exist, as in France, to restrain the wickedness of those merciless oppressors …","… a question will naturally arise, whether it would not be more advantageous for the King as well as for the people, if the former ceased to be sole possessor of the land, and the right of private property were recognised in the Indies as it is with us? I have carefully compared the condition of European states, where that right is acknowledged, with the condition of those countries where it is not known, and am persuaded that the absence of it among the people is injurious to the best interests of the Sovereign himself.","… The peasant cannot avoid asking himself this question: 'Why should I toil for a tyrant who may come to-morrow and lay his rapacious hands upon all I possess and value …?'—The Timariots, Governors, and Revenue contractors, on their part reason in this manner: '… We may be deprived of it in a single moment, and our exertions would benefit neither ourselves nor our children. Let us draw from the soil all the money we can, though the peasant should starve or abscond …'"],"attribution":"François Bernier, French doctor who lived in Mughal India from 1658 to 1667, letter to Jean-Baptiste Colbert, finance minister of King Louis XIV of France, first published in Paris in 1670","translation":"Translated by Irving Brock, revised by Archibald Constable, Travels in the Mogul Empire (1891); adapted","glossary":[{"t":"proprietor","d":"owner"},{"t":"jah-ghir","d":"jagir, a grant of the right to collect the revenue of an area of land"},{"t":"in lieu of","d":"instead of"},{"t":"surplus revenue","d":"income left over"},{"t":"timariots","d":"Bernier's word for people holding these land grants"},{"t":"contractors, Revenue contractors","d":"people who collected the revenue of an area for the king under a contract"},{"t":"rapacious","d":"greedy, grabbing"},{"t":"abscond","d":"run away"},{"t":"the Indies","d":"here, India"},{"t":"injurious","d":"harmful"}]},"P1":{"type":"passage","paragraphs":["… The territories, which bear the name of Persia, and are ruled by the Sophi, or Kizilbash as the Turks call him, are less fertile than our country, and even such crops as they bear are laid waste by the inhabitants in time of invasion in hopes of starving out the enemy, so that it is very dangerous for an army to invade Persia, if it be not furnished with abundant supplies. …","From this you will see that it is the patience, self-denial, and thrift of the Turkish soldier that enable him to face the most trying circumstances, and come safely out of the dangers that surround him. What a contrast to our men! … It makes me shudder to think of what the result of a struggle between such different systems must be; one of us must prevail and the other be destroyed, at any rate we cannot both exist in safety. On their side is the vast wealth of their empire, unimpaired resources, experience and practice in arms, a veteran soldiery, an uninterrupted series of victories, readiness to endure hardships, union, order, discipline, thrift, and watchfulness. On ours are found an empty exchequer, luxurious habits, exhausted resources, broken spirits, a raw and insubordinate soldiery, and greedy generals … The only obstacle is Persia, whose position on his [the sultan's] rear forces the invader to take precautions. The fear of Persia gives us a respite, but it is only for a time. …","I will now give you another conversation with Roostem*, that you may understand how widely the Persians are separated from the Turks by religion. He once asked me if war was still going on between the Kings of Spain and France. On my replying that it was, 'What right have they,' said he, 'to wage war on each other, when they are united by the ties of religion?' 'The same,' said I, 'as you have to fight with the Persians. There are cities, provinces, and kingdoms about which they are at variance.' 'It is quite a different case,' said Roostem, 'for we, you must know, hate the Persians worse, and consider them more impious than we do you Christians.'"],"attribution":"Ogier Ghiselin de Busbecq, ambassador of the Habsburg ruler Ferdinand I to the court of Ottoman Sultan Suleiman I, letter to a friend, 1560","translation":"Translated by C. T. Forster and F. H. B. Daniell (1881); adapted","footnotes":[{"mark":"*","text":"Rüstem Pasha, grand vizier (chief minister) of Sultan Suleiman I"}],"glossary":[{"t":"the Sophi","d":"Europeans' name for the Safavid shah of Persia"},{"t":"Kizilbash","d":"\"Red Heads,\" the Turkish name for the Safavids and their followers, from their red caps"},{"t":"exchequer","d":"treasury"},{"t":"insubordinate","d":"disobedient"},{"t":"respite","d":"a short break"},{"t":"at variance","d":"in dispute"},{"t":"impious","d":"wicked in matters of religion"}]},"P2":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Bullocks_dragging_siege-guns_up_hill_during_the_attack_on_Ranthambhor_Fort.jpg/960px-Bullocks_dragging_siege-guns_up_hill_during_the_attack_on_Ranthambhor_Fort.jpg","width":960,"height":1498,"alt":"A crowded painting of oxen and men hauling huge cannons on wheeled carriages up a steep rocky slope, while cannons on the cliff above fire and an officer directs the work.","caption":"Teams of white, spotted, and brown oxen, driven by men with sticks and ropes, haul huge cannons on wheeled carriages up a steep, rocky slope. At the upper left, cannons already on the cliff are firing, and smoke streams across the dark sky. At the upper right, an officer in a white robe directs the work. Crowds of soldiers and workers push and pull below, and tents stand at the lower right.","attribution":"Miskin (design) and Paras (painting), artists at the Mughal court, Bullocks Dragging Siege-Guns up a Hill during the Attack on Ranthambhor Fort (1569), painting from an illustrated copy of the Akbarnama, the official history of the emperor Akbar's reign, about 1590–1595","credit":"Victoria and Albert Museum, London. Public domain image via Wikimedia Commons.","description":"A tall, crowded painting. A steep rocky slope runs from the lower left up toward the middle right. Pairs of large white and spotted oxen, and dark brown oxen higher up, pull ropes while men beat and guide them and dozens of workers push. At the top left, three enormous cannons on big wooden wheels sit on a cliff edge, and long streams of smoke blow across a dark blue sky. At the top right, a man in a long white robe stands among attendants and points. At the bottom right are red and green tents. A frame of plain tan paper surrounds the scene, with short notes in red ink below.","glossary":[{"t":"siege","d":"surrounding a fortified place to force it to surrender"},{"t":"bullocks","d":"oxen used for pulling heavy loads"},{"t":"Ranthambhor","d":"a hilltop fortress in Rajasthan, northwestern India, held by a Rajput ruler"}]},"P3":{"type":"passage","paragraphs":["… The force at the disposal of the Shah originally consisted of some sixty thousand Kizilbash horsemen, who would obey none but their chiefs. Consequently he was unable to give a command to any one outside the Kizilbash themselves, in whose hands the entire power lay. To meet this difficulty he halved the numbers of the tribal contingents and organized a body of ten thousand cavalry and twelve thousand infantry, paid and officered by the crown.","Allah Verdi Beg, the celebrated Commander-in-Chief, was quick to see the advantages of the Sherley mission*, which included among its members a cannon-founder. With his assistance and thanks to the Sherleys, batteries of artillery were formed, as well as regiments of regular infantry. Indeed, mainly through the initiative of our fellow-countrymen, a revolution was effected in the military organization, and in place of a feudal force of horsemen Persia soon possessed an army fit to meet that of Turkey in the field. …"],"attribution":"Percy Sykes, British army officer and historian, A History of Persia, vol. 2, published in 1915, describing the reign of Shah Abbas I of Persia (ruled 1588–1629)","translation":"Adapted","footnotes":[{"mark":"*","text":"Anthony and Robert Sherley, English brothers who arrived at the Persian court in 1598 with about two dozen followers"}],"glossary":[{"t":"Kizilbash","d":"Turkic tribal warriors who had helped bring the Safavid family to power"},{"t":"contingents","d":"groups of troops"},{"t":"officered by the crown","d":"led by officers the shah appointed"},{"t":"batteries of artillery","d":"groups of cannons with their crews"},{"t":"feudal force","d":"an army of chiefs and the followers loyal to them"}]},"P4":{"type":"passage","paragraphs":["On the southeast side, they have got the kingdoms of Kazan and Astrakhan. These were won from the Tartar by the late emperor Ivan Vasilowich, father to the emperor that now is … Northward out of the country of Siberia he hath laid unto his realm a great breadth and length of ground, from Wichida to the river of Obba, about a 1000 miles space: so that he is bold to write himself now, the great commander of Siberia. …","As for the countries of Pechora and Permia, and that part of Siberia which he hath now under him, they are kept by as easy means as they were first got, viz., rather by showing than by using of arms. First, he hath stored the country with as many Russes as there are natives, and hath there some few soldiers in garrison, enough to keep them under. Secondly, his officers and magistrates there are of his own Russe people, and he changeth them very often … Thirdly, he divideth them into many small governments, like a staff broke in many small pieces: so that they have no strength, being severed … Fourthly, he provided that the people of the country have neither armour nor money, being taxed and pilled so often as he thinketh good …","In Siberia (where he goeth on in pursuing his conquest) he hath divers castles and garrisons, to the number of six thousand soldiers of Russes and Polonians, and sendeth many new supplies thither, to plant and to inhabit as he winneth ground."],"attribution":"Giles Fletcher, English ambassador to Russia in 1588–1589, Of the Russe Common Wealth, published in London in 1591","translation":"From Russia at the Close of the Sixteenth Century, edited by Edward A. Bond (Hakluyt Society, 1856); spelling modernized; adapted","glossary":[{"t":"the Tartar","d":"Fletcher's name for the Muslim khanates (states) that had grown out of the Mongol Golden Horde"},{"t":"the late emperor Ivan Vasilowich","d":"Tsar Ivan IV, who ruled Russia from 1547 to 1584"},{"t":"Wichida, Obba","d":"the Vychegda River in northern Russia and the Ob River in western Siberia"},{"t":"Pechora and Permia","d":"lands in far northeastern Europe, west of the Ural Mountains"},{"t":"viz.","d":"that is"},{"t":"Russes","d":"Russians"},{"t":"severed","d":"cut apart"},{"t":"pilled","d":"robbed"},{"t":"divers","d":"several"},{"t":"Polonians","d":"Poles"},{"t":"to plant","d":"to settle colonists"}]},"P5":{"type":"passage","paragraphs":["The Tsar labored at the reform of fashions, or, more properly speaking, of dress. Until that time the Russians had always worn long beards, which they cherished and preserved with much care, allowing them to hang down on their bosoms, without even cutting the moustache. … The Tsar, in order to reform that custom, ordered that gentlemen, merchants, and other subjects, except priests and peasants, should each pay a tax … if they wished to keep their beards … Officials were stationed at the gates of the towns to collect that tax, which the Russians regarded as an enormous sin on the part of the Tsar and as a thing which tended to the abolition of their religion.","These insinuations, which came from the priests, occasioned the publication of many pamphlets in Moscow, where for that reason alone the Tsar was regarded as a tyrant and a pagan; and there were many old Russians who, after having their beards shaved off, saved them preciously, in order to have them placed in their coffins, fearing that they would not be allowed to enter heaven without their beards. As for the young men, they followed the new custom with the more readiness, as it made them appear more agreeable to the fair sex.","From the reform in beards we may pass to that of clothes. Their garments, like those of the Orientals, were very long, reaching to the heel. The Tsar issued an ordinance abolishing that costume, commanding all the boyars (nobles) and all those who had positions at the court to dress after the French fashion …"],"attribution":"Jean Rousset de Missy, French writer who lived in the Netherlands, Memoirs of the Reign of Peter the Great, 1728, describing reforms of Tsar Peter I of Russia (ruled 1682–1725)","translation":"Translated in James Harvey Robinson and Charles A. Beard, Readings in Modern European History, vol. 1 (1908); adapted","glossary":[{"t":"insinuations","d":"hints that something bad is going on"},{"t":"occasioned","d":"caused"},{"t":"pagan","d":"a person who does not follow the Christian faith"},{"t":"the fair sex","d":"an old phrase for women"},{"t":"Orientals","d":"the writer's word for the peoples of Asia and the Middle East"},{"t":"ordinance","d":"official order"}]},"P6":{"type":"passage","paragraphs":["This incomparable mosque was built by Sultan Suleiman on one-half of the unoccupied half of the summit of the lofty hill on which had been erected, by Mohammed II, the old Serai. Suleiman having assembled all the thousands of perfect masters in architecture, building, stone-hewing, and marble-cutting, who were found in the dominions of the house of 'Osman, three whole years were employed in laying the foundations. …","… This vast structure of azure stone is more circular than the cupola of Aya Sofiyah … Besides the square piers which support it, there are, on the right and left sides, four porphyry columns, each of which is worth ten times the amount of the tribute (Kharaj) from Misr. These columns were brought from the capital of Misr, along the Nile, to Iskanderiyyeh, and there embarked on rafts …","… On the four piers are written, \"Allah, Mohammed, Abu Bekr, 'Omar, 'Osman, 'Ali, Hasan, and Hosein.\" …","… This mosque has four minarets, the galleries of which are ten in number, as a record that Sultan Suleiman Khan was the tenth Sultan of the House of 'Osman."],"attribution":"Evliya Çelebi, Ottoman traveler and writer, Book of Travels, written in the mid-1600s, describing the Süleymaniye Mosque in Istanbul, built from 1550 to 1557 by the architect Sinan for Sultan Suleiman I","translation":"Translated by Joseph von Hammer (1834); names simplified; adapted","glossary":[{"t":"Serai","d":"palace"},{"t":"house of 'Osman","d":"the Ottoman dynasty, named after its founder, Osman"},{"t":"cupola","d":"dome"},{"t":"Aya Sofiyah","d":"Hagia Sophia, a huge domed building in Istanbul, built in the 500s"},{"t":"piers","d":"thick pillars that hold up a building"},{"t":"porphyry","d":"a hard, purple-red stone"},{"t":"Misr, Iskanderiyyeh","d":"Egypt and the Egyptian port of Alexandria"},{"t":"Abu Bekr, 'Omar, 'Osman, 'Ali","d":"the first four caliphs, leaders of the Muslim community after Muhammad; Hasan and Hosein were 'Ali's sons; this 'Osman is the caliph Uthman, not the founder of the Ottoman dynasty"},{"t":"minarets","d":"tall towers from which Muslims are called to prayer"}]},"P7":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/Bichitr_-_Jahangir_Preferring_a_Sufi_Shaikh_to_Kings%2C_from_the_St._Petersburg_album_-_Google_Art_Project.jpg/960px-Bichitr_-_Jahangir_Preferring_a_Sufi_Shaikh_to_Kings%2C_from_the_St._Petersburg_album_-_Google_Art_Project.jpg","width":960,"height":1397,"alt":"A Mughal painting of an emperor with a huge golden halo, seated on an hourglass-shaped throne and handing a book to an old bearded man, while three other men stand below.","caption":"The emperor Jahangir sits on an hourglass-shaped throne in front of a huge golden halo shaped like the sun, with a crescent moon behind it. He hands a book to an elderly Sufi shaikh with a long white beard. Below the shaikh stand a man in a turban whom scholars identify as an Ottoman sultan, King James I of England (copied from an English portrait), and the artist Bichitr, who holds up a small painting. Winged children fly overhead, and two more sit at the base of the hourglass, where one writes on it. Lines of Persian poetry fill the panels above and below.","attribution":"Bichitr, painter at the Mughal court, Jahangir Preferring a Sufi Shaikh to Kings, opaque watercolor, gold, and ink on paper, about 1615–1618 (the flower border was added by Muhammad Sadiq in the mid-1700s); Jahangir ruled the Mughal Empire from 1605 to 1627","credit":"Freer Gallery of Art, Smithsonian Institution, Washington, D.C. Public domain image via Wikimedia Commons.","description":"A page with a wide border of brightly painted flowers, added later. In the center, against a pale blue sky, the emperor sits cross-legged on a cushion on top of a large hourglass decorated with gold. Behind his head is an enormous gold disk with rays, framed by a white crescent moon. An old man with a white beard and turban, at the left, reaches up to take a book from the emperor. Below him, one above the other, are a bearded man in a white turban and green robe, a European king with a feathered hat, a white ruff collar, and jewels, and a man in a red turban and yellow robe holding a small picture. At the top, one winged child flies off with a bow and another covers its face. At the bottom, two winged children sit by the hourglass, and one writes on the glass. Panels of Persian writing run across the top and bottom.","glossary":[{"t":"Sufi","d":"a follower of Sufism, a mystical form of Islam that seeks a close, personal love of God"},{"t":"shaikh","d":"a religious teacher or holy man"},{"t":"hourglass","d":"a glass timer in which sand runs from the top half into the bottom half"}]},"P8":{"type":"passage","paragraphs":["… Neither doth any study Mathematics or Physic, which is in any hope of the Ethic glory, but such as want of wit or means hath deterred from studies more sublime. Contrariwise, that Ethic Science is the Ladder of China felicity. Confucius brought into order the Books of four former Philosophers, and wrote a fifth himself, which five Books he called Doctrines: in which are contained Moral and Politic Rules, Examples of the Ancients, Rites and Sacrifices, divers Poems also and the like. … And the ancient Kings enacted that they which profess Learning, should take the foundations of their Learning from those Books … In this Science are three Degrees bestowed on them which offer themselves to be examined and are judged meet. That Examination is almost wholly in Writing. …","… In this [first] Examination every one is admitted, perhaps four or 5000 assembled to that purpose. The second is by the four Governors of the City (for none are admitted to Government but the Learned) which present out of all that number 200 of the better Writers to the Tihio, and he in a third Examination chooseth 20 or 30 of the best, which he entitleth Bachelors … in all places they are much respected as in a rank above the vulgar Citizens, and enjoy also divers Privileges …","… In every Mother City is a huge Palace built for this purpose, compassed with high walls, with many stations for the Examiners separate from noise; and four thousand Cells or Studies besides in the midst of the Palace, wherein is a stool and table for one man, that none may see or confer with any other. … When the Bachelors come to the Palace, they are thoroughly searched whether they have any Book or Writing with them …","… They use to grant at the same times and places … Titles (in the Moon following) to Military Professors, but with less pomp, because Soldiery is of no such reckoning with them, and few stand for them."],"attribution":"Matteo Ricci, Italian Jesuit missionary who lived in Ming China from 1582 until his death in 1610, account of China, edited in Latin by Nicolas Trigault (1615) and shortened in English by Samuel Purchas in Purchas His Pilgrimes (1625)","translation":"From the reprint of Purchas His Pilgrimes, vol. 12 (Glasgow, 1906); spelling modernized; adapted","glossary":[{"t":"Physic","d":"medicine"},{"t":"Ethic Science","d":"the study of right conduct (here, Confucian teaching)"},{"t":"felicity","d":"happiness and success"},{"t":"divers","d":"various"},{"t":"judged meet","d":"judged fit"},{"t":"Tihio","d":"the official in charge of examinations in a province"},{"t":"vulgar","d":"ordinary, common"},{"t":"Mother City","d":"provincial capital"},{"t":"compassed","d":"surrounded"},{"t":"confer","d":"talk together"},{"t":"stand for them","d":"try to earn them"}]},"P9":{"type":"passage","paragraphs":["There has been arable land from time immemorial, and taxation in consequence. Taxes are of extreme importance:—the State depends on them to meet all its expenses: in the nature of the case they should be collected by the State from the people, and rendered by the people to the State. In all history, which Dynasty has not thus levied them? Besides, the fact is, these taxes are not for the private uses of the Government, but are used for you people. For example, they are used to sustain the numerous officials, that they may look after you; and to support numerous troops, that they may protect you. … there are cities, canals, embankments, boats, and granaries to be built and kept in repair—uses without number; all beyond question simply applying your taxes to promote your interests: never has the State oppressed the people for its own gratification.","From the establishment of Our Dynasty, there has been a fixed amount of taxes to be rendered. Those who exact over and above the fixed amount, and those who, acting in another's name, serve their own ends, shall one and all be got rid of: not a thread or a hair too much is to be collected from you. … Now, since the State unquestionably takes special care of you, you must reciprocate: it is your bounden duty to look on the business of the State as far more pressing than your own."],"attribution":"The Sacred Edict, sixteen moral maxims issued by the Kangxi Emperor of Qing China in 1670; this passage is from the explanation of the fourteenth maxim, \"Pay taxes, and so avoid being pressed for payment,\" written by his son, the Yongzheng Emperor, in 1724 and later rewritten in everyday Chinese, in a version credited to the Qing official Wang Youpu, so that it could be read aloud to the public","translation":"Translated by F. W. Baller, The Sacred Edict (1892); adapted","glossary":[{"t":"arable land","d":"farmland"},{"t":"from time immemorial","d":"from very long ago"},{"t":"rendered","d":"paid"},{"t":"levied","d":"collected (taxes)"},{"t":"embankments","d":"raised banks that keep rivers from flooding"},{"t":"granaries","d":"storehouses for grain"},{"t":"gratification","d":"pleasure"},{"t":"exact","d":"demand"},{"t":"reciprocate","d":"give something back in return"},{"t":"bounden duty","d":"firm duty"}]},"P10":{"type":"pair","items":[{"label":"Source 1","paragraphs":["These excursions [to a small hunting castle at Versailles] of Louis XIV. by degrees gave birth to those immense buildings he erected at Versailles; and their convenience for a numerous court, so different from the apartments at Saint-Germain, led him to take up his abode there entirely …","The frequent fetes, the private promenades at Versailles, the journeys, were means on which the King seized in order to distinguish or mortify the courtiers, and thus render them more assiduous in pleasing him. …","… He looked to the right and to the left, not only upon rising but upon going to bed, at his meals, in passing through his apartments, or his gardens of Versailles, where alone the courtiers were allowed to follow him; he saw and noticed everybody; not one escaped him, not even those who hoped to remain unnoticed. He marked well all absentees from the Court, found out the reason of their absence, and never lost an opportunity of acting towards them as the occasion might seem to justify. With some of the courtiers (the most distinguished), it was a demerit not to make the Court their ordinary abode; with others 'twas a fault to come but rarely; for those who never or scarcely ever came it was certain disgrace."],"attribution":"Louis de Rouvroy, Duke of Saint-Simon, French noble who lived at the court of Versailles, Memoirs, written in the 1740s about the reign of Louis XIV (ruled 1643–1715)","translation":"Translated by Bayle St. John (1857); adapted","glossary":[{"t":"Saint-Germain","d":"an older royal palace near Paris"},{"t":"abode","d":"home"},{"t":"fetes","d":"festivals and parties"},{"t":"promenades","d":"walks"},{"t":"distinguish or mortify","d":"honor or humiliate"},{"t":"assiduous","d":"eager and hard-working"},{"t":"demerit","d":"a mark against someone"}]},{"label":"Source 2","paragraphs":["… Rulers then act as the ministers of God and as his lieutenants on earth. It is through them that God exercises his empire. … Consequently, as we have seen, the royal throne is not the throne of a man, but the throne of God himself. …","It appears from all this that the person of the king is sacred, and that to attack him in any way is sacrilege. … Kings should be guarded as holy things, and whosoever neglects to protect them is worthy of death. …","But kings, although their power comes from on high, as has been said, should not regard themselves as masters of that power to use it at their pleasure; … they must employ it with fear and self-restraint, as a thing coming from God and of which God will demand an account."],"attribution":"Jacques-Bénigne Bossuet, French Catholic bishop and tutor to the son of Louis XIV, Politics Drawn from the Very Words of Holy Scripture, written for the heir to the French throne in the late 1600s and published in 1709","translation":"Translated in James Harvey Robinson, Readings in European History, vol. 2 (1906); adapted","glossary":[{"t":"lieutenants","d":"deputies who act in someone else's place"},{"t":"sacrilege","d":"an attack on something holy"},{"t":"self-restraint","d":"self-control"}]}]},"P11":{"type":"passage","paragraphs":["… Here are many shops of artificers, and merchants, and especially of such as weave linen and cotton cloth. And hither do the Barbary merchants bring cloth of Europe. … The inhabitants, and especially strangers there residing, are exceeding rich, insomuch, that the king that now is, married both his daughters unto two rich merchants. …","… Corn, cattle, milk, and butter this region yieldeth in great abundance: but salt is very scarce here; for it is brought hither by land from Tegaza, which is five hundred miles distant. When I myself was here, I saw one camel's load of salt sold for 80 ducats. The rich king of Tombuto hath many plates and sceptres of gold, some whereof weigh 1300 pounds: and he keeps a magnificent and well furnished court. …","… He hath always three thousand horsemen, and a great number of footmen that shoot poisoned arrows, attending upon him. They have often skirmishes with those that refuse to pay tribute, and so many as they take, they sell unto the merchants of Tombuto. Here are very few horses bred, and the merchants and courtiers keep certain little nags which they use to travel upon: but their best horses are brought out of Barbary. …","… Here are great store of doctors, judges, priests, and other learned men, that are bountifully maintained at the king's cost and charges. And hither are brought divers manuscripts or written books out of Barbary, which are sold for more money than any other merchandise."],"attribution":"Leo Africanus (al-Hasan al-Wazzan), scholar and diplomat from Fez, Morocco, raised as a Muslim, who visited Timbuktu in the early 1500s; captured by Christian pirates in 1518 and taken to Rome, where he was baptized a Christian in 1520; The History and Description of Africa, written in Italian in 1526","translation":"English translation by John Pory (1600), as edited by Robert Brown for the Hakluyt Society (1896); spelling modernized; adapted","glossary":[{"t":"artificers","d":"skilled craftsmen"},{"t":"Barbary","d":"North Africa"},{"t":"Corn","d":"grain (not maize)"},{"t":"Tombuto","d":"Timbuktu, a trading city near the Niger River in West Africa"},{"t":"the king of Tombuto","d":"Leo seems to mean the ruler of the Songhai Empire, which controlled Timbuktu"},{"t":"Tegaza","d":"Taghaza, a salt-mining town in the Sahara"},{"t":"ducats","d":"gold coins"},{"t":"sceptres","d":"rods carried by rulers"},{"t":"skirmishes","d":"small fights"},{"t":"doctors","d":"here, scholars of religion and law"},{"t":"divers","d":"various"}]},"P12":{"type":"passage","paragraphs":["The Romanists have, with great adroitness, drawn three walls round themselves, with which they have hitherto protected themselves, so that no one could reform them, whereby all Christendom has fallen terribly. Firstly, if pressed by the temporal power, they have affirmed and maintained that the temporal power has no jurisdiction over them, but on the contrary that the spiritual power is above the temporal. Secondly, if it were proposed to admonish them with the Scriptures, they objected that no one may interpret the Scriptures but the Pope. Thirdly, if they are threatened with a Council, they pretend that no one may call a Council but the Pope. …","… It has been devised, that the Pope, bishops, priests and monks are called the Spiritual Estate; Princes, lords, artificers and peasants, are the Temporal Estate; which is a very fine, hypocritical device. … That all Christians are truly of the Spiritual Estate, and there is no difference among them, save of office alone. … Thus we are all consecrated as priests by baptism …"],"attribution":"Martin Luther, German religious reformer, To the Christian Nobility of the German Nation, 1520","translation":"Translated by Henry Wace and C. A. Buchheim, First Principles of the Reformation (1883); adapted","glossary":[{"t":"Romanists","d":"Luther's name for the pope and his supporters in Rome"},{"t":"adroitness","d":"skill"},{"t":"hitherto","d":"until now"},{"t":"Christendom","d":"the Christian world"},{"t":"temporal power","d":"the power of kings, princes, and other rulers"},{"t":"spiritual power","d":"the power of the Church and its leaders"},{"t":"jurisdiction","d":"legal authority"},{"t":"admonish","d":"warn or correct"},{"t":"Council","d":"a meeting of Church leaders"},{"t":"Estate","d":"a class or rank of society"},{"t":"save of office","d":"except in their jobs"},{"t":"consecrated","d":"made holy for religious service"}]},"P13":{"type":"bar","title":"Members of the Society of Jesus (Jesuits), 1556–1749","categories":["1556","1615","1680","1749"],"series":[{"name":"Members","values":[1000,13112,17665,22589]}],"yLabel":"Number of members","text":"The Society of Jesus is a Catholic religious order founded in 1540. The article was written by a Jesuit historian. The 1556 figure is a round number given in the source. The source gives the number of priests among the members as 7,890 in 1680 and 11,293 in 1749.","source":"The Catholic Encyclopedia, vol. 14 (New York, 1912), article \"Society of Jesus,\" p. 109"},"P14":{"type":"pair","items":[{"label":"Source 1","paragraphs":["Make mercy thy cotton, contentment thy thread, continence its knot, truth its twist.\nThat would make a janeu for the soul; if thou have it, O Brahman, then put it on me.","To be a Musalman is difficult; if one be really so, then one may be called a Musalman. …\nWhen he is kind to all men, then Nanak, shall he be indeed a Musalman. …","Make kindness thy mosque, sincerity thy prayer-carpet, what is just and lawful thy Quran,\nModesty thy circumcision, civility thy fasting, so shalt thou be a Musalman. …"],"attribution":"Guru Nanak (1469–1539), religious teacher in the Punjab region of northern India, hymns later collected in the Granth Sahib","translation":"Translated by Max Arthur Macauliffe, The Sikh Religion, vol. 1 (1909); adapted","glossary":[{"t":"Musalman","d":"Muslim"},{"t":"prayer-carpet","d":"a rug on which Muslims kneel to pray"},{"t":"continence","d":"self-control"},{"t":"janeu","d":"the sacred thread worn by Hindu men of the higher castes"},{"t":"Brahman","d":"a member of the Hindu priestly caste"},{"t":"Granth Sahib","d":"the holy book of the Sikhs, compiled by Guru Arjun in 1604"}]},{"label":"Source 2","paragraphs":["In Gobindwal, which is on the river Biyah (Beas), there was a Hindu named Arjun, in the garments of sainthood and sanctity, so much so that he had captured many of the simple-hearted of the Hindus, and even of the ignorant and foolish followers of Islam, by his ways and manners, and they had loudly sounded the drum of his holiness. They called him Guru, and from all sides stupid people crowded to worship and manifest complete faith in him. For three or four generations (of spiritual successors) they had kept this shop warm. Many times it occurred to me to put a stop to this vain affair or to bring him into the assembly of the people of Islam.","At last when Khusrau* passed along this road this insignificant fellow proposed to wait upon him. Khusrau happened to halt at the place where he was, and he came out and did homage to him. … When this came to my ears and I clearly understood his folly, I ordered them to produce him and handed over his houses, dwelling-places, and children to Murtaza Khan, and having confiscated his property commanded that he should be put to death."],"attribution":"Jahangir, Mughal emperor (ruled 1605–1627), memoirs, describing events of 1606; Jahangir's insulting words show his own view","translation":"Translated by Alexander Rogers, edited by Henry Beveridge, The Tuzuk-i-Jahangiri (1909); adapted","footnotes":[{"mark":"*","text":"Jahangir's eldest son, who had rebelled against his father in 1606"}],"glossary":[{"t":"Arjun","d":"Guru Arjun (1563–1606), the fifth guru (teacher) of the Sikhs, who followed Guru Nanak; \"a Hindu\" is Jahangir's label for him"},{"t":"sanctity","d":"holiness"},{"t":"kept this shop warm","d":"kept this business going"},{"t":"vain","d":"worthless"},{"t":"wait upon","d":"visit to pay respects"},{"t":"did homage","d":"showed respect and loyalty"},{"t":"Murtaza Khan","d":"a Mughal noble and official"},{"t":"confiscated","d":"seized by the government"}]}]},"P15":{"type":"passage","paragraphs":["… crowds of learned men from all nations, and sages of various religions and sects came to the Court, and were honoured with private conversations. After enquiries and investigations, which were their only business and occupation day and night, they would talk about profound points of science, the subtleties of revelation, the curiosities of history, and the wonders of nature … everything that pleased him [Akbar], he picked and chose from any one except a Moslem, and anything that was against his disposition, and ran counter to his wishes he thought fit to reject and cast aside. From childhood to manhood, and from manhood to his declining years the Emperor had combined in himself various phases from various religions and opposite sectarian beliefs …","… this conviction took form, like an engraving upon a stone, that there are wise men to be found and ready at hand in all religions, and men of asceticism, and recipients of revelation and workers of miracles among all nations, and that the Truth is an inhabitant of every place: and that consequently how could it be right to consider it as confined to one religion or creed, and that, one which had only recently made its appearance and had not as yet endured a thousand years! …"],"attribution":"'Abd al-Qadir Bada'uni, Muslim scholar and official at the court of the Mughal emperor Akbar (ruled 1556–1605), Selection of Histories, a history completed about 1596","translation":"Translated by W. H. Lowe, Muntakhabu-t-Tawarikh, vol. 2 (Calcutta, 1884–1898); adapted","glossary":[{"t":"sages","d":"wise people"},{"t":"sects","d":"religious groups"},{"t":"subtleties of revelation","d":"fine points of religious teaching"},{"t":"disposition","d":"personal tastes"},{"t":"sectarian","d":"belonging to different religious groups"},{"t":"asceticism","d":"giving up comforts for religious reasons"},{"t":"creed","d":"religion"},{"t":"one which had only recently made its appearance","d":"Bada'uni means Islam, which was then less than 1,000 years old"}]},"P16":{"type":"passage","paragraphs":["The reverence and love of the people for the king, … are incredible, as they worship him not as a king, but as a god, on account of his descent from the line of Ali, the great object of their veneration. Those who are in sickness or hardships do not call to aid the name of God so much as that of the king, making vows to present him with some gift, and some go to kiss the doors of the palace, that house being considered fortunate which is able to get some cloth or shawl from the king, or else some water in which he has washed his hands, which they consider a preventive of fever. …","… not only the people, but his own sons and the sultans speak to him as if they could not find epithets worthy of such greatness, saying, \"Thou art the living faith, and in thee we believe.\" …","… It is true that in the city of Tauris he is not held in such veneration as in the other places, for which reason it is said that he has left it and gone to stay at Casin, seeing that he was not esteemed there as he wished."],"attribution":"Vincentio d'Alessandri, Venetian ambassador to the court of Shah Tahmasp I of Persia (ruled 1524–1576), report to the government of Venice on his mission of the early 1570s","translation":"Translated by Charles Grey, A Narrative of Italian Travels in Persia (Hakluyt Society, 1873); adapted","glossary":[{"t":"the line of Ali","d":"the family of 'Ali, cousin and son-in-law of the Prophet Muhammad"},{"t":"veneration","d":"deep respect and worship"},{"t":"a preventive of fever","d":"a protection against illness"},{"t":"the sultans","d":"here, the shah's army commanders and provincial governors"},{"t":"epithets","d":"titles of praise"},{"t":"Tauris, Casin","d":"the Persian cities of Tabriz and Qazvin"}]}},"practice":[{"id":"U3-P01","set":"P1","topic":"3.1","lo":"A","skill":"4.A","difficulty":"medium","stem":"Busbecq's statement that \"the only obstacle is Persia\" is best explained by which of the following?","options":{"A":"Persia had joined the Habsburgs in a formal alliance against the Ottomans.","B":"Persian merchants controlled the silk trade that Ottoman cities depended on.","C":"The rivalry with the Safavids forced the Ottomans to guard their eastern border.","D":"Persian grain exports were needed to feed the Ottoman armies in Europe."},"answer":"C","explanation":"The Ottoman and Safavid empires were rivals for most of the 1500s. When the sultan marched west into Europe, he had to worry about a Safavid attack in the east. Busbecq hoped this would keep the Ottomans busy.","whyNot":{"A":"Habsburg and Persian rulers sometimes exchanged envoys, but they had no real alliance. Busbecq points to Persia's position behind the sultan, not to a treaty.","B":"Persian silk did reach Ottoman markets, but Busbecq's point is military: Persia lies behind the sultan as he marches west.","D":"Busbecq says the Persians burn their own crops to starve invaders. They were enemies, not suppliers."},"hint":"Where is Persia compared with the Ottoman Empire? Why would a sultan heading west worry about it?","reasoning":"Causation"},{"id":"U3-P02","set":"P1","topic":"3.3","lo":"C","skill":"3.A","difficulty":"easy","stem":"Rüstem's comment in the last paragraph suggests that Ottoman leaders","options":{"A":"were willing to ally with Christian rulers against the Safavids","B":"saw their war with Persia as a quarrel over land, like Spain and France","C":"hoped to win the Safavids over to Sunni Islam by peaceful teaching","D":"viewed the Shi'a Safavids as worse enemies of the faith than Christians"},"answer":"D","explanation":"Rüstem says the Ottomans \"hate the Persians worse\" than Christians. The Ottomans were Sunni Muslims, and the Safavids made Shi'a Islam their state religion. His words show how bitter the rivalry between the two dynasties had become.","whyNot":{"A":"Rüstem compares how much the Ottomans hate each group. He does not offer to join Christians in a war.","B":"That is Busbecq's idea. Rüstem rejects it: \"It is quite a different case.\"","C":"Rüstem speaks of hatred, not of peaceful teaching."},"hint":"Busbecq compares the Ottoman–Persian war to a war between Spain and France. Does Rüstem agree?"},{"id":"U3-P03","set":"P1","topic":"3.4","lo":"D","skill":"3.A","difficulty":"medium","stem":"Busbecq's comparison of Ottoman and Christian armies most strongly supports which claim?","options":{"A":"The Ottomans' discipline and resources gave them an edge over European armies.","B":"Ottoman victories came mainly from their larger numbers of firearms.","C":"European armies were stronger but lacked the will to fight the Ottomans.","D":"The Ottomans owed their success mainly to their alliance with France."},"answer":"A","explanation":"Busbecq contrasts Ottoman \"order, discipline, thrift\" with Christian \"luxurious habits\" and \"greedy generals.\" He fears the Ottoman way will win. A large, well-run standing army helped the Ottomans expand.","whyNot":{"B":"Busbecq credits \"order, discipline, thrift,\" wealth, and experience. He does not mention guns in this passage.","C":"Busbecq says the Christian side has \"exhausted resources\" and \"a raw and insubordinate soldiery.\" He does not think it is stronger.","D":"France and the Ottomans did cooperate against the Habsburgs, but Busbecq explains Ottoman strength by their own qualities."},"hint":"Make two lists: what Busbecq says is on \"their side\" and what is on \"ours.\"","reasoning":"Comparison"},{"id":"U3-P04","set":"P2","topic":"3.1","lo":"A","skill":"1.B","difficulty":"easy","stem":"The painting best illustrates which of the following developments in the period 1450–1750?","options":{"A":"Mughal rulers relied on European gunners to aim and fire their cannons.","B":"Rajput rulers adopted firearms to defend their forts against the Mughals.","C":"Land-based empires used heavy artillery to capture fortified places.","D":"Mughal armies used elephants instead of oxen to move their heavy guns."},"answer":"C","explanation":"Big cannons could smash walls that had held out for centuries. The Mughals, like the Ottomans and Safavids, used gunpowder weapons to conquer new lands. Historians sometimes call these states \"gunpowder empires.\"","whyNot":{"A":"The painting shows no Europeans. Mughal gunners and workers move and fire the guns.","B":"The attribution says this was an attack on Ranthambhor, so the cannons belong to the attackers, not the defenders.","D":"The painting shows oxen, not elephants, pulling the guns."},"hint":"What are the oxen pulling, and where are the men taking it?","reasoning":"Causation"},{"id":"U3-P05","set":"P2","topic":"3.2","lo":"B","skill":"2.B","difficulty":"medium","stem":"The painting was most likely made in order to","options":{"A":"record the methods of moving artillery so officers could learn them","B":"celebrate the emperor's military strength","C":"show sympathy for the workers and animals forced to labor in war","D":"show the hardships of a defeat suffered by Akbar's army"},"answer":"B","explanation":"Akbar ordered the Akbarnama to tell the story of his reign, and his court painters filled it with scenes of his armies' power. Books like this helped show that he deserved to rule.","whyNot":{"A":"The painting shows a dramatic scene, not step-by-step instructions. It was made for a royal history book.","C":"The painting shows the army's power. Nothing in it criticizes the hard labor.","D":"Akbar's army took Ranthambhor in 1569, and a history made for Akbar would not show his army defeated."},"hint":"Who would see an illustrated history made at Akbar's court? What would the emperor want them to think?"},{"id":"U3-P06","set":"P2","topic":"3.4","lo":"D","skill":"5.A","difficulty":"medium","stem":"The siege shown in the painting is most similar to which of the following?","options":{"A":"The Ming emperors' rebuilding of the Great Wall to keep out Mongol raiders","B":"The Safavid army's reliance on Kizilbash cavalry charges at the Battle of Chaldiran in 1514","C":"Russian Cossacks' building of small wooden forts as they moved across Siberia","D":"The Ottoman use of giant cannons to break the walls of Constantinople in 1453"},"answer":"D","explanation":"In 1453 Sultan Mehmed II used huge cannons to batter the walls of Constantinople. Like Akbar at Ranthambhor, he used artillery to take a strong fortress and expand his empire.","whyNot":{"A":"The Great Wall was a defense against raiders. The painting shows an army hauling cannons to attack a fortress.","B":"The Kizilbash fought on horseback with few guns, and they lost to Ottoman cannons at Chaldiran.","C":"Cossack forts helped Russia hold land, but they were not cannon attacks on a strong fortress."},"hint":"What kind of weapon is being moved, and what is it going to be used against?","reasoning":"Comparison"},{"id":"U3-P07","set":"P3","topic":"3.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"The reforms described in the first paragraph were intended mainly to","options":{"A":"reduce the shah's need for tribal chiefs and strengthen royal control","B":"reward the Kizilbash chiefs with larger forces for their loyalty","C":"prepare Persia's army to invade the Mughal lands in India","D":"meet the Sherley brothers' demand for a European-style army"},"answer":"A","explanation":"The Kizilbash horsemen \"would obey none but their chiefs,\" so the shah could not fully command his own army. By paying new troops and choosing their officers himself, Abbas built forces loyal to him.","whyNot":{"B":"Abbas did the opposite. He \"halved the numbers of the tribal contingents.\"","C":"Sykes says the new army was built to \"meet that of Turkey,\" the Ottomans, not to invade India.","D":"The Sherleys helped train troops, but the shah's own commander-in-chief, Allah Verdi Beg, led the army."},"hint":"Whom did the Kizilbash obey? Whom did the new troops obey?"},{"id":"U3-P08","set":"P3","topic":"3.2","lo":"B","skill":"2.B","difficulty":"medium","stem":"Sykes's claim that the changes happened \"mainly through the initiative of our fellow-countrymen\" most likely reflects","options":{"A":"Persian court chronicles that gave the Sherleys credit for Abbas's victories","B":"evidence that the Sherley brothers commanded the Persian army in battle","C":"letters from Shah Abbas thanking England's queen for military help","D":"his point of view as a British officer who stressed the role of Englishmen"},"answer":"D","explanation":"Sykes was a British officer writing for British readers in 1915. He gives the English brothers much of the credit, even though Shah Abbas and his commanders led the changes. A historian would check Persian sources too.","whyNot":{"A":"Nothing in the passage shows Persian writers giving the Sherleys this credit.","B":"Sykes names Allah Verdi Beg as commander-in-chief. The Sherleys were advisers.","C":"The passage mentions no such letters. The Sherleys came as private adventurers."},"hint":"Who are \"our fellow-countrymen\"? Who is writing?"},{"id":"U3-P09","set":"P3","topic":"3.4","lo":"D","skill":"5.A","difficulty":"medium","stem":"Shah Abbas's new paid army was most similar to which of the following?","options":{"A":"Mughal assignments of tax revenue to Rajput nobles who kept commanding their own troops","B":"The Ottoman Janissaries, salaried infantry who were loyal to the sultan","C":"Russia's use of Cossack bands who served the tsar in return for land and plunder","D":"The Ming army's hereditary military families, who passed service from father to son"},"answer":"B","explanation":"Both the Janissaries and Abbas's new troops were paid by the ruler and served him directly. Rulers built such armies so they did not have to depend on nobles or tribal chiefs.","whyNot":{"A":"That system depended on local chiefs and their followers, like the Kizilbash chiefs Abbas was trying to weaken.","C":"Cossacks were semi-independent bands, not troops paid and officered by the ruler.","D":"Hereditary soldier families served by birth. Abbas's new troops were paid and appointed by the crown."},"hint":"Compare how each ruler recruited and paid his troops.","reasoning":"Comparison"},{"id":"U3-P10","set":"P4","topic":"3.1","lo":"A","skill":"1.B","difficulty":"medium","stem":"The first paragraph best illustrates which of the following developments?","options":{"A":"Russia's conquest of lands along the Baltic Sea from the kingdom of Sweden","B":"Russia's expansion southeast along the Volga River and east into western Siberia","C":"Russia's conquest of the Crimean Khanate on the coast of the Black Sea","D":"Russia's loss of the Volga lands of Kazan and Astrakhan to the Crimean Tatars"},"answer":"B","explanation":"Ivan IV conquered the khanates of Kazan (1552) and Astrakhan (1556) on the Volga River. Soon after, Russians began pushing across Siberia. By the mid-1600s Russian lands reached the Pacific Ocean.","whyNot":{"A":"Russia won Baltic lands later, under Peter the Great. Fletcher names Kazan, Astrakhan, and Siberia.","C":"Russia did not take Crimea until 1783. Fletcher names Kazan, Astrakhan, and Siberia.","D":"Fletcher says these lands were \"won from the Tartar.\" Russia gained them; it did not lose them."},"hint":"Find the places Ivan won. In which directions are they from Moscow?"},
