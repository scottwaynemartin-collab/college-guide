re cruel and destructive above all other colonists. … That the wars of subjugation were very destructive of life is only too clear; that famine followed war to prolong its ravages is equally certain; that the average Spaniard recklessly and cruelly overworked the Indians there is no doubt.","Nevertheless, there were other and more subtle causes in operation. Diseases were imported by the whites, which were mitigated for them by some degree of acquired immunity, but which raged irresistibly through a population without that defence. Of these new diseases small-pox was one of the most destructive. In the epidemic of small-pox in 1518 the natives, Peter Martyr* reports, died like sheep. … Small-pox appeared in Mexico at the beginning of the conquest … sweeping off in some provinces half the population."],"attribution":"Edward Gaylord Bourne, historian at Yale University, Spain in America, 1450–1580, published in 1904","translation":"Adapted","footnotes":[{"mark":"*","text":"Peter Martyr, an Italian scholar at the Spanish court who wrote about the Americas in the early 1500s. Bourne, writing in 1904, uses older terms: \"the whites\" for Europeans and \"natives\" for Indigenous people."}],"glossary":[{"t":"subjugation","d":"conquest"},{"t":"mitigated","d":"made less severe"},{"t":"acquired immunity","d":"protection from a disease built up by earlier exposure to it"}]}]},"X3":{"type":"bar","title":"Average Annual Registered Imports of American Gold and Silver into Spain, 1503–1660","categories":["1503–20","1521–40","1541–60","1561–80","1581–1600","1601–20","1621–40","1641–60"],"series":[{"name":"Average imports per year (millions of pesos)","values":[0.2,0.3,1.4,2.7,6.1,5.5,4.3,1.8]}],"yLabel":"Millions of pesos per year","text":"Gold and silver are combined by their money value (1 peso = 450 maravedís, a Spanish unit of account). Most of the silver came from mines at Potosí (in the Andes) and Zacatecas (in Mexico).","source":"Calculated from Earl J. Hamilton, American Treasure and the Price Revolution in Spain, 1501–1650 (1934), p. 34; yearly averages for each 20-year period (first period 18 years), rounded"},"X4":{"type":"passage","paragraphs":["1. No Japanese ships shall ever be sent to foreign lands.","2. No Japanese shall be permitted to go abroad, and if there be discovered anyone who has a secret intention to go abroad he shall be put to death. …","3. If any Japanese residing abroad comes back to Japan, even for a short time, he shall be put to death.","4. Rewards are to be given to those who report to the authorities about the Christians: those who give information about the foreign missionaries shall be given 200 to 300 silver coins according to their merits. …","5. Children and grandchildren of the foreign Christian missionaries shall not be permitted to remain in Japan, and anyone secretly giving shelter to such persons shall be put to death. …"],"attribution":"Ordinance issued by the Tokugawa shogunate to the governors of the port of Nagasaki, Japan, 1636","translation":"From Takekoshi Yosaburō, The Economic Aspects of the History of the Civilization of Japan (English edition, 1930); adapted","glossary":[{"t":"shogunate","d":"the government of the shogun, Japan's top military ruler (here, the Tokugawa family)"},{"t":"ordinance","d":"an official order or law"},{"t":"missionaries","d":"people sent to spread a religion; here, Catholic priests from Portugal and Spain"}]},"X5":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Casta_painting_all.jpg/960px-Casta_painting_all.jpg","width":960,"height":1353,"alt":"A painting divided into sixteen panels, each showing a mother, a father, and a child, with a written label under each family.","caption":"Each panel shows a family. The label assigns colonial social categories to the parents and the child. The first three labels in the top row read: \"Spaniard with Indian woman: Mestizo\"; \"Mestizo with Spanish woman: Castizo\"; \"Castizo with Spanish woman: Spaniard.\" Families in the top rows wear fine European-style clothing. Families in the lower rows wear plainer clothes, carry goods or tools, and some are barefoot. The labels use colonial terms: \"Indian\" meant an Indigenous person, and \"Mulatto,\" a term now considered offensive, meant a person of mixed Spanish and African ancestry.","attribution":"Unknown artist, Las Castas (The Castes), oil painting made in New Spain (colonial Mexico), eighteenth century","credit":"Museo Nacional del Virreinato, Tepotzotlán, Mexico. Public domain image via Wikimedia Commons.","description":"Sixteen small family portraits arranged in four rows of four. In each, a man and a woman stand with a child, and a label below names the mixture of Spanish, Indigenous, and African ancestry the painter assigned to each person. The couples in the first row are dressed in rich cloaks, lace, and fine fabrics. Moving down the rows, the clothing becomes simpler, people carry baskets, fruit, or tools, and several figures in the bottom rows are barefoot.","glossary":[{"t":"New Spain","d":"Spain's colony in Mexico and nearby lands"},{"t":"Mestizo","d":"a person of mixed Spanish and Indigenous ancestry"},{"t":"Mulatto","d":"a colonial term for a person of mixed Spanish and African ancestry"}]},"X6":{"type":"passage","paragraphs":["Under the later Hapsburgs*, with the increasing demands of the colonies on the one hand, and the utter ruin of Spanish industry on the other, the dependence of the Seville export commerce upon foreign manufactures was complete. They supplied five sixths of the cargoes of the outbound fleets. …","The most serious and widespread development of contraband trade, however, was in merchandise introduced into the colonies directly from foreign markets. Portuguese, French, Dutch and other interlopers smuggled their cargoes into the West Indies, through the closed port of Buenos Aires, or even to the Pacific shores of Spanish America. The illicit trader was eagerly welcomed by the colonists, for he supplied their needs at reasonable prices. …","A flood of restrictions, a jealous monopoly, on the one hand—on the other, a flourishing contraband trade of outsiders …—such is the story of Spanish-American commerce in the sixteenth and the seventeenth centuries. The Crown of Castile sought to extend Spanish power, and monopolize all the treasure of the Indies, by means of a rigid and complicated commercial system. Yet in the end, it saw the trade of the New World pass into the hands of its rivals … and its riches diverted at their very source."],"attribution":"Clarence H. Haring, American historian, Trade and Navigation between Spain and the Indies in the Time of the Hapsburgs, published in 1918","translation":"Adapted","footnotes":[{"mark":"*","text":"the ruling family of Spain from 1516 to 1700; \"later Hapsburgs\" refers to the 1600s"}],"glossary":[{"t":"contraband","d":"smuggled goods"},{"t":"interlopers","d":"traders who were not allowed to trade there"},{"t":"illicit","d":"illegal"},{"t":"monopoly","d":"complete control of a trade by one group"},{"t":"outbound fleets","d":"the yearly convoys of ships sailing from Seville to the Americas"}]},"X7":{"type":"passage","paragraphs":["They said they had been the first in doing good to the English, and the English the first in doing wrong. They said when the English first came, their king's father* was as a great man and the English as a little child. He kept other Indians from wronging the English, and gave them corn and showed them how to plant, and was free to do them any good, and had let them have a hundred times more land than now the king had for his own people. …","Another grievance was if twenty of their honest Indians testified that an Englishman had done them wrong, it was as nothing, and if but one of their worst Indians testified against any Indian or their king when it pleased the English, that was sufficient. Another grievance was when their kings sold land, the English would say it was more than they agreed to. … Now whom the English had owned for king or queen they would disinherit, and make another king that would give or sell them their land, so that now they had no hopes left to keep any land.","Another grievance: the English cattle and horses still increased, so that when they removed thirty miles from where the English had anything to do, they could not keep their corn from being spoiled, they never being used to fence. …"],"attribution":"John Easton, deputy governor of the English colony of Rhode Island, report of a meeting with Metacom (called King Philip by the English), leader of the Wampanoag people, June 1675","translation":"Spelling modernized; adapted","footnotes":[{"mark":"*","text":"Massasoit, Metacom's father, who allied with the Plymouth colonists in 1621"}],"glossary":[{"t":"grievance","d":"a complaint about unfair treatment"},{"t":"testified","d":"spoke as a witness in court"},{"t":"disinherit","d":"remove from power"},{"t":"owned","d":"recognized"},{"t":"removed","d":"moved"},{"t":"they never being used to fence","d":"they had never needed fences"}]},"X8":{"type":"passage","paragraphs":["From what I can recollect of these battles, they appear to have been raids of one little state or district on the other, to obtain prisoners or booty. Perhaps they were incited to this by those traders who brought the European goods I mentioned amongst us. Such a mode of obtaining slaves in Africa is common; and I believe more are procured this way, and by kidnapping, than any other. When a trader wants slaves, he applies to a chief for them, and tempts him with his wares. … Accordingly he falls on his neighbours, and a desperate battle ensues. If he prevails and takes prisoners, he gratifies his avarice by selling them. …","… Those prisoners which were not sold or redeemed we kept as slaves: but how different was their condition from that of the slaves in the West Indies! With us they do no more work than other members of the community, even their masters; their food, clothing and lodging were nearly the same as theirs, (except that they were not permitted to eat with those who were free-born); and there was scarce any other difference between them, than a superior degree of importance which the head of a family possesses in our state. … Some of these slaves have even slaves under them as their own property."],"attribution":"Olaudah Equiano, formerly enslaved African, describing his childhood in West Africa in the 1750s, The Interesting Narrative of the Life of Olaudah Equiano, published in London in 1789","translation":"Adapted","glossary":[{"t":"booty","d":"goods taken by force"},{"t":"incited","d":"pushed or encouraged"},{"t":"procured","d":"gotten"},{"t":"redeemed","d":"freed after a payment (ransomed)"},{"t":"West Indies","d":"the islands of the Caribbean"}]},"P1":{"type":"passage","paragraphs":["[Vasco da Gama] sent one of the convicts to Calicut, and those with whom he went took him to two Moors from Tunis, who could speak Castilian and Genoese*. The first greeting that he received was in these words: \"May the Devil take thee! What brought you hither?\" They asked what he sought so far away from home, and he told them that we came in search of Christians and of spices. …","On Tuesday the captain got ready the following things to be sent to the king, namely, twelve pieces of striped cloth, four scarlet hoods, six hats, four strings of coral, a case containing six wash-hand basins, a case of sugar, two casks of oil, and two of honey. … [The king's officials] came, and when they saw the present they laughed at it, saying that it was not a thing to offer to a king, that the poorest merchant from Mecca, or any other part of India, gave more, and that if he wanted to make a present it should be in gold. … When they had gone there came certain Moorish merchants, and they all made fun of the present which the captain desired to be sent to the king."],"attribution":"Journal of a member of Vasco da Gama's crew, describing the Portuguese fleet's arrival at Calicut, India, May 1498","translation":"Translated by E. G. Ravenstein (1898); adapted","footnotes":[{"mark":"*","text":"Castilian = Spanish; Genoese = the language of the city of Genoa, in present-day Italy"}],"glossary":[{"t":"Calicut","d":"a wealthy port city on the southwest coast of India, ruled by a Hindu king"},{"t":"Moors","d":"the journal's word for Muslims"},{"t":"convicts","d":"prisoners the Portuguese brought along to do dangerous jobs"}]},"P2":{"type":"passage","paragraphs":["Española is a wonder. … The harbors on the coast, and the number and size and wholesomeness of the rivers, most of them bearing gold, surpass anything that would be believed by one who had not seen them. … In this island there are many spices and extensive mines of gold and other metals. … They have neither iron, nor steel, nor arms, nor are they competent to use them … because they are timid to a surprising degree.","I gave away a thousand good and pretty articles which I had brought with me in order to win their affection, and that they might be led to become Christians, and be well inclined to love and serve their Highnesses* and the whole Spanish nation, and that they might aid us by giving us things of which we stand in need, but which they possess in abundance. …","Their Highnesses may see that I shall give them all the gold they require, if they will give me but a very little assistance; spices also, and cotton, as much as their Highnesses shall command to be shipped … and slaves, as many … as their Highnesses shall command to be shipped. … All Christendom ought to rejoice … for the great exaltation which may come to them in turning so many nations to our holy faith, and also for the temporal benefits which will bring great refreshment and gain, not only to Spain, but to all Christians."],"attribution":"Christopher Columbus, letter written on his return voyage to Luis de Santángel, a royal official who had helped pay for the voyage, February 1493; the letter was printed and spread across Europe that year","translation":"Translated by R. H. Major (1870); adapted","footnotes":[{"mark":"*","text":"King Ferdinand and Queen Isabella of Spain"}],"glossary":[{"t":"Española","d":"Hispaniola, the Caribbean island today shared by Haiti and the Dominican Republic"},{"t":"temporal","d":"worldly (money and goods, as opposed to religious)"}]},"P3":{"type":"table","title":"Estimated Indigenous Population of Central Mexico, 1518–1605","columns":["Year","Estimated population"],"rows":[["1518","25.2 million"],["1532","16.8 million"],["1548","6.3 million"],["1568","2.65 million"],["1585","1.9 million"],["1595","1.375 million"],["1605","1.075 million"]],"text":"These are estimates by historians Sherburne F. Cook and Woodrow Borah, based mainly on Spanish tax and tribute records. Some historians think the 1518 figure is too high, but historians agree that the Indigenous population of central Mexico fell catastrophically in the 1500s.","source":"Sherburne F. Cook and Woodrow Borah, studies of the population of central Mexico, 1960s"},"P4":{"type":"passage","paragraphs":["… There is a river on the hither side of which stands a Muslim town named Rander, wherein are very fair houses and open places. It is a very pleasant and wealthy place, for the Muslim inhabitants thereof trade in their own ships with Malacca, Bengal, Tenasserim, Pegu, Martaban and Sumatra, in spices of divers sorts and drugs and silks in great abundance, musk, benzoin, porcelain and many other wares. Those who dwell here have many great and fair vessels, which carry on this trade, and whosoever would have at his disposal things from Malacca and China, let him go to this place, where he will find them in greater perfection than in any other place soever. …","[In Malacca] dwell up to now great wholesale merchants of every kind, both Muslims and Hindus, many of them from Coromandel, men of great estates and owning many great ships which they call junks. They trade everywhere in goods of all kinds. … They go to Tenasserim, Pegu, Bengal, Pulicat, Coromandel, Malabar and Cambay, so much so that this city of Malacca is the richest seaport with the greatest number of wholesale merchants and abundance of shipping and trade that can be found in the whole world."],"attribution":"Duarte Barbosa, Portuguese official who worked in India from about 1500 to 1516, The Book of Duarte Barbosa, completed about 1518","translation":"Translated by M. Longworth Dames (1918–1921); place names and terms modernized (\"Moorish\" to Muslim, \"Heathen\" to Hindu); adapted","glossary":[{"t":"Rander","d":"a port in Gujarat, western India"},{"t":"Malacca","d":"a port on the strait between the Malay Peninsula and Sumatra, captured by the Portuguese in 1511"},{"t":"Coromandel","d":"the southeast coast of India"},{"t":"junks","d":"large Asian sailing ships"},{"t":"wholesale merchants","d":"merchants who buy and sell goods in very large amounts"}]},"P5":{"type":"passage","paragraphs":["The following day, Xicotencatl, Captain General of this province*, came to see me … with about fifty of its chiefs, praying me … that I would admit them to the royal service of Your Majesty and to my friendship, and would pardon them the past errors, because they had not understood who we were. He said that they had exerted all their forces … to escape being subjected to anyone, since at no time had this province ever been so … on the contrary, they had always lived free and independent, since immemorial times, and had always defended themselves against the great power of Moctezuma, of his father, and grandfather, who held that country subjected, but had never been able to hold them in subjection, though they had them surrounded on all sides, so that no one could go out of the country. He said also that they ate no salt, since there was none in their country, nor were they allowed to go to buy it anywhere else. … They had endured it, and held it as better thus to be free, rather than be subjected to anyone. They had wanted to do the same with me, but seeing clearly that neither their forces nor their tricks could help them, they had decided that, rather than die, … they would become vassals** of Your Highness."],"attribution":"Hernán Cortés, Spanish conquistador, letter to King Charles I of Spain (Holy Roman Emperor Charles V), 1520, describing events of September 1519","translation":"Translated by F. A. MacNutt (1908); names modernized; adapted","footnotes":[{"mark":"*","text":"Tlaxcala, an independent state east of Tenochtitlan, the Mexica (Aztec) capital"},{"mark":"**","text":"subjects who owe loyalty and service to a ruler"}],"glossary":[{"t":"Moctezuma","d":"Moctezuma II, ruler of the Mexica (Aztec) Empire"},{"t":"subjected","d":"ruled by someone else"},{"t":"immemorial","d":"so long ago no one remembers"}]},"P6":{"type":"passage","paragraphs":["The force of silver, which draws unto it the desire of all things, has peopled this mountain more than any other place in all these kingdoms. …","At this day the King receives for his fifth* yearly, from the mines of Potosí, a million of silver. … In the fleet in which I came in the year 1587, there were eleven millions transported in the two fleets of Peru and Mexico, whereof two thirds were in that of Peru, and almost one half for the King. I thought good to set this down … to show the power which His heavenly Majesty has given to the Kings of Spain … who (by the especial favor of heaven) have joined the East with the West Indies, environing the whole world with their power.","They labor in these mines in continual darkness … without knowledge of day or night. … They carry up this metal upon their shoulders, by ladders. A man carries ordinarily the weight of two arrobas** of metal upon his shoulders … and so go they up the ladder holding it with both their hands … a fearful thing, and which breeds an amazement to think upon it, so great is the desire of silver, that for the gain thereof men endure any pains."],"attribution":"José de Acosta, Spanish Jesuit priest who lived in Peru from 1572 to 1586, The Natural and Moral History of the Indies, 1590","translation":"Translated by Edward Grimston (1604); spelling modernized; adapted","footnotes":[{"mark":"*","text":"the royal fifth: the king's one-fifth share of the silver mined at Potosí at this time"},{"mark":"**","text":"about 50 pounds (23 kilograms)"}],"glossary":[{"t":"Potosí","d":"a huge silver mountain and mining city in the Andes (in today's Bolivia)"},{"t":"a million / eleven millions","d":"pesos, Spanish silver coins"},{"t":"East and West Indies","d":"Asia and the Americas"},{"t":"environing","d":"surrounding"}]},"P7":{"type":"passage","paragraphs":["… Though formerly ruled by a governor under the King of Kongo, this governor [of Angola**] has, since the king became a Christian, made himself absolute ruler. Having seized all the lands he ruled, and in time conquered some of the surrounding provinces, he is now a great and rich prince, and hardly less powerful than the King of Kongo, to whom he pays tribute or not, according as he chooses.","It came to pass that after Dom João II of Portugal planted the faith of Christ in the Kingdom of Kongo, and the king became a Christian, the Lord of Angola was always friendly towards him, being to some extent a vassal, and their people trading together. He sent tribute every year to the King of Kongo, and trade was carried on at the port of Luanda between the Portuguese and the people of Angola by permission of the King of Kongo. Slaves were bought and exchanged for other merchandise, all being sent to the island of São Tomé*. … Trade becoming successful, they began to send vessels themselves from Lisbon to Angola, and also a governor, Paulo Dias de Novais by name. … To this Paulo Dias, Dom Sebastião, King of Portugal, granted the power of conquering thirty-three leagues of country … where he was to take all he could gain for himself and his heirs."],"attribution":"Filippo Pigafetta, Italian writer, A Report of the Kingdom of Kongo, 1591, based on the accounts of Duarte Lopes, a Portuguese merchant who lived in Kongo in the 1570s and 1580s","translation":"Translated by Margarite Hutchinson (1881); names modernized; adapted","footnotes":[{"mark":"*","text":"a Portuguese island colony in the Gulf of Guinea, off the coast of Central Africa"},{"mark":"**","text":"here, the kingdom of Ndongo, south of Kongo; the Portuguese named it after its ruler's title, ngola"}],"glossary":[{"t":"vassal","d":"a lesser ruler who owes loyalty and payments to a stronger one"},{"t":"tribute","d":"payments made to show loyalty to a more powerful ruler"},{"t":"leagues","d":"an old distance unit; 33 leagues is roughly 100 miles"}]},"P8":{"type":"passage","paragraphs":["Although a kingdom may be enriched by gifts received, or by purchase taken from some other nations, yet these are things uncertain and of small consideration when they happen. The ordinary means therefore to increase our wealth and treasure is by foreign trade, wherein we must ever observe this rule: to sell more to strangers yearly than we consume of theirs in value.","For suppose that when this kingdom is plentifully served with the cloth, lead, tin, iron, fish and other native commodities, we do yearly export the overplus to foreign countries to the value of twenty-two hundred thousand pounds*, by which means we are enabled beyond the seas to buy and bring in foreign wares for our use and consumption to the value of twenty hundred thousand pounds. By this order duly kept in our trading, we may rest assured that the kingdom shall be enriched yearly two hundred thousand pounds, which must be brought to us in so much treasure, because that part of our stock which is not returned to us in wares must necessarily be brought home in treasure."],"attribution":"Thomas Mun, English merchant and director of the English East India Company, England's Treasure by Foreign Trade, written about 1630 and published in 1664","translation":"Spelling modernized; adapted","footnotes":[{"mark":"*","text":"pounds sterling, English money"}],"glossary":[{"t":"purchase","d":"here, wealth seized from others (loot), not buying"},{"t":"strangers","d":"foreigners"},{"t":"treasure","d":"gold and silver"},{"t":"wares","d":"goods for sale"},{"t":"overplus","d":"the extra goods left after the kingdom's own needs are met"},{"t":"stock","d":"the nation's total wealth"}]},"P9":{"type":"passage","paragraphs":["The Dutch began their career in the East with no idea other than that of buying cheap and selling dear; their ideas and aims were purely commercial. The experience of a few years taught them that in a country like Java they could not deal satisfactorily with individual traders and that they must deal with governments. They were forced, before they knew it, to become politicians, seeking their commercial ends through diplomatic channels, and warriors, upholding the gains that had been given them by treaty. …","The series of instructions to the Governors General … bade the chief executive in Asia never to make war unless forced. … It seems to have been morally impossible for the Dutch officials to obey these directions in the face of all the temptations to break them. Men of vigor, like Governor General Coen*, who did much to shape the Company's military policy in its early period, came to the conclusion that trade and war were inseparable. … Coen wrote to the directors in 1614 \"that trade in Asia must be conducted and maintained under protection and favor of your own weapons, and that the weapons must be supplied from the profits enjoyed by the trade, so that trade cannot be maintained without war or war without trade.\""],"attribution":"Clive Day, historian at Yale University, The Policy and Administration of the Dutch in Java, published in 1904","translation":"Coen's letter translated from Dutch by Clive Day; \"India\" changed to \"Asia\" in Day's text and Coen's letter, to match its meaning; adapted","footnotes":[{"mark":"*","text":"Jan Pieterszoon Coen (1587–1629), leader of the Dutch East India Company (VOC) in Asia, who founded the Dutch base at Batavia (today's Jakarta) on Java in 1619"}],"glossary":[{"t":"bade","d":"ordered"},{"t":"the Company","d":"the Dutch East India Company (VOC), a joint-stock company chartered in 1602"},{"t":"Java","d":"a large island in today's Indonesia"},{"t":"inseparable","d":"unable to be pulled apart"}]},"P10":{"type":"passage","paragraphs":["With respect to books which were not written by the sages … which alarm the age, and astonish the common people … these all contain strange teachings which should be rooted out. …","From of old three teachings have been handed down. Besides the teaching of the learned [Confucianism], there are those of Dao and Fo [Daoism and Buddhism]. …","The teaching of the Western Ocean, which honors Tianzhu*, ranks also among those that are corrupt; but because these men understand mathematics, therefore the government employs them: of this you ought to be aware. To walk in these by-roads and deceive the people is what the law will not excuse. …","Soldiers and people! act according to the sacred instructions of the late emperor**; and stop the progress of these strange sects as you would that of floods, fires, robbers, and thieves. Indeed the injury of floods, fires, robbers, and thieves ends with the body; but that of false religions reaches the human heart."],"attribution":"The Yongzheng Emperor of Qing China, Amplified Instructions on the Sacred Edict, 1724, explaining its seventh rule, \"Degrade strange religions, in order to exalt the orthodox [Confucian] teaching\"; these instructions were read aloud to the public twice a month across the empire","translation":"Translated by William Milne (1817); names modernized; adapted","footnotes":[{"mark":"*","text":"\"Lord of Heaven,\" the Chinese name for the Christian God; \"the teaching of the Western Ocean\" is Roman Catholic Christianity, brought by Jesuit missionaries"},{"mark":"**","text":"the Kangxi Emperor (ruled 1661–1722), who issued the original Sacred Edict in 1670"}],"glossary":[{"t":"sages","d":"wise teachers of the past, especially Confucius"},{"t":"sects","d":"religious groups outside the approved teaching"},{"t":"by-roads","d":"side paths; wrong ways"}]},"P11":{"type":"passage","paragraphs":["In the first place, the efforts of the Spaniards to suppress not only the religious beliefs but also the ancient habits and customs of the Indians in other respects, and to make them conform to European methods of living, created friction between the two races*. The Indians, however, continued well grounded in their native religious beliefs and practices, and the Spaniards found it practically impossible to suppress them either by the number of missionaries brought in, or by the severity of the punishments inflicted. In 1675 these \"superstitious practices\" reached such alarming extremes that Governor Treviño determined to stamp them out for good. Having captured forty-seven medicine men, who were alleged to be guilty of sorcery and witchcraft, he hanged three of them … and inflicted severe punishment upon the others, among whom was a certain native named Popé. …","On being released from captivity in 1675, he returned to his pueblo, full of resentment for the Spaniards. He at once began making preparations for a general revolt. … Other influences, such as the belief that the Spaniards could all be driven out of the country, and the almost universal desire to return to their ancient customs, all operated to make the revolt of the Indians general."],"attribution":"Charles W. Hackett, historian, \"The Revolt of the Pueblo Indians of New Mexico in 1680,\" published in 1911, based on Spanish colonial records","translation":"Adapted","footnotes":[{"mark":"*","text":"Hackett, writing in 1911, uses \"Indians\" for the Pueblo peoples and \"two races\" for Pueblos and Spaniards. \"Superstitious practices\" was the Spanish officials' label for Pueblo religion."}],"glossary":[{"t":"pueblo","d":"a town of the Pueblo peoples of what is now New Mexico"},{"t":"medicine men","d":"Pueblo religious leaders and healers"},{"t":"general","d":"widespread; involving nearly everyone"}]},"P12":{"type":"passage","paragraphs":["The Sultan's hall was crowded with people, among whom were several officers of high rank. Besides these there were all the troopers of the Imperial guard … and a large force of Janissaries*; but there was not in all that great assembly a single man who owed his position to anything except his valor and his merit. No distinction is attached to birth among the Turks; the respect to be paid to a man is measured by the position he holds in the public service. … In making his appointments the Sultan pays no regard to any claims on the score of wealth or rank … he considers each case on its own merits, and examines carefully into the character, ability, and disposition of the man whose promotion is in question. It is by merit that men rise in the service. … Those who receive the highest offices from the Sultan are for the most part the sons of shepherds or herdsmen, and so far from being ashamed of their parentage, they actually glory in it. …","This is the reason that they are successful in their undertakings, that they lord it over others, and are daily extending the bounds of their empire. These are not our ideas; with us there is no opening left for merit; birth is the standard for everything; the prestige of birth is the sole key to advancement in the public service."],"attribution":"Ogier Ghiselin de Busbecq, ambassador of the Habsburg ruler Ferdinand I to the court of Ottoman Sultan Suleiman I, private letter written in 1555","translation":"Translated by C. T. Forster and F. H. B. Daniell (1881); adapted","footnotes":[{"mark":"*","text":"elite Ottoman infantry soldiers who served the sultan"}],"glossary":[{"t":"merit","d":"skill and good work"},{"t":"prestige of birth","d":"the respect a person gets for coming from a noble family"},{"t":"Turks","d":"Busbecq's word for the Ottomans"}]},"P13":{"type":"passage","paragraphs":["One of the great gifts which His Majesty the Shahanshah* made at the beginning of this year was the remission of the jizya** throughout India. … In spite of the disapproval of statesmen, and of the great revenue, and of much chatter on the part of the ignorant, this sublime decree was issued. …","When this tax was imposed in former times … the reason for it was that they [earlier rulers], on account of heart-rooted hatred, were set on the contempt and destruction of those of other faiths. … At the present day, when … those who belong to other religions have, like those of one mind and one religion, bound up the waist of devotion and service, and exert themselves for the advancement of the empire, how should they be classed with that old faction [non-Muslims seen as enemies in earlier times] and be the subjects of contempt? Moreover the main cause of levying the tax in old times was the neediness of the rulers. At this day, when there are thousands of treasures in the storehouses of the world-wide government … why should a just and wise mind apply itself to collecting this tax?"],"attribution":"Abu'l-Fazl, adviser and official historian of the Mughal emperor Akbar, the Akbarnama, written in the 1590s, describing a decree of 1564","translation":"Translated by Henry Beveridge (1907–1912); adapted","footnotes":[{"mark":"*","text":"\"King of kings,\" a title for Akbar (ruled 1556–1605)"},{"mark":"**","text":"a tax that Islamic states placed on non-Muslim subjects; in Mughal India most of the people who paid it were Hindus"}],"glossary":[{"t":"remission","d":"canceling a tax or debt"},{"t":"bound up the waist of devotion and service","d":"worked loyally"},{"t":"decree","d":"an official order from a ruler"},{"t":"revenue","d":"money the government collects"}]},"P15":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Nanban-Screens-by-Kano-Naizen-c1600.png/1280px-Nanban-Screens-by-Kano-Naizen-c1600.png","width":1280,"height":554,"alt":"A wide Japanese folding screen painted on gold showing a large European sailing ship, a crowd of Portuguese merchants with servants carrying goods, and priests in dark robes greeting them near Japanese shops.","caption":"On the left, a large Portuguese carrack (a three-masted ocean-going ship) lies at anchor while small boats bring people and cargo ashore. In the center, Portuguese merchants in tall hats and baggy trousers walk in a procession; attendants, several of them African (servants or enslaved people), carry chests and goods. On the right, Catholic priests in black and gray robes come out to greet them beside Japanese shops and a building used as a church.","attribution":"Kanō Naizen, Japanese painter, Arrival of the Southern Barbarians*, folding screen (ink, color, and gold leaf on paper), c. 1600","credit":"Kobe City Museum, Japan. Public domain image via Wikimedia Commons. *\"Southern Barbarians\" (Nanban) was the Japanese name for the Portuguese and Spanish, who came to Japan from the south.","description":"A very wide painting on a gold background. A dark three-masted European ship with flags sits in the water at left, with sailors in its rigging. Along the beach in the middle, a parade of Portuguese merchants wearing hats and puffed trousers is led by a richly dressed man under a parasol; attendants carry boxes, bundles, and a covered chair, and a white horse is led along. At right, Jesuit priests in black robes and friars in gray meet the arrivals near a row of Japanese shops, while Japanese people look on.","glossary":[{"t":"carrack","d":"a large sailing ship used by the Portuguese and Spanish for long ocean voyages"},{"t":"Jesuits","d":"an order of Catholic priests known for missionary work and education"}]},"P16":{"type":"bar","title":"Estimated Arrivals of Enslaved Africans Carried Directly from Africa, Selected Regions of the Americas","categories":["Brazil","British\nCaribbean","French\nCaribbean","Spanish\nAmericas","Dutch\nAmericas","Mainland\nN. America"],"series":[{"name":"1601–1700 (thousands)","values":[784,310,39,226,124,15]},{"name":"1701–1800 (thousands)","values":[1989,1813,995,146,295,295]}],"yLabel":"Thousands of people","text":"Estimates count people who survived the voyage from Africa and landed in each region. They do not count later voyages between ports in the Americas. Regions follow the database's categories; mainland North America is the area that later became the United States and Canada. The second period extends past 1750.","source":"Trans-Atlantic Slave Trade Database estimates, Slave Voyages (slavevoyages.org), Emory University"},"P14":{"type":"pair","items":[{"label":"Source 1","paragraphs":["The discovery of America, and that of a passage to the East Indies by the Cape of Good Hope, are the two greatest and most important events recorded in the history of mankind. … By uniting in some measure the most distant parts of the world, by enabling them to relieve one another's wants, to increase one another's enjoyments, and to encourage one another's industry, their general tendency would seem to be beneficial. To the natives, however, both of the East and West Indies, all the commercial benefits which can have resulted from those events have been sunk and lost in the dreadful misfortunes which they have occasioned. These misfortunes, however, seem to have arisen rather from accident than from anything in the nature of those events themselves. At the particular time when these discoveries were made, the superiority of force happened to be so great on the side of the Europeans, that they were enabled to commit with impunity every sort of injustice in those remote countries. …"],"attribution":"Adam Smith, Scottish economist, The Wealth of Nations, 1776","translation":"Adapted","glossary":[{"t":"East and West Indies","d":"Asia and the Americas"},{"t":"with impunity","d":"without being punished"}]},{"label":"Source 2","paragraphs":["The discovery of gold and silver in America, the extirpation, enslavement and entombment in mines of the native population, the beginning of the conquest and looting of the East Indies, the turning of Africa into a [hunting ground for enslaved people], signalled the rosy dawn of the era of capitalist production. … On their heels treads the commercial war of the European nations, with the globe for a theatre. …","These methods [colonies, national debt, taxes, and tariffs] depend in part on brute force, for example, the colonial system. But they all employ the power of the State, the concentrated and organized force of society, to hasten … the process of transformation of the feudal mode of production into the capitalist mode. … Force is the midwife of every old society pregnant with a new one."],"attribution":"Karl Marx, German philosopher and critic of capitalism, Capital, Volume 1, 1867","translation":"Translated by Samuel Moore and Edward Aveling (1887); offensive 1887 wording replaced in brackets; adapted","glossary":[{"t":"extirpation","d":"destruction; wiping out"},{"t":"entombment in mines","d":"being worked to death in mines"},{"t":"rosy dawn","d":"Marx is being sarcastic: the \"bright beginning\" was actually violent"},{"t":"capitalist production","d":"an economy in which private owners invest money to make profit"},{"t":"feudal mode of production","d":"an older economy of lords and peasants"}]}]}},"practice":[{"id":"U4-P01","set":"P1","topic":"4.2","lo":"C","skill":"3.A","difficulty":"easy","stem":"The answer \"in search of Christians and of spices\" in the first paragraph best reflects which motives for Portuguese exploration?","options":{"A":"Religious and commercial goals: finding Christian allies and reaching the spice trade","B":"A wish to escape religious persecution at home and settle in new lands","C":"A plan to conquer and colonize the interior of the Indian subcontinent","D":"Scientific curiosity about the plants, animals, and peoples of the Southern Hemisphere"},"answer":"A","explanation":"\"Christians\" points to religion: the Portuguese hoped to find Christian allies and spread their faith. \"Spices\" points to money: they wanted to buy spices at the source instead of through Muslim and Venetian middlemen.","whyNot":{"B":"The Portuguese were not fleeing persecution; they were sent by their king.","C":"Nothing here mentions conquering inland India; the Portuguese wanted ports and trade.","D":"The crew says they came for Christians and spices, not to study nature."},"hint":"Split the phrase in two. What does \"Christians\" tell you? What does \"spices\" tell you?"},{"id":"U4-P02","set":"P1","topic":"4.4","lo":"F","skill":"3.A","difficulty":"medium","stem":"The reaction to the Portuguese gifts in the second paragraph best shows that","options":{"A":"Calicut was a rich trading center whose officials found the Portuguese gifts too poor","B":"the people of Calicut had never before met or traded with merchants from foreign lands","C":"the Portuguese were welcomed as the most powerful traders in the Indian Ocean world","D":"Indian rulers preferred to trade with Christian merchants rather than Muslim ones"},"answer":"A","explanation":"The officials compared these gifts with richer gifts from other merchants. Their reaction shows how wealthy Calicut was, and that the Portuguese did not meet the court's expectations.","whyNot":{"B":"Merchants from Tunis were already in Calicut, and the officials compared the gifts with those from Mecca. The people of Calicut knew foreign traders well.","C":"The passage does not show Portuguese power in Indian Ocean trade. It shows local officials judging their gifts too poor.","D":"Muslim merchants were already trading in Calicut, and the officials compared the gifts with those from Mecca."},"hint":"Why would officials laugh at hats, cloth, and honey? What were they used to getting?"},{"id":"U4-P03","set":"P1","topic":"4.1","lo":"A","skill":"4.A","difficulty":"medium","stem":"Vasco da Gama's ability to sail from East Africa to Calicut was most directly aided by","options":{"A":"a treaty in which Ming China opened the Indian Ocean to European ships","B":"Ming Chinese warships that escorted the Portuguese fleet across the ocean","C":"sea charts given to the Portuguese by the ruler of Calicut","D":"a local pilot hired in East Africa who knew the monsoon wind patterns"},"answer":"D","explanation":"At Malindi in East Africa, da Gama hired a pilot who knew how to use the monsoon winds to cross the Indian Ocean. Europeans' ocean travel depended on knowledge from other peoples.","whyNot":{"A":"Ming China made no such treaty, and China did not control the Indian Ocean.","B":"Ming China's treasure fleets had stopped sailing by the 1430s, and they never escorted Portuguese ships.","C":"Calicut was da Gama's destination. Its ruler did not help him get there."},"hint":"Da Gama sailed around Africa. Who in the Indian Ocean already knew how to cross it?"},{"id":"U4-P04","set":"P2","topic":"4.2","lo":"C","skill":"2.B","difficulty":"easy","stem":"Columbus most likely emphasized the gold, spices, and cotton of the islands in order to","options":{"A":"warn other European rulers to keep their ships away from the Caribbean","B":"persuade the Taíno to trade their gold for Spanish goods","C":"show that the islands' people were already Christians","D":"convince the Spanish monarchs to keep paying for his voyages"},"answer":"D","explanation":"Columbus wanted the king and queen to pay for more voyages. Describing gold, spices, and cotton made the islands sound like a great investment.","whyNot":{"A":"The letter was printed and shared across Europe; it advertises riches instead of warning others away.","B":"The letter is written to a Spanish official, not to the Taíno.","C":"Columbus hopes the islanders \"might be led to become Christians,\" so they were not Christians yet."},"hint":"Who was paying for the voyages? What would make them want to pay again?"},{"id":"U4-P05","set":"P2","topic":"4.2","lo":"C","skill":"3.A","difficulty":"easy","stem":"Based on the third paragraph, Columbus hoped that his voyage would lead to","options":{"A":"a peaceful partnership in which the islands' people kept their land","B":"converts to Christianity and new wealth for Spain from the islands","C":"the end of Spain's wars with the Muslim states of North Africa","D":"a trade treaty between Spain and the emperor of China"},"answer":"B","explanation":"Columbus promised \"all the gold they require\" and talked about \"turning so many nations to our holy faith.\" He mixed religious goals with the hope of riches.","whyNot":{"A":"Columbus offers to ship the islanders as slaves, so he did not plan for them to keep control of their land.","C":"The paragraph does not mention North Africa.","D":"The paragraph talks about gold, spices, cotton, slaves, and converts, not a treaty with China."},"hint":"Find two kinds of rewards Columbus promises: one religious and one about money."},{"id":"U4-P06","set":"P2","topic":"4.3","lo":"D","skill":"5.B","difficulty":"medium","stem":"Which of the following was a long-term result of the encounter that Columbus describes?","options":{"A":"The Taíno formed a strong empire that resisted Spain for centuries","B":"Spain gave up its Caribbean claims to focus on trade with Asia","C":"The Taíno population collapsed because of disease and forced labor","D":"European crops failed to grow in the Americas, so colonists starved"},"answer":"C","explanation":"Disease, violence, hunger, and forced labor caused a steep drop in the Taíno population. Taíno people survived, and their descendants and cultures continue today.","whyNot":{"A":"Taíno communities suffered severe population losses. They did not form an empire that resisted Spain.","B":"Spain kept and expanded its Caribbean colonies.","D":"European crops and animals spread widely in the Americas as part of the Columbian Exchange."},"hint":"What effects did disease and Spanish rule have on Taíno communities after 1492?","reasoning":"Causation"},{"id":"U4-P07","set":"P3","topic":"4.3","lo":"D","skill":"5.B","difficulty":"easy","stem":"The most important cause of the trend shown in the table was","options":{"A":"epidemics of smallpox, measles, and other diseases new to the Americas","B":"large-scale migration of Indigenous people from Mexico to the Caribbean","C":"a series of volcanic eruptions that destroyed farmland in central Mexico","D":"the Spanish practice of shipping large numbers of Indigenous workers to labor in Spain"},"answer":"A","explanation":"The biggest killer was disease. Smallpox, measles, and other illnesses from Europe and Africa spread through people who had never been exposed to them. War, famine, and forced labor made the epidemics even deadlier.","whyNot":{"B":"Migration to the Caribbean does not explain a population loss this large. Epidemics, violence, hunger, and forced labor caused far greater losses.","C":"Volcanoes did not cause this decline.","D":"Some Indigenous people were taken to Europe, but that does not explain the population loss shown here."},"hint":"This is part of the Columbian Exchange. What invisible things crossed the ocean with Europeans?","reasoning":"Causation"},{"id":"U4-P08","set":"P3","topic":"4.4","lo":"F","skill":"5.B","difficulty":"medium","stem":"The trend shown in the table most directly contributed to which of the following in the Americas?","options":{"A":"the end of Spanish silver mining in central Mexico","B":"a shift by Indigenous survivors from farming to herding","C":"greater use of enslaved Africans and other forced labor","D":"large-scale migration of free workers from China to Mexico"},"answer":"C","explanation":"As Indigenous populations fell, colonists looked for more workers for mines and farms. They brought in more enslaved Africans and kept forcing Indigenous people to work.","whyNot":{"A":"Silver mining continued despite the population decline.","B":"Most surviving Indigenous people kept farming.","D":"Free Chinese workers did not migrate to Mexico in large numbers."},"hint":"How did colonists respond to these population losses?","reasoning":"Causation"},{"id":"U4-P09","set":"P3","topic":"4.3","lo":"D","skill":"2.C","difficulty":"easy","stem":"Which of the following is a limitation of the table as evidence?","options":{"A":"The figures are estimates from partial records, and other historians dispute them.","B":"The table shows only the population of the Caribbean islands, not Mexico.","C":"The table begins after the Spanish conquest was already over.","D":"The figures come from Aztec census takers who greatly exaggerated how many people died."},"answer":"A","explanation":"The note says these are estimates and that some historians think the starting number is too high. No one counted everyone in 1518, so historians argue about the exact numbers, even though all agree the drop was enormous.","whyNot":{"B":"The title says central Mexico.","C":"The table starts in 1518, before the conquest began in 1519.","D":"The note says the figures come from historians using Spanish tax and tribute records."},"hint":"Read the note under the table. Are these exact counts?"},{"id":"U4-P10","set":"P4","topic":"4.4","lo":"F","skill":"3.B","difficulty":"medium","stem":"Barbosa's description of Rander and Malacca best supports which of the following claims?","options":{"A":"Asian merchants still traded widely across the Indian Ocean after the Portuguese came.","B":"The Portuguese had already taken over nearly all Indian Ocean trade by the early 1500s.","C":"Indian Ocean trade was carried on mainly by Christian merchants from Europe.","D":"Trade between India and China had largely stopped by the early 1500s."},"answer":"A","explanation":"Barbosa, a Portuguese official, describes rich Muslim and Hindu merchants with their own big ships trading all over Asia. The Portuguese arrived, but Asian merchants kept trading.","whyNot":{"B":"Barbosa describes Muslim and Hindu merchants with their own ships trading widely, so the Portuguese had not taken over.","C":"The merchants Barbosa describes are Muslim and Hindu, not European Christians.","D":"Barbosa says goods from China could be found at Rander, so that trade continued."},"hint":"Who owns the ships in Barbosa's description?"},{"id":"U4-P11","set":"P4","topic":"4.4","lo":"F","skill":"5.B","difficulty":"easy","stem":"The trading activity described in the passage was most directly a continuation of","options":{"A":"the new Atlantic trade that linked Europe, West Africa, and the Americas","B":"the Silk Roads caravan trade run by the Mongol Empire","C":"the Hanseatic League's trade around the Baltic Sea","D":"older Indian Ocean networks of Muslim, Hindu, and other merchants"},"answer":"D","explanation":"Merchants had used the monsoon winds to trade across the Indian Ocean for centuries. Barbosa describes that same old network still running.","whyNot":{"A":"The places named (Malacca, Bengal, Sumatra, China) are in the Indian Ocean world, not the Atlantic.","B":"This is sea trade between ports, and the Mongol Empire had broken up by the 1300s.","C":"The Hanseatic League traded in northern Europe."},"hint":"Look at the place names. Which ocean are they in?","reasoning":"Continuity and Change"},{"id":"U4-P12","set":"P4","topic":"4.4","lo":"E","skill":"4.A","difficulty":"hard","stem":"Barbosa says merchants lived in Malacca \"up to now.\" This phrase most likely refers to the fact that","options":{"A":"China's Ming dynasty had recently conquered Malacca and closed it to foreign merchants","B":"an earthquake had recently destroyed most of Malacca's harbor","C":"Asian merchants stayed even after Portugal captured the city in 1511","D":"the Dutch East India Company had taken over Malacca's trade"},"answer":"C","explanation":"Portugal captured Malacca in 1511, a few years before Barbosa finished his book. \"Up to now\" means \"still, even today.\" Asian merchants kept living and trading there under Portuguese rule.","whyNot":{"A":"China did not conquer Malacca.","B":"Malacca's harbor kept operating.","D":"The Dutch did not take Malacca until 1641, long after Barbosa wrote."},"hint":"Barbosa finished his book around 1518. What happened to Malacca in 1511? Did the merchants leave?"},{"id":"U4-P13","set":"P5","topic":"4.4","lo":"E","skill":"3.A","difficulty":"easy","stem":"The passage suggests that an alliance with the Spaniards appealed to the Tlaxcalans mainly because","options":{"A":"they had long resisted the Mexica Empire and wanted to stay independent of it","B":"they had converted to Christianity and wished to serve the Spanish king","C":"they hoped the Spaniards would help them fight Spain's rivals in Europe","D":"they needed Spanish ships to carry salt and cotton across the Caribbean"},"answer":"A","explanation":"The Tlaxcalans say they had always fought to stay free of Moctezuma, who blocked them on all sides. An alliance with the Spaniards gave them a chance against their old enemy.","whyNot":{"B":"The passage says nothing about the Tlaxcalans becoming Christians.","C":"The Tlaxcalans' enemy was Moctezuma's empire, not European states.","D":"They mention lacking salt because the Mexica blocked it, not because they wanted ships."},"hint":"Who had the Tlaxcalans been fighting for generations?"},{"id":"U4-P14","set":"P5","topic":"4.4","lo":"E","skill":"5.B","difficulty":"easy","stem":"The alliance described in the passage most directly contributed to","options":{"A":"the Spanish defeat of the Mexica Empire in 1521","B":"the Spanish conquest of the Inca Empire in the 1530s","C":"a Mexica and Tlaxcalan alliance against the Spanish","D":"the crown's decision to make Tlaxcala independent of New Spain"},"answer":"A","explanation":"Thousands of Tlaxcalan and other Indigenous allies fought alongside the Spaniards. These alliances, along with disease and the siege, helped bring down Tenochtitlan in 1521.","whyNot":{"B":"The Inca were conquered by a different Spanish force in Peru; the Tlaxcalans fought in Mexico.","C":"The Tlaxcalans joined the Spanish against the Mexica, their longtime enemy.","D":"Tlaxcala received some special privileges, but it stayed part of New Spain."},"hint":"Which empire did the Tlaxcalans want to be free of, and what happened to it?","reasoning":"Causation"},{"id":"U4-P15","set":"P5","topic":"4.4","lo":"E","skill":"2.B","difficulty":"hard","stem":"Cortés's purpose in writing to the king most likely led him to","options":{"A":"play down the size and power of Moctezuma's empire","B":"present his actions as gaining loyal new subjects for the king","C":"describe the Tlaxcalans as stronger than the Mexica","D":"hide the fact that the Tlaxcalans had fought against him"},"answer":"B","explanation":"Cortés had gone to Mexico without full permission, so he wanted the king's approval. He shows the Tlaxcalans asking to join \"the royal service of Your Majesty,\" making himself look like he was winning subjects for the king.","whyNot":{"A":"Cortés stresses Moctezuma's \"great power,\" which makes his own success look bigger.","C":"The Tlaxcalans say they had to defend themselves against the Mexica, who surrounded them, so they were not stronger.","D":"Cortés openly says the Tlaxcalans asked pardon for their \"past errors\" of fighting him."},"hint":"Cortés wanted royal support. How might that goal shape his account?"},{"id":"U4-P16","set":"P6","topic":"4.5","lo":"I","skill":"5.B","difficulty":"medium","stem":"In trade with Asia, much of the silver described in the second paragraph was used by Europeans to","options":{"A":"repay loans from Chinese bankers who had paid for Spain's voyages","B":"buy enslaved workers in Asia to send to the silver mines of Potosí","C":"pay tribute to the Ottoman sultan in exchange for use of Mediterranean ports","D":"buy silk and porcelain from Chinese merchants"},"answer":"D","explanation":"Asian merchants wanted silver. Europeans used silver from the Americas to buy silk, porcelain, spices, and other goods. China's demand for silver was huge.","whyNot":{"A":"Chinese bankers did not pay for Spain's voyages. Spain borrowed mostly from European bankers, such as those in Genoa.","B":"Potosí's workers were mostly Indigenous Andeans. Asian captives did not supply the mines.","C":"Spain did not pay tribute to the Ottomans."},"hint":"Europeans wanted Asian goods. What could they pay with?","reasoning":"Causation"},{"id":"U4-P17","set":"P6","topic":"4.4","lo":"F","skill":"1.B","difficulty":"medium","stem":"Much of the labor described in the third paragraph was supplied through the mita, a system that","options":{"A":"brought indentured servants from Spain who worked in exchange for free passage","B":"paid free Indigenous workers wages set by supply and demand in the market","C":"adapted the Inca labor tax to force Indigenous men to work in the mines in turns","D":"relied on enslaved people captured in Africa as the main source of labor in the mines"},"answer":"C","explanation":"The Inca had a labor tax called the mit'a. The Spanish changed it into the mita, which forced Indigenous villages to send men to work in the silver mines for set periods. This is an example of continuity and change.","whyNot":{"A":"The mita drafted Indigenous Andeans, not Spanish servants.","B":"The mita required men to serve. Getting some pay did not make that service voluntary.","D":"The Potosí mines relied mostly on Indigenous Andean workers, not enslaved Africans."},"hint":"This system existed before the Spanish arrived. Which empire ruled the Andes before Spain?","reasoning":"Continuity and Change"},{"id":"U4-P18","set":"P6","topic":"4.4","lo":"E","skill":"2.A","difficulty":"medium","stem":"Acosta's statement that heaven gave the Kings of Spain power \"environing the whole world\" most likely reflects","options":{"A":"his view, as a Spanish Jesuit, that Spain's empire showed God's favor","B":"his criticism of the Spanish crown for spending too much on wars in Europe","C":"his belief that Spain should share its American silver with Portugal","D":"his support for Indigenous rebels who wanted to end Spanish rule"},"answer":"A","explanation":"Acosta was a Spanish Catholic priest. He saw Spain's huge, silver-rich empire as a sign that God favored the Spanish kings.","whyNot":{"B":"Acosta praises the kings' power here; he does not criticize their spending.","C":"Nothing in the passage suggests sharing silver with Portugal.","D":"Acosta describes Spain's power as a gift from heaven, not something to overthrow."},"hint":"Think about who Acosta was and who he served."},{"id":"U4-P19","set":"P7","topic":"4.4","lo":"E","skill":"3.A","difficulty":"medium","stem":"The passage best supports which claim about Kongo and Angola in the 1500s?","options":{"A":"Kongo's rulers stopped trading with the Portuguese once the king became a Christian.","B":"Kongo's rulers controlled early trade with the Portuguese, including the slave trade.","C":"The Portuguese had conquered Kongo and Angola by the early 1500s.","D":"Kongo and Angola traded mainly with Muslim merchants from the Indian Ocean coast."},"answer":"B","explanation":"Trade at Luanda happened \"by permission of the King of Kongo.\" At first, African rulers, not the Portuguese, decided who could trade. Portugal tried to conquer land only later.","whyNot":{"A":"The passage says the Lord of Angola kept trading with the Portuguese after Kongo's king became a Christian.","C":"The passage says Portugal began trying to conquer land only later, under Paulo Dias de Novais.","D":"The trade in the passage ran through Luanda and São Tomé, an Atlantic trade with the Portuguese."},"hint":"Who gave permission for trade at the port of Luanda?"},{"id":"U4-P20","set":"P7","topic":"4.5","lo":"K","skill":"1.B","difficulty":"easy","stem":"The conversion of Kongo's king described in the passage is an example of which broader development?","options":{"A":"the spread of Islam into Central Africa through the trans-Saharan caravan trade routes","B":"the spread of Christianity by sea, often adopted by rulers seeking trade and allies","C":"the decline of Christianity across Africa after Ethiopia was conquered","D":"the rejection of European religious teachings by most African rulers"},"answer":"B","explanation":"Portuguese ships brought Christian missionaries along with trade. Kongo's rulers became Christian, which also helped them build ties with Portugal.","whyNot":{"A":"Kongo's king became Christian, not Muslim, and the contact came by sea from Portugal.","C":"Christian rule survived in Ethiopia despite major wars, and the passage describes Christianity spreading in Kongo.","D":"Kongo's king accepted Christianity, so this is not a rejection."},"hint":"What religion did the Portuguese bring, and how did they arrive?"},{"id":"U4-P21","set":"P7","topic":"4.4","lo":"G","skill":"1.B","difficulty":"easy","stem":"The enslaved people sent to São Tomé, as described in the passage, were most often forced to work","options":{"A":"on sugar plantations on Atlantic islands and later in Brazil","B":"in silver mines in the Andes run by Spanish colonial officials","C":"in cotton textile workshops in the Indian region of Gujarat","D":"on rice farms in southern China owned by Portuguese merchants"},"answer":"A","explanation":"São Tomé was an early sugar colony worked by enslaved Africans. The same plantation system then spread to Brazil and the Caribbean.","whyNot":{"B":"The Andean mines relied mostly on Indigenous Andean workers drafted through the mita.","C":"Gujarat's textile workers were local Indian artisans.","D":"Portuguese merchants did not run rice farms in China."},"hint":"What crop did the Portuguese grow with enslaved labor on Atlantic islands?"},{"id":"U4-P22","set":"P8","topic":"4.5","lo":"H","skill":"3.A","difficulty":"easy","stem":"Mun's main argument is that a kingdom becomes wealthy by","options":{"A":"buying as many foreign goods as it can so that prices at home stay low","B":"collecting gifts and tribute from weaker nations instead of trading","C":"selling more abroad than it buys, so the difference comes in as gold and silver","D":"lending its gold and silver to foreign rulers in return for high rates of interest"},"answer":"C","explanation":"Mun's rule is to sell more to foreigners than you buy from them. The extra comes back as gold and silver. This idea is called mercantilism.","whyNot":{"A":"Mun says to sell more to foreigners than we buy from them, the opposite of buying as much as possible.","B":"Mun says gifts and wealth taken from other nations are \"uncertain and of small consideration.\"","D":"Mun does not discuss lending money to foreign rulers."},"hint":"Look for the word \"rule\" in the first paragraph."},{"id":"U4-P23","set":"P8","topic":"4.5","lo":"H","skill":"5.B","difficulty":"medium","stem":"Ideas like Mun's most directly encouraged European states to","options":{"A":"remove tariffs and other limits so they could trade freely with foreign nations","B":"charter trading companies and seek colonies for raw materials and markets","C":"end their competition with one another for colonies overseas","D":"forbid the sale of manufactured goods to their own colonies"},"answer":"B","explanation":"If wealth comes from selling more than you buy, colonies help: they supply cheap raw materials and buy finished goods. States chartered companies like the English and Dutch East India Companies to win this trade.","whyNot":{"A":"Mercantilists wanted to limit imports, not remove all tariffs.","C":"Mercantilism made competition for colonies stronger.","D":"Mercantilists wanted colonies to buy the home country's goods."},"hint":"How could colonies help a country sell more than it buys?","reasoning":"Causation"},{"id":"U4-P24","set":"P8","topic":"4.5","lo":"H","skill":"3.D","difficulty":"hard","stem":"Which of the following views most directly challenges Mun's argument?","options":{"A":"A country's wealth depends on the goods its people make and use, not on stored gold and silver.","B":"A state should protect its farmers and craftsmen from foreign competition by taxing imports.","C":"A state should give selected trading companies the sole right to trade in a region.","D":"Colonies should supply raw materials to industries in the home country and buy its goods."},"answer":"A","explanation":"Mun measures a nation's wealth by the treasure (gold and silver) it brings home. The correct choice uses a different measure: the goods people make and use. Adam Smith made this argument in 1776.","whyNot":{"B":"Taxing imports to protect home producers fits Mun's mercantilist goals; it does not challenge them.","C":"Trading companies with special rights, like the East India Company Mun worked for, fit mercantilism.","D":"Using colonies to supply raw materials and buy finished goods was a mercantilist idea."},"hint":"Which choice changes the way a country's wealth is measured?"},{"id":"U4-P25","set":"P9","topic":"4.5","lo":"H","skill":"3.A","difficulty":"medium","stem":"Day's main argument in the passage is that","options":{"A":"the Dutch directors at home planned from the start to conquer Java","B":"the Dutch carefully avoided war in Asia because their trade depended on peace with local rulers","C":"Dutch officials in Asia came to see military force as necessary to protect the Company's trade","D":"Javanese rulers forced the Dutch to leave the island by the middle of the 1600s"},"answer":"C","explanation":"Day argues the Dutch came only to trade, but officials like Coen decided they had to use force to protect that trade. Coen said trade and war could not be separated.","whyNot":{"A":"Day says the directors' orders were to avoid war; expansion came from officials on the spot.","B":"Day says officials found it \"morally impossible\" to obey orders to avoid war.","D":"The Dutch stayed and expanded on Java."},"hint":"Read Coen's quotation at the end. What two things did he say go together?"},{"id":"U4-P26","set":"P9","topic":"4.5","lo":"H","skill":"1.B","difficulty":"easy","stem":"The Dutch East India Company was a joint-stock company, which means that it","options":{"A":"was owned and run directly by the government of the Netherlands","B":"raised money by selling shares to investors who shared its profits and risks","C":"was a loose group of merchants who shared ships but each kept their own separate profits","D":"was a religious order that paid for missions with profits from trade"},"answer":"B","explanation":"A joint-stock company sells shares (stock) to many investors. They pool their money, share the risks, and split the profits. This let companies like the VOC pay for expensive voyages.","whyNot":{"A":"The VOC got powers from the government, but private investors owned it.","C":"In a joint-stock company, investors pool money and share the profits.","D":"The VOC was a business, not a religious order."},"hint":"Think about what \"stock\" means."},{"id":"U4-P27","set":"P9","topic":"4.5","lo":"H","skill":"5.A","difficulty":"medium","stem":"Coen's view of trade and war was most similar to the actions of","options":{"A":"the Tokugawa shogunate, which strictly limited contact with European merchants","B":"the Ming dynasty, which ended Zheng He's great naval voyages in the 1430s","C":"the Mughal emperor Akbar, who ended the jizya tax on non-Muslim subjects","D":"the Portuguese, who used warships and forts to control Indian Ocean ports"},"answer":"D","explanation":"Like Coen, the Portuguese used armed ships and forts to control ports and sea lanes in the Indian Ocean. Both mixed trade with military force.","whyNot":{"A":"The Tokugawa limited trade; they did not use force to win it overseas.","B":"The Ming ended their voyages instead of using them to win trade by force.","C":"Akbar's tax policy was about religion and loyalty, not using force to control trade."},"hint":"Which group also used cannons and forts to control trade at sea?","reasoning":"Comparison"},{"id":"U4-P28","set":"P10","topic":"4.4","lo":"E","skill":"3.A","difficulty":"easy","stem":"The passage shows that the Qing government viewed Christianity as","options":{"A":"a valuable teaching that should replace the ideas of Confucius","B":"the new official religion of the Qing emperor and his court","C":"a dangerous teaching, though its missionaries' math skills were useful","D":"a harmless teaching that ordinary people should be free to follow if they wished"},"answer":"C","explanation":"The edict calls Christianity \"corrupt\" and says the law will not excuse spreading it. But it admits the government employs the missionaries because they know mathematics.","whyNot":{"A":"The passage calls Christianity \"corrupt\" and praises Confucian teaching.","B":"Christianity is called corrupt; the emperors supported Confucian ideas.","D":"The passage warns people to stop \"strange sects\" like floods and fires."},"hint":"Find the word \"but\" in the third paragraph."},{"id":"U4-P29","set":"P10","topic":"4.4","lo":"E","skill":"5.A","difficulty":"medium","stem":"The Qing policy reflected in the passage was most similar to","options":{"A":"the Mughal emperor Akbar's welcoming of scholars from many faiths","B":"Spain's use of Catholic missionaries to convert the Indigenous peoples of the Americas","C":"the Kongo king's adoption of Christianity as the royal religion","D":"the Tokugawa shogunate's ban on Christianity and limits on contact with Europeans"},"answer":"D","explanation":"Both the Qing and the Tokugawa saw Christianity as a threat and limited European influence in their lands.","whyNot":{"A":"Akbar welcomed discussion among people of different faiths. This Qing passage restricts Christianity.","B":"Spain spread Christianity; the Qing tried to stop it.","C":"Kongo's king adopted Christianity; the Qing rejected it."},"hint":"Which other Asian state restricted Christians and Europeans?","reasoning":"Comparison"},{"id":"U4-P30","set":"P10","topic":"4.7","lo":"M","skill":"4.B","difficulty":"hard","stem":"The edict's support for \"the teaching of the learned\" (Confucianism) reflects the Qing emperors' effort to","options":{"A":"replace Confucianism with Buddhism as the main belief of the empire","B":"present themselves, as Manchu rulers, as protectors of Confucian tradition","C":"adopt European science and mathematics in place of traditional Chinese learning","D":"convince Manchu nobles to give up their own culture"},"answer":"B","explanation":"Qing rulers were Manchus from northeast Asia. Most of their subjects were Han Chinese. Supporting Confucian traditions helped the Qing claim the right to rule China.","whyNot":{"A":"The edict lists Buddhism among other teachings but praises the \"teaching of the learned\" (Confucianism).","C":"The edict uses missionaries for math but rejects their teaching.","D":"The Qing kept Manchu privileges and identity while supporting Confucian ideas."},"hint":"The Qing emperors were not Han Chinese. Why would they defend Chinese traditions?"},{"id":"U4-P31","set":"P11","topic":"4.6","lo":"L","skill":"3.A","difficulty":"easy","stem":"Hackett's main argument is that the Pueblo Revolt was caused primarily by","options":{"A":"a drought that forced the Pueblo people to move south","B":"Spanish efforts to suppress Pueblo religion and customs","C":"Pueblo anger over the arrival of English settlers","D":"competition between Pueblo towns over trade with Spain"},"answer":"B","explanation":"Hackett says the Spanish tried to wipe out Pueblo religion and customs, even punishing religious leaders like Popé. That anger led to the revolt.","whyNot":{"A":"Hackett does not mention drought in this passage.","C":"The colonists in New Mexico were Spanish, not English.","D":"Hackett describes Pueblo towns uniting, not competing."},"hint":"What were the Spanish trying to stop the Pueblo from doing?","reasoning":"Causation"},{"id":"U4-P32","set":"P11","topic":"4.6","lo":"L","skill":"5.A","difficulty":"easy","stem":"The Pueblo Revolt was most similar to which of the following?","options":{"A":"the Spanish conquest of the Mexica with Tlaxcalan allies","B":"the Japanese government's expulsion of Portuguese merchants","C":"Akbar's alliances with Hindu Rajput nobles in Mughal India","D":"Metacom's War against English colonists in New England"},"answer":"D","explanation":"Both were uprisings by Indigenous peoples against European colonists who threatened their land, religion, and way of life.","whyNot":{"A":"The conquest of the Mexica was a colonial conquest, not resistance to it.","B":"Japan's expulsion was a strong state's policy, not an uprising against colonists.","C":"Akbar's alliances brought groups into his empire; they were not a revolt."},"hint":"Look for another Indigenous uprising against colonists.","reasoning":"Comparison"},{"id":"U4-P33","set":"P11","topic":"4.6","lo":"L","skill":"2.C","difficulty":"medium","stem":"A historian studying the Pueblo Revolt would most likely point out which limitation of the passage?","options":{"A":"Hackett was a Pueblo religious leader who had a personal reason to exaggerate.","B":"Hackett wrote his account many years before the Pueblo Revolt took place.","C":"Hackett relied on Spanish colonial records that may leave out or distort Pueblo views.","D":"Hackett based his account only on Pueblo oral stories that were told centuries later."},"answer":"C","explanation":"Hackett used records made by Spanish officials. Some include Pueblo testimony, but Spanish questioning and translation could shape what was written. Pueblo views may be missing or twisted.","whyNot":{"A":"Hackett was an American historian, not a Pueblo leader.","B":"Hackett wrote in 1911, long after the revolt of 1680.","D":"The attribution says Hackett used Spanish colonial records."},"hint":"Check the attribution. Whose records did Hackett read?"},{"id":"U4-P34","set":"P12","topic":"4.7","lo":"M","skill":"3.A","difficulty":"easy","stem":"Busbecq claims that the Ottoman Empire's success came from","options":{"A":"giving the highest offices to members of old noble families","B":"promoting officials based on ability rather than family background","C":"relying on European advisers to run the government","D":"allowing officials to buy their positions from the sultan"},"answer":"B","explanation":"Busbecq says Ottoman officials rose by merit, not birth, and that \"this is the reason that they are successful.\"","whyNot":{"A":"Busbecq says the opposite: \"No distinction is attached to birth among the Turks.\"","C":"Busbecq does not mention European advisers.","D":"He says the sultan ignores wealth when he appoints officials."},"hint":"Find the sentence that starts \"This is the reason.\""},{"id":"U4-P35","set":"P12","topic":"4.7","lo":"M","skill":"1.B","difficulty":"medium","stem":"The system Busbecq describes was based in part on the devshirme, which","options":{"A":"gave land and high office only to the sons of old Turkish noble families","B":"let Christian nobles in the Balkans keep their lands in exchange for taxes","C":"chose officials through written exams on Islamic law and the Quran","D":"took Christian boys from the Balkans and trained them to serve the sultan"},"answer":"D","explanation":"Through the devshirme, the Ottomans took boys from Christian families in the Balkans. The boys became Muslims and trained as soldiers (Janissaries) and officials. They owed everything to the sultan, not to a noble family.","whyNot":{"A":"The devshirme drew from Christian village families, not Turkish nobles.","B":"The devshirme took boys for the sultan's service; it was not a tax deal with nobles.","C":"The devshirme did not work through written exams."},"hint":"Where did the Ottomans get the boys who became Janissaries?"},{"id":"U4-P36","set":"P12","topic":"4.7","lo":"M","skill":"2.B","difficulty":"hard","stem":"Busbecq's comparison in the second paragraph was most likely meant to","options":{"A":"persuade the sultan to adopt the European way of choosing officials by noble birth","B":"criticize European societies in which birth, not ability, decided who held power","C":"convince Habsburg rulers to give the Ottomans more territory","D":"praise European nobles for their loyalty to their kings"},"answer":"B","explanation":"Busbecq was a European diplomat writing a private letter. He contrasts Ottoman promotion by merit with what he describes as Europe's focus on noble birth. The comparison criticizes European leaders.","whyNot":{"A":"Busbecq praises the Ottoman system over Europe's, not the reverse.","C":"He is admiring Ottoman methods, not asking for land to be given up.","D":"He says Europe gives \"no opening\" for merit, which is a criticism."},"hint":"Is Busbecq praising or criticizing \"us\" (Europeans)?"},{"id":"U4-P37","set":"P13","topic":"4.7","lo":"M","skill":"3.A","difficulty":"easy","stem":"According to the passage, Akbar removed the jizya mainly because","options":{"A":"Muslim religious scholars at court demanded that the tax be ended","B":"non-Muslims now served the empire loyally and the treasury was already rich","C":"Hindu Rajput armies had defeated the Mughals and forced him to end it","D":"the tax was too hard to collect in the empire's far-off provinces"},"answer":"B","explanation":"Abu'l-Fazl gives two reasons: people of other religions now served the empire loyally, and the treasury had plenty of money.","whyNot":{"A":"The passage says the decree was issued in spite of disapproval, not because of a demand.","C":"The passage presents the decree as a gift, not a forced surrender.","D":"The passage does not mention problems collecting the tax."},"hint":"Look for \"At the present day\" and \"Moreover.\" Each starts a reason."},{"id":"U4-P38","set":"P13","topic":"4.7","lo":"M","skill":"5.A","difficulty":"medium","stem":"Akbar's policy toward non-Muslims was most similar to which of the following?","options":{"A":"Spain's expulsion of its Jewish subjects in 1492 and later of Muslim converts","B":"the Tokugawa shogunate's persecution of Japanese Christians","C":"the Ottoman Empire's acceptance of Jews expelled from Spain and Portugal","D":"Qing China's restrictions on Christian missionaries"},"answer":"C","explanation":"Both Akbar and the Ottoman sultans made room for people of other religions to strengthen their empires. The Ottomans welcomed Jews who were forced out of Spain and Portugal.","whyNot":{"A":"Spain pushed out religious minorities; Akbar included them.","B":"The Tokugawa persecuted a religious minority; Akbar welcomed his.","D":"The Qing restricted a foreign religion; Akbar welcomed other faiths."},"hint":"Find another empire that welcomed a religious minority.","reasoning":"Comparison"},{"id":"U4-P39","set":"P13","topic":"4.6","lo":"L","skill":"5.B","difficulty":"hard","stem":"Emperor Aurangzeb later brought back the jizya in 1679. This reversal most directly contributed to","options":{"A":"the rapid conversion of most of India's Hindus to Islam","B":"a long era of peace and unity across the Mughal Empire","C":"a successful Mughal conquest of the neighboring Safavid Empire in Persia","D":"greater resentment among many non-Muslim subjects of Mughal rule"},"answer":"D","explanation":"The tax was a separate burden on non-Muslim subjects. It added to anger toward Aurangzeb's rule. Maratha resistance had begun earlier and was also about land and political power.","whyNot":{"A":"Most Hindus did not convert; Hindus remained the majority in India.","B":"Aurangzeb's reign was full of wars and revolts.","C":"The Mughals did not conquer Safavid Persia."},"hint":"How might people react to a tax charged to members of certain religions?","reasoning":"Causation"},{"id":"U4-P40","set":"P14","topic":"4.8","lo":"N","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes a similarity between the two sources?","options":{"A
