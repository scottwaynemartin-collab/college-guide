ugh the grounds, some in kimono and some in Western-style suits and hats. A horse-drawn carriage arrives at lower right. The red label at upper right gives the title.","attribution":"Utagawa Kuniteru II, Japanese artist, Tomioka Silk Mill in Jōshū*, color woodblock print in three panels, published in Tokyo in 1872","credit":"National Diet Library, Japan. Public domain image via Wikimedia Commons. *Jōshū is an old name for the region that is now Gunma Prefecture.","description":"A very wide print made of three sheets side by side. Rows of long, two-story brick buildings with gray tiled roofs and many windows fill most of the picture, arranged around open courtyards. A tall round smokestack stands in the middle. People in the yards wear kimono or Western-style coats and hats; some ride horses, and a horse-drawn carriage enters at the lower right. Mountains rise in the background, and cherry trees bloom at the right edge. Red and yellow labels in the corners give the title, the artist's name, and the publisher.","glossary":[{"t":"silk mill","d":"a factory where silk thread is unwound (reeled) from cocoons"},{"t":"woodblock print","d":"a picture printed from carved wooden blocks; cheap prints like this were sold to the public"}]},"P12":{"type":"passage","paragraphs":["The Government rightly encouraged private enterprise, but when those thus encouraged happened to be men of no ability, what good could be expected. Therefore it became a matter of prime importance to have some enterprise set up on a large scale so as to attract men of ability to it, and to this end there was no better means than to start the system of joint-stock companies. … At the same time, if by means of joint-stock companies we can secure the prosperity of production and trade, we may thereby expect to promote the wealth and power of a nation. …","The first law enacted concerning private companies, after careful study of American and European institutions, was the Regulations for National Banks. … Thus the first joint-stock companies after Western models in this country were banks, and next came companies connected with shipping, railways, and insurance, to be followed by degrees by various industrial companies. … in 1873, the First National Bank was established. Hitherto, business in this country had consisted of small transactions, the public being ignorant of the advantages of conducting it on a joint-stock basis."],"attribution":"Shibusawa Eiichi, Japanese finance official who left government in 1873 to lead the First National Bank and found many companies, \"Joint-Stock Enterprise in Japan,\" in Fifty Years of New Japan, compiled by Count Ōkuma Shigenobu","translation":"English edition edited by Marcus B. Huish (London, 1909); adapted","glossary":[{"t":"private enterprise","d":"businesses owned by private people, not the government"},{"t":"joint-stock companies","d":"businesses owned by many investors who buy shares"},{"t":"hitherto","d":"until then"}]},"P13":{"type":"passage","paragraphs":["The history of all hitherto existing society is the history of class struggles. … Society as a whole is more and more splitting up into two great hostile camps, into two great classes, directly facing each other: Bourgeoisie and Proletariat. …","Owing to the extensive use of machinery and to division of labour, the work of the proletarians has lost all individual character, and consequently, all charm for the workman. He becomes an appendage of the machine. … Modern industry has converted the little workshop of the patriarchal master into the great factory of the industrial capitalist. Masses of labourers, crowded into the factory, are organised like soldiers. …","… The proletarians have nothing to lose but their chains. They have a world to win.\nWORKING MEN OF ALL COUNTRIES, UNITE!"],"attribution":"Karl Marx and Friedrich Engels, German socialist writers, The Communist Manifesto, 1848","translation":"Translated by Samuel Moore (English edition of 1888, edited by Engels); adapted","glossary":[{"t":"hitherto existing","d":"that have existed up to now"},{"t":"Bourgeoisie","d":"the class that owns factories, businesses, and capital"},{"t":"Proletariat / proletarians","d":"industrial workers who own nothing but their ability to work"},{"t":"appendage","d":"a part attached to something larger"},{"t":"patriarchal master","d":"the owner of a small, old-style workshop, who ran it like the head of a family"}]},"P14":{"type":"passage","paragraphs":["There is a class of Chinese who despise foreign methods, and without examining their excellences, contemptuously fling them aside with the remark that they are not specially mentioned in the Six Classics and the Histories of China. But what old method will suit the present day emergency? We challenge all these cavillers to produce an Ever Victorious Army* from the ancient drill, or protect our coast with old Chinese gunboats instead of with armored cruisers. By not adopting foreign methods we block our own way. …","To sum up: Chinese learning is moral. Western learning is practical. Chinese learning concerns itself with moral conduct. Western learning, with the affairs of the world. … If the Chinese heart throbs in unison with the heart of the sages, expressing the truth in irreprovable conduct, in filial piety, brotherly love, honesty, integrity, virtue; if government is loyalty and protection, then let government make use of foreign machinery and the railway from morning to night, and nothing untoward will befall the disciples of Confucius."],"attribution":"Zhang Zhidong, Qing official and governor-general of Hubei and Hunan provinces, Exhortation to Learning, 1898","translation":"From the English translation by Samuel I. Woodbridge, published under the title China's Only Hope (1900); adapted","footnotes":[{"mark":"*","text":"an army trained and led by Western officers that helped the Qing defeat the Taiping Rebellion in the 1860s"}],"glossary":[{"t":"Six Classics","d":"the ancient books at the heart of Confucian learning"},{"t":"cavillers","d":"people who make petty complaints"},{"t":"sages","d":"wise teachers of the past, especially Confucius"},{"t":"irreprovable","d":"blameless"},{"t":"filial piety","d":"respect and duty toward one's parents"},{"t":"untoward","d":"bad or harmful"}]},"P15":{"type":"pair","items":[{"label":"Source 1","paragraphs":["The boy. I am going fourteen; my sister is eleven. I have worked in Milnes's factory two years. She goes there also. … We go at half past five; give over at half past nine. I am now just come home. We sometimes stay till twelve. We are obliged to work overhours. … I asked to come away one night lately, at eight o'clock, being ill; I was told, if I went I must not come again. I am not well now. …","Mother. I have worked in the same mills myself. … There's many young ones in that hot room. There's six of 'em badly now, with bad eyes and sick headache. … I would prefer their coming home at seven, without additional wages."],"attribution":"Testimony of a family in Lenton, near Nottingham, England, to government commissioners investigating the work of children in factories, 1833","translation":"From the Reports of the Factory Commissioners (1833), as printed in Robinson and Beard, Readings in Modern European History, vol. 2 (1908); adapted","glossary":[{"t":"going fourteen","d":"almost fourteen years old"},{"t":"give over","d":"stop work"},{"t":"overhours","d":"overtime"},{"t":"badly","d":"sick"}]},{"label":"Source 2","paragraphs":["No one would accuse him* of a want of sympathy with the working classes; but this he would tell the House, that if they went on, at the bidding of the working classes, to legislate against the capitalists, they would find a very different feeling engendered among the latter towards the operatives. … [In his own factory] they had a large infant school, together with a reading room and news room, and a school for adults, where the workmen attended after working hours. …","He would warn the House that if they now armed the workmen against the capitalists by fixing by law ten hours, or any other number of hours for the duration of labor, and thus interfered with the established custom of the kingdom, he believed it would be impossible that the feeling which hitherto existed on the part of the manufacturers towards the operatives would continue. …"],"attribution":"John Bright, cotton-mill owner and member of the British Parliament, speech in the House of Commons opposing the Ten Hours Bill, a law to limit the workday of women and young people in textile mills, 1847","translation":"From the official record of debates (Hansard), as printed in Robinson and Beard, Readings in Modern European History, vol. 2 (1908); adapted","footnotes":[{"mark":"*","text":"The official record reports the speech in the third person, so \"he\" and \"him\" mean Bright."}],"glossary":[{"t":"a want of","d":"a lack of"},{"t":"the House","d":"the House of Commons, Britain's elected lawmaking body"},{"t":"engendered","d":"created"},{"t":"operatives","d":"factory workers"},{"t":"infant school","d":"a school for young children"}]}]},"P16":{"type":"bar","title":"Percentage of the Population Living in Towns and Cities of 10,000 or More People, England and Wales and Scotland, 1801–1891","categories":["1801","1851","1891"],"series":[{"name":"England and Wales","values":[21.3,39.5,61.7]},{"name":"Scotland","values":[17.0,32.2,49.9]}],"yLabel":"Percent of population","text":"The figures were calculated from British census counts, which were taken every ten years. Weber's table uses the label \"England\" for England and Wales.","source":"Adna Ferrin Weber, The Growth of Cities in the Nineteenth Century: A Study in Statistics, 1899, Table XXV(a), p. 59"}},"practice":[{"id":"U5-P01","set":"P1","topic":"5.1","lo":"A","skill":"3.A","difficulty":"easy","stem":"Rousseau's main claim in the passage is that a government is legitimate only when it","options":{"A":"rests on an agreement among the people and is guided by the general will","B":"is led by a king whose right to rule comes directly from God","C":"divides power among separate branches of government so that no single group rules alone","D":"is strong enough to make the people obey the laws it passes"},"answer":"A","explanation":"Rousseau asks what makes power \"legitimate,\" or rightful. His answer is a social contract. People agree to join together, and the \"general will\" of the whole people guides them.","whyNot":{"B":"Rousseau says rightful power comes from people joining together, not from God choosing a king.","C":"Dividing power among branches was Montesquieu's idea. Rousseau puts each person under \"the supreme direction of the general will.\"","D":"Force alone does not make a government rightful. Rousseau says its authority must rest on the people's shared agreement and the general will."},"hint":"Read the last paragraph. Who puts their power \"in common,\" and what directs it?"},{"id":"U5-P02","set":"P1","topic":"5.1","lo":"A","skill":"4.A","difficulty":"medium","stem":"Rousseau's ideas in the passage are best understood in the context of","options":{"A":"the Protestant Reformation, when reformers broke away from the Catholic Church","B":"the Enlightenment, when thinkers used reason to question traditional authority","C":"the Renaissance, when artists revived the styles of ancient Greece and Rome","D":"the rise of Social Darwinism, which applied ideas about evolution to whole societies"},"answer":"B","explanation":"Rousseau wrote in the 1700s. Thinkers like him used reason to ask what makes a government fair. They no longer simply accepted the power of kings and tradition.","whyNot":{"A":"The Reformation began in the 1500s and was mainly about religion. Rousseau wrote in 1762 about government.","C":"Renaissance thinkers also wrote about government. But Rousseau wrote in 1762, during the Enlightenment of the 1700s.","D":"Social Darwinism appeared in the late 1800s, more than 100 years after Rousseau wrote."},"hint":"When did Rousseau write? What big movement of ideas was going on in Europe then?"},{"id":"U5-P03","set":"P1","topic":"5.1","lo":"B","skill":"5.B","difficulty":"medium","stem":"Rousseau's statement that \"Man is born free\" would most likely have been used to support which of the following in the period 1750–1900?","options":{"A":"the founding of joint-stock companies to pay for railways and factories","B":"the Congress of Vienna's effort to restore kings to power after 1815","C":"campaigns to end slavery and serfdom","D":"laws that kept married women from owning property in their own names"},"answer":"C","explanation":"If every person is born free, then slavery and serfdom are wrong. Reformers used Enlightenment ideas like this one to push for abolition and an end to serfdom.","whyNot":{"A":"Joint-stock companies raised money for businesses. Rousseau's words are about freedom and rights, not business.","B":"The Congress of Vienna brought back monarchies and tried to stop revolutions. It worked against ideas like Rousseau's.","D":"Laws like these limited people's freedom. Reformers used Rousseau's words against such limits, not for them."},"hint":"What kind of reformer would want to argue that every human being is born free?","reasoning":"Causation"},{"id":"U5-P04","set":"P2","topic":"5.1","lo":"B","skill":"3.C","difficulty":"easy","stem":"Which of the following best describes a similarity between the two sources?","options":{"A":"Both apply arguments about human equality to women's legal and political rights.","B":"Both argue that women's political rights should depend on how much property they own.","C":"Both treat religion as the main cause of women's unequal status.","D":"Both present the right to vote as less urgent than the right to paid work."},"answer":"A","explanation":"Both sources argue that women should have rights that men already claim. Wollstonecraft asks who made men \"the exclusive judge\" if women can reason too. The Seneca Falls declaration says \"all men and women are created equal.\"","whyNot":{"B":"Source 2 complains that married women lose their property. Neither source says rights should depend on owning property.","C":"Source 2 says rights come from the \"Creator,\" but neither source blames religion as the main cause of women's unequal treatment.","D":"Neither source ranks paid work above voting. Source 2 lists the vote as a right that women were denied."},"hint":"What words about rights or reason show up in both sources?","reasoning":"Comparison"},{"id":"U5-P05","set":"P2","topic":"5.1","lo":"B","skill":"4.A","difficulty":"medium","stem":"Wollstonecraft's argument in Source 1 most directly challenged which feature of the French Revolution?","options":{"A":"efforts to reduce the legal privileges that nobles held by birth","B":"laws that took away the special privileges of the Catholic clergy","C":"the expansion of political rights for men while women remained shut out","D":"the claim that a rightful government rests on the consent of its citizens"},"answer":"C","explanation":"French revolutionaries spoke of freedom and equal rights, but women were kept out of political power. Wollstonecraft argues that this is \"inconsistent and unjust.\"","whyNot":{"A":"Wollstonecraft attacks \"tyrants of every denomination.\" She does not defend privileges based on birth.","B":"The passage says nothing in defense of the clergy. Her complaint is about how men treat women.","D":"Wollstonecraft accepts that men should be allowed \"to judge for themselves.\" Her complaint is that women are left out."},"hint":"What contradiction does she see between men's demands for freedom and the way they treat women?"},{"id":"U5-P06","set":"P2","topic":"5.1","lo":"B","skill":"5.B","difficulty":"medium","stem":"Movements like the one that produced Source 2 most directly contributed to which of the following by the early 1900s?","options":{"A":"equal voting rights for women in the United States by the end of the Civil War in 1865","B":"women winning the right to vote in some countries, such as New Zealand in 1893","C":"laws in most industrial countries that banned women from factory work","D":"a decline in women's role in reform movements such as abolition and temperance"},"answer":"B","explanation":"Women's rights activists kept demanding the vote after 1848. In 1893 New Zealand became the first self-governing country to let women vote in national elections. More countries followed in the 1900s.","whyNot":{"A":"Women did not win the vote in 1865. The Nineteenth Amendment barred denying citizens the vote because of sex in 1920, and other barriers still kept many women from voting.","C":"No such bans passed. Many working-class women kept working for wages in factories.","D":"Women's role in reform movements grew after 1848."},"hint":"Which later change addressed a right that the declaration says women lacked?","reasoning":"Causation"},{"id":"U5-P07","set":"P3","topic":"5.1","lo":"B","skill":"4.A","difficulty":"medium","stem":"The manifesto was issued most directly in the context of","options":{"A":"the Decembrist revolt of 1825, which had forced the tsar to accept a written constitution","B":"Russia's victory over the army that Napoleon led into Russia in 1812","C":"demands from Britain and France, Russia's allies in the Crimean War, that it end serfdom","D":"Russia's defeat in the Crimean War, which showed it needed to modernize"},"answer":"D","explanation":"Russia lost the Crimean War (1853–1856) to Britain, France, and the Ottoman Empire. The loss showed that Russia had fallen behind. Alexander II freed the serfs as one of several reforms to make Russia stronger.","whyNot":{"A":"The Decembrist revolt failed. Russia had no constitution until 1906.","B":"Russia's victory in 1812 was decades earlier. Its recent defeat in the Crimean War created more immediate pressure for reform.","C":"Britain and France fought against Russia in the Crimean War. They were its enemies, not its allies."},"hint":"Think about what happened to Russia's army in the 1850s. What did that show the tsar?","reasoning":"Causation"},{"id":"U5-P08","set":"P3","topic":"5.1","lo":"B","skill":"2.B","difficulty":"hard","stem":"The manifesto's praise for the nobility in the second paragraph most likely reflects","options":{"A":"the nobles' demand that the serfs be given land for free","B":"the nobles' success in persuading the tsar to keep serfdom in place","C":"the tsar's plan to take away the nobles' land and titles","D":"the tsar's need to keep the support of noble landowners during the reform"},"answer":"D","explanation":"The reform ended the nobles' legal power over the serfs, but nobles kept much of their land and local power. The tsar praised them to win their support.","whyNot":{"A":"The nobles wanted to keep their land. The manifesto says peasants must pay rent for their plots.","B":"The manifesto ends serfdom. It says the nobles gave up their rights over \"the personal servitude of the peasants.\"","C":"The manifesto says landowners keep \"all the rights of ownership\" over their lands."},"hint":"Why might a ruler praise a group whose legal rights he is reducing?"},{"id":"U5-P09","set":"P3","topic":"5.1","lo":"B","skill":"5.B","difficulty":"medium","stem":"Which of the following best describes a continuity for many Russian peasants after the reform?","options":{"A":"Most of them moved to factory towns within a few years.","B":"Many stayed poor and owed payments for the land they farmed.","C":"They were free to leave their village communities whenever they chose.","D":"They received ownership of their allotments without long-term payments."},"answer":"B","explanation":"The serfs became legally free, but they had to pay rent and later large payments to buy their land. Many stayed poor and tied to their village communities.","whyNot":{"A":"Most former serfs stayed in their villages for decades. Moving to cities grew slowly, later in the 1800s.","C":"Most former serfs stayed under the control of their village community, which shared the duty to make payments.","D":"The reform did not simply give peasants the land. They had to pay rent and later pay for their allotments over many years."},"hint":"Reread the last paragraph. What did the peasants still have to pay?","reasoning":"Continuity and Change"},{"id":"U5-P10","set":"P4","topic":"5.2","lo":"C","skill":"2.A","difficulty":"easy","stem":"In the first paragraph, the \"we\" whom Bolívar describes are best identified as","options":{"A":"Indigenous peoples whose ancestors lived in the Americas before the Spanish came","B":"peninsulares, people born in Spain who lived in Spanish America","C":"enslaved Africans and their descendants in Venezuela","D":"creoles, people of European descent born in the Americas"},"answer":"D","explanation":"Bolívar speaks for creoles, American-born people of Spanish descent. They claimed rights inherited from Europe (\"Europeans in right\") but wanted independence from Spanish rule.","whyNot":{"A":"Bolívar says \"we are not Indians.\" He describes a group in between.","B":"Bolívar's group is \"Americans by birth,\" so they were not born in Spain.","C":"Bolívar speaks about slavery later. Here \"we\" are \"Europeans in right\" who claim the land."},"hint":"Bolívar says \"Americans by birth and Europeans in right.\" Which group fits?"},{"id":"U5-P11","set":"P4","topic":"5.2","lo":"C","skill":"5.B","difficulty":"medium","stem":"Bolívar's call to free enslaved people, in the third paragraph, was influenced most directly by","options":{"A":"Britain's decision in 1819 to end slavery throughout its colonies","B":"the Haitian Revolution and the aid that Haiti's president gave Bolívar in 1816","C":"Spain's Constitution of 1812, which ended slavery across the Spanish empire","D":"the end of slavery in the United States after its Civil War"},"answer":"B","explanation":"Haiti was the first nation founded after enslaved people won their freedom. In 1816 Haiti's president, Alexandre Pétion, gave Bolívar ships and weapons. In return, Bolívar promised to free enslaved people in the lands he won.","whyNot":{"A":"Britain ended slavery in most of its colonies with a law passed in 1833, not in 1819.","C":"Spain's 1812 constitution did not end slavery. Spain kept slavery in Cuba and Puerto Rico for decades.","D":"Slavery in the United States ended in 1865, decades after this speech."},"hint":"Of the examples Bolívar names, which was a recent event in the Americas?","reasoning":"Causation"},{"id":"U5-P12","set":"P4","topic":"5.2","lo":"C","skill":"3.B","difficulty":"hard","stem":"Bolívar uses the phrase \"the triple yoke of ignorance, tyranny and vice\" to support his claim that","options":{"A":"the new republic should copy the federal system of the United States","B":"Spanish rule had left Americans with little experience of governing themselves","C":"the Catholic Church was mainly to blame for the people's lack of knowledge","D":"Venezuela should keep Spain's colonial laws and officials for now"},"answer":"B","explanation":"Bolívar claims that Spanish rule left Americans with little practice in governing themselves. He uses that claim to argue for a strong, stable republic.","whyNot":{"A":"Bolívar uses the phrase to show that the people were not yet ready for self-rule. In this speech he warned against copying the U.S. system.","C":"Bolívar blames the \"tyranny\" of Spanish rule. He does not single out the Church.","D":"Bolívar calls Spanish rule a \"yoke\" of tyranny. He wants a new republic, not Spain's colonial system."},"hint":"What does Bolívar say the people could not gain under the \"triple yoke\"?"},{"id":"U5-P13","set":"P5","topic":"5.2","lo":"C","skill":"3.A","difficulty":"easy","stem":"Mazzini's main goal, according to the passage, was","options":{"A":"a loose federation of Italian states, each keeping its own ruler","B":"an Italian kingdom under the protection of the Austrian emperor","C":"a single independent Italian republic","D":"a return to the separate city-states that existed during the Renaissance"},"answer":"C","explanation":"Mazzini calls Young Italy \"republican and unitarian.\" He wanted Italy to be one country. He also wanted it to be a republic, with no king.","whyNot":{"A":"Mazzini rejects federalism. He says it would leave Italy weak.","B":"Mazzini wants \"one independent sovereign nation\" and a republic, not a kingdom under a foreign power.","D":"Mazzini wants unity. Separate city-states are the opposite."},"hint":"Find the two words Mazzini uses to describe Young Italy."},{"id":"U5-P14","set":"P5","topic":"5.2","lo":"C","skill":"5.B","difficulty":"medium","stem":"The outcome of Italian unification differed from Mazzini's program in that the new Italian state","options":{"A":"was a loose federation of states, each with its own separate monarch","B":"placed the pope at the head of the national government","C":"recognized Austria as the protector of the Italian states","D":"was a kingdom ruled by the royal family of Piedmont-Sardinia"},"answer":"D","explanation":"Mazzini wanted a republic. Instead, Italy became a kingdom under King Victor Emmanuel II of Piedmont-Sardinia in 1861. Rome joined it in 1870.","whyNot":{"A":"Mazzini opposed a federation, and Italy did not become one. It became a single kingdom.","B":"The pope opposed unification and lost Rome to the new kingdom in 1870.","C":"Italy fought Austria to win Lombardy and Venetia. Austria was its enemy, not its protector."},"hint":"Who became the head of the new Italian state in 1861?","reasoning":"Comparison"},{"id":"U5-P15","set":"P5","topic":"5.2","lo":"C","skill":"5.A","difficulty":"medium","stem":"Mazzini's goals were most similar to the goals of","options":{"A":"Ottoman leaders who wanted to hold an empire of many peoples together","B":"German nationalists who wanted to join many German states into one nation","C":"Austrian officials who worked to stop liberal and national revolts after 1815","D":"Qing officials who defended Confucian traditions against Western ideas"},"answer":"B","explanation":"Like Mazzini, German nationalists wanted many small states, divided for centuries, to become one nation. Germany was unified in 1871.","whyNot":{"A":"Mazzini wanted a nation-state for one people. The Ottomans tried to keep many peoples in one empire.","C":"Austria opposed movements like Mazzini's. It ruled parts of northern Italy.","D":"These officials wanted to protect old traditions in their empire. They were not trying to unite a divided people."},"hint":"Mazzini wanted to join divided lands into one nation. Which choice describes the same goal?","reasoning":"Comparison"},{"id":"U5-P16","set":"P6","topic":"5.2","lo":"C","skill":"3.A","difficulty":"medium","stem":"Rizal's main argument in the passage is that","options":{"A":"Filipinos should take up arms against Spain at once to win their independence","B":"Filipinos should stop traveling to Europe for an education and should study at home instead","C":"Spain should send more soldiers to the islands to stop uprisings","D":"Spain must grant reforms like a free press, or the colonial system will change anyway"},"answer":"D","explanation":"Rizal gives Spain a warning. If Filipinos get no voice in the Cortes and no free press, he says, big change will come anyway. He hoped Spain would choose reform first.","whyNot":{"A":"Rizal warns that change will come, but he asks Spain for reform. He does not call for an armed revolt.","B":"Rizal praises the \"enlightened class\" that studied abroad.","C":"Rizal says revolts happen where people are forced to stay silent, so he asks for freedom, not force."},"hint":"What two things does Rizal say the government is refusing to allow?"},{"id":"U5-P17","set":"P6","topic":"5.2","lo":"C","skill":"5.B","difficulty":"medium","stem":"The \"enlightened class\" that Rizal describes most directly contributed to which of the following?","options":{"A":"a Filipino nationalist movement that rose up against Spain in 1896","B":"Spain's decision to give the Philippines back its seats in the Cortes in the 1880s","C":"the expansion of Spanish friars' control over the colonial government","D":"the United States' takeover of the islands from Spain in 1898"},"answer":"A","explanation":"Educated Filipinos spread ideas about a Filipino nation. Those ideas helped inspire the Katipunan's revolt against Spain in 1896. Rizal himself opposed the planned uprising, but Spain executed him that year.","whyNot":{"B":"Spain did not give Filipinos seats in the Cortes, which was one of Rizal's complaints.","C":"Rizal and other reformers criticized the power of Spanish friars. They wanted to reduce that power.","D":"The United States took the islands after defeating Spain in the Spanish-American War. Filipino reformers did not cause that war."},"hint":"Rizal says \"the spirit of the nation has been aroused.\" What did that spirit lead to?","reasoning":"Causation"},{"id":"U5-P18","set":"P6","topic":"5.2","lo":"C","skill":"5.A","difficulty":"hard","stem":"Rizal's call for reform was most similar to the actions of","options":{"A":"early leaders of the Indian National Congress","B":"Otto von Bismarck of Prussia","C":"leaders of the Taiping Rebellion in Qing China","D":"Tsar Alexander II of Russia"},"answer":"A","explanation":"The Indian National Congress, founded in 1885, at first asked Britain to give Indians more of a voice in government. Like Rizal, its educated members wanted reform within the empire.","whyNot":{"B":"Bismarck used a series of wars to unify Germany. Rizal asked for reform with words.","C":"The Taiping rebels fought a huge civil war to overthrow the Qing. Rizal asked for peaceful reform.","D":"Alexander II was a ruler making changes from the top. Rizal was a colonial subject asking his rulers for reform."},"hint":"Did Rizal call for war, or for change through words? Find a group that did the same.","reasoning":"Comparison"},{"id":"U5-P19","set":"P7","topic":"5.3","lo":"D","skill":"3.A","difficulty":"medium","stem":"Toynbee argues that the factory system grew mainly because of","options":{"A":"government orders that forced hand weavers to work together in large workshops","B":"a shortage of raw cotton that made spinning at home impossible","C":"skilled workers from India who brought new methods to England","D":"new machines and steam power, plus growing trade and better transport"},"answer":"D","explanation":"Toynbee lists new spinning machines and Watt's steam engine. He also says canals increased trade, so merchants gathered workers into workshops.","whyNot":{"A":"Toynbee says merchants gathered weavers to meet demand. He does not mention government orders.","B":"Toynbee describes the cotton industry growing, not running short of cotton.","C":"Toynbee names British inventors, including Hargreaves, Arkwright, Crompton, and Watt. He does not describe inventors arriving from India."},"hint":"Toynbee gives two reasons. One is in the first paragraph and one is in the second.","reasoning":"Causation"},{"id":"U5-P20","set":"P7","topic":"5.3","lo":"D","skill":"1.B","difficulty":"medium","stem":"Which of the following factors that helped Britain industrialize is best illustrated in the passage?","options":{"A":"colonial markets overseas that created demand for British cloth","B":"changes in farming that freed rural workers to take factory jobs","C":"coal and iron resources, linked by a growing network of canals","D":"banks and investors that supplied capital for new factories"},"answer":"C","explanation":"Toynbee mentions iron made with \"pit-coal\" and the growth of the canal system. Coal, iron, and good transport were key factors in Britain's Industrial Revolution. The other choices were also factors, but the passage does not show them.","whyNot":{"A":"Toynbee says trade grew because of better transport at home, such as canals. He does not discuss colonial markets.","B":"Changes in farming did help supply workers, but Toynbee does not discuss farming here.","D":"Capital mattered, but the passage does not mention banks or investors."},"hint":"Which choice is shown by details in the passage, not just by what you already know?","reasoning":"Causation"},{"id":"U5-P21","set":"P7","topic":"5.3","lo":"D","skill":"1.B","difficulty":"hard","stem":"Toynbee's statement that the new system \"meant a change from independence to dependence\" for workers most likely refers to the fact that","options":{"A":"workers came to depend on government relief, because machines left most of them without jobs","B":"spinners and weavers came to depend on the guilds for training and for permission to work","C":"families came to depend on food shipped from overseas, because they no longer farmed","D":"work moved into employers' workshops, where workers had less control over their daily work"},"answer":"D","explanation":"Many home workers already depended on merchants for materials and pay. In the new workshops they also worked under one roof, where the owner set the hours and the rules.","whyNot":{"A":"Toynbee is describing how work was organized. He does not say most workers lost their jobs or lived on relief.","B":"Guilds were fading in this period. The new system gathered workers under merchants, not guilds.","C":"The passage is about who controlled the work, not where food came from."},"hint":"Before factories, where did weavers work, and who controlled their time?","reasoning":"Continuity and Change"},{"id":"U5-P22","set":"P8","topic":"5.4","lo":"E","skill":"3.A","difficulty":"easy","stem":"Dutt's main argument in the passage is that","options":{"A":"British trade policies and machine-made goods ruined much of India's industry","B":"Indian rulers' refusal to trade with Europeans caused India's economy to decline","C":"British rule turned India into the world's leading maker of cotton cloth","D":"India had very little manufacturing before the British took control"},"answer":"A","explanation":"Dutt says Britain used tariffs and Company power to hold back Indian cloth makers, and British power-looms finished the job. India was pushed to grow raw cotton for British mills.","whyNot":{"B":"Dutt blames the East India Company and Parliament, not Indian rulers.","C":"Dutt says the opposite: Indian weavers lost their work.","D":"Dutt says India was \"a great manufacturing\" country in the 1700s."},"hint":"Who does Dutt blame, and what happened to India's weavers?"},{"id":"U5-P23","set":"P8","topic":"5.4","lo":"E","skill":"2.B","difficulty":"medium","stem":"Dutt's point of view in the passage was most likely shaped by","options":{"A":"his work as an Indian official and his concern for India's economy","B":"his belief that free trade with Britain had helped India's weavers compete","C":"his loyalty to the East India Company and its control of trade","D":"his belief that India should remain a mainly agricultural country"},"answer":"A","explanation":"Dutt was an Indian who served in the British government of India. He wrote to show how British rule had hurt India's economy, and he hoped for reforms.","whyNot":{"B":"Dutt says British policies and power-looms ruined India's weavers. He does not say trade helped them.","C":"Dutt calls the Company's trade rules \"selfish,\" so he was not loyal to it.","D":"Dutt regrets that India was forced to \"grow raw produce only.\""},"hint":"How might Dutt's work and concerns shape the part of British rule he emphasizes?"},{"id":"U5-P24","set":"P8","topic":"5.4","lo":"E","skill":"5.A","difficulty":"hard","stem":"The decline Dutt describes was most similar to the experience of","options":{"A":"silk reeling in Japan in the late nineteenth century","B":"cotton textile production in the northeastern United States in the early nineteenth century","C":"textile production in Egypt in the nineteenth century","D":"iron production in Belgium in the nineteenth century"},"answer":"C","explanation":"Producers in both India and Egypt faced competition from cheap British machine-made cloth. Both regions also came to export more raw cotton.","whyNot":{"A":"Japan's silk industry grew in the late 1800s and became a major export. Dutt describes an industry that shrank.","B":"New England's cotton mills grew in the early 1800s, helped by tariffs on imports. Dutt describes decline.","D":"Belgium's iron industry grew quickly, using nearby coal. Dutt describes decline."},"hint":"Which of these industries grew in the 1800s, and which struggled against British imports?","reasoning":"Comparison"},{"id":"U5-P25","set":"P9","topic":"5.5","lo":"F","skill":"3.A","difficulty":"easy","stem":"Wells's main point in the first paragraph is that improved steam engines","options":{"A":"replaced coal with oil as the main fuel for ships","B":"burned less coal, which left more room for cargo","C":"made sailing ships cheaper to run than steamships","D":"made ships smaller so that they carried less freight"},"answer":"B","explanation":"Older steamers had to carry large amounts of coal. More efficient engines used less fuel, so a ship of the same size could carry more goods.","whyNot":{"A":"Wells describes ships that still burned coal, just less of it.","C":"Wells praises the new steamers. Sailing ships are not his point.","D":"Wells says modern steamers carry 2,200 tons of freight instead of 800."},"hint":"Compare the tons of coal and of freight on the old ship and the new one."},{"id":"U5-P26","set":"P9","topic":"5.5","lo":"F","skill":"5.B","difficulty":"medium","stem":"The changes Wells describes most directly contributed to","options":{"A":"a sharp drop in European demand for food and raw materials grown on other continents","B":"more world trade in food and raw materials, such as American wheat sold in Europe","C":"the end of large-scale migration from Europe to the Americas","D":"Britain's return to mercantilist laws that limited imports"},"answer":"B","explanation":"Cheaper shipping lowered the cost of moving grain, meat, tea, sugar, and coffee. World trade grew, and farmers in places like the United States and Argentina sold more to Europe.","whyNot":{"A":"Cheaper shipping made it easier for Europe to buy food from far away.","C":"Steamships made migration cheaper and faster. Millions crossed the Atlantic.","D":"Britain kept free trade in this period, and cheap shipping brought in more imports."},"hint":"If shipping grain gets cheaper, what happens to trade in grain?","reasoning":"Causation"},{"id":"U5-P27","set":"P9","topic":"5.10","lo":"K","skill":"5.B","difficulty":"medium","stem":"Which earlier pattern continued in Wells's examples of sugar from Cuba and coffee from Brazil?","options":{"A":"Asian producers supplied overseas markets with finished cotton cloth.","B":"European governments granted chartered companies sole rights to trade.","C":"Economies in the Americas supplied overseas markets with plantation crops.","D":"European traders exchanged American silver for Asian luxury goods."},"answer":"C","explanation":"Plantations in the Americas had shipped sugar and coffee to overseas markets since colonial times. Cheaper steamship transport expanded this old trade. Cuba and Brazil still used enslaved labor until the 1880s.","whyNot":{"A":"India's exports of finished cloth fell in the 1800s. Wells's examples are farm crops, not cloth.","B":"Wells describes cheaper shipping, not companies with trade monopolies.","D":"Wells's examples are American crops shipped overseas, not silver traded for Asian goods."},"hint":"Who grew sugar and coffee, and for whom, before the 1800s?","reasoning":"Continuity and Change"},{"id":"U5-P28","set":"P10","topic":"5.6","lo":"G","skill":"3.A","difficulty":"easy","stem":"According to the passage, Muhammad Ali's goal was to","options":{"A":"let private Egyptian merchants build factories without help from the state","B":"make Egypt a major exporter of raw cotton instead of cloth","C":"hand Egypt's new factories over to British companies to run","D":"build a state-run textile industry using European machines and experts"},"answer":"D","explanation":"Muhammad Ali wanted Cairo to become \"a second Manchester.\" His government paid for European machines and models and hired European experts to train workers. It ran the mills and used Egyptian cotton.","whyNot":{"A":"The Pasha himself paid for machinery, hired experts, and forced workers into the mills.","B":"The passage says he \"determined to manufacture from the raw material,\" not just sell raw cotton.","C":"The factories belonged to the Pasha. He hired European experts but kept control."},"hint":"Who paid for the factories and gave the orders?"},{"id":"U5-P29","set":"P10","topic":"5.6","lo":"G","skill":"3.D","difficulty":"hard","stem":"A historian checking St. John's claim that Egyptian workers disliked factory work would find which additional source most useful?","options":{"A":"accounts by Egyptian mill workers describing how they came to the mills and how they were treated","B":"reports by the French and Italian engineers on how often the mill machines broke down and needed repair","C":"letters from Muhammad Ali ordering more machinery from European makers","D":"tax records showing how much cotton Egyptian farmers grew each year"},"answer":"A","explanation":"St. John describes how the workers felt, but he does not quote them. The workers' own accounts would let a historian check his claim and learn why they disliked the work.","whyNot":{"B":"Engineers' reports could show how well the machines ran, but not how the workers felt.","C":"These letters would show the Pasha's plans, not the workers' feelings.","D":"Tax records show how much cotton was grown, not how mill workers felt about their jobs."},"hint":"Which source would let you compare St. John's claim with the workers' own words?"},{"id":"U5-P30","set":"P10","topic":"5.6","lo":"G","skill":"5.B","difficulty":"medium","stem":"Muhammad Ali's factory program declined in the 1840s most directly because","options":{"A":"the new Suez Canal let cheap British cloth pour into Egypt and close the mills","B":"a French ban on selling factory machinery to Egypt left the mills without parts","C":"European powers forced him to shrink his army and accept free-trade treaties","D":"a long drought cut Egypt's cotton harvests through the 1840s"},"answer":"C","explanation":"In 1840–1841, Britain and other powers forced Muhammad Ali to give up Syria and make his army much smaller. An 1838 treaty between Britain and the Ottomans required an end to trade monopolies, and European pressure later forced him to accept its terms. With a smaller army to supply, his mills lost their biggest buyer.","whyNot":{"A":"The Suez Canal opened in 1869, long after the factories declined.","B":"French experts helped build and run the mills. France did not cut Egypt off from machinery.","D":"Egypt's cotton harvests kept growing, and it became a major cotton exporter."},"hint":"Think about what European powers made Muhammad Ali do in 1840–1841.","reasoning":"Causation"},{"id":"U5-P31","set":"P11","topic":"5.6","lo":"G","skill":"1.A","difficulty":"easy","stem":"The factory shown in the print is best understood as an example of","options":{"A":"a private silk business started by a wealthy merchant family","B":"the Tokugawa shogunate's effort to keep foreign technology out of Japan","C":"a foreign-owned factory built in one of Japan's treaty ports","D":"state-sponsored industrialization in Meiji Japan"},"answer":"D","explanation":"The Meiji government built the Tomioka Silk Mill in 1872 with French machines and French advisers. It was a model factory meant to show Japanese workers and investors how to run modern industry.","whyNot":{"A":"The Meiji government built and ran this mill. Private owners did not buy it until 1893.","B":"The shogunate had fallen by 1868. This mill used foreign machines and foreign experts.","C":"The Japanese government built and owned this mill. It was not run by foreign owners in a treaty port."},"hint":"What happened in Japan in 1868, and what did the new leaders want Japan to become?"},{"id":"U5-P32","set":"P11","topic":"5.6","lo":"G","skill":"2.B","difficulty":"medium","stem":"Prints like this one, sold to the public in Tokyo, were most likely made to","options":{"A":"promote silk exports to European buyers by advertising low prices","B":"recruit factory workers by describing their pay and working hours","C":"criticize officials for copying European building designs","D":"present modern industry as a sign of Japan's progress"},"answer":"D","explanation":"The print presents the mill's big brick buildings and modern visitors as sights worth seeing. Prints like this helped introduce the public to the changes of Meiji Japan.","whyNot":{"A":"The print shows buildings and visitors, not prices or goods for sale abroad. It was sold to the Japanese public.","B":"The print has no words about pay or hours. It shows the buildings and the crowds.","C":"Nothing in the print criticizes the mill or its builders. It shows the buildings in bright colors."},"hint":"Which features does the artist make most prominent, and how are they shown?"},{"id":"U5-P33","set":"P11","topic":"5.9","lo":"J","skill":"1.B","difficulty":"medium","stem":"Most of the workers who reeled silk in mills like this one were","options":{"A":"young women, many of them daughters of farming and former samurai families","B":"skilled male weavers who moved from Kyoto's old silk workshops","C":"French and Italian engineers who ran the machines themselves","D":"former samurai men who had lost their stipends after 1868"},"answer":"A","explanation":"At Tomioka and other mills, young women did most of the work. Some of the first workers came from former samurai families. Like working-class women in Europe, many sent their wages home to help their families.","whyNot":{"B":"Kyoto's weavers made cloth by hand. The mills hired mostly young women to reel thread.","C":"Foreign experts trained the workers, but Japanese women did most of the reeling.","D":"Some samurai families sent daughters to the mills, but the reelers were mostly young women, not samurai men."},"hint":"Who did the careful work of unwinding silk thread in Japan's mills?"},{"id":"U5-P34","set":"P12","topic":"5.7","lo":"H","skill":"3.A","difficulty":"easy","stem":"Shibusawa argues that joint-stock companies were important for Japan because they","options":{"A":"pooled money and talented people into large firms that would strengthen Japan","B":"allowed foreign investors to own and run Japan's new banks","C":"let the government take over the businesses that private Japanese families owned","D":"protected small shops from having to compete with large firms"},"answer":"A","explanation":"Shibusawa thought big companies would draw in able people and make Japan rich and strong. In a joint-stock company, many investors pool their money. That money built banks, railways, and factories.","whyNot":{"B":"Shibusawa says Japan's company laws were based on Western models, but he does not say foreigners owned the banks.","C":"Shibusawa wanted private companies to grow. The government encouraged \"private enterprise.\"","D":"Shibusawa wanted business on \"a large scale,\" not protection for small shops."},"hint":"What link does Shibusawa make between the size of businesses and Japan's strength?"},{"id":"U5-P35","set":"P12","topic":"5.7","lo":"H","skill":"1.A","difficulty":"medium","stem":"The banks described in the second paragraph are best understood as an example of","options":{"A":"state-run model factories that showed Japanese workers new methods","B":"trading houses that Western merchants set up in Japan's treaty ports","C":"new financial institutions that gathered savings to invest in industry","D":"government offices that collected Japan's new land tax in money"},"answer":"C","explanation":"Banks and stock companies let many people put their savings together. That money paid for shipping lines, railways, and factories. Financial institutions like these spread around the world in the 1800s.","whyNot":{"A":"Model factories like Tomioka made goods. Banks dealt in money and credit.","B":"Shibusawa describes Japanese banks set up under Japanese law, not foreign trading houses.","D":"Banks lend and invest money. The passage does not describe them collecting taxes."},"hint":"What do banks do with the money people put in them?"},{"id":"U5-P36","set":"P12","topic":"5.7","lo":"H","skill":"5.A","difficulty":"hard","stem":"Shibusawa's proposal to use Western business and industrial methods to strengthen Japan was most similar to which of the following?","options":{"A":"members of the Boxer movement, who attacked railways and foreigners in China","B":"Qing officials in the Self-Strengthening Movement, who built arsenals and shipyards","C":"members of Young Italy, who worked to unite the Italian states into a single independent republic","D":"Russian nobles who wanted to keep their serfs bound to the land"},"answer":"B","explanation":"Both wanted to borrow foreign methods to make their countries stronger. Shibusawa promoted banks and companies. Qing officials built shipyards, weapons factories, and other businesses.","whyNot":{"A":"The Boxers attacked foreign things. Shibusawa wanted to use Western methods.","C":"Young Italy sought political unification. Adopting Western business and industrial methods was not its main program.","D":"These nobles wanted to keep the old system, not build modern businesses."},"hint":"Compare how each group hoped to make its country stronger.","reasoning":"Comparison"},{"id":"U5-P37","set":"P13","topic":"5.8","lo":"I","skill":"3.A","difficulty":"easy","stem":"Marx and Engels's main argument in the passage is that","options":{"A":"factory owners and workers share the same interests and should cooperate","B":"workers should go back to small workshops run by master craftsmen","C":"factory owners and wage workers have opposing interests, so workers should unite","D":"governments should leave the economy alone so that free markets can work well for everyone"},"answer":"C","explanation":"Marx and Engels say history is a story of fights between classes. Now, they say, owners and workers face each other as enemies. They call on workers everywhere to unite.","whyNot":{"A":"The authors call the two classes \"two great hostile camps.\"","B":"They describe the old workshops as replaced by factories. They call for workers to unite, not to go back.","D":"That is the laissez-faire view. Marx and Engels attacked capitalism."},"hint":"How many \"great classes\" do the authors see, and how do they get along?"},{"id":"U5-P38","set":"P13","topic":"5.8","lo":"I","skill":"4.A","difficulty":"medium","stem":"The Communist Manifesto was written in the context of","options":{"A":"harsh factory conditions and growing political unrest in 1840s Europe","B":"the Chartist movement's success in winning the vote for most British working men","C":"the unification of the German states into one empire under the kingdom of Prussia","D":"the freeing of Russia's serfs, which had created a large new class of factory workers"},"answer":"A","explanation":"In the 1840s, factory workers faced long hours and crowded cities, and unrest was spreading. The Manifesto came out in early 1848, just as revolutions broke out across Europe.","whyNot":{"B":"Parliament rejected the Chartists' petitions in the 1840s. Many working men won the vote only after 1867.","C":"Germany was unified in 1871, more than 20 years later.","D":"Russia freed its serfs in 1861, more than ten years after the Manifesto."},"hint":"What were factory workers' lives like in the 1840s? What happened in Europe in 1848?"},{"id":"U5-P39","set":"P13","topic":"5.8","lo":"I","skill":"5.B","difficulty":"medium","stem":"Ideas like those in the passage most directly influenced","options":{"A":"the spread of laissez-faire policies that limited the government's role in Britain's economy","B":"socialist parties and labor movements that grew in Europe in the late 1800s","C":"the Qing dynasty's Self-Strengthening Movement","D":"the Catholic Church's defense of Europe's monarchies"},"answer":"B","explanation":"In the late 1800s, socialist parties formed in many countries, such as Germany's Social Democratic Party. Many used Marx's ideas to demand rights and power for workers.","whyNot":{"A":"Laissez-faire means less government role in the economy. Marx and Engels wanted workers to take power.","C":"Self-strengtheners were Qing officials trying to protect the empire, not followers of Marx.","D":"Marx and Engels attacked old rulers and the churches that supported them."},"hint":"Who would answer the call for \"working men of all countries\" to unite?","reasoning":"Causation"},{"id":"U5-P40","set":"P14","topic":"5.8","lo":"I","skill":"3.A","difficulty":"easy","stem":"Zhang Zhidong's main argument is that China should","options":{"A":"copy Japan by writing a constitution and creating an elected parliament","B":"replace Confucian learning with Western religion and Western law","C":"adopt Western technology while keeping Confucian moral values","D":"overthrow the Qing dynasty and set up a republic like those in the West"},"answer":"C","explanation":"Zhang says \"Chinese learning is moral. Western learning is practical.\" China could use foreign machines and railways and still keep Confucian values.","whyNot":{"A":"Zhang accepts foreign machines and railways, but he says government should rest on Chinese learning and \"loyalty and protection.\"","B":"Zhang says Chinese learning should guide morals. Only practical matters should be Western.","D":"Zhang was a Qing official who wanted to strengthen the empire, not end it."},"hint":"Which foreign changes does Zhang accept, and which Chinese values does he want to keep?"},{"id":"U5-P41","set":"P14","topic":"5.8","lo":"I","skill":"4.A","difficulty":"medium","stem":"Zhang's book is best understood in the context of","options":{"A":"China's success in ending its unequal treaties with the Western powers","B":"China's defeat by Japan in 1895, which showed the Qing army's weakness","C":"the founding of the Republic of China after the fall of the Qing","D":"Britain's decision to return Hong Kong to Qing rule"},"answer":"B","explanation":"Japan defeated China in 1894–1895. The loss shocked Qing leaders, because Japan had modernized quickly. Zhang wrote in 1898 to push for reform.","whyNot":{"A":"China was still bound by unequal treaties in 1898, and foreign powers were taking more land and rights.","C":"The Qing fell in 1911–1912, after this book was written.","D":"Britain did not give Hong Kong back. In 1898 it leased even more land next to Hong Kong."},"hint":"Think about what happened to China's army and navy in the mid-1890s. Why would that push an official to call for change?"},{"id":"U5-P42","set":"P14","topic":"5.8","lo":"I","skill":"3.A","difficulty":"hard","stem":"Which obstacle to reform is most directly illustrated by the critics Zhang describes in the first paragraph?","options":{"A":"concern that foreign experts would keep Chinese workers from learning new skills","B":"concern that factories would compete with farms for scarce workers","C":"concern that stronger provincial armies would break free of the Qing court","D":"concern that foreign methods lacked the authority of the Confucian classics"},"answer":"D","explanation":"The critics reject foreign methods because they are \"not specially mentioned in the Six Classics.\" Respect for the classics made many officials slow to accept Western ideas. Zhang argues that China can use foreign technology while keeping Confucian values.","whyNot":{"A":"Zhang's critics do not talk about foreign experts. They object that foreign methods are not in the classics.","B":"The passage does not mention farms or a shortage of workers.","C":"Regional armies were a real worry for the Qing, but Zhang's critics object to foreign methods, not to armies."},"hint":"What reason do the critics give for rejecting foreign methods?"},{"id":"U5-P43","set":"P15","topic":"5.8","lo":"I","skill":"3.C","difficulty":"easy","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Source 1 supports government ownership of the mills; Source 2 supports private ownership.","B":"Source 1 treats low wages as the main problem; Source 2 treats unsafe machines as the main problem.","C":"Source 1 claims that shorter hours would cut the mills' output; Source 2 claims that shorter hours would raise output.","D":"Source 1 presents long hours as harmful; Source 2 argues that a law on hours would hurt owner-worker relations."},"answer":"D","explanation":"The family links long hours to illness and exhaustion. Bright argues that a law limiting hours would damage relations between owners and workers.","whyNot":{"A":"Neither source discusses who should own the mills. Bright, a mill owner, opposes a law about hours.","B":"The mother would accept shorter hours \"without additional wages.\" Bright does not discuss safety.","C":"Neither source argues about output. The family talks about health, and Bright talks about owners' feelings toward workers."},"hint":"What does each source say about hours of work?","reasoning":"Comparison"},{"id":"U5-P44","set":"P15","topic":"5.8","lo":"I","skill":"2.B","difficulty":"medium","stem":"Bright's point of view in Source 2 is best explained by","options":{"A":"his position as a mill owner who opposed government rules for business","B":"his belief that Parliament should protect workers who could not bargain for themselves","C":"his Quaker faith, which led him to call for laws to protect children in the mills","D":"his work as a leader of a trade union of cotton spinners"},"answer":"A","explanation":"Bright owned a cotton mill and believed in laissez-faire, the idea that government should stay out of business. He argued that owners like him would care for workers on their own.","whyNot":{"B":"Bright argues against a law limiting hours. He wants owners and workers to settle such matters themselves.","C":"Bright was a Quaker, but in this speech he opposes a law to limit the hours of young workers.","D":"Bright speaks for the \"capitalists,\" the owners. A union leader would speak for the workers."},"hint":"Check the attribution. What did Bright own?"},{"id":"U5-P45","set":"P15","topic":"5.8","lo":"I","skill":"5.B","difficulty":"medium","stem":"Testimony like that in Source 1 most directly contributed to which of the following?","options":{"A":"the Combination Acts, which banned workers from forming unions","B":"a law giving adult men a ten-hour workday in 1833","C":"Factory Acts that limited the hours and work of children in British mills","D":"a law that set a minimum wage for British factory workers"},"answer":"C","explanation":"The Factory Act of 1833 banned most mill work for children under 9 and limited hours for older children. It also created factory inspectors. Later laws, like the Ten Hours Act of 1847, went further.","whyNot":{"A":"The Combination Acts came in 1799–1800, before this testimony, and were repealed in 1824.","B":"The 1833 law protected children. A ten-hour limit came in 1847, and it covered women and young people.","D":"Britain had no minimum wage law in this period. The factory laws limited hours and set rules for children."},"hint":"Government commissioners collected this testimony. What did Parliament do next?","reasoning":"Causation"},{"id":"U5-P46","set":"P16","topic":"5.9","lo":"J","skill":"3.B","difficulty":"easy","stem":"Which of the following claims is best supported by the chart?","options":{"A":"By 1891 most people in England and Wales lived in cities of 10,000 or more.","B":"The percentage of Scotland's population living in cities fell between 1851 and 1891.","C":"Scotland was more urban than England and Wales in each year shown.","D":"The city share grew faster in Scotland than in England and Wales after 1851."},"answer":"A","explanation":"The share for England and Wales reached 61.7 percent in 1891. That means more than half of the people there lived in cities of 10,000 or more.","whyNot":{"B":"Scotland's share rose from 32.2 to 49.9 percent.","C":"The bar for England and Wales is taller in every year shown.","D":"England and Wales rose 22.2 percentage points after 1851. Scotland rose 17.7 percentage points."},"hint":"Which claim can you prove from the percentages alone?"},{"id":"U5-P47","set":"P16","topic":"5.10","lo":"K","skill":"5.B","difficulty":"medium","stem":"The change shown in the chart was most directly caused by","options":{"A":"laws that forced many people living in cities to move back to farms in the countryside","B":"a large rise in the number of farm jobs in the British countryside","C":"factory jobs that drew people from the countryside into industrial towns","D":"the decline of coal mining and ironworks near British towns"},"answer":"C","explanation":"Factories, mines, and railways offered more jobs in towns. Many rural people moved to find work there. This helped raise the share of people living in cities.","whyNot":{"A":"This would help explain a falling city share. The chart shows a rising share.","B":"Farming needed fewer workers in this period, which pushed people toward towns.","D":"Coal and iron industries grew in this period, and they helped towns grow."},"hint":"Where were the new jobs in the 1800s?","reasoning":"Causation"},{"id":"U5-P48","set":"P16","topic":"5.9","lo":"J","skill":"1.B","difficulty":"medium","stem":"Which expectation became especially influential among urban middle-class families in nineteenth-century Britain?","options":{"A":"that wives would run the family's factories and banks alongside their husbands","B":"that wives would manage the home and children while husbands earned the main income","C":"that daughters would work long shifts in textile mills to help support the family","D":"that families would move to the countryside so that women could farm family land"},"answer":"B","explanation":"Many middle-class families promoted an ideal in which men earned the main income and women managed the home. Not all families followed this ideal. Many women also earned money or helped run family businesses.","whyNot":{"A":"Men held most business and political positions. Some women did help run businesses, but that was not the middle-class ideal.","C":"Mill work was common for working-class girls and women. It was not the ideal for middle-class daughters.","D":"Moving to farm was not the usual ideal for urban middle-class families. The chart itself does not show what work women did."},"hint":"The question asks about an ideal. How could that differ from what every woman actually did?","reasoning":"Continuity and Change"}],"exam":{"title":"Unit 5 Practice Exam: Revolutions","timeMinutes":25,"questionCount":25,"directions":"Each set of questions refers to a source: a primary source, a historian's writing, an image, or data. For each question, choose the best answer. Use the source and your knowledge of world history from c. 1750 to c. 1900. There is no penalty for guessing.","questions":[{"id":"U5-E01","set":"X1","topic":"5.1","lo":"A","skill":"4.A","difficulty":"hard","stem":"Articles 10 and 16 most directly reflect the ideas of Enlightenment writers such as","options":{"A":"Thomas Hobbes","B":"Voltaire and Montesquieu","C":"Edmund Burke","D":"Bishop Jacques-Bénigne Bossuet"},"answer":"B","rationales":{"A":"Incorrect. Hobbes wanted one supreme authority. It could be a single ruler or an assembly. Article 16 calls for separate powers.","B":"Correct. Article 10 protects religious opinions, as Voltaire urged. Article 16 calls for \"the separation of powers,\" Montesquieu's best-known idea.","C":"Incorrect. Burke defended tradition and opposed the French Revolution and its new declarations of rights.","D":"Incorrect. Bossuet taught that kings receive their power directly from God. That is the opposite of separating powers."},"explanation":"Enlightenment writers wanted to limit a ruler's power. Voltaire called for freedom of religion. Montesquieu said power should be split among separate parts of government."},{"id":"U5-E02","set":"X1","topic":"5.2","lo":"C","skill":"5.B","difficulty":"medium","stem":"The principle in Article 1 most directly contributed to which of the following developments in the 1790s?","options":{"A":"the return of absolute power to the French king","B":"calls for equal rights and an end to slavery in the colony of Saint-Domingue","C":"Britain's decision to give most adult men the right to vote in elections for Parliament","D":"the end of serfdom in the Russian Empire"},"answer":"B","rationales":{"A":"Incorrect. The French king lost his power in the 1790s and was executed in 1793.","B":"Correct. Free people of color in the French colony demanded equal rights in 1790, and enslaved people rose up in 1791. Both used the language of the French Revolution.","C":"Incorrect. Most British men could not vote until the late 1800s.","D":"Incorrect. Russia freed its serfs in 1861, about 70 years later."},"explanation":"The claim that people are born with equal rights helped people in Saint-Domingue challenge racial rules and slavery. Free people of color demanded equal rights, and enslaved people rose in revolt in 1791.","reasoning":"Causation"},{"id":"U5-E03","set":"X1","topic":"5.1","lo":"B","skill":"5.A","difficulty":"medium","stem":"Which of the following people would most likely have argued that the declaration did not go far enough?","options":{"A":"Olympe de Gouges","B":"Klemens von Metternich","C":"King Louis XVI","D":"Napoleon Bonaparte"},"answer":"A","rationales":{"A":"Correct. De Gouges wrote a Declaration of the Rights of Woman in 1791. She argued that women were citizens too, so the declaration fell short.","B":"Incorrect. Metternich worked to restore monarchies across Europe after 1815. He thought the Revolution went much too far.","C":"Incorrect. The king wanted to keep his power, which the National Assembly was working to limit.","D":"Incorrect. Napoleon later took power for himself, limited elections and the press, and brought back slavery in the French colonies in 1802. He did not argue that the declaration should give rights to more people."},"explanation":"The declaration gave rights to \"man and citizen\" but said nothing about women. Olympe de Gouges answered with her Declaration of the Rights of Woman and of the Female Citizen.","reasoning":"Comparison"},{"id":"U5-E04","set":"X2","topic":"5.2","lo":"C","skill":"4.A","difficulty":"medium","stem":"The proclamation was issued most directly in response to","options":{"A":"Napoleon's attempt to retake the colony and restore French control","B":"a British invasion that had ended slavery on the island","C":"France's 1794 decision to abolish slavery in its colonies","D":"Spain's attempt to take the colony after its army invaded in the 1790s"},"answer":"A","rationales":{"A":"Correct. In 1802 Napoleon sent an army to retake Saint-Domingue, and many feared he would bring back slavery. Dessalines's army defeated it.","B":"Incorrect. British troops invaded in the 1790s but were driven out, and they did not end slavery.","C":"Incorrect. The 1794 decree ended slavery and won support for France. The break came when Napoleon threatened that freedom.","D":"Incorrect. Spanish forces fought in the colony in the 1790s, but Spain gave up its claims in 1795. In 1804 the enemy was France."},"explanation":"Napoleon's army captured Toussaint Louverture, and the French seemed ready to bring back slavery. Dessalines's forces drove the French out, and he declared independence so they could never \"enslave us\" again.","reasoning":"Causation"},{"id":"U5-E05","set":"X2","topic":"5.2","lo":"C","skill":"2.B","difficulty":"hard","stem":"The third paragraph was most likely intended to","options":{"A":"call on enslaved people across the Caribbean to rise up and join the new state of Haiti","B":"assure nearby slaveholding colonies that Haiti would not stir up revolts there","C":"ask France to recognize Haiti in exchange for trade rights","D":"invite free people of color from the other islands to settle in Haiti"},"answer":"B","rationales":{"A":"Incorrect. Dessalines says the opposite: \"let our neighbours breathe in peace.\"","B":"Correct. Britain and Spain held nearby islands worked by enslaved people, and they feared Haiti's example. Dessalines promised to leave them in peace.","C":"Incorrect. The paragraph is about the neighboring islands, not France.","D":"Incorrect. The paragraph says nothing about inviting settlers. It promises to leave the neighboring islands alone."},"explanation":"Haiti was a new and fragile country surrounded by slaveholding colonies. Promising not to spread revolution may have helped it avoid attacks and keep trade going."},{"id":"U5-E06","set":"X2","topic":"5.2","lo":"C","skill":"5.A","difficulty":"medium","stem":"The Haitian Revolution differed from most Latin American independence movements in that it","options":{"A":"drew on Enlightenment ideas about liberty and natural rights","B":"won independence from a European colonial power","C":"was led largely by formerly enslaved people and ended slavery","D":"was led mainly by colonial-born white elites"},"answer":"C","rationales":{"A":"Incorrect. Both drew on these ideas, so this is a similarity, not a difference.","B":"Incorrect. Latin American movements also won independence, from Spain and Portugal.","C":"Correct. In Haiti, enslaved people rose up, defeated France, and ended slavery for good.","D":"Incorrect. That describes many Spanish American movements, not Haiti."},"explanation":"In Haiti, formerly enslaved people led a movement that abolished slavery and won independence. Colonial-born white elites led many independence movements in Spanish America, and slavery lasted for decades in some places.","reasoning":"Comparison"},{"id":"U5-E07","set":"X3","topic":"5.10","lo":"K","skill":"3.B","difficulty":"easy","stem":"Which of the following claims is best supported by the chart?","options":{"A":"Japan's share of world manufacturing grew faster than any other country's share.","B":"The United Kingdom made the largest share of the world's manufactured goods in both 1750 and 1900.","C":"China and India–Pakistan lost shares of world manufacturing, while the United Kingdom and the United States gained.","D":"Russia's share of world manufacturing fell by more than half between 1750 and 1900."},"answer":"C","rationales":{"A":"Incorrect. Japan's share fell, from 3.8 to 2.4 percent.","B":"Incorrect. China had the largest share in 1750, and the United States had it in 1900.","C":"Correct. China and India–Pakistan fell from a combined 57.3 percent to 7.9 percent. The United Kingdom and the United States rose from 2.0 percent to 42.1 percent.","D":"Incorrect. Russia's share rose, from 5.0 to 8.8 percent."},"explanation":"These are shares of world manufacturing, not amounts. China and India–Pakistan made more than half of the world's manufactured goods in 1750 but less than 8 percent in 1900. The United Kingdom and the United States together made more than 40 percent in 1900.","reasoning":"Continuity and Change"},{"id":"U5-E08","set":"X3","topic":"5.4","lo":"E","skill":"5.B","difficulty":"hard","stem":"The change in China's share between 1750 and 1900 shown in the chart was most directly caused by","options":{"A":"a Japanese conquest of China's main manufacturing regions","B":"a sharp fall in world demand for manufactured goods","C":"a Qing decision in the 1750s to open China's ports to free trade with European merchants","D":"the much faster growth of machine production in industrializing countries"},"answer":"D","rationales":{"A":"Incorrect. Japan did not conquer large parts of China until the 1930s.","B":"Incorrect. World demand for manufactured goods grew greatly in this period.","C":"Incorrect. In the 1750s the Qing limited Western trade to the port of Canton. China was forced to open more ports only after the Opium Wars.","D":"Correct. China still made most goods by hand. Factories in Britain, the United States, and other countries made far more, far faster."},"explanation":"China kept making goods, but industrial countries made many times more. As world output grew, China's part of the total shrank.","reasoning":"Causation"},{"id":"U5-E09","set":"X3","topic":"5.3","lo":"D","skill":"5.B","difficulty":"medium","stem":"The rise in the United Kingdom's share between 1750 and 1900 was helped most by","options":{"A":"coal and iron deposits, capital to invest, and raw materials from overseas","B":"government ownership of most of Britain's factories and mines","C":"large numbers of enslaved Africans brought to work in British textile factories","D":"the use of electric power in British factories during the 1700s"},"answer":"A","rationales":{"A":"Correct. These were the main ingredients of early industry, and Britain had all of them.","B":"Incorrect. Most British factories and mines were owned by private businesses.","C":"Incorrect. British factories hired wage workers. Enslaved people in the Americas grew much of the raw cotton, but they did not work in British factories.","D":"Incorrect. Electric power spread in the late 1800s, long after Britain began to industrialize."},"explanation":"Britain had what early factories needed: coal to run steam engines, iron to build machines, money to invest, and raw cotton from overseas trade and colonies. These advantages helped it industrialize first.","reasoning":"Causation"},{"id":"U5-E10","set":"X4","topic":"5.8","lo":"I","skill":"3.C","difficulty":"easy","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Source 1 calls for laws to limit child labor, while Source 2 opposes such laws.","B":"Source 1 focuses on adult men's wages, while Source 2 focuses on children's health.","C":"Source 1 calls factory work pleasant, while Source 2 calls it a loss of freedom.","D":"Source 1 blames workers for their poverty, while Source 2 blames the government."},"answer":"C","rationales":{"A":"Incorrect. Ure praises factory work and does not ask for limits. Engels is the critic.","B":"Incorrect. Ure writes about children, and Engels writes about the rules that every mill worker had to follow.","C":"Correct. Ure says the children were \"cheerful and alert.\" Engels says the factory is a kind of \"slavery.\"","D":"Incorrect. Ure does not discuss poverty here, and Engels blames the bourgeoisie, the factory owners."},"explanation":"Ure describes factory children as cheerful and healthy. Engels describes strict rules, fines, and long hours. The two writers give very different views of factory work.","reasoning":"Comparison"},{"id":"U5-E11","set":"X4","topic":"5.8","lo":"I","skill":"2.B","difficulty":"medium","stem":"Ure's account in Source 1 was most likely intended to","options":{"A":"defend factory owners against reformers who wanted laws to limit child labor","B":"persuade Parliament to pass a law that would ban children from working in mills","C":"encourage factory workers to form labor unions","D":"warn parents about the dangers of factory machinery"},"answer":"A","rationales":{"A":"Correct. In the 1830s reformers were pushing for shorter hours for children. Ure showed the mills in a good light to argue that such laws were not needed.","B":"Incorrect. Ure praises children's work in the mills, so he is not asking for a ban.","C":"Incorrect. Ure defends the factory system. He does not ask workers to organize.","D":"Incorrect. Ure says he saw no children being beaten and describes them as cheerful. He does not warn parents about dangerous machines."},"explanation":"Ure wrote in 1835, during a fight over factory laws. By describing cheerful children, he defended the factory system and its owners."},{"id":"U5-E12","set":"X4","topic":"5.8","lo":"I","skill":"5.B","difficulty":"medium","stem":"The ideas in Source 2 most directly contributed to","options":{"A":"the spread of laissez-faire economics in Britain","B":"the growth of socialist and communist ideas about the working class","C":"the rise of nationalist movements in Italy and Germany","D":"the Chartist movement's first demand that working men get the vote"},"answer":"B","rationales":{"A":"Incorrect. People who wanted the government to stay out of business defended factory owners. Engels attacked the owners.","B":"Correct. Engels later wrote The Communist Manifesto (1848) with Karl Marx. His study of workers in Manchester helped shape their ideas.","C":"Incorrect. Engels writes about class, not about nations.","D":"Incorrect. The Chartist movement began in 1838, before Engels wrote, and it focused on voting rights."},"explanation":"Engels saw the factory system as a struggle between owners and workers. That idea became the center of Marxist socialism.","reasoning":"Causation"},{"id":"U5-E13","set":"X4","topic":"5.9","lo":"J","skill":"4.A","difficulty":"hard","stem":"The working conditions described in both sources are best understood in the context of","options":{"A":"the domestic system, in which families spun and wove cloth in their own homes","B":"serfdom, in which peasants were legally bound to the land of a lord and owed him labor","C":"the factory system, in which workers' families, including children, worked for wages","D":"the guild system, in which master craftsmen trained apprentices for many years"},"answer":"C","rationales":{"A":"Incorrect. Both sources describe work in mills, not at home.","B":"Incorrect. Engels compares factory work to slavery to show how much power owners had. He is describing wage labor, not serfdom or people legally owned by employers.","C":"Correct. Working-class families in Britain often needed everyone's pay. So children and women worked in the mills.","D":"Incorrect. Guilds were an older way of organizing crafts. Mills hired workers for wages."},"explanation":"Both writers describe wage work in mills. In working-class families, children often worked so the family could get by, which is why child labor was so hotly debated."},{"id":"U5-E14","set":"X5","topic":"5.6","lo":"G","skill":"4.A","difficulty":"medium","stem":"The reforms described in the passage are best understood in the context of","options":{"A":"efforts to strengthen Japan after Western powers forced it to open its ports","B":"the unequal treaties' requirement that Japan build factories run by Western firms","C":"the Tokugawa shogunate's policy of tightly limiting trade with foreign merchants","D":"a samurai revolt that forced the government to send its foreign advisers home"},"answer":"A","rationales":{"A":"Correct. U.S. warships under Matthew Perry forced Japan to open in 1853–1854, and unequal treaties followed. Meiji leaders built industry so Japan could resist Western powers.","B":"Incorrect. The unequal treaties set low tariffs and gave foreigners special rights. They did not require Japan to build factories.","C":"Incorrect. The passage shows the opposite. After the shogunate fell, the new government opened Japan to foreign goods and ideas.","D":"Incorrect. Samurai did rebel in 1877, but the government defeated them and kept hiring foreign experts."},"explanation":"Western pressure showed Japan's leaders that their country was in danger. After the Meiji Restoration of 1868, they brought in foreign machines and knowledge to make Japan strong."},{"id":"U5-E15","set":"X5","topic":"5.6","lo":"G","skill":"5.A","difficulty":"medium","stem":"The Meiji government's establishment of model factories and technical schools was most similar to which of the following?","options":{"A":"Britain's reliance on private owners and free markets to build its industry","B":"the British East India Company's rule over much of India","C":"the Indian Rebellion of 1857 against British rule","D":"Muhammad Ali's state-run factories and modernized army in Egypt"},"answer":"D","rationales":{"A":"Incorrect. British industry grew mo
