<html lang="en">

<title>AP Practice Exam · AP World History: Modern · World Compass</title>

<style>/* ===================================================================
   World Compass · AP Practice Exam (AP World History: Modern)
   Tokens first (light, then html.dm dark), then components, then the
   World Compass theme layer and the source (passage/image) styles.
   =================================================================== */
:root{
  --navy:#1E2761;--navy-2:#2B3780;--gold:#C9A227;--gold-ink:#866C1A;--gold-2:#E3C464;--gold-soft:#F6EBC4;
  --paper:#F4F5F9;--paper-2:#EBEDF4;--card:#FFFFFF;
  --ink:#1A1D2E;--ink-2:#4A4F68;--ink-3:#61667D;
  --line:#D8DBE6;--line-2:#C3C8D9;
  --l1:#1E2761;--l1-soft:#E8EAF4;--l1-deep:#1E2761;
  --l2:#C9A227;--l2-soft:#F6EBC4;--l2-deep:#866C1A;
  --l3:#7E2433;--l3-soft:#F6E7E9;--l3-deep:#7E2433;
  --sun:#C9A227;--sun-soft:#F6EBC4;--mint:#0F6E6A;--mint-soft:#E1F1F0;--pink:#7E2433;--pink-soft:#F6E7E9;
  --red:#B42318;--red-soft:#FBE9E7;--green:#1E7F4F;--green-soft:#E4F3EA;
  --r:14px;--r-sm:10px;--r-lg:20px;
  --sh:0 1px 2px rgba(30,39,97,.06),0 6px 18px rgba(30,39,97,.08);
  --sh-lg:0 2px 4px rgba(30,39,97,.10),0 14px 34px rgba(30,39,97,.16);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:Arial,Helvetica,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --green-deep:#17613C;--red-deep:#912018;--amber:#8A5A00;--amber-soft:#FBF0D5;--amber-line:#E7C979;
  --focus:#C9A227;
  /* unit palette: the World Compass home page's unit colors */
  --u1:#7E2433;--u1-soft:#F6E7E9;--u1-deep:#7E2433;
  --u2:#0F6E6A;--u2-soft:#E1F1F0;--u2-deep:#0F6E6A;
  --u3:#1F5E3B;--u3-soft:#E3F0E8;--u3-deep:#1F5E3B;
  --u4:#0F4C81;--u4-soft:#E2ECF6;--u4-deep:#0F4C81;
  --u5:#A4262C;--u5-soft:#F9E6E7;--u5-deep:#A4262C;
  --u6:#9A5B1E;--u6-soft:#F6ECE0;--u6-deep:#8A5019;
  --u7:#3F4A5C;--u7-soft:#E8EAEE;--u7-deep:#3F4A5C;
  --u8:#5B2C83;--u8-soft:#EEE6F5;--u8-deep:#5B2C83;
  --u9:#C2410C;--u9-soft:#FBE9DF;--u9-deep:#A8380A;
  /* stimulus colors */
  --stim-water:#DCE6F3;--stim-land:#EDE6D3;--stim-land-stroke:#B9AF93;--stim-power:#D8D2E6;--stim-small:#FBF7EA;
  --zone-0:#8DB4F0;--zone-1:#ADCAF5;--zone-2:#CDDFF9;--zone-3:#E8F0FD;
  --pc-blue:#CFE0FF;--pc-orange:#FFD9C7;
  --bar-1:#1E2761;--bar-2:#C9A227;--chart-grid:#E3E5EE;
  --claim-a:#0F4C81;--claim-b:#7E2433;--lane:#1A1D2E;--conflict:#B42318;--base-n:#5B2C83;--base-s:#0F6E6A;
  --psg-bg:#FFFFFF;--psg-rule:#C9A227;
}
html.dm{
  --navy:#0B0E22;--navy-2:#1B2046;--gold:#E3C464;--gold-ink:#E3C464;--gold-2:#F0D98C;--gold-soft:#3A3214;
  --paper:#0E1126;--paper-2:#161A36;--card:#171B39;
  --ink:#ECEEF8;--ink-2:#C3C7DE;--ink-3:#9AA0BF;
  --line:#2A3058;--line-2:#3A4170;
  --l1:#E3C464;--l1-soft:#262B52;--l1-deep:#E3C464;
  --l2:#E3C464;--l2-soft:#3A3214;--l2-deep:#F0D98C;
  --l3:#F0A9B4;--l3-soft:#3A1820;--l3-deep:#F0A9B4;
  --sun:#E3C464;--sun-soft:#3A3214;
  --red:#E5534B;--red-soft:#3A1416;--green:#3FB27A;--green-soft:#12301F;
  --green-deep:#8BE0B2;--red-deep:#F6A39D;--amber:#F2C25B;--amber-soft:#3A2E10;--amber-line:#7A6224;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  --sh-lg:0 2px 4px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.45);
  --u1-soft:#3A1820;--u1-deep:#F0A9B4;--u2-soft:#0F3534;--u2-deep:#7FD6CF;--u3-soft:#143524;--u3-deep:#8FD8AE;
  --u4-soft:#102C4A;--u4-deep:#9CC6F0;--u5-soft:#3D1517;--u5-deep:#F4A3A6;--u6-soft:#3A2614;--u6-deep:#E9B98A;
  --u7-soft:#262C38;--u7-deep:#C2CBDB;--u8-soft:#2C1A42;--u8-deep:#CDB2EC;--u9-soft:#3D1E10;--u9-deep:#F6B08E;
  --stim-water:#172B4D;--stim-land:#3A3550;--stim-land-stroke:#6B668A;--stim-power:#3B3560;--stim-small:#2A2548;
  --bar-1:#9CC6F0;--bar-2:#E3C464;--chart-grid:#2A3058;
  --psg-bg:#141833;--psg-rule:#B8962C;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
html,body{margin:0;background:var(--paper)}
body{color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,.disp{font-family:var(--display);font-weight:600;letter-spacing:-.01em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
a{color:var(--l1-deep)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700}
.skip:focus{top:12px}
.app{min-height:100%;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:22px 20px 56px}
@media (max-width:640px){main{padding:14px 14px 48px}}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(251,248,242,.88);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}

.bar-in{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;min-height:60px}
@media (max-width:640px){.bar-in{padding:8px 12px;gap:8px}}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:19px;color:var(--ink);text-align:left;min-height:44px;padding:0 4px;border-radius:12px}
.brand svg{width:32px;height:32px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);line-height:1;margin-bottom:3px}
.brand .bt{line-height:1.05}
.bar-ctx{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-2);font-size:14px;min-width:0}
.bar-ctx{flex:0 1 auto}.bar-ctx .ellip{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sp{flex:1}
.bar-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.brand .bt{display:none}.brand small{display:none}.bar-ctx{font-size:13px}}

/* unit pill used in the bar and cards */
.upill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--uc-soft);color:var(--uc-deep);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.02em;white-space:nowrap}
.upill i{width:8px;height:8px;border-radius:50%;background:var(--uc);display:inline-block}

/* ---------- buttons ---------- */
.act{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;font-weight:700;font-size:15px;line-height:1.2;border:2px solid transparent;transition:transform .12s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;white-space:nowrap;text-decoration:none}
.act:active{transform:translateY(1px)}
.act:disabled{opacity:.45;transform:none}
.act.primary{background:var(--ink);color:#fff;box-shadow:var(--sh)}
.act.primary:hover:not(:disabled){box-shadow:var(--sh-lg);transform:translateY(-1px)}
html.dm .act.primary{background:var(--gold);color:#0E1126}
.act.blue{background:var(--l1);color:#fff;box-shadow:var(--sh)}
.act.blue:hover:not(:disabled){background:var(--l1-deep);transform:translateY(-1px)}
html.dm .act.blue{color:#fff}
.act.unit{background:var(--uc);color:var(--uc-text,#fff);box-shadow:var(--sh)}
.act.unit:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--sh-lg)}
.act.ghost{background:var(--card);color:var(--ink);border-color:var(--line-2)}
.act.ghost:hover:not(:disabled){border-color:var(--ink-3);transform:translateY(-1px)}
.act.soft{background:var(--paper-2);color:var(--ink-2)}
.act.soft:hover:not(:disabled){background:var(--line)}
.act.quiet{background:transparent;color:var(--ink-2);padding:8px 12px;font-weight:700}
.act.quiet:hover:not(:disabled){background:var(--paper-2)}
.act.sm{min-height:40px;padding:8px 14px;font-size:14px}
@media (pointer:coarse),(max-width:899px){.act.sm,.seg button,.tchip{min-height:44px}}
.act.wide{width:100%}
.act .ic{width:18px;height:18px;flex:none}
.act[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts.center{justify-content:center}
.acts.between{justify-content:space-between}
.acts.end{justify-content:flex-end}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:7px;border:1px solid var(--line-2);background:var(--paper-2);font:700 12px/1 var(--mono);color:var(--ink-2)}

/* ---------- surfaces ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
@media (max-width:640px){.panel{padding:16px;border-radius:16px}}
.panel.flat{box-shadow:none}
.eyebrow{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.tag-meta{display:inline-flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.tag-meta b{font-weight:800;color:var(--ink-3)}
.note{font-size:13.5px;color:var(--ink-3);line-height:1.5}

/* ---------- start screen ---------- */
.hero{text-align:center;padding:26px 0 22px;position:relative}
.hero h1{font-size:clamp(34px,6vw,54px);font-weight:600;color:var(--ink);letter-spacing:-.02em}
.hero h1 .gl{background:linear-gradient(90deg,var(--l1),var(--l3) 55%,var(--l2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin:10px auto 0;max-width:620px;font-size:17px;color:var(--ink-2)}
.kpis{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0 6px}
.kpi{display:flex;flex-direction:column;align-items:center;min-width:132px;padding:12px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.kpi .v{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;color:var(--ink)}
.kpi .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}
.ucd{position:relative;min-width:0;display:flex;flex-direction:column;gap:12px;padding:20px 20px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.ucd::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--uc)}
.ucd.live:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.ucd .uh{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ucd .un{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--uc-soft);color:var(--uc-deep);font-family:var(--display);font-weight:600;font-size:18px}
.ucd h3{font-size:21px;line-height:1.15;color:var(--ink)}
.ucd .best{font-size:12.5px;font-weight:800;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.ucd .best .ok{color:var(--green-deep)}
.ucd .ubtns{display:grid;gap:8px;margin-top:auto}
.ucd .ubtns .act{justify-content:space-between;padding:10px 14px;min-width:0;white-space:normal;flex-wrap:wrap;text-align:left;row-gap:2px}
.ucd .ubtns .act small{font-weight:600;font-size:12.5px;opacity:.85;white-space:nowrap}
.ucd.soon{background:var(--paper-2);border-style:dashed;box-shadow:none;opacity:.78}
.ucd.soon::before{opacity:.5}
.ucd.soon .soonpill{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);color:var(--ink-3)}
.resume{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);padding:5px 10px;border-radius:999px}
.how{margin-top:26px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;align-items:stretch}
@media (max-width:860px){.how{grid-template-columns:1fr}}
.how .panel{display:flex;flex-direction:column;gap:8px}
.how h3{font-size:19px}
.how .stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--l1-soft);color:var(--l1-deep);font-family:var(--display);font-weight:600;font-size:15px}
.how p{color:var(--ink-2);font-size:14.5px}
.note-line{margin-top:16px;text-align:center;font-size:13.5px;color:var(--ink-3)}
.foot{padding:22px 20px 26px;text-align:center;font-size:13px;color:var(--ink-3);font-weight:600;border-top:1px solid var(--line)}
.foot a{color:var(--ink-2)}

/* ---------- practice ---------- */
.phead{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.phead h2{font-size:26px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 13px;border-radius:999px;background:var(--card);border:1.5px solid var(--line-2);color:var(--ink-2);font-weight:700;font-size:14px;transition:.15s;text-align:left}
@media (pointer:coarse){.tchip{min-height:44px}}
.tchip:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.tchip .n{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-3);font-size:12px;font-weight:800}
.tchip .id{font-family:var(--display);font-weight:600;color:var(--uc-deep)}
.tchip[aria-pressed="true"]{background:var(--uc-soft);border-color:var(--uc);color:var(--ink)}
.tchip[aria-pressed="true"] .n{background:var(--uc);color:#fff}
.prog{height:10px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.prog > span{display:block;height:100%;width:0;border-radius:999px;background:var(--uc);transition:width .35s ease}
.prog-row{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:800;color:var(--ink-3)}
.prog-row .prog{flex:1}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:24px;max-width:860px;margin:0 auto}
@media (max-width:640px){.qcard{padding:16px;border-radius:16px}}
.stem{font-size:18px;line-height:1.5;color:var(--ink);margin:14px 0 18px;font-weight:500}
.qn{font-family:var(--display);font-weight:600;color:var(--ink-3);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.qn:focus,.qn:focus-visible{outline:none}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;width:100%;min-height:56px;padding:12px 14px;text-align:left;border-radius:14px;border:2px solid var(--line-2);background:var(--card);color:var(--ink);font-size:16px;line-height:1.45;transition:transform .12s,border-color .15s,background .15s,box-shadow .15s}
.opt .ltr{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:17px}
.opt .mk{font-weight:800;font-size:14px;white-space:nowrap;display:none;align-items:center;gap:6px}
.opt:hover:not(:disabled){border-color:var(--uc,var(--ink-3));transform:translateY(-1px);box-shadow:var(--sh)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.6}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ok .ltr{background:var(--green);color:#fff}
.opt.ok .mk{display:inline-flex;color:var(--green-deep)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .ltr{background:var(--red);color:#fff}
.opt.bad .mk{display:inline-flex;color:var(--red-deep)}
@media (max-width:480px){.opt{grid-template-columns:34px 1fr;padding:10px 12px;font-size:15px}.opt .ltr{width:34px;height:34px;font-size:15px}.opt .mk{grid-column:2;justify-self:start}}
.fbk{margin-top:18px;border-radius:16px;padding:16px 18px;border:1.5px solid;display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:start}
.fbk.ok{background:var(--green-soft);border-color:#9ED9B3;color:var(--ink)}
.fbk.bad{background:var(--red-soft);border-color:#F3A7A7;color:var(--ink)}
html.dm .fbk.ok{border-color:#297A41}html.dm .fbk.bad{border-color:#7A2929}
.fbk .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff;font-weight:900;font-size:20px;position:relative}
.fbk.ok .ico{background:var(--green)}
.fbk.bad .ico{background:var(--red)}
.fbk h4{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2;margin-bottom:4px}
.fbk .exp{font-size:16px;line-height:1.55;color:var(--ink)}
.fbk .body{min-width:0}
.whynot{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.5;color:var(--ink-2)}
.whynot b{color:var(--ink)}
html.dm .whynot{background:rgba(255,255,255,.06)}
details.more{margin-top:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);overflow:hidden}
html.dm details.more{background:rgba(255,255,255,.04)}
details.more summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;font-size:14.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-height:44px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-left:2px;flex:none}
details.more[open] summary::before{transform:rotate(45deg)}
details.more .inner{padding:0 14px 14px;display:grid;gap:10px}
.wn{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.wn .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.wn.correct .ltr{background:var(--green);color:#fff}
.pnext{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.pnext .hint{font-size:13px;color:var(--ink-3);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (pointer:coarse){.pnext .hint{display:none}}
/* celebration (practice correct) */
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--c);animation:burst .7s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}}
/* summary */
.sumhead{text-align:center;padding:10px 0 18px}
.sumhead .big{font-family:var(--display);font-weight:600;font-size:54px;line-height:1;color:var(--ink)}
.sumhead .big small{font-size:24px;color:var(--ink-3)}
.sumhead p{color:var(--ink-2);margin-top:6px}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(110px,1.3fr) 2fr auto;align-items:center;gap:12px;font-size:14px}
@media (max-width:560px){.row{grid-template-columns:1fr auto;gap:6px 10px}.row .lbl{grid-row:1}.row .cnt{grid-row:1;grid-column:2}.row .trk{grid-column:1/-1;grid-row:2}}
.row .lbl{font-weight:700;color:var(--ink-2);min-width:0}
.row .lbl b{font-family:var(--display);font-weight:600;color:var(--ink);margin-right:6px}
.row .trk{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.row .trk > span{display:block;height:100%;border-radius:999px;background:var(--green)}
.row .trk > span.mid{background:var(--sun)}
.row .trk > span.low{background:var(--red)}
.row .cnt{font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- exam (calm) ---------- */
.exam main{max-width:1200px}
.xtop{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.xtop-in{max-width:1200px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;min-height:58px}
@media (max-width:640px){.xtop-in{padding:6px 10px;gap:8px}}
.xtop .who{font-weight:700;color:var(--ink-2);font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.xtop .qpos{font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink);white-space:nowrap}
.short{display:none}
@media (max-width:640px){.xtop .who .ellip,.xtop .upill{display:none}.xtop .long{display:none}.xtop .short{display:inline}.xtop .qpos{font-size:17px}.xtop .act.sm{padding:8px 11px}.xtop .timer{padding:0 10px;font-size:16px}.xtop .timer svg{display:none}}
@media (max-width:360px){.xtop .who{display:none}}
.timer{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--paper-2);color:var(--ink);font:700 18px/1 var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums;border:1.5px solid transparent}
.timer svg{width:16px;height:16px}
.timer.warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.timer.crit{background:var(--red-soft);color:var(--red-deep);border-color:#F3A7A7;animation:tick 1s steps(2) infinite}
html.dm .timer.crit{border-color:#7A2929}
@keyframes tick{50%{border-color:var(--red)}}
.xintro{max-width:720px;margin:0 auto;display:grid;gap:18px}
.xintro h2{font-size:30px}
.xintro .facts{display:flex;flex-wrap:wrap;gap:8px}
.xintro .facts span{padding:7px 12px;border-radius:999px;background:var(--paper-2);font-weight:700;font-size:13.5px;color:var(--ink-2)}
.xintro .dir{font-size:16px;line-height:1.6;color:var(--ink);padding:18px 20px;border-left:4px solid var(--ink);background:var(--card);border-radius:0 14px 14px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.xintro ul{margin:0;padding-left:20px;color:var(--ink-2);font-size:15px;display:grid;gap:6px}
.xwrap{display:grid;gap:22px;align-items:start}
.xwrap.has-stim{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.xwrap.has-stim{grid-template-columns:minmax(0,11fr) minmax(0,10fr)}}
.xq{max-width:760px;margin:0 auto;width:100%}
.xwrap.has-stim .xq{margin:0}
.scol{min-width:0}
@media (min-width:900px){.scol .sticky{position:sticky;top:72px;max-height:calc(100vh - 84px);overflow:auto;padding-right:2px}}
.setlabel{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-2);margin-bottom:10px}
.stoggle{display:none}
@media (max-width:899px){.stoggle{display:inline-flex;margin-bottom:10px}.scol.off .stimwrap{display:none}}
.xq .qn{margin-bottom:4px}
.xq .stem{font-size:17.5px;margin:10px 0 18px}
.xopts{display:grid;gap:10px}
.xopt{display:grid;grid-template-columns:36px 1fr;align-items:center;gap:14px;width:100%;min-height:52px;padding:12px 14px;text-align:left;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);font-size:16px;line-height:1.45;transition:border-color .15s,background .15s,box-shadow .15s}
.xopt .ltr{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:15.5px;background:var(--card);transition:.15s}
.xopt:hover{border-color:var(--ink-3)}
.xopt[aria-checked="true"]{border-color:var(--ink);background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--ink)}
.xopt[aria-checked="true"] .ltr{background:var(--ink);border-color:var(--ink);color:var(--card)}
html.dm .xopt[aria-checked="true"]{background:rgba(255,255,255,.06)}
.xnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.xnav .mid{display:flex;gap:8px;flex-wrap:wrap}
.flagged-note{font-size:13px;color:var(--amber);font-weight:800}
/* navigator drawer + modal */
.veil{position:fixed;inset:0;background:rgba(14,17,38,.5);z-index:40;display:flex;justify-content:flex-end;animation:fade .15s ease}
.veil.center{justify-content:center;align-items:center;padding:16px}
@keyframes fade{from{opacity:0}}
.drawer{width:min(380px,92vw);height:100%;background:var(--card);box-shadow:var(--sh-lg);padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.drawer h3{font-size:20px;display:flex;justify-content:space-between;align-items:center}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.navq{position:relative;display:grid;place-items:center;min-height:46px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink-2);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.navq.ans{background:var(--ink);border-color:var(--ink);color:var(--card)}
.navq.cur{box-shadow:0 0 0 3px var(--l1-soft),0 0 0 5px var(--l1)}
.navq.flag::after{content:"⚑";position:absolute;top:-7px;right:-5px;font-size:13px;line-height:1;color:var(--amber);background:var(--card);border-radius:50%;padding:1px 2px}
.navq.flag{border-color:var(--amber-line)}
.navkey{display:grid;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.navkey span{display:flex;align-items:center;gap:8px}
.navkey i{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--card);display:inline-block}
.navkey i.ans{background:var(--ink);border-color:var(--ink)}
.navkey i.flag{border-color:var(--amber);background:var(--amber-soft)}
.sheet{width:min(520px,100%);background:var(--card);border-radius:var(--r);box-shadow:var(--sh-lg);padding:22px;display:grid;gap:14px;animation:rise .18s ease}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.sheet h3{font-size:22px}
.sheet .list{display:grid;gap:8px;font-size:15px;color:var(--ink-2)}
.sheet .list b{color:var(--ink)}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums span{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:9px;background:var(--paper-2);font-weight:800;font-size:13.5px;color:var(--ink-2)}
.nums span.f{background:var(--amber-soft);color:var(--amber)}
/* score report */
.score{max-width:900px;margin:0 auto;display:grid;gap:18px}
.score-hero{text-align:center;padding:26px 20px 22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);position:relative;overflow:hidden}
.score-hero .big{font-family:var(--display);font-weight:600;font-size:72px;line-height:1;color:var(--ink);letter-spacing:-.02em}
.score-hero .big small{font-size:28px;color:var(--ink-3);font-weight:600}
.score-hero .pct{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink-2);margin-top:4px}
.score-hero .sub{margin-top:8px;color:var(--ink-3);font-size:14px;font-weight:600}
.apbadge{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:16px auto 0;padding:12px 22px;border-radius:16px;background:var(--sun-soft);border:1px solid var(--amber-line)}
.apbadge .n{font-family:var(--display);font-weight:600;font-size:36px;line-height:1;color:var(--ink)}
.apbadge .l{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.apbadge .d{font-size:12px;color:var(--ink-3);font-weight:600;max-width:320px;line-height:1.4;margin-top:4px}
.score .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.score .two{grid-template-columns:1fr}}
.score h3{font-size:19px;margin-bottom:12px}
.copybox{display:grid;gap:8px}
.copybox textarea{width:100%;min-height:160px;font:13px/1.45 var(--mono);padding:12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--paper-2);color:var(--ink);resize:vertical}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
/* review */
.review{max-width:900px;margin:0 auto;display:grid;gap:16px}
.rvhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rvhead h2{font-size:26px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line)}
.seg button{min-height:38px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.rv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;border-left-width:5px}
.rv.ok{border-left-color:var(--green)}
.rv.bad{border-left-color:var(--red)}
.rv.skip{border-left-color:var(--line-2)}
@media (max-width:640px){.rv{padding:16px}}
.rv header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rv .rn{font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink)}
.rvb{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-weight:800;font-size:12.5px}
.rvb.ok{background:var(--green-soft);color:var(--green-deep)}
.rvb.bad{background:var(--red-soft);color:var(--red-deep)}
.rvb.skip{background:var(--paper-2);color:var(--ink-3)}
.rv .stem{font-size:16.5px;margin:10px 0 12px}
.rvopts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rvopts li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;font-size:15px;line-height:1.45;color:var(--ink-2);border:1px solid transparent}
.rvopts li .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.rvopts li .mk{display:block;font-size:12.5px;font-weight:800;margin-top:2px}
.rvopts li.is-correct{background:var(--green-soft);border-color:#9ED9B3;color:var(--ink)}
.rvopts li.is-correct .ltr{background:var(--green);color:#fff}
.rvopts li.is-correct .mk{color:var(--green-deep)}
.rvopts li.is-pick{background:var(--red-soft);border-color:#F3A7A7;color:var(--ink)}
.rvopts li.is-pick .ltr{background:var(--red);color:#fff}
.rvopts li.is-pick .mk{color:var(--red-deep)}
html.dm .rvopts li.is-correct{border-color:#297A41}html.dm .rvopts li.is-pick{border-color:#7A2929}
.rv .fbk{margin-top:14px}
.rat{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.rat .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.rat.correct .ltr{background:var(--green);color:#fff}
.rv details.more summary{font-size:14px}
.empty{text-align:center;padding:30px;color:var(--ink-3);font-weight:600}

/* ---------- stimulus ---------- */
.stim{margin:0 0 6px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;display:grid;gap:12px;min-width:0}
.stim>*{min-width:0;max-width:100%}
.exam .stim{border-color:var(--line);box-shadow:none}
.practice .stim{background:var(--paper-2);border-color:transparent}
html.dm .practice .stim{background:rgba(255,255,255,.04)}
.stim-title{font-family:var(--body);text-transform:uppercase;font-weight:800;letter-spacing:.06em;font-size:12.5px;color:var(--ink);line-height:1.45}
.stim-source{font-size:12px;color:var(--ink-3);font-style:italic}
.stim-text,.stim-note,.stim-desc{font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.stim-note{padding:10px 12px;border-radius:10px;background:var(--paper);border:1px dashed var(--line-2)}
html.dm .stim-note{background:rgba(255,255,255,.04)}
.stim.unavail{align-items:center;justify-items:center;text-align:center;padding:22px;border-style:dashed;color:var(--ink-3);font-weight:700}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.stab{border-collapse:collapse;width:100%;min-width:320px;font-size:14px;line-height:1.4}
.stab th,.stab td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.stab thead th{font-weight:800;color:var(--ink);background:var(--paper-2);border-bottom:2px solid var(--line-2);font-size:13px}
.stab tbody th{font-weight:700;color:var(--ink)}
.stab tbody tr:nth-child(even) td,.stab tbody tr:nth-child(even) th{background:var(--paper)}
html.dm .stab tbody tr:nth-child(even) td,html.dm .stab tbody tr:nth-child(even) th{background:rgba(255,255,255,.03)}
.stab td,.stab th{color:var(--ink-2)}
.stab tbody th{color:var(--ink)}
.dresults .stim-title{font-size:13.5px}
/* chart */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2);font-weight:600;align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:7px}
.legend .sw{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.08)}
.legend .sw.s0{background:var(--bar-1)}
.legend .sw.s1{background:var(--bar-2);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)}
.legend svg{width:22px;height:16px;display:block;flex:none}
.chart{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scrollhint{font-size:12px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin:-6px 0 -4px}
.scrollhint::before{content:"↔";font-size:14px}
.chart svg{display:block;width:100%;min-width:460px;height:auto;font-family:var(--body)}
.chart .grid{stroke:var(--chart-grid);stroke-width:1}
.chart .axis{stroke:var(--ink-3);stroke-width:1.2}
.chart .tick,.chart .cat{fill:var(--ink-2);font-size:13px;font-weight:600}
.chart .ylab{fill:var(--ink-3);font-size:12.5px;font-weight:700}
.chart .val{fill:var(--ink);font-size:12.5px;font-weight:800}
.chart .bar.s0{fill:var(--bar-1)}
.chart .bar.s1{fill:var(--bar-2)}
.chart .bar{stroke:none}
/* district maps */
.dplans{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.dplan{margin:0;display:grid;gap:6px;justify-items:center;flex:0 1 250px;max-width:100%}
.dplan svg{width:100%;height:auto;display:block}
.dplan figcaption{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink)}
.dmap .pc{stroke:var(--card);stroke-width:1.5}
.dmap .pc.blue{fill:var(--pc-blue)}
.dmap .pc.orange{fill:var(--pc-orange)}
.dmap .pval{fill:var(--ink);font-size:15px;font-weight:800;font-family:var(--body)}
.dmap .dline{stroke:var(--ink);stroke-width:4;stroke-linecap:square;fill:none}
.legend .sw.pblue{background:var(--pc-blue)}
.legend .sw.porange{background:var(--pc-orange)}
.legend .sw.dline{height:0;border:0;border-top:4px solid var(--ink);border-radius:0;width:18px}
/* schematic maps */
.smap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.smap svg{display:block;width:100%;min-width:560px;height:auto;font-family:var(--body);border-radius:12px;border:1px solid var(--line)}
.smap .water{fill:var(--stim-water)}
.smap .land{fill:var(--stim-land);stroke:var(--stim-land-stroke);stroke-width:1.5}
.smap .land.power{fill:var(--stim-power);stroke:#8E85B0}
.smap .land.small{fill:var(--stim-small);stroke:#9A917A}
html.dm .smap .land.small{stroke:#6B668A}
.smap .island{fill:var(--stim-land);stroke:var(--stim-land-stroke);stroke-width:1.5}
.smap .lbl{fill:var(--ink);font-weight:700;font-size:15px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;font-family:var(--display)}
html.dm .smap .lbl{stroke:#0E1126}
.smap .lbl.big{font-size:19px}
.smap .lbl.sm{font-size:12.5px;font-family:var(--body);font-weight:700}
.smap .sub{fill:var(--ink-2);font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round;text-anchor:middle}
html.dm .smap .sub{stroke:#0E1126}
.smap .zone{stroke:var(--ink-3);stroke-width:1}
.smap .zone.z0{fill:var(--zone-0)}.smap .zone.z1{fill:var(--zone-1)}.smap .zone.z2{fill:var(--zone-2)}.smap .zone.z3{fill:var(--zone-3)}
.smap .hatchline{stroke:var(--ink-2);stroke-width:1.6}
.smap .bracket{stroke:var(--ink);stroke-width:2;fill:none}
.smap .claim.a{fill:var(--claim-a)}
.smap .claim.b{fill:var(--claim-b)}
.smap .claim-hatch{stroke:var(--claim-b);stroke-width:3}
.smap .line{stroke:var(--ink);stroke-width:2;fill:none}
.smap .lane{stroke:var(--lane);stroke-width:3;fill:none}
.smap .conflict{fill:var(--conflict);stroke:#fff;stroke-width:1}
.smap .baseN{fill:var(--base-n);stroke:#fff;stroke-width:1.2}
.smap .baseS{fill:var(--base-s);stroke:#fff;stroke-width:1.2}
.smap .arrow{stroke:var(--ink);stroke-width:3;fill:none}
.smap .arrowhead{fill:var(--ink)}
.smap .scale{stroke:var(--ink);stroke-width:2}
.smap .scalelbl{fill:var(--ink);font-size:12px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:3px}
html.dm .smap .scalelbl{stroke:#0E1126}
.legend .sw.power{background:var(--stim-power)}

.phint summary::-webkit-details-marker{display:none}
.phint p{padding:0 14px 14px;margin:0;font-size:15px;line-height:1.55;color:var(--ink)}

<script>window.PE_DATA={"units":{"4":{"unit":4,"title":"Transoceanic Interconnections","period":"c. 1450–1750","examWeighting":"12–15%","blurb":"Ships, silver, the Columbian Exchange, maritime empires, resistance, and new social hierarchies.","version":"2026-11-07a","schemaNotes":"Every question has a set id; data.stimuli[set] holds its source (passage | pair | image | table | bar). Options A-D. LO letters follow the Fall 2026 AP World CED (Unit 4: Learning Objectives A-N).","topics":[{"id":"4.1","name":"Technological Innovations","lo":["A"]},{"id":"4.2","name":"Exploration: Causes and Events","lo":["B","C"]},{"id":"4.3","name":"Columbian Exchange","lo":["D"]},{"id":"4.4","name":"Maritime Empires Established","lo":["E","F","G"]},{"id":"4.5","name":"Maritime Empires Maintained and Developed","lo":["H","I","J","K"]},{"id":"4.6","name":"Internal and External Challenges to State Power","lo":["L"]},{"id":"4.7","name":"Changing Social Hierarchies","lo":["M"]},{"id":"4.8","name":"Continuity and Change, 1450–1750","lo":["N"]}],"stimuli":{"X1":{"type":"passage","paragraphs":["… [Prince Henry] had also a wish to know the land that lay beyond the isles of Canary and that Cape called Bojador, for up to his time … neither by writings, nor by the memory of man, was known with any certainty the nature of the land beyond that Cape. … And this was the first reason of his action.","The second reason was that if there chanced to be in those lands some population of Christians, or some havens into which it would be possible to sail without peril, many kinds of merchandise might be brought to this realm, which would find a ready market … because no other people of these parts traded with them … and also the products of this realm might be taken there, which traffic would bring great profit to our countrymen.","The third reason was that, as it was said that the power of the Moors in that land of Africa was very much greater than was commonly supposed … the said Lord Infant* exerted himself to cause this to be fully discovered, and to make it known how far the power of those infidels extended.","The fourth reason was because during the one and thirty years that he had warred against the Moors, he had never found a Christian king, nor a lord outside this land, who for the love of our Lord Jesus Christ would aid him in the said war. Therefore he sought to know if there were in those parts any Christian princes … who would aid him against those enemies of the faith.","The fifth reason was his great desire to make increase in the faith of our Lord Jesus Christ and to bring to him all the souls that should be saved."],"attribution":"Gomes Eanes de Zurara, royal chronicler of Portugal, Chronicle of the Discovery and Conquest of Guinea, 1453","translation":"Translated by C. Raymond Beazley and Edgar Prestage (1896); adapted","footnotes":[{"mark":"*","text":"Prince Henry of Portugal (1394–1460), son of King João I, who sponsored Portuguese voyages down the West African coast"}],"glossary":[{"t":"Cape Bojador","d":"a cape on the northwest coast of Africa that Portuguese ships first sailed past in 1434"},{"t":"havens","d":"safe harbors"},{"t":"Moors / infidels","d":"Zurara's words for Muslims of North Africa"},{"t":"realm","d":"kingdom (here, Portugal)"},{"t":"traffic","d":"trade"}]},"X2":{"type":"pair","items":[{"label":"Source 1","paragraphs":["… Of three millions of persons which lived in Hispaniola itself, there is at present but the inconsiderable remnant of scarce three hundred. …","Now the ultimate end and scope that incited the Spaniards to … the desolation of this people was gold only, that thereby growing rich in a short time, they might arrive at once at such degrees and dignities as were in no ways consistent with their persons. …","[The Spaniards] divided among themselves the young men, women, and children … one obtained thirty, another forty, to this man one hundred were given … upon this pretense, and with this condition, that he should see them instructed in the Catholic religion. … They sent the men to the mines to dig and bring away the gold, which is an intolerable labor; but the women they made use of to till the ground. … The men died in mines, hunger-starved and oppressed with labor, and the women perished in the fields … Thus an infinite number of inhabitants that formerly peopled this island … dwindled away to nothing."],"attribution":"Bartolomé de las Casas, Spanish Dominican friar, A Brief Account of the Destruction of the Indies, written 1542 for King Charles I of Spain","translation":"From an English translation published in London in 1689 under the title Popery* Truly Displayed in Its Bloody Colours; spelling modernized and adapted","footnotes":[{"mark":"*","text":"\"Popery\" was an insulting word that English Protestants used for the Roman Catholic Church."}],"glossary":[{"t":"Hispaniola","d":"the Caribbean island that today holds Haiti and the Dominican Republic"},{"t":"remnant","d":"a small part that is left"},{"t":"pretense","d":"a false reason given to cover the real one"}]},{"label":"Source 2","paragraphs":["The rapid melting away of the population of the West Indies during the first quarter of a century of the Spanish rule … is the most familiar instance of the kind, through the impassioned descriptions of Las Casas, which were translated into the principal languages of Europe; and, as a consequence, it is generally believed that the Spaniards were cruel and destructive above all other colonists. … That the wars of subjugation were very destructive of life is only too clear; that famine followed war to prolong its ravages is equally certain; that the average Spaniard recklessly and cruelly overworked the Indians there is no doubt.","Nevertheless, there were other and more subtle causes in operation. Diseases were imported by the whites, which were mitigated for them by some degree of acquired immunity, but which raged irresistibly through a population without that defence. Of these new diseases small-pox was one of the most destructive. In the epidemic of small-pox in 1518 the natives, Peter Martyr* reports, died like sheep. … Small-pox appeared in Mexico at the beginning of the conquest … sweeping off in some provinces half the population."],"attribution":"Edward Gaylord Bourne, historian at Yale University, Spain in America, 1450–1580, published in 1904","translation":"Adapted","footnotes":[{"mark":"*","text":"Peter Martyr, an Italian scholar at the Spanish court who wrote about the Americas in the early 1500s. Bourne, writing in 1904, uses older terms: \"the whites\" for Europeans and \"natives\" for Indigenous people."}],"glossary":[{"t":"subjugation","d":"conquest"},{"t":"mitigated","d":"made less severe"},{"t":"acquired immunity","d":"protection from a disease built up by earlier exposure to it"}]}]},"X3":{"type":"bar","title":"Average Annual Registered Imports of American Gold and Silver into Spain, 1503–1660","categories":["1503–20","1521–40","1541–60","1561–80","1581–1600","1601–20","1621–40","1641–60"],"series":[{"name":"Average imports per year (millions of pesos)","values":[0.2,0.3,1.4,2.7,6.1,5.5,4.3,1.8]}],"yLabel":"Millions of pesos per year","text":"Gold and silver are combined by their money value (1 peso = 450 maravedís, a Spanish unit of account). Most of the silver came from mines at Potosí (in the Andes) and Zacatecas (in Mexico).","source":"Calculated from Earl J. Hamilton, American Treasure and the Price Revolution in Spain, 1501–1650 (1934), p. 34; yearly averages for each 20-year period (first period 18 years), rounded"},"X4":{"type":"passage","paragraphs":["1. No Japanese ships shall ever be sent to foreign lands.","2. No Japanese shall be permitted to go abroad, and if there be discovered anyone who has a secret intention to go abroad he shall be put to death. …","3. If any Japanese residing abroad comes back to Japan, even for a short time, he shall be put to death.","4. Rewards are to be given to those who report to the authorities about the Christians: those who give information about the foreign missionaries shall be given 200 to 300 silver coins according to their merits. …","5. Children and grandchildren of the foreign Christian missionaries shall not be permitted to remain in Japan, and anyone secretly giving shelter to such persons shall be put to death. …"],"attribution":"Ordinance issued by the Tokugawa shogunate to the governors of the port of Nagasaki, Japan, 1636","translation":"From Takekoshi Yosaburō, The Economic Aspects of the History of the Civilization of Japan (English edition, 1930); adapted","glossary":[{"t":"shogunate","d":"the government of the shogun, Japan's top military ruler (here, the Tokugawa family)"},{"t":"ordinance","d":"an official order or law"},{"t":"missionaries","d":"people sent to spread a religion; here, Catholic priests from Portugal and Spain"}]},"X5":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Casta_painting_all.jpg/960px-Casta_painting_all.jpg","width":960,"height":1353,"alt":"A painting divided into sixteen panels, each showing a mother, a father, and a child, with a written label under each family.","caption":"Each panel shows a family. The label assigns colonial social categories to the parents and the child. The first three labels in the top row read: \"Spaniard with Indian woman: Mestizo\"; \"Mestizo with Spanish woman: Castizo\"; \"Castizo with Spanish woman: Spaniard.\" Families in the top rows wear fine European-style clothing. Families in the lower rows wear plainer clothes, carry goods or tools, and some are barefoot. The labels use colonial terms: \"Indian\" meant an Indigenous person, and \"Mulatto,\" a term now considered offensive, meant a person of mixed Spanish and African ancestry.","attribution":"Unknown artist, Las Castas (The Castes), oil painting made in New Spain (colonial Mexico), eighteenth century","credit":"Museo Nacional del Virreinato, Tepotzotlán, Mexico. Public domain image via Wikimedia Commons.","description":"Sixteen small family portraits arranged in four rows of four. In each, a man and a woman stand with a child, and a label below names the mixture of Spanish, Indigenous, and African ancestry the painter assigned to each person. The couples in the first row are dressed in rich cloaks, lace, and fine fabrics. Moving down the rows, the clothing becomes simpler, people carry baskets, fruit, or tools, and several figures in the bottom rows are barefoot.","glossary":[{"t":"New Spain","d":"Spain's colony in Mexico and nearby lands"},{"t":"Mestizo","d":"a person of mixed Spanish and Indigenous ancestry"},{"t":"Mulatto","d":"a colonial term for a person of mixed Spanish and African ancestry"}]},"X6":{"type":"passage","paragraphs":["Under the later Hapsburgs*, with the increasing demands of the colonies on the one hand, and the utter ruin of Spanish industry on the other, the dependence of the Seville export commerce upon foreign manufactures was complete. They supplied five sixths of the cargoes of the outbound fleets. …","The most serious and widespread development of contraband trade, however, was in merchandise introduced into the colonies directly from foreign markets. Portuguese, French, Dutch and other interlopers smuggled their cargoes into the West Indies, through the closed port of Buenos Aires, or even to the Pacific shores of Spanish America. The illicit trader was eagerly welcomed by the colonists, for he supplied their needs at reasonable prices. …","A flood of restrictions, a jealous monopoly, on the one hand—on the other, a flourishing contraband trade of outsiders …—such is the story of Spanish-American commerce in the sixteenth and the seventeenth centuries. The Crown of Castile sought to extend Spanish power, and monopolize all the treasure of the Indies, by means of a rigid and complicated commercial system. Yet in the end, it saw the trade of the New World pass into the hands of its rivals … and its riches diverted at their very source."],"attribution":"Clarence H. Haring, American historian, Trade and Navigation between Spain and the Indies in the Time of the Hapsburgs, published in 1918","translation":"Adapted","footnotes":[{"mark":"*","text":"the ruling family of Spain from 1516 to 1700; \"later Hapsburgs\" refers to the 1600s"}],"glossary":[{"t":"contraband","d":"smuggled goods"},{"t":"interlopers","d":"traders who were not allowed to trade there"},{"t":"illicit","d":"illegal"},{"t":"monopoly","d":"complete control of a trade by one group"},{"t":"outbound fleets","d":"the yearly convoys of ships sailing from Seville to the Americas"}]},"X7":{"type":"passage","paragraphs":["They said they had been the first in doing good to the English, and the English the first in doing wrong. They said when the English first came, their king's father* was as a great man and the English as a little child. He kept other Indians from wronging the English, and gave them corn and showed them how to plant, and was free to do them any good, and had let them have a hundred times more land than now the king had for his own people. …","Another grievance was if twenty of their honest Indians testified that an Englishman had done them wrong, it was as nothing, and if but one of their worst Indians testified against any Indian or their king when it pleased the English, that was sufficient. Another grievance was when their kings sold land, the English would say it was more than they agreed to. … Now whom the English had owned for king or queen they would disinherit, and make another king that would give or sell them their land, so that now they had no hopes left to keep any land.","Another grievance: the English cattle and horses still increased, so that when they removed thirty miles from where the English had anything to do, they could not keep their corn from being spoiled, they never being used to fence. …"],"attribution":"John Easton, deputy governor of the English colony of Rhode Island, report of a meeting with Metacom (called King Philip by the English), leader of the Wampanoag people, June 1675","translation":"Spelling modernized; adapted","footnotes":[{"mark":"*","text":"Massasoit, Metacom's father, who allied with the Plymouth colonists in 1621"}],"glossary":[{"t":"grievance","d":"a complaint about unfair treatment"},{"t":"testified","d":"spoke as a witness in court"},{"t":"disinherit","d":"remove from power"},{"t":"owned","d":"recognized"},{"t":"removed","d":"moved"},{"t":"they never being used to fence","d":"they had never needed fences"}]},"X8":{"type":"passage","paragraphs":["From what I can recollect of these battles, they appear to have been raids of one little state or district on the other, to obtain prisoners or booty. Perhaps they were incited to this by those traders who brought the European goods I mentioned amongst us. Such a mode of obtaining slaves in Africa is common; and I believe more are procured this way, and by kidnapping, than any other. When a trader wants slaves, he applies to a chief for them, and tempts him with his wares. … Accordingly he falls on his neighbours, and a desperate battle ensues. If he prevails and takes prisoners, he gratifies his avarice by selling them. …","… Those prisoners which were not sold or redeemed we kept as slaves: but how different was their condition from that of the slaves in the West Indies! With us they do no more work than other members of the community, even their masters; their food, clothing and lodging were nearly the same as theirs, (except that they were not permitted to eat with those who were free-born); and there was scarce any other difference between them, than a superior degree of importance which the head of a family possesses in our state. … Some of these slaves have even slaves under them as their own property."],"attribution":"Olaudah Equiano, formerly enslaved African, describing his childhood in West Africa in the 1750s, The Interesting Narrative of the Life of Olaudah Equiano, published in London in 1789","translation":"Adapted","glossary":[{"t":"booty","d":"goods taken by force"},{"t":"incited","d":"pushed or encouraged"},{"t":"procured","d":"gotten"},{"t":"redeemed","d":"freed after a payment (ransomed)"},{"t":"West Indies","d":"the islands of the Caribbean"}]},"P1":{"type":"passage","paragraphs":["[Vasco da Gama] sent one of the convicts to Calicut, and those with whom he went took him to two Moors from Tunis, who could speak Castilian and Genoese*. The first greeting that he received was in these words: \"May the Devil take thee! What brought you hither?\" They asked what he sought so far away from home, and he told them that we came in search of Christians and of spices. …","On Tuesday the captain got ready the following things to be sent to the king, namely, twelve pieces of striped cloth, four scarlet hoods, six hats, four strings of coral, a case containing six wash-hand basins, a case of sugar, two casks of oil, and two of honey. … [The king's officials] came, and when they saw the present they laughed at it, saying that it was not a thing to offer to a king, that the poorest merchant from Mecca, or any other part of India, gave more, and that if he wanted to make a present it should be in gold. … When they had gone there came certain Moorish merchants, and they all made fun of the present which the captain desired to be sent to the king."],"attribution":"Journal of a member of Vasco da Gama's crew, describing the Portuguese fleet's arrival at Calicut, India, May 1498","translation":"Translated by E. G. Ravenstein (1898); adapted","footnotes":[{"mark":"*","text":"Castilian = Spanish; Genoese = the language of the city of Genoa, in present-day Italy"}],"glossary":[{"t":"Calicut","d":"a wealthy port city on the southwest coast of India, ruled by a Hindu king"},{"t":"Moors","d":"the journal's word for Muslims"},{"t":"convicts","d":"prisoners the Portuguese brought along to do dangerous jobs"}]},"P2":{"type":"passage","paragraphs":["Española is a wonder. … The harbors on the coast, and the number and size and wholesomeness of the rivers, most of them bearing gold, surpass anything that would be believed by one who had not seen them. … In this island there are many spices and extensive mines of gold and other metals. … They have neither iron, nor steel, nor arms, nor are they competent to use them … because they are timid to a surprising degree.","I gave away a thousand good and pretty articles which I had brought with me in order to win their affection, and that they might be led to become Christians, and be well inclined to love and serve their Highnesses* and the whole Spanish nation, and that they might aid us by giving us things of which we stand in need, but which they possess in abundance. …","Their Highnesses may see that I shall give them all the gold they require, if they will give me but a very little assistance; spices also, and cotton, as much as their Highnesses shall command to be shipped … and slaves, as many … as their Highnesses shall command to be shipped. … All Christendom ought to rejoice … for the great exaltation which may come to them in turning so many nations to our holy faith, and also for the temporal benefits which will bring great refreshment and gain, not only to Spain, but to all Christians."],"attribution":"Christopher Columbus, letter written on his return voyage to Luis de Santángel, a royal official who had helped pay for the voyage, February 1493; the letter was printed and spread across Europe that year","translation":"Translated by R. H. Major (1870); adapted","footnotes":[{"mark":"*","text":"King Ferdinand and Queen Isabella of Spain"}],"glossary":[{"t":"Española","d":"Hispaniola, the Caribbean island today shared by Haiti and the Dominican Republic"},{"t":"temporal","d":"worldly (money and goods, as opposed to religious)"}]},"P3":{"type":"table","title":"Estimated Indigenous Population of Central Mexico, 1518–1605","columns":["Year","Estimated population"],"rows":[["1518","25.2 million"],["1532","16.8 million"],["1548","6.3 million"],["1568","2.65 million"],["1585","1.9 million"],["1595","1.375 million"],["1605","1.075 million"]],"text":"These are estimates by historians Sherburne F. Cook and Woodrow Borah, based mainly on Spanish tax and tribute records. Some historians think the 1518 figure is too high, but historians agree that the Indigenous population of central Mexico fell catastrophically in the 1500s.","source":"Sherburne F. Cook and Woodrow Borah, studies of the population of central Mexico, 1960s"},"P4":{"type":"passage","paragraphs":["… There is a river on the hither side of which stands a Muslim town named Rander, wherein are very fair houses and open places. It is a very pleasant and wealthy place, for the Muslim inhabitants thereof trade in their own ships with Malacca, Bengal, Tenasserim, Pegu, Martaban and Sumatra, in spices of divers sorts and drugs and silks in great abundance, musk, benzoin, porcelain and many other wares. Those who dwell here have many great and fair vessels, which carry on this trade, and whosoever would have at his disposal things from Malacca and China, let him go to this place, where he will find them in greater perfection than in any other place soever. …","[In Malacca] dwell up to now great wholesale merchants of every kind, both Muslims and Hindus, many of them from Coromandel, men of great estates and owning many great ships which they call junks. They trade everywhere in goods of all kinds. … They go to Tenasserim, Pegu, Bengal, Pulicat, Coromandel, Malabar and Cambay, so much so that this city of Malacca is the richest seaport with the greatest number of wholesale merchants and abundance of shipping and trade that can be found in the whole world."],"attribution":"Duarte Barbosa, Portuguese official who worked in India from about 1500 to 1516, The Book of Duarte Barbosa, completed about 1518","translation":"Translated by M. Longworth Dames (1918–1921); place names and terms modernized (\"Moorish\" to Muslim, \"Heathen\" to Hindu); adapted","glossary":[{"t":"Rander","d":"a port in Gujarat, western India"},{"t":"Malacca","d":"a port on the strait between the Malay Peninsula and Sumatra, captured by the Portuguese in 1511"},{"t":"Coromandel","d":"the southeast coast of India"},{"t":"junks","d":"large Asian sailing ships"},{"t":"wholesale merchants","d":"merchants who buy and sell goods in very large amounts"}]},"P5":{"type":"passage","paragraphs":["The following day, Xicotencatl, Captain General of this province*, came to see me … with about fifty of its chiefs, praying me … that I would admit them to the royal service of Your Majesty and to my friendship, and would pardon them the past errors, because they had not understood who we were. He said that they had exerted all their forces … to escape being subjected to anyone, since at no time had this province ever been so … on the contrary, they had always lived free and independent, since immemorial times, and had always defended themselves against the great power of Moctezuma, of his father, and grandfather, who held that country subjected, but had never been able to hold them in subjection, though they had them surrounded on all sides, so that no one could go out of the country. He said also that they ate no salt, since there was none in their country, nor were they allowed to go to buy it anywhere else. … They had endured it, and held it as better thus to be free, rather than be subjected to anyone. They had wanted to do the same with me, but seeing clearly that neither their forces nor their tricks could help them, they had decided that, rather than die, … they would become vassals** of Your Highness."],"attribution":"Hernán Cortés, Spanish conquistador, letter to King Charles I of Spain (Holy Roman Emperor Charles V), 1520, describing events of September 1519","translation":"Translated by F. A. MacNutt (1908); names modernized; adapted","footnotes":[{"mark":"*","text":"Tlaxcala, an independent state east of Tenochtitlan, the Mexica (Aztec) capital"},{"mark":"**","text":"subjects who owe loyalty and service to a ruler"}],"glossary":[{"t":"Moctezuma","d":"Moctezuma II, ruler of the Mexica (Aztec) Empire"},{"t":"subjected","d":"ruled by someone else"},{"t":"immemorial","d":"so long ago no one remembers"}]},"P6":{"type":"passage","paragraphs":["The force of silver, which draws unto it the desire of all things, has peopled this mountain more than any other place in all these kingdoms. …","At this day the King receives for his fifth* yearly, from the mines of Potosí, a million of silver. … In the fleet in which I came in the year 1587, there were eleven millions transported in the two fleets of Peru and Mexico, whereof two thirds were in that of Peru, and almost one half for the King. I thought good to set this down … to show the power which His heavenly Majesty has given to the Kings of Spain … who (by the especial favor of heaven) have joined the East with the West Indies, environing the whole world with their power.","They labor in these mines in continual darkness … without knowledge of day or night. … They carry up this metal upon their shoulders, by ladders. A man carries ordinarily the weight of two arrobas** of metal upon his shoulders … and so go they up the ladder holding it with both their hands … a fearful thing, and which breeds an amazement to think upon it, so great is the desire of silver, that for the gain thereof men endure any pains."],"attribution":"José de Acosta, Spanish Jesuit priest who lived in Peru from 1572 to 1586, The Natural and Moral History of the Indies, 1590","translation":"Translated by Edward Grimston (1604); spelling modernized; adapted","footnotes":[{"mark":"*","text":"the royal fifth: the king's one-fifth share of the silver mined at Potosí at this time"},{"mark":"**","text":"about 50 pounds (23 kilograms)"}],"glossary":[{"t":"Potosí","d":"a huge silver mountain and mining city in the Andes (in today's Bolivia)"},{"t":"a million / eleven millions","d":"pesos, Spanish silver coins"},{"t":"East and West Indies","d":"Asia and the Americas"},{"t":"environing","d":"surrounding"}]},"P7":{"type":"passage","paragraphs":["… Though formerly ruled by a governor under the King of Kongo, this governor [of Angola**] has, since the king became a Christian, made himself absolute ruler. Having seized all the lands he ruled, and in time conquered some of the surrounding provinces, he is now a great and rich prince, and hardly less powerful than the King of Kongo, to whom he pays tribute or not, according as he chooses.","It came to pass that after Dom João II of Portugal planted the faith of Christ in the Kingdom of Kongo, and the king became a Christian, the Lord of Angola was always friendly towards him, being to some extent a vassal, and their people trading together. He sent tribute every year to the King of Kongo, and trade was carried on at the port of Luanda between the Portuguese and the people of Angola by permission of the King of Kongo. Slaves were bought and exchanged for other merchandise, all being sent to the island of São Tomé*. … Trade becoming successful, they began to send vessels themselves from Lisbon to Angola, and also a governor, Paulo Dias de Novais by name. … To this Paulo Dias, Dom Sebastião, King of Portugal, granted the power of conquering thirty-three leagues of country … where he was to take all he could gain for himself and his heirs."],"attribution":"Filippo Pigafetta, Italian writer, A Report of the Kingdom of Kongo, 1591, based on the accounts of Duarte Lopes, a Portuguese merchant who lived in Kongo in the 1570s and 1580s","translation":"Translated by Margarite Hutchinson (1881); names modernized; adapted","footnotes":[{"mark":"*","text":"a Portuguese island colony in the Gulf of Guinea, off the coast of Central Africa"},{"mark":"**","text":"here, the kingdom of Ndongo, south of Kongo; the Portuguese named it after its ruler's title, ngola"}],"glossary":[{"t":"vassal","d":"a lesser ruler who owes loyalty and payments to a stronger one"},{"t":"tribute","d":"payments made to show loyalty to a more powerful ruler"},{"t":"leagues","d":"an old distance unit; 33 leagues is roughly 100 miles"}]},"P8":{"type":"passage","paragraphs":["Although a kingdom may be enriched by gifts received, or by purchase taken from some other nations, yet these are things uncertain and of small consideration when they happen. The ordinary means therefore to increase our wealth and treasure is by foreign trade, wherein we must ever observe this rule: to sell more to strangers yearly than we consume of theirs in value.","For suppose that when this kingdom is plentifully served with the cloth, lead, tin, iron, fish and other native commodities, we do yearly export the overplus to foreign countries to the value of twenty-two hundred thousand pounds*, by which means we are enabled beyond the seas to buy and bring in foreign wares for our use and consumption to the value of twenty hundred thousand pounds. By this order duly kept in our trading, we may rest assured that the kingdom shall be enriched yearly two hundred thousand pounds, which must be brought to us in so much treasure, because that part of our stock which is not returned to us in wares must necessarily be brought home in treasure."],"attribution":"Thomas Mun, English merchant and director of the English East India Company, England's Treasure by Foreign Trade, written about 1630 and published in 1664","translation":"Spelling modernized; adapted","footnotes":[{"mark":"*","text":"pounds sterling, English money"}],"glossary":[{"t":"purchase","d":"here, wealth seized from others (loot), not buying"},{"t":"strangers","d":"foreigners"},{"t":"treasure","d":"gold and silver"},{"t":"wares","d":"goods for sale"},{"t":"overplus","d":"the extra goods left after the kingdom's own needs are met"},{"t":"stock","d":"the nation's total wealth"}]},"P9":{"type":"passage","paragraphs":["The Dutch began their career in the East with no idea other than that of buying cheap and selling dear; their ideas and aims were purely commercial. The experience of a few years taught them that in a country like Java they could not deal satisfactorily with individual traders and that they must deal with governments. They were forced, before they knew it, to become politicians, seeking their commercial ends through diplomatic channels, and warriors, upholding the gains that had been given them by treaty. …","The series of instructions to the Governors General … bade the chief executive in Asia never to make war unless forced. … It seems to have been morally impossible for the Dutch officials to obey these directions in the face of all the temptations to break them. Men of vigor, like Governor General Coen*, who did much to shape the Company's military policy in its early period, came to the conclusion that trade and war were inseparable. … Coen wrote to the directors in 1614 \"that trade in Asia must be conducted and maintained under protection and favor of your own weapons, and that the weapons must be supplied from the profits enjoyed by the trade, so that trade cannot be maintained without war or war without trade.\""],"attribution":"Clive Day, historian at Yale University, The Policy and Administration of the Dutch in Java, published in 1904","translation":"Coen's letter translated from Dutch by Clive Day; \"India\" changed to \"Asia\" in Day's text and Coen's letter, to match its meaning; adapted","footnotes":[{"mark":"*","text":"Jan Pieterszoon Coen (1587–1629), leader of the Dutch East India Company (VOC) in Asia, who founded the Dutch base at Batavia (today's Jakarta) on Java in 1619"}],"glossary":[{"t":"bade","d":"ordered"},{"t":"the Company","d":"the Dutch East India Company (VOC), a joint-stock company chartered in 1602"},{"t":"Java","d":"a large island in today's Indonesia"},{"t":"inseparable","d":"unable to be pulled apart"}]},"P10":{"type":"passage","paragraphs":["With respect to books which were not written by the sages … which alarm the age, and astonish the common people … these all contain strange teachings which should be rooted out. …","From of old three teachings have been handed down. Besides the teaching of the learned [Confucianism], there are those of Dao and Fo [Daoism and Buddhism]. …","The teaching of the Western Ocean, which honors Tianzhu*, ranks also among those that are corrupt; but because these men understand mathematics, therefore the government employs them: of this you ought to be aware. To walk in these by-roads and deceive the people is what the law will not excuse. …","Soldiers and people! act according to the sacred instructions of the late emperor**; and stop the progress of these strange sects as you would that of floods, fires, robbers, and thieves. Indeed the injury of floods, fires, robbers, and thieves ends with the body; but that of false religions reaches the human heart."],"attribution":"The Yongzheng Emperor of Qing China, Amplified Instructions on the Sacred Edict, 1724, explaining its seventh rule, \"Degrade strange religions, in order to exalt the orthodox [Confucian] teaching\"; these instructions were read aloud to the public twice a month across the empire","translation":"Translated by William Milne (1817); names modernized; adapted","footnotes":[{"mark":"*","text":"\"Lord of Heaven,\" the Chinese name for the Christian God; \"the teaching of the Western Ocean\" is Roman Catholic Christianity, brought by Jesuit missionaries"},{"mark":"**","text":"the Kangxi Emperor (ruled 1661–1722), who issued the original Sacred Edict in 1670"}],"glossary":[{"t":"sages","d":"wise teachers of the past, especially Confucius"},{"t":"sects","d":"religious groups outside the approved teaching"},{"t":"by-roads","d":"side paths; wrong ways"}]},"P11":{"type":"passage","paragraphs":["In the first place, the efforts of the Spaniards to suppress not only the religious beliefs but also the ancient habits and customs of the Indians in other respects, and to make them conform to European methods of living, created friction between the two races*. The Indians, however, continued well grounded in their native religious beliefs and practices, and the Spaniards found it practically impossible to suppress them either by the number of missionaries brought in, or by the severity of the punishments inflicted. In 1675 these \"superstitious practices\" reached such alarming extremes that Governor Treviño determined to stamp them out for good. Having captured forty-seven medicine men, who were alleged to be guilty of sorcery and witchcraft, he hanged three of them … and inflicted severe punishment upon the others, among whom was a certain native named Popé. …","On being released from captivity in 1675, he returned to his pueblo, full of resentment for the Spaniards. He at once began making preparations for a general revolt. … Other influences, such as the belief that the Spaniards could all be driven out of the country, and the almost universal desire to return to their ancient customs, all operated to make the revolt of the Indians general."],"attribution":"Charles W. Hackett, historian, \"The Revolt of the Pueblo Indians of New Mexico in 1680,\" published in 1911, based on Spanish colonial records","translation":"Adapted","footnotes":[{"mark":"*","text":"Hackett, writing in 1911, uses \"Indians\" for the Pueblo peoples and \"two races\" for Pueblos and Spaniards. \"Superstitious practices\" was the Spanish officials' label for Pueblo religion."}],"glossary":[{"t":"pueblo","d":"a town of the Pueblo peoples of what is now New Mexico"},{"t":"medicine men","d":"Pueblo religious leaders and healers"},{"t":"general","d":"widespread; involving nearly everyone"}]},"P12":{"type":"passage","paragraphs":["The Sultan's hall was crowded with people, among whom were several officers of high rank. Besides these there were all the troopers of the Imperial guard … and a large force of Janissaries*; but there was not in all that great assembly a single man who owed his position to anything except his valor and his merit. No distinction is attached to birth among the Turks; the respect to be paid to a man is measured by the position he holds in the public service. … In making his appointments the Sultan pays no regard to any claims on the score of wealth or rank … he considers each case on its own merits, and examines carefully into the character, ability, and disposition of the man whose promotion is in question. It is by merit that men rise in the service. … Those who receive the highest offices from the Sultan are for the most part the sons of shepherds or herdsmen, and so far from being ashamed of their parentage, they actually glory in it. …","This is the reason that they are successful in their undertakings, that they lord it over others, and are daily extending the bounds of their empire. These are not our ideas; with us there is no opening left for merit; birth is the standard for everything; the prestige of birth is the sole key to advancement in the public service."],"attribution":"Ogier Ghiselin de Busbecq, ambassador of the Habsburg ruler Ferdinand I to the court of Ottoman Sultan Suleiman I, private letter written in 1555","translation":"Translated by C. T. Forster and F. H. B. Daniell (1881); adapted","footnotes":[{"mark":"*","text":"elite Ottoman infantry soldiers who served the sultan"}],"glossary":[{"t":"merit","d":"skill and good work"},{"t":"prestige of birth","d":"the respect a person gets for coming from a noble family"},{"t":"Turks","d":"Busbecq's word for the Ottomans"}]},"P13":{"type":"passage","paragraphs":["One of the great gifts which His Majesty the Shahanshah* made at the beginning of this year was the remission of the jizya** throughout India. … In spite of the disapproval of statesmen, and of the great revenue, and of much chatter on the part of the ignorant, this sublime decree was issued. …","When this tax was imposed in former times … the reason for it was that they [earlier rulers], on account of heart-rooted hatred, were set on the contempt and destruction of those of other faiths. … At the present day, when … those who belong to other religions have, like those of one mind and one religion, bound up the waist of devotion and service, and exert themselves for the advancement of the empire, how should they be classed with that old faction [non-Muslims seen as enemies in earlier times] and be the subjects of contempt? Moreover the main cause of levying the tax in old times was the neediness of the rulers. At this day, when there are thousands of treasures in the storehouses of the world-wide government … why should a just and wise mind apply itself to collecting this tax?"],"attribution":"Abu'l-Fazl, adviser and official historian of the Mughal emperor Akbar, the Akbarnama, written in the 1590s, describing a decree of 1564","translation":"Translated by Henry Beveridge (1907–1912); adapted","footnotes":[{"mark":"*","text":"\"King of kings,\" a title for Akbar (ruled 1556–1605)"},{"mark":"**","text":"a tax that Islamic states placed on non-Muslim subjects; in Mughal India most of the people who paid it were Hindus"}],"glossary":[{"t":"remission","d":"canceling a tax or debt"},{"t":"bound up the waist of devotion and service","d":"worked loyally"},{"t":"decree","d":"an official order from a ruler"},{"t":"revenue","d":"money the government collects"}]},"P15":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Nanban-Screens-by-Kano-Naizen-c1600.png/1280px-Nanban-Screens-by-Kano-Naizen-c1600.png","width":1280,"height":554,"alt":"A wide Japanese folding screen painted on gold showing a large European sailing ship, a crowd of Portuguese merchants with servants carrying goods, and priests in dark robes greeting them near Japanese shops.","caption":"On the left, a large Portuguese carrack (a three-masted ocean-going ship) lies at anchor while small boats bring people and cargo ashore. In the center, Portuguese merchants in tall hats and baggy trousers walk in a procession; attendants, several of them African (servants or enslaved people), carry chests and goods. On the right, Catholic priests in black and gray robes come out to greet them beside Japanese shops and a building used as a church.","attribution":"Kanō Naizen, Japanese painter, Arrival of the Southern Barbarians*, folding screen (ink, color, and gold leaf on paper), c. 1600","credit":"Kobe City Museum, Japan. Public domain image via Wikimedia Commons. *\"Southern Barbarians\" (Nanban) was the Japanese name for the Portuguese and Spanish, who came to Japan from the south.","description":"A very wide painting on a gold background. A dark three-masted European ship with flags sits in the water at left, with sailors in its rigging. Along the beach in the middle, a parade of Portuguese merchants wearing hats and puffed trousers is led by a richly dressed man under a parasol; attendants carry boxes, bundles, and a covered chair, and a white horse is led along. At right, Jesuit priests in black robes and friars in gray meet the arrivals near a row of Japanese shops, while Japanese people look on.","glossary":[{"t":"carrack","d":"a large sailing ship used by the Portuguese and Spanish for long ocean voyages"},{"t":"Jesuits","d":"an order of Catholic priests known for missionary work and education"}]},"P16":{"type":"bar","title":"Estimated Arrivals of Enslaved Africans Carried Directly from Africa, Selected Regions of the Americas","categories":["Brazil","British\nCaribbean","French\nCaribbean","Spanish\nAmericas","Dutch\nAmericas","Mainland\nN. America"],"series":[{"name":"1601–1700 (thousands)","values":[784,310,39,226,124,15]},{"name":"1701–1800 (thousands)","values":[1989,1813,995,146,295,295]}],"yLabel":"Thousands of people","text":"Estimates count people who survived the voyage from Africa and landed in each region. They do not count later voyages between ports in the A
