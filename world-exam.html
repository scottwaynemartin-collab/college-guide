and to ponder over it in order to be guided to the Creator … The Law* encourages and exhorts us to observe creation. … But the Law urges us to observe creation by means of reason and demands the knowledge thereof through reason. …","… if before us, somebody has enquired into it, we should derive help from what he has said. It is quite immaterial whether that man is our co-religionist or not … By these latter we mean those Ancients who investigated these things before the advent of Islam. … All that is required of us is that we should go back to their books and see what they have said in this connection. If all that they say be true, we should accept it and if there be something wrong, we should be warned by it."],"attribution":"Ibn Rushd (known in Europe as Averroes, 1126–1198), Muslim judge and philosopher in al-Andalus (Muslim-ruled Spain), The Decisive Treatise, about 1180","translation":"Translated by Mohammad Jamil-ur-Rehman, The Philosophy and Theology of Averroes (1921); adapted","footnotes":[{"mark":"*","text":"the Sharia, the religious law of Islam, based on the Quran and the Sunnah (the Prophet Muhammad's teachings and example)"}],"glossary":[{"t":"exhorts","d":"strongly urges"},{"t":"immaterial","d":"not important"},{"t":"co-religionist","d":"a person of the same religion"},{"t":"the Ancients","d":"here, the philosophers of ancient Greece"},{"t":"advent","d":"arrival"}]},{"label":"Source 2","paragraphs":["… It was necessary for man's salvation that there should be a knowledge revealed by God, besides philosophical science built up by human reason. … it was necessary for the salvation of man that certain truths which exceed human reason should be made known to him by divine revelation. …","… sacred doctrine makes use even of human reason, not, indeed, to prove faith … but to make clear other things that are put forward in this doctrine. Since therefore grace does not destroy nature, but perfects it, natural reason should minister to faith … Hence sacred doctrine makes use also of the authority of philosophers in those questions in which they were able to know the truth by natural reason …"],"attribution":"Thomas Aquinas (1225–1274), Italian Catholic priest and teacher at the University of Paris, Summa Theologica (Summary of Theology), written 1265–1274","translation":"Translated by the Fathers of the English Dominican Province (2nd ed., 1920); adapted","glossary":[{"t":"salvation","d":"being saved from sin and its results"},{"t":"divine revelation","d":"truth made known by God, as in the Bible"},{"t":"sacred doctrine","d":"Christian theology, based on the Bible"},{"t":"grace","d":"God's free gift to humans"},{"t":"minister to","d":"serve"}]}]},"P6":{"type":"passage","paragraphs":["… we arrived at the city of Dihli [Delhi], the metropolis of India, a vast and magnificent city, uniting beauty with strength. It is surrounded by a wall that has no equal in the world, and is the largest city in India, nay rather the largest city in the entire Muslim Orient. …","… [In the great mosque,] at the eastern gate there are two enormous idols of brass prostrate on the ground and held by stones, and everyone entering or leaving the mosque treads on them. The site was formerly occupied by an idol temple*, and was converted into a mosque on the conquest of the city. …","… The king of India, Sultan Muhammad Shah**, makes a practice of honouring strangers and distinguishing them by governorships or high dignities of State. The majority of his courtiers, palace officials, ministers of State, judges, and relatives by marriage are foreigners, and he has issued a decree that foreigners are to be given in his country the title of 'Aziz [Honourable], so that this has become a proper name for them. …","This king is of all men the fondest of making gifts and of shedding blood. His gate is never without some poor man enriched or some living man executed … The ceremonies of religion are strictly complied with at his court, and he is severe in the matter of attendance at prayer and in punishing those who neglect it."],"attribution":"Ibn Battuta, Muslim scholar from Morocco who served as a judge in Delhi from 1334 to 1342, from his book of travels, written down in 1355","translation":"Translated by H. A. R. Gibb (1929); adapted","footnotes":[{"mark":"*","text":"\"Idols\" and \"idol temple\" are this translation's words for sacred statues and a non-Muslim temple. The mosque was built partly with stone from earlier Hindu and Jain temples."},{"mark":"**","text":"Muhammad bin Tughluq, sultan of Delhi from 1325 to 1351"}],"glossary":[{"t":"metropolis","d":"a very large and important city"},{"t":"Muslim Orient","d":"the Muslim lands of the East"},{"t":"prostrate","d":"lying face down"},{"t":"dignities of State","d":"high government offices"}]},"P7":{"type":"passage","paragraphs":["… [Abd al-Razzaq] saw a place extremely large and thickly peopled, and a king possessing greatness and sovereignty to the highest degree, whose dominion extends from the frontier of [Sri Lanka] to the extremities of the country of [Gulbarga]*. … The country is for the most part well cultivated, very fertile, and contains about three hundred harbours. One sees there more than a thousand elephants … The troops amount in number to eleven lak (1,100,000).","One might seek in vain throughout the whole of [India] to find a more absolute rai (king) … Next to him the Brahmins hold a rank superior to that of all other men. …","The city of [Vijayanagara] is such that the pupil of the eye has never seen a place like it, and the ear of intelligence has never been informed that there existed anything to equal it in the world. It is built in such a manner that seven citadels and the same number of walls enclose each other. … In the space from the third to the seventh one meets a numberless crowd of people, many shops, and a bazaar. … the jewellers sell publicly in the bazaar pearls, rubies, emeralds, and diamonds."],"attribution":"Abd al-Razzaq Samarqandi, Persian official sent as an ambassador to India by Shah Rukh, the Timurid ruler of Herat, describing Vijayanagara, capital of a Hindu kingdom in southern India, which he visited in 1443","translation":"Translated from Persian into French by Étienne Quatremère, and into English by R. H. Major, India in the Fifteenth Century (1857); place names modernized; adapted","footnotes":[{"mark":"*","text":"a city to the north, in the Deccan region of central India"}],"glossary":[{"t":"sovereignty","d":"supreme power to rule"},{"t":"dominion","d":"the lands a ruler controls"},{"t":"lak","d":"100,000"},{"t":"Brahmins","d":"members of the priestly class"},{"t":"citadels","d":"fortresses"},{"t":"bazaar","d":"a market"}]},"P8":{"type":"table","title":"Tribute Owed to the Rulers of Tenochtitlan by Two Provinces of the Mexica (Aztec) Empire (selected items)","columns":["Item","Quauhnahuac province: 16 towns near the Valley of Mexico","Xoconochco province: 8 towns on the Pacific coast, far to the south"],"rows":[["Large woven cloaks","1,200 loads, twice a year","—"],["Paper","8,000 sheets, twice a year","—"],["Cups","2,000, twice a year","800 cups for drinking cacao, every six months"],["Warrior costumes and shields decorated with feathers","8 of each, once a year","—"],["Maize, beans, chia, and amaranth","4 large wooden bins, once a year","—"],["Cacao beans","—","200 loads, every six months"],["Feathers","—","800 handfuls of yellow feathers and 800 handfuls of green quetzal feathers, every six months"],["Jaguar skins","—","40, every six months"],["Jade stones","—","2 strings, every six months"]],"text":"The codex was painted by Indigenous artists, with notes in Spanish, in Mexico City about 1541, twenty years after the Spanish conquest. It was probably ordered by the first Spanish viceroy (governor) to send to the king of Spain. Historians believe its tribute pages were based on older Mexica tribute records. The notes say the Mexica rulers placed tax collectors and a governor from Tenochtitlan in the towns of Quauhnahuac \"that they should not rebell.\" The table lists what the codex says was owed, not proof of what was delivered. A dash (—) means the item is not among the entries chosen for this table.","source":"Codex Mendoza, about 1541, tribute section; English translation of the Spanish notes published by Samuel Purchas in Purchas His Pilgrimes (1625; reprinted 1906, Vol. XV)"},"P9":{"type":"passage","paragraphs":["… When we arrived at the great market place, called Tlaltelolco, we were astounded at the number of people and the quantity of merchandise that it contained, and at the good order and control that was maintained, for we had never seen such a thing before. … Each kind of merchandise was kept by itself and had its fixed place marked out. Let us begin with the dealers in gold, silver, and precious stones, feathers, mantles, and embroidered goods. … there were cacahuateros who sold cacao. In this way one could see every sort of merchandise that is to be found in the whole of New Spain, placed in arrangement in the same manner as they do in my own country, which is Medina del Campo, where they hold the fairs …","… There are also buildings where three magistrates sit in judgment, and there are executive officers like Alguacils who inspect the merchandise. …","… there were many more merchants, who, as I was told, brought gold for sale in grains, just as it is taken from the mines. The gold is placed in thin quills of the geese of the country … and according to the length and thickness of the quills they arrange their accounts with one another, how much so many mantles or so many gourds full of cacao were worth, or how many slaves, or whatever other thing they were exchanging."],"attribution":"Bernal Díaz del Castillo, Spanish soldier who marched with Hernán Cortés, describing the market at Tlatelolco, the twin city of the Mexica (Aztec) capital Tenochtitlan, in November 1519; he finished writing his account about 1568","translation":"Translated by Alfred P. Maudslay, The True History of the Conquest of New Spain (1910); adapted","glossary":[{"t":"mantles","d":"cotton cloaks; they were also used like money"},{"t":"cacahuateros / cacao","d":"cacao sellers / cacao beans, used to make chocolate and also used like money"},{"t":"New Spain","d":"the Spanish name for Mexico"},{"t":"Medina del Campo","d":"a Spanish town famous for its large trade fairs"},{"t":"magistrates","d":"judges"},{"t":"Alguacils","d":"Spanish police officers"},{"t":"quills","d":"the hollow stems of large feathers"}]},"P10":{"type":"passage","paragraphs":["… Very different was the policy pursued by the two races* in their military career. The Aztecs, animated by the most ferocious spirit, carried on a war of extermination, signalizing their triumphs by the sacrifice of hecatombs of captives; while the Incas, although they pursued the game of conquest with equal pertinacity, preferred a milder policy, substituting negotiation and intrigue for violence, and dealt with their antagonists so that their future resources should not be crippled, and that they should come as friends, not as foes, into the bosom of the empire.","Their policy toward the conquered forms a contrast no less striking to that pursued by the Aztecs. The Mexican vassals were ground by excessive imposts and military conscriptions. … They were over-awed by fortresses and armed garrisons, and were made to feel every hour that they were not part and parcel of the nation, but held only in subjugation as a conquered people. The Incas, on the other hand, admitted their new subjects at once to all the rights enjoyed by the rest of the community; and, though they made them conform to the established laws and usages of the empire, they watched over their personal security and comfort with a sort of parental solicitude. The motley population, thus bound together by common interest, was animated by a common feeling of loyalty, which gave greater strength and stability to the empire, as it became more and more widely extended; while the various tribes who successively came under the Mexican sceptre, being held together only by the pressure of external force, were ready to fall asunder the moment that that force was withdrawn. The policy of the two nations displayed the principle of fear as contrasted with the principle of love."],"attribution":"William H. Prescott, United States historian, History of the Conquest of Peru, published in 1847","translation":"Adapted","footnotes":[{"mark":"*","text":"Prescott, writing in 1847, uses \"races\" for peoples, an old usage historians no longer follow, and \"Mexican\" for the Mexica (Aztecs)."}],"glossary":[{"t":"extermination","d":"killing off completely"},{"t":"hecatombs","d":"very large numbers (of people killed in sacrifice)"},{"t":"pertinacity","d":"stubborn determination"},{"t":"vassals","d":"conquered peoples who had to obey and pay the rulers"},{"t":"imposts / conscriptions","d":"taxes / forced military service"},{"t":"subjugation","d":"being ruled by force"},{"t":"solicitude","d":"care and concern"},{"t":"motley","d":"mixed; made up of many different groups"},{"t":"sceptre","d":"rule (a sceptre is the rod a king carries)"},{"t":"fall asunder","d":"fall apart"}]},"P11":{"type":"passage","paragraphs":["… [We] came to Maqdashaw [Mogadishu], which is an enormous town. Its inhabitants are merchants and have many camels, of which they slaughter hundreds every day [for food]. When a vessel reaches the port, it is met by sumbuqs, which are small boats, in each of which are a number of young men, each carrying a covered dish containing food. He presents this to one of the merchants on the ship saying \"This is my guest,\" and all the others do the same. … The host then sells his goods for him and buys for him, and if anyone buys anything from him at too low a price, or sells to him in the absence of his host, the sale is regarded by them as invalid. …","… [We] pursued our journey to Kulwa [Kilwa], which is a large town on the coast. … I was told by a merchant that the town of Sufala* lies a fortnight's journey [south] from Kulwa and that gold dust is brought to Sufala from Yufi in the country of the Limis, which is a month's journey distant from it. …","The sultan at the time of my visit was Abu'l-Muzaffar Hasan, who was noted for his gifts and generosity. He used to devote the fifth part of the booty made on his expeditions to pious and charitable purposes, as is prescribed in the Koran …"],"attribution":"Ibn Battuta, Muslim scholar from Morocco, describing his voyage along the East African coast in about 1331, from his book of travels, written down in 1355","translation":"Translated by H. A. R. Gibb (1929); adapted","footnotes":[{"mark":"*","text":"Sofala, a port far to the south, in today's Mozambique. Historians are not sure what place Ibn Battuta meant by \"Yufi\"; he was repeating what a merchant told him."}],"glossary":[{"t":"sumbuqs","d":"small boats"},{"t":"invalid","d":"not legal; it does not count"},{"t":"fortnight","d":"two weeks"},{"t":"booty","d":"goods captured in war"},{"t":"pious","d":"religious"},{"t":"Koran","d":"the Quran, the holy book of Islam"}]},"P12":{"type":"passage","paragraphs":["… Before there was sufficient evidence on which to base any suggestions whatsoever as to origin or date, popular opinion had confidently settled the question to its own great satisfaction. It had decided that the Rhodesian* ruins must be of immense antiquity, and, following the mediaeval chroniclers with an uncritical credulity …, had pronounced Zimbabwe and all similar buildings to be the work of an ancient people from the East. …","… nothing had then been obtained from the ruins which an archaeologist could recognise as more than a few centuries old; and … the objects, when not immediately recognisable as medieval imports, were of characteristically African type. …","… It is impossible, therefore, to resist the conclusion that the people who inhabited the \"Elliptical Temple\"** when it was built belonged to tribes whose arts and manufactures were indistinguishable from those of the modern Makalanga***. … Mr. Hall [who dug at the site before the author] states … that he found in Enclosure 15 (and therefore necessarily within the same cement mass that I dug …) mediaeval Arabic glass and Nankin china. … The date of the Elliptical Temple, then, is not earlier than the fourteenth or fifteenth century.","… In the valley, then, no doubt, lived those wealthy traders who received the gold brought in from neighbouring districts and bartered it with Arab merchants from the east coast. … Zimbabwe itself was simply the distributing centre."],"attribution":"David Randall-MacIver, British archaeologist, Mediaeval Rhodesia, a report on his 1905 excavations at Great Zimbabwe and other stone ruins in southern Africa, published in 1906","translation":"Adapted","footnotes":[{"mark":"*","text":"Rhodesia was the British colonial name for the region that includes today's Zimbabwe."},{"mark":"**","text":"the large oval stone enclosure at Great Zimbabwe, today called the Great Enclosure"},{"mark":"***","text":"a Shona-speaking people who lived in the region in Randall-MacIver's time"}],"glossary":[{"t":"immense antiquity","d":"very great age"},{"t":"uncritical credulity","d":"believing things without checking them"},{"t":"Nankin china","d":"Chinese porcelain"},{"t":"cement mass","d":"the hard platform of cement and stone under the building"},{"t":"bartered","d":"traded goods for other goods"}]},"P13":{"type":"passage","paragraphs":["Now there was a law in the country of Ethiopia that [only] a woman should reign … but the Queen* said [unto Solomon], \"Henceforward a man who is of thy seed shall reign, and a woman shall nevermore reign; only seed of thine shall reign and his seed after him from generation to generation. …\"","… And moreover, the dominion of the King of Ethiopia belongeth to him and to his seed for ever.","… the Kings of Ethiopia have become glorious and great through Zion** …","[From the scribe's closing note:] \"… It went out in the days of Zagua***, and they did not translate it because this book says: Those who reign not being Israelites are transgressors of the Law. … For I have toiled much for the glory of the country of Ethiopia, and for the going forth of the heavenly Zion, and for the glory of the King of Ethiopia.\""],"attribution":"Kebra Nagast (The Glory of Kings), an Ethiopian Christian book of royal history and legend, put into the Ethiopian language Ge'ez in the early 1300s; its closing note names a Christian scribe, Isaac, as a translator","translation":"Translated by E. A. Wallis Budge, The Queen of Sheba and Her Only Son Menyelek (1922); adapted","footnotes":[{"mark":"*","text":"the Queen of Sheba (called Makeda in Ethiopia), who in the story visits King Solomon of ancient Israel and has a son, Menyelek, the first king of Ethiopia's royal line"},{"mark":"**","text":"the Ark of the Covenant, which the book says Menyelek brought from Jerusalem to Ethiopia"},{"mark":"***","text":"the Zagwe dynasty, an earlier line of Ethiopian kings"}],"glossary":[{"t":"seed","d":"descendants (children, grandchildren, and so on)"},{"t":"dominion","d":"the right to rule"},{"t":"transgressors of the Law","d":"people who break God's law"},{"t":"toiled","d":"worked hard"}]},"P14":{"type":"passage","paragraphs":["The abbot of Peterborough holds the manor of Alwalton … from the lord king directly … Of these hides the said abbot has in demesne 1 hide and a half of land …","Free Tenants. Thomas le Boteler holds a messuage with a court yard … and 3 acres of land, by charter, paying thence yearly to the said abbot 14s. …","Villeins. Hugh Miller holds 1 virgate of land in villenage … Likewise the same Hugh works through the whole year except 1 week at Christmas, 1 week at Easter, and 1 at Whitsuntide, that is in each week 3 days, each day with 1 man, and in autumn each day with 2 men, performing the said works at the will of the said abbot as in plowing and other work. … Likewise he gives 3 hens and 1 cock yearly and 5 eggs at Easter. … He gives also merchet and heriot, and is tallaged at the feast of St. Michael, at the will of the said abbot. There are also there 17 other villeins … each of whom holds 1 virgate of land in villenage, paying and doing in all things … just as the said Hugh Miller.","Cotters. Henry, son of the miller, holds a cottage with a croft which contains 1 rood, paying thence yearly to the said abbot 2s. Likewise he works for 3 days in carrying hay and in other works at the will of the said abbot …"],"attribution":"Survey of the manor of Alwalton, England, held by the abbot of Peterborough Abbey, recorded for King Edward I's royal inquiry (the Hundred Rolls), 1279","translation":"Translated from Latin in Edward P. Cheyney, ed., English Manorial Documents (1896); adapted","glossary":[{"t":"abbot","d":"the head of a monastery"},{"t":"manor","d":"a lord's estate, with his land and the peasants who worked it"},{"t":"hide / virgate","d":"units of farmland; this survey says a virgate was 25 acres and a hide was 5 virgates"},{"t":"demesne","d":"land the lord kept and farmed for himself"},{"t":"messuage / charter","d":"a house and its yard / a written grant"},{"t":"14s. / 2s.","d":"14 shillings / 2 shillings (English money)"},{"t":"villeins / villenage","d":"unfree peasants / the status of an unfree peasant"},{"t":"Whitsuntide, feast of St. Michael","d":"church holidays in spring and in late September"},{"t":"merchet / heriot","d":"a fee paid to the lord when a daughter married / a payment, often the best animal, owed when a tenant died"},{"t":"tallaged","d":"taxed by the lord"},{"t":"cotters / croft / rood","d":"peasants with only a cottage and a little land / a small field / a quarter of an acre"}]},"P15":{"type":"passage","paragraphs":["… By the words of the gospel we are taught that the two swords*, namely, the spiritual authority and the temporal are in the power of the church. … Both swords, therefore, the spiritual and the temporal, are in the power of the church. The former is to be used by the church, the latter for the church; the one by the hand of the priest, the other by the hand of kings and knights, but at the command and permission of the priest. Moreover, it is necessary for one sword to be under the other, and the temporal authority to be subjected to the spiritual …","… Therefore if the temporal power errs, it will be judged by the spiritual power, and if the lower spiritual power errs, it will be judged by its superior. But if the highest spiritual power errs, it can not be judged by men, but by God alone. …","… We therefore declare, say, and affirm that submission on the part of every man to the bishop of Rome is altogether necessary for his salvation."],"attribution":"Pope Boniface VIII, Unam Sanctam (One Holy), a papal bull (official decree) issued in 1302","translation":"Translated in Oliver J. Thatcher and Edgar H. McNeal, A Source Book for Mediæval History (1905); adapted","footnotes":[{"mark":"*","text":"a symbol of two kinds of power, taken from a Bible passage (Luke 22:38)"}],"glossary":[{"t":"spiritual","d":"religious"},{"t":"temporal","d":"worldly; having to do with government"},{"t":"errs","d":"makes a mistake"},{"t":"bishop of Rome","d":"the pope"},{"t":"salvation","d":"being saved from sin and going to heaven"}]},"P16":{"type":"pair","items":[{"label":"Source 1","paragraphs":["… We decree that no Christian shall use violence to compel the Jews to accept baptism. … No Christian shall do the Jews any personal injury, except in executing the judgments of a judge, or deprive them of their possessions, or change the rights and privileges which they have been accustomed to have. During the celebration of their festivals, no one shall disturb them by beating them with clubs or by throwing stones at them. … we forbid anyone to deface or damage their cemeteries or to extort money from them by threatening to exhume the bodies of their dead. …"],"attribution":"Pope Innocent III, decree on the treatment of Jews, 1199","translation":"Translated in Oliver J. Thatcher and Edgar H. McNeal, A Source Book for Mediæval History (1905); adapted","glossary":[{"t":"baptism","d":"the ritual of becoming a Christian"},{"t":"extort","d":"get by threats"},{"t":"exhume","d":"dig up"}]},{"label":"Source 2","paragraphs":["If any of those who go on the crusade are bound by oath to pay interest, their creditors, under threat of ecclesiastical censure, shall be compelled to free them from their oath and from the payment of the interest. … We order the secular authorities to compel the Jews to remit the interest to all crusaders, and until they do remit it they shall have no intercourse with Christians. …"],"attribution":"Pope Innocent III and the Fourth Lateran Council (a meeting of Church leaders), decree calling for a new crusade, 1215","translation":"Translated in Oliver J. Thatcher and Edgar H. McNeal, A Source Book for Mediæval History (1905); adapted","glossary":[{"t":"crusade","d":"a holy war called by the pope"},{"t":"creditors","d":"people who are owed money"},{"t":"ecclesiastical censure","d":"punishment by the Church"},{"t":"secular authorities","d":"kings and other non-church rulers"},{"t":"remit","d":"cancel"},{"t":"intercourse","d":"here, business or social dealings"}]}]}},"practice":[{"id":"U1-P01","set":"P1","topic":"1.1","lo":"C","skill":"3.B","difficulty":"easy","stem":"Polo's description of the city's crafts and merchants best supports which claim about Song China?","options":{"A":"Its economy depended mostly on the labor of enslaved workers in its cities.","B":"Its cities were centers of large-scale manufacturing and trade.","C":"Its merchants were forbidden to sell goods to other cities.","D":"Its craftsmen made goods mainly for the emperor and his officials at court."},"answer":"B","explanation":"Polo describes guilds of craftsmen, very rich merchants, and busy markets. His numbers may be exaggerated, but his account shows that making and selling goods were central to Song city life.","whyNot":{"A":"Polo describes guilds of workmen and very wealthy merchants, not enslaved workers.","C":"Polo says the city supplied \"many other cities of the kingdom.\"","D":"The goods were sold widely to other cities and in huge markets, not made just for the emperor."},"hint":"Look at what the guilds made and where their goods went."},{"id":"U1-P02","set":"P1","topic":"1.1","lo":"C","skill":"2.C","difficulty":"hard","stem":"Historians should be careful with the numbers in the second paragraph mainly because","options":{"A":"Polo counted the houses himself and made mistakes in his arithmetic","B":"Mongol officials kept no records of the city's population or trade","C":"they come from a plea asking a conqueror to spare the city","D":"the numbers describe Venice, which Polo was comparing to Hangzhou"},"answer":"C","explanation":"The figures came from a statement written to the Mongol general. Its goal was to make him spare the city. A writer with that goal had reason to make the city sound as grand as possible.","whyNot":{"A":"Polo says the numbers came from \"the document aforesaid,\" not from his own count.","B":"Polo does not say whether the Mongols kept records, and that is not why the numbers are doubtful.","D":"The numbers describe Kinsay (Hangzhou), not Venice."},"hint":"Read the end of the first paragraph. Why was the document written?"},{"id":"U1-P03","set":"P1","topic":"1.1","lo":"C","skill":"5.A","difficulty":"medium","stem":"Polo's description of Hangzhou is most similar to descriptions of which other city?","options":{"A":"Tenochtitlan, the capital of the Mexica Empire","B":"Cuzco, the capital of the Inca Empire","C":"Great Zimbabwe, the capital of a southern African kingdom","D":"Timbuktu, a trading city of the Mali Empire"},"answer":"A","explanation":"Like Hangzhou, Tenochtitlan used canals and boats to move goods to busy markets. Its giant market at Tlatelolco amazed Spanish visitors in 1519.","whyNot":{"B":"Cuzco was a great capital, but it was a mountain city, not a city of canals and boats.","C":"Great Zimbabwe was a stone-walled inland capital, not a city of canals and boats.","D":"Timbuktu was a trade and learning center, but it was not built around canals."},"hint":"Think about how people and goods moved around Hangzhou. Then test each city in the choices.","reasoning":"Comparison"},{"id":"U1-P04","set":"P2","topic":"1.1","lo":"A","skill":"1.B","difficulty":"easy","stem":"The memorial best illustrates which feature of Song government?","options":{"A":"Military generals made most decisions and gave orders directly to the emperor.","B":"Scholar-officials were expected to advise and correct the emperor.","C":"Buddhist monks controlled the treasury and decided how silk was used.","D":"Wealthy merchants bought government posts and set the empire's tax rates."},"answer":"B","explanation":"Song emperors relied on scholar-officials. Many earned their posts by passing exams on Confucian texts. Censors were expected to report wrongdoing and criticize bad decisions, even the emperor's.","whyNot":{"A":"The writer is a scholar-official serving as a censor, not a general.","C":"The memorial does not mention Buddhist monks; the Treasury and the emperor decide spending.","D":"Ouyang Xiu earned his post by passing the civil service exams, not by buying it."},"hint":"What was Ouyang Xiu's job, and what did it require him to do?"},{"id":"U1-P05","set":"P2","topic":"1.1","lo":"A","skill":"2.B","difficulty":"medium","stem":"Ouyang Xiu's main purpose in the memorial was to","options":{"A":"ask the emperor to raise the pay of workers in the Dyeing Department","B":"convince the emperor to send a trade mission to Southeast Asia","C":"request that Lady Chang be named empress in place of the current empress","D":"persuade the emperor to cut palace spending and favors to relatives"},"answer":"D","explanation":"Ouyang Xiu says the palace spends too much. He also says Lady Chang's family gets too many gifts. He asks the emperor to \"rectify these abuses.\"","whyNot":{"A":"He mentions the dyers' suffering to show the cost of waste, not to ask for higher pay.","B":"The memorial is about palace spending, not trade abroad.","C":"He warns against Lady Chang's relatives receiving too much; he does not ask to raise her rank."},"hint":"Look at the last sentence. What does he want the emperor to do?"},{"id":"U1-P06","set":"P2","topic":"1.1","lo":"A","skill":"4.B","difficulty":"hard","stem":"Ouyang Xiu's warning that the emperor's actions might bring \"divine wrath\" is best explained by the Chinese belief that","options":{"A":"the emperor was a living god whose decisions could not be questioned","B":"Buddhist monks could punish rulers who spent too much on their families","C":"the emperor's officials were chosen by priests who spoke for the gods","D":"an emperor could lose the Mandate of Heaven by ruling badly"},"answer":"D","explanation":"Chinese rulers claimed the Mandate of Heaven, or Heaven's approval to rule. People believed Heaven could take it away from a bad ruler. So a loyal official warned the emperor in time.","whyNot":{"A":"If the emperor could not be questioned, a censor like Ouyang Xiu would not be warning him.","B":"The memorial appeals to Heaven's judgment. It does not give Buddhist monks any power to punish the emperor.","C":"Song officials were chosen mainly by civil service exams, not by priests."},"hint":"Which Chinese idea connected Heaven's approval with good rule?"},{"id":"U1-P07","set":"P3","topic":"1.1","lo":"C","skill":"1.B","difficulty":"easy","stem":"The scene in the painting best illustrates which feature of the Song economy?","options":{"A":"A farming economy in which families grew food for themselves rather than for sale","B":"A government ban on private trade outside the emperor's palace","C":"A busy commercial life of shops, markets, and goods moving by water and road","D":"A shortage of workers that left Song cities nearly empty"},"answer":"C","explanation":"The scroll shows shops, restaurants, vendors, porters, carts, and boats. Song China's economy was very commercial. People bought and sold goods for money.","whyNot":{"A":"The painting shows a crowded city with shops and cargo, not families farming for themselves.","B":"Private sellers fill the bridge and riverbanks, so trade was not banned.","D":"The bridge and streets are packed with people."},"hint":"Count the shops, stalls, carts, and boats."},{"id":"U1-P08","set":"P3","topic":"1.1","lo":"C","skill":"5.B","difficulty":"medium","stem":"Which of the following most directly contributed to the growth of cities like the one shown in the painting?","options":{"A":"The Mongol conquest that united northern and southern China","B":"The spread of Neo-Confucian ideas about family duty","C":"The Song government's ban on trade with foreign merchants","D":"The spread of fast-ripening Champa rice from Vietnam"},"answer":"D","explanation":"Fast-ripening Champa rice came from what is now Vietnam. In warm, wet parts of southern China, farmers could grow two crops a year. More food supported more people, and cities grew.","whyNot":{"A":"The Mongols conquered the Song in 1279, more than 150 years after this painting was made.","B":"Neo-Confucianism shaped ideas about family and government, but it did not grow the food that cities needed.","C":"The Song government encouraged and taxed foreign trade. It did not ban it."},"hint":"What change outside the city could help it feed more people?","reasoning":"Causation"},{"id":"U1-P09","set":"P3","topic":"1.1","lo":"C","skill":"4.A","difficulty":"medium","stem":"The large cargo boat on the river is best understood in the context of","options":{"A":"Song China's rivers and canals, including the Grand Canal","B":"the Song navy's war against Japanese pirates on the coast of China","C":"the voyages of the Ming admiral Zheng He to the Indian Ocean","D":"the use of camel caravans to carry goods across Central Asia"},"answer":"A","explanation":"Rivers and canals, like the Grand Canal, linked China's south and north. Boats carried rice and other goods to the growing cities.","whyNot":{"B":"The boat is a river cargo boat in a city, not a warship fighting pirates.","C":"Zheng He's voyages took place in the early 1400s, about three hundred years after this painting.","D":"Camel caravans crossed deserts; this boat is moving goods on a river."},"hint":"How did goods travel between China's north and south?"},{"id":"U1-P10","set":"P4","topic":"1.2","lo":"D","skill":"3.A","difficulty":"easy","stem":"Al-Ghazali's main claim in the passage is that","options":{"A":"Islamic law should be replaced by the teachings of the Greek philosophers","B":"scholars should spend their lives teaching in famous colleges in Baghdad","C":"Sufi practice offers a path to knowing God that study alone cannot provide","D":"Muslims should follow the reasoning of the theologians rather than personal experience"},"answer":"C","explanation":"Al-Ghazali says Sufism is about \"experiences rather than definitions.\" Learning about Sufism was not enough. He also had to practice it and examine his own motives, so he gave up his famous teaching job.","whyNot":{"A":"Al-Ghazali says philosophers could not make the Sufis' way any better. So he is not picking philosophy over religious law.","B":"He gave up his teaching post in Baghdad because he thought it was driven by pride.","D":"He says direct experience of God, not argument alone, brought him certainty."},"hint":"What did al-Ghazali give up, and what did he choose instead?"},{"id":"U1-P11","set":"P4","topic":"1.2","lo":"E","skill":"5.B","difficulty":"medium","stem":"Sufi practices like those al-Ghazali describes most directly contributed to which development from c. 1200 to c. 1450?","options":{"A":"The spread of Islam into South and Southeast Asia and Africa","B":"The end of the Abbasid Caliphate's rule over the Muslim lands of Spain","C":"The Crusaders' capture of Jerusalem from Muslim rulers","D":"The adoption of Confucian ideas by the Delhi Sultanate"},"answer":"A","explanation":"Sufi teachers traveled far, built communities, and often blended Islam with local customs. Along with trade and new Muslim rulers, their work helped Islam spread in South Asia, Southeast Asia, and Africa.","whyNot":{"B":"Muslim Spain had broken away from the Abbasids in the 700s, long before this period.","C":"The Crusaders captured Jerusalem by war in 1099; Sufi practices did not cause it.","D":"The Delhi Sultanate did not adopt Confucian ideas."},"hint":"Sufis traveled and taught. What happened in the places they went?","reasoning":"Causation"},{"id":"U1-P12","set":"P4","topic":"1.2","lo":"D","skill":"5.A","difficulty":"hard","stem":"The approach to religion that al-Ghazali describes is most similar to which of the following?","options":{"A":"Neo-Confucianism in China","B":"The doctrine of papal supremacy over kings","C":"The Bhakti movement in South Asia","D":"Inca worship of the sun as the royal ancestor"},"answer":"C","explanation":"Many Sufi and Bhakti teachers stressed personal devotion and love for God. Both taught that a person could reach God through the heart, though their followers could also value study, ritual, and religious rules.","whyNot":{"A":"Neo-Confucianism was about how people should treat their families and rulers. It was not about feeling close to God.","B":"That claim is about the power of the Church over kings, not personal devotion.","D":"This choice is about royal ancestry and power, while the passage focuses on a personal religious path."},"hint":"Decide what al-Ghazali values most in religious practice. Then look for a movement with the same focus.","reasoning":"Comparison"},{"id":"U1-P13","set":"P5","topic":"1.2","lo":"F","skill":"3.C","difficulty":"easy","stem":"Which of the following best describes a similarity between the two sources?","options":{"A":"Both say believers should ignore the ancient Greek philosophers.","B":"Both say reason and philosophy can work together with religious faith.","C":"Both say religious law should be replaced by human reason.","D":"Both say the study of philosophy should be left to priests."},"answer":"B","explanation":"Ibn Rushd says Islamic law tells people to study creation with reason. Aquinas says reason should \"minister to faith.\" Both saw reason and faith as partners.","whyNot":{"A":"Source 1 says to read the Ancients' books, and Source 2 uses the authority of philosophers.","C":"Both say reason serves religion; neither says it should replace religious law.","D":"Neither source limits philosophy to priests."},"hint":"What does each writer say reason and philosophy can do for faith?","reasoning":"Comparison"},{"id":"U1-P14","set":"P5","topic":"1.2","lo":"F","skill":"3.C","difficulty":"hard","stem":"Which difference in emphasis between the two sources is most clearly supported?","options":{"A":"Source 1 rejects the Greek philosophers; Source 2 rejects the Bible as a guide to truth.","B":"Source 1 stresses a duty to use reason; Source 2 stresses truths known by revelation.","C":"Source 1 wants judges to decide what may be studied; Source 2 leaves that to the pope.","D":"Source 1 is written for Christians; Source 2 is written for Muslims."},"answer":"B","explanation":"Both writers value reason. Ibn Rushd stresses that Islamic law calls for the study of philosophy. Aquinas stresses that some truths are beyond reason and must be revealed by God. The sources differ in emphasis; they do not fully disagree.","whyNot":{"A":"Source 1 tells readers to study the Ancients' books, and Source 2 depends on the Bible.","C":"Neither source says who decides what may be studied. Both discuss how reason relates to faith.","D":"Ibn Rushd wrote about Islamic law for Muslims, and Aquinas wrote for Christians."},"hint":"Find the words \"exceed human reason\" in Source 2. What does Source 1 focus on instead?","reasoning":"Comparison"},{"id":"U1-P15","set":"P5","topic":"1.2","lo":"F","skill":"5.B","difficulty":"medium","stem":"Ideas like those of Ibn Rushd most likely reached Christian scholars such as Aquinas through","options":{"A":"Mongol envoys who carried books from Baghdad to Paris","B":"Portuguese sailors returning from voyages around Africa","C":"Chinese merchants who sold printed books in European ports","D":"Latin translations of Arabic books made in Spain"},"answer":"D","explanation":"Scholars in Spain and Sicily turned Arabic books into Latin. These included Ibn Rushd's notes on Aristotle. Thinkers like Aquinas read them and argued about them.","whyNot":{"A":"The Mongols did not carry Arabic philosophy books to Paris.","B":"Portuguese voyages around Africa came in the late 1400s, after Aquinas died in 1274.","C":"Chinese merchants did not sell books in European ports in this period."},"hint":"Muslim Spain and Christian Europe were neighbors. How did ideas cross between them?","reasoning":"Causation"},{"id":"U1-P16","set":"P6","topic":"1.2","lo":"E","skill":"1.B","difficulty":"easy","stem":"The passage best illustrates which characteristic of the Delhi Sultanate?","options":{"A":"It was a Hindu kingdom that welcomed Buddhist monks from China.","B":"It was a Muslim state that ruled over a large Hindu population.","C":"It was a province of the Abbasid Caliphate ruled from Baghdad.","D":"It was a Mongol khanate ruled from Persia."},"answer":"B","explanation":"Muslim Turkic armies conquered northern India around 1200. Their sultans ruled from Delhi. Most of their subjects stayed Hindu.","whyNot":{"A":"The sultan is a Muslim ruler; the passage describes a mosque built where a Hindu temple had stood.","C":"Delhi was an independent sultanate. Mongol forces ended Abbasid rule in Baghdad in 1258.","D":"The Delhi sultans fought off Mongol attacks. They were not ruled by the Mongols."},"hint":"What religion did the sultan follow? What had stood on the mosque's site before?"},{"id":"U1-P17","set":"P6","topic":"1.2","lo":"E","skill":"5.B","difficulty":"medium","stem":"The sultan's practice of giving high offices to foreigners helps explain how","options":{"A":"scholars like Ibn Battuta could find posts across Dar al-Islam","B":"Hindu priests came to control most of the Delhi Sultanate's government","C":"Chinese officials introduced civil service exams to northern India","D":"European knights became the main soldiers of the sultan's army"},"answer":"A","explanation":"Training in Islamic law gave scholars skills that many Muslim states valued. So a scholar from Morocco could work as a judge in Delhi. Ibn Battuta did just that.","whyNot":{"B":"The sultan favored foreign Muslims; the passage does not say Hindu priests ran the government.","C":"The Delhi Sultanate did not adopt Chinese civil service exams.","D":"European knights did not serve as the sultan's army."},"hint":"Ibn Battuta was a foreigner. What job did he get in Delhi?","reasoning":"Causation"},{"id":"U1-P18","set":"P6","topic":"1.3","lo":"G","skill":"4.A","difficulty":"hard","stem":"The building of a mosque on the site of a temple, described in the second paragraph, is best understood in the context of","options":{"A":"the conversion of most Indians to Islam by the early 1200s","B":"the Mughal emperors' policy of welcoming many religions","C":"Buddhism's replacement of Hinduism as India's main religion","D":"rulers' use of buildings to display their power and faith"},"answer":"D","explanation":"After Muslim armies took Delhi, they turned a temple site into a mosque. This displayed the new rulers' power and faith, and it could stir conflict with Hindu subjects. It does not show how every sultan treated his subjects.","whyNot":{"A":"Most people in India stayed Hindu; they did not convert by the 1200s.","B":"The Mughal Empire was founded in 1526, long after Ibn Battuta's visit.","C":"Hinduism stayed India's main religion; Buddhism had declined there."},"hint":"What message would new rulers send by building a mosque on a temple site?"},{"id":"U1-P19","set":"P7","topic":"1.3","lo":"H","skill":"1.B","difficulty":"easy","stem":"Abd al-Razzaq's description best supports which claim about Vijayanagara?","options":{"A":"Its merchant councils held more power than the kings who inherited the throne.","B":"Its rulers lived mainly on tribute from nomadic herders who moved with their flocks.","C":"Its military power was divided among many independent port cities.","D":"Its wealth supported a powerful king who ruled a large territory."},"answer":"D","explanation":"Abd al-Razzaq describes a fertile, crowded country and a very powerful king whose lands stretched from the border of Sri Lanka far to the north. His troop number is a visitor's report, not an exact count. Vijayanagara was one of South Asia's strongest states.","whyNot":{"A":"He calls the king \"absolute\" and gives him great power. He says nothing about merchant councils ruling.","B":"He describes a well-farmed, fertile country and busy markets, not nomadic herders paying tribute.","C":"The country has about three hundred harbors, but one king rules them all, with a huge army."},"hint":"List what he says about the king, the army, and the markets."},{"id":"U1-P20","set":"P7","topic":"1.3","lo":"G","skill":"1.B","difficulty":"medium","stem":"The statement that \"the Brahmins hold a rank superior to that of all other men\" best reflects the influence of","options":{"A":"the Hindu caste system on social order in South Asia","B":"Buddhist monasteries that owned most of India's farmland","C":"Islamic law, which placed scholars above rulers","D":"Confucian ideas about loyalty between minister and ruler"},"answer":"A","explanation":"In Hindu social tradition, people were born into ranked groups. Brahmins, many of whom were priests or scholars, held the highest religious status. Their actual wealth and power could vary.","whyNot":{"B":"Brahmins were Hindu priests, not Buddhist monks.","C":"Brahmins were part of the Hindu social order, not Islamic law.","D":"Confucianism shaped East Asia, not the Hindu kingdom of Vijayanagara."},"hint":"First decide which religion the Brahmins belonged to. Then ask which choice explains why a whole group was ranked above others."},{"id":"U1-P21","set":"P7","topic":"1.3","lo":"H","skill":"4.A","difficulty":"hard","stem":"Vijayanagara's large army and seven rings of walls are best understood in the context of","options":{"A":"attacks by Portuguese warships on the cities of southern India","B":"the Mongol invasion and conquest of southern India in the 1200s","C":"rebellions by Buddhist monks against the Hindu kings of the south","D":"wars with nearby Muslim states such as the Bahmani Sultanate"},"answer":"D","explanation":"Vijayanagara was founded in 1336. It fought many wars with the Bahmani Sultanate to its north. Strong walls and a big army helped it survive.","whyNot":{"A":"The Portuguese did not reach India until 1498, more than 50 years after this visit.","B":"The Mongols did not conquer southern India.","C":"Vijayanagara mostly fought nearby Muslim kingdoms, not Buddhist monks."},"hint":"Who were Vijayanagara's neighbors to the north?"},{"id":"U1-P22","set":"P8","topic":"1.4","lo":"I","skill":"1.B","difficulty":"easy","stem":"The table best supports which claim about the Mexica Empire?","options":{"A":"It collected its taxes mainly in gold and silver coins.","B":"It got its cacao and feathers by trading with the Inca Empire.","C":"It asked its provinces to send tribute once in ten years.","D":"It drew goods from conquered peoples in different environments."},"answer":"D","explanation":"A province near the capital sent cloth, paper, cups, and food. A far-off tropical province sent cacao, feathers, and jaguar skins. Tribute brought wealth from many regions.","whyNot":{"A":"The tribute was mostly cloth, food, feathers, and other goods. The Mexica did not use coins.","B":"The Mexica and Inca did not trade directly. The cacao and feathers came as tribute from Xoconochco.","C":"The table shows payments every six months or once a year."},"hint":"Compare what each province sent. Where did each item come from?"},{"id":"U1-P23","set":"P8","topic":"1.7","lo":"N","skill":"5.A","difficulty":"medium","stem":"The Mexica way of gathering wealth shown in the table differed most from that of the Inca Empire, which","options":{"A":"used cacao beans as money when collecting tribute","B":"kept its tribute records in painted books like the codex","C":"relied heavily on the mit'a, a system of required labor service","D":"depended on merchants called pochteca to bring in tribute"},"answer":"C","explanation":"Both empires demanded goods and some labor. But labor service was especially central to the Inca state. Under the mit'a, communities took turns sending workers to state farms, roads, and buildings.","whyNot":{"A":"Cacao beans were used like money in Mesoamerica, not in the Andes.","B":"The Incas kept records on knotted cords called quipus, not in painted books.","D":"Pochteca were Mexica traders. The Inca state moved goods mostly through labor service and storehouses, not merchants."},"hint":"The table shows goods. What else, besides goods, could an empire demand from the people it ruled?","reasoning":"Comparison"},{"id":"U1-P24","set":"P8","topic":"1.4","lo":"I","skill":"2.C","difficulty":"hard","stem":"Which of the following is a limitation of the codex as evidence of Mexica tribute?","options":{"A":"It was made after the conquest, partly for Spanish officials.","B":"It was painted by Spanish artists who had not met any Mexica people.","C":"It was written centuries after the Mexica Empire had fallen.","D":"It lists luxury goods such as gold and jewels but leaves out everyday goods like cloth."},"answer":"A","explanation":"The codex was made around 1541 for Spanish officials. Its notes are in Spanish. The makers may have changed or simplified older records for these readers.","whyNot":{"B":"The note says it was painted by Indigenous artists.","C":"It was made about 1541, twenty years after the conquest.","D":"The table lists everyday goods such as cloaks and maize as well as luxury goods."},"hint":"Read the note under the table. When and for whom was the codex made?"},{"id":"U1-P25","set":"P9","topic":"1.4","lo":"I","skill":"1.B","difficulty":"easy","stem":"Díaz's description best supports which claim about the Mexica capital?","options":{"A":"It had little trade because the Mexica people depended on farming.","B":"It used gold coins as the main money in its markets.","C":"It had large, orderly markets with goods from many regions.","D":"Its market sold mostly food grown in the nearby countryside."},"answer":"C","explanation":"Díaz was amazed by the crowds and the many kinds of goods. He also praised the market's order. The Mexica capital was a rich center of trade.","whyNot":{"A":"Díaz describes a huge market with every kind of merchandise.","B":"Traders used cacao, cotton cloaks, and quills of gold dust, not coins.","D":"Díaz lists gold, silver, feathers, mantles, and cacao, and says the market held every sort of merchandise in New Spain."},"hint":"How does Díaz describe the market's size and order?"},{"id":"U1-P26","set":"P9","topic":"1.4","lo":"I","skill":"2.B","difficulty":"medium","stem":"Díaz most likely compared the market to the fairs of Medina del Campo in order to","options":{"A":"argue that Spain should copy Mexica laws about trade","B":"show that Spanish merchants had set up the market","C":"help Spanish readers picture the market's size and order","D":"complain that the Mexica market was less organized than Spain's"},"answer":"C","explanation":"Díaz wrote for Spanish readers who had never seen Mexico. A famous Spanish fair gave them something familiar to picture. The comparison helped them see how large and orderly the Mexica market was.","whyNot":{"A":"Díaz is describing the market, not arguing for new laws in Spain.","B":"The market existed before the Spanish arrived; Díaz was seeing it for the first time.","D":"Díaz praises the market's \"good order and control\"; he does not call it disorganized."},"hint":"Who was Díaz writing for? What would they already know?"},{"id":"U1-P27","set":"P9","topic":"1.4","lo":"I","skill":"5.B","difficulty":"medium","stem":"Goods from across the region were available in the market mainly because","options":{"A":"Spanish ships had recently brought goods from Europe to Mexico","B":"the Inca Empire sent yearly caravans of goods from Peru to Mexico","C":"the Mexica required foreign merchants to sell their goods in Tenochtitlan","D":"the Mexica took in tribute, and their merchants traded far away"},"answer":"D","explanation":"Tribute from conquered lands poured into the capital. Mexica merchants, called pochteca, also traveled far to trade. Both brought goods to the city's markets.","whyNot":{"A":"Díaz was describing the market in 1519, when the Spanish had only just arrived.","B":"The Inca and Mexica empires did not trade directly with each other.","C":"The Mexica had many markets, and nothing in the passage says merchants were forced to sell in the capital."},"hint":"How did the Mexica get goods from faraway provinces?","reasoning":"Causation"},{"id":"U1-P28","set":"P10","topic":"1.7","lo":"N","skill":"3.A","difficulty":"easy","stem":"Prescott's main argument in the passage is that","options":{"A":"the Aztecs and Incas ruled their conquered peoples in nearly the same way","B":"the Aztecs treated conquered peoples better than the Incas did","C":"the Incas won conquered peoples' loyalty; the Aztecs ruled by fear","D":"neither empire tried to expand by conquering its neighbors"},"answer":"C","explanation":"Prescott contrasts \"the principle of fear\" with \"the principle of love.\" He says the Incas welcomed conquered peoples into the empire. He says the Aztecs held theirs down by force.","whyNot":{"A":"Prescott says the two policies formed a \"striking\" contrast.","B":"Prescott says the opposite: the Aztecs were harsher.","D":"Prescott says both empires conquered their neighbors. He says the Incas did it \"with equal pertinacity,\" which means just as stubbornly."},"hint":"Read the last sentence of the passage.","reasoning":"Comparison"},{"id":"U1-P29","set":"P10","topic":"1.4","lo":"I","skill":"3.D","difficulty":"hard","stem":"Which of the following, if true, would most challenge Prescott's claim about the Incas?","options":{"A":"The Incas built storehouses of food along their roads.","B":"The Incas gave gifts of fine cloth to the local leaders who stayed loyal.","C":"The Incas recorded tribute and labor on knotted cords called quipus.","D":"The Incas forced conquered peoples to move and spied on them."},"answer":"D","explanation":"Prescott says the Incas ruled with \"parental solicitude,\" or loving care. Forced moves and spying show fear and control instead. That evidence weakens his claim.","whyNot":{"A":"Storehouses could fit Prescott's picture of a caring government.","B":"Gifts to loyal leaders fit Prescott's picture of winning loyalty.","C":"Record keeping does not show whether the Incas ruled by love or by fear."},"hint":"What evidence would make Prescott's kind picture of Inca rule less convincing?"},{"id":"U1-P30","set":"P10","topic":"1.4","lo":"I","skill":"3.D","difficulty":"medium","stem":"Which of the following developments best supports Prescott's claim that peoples ruled by the Aztecs were \"ready to fall asunder\"?","options":{"A":"The Mexica built a great temple in Tenochtitlan for their gods.","B":"Subject peoples such as the Totonacs joined the Spanish in 1519.","C":"Mexica merchants traveled long distances to trade in distant markets.","D":"The Mexica capital grew to have well over 100,000 people."},"answer":"B","explanation":"In 1519 the Totonacs, who paid tribute to the Mexica, joined Cortés. The Mexica's old enemies in Tlaxcala did too. Many unhappy peoples fought on the Spanish side.","whyNot":{"A":"A temple shows Mexica religion and power, not weak loyalty.","C":"Long-distance trade does not show that subject peoples wanted to break away.","D":"A large capital shows the empire's strength, not its weakness."},"hint":"Which choice is evidence about how conquered peoples felt toward Mexica rule?"},{"id":"U1-P31","set":"P11","topic":"1.5","lo":"J","skill":"1.B","difficulty":"easy","stem":"Ibn Battuta's account best supports which claim about the East African coast?","options":{"A":"Its towns were run by visiting Arab sailors, not local rulers.","B":"Its towns were Muslim trading centers linked to the Indian Ocean.","C":"Its people refused to trade with merchants who arrived by sea.","D":"Its towns were ruled by governors sent from China."},"answer":"B","explanation":"Mogadishu was full of merchants. Kilwa's sultan followed the Quran. The Swahili coast was a chain of Muslim trading towns facing the Indian Ocean.","whyNot":{"A":"The passage names Kilwa's own sultan, and local hosts in Mogadishu controlled trade with visiting merchants.","C":"Mogadishu's people met every ship and sold the merchants' goods for them.","D":"Chinese fleets visited East Africa only briefly, in the early 1400s, and did not rule its towns."},"hint":"What were the people of Mogadishu? What religion did Kilwa's sultan follow?"},{"id":"U1-P32","set":"P11","topic":"1.5","lo":"J","skill":"5.B","difficulty":"medium","stem":"The gold trade that brought gold dust to Sofala most directly helped which inland African state grow powerful?","options":{"A":"Great Zimbabwe","B":"The Mali Empire","C":"The Kingdom of Kongo","D":"The Hausa kingdoms"},"answer":"A","explanation":"Gold from inland southern Africa went to Sofala and then north to Kilwa. Great Zimbabwe gained wealth from this trade between the gold regions and the coast. Farming and cattle also supported the state.","whyNot":{"B":"Mali was in West Africa; its gold went north across the Sahara.","C":"Kongo was in west-central Africa, near the Atlantic, far from Sofala.","D":"The Hausa kingdoms were in West Africa, south of the Sahara."},"hint":"Find Sofala on a map of East Africa. Which state was inland from it?","reasoning":"Causation"},{"id":"U1-P33","set":"P11","topic":"1.2","lo":"E","skill":"1.B","difficulty":"easy","stem":"The sultan's practice described in the last paragraph best reflects","options":{"A":"the spread of Christianity from Ethiopia to the coast","B":"the influence of Confucian ideas brought by Chinese traders on African rulers","C":"the adoption of Islam by rulers on the Swahili coast","D":"the rise of Hindu temples in East African ports"},"answer":"C","explanation":"The sultan gave a fifth of his war booty to charity, following the Quran. Trade with Arabia and Persia brought Islam to the Swahili coast. Many rulers there became Muslim.","whyNot":{"A":"The sultan follows the Koran, not Christian teaching.","B":"Confucian ideas did not shape the rulers of the Swahili coast.","D":"The sultan follows Islamic rules about giving to charity."},"hint":"What rule is the sultan following, and what does that suggest about his authority?"},{"id":"U1-P34","set":"P12","topic":"1.5","lo":"J","skill":"3.A","difficulty":"easy","stem":"Randall-MacIver's main argument is that Great Zimbabwe was","options":{"A":"built in ancient times by settlers from the Middle East","B":"built by Portuguese traders in the 1500s","C":"built in the Middle Ages by Africans of the region","D":"built by North African merchants in the Middle Ages"},"answer":"C","explanation":"Randall-MacIver says the objects found were African or medieval imports. He says the builders' crafts matched those of local people. So Africans built it in the Middle Ages.","whyNot":{"A":"He calls that \"popular opinion\" and says the evidence does not support it.","B":"He dates the building to the 1300s or 1400s and links it to local African peoples, not the Portuguese.","D":"He links the builders' crafts to local African peoples. Imported objects show trade, not foreign builders."},"hint":"What did \"popular opinion\" say? Does he agree?"},{"id":"U1-P35","set":"P12","topic":"1.5","lo":"J","skill":"3.B","difficulty":"medium","stem":"Which evidence does Randall-MacIver use to date the Elliptical Temple?","options":{"A":"Arabic glass and Chinese porcelain found in the cement of the building","B":"Writings left on the walls by ancient Egyptian and Greek travelers","C":"Records kept by the Portuguese captains who built the walls","D":"Stories told by the Arab merchants who first lived inside it"},"answer":"A","explanation":"Medieval Arabic glass and Chinese porcelain were found inside the Temple's cement foundation. Randall-MacIver argued that the building could not be older than these objects, so he dated it to the 1300s or later. Later archaeologists refined his dates.","whyNot":{"B":"He mentions no ancient writing on the walls.","C":"Portuguese records begin in the 1500s, and the Portuguese did not build the walls.","D":"He says Arab merchants traded with Zimbabwe's people, not that they lived inside the enclosure."},"hint":"Reread the third paragraph. What was found, and where?"},{"id":"U1-P36","set":"P12","topic":"1.5","lo":"J","skill":"5.A","difficulty":"medium","stem":"The trade described in the last paragraph connected Great Zimbabwe most directly to","options":{"A":"the trans-Saharan caravan routes of Mali","B":"the Silk Roads linking China and the Mediterranean","C":"Swahili coast city-states such as Kilwa and Sofala","D":"Atlantic ports run by Portuguese merchants"},"answer":"C","explanation":"Great Zimbabwe's gold went to traders on the coast. They shipped it across the Indian Ocean. Sofala and Kilwa grew rich as the link between inland Africa and the sea.","whyNot":{"A":"The trans-Saharan routes linked West Africa to North Africa, far from Zimbabwe.","B":"The Silk Roads were overland routes across Asia.","D":"Portuguese traders arrived on the East African coast only around 1500."},"hint":"Merchants \"from the east coast\" bought the gold. Which cities were there?","reasoning":"Causation"},{"id":"U1-P37","set":"P13","topic":"1.5","lo":"J","skill":"2.B","difficulty":"easy","stem":"The scribe Isaac's purpose in producing the book was most likely to","options":{"A":"persuade Ethiopians to convert from Christianity to Judaism","B":"encourage a woman to take the throne of Ethiopia","C":"support the claim that Ethiopia's kings ruled by right","D":"warn Ethiopia's kings against trading with Arabia"},"answer":"C","explanation":"Isaac says he worked \"for the glory of the King of Ethiopia.\" The book traces the kings back to Solomon. It says their right to rule lasts \"for ever.\"","whyNot":{"A":"The book uses the story of Solomon to honor Ethiopia's Christian kings; it does not ask anyone to change religion.","B":"The passage says a woman \"shall nevermore reign.\"","D":"The passage does not mention trade with Arabia."},"hint":"Read the scribe's closing note. Whose glory did he work for?"},{"id":"U1-P38","set":"P13","topic":"1.5","lo":"J","skill":"4.A","difficulty":"hard","stem":"The book's claims about the royal line are best understood in the context of","options":{"A":"the Mamluk Sultanate's conquest of Ethiopia in the 1260s","B":"a new dynasty's claim to the throne after it took power in 1270","C":"the Byzantine emperor's control over Ethiopia's Christian church","D":"the conversion of Ethiopia's kings to Islam in the 1200s"},"answer":"B","explanation":"In 1270 a new dynasty, the Solomonic dynasty, replaced the Zagwe kings. The new kings claimed descent from Solomon. That claim made them look like the true rulers.","whyNot":{"A":"The Mamluks ruled Egypt and Syria. They never conquered Ethiopia.","C":"Ethiopia's church looked to the Christian patriarch in Alexandria, Egypt, not to the Byzantine emperor. The book is about kings, not church control.","D":"Ethiopia's kings stayed Christian. The scribe Isaac was a Christian who praised Christian kings."},"hint":"The note says the book was not translated \"in the days of Zagua.\" Why might a new dynasty want it?"},{"id":"U1-P39","set":"P13","topic":"1.7","lo":"N","skill":"5.A","difficulty":"medium","stem":"The Ethiopian kings' use of religion to support their rule, as shown in the passage, was most similar to","options":{"A":"Chinese emperors' claim to rule by the Mandate of Heaven","B":"the English barons' use of Magna Carta to limit the king","C":"the Golden Bull's rule that princes elect the emperor","D":"the Inca practice of moving conquered peoples"},"answer":"A","explanation":"Both Ethiopian and Chinese rulers said a higher power approved their rule. Ethiopia's kings pointed to Solomon and the Ark. China's emperors pointed to the Mandate of Heaven.","whyNot":{"B":"Magna Carta limited a king's power; it did not use religion to justify a royal line.","C":"The Golden Bull set rules for electing the emperor. It did not use a religious story to show that one family had the right to rule.","D":"Moving peoples was a way to control conquered lands, not a religious claim to rule."},"hint":"Which other rulers said a divine power chose them?","reasoning":"Comparison"},{"id":"U1-P40","set":"P14","topic":"1.6","lo":"M","skill":"1.B","difficulty":"easy","stem":"Hugh Miller's duties, as described in the survey, are characteristic of","options":{"A":"slavery, in which workers were bought and sold","B":"serfdom, in which peasants owed labor and fees to a lord","C":"wage labor, in which workers were paid for their work","D":"the guild system, in which craftsmen trained apprentices"},"answer":"B","explanation":"Hugh held land from the abbot. In return, he owed three days of work a week, payments in food such as hens and eggs, and fees like merchet and heriot. These duties show serfdom.","whyNot":{"A":"The survey lists Hugh among the villeins, who held land and owed duties with it. Those details point to serfdom.","C":"Hugh works for the lord without pay three days a week.","D":"Hugh is a farmer who owes services, not a craftsman training apprentices."},"hint":"What does Hugh owe the abbot each week and on special occasions?"},{"id":"U1-P41","set":"P14","topic":"1.6","lo":"K","skill":"1.B","difficulty":"medium","stem":"The survey best supports which claim about the Church in medieval Europe?","options":{"A":"The Church refused to own land and lived on gifts instead.","B":"The Church held large estates worked by peasants.","C":"The Church freed the serfs who lived on its lands.","D":"The Church paid wages to the peasants who farmed its fields."},"answer":"B","explanation":"The lord of this manor is an abbot, the head of a monastery. Churches and monasteries owned huge amounts of land. Serfs did much of the work on it.","whyNot":{"A":"The abbot of Peterborough holds the whole manor.","C":"Villeins on the abbot's manor still owed work and fees.","D":"The listed work was owed as a duty. The survey does not describe wages for it."},"hint":"Who is the lord of this manor?"},{"id":"U1-P42","set":"P14","topic":"1.6","lo":"M","skill":"5.A","difficulty":"hard","stem":"Farm labor on the manor described here differed most from farm labor in Song China in that Song China","options":{"A":"relied mainly on enslaved war captives from the steppe","B":"relied mainly on the mit'a, a system of rotating labor service","C":"relied mainly on peasants bound to Buddhist monasteries","D":"relied mainly on free peasants rather than serfs"},"answer":"D","explanation":"In Europe, many peasants were serfs who owed work to a lord. Song China depended mostly on free peasants. They paid taxes to the state and could sell their crops.","whyNot":{"A":"Song farms were worked mostly by free peasant families, not by enslaved captives.","B":"The mit'a was an Inca labor system in the Andes, not a Chinese one.","C":"Buddhist monasteries owned some land in China, but most Song farmers were free peasants."},"hint":"Were Song farmers bound to a lord?","reasoning":"Comparison"},{"id":"U1-P43","set":"P15","topic":"1.6","lo":"K","skill":"3.A","difficulty":"easy","stem":"Boniface VIII's main claim in the passage is that","options":{"A":"the pope should obey the decisions of Europe's kings","B":"church and government should be kept separate","C":"each kingdom should choose its own head of the Church","D":"kings must be under the authority of the pope"},"answer":"D","explanation":"Boniface says both \"swords\" belong to the Church. In his view, kings must use their power at the priest's command, so the pope stands above them.","whyNot":{"A":"Boniface says the opposite. Kings' power must be \"subjected to,\" or placed under, the Church's power.","B":"He says both swords belong to the Church, so he does not want them separate.","C":"He says every person must submit to \"the bishop of Rome,\" the pope."},"hint":"Who holds the two swords, according to Boniface?"},{"id":"U1-P44","set":"P15","topic":"1.6","lo":"L","skill":"4.A","difficulty":"medium","stem":"The decree is best understood in the context of","options":{"A":"conflicts between popes and kings over who held power","B":"the Great Schism, when rival popes ruled from Rome and Avignon","C":"the crusades to win back Jerusalem from Muslim rulers","D":"the split between the Catholic and Orthodox churches in 1054"},"answer":"A","explanation":"Boniface wrote this during a fight with King Philip IV of France. Philip had taxed the French clergy. Popes and kings often clashed over power in this period.","whyNot":{"B":"The Great Schism began in 1378, more than 70 years after this decree.","C":"Popes did call crusades, but this decree is about the power of kings, not about Jerusalem.","D":"That split happened in 1054, long before this decree. It was about the churches of East and West, not about popes and kings."},"hint":"Who was the pope arguing with in 1302?"},{"id":"U1-P45","set":"P15","topic":"1.6","lo":"L","skill":"5.B","difficulty":"hard","stem":"Which development soon after 1302 most clearly showed the limits of the claims in the decree?","options":{"A":"Philip IV's agents seized Boniface, and the popes later moved to Avignon.","B":"The Holy Roman Emperor let the pope choose the next German king.","C":"The French king agreed to stop taxing the clergy of France.","D":"Crusaders retook Jerusalem and handed it over to the pope."},"answer":"A","explanation":"In 1303 Philip's agents seized Boniface at Anagni, and he died soon after. From 1309 the popes lived in Avignon, under strong French influence. Kings were gaining power over popes.","whyNot":{"B":"German princes, not the pope, chose the king. The Golden Bull of 1356 made this rule official.","C":"Philip IV kept taxing the French clergy. That quarrel is part of what led to the decree.","D":"Crusaders did not retake Jerusalem in this period. Their last stronghold, Acre, fell in 1291."},"hint":"What happened between Boniface and the French king in 1303?","reasoning":"Continuity and Change"},{"id":"U1-P46","set":"P16","topic":"1.6","lo":"K","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Source 1 orders Jews to become Christians; Source 2 forbids anyone from converting Jews.","B":"Source 1 shields Jews from violence; Source 2 makes them cancel crusaders' interest.","C":"Source 1 calls for a crusade; Source 2 protects Jewish cemeteries.","D":"Source 1 limits Jewish moneylending; Source 2 protects Jewish festivals."},"answer":"B","explanation":"Source 1 forbids beating Jews or forcing them to convert. Source 2 forces Jews to give up interest owed by crusaders. The Church both protected and burdened Jews.","whyNot":{"A":"Source 1 says no one may force Jews to be baptized.","C":"It is the reverse: Source 2 calls for a crusade, and Source 1 protects Jewish cemeteries.","D":"It is the reverse: Source 2 deals with Jewish lending, and Source 1 protects Jewish festivals."},"hint":"Compare what each source allows, requires, or forbids.","reasoning":"Comparison"},{"id":"U1-P47","set":"P16","topic":"1.6","lo":"K","skill":"4.A","difficulty":"hard","stem":"The reference to Jews collecting interest in Source 2 is best understood in the context of","options":{"A":"the Hanseatic League's control of trade in the Baltic Sea","B":"the Church's ban on Christians charging interest on loans","C":"laws in Europe that let Jews own most of the farmland","D":"the Crusaders' capture of the Christian city of Constantinople in 1204"},"answer":"B","explanation":"Church teaching condemned charging interest on loans, but some Christians lent money anyway. Some Jews also worked as lenders. Local rules often limited the other jobs open to Jews, but these rules varied by place.","whyNot":{"A":"The Hanseatic League of north German trading towns formed later, in the 1300s, and it does not explain lending to crusaders.","C":"Jewish land rights varied by place. The source gives no sign that Jews owned most farmland.","D":"The capture of Constantinople in 1204 was a war between Christians. It does not explain why Jews lent money."},"hint":"What did Church teaching say about charging interest?"},{"id":"U1-P48","set":"P16","topic":"1.6","lo":"K","skill":"5.B","difficulty":"medium","stem":"The kinds of attacks on Jews that Source 1 forbids were part of a pattern that later included","options":{"A":"the expulsion of Jews from England in 1290 and from France in 1306","B":"the Church's new decision to let Christians charge interest on their loans","C":"a law in the Holy Roman Empire that freed Jews from paying special taxes","D":"the invitation of Jewish refugees to settle in England after 1300"},"answer":"A","explanation":"Jews in medieval Europe faced attacks, special taxes, and expulsions. England expelled its Jews in 1290, and France ordered a major expulsion in 1306. These actions show the limits of the protection promised in Source 1.","whyNot":{"B":"The Church kept its ban on Christians charging interest throughout this period.","C":"Rulers kept collecting special taxes from Jewish communities.","D":"England did not let Jews return until the 1650s, long after this period."},"hint":"What did some European kings do to Jewish communities in the late 1200s and early 1300s?","reasoning":"Continuity and Change"}],"exam":{"title":"Unit 1 Practice Exam: The Global Tapestry","timeMinutes":25,"questionCount":25,"directions":"Each set of questions refers to a source: a primary source, a historian's writing, an image, or data. For each question, choose the best answer. Use the source and your knowledge of world history from c. 1200 to c. 1450. There is no penalty for guessing. Some sources use historical labels or insulting descriptions of other peoples and religions; these words show the writers' views.","questions":[{"id":"U1-E01","set":"X1","topic":"1.3","lo":"H","skill":"3.A","difficulty":"easy","stem":"The passage suggests that the rulers of Srivijaya gained wealth and power mainly by","options":{"A":"conquering large rice-farming regions on the mainland of Asia","B":"controlling a narrow sea route and making ships stop there","C":"mining gold and silver to make coins for trade","D":"sending settlers to build colonies on India's coast"},"answer":"B","rationales":{"A":"Incorrect. The passage is about control of the sea and trade, not about conquering farmland on the mainland.","B":"Correct. Zhao says Srivijaya controls \"the straits\" that ships must pass through. If a ship tries to sail past, Srivijaya's boats attack it.","C":"Incorrect. Gold and silver came in from foreign traders. The passage does not say Srivijaya mined metals or made coins.","D":"Incorrect. The passage says foreign traders came to Srivijaya. It does not say Srivijaya sent settlers to India."},"explanation":"Srivijaya controlled ports and straits on the main sea routes between the Indian Ocean and China. Zhao says its ships forced passing traders to stop. Srivijaya grew rich by taxing this trade."},{"id":"U1-E02","set":"X1","topic":"1.1","lo":"C","skill":"1.B","difficulty":"medium","stem":"The goods that foreign traders gave in exchange at Srivijaya, such as porcelain, silk, and iron, best reflect which development in Song China?","options":{"A":"The use of paper money alongside metal coins in trade","B":"Growing production of manufactured goods for trade","C":"The spread of Champa rice and other improvements in farming","D":"The selection of officials through exams on Confucian texts"},"answer":"B","rationales":{"A":"Incorrect. Song China did use paper money, but porcelain, silk, and iron are trade goods, not money.","B":"Correct. Song workshops made large amounts of porcelain, silk cloth, and iron. Merchants shipped these goods to Southeast Asia and beyond.","C":"Incorrect. Champa rice did help Song farmers, but porcelain, silk, and iron were made in workshops, not grown in fields.","D":"Incorrect. Song China did choose officials by exams, but exams do not explain the goods that traders carried."},"explanation":"The Song economy became very commercial. Workshops and kilns made huge amounts of porcelain, silk, and iron. Merchants sold these goods across the Indian Ocean world."},{"id":"U1-E03","set":"X1","topic":"1.3","lo":"H","skill":"4.A","difficulty":"hard","stem":"Srivijaya's tribute missions to the Chinese court, described in the last paragraph, are best understood in the context of","options":{"A":"the Mongol practice of making conquered lands send soldiers for its wars","B":"the spread of Islam into Sumatra by merchants from Arabia and Persia","C":"a Song plan to conquer the ports of Southeast Asia and rule them directly","D":"China's tribute system, in which rulers sent gifts to gain trade"},"answer":"D","rationales":{"A":"Incorrect. The missions took place from the 960s to the 1090s, long before the Mongols conquered the Song in 1279.","B":"Incorrect. The missions honored the emperor and a Buddhist temple. They have nothing to do with Islam.","C":"Incorrect. The Song did not try to rule Srivijaya. Srivijaya's rulers chose to send the missions.","D":"Correct. Rulers of nearby states sent gifts, called tribute, to the Chinese emperor. In return they received gifts, the right to trade, and the emperor's recognition."},"explanation":"Sending tribute kept a ruler on good terms with the Chinese emperor. The ruler gained trade and prestige. The emperor gained foreign rulers' recognition of his high status."},{"id":"U1-E04","set":"X2","topic":"1.1","lo":"B","skill":"3.A","difficulty":"easy","stem":"Zhu Xi's main criticism of Buddhists and Daoists in the passage is that they","options":{"A":"turn away from family and social duties, the basis of morality","B":"rely too heavily on written exams to choose government officials","C":"encourage merchants to seek profit instead of serving the state","D":"teach that rulers may govern without the Mandate of Heaven"},"answer":"A","rationales":{"A":"Correct. Zhu Xi says Buddhists and Daoists \"discard human relationships.\" For him, morality lives in daily duties. A son obeys his father, and a minister is loyal to his ruler.","B":"Incorrect. The passage does not discuss exams. Zhu Xi criticizes how Buddhists and Daoists treat family ties.","C":"Incorrect. The passage is about family and social relationships, not merchants or profit.","D":"Incorrect. The passage does not mention the Mandate of Heaven."},"explanation":"Many Buddhist and Daoist monks left their families for monasteries. Zhu Xi called this a mistake. He said the moral Way is lived in everyday family and social ties."},{"id":"U1-E05","set":"X2","topic":"1.1","lo":"B","skill":"5.B","difficulty":"medium","stem":"The ideas in the passage most directly influenced which of the following developments in East Asia?","options":{"A":"The replacement of Confucian schools in Korea by Buddhist monasteries","B":"Song China's adoption of Theravada Buddhism","C":"An end to the hiring of scholar-officials in China","D":"The use of Zhu Xi's teachings on China's civi
