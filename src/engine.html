<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>/*@@TITLE@@*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0920;--pn:#161239;--pn2:#1e1950;--ink:#eeeaff;--dim:#a49ed6;--cy:#22e5ff;--mg:#ff3fa4;--yl:#ffd23f;--gr:#4dff91;--rd:#ff5b6e;--ln:#3a3288;--px:'Press Start 2P',monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(rgba(34,229,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,229,255,.05) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:17px/1.55 'Chakra Petch',system-ui,sans-serif;min-height:100vh}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);z-index:50}
#app{max-width:780px;margin:0 auto;padding:14px 14px 60px}
.px{font-family:var(--px);text-transform:uppercase;letter-spacing:.04em;line-height:1.6}
h1,h2,h3{margin:0}
p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yl)!important;outline-offset:3px}
.brand,.bgc,.hb,.link,details.peek summary{min-height:44px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.panel{background:var(--pn);border:3px solid var(--ln);box-shadow:5px 5px 0 #000;padding:16px;margin:16px 0;position:relative}
.panel>.tag{position:absolute;top:-12px;left:12px;background:var(--bg);padding:2px 8px;font-size:10px;color:var(--cy);border:2px solid var(--ln)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--yl);color:#120d2b;border:0;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),4px 4px 0 #000;padding:13px 18px;font:11px/1.4 var(--px);text-transform:uppercase;min-height:46px}
.btn:active{transform:translate(3px,3px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),1px 1px 0 #000}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.c{background:var(--cy)}.btn.m{background:var(--mg);color:#120d2b}.btn.g{background:var(--gr)}
.btn.o{background:transparent;color:var(--cy);box-shadow:inset 0 0 0 2px var(--cy),4px 4px 0 #000}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.link{background:none;border:0;color:var(--dim);text-decoration:underline;padding:8px 4px;font-size:15px}
.bgc{display:inline-flex;align-items:center;gap:6px;background:var(--pn2);border:2px dashed var(--mg);color:#ffc4e3;padding:7px 11px;margin:4px 6px 4px 0;font-size:14px;font-weight:600}
.bgc:hover{background:#2a1d55}
/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0 10px;border-bottom:3px solid var(--ln)}
.brand{font:10px var(--px);color:var(--mg);text-shadow:0 0 8px rgba(255,63,164,.7);background:none;border:0;padding:6px 0;text-align:left}
.brand b{color:var(--cy);text-shadow:0 0 8px rgba(34,229,255,.7)}
.score{font:10px var(--px);color:var(--yl);white-space:nowrap}
.prog{display:flex;gap:4px;margin:12px 0 4px}
.seg{flex:1;height:44px;border:2px solid #7066c9;background:#0b0820;font:9px var(--px);color:var(--dim);padding:0;display:flex;align-items:center;justify-content:center}
.seg.v{color:var(--ink);border-color:var(--cy)}
.seg.ok{background:var(--gr);color:#0b1a12;border-color:var(--gr)}
.seg.no{background:#4a2140;color:#ffb3c8;border-color:var(--rd)}
.seg.cur{background:var(--yl);color:#111;border-color:var(--yl);animation:pulse 1.2s steps(2) 3}
.seg:disabled{cursor:default}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--yl),0 0 12px var(--yl)}}
.sym{font-family:system-ui,sans-serif;font-size:14px;line-height:1}
.jump{font-size:13px;color:var(--dim);margin-top:4px}
.plain{margin-top:10px;padding-top:10px;border-top:2px dashed var(--ln);font-size:16px;color:#dcd8ff}
.plain b{color:var(--gr)}
.coach{display:flex;gap:12px;align-items:flex-start;margin:16px 0;background:#1a1240;border:3px solid var(--mg);padding:12px;box-shadow:5px 5px 0 #000}
.coach .av{flex:none;width:48px;height:48px;display:grid;place-content:center;font-size:28px;background:#0a0820;border:3px solid var(--mg)}
.coach p{margin:0 0 6px;font-size:16px}.coach .kid{color:var(--dim);font-style:italic}.coach b{color:var(--mg)}
.lt{font-size:19px;color:var(--yl);margin-bottom:4px}
.les{padding-left:20px;margin:6px 0}.les li{margin:6px 0}
.voc{background:#0a0820;border:2px solid var(--ln);padding:10px 12px;margin-top:10px}
.voc .px{font-size:10px;color:var(--cy);display:block;margin-bottom:4px}.voc p{font-size:15px;margin:4px 0}.voc b{color:var(--cy)}
.weak summary{color:var(--rd)}.wa{font-style:italic;color:#ffc2cc}
.chip.fr{border-color:var(--gr);color:var(--gr)}
.fix{display:block;font-style:normal;color:var(--yl);font-size:14px;margin-top:4px}
.why{margin:8px 0 0;font-size:15px;color:#bfefff}
.sub{display:flex;gap:4px;margin:12px 0}
.sb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:52px;background:#0b0820;border:2px solid #7066c9;color:var(--dim);font-size:12px;font-weight:600}
.sb span{font-size:18px}.sb.on{background:var(--cy);color:#0b0820;border-color:var(--cy)}.sb.dn{border-color:var(--gr);color:var(--gr)}.sb:disabled{opacity:.35;cursor:default}
.qmini{border-left:4px solid var(--yl);padding:6px 10px;margin:8px 0;background:#0a0820}.qmini .px{font-size:10px;color:var(--yl)}.qmini h2{font-size:16px;line-height:1.45;font-weight:600}
.mq{font-weight:700;margin:4px 0 10px}
.opt{display:block;width:100%;text-align:left;background:var(--pn2);border:2px solid #7066c9;padding:12px;margin:8px 0;min-height:48px;font-size:16px}
.opt.good{border-color:var(--gr);background:#0b2418;color:var(--gr)}.opt.bad{border-color:var(--rd);background:#2a0c1a;color:#ffc2cc}
.fb{padding:10px;border:2px solid;font-size:15px}.fb.y{border-color:var(--gr);color:var(--gr);background:#0b2418}.fb.n{border-color:var(--yl);color:var(--yl);background:#2b2410}
.boss{border-color:var(--mg)}
.conf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 0;font-size:14px;color:var(--dim)}.conf span{width:100%}
.cb{background:var(--pn2);border:2px solid #7066c9;padding:8px 10px;min-height:44px;font-size:14px}.cb.on{border-color:var(--cy);background:#0d3340;color:var(--cy)}
.cal{margin:10px 0 0;padding:10px;border-left:4px solid var(--cy);background:#0a0820;font-size:15px}
.combo{display:block;margin-top:6px;color:var(--yl)}
.verdict.y{animation:pop .5s steps(5)}@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.plabel{font:10px/1.7 var(--px);gap:10px;align-items:center;color:var(--dim);display:flex;justify-content:space-between}
/* home */
.hero{text-align:center;padding:26px 6px 8px}
.hero h1{font:clamp(26px,8vw,46px)/1.2 var(--px);color:var(--yl);text-shadow:3px 3px 0 var(--mg),6px 6px 0 #000}
.hero .sub{display:block;font:10px/1.8 var(--px);color:var(--cy);margin-top:14px}
.blink{animation:bl 1s steps(1) 5;color:var(--gr);font:11px var(--px);margin:18px 0 4px}
@keyframes bl{50%{opacity:0}}
.carts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.cart.cls{border-color:var(--yl)}.cart.cls .k{color:var(--gr)}
.cart{text-align:left;background:linear-gradient(160deg,#241c63,#120e33);border:3px solid var(--cy);box-shadow:6px 6px 0 #000;padding:16px;display:flex;flex-direction:column;gap:8px}
.cart:nth-child(2){border-color:var(--mg)}
.cart .k{font:9px var(--px);color:var(--yl)}
.cart h3{font-size:21px;line-height:1.25}
.cart .d{color:var(--dim);font-size:15px}
.cart .go{margin-top:auto;font:10px var(--px);color:var(--gr)}
/* all-units hub */
#app.wide{max-width:1120px}
.stats{display:flex;justify-content:center;gap:12px;margin:18px 0 2px;flex-wrap:wrap}
.stats div{background:var(--pn);border:2px solid var(--ln);box-shadow:4px 4px 0 #000;padding:9px 14px;font:8px/1.6 var(--px);color:var(--dim);text-align:center;min-width:96px}
.stats b{display:block;font:18px var(--px);color:var(--yl);margin-bottom:6px}
.units{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin:26px 0 12px}
.ut{background:var(--pn);border:2px solid var(--ln);box-shadow:4px 4px 0 #000;padding:10px 9px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:100px;transition:transform .08s steps(2)}
.ut b{font:9px var(--px);color:var(--uc)}
.ut span{font-size:14px;line-height:1.25;color:var(--dim)}
.ut i{font:8px var(--px);font-style:normal;color:var(--dim);margin-top:auto}
.ut:hover{transform:translate(-2px,-2px)}
.ut.on{border-color:var(--uc);background:var(--pn2);box-shadow:4px 4px 0 #000,inset 0 0 0 2px var(--uc)}
.ut.on span{color:var(--ink)}.ut.on i{color:var(--uc)}
.fmts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 8px}
.fmts>span{font:9px var(--px);color:var(--dim);margin-right:4px}
.fchip{background:transparent;border:2px solid var(--ln);color:var(--dim);padding:7px 12px;font-size:14px;min-height:38px}
.fchip.on{border-color:var(--cy);color:var(--ink);background:rgba(34,229,255,.12)}
.usec{margin:30px 0 6px}
.uh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;font-size:24px;line-height:1.2;margin:0 0 14px;padding-bottom:10px;border-bottom:3px solid var(--uc)}
.uh span{font:11px var(--px);color:var(--uc)}
.uh small{font-size:14px;color:var(--dim);margin-left:auto}
.cart.u{border-color:var(--uc)}
.cart.u.cls{border-color:var(--yl)}
.hubhow{margin-top:44px}
.none{text-align:center;color:var(--dim);padding:40px 10px}
@media (max-width:980px){.units{grid-template-columns:repeat(4,1fr)}}
@media (max-width:620px){.units{grid-template-columns:repeat(2,1fr)}.ut{min-height:86px}.uh{font-size:20px}}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;counter-reset:h}
.how div{background:var(--pn2);padding:10px;border-left:4px solid var(--cy);font-size:14px}
.how div:before{counter-increment:h;content:"0" counter(h);display:block;font:10px var(--px);color:var(--cy);margin-bottom:4px}
.tea{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tea div{padding:10px;background:#0f0c29;border:2px solid var(--ln);font-size:14px}
.tea b{display:block;font:20px var(--px);margin-bottom:6px}
.tT{color:var(--cy)}.tE{color:var(--yl)}.tA{color:var(--mg)}
/* stimulus */
.stim{background:#0a0820;border:3px solid var(--cy);padding:10px;box-shadow:0 0 0 3px #000,0 0 18px rgba(34,229,255,.25)}
.stim h3{font:700 15px/1.4 'Chakra Petch',system-ui,sans-serif;color:var(--cy);margin-bottom:8px}
.stim svg{width:100%;height:auto;display:block;max-width:560px;margin:0 auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px;color:var(--dim)}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px;border:1px solid #000}
.src{font-size:12px;color:var(--dim);margin-top:6px;font-style:italic}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:15px}
table:not(:has(tr>*:nth-child(4))){min-width:0}
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;z-index:1;background:#0a0820}.tbl th:first-child{background:var(--pn2)}
.plabel span{white-space:nowrap}
.stim svg,.stim img{cursor:zoom-in}.zhint{font-size:13px;color:var(--dim);text-align:center;margin:8px 0 0}
#zm{position:fixed;inset:0;z-index:70;background:rgba(5,3,18,.96);display:none;flex-direction:column}#zm.on{display:flex}
#zm .zt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;color:var(--cy);font-size:14px}
#zm .zb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px}#zm .zb>*{width:max(900px,100%);max-width:none;height:auto;display:block;cursor:auto}
.tbl:not(:has(tr>*:nth-child(4))):before{display:none!important}
th,td{border:2px solid var(--ln);padding:8px 6px;text-align:center}
th{background:var(--pn2);color:var(--yl);font-size:13px;line-height:1.3}
td:first-child{text-align:left;font-weight:700;color:var(--cy)}
.notice{border-left:4px solid var(--yl);padding:10px 12px;background:var(--pn2);margin:12px 0}
.notice .q{font-weight:700}
.notice textarea{min-height:56px;margin-top:8px}
.take{margin-top:8px;padding:10px;background:#0f2a24;border:2px solid var(--gr);font-size:15px}
.take:before{content:"TUTOR'S TAKE";display:block;font:10px var(--px);color:var(--gr);margin-bottom:4px}
details.peek{margin:12px 0;border:2px solid var(--ln);background:#0e0b28}
details.peek summary{cursor:pointer;padding:12px;font:700 15px 'Chakra Petch',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--cy);list-style:none}
details.peek summary:before{content:"▸ "}
details.peek[open] summary:before{content:"▾ "}
details.peek>div{padding:0 10px 10px}
/* part */
.qbox{background:#0a0820;border:3px solid var(--yl);padding:14px;box-shadow:5px 5px 0 #000}
.qbox .px{font-size:10px;color:var(--yl);display:block;margin-bottom:8px}
.qbox p{font-size:19px;font-weight:600;margin:0}
.verb{display:flex;gap:14px;align-items:flex-start}
.verb .vb{font:13px var(--px);background:var(--mg);color:#120d2b;padding:10px;box-shadow:3px 3px 0 #000;flex:none}
.verb ul{margin:6px 0 0;padding-left:20px;font-size:15px;color:var(--dim)}
.step{display:flex;gap:12px;padding:12px 0;border-top:2px dashed var(--ln)}
.step:first-of-type{border-top:0}
.badge{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font:16px var(--px);background:#0a0820;border:3px solid currentColor}
.step .lb{font:10px/1.8 var(--px);opacity:.9}
.step .pr{margin:4px 0 6px}
.hb{background:none;border:2px solid var(--yl);color:var(--yl);font:10px var(--px);padding:8px 12px;margin:4px 6px 0 0}
.hint{background:#2b2410;border-left:4px solid var(--yl);padding:8px 10px;margin:6px 0;font-size:15px}
.hint:before{content:"💡 "}
textarea{width:100%;min-height:140px;background:#07061a;color:var(--ink);border:3px solid var(--cy);padding:12px;font:17px/1.5 'Chakra Petch',system-ui,sans-serif;resize:vertical}
textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(34,229,255,.35)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{min-height:44px;background:var(--pn2);border:2px solid var(--ln);padding:6px 10px;font-size:14px;color:var(--dim)}
.teamini{font-size:14px;color:var(--dim);margin-bottom:8px}
.teamini b{font-family:var(--px);font-size:11px}
.ck{list-style:none;padding:0;margin:8px 0}
.ck li{margin:8px 0}
.ck label{display:flex;gap:12px;align-items:flex-start;background:var(--pn2);border:2px solid var(--ln);padding:10px 12px;cursor:pointer}
.ck input{appearance:none;flex:none;width:26px;height:26px;border:3px solid var(--cy);background:#07061a;margin:0;cursor:pointer;display:grid;place-content:center}
.ck input:checked{background:var(--gr);border-color:var(--gr)}
.ck input:checked:after{content:"✓";color:#07220f;font-weight:900}
.ck small{display:block;color:var(--gr);font-size:12px}
.mine{white-space:pre-wrap;background:#07061a;border:2px dashed var(--ln);padding:10px;font-size:15px;color:var(--dim)}
.model{background:#102033;border:3px solid var(--cy);padding:12px}
.model .px{font-size:10px;color:var(--cy);display:block;margin-bottom:6px}
.verdict{font:700 16px/1.45 'Chakra Petch',system-ui,sans-serif;padding:12px;text-align:center;margin-top:12px;border:3px solid}
.verdict.y{color:var(--gr);border-color:var(--gr);background:#0b2418}
.verdict.n{color:var(--rd);border-color:var(--rd);background:#2a0c1a}
.note{font-size:14px;color:var(--dim)}
/* done */
.big{font:clamp(24px,7vw,40px)/1.3 var(--px);color:var(--gr);text-align:center;text-shadow:3px 3px 0 #000,0 0 14px rgba(77,255,145,.6)}
.stars{text-align:center;font-size:30px;letter-spacing:4px;margin:10px 0}
.rank{text-align:center;font:11px/1.9 var(--px);color:var(--yl)}
.res{list-style:none;padding:0;margin:0}
.res li{padding:10px 0;border-top:2px dashed var(--ln)}
.res li:first-child{border-top:0}
.res b{font-family:var(--px);font-size:11px;margin-right:6px}
/* sheet */
#sh{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,3,18,.8);padding:16px}
#sh.on{display:flex}
#sh .card{background:var(--pn);border:3px solid var(--mg);box-shadow:6px 6px 0 #000,0 0 30px rgba(255,63,164,.35);max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px;animation:up .2s steps(4)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
#sh .k{font:9px var(--px);color:var(--mg)}
#sh h3{font-size:22px;margin:6px 0 10px}
#sh ol{padding-left:22px;margin:0}
#sh li{margin:8px 0}
@media (max-width:620px){
 body{font-size:16px}
 #app{padding:10px 10px 50px}
 .carts,.tea{grid-template-columns:1fr}
 .how{grid-template-columns:1fr 1fr}
 .panel{padding:14px 12px}
 .row .btn{flex:1 1 100%}
 .qbox p{font-size:17px}
 .verb{flex-direction:column;gap:8px}
 #sh{align-items:flex-end;padding:0}
 #sh .card{max-height:80vh;border-bottom:0;box-shadow:0 -4px 0 #000}
 .seg{font-size:9px;height:44px}
 .navrow{flex-wrap:nowrap}.navrow .btn{flex:1 1 auto}.navrow .btn.o{flex:0 0 auto}
 .tbl:before{content:"◂ swipe sideways to see every column ▸";display:block;font-size:13px;font-weight:700;color:var(--yl);text-align:center;padding:0 0 6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="zm" role="dialog" aria-modal="true" aria-label="Zoomed map"><div class="zt"><span>Pinch or scroll to explore</span><button class="btn c" data-a="zx">Close ✕</button></div><div class="zb" id="zb"></div></div>
<div id="sh" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="card"><div class="k">📜 Need the background?</div><h3 id="shT"></h3><ol id="shB"></ol><div class="row"><button class="btn c" data-a="x">Got it ▸</button></div></div></div>
<script>
/* ===== Background pop-outs (shared by every FRQ) ===== */
const BG={
frq:{t:"How AP FRQs are scored",s:["Each part (A, B, C…) is worth 1 point and is scored on its own. A mistake in Part B can't cost you Part C.","Readers look for the right idea, clearly linked to the question. Fancy writing earns nothing extra.","No thesis, intro, or conclusion needed. Label each part and answer it directly.","Write in complete sentences and do what the task verb asks (Identify, Define, Describe, Explain, Compare, or Explain the degree).","Never leave a part blank. A wrong answer costs nothing."]},
tea:{t:"The TEA method",s:["T1- Topic: your reason in general words. Turn the question into your claim.","E2- Evidence: the specific proof, like a place, number, or example, ideally from the map or table.","A3- Analysis: why it matters. Explain HOW or WHY your proof backs up your reason, using “because…” or “which leads to…”.","Label each piece T1-, E2-, A3- so the reader can find every point. Describe answers need T1 and E2 plus a short A3. Explain answers need a strong A3."]},
readmap:{t:"How to read a map",s:["Read the title first. It tells you the topic, place, and time.","Check the legend so you know what each color and symbol means.","Look for patterns: what's clustered, what's connected, what points where?","Then ask WHY: who made this, and what story is it telling?"]},
readtable:{t:"How to read a data table",s:["Read the title and every column header, including units (%, per 1,000).","Find the highest and lowest value in each column.","Compare columns: when one goes up, does another go up or down?","When there are two years, look for change over time."]},

const VERBS={
Identify:{d:"Name it. One short, specific answer is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","Write it as one short, complete sentence."]},
Describe:{d:"Paint the picture. Give the specific characteristics or pattern, with details someone could check.",l:["Use evidence: a place, a number, or a feature from the stimulus.","Say what it IS or what it LOOKS LIKE. You don't need a deep “why.”","About 1–2 sentences. Use TEA: Topic + Evidence, then a quick Analysis."]},
Explain:{d:"Tell HOW or WHY. Connect a cause to an effect so a reader sees the reasoning, not just a fact.",l:["Use linking words: “because…”, “which leads to…”, “as a result…”.","A fact alone won't score. You need the chain of reasoning.","About 2–3 sentences. Use full TEA."]},
Define:{d:"Give the meaning. Say what the term is in your own words, clearly enough that someone who never heard it would get it.",l:["Use a full sentence: “[Term] is…”","Don't just give an example. The meaning comes first; an example can back it up.","One or two sentences."]},
"Explain the degree":{d:"Say HOW MUCH something is true, then prove it. Pick a level (a great degree, a moderate degree, or a small degree) and explain why it's that much and not more or less.",l:["Start with your level: “Colonization affected ___ to a great degree because…”","Give evidence for your level AND a reason it isn't total (or isn't zero).","About 2–3 sentences. T1- states the degree, E2- proves it, A3- explains why it's that much."]},
Compare:{d:"Show how two things are alike or different. Name BOTH things and make the difference (or similarity) clear.",l:["Use comparison words: “while…”, “whereas…”, “unlike…”, “both…”.","Talking about only one side won't score. Mention both.","About 2 sentences. T1- names the difference, E2- gives an example of each, A3- says why it matters."]}
};

<div class="model"><span class="px">Model answer</span>${esc(P.mo)}<p class="why"><b>✅ Why it works:</b> ${esc(P.mw)}</p></div>
<div role="status" class="verdict ${ok?'y':'n'}">${ok?YES[i%3]:'Not yet, and “not yet” is how everyone learns. Use the Fix-it tips, then revise.'}${ok&&S.cb>0?`<span class="combo">🔥 ${S.cb+1} in a row!</span>`:''}</div>${st.cf==null?'':`<p class="cal">${CAL[st.cf][ok?0:1]}</p>`}
<div class="row">${ok?'':`<button class="btn o" data-a="rev" data-i="${i}">✎ Revise</button>`}<button class="btn g" data-a="next" data-i="${i}">${i+1<n?`On to Part ${L(i+1)} ▸`:'See results ▸'}</button></div></div>`}
return h}
function bossV(){const B=S.bo;if(!B)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p>3 lightning questions on what you just learned. Quick recall now helps you remember it next week.</p><div class="row"><button class="btn m" data-a="boss">Start Boss Round ▸</button></div></div>`;
if(B.k>=B.l.length)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p class="big" style="font-size:20px">${B.r==B.l.length?'Boss defeated!':'Boss battle over!'}</p><p style="text-align:center">You got <b>${B.r}/${B.l.length}</b> on the first try.${B.r<B.l.length?' Come back tomorrow and replay. Spacing out practice is how memories stick.':''}</p></div>`;
const i=B.l[B.k],q=S.f.p[i].qc;return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round · ${B.k+1}/${B.l.length}</span>${mcqV(q,B.s,(i+B.k+1)%3,'bq','')}${B.s===0||B.s>0?`<div class="row"><button class="btn m" data-a="bn">${B.k+1<B.l.length?'Next ▸':'Finish ▸'}</button></div>`:''}</div>`}
function exportTxt(){const n=S.f.p.length;return `${S.f.t} (${S.f.u}) · GeoArcade FRQ Tutor\nScore: ${score()}/${n}\n\n`+S.f.p.map((p,i)=>{const st=S.p[i];return `Part ${L(i)} (${p.v}): ${p.q}\nMy answer: ${st.a.trim()||'(blank)'}\nResult: ${st.done?(st.ok?'point earned':'not yet'):'not attempted'}\n`}).join('\n')}
function doneV(){const n=S.f.p.length,sc=score(),ps=S.f.p.map((p,i)=>[p,i,S.p[i]]),ok=ps.filter(x=>x[2].ok),no=ps.filter(x=>x[2].done&&!x[2].ok),un=ps.filter(x=>!x[2].done);
const rank=sc==n?"GEO LEGEND":sc>=5?"MAP MASTER":sc>=3?"RISING SCOUT":"KEEP PLAYING";
return `<div class="panel" style="text-align:center"><h2 class="big" tabindex="-1">${un.length?'Progress report':'Stage clear!'}</h2><div class="stars" aria-label="${sc} of ${n}">${'★'.repeat(sc)}<span style="opacity:.25">${'★'.repeat(n-sc)}</span></div><div class="rank">${sc}/${n} points · Rank: ${rank}</div></div>
<div class="panel"><span class="tag px" style="color:var(--gr)">Nailed it</span>${ok.length?`<ul class="res">${ok.map(([p,i])=>`<li><b style="color:var(--gr)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span></li>`).join('')}</ul>`:'<p class="note">No points yet. Every replay makes it easier!</p>'}</div>
<div class="panel"><span class="tag px" style="color:var(--rd)">Review these</span>${no.length?`<ul class="res">${no.map(([p,i])=>`<li><b style="color:var(--rd)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br>${chips(p.b)}<button class="link" data-a="go" data-k="${i+1}">Revisit Part ${L(i)}</button></li>`).join('')}</ul>`:(S.p.some(x=>x.done)?'<p>Nothing to review so far. 🏆</p>':'<p class="note">Try a part first, then come back here.</p>')}</div>
${un.length?`<div class="panel"><span class="tag px" style="color:var(--yl)">Not tried yet</span><ul class="res">${un.map(([p,i])=>`<li><b style="color:var(--yl)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br><button class="link" data-a="go" data-k="${i+1}">Go to Part ${L(i)}</button></li>`).join('')}</ul></div>`:''}
<div class="panel"><span class="tag px">Turn it in</span><p>Your answers stay on this device only. Copy them to turn in on Canvas or in a doc.</p><div class="row"><button class="btn c" data-a="copy">📋 Copy my answers</button><span class="note" id="cpmsg" role="status" aria-live="polite"></span></div><details class="peek" id="cpd" data-pk="cpd"><summary>See the text</summary><div><textarea readonly id="cpt" aria-label="Your answers" style="min-height:200px">${esc(exportTxt())}</textarea></div></details></div>
${no.length?`<div class="row"><button class="btn c" data-a="retry">↻ Retry what I missed ▸</button></div>`:''}${bossV()}<div class="row"><button class="btn" data-a="restart" data-i="${S.fi}">${S.rc?'Tap again to erase your answers':'↻ Start over'}</button>${FRQ.length>1?`<button class="btn m" data-a="start" data-i="${(S.fi+1)%FRQ.length}">Try “${esc(FRQ[(S.fi+1)%FRQ.length].t)}” ▸</button>`:''}<button class="btn o" data-a="home">Menu</button></div>`}
/* ===== Events ===== */
let opener;function openBG(k){opener=document.activeElement;app.setAttribute('aria-hidden','true');document.getElementById('shT').textContent=BG[k].t;document.getElementById('shB').innerHTML=BG[k].s.map(x=>`<li>${esc(x)}</li>`).join('');sh.classList.add('on');sh.querySelector('[data-a=x]').focus()}
function closeBG(){if(!sh.classList.contains('on'))return;sh.classList.remove('on');app.removeAttribute('aria-hidden');opener&&opener.focus()}
document.addEventListener('click',e=>{if(e.target==sh)return closeBG();const z=e.target.closest('.stim svg,.stim img');if(z&&!e.target.closest('#zm')){const zb=document.getElementById('zb');zb.innerHTML='';zb.appendChild(z.cloneNode(true));document.getElementById('zm').classList.add('on');return}const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);
case 'restart':if(!S.rc){S.rc=1;return render()}S.rc=0;return start(i,1);
case 'home':save();S.k=-1;return render(1);
case 'uf':UF=+b.dataset.u;return render();
case 'ff':FF=+b.dataset.q;return render();
case 'go':return go(+b.dataset.k);
case 'bg':return openBG(b.dataset.k);
case 'x':return closeBG();
case 'zx':return document.getElementById('zm').classList.remove('on');
case 'nt':S.nt[j].o=1;return render();
case 'hint':{const k=S.k-1;S.p[k].h[j+'-'+b.dataset.m]=1;return render()}
case 'step':S.p[i].st++;return render();
case 'card':S.p[i].c=+b.dataset.c;return render(1);
case 'mcq':S.p[i].q=+b.dataset.o;return render();
case 'boss':{const f=S.p.map((x,k)=>k),miss=f.filter(k=>!S.p[k].ok),rest=f.filter(k=>S.p[k].ok);S.bo={l:miss.concat(rest).slice(0,3),k:0,s:null,r:0};return render()}
case 'bq':{const B=S.bo;if(B.s==null&&+b.dataset.o==0)B.r++;if(B.s!==0)B.s=+b.dataset.o;return render()}
case 'bn':S.bo.k++;S.bo.s=null;return render();
case 'frame':{const t=document.getElementById('ans'),f=S.f.p[i].fr;if(t.value.includes(f)){t.focus();return}t.value=t.value.trim()?t.value.trim()+'\n'+f:f;S.p[i].a=t.value;t.focus();const c=t.value.indexOf('___',t.value.length-f.length);if(c>=0)t.setSelectionRange(c,c+3);return}
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.includes('___')){st.w=1;render();return document.getElementById('ans').focus()}st.w=0;if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.c=5;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render(1)}
case 'rev':S.p[i].ck=0;S.p[i].done=0;S.p[i].c=4;render(1);return document.getElementById('ans').focus();
case 'next':{const w=S.p[i].done;S.p[i].done=1;S.p[i].ok=earned(i);if(!w)S.cb=S.p[i].ok?S.cb+1:0;return go(i+2)}
case 'cf':S.p[i].cf=+b.dataset.k;return render();
case 'copy':{const m=document.getElementById('cpmsg'),t=exportTxt();const fail=()=>{document.getElementById('cpd').open=true;const ta=document.getElementById('cpt');ta.focus();ta.select();m.textContent='Select the text below and copy it.'};try{navigator.clipboard.writeText(t).then(()=>{m.textContent='✔ Copied! Now paste it into Canvas.'},fail)}catch(e){fail()}return}
case 'retry':{const m=S.p.findIndex(x=>x.done&&!x.ok);S.p[m].c=4;S.p[m].ck=0;S.p[m].done=0;return go(m+1)}
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value;save()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeBG();document.getElementById('zm').classList.remove('on')}else if(e.key=='Tab'&&sh.classList.contains('on')){e.preventDefault();sh.querySelector('[data-a=x]').focus()}});
render(1);
</script>
</body>
