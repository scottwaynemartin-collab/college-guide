<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEQ Launchpad — World Compass</title>
<meta name="description" content="Build an AP World LEQ section by section, check it against the Panther Creek rubric, grade it in Gemini, and export a PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap">
<style>:root{
--navy:#1E2761;--navy-2:#2B3780;--navy-deep:#141B45;--gold:#C9A227;--gold-ink:#866C1A;--gold-2:#E3C464;--gold-soft:#F6EBC4;--gold-deep:#8A6D12;
--bg:#F4F5F9;--bg-2:#E9EBF3;--surface:#FFFFFF;--line:#D8DBE6;--line-2:#C7CBDC;--paper:#FDFCF7;
--ink:#1A1D2E;--ink-2:#4A4F68;--muted:#666B82;--on-navy:#FFFFFF;--on-navy-muted:#B9BFE0;
--green:#1B7F3B;--green-l:#E6F4EA;--green-b:#B9E2C5;--red:#B42318;--red-l:#FDECEC;--red-b:#F5C2BC;--yellow:#9A6700;--yellow-l:#FFF4CE;--yellow-b:#F0DB8A;
--blue:#0F4C81;--blue-l:#E2ECF6;--plum:#5B2C83;--plum-l:#EEE6F5;
--tT:#0F4C81;--tE:#B4560F;--tA:#5B2C83;--tO:#1B7F3B;
--shadow:0 1px 2px rgba(30,39,97,.06),0 6px 18px rgba(30,39,97,.08);
--shadow-lift:0 2px 4px rgba(30,39,97,.10),0 14px 34px rgba(30,39,97,.16);
--display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
--body:Arial,Helvetica,sans-serif;
--r:14px;--r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1}
.hidden{display:none!important}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* hero */
.hero{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -12% -70% auto;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(201,162,39,.30),rgba(201,162,39,0) 62%);pointer-events:none}
.hero .wrap{display:flex;align-items:center;gap:36px;padding:38px 22px 30px;position:relative}
.rose{flex:0 0 124px;width:124px;height:124px}
.eyebrow{font-size:12px;font-weight:bold;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6vw,64px);line-height:.96;margin:8px 0 10px;letter-spacing:-.01em}
.hero .lede{max-width:64ch;color:var(--on-navy-muted);font-size:16px;margin:0 0 16px}
.hero .lede b{color:var(--gold-2)}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--display);font-size:32px;font-weight:700;line-height:1;color:var(--gold-2)}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-navy-muted)}
@media (max-width:760px){.hero .wrap{flex-direction:column;text-align:center;gap:18px}.stats{justify-content:center}.hero .lede{margin-left:auto;margin-right:auto}.rose{width:96px;height:96px;flex-basis:96px}}

/* lobby keys */
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:18px 0 6px}
.hk{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.hk-i{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;color:#fff;background:var(--navy)}
.hk-i.g{background:var(--green)}.hk-i.r{background:var(--red)}.hk-i.p{background:var(--plum)}.hk-i.y{background:var(--gold-deep)}
.hk b{display:block;font-size:14px;color:var(--navy);line-height:1.25}
.hk i{display:block;font-style:normal;font-size:12.5px;color:var(--ink-2);line-height:1.4;margin-top:2px}

main{padding:22px 0 10px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin:26px 0 12px}
.sec-head h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;margin:0;color:var(--navy);white-space:nowrap}
.sec-head .rule{flex:1;height:2px;background:linear-gradient(90deg,var(--gold-2),rgba(201,162,39,.12))}
.sec-head .tag{font-size:11px;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);white-space:nowrap}
@media (max-width:640px){.sec-head{flex-wrap:wrap;gap:6px 10px}.sec-head h2{white-space:normal;font-size:25px}.sec-head .rule{display:none}}

/* flip cards */
.flip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.flip{position:relative;border:0;border-radius:var(--r);padding:16px 16px 14px;text-align:left;cursor:pointer;background:var(--navy);color:var(--on-navy);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;min-height:118px;display:flex;flex-direction:column;gap:6px}
.flip:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.flip .fq{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:#fff}
.flip .hintline{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-2);margin-top:auto}
.flip .fa{display:none;font-size:13.5px;line-height:1.4}
.flip .fa b{color:var(--gold-2)}
.flip .bigans{display:block;font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0 0 6px}
.flip.open{background:var(--surface);color:var(--ink);outline:2px solid var(--gold)}
.flip.open .fq{color:var(--navy);font-size:16px}
.flip.open .fa{display:block;color:var(--ink-2)}
.flip.open .fa b,.flip.open .bigans{color:var(--navy)}
.flip.open .hintline{color:var(--muted)}

/* pick cards */
.chip-rail{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:bold;font-size:12.5px;background:#fff;border:1px solid var(--line-2);color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--gold);color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{font-size:11px;opacity:.75}
.frq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.fcard{position:relative;overflow:hidden;display:flex;flex-direction:column;text-align:left;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:.2s;padding:0}
.fcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.fcard .fstrip{height:7px;background:linear-gradient(90deg,var(--navy),var(--gold))}
.fcard .fbody{padding:16px 18px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.fcard .fmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fcard h3{font-family:var(--display);font-size:24px;line-height:1.1;color:var(--navy)}
.fcard .fkind{font-size:12.5px;color:var(--ink-2)}
.fcard .fverbs{display:flex;gap:5px;flex-wrap:wrap}
.fcard .fverbs span{font-size:11px;font-weight:bold;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--ink-2)}
.fcard .fprog{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:10px}
.fcard .fprog .bar{flex:1}
.fcard .fscore{font-weight:bold;font-size:13px;color:var(--ink-2);white-space:nowrap}
.fcard .fgo{margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.fcard .fgo .go{padding:8px 15px;border-radius:9px;background:var(--navy);color:#fff;font-weight:bold;font-size:13px}
.fcard.soon{background:var(--paper);border-style:dashed;border-width:2px;box-shadow:none;cursor:default;align-items:center;justify-content:center;text-align:center;padding:24px 20px;min-height:170px}
.fcard.soon:hover{transform:none;box-shadow:none}
.fcard.soon .em{font-size:32px;margin-bottom:6px;display:block}
.fcard.soon h3{font-size:19px;color:var(--ink-2);margin-bottom:5px}
.fcard.soon p{font-size:13px;color:var(--muted);line-height:1.45;max-width:260px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:bold;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.pill.navy{background:var(--bg-2);color:var(--navy)}.pill.gold{background:var(--gold-soft);color:var(--gold-deep)}.pill.green{background:var(--green-l);color:var(--green)}.pill.red{background:var(--red-l);color:var(--red)}.pill.plum{background:var(--plum-l);color:var(--plum)}
.tag{display:inline-block;padding:3px 9px;border-radius:8px;font-weight:bold;font-size:11px;background:var(--bg);color:var(--ink-2)}
.bar{height:10px;border-radius:999px;background:var(--bg-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--navy),var(--green));border-radius:999px;transition:width .35s}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:11px;font-weight:bold;font-size:14px;border:1px solid var(--line-2);background:#fff;color:var(--navy);transition:.15s;user-select:none;-webkit-user-select:none;line-height:1.2}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 0 var(--navy-deep)}
.btn.primary:active{box-shadow:0 1px 0 var(--navy-deep);transform:translateY(2px)}
.btn.goldb{background:var(--gold);border-color:var(--gold);color:#241c02;box-shadow:0 3px 0 var(--gold-deep)}
.btn.goldb:active{box-shadow:0 1px 0 var(--gold-deep);transform:translateY(2px)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--bg-2);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.lg{padding:14px 24px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.checkb{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 0 #11562A}
.btn.checkb:active{box-shadow:0 1px 0 #11562A;transform:translateY(2px)}
.btn.stuck{background:var(--red-l);border-color:var(--red-b);color:var(--red)}
.btn.example{background:var(--plum-l);border-color:#D4C2E8;color:var(--plum)}
.btn.gem{background:linear-gradient(120deg,#4285F4,#9B72CB 55%,#D96570);border-color:transparent;color:#fff;box-shadow:0 3px 0 #3b4fa8}
.btn.gem:active{box-shadow:0 1px 0 #3b4fa8;transform:translateY(2px)}
.btn.dark{background:#1a1a1a;border-color:#1a1a1a;color:#fff;box-shadow:0 3px 0 #000}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* work header */
.w-head{display:flex;align-items:center;gap:14px;margin:4px 0 12px;flex-wrap:wrap}
.w-title h2{font-family:var(--display);font-size:clamp(26px,3vw,36px);line-height:1.05;color:var(--navy)}
.w-title .eyebrow{color:var(--gold-deep)}
.w-tools{margin-left:auto}
.namebox{display:flex;flex-direction:column;gap:3px}
.namebox span{font-size:10.5px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.namebox input{padding:9px 13px;border-radius:10px;border:1px solid var(--line-2);background:#fff;font:inherit;font-weight:bold;font-size:14px;outline:none;min-width:190px}
.namebox input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}

/* sticky score bar */
.scorebar{display:flex;align-items:center;gap:16px;padding:12px 18px;margin-bottom:14px;position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;border-bottom:2px solid var(--gold);border-radius:0 0 12px 12px;box-shadow:0 2px 10px rgba(30,39,97,.25)}
.scorebar .sb-big{font-family:var(--display);font-size:30px;font-weight:700;color:var(--gold-2);line-height:1;white-space:nowrap}
.scorebar .sb-mid{flex:1;min-width:120px}
.scorebar .sb-mid b{font-size:12.5px;color:var(--on-navy-muted)}
.scorebar .bar{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.scorebar .bar i{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.scorebar .dots{display:flex;gap:5px;flex-wrap:wrap}
.scorebar .dots button{min-width:30px;height:30px;padding:0 7px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font-family:var(--display);font-weight:700;font-size:13px;color:#fff;transition:.15s;white-space:nowrap}
.scorebar .dots button:hover{border-color:var(--gold)}
.scorebar .dots button.y{background:var(--green);border-color:var(--green)}
.scorebar .dots button.n{background:#8C2B22;border-color:#8C2B22}
.scorebar .dots button.w{background:var(--gold);border-color:var(--gold);color:#241c02}
.scorebar .clock{font-family:var(--display);font-size:22px;font-weight:700;color:#fff;min-width:64px;text-align:right}
.scorebar .clock.danger{color:#FFB4AC}
.tbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(201,162,39,.55);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase}
.tbtn:hover{background:rgba(255,255,255,.22)}
@media (max-width:760px){.scorebar{position:static;flex-wrap:wrap;gap:10px}.scorebar .clock{display:none}}

/* prompt + stimulus */
.promptbox{border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:var(--r-sm);padding:14px 18px;margin:8px 0 12px;background:var(--paper);box-shadow:var(--shadow)}
.promptbox .ptag{font-size:11px;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep)}
.promptbox .bg{margin:8px 0 6px;font-size:15px;color:var(--ink-2)}
.promptbox .q{margin:0 0 8px;font-weight:bold;font-size:16.5px;color:var(--navy)}
.areas{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.areas .alabel{font-size:12px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.areas span.a{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--ink-2)}
.fictag{display:inline-block;margin:0 0 6px;font-size:11px;font-weight:bold;background:var(--plum-l);color:var(--plum);border-radius:999px;padding:3px 10px;letter-spacing:.04em;text-transform:uppercase}
.stim{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow);overflow:hidden;margin:8px 0 12px}
.stim .shead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--navy);padding:8px 12px}
.stim .skind{font-size:9.5px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);background:var(--gold-2);border-radius:4px;padding:2px 7px}
.stim .stitle{font-family:var(--display);font-weight:700;font-size:18px;color:#fff;flex:1;min-width:120px}
.stim .sbody{padding:10px 14px 4px;font-size:14.5px;line-height:1.55}
.stim .sbody p{margin:0 0 8px}
.stim .ssrc{padding:0 14px 12px;font-size:12.5px;color:var(--ink-2);font-style:italic}
.stim .sdir{background:var(--bg);border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--ink-2)}
.ptable{margin:2px 0 12px;border:1px solid var(--gold-soft);border-radius:12px;background:linear-gradient(135deg,#fff,var(--paper));overflow:hidden}
.ptable summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:10px 14px;font-weight:bold;font-size:13px;color:var(--navy);user-select:none}
.ptable summary::-webkit-details-marker{display:none}
.ptable summary .ptk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--gold);color:#241c02;font-size:13px;flex:none}
.ptable summary .pts{margin-left:auto;font-size:11px;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px}
.ptable summary .pts::after{content:"\25BE";font-size:14px;transition:.2s}
.ptable[open] summary .pts::after{transform:rotate(180deg)}
.ptable .ptb{padding:0 12px 12px}
.ptable .stim{margin:0}

/* how it works + key */
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:12px;background:linear-gradient(135deg,#fff,var(--gold-soft));border:1px solid var(--gold-soft);border-radius:var(--r)}
.ht-step{display:flex;gap:10px;align-items:flex-start}
.ht-step b{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;color:#fff;background:var(--navy)}
.ht-step strong{display:block;font-size:13.5px;color:var(--navy);line-height:1.2;margin-bottom:2px}
.ht-step div{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.kbd,.ht-step kbd{display:inline-block;padding:0 5px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;background:#fff;font-size:11px;font-weight:bold;color:var(--ink-2);font-family:var(--body)}
@media (max-width:980px){.howto{grid-template-columns:1fr 1fr}}@media (max-width:640px){.howto{grid-template-columns:1fr}}
.tea-key{padding:16px 18px;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tea-key h3{font-size:11.5px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.tk-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tk{display:flex;gap:10px;align-items:flex-start}
.tk .lab{flex:none;min-width:40px;height:26px;padding:0 7px;border-radius:7px;display:grid;place-items:center;font-weight:bold;font-size:12px;color:#fff}
.lab.T{background:var(--tT)}.lab.E{background:var(--tE)}.lab.A{background:var(--tA)}.lab.O{background:var(--tO)}.lab.C{background:var(--green)}.lab.H{background:var(--red)}.lab.V{background:var(--tE)}.lab.R{background:var(--yellow)}.lab.B{background:var(--navy)}.lab.X{background:var(--plum)}
.tk b{display:block;font-size:14px;color:var(--navy)}
.tk div{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.tk-note{margin-top:10px;font-size:12.5px;color:var(--ink-2);border-top:1px dashed var(--line-2);padding-top:9px;line-height:1.45}
.tk-note b{color:var(--navy)}

/* part cards */
.part{padding:18px 20px;margin-bottom:14px;position:relative;overflow:hidden;scroll-margin-top:110px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.part::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line-2);transition:.2s}
.part.earned::before{background:var(--green)}
.part.notyet::before{background:var(--red)}
.part-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.part-l{min-width:32px;height:32px;padding:0 9px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:#fff;background:var(--navy);white-space:nowrap}
.part.earned .part-l{background:var(--green)}
.verb{display:inline-flex;padding:4px 10px;border-radius:7px;font-weight:bold;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--vc,var(--plum))}
.part-q{font-size:16.5px;font-weight:bold;color:var(--navy);line-height:1.45;margin-bottom:6px}
.part-dir{font-size:13.5px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin:4px 0 10px;line-height:1.5}
.part-dir b{color:var(--navy)}
.qinput{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin:2px 0 8px;font:inherit;font-size:14.5px}
.boxes{display:flex;flex-direction:column;gap:9px;margin:8px 0 12px}
.bx{display:flex;gap:10px;align-items:flex-start}

<script>var TINF_OK = 0;
var TINF_DATA_ERROR = -3;

function Tree() {
  this.table = new Uint16Array(16);   /* table of code length counts */
  this.trans = new Uint16Array(288);  /* code -> symbol translation table */
}

function Data(source, dest) {
  this.source = source;
  this.sourceIndex = 0;
  this.tag = 0;
  this.bitcount = 0;
  
  this.dest = dest;
  this.destLen = 0;
  
  this.ltree = new Tree();  /* dynamic length/symbol tree */
  this.dtree = new Tree();  /* dynamic distance tree */
}

/* --------------------------------------------------- *
 * -- uninitialized global data (static structures) -- *
 * --------------------------------------------------- */

var sltree = new Tree();
var sdtree = new Tree();

/* extra bits and base tables for length codes */
var length_bits = new Uint8Array(30);
var length_base = new Uint16Array(30);

/* extra bits and base tables for distance codes */
var dist_bits = new Uint8Array(30);
var dist_base = new Uint16Array(30);

/* special ordering of code length codes */
var clcidx = new Uint8Array([
  16, 17, 18, 0, 8, 7, 9, 6,
  10, 5, 11, 4, 12, 3, 13, 2,
  14, 1, 15
]);

/* used by tinf_decode_trees, avoids allocations every call */
var code_tree = new Tree();
var lengths = new Uint8Array(288 + 32);

/* ----------------------- *
 * -- utility functions -- *
 * ----------------------- */

/* build extra bits and base tables */
function tinf_build_bits_base(bits, base, delta, first) {
  var i, sum;

  /* build bits table */
  for (i = 0; i < delta; ++i) bits[i] = 0;
  for (i = 0; i < 30 - delta; ++i) bits[i + delta] = i / delta | 0;

  /* build base table */
  for (sum = first, i = 0; i < 30; ++i) {
    base[i] = sum;
    sum += 1 << bits[i];
  }
}

/* build the fixed huffman trees */
function tinf_build_fixed_trees(lt, dt) {
  var i;

  /* build fixed length tree */
  for (i = 0; i < 7; ++i) lt.table[i] = 0;

  lt.table[7] = 24;
  lt.table[8] = 152;
  lt.table[9] = 112;

  for (i = 0; i < 24; ++i) lt.trans[i] = 256 + i;
  for (i = 0; i < 144; ++i) lt.trans[24 + i] = i;
  for (i = 0; i < 8; ++i) lt.trans[24 + 144 + i] = 280 + i;
  for (i = 0; i < 112; ++i) lt.trans[24 + 144 + 8 + i] = 144 + i;

  /* build fixed distance tree */
  for (i = 0; i < 5; ++i) dt.table[i] = 0;

  dt.table[5] = 32;

  for (i = 0; i < 32; ++i) dt.trans[i] = i;
}

/* given an array of code lengths, build a tree */
var offs = new Uint16Array(16);

function tinf_build_tree(t, lengths, off, num) {
  var i, sum;

  /* clear code length count table */
  for (i = 0; i < 16; ++i) t.table[i] = 0;

  /* scan symbol lengths, and sum code length counts */
  for (i = 0; i < num; ++i) t.table[lengths[off + i]]++;

  t.table[0] = 0;

  /* compute offset table for distribution sort */
  for (sum = 0, i = 0; i < 16; ++i) {
    offs[i] = sum;
    sum += t.table[i];
  }

  /* create code->symbol translation table (symbols sorted by code) */
  for (i = 0; i < num; ++i) {
    if (lengths[off + i]) t.trans[offs[lengths[off + i]]++] = i;
  }
}

/* ---------------------- *
 * -- decode functions -- *
 * ---------------------- */

/* get one bit from source stream */
function tinf_getbit(d) {
  /* check if tag is empty */
  if (!d.bitcount--) {
    /* load next tag */
    d.tag = d.source[d.sourceIndex++];
    d.bitcount = 7;
  }

  /* shift bit out of tag */
  var bit = d.tag & 1;
  d.tag >>>= 1;

  return bit;
}

/* read a num bit value from a stream and add base */
function tinf_read_bits(d, num, base) {
  if (!num)
    return base;

  while (d.bitcount < 24) {
    d.tag |= d.source[d.sourceIndex++] << d.bitcount;
    d.bitcount += 8;
  }

  var val = d.tag & (0xffff >>> (16 - num));
  d.tag >>>= num;
  d.bitcount -= num;
  return val + base;
}

/* given a data stream and a tree, decode a symbol */
function tinf_decode_symbol(d, t) {
  while (d.bitcount < 24) {
    d.tag |= d.source[d.sourceIndex++] << d.bitcount;
    d.bitcount += 8;
  }
  
  var sum = 0, cur = 0, len = 0;
  var tag = d.tag;

  /* get more bits while code value is above sum */
  do {
    cur = 2 * cur + (tag & 1);
    tag >>>= 1;
    ++len;

    sum += t.table[len];
    cur -= t.table[len];
  } while (cur >= 0);
  
  d.tag = tag;
  d.bitcount -= len;

  return t.trans[sum + cur];
}

/* given a data stream, decode dynamic trees from it */
function tinf_decode_trees(d, lt, dt) {
  var hlit, hdist, hclen;
  var i, num, length;

  /* get 5 bits HLIT (257-286) */
  hlit = tinf_read_bits(d, 5, 257);

  /* get 5 bits HDIST (1-32) */
  hdist = tinf_read_bits(d, 5, 1);

  /* get 4 bits HCLEN (4-19) */
  hclen = tinf_read_bits(d, 4, 4);

 * -- block inflate functions -- *
 * ----------------------------- */

  length = d.source[d.sourceIndex + 1];
  length = 256 * length + d.source[d.sourceIndex];

  invlength = 256 * invlength + d.source[d.sourceIndex + 2];

<script id="ms-save-banner">
/* Google Sites gives this embed a new origin on every load, so nothing typed survives a refresh or
   close, and Sites blocks leave-page warnings. Same banner as GeoArcade's FRQ room (Oct 2026). */
(function(){
'use strict';
var RUBRIC = "<b>Mr. Martin\u2019s class:</b> DBQs are scored out of 6 and LEQs out of 5, with no complexity point. This checker follows the official AP rubric, so its point totals can be higher than your class score.";
var css = '.svwarn{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 16px;margin:0 0 14px;border-radius:14px;background:#FFF4D6;border:2px solid #F5C451;box-shadow:0 2px 10px rgba(0,0,0,.06);font-family:inherit;color:#1f1b3a}'
 + '.svwarn.dirty{background:#FFE9D6;border-color:#F97316}.svwarn.safe{background:#E7F8EE;border-color:#86D9A3}'
 + '.svw-copy{display:flex;gap:11px;align-items:flex-start;flex:1;min-width:240px}.svw-i{flex:none;font-size:22px;line-height:1}'
 + '.svw-copy b{display:block;font-size:15px;color:#7A3E00;line-height:1.25}.svwarn.safe .svw-copy b{color:#166534}'
 + '.svw-copy span{display:block;font-size:13px;font-weight:700;color:#3b3552;line-height:1.45;margin-top:2px}'
 + '.svw-btns{display:flex;gap:8px;flex-wrap:wrap}.svbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;font:inherit;font-weight:800;font-size:13.5px;background:#fff;color:#1f1b3a;border:1px solid #d6d2e6;cursor:pointer;white-space:nowrap}'
 + '.svbtn:hover{filter:brightness(.97)}.svbtn.pdf{background:#1f2a5c;border-color:#1f2a5c;color:#fff}.svbtn.ghost{background:transparent}'
 + '.svw-rubric{flex-basis:100%;font-size:13px;font-weight:600;color:#3b3552;line-height:1.45;border-top:1px dashed rgba(0,0,0,.18);padding-top:8px}'
 + '@media (max-width:640px){.svw-btns{width:100%}.svbtn{flex:1;justify-content:center}}@media print{.svwarn{display:none!important}}';
var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
var dirty = false, last = null;
function msg(){
  if (!dirty && last) return '✓ Backed up at ' + last + '. If you keep writing, back up again before you leave.';
  if (dirty && last) return 'You have written more since your last backup (' + last + '). Refreshing or closing this tab erases it — back up again before you leave.';
  return 'If you refresh or close this tab, everything you typed is erased. Before you leave, export the PDF or download a backup file.';
}
function paint(){
  var box = document.getElementById('svWarn'); if (!box) return;
  box.classList.toggle('dirty', dirty); box.classList.toggle('safe', !dirty && !!last);
  var s = document.getElementById('svState'); if (s && s.textContent !== msg()) s.textContent = msg();
}
function ensure(){
  var head = document.querySelector('#work .w-head');
  if (!head || document.getElementById('svWarn')) return;
  var box = document.createElement('div');
  box.className = 'svwarn'; box.id = 'svWarn'; box.setAttribute('role', 'note');
  box.innerHTML = '<div class="svw-copy"><span class="svw-i" aria-hidden="true">⚠️</span><div><b>This page does not save your work.</b><span id="svState"></span></div></div>'
    + '<div class="svw-btns"><button type="button" class="svbtn pdf" data-sv="pdfBtn">📄 Export to PDF</button><button type="button" class="svbtn" data-sv="saveBtn">💾 Download backup</button><button type="button" class="svbtn ghost" data-sv="loadBtn">📂 Load a backup</button></div>'
    + (RUBRIC ? '<div class="svw-rubric">' + RUBRIC + '</div>' : '');
  head.insertAdjacentElement('afterend', box);
  paint();
}
document.addEventListener('click', function(e){
  if (!e.target.closest) return;
  var b = e.target.closest('[data-sv]');
  if (b) { var t = document.getElementById(b.getAttribute('data-sv')); if (t) t.click(); return; }
  if (e.target.closest('#saveBtn') || e.target.closest('#xGo')) setTimeout(function(){ last = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); dirty = false; paint(); }, 50);
  if (e.target.closest('#backBtn')) { dirty = false; last = null; setTimeout(paint, 0); }
}, true);
document.addEventListener('input', function(e){ if (e.target.closest && e.target.closest('#work textarea, #work input[type=text]')) { dirty = true; paint(); } }, true);
new MutationObserver(ensure).observe(document.body, {childList:true, subtree:true});
ensure();
})();
</script>
