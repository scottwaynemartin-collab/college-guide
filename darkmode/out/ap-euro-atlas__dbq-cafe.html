<style id="dm-css">
html.dm{color-scheme:dark;--creme:#1C1612;--craie:#2A221C;--marbre:#211A15;--vein:#3E342C;--esp:#F3EAE0;--esp-2:#D8CBBE;--esp-3:#B5A799;--laiton-d:#E2BC6E;--laiton-s:#3A2E14;--vert:#7FC094;--vert-s:#173125;--warn:#F0B35A;--warn-s:#3F2F10;--bad:#F08A8F;--bad-s:#42201F;--dm-card:var(--marbre);--dm-ink:var(--esp);--dm-line:var(--vein);--dm-tg-bg:#211A15;--dm-tg-fg:#E2BC6E;--dm-tg-b:#3E342C;--dm-tg-font:'Lexend',system-ui,sans-serif}
:where(html.dm) body{background:var(--creme);background-color:var(--creme);color:#F4EAE5}
:where(html.dm) .valance{color:#ECE7DA}
:where(html.dm) .board{color:#ECE7DA}
:where(html.dm) .note{background:var(--creme);background-color:var(--creme);border:1px solid #745E2F;border-color:#745E2F;border-top:1px solid #745E2F;border-bottom:1px solid #745E2F;border-left:1px solid #745E2F;border-right:1px solid #745E2F}
:where(html.dm) .note .hand{color:#CAC7E6}
:where(html.dm) .note .sig{color:#CAC7E6}
:where(html.dm) .courses li{background:var(--marbre);background-color:var(--marbre)}
:where(html.dm) .courses li::before{color:#ECE7DA}
:where(html.dm) .why a,:where(html.dm) .lobby a{color:#F08A8F}
:where(html.dm) .foot a{color:#F08A8F}
:where(html.dm) .bar{color:#ECE7DA}
:where(html.dm) .bar button{color:#ECE7DA}
:where(html.dm) .bar .stars{color:var(--esp)}
:where(html.dm) .receipt{background:var(--marbre);background-color:var(--marbre)}
:where(html.dm) .bubble{background:var(--marbre);background-color:var(--marbre)}
:where(html.dm) .bubble::before{background:var(--marbre);background-color:var(--marbre)}
:where(html.dm) .bubble .who{color:#F08A8F}
:where(html.dm) .plate{background:var(--marbre);background-color:var(--marbre);box-shadow:var(--marbre) 0px 1px 0px inset, rgba(43, 26, 18, 0.55) 0px 22px 40px -30px, rgba(28,22,18,0.70) 0px 0px 0px 8px}
:where(html.dm) .bd b{color:#F08A8F}
:where(html.dm) .quiz button{background:var(--marbre);background-color:var(--marbre)}
:where(html.dm) .quiz button.right{border-color:#3F6E4E}
:where(html.dm) .quiz button.wrong{border-color:#A3242B}
:where(html.dm) .doc{background:var(--marbre);background-color:var(--marbre)}
:where(html.dm) .doc .dn{color:#ECE7DA}
:where(html.dm) .dots7 button{background:var(--marbre);background-color:var(--marbre)}
:where(html.dm) .dots7 button.done{border-color:#3F6E4E}
:where(html.dm) .tag{background:#5A4237}
:where(html.dm) .tag.e{background:#8C6524}
:where(html.dm) textarea:focus,:where(html.dm) input[type="text"]:focus,:where(html.dm) select:focus{background:var(--marbre);background-color:var(--marbre)}
:where(html.dm) .choice button{background:var(--marbre);background-color:var(--marbre)}
