<html lang="en">
<head>

<title>FRQ Tutor · AP Human Geography · GeoArcade</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0920;--pn:#161239;--pn2:#1e1950;--ink:#eeeaff;--dim:#a49ed6;--cy:#22e5ff;--mg:#ff3fa4;--yl:#ffd23f;--gr:#4dff91;--rd:#ff5b6e;--ln:#3a3288;--px:'Press Start 2P',monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(rgba(34,229,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,229,255,.05) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:17px/1.55 'Chakra Petch',system-ui,sans-serif;min-height:100vh}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);z-index:50}
#app{max-width:780px;margin:0 auto;padding:14px 14px 60px}
.px{font-family:var(--px);text-transform:uppercase;letter-spacing:.04em;line-height:1.6}
h1,h2,h3{margin:0}
p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer}
.panel{background:var(--pn);border:3px solid var(--ln);box-shadow:5px 5px 0 #000;padding:16px;margin:16px 0;position:relative}
.panel>.tag{position:absolute;top:-12px;left:12px;background:var(--bg);padding:2px 8px;font-size:10px;color:var(--cy);border:2px solid var(--ln)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--yl);color:#120d2b;border:0;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),4px 4px 0 #000;padding:13px 18px;font:11px/1.4 var(--px);text-transform:uppercase;min-height:46px}
.btn:active{transform:translate(3px,3px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),1px 1px 0 #000}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.c{background:var(--cy)}.btn.m{background:var(--mg);color:#fff}.btn.g{background:var(--gr)}
.btn.o{background:transparent;color:var(--cy);box-shadow:inset 0 0 0 2px var(--cy),4px 4px 0 #000}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.link{background:none;border:0;color:var(--dim);text-decoration:underline;padding:8px 4px;font-size:15px}
.bgc{display:inline-flex;align-items:center;gap:6px;background:var(--pn2);border:2px dashed var(--mg);color:#ffc4e3;padding:7px 11px;margin:4px 6px 4px 0;font-size:14px;font-weight:600}
.bgc:hover{background:#2a1d55}
/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0 10px;border-bottom:3px solid var(--ln)}
.brand{font:10px var(--px);color:var(--mg);text-shadow:0 0 8px rgba(255,63,164,.7);background:none;border:0;padding:6px 0;text-align:left}
.brand b{color:var(--cy);text-shadow:0 0 8px rgba(34,229,255,.7)}
.score{font:10px var(--px);color:var(--yl);white-space:nowrap}
.prog{display:flex;gap:4px;margin:12px 0 4px}
.seg{flex:1;height:26px;border:2px solid var(--ln);background:#0b0820;font:9px var(--px);color:var(--dim);padding:0;display:flex;align-items:center;justify-content:center}
.seg.v{color:var(--ink);border-color:var(--cy)}
.seg.ok{background:var(--gr);color:#0b1a12;border-color:var(--gr)}
.seg.no{background:#4a2140;color:#ffb3c8;border-color:var(--rd)}
.seg.cur{background:var(--yl);color:#111;border-color:var(--yl);animation:pulse 1.2s steps(2) infinite}
.seg:disabled{cursor:default}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--yl),0 0 12px var(--yl)}}
.sym{font-family:system-ui,sans-serif;font-size:14px;line-height:1}
.plabel{font:9px var(--px);color:var(--dim);display:flex;justify-content:space-between}
/* home */
.hero{text-align:center;padding:26px 6px 8px}
.hero h1{font:clamp(26px,8vw,46px)/1.2 var(--px);color:var(--yl);text-shadow:3px 3px 0 var(--mg),6px 6px 0 #000}
.hero .sub{font:10px/1.8 var(--px);color:var(--cy);margin-top:14px}
.blink{animation:bl 1s steps(1) infinite;color:var(--gr);font:11px var(--px);margin:18px 0 4px}
@keyframes bl{50%{opacity:0}}
.carts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cart{text-align:left;background:linear-gradient(160deg,#241c63,#120e33);border:3px solid var(--cy);box-shadow:6px 6px 0 #000;padding:16px;display:flex;flex-direction:column;gap:8px}
.cart:nth-child(2){border-color:var(--mg)}
.cart .k{font:9px var(--px);color:var(--yl)}
.cart h3{font-size:21px;line-height:1.25}
.cart .d{color:var(--dim);font-size:15px}
.cart .go{margin-top:auto;font:10px var(--px);color:var(--gr)}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;counter-reset:h}
.how div{background:var(--pn2);padding:10px;border-left:4px solid var(--cy);font-size:14px}
.how div:before{counter-increment:h;content:"0" counter(h);display:block;font:10px var(--px);color:var(--cy);margin-bottom:4px}
.tea{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tea div{padding:10px;background:#0f0c29;border:2px solid var(--ln);font-size:14px}
.tea b{display:block;font:20px var(--px);margin-bottom:6px}
.tT{color:var(--cy)}.tE{color:var(--yl)}.tA{color:var(--mg)}
/* stimulus */
.stim{background:#0a0820;border:3px solid var(--cy);padding:10px;box-shadow:0 0 0 3px #000,0 0 18px rgba(34,229,255,.25)}
.stim h3{font:10px/1.6 var(--px);color:var(--cy);margin-bottom:8px}
.stim svg{width:100%;height:auto;display:block;max-width:560px;margin:0 auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px;color:var(--dim)}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px;border:1px solid #000}
.src{font-size:12px;color:var(--dim);margin-top:6px;font-style:italic}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:15px}
th,td{border:2px solid var(--ln);padding:8px 6px;text-align:center}
th{background:var(--pn2);color:var(--yl);font-size:13px;line-height:1.3}
td:first-child{text-align:left;font-weight:700;color:var(--cy)}
.notice{border-left:4px solid var(--yl);padding:10px 12px;background:var(--pn2);margin:12px 0}
.notice .q{font-weight:700}
.notice textarea{min-height:56px;margin-top:8px}
.take{margin-top:8px;padding:10px;background:#0f2a24;border:2px solid var(--gr);font-size:15px}
.take:before{content:"TUTOR'S TAKE";display:block;font:9px var(--px);color:var(--gr);margin-bottom:4px}
details.peek{margin:12px 0;border:2px solid var(--ln);background:#0e0b28}
details.peek summary{cursor:pointer;padding:12px;font:10px var(--px);color:var(--cy);list-style:none}
details.peek summary:before{content:"▸ "}
details.peek[open] summary:before{content:"▾ "}
details.peek>div{padding:0 10px 10px}
/* part */
.qbox{background:#0a0820;border:3px solid var(--yl);padding:14px;box-shadow:5px 5px 0 #000}
.qbox .px{font-size:10px;color:var(--yl);display:block;margin-bottom:8px}
.qbox p{font-size:19px;font-weight:600;margin:0}
.verb{display:flex;gap:14px;align-items:flex-start}
.verb .vb{font:13px var(--px);background:var(--mg);color:#fff;padding:10px;box-shadow:3px 3px 0 #000;flex:none}
.verb ul{margin:6px 0 0;padding-left:20px;font-size:15px;color:var(--dim)}
.step{display:flex;gap:12px;padding:12px 0;border-top:2px dashed var(--ln)}
.step:first-of-type{border-top:0}
.badge{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font:16px var(--px);background:#0a0820;border:3px solid currentColor}
.step .lb{font:9px var(--px);opacity:.9}
.step .pr{margin:4px 0 6px}
.hb{background:none;border:2px solid var(--yl);color:var(--yl);font:9px var(--px);padding:8px 10px;margin:4px 6px 0 0}
.hint{background:#2b2410;border-left:4px solid var(--yl);padding:8px 10px;margin:6px 0;font-size:15px}
.hint:before{content:"💡 "}
textarea{width:100%;min-height:140px;background:#07061a;color:var(--ink);border:3px solid var(--cy);padding:12px;font:17px/1.5 'Chakra Petch',system-ui,sans-serif;resize:vertical}
textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(34,229,255,.35)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--pn2);border:2px solid var(--ln);padding:6px 10px;font-size:14px;color:var(--dim)}
.teamini{font-size:14px;color:var(--dim);margin-bottom:8px}
.teamini b{font-family:var(--px);font-size:11px}
.ck{list-style:none;padding:0;margin:8px 0}
.ck li{margin:8px 0}
.ck label{display:flex;gap:12px;align-items:flex-start;background:var(--pn2);border:2px solid var(--ln);padding:10px 12px;cursor:pointer}
.ck input{appearance:none;flex:none;width:26px;height:26px;border:3px solid var(--cy);background:#07061a;margin:0;cursor:pointer;display:grid;place-content:center}
.ck input:checked{background:var(--gr);border-color:var(--gr)}
.ck input:checked:after{content:"✓";color:#07220f;font-weight:900}
.ck small{display:block;color:var(--gr);font-size:12px}
.mine{white-space:pre-wrap;background:#07061a;border:2px dashed var(--ln);padding:10px;font-size:15px;color:var(--dim)}
.model{background:#102033;border:3px solid var(--cy);padding:12px}
.model .px{font-size:9px;color:var(--cy);display:block;margin-bottom:6px}
.verdict{font:12px/1.6 var(--px);padding:12px;text-align:center;margin-top:12px;border:3px solid}
.verdict.y{color:var(--gr);border-color:var(--gr);background:#0b2418}
.verdict.n{color:var(--rd);border-color:var(--rd);background:#2a0c1a}
.note{font-size:14px;color:var(--dim)}
/* done */
.big{font:clamp(24px,7vw,40px)/1.3 var(--px);color:var(--gr);text-align:center;text-shadow:3px 3px 0 #000,0 0 14px rgba(77,255,145,.6)}
.stars{text-align:center;font-size:30px;letter-spacing:4px;margin:10px 0}
.rank{text-align:center;font:11px var(--px);color:var(--yl)}
.res{list-style:none;padding:0;margin:0}
.res li{padding:10px 0;border-top:2px dashed var(--ln)}
.res li:first-child{border-top:0}
.res b{font-family:var(--px);font-size:11px;margin-right:6px}
/* sheet */
#sh{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,3,18,.8);padding:16px}
#sh.on{display:flex}
#sh .card{background:var(--pn);border:3px solid var(--mg);box-shadow:6px 6px 0 #000,0 0 30px rgba(255,63,164,.35);max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px;animation:up .2s steps(4)}

#sh .k{font:9px var(--px);color:var(--mg)}
#sh h3{font-size:22px;margin:6px 0 10px}
#sh ol{padding-left:22px;margin:0}
#sh li{margin:8px 0}
@media (max-width:620px){
 body{font-size:16px}

 .seg{font-size:8px;height:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== Background pop-outs ===== */
const BG={
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
cashcrop:{t:"Cash crops & plantations",s:["A cash crop is grown to sell, often for export, rather than to feed the farmer's own family.","Colonial powers pushed colonies to specialize in a few crops their home factories needed, like cotton, jute (for sacks and rope), and tea.","Plantations are large estates that grow one crop for export, often with cheap or forced labor. British-owned tea estates in Assam are an example.","Depending on one or two exports leaves a region exposed to world prices it can't control."]},
famine:{t:"Famines in colonial India",s:["Several deadly famines struck British India in the late 1800s. The Great Famine of 1876–78 alone killed millions of people.","Droughts caused the crop failures, but colonial policy made them worse: grain kept being exported, and relief was limited.","Farmers who grew cash crops had little stored food. They depended on wages and market prices to buy it.","Historians point to these famines as evidence that colonial economic choices shaped life-and-death outcomes."]},
portcity:{t:"Colonial port cities",s:["Colonizers built port cities as gateways, where raw materials left the colony and manufactured goods came in.","Bombay (Mumbai), Calcutta (Kolkata), and Madras (Chennai) grew from small trading posts into major cities under British rule.","Calcutta was the capital of British India until 1911, when the capital moved to Delhi.","Many former colonies still have a primate city, one city far larger than all the others, that began as a colonial port."]},
wst:{t:"Wallerstein's world-system theory",s:["Immanuel Wallerstein divided the world economy into the core, the semi-periphery, and the periphery.","Core countries are wealthy and industrialized, and they make high-value goods.","Periphery countries supply raw materials and cheap labor, and they earn far less.","Colonialism helped build this pattern by locking colonies into shipping raw materials to the core.","The theory's big idea: countries are linked, and the core's wealth depends partly on the periphery."]},
uneven:{t:"Uneven development",s:["Development is rarely spread evenly inside a country.","Places that get early investment, such as ports, railways, and factories, attract more businesses and workers, which attracts even more investment.","Geographers call this snowball effect cumulative causation.","The result is a core region that keeps growing while peripheral regions fall behind, and the gap can last for generations."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]},
dtm:{t:"Demographic Transition Model (DTM)",s:["The DTM describes how birth and death rates change as a country develops.","Stage 1: both rates are high, so population barely grows.","Stage 2: death rates drop (better food, medicine, sanitation) but birth rates stay high, so population grows fast.","Stage 3: birth rates fall as the country urbanizes and women gain education.","Stages 4–5: both rates are low, and population levels off or even shrinks."]},
tfr:{t:"Total Fertility Rate (TFR)",s:["TFR is the average number of children a woman is expected to have in her lifetime.","A TFR of about 2.1 is replacement level, just enough for each generation to replace itself. The extra 0.1 covers children who die young.","Above 2.1, population tends to grow. Below 2.1, it eventually shrinks unless immigrants arrive.","TFR is one of the best single numbers for predicting a country's future population."]},
women:{t:"Women's education & fertility",s:["Worldwide, one of the strongest predictors of lower fertility is how many years of school girls complete.","Staying in school tends to delay marriage and first births.","Education opens paid jobs, so each extra child has a higher opportunity cost (the income a mother gives up).","Educated women usually know more about health care and family planning and have more say in family decisions."]},
urban:{t:"Urbanization & family size",s:["On farms, children can help with work, so a big family can be an economic asset.","In cities, children usually don't earn income, and housing, food, and school cost more.","Cities also offer more clinics, contraception, and paid jobs for women.","That's why fertility usually falls as a country becomes more urban."]},
pyramid:{t:"Population pyramids",s:["A population pyramid is a bar graph of a population by age and sex, with the youngest at the bottom.","A wide base means many births, which is common in Stage 2 countries.","When fertility falls, the base narrows and the shape turns more like a beehive or column.","Large age groups (cohorts) move up the pyramid over time like a bulge."]},
dependency:{t:"Dependency ratio",s:["The dependency ratio compares people who usually aren't working (children under 15 and adults 65+) with the working-age population (15–64).","A high elderly dependency ratio means fewer workers paying taxes to support each retiree's pension and health care.","Very-low-fertility countries such as Japan and Italy face rising elderly dependency ratios.","Common responses include encouraging immigration, raising the retirement age, and supporting families who want children."]}
};

};

<textarea id="ans" data-in="ans" data-i="${i}" placeholder="${tea?'Write 2–3 sentences…':'Write a short phrase…'}" aria-label="Your answer" ${st.ck?'readonly':''}>${esc(st.a)}</textarea>
${tea&&!st.ck?`<div class="chips">${["For example, ","This is because ","which leads to ","As a result, "].map(c=>`<button class="chip" data-a="ins" data-t="${c}">+ ${c.trim()}</button>`).join('')}</div>`:''}
${st.ck?`<div class="row"><button class="link" data-a="rev" data-i="${i}">✎ Revise my answer</button></div>`:`<div class="row"><button class="btn" data-a="check" data-i="${i}">Check my answer ▸</button></div>`}</div>`}
if(st.ck){const ok=earned(i);h+=`<div class="panel"><span class="tag px">4 · Check it</span><p><b>What earns the point${P.r.m=="any"?' (any ONE of these)':' (you need ALL of these)'}:</b> Tick each one your answer really does.</p>
<ul class="ck">${P.r.i.map((r,j)=>`<li><label><input type="checkbox" data-a="box" data-i="${i}" data-j="${j}" ${st.box[j]?'checked':''}><span>${esc(r[0])}${st.g[j]?'<small>Tutor spotted this; double-check it.</small>':''}</span></label></li>`).join('')}</ul>
<p class="note">The tutor guesses from keywords. <b>You</b> make the final call, so be honest!</p>
<div class="model"><span class="px">Model answer</span>${esc(P.mo)}</div>
<div class="verdict ${ok?'y':'n'}">${ok?'★ Point earned!':'Not yet: revise or move on'}</div>
<div class="row">${ok?'':`<button class="btn o" data-a="rev" data-i="${i}">Revise</button>`}<button class="btn g" data-a="next" data-i="${i}">${i+1<n?`Part ${L(i+1)} ▸`:'See results ▸'}</button></div></div>`}
return h}
function doneV(){const n=S.f.p.length,sc=score(),ps=S.f.p.map((p,i)=>[p,i,S.p[i]]),ok=ps.filter(x=>x[2].ok),no=ps.filter(x=>!x[2].ok);
const rank=sc==n?"GEO LEGEND":sc>=5?"MAP MASTER":sc>=3?"RISING SCOUT":"KEEP PLAYING";
return `<div class="panel" style="text-align:center"><div class="big">Stage clear!</div><div class="stars" aria-label="${sc} of ${n}">${'★'.repeat(sc)}<span style="opacity:.25">${'★'.repeat(n-sc)}</span></div><div class="rank">${sc}/${n} points · Rank: ${rank}</div></div>
<div class="panel"><span class="tag px" style="color:var(--gr)">Nailed it</span>${ok.length?`<ul class="res">${ok.map(([p,i])=>`<li><b style="color:var(--gr)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span></li>`).join('')}</ul>`:'<p class="note">No points yet. Every replay makes it easier!</p>'}</div>
<div class="panel"><span class="tag px" style="color:var(--rd)">Review these</span>${no.length?`<ul class="res">${no.map(([p,i])=>`<li><b style="color:var(--rd)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br>${chips(p.b)}<button class="link" data-a="go" data-k="${i+1}">Revisit Part ${L(i)}</button></li>`).join('')}</ul>`:'<p>Nothing to review. Perfect run! 🏆</p>'}</div>
<div class="row"><button class="btn" data-a="start" data-i="${S.fi}">↻ Replay</button><button class="btn m" data-a="start" data-i="${1-S.fi}">Try “${esc(FRQ[1-S.fi].t)}” ▸</button><button class="btn o" data-a="home">Menu</button></div>`}
/* ===== Events ===== */
function openBG(k){document.getElementById('shT').textContent=BG[k].t;document.getElementById('shB').innerHTML=BG[k].s.map(x=>`<li>${esc(x)}</li>`).join('');sh.classList.add('on');sh.querySelector('[data-a=x]').focus()}
function closeBG(){sh.classList.remove('on')}
document.addEventListener('click',e=>{if(e.target==sh)return closeBG();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);
case 'home':S.k=-1;return render(1);
case 'go':return go(+b.dataset.k);
case 'bg':return openBG(b.dataset.k);
case 'x':return closeBG();
case 'nt':S.nt[j].o=1;return render();
case 'hint':{const k=S.k-1;S.p[k].h[j+'-'+b.dataset.m]=1;return render()}
case 'step':S.p[i].st++;return render();
case 'skip':S.p[i].st=99;render();return document.getElementById('ans').focus();
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render()}
case 'rev':S.p[i].ck=0;S.p[i].done=0;render();return document.getElementById('ans').focus();
case 'next':S.p[i].done=1;S.p[i].ok=earned(i);return go(i+2);
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeBG()});
render(1);
</script>
</body>
</html>
