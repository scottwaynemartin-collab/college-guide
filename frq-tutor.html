<style>

html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(rgba(34,229,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,229,255,.05) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:17px/1.55 'Chakra Petch',system-ui,sans-serif;min-height:100vh}

h1,h2,h3{margin:0}
p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer}

.score{font:10px var(--px);color:var(--yl);white-space:nowrap}
.prog{display:flex;gap:4px;margin:12px 0 4px}

.seg.v{color:var(--ink);border-color:var(--cy)}

textarea{width:100%;min-height:140px;background:#07061a;color:var(--ink);border:3px solid var(--cy);padding:12px;font:17px/1.5 'Chakra Petch',system-ui,sans-serif;resize:vertical}
textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(34,229,255,.35)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--pn2);border:2px solid var(--ln);padding:6px 10px;font-size:14px;color:var(--dim)}
.teamini{font-size:14px;color:var(--dim);margin-bottom:8px}

.ck{list-style:none;padding:0;margin:8px 0}

.ck small{display:block;color:var(--gr);font-size:12px}
.mine{white-space:pre-wrap;background:#07061a;border:2px dashed var(--ln);padding:10px;font-size:15px;color:var(--dim)}
.model{background:#102033;border:3px solid var(--cy);padding:12px}
.model .px{font-size:10px;color:var(--cy);display:block;margin-bottom:6px}
.verdict{font:12px/1.6 var(--px);padding:12px;text-align:center;margin-top:12px;border:3px solid}
.verdict.y{color:var(--gr);border-color:var(--gr);background:#0b2418}
.verdict.n{color:var(--rd);border-color:var(--rd);background:#2a0c1a}
.note{font-size:14px;color:var(--dim)}
/* done */
.big{font:clamp(24px,7vw,40px)/1.3 var(--px);color:var(--gr);text-align:center;text-shadow:3px 3px 0 #000,0 0 14px rgba(77,255,145,.6)}
.stars{text-align:center;font-size:30px;letter-spacing:4px;margin:10px 0}
.rank{text-align:center;font:11px/1.9 var(--px);color:var(--yl)}
.res{list-style:none;padding:0;margin:0}
.res li{padding:10px 0;border-top:2px dashed var(--ln)}
.res li:first-child{border-top:0}

/* sheet */
#sh{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,3,18,.8);padding:16px}
#sh.on{display:flex}
#sh .card{background:var(--pn);border:3px solid var(--mg);box-shadow:6px 6px 0 #000,0 0 30px rgba(255,63,164,.35);max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px;animation:up .2s steps(4)}
@keyframes up{from{transform:translateY(30px);opacity:0}}

@media (max-width:620px){
 body{font-size:16px}
 #app{padding:10px 10px 50px}
 .carts,.tea{grid-template-columns:1fr}

</style>

<body>
<main id="app"></main>
<div id="sh" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="card"><div class="k">📜 Need the background?</div><h3 id="shT"></h3><ol id="shB"></ol><div class="row"><button class="btn c" data-a="x">Got it ▸</button></div></div></div>
<script>
/* ===== Background pop-outs ===== */
const BG={
raj:{t:"British imperialism in India",s:["Starting in the 1600s, the British East India Company, a private trading firm, used trade deals and military force to take control of large parts of India.","After the Indian Rebellion of 1857, the British government took direct control in 1858. This period, called the British Raj, lasted until independence in 1947.","Britain ran India to benefit its own economy: India supplied raw materials like cotton, jute, and tea, and was a captive market for British factory goods.","By 1900 the British had built about 40,000 km of railway, much of it designed to move goods to ports and troops around the colony.","When Britain left in 1947, it partitioned the colony into India and Pakistan (East Pakistan later became Bangladesh), creating borders that still shape the region."]},
cashcrop:{t:"Cash crops & plantations",s:["A cash crop is grown to sell, often for export, rather than to feed the farmer's own family.","Colonial powers pushed colonies to specialize in a few crops their home factories needed, like cotton, jute (for sacks and rope), and tea.","Plantations are large estates that grow one crop for export, often with cheap or forced labor. British-owned tea estates in Assam are an example.","Depending on one or two exports leaves a region exposed to world prices it can't control."]},
famine:{t:"Famines in colonial India",s:["Several deadly famines struck British India in the late 1800s. The Great Famine of 1876–78 alone killed millions of people.","Droughts caused the crop failures, but colonial policy made them worse: grain kept being exported, and relief was limited.","Farmers who grew cash crops had little stored food. They depended on wages and market prices to buy it.","Historians point to these famines as evidence that colonial economic choices shaped life-and-death outcomes."]},
portcity:{t:"Colonial port cities",s:["Colonizers built port cities as gateways, where raw materials left the colony and manufactured goods came in.","Bombay (Mumbai), Calcutta (Kolkata), and Madras (Chennai) grew from small trading posts into major cities under British rule.","Calcutta was the capital of British India until 1911, when the capital moved to Delhi.","Many former colonies still have a primate city, one city far larger than all the others, that began as a colonial port."]},
wst:{t:"Wallerstein's world-system theory",s:["Immanuel Wallerstein divided the world economy into the core, the semi-periphery, and the periphery.","Core countries are wealthy and industrialized, and they make high-value goods.","Periphery countries supply raw materials and cheap labor, and they earn far less.","Colonialism helped build this pattern by locking colonies into shipping raw materials to the core.","The theory's big idea: countries are linked, and the core's wealth depends partly on the periphery."]},
uneven:{t:"Uneven development",s:["Development is rarely spread evenly inside a country.","Places that get early investment, such as ports, railways, and factories, attract more businesses and workers, which attracts even more investment.","Geographers call this snowball effect cumulative causation.","The result is a core region that keeps growing while peripheral regions fall behind, and the gap can last for generations."]},
scale:{t:"Scale of analysis",s:["Scale is the level at which you study something: global, national, regional, or local.","A pattern that looks clear at one scale can change or disappear at another.","A national average can hide big differences between cities and the countryside, or between regions and groups.","On the AP exam, 'limitation' questions often reward pointing out what a source's scale, time frame, or data leave out."]},
dtm:{t:"Demographic Transition Model (DTM)",s:["The DTM describes how birth and death rates change as a country develops.","Stage 1: both rates are high, so population barely grows.","Stage 2: death rates drop (better food, medicine, sanitation) but birth rates stay high, so population grows fast.","Stage 3: birth rates fall as the country urbanizes and women gain education.","Stages 4–5: both rates are low, and population levels off or even shrinks."]},
tfr:{t:"Total Fertility Rate (TFR)",s:["TFR is the average number of children a woman is expected to have in her lifetime.","A TFR of about 2.1 is replacement level, just enough for each generation to replace itself. The extra 0.1 covers children who die young.","Above 2.1, population tends to grow. Below 2.1, it eventually shrinks unless immigrants arrive.","TFR is one of the best single numbers for predicting a country's future population."]},
women:{t:"Women's education & fertility",s:["Worldwide, one of the strongest predictors of lower fertility is how many years of school girls complete.","Staying in school tends to delay marriage and first births.","Education opens paid jobs, so each extra child has a higher opportunity cost (the income a mother gives up).","Educated women usually know more about health care and family planning and have more say in family decisions."]},
urban:{t:"Urbanization & family size",s:["On farms, children can help with work, so a big family can be an economic asset.","In cities, children usually don't earn income, and housing, food, and school cost more.","Cities also offer more clinics, contraception, and paid jobs for women.","That's why fertility usually falls as a country becomes more urban."]},
pyramid:{t:"Population pyramids",s:["A population pyramid is a bar graph of a population by age and sex, with the youngest at the bottom.","A wide base means many births, which is common in Stage 2 countries.","When fertility falls, the base narrows and the shape turns more like a beehive or column.","Large age groups (cohorts) move up the pyramid over time like a bulge."]},
dependency:{t:"Dependency ratio",s:["The dependency ratio compares people who usually aren't working (children under 15 and adults 65+) with the working-age population (15–64).","A high elderly dependency ratio means fewer workers paying taxes to support each retiree's pension and health care.","Very-low-fertility countries such as Japan and Italy face rising elderly dependency ratios.","Common responses include encouraging immigration, raising the retirement age, and supporting families who want children."]}
};
/* ===== Task verbs ===== */
const VERBS={
Identify:{d:"Name it. A word or short phrase is enough, with no explaining needed.",l:["Be specific: “cotton” beats “crops.”","Answer exactly what's asked. Extra writing won't earn more.","One sentence max."]},
Describe:{d:"Paint the picture. Give the specific characteristics or pattern, with details someone could check.",l:["Use evidence: a place, a number, or a feature from the stimulus.","Say what it IS or what it LOOKS LIKE. You don't need a deep “why.”","About 1–2 sentences. Use TEA: Topic + Evidence, then a quick Analysis."]},
Explain:{d:"Tell HOW or WHY. Connect a cause to an effect so a reader sees the reasoning, not just a fact.",l:["Use linking words: “because…”, “which leads to…”, “as a result…”.","A fact alone won't score. You need the chain of reasoning.","About 2–3 sentences. Use full TEA."]}
};
/* ===== FRQs ===== */
const MAP=`<svg viewBox="0 0 340 320" role="img" aria-label="Schematic map of British India around 1900. Railway lines run from export-crop regions in the interior to the coastal ports of Karachi, Bombay, Madras, and Calcutta. Shaded regions: wheat in Punjab, cotton in the Deccan, jute in Bengal, tea in Assam. Arrows from the ports point toward Britain.">
<defs><pattern id="w" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#0a1d3a"/><rect width="1" height="1" fill="#16315c"/></pattern>

r:{m:"all",i:[["Names a present-day reason: globalization, business, jobs, studying abroad, the internet, or tourism",/global|business|trade|job|work|career|compan|corporat|universit|stud|internet|tech|touris|travel|econom|exam|school/i],["Explains how English helps (more opportunities, higher pay, communicating with the world)",/because|so |lead|allow|help|opportunit|pay|wage|income|money|communicat|compete/i]]},
mo:"T1- People in China and India are learning English because it is the global lingua franca of business. E2- Multinational companies, tech firms, and call centers hire workers who can speak English with customers and partners around the world. A3- Because English skills open these better-paying jobs, learning English can raise a person's income and help the country compete in the global economy.",b:["linguafranca","outsource"]},
{v:"Describe",q:"Describe ONE barrier to the diffusion of English throughout China.",sk:"Barriers to diffusion",

{v:"Explain",q:"Using the table, explain ONE reason for the difference in the percentage of English speakers in the Netherlands compared with the percentage in China.",sk:"Explaining a difference with data",

r:{m:"all",i:[["Uses the table: the Netherlands is 90% vs. China under 1%",/90|1 ?%|less than|under|netherlands|dutch/i],["Explains a reason: similar language, trade/globalization, closeness to the UK, media, schools, or China's huge Mandarin-speaking market",/german|similar|related|famil|trade|port|econom|global|close|near|proxim|europe|tv|television|media|film|subtit|school|educat|market|mandarin|small|large/i]]},
mo:"T1- The Netherlands has a much higher share of English speakers (90%) than China (less than 1%) partly because Dutch and English are closely related languages. E2- Both are Germanic languages in the Indo-European family, so they share many words and grammar patterns, while Mandarin uses tones and characters. A3- Because English is much easier for Dutch speakers to learn, and they hear it constantly through trade and English-language TV, a far larger percentage of Dutch people become fluent.",b:["langfam","diffusion"]},

mo:"T1- A corporation might put a call center in a country like India because labor costs are much lower there. E2- India has about 125 million English speakers, so companies can hire many workers who speak English but earn far lower wages than workers in the United States. A3- Paying lower wages for the same service cuts the company's costs, which raises its profits.",b:["outsource"]},
{v:"Explain",q:"Explain ONE limitation of using the data in the table to understand a country's level of economic development.",sk:"Data limits: language vs. development",

["What even is a 'spatial pattern'? I just see a bunch of lines.","Totally normal! A spatial pattern just means how stuff is arranged on the map. You don't need outside facts for this one, just your eyes.","Look at where the railroad lines go. What shape or pattern do they make? Name it in a few words.","Reading spatial patterns",["Geographers describe where things are and how they're arranged: clustered, spread out, in a line, or pointing toward one place.","When many lines meet at one spot, they converge. That spot is usually important, like a port or a capital.","On this map, ask: do the rails connect interior cities to EACH OTHER, or do they mostly run toward the coast?"],[["Spatial pattern","How things are arranged across space."],["Converge","Come together at one point."],["Interior","Land far from the coast."]],"The railroads are all over India.","Too vague. It doesn't say WHAT the pattern is, and 'all over' could describe any map.","It names a specific pattern (interior → coast) and points to real places on the map.","The railway lines run from the ___ of India to ___ such as ___.",["Say where the lines END: at coastal port cities.","Name one or two port cities where lines meet, like Bombay or Calcutta."]],
["How am I supposed to know what Britain wanted? I wasn't there.","You don't need to have been there! The map holds the clue: follow the crops. Open the British imperialism background if you want the story.","Britain built these railroads. Based on where they go, what was Britain trying to get out of India?","Colonies as raw-material suppliers",["During the Industrial Revolution, British factories needed huge amounts of raw materials, like cotton for cloth mills.","Colonies like India supplied those raw materials cheaply and bought back finished British goods.","Colonial infrastructure was often built to move resources OUT, from farms to ports, rather than to connect local towns."],[["Raw material","An unprocessed resource (cotton, jute, wheat) used to make products."],["Extraction","Taking resources out of a place to use elsewhere."],["Export","Goods shipped out to another country."]],"Britain wanted to make India better by building trains.","No economic goal and no map evidence. It never mentions raw materials or ports.","It names the goal (raw materials), uses map evidence (crop regions linked to ports), and connects the two.","The railways link ___ regions like ___ to ports like ___. This shows Britain wanted to ___ so that ___.",["Name the goal: Britain wanted raw materials like cotton, jute, or tea.","Show how the rails help: they carry goods from the interior to ports to be shipped to Britain."]],
["Why would a city grow just because it has a port?","Think of a port city like the busiest bus stop in town. Everything passes through it, so jobs and people pile up there. Let's break it down.","Why did cities like Bombay and Calcutta get so big while Britain ruled India? Explain the cause and the effect.","How colonial port cities grew",["Every railway on the map ends at a port, so goods and money funneled through a few cities.","Moving goods takes workers: dockworkers, clerks, bankers, merchants, and railway staff.","Jobs attract rural-to-urban migrants, and more people bring more businesses, so the city snowballs.","Calcutta was also the capital of British India until 1911, so government jobs clustered there too."],[["Rural-to-urban migration","Moving from the countryside to a city, usually for jobs."],["Break-of-bulk point","A place where goods switch transport types (train → ship)."]],"Bombay and Calcutta grew because they were big cities.","Circular reasoning: they grew because they were big? There's no cause and no process.","It walks the whole chain: colonial trade role → jobs → migration → growth.","Under British rule, ___ became the main place where goods ___. This created jobs in ___, which led to ___.",["Name what the port DID for Britain: trade hub, export point, or capital.","Show how that grew the city: jobs → people migrating in."]],
["Wait, what's a cash crop? And how could growing crops hurt farmers?","Great question! A cash crop is grown to SELL, not to eat. The trouble starts when you can't eat what you grow. Check the mini-lesson.","Britain pushed Indian farmers to grow crops for export. Pick ONE way that hurt people in the countryside, and explain how.","Cash crops vs. food crops",["Subsistence farmers grow food for their own families. Cash-crop farmers grow crops to sell.","When land switches from rice or millet to cotton or jute, families have to BUY food with their crop money.","If world prices drop or a drought hits, they can't afford food. Famines in late-1800s British India killed millions.","Many farmers also borrowed for seed and taxes, which trapped them in debt."],[["Cash crop","A crop grown to sell, often for export."],["Subsistence agriculture","Farming to feed your own family, not to sell."]],"Cash crops were bad for farmers.","It says 'bad' but not HOW. An Explain answer needs the cause-and-effect chain.","It names a specific effect (hunger and famine) and explains the chain that caused it.","Because farmers grew ___ instead of ___, they had to ___. When ___, this led to ___.",["Name a specific effect: less food, famine, debt, or depending on world prices.","Add the link: use 'because' or 'which led to' to show HOW cash crops caused it."]],
["Wallerstein? I don't remember this at all.","No worries. The name sounds scarier than the idea: rich countries make the expensive stuff, poorer ones supply the cheap stuff. Read the mini-lesson, then come back.","Use the 'core and periphery' idea to describe the relationship between Britain and India that the map shows.","World-system theory in 60 seconds",["Wallerstein said the world economy is one connected system with three tiers.","Core: rich, industrial countries that make high-value goods (colonial Britain).","Periphery: poorer places that supply raw materials and cheap labor (colonial India).","Wealth flows toward the core, because turning raw materials into products is where the money is made."],[["Core","Wealthy, industrial, high-skill economies."],["Periphery","Poorer economies supplying raw materials and low-wage labor."],["Semi-periphery","In-between countries with some industry."]],"Wallerstein's theory says there are core and periphery countries.","It defines the theory but never applies it to Britain, India, or the map.","It labels each country AND uses the map's flow of raw materials to show the relationship.","In world-system theory, Britain was the ___ and India was the ___. India sent ___ to Britain, where ___.",["Label them: Britain = core, India = periphery.","Describe the flow: raw materials out of India, manufactured goods and profits kept in Britain."]],
["How would I know what India is like today?","You know more than you think! Mumbai is India's money capital today. Notice it's one of the old ports on the map? That's your clue.","Britain left in 1947. How do those old railways and ports still affect which parts of South Asia are richer or poorer today?","Colonial legacy & cumulative causation",["Mumbai (old Bombay) is India's financial center today, and Kolkata, Chennai, and Karachi are still major hubs.","Places that got railways, ports, and businesses early had a head start, and that advantage tends to grow.","Geographers call this cumulative causation: investment attracts more investment.","Interior rural regions with fewer old connections often lag behind. That's uneven development."],[["Uneven development","Some regions develop much faster than others."],["Cumulative causation","Growth in a place attracts more growth (a snowball)."]],"India is still affected by colonialism today.","True, but it names no specific effect and doesn't explain how the railways cause it.","It names a present-day pattern (old ports still lead) and explains why (infrastructure keeps attracting investment).","Because colonial railways led to ___, cities like ___ got a head start. Today they still ___ because ___.",["Name today's pattern: old port cities like Mumbai are still the biggest economic hubs.","Explain WHY it lasts: existing infrastructure keeps attracting businesses, jobs, and migrants."]],
["A 'limitation'? Isn't the map just... the map?","Every source has blind spots. Be a detective: what question about PEOPLE can't this map answer?","This map doesn't tell the whole story. What's ONE important thing about colonialism's effect on people that it can't show, and why does that matter?","How to write a limitation",["A limitation is something a source can't show that you'd need to fully answer a question.","Check three things: WHAT data is missing, WHEN (one year or many?), and at what SCALE.","This map shows railways and crops, but nothing about people: wages, famine deaths, literacy, or how people felt.","Always finish with WHY the gap matters: what conclusion can't you reach?"],[["Limitation","What a source can't show or prove."],["Scale","The level of analysis: local, national, global."]],"The map is too small and hard to read.","That's about the picture's quality, not its information. AP wants to know what content is missing.","It names specific missing data and explains which conclusion you can't reach without it.","The map only shows ___, not ___. Because of this, it can't tell us ___.",["Name specific missing info about people: incomes, famine deaths, or opinions.","Explain why it matters: you can't tell who was helped or harmed."]]

["I kind of forgot the DTM stages...","Easy fix: read the mini-lesson below. You only need one idea: Stage 2 = lots of births, with deaths just starting to drop.","Which country looks like Stage 2: lots of babies being born, and death rates only starting to fall?","Spotting Stage 2 in data",["Stage 2 countries have high birth rates, so look for the highest TFR (around 5 or more).","Death rates are falling, but health care is still limited, so infant mortality is fairly high.","They are usually more rural, because Stage 2 comes before major urbanization.","Stage 3+ countries show falling TFR, more urban populations, and lower infant mortality."],[["TFR","Average number of children per woman."],["Infant mortality","Babies who die before age 1, per 1,000 births."]],"Ruzhan.","Ruzhan has the LOWEST TFR (1.3). That fits Stage 4 or 5, not Stage 2.","Norvale has the highest TFR (5.4) and infant mortality and is the most rural: all Stage 2 signs.","The country most likely in Stage 2 is ___.",["Find the country with the highest TFR and the highest infant mortality."]],
["What does 'relationship' mean? Like, they're dating?","Ha, kind of! In data, a relationship means: when one number changes, does the other one change too? Compare two columns side by side.","Compare the girls-in-school column with the babies-per-woman column. When one goes up, what happens to the other? Use numbers.","Describing a relationship in data",["Positive (direct) relationship: both go up together.","Inverse (negative) relationship: one goes up while the other goes down.","Strong answers name the relationship AND quote numbers from at least two rows.","Compare the extremes (top and bottom of the range) to make the pattern obvious."],[["Inverse relationship","As one variable rises, the other falls."],["Female secondary enrollment","Share of teen girls in high-school-level education."]],"Education and fertility are related.","It doesn't say HOW they're related and uses no numbers from the table.","It names the direction (inverse) and backs it up with data from two countries.","As female secondary enrollment ___, TFR ___. For example, ___ has ___% enrollment and a TFR of ___, while ___ has ___.",["Say the direction: as enrollment goes UP, TFR goes DOWN (inverse).","Add numbers from two countries, like Norvale (22%, 5.4) and Ruzhan (97%, 1.3)."]],
["Why would going to school mean having fewer kids? That seems random.","It's not random once you picture a real girl's life. Say she's in school until 18 and wants to be a nurse. How does that change her plans?","Why do women with more education usually have fewer children? Explain ONE reason, step by step.","Why education lowers fertility",["Time: girls in school usually marry and start families later, leaving fewer childbearing years.","Money: educated women can earn wages, so each child costs more in lost income (opportunity cost).","Knowledge: education raises awareness of health care and family planning.","Power: educated women often have more say in decisions about family size."],[["Opportunity cost","What you give up when you choose something else."],["Family planning","Choosing the number and timing of children."]],"Educated women are smarter, so they have fewer kids.","Not a real mechanism. It doesn't explain WHAT changes in her life to lower fertility.","It picks one mechanism (marrying later + working) and walks through how it leads to fewer births.","When women stay in school longer, they ___. Because of this, ___, which leads to fewer children.",["Pick ONE mechanism: marrying later, working for wages, or knowing about family planning.","Finish the chain: explain how that leads to fewer children."]],
["How do cities make people have fewer kids?","Picture a family on a farm and a family in a city apartment. Who needs more kids to help out? Who pays more for each kid?","More-urban countries in the table have fewer babies. Use the numbers, then explain WHY city life leads to smaller families.","Urban life & family size",["On farms, children help with work, so kids can be an economic asset.","In cities, kids usually don't earn money, and rent, food, and school cost more, so kids become an economic cost.","Cities also have more clinics, contraception, and jobs for women.","Better health care lowers infant mortality, so parents don't need extra births to be sure some children survive."],[["Urbanization","Growth in the share of people living in cities."],["Economic asset","Something that brings in value or help."]],"Cities are crowded, so people have fewer kids.","No data from the table, and 'crowded' isn't the real reason. Explain costs, jobs, or health care.","It quotes the table AND explains the asset-to-cost shift.","___ is ___% urban with a TFR of ___, but ___ is ___% urban with a TFR of ___. In cities, children ___, so ___.",["Quote the table: compare a more-urban and a less-urban country.","Explain WHY: in cities kids cost more and don't do farm work, or health care is better."]],
["I have to picture a population pyramid? Help.","No drawing needed! Just remember: the bottom bars = babies. Fewer babies → what happens to the bottom?","Kestria's babies-per-woman dropped a lot. How will the shape of its population pyramid change? Describe it.","Reading pyramid shapes",["The bottom bars of a pyramid are the youngest people (ages 0–4).","High fertility = a wide base (a triangle shape).","When fertility drops, fewer babies are born, so the base narrows.","The many kids born earlier grow up, so the working-age middle gets wider, like a beehive."],[["Cohort","A group of people born in the same time period."],["Working-age population","People ages 15–64."]],"Kestria's pyramid will change shape.","It says the shape changes but not HOW. Say which part gets narrower or wider.","It links the data (5.8 → 3.1) to a specific shape change (narrower base, wider middle).","Kestria's TFR fell from ___ to ___, so ___. This means the ___ of its pyramid will become ___.",["Describe the shape: the base gets narrower, or the middle gets wider.","Link it to Kestria's TFR dropping from 5.8 to 3.1."]],
["Fewer kids sounds like a good thing. Why is it a problem?","Smart thinking, and it can help at first! The problem shows up 20–40 years later. Who's going to work, and who's going to retire?","Ruzhan has very few babies (1.3 per woman). Explain ONE money problem this will cause for the country.","Life below replacement level",["A TFR of 2.1 replaces each generation. Ruzhan's 1.3 is far below that.","Over time the population ages: more retirees, fewer young workers.","Fewer workers means fewer taxpayers, while pensions and health care for the elderly cost more.","Businesses may struggle to find workers, which slows the economy."],[["Replacement level","A TFR of about 2.1."],["Elderly dependency ratio","People 65+ for every 100 working-age people."]],"Ruzhan's population will go down.","That's a population change, not an economic challenge, and it doesn't explain the effect on jobs or money.","It connects low TFR → aging → a specific economic problem (labor shortages, pension costs).","Ruzhan's TFR of ___ is below ___, so its population will ___. This causes ___ because ___.",["Connect TFR to aging: 1.3 is below replacement (2.1), so the population gets older.","Name an economic challenge: labor shortages, pension and health costs, or fewer taxpayers."]],
["The table looks pretty complete to me...","It does look tidy! But one number for a whole country is an average. Think about your own state: is every place the same?","Each country gets only ONE number. What does that hide, and why is that a problem?","Why scale matters",["National data is an average for the whole country.","Inside a country, cities often have much lower fertility than rural areas.","Fertility can also differ by region, income, religion, or ethnic group.","So one national number can hide places with very high or very low fertility and lead to bad conclusions or policies."],[["Scale of analysis","The level you study: local, regional, national, global."],["Aggregate data","Data combined into one total or average."]],"The table doesn't have enough countries.","That's about sample size, not scale. The question asks what national-level data hides.","It names the hidden variation (cities vs. rural areas) and explains why that leads to wrong conclusions.","National data shows only ___, so it hides differences between ___. This matters because ___.",["Name what's hidden: differences between regions, cities vs. rural areas, or income groups.","Explain why it matters: the average can hide places with very high or very low fertility."]]

["Is this a history question or a language question?","Both! Language maps are history maps. Ask yourself: who was in charge of India before 1947, and what language did they speak?","Why do so many people in India speak English? Give ONE reason from the past and describe it.","Colonialism spreads languages",["Colonizers usually made their language the language of power: government, courts, schools, and business.","Britain ruled India for nearly 200 years, first through the East India Company, then the British Raj (1858–1947).","Educated Indians learned English to get government jobs and attend universities.","After independence, India kept English as an official language. With hundreds of languages, English works as a neutral “link” language."],[["Colonialism","One country taking political control of another place."],["Official language","The language a government uses for laws, courts, and schools."]],"India speaks English because it is a big country.","Size doesn't explain language. China is just as big and has under 1% English speakers. You need the history.","It names the history (British colonial rule), gives specific proof (government, courts, universities), and explains why English lasted after 1947.","T1- One historical reason India has many English speakers is ___. E2- For example, under British rule English was used for ___. A3- This still matters today because ___.",["Name the history: India was a British colony (the British Raj).","Show HOW: English was used in government and schools, and India kept it after 1947."]],
["“Contemporary”? What does that even mean?","Great question! Contemporary just means happening now. So skip the history and think: why would a teenager in Shanghai or Mumbai want English TODAY?","Why are people in China and India learning English right now? Explain ONE reason and how English helps them.","English and globalization",["Globalization links economies, so companies, scientists, and websites need a shared language.","English is the most widely used lingua franca for international business, science, air travel, and the internet.","In India, English skills open jobs in tech and in customer-service centers that serve the US and UK.","In China, English is a required school subject, and students who want to study abroad need it."],[["Lingua franca","A shared language used by people who speak different first languages."],["Globalization","The growing connection of the world's economies and cultures."]],"English is the best language.","That's an opinion, not a reason, and it doesn't explain what English does for people in China or India.","It names a present-day reason (global business), gives an example (jobs with multinational companies), and explains the payoff (higher income).","T1- People in China and India are learning English because ___. E2- For example, ___. A3- This helps them because ___, which leads to ___.",["Name a TODAY reason: jobs in global business, studying abroad, the internet, or travel.","Explain HOW English helps: for example, it leads to better-paying jobs with global companies."]],
["A “barrier”? Like a wall?","Kind of! A barrier to diffusion is anything that slows an idea or language as it spreads. It can be a law, a mountain, a cost, or a very different culture.","What is ONE thing that makes it hard for English to spread across China? Describe it.","Barriers to diffusion",["Diffusion is how ideas, languages, and products spread from place to place.","Barriers slow diffusion. They can be physical (distance), political (laws, censorship), economic (cost of school), or cultural (pride in your own language).","China's government promotes Mandarin and blocks many English websites.","Mandarin uses characters and tones, so it's very different from English and harder to switch between.","Unlike India, China was never a British colony (except Hong Kong), so English never became a language of government."],[["Diffusion","The spread of something from one place to others."],["Barrier to diffusion","Anything that slows or stops that spread."]],"English is hard.","Too vague. Hard for whom, and why? Name a specific barrier in China and describe how it slows English.","It names a specific barrier (government control), gives proof (the Great Firewall, Mandarin policy), and describes the effect (fewer chances to use English).","T1- One barrier to English spreading in China is ___. E2- For example, ___. A3- This slows English because ___.",["Name a barrier: government limits, the Mandarin focus, the Great Firewall, a very different language, or few teachers in rural areas.","Describe HOW it slows English: it means fewer chances to learn, hear, or use it."]],
["Why would a tiny country speak more English than a giant one?","That's exactly the puzzle! Size isn't the answer. Think about how close each language is to English, and how much English each country hears every day.","The table says 90% of Dutch people speak English but less than 1% of Chinese people do. Use those numbers and explain ONE reason why.","Why some places pick up English fast",["English and Dutch are both Germanic languages, so many words look and sound alike (water/water, house/huis).","Mandarin is a Sino-Tibetan language with tones and characters, so it's much further from English.","The Netherlands is small and depends on trade and tourism, so English is useful every day.","Dutch TV shows English-language shows with subtitles instead of dubbing, so kids hear English constantly."],[["Language family","A group of languages that came from one common ancestor."],["Germanic branch","Part of the Indo-European family: English, Dutch, German, Swedish."]],"The Netherlands is in Europe and China is in Asia.","That's just location, with no reason. It doesn't explain why being in Europe leads to more English speakers.","It quotes the table, names a reason (language similarity), and explains how it leads to more English speakers.","T1- The Netherlands has ___% English speakers but China has ___ because ___. E2- For example, ___. A3- This creates the difference because ___.",["Use the table: the Netherlands is 90%, China is less than 1%.","Explain WHY: Dutch is closely related to English, or the Netherlands depends on trade, or China's huge Mandarin market means less need for English."]],
["What's a call center? And why would a company go so far away?","A call center is the office that answers customer-service calls. Companies go far away for one big reason: money. Follow the money and you'll have your answer.","Why would a US or UK company put its customer-service phone center in a country like India? Explain ONE money reason.","Outsourcing and offshoring",["Outsourcing means a company hires another company to do part of its work. Offshoring means moving that work to another country.","Wages in India are much lower than in the US or UK.","The table shows India has 125 million English speakers: a huge pool of workers.","Time zones help too: when it's night in the US, it's daytime in India, so calls can be answered around the clock."],[["Offshoring","Moving business work to another country."],["Labor costs","How much a company pays its workers."]],"Because people in other countries need jobs.","That's about the workers, not the corporation. The question asks for an economic reason that benefits the company.","It names the economic reason (lower labor costs), uses the table (125 million English speakers in India), and explains the payoff (higher profits).","T1- A corporation would put a call center in ___ because ___. E2- For example, ___. A3- This helps the company because ___, which leads to ___.",["Name the money reason: workers there earn lower wages, so labor costs less.","Explain the payoff: lower costs mean higher profits for the company."]],
["Wait, don't rich countries speak English?","Some do, like the US and UK. But check the table: the Philippines and Nigeria have lots of English speakers too. Are they richer than China? That's your clue.","Can you tell how rich a country is just by how many people speak English? Explain ONE reason this table isn't enough.","Measuring development",["Geographers measure development with indicators like GDP per capita (income per person) and HDI (income, education, and life expectancy).","Speaking English is a cultural trait, not a measure of wealth.","The Philippines (95% English) and Nigeria (53%) both have lower incomes per person than China (under 1%).","The table also shows just one year (2018) and national averages, which hide differences inside each country."],[["GDP per capita","The value of a country's economy divided by its population."],["HDI","Human Development Index: combines income, education, and life expectancy."]],"The table doesn't show every country.","That's about how many countries are listed, not about measuring development. Explain what kind of data is missing.","It names what's missing (economic data), gives a clear example (the Philippines vs. China), and explains how it could mislead.","T1- One limitation is that the table only shows ___, not ___. E2- For example, ___. A3- This is a problem because ___.",["Say what's missing: the table measures language, not income or development (like GDP per capita or HDI).","Explain with an example: the Philippines is 95% English-speaking but less developed than China."]],
["How can a language be “negative”? It just helps people talk.","True, it helps people connect globally. But zoom in to the local scale. What happens to Grandma's language when every kid in town switches to English?","English helps the world communicate, but what's ONE way it can hurt a local place that speaks another language? Explain how.","When a lingua franca spreads",["A global lingua franca helps people trade and communicate across borders.","But when English becomes the language of school, jobs, and the internet, local languages can lose status.","Young people may stop learning their heritage language, so languages can become endangered or extinct.","Losing a language can mean losing traditions and local knowledge. That's part of cultural homogenization."],[["Language extinction","When no one speaks a language anymore."],["Cultural homogenization","When cultures around the world become more alike."]],"English is bad for other countries.","Too vague and too broad. Name a specific local impact and explain how the lingua franca causes it.","It names a specific impact (language loss), explains how it happens (young people switch to English), and why it matters (traditions and identity).","T1- One negative local impact of a global lingua franca is ___. E2- For example, when ___, ___. A3- This matters because ___.",["Name the harm: local languages and traditions can fade or die out, or non-English speakers get left behind.","Explain HOW: young people switch to English for school and jobs, so the local language stops being passed down."]]

h+=`</div><div class="row"><button class="btn o" data-a="card" data-i="${i}" data-c="2">◀ Back</button>${st.st<P.s.length?`<button class="btn c" data-a="step" data-i="${i}">Next step ▸</button>`:`<button class="btn c" data-a="card" data-i="${i}" data-c="4">Start writing ▸</button>`}</div>${st.st<P.s.length?`<button class="link" data-a="card" data-i="${i}" data-c="4">I'm ready, skip to writing</button>`:''}`}
if(c==4)h+=qline+`<div class="panel"><span class="tag px">Write it</span>${tea?`<div class="teamini">Label it: <b class="tT">T1-</b> your reason · <b class="tE">E2-</b> specific proof · <b class="tA">A3-</b> why it matters</div>`:`<div class="teamini">Identify = a short, specific answer. One phrase is enough.</div>`}
<details class="peek weak"><summary>Don't fall for this weak answer</summary><div><p class="wa">“${esc(P.wk[0])}”</p><p><b>❌ Why it misses:</b> ${esc(P.wk[1])}</p></div></details>
<textarea id="ans" data-in="ans" data-i="${i}" placeholder="${tea?'Write 2–3 sentences…':'Write a short phrase…'}" aria-label="Your answer">${esc(st.a)}</textarea>
<div class="chips"><button class="chip fr" data-a="frame" data-i="${i}">🧩 Stuck? Use a sentence frame</button>${tea?["For example, ","This is because ","which leads to ","As a result, "].map(c=>`<button class="chip" data-a="ins" data-t="${c}">+ ${c.trim()}</button>`).join(''):''}</div>
${st.w?'<p class="fix" role="alert">⚠ You still have blanks (___) to fill in. Replace each one with your own words first!</p>':''}
<div class="conf"><span>How sure are you?</span>${['😬 Not sure','🙂 Kind of','😎 Very'].map((t,k)=>`<button class="cb ${st.cf===k?'on':''}" data-a="cf" data-i="${i}" data-k="${k}" aria-pressed="${st.cf===k}">${t}</button>`).join('')}</div>
<div class="row"><button class="btn o" data-a="card" data-i="${i}" data-c="3">◀ Back</button><button class="btn" data-a="check" data-i="${i}">Check my answer ▸</button></div></div>`;
if(c==5&&st.ck){const ok=earned(i);h+=qline+`<div class="panel"><span class="tag px">Check it</span><p class="note" style="margin:0 0 6px">Your answer:</p><div class="mine">${esc(st.a)}</div>
<p style="margin-top:12px"><b>What earns the point${P.r.m=="any"?' (any ONE of these)':' (you need ALL of these)'}:</b> Tick each one your answer really does.</p>
<ul class="ck">${P.r.i.map((r,j)=>`<li><label><input type="checkbox" data-a="box" data-i="${i}" data-j="${j}" ${st.box[j]?'checked':''}><span>${esc(r[0])}${st.g[j]?'<small>Tutor spotted this; double-check it.</small>':''}${!st.box[j]&&!(P.r.m=="any"&&st.box.some(Boolean))?`<em class="fix">Fix it: ${esc(r[2])}</em>`:''}</span></label></li>`).join('')}</ul>
<p class="note">The tutor guesses from keywords. <b>You</b> make the final call, so be honest!</p>
<div class="model"><span class="px">Model answer</span>${esc(P.mo)}<p class="why"><b>✅ Why it works:</b> ${esc(P.mw)}</p></div>
<div role="status" class="verdict ${ok?'y':'n'}">${ok?YES[i%3]:'Not yet, and “not yet” is how everyone learns. Use the Fix-it tips, then revise.'}${ok&&S.cb>0?`<span class="combo">🔥 ${S.cb+1} in a row!</span>`:''}</div>${st.cf==null?'':`<p class="cal">${CAL[st.cf][ok?0:1]}</p>`}
<div class="row">${ok?'':`<button class="btn o" data-a="rev" data-i="${i}">✎ Revise</button>`}<button class="btn g" data-a="next" data-i="${i}">${i+1<n?`On to Part ${L(i+1)} ▸`:'See results ▸'}</button></div></div>`}
return h}
function bossV(){const B=S.bo;if(!B)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p>3 lightning questions on what you just learned. Quick recall now helps you remember it next week.</p><div class="row"><button class="btn m" data-a="boss">Start Boss Round ▸</button></div></div>`;
if(B.k>=B.l.length)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p class="big" style="font-size:20px">${B.r==B.l.length?'Boss defeated!':'Boss battle over!'}</p><p style="text-align:center">You got <b>${B.r}/${B.l.length}</b> on the first try.${B.r<B.l.length?' Come back tomorrow and replay. Spacing out practice is how memories stick.':''}</p></div>`;
const i=B.l[B.k],q=S.f.p[i].qc;return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round · ${B.k+1}/${B.l.length}</span>${mcqV(q,B.s,(i+B.k+1)%3,'bq','')}${B.s===0||B.s>0?`<div class="row"><button class="btn m" data-a="bn">${B.k+1<B.l.length?'Next ▸':'Finish ▸'}</button></div>`:''}</div>`}
function doneV(){const n=S.f.p.length,sc=score(),ps=S.f.p.map((p,i)=>[p,i,S.p[i]]),ok=ps.filter(x=>x[2].ok),no=ps.filter(x=>x[2].done&&!x[2].ok),un=ps.filter(x=>!x[2].done);
const rank=sc==n?"GEO LEGEND":sc>=5?"MAP MASTER":sc>=3?"RISING SCOUT":"KEEP PLAYING";
return `<div class="panel" style="text-align:center"><h2 class="big" tabindex="-1">${un.length?'Progress report':'Stage clear!'}</h2><div class="stars" aria-label="${sc} of ${n}">${'★'.repeat(sc)}<span style="opacity:.25">${'★'.repeat(n-sc)}</span></div><div class="rank">${sc}/${n} points · Rank: ${rank}</div></div>
<div class="panel"><span class="tag px" style="color:var(--gr)">Nailed it</span>${ok.length?`<ul class="res">${ok.map(([p,i])=>`<li><b style="color:var(--gr)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span></li>`).join('')}</ul>`:'<p class="note">No points yet. Every replay makes it easier!</p>'}</div>
<div class="panel"><span class="tag px" style="color:var(--rd)">Review these</span>${no.length?`<ul class="res">${no.map(([p,i])=>`<li><b style="color:var(--rd)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br>${chips(p.b)}<button class="link" data-a="go" data-k="${i+1}">Revisit Part ${L(i)}</button></li>`).join('')}</ul>`:'<p>Nothing to review so far. 🏆</p>'}</div>
${un.length?`<div class="panel"><span class="tag px" style="color:var(--yl)">Not tried yet</span><ul class="res">${un.map(([p,i])=>`<li><b style="color:var(--yl)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br><button class="link" data-a="go" data-k="${i+1}">Go to Part ${L(i)}</button></li>`).join('')}</ul></div>`:''}
${no.length?`<div class="row"><button class="btn c" data-a="retry">↻ Retry what I missed ▸</button></div>`:''}${bossV()}<div class="row"><button class="btn" data-a="start" data-i="${S.fi}">↻ Replay</button><button class="btn m" data-a="start" data-i="${(S.fi+1)%FRQ.length}">Try “${esc(FRQ[(S.fi+1)%FRQ.length].t)}” ▸</button><button class="btn o" data-a="home">Menu</button></div>`}
/* ===== Events ===== */
let opener;function openBG(k){opener=document.activeElement;app.setAttribute('aria-hidden','true');document.getElementById('shT').textContent=BG[k].t;document.getElementById('shB').innerHTML=BG[k].s.map(x=>`<li>${esc(x)}</li>`).join('');sh.classList.add('on');sh.querySelector('[data-a=x]').focus()}
function closeBG(){if(!sh.classList.contains('on'))return;sh.classList.remove('on');app.removeAttribute('aria-hidden');opener&&opener.focus()}
document.addEventListener('click',e=>{if(e.target==sh)return closeBG();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);
case 'home':S.k=-1;return render(1);
case 'go':return go(+b.dataset.k);
case 'bg':return openBG(b.dataset.k);
case 'x':return closeBG();
case 'nt':S.nt[j].o=1;return render();
case 'hint':{const k=S.k-1;S.p[k].h[j+'-'+b.dataset.m]=1;return render()}
case 'step':S.p[i].st++;return render();
case 'card':S.p[i].c=+b.dataset.c;return render(1);
case 'mcq':S.p[i].q=+b.dataset.o;return render();
case 'boss':{const f=S.p.map((x,k)=>k),miss=f.filter(k=>!S.p[k].ok),rest=f.filter(k=>S.p[k].ok);S.bo={l:miss.concat(rest).slice(0,3),k:0,s:null,r:0};return render()}
case 'bq':{const B=S.bo;if(B.s==null&&+b.dataset.o==0)B.r++;if(B.s!==0)B.s=+b.dataset.o;return render()}
case 'bn':S.bo.k++;S.bo.s=null;return render();
case 'frame':{const t=document.getElementById('ans'),f=S.f.p[i].fr;t.value=t.value.trim()?t.value.trim()+'\n'+f:f;S.p[i].a=t.value;t.focus();const c=t.value.indexOf('___',t.value.length-f.length);if(c>=0)t.setSelectionRange(c,c+3);return}
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.includes('___')){st.w=1;render();return document.getElementById('ans').focus()}st.w=0;if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.c=5;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render(1)}
case 'rev':S.p[i].ck=0;S.p[i].done=0;S.p[i].c=4;render(1);return document.getElementById('ans').focus();
case 'next':{const w=S.p[i].done;S.p[i].done=1;S.p[i].ok=earned(i);if(!w)S.cb=S.p[i].ok?S.cb+1:0;return go(i+2)}
case 'cf':S.p[i].cf=+b.dataset.k;return render();
case 'retry':{const m=S.p.findIndex(x=>x.done&&!x.ok);S.p[m].c=4;S.p[m].ck=0;S.p[m].done=0;return go(m+1)}
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeBG();else if(e.key=='Tab'&&sh.classList.contains('on')){e.preventDefault();sh.querySelector('[data-a=x]').focus()}});
render(1);
</script>
</body>
</html>
