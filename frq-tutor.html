r:{m:"all",i:[["Names a colonial function: export/trade hub, rail terminus, or administrative center",/trade|export|import|admin|capital|govern|terminal|termin|hub|ship|gateway/i,"Name what the port DID for Britain: trade hub, export point, or capital."],["Explains growth through jobs, investment, or migration",/job|work|employ|migra|invest|moved|move to|people came|population/i,"Show how that grew the city: jobs → people migrating in."]]},
mo:"T1- Colonial rule made Bombay and Calcutta grow because they became the gateways between India and Britain. E2- The rail lines ended there, so these cities handled the exports leaving India and the British goods arriving, which concentrated jobs in shipping, warehouses, banking, and government. A3- Those jobs pulled in rural migrants, and more people brought more businesses, so they became some of South Asia's largest cities.",
b:["portcity"],
th:"Why would a city grow just because it has a port?",
co:"Think of a port city like the busiest bus stop in town. Everything passes through it, so jobs and people pile up there. Let's break it down.",
kq:"Why did cities like Bombay and Calcutta get so big while Britain ruled India? Explain the cause and the effect.",
ml:["How colonial port cities grew",["Every railway on the map ends at a port, so goods and money funneled through a few cities.","Moving goods takes workers: dockworkers, clerks, bankers, merchants, and railway staff.","Jobs attract rural-to-urban migrants, and more people bring more businesses, so the city snowballs.","Calcutta was also the capital of British India until 1911, so government jobs clustered there too."],[["Rural-to-urban migration","Moving from the countryside to a city, usually for jobs."],["Break-of-bulk point","A place where goods switch transport types (train → ship)."]]],
wk:["Bombay and Calcutta grew because they were big cities.","Circular reasoning: they grew because they were big? There's no cause and no process."],
mw:"It walks the whole chain: colonial trade role → jobs → migration → growth.",
fr:"Under British rule, ___ became the main place where goods ___. This created jobs in ___, which led to ___.",
qc:["What usually pulls rural migrants into a growing port city?",["Jobs in trade and shipping","Cheaper farmland","Cooler weather"],0,"Jobs are the main pull factor, and ports created lots of them."]},
{v:"Explain",
q:"Explain ONE way the colonial emphasis on export cash crops affected rural communities in South Asia.",
sk:"Effects of cash-crop agriculture on people",
s:[["Name the effect you'll argue: food supply, money, debt, or famine.",["What happens when farmland grows cotton instead of food?","Possible effects: less food grown, debt, dependence on world prices."]],["Name a specific crop or region from the map.",["Cotton in the Deccan, jute in Bengal, tea in Assam."]],["Explain the chain from cash crop to effect on people.",["Use “because… which led to…”.","Land growing jute or cotton couldn't feed families. When harvests failed or prices fell, farmers couldn't afford food."]]],
r:{m:"all",i:[["Names an effect: less food grown, famine, debt, poverty, or dependence on world prices",/food|famine|hunger|starv|debt|price|depend|poverty|poor/i,"Name a specific effect: less food, famine, debt, or depending on world prices."],["Explains the cause-and-effect link to cash-crop farming",/because|led|lead|caus|result|instead|replac|less land|so they|so farmers/i,"Add the link: use 'because' or 'which led to' to show HOW cash crops caused it."]]},
mo:"T1- The colonial push for export cash crops made rural families more vulnerable to hunger. E2- Farmers were pressured to grow cotton and jute instead of food crops, so less land produced food and families depended on world prices they couldn't control. A3- Because of this, when prices fell or a drought hit, people couldn't afford food, and drought years turned into deadly famines.",
b:["cashcrop","famine"],
th:"Wait, what's a cash crop? And how could growing crops hurt farmers?",
co:"Great question! A cash crop is grown to SELL, not to eat. The trouble starts when you can't eat what you grow. Check the mini-lesson.",
kq:"Britain pushed Indian farmers to grow crops for export. Pick ONE way that hurt people in the countryside, and explain how.",
ml:["Cash crops vs. food crops",["Subsistence farmers grow food for their own families. Cash-crop farmers grow crops to sell.","When land switches from rice or millet to cotton or jute, families have to BUY food with their crop money.","If world prices drop or a drought hits, they can't afford food. Famines in late-1800s British India killed millions.","Many farmers also borrowed for seed and taxes, which trapped them in debt."],[["Cash crop","A crop grown to sell, often for export."],["Subsistence agriculture","Farming to feed your own family, not to sell."]]],
wk:["Cash crops were bad for farmers.","It says 'bad' but not HOW. An Explain answer needs the cause-and-effect chain."],
mw:"It names a specific effect (hunger and famine) and explains the chain that caused it.",
fr:"Because farmers grew ___ instead of ___, they had to ___. When ___, this led to ___.",
qc:["A cash crop is grown mainly to…",["sell, often for export","feed the farmer's family","feed farm animals"],0,"Cash crops are for selling. Food for the family is subsistence farming."]},
{v:"Describe",
q:"Describe how the economic relationship shown on the map illustrates Wallerstein's world-system theory.",
sk:"Applying world-system theory",
s:[["Label the players. Which was core and which was periphery?",["Core = wealthy, industrial, makes high-value goods.","Britain = core; colonial India = periphery."]],["What flowed out of India, and what flowed back in?",["The map shows raw materials heading to ports.","Raw cotton went to Britain; finished cloth was sold back to India."]],["Why does that flow keep the periphery poorer?",["Who earns more: the raw-material seller or the manufacturer?","Value is added in the core, so wealth piles up there."]]],
r:{m:"all",i:[["Places Britain as the core and India as the periphery",/core|peripher/i,"Label them: Britain = core, India = periphery."],["Describes the flow: raw materials out to the core, manufactured goods or profits kept by the core",/raw|manufact|finish|textile|cloth|value|factor|profit/i,"Describe the flow: raw materials out of India, manufactured goods and profits kept in Britain."]]},
mo:"T1- In world-system theory, Britain was the core and India the periphery. E2- The map shows India sending low-value raw materials like cotton and jute to ports for export to Britain. A3- Britain turned those materials into manufactured goods and kept the higher profits and industrial jobs, which is how the core grows wealthy from the periphery.",
b:["wst"],
th:"Wallerstein? I don't remember this at all.",
co:"No worries. The name sounds scarier than the idea: rich countries make the expensive stuff, poorer ones supply the cheap stuff. Read the mini-lesson, then come back.",
kq:"Use the 'core and periphery' idea to describe the relationship between Britain and India that the map shows.",
ml:["World-system theory in 60 seconds",["Wallerstein said the world economy is one connected system with three tiers.","Core: rich, industrial countries that make high-value goods (colonial Britain).","Periphery: poorer places that supply raw materials and cheap labor (colonial India).","Wealth flows toward the core, because turning raw materials into products is where the money is made."],[["Core","Wealthy, industrial, high-skill economies."],["Periphery","Poorer economies supplying raw materials and low-wage labor."],["Semi-periphery","In-between countries with some industry."]]],
wk:["Wallerstein's theory says there are core and periphery countries.","It defines the theory but never applies it to Britain, India, or the map."],
mw:"It labels each country AND uses the map's flow of raw materials to show the relationship.",
fr:"In world-system theory, Britain was the ___ and India was the ___. India sent ___ to Britain, where ___.",
qc:["In world-system theory, colonial India was part of the…",["periphery","core","semi-periphery"],0,"The periphery supplies raw materials; the core (Britain) made the high-value goods."]},
{v:"Explain",
q:"Explain ONE way the colonial transportation network continues to affect patterns of economic development in South Asia today.",
sk:"Colonial legacy and uneven development",
s:[["What part of the old pattern still shows up today?",["Where are South Asia's biggest economic hubs now?","Mumbai, Kolkata, Chennai, Karachi: the old ports."]],["Name a city or region that is still ahead, or still behind.",["Mumbai is India's financial capital.","Some interior regions without major colonial rail links remain less developed."]],["WHY does old infrastructure keep mattering?",["Infrastructure attracts investment, which attracts more infrastructure: a cycle.","That cycle (cumulative causation) creates uneven development within a country."]]],
r:{m:"all",i:[["Names a present-day pattern: old ports remain top economic hubs, or coast/interior development is uneven",/mumbai|kolkata|chennai|karachi|bombay|calcutta|madras|coast|port|uneven|interior|hub/i,"Name today's pattern: old port cities like Mumbai are still the biggest economic hubs."],["Explains why: existing infrastructure keeps attracting investment, industry, and migrants",/infrastructure|invest|attract|industr|business|cumulative|cycle|head start/i,"Explain WHY it lasts: existing infrastructure keeps attracting businesses, jobs, and migrants."]]},
mo:"T1- The colonial transportation network still concentrates development in the old port cities. E2- Because colonial railways tied the economy to a few ports, cities like Mumbai and Kolkata got a head start in infrastructure, industry, and finance. A3- That infrastructure keeps attracting new businesses and migrants (cumulative causation), so development is still uneven, with many interior rural regions lagging behind.",
b:["uneven","portcity"],
th:"How would I know what India is like today?",
co:"You know more than you think! Mumbai is India's money capital today. Notice it's one of the old ports on the map? That's your clue.",
kq:"Britain left in 1947. How do those old railways and ports still affect which parts of South Asia are richer or poorer today?",
ml:["Colonial legacy & cumulative causation",["Mumbai (old Bombay) is India's financial center today, and Kolkata, Chennai, and Karachi are still major hubs.","Places that got railways, ports, and businesses early had a head start, and that advantage tends to grow.","Geographers call this cumulative causation: investment attracts more investment.","Interior rural regions with fewer old connections often lag behind. That's uneven development."],[["Uneven development","Some regions develop much faster than others."],["Cumulative causation","Growth in a place attracts more growth (a snowball)."]]],
wk:["India is still affected by colonialism today.","True, but it names no specific effect and doesn't explain how the railways cause it."],
mw:"It names a present-day pattern (old ports still lead) and explains why (infrastructure keeps attracting investment).",
fr:"Because colonial railways led to ___, cities like ___ got a head start. Today they still ___ because ___.",
qc:["Cumulative causation means…",["places that grow early attract even more growth","all regions grow at the same speed","growth always moves to rural areas"],0,"It's a snowball: investment attracts more investment."]},
{v:"Explain",
q:"Explain ONE limitation of using this map to understand how colonialism affected people in South Asia.",
sk:"Finding a source's limitations",
s:[["What CAN'T this map tell you?",["It shows things (rails, crops), not people.","Ask: who benefited? Who was harmed? How many?"]],["Name a specific missing piece of information.",["Population, wages, famine deaths, people's experiences, cultural change.","It also shows a single moment (c. 1900), not change over time."]],["Why does that gap matter for drawing conclusions?",["Without it, you can't measure the impact on people.","Railways may have helped some Indians travel and trade too, and the map can't show who gained."]]],
r:{m:"all",i:[["States a specific limit (no data on people, incomes, deaths, or experiences; a single time period; one scale)",/people|population|wage|income|death|famine|experience|opinion|culture|time|year|scale|only show|doesn.t show|does not show|not show/i,"Name specific missing info about people: incomes, famine deaths, or opinions."],["Explains why that prevents fully understanding colonialism's effects",/because|so |can.t|cannot|impact|effect|benefit|harm|measure/i,"Explain why it matters: you can't tell who was helped or harmed."]]},
mo:"T1- One limitation is that the map shows infrastructure, not people. E2- It has no data on incomes, famine deaths, literacy, or how Indians experienced colonial rule. A3- Because of that, it can't show who actually benefited or was harmed by the railways, so by itself it can't measure colonialism's human impact.",
b:["scale"],
th:"A 'limitation'? Isn't the map just... the map?",
co:"Every source has blind spots. Be a detective: what question about PEOPLE can't this map answer?",
kq:"This map doesn't tell the whole story. What's ONE important thing about colonialism's effect on people that it can't show, and why does that matter?",
ml:["How to write a limitation",["A limitation is something a source can't show that you'd need to fully answer a question.","Check three things: WHAT data is missing, WHEN (one year or many?), and at what SCALE.","This map shows railways and crops, but nothing about people: wages, famine deaths, literacy, or how people felt.","Always finish with WHY the gap matters: what conclusion can't you reach?"],[["Limitation","What a source can't show or prove."],["Scale","The level of analysis: local, national, global."]]],
wk:["The map is too small and hard to read.","That's about the picture's quality, not its information. AP wants to know what content is missing."],
mw:"It names specific missing data and explains which conclusion you can't reach without it.",
fr:"The map only shows ___, not ___. Because of this, it can't tell us ___.",
qc:["Which is a real LIMITATION of this map?",["It shows no data about people's lives","It has a legend","It shows railways"],0,"A limitation is information the source is missing, like data about people."]}
]});
addBG({
vonthunen:{t:"The von Thünen model",s:["Johann Heinrich von Thünen was a German landowner who published The Isolated State in 1826 to explain why farms near a city grow different things than farms far away.","He imagined one market city on a flat plain with the same soil and climate everywhere, no rivers or roads, and farmers hauling goods by wagon.","His rings, from the center out: market gardening and dairy, forest (for firewood and lumber), grains and field crops, then livestock ranching.","The big idea: the farther you are from the market, the more it costs to get your product there, so land use changes with distance.","Real places never match the rings exactly, but the logic of distance and transport cost still shows up everywhere."]},
bidrent:{t:"Bid-rent & transport cost",s:["Bid-rent is the most a user is willing to pay for land at a given distance from the market.","Land near the city is expensive because many people want it; land far away is cheap.","A farmer whose product is perishable (milk, lettuce) or bulky (timber) saves the most money by being close, so they can outbid others for near-city land.","A rancher's cattle can walk or ride to market cheaply, so the rancher can't outbid anyone near the city and ends up on cheap distant land.","Put together, those bidding wars create the rings."]},
foodchain:{t:"Global food supply chains",s:["A commodity chain is every step a product takes from the farm to your plate: growing, processing, shipping, selling.","Refrigerated trucks and containers (the “cold chain”) keep food fresh for thousands of miles, so perishables no longer have to be grown nearby.","Interstate highways, container ships, and air freight make long-distance shipping cheap and fast.","That's why a U.S. grocery store sells Chilean grapes in January and Mexican tomatoes year-round.","Large agribusiness companies often own several steps of the chain, which is called vertical integration."]},
greenrev:{t:"The Green Revolution",s:["Starting in the 1940s–1960s, scientists like Norman Borlaug bred high-yield varieties of wheat and rice.","Those seeds only produce big harvests with lots of chemical fertilizer, pesticides, and irrigation water.","Mexico, India, and the Philippines sharply raised their food output, and famine deaths dropped.","Costs: polluted water, drained aquifers, lost crop diversity, and debt for poor farmers who couldn't afford the inputs.","Sub-Saharan Africa benefited least, partly because its main crops and dry climates didn't fit the new seeds."]},
agenviro:{t:"Farming's environmental costs",s:["Fertilizer runoff carries nitrogen and phosphorus into rivers, feeding algae blooms that create oxygen-poor “dead zones,” like the one in the Gulf of Mexico fed by the Mississippi River.","Pumping groundwater for irrigation faster than rain refills it depletes aquifers, such as the Ogallala Aquifer under the U.S. Great Plains.","Irrigating in dry climates leaves salt behind as water evaporates (salinization), which can ruin soil.","Plowing and bare fields speed up soil erosion; the 1930s Dust Bowl is the classic example.","Clearing forest for cattle pasture and soybeans drives deforestation in the Amazon."]},
intensext:{t:"Intensive vs. extensive, commercial vs. subsistence",s:["Intensive agriculture puts lots of labor or money into a small piece of land: dairy farms, vegetable farms, rice paddies.","Extensive agriculture uses a lot of land with little labor per acre: cattle ranching, shifting cultivation, nomadic herding.","Commercial farmers grow crops to sell; subsistence farmers grow food mainly to feed their own families.","Most farms in wealthy countries are commercial; many farms in less developed countries are still subsistence or a mix.","Von Thünen's model assumes commercial farmers selling to one market, which is why it fits some places better than others."]}
});
addFRQ({k:"Practice FRQ · Diagram stimulus",
t:"Rings of Farmland",
d:"The von Thünen model, transport costs, and how modern farming bends the rings.",
u:"Unit 5",
st:"Agricultural Land Use Around Aldmere, a Fictional Market City",
intro:"This diagram shows land use around a market city in a fictional farming region. Farmers sell their products in the city of Aldmere. A river flows through the region, and a highway crosses it from west to east.",
stim:"<svg viewBox=\"0 0 340 320\" role=\"img\" aria-label=\"Diagram of a fictional farming region drawn in the style of the von Thünen model. A star marks the market city of Aldmere at the center. Four concentric rings surround it: ring 1 dairy and vegetables, ring 2 timber and forest, ring 3 grains and field crops, ring 4 cattle ranching. A river runs from the top edge through the city to the bottom edge, and rings 1 and 3 are stretched into long ovals along the river. A straight highway runs left to right through the city. Where the highway crosses ring 3 on the right sits the secondary market town of Crossford, with a small dairy and vegetable zone around it.\">\n<rect width=\"340\" height=\"320\" fill=\"#0a1d3a\"/>\n<g stroke=\"#7fe8ff\" stroke-width=\"1.2\"><circle cx=\"170\" cy=\"162\" r=\"142\" fill=\"#24304f\" stroke-width=\"1.6\"/>\n<ellipse cx=\"170\" cy=\"162\" rx=\"26\" ry=\"138\" fill=\"#ffd23f\" opacity=\".22\" stroke=\"none\"/>\n<circle cx=\"170\" cy=\"162\" r=\"104\" fill=\"#0a1d3a\"/><circle cx=\"170\" cy=\"162\" r=\"104\" fill=\"#ffd23f\" opacity=\".38\" stroke=\"none\"/>\n<circle cx=\"170\" cy=\"162\" r=\"66\" fill=\"#0a1d3a\"/><circle cx=\"170\" cy=\"162\" r=\"66\" fill=\"#3ddc84\" opacity=\".42\" stroke=\"none\"/>\n<ellipse cx=\"170\" cy=\"162\" rx=\"18\" ry=\"64\" fill=\"#ff3fa4\" opacity=\".32\" stroke=\"none\"/>\n<circle cx=\"170\" cy=\"162\" r=\"34\" fill=\"#0a1d3a\"/><circle cx=\"170\" cy=\"162\" r=\"34\" fill=\"#ff3fa4\" opacity=\".55\" stroke=\"none\"/></g>\n<path d=\"M166 0 C160 60 182 110 170 162 S176 270 172 320\" fill=\"none\" stroke=\"#22e5ff\" stroke-width=\"4\" opacity=\".9\"/>\n<line x1=\"0\" y1=\"162\" x2=\"340\" y2=\"162\" stroke=\"#fff\" stroke-width=\"3\"/><line x1=\"0\" y1=\"162\" x2=\"340\" y2=\"162\" stroke=\"#0c0920\" stroke-width=\"1\" stroke-dasharray=\"6 5\"/>\n<circle cx=\"256\" cy=\"162\" r=\"13\" fill=\"#ff3fa4\" opacity=\".6\" stroke=\"#ffb3dc\" stroke-width=\"1\"/>\n<rect x=\"252\" y=\"158\" width=\"8\" height=\"8\" fill=\"#fff\" stroke=\"#000\"/>\n<polygon points=\"170,153 172.4,158.8 178.6,159.2 173.8,163.2 175.3,169.3 170,166 164.7,169.3 166.2,163.2 161.4,159.2 167.6,158.8\" fill=\"#ffd23f\" stroke=\"#000\" stroke-width=\"1\"/>\n<g font-family=\"Chakra Petch,sans-serif\" font-size=\"9\" font-weight=\"700\" fill=\"#fff\" stroke=\"#0c0920\" stroke-width=\"3\" paint-order=\"stroke\">\n<text x=\"181\" y=\"157\">Aldmere</text><text x=\"256\" y=\"146\" text-anchor=\"middle\">Crossford</text>\n<g fill=\"#ffe7a6\" font-size=\"8.5\" text-anchor=\"end\"><text x=\"170\" y=\"182\" text-anchor=\"middle\">1 dairy</text><text x=\"170\" y=\"191\" text-anchor=\"middle\">&amp; veg.</text><text x=\"158\" y=\"201\">2 timber</text><text x=\"158\" y=\"232\">3 grains &amp;</text><text x=\"158\" y=\"242\">field crops</text><text x=\"158\" y=\"268\">4 cattle ranching</text><text x=\"256\" y=\"186\" text-anchor=\"middle\">dairy &amp; veg.</text></g>\n<g font-size=\"8\" font-style=\"italic\" fill=\"#7fb6ff\"><text x=\"176\" y=\"30\">Tarn River</text><text x=\"4\" y=\"156\" fill=\"#ffe7a6\" font-style=\"normal\">HIGHWAY</text></g></g>\n</svg><div class=\"legend\"><span><i style=\"background:#ff3fa4\"></i>1 Dairy &amp; vegetables</span><span><i style=\"background:#3ddc84\"></i>2 Timber / forest</span><span><i style=\"background:#ffd23f\"></i>3 Grains &amp; field crops</span><span><i style=\"background:#24304f;border:1px solid #7fe8ff\"></i>4 Cattle ranching</span><span><i style=\"background:#22e5ff\"></i>River</span><span><i style=\"background:#fff\"></i>Highway / town</span><span><i style=\"background:#ffd23f;border-radius:50%\"></i>Market city</span></div><p class=\"src\">Diagram created for practice. Aldmere, Crossford, and the Tarn River are fictional. Simplified and not to scale; lighter shading shows where a ring is stretched.</p>",
bg:["vonthunen","bidrent","readmap"],
nt:[["Start at the star and move outward. What's in each ring, and how does each product get to the city?","Ring 1: dairy and vegetables. Ring 2: timber. Ring 3: grains. Ring 4: cattle. Milk and lettuce spoil fast, logs are heavy, grain keeps for months, and cattle can walk. That order is the whole model."],["Look at the lighter shading along the river. Which rings got stretched, and in which direction?","Rings 1 and 3 are pulled into long ovals that follow the river north and south. The rings aren't perfect circles anymore. Something about the river makes distance matter less."],["Find Crossford on the highway. What's around it, and what does it remind you of?","A tiny pink dairy-and-vegetable zone sits around Crossford, inside the grain ring. It looks like a mini version of ring 1. A second market has started its own set of rings."]],
m:20,
p:[
{v:"Identify",
q:"Identify the agricultural activity found in ring 1, the ring closest to the market city.",
sk:"Reading the von Thünen rings",
s:[["Find the star, then look at the first ring around it. Read the label (and the legend).",["The legend lists each ring by number.","Ring 1 is pink and labeled “dairy & veg.”"]],["Say it as a farming activity, in a short phrase.",["Geographers call growing vegetables for a nearby city “market gardening.”","Try: “Ring 1 is ___ farming and ___.”"]]],
r:{m:"any",i:[["Names dairy farming or vegetable/market gardening",/dairy|milk|cow|vegetable|veg|garden|produce|fruit|truck farm|horticultur/i,"Name what the label says: dairy farming and vegetable (market) gardening."],["Describes it as perishable or intensive farming near the city",/perishable|fresh|intensive|spoil/i,"Say what kind of farming it is: fresh, perishable products like milk and vegetables."]]},
mo:"Ring 1 is dairy farming and market gardening (growing fresh vegetables) for the city.",
b:["vonthunen"],
th:"Is this a trick? It literally says it on the diagram.",
co:"Not a trick! Identify questions are the free point. Read the label, say it in a full phrase, and move on. Just don't leave it blank.",
kq:"What kind of farming happens in the ring right next to the city? Name it.",
ml:["Identify = read it off the diagram",["Identify questions ask you to name something, not explain it. One clear phrase earns the point.","On a von Thünen-style diagram, the ring touching the city holds the products that must reach the market fastest.","Here ring 1 is labeled dairy and vegetables. Geographers call vegetable farming for a nearby city market gardening (or truck farming).","Writing “milk and fresh vegetables for the city” is also fine. Specific beats vague."],[["Market gardening","Growing vegetables and fruit to sell fresh in a nearby city."],["Dairy farming","Raising cows (or goats) for milk, cheese, and butter."]]],
wk:["Farms.","Every ring is farms. Identify means name the specific activity: dairy and vegetable (market) gardening."],
mw:"It names the exact activity on the label (dairy and vegetables) and uses the geographer's term for it (market gardening).",
fr:"Ring 1, closest to the city, is used for ___ farming and ___.",
qc:["Growing fresh vegetables to sell in a nearby city is called…",["market gardening","ranching","shifting cultivation"],0,"Market gardening (truck farming) is the fresh-produce zone right outside a city."]},
{v:"Explain",
q:"Explain why the agricultural products grown closest to the market are the most perishable or the most expensive to transport.",
sk:"Bid-rent and transport cost",
s:[["Name the general rule. What changes as you get farther from the market?",["Think about the cost of hauling a product to the city.","Transport cost rises with distance, and land cost falls with distance."]],["Give proof with a specific product from ring 1 or ring 2.",["Milk and vegetables spoil in a day or two; logs are heavy and bulky.","Compare with grain (keeps for months) or cattle (can walk to market)."]],["Explain why that means those farmers END UP near the city.",["Who saves the most money by being close? Who can afford to pay the high rent?","Dairy farmers can pay (bid) more for near-city land because being close saves them the most."]]],
r:{m:"all",i:[["Names the trait: perishable (spoils fast) or heavy/bulky products like milk, vegetables, or timber",/perish|spoil|rot|fresh|milk|dairy|vegetable|bulky|heavy|weigh|timber|wood/i,"Name the trait: milk and vegetables spoil fast, and timber is heavy and bulky."],["Explains the logic: transport cost rises with distance, so these farmers gain the most from being close and can outbid others for near-city land (bid-rent)",/transport|haul|ship|carry|cost|rent|bid|afford|pay|expens|distance|far|profit/i,"Explain the money logic: transport costs rise with distance, so these farmers save the most by being close and can pay the high rent near the city."]]},
mo:"T1- Products that spoil quickly or are heavy to haul are grown closest to the market because transport cost rises with distance from the city. E2- Milk and fresh vegetables can rot within a day or two of harvest, and timber is bulky and heavy to carry by wagon, while grain keeps for months and cattle can walk to market. A3- Because dairy farmers and market gardeners lose the most money from a long trip, they gain the most from being near the city and can afford to pay (bid) more for the expensive land there, which pushes grain and ranching farther out.",
b:["bidrent","vonthunen"],
th:"Wouldn't EVERY farmer want to be close to the city? Why does it matter what they grow?",
co:"Right, everyone wants to be close! But land near the city is expensive, so the question becomes: who benefits enough to pay for it? Think about who loses the most if their product takes a week to arrive.",
kq:"Why do milk, vegetables, and timber end up right next to the city, while grain and cattle end up far away? Explain the cost logic.",
ml:["Bid-rent: who can pay for land near the city?",["Every mile a product travels costs money (fuel, wagons, drivers), so transport cost rises with distance from the market.","Land near the market is expensive because lots of people want it; land far away is cheap.","A dairy farmer whose milk spoils in a day saves the most by being close, so they can outbid a wheat farmer for near-city land.","A rancher's cattle can walk to market, so the rancher gains little from being close and settles for cheap distant land.","Those bidding wars sort farmers into rings by distance."],[["Transport cost","The money it takes to move a product to market."],["Bid-rent","The most a land user is willing to pay for land at a given distance from the market."],["Perishable","Spoils quickly."]]],
wk:["Farmers near the city grow what city people want to buy.","That doesn't explain distance. City people buy bread and beef too, but grain and cattle come from far away. You need the transport-cost and spoilage logic."],
mw:"It states the rule (transport cost rises with distance), gives specific products as proof (milk, vegetables, timber vs. grain and cattle), and explains the bidding result (perishable-product farmers outbid others for near-city land).",
fr:"T1- Products that ___ or are ___ are grown closest to the market because ___. E2- For example, ___ while ___. A3- Because these farmers ___, they can pay ___, which pushes ___.",
qc:["In von Thünen's model, which cost rises as a farm gets farther from the market?",["transport cost","land cost","labor cost"],0,"Farther away means a longer haul. Land cost actually falls with distance."]},
{v:"Describe",
q:"Using the diagram, describe how the river changes the pattern of land use compared with the classic von Thünen model.",
sk:"Modifying the model with a transport route",
s:[["State what the classic model looks like, then what's different here.",["The classic rings are perfect circles on a flat plain with no rivers.","On this diagram, look at the lighter shading along the river."]],["Point to specific evidence on the diagram.",["Rings 1 and 3 are stretched into long ovals that follow the river north and south of Aldmere.","Dairy and vegetables reach into the timber ring along the river; grain reaches into the ranching ring."]],["Say WHY a river would do that.",["Moving goods by boat or barge is cheaper and faster than by wagon.","Along the river, a farm that is far in miles is close in cost, so it can act like a near-city farm."]]],
r:{m:"all",i:[["Describes the change with diagram evidence: rings (1 and 3) are stretched/elongated into ovals along the river instead of perfect circles",/stretch|elongat|extend|oval|longer|further|farther|along the river|follow|not (perfect )?circle|no longer circ/i,"Describe what you see: rings 1 and 3 are stretched into long ovals that follow the river, so the rings aren't perfect circles."],["Links it to cheaper or faster transport along the river (boats/barges lower transport cost)",/cheap|cost|fast|quick|easy|easier|boat|barge|ship|transport|move|haul/i,"Add why: shipping by boat along the river is cheaper and faster, so farms along the river act like they're closer to the city."]]},
mo:"T1- In the classic model the rings are perfect circles, but on this diagram the river stretches the rings into long ovals. E2- The lighter shading shows ring 1 (dairy and vegetables) extending north and south of Aldmere along the Tarn River into the timber ring, and ring 3 (grains) extending along the river into the ranching ring. A3- This happens because moving goods by boat along the river is cheaper and faster than hauling them by wagon, so a farm that is far away in miles but on the river is “close” in transport cost and can grow the same products as farms next to the city.",
b:["vonthunen","bidrent"],
th:"The river is just... water. How does it change where farms are?",
co:"Think of the river as a free highway for boats. Von Thünen's farmers used slow wagons on dirt roads, so a river changes the math completely. Follow the lighter shading and you'll see it.",
kq:"The rings aren't perfect circles here. Describe how the river bends them, using what you see on the diagram, and say why.",
ml:["Rivers and the rings",["Von Thünen's original model assumed a flat plain with no rivers or roads, so every direction cost the same and the rings came out as perfect circles.","He himself noted that a navigable river would change things: boats carry heavy loads far more cheaply than wagons.","Along the river, transport cost per mile is lower, so each ring stretches outward in a long oval following the water.","On this diagram, rings 1 and 3 are stretched along the Tarn River, so dairy farms and grain fields reach farther north and south than east and west."],[["Navigable river","A river deep and calm enough for boats to carry cargo."],["Elongated","Stretched out into a long shape."]]],
wk:["The river gives the farms water, so farmers near the river can grow more crops.","That's irrigation, not the model. The question is about the SHAPE of the rings. Describe how they are stretched along the river and connect it to cheaper transport by boat."],
mw:"It contrasts the classic circles with the stretched ovals, cites the exact rings and direction from the diagram, and explains the cause (cheaper boat transport makes river farms “closer” in cost).",
fr:"T1- In the classic model the rings are ___, but here the river ___. E2- On the diagram, ring ___ and ring ___ are stretched ___ along the river. A3- This happens because transport by ___ is ___, so farms along the river ___.",
qc:["Why does a navigable river stretch the von Thünen rings outward along its course?",["Boats move goods more cheaply than wagons, so river farms are “closer” in cost","River water makes crops grow faster","Farmers like living near water"],0,"The model is about transport cost. Cheap boat transport lowers the cost of distance along the river."]},
{v:"Explain",
q:"Explain how the secondary market town of Crossford along the highway shows how modern transportation changes the von Thünen model.",
sk:"Modern transport and multiple markets",
s:[["Start with what the classic model assumes about markets and roads.",["Von Thünen assumed ONE market city and no highways.","Count the markets on this diagram: Aldmere AND Crossford."]],["Describe exactly what's around Crossford on the diagram.",["A small dairy-and-vegetable zone sits around Crossford, inside the grain ring.","It's like a miniature ring 1 that belongs to a second market."]],["Explain how the highway caused that.",["Fast trucks on the highway cut transport time and cost, letting a town on the highway grow into a market of its own.","Multiple markets mean overlapping mini-ring patterns instead of one neat set of circles."]]],
r:{m:"all",i:[["Identifies what Crossford shows: a second market with its own mini dairy/vegetable zone (ring), breaking the one-market assumption",/second|another|two market|multiple|more than one|mini|small|own ring|new ring|its own|crossford|town|one market|single market/i,"Point out Crossford: it's a SECOND market with its own tiny dairy-and-vegetable ring inside the grain ring."],["Explains the role of modern transport: highways/trucks make travel faster and cheaper, so markets and rings form in new places",/highway|road|truck|car|fast|quick|speed|cheap|lower|cost|time|access|reach|connect/i,"Explain the highway's role: trucks move goods fast and cheap, so a town on the highway can become its own market with its own rings."]]},
mo:"T1- Crossford shows that modern transportation breaks the model's assumption of a single market with one set of rings. E2- On the diagram, a small dairy-and-vegetable zone surrounds Crossford where the highway crosses ring 3, forming a miniature ring 1 inside the grain zone. A3- Because trucks on the highway move goods quickly and cheaply, Crossford grew into a second market of its own, so the region now has overlapping sets of rings instead of one neat set of circles around Aldmere.",
b:["vonthunen","foodchain"],
th:"Why does one little town matter? It's tiny compared with the city.",
co:"Size isn't the point. Count the markets: von Thünen allowed exactly one. Crossford is a second market with its own baby ring. Ask what let a second market appear there and not somewhere else.",
kq:"There's a second town on the highway with its own mini dairy zone. Explain how that shows modern roads changing the model.",
ml:["Highways, trucks, and extra markets",["Von Thünen's model assumes one market city, no roads, and wagons, so there is one set of rings.","Modern highways let trucks move goods fast and cheaply in straight lines, so places along a highway are “closer” in time than their miles suggest.","A town on the highway, like Crossford, can collect farm products and grow into a secondary market with its own small rings around it.","In the real world, cities have many suburbs and towns, each pulling the rings in its own direction, so the pattern looks more like overlapping blobs than circles."],[["Secondary market","A smaller town where farmers also sell, in addition to the main city."],["Assumption","Something a model treats as true to keep it simple."]]],
wk:["The highway makes it easier for people to drive to Aldmere.","That's about commuters, not land use. The question wants what Crossford shows about the model: a second market with its own mini ring, created because trucks on the highway cut transport cost."],
mw:"It names the broken assumption (one market), uses diagram evidence (the mini dairy zone around Crossford on the highway), and explains the cause (fast, cheap trucking creates a second market and overlapping rings).",
fr:"T1- Crossford shows that modern transportation ___ the model's assumption of ___. E2- On the diagram, ___ surrounds Crossford where ___. A3- Because trucks on the highway ___, Crossford became ___, so the region has ___.",
qc:["Which assumption of the von Thünen model does the town of Crossford break?",["There is only one market","Farmers want to make a profit","Transport cost rises with distance"],0,"Crossford is a second market. The other two assumptions still hold on this diagram."]},
{v:"Explain",
q:"Explain ONE way refrigerated trucking and global shipping have weakened the von Thünen pattern at the national or global scale.",
sk:"Scale and the global food system",
s:[["Name the technology and what it lets food do.",["Refrigerated trucks and containers keep milk, meat, and produce fresh for weeks.","Highways, container ships, and air freight make long distances cheap and fast."]],["Give a specific real-world example.",["U.S. supermarkets sell grapes from Chile in January and tomatoes from Mexico year-round.","Florida and California supply winter vegetables to the whole United States."]],["Explain how that weakens the rings, and name the scale.",["Perishables no longer have to be grown near the city that eats them, so the ring 1 logic breaks down.","At the national or global scale, the whole country (or world) acts like one giant hinterland for every city."]]],
r:{m:"all",i:[["Names the technology: refrigeration/cold chain, refrigerated trucks, container ships, air freight, highways",/refriger|fridge|cold|freez|frozen|truck|contain|ship|cargo|plane|air ?freight|jet|highway|interstate|rail/i,"Name the technology: refrigerated trucks and container ships (the cold chain) keep food fresh over long distances."],["Explains the effect with scale: perishables are grown far away (e.g., Chile, Mexico, California) so the near-city rings weaken at the national or global scale",/far|distant|thousand|mile|chile|mexico|california|florida|winter|season|year.round|no longer|don.t need|not need|anywhere|import|global|national|world|countr|scale/i,"Explain the effect and the scale: perishables like Chilean grapes or Mexican tomatoes travel thousands of miles, so at the global scale fresh food doesn't have to come from the ring next to the city."]]},
mo:"T1- Refrigeration has weakened the model because perishable products no longer have to be grown next to the city that eats them. E2- Refrigerated trucks and container ships keep produce fresh for weeks, so a U.S. supermarket in January sells grapes from Chile and tomatoes from Mexico that traveled thousands of miles. A3- At the national and global scale, this means the ring 1 logic breaks down: the dairy-and-vegetable zone is not a ring around each city but far-off regions like California, Florida, or another country, so the whole world acts as one giant hinterland.",
b:["foodchain","scale"],
th:"Wait, if the model doesn't work anymore, why are we learning it?",
co:"Because the LOGIC still works: distance costs money. What changed is how much. Refrigeration and container ships made distance cheap for perishables. Zoom out to the national or global scale and you'll see the rings dissolve.",
kq:"How do refrigerated trucks and cargo ships mess up the idea that fresh food has to come from right next to the city? Explain ONE way and say what scale you're talking about.",
ml:["The cold chain and scale",["The “cold chain” is the chain of refrigerated trucks, warehouses, and containers that keeps food cold from farm to store.","It lets perishables travel for weeks, so milk, meat, and vegetables can be grown thousands of miles from the city that eats them.","In winter, U.S. stores sell grapes from Chile and tomatoes from Mexico, and California and Florida supply fresh produce to the whole country.","At the local scale, you may still find dairy farms around a city (a “milkshed”), but at the national and global scale the rings mostly disappear.","Always say which scale you mean: local, national, or global."],[["Cold chain","Refrigerated transport and storage that keeps food fresh over long distances."],["Scale","The level of analysis: local, national, or global."],["Milkshed","The area around a city that supplies its milk."]]],
wk:["Trucks are faster than horses, so people can sell more.","That's true but doesn't explain the model. Name the technology (refrigeration), give an example (Chilean grapes in January), and explain how it breaks the near-city ring at the national or global scale."],
mw:"It names the technology (refrigerated trucks and container ships), gives a concrete example with distance (Chile, Mexico, thousands of miles), and explains the effect at a named scale (national/global rings dissolve).",
fr:"T1- ___ has weakened the model because perishable products no longer have to ___. E2- For example, ___ travel from ___ to ___. A3- At the ___ scale, this means ___.",
qc:["Which technology MOST directly lets perishable food be grown far from the city that eats it?",["refrigeration (the cold chain)","the tractor","chemical fertilizer"],0,"Refrigerated trucks and containers keep food fresh for weeks, so distance matters far less."]},
{v:"Describe",
q:"Describe ONE environmental consequence of intensive commercial agriculture in ring 1 or ring 3 of the diagram.",
sk:"Environmental effects of commercial farming",
s:[["Pick a ring and name a consequence in general words.",["Ring 1 (dairy, vegetables) and ring 3 (grains) use lots of fertilizer, pesticides, and water.","Options: polluted water, drained groundwater, salty soil, eroded soil."]],["Give specific detail about HOW it happens.",["Rain washes fertilizer and manure off fields into the river (runoff).","Pumping groundwater for irrigation faster than rain refills it drains the aquifer."]],["Describe the result on the environment.",["Nitrogen feeds algae that use up oxygen and kill fish (a dead zone).","Wells go dry, or salt builds up in the soil and ruins it."]]],
r:{m:"all",i:[["Names a specific environmental consequence: fertilizer/pesticide/manure runoff, water pollution, aquifer or groundwater depletion, soil salinization, soil erosion, or loss of soil fertility",/fertiliz|pesticid|chemical|manure|runoff|run-off|run off|nitrogen|nitrate|phosph|algae|dead zone|pollut|aquifer|groundwater|water table|deplet|salin|salt|erosion|erod|topsoil|soil|habitat|biodivers|methane|emission/i,"Name a specific consequence: fertilizer runoff polluting the river, groundwater depletion from irrigation, soil salinization, or soil erosion."],["Describes how it happens or what it does to the environment (cause → result)",/because|so |lead|caus|result|wash|flow|into the river|into river|stream|lake|kill|fish|oxygen|dry|drop|lower|ruin|degrad|harm|damage|poison|lose|loss|build/i,"Describe the chain: rain washes fertilizer into the river, feeding algae that use up oxygen and kill fish."]]},
mo:"T1- One environmental consequence of intensive farming in ring 3 is water pollution from fertilizer runoff. E2- Grain farmers spread large amounts of nitrogen fertilizer on their fields, and when it rains the extra fertilizer washes off the fields and flows into the Tarn River. A3- The nitrogen feeds huge algae blooms downstream that use up the oxygen in the water and kill fish, creating a “dead zone” like the one at the mouth of the Mississippi River in the Gulf of Mexico.",
b:["agenviro","greenrev","intensext"],
th:"Farming is natural. How can growing food hurt the environment?",
co:"Fair question! Growing a garden is gentle. Growing thousands of acres of one crop with chemical fertilizer and pumped water is a different thing. Follow the water: where does the fertilizer go when it rains?",
kq:"Pick ring 1 or ring 3. Describe ONE way the heavy farming there damages the environment, and how it happens.",
ml:["What intensive commercial farming does to land and water",["Intensive commercial farms put lots of inputs (fertilizer, pesticides, water, machinery) on each acre to get big harvests.","Fertilizer runoff: rain carries nitrogen and phosphorus into rivers and lakes, feeding algae that use up oxygen and create dead zones. The Gulf of Mexico dead zone comes from farms along the Mississippi.","Aquifer depletion: pumping groundwater for irrigation faster than rain refills it drains aquifers like the Ogallala under the Great Plains.","Salinization: in dry areas, irrigation water evaporates and leaves salt in the soil, which eventually kills crops.","Soil erosion: bare, plowed fields lose topsoil to wind and rain, as in the 1930s Dust Bowl."],[["Runoff","Rainwater that flows off fields, carrying fertilizer and soil with it."],["Aquifer","A layer of underground rock or sand that holds water."],["Salinization","Salt building up in soil from evaporating irrigation water."]]],
wk:["Farming in ring 3 uses up a lot of land.","Using land isn't an environmental consequence by itself. Name a specific harm (fertilizer runoff, aquifer depletion, salinization) and describe how it happens."],
mw:"It names a specific consequence (fertilizer runoff), describes the mechanism (rain washes nitrogen into the river), and gives the result with a real example (algae, dead zones, Gulf of Mexico).",
fr:"T1- One environmental consequence of intensive farming in ring ___ is ___. E2- Farmers there ___, and when ___, it ___. A3- This leads to ___, such as ___.",
qc:["Fertilizer washing off fields into rivers is called…",["runoff","salinization","desertification"],0,"Runoff carries nitrogen and phosphorus into waterways, where it feeds algae blooms."]},
{v:"Explain",
q:"Explain ONE limitation of using this model to understand agriculture in a less developed country today.",
sk:"Limits of a model across places",
s:[["List what the model assumes, then find one assumption that doesn't fit a poorer country.",["Assumptions: commercial farmers selling to ONE market, a flat plain, farmers who own their land and chase profit.","Which of those is least true in, say, a rural village in Ethiopia or Bolivia?"]],["Give specific detail about how farming actually works there.",["Many farmers practice subsistence agriculture, growing food to feed their families, not to sell in a city.","Others grow export crops for a port and foreign buyers, or farm steep hills and communal land."]],["Explain why that makes the model misleading.",["If farmers don't sell to a central city, distance to that city doesn't decide what they grow.","So the rings don't form, and the model would predict the wrong land use."]]],
r:{m:"all",i:[["Names an assumption that doesn't fit: subsistence (not commercial) farming, no single market / many small markets, export crops for ports, rugged terrain or varied climate, land tenure (communal land, plantations, landless farmers)",/subsist|own famil|feed (their|them|the) famil|feed themselves|not (to )?sell|no (single |one |central )?market|single market|one market|many market|multiple market|local market|export|port|plantation|terrain|mountain|hill|steep|flat|climate|soil|rain|dry|land tenure|tenure|own(s|ed|ing)? (the )?land|communal|landless|government|colonial|tradition|village/i,"Name what doesn't fit: many farmers grow food for their own families (subsistence), there's no single central market, the land isn't flat, or farmers don't own the land."],["Explains why that makes the model misleading there",/because|so |doesn.t|does not|don.t|not|can.t|cannot|differen|assum|instead|rather|wrong|mislead|fail|fit/i,"Explain the problem: if farmers aren't selling to one city, distance to that city doesn't shape what they grow, so the rings never form."]]},
mo:"T1- One limitation is that the model assumes commercial farmers who sell everything to a single market city, which does not describe many farmers in less developed countries. E2- In rural parts of countries like Ethiopia or Bolivia, many families practice subsistence agriculture, growing maize, teff, or potatoes mainly to feed themselves, often on steep hillsides or communal land rather than a flat plain with one market. A3- Because those farmers are not choosing crops based on transport cost to a central city, distance to the market does not sort their land use into rings, so the model would predict the wrong pattern and miss what actually shapes their farming, such as rainfall, terrain, and land ownership.",
b:["intensext","vonthunen","scale"],
th:"A model is a model. Why wouldn't it work everywhere?",
co:"Models are built from assumptions, and von Thünen's assumptions describe 1820s Germany: commercial farmers, one city, flat land. Ask which of those is least true for a farming village in a poorer country today. That's your limitation.",
kq:"This model was built for farmers selling to one city on flat land. What's ONE reason it might not fit farming in a poorer country today, and why does that matter?",
ml:["When the rings don't form",["A model works only where its assumptions are roughly true. Von Thünen assumed commercial farmers, one market, flat land with uniform soil, and farmers who own land and chase profit.","In many less developed countries, millions of farmers practice subsistence agriculture: they grow food to eat, so distance to a city isn't what decides their crops.","Many regions have dozens of small village markets or sell export crops (coffee, cocoa, cotton) that go to a port and overseas, not to a nearby city.","Mountains, deserts, and uneven rainfall matter more than distance, and land tenure (who owns or controls the land, including plantations and communal land) shapes what gets grown.","A good limitation names the assumption that fails AND says what conclusion goes wrong because of it."],[["Subsistence agriculture","Growing food mainly to feed your own family, not to sell."],["Land tenure","The rules about who owns or has the right to use land."],["Model","A simplified picture of reality built on assumptions."]]],
wk:["The model is old, so it doesn't work anymore.","Being old isn't a limitation by itself; the transport-cost logic still works in many places. Name a specific assumption that fails in a less developed country (subsistence farming, no single market, terrain, land tenure) and explain why that matters."],
mw:"It names the failing assumption (commercial farmers and a single market), gives specific detail (subsistence farming on hillsides and communal land in Ethiopia or Bolivia), and explains the consequence (distance doesn't sort land use, so the model predicts wrongly).",
fr:"T1- One limitation is that the model assumes ___, which does not fit many farmers in less developed countries. E2- For example, in ___, many farmers ___. A3- Because those farmers ___, the model would ___.",
qc:["Which assumption of the von Thünen model is LEAST likely to hold in a rural subsistence-farming region?",["Farmers sell all their products to one central market","Transport takes time","Farmers grow food"],0,"Subsistence farmers grow food for their own families, so there's no single market pulling their land use into rings."]}
]});
addBG({
sprawl:{t:"Suburbanization & urban sprawl",s:["Suburbanization is the movement of people and homes from the central city outward to the suburbs that ring it.","In the United States it boomed after World War II: cheap cars, the Interstate Highway System (begun 1956), and FHA and VA government-backed mortgages made a new house far from downtown easy to afford.","Urban sprawl is what that growth looks like on the ground: low-density, car-dependent subdivisions, strip malls, and parking lots spreading over former farmland.","Consequences include long commutes and traffic, air pollution, loss of farmland and habitat, the high cost of stretching roads and sewers outward, and metros sorted by income.","Edge cities (big clusters of offices and malls at highway exits) grew where the sprawl met the beltways."]},
urbanmodels:{t:"Urban land-use models",s:["Burgess concentric zone model (1920s Chicago): rings around a central business district (CBD): a zone of transition with old housing and factories, then working-class homes, then nicer homes, then a commuter zone.","Hoyt sector model (1939): land uses grow in wedges along railroads and major roads, so a high-rent sector can stretch from downtown to the edge.","Harris and Ullman multiple nuclei model (1945): a city has several centers (airport, university, industrial park, suburban business district), not just one downtown.","Galactic or peripheral model: an old core surrounded by a highway beltway with edge cities and suburbs scattered along it, the classic post-1970 American metro.","Latin American city model: a wealthy spine runs out from the CBD, while squatter settlements and disamenity zones sit on the far edge."]},
gentri:{t:"Gentrification",s:["Gentrification happens when wealthier, often younger, residents move into an older lower-income neighborhood near downtown, renovate the housing, and open new businesses.","It is pulled by cheap older homes, short commutes to downtown jobs, walkable streets, and a taste for city life among young professionals and retirees.","Upsides: higher property values, more tax money for the city, new shops, and reinvestment in buildings that had been neglected.","Downsides: rents and property taxes climb, so long-time lower-income residents, especially renters, are displaced, and the neighborhood's culture and businesses change.","Many gentrifying neighborhoods were once redlined, which is why their housing was cheap enough to attract investors in the first place."]},
zoning:{t:"Zoning & single-family-only rules",s:["Zoning is the set of local laws that say what can be built on each piece of land: homes, shops, factories, and how big or tall.","Single-family-only zoning allows just one detached house per lot, so duplexes, townhouses, and apartment buildings are illegal there.","In many U.S. cities most residential land is zoned this way, which caps how many homes can fit even when demand is high.","Because it holds down supply and keeps out cheaper housing types, critics call it exclusionary zoning; it is one reason housing is so expensive in many metros.","Minneapolis and the state of Oregon have ended single-family-only zoning so that duplexes and triplexes can be built on any residential lot."]},
smartgrowth:{t:"Smart growth & New Urbanism",s:["Smart growth is a set of planning policies that fight sprawl by making metros compact, walkable, and transit-friendly.","Tools include urban growth boundaries (Portland, Oregon has had one since 1979) and greenbelts that protect open land at the edge, transit-oriented development around stations, mixed-use zoning, and infill building on vacant or brownfield (former industrial) lots.","New Urbanism is the design movement behind many of these ideas: walkable blocks, homes close to shops and schools, front porches, and a mix of housing types, as in Seaside, Florida and Kentlands, Maryland.","Supporters say these policies cut driving and protect farmland; critics worry that limiting land for building can push housing prices up unless cities also allow more homes inside the boundary."]},
redlining:{t:"Redlining, blockbusting & white flight",s:["In the 1930s a federal agency (the HOLC) drew maps grading neighborhoods for mortgage risk; areas with Black and immigrant residents were colored red and labeled 'hazardous,' so banks refused to lend there. That is redlining.","Blockbusting: real-estate agents frightened white homeowners into selling cheap by warning that Black families were moving in, then resold the homes to Black buyers at high prices.","White flight: millions of white families left central cities for the suburbs from the 1950s to the 1970s, helped by highways and FHA loans that redlined neighborhoods could not get.","The Fair Housing Act of 1968 banned housing discrimination, but the legacy remains: disinvested neighborhoods, lower home values, and a large racial wealth gap.","Today many formerly redlined neighborhoods near downtown are the ones gentrifying."]}
});
addFRQ({k:"Practice FRQ · Data table",
t:"Brookhaven Spreads Out",
d:"Suburbanization, zoning, gentrification, and smart growth. A Unit 6 practice FRQ.",
u:"Unit 6",
st:"Brookhaven Metropolitan Area: Population, Housing, and Commuting by Zone, 1970 and 2020",
intro:"Brookhaven is an invented U.S. metropolitan area of about one million people. Like many American metros, its population has shifted outward since 1970, while a few old neighborhoods near downtown have recently become popular, and expensive, again.",
stim:"<div class=\"tbl\"><table><thead><tr><th>Zone</th><th>Population 1970</th><th>Population 2020</th><th>Median home price 2020</th><th>Percent of workers who drive alone to work</th><th>Percent of residential land zoned single-family only</th></tr></thead><tbody>\n<tr><td>Central city (inside the old core)</td><td>520,000</td><td>445,000</td><td>$395,000</td><td>55%</td><td>25%</td></tr><tr><td>Inner suburbs</td><td>310,000</td><td>325,000</td><td>$265,000</td><td>78%</td><td>62%</td></tr><tr><td>Outer suburbs / exurbs</td><td>95,000</td><td>300,000</td><td>$380,000</td><td>90%</td><td>85%</td></tr>\n<tr><td>Metro total</td><td>925,000</td><td>1,070,000</td><td>$340,000</td><td>72%</td><td>71%</td></tr></tbody></table></div><p class=\"src\">Note: The central city's population fell to 388,000 in 2000, then grew again after 2010, mostly in two renovated neighborhoods near downtown (Millside and the Canal District), where the 2020 median home price was $610,000. Brookhaven and all of its data are invented for practice. Class directions: label each part, and write Describe and Explain parts as T1- (your reason in general words), E2- (the specific proof), A3- (why it matters).</p>",
bg:["sprawl","urbanmodels","readtable"],
nt:[["Which zone grew the most from 1970 to 2020? Which one shrank?","The outer suburbs tripled, from 95,000 to 300,000. The central city LOST 75,000 people (and had dropped even lower, to 388,000, by 2000). The inner suburbs barely moved. Almost all of the metro's growth happened at the edge."],["Read the drive-alone column and the zoning column together. Do they move the same way?","Yes. Both climb as you move outward: 55% and 25% in the center, 78% and 62% in the inner suburbs, 90% and 85% at the edge. Spread-out, single-house neighborhoods and car dependence go together."],["Where are home prices highest? Does anything about that surprise you?","Two different places are expensive: the outer suburbs ($380,000) and the central city ($395,000), while the inner suburbs are cheapest ($265,000). The note explains the center: two renovated downtown districts are at $610,000. New big houses at the edge and renovated old ones in the core are two different kinds of expensive."]],
m:20,
p:[
{v:"Identify",
q:"Identify the process shown by the growth of the outer suburbs and exurbs between 1970 and 2020.",
sk:"Naming urban processes",
s:[["Look at the outer suburbs row. What happened to its population?",["It went from 95,000 in 1970 to 300,000 in 2020: it tripled.","Meanwhile the central city lost people. So where did the metro's growth go?"]],["Name the process: people and homes spreading outward from the city to its edges.",["It starts with 'sub-'.","Suburbanization, also called urban sprawl when it is low-density and car-dependent."]]],
r:{m:"any",i:[["Suburbanization or urban sprawl (also accept decentralization, exurbanization, counterurbanization, outward growth)",/suburban|sprawl|decentraliz|deconcentrat|exurban|counter.?urban|outward|spread/i,"Name the process: suburbanization (urban sprawl), the metro spreading outward into low-density outer suburbs."]]},
mo:"Suburbanization, or urban sprawl: population spreading outward from the central city into low-density outer suburbs.",
b:["sprawl","urbanmodels"],
th:"Isn't this just urbanization? More people, more city.",
co:"Close, but look at WHERE the growth is. Urbanization means people moving into cities. Here the center lost people while the far edges tripled. There's a more specific word for growth at the edge.",
kq:"The far-out suburbs tripled while downtown shrank. What's the name for that kind of growth?",
ml:["Suburbanization and sprawl",["Urbanization is the share of people living in cities going up. Suburbanization is more specific: people and homes moving from the central city outward to its edges.","When that outward growth is low-density and built around the car (big lots, strip malls, highways), geographers call it urban sprawl.","Exurbs are the farthest ring: semi-rural areas where commuters live beyond the built-up suburbs.","In Brookhaven the center lost 75,000 people while the outer suburbs gained 205,000. That outward shift is the fingerprint of suburbanization."],[["Suburbanization","Population and housing moving from the central city to the suburbs."],["Urban sprawl","Low-density, car-dependent growth spreading outward from a city."],["Exurb","A far-out, semi-rural area where city workers live."]]],
wk:["Urbanization.","Urbanization means a bigger share of people living in cities overall. This table shows the center LOSING people while the far edge triples. That specific outward movement is suburbanization (sprawl)."],
mw:"It names the specific process (suburbanization/sprawl) and ties it to what the table shows: outward, low-density growth at the edge.",
fr:"The growth of the outer suburbs from ___ to ___ shows the process of ___.",
qc:["Suburbanization is…",["people and homes moving from the central city outward to its edges","people moving from farms into the central city","a downtown gaining new skyscrapers"],0,"Suburbs ring the city, and suburbanization is growth in that ring."]},
{v:"Describe",
q:"Using the table, describe the relationship between distance from the center of Brookhaven and the percent of workers who drive alone to work.",
sk:"Reading a pattern in data",
s:[["State the pattern in general words. As you move outward, what happens to the drive-alone share?",["Read the drive-alone column top to bottom: center, inner suburbs, outer suburbs.","Farther from the center = a higher percent driving alone."]],["Quote the numbers as proof.",["55% in the central city, 78% in the inner suburbs, 90% in the outer suburbs.","That's a 35-point jump from the core to the edge."]],["Say why the pattern makes sense. What's different about the edge?",["Low-density houses spread far apart, few buses or trains, long distances to jobs and stores.","Downtown has transit, sidewalks, and jobs close by, so more people walk, bike, or ride."]]],
r:{m:"all",i:[["Uses the table's numbers (55%, 78%, 90%)",/55|78|90/,"Quote the table: 55% in the center, 78% in the inner suburbs, 90% in the outer suburbs."],["States the direction of the relationship: farther out means a higher drive-alone share (or closer in means lower)",/farther|further|outer|outward|exurb|edge|away|distance|increas|higher|rise|goes up|climb|closer|center|central|lower|decreas|less|fewer/i,"State the direction: the farther from the center, the higher the share of workers who drive alone."]]},
mo:"T1- The farther a zone is from the center of Brookhaven, the higher the percent of workers who drive alone to work. E2- In the central city only 55% drive alone, in the inner suburbs it rises to 78%, and in the outer suburbs and exurbs it reaches 90%. A3- This fits because the outer zones are low-density and built around the car: homes are far from jobs and shops and there is little bus or rail service, while the center has transit, sidewalks, and jobs close together, so more people can walk, bike, or ride.",
b:["sprawl","readtable"],
th:"Describe the relationship? Isn't that just reading numbers off the table?",
co:"Reading the numbers is step one, and you should do it. But a relationship is two things moving together. Say what happens to driving as distance goes up, then quote the proof.",
kq:"As you go from downtown out to the exurbs, what happens to the share of people who drive alone? Use the numbers.",
ml:["Density and the car",["Where homes are packed close together, jobs and shops are nearby and buses and trains fill up, so fewer people need to drive.","Where homes are spread far apart on big lots, there are too few riders for good transit and everything is too far to walk, so almost everyone drives.","Most U.S. suburbs built after 1950 were designed for cars: cul-de-sacs, wide roads, and huge parking lots.","On the AP exam, 'describe the relationship' means say how two things change together and back it up with numbers from the source."],[["Density","How many people or homes are packed into an area."],["Car-dependent","A place where you basically need a car to get anywhere."]]],
wk:["Most people in Brookhaven drive to work alone.","True, but it's one fact about the whole metro. The question asks how the drive-alone share CHANGES with distance: compare the three zones and quote their numbers."],
mw:"It states the direction (farther out = more driving alone), quotes all three numbers, and explains the pattern with density and transit.",
fr:"T1- The farther from the center, the ___ the percent of workers who drive alone. E2- The central city is ___%, the inner suburbs are ___%, and the outer suburbs are ___%. A3- This happens because ___.",
qc:["Which zone of Brookhaven has the LOWEST drive-alone share?",["The central city (55%)","The inner suburbs (78%)","The outer suburbs (90%)"],0,"Downtown has transit, sidewalks, and nearby jobs, so more people ride, walk, or bike."]},
{v:"Explain",
q:"Explain ONE cause of the growth of Brookhaven's outer suburbs shown in the table.",
sk:"Causes of suburbanization",
s:[["Name a cause in general words. What made it possible or attractive to live far from downtown?",["Think transportation, cheap land, government home loans, or families leaving the city for space, schools, or, in U.S. history, white flight.","Cars and highways are the classic answer."]],["Give specific proof or an example.",["The Interstate Highway System (begun 1956) plus widespread car ownership let workers live 20 or 30 miles from their jobs.","FHA and VA mortgages after World War II made new suburban homes cheap to buy."]],["Explain HOW the cause produced the growth in the table.",["Use 'because… so…'.","Cheap land plus highways meant bigger, newer houses at the edge, so population tripled from 95,000 to 300,000."]]],
r:{m:"all",i:[["Names a cause: cars/highways, cheaper land, government mortgage policy (FHA/VA loans), white flight, schools, more space, lower taxes or crime",/highway|interstate|freeway|road|car|automobile|driv|cheap|land|afford|mortgage|loan|fha|gi bill|veteran|white flight|racial|school|crime|space|yard|bigger|larger|new (home|house)|tax|job/i,"Name a cause: highways and cars, cheaper land at the edge, government mortgage loans, or families leaving the city for space or schools."],["Explains how that cause produced growth at the edge (made moving out possible, cheaper, or attractive)",/because|so |allow|let |made it|possible|easier|commut|attract|move|moved|moving|pull|drew|could live|able to/i,"Explain HOW: for example, highways let workers live far from downtown and still commute, so families moved outward."]]},
mo:"T1- One cause of the outer suburbs' growth is the spread of cars and highways. E2- After the Interstate Highway System began in 1956, most families owned a car, so a worker could live 20 or 30 miles from downtown on cheap land and still commute to a job in the city. A3- Because developers could build bigger, newer houses on inexpensive land at the edge and highways made the daily trip possible, families moved outward, and Brookhaven's outer suburbs tripled from 95,000 to 300,000 people while the center lost population.",
b:["sprawl","redlining"],
th:"Is the answer just 'people like suburbs'? That feels too easy.",
co:"Liking suburbs is the result, not the cause. Ask what CHANGED after 1950 that let millions of families live far from downtown: something they drive, something they borrowed money with, or something they were leaving behind.",
kq:"Why did so many people move to the far edge of Brookhaven after 1970? Explain ONE cause and how it led to that growth.",
ml:["Why America suburbanized",["Before cars, cities had to be compact so people could walk or ride streetcars to work.","After World War II, cheap cars, the Interstate Highway System (1956), and FHA and VA government-backed mortgages made it easy to buy a new house far from downtown.","Land at the edge cost less, so builders put up large, low-density subdivisions like Levittown, New York.","Many white families also left central cities as Black families moved in (white flight), and others left for newer schools, lower crime, or lower taxes.","Each of these causes pulled or pushed people outward, which is exactly what Brookhaven's outer-suburb row shows."],[["Interstate Highway System","The U.S. network of freeways begun in 1956."],["FHA loan","A government-backed mortgage that made buying a home cheap after World War II."],["White flight","White families moving from cities to suburbs, especially in the 1950s to 1970s."]]],
wk:["People wanted to live in the suburbs.","That's a wish, not a cause. What made it POSSIBLE to live far from downtown? Name something specific (highways and cars, cheap land, mortgages) and explain how it led people to move."],
mw:"It names a specific cause (cars and highways), gives dated proof (the 1956 Interstate system), and explains the chain all the way to the table's numbers.",
fr:"T1- One cause of the outer suburbs' growth is ___. E2- For example, ___. A3- This led to growth at the edge because ___, so ___.",
qc:["Which of these most directly made it possible for workers to live 25 miles from downtown?",["Cars and interstate highways","Skyscrapers downtown","Rent control laws"],0,"Highways and cars shrank commute times, so homes could spread far from jobs."]},
{v:"Explain",
q:"Explain how the zoning data in the table could contribute to high housing prices in Brookhaven.",
sk:"Zoning and housing supply",
s:[["What does 'single-family only' zoning forbid? Say it in general words.",["It means no apartments, duplexes, or townhouses on that land: only one detached house per lot.","So it limits how many homes can fit."]],["Use the table as proof.",["85% of the outer suburbs' residential land is single-family only; even the metro total is 71%.","Most of the land can hold only a few homes per acre."]],["Connect limited supply to price.",["Supply and demand: fewer homes can be built, but people keep arriving (the metro grew by 145,000), so buyers compete.","Competition for scarce homes bids prices up: $380,000 in the outer suburbs."]]],
r:{m:"all",i:[["Identifies the constraint: single-family-only zoning blocks apartments and denser housing, limiting the number of homes (supply)",/single.?family|only|limit|restrict|ban|prohibit|not allow|no apartment|apartment|duplex|townhouse|dens|supply|fewer (home|house|unit)|less housing|can.t build|cannot build/i,"Say what zoning blocks: single-family-only zoning means no apartments or townhouses, so fewer homes can be built."],["Explains the link to price: limited supply plus demand leads to competition and higher prices",/demand|supply|scarce|short|compet|bid|fewer|less|not enough|can.t|cannot|rise|rising|increas|up|higher|expensive|drive|push/i,"Explain the price link: fewer homes for the same number of buyers means competition, which pushes prices up."]]},
mo:"T1- Single-family-only zoning limits how many homes can be built, which raises prices. E2- In Brookhaven, 85% of the outer suburbs' residential land and 71% of the metro's allows only one detached house per lot, so apartments, duplexes, and townhouses that could fit many more families are illegal on most of the land. A3- Because the metro added about 145,000 people but zoning keeps the supply of homes small, buyers compete for the few houses available and bid prices up, which helps explain the $380,000 median in the outer suburbs.",
b:["zoning","sprawl"],
th:"How can a zoning rule change what a house costs?",
co:"Think of concert tickets. Same number of fans, but the venue is allowed to sell only half as many seats. What happens to the price? Zoning is the rule that sets how many 'seats' (homes) an area can hold.",
kq:"Most of Brookhaven's land allows only single houses, not apartments. How could that rule make homes more expensive?",
ml:["Zoning and the price of a home",["Zoning is the set of local rules that say what can be built on each piece of land.","Single-family-only zoning allows just one detached house per lot: no duplexes, townhouses, or apartment buildings.","That caps the number of homes an area can hold even when many people want to live there.","With supply held down and demand rising, buyers and renters compete, and prices climb. This is why economists talk about a housing shortage.","Some places, including Minneapolis and the state of Oregon, have ended single-family-only zoning so more homes can be built."],[["Zoning","Local laws about what can be built where."],["Housing supply","The number of homes available to buy or rent."],["Exclusionary zoning","Rules that keep lower-income people out of an area by allowing only expensive housing types."]]],
wk:["Rich people live in the outer suburbs, so houses cost more there.","That describes who lives there, not how ZONING works. The question is about the single-family-only percentage: explain how limiting what can be built limits supply and raises prices."],
mw:"It names the constraint (single-family-only zoning limits supply), quotes the table (85%, 71%), and walks through supply, demand, and price.",
fr:"T1- Single-family-only zoning can raise housing prices because it ___. E2- In Brookhaven, ___% of the outer suburbs' land is zoned single-family only, so ___. A3- With fewer homes and more people, ___, which pushes prices ___.",
qc:["Single-family-only zoning means…",["only one detached house is allowed per lot; no apartments or townhouses","only families with children may live there","houses must be sold to one buyer at a time"],0,"It's a rule about building types, and it caps how many homes an area can hold."]},
{v:"Explain",
q:"Explain how the recent growth and high home prices in some of Brookhaven's central-city neighborhoods could be an example of gentrification, including ONE effect on long-time residents.",
sk:"Gentrification and displacement",
s:[["Define gentrification in general words.",["Wealthier, often younger, people move into an older lower-income neighborhood near downtown and renovate it.","Property values and rents rise as a result."]],["Match the definition to the table and the note.",["The central city shrank until 2000 but is growing again, mostly in two renovated districts (Millside and the Canal District) where the median price is $610,000.","Old, cheap housing close to downtown jobs is exactly what attracts gentrifiers."]],["Explain ONE effect on long-time residents.",["Rents and property taxes climb, so lower-income residents, especially renters, can be pushed out (displacement).","Shops and culture change too, so the neighborhood may stop feeling like theirs."]]],
r:{m:"all",i:[["Describes gentrification: wealthier or younger people moving into and renovating older central neighborhoods, raising values",/gentrif|wealth|rich|affluent|higher.?income|young|professional|renovat|invest|fix|upgrad|move (in|back)|moving (in|back)|new (shop|cafe|business|restaurant)|revitaliz|redevelop/i,"Define it: wealthier people move into older, cheaper central neighborhoods and renovate them, so home values jump."],["Gives one effect on long-time residents: displacement, unaffordable rent or taxes, loss of community or culture",/displac|push|forc|move out|moved out|leave|afford|rent|tax|price out|priced out|lose|lost|cultur|community|character|evict|replac/i,"Add the effect: rising rents and property taxes can push out long-time residents (displacement)."]]},
mo:"T1- The comeback of a few central-city neighborhoods looks like gentrification: wealthier newcomers moving into older, lower-income areas near downtown. E2- Brookhaven's central city shrank from 520,000 to 388,000 by 2000, but since 2010 it has grown again mostly in the renovated Millside and Canal districts, where the median home price is $610,000, far above the inner suburbs' $265,000. A3- As investors and young professionals renovate old homes, rents and property taxes rise, so long-time lower-income residents, especially renters, can be displaced because they can no longer afford to stay in their own neighborhood.",
b:["gentri","redlining","urbanmodels"],
th:"Wait, isn't it GOOD that downtown is growing again?",
co:"It's good for some people and hard on others, and the AP exam wants you to see both. Follow the money: who can afford a $610,000 house, and what happens to the renter who was already living there?",
kq:"A few old downtown neighborhoods are suddenly hot and expensive. Explain how that fits gentrification, and name one thing it does to people who already lived there.",
