{v:"Describe",
q:"Describe ONE way the Green Revolution changed food production in a specific country, such as India or Mexico.",
sk:"Green Revolution impacts on production",
s:[["Name the change in general words. More food or less?",["Think about yield: how much grain each acre produced.","Wheat and rice yields rose sharply."]],["Give proof from ONE real country.",["India: Punjab farmers planted high-yield wheat with fertilizer and irrigation.","India's wheat harvest about doubled in under ten years."]],["Describe what that led to.",["More grain → fewer shortages and less risk of famine.","India went from relying on food aid to feeding itself."]]],
r:{m:"all",i:[["Names a change: higher yields, more food, or self-sufficiency",/yield|more (food|grain|wheat|rice|crop)|produc|output|harvest|doubl|tripl|increas|rose|grew|self.?suffic|surplus|export|irrigat|fertili|tractor|mechani|two crops|monocult/i,"Name the change: farms grew far more grain per acre (higher yields)."],["Gives proof from a real country (India, Mexico…)",/india|punjab|mexic|pakistan|philippin/i,"Add the place: for example, India's wheat harvest about doubled after Punjab farmers planted high-yield seeds."]]},
mo:"T1- The Green Revolution greatly increased how much food India's farms produced per acre. E2- Starting in the mid-1960s, farmers in the Punjab region planted high-yield wheat with chemical fertilizer and irrigation, and India's wheat harvest about doubled in less than ten years. A3- This turned India from a country that depended on U.S. wheat shipments into one that, by the late 1970s, grew enough grain to feed its own people.",
b:["u5n_greenrev"],
th:"Do I have to know exact numbers?",
co:"Nope! A number helps, but a clear change plus a real place earns the point. Pick India or Mexico and describe what happened to its harvests.",
kq:"Pick ONE country, like India or Mexico. How did the Green Revolution change the amount of food its farms grew?",
ml:["Before and after",["Mexico once imported much of its wheat; with Borlaug's seeds it grew enough for itself by the mid-1950s.","In the mid-1960s India faced droughts and relied on U.S. wheat shipments.","Punjab farmers planted the new wheat and rice with fertilizer and tube-well irrigation, and India's wheat harvest about doubled in less than a decade.","Faster-growing varieties let many farmers raise two crops a year."],[["Yield","How much crop a piece of land produces."],["Food self-sufficiency","Growing enough food to feed your own people without relying on imports."]]],
wk:["The Green Revolution made farming better in India.","“Better” is too vague. Say WHAT changed (much bigger wheat and rice harvests) and give proof, like India's wheat harvest doubling."],
mw:"It names the change (more food per acre), proves it with a real place (Punjab, India's harvest doubling), and describes the result (India could feed itself).",
fr:"T1- The Green Revolution changed food production in ___ by ___. E2- For example, ___. A3- This mattered because ___.",
qc:["Which region became India's “breadbasket” during the Green Revolution?",["Punjab","Kerala","The Himalayas"],0,"Punjab farmers adopted high-yield wheat and rice early, making it India's top grain region."]},
{v:"Explain",
q:"Explain ONE negative environmental consequence of the Green Revolution.",
sk:"Environmental costs of the Green Revolution",
s:[["Name the harm in general words. What did these farms use a LOT of?",["Think water, chemicals, and planting the same crop everywhere.","Options: depleted groundwater, salty soil, pesticide pollution, or lost crop diversity."]],["Give proof: a real place or example.",["In India's Punjab, farmers pump groundwater from tube wells to irrigate rice and wheat.","The water table there keeps dropping, so wells must go deeper."]],["Explain the cause → effect. Why does it matter?",["Thirsty crops → pumping faster than rain refills the aquifer → water runs low.","Without that water, the high yields can't last."]]],
r:{m:"all",i:[["Names a harm: groundwater depletion, salty soil, pollution, or lost crop diversity",/aquifer|groundwater|ground water|water table|water shortage|deplet|drain|salin|salt|soil|erosi|pesticid|chemical|pollut|poison|contamin|runoff|diversit|monocult|waterlog/i,"Name the harm: for example, pumping so much irrigation water that the groundwater runs low."],["Explains how Green Revolution farming causes it",/because|so |since|lead|caus|result|pump|irrigat|need|requir|spray|faster than|replac/i,"Explain the chain: high-yield crops need heavy irrigation, so farmers pump water faster than rain can refill the aquifer."]]},
mo:"T1- One negative environmental consequence of the Green Revolution is the depletion of groundwater. E2- In India's Punjab region, high-yield rice and wheat need heavy irrigation, so farmers pump water from tube wells faster than rain can refill the aquifer, and the water table has dropped year after year. A3- Because the farms depend on that water, a falling water table threatens to make the high yields impossible to keep up, putting future food production at risk.",
b:["u5n_envcost","u5n_greenrev"],
th:"Wait, wasn't the Green Revolution a good thing?",
co:"It's both! It fed millions, but the extra food came from using a lot more water and chemicals. Ask yourself: what happens when you use something up faster than nature can replace it?",
kq:"The Green Revolution grew more food, but it hurt nature too. Name ONE way, and explain how the farming caused it.",
ml:["The hidden costs of high yields",["High-yield seeds need lots of irrigation water and fertilizer to produce big harvests.","In India's Punjab, farmers pump out more groundwater than rain puts back, so the water table keeps falling.","In dry places, irrigation water evaporates and leaves salt behind (salinization), which can ruin fields.","Planting the same few varieties everywhere (monoculture) reduces crop diversity, so one disease can spread farther."],[["Aquifer","An underground layer of rock or sand that holds water."],["Monoculture","Growing just one crop over a large area."]]],
wk:["The Green Revolution was bad for the environment.","That just repeats the question. Name a specific harm, like falling groundwater, and explain how the farming caused it."],
mw:"It names a specific harm (groundwater depletion), uses a real place (Punjab), and explains the chain from thirsty crops to a falling water table.",
fr:"T1- One negative environmental consequence of the Green Revolution is ___. E2- For example, in ___, ___. A3- This happens because ___, which leads to ___.",
qc:["Pumping groundwater faster than rain can refill it causes…",["aquifer depletion","salinization","deforestation"],0,"The underground water supply shrinks, and wells have to go deeper."]},
{v:"Explain",
q:"Explain ONE reason the Green Revolution benefited large farms more than small farms.",
sk:"Who gained from the Green Revolution",
s:[["Name the reason in general words. What did the package cost?",["Seeds, fertilizer, pesticides, pumps, and tractors all cost money before the harvest.","Large farmers had more money and easier access to loans."]],["Give proof of how big and small farmers differed.",["Big landowners could use land as collateral for bank loans; small farmers often borrowed from moneylenders at high interest.","A tube well or tractor pays off on 100 acres, not on 2."]],["Explain the result.",["Big farms earned bigger profits and bought more land.","Many small farmers fell into debt, and some sold their land."]]],
r:{m:"all",i:[["Names a reason: the inputs were costly, and big farmers had more money or credit",/cost|expens|afford|money|capital|cash|price|loan|credit|borrow|debt|rich|wealth|invest|economies of scale|more land|bigger|larger/i,"Name the reason: the high-yield package (seeds, fertilizer, pumps, tractors) was expensive, and big farmers could afford it."],["Explains how that helped large farms or hurt small ones",/debt|lose|lost|sold|sell|landless|inequal|gap|profit|left behind|couldn.t|could not|can.t|cannot|unable|interest|out of business|because|so /i,"Explain the result: small farmers had to borrow, fell into debt, and some lost their land, while big farms profited."]]},
mo:"T1- The Green Revolution helped large farms more because its high-yield package was expensive, and wealthy farmers could afford it more easily. E2- In India, the new seeds only paid off with bought fertilizer, pesticides, and irrigation pumps, and large landowners could get bank loans using their land as collateral, while small farmers often borrowed from moneylenders at high interest. A3- So large farms earned bigger profits and bought more land, while many small farmers fell into debt and some sold their land, widening the gap between rich and poor farmers.",
b:["u5n_agribiz","u5n_greenrev"],
th:"Wouldn't a seed help any farmer, big or small?",
co:"In theory, yes! A seed doesn't care how big the farm is. But it came with a shopping list. Who could pay for all of it?",
kq:"Why did big farms gain more from the Green Revolution than poor farmers with small farms? Explain ONE reason.",
ml:["Why the gains weren't equal",["The high-yield package (seeds, fertilizer, pesticides, water, machines) had to be paid for before the harvest.","Large landowners could use land as collateral for cheaper bank loans; small farmers often paid moneylenders high interest.","Some small farmers fell into debt, sold their land, and became landless laborers, so rural inequality grew."],[["Collateral","Property, like land, that a borrower gives up if they can't repay a loan."],["Landless laborer","A farmworker who owns no land and works others' fields for wages."]]],
wk:["Large farms have more space to grow crops.","True of any farming. It doesn't explain what about the Green Revolution helped them: the costly inputs big farmers could afford."],
mw:"It names the reason (an expensive package), gives proof (bank loans vs. moneylenders), and explains the result (profits for big farms, debt for small ones).",
fr:"T1- The Green Revolution helped large farms more because ___. E2- For example, ___. A3- As a result, ___, while ___.",
qc:["Why did many small farmers fall into debt during the Green Revolution?",["They borrowed to buy seeds, fertilizer, and irrigation","Their governments banned the new seeds","They were forced to grow only cotton"],0,"The package cost money up front, so poorer farmers had to borrow, often at high interest."]},
{v:"Explain",
q:"Explain ONE reason the Green Revolution had less impact in sub-Saharan Africa than in South Asia.",
sk:"Uneven spread of the Green Revolution",
s:[["Name the reason in general words. What were the new seeds designed for?",["The research focused on irrigated wheat and rice.","Many African farmers grow different crops and depend on rain."]],["Give proof about sub-Saharan Africa.",["Staples like cassava, sorghum, millet, and yams got far less research attention.","Little farmland there is irrigated, and fertilizer and credit are scarce."]],["Explain WHY that kept harvests from jumping.",["Seeds not bred for your crop or rainfall can't raise your harvest.","So yields rose far less than in South Asia."]]],
r:{m:"all",i:[["Names a reason: different staples, little irrigation, high costs, or poor roads",/cassava|sorghum|millet|yam|different (crop|staple|food)|staple|irrigat|rain|drought|dry|water|cost|expens|afford|poor|povert|road|infrastruct|transport|credit|loan|soil|climat|divers|conflict|war\b|instab|govern/i,"Name a reason: the new seeds were wheat and rice, but many Africans depend on crops like cassava, sorghum, and millet."],["Explains how that limited the benefits",/because|so |since|didn.t|did not|weren.t|were not|wasn.t|couldn.t|could not|can.t|cannot|without|lack|little|few|less|lower|not (designed|bred|made)|fit|suit/i,"Explain the link: seeds bred for irrigated wheat and rice didn't fit Africa's rain-fed fields of cassava and millet, so yields stayed low."]]},
mo:"T1- The Green Revolution had less impact in sub-Saharan Africa because its high-yield seeds were bred for crops and conditions that didn't match most African farms. E2- Scientists focused on irrigated wheat and rice, but many farmers in sub-Saharan Africa grow staples like cassava, sorghum, and millet on rain-fed fields, and only a small share of the region's farmland is irrigated. A3- Since the new seeds didn't fit Africa's main crops or its dependence on rainfall, yields there rose much less than in South Asia.",
b:["u5n_subsist","u5n_greenrev"],
th:"Isn't Africa just too dry to farm?",
co:"Common idea, but most of sub-Saharan Africa isn't desert: it has savannas and rainforests. The real puzzle is the seeds. What crops were they made for, and what do African farmers grow?",
kq:"The Green Revolution boosted harvests in Asia but not much in Africa south of the Sahara. Explain ONE reason why.",
ml:["Why Africa missed most of the boom",["Early Green Revolution seeds were wheat and rice bred for irrigated land.","Much of sub-Saharan Africa relies on staples like cassava, sorghum, millet, and yams, which got far less research attention.","Most farms there are rain-fed: well under 10 percent of the region's cropland is irrigated.","Poor roads, little credit, and costly fertilizer made the package hard to get, especially for small farmers."],[["Staple crop","The main food that makes up most of what people eat."],["Rain-fed farming","Farming that depends only on rainfall, with no irrigation."]]],
wk:["Africa is a desert, so nothing grows there.","Not true: most of sub-Saharan Africa is savanna, farmland, and rainforest. Give a real reason, like seeds bred for irrigated wheat and rice instead of cassava and millet."],
mw:"It names a clear reason (seeds bred for other crops), gives proof (cassava, sorghum, millet; little irrigation), and explains why yields rose less.",
fr:"T1- The Green Revolution had less impact in sub-Saharan Africa because ___. E2- For example, ___. A3- This limited the benefits because ___.",
qc:["Which crop is a major staple in much of sub-Saharan Africa?",["Cassava","Wheat","Barley"],0,"Cassava, like sorghum, millet, and yams, wasn't a focus of the early Green Revolution, which centered on wheat and rice."]},
{v:"Explain",
q:"Explain ONE example of a sustainable farming practice and how it reduces environmental harm caused by agriculture.",
sk:"Sustainable agriculture",
s:[["Name ONE sustainable practice.",["Sustainable means farming that can keep going without wrecking the soil or water.","Options: no-till, crop rotation, terracing, organic farming, or community-supported agriculture."]],["Give proof: how does it work, and where?",["No-till: planting into last year's crop leftovers instead of plowing, common in the U.S. Midwest, Brazil, and Argentina.","Terracing: step-shaped hillside fields, like the rice terraces of the Philippines."]],["Explain the cause → effect: which harm does it reduce?",["No-till: leftover stalks cover the soil, so wind and rain carry less of it away.","Terraces slow water running downhill, so less soil washes off."]]],
r:{m:"all",i:[["Names a sustainable practice (no-till, crop rotation, terracing, organic, CSA…)",/tillage|no.?till|\btill|rotat|cover crop|terrac|contour|organic|integrated pest|\bipm|drip|agroforest|community.supported|\bcsa|local food|farmers.? market|intercrop|fallow|compost|manure/i,"Name a practice: for example, conservation tillage (no-till farming) or terracing."],["Explains how it reduces a specific harm (erosion, water use, chemicals)",/erosi|erode|wash|blow|soil|water|chemical|pesticid|fertili|nitrogen|pollut|fuel|emission|carbon|miles|distance|reduc|less|lower|protect|prevent|restor|replen/i,"Explain HOW it helps: for example, leaving crop leftovers on the field covers the soil, so less is blown or washed away."]]},
mo:"T1- One sustainable farming practice is conservation tillage, also called no-till farming. E2- Instead of plowing the whole field each year, many farmers in places like the U.S. Midwest, Brazil, and Argentina plant seeds directly into the stalks and leaves left over from last year's crop. A3- Because that leftover plant cover protects the ground from wind and rain, much less soil erodes away, which keeps fields fertile and keeps mud out of nearby rivers.",
b:["u5n_sustain","u5n_envcost"],
th:"Isn't “sustainable” just organic?",
co:"Organic is one kind, but there are lots of others! Sustainable just means the farm can keep producing without using up its soil and water. Pick the one you can explain best.",
kq:"Name ONE real way farmers can grow food while doing less damage to the environment. Explain how it helps.",
ml:["Farming that can last",["Sustainable agriculture protects soil, water, and ecosystems so farms can keep producing in the future.","Conservation tillage (no-till) leaves crop leftovers on the field instead of plowing, which cuts soil erosion.","Crop rotation with legumes like soybeans or clover adds nitrogen back to the soil naturally.","Terracing cuts steps into hillsides so rain can't carry soil downhill."],[["Conservation tillage","Planting with little or no plowing, leaving crop leftovers on the soil."],["Community-supported agriculture (CSA)","Customers pay a local farm up front for a share of its harvest."]]],
wk:["Sustainable farming helps the environment because it is eco-friendly.","That's circular: it just says sustainable is good for nature. Name ONE actual practice, like no-till or terracing, and explain HOW it reduces a specific harm."],
mw:"It names a real practice (no-till), shows where it's used (the U.S. Midwest, Brazil, Argentina), and explains the cause → effect (plant cover → less erosion).",
fr:"T1- One sustainable farming practice is ___. E2- For example, farmers in ___ ___. A3- This reduces environmental harm because ___, which leads to ___.",
qc:["How does terracing reduce environmental harm?",["It slows water running downhill, so less soil erodes","It removes salt from irrigated soil","It lets farmers skip planting seeds"],0,"Steps on a hillside hold water and soil in place."]},
{v:"Explain",
q:"Explain what a food desert is and ONE reason food deserts exist in urban or rural areas of more developed countries.",
sk:"Food deserts and food access",
s:[["Define it in general words. What's hard to find there?",["It's not about sand! It's about access.","A food desert has little affordable, healthy, fresh food nearby, like a full grocery store."]],["Give proof: a real place or cause.",["Urban: supermarket chains left low-income neighborhoods in places like Detroit or Chicago's South Side for the suburbs.","Rural: on the Navajo Nation, the nearest supermarket can be many miles away."]],["Explain WHY. Think like a grocery company.",["Supermarkets go where they expect the most profit.","Low incomes or few people → fewer sales → no store → corner stores and fast food."]]],
r:{m:"all",i:[["Defines a food desert: little access to affordable, healthy, or fresh food",/access|afford|healthy|fresh|nutriti|grocer|supermarket|fruit|vegetable/i,"Define it: an area where people can't easily get affordable, healthy food because there are few or no grocery stores nearby."],["Explains a reason: stores avoid poor or sparse areas, or residents lack cars",/profit|money|income|poor|povert|custom|demand|sales|population|dens|rural|\bfar\b|distan|mile|\bcars?\b|transit|transport|\bbus|suburb|moved|left|clos|disinvest|redlin|segregat/i,"Give a cause: for example, supermarket chains avoid low-income neighborhoods because they expect lower profits, and many residents don't have cars."]]},
mo:"T1- A food desert is an area where people have little access to affordable, healthy food because there are few or no full-service grocery stores nearby. E2- In many low-income city neighborhoods, such as parts of Detroit and Chicago's South Side, supermarket chains closed stores and opened new ones in the suburbs, where customers had more money to spend. A3- Because grocery companies locate where they expect the highest profits, residents without cars must rely on corner stores and fast food, which leads to poorer diets.",
b:["u5n_fooddesert","scale"],
th:"A food desert? So there's no food at all?",
co:"Good question! There's usually food, just not the healthy, affordable kind. Picture three gas stations and a fast-food place, but no grocery store for miles.",
kq:"What is a food desert? Then explain ONE reason some neighborhoods or towns in rich countries have no grocery store nearby.",
ml:["Food deserts in rich countries",["A food desert is an area with little access to affordable, healthy food, especially fresh fruits and vegetables.","The USDA counts an area as low-access if many residents live over 1 mile from a supermarket (10 miles in rural areas).","Supermarkets follow sales, so many left low-income city neighborhoods for the suburbs, and few open in thinly populated places.","This is a scale issue: a country can grow plenty of food and still have local pockets of food insecurity."],[["Food desert","An area with little access to affordable, healthy food."],["Food insecurity","Lacking reliable access to enough affordable, nutritious food."]]],
wk:["A food desert is a place where there is no food, like the Sahara.","That's the most common mix-up! A food desert usually has food (chips and soda at the corner store) but little affordable, healthy food. And you still need a reason it exists."],
mw:"It defines the term (little access to affordable, healthy food), gives real places (Detroit, Chicago's South Side), and explains the cause (stores follow profits).",
fr:"T1- A food desert is ___. E2- For example, in ___, ___. A3- Food deserts exist there because ___, which leads to ___.",
qc:["Which BEST describes a food desert?",["An area with little access to affordable, healthy food","A dry region where crops cannot grow","A farm region that exports most of its food"],0,"It's about access to healthy food, not climate."]}
]});
addBG({
sprawl:{t:"Suburbanization & urban sprawl",s:["Suburbanization is the movement of people and homes from the central city outward to the suburbs that ring it.","In the United States it boomed after World War II: cheap cars, the Interstate Highway System (begun 1956), and FHA and VA government-backed mortgages made a new house far from downtown easy to afford.","Urban sprawl is what that growth looks like on the ground: low-density, car-dependent subdivisions, strip malls, and parking lots spreading over former farmland.","Consequences include long commutes and traffic, air pollution, loss of farmland and habitat, the high cost of stretching roads and sewers outward, and metros sorted by income.","Edge cities (big clusters of offices and malls at highway exits) grew where the sprawl met the beltways."]},
urbanmodels:{t:"Urban land-use models",s:["Burgess concentric zone model (1920s Chicago): rings around a central business district (CBD): a zone of transition with old housing and factories, then working-class homes, then nicer homes, then a commuter zone.","Hoyt sector model (1939): land uses grow in wedges along railroads and major roads, so a high-rent sector can stretch from downtown to the edge.","Harris and Ullman multiple nuclei model (1945): a city has several centers (airport, university, industrial park, suburban business district), not just one downtown.","Galactic or peripheral model: an old core surrounded by a highway beltway with edge cities and suburbs scattered along it, the classic post-1970 American metro.","Latin American city model: a wealthy spine runs out from the CBD, squatter settlements ring the far edge, and disamenity sectors (along rivers or rail lines) cut through the city."]},
gentri:{t:"Gentrification",s:["Gentrification happens when wealthier, often younger, residents move into an older lower-income neighborhood near downtown, renovate the housing, and open new businesses.","It is pulled by cheap older homes, short commutes to downtown jobs, walkable streets, and a taste for city life among young professionals and retirees.","Upsides: higher property values, more tax money for the city, new shops, and reinvestment in buildings that had been neglected.","Downsides: rents and property taxes climb, so long-time lower-income residents, especially renters, are displaced, and the neighborhood's culture and businesses change.","Many gentrifying neighborhoods were once redlined, which is why their housing was cheap enough to attract investors in the first place."]},
zoning:{t:"Zoning & single-family-only rules",s:["Zoning is the set of local laws that say what can be built on each piece of land: homes, shops, factories, and how big or tall.","Single-family-only zoning allows just one detached house per lot, so duplexes, townhouses, and apartment buildings are illegal there.","In many U.S. cities most residential land is zoned this way, which caps how many homes can fit even when demand is high.","Because it holds down supply and keeps out cheaper housing types, critics call it exclusionary zoning; it is one reason housing is so expensive in many metros.","Minneapolis and the state of Oregon have ended single-family-only zoning so that duplexes and triplexes can be built on any residential lot."]},
smartgrowth:{t:"Smart growth & New Urbanism",s:["Smart growth is a set of planning policies that fight sprawl by making metros compact, walkable, and transit-friendly.","Tools include urban growth boundaries (Portland, Oregon has had one since 1979) and greenbelts that protect open land at the edge, transit-oriented development around stations, mixed-use zoning, and infill building on vacant or brownfield (former industrial) lots.","New Urbanism is the design movement behind many of these ideas: walkable blocks, homes close to shops and schools, front porches, and a mix of housing types, as in Seaside, Florida and Kentlands, Maryland.","Supporters say these policies cut driving and protect farmland; critics worry that limiting land for building can push housing prices up unless cities also allow more homes inside the boundary."]},
redlining:{t:"Redlining, blockbusting & white flight",s:["In the 1930s a federal agency (the HOLC) drew maps grading neighborhoods for mortgage risk; areas with Black and immigrant residents were colored red and labeled 'hazardous,' so banks refused to lend there. That is redlining.","Blockbusting: real-estate agents frightened white homeowners into selling cheap by warning that Black families were moving in, then resold the homes to Black buyers at high prices.","White flight: millions of white families left central cities for the suburbs from the 1950s to the 1970s, helped by highways and FHA loans that redlined neighborhoods could not get.","The Fair Housing Act of 1968 banned housing discrimination, but the legacy remains: disinvested neighborhoods, lower home values, and a large racial wealth gap.","Today many formerly redlined neighborhoods near downtown are the ones gentrifying."]}
});
addFRQ({k:"Practice FRQ · Data table",
t:"Brookhaven Spreads Out",
d:"Suburbanization, zoning, gentrification, and smart growth. A Unit 6 practice FRQ.",
u:"Unit 6",
fmt:"One stimulus (like Question 2)",
st:"Brookhaven Metropolitan Area: Population, Housing, and Commuting by Zone, 1970 and 2020",
intro:"Brookhaven is an invented U.S. metropolitan area of about one million people. Like many American metros, its population has shifted outward since 1970, while a few old neighborhoods near downtown have recently become popular, and expensive, again.",
stim:"<div class=\"tbl\"><table><thead><tr><th>Zone</th><th>Population 1970</th><th>Population 2020</th><th>Median home price 2020</th><th>Percent of workers who drive alone to work</th><th>Percent of residential land zoned single-family only</th></tr></thead><tbody>\n<tr><td>Central city (inside the old core)</td><td>520,000</td><td>445,000</td><td>$395,000</td><td>55%</td><td>25%</td></tr><tr><td>Inner suburbs</td><td>310,000</td><td>325,000</td><td>$265,000</td><td>78%</td><td>62%</td></tr><tr><td>Outer suburbs / exurbs</td><td>95,000</td><td>300,000</td><td>$380,000</td><td>90%</td><td>85%</td></tr>\n<tr><td>Metro total</td><td>925,000</td><td>1,070,000</td><td>$340,000</td><td>72%</td><td>71%</td></tr></tbody></table></div><p class=\"src\">Note: The central city's population fell to 388,000 in 2000, then grew again after 2010, mostly in two renovated neighborhoods near downtown (Millside and the Canal District), where the 2020 median home price was $610,000. Brookhaven and all of its data are invented for practice. Class directions: label each part, and write Describe and Explain parts as T1- (your reason in general words), E2- (the specific proof), A3- (why it matters).</p>",
bg:["sprawl","urbanmodels","readtable"],
nt:[["Which zone grew the most from 1970 to 2020? Which one shrank?","The outer suburbs tripled, from 95,000 to 300,000. The central city LOST 75,000 people (and had dropped even lower, to 388,000, by 2000). The inner suburbs barely moved. Almost all of the metro's growth happened at the edge."],["Read the drive-alone column and the zoning column together. Do they move the same way?","Yes. Both climb as you move outward: 55% and 25% in the center, 78% and 62% in the inner suburbs, 90% and 85% at the edge. Spread-out, single-house neighborhoods and car dependence go together."],["Where are home prices highest? Does anything about that surprise you?","Two different places are expensive: the outer suburbs ($380,000) and the central city ($395,000), while the inner suburbs are cheapest ($265,000). The note explains the center: two renovated downtown districts are at $610,000. New big houses at the edge and renovated old ones in the core are two different kinds of expensive."]],
m:20,
p:[
{v:"Identify",
q:"Identify the process shown by the growth of the outer suburbs and exurbs between 1970 and 2020.",
sk:"Naming urban processes",
s:[["Look at the outer suburbs row. What happened to its population?",["It went from 95,000 in 1970 to 300,000 in 2020: it tripled.","Meanwhile the central city lost people. So where did the metro's growth go?"]],["Name the process: people and homes spreading outward from the city to its edges.",["It starts with 'sub-'.","Suburbanization, also called urban sprawl when it is low-density and car-dependent."]]],
r:{m:"any",i:[["Suburbanization or urban sprawl (also accept decentralization, exurbanization, outward growth)",/suburban|sprawl|decentraliz|deconcentrat|exurban|counter.?urban|outward|spread|(mov|migrat|leav|flee|fled|relocat)\w* (out|away)|out (of|from) the (city|center|central|core|downtown)|(to|into|toward|for) (the )?(suburbs|outer|exurbs|edge)|(left|leav\w*|fled|flee\w*|abandon\w*) (the )?(city|center|central|core|downtown|urban)/i,"Name the process: suburbanization (urban sprawl), the metro spreading outward into low-density outer suburbs."]]},
mo:"Suburbanization, or urban sprawl: population spreading outward from the central city into low-density outer suburbs.",
b:["sprawl","urbanmodels"],
th:"Isn't this just urbanization? More people, more city.",
co:"Close, but look at WHERE the growth is. Urbanization means people moving into cities. Here the center lost people while the far edges tripled. There's a more specific word for growth at the edge.",
kq:"The far-out suburbs tripled while downtown shrank. What's the name for that kind of growth?",
ml:["Suburbanization and sprawl",["Urbanization is the share of people living in cities going up. Suburbanization is more specific: people and homes moving from the central city outward to its edges.","When that outward growth is low-density and built around the car (big lots, strip malls, highways), geographers call it urban sprawl.","Exurbs are the farthest ring: semi-rural areas where commuters live beyond the built-up suburbs.","In Brookhaven the center lost 75,000 people while the outer suburbs gained 205,000. That outward shift is the fingerprint of suburbanization."],[["Suburbanization","Population and housing moving from the central city to the suburbs."],["Urban sprawl","Low-density, car-dependent growth spreading outward from a city."],["Exurb","A far-out, semi-rural area where city workers live."]]],
wk:["Urbanization.","Urbanization means a bigger share of people living in cities overall. This table shows the center LOSING people while the far edge triples. That specific outward movement is suburbanization (sprawl)."],
mw:"It names the specific process (suburbanization/sprawl) and ties it to what the table shows: outward, low-density growth at the edge.",
fr:"The growth of the outer suburbs from ___ to ___ shows the process of ___.",
qc:["Suburbanization is…",["people and homes moving from the central city outward to its edges","people moving from farms into the central city","a downtown gaining new skyscrapers"],0,"Suburbs ring the city, and suburbanization is growth in that ring."]},
{v:"Describe",
q:"Using the table, describe the relationship between distance from the center of Brookhaven and the percent of workers who drive alone to work.",
sk:"Reading a pattern in data",
s:[["State the pattern in general words. As you move outward, what happens to the drive-alone share?",["Read the drive-alone column top to bottom: center, inner suburbs, outer suburbs.","Farther from the center = a higher percent driving alone."]],["Quote the numbers as proof.",["55% in the central city, 78% in the inner suburbs, 90% in the outer suburbs.","That's a 35-point jump from the core to the edge."]],["Say why the pattern makes sense. What's different about the edge?",["Low-density houses spread far apart, few buses or trains, long distances to jobs and stores.","Downtown has transit, sidewalks, and jobs close by, so more people walk, bike, or ride."]]],
r:{m:"all",i:[["Uses the table's numbers (55%, 78%, 90%)",/\b(55|78|90)\b/,"Quote the table: 55% in the center, 78% in the inner suburbs, 90% in the outer suburbs."],["States the direction of the relationship: farther out means a higher drive-alone share (or closer in means lower)",/(farther|further|outer|outward|\bout\b|away|edge|exurb|suburb|distance).{0,60}(\bhigh|\bmore\b|\bmost\b|increas|\brise|\brises|rising|go(es)? up|went up|\bup\b|greater|climb|bigger)|(\bhigh|\bmore\b|increas|\brise|\brises|rising|go(es)? up|greater|climb).{0,60}(farther|further|outer|outward|\bout\b|away|edge|exurb|distance)|(closer|center|central|downtown|core).{0,60}(\blow|\bless\b|\bleast\b|fewer|decreas|\bdrop|go(es)? down|went down|smaller)|(\blow|\bless\b|fewer|decreas|\bdrop).{0,60}(closer|center|central|downtown|core)|positive|direct relationship|proportional/i,"State the direction: the farther from the center, the higher the share of workers who drive alone."]]},
mo:"T1- The farther a zone is from the center of Brookhaven, the higher the percent of workers who drive alone to work. E2- In the central city only 55% drive alone, in the inner suburbs it rises to 78%, and in the outer suburbs and exurbs it reaches 90%. A3- This fits because the outer zones are low-density and built around the car: homes are far from jobs and shops and there is little bus or rail service, while the center has transit, sidewalks, and jobs close together, so more people can walk, bike, or ride.",
b:["sprawl","readtable"],
th:"Describe the relationship? Isn't that just reading numbers off the table?",
co:"Reading the numbers is step one, and you should do it. But a relationship is two things moving together. Say what happens to driving as distance goes up, then quote the proof.",
kq:"As you go from downtown out to the exurbs, what happens to the share of people who drive alone? Use the numbers.",
ml:["Density and the car",["Where homes are packed close together, jobs and shops are nearby and buses and trains fill up, so fewer people need to drive.","Where homes are spread far apart on big lots, there are too few riders for good transit and everything is too far to walk, so almost everyone drives.","Most U.S. suburbs built after 1950 were designed for cars: cul-de-sacs, wide roads, and huge parking lots.","On the AP exam, 'describe the relationship' means say how two things change together and back it up with numbers from the source."],[["Density","How many people or homes are packed into an area."],["Car-dependent","A place where you basically need a car to get anywhere."]]],
wk:["Most people in Brookhaven drive to work alone.","True, but it's one fact about the whole metro. The question asks how the drive-alone share CHANGES with distance: compare the three zones and quote their numbers."],
mw:"It states the direction (farther out = more driving alone), quotes all three numbers, and explains the pattern with density and transit.",
fr:"T1- The farther from the center, the ___ the percent of workers who drive alone. E2- The central city is ___%, the inner suburbs are ___%, and the outer suburbs are ___%. A3- This happens because ___.",
qc:["Which zone of Brookhaven has the LOWEST drive-alone share?",["The central city (55%)","The inner suburbs (78%)","The outer suburbs (90%)"],0,"Downtown has transit, sidewalks, and nearby jobs, so more people ride, walk, or bike."]},
{v:"Explain",
q:"Explain ONE cause of the growth of Brookhaven's outer suburbs shown in the table.",
sk:"Causes of suburbanization",
s:[["Name a cause in general words. What made it possible or attractive to live far from downtown?",["Think transportation, cheap land, government home loans, or families leaving the city for space, schools, or, in U.S. history, white flight.","Cars and highways are the classic answer."]],["Give specific proof or an example.",["The Interstate Highway System (begun 1956) plus widespread car ownership let workers live 20 or 30 miles from their jobs.","FHA and VA mortgages after World War II made new suburban homes cheap to buy."]],["Explain HOW the cause produced the growth in the table.",["Use 'because… so…'.","Cheap land plus highways meant bigger, newer houses at the edge, so population tripled from 95,000 to 300,000."]]],
r:{m:"all",i:[["Names a cause: cars/highways, cheaper land, government mortgage policy (FHA/VA loans), white flight, schools, more space, lower taxes or crime",/highway|interstate|freeway|road|car|automobile|driv|cheap|land|afford|mortgage|loan|fha|gi bill|veteran|white flight|racial|school|crime|space|yard|bigger|larger|new (home|house)|tax|job/i,"Name a cause: highways and cars, cheaper land at the edge, government mortgage loans, or families leaving the city for space or schools."],["Explains how that cause produced growth at the edge (made moving out possible, cheaper, or attractive)",/because|so |allow|let |made it|possible|easier|commut|attract|move|moved|moving|pull|drew|could live|able to/i,"Explain HOW: for example, highways let workers live far from downtown and still commute, so families moved outward."]]},
mo:"T1- One cause of the outer suburbs' growth is the spread of cars and highways. E2- After the Interstate Highway System began in 1956, most families owned a car, so a worker could live 20 or 30 miles from downtown on cheap land and still commute to a job in the city. A3- Because developers could build bigger, newer houses on inexpensive land at the edge and highways made the daily trip possible, families moved outward, and Brookhaven's outer suburbs tripled from 95,000 to 300,000 people while the center lost population.",
b:["sprawl","redlining"],
th:"Is the answer just 'people like suburbs'? That feels too easy.",
co:"Liking suburbs is the result, not the cause. Ask what CHANGED after 1950 that let millions of families live far from downtown: something they drive, something they borrowed money with, or something they were leaving behind.",
kq:"Why did so many people move to the far edge of Brookhaven after 1970? Explain ONE cause and how it led to that growth.",
ml:["Why America suburbanized",["Before cars, cities had to be compact so people could walk or ride streetcars to work.","After World War II, cheap cars, the Interstate Highway System (1956), and FHA and VA government-backed mortgages made it easy to buy a new house far from downtown.","Land at the edge cost less, so builders put up large, low-density subdivisions like Levittown, New York.","Many white families also left central cities as Black families moved in (white flight), and others left for newer schools, lower crime, or lower taxes.","Each of these causes pulled or pushed people outward, which is exactly what Brookhaven's outer-suburb row shows."],[["Interstate Highway System","The U.S. network of freeways begun in 1956."],["FHA loan","A government-backed mortgage that made buying a home cheap after World War II."],["White flight","White families moving from cities to suburbs, especially in the 1950s to 1970s."]]],
wk:["People wanted to live in the suburbs.","That's a wish, not a cause. What made it POSSIBLE to live far from downtown? Name something specific (highways and cars, cheap land, mortgages) and explain how it led people to move."],
mw:"It names a specific cause (cars and highways), gives dated proof (the 1956 Interstate system), and explains the chain all the way to the table's numbers.",
fr:"T1- One cause of the outer suburbs' growth is ___. E2- For example, ___. A3- This led to growth at the edge because ___, so ___.",
qc:["Which of these most directly made it possible for workers to live 25 miles from downtown?",["Cars and interstate highways","Skyscrapers downtown","Rent control laws"],0,"Highways and cars shrank commute times, so homes could spread far from jobs."]},
{v:"Explain",
q:"Explain how the zoning data in the table could contribute to high housing prices in Brookhaven.",
sk:"Zoning and housing supply",
s:[["What does 'single-family only' zoning forbid? Say it in general words.",["It means no apartments, duplexes, or townhouses on that land: only one detached house per lot.","So it limits how many homes can fit."]],["Use the table as proof.",["85% of the outer suburbs' residential land is single-family only; even the metro total is 71%.","Most of the land can hold only a few homes per acre."]],["Connect limited supply to price.",["Supply and demand: fewer homes can be built, but people keep arriving (the metro grew by 145,000), so buyers compete.","Competition for scarce homes bids prices up: $380,000 in the outer suburbs."]]],
r:{m:"all",i:[["Identifies the constraint: single-family-only zoning blocks apartments and denser housing, limiting the number of homes (supply)",/single.?family|only (one|houses|homes|single|detached)|one (house|home) per|limit|restrict|\bbans?\b|banned|prohibit|not allow|illegal|block|no (apartments?|duplex|townhouse)|(can.t|cannot|can not|aren.t allowed to|not allowed to|isn.t allowed to) (build|put|have|fit)|fewer (home|house|unit)|less housing|supply/i,"Say what zoning blocks: single-family-only zoning means no apartments or townhouses, so fewer homes can be built."],["Explains the link to price: limited supply plus demand leads to competition and higher prices",/demand|scarc|shortage|short supply|compet|\bbid|not enough (homes|houses|housing|supply|places)|isn.t enough|more (people|buyers|families) than|too many (people|buyers)|(price|cost|value|rent)s? (go(es)? up|went up|rise|rising|rose|increas|jump|climb|skyrocket|are higher|get higher|higher)|(rais|push|driv|increas|jack|bump)\w* (up )?(the )?(home |house |housing )?(price|cost|rent|value)|more expensive|(higher|rising) (price|cost|rent)|less affordable|unaffordable/i,"Explain the price link: fewer homes for the same number of buyers means competition, which pushes prices up."]]},
mo:"T1- Single-family-only zoning limits how many homes can be built, which raises prices. E2- In Brookhaven, 85% of the outer suburbs' residential land and 71% of the metro's allows only one detached house per lot, so apartments, duplexes, and townhouses that could fit many more families are illegal on most of the land. A3- Because the metro added about 145,000 people but zoning keeps the supply of homes small, buyers compete for the few houses available and bid prices up, which helps explain the $380,000 median in the outer suburbs.",
b:["zoning","sprawl"],
th:"How can a zoning rule change what a house costs?",
co:"Think of concert tickets. Same number of fans, but the venue is allowed to sell only half as many seats. What happens to the price? Zoning is the rule that sets how many 'seats' (homes) an area can hold.",
kq:"Most of Brookhaven's land allows only single houses, not apartments. How could that rule make homes more expensive?",
ml:["Zoning and the price of a home",["Zoning is the set of local rules that say what can be built on each piece of land.","Single-family-only zoning allows just one detached house per lot: no duplexes, townhouses, or apartment buildings.","That caps the number of homes an area can hold even when many people want to live there.","With supply held down and demand rising, buyers and renters compete, and prices climb. This is why economists talk about a housing shortage.","Some places, including Minneapolis and the state of Oregon, have ended single-family-only zoning so more homes can be built."],[["Zoning","Local laws about what can be built where."],["Housing supply","The number of homes available to buy or rent."],["Exclusionary zoning","Rules that keep lower-income people out of an area by allowing only expensive housing types."]]],
wk:["Rich people live in the outer suburbs, so houses cost more there.","That describes who lives there, not how ZONING works. The question is about the single-family-only percentage: explain how limiting what can be built limits supply and raises prices."],
mw:"It names the constraint (single-family-only zoning limits supply), quotes the table (85%, 71%), and walks through supply, demand, and price.",
fr:"T1- Single-family-only zoning can raise housing prices because it ___. E2- In Brookhaven, ___% of the outer suburbs' land is zoned single-family only, so ___. A3- With fewer homes and more people, ___, which pushes prices ___.",
qc:["Single-family-only zoning means…",["only one detached house is allowed per lot; no apartments or townhouses","only families with children may live there","houses must be sold to one buyer at a time"],0,"It's a rule about building types, and it caps how many homes an area can hold."]},
{v:"Explain",
q:"Explain how the recent growth and high home prices in some of Brookhaven's central-city neighborhoods could be an example of gentrification, including ONE effect on long-time residents.",
sk:"Gentrification and displacement",
s:[["Define gentrification in general words.",["Wealthier, often younger, people move into an older lower-income neighborhood near downtown and renovate it.","Property values and rents rise as a result."]],["Match the definition to the table and the note.",["The central city shrank until 2000 but is growing again, mostly in two renovated districts (Millside and the Canal District) where the median price is $610,000.","Old, cheap housing close to downtown jobs is exactly what attracts gentrifiers."]],["Explain ONE effect on long-time residents.",["Rents and property taxes climb, so lower-income residents, especially renters, can be pushed out (displacement).","Shops and culture change too, so the neighborhood may stop feeling like theirs."]]],
r:{m:"all",i:[["Describes gentrification: wealthier or younger people moving into and renovating older central neighborhoods, raising values",/wealth|rich|affluent|higher.?income|young|professional|renovat|invest|fix|upgrad|move (in|back)|moving (in|back)|new (shop|cafe|business|restaurant)|revitaliz|redevelop/i,"Define it: wealthier people move into older, cheaper central neighborhoods and renovate them, so home values jump."],["Gives one effect on long-time residents: displacement, unaffordable rent or taxes, loss of community or culture",/displac|push|forc|move out|moved out|leave|afford|rent|tax|price out|priced out|lose|lost|cultur|community|character|evict|replac/i,"Add the effect: rising rents and property taxes can push out long-time residents (displacement)."]]},
mo:"T1- The comeback of a few central-city neighborhoods looks like gentrification: wealthier newcomers moving into older, lower-income areas near downtown. E2- Brookhaven's central city shrank from 520,000 to 388,000 by 2000, but since 2010 it has grown again mostly in the renovated Millside and Canal districts, where the median home price is $610,000, far above the inner suburbs' $265,000. A3- As investors and young professionals renovate old homes, rents and property taxes rise, so long-time lower-income residents, especially renters, can be displaced because they can no longer afford to stay in their own neighborhood.",
b:["gentri","redlining","urbanmodels"],
th:"Wait, isn't it GOOD that downtown is growing again?",
co:"It's good for some people and hard on others, and the AP exam wants you to see both. Follow the money: who can afford a $610,000 house, and what happens to the renter who was already living there?",
kq:"A few old downtown neighborhoods are suddenly hot and expensive. Explain how that fits gentrification, and name one thing it does to people who already lived there.",
ml:["Gentrification",["Gentrification is when wealthier people move into an older, lower-income neighborhood near downtown, renovate homes, and open new businesses.","Causes: cheap older housing, short commutes to downtown jobs, walkable streets, and young professionals or empty-nesters who want city life.","Effects for the neighborhood: higher property values, new shops, more tax money for the city, and reinvestment in old buildings.","Effects for long-time residents: rents and property taxes rise, so many are displaced (pushed out), and the neighborhood's culture and businesses change.","In the Burgess model this usually happens in the old zone of transition just outside the CBD."],[["Gentrification","Wealthier newcomers transforming a lower-income urban neighborhood."],["Displacement","When rising costs force residents to move away."]]],
wk:["The city is growing again because it is popular now.","'Popular' isn't a process. Say WHO is moving in and WHY (wealthier people buying and renovating cheap old housing near downtown), then give the effect on the people already there."],
mw:"It defines gentrification, anchors it in the note ($610,000 Millside and Canal districts, growth since 2010), and gives a clear effect: displacement by rising rents and taxes.",
fr:"T1- The recent growth in some central-city neighborhoods could be gentrification, which is when ___. E2- In Brookhaven, ___. A3- One effect on long-time residents is ___, because ___.",
qc:["Which is the most common NEGATIVE effect of gentrification on long-time residents?",["Displacement, as rents and property taxes rise","Lower home values","Fewer new restaurants"],0,"Rising costs can push out the lower-income residents who were there first."]},
{v:"Describe",
q:"Describe ONE smart-growth or New Urbanism policy Brookhaven could adopt to reduce sprawl, and how it would work.",
sk:"Smart growth and New Urbanism",
s:[["Name a policy in general words.",["Options: an urban growth boundary or greenbelt, transit-oriented development, mixed-use zoning, or infill building on empty lots.","Pick the one you can explain in two sentences."]],["Describe specifically what it does.",["Transit-oriented development: rezone land within about a half mile of train or bus stations for apartments, shops, and offices.","Real example: Arlington, Virginia built dense housing and offices around its Metro stations."]],["Describe how that reduces sprawl.",["New homes go INSIDE the existing area, near transit, instead of on farmland at the edge.","Tie it to the table: more people could live where the drive-alone share is 55%, not 90%."]]],
r:{m:"all",i:[["Names a smart-growth or New Urbanism policy: urban growth boundary, greenbelt, transit-oriented development, mixed-use zoning, infill or brownfield redevelopment, denser housing, walkable design",/mixed.?use|transit|\btod\b|\btrains?\b|\brail|\bbus(es)?\b|subway|light rail|metro (line|station|system|rail|stop)|greenbelt|green belt|growth boundary|\bugb\b|boundary|infill|fill in|brownfield|vacant|empty lot|dens|walkab|apartment|duplex|townhouse|upzon|rezon|compact|bike|sidewalk|zoning/i,"Name a real policy: an urban growth boundary, transit-oriented development, mixed-use zoning, or infill building."],["Describes how it works to reduce sprawl (keeps growth inside, near transit, denser, less driving, protects land at the edge)",/instead|rather than|limit|stop|prevent|keep|inside|within|closer|near|walk|fewer cars|less driving|reduc\w* (driving|car|traffic|commut|the need)|up instead of out|grow up|taller|more (home|housing|people)|use land|already|existing|vacant|empty|farmland|countryside|protect|edge|can.t (build|spread|go)|without (a )?car/i,"Describe HOW: for example, new homes go inside the existing city near transit instead of on farmland at the edge."]]},
mo:"T1- Brookhaven could use transit-oriented development (TOD) to pull growth inward instead of outward. E2- The city would rezone the land within about a half mile of its rail and bus stations for apartments, townhouses, shops, and offices, the way Arlington, Virginia built dense, walkable neighborhoods around its Metro stations. A3- Because thousands of new homes would be built inside the existing metro next to transit, fewer families would need a new house on farmland at the edge, and more workers could live where the drive-alone share is 55% rather than 90%, which reduces sprawl and traffic.",
b:["smartgrowth","zoning"],
th:"Can a city really stop people from moving to the suburbs?",
co:"Not by force, but it can change the choices. Smart growth makes living inside the city easier and nicer (more homes near transit) and makes building at the edge harder (a growth boundary). Describe one tool and how it tilts the choice.",
kq:"Name ONE tool from smart growth or New Urbanism that Brookhaven could use so it stops spreading outward, and describe how it works.",
ml:["The smart-growth toolbox",["Smart growth means planning policies that fight sprawl by making cities compact, walkable, and transit-friendly.","Urban growth boundary: a line around the metro beyond which new subdivisions are not allowed (Portland, Oregon has used one since 1979). A greenbelt is a protected ring of open land that does the same job.","Transit-oriented development: dense housing, shops, and offices within walking distance of a train or bus station.","Mixed-use zoning and infill: allow homes above shops, and build on vacant or former industrial (brownfield) lots inside the city.","New Urbanism is the design movement behind many of these ideas: walkable blocks, mixed uses, and homes near shops, as in Seaside, Florida or Kentlands, Maryland."],[["Urban growth boundary","A legal line that limits how far a city can spread."],["Transit-oriented development","Dense, walkable building clustered around transit stations."],["Infill","Building on empty or underused land inside the existing city."]]],
wk:["Build more roads so people can get to work faster.","More roads is the opposite of smart growth: wider highways make living even farther out easier, which causes MORE sprawl. Pick a policy that keeps growth inside the city."],
mw:"It names a recognized policy (TOD), describes exactly what changes (rezoning near stations) with a real example, and connects it to less sprawl and less driving.",
fr:"T1- One smart-growth policy Brookhaven could use is ___. E2- It works by ___. A3- This reduces sprawl because ___.",
qc:["An urban growth boundary is…",["a line around a metro area beyond which new development is not allowed","a highway loop around a city","the border between a central city and its first suburb"],0,"It's a legal line that keeps growth inside and protects farmland at the edge."]},
{v:"Explain",
q:"Explain ONE limitation of using data for Brookhaven's three large zones, or the metro total, to understand its housing or transportation problems.",
sk:"Data limits: scale of analysis",
s:[["Think about scale. How many people are lumped into each row?",["Each zone holds 300,000 to 445,000 people, and the metro total holds over a million.","A number for a whole zone is an average, and averages hide the differences inside them."]],["Find proof in the table or the note that an average hides something.",["The central city's median price is $395,000, yet the Millside and Canal districts are at $610,000, so other neighborhoods must be far cheaper.","The 55% drive-alone figure mixes transit-rich downtown with car-dependent edges of the city."]],["Explain why that could mislead a planner or reader.",["You can't tell WHERE the affordability or transit problem actually is.","You'd need neighborhood or census-tract data. Also, where the 'city' line is drawn differs from metro to metro."]]],
r:{m:"all",i:[["Names a limitation: zone-level or metro-level averages hide variation within zones or neighborhoods, or city/suburb boundaries are defined differently, or rent and income data are missing",/scale|average|aggregat|hide|hidden|mask|lump|generaliz|variation|vary|varies|differences? (between|within|inside|in)|within (each|the|a|one) (zone|area)|inside (each|the|a|one) (zone|area)|neighborhood|district|\bblock|tract|defin|boundar|border|\brent|income|wage|salar|afford|too (big|large|broad)|(big|huge|large|giant) (zone|area|region)s?|(zone|area)s? (are|is) (too |really |very |so )?(big|huge|large|broad)/i,"Name the limit: these zones are huge averages that hide differences between neighborhoods (the $610,000 districts vs. cheaper ones)."],["Explains why it misleads or what data would be needed instead",/because|so |mislead|wrong|can.t|cannot|hard to|unclear|miss|would need|need|should|smaller|zip|tract|neighborhood|local|example|look like|seem/i,"Explain the problem: a planner couldn't tell where the real problem is and would need neighborhood-level data."]]},
mo:"T1- One limitation is scale: each row averages hundreds of thousands of people, so it hides big differences between neighborhoods. E2- The central city's median home price is listed as $395,000, but the note says the renovated Millside and Canal districts are at $610,000, which means other central neighborhoods must be far cheaper; likewise the 55% drive-alone figure lumps transit-rich downtown together with car-dependent parts of the city. A3- Because the zone averages blur these differences, a planner could not tell where housing is actually unaffordable or where buses are missing, and would need neighborhood or census-tract data to target the real problem.",
b:["scale","readtable","zoning"],
th:"The table seems fine to me. What's wrong with it?",
co:"Nothing is wrong with the numbers. The catch is what they hide. Look at the note: one district is $610,000 but the whole central city averages $395,000. What does that tell you about the rest of the city?",
kq:"Why might big averages for three huge zones not be enough to understand Brookhaven's housing or traffic problems? Explain ONE limitation.",
ml:["When the scale is too big",["Scale of analysis is the size of the area each number describes: a block, a neighborhood, a city, a metro, a country.","A number for a big area is an average, and averages hide the highs and lows inside them.","Brookhaven's central city shows $395,000, but the note says its renovated districts are at $610,000, so other neighborhoods must be much cheaper. The real affordability story is neighborhood by neighborhood.","Definitions matter too: a 'central city' is often a legal boundary drawn a century ago, so some car-dependent areas sit inside the line and some walkable old suburbs sit outside it. Comparing metros gets tricky.","Strong limitation answers name what is hidden or missing and say what data you would want instead, such as census tracts or rent data."],[["Scale of analysis","The size of the area each data point describes."],["Census tract","A small, neighborhood-sized area used for U.S. census data."],["Aggregate data","Numbers that combine many people or places into one figure."]]],
wk:["The data is from 2020, so it is out of date.","2020 is the most recent census year, and the question is about the SIZE of the areas, not the date. Explain what three giant zones hide, such as differences between neighborhoods."],
mw:"It names the limitation (scale and averages), proves it with the $610,000 vs. $395,000 gap, and explains how it could mislead a planner.",
fr:"T1- One limitation is that each zone is ___, so the numbers ___. E2- For example, ___. A3- This is a problem because ___, so a planner would need ___.",
qc:["A median home price for an entire central city is an example of…",["aggregate data that can hide differences between neighborhoods","neighborhood-scale data","a measure of transportation"],0,"One number for 445,000 people blurs the expensive and cheap neighborhoods together."]}
]});
addBG({
u6t_latam:{t:"The Latin American city model",s:["Geographers Ernst Griffin and Larry Ford created this model in 1980 (Ford updated it in 1996).","A commercial spine runs out from the CBD and market, lined by the elite residential sector, where the wealthiest families live.","Rings get poorer with distance: the zone of maturity (solid homes, full services), the zone of in situ accretion (modest homes improved bit by bit), and the periférico, a ring of squatter settlements at the edge.","Disamenity sectors are wedges of the very poorest housing along rivers, ravines, rail lines, or dumps, with few or no services.","Rich near the center, poor at the edge: roughly the reverse of the classic U.S. pattern."]},
u6t_squatter:{t:"Squatter settlements",s:["Squatter settlements are homes residents build on land they don't legally own or rent, often from scrap wood and metal.","Local names include favelas (Brazil) and pueblos jóvenes (Peru); Dharavi in Mumbai and Kibera in Nairobi are famous examples.","Many lack piped water, sewers, paved roads, and legal land titles, and sit on hillsides or floodplains.","UN-Habitat estimates that more than 1 billion people live in slums or informal settlements."]},
u6t_informal:{t:"The informal economy",s:["The informal economy is work that isn't taxed, licensed, or regulated: street vending, waste picking, day labor.","The International Labour Organization estimates that about 60% of the world's workers earn a living informally, mostly in developing countries.","It's easy for migrants to enter, but pay is low and unsteady, with no benefits or legal protection."]},
u6t_migrate:{t:"Rural-to-urban migration",s:["Rural-to-urban migration (moving from countryside to city) and natural increase together drive fast urban growth in developing countries.","Push factors (farm machines, too little land, poverty, drought, violence) drive people out; pull factors (jobs, schools, hospitals) draw them in.","Latin America is now about 80% urban; the fastest urban growth today is in Sub-Saharan Africa and South Asia."]},
u6t_primate:{t:"Primate cities",s:["Geographer Mark Jefferson described the primate city in 1939: a country's leading city, usually defined as more than twice the size of the second-largest.","A primate city dominates its country's government, economy, and culture, and draws most of its migrants and investment.","Examples: Lima, Buenos Aires, Bangkok, and Paris; many in developing countries were colonial capitals or ports."]},
u6t_ranksize:{t:"The rank-size rule",s:["The rank-size rule says the nth-largest city has 1/n the population of the largest: if the largest has 6 million, the 2nd should have 3 million and the 3rd 2 million.","Countries that roughly follow it, like the United States, have a balanced set of cities.","When the smaller cities fall far below the prediction, the country has a primate city instead."]},
u6t_megacity:{t:"Megacities & world cities",s:["A megacity has more than 10 million people; the UN counted 33 in 2018, most in developing countries, like Delhi, Dhaka, Cairo, and Lagos.","Many grew so fast that housing, water, sewers, and transit couldn't keep up.","A world city (global city) is a command center of the global economy, full of banks and corporate headquarters: London, New York, Tokyo.","Size isn't power: Lagos is huge but has far less global influence than London."]},
u6t_fixes:{t:"Improving informal settlements",s:["Slum upgrading adds paving, water, sewers, and power to settlements where they stand, as Rio de Janeiro's Favela-Bairro program did starting in the 1990s.","Land titles give residents legal ownership, so they can't be evicted and invest more in their homes.","Site-and-service programs, backed by the World Bank since the 1970s, give migrants plots with water, sewer, and road connections to build on.","Bus rapid transit (BRT) gives buses their own lanes: Curitiba, Brazil, pioneered it in 1974; Bogotá, Colombia, opened TransMilenio in 2000."]}
});
