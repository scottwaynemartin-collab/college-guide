st:"Stimulus 1: Model of Puerto Alba, a Fictional Latin American City · Stimulus 2: The Four Largest Cities of Valdoria, 2000 and 2025",
intro:"Puerto Alba is the largest city of Valdoria, an invented Latin American country. Like many cities in developing countries, it has grown fast as people pour in from the countryside, and its rich and poor neighborhoods are arranged very differently from a typical U.S. city's.",
stim:"<h4 style=\"color:var(--yl);margin:14px 0 6px\">Stimulus 1: Model of Puerto Alba, a Fictional Latin American City</h4><svg viewBox=\"0 0 340 320\" role=\"img\" aria-label=\"Griffin-Ford style model of the fictional city of Puerto Alba. A white circle in the center marks the CBD and market. Around it are rings: the zone of maturity, the zone of in situ accretion, and at the edge the periférico of squatter settlements. A commercial spine runs north from the CBD to a mall, lined by a gold elite residential sector wedge that cuts through every ring. Two striped disamenity sector wedges also run from center to edge: one along the Río Turbio (southwest), one along a rail line (northeast).\"><defs><pattern id=\"u6tD\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"5\" height=\"5\" fill=\"#0c0920\"/><path d=\"M0 0V5\" stroke=\"#ff3fa4\" stroke-width=\"1.8\"/></pattern></defs><rect width=\"340\" height=\"320\" fill=\"#0a1d3a\"/><g stroke=\"#0a1d3a\" stroke-width=\"1.5\"><circle cx=\"170\" cy=\"160\" r=\"148\" fill=\"#782c6a\"/><circle cx=\"170\" cy=\"160\" r=\"112\" fill=\"#115975\"/><circle cx=\"170\" cy=\"160\" r=\"74\" fill=\"#268663\"/><path d=\"M170 160L124.3 19.2A148 148 0 0 1 215.7 19.2Z\" fill=\"#ffd23f\"/><path d=\"M170 160L71 270A148 148 0 0 1 44.5 238.4Z\" fill=\"url(#u6tD)\"/><path d=\"M170 160L280 61A148 148 0 0 1 300.7 90.5Z\" fill=\"url(#u6tD)\"/></g><path d=\"M152 175C128 196 116 200 101 218S68 238 55 256S20 278 0 288\" fill=\"none\" stroke=\"#22e5ff\" stroke-width=\"3.5\"/><path d=\"M188 147L334 45\" stroke=\"#ffe7a6\" stroke-width=\"1.5\"/><path d=\"M188 147L334 45\" stroke=\"#ffe7a6\" stroke-width=\"6\" stroke-dasharray=\"1.5 4\"/><path d=\"M170 138V14\" stroke=\"#fff\" stroke-width=\"3\"/><rect x=\"163\" y=\"5\" width=\"14\" height=\"9\" fill=\"#fff\" stroke=\"#000\"/><circle cx=\"170\" cy=\"160\" r=\"22\" fill=\"#fff\"/><g font-family=\"Chakra Petch,sans-serif\" font-size=\"8.5\" font-weight=\"700\" fill=\"#fff\" stroke=\"#0c0920\" stroke-width=\"3\" paint-order=\"stroke\" text-anchor=\"middle\"><text x=\"170\" y=\"213\">Zone of maturity</text><text x=\"170\" y=\"256\">Zone of in situ accretion</text><text x=\"170\" y=\"285\">Periférico: peripheral</text><text x=\"170\" y=\"295\">squatter settlements</text><text x=\"170\" y=\"42\">Elite residential</text><text x=\"170\" y=\"51\">sector</text><text transform=\"rotate(-90 165 100)\" x=\"165\" y=\"100\">SPINE</text><text x=\"181\" y=\"12\" text-anchor=\"start\">Mall</text><g text-anchor=\"end\"><text x=\"336\" y=\"12\">Disamenity sector</text><text x=\"336\" y=\"22\">along rail line</text></g><g text-anchor=\"start\"><text x=\"4\" y=\"302\">Disamenity sector</text><text x=\"4\" y=\"312\">along Río Turbio</text></g><g font-size=\"8\" fill=\"#0a1d3a\" stroke=\"none\"><text x=\"170\" y=\"158\">CBD +</text><text x=\"170\" y=\"168\">market</text></g></g></svg><div class=\"legend\"><span><i style=\"background:#fff\"></i>CBD &amp; market</span><span><i style=\"background:#ffd23f\"></i>Spine &amp; elite residential sector</span><span><i style=\"background:#268663\"></i>Zone of maturity</span><span><i style=\"background:#115975\"></i>Zone of in situ accretion</span><span><i style=\"background:#782c6a\"></i>Periférico (squatter settlements)</span><span><i style=\"background:repeating-linear-gradient(45deg,#0c0920 0 2px,#ff3fa4 2px 4px)\"></i>Disamenity sector</span><span><i style=\"background:#22e5ff\"></i>River</span><span><i style=\"background:#ffe7a6\"></i>Rail line</span></div><p class=\"src\">Created for practice, based on the Griffin-Ford model. Puerto Alba and the Río Turbio are fictional. Not to scale.</p><h4 style=\"color:var(--yl);margin:14px 0 6px\">Stimulus 2: The Four Largest Cities of Valdoria, 2000 and 2025</h4><div class=\"tbl\"><table><thead><tr><th>Rank</th><th>City</th><th>Population, 2000</th><th>Population, 2025</th><th>Rank-size rule prediction, 2025 (largest ÷ rank)</th></tr></thead><tbody><tr><td>1</td><td>Puerto Alba</td><td>5,400,000</td><td>9,600,000</td><td>9,600,000</td></tr><tr><td>2</td><td>San Lucero</td><td>900,000</td><td>1,300,000</td><td>4,800,000</td></tr><tr><td>3</td><td>Aguasol</td><td>650,000</td><td>900,000</td><td>3,200,000</td></tr><tr><td>4</td><td>Tres Cerros</td><td>480,000</td><td>650,000</td><td>2,400,000</td></tr></tbody></table></div><p class=\"src\">Valdoria, its cities, and all data are fictional, created for practice. Rank-size rule: city number n should have 1/n the population of the largest.</p><p class=\"src\">Class directions: label each part, and write Describe and Explain parts as T1- (your reason in general words), E2- (the specific proof), A3- (why it matters).</p>",
bg:["u6t_latam","u6t_primate","readmap","readtable"],
nt:[["Stimulus 1: travel outward from the CBD (not north). Which zones do you pass, and where are the poorest homes?","Maturity, then in situ accretion, then the periférico of squatter settlements at the edge. Homes get poorer the farther out you go: backwards from many U.S. cities, where the wealthy often live in suburbs."],["Stimulus 1: three wedges cut across the rings. How is the gold one different from the striped ones?","Gold is the elite residential sector along the spine, a commercial boulevard from the CBD to a mall. The striped wedges are disamenity sectors along the river and rail line: flooding, pollution, the poorest homes. Wealth and poverty both follow lines out from the center."],["Stimulus 2, then connect: how does Puerto Alba compare with the rank-size predictions, and how fast is it growing? What could that do to Stimulus 1?","San Lucero “should” have 4,800,000 people but has 1,300,000. Puerto Alba is over seven times bigger and grew by 4,200,000 since 2000 (about 460 people a day). When newcomers arrive faster than housing is built, they build their own at the edge, and the periférico spreads."]],
m:20,
p:[
{v:"Identify",
q:"Identify the zone in Stimulus 1 where most of Puerto Alba's squatter settlements are located.",
sk:"Reading the city model",
s:[["Find “squatter settlements” on the diagram. Which ring is it?",["Rings go: CBD, maturity, in situ accretion, then the outermost ring.","The outermost (purple) ring, at the city's edge."]],["Name the zone and say where it is.",["Its Spanish name means “peripheral.”","Try: “The ___, the ring at the ___ of the city.”"]]],
r:{m:"any",i:[["Names the periférico (the zone of peripheral squatter settlements)",/perif|peripher/i,"Name the zone: the periférico, the zone of peripheral squatter settlements."],["Locates it as the outermost ring at the city's edge",/outer|edge|fringe|outskirt/i,"Say where it is: the outermost ring, at the edge of the city."]]},
mo:"The periférico: the zone of peripheral squatter settlements, the outermost ring at the edge of the city.",
b:["u6t_latam","u6t_squatter"],
th:"“Squatter”? Like the exercise?",
co:"Ha, no! A squatter builds a home on land they don't own or rent. Find those words on the diagram and name the zone.",
kq:"Which zone has most of the homes people built on land they don't own? Name it.",
ml:["Identify = name it",["Identify questions just ask you to name something. One specific phrase earns the point.","The outermost ring of the Latin American city model is the zone of peripheral squatter settlements, or periférico.","The newest, poorest migrants build homes there, usually without legal ownership, running water, or sewers."],[["Squatter settlement","Homes built on land the residents don't legally own or rent."],["Periférico","Spanish for “peripheral”: the outer edge of the city."]]],
wk:["Slums.","That's a kind of housing, not a zone (the disamenity sectors have slums too). Name the zone: the periférico."],
mw:"It names the zone (the periférico) and says where it is (the outermost ring).",
fr:"Most squatter settlements are in the ___, the ___ ring at the edge of Puerto Alba.",
qc:["Where do the newest, poorest migrants usually live in the Latin American city model?",["In the periférico at the edge","Along the spine","In the zone of maturity"],0,"Newcomers build their own homes in the periférico, the outer ring."]},
{v:"Describe",
q:"Using Stimulus 1, describe the spine and the elite residential sector in Puerto Alba.",
sk:"The spine and elite sector",
s:[["What are the spine and the gold wedge, in general words?",["The spine is a road. What kind?","A commercial boulevard out from the CBD; the gold wedge is where the wealthiest live."]],["Give details from the diagram.",["Which way does it run, and where does it end?","North from the CBD, through every ring, to a mall at the edge."]],["Describe why its shape matters.",["Is wealth a ring or a wedge here?","The best shops and offices line the spine, so the richest homes follow it outward."]]],
r:{m:"all",i:[["Describes the spine: a commercial boulevard out from the CBD",/boulevard|avenue|road|street|corridor|strip|commercial|business|shop|office|extend|stretch|runs|out from|from the (cbd|center|downtown)/i,"Describe the spine: a commercial boulevard running out from the CBD."],["Describes the elite sector: wealthy homes along the spine",/wealth|rich|upper|high.income|affluent|expensive|luxur|mansion|well.off|nicest|money/i,"Say who lives along it: the city's wealthiest families."]]},
mo:"T1- The spine is a commercial boulevard running out from the CBD, and the elite residential sector is the wedge of wealthy homes on both sides of it. E2- In Stimulus 1, the spine runs north from the CBD to a mall at the edge, and the gold elite sector follows it through all three rings. A3- Because the spine has the city's best shops, offices, and parks, the richest families live along it, so wealth forms a wedge, not a ring.",
b:["u6t_latam","readmap"],
th:"A spine? Like a backbone? In a city?",
co:"Exactly like a backbone! It's the main boulevard out of downtown. Who gets to live next to the fanciest street in town?",
kq:"What are the spine and the elite residential sector? Describe them using the diagram.",
ml:["The spine and elite sector",["The spine is a grand commercial boulevard running out from the CBD, lined with offices, shops, and parks.","The elite residential sector is the wedge of the wealthiest homes along both sides of it.","In Ford's 1996 update, the spine often ends at a big mall near the city's edge."],[["Spine","A commercial boulevard running out from the CBD."],["Sector","A wedge-shaped zone running out from the center, like a pizza slice."]]],
wk:["The spine is on the north side of the city, and the elite residential sector is next to it.","That only gives names and places. Describe what they ARE: a commercial boulevard, lined by the wealthiest homes."],
mw:"It defines the spine, says who lives in the elite sector, and uses diagram details (north to a mall).",
fr:"T1- The spine is ___, and the elite sector is ___. E2- In Stimulus 1, the spine runs from ___ to ___. A3- So wealth forms a ___ because ___.",
qc:["In the Latin American city model, the spine is…",["a commercial boulevard out from the CBD","a ring of squatter settlements","a river lined with factories"],0,"It's the main commercial avenue, lined by wealthy homes."]},
{v:"Explain",
q:"Explain ONE reason why wealthy residents of many Latin American cities live near the CBD and along the spine, unlike in many U.S. cities.",
sk:"Why the rich live near the center",
s:[["Name a reason. What does the center have that the edge lacks?",["Think services, safety, and history.","The center has the best services; the edge has squatter settlements."]],["Give specific proof.",["Reliable water, electricity, police, and the best shops and parks.","Or history: Spanish colonial towns centered on a plaza, with the elite living nearby."]],["Explain why that's the opposite of the U.S.",["U.S. cars and highways let the wealthy move OUT to suburbs.","Here the edge lacks services, so living centrally means comfort, safety, and status."]]],
r:{m:"all",i:[["Names a reason: services, amenities, jobs, safety, colonial tradition, or status",/amenit|service|infrastruct|water|electric|sewer|police|safe|secur|job|shop|park|plaza|colonial|spanish|status|prestig|transport|transit|commut|\bcars?\b/i,"Name the reason: the center has the best services (water, electricity, police) and amenities."],["Explains the contrast: the edge lacks services, while U.S. elites moved to suburbs",/suburb|u\.s|united states|america|edge|perif|periph|outskirt|squatter|poor|because|while|whereas|unlike/i,"Explain the contrast: the edge has squatter settlements without services, while rich Americans moved to suburbs."]]},
mo:"T1- Wealthy residents live near the CBD and spine because that is where the best services and amenities are. E2- The center has reliable water, electricity, police, and the best shops and parks, while the periférico at the edge often lacks piped water and sewers. A3- Because the edge has no services, living near the center brings comfort, safety, and status, the opposite of the U.S., where cars and highways let the wealthy move out to suburbs.",
b:["u6t_latam","u6t_squatter"],
th:"Wait, I thought rich people live in the suburbs?",
co:"In the U.S., often yes! That's what makes this interesting. Picture living in the periférico: what's missing?",
kq:"Rich U.S. families often move to suburbs, but rich Latin American families live near downtown. Explain ONE reason why.",
ml:["Why the pattern flips",["In the U.S., cars, highways, and cheap mortgages helped wealthier families move to suburbs after World War II.","In Latin American cities, the best services (water, power, paved roads, police) are in the center and along the spine, not at the squatter-settled edge.","History matters too: Spanish colonial rules (the Laws of the Indies, 1573) built towns around a central plaza, where the elite lived."],[["Amenity","Something that makes a place pleasant, like parks, shops, or good services."],["Laws of the Indies","Spanish colonial rules for planning towns around a central plaza."]]],
wk:["Rich people like to live in nice areas.","Everyone does! Say WHAT makes the center nice (like better services) and contrast it with the edge or the U.S."],
mw:"It names a reason (services), gives proof (water, police), and explains the U.S. contrast.",
fr:"T1- Wealthy residents live near the CBD and spine because ___. E2- For example, the center has ___, while the edge ___. A3- This is the opposite of the U.S. because ___.",
qc:["In the Latin American city model, where do wealthy residents usually live?",["Near the CBD and along the spine","In squatter settlements at the edge","In the disamenity sectors"],0,"The best services are near the center, so the elite live there."]},
{v:"Explain",
q:"Using Stimulus 2, explain whether Puerto Alba is a primate city. Support your answer with data from the table.",
sk:"Primate city vs. rank-size rule",
s:[["Decide: is it a primate city? Remember the test.",["Primate means more than twice the size of the second-largest city.","Is 9,600,000 more than double 1,300,000?"]],["Quote numbers as proof.",["9,600,000 vs. 1,300,000: over seven times bigger.","The rule predicts 4,800,000 for San Lucero; it has about a quarter of that."]],["Explain what that means for Valdoria.",["What piles up in a city far bigger than predicted?","People, jobs, and investment concentrate in one dominant city."]]],
r:{m:"all",i:[["Uses table data (9.6 vs. 1.3 million, or the 4.8 million prediction)",/9[.,]6|9,600|1[.,]3|1,300|4[.,]8|4,800|seven|7 ?(times|x)/i,"Quote the table: 9,600,000 vs. 1,300,000 (the rule predicts 4,800,000)."],["Explains that it IS primate: more than twice the next city",/primate|dominat|twice|double|much (larger|bigger)|far (larger|bigger)|times (larger|bigger|as)/i,"Explain the test: it's more than twice as large as the next city."]]},
mo:"T1- Yes, Puerto Alba is a primate city because it is far more than twice as large as Valdoria's second-largest city. E2- Stimulus 2 shows Puerto Alba has 9,600,000 people, more than seven times San Lucero's 1,300,000, while the rank-size rule predicts 4,800,000 for San Lucero. A3- Because every smaller city falls far below its prediction, Valdoria's people, jobs, and investment are concentrated in one dominant city.",
b:["u6t_primate","u6t_ranksize","readtable"],
th:"Primate? Like monkeys?",
co:"Ha! Same root: primate comes from the Latin for “first.” A primate city is WAY ahead of every other city. Prove that with numbers.",
kq:"Is Puerto Alba a primate city, way bigger than any other in Valdoria? Use numbers from the table.",
ml:["Primate cities and rank-size",["A primate city is more than twice as large as its country's second-largest city and usually dominates its economy and government.","The rank-size rule says the city ranked n should have 1/n the population of the largest: the 2nd city half, the 3rd a third.","When smaller cities fall far below the rule, the country has a primate city, like Lima, Bangkok, or Paris."],[["Primate city","A city more than twice as large as its country's next-largest city."],["Rank-size rule","The nth-largest city has 1/n the population of the largest."]]],
wk:["Yes, Puerto Alba is a primate city because it is the largest city in Valdoria.","Every country has a largest city, and there's no data. Prove it: 9,600,000 vs. 1,300,000."],
mw:"It answers yes, proves it with table numbers, and explains what primacy means.",
fr:"T1- Puerto Alba ___ a primate city because ___. E2- The table shows ___, while ___. A3- This shows that ___.",
qc:["Under the rank-size rule, if the largest city has 6,000,000 people, the 3rd-largest should have…",["2,000,000","3,000,000","600,000"],0,"Largest ÷ rank: 6,000,000 ÷ 3 = 2,000,000."]},
{v:"Explain",
q:"Explain ONE cause of the rapid growth of squatter settlements on the edges of large cities in developing countries.",
sk:"Why squatter settlements grow",
s:[["Name a cause. Where are all these newcomers from?",["Think migration and housing.","Rapid rural-to-urban migration, plus too little affordable housing."]],["Give proof: what pushes people out of the countryside and pulls them in?",["Push: farm machines, too little land, rural poverty, drought.","Pull: jobs, schools, hospitals. Puerto Alba grew from 5.4 to 9.6 million since 2000."]],["Explain how that creates squatter settlements.",["Can the city build homes as fast as people arrive?","With nothing affordable, migrants build their own homes on unused land at the edge."]]],
r:{m:"all",i:[["Names a cause: rural-to-urban migration, population growth, or no affordable housing",/migra|move|moving|rural|countryside|village|farm|birth|natural increase|population growth|afford|housing shortage/i,"Name the cause: rapid rural-to-urban migration."],["Explains the link: newcomers can't afford housing, so they build their own",/afford|poor|poverty|cheap|cost|money|rent|their own|build|vacant|empty|unused|faster than|keep up|shortage|not enough|can.t|cannot/i,"Explain the link: migrants can't afford formal housing, so they build their own at the edge."]]},
mo:"T1- One cause is rapid rural-to-urban migration. E2- Push factors like farm mechanization and rural poverty, plus pull factors like jobs and schools, send huge numbers of migrants to cities like Puerto Alba, which grew from 5,400,000 to 9,600,000 people since 2000. A3- Because the city can't build affordable housing as fast as newcomers arrive, and most can't afford formal rents, many build their own homes on unused land at the edge, so squatter settlements spread.",
b:["u6t_migrate","u6t_squatter","u6t_informal"],
th:"Why would anyone move somewhere with no water and no real house?",
co:"For many rural families, the city still beats the village: jobs, schools, a clinic. The trouble starts when nothing is affordable.",
kq:"Why do squatter settlements around big cities in poorer countries grow so fast? Explain ONE cause.",
ml:["Rapid urbanization",["Rural-to-urban migration is moving from the countryside to a city.","Push factors include farm machines replacing workers and rural poverty; pull factors include jobs, schools, and health care.","Many migrants work in the informal economy (street vending, day labor), which pays too little for rent, so they build homes on unused land at the edge."],[["Push and pull factors","Reasons that drive people away (push) or attract them (pull)."],["Informal economy","Work that isn't taxed, licensed, or regulated by the government."]]],
wk:["Because people want to live in the city.","It doesn't say who is coming or why they squat. Name the cause (rural-to-urban migration) and the link (no affordable housing)."],
mw:"It names the cause, gives proof (push and pull factors, growth), and explains the link to housing.",
fr:"T1- One cause of fast-growing squatter settlements is ___. E2- For example, ___. A3- This leads to squatter settlements because ___.",
qc:["Which is a PUSH factor sending rural people to cities?",["Farm machines replacing farmworkers","Better-paying city jobs","City hospitals and schools"],0,"Push factors drive people away; city jobs and hospitals are pull factors."]},
{v:"Explain",
q:"Using both stimuli, explain ONE challenge a primate city like Puerto Alba faces in providing services such as clean water, sanitation, or transportation to the periférico.",
sk:"Connecting growth and services",
s:[["Name a challenge. Which service is hard to deliver, and why?",["Pick one: water, sewers, power, buses, or roads.","The city grows faster than it can extend pipes and transit to its edge."]],["Use proof from BOTH stimuli.",["Stimulus 1: where is the periférico compared with the CBD?","Stimulus 2: a primate city that grew from 5.4 to 9.6 million since 2000."]],["Explain what happens to people there.",["What if there's no clean water, sewer, or bus?","Disease spreads, families buy costly trucked water, and commutes take hours."]]],
r:{m:"all",i:[["Uses Stimulus 1: the periférico is at the outer edge, far from the CBD",/perif|peripher|edge|outer|outskirt|far from|farthest|fringe/i,"Use Stimulus 1: the periférico is the ring farthest from the CBD."],["Uses Stimulus 2: a primate city that grew fast",/primate|9[.,]6|9,600|5[.,]4|5,400|4[.,]2|4,200|million|grew|grow|fast|rapid/i,"Use Stimulus 2: Puerto Alba grew from 5,400,000 to 9,600,000 since 2000."],["Explains the service challenge and its effect",/water|pipe|sewer|sanit|electric|power|bus|transit|transport|road|commut|garbage|waste|disease|health/i,"Explain the challenge: pipes and buses can't keep up with the spreading edge, so people lack clean water."]]},
mo:"T1- One challenge is that Puerto Alba is growing faster than it can extend water pipes and sewers to its edge. E2- Stimulus 2 shows Puerto Alba is a primate city that grew from 5,400,000 to 9,600,000 people since 2000, and Stimulus 1 shows the newest squatter settlements form the periférico, farthest from the CBD. A3- As the periférico spreads onto unplanned land, pipes must stretch ever farther, so many residents go without clean water and sanitation, which spreads diseases like cholera.",
b:["u6t_megacity","u6t_informal","u6t_primate"],
th:"How do I use a diagram AND a table in one answer?",
co:"It's a two-part proof. The table shows how big and how FAST. The diagram shows WHERE newcomers end up.",
kq:"Using both stimuli, explain ONE reason it's hard to get water, sewers, or buses to Puerto Alba's edge.",
ml:["When services can't keep up",["Megacities and fast-growing primate cities often grow faster than governments can build infrastructure.","Pipes, sewers, and bus routes are expensive, and squatter settlements often sit on hillsides or floodplains where they're hard to build.","Without piped water and sewers, waterborne diseases spread; without buses, people at the edge commute for hours to jobs in the center."],[["Infrastructure","A city's basic systems: water, sewers, power, roads, and transit."],["Megacity","A metropolitan area with more than 10 million people."]]],
wk:["Puerto Alba has a lot of people, so it is crowded.","It uses neither stimulus and names no service. Use both: fast growth (Stimulus 2) plus an edge far from the CBD (Stimulus 1)."],
mw:"It uses both stimuli (growth, the edge location), names a service, and explains the effect (disease).",
fr:"T1- One challenge Puerto Alba faces is ___. E2- Stimulus 2 shows ___, and Stimulus 1 shows the periférico is ___. A3- Because of this, ___.",
qc:["A megacity is a metropolitan area with more than…",["10 million people","1 million people","100 million people"],0,"Over 10 million. Puerto Alba, at 9.6 million, is close."]},
{v:"Explain",
q:"Explain ONE way a city government could improve living conditions in informal settlements like those in Puerto Alba's periférico.",
sk:"Improving informal settlements",
s:[["Name a strategy (not bulldozing). What could the city build or give?",["Think services, land ownership, or transportation.","Upgrading in place, site-and-service, land titles, or bus rapid transit."]],["Give a real example.",["Rio de Janeiro's Favela-Bairro program paved streets and added water and sewers.","Curitiba, Brazil, and Bogotá, Colombia (TransMilenio) built bus rapid transit."]],["Explain HOW it improves lives.",["Clean water means less disease; land titles mean families invest in their homes."]]],
r:{m:"all",i:[["Names a strategy: upgrading, services, land titles, site-and-service, or BRT",/site.and.service|upgrad|title|legal|owner|property|pipe|water|sewer|sanit|electric|pav|road|brt|bus|transit|transmilenio|cable|metro|clinic|school|loan|housing/i,"Name a strategy: add water and sewers, give land titles, run site-and-service, or build bus rapid transit."],["Explains how it improves living conditions",/because|so |which|allow|lead|help|improv|safe|health|disease|invest|commut|access|connect|job/i,"Explain the payoff: clean water means less disease; fast buses reach jobs."]]},
mo:"T1- A city government could upgrade informal settlements in place by adding basic services and giving residents legal titles to their land. E2- For example, Rio de Janeiro's Favela-Bairro program paved streets, installed water and sewer lines, and built community centers in existing favelas instead of bulldozing them. A3- Clean water and sewers reduce disease, and families who securely own their land invest in improving their homes, which raises living conditions without forcing anyone to move.",
b:["u6t_fixes","u6t_squatter"],
th:"Can't the city just knock them down and build apartments?",
co:"Cities have tried, and it usually backfires: new settlements just pop up elsewhere. What could a city add instead of take away?",
kq:"What's ONE thing a city could do to make life better in squatter settlements? Explain how it helps.",
ml:["Better than bulldozers",["Slum upgrading adds paving, water, sewers, and power to settlements where they stand, like Rio de Janeiro's Favela-Bairro program.","Land titles make ownership secure, so families invest in their homes; site-and-service programs give migrants plots already hooked up to water, sewers, and roads.","Bus rapid transit, pioneered in Curitiba, Brazil, and copied by Bogotá's TransMilenio, links the edge to jobs."],[["Site-and-service","Land plots with water, sewers, and roads, where people build their own homes."],["Bus rapid transit (BRT)","Buses with their own lanes and stations, fast like a subway."]]],
wk:["The government should get rid of the slums.","Clearing slums destroys homes and pushes people elsewhere. Name a strategy that helps and explain its effect."],
mw:"It names a strategy, gives a real example (Favela-Bairro), and explains how lives improve.",
fr:"T1- A city government could improve informal settlements by ___. E2- For example, ___. A3- This helps because ___.",
qc:["Giving migrants land plots already connected to water, sewers, and roads is called…",["site-and-service","gentrification","redlining"],0,"Site-and-service provides the basics; residents build the homes."]}
]});
addBG({
devmeasures:{t:"Measures of development",s:["GNI per capita is a country's total income divided by its population. “PPP” (purchasing power parity) adjusts for the fact that a dollar buys more in some countries than in others.","HDI, the Human Development Index, combines income, years of schooling, and life expectancy into one score from 0 to 1. Above 0.80 counts as “very high” development.","Other common measures: literacy rate, infant mortality rate, and the share of workers in each economic sector.","Income measures what a country earns; HDI measures whether that money reaches people's health and education. When the two disagree, something interesting is going on."]},
rostow:{t:"Rostow's stages of growth",s:["W. W. Rostow (1960) said every country moves through five stages: traditional society, preconditions for take-off, take-off, drive to maturity, and high mass consumption.","Take-off is the big moment: a few industries grow fast, cities swell, and the country starts to industrialize.","High mass consumption is the top stage: most workers are in services, and people spend on cars, electronics, and vacations.","Critics say the model is based on the history of the United States and Western Europe, assumes every country can follow the same path, and ignores how colonialism and global trade can hold countries back.","Wallerstein's world-system theory answers that criticism by looking at the whole world at once: a wealthy core, a semi-periphery, and a periphery that supplies raw materials and cheap labor."]},
gii:{t:"Gender Inequality Index",s:["The Gender Inequality Index (GII) is a UN measure from 0 to 1 that compares women and men. Lower is better; 0 would mean full equality.","It combines three things: reproductive health (maternal deaths and teen births), empowerment (seats in parliament and secondary schooling), and participation in the paid workforce.","Countries with a high GII usually have fewer girls finishing school, fewer women in paid jobs, and more early marriages.","Development experts argue that educating and employing women is one of the fastest ways to raise a country's HDI, which is why microloans to women, like those from Bangladesh's Grameen Bank, are so popular."]},
commodity:{t:"Commodity dependence",s:["A commodity is a raw product sold in bulk at a world price: oil, copper, coffee, cocoa, cotton.","A country is commodity-dependent when most of its export earnings come from one or two commodities. Nigeria and Venezuela, for example, get most of theirs from oil.","World prices for commodities swing wildly. Oil fell from over $100 a barrel in 2014 to under $30 in early 2016.","When the price drops, the country's income, government budget, and jobs all drop at once. Some geographers call this trap the “resource curse.”","The usual advice is to diversify: build manufacturing and services so that one price can't sink the whole economy."]},
sez:{t:"Special economic zones",s:["A special economic zone (SEZ) is an area where a government relaxes its normal rules to attract foreign factories: lower taxes, fewer tariffs, less paperwork.","An export processing zone (EPZ) is a type of SEZ focused on assembling goods for export. Mexico's maquiladoras along the U.S. border are a famous example.","China's first SEZ, Shenzhen, grew from a fishing town of about 30,000 people in 1980 into a city of more than 17 million.","Companies get cheap labor and easy exporting; the host country gets jobs, technology, and foreign investment.","Downsides can include low wages, weak worker protections, pollution, and companies that leave once the tax breaks end."]},
sectors:{t:"Economic sectors",s:["Primary sector: taking things from the earth (farming, fishing, mining). Secondary: making things (factories, construction). Tertiary: services (stores, schools, hospitals, banks).","Some books add quaternary (information and research) and quinary (top-level decision-making).","As a country develops, workers shift from primary to secondary to tertiary. Rich countries usually have under 5% of workers in farming and over 70% in services.","A big share of workers in agriculture usually signals low incomes, because farms in poor countries produce little per worker and most of it is eaten, not sold."]}
});

intro:"Geographers use many indicators to measure development, because no single number tells the whole story. The table shows six indicators for four countries.",
stim:"<div class=\"tbl\"><table><thead><tr><th>Country</th><th>GNI per capita (PPP, US$)</th><th>HDI (0–1)</th><th>Gender Inequality Index (0–1, lower is better)</th><th>Workers in agriculture (%)</th><th>Workers in services (%)</th><th>Exports from one commodity (%)</th></tr></thead><tbody>\n<tr><td>Ardena</td><td>48,200</td><td>0.93</td><td>0.08</td><td>2</td><td>78</td><td>9 (machinery)</td></tr><tr><td>Kovar</td><td>14,100</td><td>0.76</td><td>0.35</td><td>18</td><td>55</td><td>20 (electronics)</td></tr>\n<tr><td>Sulmani</td><td>2,100</td><td>0.49</td><td>0.58</td><td>62</td><td>25</td><td>15 (coffee)</td></tr><tr><td>Tessar</td><td>31,400</td><td>0.74</td><td>0.50</td><td>6</td><td>60</td><td>85 (petroleum)</td></tr></tbody></table></div><p class=\"src\">Note: The countries and data are invented for practice. Remember the class directions: label each part, and write Describe and Explain parts as T1- (your reason in general words), E2- (the specific proof), A3- (why it matters).</p>",
bg:["devmeasures","rostow","readtable"],
nt:[["Look at Tessar's GNI per capita, then slide over to its HDI. Does its ranking stay the same?","No! Tessar is #2 in income ($31,400) but LAST in HDI (0.74), below Kovar, which earns less than half as much per person. That mismatch is the heart of this FRQ."],["Run your finger down the agriculture column, then down the HDI column. What happens?","As the share of farm workers rises (2, 6, 18, 62%), HDI mostly falls (0.93, 0.74, 0.76, 0.49). Tessar is the one exception: oil money shrank its farming but didn't lift its HDI."],["Which country gets most of its export money from ONE product? What is the product?","Tessar: 85% of its exports are petroleum. One product, one world price. Keep that in mind for the later parts."]],
m:20,
p:[
{v:"Identify",
q:"Identify the country in the table that is most likely in Rostow's stage of high mass consumption.",
sk:"Matching data to a Rostow stage",
s:[["Recall what high mass consumption looks like: rich, service-based, few farmers.",["It's the TOP stage: high incomes, most workers in services, very few in farming.","Think of the United States or Germany today."]],["Find the row with the highest HDI and the most service workers.",["Scan the HDI column for the highest number, then check the services column.","It's the first row."]]],
r:{m:"any",i:[["Ardena",/ardena/i,"Find the country with the highest GNI per capita, the highest HDI, and the most workers in services."]]},
mo:"Ardena.",
b:["rostow","sectors"],
th:"I remember Rostow had stages, but I forget what the top one is.",
co:"No problem. The top stage is high mass consumption: a rich country where most people work in services and can afford cars, phones, and vacations. Now find the richest, most service-heavy row.",
kq:"Which country is the rich one at the top of Rostow's ladder? Just name it.",
ml:["Rostow's top stage",["Rostow's model has five stages, from traditional society (mostly farming) to high mass consumption (mostly services and shopping).","In high mass consumption, GNI per capita and HDI are very high, under 5% of workers farm, and most workers are in services.","Ardena fits: $48,200 per person, HDI 0.93, 2% in agriculture, 78% in services.","Tessar has a high income too, but 85% of its exports are one raw commodity, which is not what a mature, diversified economy looks like."],[["High mass consumption","Rostow's fifth stage: a wealthy, service-based economy."],["Tertiary sector","Service jobs: stores, schools, hospitals, offices."]]],
wk:["Tessar, because it has a high GNI per capita.","GNI alone is the trap in this table. Tessar's HDI is the lowest of the four and 85% of its exports are one raw material, so it isn't a mature, diversified economy. Check HDI and the services column too."],
mw:"It names the one country whose numbers all point to the top stage: highest income, highest HDI, almost no farmers, and most workers in services.",
fr:"The country most likely in high mass consumption is ___.",
qc:["Rostow's stage of high mass consumption is marked by…",["most workers in services and high spending on consumer goods","most workers in farming and little trade","a few fast-growing industries just getting started"],0,"It's the top stage: a rich, service-based economy where people buy cars, electronics, and vacations."]},
{v:"Describe",
q:"Using the table, describe the relationship between the percent of workers in agriculture and the Human Development Index (HDI).",
sk:"Describing a relationship in data",
s:[["Say the relationship in general words. When one number goes up, what does the other do?",["Compare the top and bottom of each column.","When agriculture goes UP, HDI goes DOWN. That's an inverse (negative) relationship."]],["Prove it with two rows from the table, numbers included.",["Use the two extremes: Sulmani and Ardena.","Sulmani: 62% in agriculture, HDI 0.49. Ardena: 2% in agriculture, HDI 0.93."]],["Say why that relationship makes sense.",["Think about what happens to workers as a country develops.","Workers move from farms to factories and services, which raises incomes, schooling, and life expectancy."]]],
r:{m:"all",i:[["States the direction: higher percent in agriculture goes with lower HDI (inverse/negative relationship)",/invers|negativ|opposite|indirect|(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot).{0,50}(agri\w*|farm\w*).{0,80}(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse)|(agri\w*|farm\w*).{0,50}(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot).{0,80}(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse)|(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse).{0,50}(agri\w*|farm\w*).{0,80}(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot)|(agri\w*|farm\w*).{0,50}(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse).{0,80}(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot)|(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot).{0,30}(hdi|human development|develop\w*).{0,60}(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse).{0,40}(agri\w*|farm\w*)|(less|fewer|lower|\blow|decreas\w*|go(es)? down|\bdrops?\b|\bfalls?\b|smaller|\bleast\b|lowest|\bfew\b|worse).{0,30}(hdi|human development|develop\w*).{0,60}(more|higher|\bhigh|increas\w*|go(es)? up|\brises?\b|rising|bigger|larger|greater|\bmost\b|highest|lots of|a lot).{0,40}(agri\w*|farm\w*)/i,"State the direction: the higher the percent of workers in agriculture, the lower the HDI."],["Uses the table as proof: names countries or quotes numbers (e.g., Sulmani 62% / 0.49 vs. Ardena 2% / 0.93)",/sulmani|ardena|kovar|tessar|62|0\.49|0\.93|0\.76|0\.74|2 ?%|18 ?%|6 ?%/i,"Use the table: Sulmani has 62% in agriculture and an HDI of 0.49, while Ardena has 2% and 0.93."]]},
mo:"T1- The table shows an inverse relationship: the higher the percent of workers in agriculture, the lower the HDI. E2- Sulmani has 62% of its workers in agriculture and the lowest HDI (0.49), while Ardena has only 2% in agriculture and the highest HDI (0.93). A3- This fits the idea that as countries develop, workers shift out of farming into factories and services, which raises incomes, education, and life expectancy.",
b:["sectors","readtable"],
th:"Describe a relationship? Do I just say they're related?",
co:"Almost! A relationship has a direction. Try the sentence: “As ___ goes up, ___ goes ___.” Then prove it with two rows and their actual numbers.",
kq:"When a country has more farm workers, what happens to its HDI? Say the direction and prove it with numbers from the table.",
ml:["Reading a relationship in a table",["Two columns have a relationship if one changes in a predictable way when the other changes.","Positive (direct): both go up together. Inverse (negative): one goes up while the other goes down.","Here, more farm workers means a lower HDI, so the relationship is inverse.","To prove it, quote two rows: Sulmani (62% agriculture, HDI 0.49) and Ardena (2%, HDI 0.93).","Note the exception: Tessar has few farmers (6%) but a middling HDI (0.74). Real data is rarely perfect, and exceptions are great material for later parts."],[["Inverse relationship","One number goes up while the other goes down."],["Primary sector","Jobs that take things from the earth: farming, fishing, mining."]]],
wk:["Agriculture and HDI are related.","Related how? A relationship has a direction (as one goes up, the other goes down), and you need numbers from the table as proof."],
mw:"It states the direction (inverse), proves it with two rows and their numbers, and explains why farming and HDI move in opposite directions.",
fr:"T1- The table shows that as the percent of workers in agriculture goes ___, HDI goes ___. E2- For example, ___ has ___% in agriculture and an HDI of ___, while ___ has ___% and ___. A3- This makes sense because ___.",
qc:["If one number goes UP while the other goes DOWN, the relationship is…",["inverse (negative)","positive (direct)","random"],0,"Inverse means opposite directions, like agriculture and HDI in this table."]},
{v:"Explain",
q:"Using the table, explain why a country can have a high GNI per capita but a lower HDI than its income would predict.",
sk:"Income vs. human development",
s:[["Find the mismatch, then name the general reason. Who actually gets the money?",["Tessar: $31,400 per person but HDI 0.74, below Kovar at $14,100.","GNI per capita is an average. It can be high even if most of the money goes to a few people."]],["Give specific proof from Tessar's row.",["85% of Tessar's exports are petroleum. Oil money flows to the government and a small elite, not to everyone.","Its Gender Inequality Index (0.50) is high, so women in particular are being left behind."]],["Explain why that lowers HDI specifically.",["Remember what HDI measures besides income: schooling and life expectancy.","If oil money isn't spent on schools and hospitals, two of HDI's three parts stay low."]]],
r:{m:"all",i:[["Names a reason: wealth is concentrated or unequal, money comes from one resource (oil), low spending or corruption, or gender inequality",/concentrat|unequal|inequal|few|elite|rich|wealthy|gap|spend|invest|corrupt|govern|oil|petrol|women|gender|gii|average|distribut|one (product|commodity|export|resource)/i,"Name the reason: Tessar's oil wealth is concentrated in a few hands and not spread to most people."],["Explains the link to HDI: money doesn't reach education, health, or life expectancy for most people",/educat|school|literacy|health|hospital|life expectancy|doctor|medic|not reach|doesn.t reach|does not reach|left out|left behind|trickle|most people|ordinary people|regular people|average person|normal people|spen(d|t|ding) (it |the money )?on (the )?(people|citizens|schools|health|education)|invest\w* in (the )?(people|citizens|schools|health|education)|quality of life|standard of living|living standard|live longer|lifespan/i,"Connect it to HDI: if the money isn't spent on schools and health care, education and life expectancy stay low."]]},
mo:"T1- A country can have a high GNI per capita but a lower HDI when its wealth is concentrated in a few hands and not spent on people. E2- Tessar earns $31,400 per person on paper, but 85% of its exports are petroleum, so the money flows to the government and a small elite rather than into schools and hospitals; its high Gender Inequality Index (0.50) shows that women in particular are left out. A3- Because HDI also measures education and life expectancy, not just income, a country that does not invest its oil money in health and schooling scores lower than its GNI alone would predict.",
b:["devmeasures","commodity","gii"],
th:"If they have the money, why wouldn't they be developed?",
co:"Because “per capita” is an average, not a paycheck. If one oil company and a few officials earn almost everything, the average looks great while most families never see it. Follow where the oil money actually goes.",
kq:"Tessar is rich on paper but scores low on HDI. Explain why that happens, using the table.",
ml:["When income and HDI disagree",["GNI per capita divides a country's total income by its population, so a few very rich people can pull the average up.","HDI has three parts: income, years of schooling, and life expectancy. Income is only one third of the score.","Oil-rich countries such as Equatorial Guinea have had a GNI per capita far higher than their HDI would suggest, because oil money went to a small elite.","A high Gender Inequality Index is a clue: when women are kept out of school and work, half the population's health and education lag behind.","So when GNI is high but HDI is low, look for concentrated wealth and low spending on people."],[["GNI per capita","A country's total income divided by its population: an average, not what each person gets."],["HDI","Human Development Index: income + schooling + life expectancy, scored 0 to 1."]]],
wk:["Tessar has a lower HDI because it is a smaller country.","Size has nothing to do with it; the table doesn't even show population. The reason is WHERE the money goes: concentrated oil wealth that isn't spent on schools and health."],
mw:"It names the reason (concentrated wealth), proves it with Tessar's row (85% petroleum, GII 0.50), and connects it to what HDI measures (education and life expectancy).",
fr:"T1- A country can have a high GNI per capita but a lower HDI when ___. E2- For example, Tessar ___. A3- This lowers HDI because HDI also measures ___, and ___.",
qc:["Which of these is NOT one of the three parts of HDI?",["Exports per person","Life expectancy","Years of schooling"],0,"HDI combines income, education, and life expectancy. Exports aren't part of it."]},
{v:"Explain",
q:"Explain ONE way a high Gender Inequality Index can slow a country's economic development.",
sk:"Women's status and development",
s:[["Name the general idea. What does a high GII mean for half the population?",["A high GII means women have less schooling, fewer paid jobs, and less political power than men.","If half the population can't fully contribute, the economy loses their skills and work."]],["Give a specific example of what women can't do, using Sulmani (GII 0.58) if you like.",["Girls leave school early; women can't get loans to start businesses; women aren't hired for paid jobs.","Teen births and early marriage keep young women out of school and work."]],["Explain how that leads to slower growth.",["Fewer workers and fewer educated people → less produced → lower incomes.","Educated working women also have fewer, healthier children, which raises the next generation's HDI."]]],
r:{m:"all",i:[["Names a specific barrier women face: schooling, paid jobs, loans/credit, property, political power, health, early marriage or childbirth",/school|educat|literacy|job|work|labor|labour|workforce|employ|business|loan|credit|vote|parliament|polit|health|maternal|pregnan|child|birth|fertil|marri|propert|\bland\b|\bown(s|ed|ing)?\b/i,"Name what women are kept from: school, paid jobs, loans to start businesses, or political power."],["Explains the effect on the economy: fewer workers or skills, less produced, lower incomes, slower growth",/less|fewer|half|lower|slow|lose|loss|waste|miss|smaller|reduc|shrink|product|income|gdp|gni|(can.t|cannot|won.t|doesn.t|don.t) grow|grow(s|th)? (slow|less)|less growth|\btax|spend|invest|poverty|poor|skill|workforce|worker/i,"Explain the payoff: shutting out half the population means fewer workers and skills, so less is produced and incomes grow more slowly."]]},
mo:"T1- A high Gender Inequality Index slows development because it keeps half the population from fully contributing to the economy. E2- In Sulmani (GII 0.58), many girls leave school early to marry, and few women hold paid jobs or can get loans to start businesses. A3- Because educated, working women earn income, have fewer and healthier children, and start businesses, shutting them out shrinks the workforce and the country's skills, so the economy grows more slowly than it could.",
b:["gii"],
th:"Isn't gender inequality a social issue, not an economic one?",
co:"It's both, and that's the point. Picture an economy that only lets half its people learn and work. Now ask: how much is it leaving on the table?",
kq:"How can treating women unequally make a whole country poorer? Explain ONE way.",
ml:["Why women's status drives development",["The Gender Inequality Index measures gaps between women and men in health, schooling, political power, and paid work. Lower is better.","When girls stay in school, they marry later, have fewer and healthier children, and earn more as adults.","When women can get loans, they start small businesses. Grameen Bank in Bangladesh pioneered microloans to women in the 1980s for exactly this reason.","Economists estimate that closing the gender gap in work would add trillions of dollars to the world economy.","So a high GII isn't just unfair; it means a country is wasting half its brainpower and labor."],[["Gender Inequality Index","A 0-to-1 UN score of the gap between women and men; lower is better."],["Microloan","A very small loan, often to a woman, to start or grow a tiny business."]]],
wk:["Gender inequality is bad for the economy.","That just restates the question. Name a specific thing women are kept from (school, jobs, loans) and explain how that leads to slower growth."],
mw:"It names the general idea (half the population shut out), gives a specific barrier (school, jobs, loans in Sulmani), and explains the chain to slower growth.",
fr:"T1- A high Gender Inequality Index slows development because ___. E2- For example, in Sulmani women ___. A3- This slows the economy because ___, which leads to ___.",
qc:["A LOWER Gender Inequality Index means…",["women and men are closer to equal","women have far fewer rights than men","the country has fewer women than men"],0,"On the GII, 0 is full equality, so lower is better."]},
{v:"Explain",
q:"Explain ONE economic risk for a country whose exports depend heavily on a single commodity.",
sk:"Commodity dependence",
s:[["Name the risk in general words. What does the country have no control over?",["Commodities are sold at a WORLD price the country can't set.","If the price crashes, so does the country's income. There's nothing to fall back on."]],["Give a specific example, using Tessar (85% petroleum) or a real case.",["Oil fell from over $100 a barrel in 2014 to under $30 in 2016, and crashed again in 2020.","Nigeria and Venezuela both rely on oil for most export earnings and both suffered deep crises when prices fell."]],["Explain the chain reaction inside the country.",["Export income falls → government budget shrinks → spending cuts, debt, lost jobs.","This is sometimes called the “resource curse.”"]]],
r:{m:"all",i:[["Names a risk: price shock or volatility, running out of the resource, falling demand, or the resource curse",/price|shock|crash|drop|fall|volatil|swing|fluctuat|run out|deplet|finite|curse|dutch|demand|boom|bust|replace|substitut|renewable|electric|climate|one product|single product|eggs/i,"Name the risk: the world price can crash (or the resource can run out), and the country can't control it."],["Explains the effect on the country: lost income or revenue, budget cuts, debt, unemployment, recession",/because|so |lead|income|revenue|money|budget|debt|unemploy|job|govern|econom|recession|collaps|lose|loss|suffer|hurt|crisis|cut|fall back|nothing else|no other/i,"Explain the damage: when the price falls, export income, government revenue, and jobs all fall at once."]]},
mo:"T1- Depending on one commodity is risky because the whole economy rises and falls with that product's world price, which the country cannot control. E2- Tessar gets 85% of its export earnings from petroleum, so if oil prices crash, as they did from over $100 a barrel in 2014 to under $30 in 2016, government revenue and jobs collapse at the same time. A3- Because the country has few other exports to fall back on, a price shock can lead to budget cuts, debt, and unemployment, which is one part of what geographers call the resource curse: resource-rich countries often end up less stable and less developed than expected.",
b:["commodity"],
th:"Oil is valuable. How is selling a lot of it a risk?",
co:"It's valuable until the day it isn't. Tessar doesn't set the price of oil; the world market does. Ask yourself what happens to a family budget when 85% of the paycheck can be cut in half overnight.",
kq:"Tessar earns almost all its export money from oil. What ONE economic danger does that create? Explain how it hurts the country.",
ml:["Putting all your eggs in one basket",["A commodity is a raw product sold at a world price: oil, copper, coffee, cocoa.","Commodity prices swing wildly. Oil went from over $100 a barrel in 2014 to under $30 in early 2016, and briefly collapsed again in 2020.","When 85% of exports are one product, a price crash cuts export income, government revenue, and jobs all at once.","Nigeria and Venezuela, both heavily dependent on oil, fell into deep recessions when prices dropped.","Geographers call this pattern the resource curse: rich in a resource, but poorer and less stable because of it."],[["Commodity","A raw product sold in bulk at a world price."],["Resource curse","When depending on one valuable resource leaves a country unstable and underdeveloped."]]],
wk:["Tessar should sell more things.","That's advice, not a risk. The question asks what could go WRONG: name the danger (a price crash) and explain how it hurts the country."],
mw:"It names the risk (price shock), gives proof (Tessar's 85% petroleum and the 2014–2016 oil crash), and traces the chain to budget cuts, debt, and job losses.",
fr:"T1- Depending on one commodity is risky because ___. E2- For example, Tessar ___, so if ___. A3- This hurts the country because ___, which leads to ___.",
qc:["A sudden drop in the world price of a country's main export is called a…",["price shock","trade surplus","tariff"],0,"A price shock is a sudden swing in a commodity's price, and it hits one-product economies hardest."]},
