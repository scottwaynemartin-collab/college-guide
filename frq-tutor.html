sk:"SEZs and industrialization",
s:[["Name what an SEZ does in general words.",["It's an area with special rules (low taxes, no tariffs, good roads and power) to attract foreign factories.","Think of Shenzhen in China or Mexico's maquiladoras."]],["Give specific proof of how that helps a farming country like Sulmani (62% in agriculture).",["Factories hire workers leaving farms, earn export money, and bring in technology and skills.","Shenzhen went from a fishing town of about 30,000 in 1980 to a city of 17 million."]],["Connect it to take-off, then add a downside. Use “however” or “but.”",["Take-off = a few fast-growing industries pull the economy out of farming.","Downsides: low wages, pollution, weak worker protections, companies leaving when tax breaks end."]]],
r:{m:"all",i:[["Explains what the SEZ offers or attracts: tax breaks, no tariffs, foreign investment, factories, jobs, exports, technology",/tax|tariff|duty|incentive|foreign|invest|fdi|compan|factor|manufactur|job|employ|export|infrastruct|technolog|skill|industr|secondary/i,"Say what an SEZ does: low taxes and no tariffs attract foreign factories that create jobs and exports."],["Connects it to take-off or industrial growth: moving workers out of farming, a new leading industry, faster growth",/take.?off|rostow|stage|industrial|manufactur|grow|develop|precondition|shift|move|leading sector|urban|secondary/i,"Connect it to Rostow: new factories pull workers out of farming and start the fast industrial growth of take-off."],["Identifies a downside: low wages, exploitation, pollution, weak protections, lost tax revenue, companies leaving, dependence on foreign firms",/\bbut\b|however|downside|negative|drawback|problem|risk|low(er)? (wage|pay)|paid (very |really )?(little|low)|cheap labou?r|exploit|pollut|environment|condition|sweatshop|lose|loss|(compan\w*|firms?|factor\w*|business\w*|they) (might |could |may |would |will |can )?(leave|move|pull out|relocate)|leave (when|if|for)|unstable|dependen|revenue|\bfew\b|unequal|rights|union|foreign (control|own)|profit/i,"Add a downside: for example, wages are often low, pollution rises, or companies leave when the tax breaks end."]]},
mo:"T1- A special economic zone could help Sulmani start to industrialize by attracting foreign factories. E2- Inside the zone, the government offers low taxes, no tariffs on imported parts, and ready-built roads and power, so multinational companies open clothing or electronics plants that hire workers leaving farms, much as the Shenzhen SEZ turned a fishing town into a manufacturing giant. A3- Those factories create a new leading sector, export earnings, and job skills that can push Sulmani from Rostow's traditional stage toward take-off; however, the downside is that wages are often low and labor and environmental rules are weak, and if the tax breaks end the companies may simply move to a cheaper country.",
b:["sez","rostow","sectors"],
th:"This question has two parts. Do I need both?",
co:"Yes, both, and that's good news: the downside is the easy half. Explain the help first (factories, jobs, exports), then flip it with “however…” and name one cost.",
kq:"How could a special economic zone kick-start factories in Sulmani and move it toward take-off? And what's one thing that could go wrong?",
ml:["SEZs: a shortcut to take-off?",["A special economic zone is an area with special rules to attract foreign factories: low taxes, no tariffs on imported parts, less red tape, and good roads, ports, and power.","Export processing zones are SEZs focused on assembling goods for export, like Mexico's maquiladoras near the U.S. border.","China opened Shenzhen as its first SEZ in 1980; it grew from about 30,000 people to over 17 million and helped launch China's industrial take-off.","For a farming country like Sulmani, factories pull workers out of agriculture into the secondary sector, bring export income, and teach new skills, which is what Rostow's take-off needs.","But SEZs can mean low wages, long hours, pollution, little tax revenue for the host country, and factories that leave when a cheaper country offers a better deal."],[["Special economic zone","An area with lower taxes and looser rules to attract foreign factories."],["Take-off","Rostow's stage when a few industries grow fast and the economy starts to industrialize."],["Export processing zone","An SEZ where factories assemble goods mainly for export."]]],
wk:["An SEZ would give Sulmani factories and jobs.","That's a start, but it stops too early. Connect the factories to take-off (workers leave farms, industry grows fast) AND name one downside."],
mw:"It explains what the zone offers (tax breaks, infrastructure, foreign factories), connects it to take-off (new leading sector pulling workers from farms), and names a clear downside (low wages, companies leaving).",
fr:"T1- A special economic zone could help Sulmani by ___. E2- For example, the zone would offer ___, so companies would ___. A3- This moves Sulmani toward take-off because ___; however, one downside is ___.",
qc:["Which is a typical feature of a special economic zone?",["Lower taxes and tariffs to attract foreign factories","A ban on all foreign companies","Higher taxes to pay for schools"],0,"SEZs relax the normal rules (taxes, tariffs, paperwork) so that foreign firms will build factories there."]},
{v:"Explain",
q:"Explain ONE limitation of using the data in the table to compare the quality of life of people in these four countries.",
sk:"Data limits and scale",
s:[["What kind of numbers are these? Who do they describe, exactly?",["Every number is a NATIONAL average for one year.","An average can hide huge gaps: rich vs. poor regions, city vs. countryside, men vs. women."]],["Pick a country and show what the average might be hiding.",["Tessar: $31,400 per person on average, but a small oil elite could be very rich while rural families and women (GII 0.50) live on far less.","Or: Sulmani's farmers may grow and trade food that never shows up in GNI (the informal economy)."]],["Explain why that makes comparing quality of life risky.",["Two countries with similar numbers could feel very different to live in.","You'd need data at a smaller scale (regions, cities, genders) to compare fairly."]]],
r:{m:"all",i:[["Names a limitation: national averages hide regional/urban-rural/gender/rich-poor gaps, informal economy not counted, only one year, PPP issues, or quality of life factors not measured",/average|hide|hidden|mask|gap|inequal|distribut|rich (and|vs\.?|versus|or) poor|poor (and|vs\.?|versus|or) rich|between (the )?(rich|poor|regions|cities|men|women|urban|rural|groups)|different (regions|parts|areas|groups|people)|parts of the country|urban.{0,15}rural|rural.{0,15}urban|cit(y|ies).{0,15}countryside|gender gap|one year|single year|only (one|a single|2023)|snapshot|over time|informal|unpaid|not counted|uncount|black market|\bppp\b|exchange rate|cost of living|happiness|happy|freedom|human rights|environment|pollut|safety|crime|scale|individual|each person|most people/i,"Name the limitation: these are national averages for one year, so they hide gaps between regions, cities and countryside, and men and women."],["Explains why it misleads, ideally with an example from the table",/because|so |mislead|wrong|example|even though|but|tessar|sulmani|kovar|ardena|could|might|may|can.t|cannot|not tell|don.t know/i,"Explain with an example: Tessar's $31,400 average could mean a rich oil elite and poor rural villages, so the average doesn't tell you how most people live."]]},
mo:"T1- One limitation is that every number in the table is a national average for a single year, which hides differences between groups inside each country. E2- For example, Tessar's $31,400 GNI per capita is an average: a small oil elite in the capital may be extremely rich while rural families and women (GII 0.50) live on far less, and Kovar's 55% service workers may be concentrated in a few big cities. A3- Because the averages flatten the gaps between rich and poor regions, genders, and the formal and informal economy, two countries with similar numbers could offer very different lives, so you would need data at a smaller scale to compare quality of life fairly.",
b:["devmeasures","scale"],
th:"But the table HAS the data. What's the limit?",
co:"The table has six numbers per country, and each one is an average of millions of lives. Zoom in: does a farmer in Tessar's countryside live like someone in its oil capital? The average says yes. Reality probably says no.",
kq:"Why can't these six numbers tell you how good life really is in each country? Explain ONE reason, with an example.",
ml:["What averages hide",["GNI per capita, HDI, and the other indicators here are national averages: one number for a whole country, for one year.","Averages hide gaps. A country can have a wealthy capital city and desperately poor rural regions and still show a middling average.","They also miss the informal economy: farming for your own family, street vending, and unpaid work at home don't show up in GNI.","Quality of life also includes things no column here measures: safety, clean air, political freedom, and happiness.","Geographers fix this by changing scale: compare regions, cities, or genders instead of whole countries, and look at more than one year."],[["National average","One number for a whole country, which can hide big differences inside it."],["Informal economy","Work that isn't officially recorded or taxed, so it's missing from GNI."],["Scale","The level you're looking at: global, national, regional, or local."]]],
wk:["The table only has four countries.","That's about how many rows there are, not about what the numbers can tell you. Explain what the averages hide, like gaps between rich and poor regions or men and women."],
mw:"It names the limitation (national averages for one year), shows what they hide with a specific example (Tessar's oil elite vs. rural families), and explains why that makes comparing quality of life unreliable.",
fr:"T1- One limitation is that the numbers in the table are ___, which hide ___. E2- For example, ___. A3- This is a problem because ___, so ___.",
qc:["A country's GNI per capita is $31,400. What does that tell you about a typical rural family there?",["Not much; it's a national average that can hide big gaps","Exactly how much the family earns","That the family has a high quality of life"],0,"Per capita means divided by population. It's an average, and averages can hide huge differences inside a country."]}
]});
addBG({
u7n_weber:{t:"Weber's least-cost theory",s:["Alfred Weber's least-cost theory (1909) says a factory locates where its total costs are lowest.","His three factors: transportation (moving raw materials in and products out), labor (wages), and agglomeration (savings from clustering near similar firms).","Transportation usually matters most. Weber drew it as a triangle between two raw-material sources and one market."]},
u7n_bulk:{t:"Bulk-reducing, bulk-gaining & break-of-bulk",s:["A bulk-reducing (weight-losing) industry makes a product lighter than its inputs, so it locates near its raw materials, like copper smelting.","A bulk-gaining industry makes a product heavier, so it locates near its market, like soft-drink bottling, which adds water.","A break-of-bulk point, like a seaport, is where goods switch from one kind of transportation to another. Factories locate there to avoid loading and unloading twice."]},
u7n_indrev:{t:"The Industrial Revolution",s:["The Industrial Revolution, the shift from hand tools to machines powered by water and steam, began in Great Britain in the late 1700s.","Britain had coal and iron, capital from trade and colonies, rivers and canals, and workers pushed off farms by the Agricultural Revolution.","It spread to Western Europe and the U.S. in the early 1800s, Japan after 1868, and after World War II to newly industrialized countries like South Korea, then China."]},
u7n_deind:{t:"Deindustrialization & the Rust Belt",s:["Deindustrialization is the loss of factory jobs in a region that once depended on them, like the U.S. Rust Belt around the Great Lakes.","U.S. factory jobs peaked at about 19.5 million in 1979, then fell by about a third because of automation, offshoring, and foreign competition.","Some Rust Belt cities, like Pittsburgh, shifted to service and quaternary jobs in hospitals, universities, and tech."]},
u7n_nidl:{t:"The new international division of labor",s:["The new international division of labor (NIDL) splits the steps of making one product among different countries.","Design, research, and marketing usually stay in wealthy core countries, while assembly moves to lower-wage countries.","Nike designs shoes in Oregon but has them made in Vietnam, Indonesia, and China, through outsourcing (hiring other companies) and offshoring (moving work abroad)."]},
u7n_micro:{t:"Microloans",s:["A microloan is a very small loan, often a few hundred dollars or less, for people too poor to borrow from regular banks.","Muhammad Yunus founded Grameen Bank in Bangladesh in 1983. About 97 percent of its borrowers are women, and he and the bank won the 2006 Nobel Peace Prize.","Critics warn about high interest rates and tiny businesses that never grow, so microloans can't end poverty alone."]},
u7n_ecotour:{t:"Ecotourism",s:["Ecotourism is travel to natural areas that aims to protect the environment and benefit local people.","Costa Rica protects about a quarter of its land in parks and reserves. Rwanda charges $1,500 for a mountain gorilla permit and shares park revenue with nearby villages.","Drawbacks: crowds damage fragile places, flights add carbon emissions, and profits can leak away to foreign-owned companies."]},
u7n_sdg:{t:"The UN Sustainable Development Goals",s:["Sustainable development means meeting today's needs without harming future generations' ability to meet theirs.","In 2015, UN members adopted 17 Sustainable Development Goals (SDGs) for 2030, like no poverty (Goal 1), gender equality (Goal 5), decent work (Goal 8), and life on land (Goal 15).","Microloans to women support Goals 1 and 5; well-run ecotourism supports Goals 8 and 15."]}
});
addFRQ({k:"Practice FRQ · No stimulus",
t:"The Factory Floor",
d:"Weber's least-cost theory, the Industrial Revolution, the Rust Belt, microloans, and ecotourism.",
u:"Unit 7",
fmt:"No stimulus (like Question 1)",
intro:"Every factory sits where it does for a reason: close to its raw materials, its customers, or cheap workers. When those costs change, whole industries move, and the places they leave behind have to find a new way to make a living.",
stim:"",
bg:["u7n_weber","u7n_indrev","u7n_deind","tea"],
nt:[["What do you already know about why a factory gets built in one place and not another?","Factories go where total costs are lowest. Weber's least-cost theory names three factors: transportation, labor (wages), and agglomeration (clustering near similar firms). Heavy stuff is costly to ship, so transportation usually matters most."],["What do you already know about where the Industrial Revolution started and where it spread?","It began in Great Britain in the late 1700s with coal, iron, steam engines, and cotton mills. It spread to Western Europe and the U.S. in the early 1800s, Japan after 1868, and later to newly industrialized countries like South Korea, then China."],["What do you already know about the Rust Belt? Where is it, and why that name?","It's the old factory region of the U.S. Northeast and Midwest: Detroit, Pittsburgh, Youngstown. Starting in the 1970s, many steel mills and auto plants closed, leaving rusting factories behind. That's deindustrialization."]],
m:20,
p:[
{v:"Identify",
q:"Identify ONE of the three location factors in Alfred Weber's least-cost theory of industrial location.",
sk:"Weber's least-cost theory",
s:[["Remember Weber's big idea: a factory locates where its total costs are lowest. Which costs?",["Think: moving stuff, paying people, and who the factory's neighbors are.","One factor is about shipping, one about workers, one about clustering."]],["Name ONE of the three. One is enough.",["Shipping = transportation. Wages = labor. Clustering = agglomeration."]]],
r:{m:"any",i:[["Transportation costs",/transport|shipping|\bship|freight|distance/i,"Name transportation costs: moving raw materials in and products to market."],["Labor costs",/labou?r|wage|worker|workforce/i,"Or name labor costs: what the factory pays its workers."],["Agglomeration",/agglomerat|cluster|(near|close to) (other|similar)/i,"Or name agglomeration: the savings from clustering near similar companies."]]},
mo:"Transportation costs: the cost of moving raw materials to the factory and finished products to the market.",
b:["u7n_weber"],
th:"I remember Weber had a triangle, but what were his three factors again?",
co:"You've got the triangle right! Weber asked: where is it cheapest to make this product? Think shipping, wages, and who the factory's neighbors are.",
kq:"Weber said factories go where costs are lowest. Name ONE of his three cost factors.",
ml:["Weber's least-cost theory",["Alfred Weber said in 1909 that a factory locates where its total costs are lowest.","Transportation (moving raw materials in and goods out) usually matters most, but much cheaper labor elsewhere can pull a factory away.","Agglomeration means firms save money by clustering near similar firms, like tech companies in Silicon Valley."],[["Least-cost theory","Weber's idea that factories locate where their total costs are lowest."],["Agglomeration","The clustering of similar businesses in one area so they can share resources and save money."]]],
wk:["Good weather and cheap land.","Those can matter to real companies, but they aren't Weber's factors. Name one of his three: transportation, labor, or agglomeration."],
mw:"It names one of Weber's three factors exactly and adds a few words showing what it means.",
fr:"One location factor in Weber's least-cost theory is ___.",
qc:["Which is one of the three factors in Weber's least-cost theory?",["Agglomeration","Climate","Population density"],0,"Weber's three factors are transportation, labor, and agglomeration."]},
{v:"Describe",
q:"Describe why a bulk-reducing (weight-losing) industry, such as copper smelting, usually locates near its source of raw materials.",
sk:"Bulk-reducing industries",
s:[["Name the general idea. What happens to the weight during processing?",["The finished product weighs much less than the raw materials that went in."]],["Give specific proof about copper.",["Copper ore is usually about 1 percent copper or less. The rest is waste rock.","Crushing and smelting strip away the waste, so the copper is a tiny fraction of the ore's weight."]],["Describe why a spot near the mine is cheapest.",["Why pay to ship tons of waste rock? Process it near the mine and ship only the copper."]]],
r:{m:"all",i:[["Says the finished product weighs less than the raw materials, because waste is removed",/weigh|heav|bulk|lighter|\blight|\blos[eist]|waste|rock|smaller|1 ?%|one percent|impurit/i,"Say what happens: processing removes waste, so the finished copper weighs far less than the ore."],["Describes the payoff: processing near the mine cuts transportation (shipping) costs",/transport|\bship|freight|haul|\bmov(e|ing)|carry|truck|rail/i,"Describe the payoff: processing near the mine means you don't pay to ship waste rock, so transportation costs stay low."]]},
mo:"T1- A bulk-reducing industry locates near its raw materials because its finished product weighs much less than its inputs. E2- Copper ore is usually about 1 percent copper or less, so mills and smelters near mines in places like Arizona and Chile remove tons of waste rock to get a little metal. A3- Processing near the mine means only the lighter copper gets shipped, not heavy waste rock, which keeps transportation costs low.",
b:["u7n_bulk","u7n_weber"],
th:"Weight-losing? How does a factory lose weight?",
co:"Ha, not on a treadmill! The product that comes OUT weighs way less than the raw stuff that goes IN. Would you rather ship a truckload of rock, or just the bit of copper inside it?",
kq:"Why do copper smelters get built near copper mines? Describe the reason, using weight.",
ml:["Bulk-reducing vs. bulk-gaining",["A bulk-reducing industry makes a product that weighs less than its raw materials, so it locates near them. Copper ore is about 1 percent copper or less.","A bulk-gaining industry does the opposite: soft-drink bottlers add water, so they locate near customers (the market).","Either way, the goal is to keep transportation costs low."],[["Bulk-reducing industry","An industry whose final product weighs less than its inputs, so it locates near raw materials."],["Bulk-gaining industry","An industry whose final product weighs more than its inputs, so it locates near the market."]]],
wk:["Copper smelters are built near copper mines because that is where the copper is.","That's circular. Describe WHY: the ore loses most of its weight in processing, so shipping it unprocessed wastes money."],
mw:"It names the idea (the product weighs far less than the ore), gives proof (about 1 percent copper), and describes the payoff (cheaper shipping).",
fr:"T1- A bulk-reducing industry locates near its raw materials because ___. E2- For example, copper ore ___. A3- This saves money because ___.",
qc:["Which industry is bulk-GAINING and usually locates near its market?",["Soft-drink bottling","Copper smelting","Lumber milling"],0,"Bottlers add water, making the product heavier, so they locate near customers."]},
{v:"Explain",
q:"Explain ONE reason the Industrial Revolution began in Great Britain in the 1700s.",
sk:"Origins of the Industrial Revolution",
s:[["Name a reason in general words. What did Britain HAVE that factories need?",["Coal and iron, capital from trade and colonies, rivers and canals, and lots of workers."]],["Give specific proof.",["Coal fueled James Watt's improved steam engines, and iron built the machines.","Or: the Bridgewater Canal (1761) carried coal to Manchester and cut its price there roughly in half."]],["Explain HOW that let industry start in Britain first.",["Cheap fuel and iron → steam-powered factories. Money from colonial trade → investment in new mills."]]],
r:{m:"all",i:[["Names a reason: coal, iron, capital, colonies, rivers/canals, workers, inventions, or political stability",/coal|iron|resource|capital|money|wealth|invest|colon|empire|trade|river|canal|coast|labou?r|worker|agricultur|enclosure|invent|steam|stab|cotton|market/i,"Name a reason: Britain had plenty of coal and iron, money from colonial trade, or rivers and canals to move goods."],["Explains how it helped industry start: powered machines, paid for factories, or moved goods cheaply",/because|so |which|led|lead|allow|power|fuel|build|built|pay|fund|invest|gave|give|help|enabl|could|cheap|move|ship|transport|sell|suppl|provid/i,"Explain HOW: for example, coal fueled steam engines and iron built machines, so factories could run there first."]]},
mo:"T1- One reason the Industrial Revolution began in Great Britain is that it had large deposits of coal and iron ore. E2- Coal fueled the steam engines James Watt improved in the 1760s and 1770s, iron built the machines, and canals like the Bridgewater Canal (1761) moved coal cheaply to Manchester. A3- Because fuel and metal were cheap and close by, British owners could build steam-powered factories before any other country.",
b:["u7n_indrev"],
th:"Wasn't it just because Britain invented the steam engine?",
co:"That's part of it, but why did inventors succeed THERE? Look for what Britain had lying around: fuel, metal, money, water routes, and workers.",
kq:"Why did factories and machines take off in Britain before anywhere else? Explain ONE reason.",
ml:["Why Britain went first",["Britain had coal and iron ore: coal fueled steam engines and iron built the machines.","Colonies and trade supplied raw cotton, profits to invest (capital), and markets; rivers and canals made shipping cheap.","The Agricultural Revolution pushed rural workers off the land and into factory jobs."],[["Industrial Revolution","The shift from making goods by hand to making them with machines and new power sources like steam."],["Capital","Money saved up and invested to build businesses, like factories and machines."]]],
wk:["The Industrial Revolution started in Britain because Britain was rich and powerful.","Too vague. Name the specific advantage (coal and iron, colonial trade, canals) and explain how it helped factories start."],
mw:"It names an advantage (coal and iron), gives proof (Watt's steam engines, the Bridgewater Canal), and explains how it let factories start there first.",
fr:"T1- One reason the Industrial Revolution began in Great Britain is ___. E2- For example, ___. A3- This let industry start there first because ___.",
qc:["Which advantage helped Britain industrialize first?",["Large deposits of coal and iron ore","A huge supply of oil","Cheap electricity from dams"],0,"Coal powered steam engines and iron built machines. Oil and electricity came later."]},
{v:"Explain",
q:"Explain ONE cause of deindustrialization in the Rust Belt of the United States since the 1970s.",
sk:"Causes of deindustrialization",
s:[["Name a cause in general words. Why would factory jobs disappear?",["Big causes: automation, offshoring to lower-wage countries, and global competition."]],["Give specific proof.",["Robots now do much of the welding and painting on car assembly lines.","Or: after NAFTA (1994) many plants moved to Mexico, and after China joined the World Trade Organization (2001) many moved there."]],["Explain HOW that led to fewer Rust Belt factory jobs.",["Lower costs elsewhere (or machines doing the work) → Rust Belt plants close or lay off workers."]]],
r:{m:"all",i:[["Names a cause: automation, offshoring to lower-wage countries, or foreign competition",/automat|robot|machine|technolog|offshor|outsourc|overseas|abroad|another country|mexico|china|japan|foreign|import|competi|global|nafta|trade|sun ?belt|union/i,"Name the cause: automation (robots replacing workers), offshoring to lower-wage countries, or competition from cheaper imports."],["Explains how it cut Rust Belt jobs: lower costs elsewhere, fewer workers needed, plants closed or moved",/because|so |which|led|lead|cheap|lower|wage|cost|fewer|less|replac|clos|shut|\bmov|relocat|laid off|layoff|lost|cut|unemploy/i,"Explain HOW: for example, robots do the work of many people, so plants need fewer workers and jobs disappear."]]},
mo:"T1- One cause of deindustrialization in the Rust Belt is offshoring: companies moved factory work to countries where labor costs much less. E2- After NAFTA (1994) and China's entry into the World Trade Organization (2001), many makers of auto parts and appliances opened plants in Mexico and China, where wages were far lower than in Ohio or Michigan. A3- Because the same products could be made more cheaply abroad, companies closed or shrank Rust Belt plants, which led to the loss of hundreds of thousands of factory jobs.",
b:["u7n_deind","u7n_nidl"],
th:"Didn't the factories just close because people stopped buying American stuff?",
co:"Foreign competition is a real cause! Push further: WHY could other countries sell for less? Follow one cause all the way to lost jobs.",
kq:"Why did so many factory jobs disappear from cities like Detroit and Pittsburgh? Explain ONE cause.",
ml:["Why the factory jobs left",["Automation: robots do many factory tasks, so U.S. factories make far more than in 1980 with millions fewer workers.","Offshoring: companies moved production to lower-wage countries, like Mexico after NAFTA (1994) and China after it joined the WTO (2001).","Global competition: in the 1970s and 1980s, Japanese cars and cheaper foreign steel took customers from U.S. automakers and mills."],[["Deindustrialization","The loss of manufacturing jobs and factories in a region."],["Automation","Using machines, robots, and computers to do work people used to do."],["Offshoring","Moving production or other work to another country."]]],
wk:["The factories got old and rusty.","That describes the Rust Belt, not its cause. Name a real cause (automation, offshoring, or foreign competition) and explain how it cost jobs."],
mw:"It names a cause (offshoring), gives specific proof (NAFTA, China joining the WTO), and explains how that cost Rust Belt jobs.",
fr:"T1- One cause of deindustrialization in the Rust Belt is ___. E2- For example, ___. A3- This cut factory jobs because ___, which led to ___.",
qc:["Replacing assembly-line workers with robots is an example of…",["automation","agglomeration","offshoring"],0,"Automation means machines do work people used to do, so plants need fewer workers."]},
{v:"Explain",
q:"Using ONE real Rust Belt city as an example, explain ONE economic or social effect of deindustrialization on that city.",
sk:"Effects of deindustrialization",
s:[["Pick a real city and name an effect in general words.",["Detroit, Youngstown, Pittsburgh, or Cleveland. Effects: job loss, people moving away, a shrinking tax base, empty buildings."]],["Give specific proof about that city.",["Detroit fell from about 1.85 million people in 1950 to about 640,000 in 2020.","Youngstown lost about 5,000 steel jobs when its Campbell Works mill closing was announced in 1977."]],["Explain the chain from closed factories to that effect.",["Plants close → workers lose jobs → families move away → less tax money → cuts to police, schools, and streetlights."]]],
r:{m:"all",i:[["Names an effect: job loss, population loss, a shrinking tax base, vacant buildings, or a shift to service jobs",/job|unemploy|work|population|\bleft\b|\bleav|mov(ed|ing) away|migrat|declin|shrink|tax|bankrupt|service|vacan|abandon|empty|brownfield|poverty|poor|crime|hospital|universit/i,"Name the effect: job loss, people moving away, a shrinking tax base, empty buildings, or a shift to service jobs."],["Uses a real Rust Belt city as the example",/detroit|youngstown|pittsburgh|cleveland|flint|gary|buffalo|toledo|akron|dayton|milwaukee|chicago|scranton|erie|rochester|bethlehem|baltimore|canton/i,"Name a real city, like Detroit or Youngstown."],["Explains how losing factories caused the effect",/because|so |which|led|lead|caus|result|after|when|clos|shut|laid off|layoff/i,"Explain the chain: plants closed, so workers lost jobs and moved away, so the city lost tax money."]]},
mo:"T1- One effect of deindustrialization on Detroit, Michigan, was a huge loss of population, which shrank the city's tax base. E2- As auto plants closed or moved away, workers lost their jobs and left: Detroit fell from about 1.85 million people in 1950 to about 640,000 in 2020, leaving tens of thousands of houses vacant. A3- Because far fewer people and businesses paid taxes, the city struggled to pay for streetlights and police, which helped push Detroit into bankruptcy in 2013.",
b:["u7n_deind"],
th:"Do I have to know a specific city? I just know a lot of factories closed.",
co:"You already know one: Detroit, the Motor City! Then follow the dominoes: plants close, workers lose jobs, families move away… what happens next?",
kq:"Pick a real Rust Belt city. What happened after its factories closed? Explain ONE effect and how it happened.",
ml:["After the factories close",["Economic effects: unemployment and a shrinking tax base, so the city has less money for schools, police, and streetlights.","Social effects: people move away, leaving vacant houses, polluted old factory sites (brownfields), and higher poverty. Youngstown, Ohio, shrank from about 170,000 people in 1950 to about 60,000.","Some cities reinvent themselves: Pittsburgh replaced steel jobs with service and quaternary jobs in hospitals, universities, and tech."],[["Tax base","The people and businesses in a place that pay taxes to fund local services."],["Brownfield","An abandoned industrial site that may be polluted and needs cleanup before reuse."]]],

function bossV(){const B=S.bo;if(!B)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p>3 lightning questions on what you just learned. Quick recall now helps you remember it next week.</p><div class="row"><button class="btn m" data-a="boss">Start Boss Round ▸</button></div></div>`;
if(B.k>=B.l.length)return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round</span><p class="big" style="font-size:20px">${B.r==B.l.length?'Boss defeated!':'Boss battle over!'}</p><p style="text-align:center">You got <b>${B.r}/${B.l.length}</b> on the first try.${B.r<B.l.length?' Come back tomorrow and replay. Spacing out practice is how memories stick.':''}</p></div>`;
const i=B.l[B.k],q=S.f.p[i].qc;return `<div class="panel boss"><span class="tag px" style="color:var(--mg)">Boss round · ${B.k+1}/${B.l.length}</span>${mcqV(q,B.s,(i+B.k+1)%3,'bq','')}${B.s===0||B.s>0?`<div class="row"><button class="btn m" data-a="bn">${B.k+1<B.l.length?'Next ▸':'Finish ▸'}</button></div>`:''}</div>`}
function exportTxt(){const n=S.f.p.length;return `${S.f.t} (${S.f.u}) · GeoArcade FRQ Tutor\nScore: ${score()}/${n}\n\n`+S.f.p.map((p,i)=>{const st=S.p[i];return `Part ${L(i)} (${p.v}): ${p.q}\nMy answer: ${st.a.trim()||'(blank)'}\nResult: ${st.done?(st.ok?'point earned':'not yet'):'not attempted'}\n`}).join('\n')}
function doneV(){const n=S.f.p.length,sc=score(),ps=S.f.p.map((p,i)=>[p,i,S.p[i]]),ok=ps.filter(x=>x[2].ok),no=ps.filter(x=>x[2].done&&!x[2].ok),un=ps.filter(x=>!x[2].done);
const rank=sc==n?"GEO LEGEND":sc>=5?"MAP MASTER":sc>=3?"RISING SCOUT":"KEEP PLAYING";
return `<div class="panel" style="text-align:center"><h2 class="big" tabindex="-1">${un.length?'Progress report':'Stage clear!'}</h2><div class="stars" aria-label="${sc} of ${n}">${'★'.repeat(sc)}<span style="opacity:.25">${'★'.repeat(n-sc)}</span></div><div class="rank">${sc}/${n} points · Rank: ${rank}</div></div>
<div class="panel"><span class="tag px" style="color:var(--gr)">Nailed it</span>${ok.length?`<ul class="res">${ok.map(([p,i])=>`<li><b style="color:var(--gr)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span></li>`).join('')}</ul>`:'<p class="note">No points yet. Every replay makes it easier!</p>'}</div>
<div class="panel"><span class="tag px" style="color:var(--rd)">Review these</span>${no.length?`<ul class="res">${no.map(([p,i])=>`<li><b style="color:var(--rd)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br>${chips(p.b)}<button class="link" data-a="go" data-k="${i+1}">Revisit Part ${L(i)}</button></li>`).join('')}</ul>`:'<p>Nothing to review so far. 🏆</p>'}</div>
${un.length?`<div class="panel"><span class="tag px" style="color:var(--yl)">Not tried yet</span><ul class="res">${un.map(([p,i])=>`<li><b style="color:var(--yl)">${L(i)}</b>${esc(p.sk)} <span class="note">(${p.v})</span><br><button class="link" data-a="go" data-k="${i+1}">Go to Part ${L(i)}</button></li>`).join('')}</ul></div>`:''}
<div class="panel"><span class="tag px">Turn it in</span><p>Nothing saves on this page. Copy your answers to paste into Canvas or a doc.</p><div class="row"><button class="btn c" data-a="copy">📋 Copy my answers</button><span class="note" id="cpmsg" role="status" aria-live="polite"></span></div><details class="peek" id="cpd"><summary>See the text</summary><div><textarea readonly id="cpt" aria-label="Your answers" style="min-height:200px">${esc(exportTxt())}</textarea></div></details></div>
${no.length?`<div class="row"><button class="btn c" data-a="retry">↻ Retry what I missed ▸</button></div>`:''}${bossV()}<div class="row"><button class="btn" data-a="start" data-i="${S.fi}">↻ Replay</button>${FRQ.length>1?`<button class="btn m" data-a="start" data-i="${(S.fi+1)%FRQ.length}">Try “${esc(FRQ[(S.fi+1)%FRQ.length].t)}” ▸</button>`:''}<button class="btn o" data-a="home">Menu</button></div>`}
let opener;function openBG(k){opener=document.activeElement;app.setAttribute('aria-hidden','true');document.getElementById('shT').textContent=BG[k].t;document.getElementById('shB').innerHTML=BG[k].s.map(x=>`<li>${esc(x)}</li>`).join('');sh.classList.add('on');sh.querySelector('[data-a=x]').focus()}
function closeBG(){if(!sh.classList.contains('on'))return;sh.classList.remove('on');app.removeAttribute('aria-hidden');opener&&opener.focus()}
document.addEventListener('click',e=>{if(e.target==sh)return closeBG();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(b.tagName=='INPUT'&&a=='box'){S.p[i].box[j]=b.checked;return render()}
switch(a){
case 'start':return start(i);
case 'home':S.k=-1;return render(1);
case 'go':return go(+b.dataset.k);
case 'bg':return openBG(b.dataset.k);
case 'x':return closeBG();
case 'nt':S.nt[j].o=1;return render();
case 'hint':{const k=S.k-1;S.p[k].h[j+'-'+b.dataset.m]=1;return render()}
case 'step':S.p[i].st++;return render();
case 'card':S.p[i].c=+b.dataset.c;return render(1);
case 'mcq':S.p[i].q=+b.dataset.o;return render();
case 'boss':{const f=S.p.map((x,k)=>k),miss=f.filter(k=>!S.p[k].ok),rest=f.filter(k=>S.p[k].ok);S.bo={l:miss.concat(rest).slice(0,3),k:0,s:null,r:0};return render()}
case 'bq':{const B=S.bo;if(B.s==null&&+b.dataset.o==0)B.r++;if(B.s!==0)B.s=+b.dataset.o;return render()}
case 'bn':S.bo.k++;S.bo.s=null;return render();
case 'frame':{const t=document.getElementById('ans'),f=S.f.p[i].fr;t.value=t.value.trim()?t.value.trim()+'\n'+f:f;S.p[i].a=t.value;t.focus();const c=t.value.indexOf('___',t.value.length-f.length);if(c>=0)t.setSelectionRange(c,c+3);return}
case 'ins':{const t=document.getElementById('ans');const pos=t.selectionStart??t.value.length;const pre=t.value.slice(0,pos),sp=pre&&!/\s$/.test(pre)?' ':'';t.value=pre+sp+b.dataset.t+t.value.slice(pos);S.p[S.k-1].a=t.value;t.focus();const c=(pre+sp+b.dataset.t).length;t.setSelectionRange(c,c);return}
case 'check':{const st=S.p[i],P=S.f.p[i];if(st.a.includes('___')){st.w=1;render();return document.getElementById('ans').focus()}st.w=0;if(st.a.trim().length<2){const t=document.getElementById('ans');t.placeholder='Type an answer first — even a rough one!';return t.focus()}
st.ck=1;st.c=5;st.g=P.r.i.map(r=>r[1].test(st.a));st.box=P.r.m=="any"?st.g.map((g,j)=>g&&st.g.indexOf(true)==j):st.g.slice();return render(1)}
case 'rev':S.p[i].ck=0;S.p[i].done=0;S.p[i].c=4;render(1);return document.getElementById('ans').focus();
case 'next':{const w=S.p[i].done;S.p[i].done=1;S.p[i].ok=earned(i);if(!w)S.cb=S.p[i].ok?S.cb+1:0;return go(i+2)}
case 'cf':S.p[i].cf=+b.dataset.k;return render();
case 'copy':{const m=document.getElementById('cpmsg'),t=exportTxt();const fail=()=>{document.getElementById('cpd').open=true;const ta=document.getElementById('cpt');ta.focus();ta.select();m.textContent='Select the text below and copy it.'};try{navigator.clipboard.writeText(t).then(()=>{m.textContent='✔ Copied! Now paste it into Canvas.'},fail)}catch(e){fail()}return}
case 'retry':{const m=S.p.findIndex(x=>x.done&&!x.ok);S.p[m].c=4;S.p[m].ck=0;S.p[m].done=0;return go(m+1)}
}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.in=='ans')S.p[+d.i].a=t.value;else if(d.in=='nt')S.nt[+d.j].a=t.value});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeBG();else if(e.key=='Tab'&&sh.classList.contains('on')){e.preventDefault();sh.querySelector('[data-a=x]').focus()}});
render(1);
</script>
</body>
</html>
