 in certain policy areas, while the Arctic Council mainly helps its members cooperate through research and recommendations. Other examples discussed under supranationalism are the United Nations, NATO, ASEAN, and the African Union.","whyNot":{"B":"That describes an empire or colonial power.","C":"That is an autonomous region inside one state.","D":"Parties are not governments and do not hold sovereignty.","E":"That is a multinational corporation; it may challenge sovereignty but it is not an organization of states."},"vocab":["supranational organization","European Union","United Nations","NATO"]},{"id":"U4-P26","topic":"4.9","lo":"SPS-4.B","skill":"2.C","difficulty":"medium","stem":"Which of the following best explains how membership in the European Union challenges the sovereignty of a member state?","options":{"A":"Citizens continue to choose representatives for their own national legislatures.","B":"National governments help negotiate changes to the EU's founding treaties.","C":"National governments continue to administer many public services within their territories.","D":"Members must comply with binding EU decisions where the treaties give EU institutions authority.","E":"Member states keep their own seats in the United Nations."},"answer":"D","explanation":"EU members keep their own governments, but through treaties they agree to give EU institutions authority over some decisions. In those areas, binding EU rules and court judgments can limit what a national government may do. That shared authority can challenge sovereignty even though the member remains an independent state.","whyNot":{"A":"National elections show that members keep their own governing institutions; they do not describe a limit imposed by EU membership.","B":"Helping negotiate treaties is national governments exercising authority, not a constraint on their policies.","C":"Continuing to run public services shows retained national responsibilities, not a limit.","E":"Keeping a separate UN seat shows continued statehood rather than a transfer of authority to the EU."},"vocab":["supranationalism","sovereignty","European Union"]},{"id":"U4-P27","topic":"4.9","lo":"SPS-4.B","skill":"3.E","difficulty":"medium","stem":"The table best illustrates which of the following outcomes of devolutionary pressures?","options":{"A":"supranationalism, in which states combine into a larger organization","B":"irredentism, in which a state claims its neighbor's territory","C":"the disintegration of states into new sovereign states","D":"the creation of autonomous regions within a unitary state","E":"neocolonialism, in which former colonial powers retain economic control"},"answer":"C","explanation":"Devolutionary pressures can give regions more power within a country, or they can lead to separate independent countries. Every row shows the second outcome. The Soviet Union, Yugoslavia, and Czechoslovakia broke apart into successor states. South Sudan became independent in 2011 while Sudan continued to exist. Some separations were negotiated peacefully; others followed armed conflict.","whyNot":{"A":"These states broke apart; they did not join together.","B":"Irredentism involves claiming another state's land; this is about states dividing internally.","D":"The regions became fully independent countries, not autonomous regions within a state.","E":"The table shows the formation of independent states; it gives no evidence of former colonial powers keeping economic control."},"vocab":["devolution","disintegration","Yugoslavia","Czechoslovakia"],"stimulus":{"type":"table","title":"SELECTED STATES THAT DIVIDED INTO NEW SOVEREIGN STATES","columns":["Original state","Years","Resulting sovereign states","How it happened"],"rows":[["Soviet Union","1991","15","Republics declared independence as the union dissolved; largely peaceful"],["Yugoslavia","1991–2006","6 (Slovenia, Croatia, Bosnia and Herzegovina, North Macedonia, Serbia, Montenegro)","Wars in several republics; Montenegro left by referendum in 2006"],["Czechoslovakia","1993","2 (Czech Republic, Slovakia)","Negotiated, peaceful split (the 'Velvet Divorce')"],["Sudan","2011","2 (Sudan, which continued, and newly independent South Sudan)","Referendum after decades of civil war"]],"source":"Compiled from publicly available historical data"}},{"id":"U4-P28","topic":"4.10","lo":"SPS-4.C","skill":"1.A","difficulty":"easy","stem":"Which of the following best describes centripetal forces?","options":{"A":"Forces that pull a state apart, such as ethnic conflict, uneven development, or separatist movements","B":"Forces that push a state to join supranational organizations","C":"Forces that unify a state and strengthen loyalty to it, such as a shared language or fair treatment of all regions","D":"Forces that cause people to migrate from rural areas to cities","E":"Forces that cause a state's boundaries to shift over time"},"answer":"C","explanation":"Think of a spinning merry-go-round. Centripetal forces pull toward the center and hold things together. In a country, these are things that make people feel united: a national anthem and flag, a shared language, a strong economy that benefits everyone, trusted institutions, or a common threat from outside. Centrifugal forces are the opposite: they fling things apart.","whyNot":{"A":"Those are centrifugal forces.","D":"That is urbanization, a population process.","E":"Boundary changes are not what centripetal means.","B":"Joining organizations is supranationalism, not a unifying force inside a state."},"vocab":["centripetal force","centrifugal force","nationalism"]},{"id":"U4-P29","topic":"4.10","lo":"SPS-4.C","skill":"3.E","difficulty":"medium","stem":"The changes shown in the graph and described in the text are best classified as","options":{"A":"centrifugal forces, because spending on one region highlights its differences from the rest of the state","B":"centripetal forces, because fair development and cultural recognition can increase the region's loyalty to the state","C":"ethnic cleansing, because they change the region's culture","D":"irredentism, because the government is claiming the region","E":"neocolonialism, because the government is investing in the region"},"answer":"B","explanation":"The Highland Region's investment rose from $300 to $1,100 per person. By 2025 it received more than the Coastal Region ($1,000) and nearly as much as the Capital Region ($1,250). New roads, schools, and hospitals can improve daily life and connect the region to the rest of the country, and recognizing the Highland language can help people feel included. Policies like these can strengthen loyalty to the country, so they can act as centripetal (unifying) forces. The stimulus does not show whether support for independence actually fell.","whyNot":{"A":"These policies can strengthen belonging by closing the investment gap and recognizing Highland culture; the stimulus does not show that they increased division.","D":"The region is already part of the state; no claim on another state's land is involved.","E":"Neocolonialism is outside economic control of another country, not a government investing at home.","C":"Ethnic cleansing is forcing a group out; this is the opposite."},"vocab":["centripetal force","equitable infrastructure development","cultural cohesion"],"stimulus":{"type":"bar","title":"NATIONAL GOVERNMENT INVESTMENT PER PERSON BY REGION, HYPOTHETICAL COUNTRY, 2015 AND 2025","categories":["Capital Region","Coastal Region","Highland Region"],"series":[{"name":"2015 (dollars per person)","values":[1200,900,300]},{"name":"2025 (dollars per person)","values":[1250,1000,1100]}],"yLabel":"Dollars per person","yMax":1400,"text":"The Highland Region is culturally distinct from the rest of the country, and a separatist party won 40 percent of its regional vote in 2015. In 2020 the national government recognized the Highland language as an official language and began building new highways, schools, and hospitals in the region.","source":"Hypothetical data"}},{"id":"U4-P30","topic":"4.10","lo":"SPS-4.C","skill":"2.C","difficulty":"hard","stem":"In a state where several ethnic groups each control militias, the central government has lost control of large areas, cannot collect taxes, and no longer provides basic services such as policing or schools. The most likely consequence of these centrifugal forces is that the state","options":{"A":"experiences rapid, equitable economic development","B":"becomes a nation-state","C":"joins a supranational organization to regain control","D":"becomes a failed state","E":"shifts from a federal to a unitary system"},"answer":"D","explanation":"A failed state is a country whose government has basically stopped working. It cannot keep order, protect its people, or provide services, and armed groups run parts of the territory. When centrifugal forces (ethnic conflict, stateless nations, uneven development) overwhelm a government, this is the result. Somalia in the 1990s is a textbook example.","whyNot":{"B":"Nation-state describes how closely a state's population matches one nation; this scenario is about a government losing control and failing to provide services.","C":"Joining an international organization would not, by itself, restore the government's authority over its territory, and nothing in the scenario points that way.","E":"Unitary and federal describe how power is formally divided; this scenario describes a government losing the ability to do its job, not a change in the constitution.","A":"Chaos drives away investment; uneven development gets worse, not better."},"vocab":["failed state","centrifugal force","uneven development"]},{"id":"U4-P31","topic":"4.5","lo":"IMP-4.B","skill":"2.C","difficulty":"medium","stem":"Two coastal states claim exclusive economic zones that overlap in a stretch of sea between them. Under the United Nations Convention on the Law of the Sea, their dispute is most likely to center on","options":{"A":"the right to collect tariffs on goods traded between the two states by land","B":"which state's language will be official on the coast","C":"rights to the fish, oil, and natural gas within the overlapping zone","D":"freedom of navigation for ships from other countries, which UNCLOS already guarantees in an exclusive economic zone","E":"the exact location of the demarcated land boundary between them"},"answer":"C","explanation":"An exclusive economic zone (EEZ) is mainly about the right to use and manage resources. Inside its EEZ a coastal state has exclusive rights to resources such as fish, oil, and natural gas, but ships from other countries can still pass through. So when two EEZs overlap, the fight is over who gets the resources. The South China Sea and the eastern Mediterranean both have disputes like this over fishing grounds and natural gas.","whyNot":{"A":"Tariffs can apply to goods arriving by sea too, but this dispute is about offshore resources, not taxes on imports.","B":"Official languages have nothing to do with EEZ claims.","D":"UNCLOS preserves navigation rights in EEZs; the overlapping claims here mainly raise a dispute over which coastal state may use and manage the resources.","E":"The dispute is at sea; a demarcated land boundary is not involved."},"vocab":["exclusive economic zone","UNCLOS","maritime boundary"]}],"exam":{"title":"Unit 4 Practice Exam: Political Patterns and Processes","timeMinutes":25,"questionCount":25,"directions":"Each of the questions or incomplete statements below is followed by five suggested answers or completions. Select the one that is best in each case. Your score is based only on the number of questions answered correctly, so answer every question. Work quickly without losing accuracy, and come back to any question you skipped if time allows.","stimulusCount":9,"questions":[{"id":"U4-E01","n":1,"topic":"4.1","lo":"PSO-4.A","skill":"1.C","difficulty":"easy","stem":"Which of the following best describes the difference between a nation and a state?","options":{"A":"A nation is a territory with defined borders, whereas a state is a group of people who share a culture.","B":"A nation is a group of people who share a common culture, history, and identity, whereas a state is a politically organized territory with a sovereign government.","C":"A nation always has a larger population than a state.","D":"A nation is a member of the United Nations, whereas a state is not.","E":"A nation is a subdivision of a state, such as a province or county."},"answer":"B","rationales":{"A":"Incorrect. This reverses the two terms. A state is the territory with borders and a government; a nation is the people with a shared identity.","B":"Correct. Nation refers to a people bound by shared culture, language, history, or identity. State refers to a territory with recognized borders and a sovereign government. The two can match (a nation-state) or not (a multinational state or a stateless nation).","C":"Incorrect. Population size has nothing to do with the distinction; some nations are tiny and some states are enormous.","D":"Incorrect. United Nations members are states, not nations, despite the organization's name.","E":"Incorrect. Provinces and counties are administrative subdivisions of a state; a nation is a cultural group."},"explanation":"Nation = people. State = place with a government. A nation is a group that feels like one people because of shared language, culture, or history. A state is what most of us call a 'country': land with borders and a government that rules it. The United Nations is really a club of states."},{"id":"U4-E02","n":2,"topic":"4.2","lo":"PSO-4.B","skill":"2.C","difficulty":"medium","stem":"In 1945 the United Nations had 51 member states. Today it has 193. Which of the following processes best explains most of this increase?","options":{"A":"The expansion of European colonial empires into Africa and Asia","B":"The merging of small states into supranational organizations such as the European Union","C":"The redrawing of boundaries at the Berlin Conference","D":"Independence movements asserting self-determination as European colonial empires dissolved after 1945","E":"The spread of federal systems of government"},"answer":"D","rationales":{"A":"Incorrect. Colonial expansion reduced the number of independent states by placing territories under European rule; its end, not its expansion, created new states.","B":"Incorrect. Supranational organizations group existing states together; they do not create new sovereign states.","C":"Incorrect. The Berlin Conference of 1884–1885 set rules for European colonial claims in Africa; most colonial boundaries were drawn later. These events did not cause the post-1945 increase in independent states.","D":"Correct. Between the late 1940s and the 1970s, dozens of colonies in Asia, Africa, and the Caribbean became independent states, claiming the right of self-determination. The breakup of the Soviet Union and Yugoslavia in the 1990s added more.","E":"Incorrect. Federalism is a way of organizing power inside a state; it does not create new sovereign states."},"explanation":"After World War II, the European empires fell apart. Colony after colony in Asia and Africa demanded the right to rule itself (self-determination) and became a new country. That is where most of the 140-plus new members came from. A second burst came in the early 1990s, when the Soviet Union and Yugoslavia broke up."},{"id":"U4-E03","n":3,"topic":"4.6","lo":"IMP-4.B","skill":"3.E","difficulty":"medium","set":"gerrymander","setLabel":"Questions 3–5 refer to the maps and table below.","stimulus":{"type":"districtMap","title":"VOTER SUPPORT BY PRECINCT AND THREE PROPOSED DISTRICT PLANS, HYPOTHETICAL REGION","note":"The region has 25 precincts of equal population arranged in a 5 × 5 grid. For this simplified model, each precinct is assumed to cast the same number of votes. Each precinct is labeled with the expected percentage of its votes for the Blue Party; all remaining votes go to the Orange Party. The region must be divided into five districts of five precincts each, and each district elects one representative. Precincts in the same district share a color/outline in each plan.","grid":{"rows":5,"cols":5,"blueShare":[[70,70,70,70,70],[70,70,70,70,70],[70,70,70,70,70],[35,35,35,35,35],[35,35,35,35,35]]},"plans":[{"name":"Plan 1","districts":[[[0,0],[0,1],[0,2],[0,3],[0,4]],[[1,0],[1,1],[1,2],[1,3],[1,4]],[[2,0],[2,1],[2,2],[2,3],[2,4]],[[3,0],[3,1],[3,2],[3,3],[3,4]],[[4,0],[4,1],[4,2],[4,3],[4,4]]]},{"name":"Plan 2","districts":[[[0,0],[1,0],[2,0],[3,0],[4,0]],[[0,1],[1,1],[2,1],[3,1],[4,1]],[[0,2],[1,2],[2,2],[3,2],[4,2]],[[0,3],[1,3],[2,3],[3,3],[4,3]],[[0,4],[1,4],[2,4],[3,4],[4,4]]]},{"name":"Plan 3","districts":[[[0,0],[0,1],[0,2],[0,3],[0,4]],[[1,0],[1,1],[1,2],[1,3],[1,4]],[[2,0],[2,1],[3,0],[4,0],[4,1]],[[2,2],[2,3],[3,1],[3,2],[3,3]],[[2,4],[3,4],[4,2],[4,3],[4,4]]]}],"resultsTable":{"title":"SEATS WON UNDER EACH PLAN","columns":["Plan","Districts won by Blue","Districts won by Orange"],"rows":[["Plan 1","3","2"],["Plan 2","5","0"],["Plan 3","2","3"]]},"regionWideBlueShare":56,"renderNotes":"Draw three 5×5 grids side by side (stack on phones). Fill each precinct light blue if blueShare ≥ 50, light orange otherwise, and print the number. Draw thick district outlines per plan (or tint each district). Show the results table under the maps. Region-wide Blue support is 56% (15 precincts × 70 + 10 precincts × 35, divided by 25); District winners: Plan 1 = rows 1–3 Blue (70%), rows 4–5 Orange (65%); Plan 2 = every column 56% Blue; Plan 3 = Districts 1–2 Blue (70%), Districts 3–4 Orange (51%), District 5 Orange (58%).","source":"Hypothetical data"},"stem":"In Plan 3, Districts 1 and 2 contain only precincts with 70 percent Blue support, while Blue voters elsewhere are left short of a majority. Districts 1 and 2 illustrate which gerrymandering technique?","options":{"A":"Cracking, because Blue voters are spread across many districts so that they fall short of a majority in each","B":"Reapportionment, because seats are being redistributed among states","C":"Annexation, because the region is adding new precincts","D":"Packing, because Blue voters are concentrated into a few districts that Blue wins by large margins","E":"Delimitation, because the districts are being drawn on a map for the first time"},"answer":"D","rationales":{"A":"Incorrect. Cracking divides a group's voters among districts where they are less able to win seats. In Plan 3 that describes Blue voters in Districts 3–5. Districts 1 and 2 instead concentrate Blue voters into districts Blue wins by large margins, which is packing.","B":"Incorrect. Reapportionment is the division of legislative seats among states after a census; it is not a district-drawing technique within a region.","C":"Incorrect. Annexation is the addition of territory to a political unit. No precincts are added here.","D":"Correct. Packing concentrates one party's supporters into a small number of districts. Blue wins Districts 1 and 2 with 70 percent, 'wasting' many Blue votes, so Blue has too few supporters in the other three districts to win them.","E":"Incorrect. Delimitation is the general step of drawing a boundary on a map; it does not describe the strategy of concentrating one party's voters."},"explanation":"Packing means stuffing as many of the other side's voters as you can into a couple of districts. Blue wins Districts 1 and 2 by a mile (70%), but all those extra Blue votes are wasted. That leaves Blue too weak everywhere else, so Orange wins the other three districts even though Orange has fewer voters overall."},{"id":"U4-E04","n":4,"topic":"4.6","lo":"IMP-4.B","skill":"2.C","difficulty":"medium","set":"gerrymander","stem":"Which plan would the Orange Party most likely favor, and why?","options":{"A":"Plan 1, because it gives each party a number of districts closest to its share of voters","B":"Plan 3, because Orange would win a majority of the districts even though only about 44 percent of the region's voters support Orange","C":"Plan 2, because Orange would win every district","D":"Plan 1, because Orange would win all five districts","E":"Plan 2, because districts drawn as straight columns cannot be gerrymandered"},"answer":"B","rationales":{"A":"Incorrect. Plan 1 gives Orange two seats, while Plan 3 gives Orange three, so Orange would gain more seats under Plan 3.","B":"Correct. Under Plan 3, Orange wins Districts 3, 4, and 5 (three of five seats) despite being supported by only 44 percent of the region's voters. If Orange's goal is to maximize its projected seats, Plan 3 is its preferred option.","C":"Incorrect. In Plan 2 every column is 56 percent Blue, so Blue, not Orange, wins all five districts.","D":"Incorrect. Under Plan 1, Orange wins only Districts 4 and 5.","E":"Incorrect. Plan 2 gives Blue all five districts with a 56 percent vote share, so straight, simple district shapes do not guarantee a proportional outcome."},"explanation":"Count the seats in the table. Plan 3 gives Orange 3 of 5 seats even though Orange has only about 44% of the votes. Assuming Orange's goal is to win the most seats, it would prefer Plan 3. Notice that Plan 2 also gives Blue a big advantage: Blue wins all five districts with 56% of the votes. The results alone cannot tell us whether a plan was drawn on purpose to create that advantage, but they show how much district lines matter."},{"id":"U4-E05","n":5,"topic":"4.6","lo":"IMP-4.B","skill":"3.F","difficulty":"hard","set":"gerrymander","stem":"Which of the following is a limitation of using these maps to predict the actual outcome of an election in the region?","options":{"A":"The plans contain districts with unequal numbers of precincts, so their populations cannot be compared.","B":"The maps omit the number of representatives per district, so seat totals cannot be calculated.","C":"The plans use different region-wide vote shares, so their seat totals cannot be compared directly.","D":"The maps omit precinct-level party support, so the closeness of district races cannot be estimated.","E":"The estimates hold turnout and party support constant, so actual voting could change the results of close races."},"answer":"E","rationales":{"A":"Incorrect. Every district contains five precincts, and the stimulus states that precinct populations are equal.","B":"Incorrect. The stimulus states that each district elects one representative.","C":"Incorrect. All three plans use the same precincts and support percentages; only the district boundaries change.","D":"Incorrect. Each precinct is labeled with its expected Blue vote share.","E":"Correct. Turnout and voter preferences may differ from the assumptions, which matters most in districts with narrow projected margins such as Plan 3's Districts 3 and 4 (51 percent Orange)."},"explanation":"A precinct labeled '35% Blue' is an estimate for a whole group of people. On election day, maybe more Blue voters show up than Orange voters, or some people change their minds. Districts 3 and 4 in Plan 3 are only 51% Orange, so a small change in turnout could flip them. The map is a model; real elections have real people."},{"id":"U4-E06","n":6,"topic":"4.3","lo":"PSO-4.C","skill":"1.D","difficulty":"easy","stem":"About one-fifth of the world's oil consumption passes through the Strait of Hormuz, which narrows to roughly 35 kilometers (about 21 miles) at its narrowest point. Which of the following concepts best explains why control of, or threats to, this passage give nearby states influence far beyond their size?","options":{"A":"Choke point","B":"Shatterbelt","C":"Relict boundary","D":"Exclusive economic zone","E":"Buffer state"},"answer":"A","rationales":{"A":"Correct. A choke point is a narrow passage, such as a strait or canal, through which a large volume of traffic must pass. Whoever can control or disrupt it gains strategic and economic power over everyone who depends on it.","B":"Incorrect. A shatterbelt is a region of fragmented, unstable states caught between competing larger powers; it describes a land region, not a narrow sea passage.","C":"Incorrect. A relict boundary is a former boundary that no longer functions but remains visible on the landscape.","D":"Incorrect. An exclusive economic zone is a 200-nautical-mile maritime zone of resource rights; it does not explain the strategic importance of a narrow passage.","E":"Incorrect. A buffer state is a country positioned between two rival powers to reduce direct conflict between them."},"explanation":"A choke point is a bottleneck. Huge amounts of oil have to squeeze through one narrow strait. If a country near the strait can block or threaten it, every oil-importing country in the world has to pay attention. That is power that comes from location, not from size or wealth."},{"id":"U4-E07","n":7,"topic":"4.4","lo":"IMP-4.A","skill":"1.D","difficulty":"medium","stem":"A boundary was drawn through a sparsely populated rainforest before significant settlement occurred. As settlers later moved into the area, their communities developed on either side of the existing line. This boundary is best classified as","options":{"A":"relict","B":"superimposed","C":"antecedent","D":"consequent","E":"subsequent"},"answer":"C","rationales":{"A":"Incorrect. A relict boundary has ceased to function; this boundary is still in use.","B":"Incorrect. The stem emphasizes that the boundary came before the later settlement pattern; it does not describe an outside power imposing a line across existing cultural divisions.","C":"Correct. An antecedent boundary is established before the cultural landscape develops ('ante' means before). The boundary between Malaysia and Indonesia on the island of Borneo is a commonly cited example.","D":"Incorrect. A consequent boundary is drawn to accommodate existing cultural differences, which requires that people already live there.","E":"Incorrect. A subsequent boundary is drawn after settlement to fit the cultural pattern that developed."},"explanation":"Antecedent means 'came before.' This boundary was set before the later settlement pattern developed, and new communities formed on either side of it. A subsequent boundary is drawn later to fit how people already live, and a superimposed boundary is forced on top of people without regard to the cultural groups already there."},{"id":"U4-E08","n":8,"topic":"4.7","lo":"IMP-4.D","skill":"2.A","difficulty":"medium","stem":"Which of the following best describes the spatial organization of political power in a unitary state compared with a federal state?","options":{"A":"In a unitary state, regional governments hold powers protected by the constitution that the central government cannot remove.","B":"In a unitary state, power is dispersed among many regional capitals that compete with the national capital.","C":"In a unitary state, each region is free to conduct its own foreign policy.","D":"In a unitary state, the national government exists mainly to coordinate the policies of largely independent regions.","E":"In a unitary state, decision-making is concentrated in the national capital, and regional units mainly administer policies set by the central government."},"answer":"E","rationales":{"A":"Incorrect. Constitutionally protected regional powers are the defining feature of a federal state, such as the United States or Germany.","B":"Incorrect. Dispersed power centers describe a federal state; a unitary state has one dominant power center.","C":"Incorrect. Foreign policy is conducted by the national government in both unitary and federal states.","D":"Incorrect. This describes a confederation or a very loose federation, not a unitary state.","E":"Correct. Unitary systems place ultimate authority in the national government, although regional governments may be given significant powers (as in the UK). Federal systems constitutionally divide authority between national and regional governments, creating several centers of decision-making."},"explanation":"In a unitary state, the national government has the final legal say over regional governments. It may still give regions important powers to make their own decisions. In a federal state, the constitution itself divides power between the national government and regional governments such as states or provinces, so there are many centers of decision-making."},{"id":"U4-E09","n":9,"topic":"4.5","lo":"IMP-4.B","skill":"4.C","difficulty":"medium","set":"strait","setLabel":"Questions 9–10 refer to the map and information below.","stimulus":{"type":"schematicMap","title":"THE STRAIT OF KESSA (HYPOTHETICAL) WITH 12-NAUTICAL-MILE TERRITORIAL SEA CLAIMS","description":"Country A lies north of the strait and Country B lies south of it. At its narrowest point the strait is 20 nautical miles wide. Island Rell, about 3 nautical miles across, belongs to Country A; its nearest shore is 6.5 nautical miles from Country B's coast. The main international shipping lane runs east–west through the middle of the strait.","note":"Under UNCLOS, a coastal state's territorial sea extends up to 12 nautical miles from its coastal baselines, and its exclusive economic zone extends up to 200 nautical miles from those same baselines; treat the mainland and island shorelines on this hypothetical map as baselines. Where the territorial seas of states with opposite coasts overlap, UNCLOS generally uses a median line unless an agreement, historic title, or special circumstances justify a different boundary. Ships keep rights of passage through straits used for international navigation.","canvas":{"width":800,"height":400,"nmiToPx":10},"features":[{"kind":"land","name":"Country A","polygon":[[0,0],[800,0],[800,100],[0,100]],"labelAt":[400,55]},{"kind":"land","name":"Country B","polygon":[[0,300],[800,300],[800,400],[0,400]],"labelAt":[400,355]},{"kind":"territorialSea","owner":"Country A","polygon":[[0,100],[800,100],[800,220],[0,220]]},{"kind":"territorialSea","owner":"Country B","polygon":[[0,180],[800,180],[800,300],[0,300]]},{"kind":"island","name":"Island Rell (Country A)","center":[400,220],"radius":15},{"kind":"territorialSea","owner":"Country A (from Island Rell)","circle":{"center":[400,220],"radius":135},"clipToWater":true},{"kind":"shippingLane","name":"International shipping lane","line":[[0,200],[800,200]],"dashed":true},{"kind":"scaleBar","label":"0 — 10 nautical miles","from":[40,380],"to":[140,380]}],"legend":[{"swatch":"territorialSeaA","label":"Country A 12-nautical-mile territorial sea claim"},{"swatch":"territorialSeaB","label":"Country B 12-nautical-mile territorial sea claim"},{"swatch":"overlap","label":"Overlapping claims"},{"swatch":"lane","label":"Shipping lane"}],"renderNotes":"Water lies between y=100 and y=300, excluding Island Rell. Shade the union of Country A's mainland and island claims in one translucent color and Country B's claim in another; the darker overlap should appear only where the two countries' claim areas intersect. Clip all claim shading to water and draw land (and the island) above the shading. The island's territorial-sea circle is measured from the island's shore (center radius 135 px = 15 px island + 120 px / 12 nautical miles). Stack the legend under the map on phones.","source":"Hypothetical map"},"stem":"Because the Strait of Kessa is only 20 nautical miles wide at its narrowest point, the map indicates that","options":{"A":"the two states' potential 12-nautical-mile territorial seas overlap, so the maritime boundary would generally follow a median line unless the states agree otherwise or special circumstances apply","B":"neither state may claim any territorial sea because the strait is an international waterway used by ships from many countries","C":"Country B's territorial sea extends across the entire strait because it has the longer coastline","D":"the shipping lane lies in waters beyond both states' claims","E":"Country A must give Island Rell to Country B because it is closer to Country B's coast"},"answer":"A","rationales":{"A":"Correct. Each state may claim up to 12 nautical miles, and 12 + 12 = 24 is greater than the strait's 20-nautical-mile width, so the potential claims overlap in the middle (shaded band). For states with opposite coasts, UNCLOS (Article 15) generally places the boundary on a median line equidistant from each coast unless the states agree otherwise or historic title or special circumstances justify a different line.","B":"Incorrect. UNCLOS allows coastal states to claim territorial seas even along straits used for international navigation; ships keep a right of passage through them.","C":"Incorrect. Length of coastline does not determine the extent of a territorial sea; the limit is 12 nautical miles from each coast.","D":"Incorrect. The shipping lane runs through the overlapping claims in the middle of the strait; in a strait this narrow there is no water beyond the two states' territorial claims.","E":"Incorrect. Nothing in UNCLOS requires transferring an island because of proximity. Sovereignty over Island Rell belongs to Country A."},"explanation":"Each country may claim territorial waters up to 12 nautical miles from its coast. The strait is only 20 nautical miles wide, so those possible zones overlap in the middle (the shaded band). UNCLOS has rules for drawing the dividing line: usually a line equally far from each country's nearest coast, counting islands, unless an agreement, a historic claim, or a special circumstance supports a different line. Ships from other countries also keep the right to pass through a strait like this."},{"id":"U4-E10","n":10,"topic":"4.3","lo":"PSO-4.C","skill":"2.C","difficulty":"hard","set":"strait","stem":"Country A's ownership of Island Rell most increases its political power in the strait because","options":{"A":"islands automatically give their owner full control of all shipping in the surrounding sea, including the right to close the strait","B":"the island's population is large enough to vote in Country B's elections and influence its maritime policy","C":"the island generates its own territorial-sea entitlement that overlaps Country B's claim and the shipping lane, strengthening Country A's position in boundary negotiations","D":"Country B is prohibited from fishing anywhere in the strait","E":"the island converts the strait into Country A's internal waters"},"answer":"C","rationales":{"A":"Incorrect. Even in its territorial sea a state must allow foreign ships the right of passage; ownership of an island does not grant control of all shipping.","B":"Incorrect. The island's population is irrelevant to maritime claims, and residents of Country A's island would not vote in Country B.","C":"Correct. Under UNCLOS, islands generate territorial seas (and, except for rocks that cannot sustain habitation or economic life, exclusive economic zones) just as mainland coasts do. Because Island Rell's nearest shore is only 6.5 nautical miles from Country B's coast, its potential 12-nautical-mile entitlement overlaps Country B's claim and covers the shipping lane. That strengthens Country A's position when the boundary is drawn, though it does not automatically give Country A control of Country B's coastline or of international shipping.","D":"Incorrect. Country B retains rights in its own territorial sea and any negotiated zone; the island does not erase them.","E":"Incorrect. Internal waters are enclosed waters such as bays and harbors; a strait between two states does not become one state's internal waters because of an island."},"explanation":"In the Law of the Sea, an island can give its owner rights to part of the sea around it. Island Rell's nearest shore is only 6.5 nautical miles from Country B's coast, so the two countries' possible sea zones overlap a lot, and the island's zone covers the shipping lane. That gives Country A a stronger hand when the two countries work out the dividing line. It does not let Country A take Country B's waters or stop ships from passing through. This is why tiny islands cause big arguments in places like the South China Sea."},{"id":"U4-E11","n":11,"topic":"4.2","lo":"PSO-4.B","skill":"1.A","difficulty":"easy","stem":"Sovereignty is best defined as","options":{"A":"the right of a region to secede from the state it belongs to","B":"a state's dependence on a more powerful neighbor for its defense","C":"the shared culture and history that bind a nation together","D":"a state's supreme authority to govern its own territory and people without interference from outside powers","E":"the transfer of power from a central government to regional governments"},"answer":"D","rationales":{"A":"Incorrect. Secession is one possible result of devolution; sovereignty is the authority of the existing state.","B":"Incorrect. Dependence on another state limits sovereignty rather than defining it.","C":"Incorrect. Shared culture defines a nation; sovereignty is a political quality of a state.","D":"Correct. Sovereignty is the principle that a state has final authority within its borders and is legally equal to and independent of other states. It is the basis of the modern state system.","E":"Incorrect. That describes devolution."},"explanation":"Sovereignty means 'we are in charge here.' A sovereign state makes its own laws, controls its own borders, and does not have to answer to any other country. When the EU, a powerful neighbor, or a breakaway region takes away some of that control, geographers call it a challenge to sovereignty."},{"id":"U4-E12","n":12,"topic":"4.8","lo":"SPS-4.A","skill":"2.D","difficulty":"medium","stem":"Separatist movements in Catalonia (Spain) and Scotland (United Kingdom) are similar in that both","options":{"A":"achieved independence through referendums that were recognized by their central governments and the United Nations","B":"are culturally distinct regions with devolved regional governments that still contain movements seeking full independence","C":"are based primarily on religious differences from the rest of the state","D":"are irredentist movements seeking to join a neighboring state","E":"resulted from superimposed boundaries drawn by European colonial powers in Africa"},"answer":"B","rationales":{"A":"Incorrect. Scotland voted against independence in 2014, and Catalonia's 2017 vote was ruled illegal by Spain; neither region is independent.","B":"Correct. Both regions have their own language or cultural identity (Catalan; Scots and Scottish Gaelic along with a distinct national history), both gained devolved parliaments (Catalonia under Spain's 1978 constitution, Scotland in 1999), and both still have significant movements for full independence. Devolution does not always end demands for separation.","C":"Incorrect. Neither movement is primarily religious; language, history, identity, and economics are the main drivers.","D":"Incorrect. Irredentism is a state's claim to territory in another state; these regions seek their own independence, not union with a neighbor.","E":"Incorrect. Both regions are in Europe, and their boundaries developed historically within Spain and Britain rather than being imposed by colonial powers."},"explanation":"Catalonia and Scotland both have their own culture and their own regional parliaments. Their central governments gave them that power through devolution. But giving a region some power does not always end the push for independence. Scotland voted in 2014, and independence lost. Catalonia voted in 2017, and Spain's courts said the vote was illegal. Both are still part of their countries, and both still have independence movements."},{"id":"U4-E13","n":13,"topic":"4.9","lo":"SPS-4.B","skill":"2.C","difficulty":"medium","stem":"Which of the following is the best example of a supranational organization limiting a member state's sovereignty?","options":{"A":"A European Union court rules that a member state's law conflicts with EU rules, and the state must change it.","B":"A state signs a trade agreement with one neighboring state that lowers tariffs on farm products between them.","C":"A state's own parliament votes to lower its national tax rate.","D":"A region within a state gains control over its own schools.","E":"A state builds a wall along its boundary with a non-member state."},"answer":"A","rationales":{"A":"Correct. When a state joins the EU, it accepts that EU law takes priority over conflicting national law and that EU courts can enforce it. Being required to change a national law is a direct limit on sovereignty by a supranational body.","B":"Incorrect. A bilateral trade agreement is an exercise of sovereignty between two states, not the action of a supranational organization.","C":"Incorrect. A parliament acting on its own is an exercise of sovereignty, not a limit on it.","D":"Incorrect. That is devolution, an internal transfer of power within a state.","E":"Incorrect. Building a boundary barrier is a unilateral exercise of sovereignty."},"explanation":"Normally a country's own laws are the top authority inside its borders. But EU members agreed that EU rules win when the two clash. So when an EU court tells a member country to change a law, that country has given up a piece of its sovereignty to the organization. That is exactly what geographers mean when they say supranationalism challenges sovereignty."},{"id":"U4-E14","n":14,"topic":"4.9","lo":"SPS-4.B","skill":"3.E","difficulty":"hard","stimulus":{"type":"table","title":"SELECTED INDEPENDENCE AND SOVEREIGNTY REFERENDUMS","columns":["Region (state)","Year","Vote for independence","Outcome"],"rows":[["Quebec (Canada)","1995","49.4%","Remained part of Canada"],["Montenegro (Serbia and Montenegro)","2006","55.5%","Became an independent state in 2006"],["South Sudan (Sudan)","2011","98.8%","Became an independent state in 2011"],["Scotland (United Kingdom)","2014","44.7%","Remained part of the United Kingdom"],["Catalonia (Spain)","2017","About 90% (turnout about 43%)","Vote ruled illegal by Spain's Constitutional Court; remained part of Spain"]],"source":"Compiled from official and publicly reported results"},"stem":"Which of the following conclusions is best supported by the data in the table?","options":{"A":"Every independence referendum held since 1990 has produced a new sovereign state.","B":"Independence referendums succeed only when more than 90 percent of voters support independence.","C":"A majority vote for independence does not automatically create a sovereign state; legal procedures, political agreements, and recognition by other states also shape the outcome.","D":"Regions in federal states are more likely to vote for independence than regions in unitary states because they already govern themselves.","E":"Referendums with turnout below 50 percent are automatically recognized by the United Nations."},"answer":"C","rationales":{"A":"Incorrect. Quebec, Scotland, and Catalonia all remained within their states.","B":"Incorrect. Montenegro became independent with 55.5 percent, so the 90 percent threshold is contradicted by the table.","C":"Correct. Catalonia's large majority did not produce recognized independence because Spain rejected the vote, while Montenegro and South Sudan became independent after votes held under agreed legal and political processes (Montenegro's with Serbia and the EU, South Sudan's under the 2005 peace agreement). A majority vote alone is not enough; the legal and political circumstances and international recognition also matter.","D":"Incorrect. The table does not indicate which states are federal or unitary, so this cannot be concluded from the data.","E":"Incorrect. Nothing in the table supports this, and the United Nations does not automatically recognize referendum results."},"explanation":"Look at Catalonia: about 90% of the people who voted said yes, but Spain's courts said the vote was illegal, so Catalonia stayed in Spain. Now look at Montenegro: only 55.5% voted yes, but Serbia had agreed ahead of time to accept the result, so Montenegro became a country. The lesson: voting yes is not enough by itself. The rules the vote is held under, and whether other countries recognize the result, matter too."},{"id":"U4-E15","n":15,"topic":"4.6","lo":"IMP-4.B","skill":"1.D","difficulty":"easy","stem":"After a census, a city council redraws the boundaries of its council wards so that each ward contains about the same number of residents. This is an example of internal boundary-making at which scale of analysis?","options":{"A":"Global","B":"Regional (supranational)","C":"National","D":"Subnational state or provincial","E":"Local"},"answer":"E","rationales":{"A":"Incorrect. The global scale involves the whole world, such as the United Nations.","B":"Incorrect. The regional or supranational scale involves groups of states, such as the European Union.","C":"Incorrect. The national scale involves an entire state, such as apportioning seats in a national legislature.","D":"Incorrect. State legislatures redrawing congressional or state legislative districts operate at the subnational state scale.","E":"Correct. City council wards are drawn within a single city, which is the local scale. Redistricting, and the potential for gerrymandering, occurs at the national, state, and local scales."},"explanation":"Scale is about how zoomed in you are. The whole world is global; a group of countries is regional; one country is national; one state or province is subnational; one city or county is local. A city council drawing wards is as zoomed in as it gets: local. Redistricting can happen at the national, state, and local levels."},{"id":"U4-E16","n":16,"topic":"4.8","lo":"SPS-4.A","skill":"3.B","difficulty":"easy","set":"veldaria","setLabel":"Questions 16–18 refer to the graph and information below.","stimulus":{"type":"bar","title":"SHARE OF NATIONAL POPULATION AND NATIONAL GDP BY REGION, VELDARIA (HYPOTHETICAL), 2025","categories":["Capital Region","Korvane","Lowlands","Eastern Plateau"],"series":[{"name":"Share of national population (%)","values":[35,20,30,15]},{"name":"Share of national GDP (%)","values":[30,40,20,10]}],"yLabel":"Percent of national total","yMax":50,"text":"Veldaria is a unitary state. The region of Korvane is separated from the Capital Region by the Sarn Mountains, and about 80 percent of Korvane's residents speak Korvani rather than Veldaria's national language. In 2025 a Korvani nationalist party won a majority in Korvane's regional assembly and demanded that the region control its own taxation and schools, arguing that Korvane pays far more in national taxes than it receives back in national government spending.","source":"Hypothetical data"},"stem":"Which region has the largest gap between its share of national GDP and its share of national population?","options":{"A":"Capital Region","B":"Korvane","C":"Lowlands","D":"Eastern Plateau","E":"No region's share of GDP differs from its share of population"},"answer":"B","rationales":{"A":"Incorrect. The Capital Region has 35 percent of the population and 30 percent of GDP, a gap of 5 percentage points.","B":"Correct. Korvane has 20 percent of the population but 40 percent of GDP, a gap of 20 percentage points, by far the largest. Korvane produces 40 percent of the country's economic output despite containing only 20 percent of its population.","C":"Incorrect. The Lowlands have 30 percent of the population and 20 percent of GDP, a gap of 10 percentage points.","D":"Incorrect. The Eastern Plateau has 15 percent of the population and 10 percent of GDP, a gap of 5 percentage points.","E":"Incorrect. The gaps range from 5 to 20 percentage points."},"explanation":"Subtract the two bars for each region. Capital: 35 vs 30 = 5 apart. Korvane: 20 vs 40 = 20 apart. Lowlands: 30 vs 20 = 10. Eastern Plateau: 15 vs 10 = 5. Korvane's gap is the biggest, and it goes in the 'rich' direction: Korvane has one-fifth of the country's people but produces two-fifths of its goods and services."},{"id":"U4-E17","n":17,"topic":"4.8","lo":"SPS-4.A","skill":"3.E","difficulty":"medium","set":"veldaria","stem":"The information provided most directly supports which combination of devolutionary factors in Korvane?","options":{"A":"Physical geography, terrorism, and economic grievances","B":"Irredentism, ethnic or linguistic separatism, and economic grievances","C":"Physical geography, ethnic cleansing, and economic grievances","D":"Physical geography, ethnic or linguistic separatism, and economic grievances","E":"Physical geography, ethnic or linguistic separatism, and irredentism"},"answer":"D","rationales":{"A":"Incorrect. The mountains and the economic grievance are supported, but the stimulus describes no terrorism.","B":"Incorrect. Cultural differences and the economic grievance are supported, but no outside state claims Korvane.","C":"Incorrect. The mountains and the economic grievance are supported, but no forced removal of an ethnic group is described.","D":"Correct. The Sarn Mountains separate Korvane from the capital (physical geography); 80 percent of residents speak a different language and a nationalist party now governs the region (ethnic or linguistic separatism); and Korvane produces 40 percent of GDP with 20 percent of the population while its leaders claim it pays more in national taxes than it gets back (economic grievance).","E":"Incorrect. Physical separation and cultural differences are supported, but no outside state claims Korvane."},"explanation":"Match the clues to the list of devolutionary factors from Topic 4.8. Mountains cutting Korvane off = physical geography. A different language plus a nationalist party = ethnic/linguistic separatism. Making 40% of the money with 20% of the people, and saying the region pays more in taxes than it gets back = economic grievance. Three separate pushes toward devolution, all in one region."},{"id":"U4-E18","n":18,"topic":"4.10","lo":"SPS-4.C","skill":"2.C","difficulty":"medium","set":"veldaria","stem":"Which of the following responses by Veldaria's national government would most comprehensively act as a centripetal force by addressing the economic, cultural, and geographic factors encouraging separatism in Korvane?","options":{"A":"Granting Korvane control over taxation and schools, protecting Korvani-language instruction, and improving transportation across the Sarn Mountains","B":"Providing tax incentives to Korvane's largest businesses while replacing Korvani-language teaching with national-language-only instruction","C":"Protecting Korvani-language instruction and offering a one-time development grant while keeping centralized control over taxation","D":"Building new highways in the Capital Region and increasing national funding for Korvani cultural festivals","E":"Giving Korvane additional representatives in the national legislature while leaving control of its schools and taxes with the central government"},"answer":"A","rationales":{"A":"Correct. This response addresses all three factors at once: political and fiscal autonomy (taxation and schools), linguistic identity (Korvani-language instruction), and physical isolation (transportation across the mountains). Equitable development and respect for regional identity are classic centripetal forces.","B":"Incorrect. Business incentives may encourage investment, but replacing Korvani-language teaching would undermine recognition of the regional language, and the plan leaves autonomy and transportation unaddressed.","C":"Incorrect. Cultural recognition and a one-time grant help, but the plan ignores the demand for tax authority and does nothing about the mountains that isolate the region.","D":"Incorrect. Festivals offer some cultural recognition, but highways in the Capital Region do not reduce Korvane's isolation, and autonomy is not addressed.","E":"Incorrect. More seats in the national legislature increase Korvane's voice at the center, but its specific demands for control over schools and taxation remain unmet."},"explanation":"Korvane has three big concerns: its separate language and culture, its demand for more control over local decisions like taxes and schools, and the mountains cutting it off from the capital. Answer A deals with all three, which is what makes it the strongest centripetal (unifying) move. The other choices address only part of the problem, and choice B also removes Korvani-language teaching, which could deepen the cultural grievance."},{"id":"U4-E19","n":19,"topic":"4.1","lo":"PSO-4.A","skill":"1.D","difficulty":"easy","stem":"The Kurds, an estimated 30 to 40 million people with a shared language and culture, live mainly in parts of Turkey, Iraq, Iran, and Syria and do not have a sovereign state of their own. The Kurds are best described as a","options":{"A":"federal state","B":"multinational state","C":"stateless nation","D":"nation-state","E":"autonomous region"},"answer":"C","rationales":{"A":"Incorrect. A federal state is a sovereign country that divides governing power between national and regional governments. The Kurds are a nation (a people), not a state of any kind.","B":"Incorrect. A multinational state is a state containing several nations, such as Russia; the Kurds are a people, not a state.","C":"Correct. A stateless nation is a nation without a sovereign state of its own. The Kurds are the most frequently cited example; Iraqi Kurdistan has autonomy within Iraq but is not an independent state.","D":"Incorrect. A nation-state is a state whose population is largely one nation, such as Japan.","E":"Incorrect. Iraqi Kurdistan is an autonomous region, but the Kurdish people as a whole, spread across four states, are a nation, not a region."},"explanation":"The Kurds are a nation (one people with a shared language and culture) but they have no state (no country of their own). Their homeland is split among four countries, and in each one they are a minority. That makes them the textbook example of a stateless nation."},{"id":"U4-E20","n":20,"topic":"4.4","lo":"IMP-4.A","skill":"1.D","difficulty":"easy","stem":"Sections of the Great Wall of China were built to defend the northern frontiers of successive Chinese empires. Those fortifications no longer serve as a frontier, yet they remain a prominent feature of the landscape. The Great Wall is best classified as which type of boundary?","options":{"A":"Geometric","B":"Relict","C":"Antecedent","D":"Consequent","E":"Superimposed"},"answer":"B","rationales":{"A":"Incorrect. A geometric boundary follows straight or mathematically defined lines, often based on latitude or longitude. The Great Wall generally follows terrain and is best identified here by its former boundary function.","B":"Correct. A relict boundary is one that no longer functions as a political boundary but is still visible in the cultural landscape. The former East–West German border is another example.","C":"Incorrect. An antecedent boundary is drawn before the cultural landscape develops.","D":"Incorrect. A consequent boundary is drawn to separate existing cultural groups.","E":"Incorrect. A superimposed boundary is imposed by an outside power on an existing cultural landscape."},"explanation":"Relict means 'left behind.' Parts of the Great Wall once defended the frontiers of Chinese empires. Those frontiers no longer exist as political lines, but the wall is still there to see. A boundary feature you can still see but that no longer does its job is a relict boundary."},{"id":"U4-E21","n":21,"topic":"4.5","lo":"IMP-4.B","skill":"1.D","difficulty":"medium","stem":"The 1953 armistice that halted fighting in the Korean War established a Military Demarcation Line and a surrounding demilitarized zone (DMZ) separating North Korean and South Korean forces. The DMZ best illustrates which of the following about political boundaries?","options":{"A":"Boundaries always follow cultural divisions such as language or religion, so the two Koreas must differ culturally.","B":"Boundaries encourage trade and daily interaction between neighboring states.","C":"Boundaries that follow physical features are the most heavily fortified.","D":"Maritime boundaries are more contested than land boundaries.","E":"Some boundaries are created by military or political agreement rather than cultural or physical divisions, and they can sharply limit interaction."},"answer":"E","rationales":{"A":"Incorrect. Koreans on both sides share a language and culture; the DMZ divides a single nation.","B":"Incorrect. The DMZ nearly eliminates interaction between the two Koreas; it is one of the most closed boundaries in the world.","C":"Incorrect. This example does not establish that boundaries following physical features are the most heavily fortified; the demarcation line and surrounding buffer zone were established by an armistice.","D":"Incorrect. The DMZ is a land boundary, and the statement is a generalization the example cannot support.","E":"Correct. The Korean Armistice Agreement set a military demarcation line with a buffer zone on each side rather than a negotiated international border, and the arrangement came from a military agreement, not from a cultural or physical divide. It sharply restricts movement, trade, and communication despite the shared language and history of Koreans on both sides."},"explanation":"The DMZ was not created to separate two different language groups; Koreans on both sides share a language and history. The 1953 armistice set a military dividing line and a buffer zone between the two armies. It shows that a boundary can come from a war and a military agreement, and that such a boundary can nearly shut off movement between people who have a lot in common."},{"id":"U4-E22","n":22,"topic":"4.9","lo":"SPS-4.B","skill":"1.B","difficulty":"medium","stem":"Which of the following best explains how modern communication technology challenges state sovereignty?","options":{"A":"Satellite images allow border agencies to locate unauthorized crossings more accurately.","B":"Digital identity systems allow governments to administer public services more efficiently.","C":"Mapping software allows election officials to draw electoral districts using detailed population data.","D":"Online networks allow people to share information and organize across borders despite government restrictions.","E":"Licensing rules allow governments to regulate foreign telecommunications firms operating within their territory."},"answer":"D","rationales":{"A":"Incorrect. This use of technology strengthens border enforcement, an exercise of sovereignty.","B":"Incorrect. This use improves the government's ability to administer services.","C":"Incorrect. Redrawing districts concerns representation within the state; it does not by itself show a loss of sovereignty.","D":"Correct. Cross-border communication lets people circulate information and coordinate political activity beyond the government's effective control, which is why some governments respond with censorship, shutdowns, or surveillance.","E":"Incorrect. Licensing foreign firms is an exercise of regulatory authority."},"explanation":"Online networks can help people share news and organize across borders even when their government tries to stop it. That can reduce the government's control over information and political activity inside its own borders, which is a challenge to sovereignty. Governments may answer with censorship or surveillance, so the effect depends on how the technology is used."},{"id":"U4-E23","n":23,"topic":"4.10","lo":"SPS-4.C","skill":"2.C","difficulty":"medium","stem":"Which of the following is most likely to act as a centrifugal force in a multinational state?","options":{"A":"Government investment concentrated in the capital region while the roads, schools, and hospitals of an ethnically distinct region are neglected","B":"A national holiday celebrated by all of the state's ethnic groups","C":"A public school system that teaches a common national language alongside regional languages","D":"A national sports team with players drawn from every region","E":"A constitution that guarantees equal rights to all ethnic groups"},"answer":"A","rationales":{"A":"Correct. Uneven development, especially when it overlaps with ethnic divisions, is a major centrifugal force. The neglected region comes to see the state as serving others, which fuels separatism.","B":"Incorrect. Shared holidays build common identity, a centripetal force.","C":"Incorrect. A common language taught alongside regional ones promotes communication and inclusion, a centripetal force.","D":"Incorrect. National teams are a classic source of shared pride, a centripetal force.","E":"Incorrect. Equal rights for all groups reduce grievances and strengthen loyalty to the state."},"explanation":"Centrifugal forces push a country apart. When one ethnic region watches the capital get new roads and hospitals while its own fall apart, people there start to feel the country is not really theirs. That feeling is exactly what feeds separatist movements. The other four choices (holidays, shared language plus regional languages, a national team, equal rights) all pull people together instead."},{"id":"U4-E24","n":24,"topic":"4.3","lo":"PSO-4.C","skill":"1.D","difficulty":"medium","stem":"In a hypothetical country, a wealthy foreign state lends money for major infrastructure projects. As part of a later financial agreement, the borrowing government grants a company controlled by the foreign state a long-term lease to operate the country's main commercial port. Critics argue that the arrangement gives the foreign state great economic and political influence without formal colonial rule. This situation is best described as","options":{"A":"irredentism","B":"supranationalism","C":"neocolonialism","D":"devolution","E":"self-determination"},"answer":"C","rationales":{"A":"Incorrect. Irredentism is a claim to territory based on shared ethnicity or history; the lender claims no such connection.","B":"Incorrect. Supranationalism involves states joining organizations with shared rules; this is a bilateral loan.","C":"Correct. Neocolonialism is the use of economic, political, or cultural pressure to exercise power over a less developed country without formally governing it. Long-term foreign control of strategic infrastructure gained through debt is a frequently cited contemporary example, though whether a specific real-world deal fits the label is often debated.","D":"Incorrect. Devolution is a transfer of power from a central government to regions within the same state.","E":"Incorrect. Self-determination is a people's right to choose their political status; this arrangement reduces the borrower's control over its own territory."},"explanation":"Colonialism meant ruling another country directly with soldiers and governors. Neocolonialism ('new colonialism') means a powerful country gets similar influence through money, businesses, or political pressure instead. In this made-up example, the rich country never takes over the government, but a company it controls ends up running the main port. Critics say that is control without the flag."},{"id":"U4-E25","n":25,"topic":"4.7","lo":"IMP-4.D","skill":"5.B","difficulty":"medium","stem":"Nigeria, a federal state with more than 250 ethnic groups, has increased its number of states from three regions at independence in 1960 to 36 states today. Which of the following best explains how this strategy is intended to function as a centripetal force?","options":{"A":"It concentrates power in the largest ethnic group so that it can impose national unity on the smaller groups.","B":"It removes regional governments so that all decisions are made in the capital.","C":"It allows each state to become a fully sovereign country.","D":"It replaces ethnic identities with a single national language.","E":"It spreads regional authority and federal revenue among many smaller states and communities."},"answer":"E","rationales":{"A":"Incorrect. Concentrating power in one group would be a centrifugal force in a multiethnic state, provoking the others.","B":"Incorrect. The strategy keeps regional governments and increases their number; it does not remove them.","C":"Incorrect. Nigerian states are subnational units within a federal system, not sovereign countries.","D":"Incorrect. Creating states does not change language policy; Nigeria retains English as its official language alongside hundreds of local languages.","E":"Correct. Nigeria created smaller states, starting with 12 in 1967 (just before the Biafran secession attempt of 1967–1970) and reaching 36 in 1996, partly to break up large regional blocs each dominated by one major ethnic group and to distribute political representation and federal oil revenue more widely. The strategy is meant to strengthen national unity, although it has not eliminated ethnic or regional tensions."},"explanation":"At independence, Nigeria had three large regions where its biggest ethnic groups held much of the power. A fourth region was added in 1963. In 1967 the government split the four regions into 12 states, shortly before Biafra declared independence and the civil war began. Nigeria later increased the number to 36. Giving more communities their own state government and a share of federal revenue is meant to reduce the dominance of a few big regional blocs and strengthen national unity. It has not ended ethnic or regional tensions."}]}}}};</script>
<script>/* GeoArcade · AP Practice Exam · stimulus renderer
   Everything here is driven by the JSON stimulus object; nothing is hard-coded per question.
   Supported stimulus.type: table | bar | districtMap | schematicMap. Anything else -> "stimulus unavailable" card. */
window.PE_STIM = (function () {
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let uid = 0;
  const nid = () => 'st' + (++uid) + '_' + Math.random().toString(36).slice(2, 6);
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : (parseFloat(v) || 0);
  const fmt = v => Number.isInteger(v) ? v.toLocaleString('en-US') : (+v).toLocaleString('en-US', { maximumFractionDigits: 1 });
  const r1 = v => Math.round(v * 10) / 10;

  function render(stim) {
    if (!stim || typeof stim !== 'object') return unavailable();
    try {
      switch (stim.type) {
        case 'table': return table(stim);
        case 'bar': return bar(stim);
        case 'districtMap': return districtMap(stim);
        case 'schematicMap': return schematicMap(stim);
        default: return unavailable(stim.type);
      }
    } catch (e) {
      if (window.console && console.warn) console.warn('stimulus render failed', e);
      return unavailable(stim.type);
    }
  }

  function unavailable(type) {
    return `<figure class="stim unavail" role="note"><div>⚠︎ Stimulus unavailable${type ? ` <span class="muted">(${esc(type)})</span>` : ''}</div><div class="small muted">You can still answer the question. Tell your AP Human Geography teacher which question this is.</div></figure>`;
  }
  const title = t => t ? `<figcaption class="stim-title">${esc(t)}</figcaption>` : '';
  const source = s => s ? `<div class="stim-source">Source: ${esc(s)}</div>` : '';

  /* ---------- table ---------- */
  function tableHTML(t, caption) {
    const cols = t.columns || [], rows = t.rows || [];
    return `<div class="tscroll"><table class="stab"${caption ? ` aria-label="${esc(caption)}"` : ''}><thead><tr>${cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  function table(s) {
    return `<figure class="stim stim-table">${title(s.title)}${tableHTML(s, s.title)}${source(s.source)}</figure>`;
  }

  /* ---------- grouped bar chart (inline SVG) ---------- */
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const f = raw / p;
    const m = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return m * p;
  }
  function bar(s) {
    const cats = s.categories || [], series = s.series || [];
    const maxV = Math.max(1, ...series.flatMap(sr => (sr.values || []).map(num)));
    const yMax = num(s.yMax) > 0 ? num(s.yMax) : niceStep(maxV / 5) * 5;
    const W = 640, H = 380, m = { t: 20, r: 18, b: 56, l: 70 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const step = niceStep(yMax / 5);
    const y = v => m.t + ph - (v / yMax) * ph;
    const gw = pw / Math.max(1, cats.length), n = Math.max(1, series.length);
    const bw = Math.min(58, (gw * 0.72) / n), groupW = bw * n;
    const id = nid(), tid = id + 't', did = id + 'd';
    let grid = '';
    for (let v = 0; v <= yMax + 1e-9; v += step) {
      grid += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${r1(y(v))}" y2="${r1(y(v))}"/><text class="tick" x="${m.l - 9}" y="${r1(y(v) + 4)}" text-anchor="end">${fmt(v)}</text>`;
    }
    let bars = '';
    cats.forEach((c, ci) => {
      const x0 = m.l + ci * gw + (gw - groupW) / 2;
      series.forEach((sr, si) => {
        const v = num((sr.values || [])[ci]);
        const x = x0 + si * bw, h = Math.max(0, ph * (v / yMax));
        bars += `<rect class="bar s${si}" x="${r1(x + 3)}" y="${r1(y(v))}" width="${r1(bw - 6)}" height="${r1(h)}" rx="3"><title>${esc(c)} · ${esc(sr.name)}: ${fmt(v)}</title></rect>`;
        if (si === 1) bars += `<rect x="${r1(x + 3)}" y="${r1(y(v))}" width="${r1(bw - 6)}" height="${r1(h)}" rx="3" fill="url(#${id}h)" pointer-events="none"/>`;
        bars += `<text class="val" x="${r1(x + bw / 2)}" y="${r1(y(v) - 6)}" text-anchor="middle">${fmt(v)}</text>`;
      });
      bars += `<text class="cat" x="${r1(m.l + ci * gw + gw / 2)}" y="${H - m.b + 22}" text-anchor="middle">${esc(c)}</text>`;
    });
    const axes = `<line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t + ph}"/><line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ph}" y2="${m.t + ph}"/>`;
    const ylab = s.yLabel ? `<text class="ylab" transform="translate(16 ${r1(m.t + ph / 2)}) rotate(-90)" text-anchor="middle">${esc(s.yLabel)}</text>` : '';
    const legend = `<div class="legend" aria-hidden="true">${series.map((sr, i) => `<span class="lg"><i class="sw s${i}"></i>${esc(sr.name)}</span>`).join('')}</div>`;
    const desc = `Grouped bar chart with ${cats.length} categories and ${series.length} series. ` + cats.map((c, ci) => `${c}: ` + series.map(sr => `${sr.name} ${fmt(num((sr.values || [])[ci]))}`).join(', ')).join('. ') + '.';
    const srTable = `<div class="sr-only"><table><caption>${esc(s.title || 'Chart data')}</caption><thead><tr><th scope="col">Category</th>${series.map(sr => `<th scope="col">${esc(sr.name)}</th>`).join('')}</tr></thead><tbody>${cats.map((c, ci) => `<tr><th scope="row">${esc(c)}</th>${series.map(sr => `<td>${fmt(num((sr.values || [])[ci]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    return `<figure class="stim stim-bar">${title(s.title)}${legend}<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid} ${did}"><title id="${tid}">${esc(s.title || 'Bar chart')}</title><desc id="${did}">${esc(desc)}</desc><defs><pattern id="${id}h" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,.55)" stroke-width="2"/></pattern></defs>${grid}${axes}${bars}${ylab}</svg></div>${srTable}${s.text ? `<p class="stim-text">${esc(s.text)}</p>` : ''}${source(s.source)}</figure>`;
  }

  /* ---------- district maps ---------- */
  function districtMap(s) {
    const g = s.grid || {}, R = num(g.rows) || (g.blueShare || []).length, C = num(g.cols) || ((g.blueShare || [])[0] || []).length;
    const bs = g.blueShare || [];
    const cell = 50, pad = 4, W = C * cell + pad * 2, H = R * cell + pad * 2;
    const plans = (s.plans || []).map((p, pi) => {
      const dmap = {};
      (p.districts || []).forEach((d, di) => d.forEach(rc => { dmap[rc[0] + ',' + rc[1]] = di; }));
      let cells = '', borders = '';
      const X = c => pad + c * cell, Y = r => pad + r * cell;
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        const v = num((bs[r] || [])[c]);
        const blue = v >= 50;
        cells += `<rect class="pc ${blue ? 'blue' : 'orange'}" x="${X(c)}" y="${Y(r)}" width="${cell}" height="${cell}"/><text class="pval" x="${X(c) + cell / 2}" y="${Y(r) + cell / 2 + 5}" text-anchor="middle">${fmt(v)}</text>`;
        const me = dmap[r + ',' + c];
        const diff = (rr, cc) => rr < 0 || cc < 0 || rr >= R || cc >= C || dmap[rr + ',' + cc] !== me;
        if (diff(r - 1, c)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r)}" x2="${X(c) + cell}" y2="${Y(r)}"/>`;
        if (diff(r, c - 1)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r)}" x2="${X(c)}" y2="${Y(r) + cell}"/>`;
        if (diff(r + 1, c)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r) + cell}" x2="${X(c) + cell}" y2="${Y(r) + cell}"/>`;
        if (diff(r, c + 1)) borders += `<line class="dline" x1="${X(c) + cell}" y1="${Y(r)}" x2="${X(c) + cell}" y2="${Y(r) + cell}"/>`;
      }
      const did = nid();
      const desc = (p.districts || []).map((d, di) => `District ${di + 1}: ` + d.map(rc => `row ${rc[0] + 1} column ${rc[1] + 1} (${fmt(num((bs[rc[0]] || [])[rc[1]]))}% Blue)`).join(', ')).join('. ');
      return `<figure class="dplan"><svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${did}"><title id="${did}">${esc(p.name || 'Plan ' + (pi + 1))}. ${esc(desc)}</title><g>${cells}</g><g>${borders}</g></svg><figcaption>${esc(p.name || 'Plan ' + (pi + 1))}</figcaption></figure>`;
    });
    const legend = `<div class="legend"><span class="lg"><i class="sw pblue"></i>Majority Blue Party (≥ 50)</span><span class="lg"><i class="sw porange"></i>Majority Orange Party (&lt; 50)</span><span class="lg"><i class="sw dline"></i>District boundary</span></div>`;
    return `<figure class="stim stim-dmap dmap">${title(s.title)}${s.note ? `<p class="stim-note">${esc(s.note)}</p>` : ''}<div class="dplans">${plans.join('')}</div>${legend}${s.resultsTable ? `<div class="dresults">${title(s.resultsTable.title)}${tableHTML(s.resultsTable, s.resultsTable.title)}</div>` : ''}${source(s.source)}</figure>`;
  }

  /* ---------- schematic maps ---------- */
  const pts = poly => (poly || []).map(p => `${r1(num(p[0]))},${r1(num(p[1]))}`).join(' ');
  function bbox(poly) {
    const xs = poly.map(p => num(p[0])), ys = poly.map(p => num(p[1]));
    return { x1: Math.min(...xs), y1: Math.min(...ys), x2: Math.max(...xs), y2: Math.max(...ys) };
  }
  const contains = (a, b) => a.x1 <= b.x1 && a.y1 <= b.y1 && a.x2 >= b.x2 && a.y2 >= b.y2 && (a.x2 - a.x1) * (a.y2 - a.y1) > (b.x2 - b.x1) * (b.y2 - b.y1);
  function wrap(text, max) {
    const words = String(text || '').split(/\s+/), lines = []; let cur = '';
    words.forEach(w => { if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
    if (cur) lines.push(cur);

  }
  function star(cx, cy, R, r, n) {
    let d = '';
    for (let i = 0; i < n * 2; i++) {
      const a = Math.PI / n * i - Math.PI / 2, rad = i % 2 ? r : R;
      d += (i ? 'L' : 'M') + r1(cx + rad * Math.cos(a)) + ',' + r1(cy + rad * Math.sin(a));
    }
    return d + 'Z';
  }
  function ownerKey(owner) { return String(owner || '').replace(/\s*\(.*$/, '').trim() || 'owner'; }

  function schematicMap(s) {
    const cv = s.canvas || {}, W = num(cv.width) || 800, H = num(cv.height) || 400;
    const feats = Array.isArray(s.features) ? s.features : [];
    const id = nid();
    const L = { claims: '', zones: '', hatchZones: '', land: '', lines: '', markers: '', labels: '', arrows: '', scale: '', brackets: '' };
    const owners = [];
    const ownerIdx = o => { const k = ownerKey(o); let i = owners.indexOf(k); if (i < 0) { owners.push(k); i = owners.length - 1; } return i; };
    const claimShapes = {};
    const zones = feats.filter(f => f.kind === 'zone' && Array.isArray(f.polygon));
    const zb = zones.map(z => bbox(z.polygon));
    const descBits = [];

    feats.forEach((f, fi) => {
      const kind = f.kind;
      if (kind === 'land' && Array.isArray(f.polygon)) {
        const cls = f.style === 'power' ? 'power' : f.style === 'small' ? 'small' : '';
        L.land += `<polygon class="land ${cls}" points="${pts(f.polygon)}"><title>${esc(f.name || 'Land')}</title></polygon>`;
        if (f.labelAt && f.name) {
          const lb = bbox(f.polygon), perChar = f.style === 'power' ? 10.5 : 8.5;
          const lines = wrap(f.name, Math.max(8, Math.floor((lb.x2 - lb.x1 - 8) / perChar)));
          const lh = f.style === 'power' ? 22 : 18, y0 = num(f.labelAt[1]) + 6 - (lines.length - 1) * lh / 2;
          lines.forEach((ln, i) => { L.labels += `<text class="lbl ${f.style === 'power' ? 'big' : ''}" x="${r1(num(f.labelAt[0]))}" y="${r1(y0 + i * lh)}">${esc(ln)}</text>`; });
        }
        descBits.push(f.name);
      } else if (kind === 'territorialSea') {
        const oi = ownerIdx(f.owner);
        let shape = '';
        if (f.circle && f.circle.center) shape = `<circle cx="${r1(num(f.circle.center[0]))}" cy="${r1(num(f.circle.center[1]))}" r="${r1(num(f.circle.radius))}"/>`;
        else if (Array.isArray(f.polygon)) shape = `<polygon points="${pts(f.polygon)}"/>`;
        (claimShapes[oi] = claimShapes[oi] || []).push(shape);
        descBits.push(`${f.owner || 'claim'} territorial sea claim`);
      } else if (kind === 'island' && f.center) {
        const cx = r1(num(f.center[0])), cy = r1(num(f.center[1])), rr = r1(num(f.radius) || 10);
        L.land += `<circle class="island" cx="${cx}" cy="${cy}" r="${rr}"><title>${esc(f.name || 'Island')}</title></circle>`;
        if (f.name) L.labels += `<text class="lbl sm" x="${cx}" y="${r1(cy + rr + 15)}">${esc(f.name)}</text>`;
        descBits.push(f.name);
      } else if (kind === 'zone' && Array.isArray(f.polygon)) {
        const zi = zones.indexOf(f), b = zb[zi];
        const inside = zb.some((o, j) => j !== zi && contains(o, b));
        const holds = zb.some((o, j) => j !== zi && contains(b, o));
        const shade = Math.min(3, zi);
        if (inside) L.hatchZones += `<polygon class="zone hatch" points="${pts(f.polygon)}" fill="url(#${id}zh)"><title>${esc(f.name || 'Zone')}</title></polygon>`;
        else { const poly = `<polygon class="zone z${shade}" points="${pts(f.polygon)}"><title>${esc(f.name || 'Zone')}</title></polygon>`; L.zones = holds ? poly + L.zones : L.zones + poly; }
        if (holds) L.brackets += `<path class="bracket" d="M${r1(b.x1 + 3)},${r1(b.y2 - 16)} v9 H${r1(b.x2 - 3)} v-9"/>`;
        if (f.labelAt) {
          const lx = r1(num(f.labelAt[0])), ly = r1(num(f.labelAt[1]));
          L.labels += `<text class="lbl" x="${lx}" y="${ly}">${esc(f.name || '')}</text>`;
          if (f.sublabel) wrap(f.sublabel, Math.max(10, Math.min(30, Math.floor((b.x2 - b.x1 - 10) / 6.6)))).forEach((ln, i) => { L.labels += `<text class="sub" x="${lx}" y="${ly + 17 + i * 14}">${esc(ln)}</text>`; });
        }
        descBits.push(`${f.name}${f.sublabel ? ' (' + f.sublabel + ')' : ''}`);
      } else if ((kind === 'line' || kind === 'shippingLane') && Array.isArray(f.line)) {
        const dash = f.dashed ? ` stroke-dasharray="${kind === 'shippingLane' ? '14 9' : '7 6'}"` : '';
        L.lines += `<polyline class="${kind === 'shippingLane' ? 'lane' : 'line'}" points="${pts(f.line)}"${dash}><title>${esc(f.name || kind)}</title></polyline>`;
        descBits.push(f.name || kind);
      } else if (kind === 'marker' && Array.isArray(f.points)) {
        f.points.forEach(p => {
          const x = r1(num(p[0])), y = r1(num(p[1]));
