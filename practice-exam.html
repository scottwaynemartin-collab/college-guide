mall areas of the Sahel, mainly along the Niger and Senegal Rivers; irrigation can cause salinization, but it is not the main driver of desertification there.","D":"Incorrect. Tree belts, such as the Great Green Wall effort, are meant to fight desertification.","E":"Incorrect. Crop rotation protects soil fertility; it does not cause desertification."},"explanation":"The Sahel is a dry strip of land just south of the Sahara. When animals eat too much of the grass, and people cut down trees and bushes, the soil has nothing to hold it. During a drought the soil dries and blows away, and the land turns more like a desert. That is desertification."},{"id":"U5-E22","n":22,"topic":"5.1","lo":"PSO-5.A","skill":"2.B","difficulty":"medium","stem":"Pastoral nomadism is most common in dry grasslands and deserts, such as parts of Central Asia, the Sahel, and the Horn of Africa, because","options":{"A":"these regions have some of the most fertile soils in the world for growing grain crops","B":"rainfall is too low and unreliable for most crops, so herders move animals to find water and grass","C":"governments in these regions require most rural families to raise farm animals instead of growing crops","D":"these regions are close to large cities whose residents buy fresh milk every day","E":"heavy rainfall throughout the year makes it impossible to keep animals in one place"},"answer":"B","rationales":{"A":"Incorrect. These regions have thin soils and little rain, which is why crop farming is difficult there.","B":"Correct. Where rain is scarce and unpredictable, growing crops is risky. Herding livestock (camels, goats, sheep, cattle) and moving them with the seasons lets people use sparse grass and water spread across large areas, an extensive practice shaped by the physical environment.","C":"Incorrect. The pattern reflects climate and environment, not government requirements.","D":"Incorrect. Nomadic herders typically live far from large city markets.","E":"Incorrect. These regions are dry; heavy year-round rain is the opposite of their climate."},"explanation":"In very dry places, crops often fail because there is not enough rain. But animals can eat the scattered grass. So herders move their animals from place to place with the seasons to find grass and water. The dry climate is the reason."},{"id":"U5-E23","n":23,"topic":"5.11","lo":"IMP-5.B","skill":"1.D","difficulty":"medium","stem":"A farming region replaces many locally saved crop varieties with a few genetically modified varieties sold under patents. Which concern is most directly associated with this change?","options":{"A":"Greater soil erosion caused by plowing steep slopes","B":"Reduced food access caused by neighborhood grocery stores closing in nearby cities","C":"Higher transport costs caused by longer routes to export markets","D":"Reduced crop diversity and greater reliance on commercial seed suppliers","E":"Higher soil salinity caused by irrigation in an arid climate"},"answer":"D","rationales":{"A":"Incorrect. The change concerns seed varieties and patents, not cultivation of steep slopes.","B":"Incorrect. The change described does not involve access to grocery stores.","C":"Incorrect. No change in transportation routes or distance to markets is described.","D":"Correct. Replacing many local varieties with a few commercial varieties reduces crop diversity, and patent restrictions can increase growers' dependence on seed suppliers. The AP course framework lists debates over reductions in biodiversity among the controversies surrounding biotechnology and GMOs.","E":"Incorrect. Soil salinization is salt buildup, usually from irrigation in dry climates; no change in irrigation is described."},"explanation":"Planting a few varieties instead of many means less crop diversity. Patents can also limit how farmers save or share seed, so they depend more on the companies that sell it."},{"id":"U5-E24","n":24,"topic":"5.11","lo":"IMP-5.B","skill":"1.A","difficulty":"easy","stem":"Which of the following best describes the fair trade movement in agriculture?","options":{"A":"A trade agreement that removes all tariffs and quotas on goods traded between countries","B":"A government program that pays farmers to leave some of their cropland unplanted","C":"A movement that seeks better trading terms and labor and environmental standards for producers","D":"A plan to replace imported food with food grown in each consumer's own backyard garden","E":"A treaty that requires every country to grow its own coffee instead of importing it"},"answer":"C","rationales":{"A":"Incorrect. That describes free trade, not fair trade.","B":"Incorrect. That describes some conservation or price-support programs.","C":"Correct. Fair trade programs seek better trading terms through standards, premiums, and, for many products, minimum prices. They also set labor and environmental standards. The AP course framework lists fair trade among movements influencing food production and consumption.","D":"Incorrect. That is closer to urban farming or the local-food movement.","E":"Incorrect. Coffee grows only in suitable tropical climates; no such treaty exists."},"explanation":"Fair trade programs try to give farmers better deals and to protect workers and the environment. For many products, such as coffee and cocoa, buyers must pay at least a minimum price plus an extra amount that farmer groups can spend on their communities."},{"id":"U5-E25","n":25,"topic":"5.2","lo":"PSO-5.B","skill":"1.D","difficulty":"medium","stem":"Property boundaries in parts of the original thirteen U.S. colonies were described using natural features such as streams, large trees, and stones, producing irregularly shaped parcels. This survey method is called","options":{"A":"township and range","B":"the long-lot system","C":"the open-field system","D":"metes and bounds","E":"enclosure"},"answer":"D","rationales":{"A":"Incorrect. Township and range uses a rectangular grid of squares, not natural landmarks.","B":"Incorrect. Long lots are narrow strips running back from a river, used in French settlement areas.","E":"Incorrect. Enclosure is the British consolidation of open fields and common land, not a surveying method.","D":"Correct. Metes and bounds describes boundaries by distances and directions between landmarks such as streams, trees, and stones, producing irregular parcels. It was widely used in the colonial East and came from British practice.","C":"Incorrect. The open-field system was the medieval European pattern of scattered strips farmed around a village, not a way of describing property lines."},"explanation":"Metes and bounds uses landmarks to mark property lines: \"from the big oak tree, 200 feet to the creek, then along the creek to the stone wall.\" Because nature is not in straight lines, the parcels have odd, irregular shapes. You see it in the eastern U.S."}]}}}};</script>
<script>/* GeoArcade · AP Practice Exam · stimulus renderer
   Everything here is driven by the JSON stimulus object; nothing is hard-coded per question.
   Supported stimulus.type: table | bar | districtMap | schematicMap. Anything else -> "stimulus unavailable" card. */
window.PE_STIM = (function () {
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let uid = 0;
  const nid = () => 'st' + (++uid) + '_' + Math.random().toString(36).slice(2, 6);
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : (parseFloat(v) || 0);
  const fmt = v => Number.isInteger(v) ? v.toLocaleString('en-US') : (+v).toLocaleString('en-US', { maximumFractionDigits: 1 });
  const r1 = v => Math.round(v * 10) / 10;

  function render(stim) {
    if (!stim || typeof stim !== 'object') return unavailable();
    try {
      switch (stim.type) {
        case 'table': return table(stim);
        case 'bar': return bar(stim);
        case 'districtMap': return districtMap(stim);
        case 'schematicMap': return schematicMap(stim);
        case 'rings': return rings(stim);
        default: return unavailable(stim.type);
      }
    } catch (e) {
      if (window.console && console.warn) console.warn('stimulus render failed', e);
      return unavailable(stim.type);
    }
  }

  function unavailable(type) {
    return `<figure class="stim unavail" role="note"><div>⚠︎ Stimulus unavailable${type ? ` <span class="muted">(${esc(type)})</span>` : ''}</div><div class="small muted">You can still answer the question. Tell your AP Human Geography teacher which question this is.</div></figure>`;
  }
  const title = t => t ? `<figcaption class="stim-title">${esc(t)}</figcaption>` : '';
  const source = s => s ? `<div class="stim-source">Source: ${esc(s)}</div>` : '';

  /* ---------- table ---------- */
  function tableHTML(t, caption) {
    const cols = t.columns || [], rows = t.rows || [];
    return `<div class="tscroll"><table class="stab"${caption ? ` aria-label="${esc(caption)}"` : ''}><thead><tr>${cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  function table(s) {
    return `<figure class="stim stim-table">${title(s.title)}${tableHTML(s, s.title)}${source(s.source)}</figure>`;
  }

  /* ---------- grouped bar chart (inline SVG) ---------- */
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const f = raw / p;
    const m = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return m * p;
  }
  function bar(s) {
    const cats = s.categories || [], series = s.series || [];
    const maxV = Math.max(1, ...series.flatMap(sr => (sr.values || []).map(num)));
    const yMax = num(s.yMax) > 0 ? num(s.yMax) : niceStep(maxV / 5) * 5;
    const W = 640, H = 380, m = { t: 20, r: 18, b: 56, l: 70 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const step = niceStep(yMax / 5);
    const y = v => m.t + ph - (v / yMax) * ph;
    const gw = pw / Math.max(1, cats.length), n = Math.max(1, series.length);
    const bw = Math.min(58, (gw * 0.72) / n), groupW = bw * n;
    const id = nid(), tid = id + 't', did = id + 'd';
    let grid = '';
    for (let v = 0; v <= yMax + 1e-9; v += step) {
      grid += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${r1(y(v))}" y2="${r1(y(v))}"/><text class="tick" x="${m.l - 9}" y="${r1(y(v) + 4)}" text-anchor="end">${fmt(v)}</text>`;
    }
    let bars = '';
    cats.forEach((c, ci) => {
      const x0 = m.l + ci * gw + (gw - groupW) / 2;
      series.forEach((sr, si) => {
        const v = num((sr.values || [])[ci]);
        const x = x0 + si * bw, h = Math.max(0, ph * (v / yMax));
        bars += `<rect class="bar s${si}" x="${r1(x + 3)}" y="${r1(y(v))}" width="${r1(bw - 6)}" height="${r1(h)}" rx="3"><title>${esc(c)} · ${esc(sr.name)}: ${fmt(v)}</title></rect>`;
        if (si === 1) bars += `<rect x="${r1(x + 3)}" y="${r1(y(v))}" width="${r1(bw - 6)}" height="${r1(h)}" rx="3" fill="url(#${id}h)" pointer-events="none"/>`;
        bars += `<text class="val" x="${r1(x + bw / 2)}" y="${r1(y(v) - 6)}" text-anchor="middle">${fmt(v)}</text>`;
      });
      bars += `<text class="cat" x="${r1(m.l + ci * gw + gw / 2)}" y="${H - m.b + 22}" text-anchor="middle">${esc(c)}</text>`;
    });
    const axes = `<line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t + ph}"/><line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ph}" y2="${m.t + ph}"/>`;
    const ylab = s.yLabel ? `<text class="ylab" transform="translate(16 ${r1(m.t + ph / 2)}) rotate(-90)" text-anchor="middle">${esc(s.yLabel)}</text>` : '';
    const legend = `<div class="legend" aria-hidden="true">${series.map((sr, i) => `<span class="lg"><i class="sw s${i}"></i>${esc(sr.name)}</span>`).join('')}</div>`;
    const desc = `Grouped bar chart with ${cats.length} categories and ${series.length} series. ` + cats.map((c, ci) => `${c}: ` + series.map(sr => `${sr.name} ${fmt(num((sr.values || [])[ci]))}`).join(', ')).join('. ') + '.';
    const srTable = `<div class="sr-only"><table><caption>${esc(s.title || 'Chart data')}</caption><thead><tr><th scope="col">Category</th>${series.map(sr => `<th scope="col">${esc(sr.name)}</th>`).join('')}</tr></thead><tbody>${cats.map((c, ci) => `<tr><th scope="row">${esc(c)}</th>${series.map(sr => `<td>${fmt(num((sr.values || [])[ci]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    return `<figure class="stim stim-bar">${title(s.title)}${legend}<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid} ${did}"><title id="${tid}">${esc(s.title || 'Bar chart')}</title><desc id="${did}">${esc(desc)}</desc><defs><pattern id="${id}h" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,.55)" stroke-width="2"/></pattern></defs>${grid}${axes}${bars}${ylab}</svg></div>${srTable}${s.text ? `<p class="stim-text">${esc(s.text)}</p>` : ''}${source(s.source)}</figure>`;
  }

  /* ---------- district maps ---------- */
  function districtMap(s) {
    const g = s.grid || {}, R = num(g.rows) || (g.blueShare || []).length, C = num(g.cols) || ((g.blueShare || [])[0] || []).length;
    const bs = g.blueShare || [];
    const cell = 50, pad = 4, W = C * cell + pad * 2, H = R * cell + pad * 2;
    const plans = (s.plans || []).map((p, pi) => {
      const dmap = {};
      (p.districts || []).forEach((d, di) => d.forEach(rc => { dmap[rc[0] + ',' + rc[1]] = di; }));
      let cells = '', borders = '';
      const X = c => pad + c * cell, Y = r => pad + r * cell;
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        const v = num((bs[r] || [])[c]);
        const blue = v >= 50;
        cells += `<rect class="pc ${blue ? 'blue' : 'orange'}" x="${X(c)}" y="${Y(r)}" width="${cell}" height="${cell}"/><text class="pval" x="${X(c) + cell / 2}" y="${Y(r) + cell / 2 + 5}" text-anchor="middle">${fmt(v)}</text>`;
        const me = dmap[r + ',' + c];
        const diff = (rr, cc) => rr < 0 || cc < 0 || rr >= R || cc >= C || dmap[rr + ',' + cc] !== me;
        if (diff(r - 1, c)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r)}" x2="${X(c) + cell}" y2="${Y(r)}"/>`;
        if (diff(r, c - 1)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r)}" x2="${X(c)}" y2="${Y(r) + cell}"/>`;
        if (diff(r + 1, c)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r) + cell}" x2="${X(c) + cell}" y2="${Y(r) + cell}"/>`;
        if (diff(r, c + 1)) borders += `<line class="dline" x1="${X(c) + cell}" y1="${Y(r)}" x2="${X(c) + cell}" y2="${Y(r) + cell}"/>`;
      }
      const did = nid();
      const desc = (p.districts || []).map((d, di) => `District ${di + 1}: ` + d.map(rc => `row ${rc[0] + 1} column ${rc[1] + 1} (${fmt(num((bs[rc[0]] || [])[rc[1]]))}% Blue)`).join(', ')).join('. ');
      return `<figure class="dplan"><svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${did}"><title id="${did}">${esc(p.name || 'Plan ' + (pi + 1))}. ${esc(desc)}</title><g>${cells}</g><g>${borders}</g></svg><figcaption>${esc(p.name || 'Plan ' + (pi + 1))}</figcaption></figure>`;
    });
    const legend = `<div class="legend"><span class="lg"><i class="sw pblue"></i>Majority Blue Party (≥ 50)</span><span class="lg"><i class="sw porange"></i>Majority Orange Party (&lt; 50)</span><span class="lg"><i class="sw dline"></i>District boundary</span></div>`;
    return `<figure class="stim stim-dmap dmap">${title(s.title)}${s.note ? `<p class="stim-note">${esc(s.note)}</p>` : ''}<div class="dplans">${plans.join('')}</div>${legend}${s.resultsTable ? `<div class="dresults">${title(s.resultsTable.title)}${tableHTML(s.resultsTable, s.resultsTable.title)}</div>` : ''}${source(s.source)}</figure>`;
  }

  /* ---------- schematic maps ---------- */
  const pts = poly => (poly || []).map(p => `${r1(num(p[0]))},${r1(num(p[1]))}`).join(' ');
  function bbox(poly) {
    const xs = poly.map(p => num(p[0])), ys = poly.map(p => num(p[1]));
    return { x1: Math.min(...xs), y1: Math.min(...ys), x2: Math.max(...xs), y2: Math.max(...ys) };
  }
  const contains = (a, b) => a.x1 <= b.x1 && a.y1 <= b.y1 && a.x2 >= b.x2 && a.y2 >= b.y2 && (a.x2 - a.x1) * (a.y2 - a.y1) > (b.x2 - b.x1) * (b.y2 - b.y1);
  function wrap(text, max) {
    const words = String(text || '').split(/\s+/), lines = []; let cur = '';
    words.forEach(w => { if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
    if (cur) lines.push(cur);
    return lines;
  }
  function star(cx, cy, R, r, n) {
    let d = '';
    for (let i = 0; i < n * 2; i++) {
      const a = Math.PI / n * i - Math.PI / 2, rad = i % 2 ? r : R;
      d += (i ? 'L' : 'M') + r1(cx + rad * Math.cos(a)) + ',' + r1(cy + rad * Math.sin(a));
    }
    return d + 'Z';
  }
  function ownerKey(owner) { return String(owner || '').replace(/\s*\(.*$/, '').trim() || 'owner'; }

  function schematicMap(s) {
    const cv = s.canvas || {}, W = num(cv.width) || 800, H = num(cv.height) || 400;
    const feats = Array.isArray(s.features) ? s.features : [];
    const id = nid();
    const L = { claims: '', zones: '', hatchZones: '', land: '', lines: '', markers: '', labels: '', arrows: '', scale: '', brackets: '' };
    const owners = [];
    const ownerIdx = o => { const k = ownerKey(o); let i = owners.indexOf(k); if (i < 0) { owners.push(k); i = owners.length - 1; } return i; };
    const claimShapes = {};
    const zones = feats.filter(f => f.kind === 'zone' && Array.isArray(f.polygon));
    const zb = zones.map(z => bbox(z.polygon));
    const descBits = [];

    feats.forEach((f, fi) => {
      const kind = f.kind;
      if (kind === 'land' && Array.isArray(f.polygon)) {
        const cls = f.style === 'power' ? 'power' : f.style === 'small' ? 'small' : '';
        L.land += `<polygon class="land ${cls}" points="${pts(f.polygon)}"><title>${esc(f.name || 'Land')}</title></polygon>`;
        if (f.labelAt && f.name) {
          const lb = bbox(f.polygon), perChar = f.style === 'power' ? 10.5 : 8.5;
          const lines = wrap(f.name, Math.max(8, Math.floor((lb.x2 - lb.x1 - 8) / perChar)));
          const lh = f.style === 'power' ? 22 : 18, y0 = num(f.labelAt[1]) + 6 - (lines.length - 1) * lh / 2;
          lines.forEach((ln, i) => { L.labels += `<text class="lbl ${f.style === 'power' ? 'big' : ''}" x="${r1(num(f.labelAt[0]))}" y="${r1(y0 + i * lh)}">${esc(ln)}</text>`; });
        }
        descBits.push(f.name);
      } else if (kind === 'territorialSea') {
        const oi = ownerIdx(f.owner);
        let shape = '';
        if (f.circle && f.circle.center) shape = `<circle cx="${r1(num(f.circle.center[0]))}" cy="${r1(num(f.circle.center[1]))}" r="${r1(num(f.circle.radius))}"/>`;
        else if (Array.isArray(f.polygon)) shape = `<polygon points="${pts(f.polygon)}"/>`;
        (claimShapes[oi] = claimShapes[oi] || []).push(shape);
        descBits.push(`${f.owner || 'claim'} territorial sea claim`);
      } else if (kind === 'island' && f.center) {
        const cx = r1(num(f.center[0])), cy = r1(num(f.center[1])), rr = r1(num(f.radius) || 10);
        L.land += `<circle class="island" cx="${cx}" cy="${cy}" r="${rr}"><title>${esc(f.name || 'Island')}</title></circle>`;
        if (f.name) L.labels += `<text class="lbl sm" x="${cx}" y="${r1(cy + rr + 15)}">${esc(f.name)}</text>`;
        descBits.push(f.name);
      } else if (kind === 'zone' && Array.isArray(f.polygon)) {
        const zi = zones.indexOf(f), b = zb[zi];
        const inside = zb.some((o, j) => j !== zi && contains(o, b));
        const holds = zb.some((o, j) => j !== zi && contains(b, o));
        const shade = Math.min(3, zi);
        if (inside) L.hatchZones += `<polygon class="zone hatch" points="${pts(f.polygon)}" fill="url(#${id}zh)"><title>${esc(f.name || 'Zone')}</title></polygon>`;
        else { const poly = `<polygon class="zone z${shade}" points="${pts(f.polygon)}"><title>${esc(f.name || 'Zone')}</title></polygon>`; L.zones = holds ? poly + L.zones : L.zones + poly; }
        if (holds) L.brackets += `<path class="bracket" d="M${r1(b.x1 + 3)},${r1(b.y2 - 16)} v9 H${r1(b.x2 - 3)} v-9"/>`;
        if (f.labelAt) {
          const lx = r1(num(f.labelAt[0])), ly = r1(num(f.labelAt[1]));
          L.labels += `<text class="lbl" x="${lx}" y="${ly}">${esc(f.name || '')}</text>`;
          if (f.sublabel) wrap(f.sublabel, Math.max(10, Math.min(30, Math.floor((b.x2 - b.x1 - 10) / 6.6)))).forEach((ln, i) => { L.labels += `<text class="sub" x="${lx}" y="${ly + 17 + i * 14}">${esc(ln)}</text>`; });
        }
        descBits.push(`${f.name}${f.sublabel ? ' (' + f.sublabel + ')' : ''}`);
      } else if ((kind === 'line' || kind === 'shippingLane') && Array.isArray(f.line)) {
        const dash = f.dashed ? ` stroke-dasharray="${kind === 'shippingLane' ? '14 9' : '7 6'}"` : '';
        L.lines += `<polyline class="${kind === 'shippingLane' ? 'lane' : 'line'}" points="${pts(f.line)}"${dash}><title>${esc(f.name || kind)}</title></polyline>`;
        descBits.push(f.name || kind);
      } else if (kind === 'marker' && Array.isArray(f.points)) {
        f.points.forEach(p => {
          const x = r1(num(p[0])), y = r1(num(p[1]));
          if (f.symbol === 'conflict') L.markers += `<path class="conflict" d="${star(x, y, 11, 5, 8)}"><title>${esc(f.name || 'Conflict')}</title></path>`;
          else if (f.symbol === 'baseN' || f.symbol === 'baseS') L.markers += `<rect class="${f.symbol}" x="${x - 7}" y="${y - 7}" width="14" height="14" rx="2"><title>${esc(f.name || 'Base')}</title></rect>`;
          else if (f.symbol === 'house') L.markers += `<path class="house" d="M${x - 7},${y + 6} V${y - 1} L${x},${y - 7} L${x + 7},${y - 1} V${y + 6} Z"><title>${esc(f.name || 'House')}</title></path>`;
          else L.markers += `<circle class="baseN" cx="${x}" cy="${y}" r="6"><title>${esc(f.name || 'Marker')}</title></circle>`;
        });
        descBits.push(`${f.name || 'markers'} at ${f.points.length} location${f.points.length === 1 ? '' : 's'}`);
      } else if (kind === 'arrow' && f.from && f.to) {
        L.arrows += `<line class="arrow" x1="${r1(num(f.from[0]))}" y1="${r1(num(f.from[1]))}" x2="${r1(num(f.to[0]))}" y2="${r1(num(f.to[1]))}" marker-end="url(#${id}ah)"><title>${esc(f.name || 'Arrow')}</title></line>`;
        descBits.push(f.name || 'arrow');
      } else if (kind === 'scaleBar' && f.from && f.to) {
        const x1 = r1(num(f.from[0])), y1 = r1(num(f.from[1])), x2 = r1(num(f.to[0])), y2 = r1(num(f.to[1]));
        L.scale += `<line class="scale" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="scale" x1="${x1}" y1="${y1 - 5}" x2="${x1}" y2="${y1 + 5}"/><line class="scale" x1="${x2}" y1="${y2 - 5}" x2="${x2}" y2="${y2 + 5}"/>${f.label ? `<text class="scalelbl" x="${r1((x1 + x2) / 2)}" y="${y1 - 8}">${esc(f.label)}</text>` : ''}`;
      }
    });
    Object.keys(claimShapes).forEach(oi => {
      const i = +oi, cls = i === 0 ? 'a' : 'b';
      L.claims += `<g class="claim ${cls}" opacity="${i === 0 ? '.38' : '.34'}">${claimShapes[oi].join('')}</g>`;
      if (i === 1) L.claims += `<g fill="url(#${id}ch)" opacity=".9">${claimShapes[oi].join('')}</g>`;
    });
    const legend = Array.isArray(s.legend) && s.legend.length ? `<div class="legend">${s.legend.map(item => `<span class="lg">${swatch(item.swatch)}${esc(item.label)}</span>`).join('')}</div>` : '';
    const tid = id + 't', did = id + 'd';
    const desc = (s.description ? s.description + ' ' : '') + 'Map features: ' + descBits.filter(Boolean).join('; ') + '.';
    const svg = `<div class="smap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid} ${did}"><title id="${tid}">${esc(s.title || 'Map')}</title><desc id="${did}">${esc(desc)}</desc><defs><pattern id="${id}zh" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><line class="hatchline" x1="0" y1="0" x2="0" y2="9"/></pattern><pattern id="${id}ch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(-45)"><line class="claim-hatch" x1="0" y1="0" x2="0" y2="10"/></pattern><marker id="${id}ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="water" x="0" y="0" width="${W}" height="${H}"/>${L.zones}${L.hatchZones}${L.claims}${L.land}${L.lines}${L.brackets}${L.markers}${L.arrows}${L.labels}${L.scale}</svg></div>`;
    return `<figure class="stim stim-smap">${title(s.title)}${svg}${legend}${s.description ? `<p class="stim-desc">${esc(s.description)}</p>` : ''}${s.note ? `<p class="stim-note">${esc(s.note)}</p>` : ''}${source(s.source)}</figure>`;
  }
  /* ---------- von Thünen-style concentric ring diagram ---------- */
  function rings(s) {
    const rs = Array.isArray(s.rings) ? s.rings : [];
    const W = 640, H = 420, cx = 320, cy = 210, r0 = 46, step = Math.max(28, Math.floor((190 - r0) / Math.max(1, rs.length)));
    const id = nid(), tid = id + 't', did = id + 'd';
    let body = '', labels = '';
    for (let i = rs.length - 1; i >= 0; i--) {
      const R = r0 + step * (i + 1);
      body += `<circle class="ring r${i % 4}" cx="${cx}" cy="${cy}" r="${R}"><title>${esc('Ring ' + (rs[i].label || i + 1))}</title></circle>`;
    }
    rs.forEach((rg, i) => {
      const mid = r0 + step * i + step / 2;
      [[cx + mid, cy], [cx - mid, cy], [cx, cy - mid], [cx, cy + mid]].forEach(([x, y]) => {
        labels += `<text class="rlbl" x="${r1(x)}" y="${r1(y + 6)}">${esc(rg.label || String(i + 1))}</text>`;
      });
    });
    const outerR = r0 + step * rs.length;
    const outer = s.outer ? `<text class="rout" x="${W - 14}" y="${H - 14}" text-anchor="end">${esc(s.outer)}</text><text class="rout" x="14" y="26" text-anchor="start">${esc(s.outer)}</text>` : '';
    const center = `<circle class="rcity" cx="${cx}" cy="${cy}" r="${r0}"/>` + wrap(s.center || 'Market', 10).map((ln, i, a) => `<text class="rcl" x="${cx}" y="${r1(cy + 5 - (a.length - 1) * 8 + i * 16)}">${esc(ln)}</text>`).join('');
    const desc = (s.description ? s.description + ' ' : '') + `Rings from the center outward: ${rs.map((rg, i) => rg.label || i + 1).join(', ')}.`;
    const svg = `<div class="smap rings"><svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid} ${did}"><title id="${tid}">${esc(s.title || 'Ring diagram')}</title><desc id="${did}">${esc(desc)}</desc><rect class="rbg" x="0" y="0" width="${W}" height="${H}"/>${body}${center}${labels}${outer}<circle class="rline" cx="${cx}" cy="${cy}" r="${outerR}"/></svg></div>`;
    return `<figure class="stim stim-rings">${title(s.title)}${svg}${s.description ? `<p class="stim-desc">${esc(s.description)}</p>` : ''}${s.note ? `<p class="stim-note">${esc(s.note)}</p>` : ''}${source(s.source)}</figure>`;
  }

  function swatch(key) {
    switch (key) {
      case 'power': case 'small': case 'land': return `<i class="sw ${key}"></i>`;
      case 'conflict': return `<svg viewBox="0 0 22 16" aria-hidden="true"><path class="conflict" d="${star(11, 8, 7.5, 3.5, 8)}" style="fill:var(--conflict);stroke:#fff"/></svg>`;
      case 'baseN': return `<svg viewBox="0 0 22 16" aria-hidden="true"><rect x="5" y="2" width="12" height="12" rx="2" style="fill:var(--base-n)"/></svg>`;
      case 'baseS': return `<svg viewBox="0 0 22 16" aria-hidden="true"><rect x="5" y="2" width="12" height="12" rx="2" style="fill:var(--base-s)"/></svg>`;
      case 'territorialSeaA': return `<svg viewBox="0 0 22 16" aria-hidden="true"><rect width="22" height="16" rx="3" style="fill:var(--stim-water)"/><rect width="22" height="16" rx="3" style="fill:var(--claim-a);opacity:.38"/></svg>`;
      case 'territorialSeaB': return `<svg viewBox="0 0 22 16" aria-hidden="true"><rect width="22" height="16" rx="3" style="fill:var(--stim-water)"/><rect width="22" height="16" rx="3" style="fill:var(--claim-b);opacity:.34"/><path d="M-2,8 L8,-2 M4,18 L18,2 M12,18 L24,6" style="stroke:var(--claim-b);stroke-width:2.2"/></svg>`;
      case 'overlap': return `<svg viewBox="0 0 22 16" aria-hidden="true"><rect width="22" height="16" rx="3" style="fill:var(--stim-water)"/><rect width="22" height="16" rx="3" style="fill:var(--claim-a);opacity:.38"/><rect width="22" height="16" rx="3" style="fill:var(--claim-b);opacity:.34"/><path d="M-2,8 L8,-2 M4,18 L18,2 M12,18 L24,6" style="stroke:var(--claim-b);stroke-width:2.2"/></svg>`;

/* GeoArcade · AP Practice Exam · app

    const q = E.qs[E.i], n = E.qs.length, pick = E.answers[q.id], st = stimFor(E.qs, q), flagged = !!E.flags[q.id];
    const answered = Object.keys(E.answers).length;
    const opts = LETTERS.map(L => `<button class="xopt" role="radio" aria-checked="${pick === L}" data-act="x-pick" data-arg="${L}"><span class="ltr" aria-hidden="true">${L}</span><span class="txt"><span class="sr-only">${L}. </span>${esc(q.options[L])}</span></button>`).join('');
    const stimCol = st ? `<aside class="scol ${E.stimOff ? 'off' : ''}" aria-label="Stimulus"><div class="sticky">${st.label ? `<div class="setlabel">${esc(st.label)}</div>` : ''}<button class="act ghost sm stoggle" data-act="x-stim" aria-expanded="${!E.stimOff}">${E.stimOff ? 'Show stimulus' : 'Hide stimulus'}</button><div class="stimwrap">${STIM.render(st.stim)}</div></div></aside>` : '';
    const nav = E.navOpen ? `<div class="veil" data-act="x-nav-close"><div class="drawer" role="dialog" aria-modal="true" aria-label="Question navigator" data-stop="1"><h3>Questions <button class="act quiet sm" data-act="x-nav-close" aria-label="Close navigator">✕</button></h3>
        <div class="navgrid">${E.qs.map((o, i) => `<button class="navq ${E.answers[o.id] ? 'ans' : ''} ${E.flags[o.id] ? 'flag' : ''} ${i === E.i ? 'cur' : ''}" data-act="x-goto" data-arg="${i}" aria-label="Question ${i + 1}, ${E.answers[o.id] ? 'answered' : 'unanswered'}${E.flags[o.id] ? ', flagged' : ''}${i === E.i ? ', current' : ''}" ${i === E.i ? 'aria-current="true"' : ''}>${i + 1}</button>`).join('')}</div>
        <div class="navkey"><span><i class="ans"></i>Answered (${answered})</span><span><i></i>Unanswered (${n - answered})</span><span><i class="flag"></i>Flagged (${Object.keys(E.flags).length})</span></div>
        <div style="margin-top:auto" class="acts"><button class="act primary wide" data-act="x-submit-ask">Submit exam</button></div></div></div>` : '';
    const unanswered = E.qs.map((o, i) => E.answers[o.id] ? null : i + 1).filter(Boolean);
    const flags = E.qs.map((o, i) => E.flags[o.id] ? i + 1 : null).filter(Boolean);
    const confirm = E.confirm ? `<div class="veil center" data-act="x-confirm-close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cfh" data-stop="1"><h3 id="cfh">Submit your exam?</h3>
        <div class="list">${unanswered.length ? `<div><b>${unanswered.length} unanswered:</b><div class="nums">${unanswered.map(x => `<span>${x}</span>`).join('')}</div></div>` : '<div><b>All questions answered.</b></div>'}${flags.length ? `<div><b>${flags.length} flagged:</b><div class="nums">${flags.map(x => `<span class="f">${x}</span>`).join('')}</div></div>` : ''}<div class="muted small">There is no penalty for guessing. Once you submit you cannot change answers.</div></div>
        <div class="acts end"><button class="act ghost" data-act="x-confirm-close" id="cfback">Keep working</button><button class="act primary" data-act="x-submit">Submit exam</button></div></div></div>` : '';
    return `<header class="xtop"><div class="xtop-in"><div class="who">${upill(E.unit)}<span class="ellip">Timed exam</span></div><div class="qpos"><span class="long">Question ${E.i + 1} of ${n}</span><span class="short" aria-hidden="true">${E.i + 1}<span class="muted">/${n}</span></span></div><div class="bar-sp"></div>${timerHTML()}<button class="act ghost sm" id="navbtn" data-act="x-nav" aria-haspopup="dialog" aria-expanded="${E.navOpen}" aria-label="Questions navigator"><span class="long">Questions</span><svg class="ic short" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></g></svg></button><button class="act primary sm" data-act="x-submit-ask">Submit</button></div></header>
      <main id="main"><div class="xwrap ${st ? 'has-stim' : ''}">${stimCol}<section class="xq" aria-labelledby="qhead"><h2 class="qn" id="qhead" tabindex="-1">Question ${E.i + 1}${flagged ? '<span class="flagged-note"> · ⚑ Flagged</span>' : ''}</h2><p class="stem">${esc(q.stem)}</p>
        <div class="xopts" role="radiogroup" aria-label="Answer choices">${opts}</div>
        <div class="xnav"><button class="act ghost" data-act="x-prev" ${E.i === 0 ? 'disabled' : ''}>← Previous</button><div class="mid"><button class="act ghost sm" data-act="x-flag" aria-pressed="${flagged}">⚑ ${flagged ? 'Flagged' : 'Flag'}</button></div>${E.i + 1 < n ? `<button class="act primary" data-act="x-next">Next →</button>` : `<button class="act primary" data-act="x-submit-ask">Review &amp; submit</button>`}</div></section></div></main>${nav}${confirm}`;
  }
  function xGoto(i) {
    E.i = Math.max(0, Math.min(E.qs.length - 1, i)); E.navOpen = false; persistExam(); render(); focusQ();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  function xPick(L) {
    const q = E.qs[E.i]; if (!q.options[L]) return;
    E.answers[q.id] = L; persistExam();
    document.querySelectorAll('.xopt').forEach(b => b.setAttribute('aria-checked', String(b.dataset.arg === L)));
  }
  function xFlag() {
    const q = E.qs[E.i]; if (E.flags[q.id]) delete E.flags[q.id]; else E.flags[q.id] = true;
    persistExam(); render(); announce(E.flags[q.id] ? `Question ${E.i + 1} flagged` : `Flag removed from question ${E.i + 1}`);
    const b = document.querySelector('[data-act="x-flag"]'); if (b) b.focus({ preventScroll: true });
  }
  function startTimer() { stopTimer(); timerId = setInterval(tick, 250); tick(); }
  function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }
  function tick() {
    if (!E || E.submitted) { stopTimer(); return; }
    const rem = Math.max(0, E.endsAt - Date.now());
    const el = document.getElementById('tmr');
    if (el) {
      const d = el.querySelector('.digits'); if (d) d.textContent = mmss(rem);
      el.classList.toggle('warn', rem <= 300000 && rem > 60000); el.classList.toggle('crit', rem <= 60000);
      const mins = Math.ceil(rem / 60000);
      [10, 5, 2, 1].forEach(m => { if (mins <= m && !E.announced[m]) { E.announced[m] = true; const sr = el.querySelector('#tmrsr'); if (sr) sr.textContent = `${m} minute${m === 1 ? '' : 's'} remaining`; } });
    }
    if (rem <= 0) submitExam(true);
  }
  function submitExam(auto) {
    if (!E || E.submitted) return;
    stopTimer(); E.submitted = true; E.confirm = false; E.navOpen = false;
    const r = scoreSet(E.qs, E.answers);
    r.timeUsed = Math.min(E.endsAt - E.startedAt, Date.now() - E.startedAt); r.auto = !!auto; r.when = Date.now();
    E.result = r; store.del('exam:' + E.unit);
    const best = store.get('best:' + E.unit);
    if (!best || r.correct > best.correct) store.set('best:' + E.unit, { correct: r.correct, total: r.total, pct: r.pct, when: r.when });
    S.screen = 'xscore'; S.showCopy = false; render(); window.scrollTo(0, 0);
    announce(auto ? `Time is up. Your exam was submitted. You scored ${r.correct} out of ${r.total}.` : `Exam submitted. You scored ${r.correct} out of ${r.total}.`);
    if (r.pct >= 50) confetti();
  }
  function viewScore() {
    const r = E.result, unit = E.unit, d = DATA[unit], n = r.total;
    const ap = apEstimate(r.pct);
    const bestNow = store.get('best:' + unit);
    return topbar(`${upill(unit)}<span class="ellip">Score report</span>`, `<button class="act quiet sm" data-act="home">Units</button>`) + `<main id="main"><div class="score">
      <section class="score-hero"><div class="eyebrow">${esc(d.exam.title || d.title)}</div><div class="big" aria-label="${r.correct} out of ${n}">${r.correct}<small>/${n}</small></div><div class="pct">${r.pct}% correct</div><div class="sub">${r.auto ? 'Time ran out and the exam submitted itself · ' : ''}Time used ${mmss(r.timeUsed)} of ${d.exam.timeMinutes}:00${bestNow && bestNow.correct === r.correct && bestNow.when === r.when ? ' · New best for this unit' : ''}</div>
        ${SHOW_AP_ESTIMATE ? `<div class="apbadge" role="note"><span class="l">Estimated AP score</span><span class="n">${ap}</span><span class="d">Rough estimate from your percent — the College Board does not publish cutoffs.</span></div>` : ''}
        <div class="acts center" style="margin-top:20px"><button class="act primary" data-act="x-review" data-arg="all">Review all ${n}</button>${r.missed.length ? `<button class="act ghost" data-act="x-review" data-arg="missed">Missed only (${r.missed.length})</button>` : ''}</div></section>
      <div class="two"><section class="panel"><h3>By topic</h3>${topicRows(unit, r.byTopic)}</section><section class="panel"><h3>By skill category</h3>${skillRows(r.bySkill)}</section></div>
      <section class="panel"><div class="acts between"><div class="acts"><button class="act ghost" data-act="x-copy">Copy my results</button><button class="act ghost" data-act="x-retake">Retake</button></div><button class="act soft" data-act="home">Back to units</button></div>
        ${S.showCopy ? `<div class="copybox" style="margin-top:14px"><div class="small muted">Copying was blocked here, so select the text below and copy it yourself (Ctrl/Cmd + C).</div><textarea id="copyta" readonly aria-label="Results summary">${esc(resultsText())}</textarea></div>` : ''}</section></div></main>`;
  }
  function resultsText() {
    const r = E.result, d = DATA[E.unit];
    const lines = [`AP Practice Exam · Unit ${E.unit}: ${d.title}`, `Score: ${r.correct}/${r.total} (${r.pct}%)${SHOW_AP_ESTIMATE ? ` · Estimated AP score: ${apEstimate(r.pct)} (rough estimate)` : ''}`, `Time used: ${mmss(r.timeUsed)} of ${d.exam.timeMinutes}:00${r.auto ? ' (auto-submitted)' : ''}`, '', 'By topic:'];
    (d.topics || []).forEach(t => { const x = r.byTopic[t.id]; if (x) lines.push(`  ${t.id} ${t.name}: ${x.c}/${x.t}`); });
    lines.push('', 'By skill:');
    Object.keys(r.bySkill).sort().forEach(k => lines.push(`  ${SKILLS[k] || 'Skill ' + k} (${k}.x): ${r.bySkill[k].c}/${r.bySkill[k].t}`));
    lines.push('', `Missed: ${r.missed.length ? r.missed.map(q => q.n || E.qs.indexOf(q) + 1).join(', ') : 'none'}`, '', 'GeoArcade · sites.google.com/view/geoarcade');
    return lines.join('\n');
  }
  async function copyResults() {
    const text = resultsText();
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard');
      await navigator.clipboard.writeText(text); toast('Results copied');
    } catch (e) {
      S.showCopy = true; render();
      const ta = document.getElementById('copyta'); if (ta) { ta.focus(); ta.select(); }
    }
  }
  function viewReview() {
    const r = E.result, unit = E.unit, f = S.rvFilter || 'all';
    const list = E.qs.map((q, i) => ({ q, i })).filter(o => f === 'all' || E.answers[o.q.id] !== o.q.answer);
    const seenSets = {};
    const items = list.map(({ q, i }) => {
      const pick = E.answers[q.id], ok = pick === q.answer, state = !pick ? 'skip' : ok ? 'ok' : 'bad';
      const st = stimFor(E.qs, q); let stimHTML = '';
      if (st) {
        if (q.set && seenSets[q.set]) stimHTML = `<details class="more"><summary>Show the shared stimulus${st.label ? ` (${esc(st.label.replace(/\s*refer to.*$/i, ''))})` : ''}</summary><div class="inner">${STIM.render(st.stim)}</div></details>`;
        else { stimHTML = `${st.label ? `<div class="setlabel">${esc(st.label)}</div>` : ''}${STIM.render(st.stim)}`; if (q.set) seenSets[q.set] = true; }
      }
      return `<article class="rv ${state}" id="rv${i + 1}"><header><span class="rn">Question ${i + 1}</span><span class="rvb ${state}">${state === 'ok' ? '✓ Correct' : state === 'bad' ? '✗ Missed' : '– Not answered'}</span>${metaTag(unit, q)}</header>${stimHTML}<p class="stem">${esc(q.stem)}</p>
        <ol class="rvopts" aria-label="Answer choices">${LETTERS.map(L => { const isC = L === q.answer, isP = L === pick; const cls = isC ? 'is-correct' : isP ? 'is-pick' : ''; const mk = isC && isP ? '✓ Your answer · correct' : isC ? '✓ Correct answer' : isP ? '✗ Your answer' : ''; return `<li class="${cls}"><span class="ltr" aria-hidden="true">${L}</span><div><span class="sr-only">${L}. </span>${esc(q.options[L])}${mk ? `<span class="mk">${mk}</span>` : ''}</div></li>`; }).join('')}</ol>
        <div class="fbk ${ok ? 'ok' : 'bad'}"><div class="ico" aria-hidden="true">${ok ? '✓' : '✗'}</div><div class="body"><h4>${ok ? 'Why this is right' : `The answer is ${q.answer}`}</h4><p class="exp">${esc(q.explanation)}</p>
        ${q.rationales ? `<details class="more"><summary>College Board–style notes on every choice</summary><div class="inner">${LETTERS.map(L => `<div class="rat ${L === q.answer ? 'correct' : ''}"><span class="ltr" aria-hidden="true">${L}</span><div><b>${L}.</b> ${esc(q.rationales[L] || '')}</div></div>`).join('')}</div></details>` : ''}</div></div></article>`;
    }).join('');
    return topbar(`${upill(unit)}<span class="ellip">Review</span>`, `<button class="act quiet sm" data-act="x-back-score">← Score report</button>`) + `<main id="main"><div class="review"><div class="rvhead"><h2>Review · ${r.correct}/${r.total}</h2><div class="seg" role="group" aria-label="Filter"><button data-act="x-review-filter" data-arg="all" aria-pressed="${f === 'all'}">All ${r.total}</button><button data-act="x-review-filter" data-arg="missed" aria-pressed="${f === 'missed'}">Missed only (${r.missed.length})</button></div></div>
      ${items || `<div class="empty">Nothing missed. Every answer was correct.</div>`}
      <div class="acts center"><button class="act ghost" data-act="x-back-score">← Score report</button><button class="act ghost" data-act="x-retake">Retake</button><button class="act soft" data-act="home">Back to units</button></div></div></main>`;
  }

  /* ---- celebration (score report only; practice uses a tiny CSS burst) ---- */
  function confetti() {
    if (reducedMotion()) return;
    let cv = document.getElementById('confetti');
    if (!cv) { cv = document.createElement('canvas'); cv.id = 'confetti'; cv.setAttribute('aria-hidden', 'true'); document.body.appendChild(cv); }
    const ctx = cv.getContext('2d'); if (!ctx) return;
    cv.width = innerWidth; cv.height = innerHeight;
    const cols = ['#FF6A3D', '#2F6FED', '#7C3AED', '#FFC83D', '#0D9488', '#EC4899'];
    const ps = Array.from({ length: 110 }, () => ({ x: innerWidth / 2 + 240 * (Math.random() - .5), y: innerHeight * .3, vx: 13 * (Math.random() - .5), vy: -11 * Math.random() - 4, g: .3 + .2 * Math.random(), r: 4 + 5 * Math.random(), c: cols[Math.random() * cols.length | 0], a: 6.28 * Math.random(), va: .3 * (Math.random() - .5) }));
    const t0 = performance.now();
    (function frame(t) {
      const k = (t - t0) / 1700; ctx.clearRect(0, 0, cv.width, cv.height);
      if (k >= 1) { cv.remove(); return; }
      ps.forEach(p => { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k * k); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); });
      requestAnimationFrame(frame);
    })(t0);
  }

  /* =================================================================
     render + events
     ================================================================= */
  function view() {
    switch (S.screen) {
      case 'ptopics': return viewTopics();
      case 'practice': return viewPractice();
      case 'psummary': return viewSummary();
      case 'xintro': return viewIntro();
      case 'exam': return viewExam();
      case 'xscore': return viewScore();
      case 'xreview': return viewReview();
      default: return viewHome();
    }
  }
  function render() {
    document.body.classList.toggle('exam', /^x|^exam$/.test(S.screen));
    document.body.classList.toggle('practice', /^p/.test(S.screen));
    app.innerHTML = view();
    markScrollables();
    if (S.screen === 'exam') {
      if (E.navOpen) { const f = app.querySelector('.drawer .navq.cur') || app.querySelector('.drawer button'); if (f) f.focus(); }
      else if (E.confirm) { const f = document.getElementById('cfback'); if (f) f.focus(); }
    }
  }
  // Charts and maps keep a minimum width so their labels stay legible; on phones they scroll sideways.
  // Add a small hint above any that actually overflow (checked after render and on resize).
  function markScrollables() {
    app.querySelectorAll('.scrollhint').forEach(h => h.remove());
    app.querySelectorAll('.chart, .smap, .tscroll').forEach(el => {
      if (el.scrollWidth > el.clientWidth + 4) {
        const h = document.createElement('div'); h.className = 'scrollhint'; h.textContent = 'Swipe sideways to see the whole ' + (el.classList.contains('chart') ? 'chart' : el.classList.contains('smap') ? 'map' : 'table');
        el.parentNode.insertBefore(h, el);
      }
    });
  }
  let rsz = null;
  window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(markScrollables, 150); });
  const actions = {
    'home': () => { S.screen = 'home'; S.showCopy = false; render(); window.scrollTo(0, 0); },
    'ptopics': arg => { S.unit = +arg; S.screen = 'ptopics'; render(); window.scrollTo(0, 0); },
    'p-start': arg => startPractice(S.unit, arg),
    'p-pick': arg => pPick(arg),
    'p-next': () => pNext(),
    'p-topics': () => { S.unit = P ? P.unit : S.unit; S.screen = 'ptopics'; render(); window.scrollTo(0, 0); },
    'p-missed': () => { const r = scoreSet(P.qs, P.answers); startPractice(P.unit, P.topic, r.missed); P.label = 'Missed questions · ' + P.label; render(); },
    'xintro': arg => { S.unit = +arg; S.screen = 'xintro'; render(); window.scrollTo(0, 0); },
    'x-start': arg => { store.del('exam:' + arg); startExam(+arg, false); },
    'x-resume': arg => startExam(+arg, true),
    'x-pick': arg => xPick(arg),
    'x-prev': () => xGoto(E.i - 1),
    'x-next': () => xGoto(E.i + 1),
    'x-goto': arg => xGoto(+arg),
    'x-flag': () => xFlag(),
    'x-stim': () => { E.stimOff = !E.stimOff; render(); const b = document.querySelector('.stoggle'); if (b) b.focus(); },
    'x-nav': () => { E.navOpen = true; E.confirm = false; render(); },
    'x-nav-close': (arg, el, ev) => { if (ev && ev.target.closest('[data-stop]') && !ev.target.closest('[data-act="x-nav-close"]')) return; E.navOpen = false; render(); const b = document.getElementById('navbtn'); if (b) b.focus(); },
    'x-submit-ask': () => { E.confirm = true; E.navOpen = false; render(); },
    'x-confirm-close': (arg, el, ev) => { if (ev && ev.target.closest('[data-stop]') && !ev.target.closest('[data-act="x-confirm-close"]')) return; E.confirm = false; render(); const b = document.querySelector('[data-act="x-submit-ask"]'); if (b) b.focus(); },
    'x-submit': () => submitExam(false),
    'x-review': arg => { S.rvFilter = arg || 'all'; S.screen = 'xreview'; render(); window.scrollTo(0, 0); },
    'x-review-filter': arg => { S.rvFilter = arg; render(); },
    'x-back-score': () => { S.screen = 'xscore'; render(); window.scrollTo(0, 0); },
    'x-copy': () => copyResults(),
    'x-retake': () => startExam(E.unit, false)
  };
  app.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = actions[el.dataset.act]; if (fn) fn(el.dataset.arg, el, ev);
  });
  document.addEventListener('keydown', ev => {
    if (ev.defaultPrevented || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const tag = (ev.target && ev.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'input' || tag === 'select') return;
    const k = ev.key, L = k.length === 1 ? k.toUpperCase() : '';
    if (k === 'Escape' && E && S.screen === 'exam' && (E.navOpen || E.confirm)) { actions[E.navOpen ? 'x-nav-close' : 'x-confirm-close'](); return; }
    if (S.screen === 'practice' && P) {
      const q = P.qs[P.i];
      if (LETTERS.includes(L) && !P.answers[q.id]) { ev.preventDefault(); pPick(L); }
      else if (P.answers[q.id] && (k === 'ArrowRight' || L === 'N' || (k === 'Enter' && tag !== 'button' && tag !== 'summary' && tag !== 'a'))) { ev.preventDefault(); pNext(); }
    } else if (S.screen === 'exam' && E && !E.navOpen && !E.confirm) {
      if (LETTERS.includes(L)) { ev.preventDefault(); xPick(L); }
      else if (k === 'ArrowRight' && E.i + 1 < E.qs.length) { ev.preventDefault(); xGoto(E.i + 1); }
      else if (k === 'ArrowLeft' && E.i > 0) { ev.preventDefault(); xGoto(E.i - 1); }
      else if (L === 'F' && tag !== 'button') { ev.preventDefault(); xFlag(); }
    }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && E && !E.submitted && S.screen === 'exam') tick(); });
  window.addEventListener('pagehide', () => persistExam());

  // test hooks (used by the headless test run; harmless in production)
  window.PE = { state: () => ({ S, P, E }), setRemaining(sec) { if (E && !E.submitted) { E.endsAt = Date.now() + sec * 1000; persistExam(); tick(); } }, store };

  render();
})();
</script>
