strips that all touch the river, so the survey method is long lot. The houses sit in a row along the river and road, so the settlement pattern is linear. Survey method = how land is divided. Settlement pattern = where people live.","whyNot":{"A":"Metes and bounds makes irregular parcels, and the houses here are in a line, not grouped in a village.","B":"Township and range makes square sections with farmhouses spread out. These are long strips with houses in a row.","C":"The houses do form a line, but the parcels are long strips, not township-and-range squares.","D":"The parcels are long lots, but the houses are lined up along the river, not grouped in one village."},"vocab":["long-lot system","linear settlement","clustered settlement","dispersed settlement"]},{"id":"U5-P07","topic":"5.3","lo":"SPS-5.A","skill":"1.A","difficulty":"easy","stem":"Which of the following regions was an early hearth of plant and animal domestication, where wheat, barley, sheep, and goats were first domesticated?","options":{"A":"The Great Plains of North America","B":"The Fertile Crescent of Southwest Asia","C":"The Amazon Basin of South America","D":"The Scandinavian Peninsula of northern Europe","E":"The interior of Australia"},"answer":"B","explanation":"The Fertile Crescent is an arc of good farmland in Southwest Asia, around the Tigris and Euphrates Rivers and the eastern Mediterranean coast. About 10,000 years ago, people there began planting wheat and barley and taming sheep and goats. Your AP course guide also names the Indus River Valley, Southeast Asia, and Central America as early hearths.","whyNot":{"A":"Plains peoples farmed in river valleys, but the Great Plains was not a hearth for wheat, barley, sheep, or goats. Those reached the Americas after 1492.","C":"Some Amazonian peoples domesticated crops such as cassava, but not wheat, barley, sheep, or goats.","D":"Farming reached Scandinavia late, by diffusion from the south.","E":"Interior Australia was not a hearth of domestication, and these crops and animals came there with European colonists."},"vocab":["hearth","domestication","Fertile Crescent"]},{"id":"U5-P08","topic":"5.3","lo":"SPS-5.B","skill":"1.D","difficulty":"medium","stem":"Which of the following is an example of plant diffusion as part of the Columbian Exchange?","options":{"A":"Wheat spreading from the Fertile Crescent into Europe thousands of years ago","B":"Rice spreading from southern China into Southeast Asia thousands of years before European voyages","C":"High-yield wheat varieties spreading from Mexico to India in the 1960s","D":"Maize and potatoes spreading from the Americas to Europe, Africa, and Asia after 1492","E":"Genetically modified soybeans spreading across South America in the 2000s"},"answer":"D","explanation":"The Columbian Exchange was a giant swap between the Americas and the rest of the world. It started after Columbus sailed in 1492. Plants, animals, people, and diseases moved both ways. Maize (corn) and potatoes from the Americas became big foods in Europe, Africa, and Asia. Wheat, cattle, and horses went the other way.","whyNot":{"A":"That is diffusion from the first agricultural hearths, thousands of years before 1492.","B":"That is ancient diffusion within Asia, not an exchange between the Americas and the rest of the world.","C":"That is the Green Revolution of the 1960s.","E":"GMO soybeans are modern biotechnology, not the Columbian Exchange."},"vocab":["Columbian Exchange","diffusion"]},{"id":"U5-P09","topic":"5.3","lo":"SPS-5.B","skill":"2.B","difficulty":"hard","stem":"Cassava, a root crop first domesticated in South America, became a staple food across much of tropical Africa after the 1500s. Which statement best explains this?","options":{"A":"Portuguese traders brought it from the Americas, and it grows well in poor soil and during dry spells.","B":"Cassava was domesticated a second time in the Nile River valley, so African farmers already had it before the 1500s.","C":"Cassava spread to Africa during the Green Revolution, when scientists bred it for irrigated farms.","D":"Cassava requires cold winters to produce roots, so it grew best in the cooler parts of Africa.","E":"Cassava spread to Africa during the Second Agricultural Revolution, when new machines made it easier to plant."},"answer":"A","explanation":"Portuguese ships brought cassava from Brazil to West and Central Africa in the 1500s. That is the Columbian Exchange. African farmers kept it because it is tough: it grows in poor soil, survives dry spells, and can stay in the ground until people need it. That made it a good protection against hunger.","whyNot":{"B":"Cassava was domesticated in South America. Africa got it by diffusion, not by a second domestication.","C":"Cassava arrived in Africa about 400 years before the Green Revolution, which focused on wheat, rice, and maize.","D":"Cassava is a tropical crop. Frost and cold kill it.","E":"The Second Agricultural Revolution happened in Europe in the 1700s and 1800s and was not how cassava reached Africa."},"vocab":["Columbian Exchange","staple crop"]},{"id":"U5-P10","topic":"5.4","lo":"SPS-5.C","skill":"1.A","difficulty":"easy","stem":"Which pair of innovations is most closely associated with the Second Agricultural Revolution?","options":{"A":"Domestication of wheat and the first irrigation canals","B":"High-yield rice varieties and chemical fertilizers in South Asia","C":"Genetically modified seeds and drone crop monitoring","D":"Shifting cultivation and the first use of fire to clear land","E":"The seed drill and four-field crop rotation"},"answer":"E","explanation":"The Second Agricultural Revolution started in Britain in the 1700s, at the same time as the Industrial Revolution. The seed drill planted seeds in neat rows instead of tossing them by hand. Four-field crop rotation (wheat, turnips, barley, clover) kept the soil healthy, so no field had to sit empty. Later came steel plows, reapers, and tractors.","whyNot":{"A":"That is the First Agricultural Revolution (the Neolithic Revolution), thousands of years earlier.","B":"That is the Green Revolution of the 1960s and 1970s.","C":"GMOs and drones are modern biotechnology and precision farming.","D":"Shifting cultivation and burning to clear land are ancient practices, not the Second Agricultural Revolution."},"vocab":["Second Agricultural Revolution","seed drill","crop rotation"]},{"id":"U5-P11","topic":"5.4","lo":"SPS-5.C","skill":"1.D","difficulty":"medium","stem":"Which of the following was a major result of the Second Agricultural Revolution in Britain?","options":{"A":"Farms became smaller as common land was divided up among a growing number of peasant families.","B":"Food production fell, causing life expectancy to drop across the country.","C":"Most farmers returned to subsistence farming and stopped selling crops.","D":"The rural population grew rapidly as farms needed more hand labor.","E":"Fewer farmworkers were needed, so many rural people moved to cities to work in factories."},"answer":"E","explanation":"New tools and methods let each farmer grow much more food. Farms needed fewer workers, so many rural families moved to cities to work in factories. More food also meant better diets and longer lives.","whyNot":{"B":"Food production rose, and life expectancy improved.","C":"Farming became more commercial, with more food sold to growing cities.","D":"Machines replaced workers, so the share of people living on farms fell.","A":"Enclosure did the opposite: it combined small plots and common land into larger private farms."},"vocab":["Second Agricultural Revolution","enclosure","urbanization"]},{"id":"U5-P12","topic":"5.4","lo":"SPS-5.C","skill":"3.C","difficulty":"medium","stimulus":{"type":"table","title":"FARMING AND URBANIZATION IN COUNTRY X, 1750–1900 (HYPOTHETICAL DATA)","columns":["Year","Wheat yield (bushels per acre)","Share of workers in agriculture (%)","Share of people living in cities (%)"],"rows":[["1750","16","55","20"],["1800","21","40","30"],["1850","28","22","50"],["1900","31","9","75"]],"source":"Hypothetical data"},"stem":"Which conclusion about Country X is best supported by the data in the table?","options":{"A":"Falling wheat yields forced farmworkers to leave the countryside.","B":"Wheat yields increased while agriculture's share of workers fell and the share of people living in cities rose.","C":"The share of people living in cities fell as farms became more productive.","D":"Agriculture employed a larger share of workers in 1900 than in 1750.","E":"Wheat yields rose fastest between 1850 and 1900, the same period when farm employment was rising."},"answer":"B","explanation":"Read the columns together. Wheat yields go UP (16 to 31 bushels per acre). The share of workers on farms goes DOWN (55% to 9%). The share of people living in cities goes UP (20% to 75%). That pattern fits the Second Agricultural Revolution happening alongside the Industrial Revolution. (The table shows shares, not total numbers of farmworkers or city residents.)","whyNot":{"A":"Yields rose in every period, so they were not falling.","C":"The urban share rose from 20% to 75%.","D":"The farm share of workers fell from 55% to 9%.","E":"Yield rose by only 3 bushels per acre from 1850 to 1900, the smallest gain shown, and the farm share of workers fell from 22% to 9%."},"vocab":["Second Agricultural Revolution","productivity","urbanization"]},{"id":"U5-P13","topic":"5.5","lo":"SPS-5.D","skill":"1.A","difficulty":"easy","stem":"Which of the following best describes the Green Revolution?","options":{"A":"The movement to replace chemical fertilizers with organic methods on farms in wealthy countries","B":"The first domestication of plants and animals in river valleys of Southwest and South Asia","C":"The return of eroded farmland to native grasses to reduce soil erosion and dust storms","D":"The conversion of tropical forests in developing countries into protected national parks","E":"The spread of high-yield seeds, chemicals, and irrigation in poorer countries in the mid-1900s"},"answer":"E","explanation":"The Green Revolution began in Mexico in the 1940s and spread to Asia in the 1960s. Scientists such as Norman Borlaug bred high-yield varieties (HYVs) of wheat and rice. Farmers in places like Mexico, India, and the Philippines planted these seeds and added chemical fertilizer, pesticides, irrigation, and machines. Harvests grew a lot. Your AP course guide lists high-yield seeds, more chemicals, and mechanized farming.","whyNot":{"A":"That describes organic farming, which uses fewer chemicals. The Green Revolution used more.","B":"That is the First Agricultural Revolution.","D":"\"Green\" here means crops, not parks or conservation.","C":"That describes conservation programs, not the Green Revolution."},"vocab":["Green Revolution","high-yield varieties (HYVs)"]},{"id":"U5-P14","topic":"5.5","lo":"SPS-5.D","skill":"2.C","difficulty":"medium","stem":"In the Indian state of Punjab, Green Revolution wheat and rice farming raised harvests sharply. Which of the following is a negative environmental consequence of these practices in Punjab?","options":{"A":"Rapid expansion of tropical rain forest onto former farmland","B":"A sharp drop in farmers' use of chemical fertilizers and pesticides on wheat and rice","C":"An end to irrigation because the new seeds need no extra water","D":"Falling water tables from heavy groundwater pumping for irrigation","E":"A return to shifting cultivation as farmers moved to new fields"},"answer":"D","explanation":"High-yield rice and wheat need a lot of water and fertilizer. Punjab farmers pumped so much groundwater from wells that the water table has dropped steadily, and wells must be dug deeper. Heavy fertilizer and pesticide use has also hurt soil and water quality. Those are the environmental costs of the Green Revolution's bigger harvests.","whyNot":{"A":"Punjab is not a rain-forest region, and the Green Revolution kept land in crops.","B":"Chemical use went UP, not down.","C":"HYVs need MORE water, so irrigation expanded.","E":"Farming in Punjab became more intensive and permanent, not shifting."},"vocab":["Green Revolution","irrigation","groundwater depletion"]},{"id":"U5-P15","topic":"5.5","lo":"SPS-5.D","skill":"3.D","difficulty":"medium","stimulus":{"type":"bar","title":"AVERAGE CEREAL YIELD IN TWO REGIONS, 1960 AND 1990 (HYPOTHETICAL DATA)","categories":["Region P","Region Q"],"series":[{"name":"1960 (tonnes per hectare)","values":[1.0,0.8]},{"name":"1990 (tonnes per hectare)","values":[2.3,1.0]}],"yLabel":"Tonnes per hectare","yMax":2.5,"text":"Region P grows mostly irrigated wheat and rice. Region Q grows mostly rain-fed sorghum, millet, and cassava, and few farmers can reach irrigation, fertilizer dealers, or paved roads.","source":"Hypothetical data"},"stem":"Which statement best explains the difference between the two regions shown in the chart?","options":{"A":"Region Q's farmers chose to stop using chemical fertilizer, while Region P's farmers began using it for the first time.","B":"Region Q has a colder climate, so it could not grow any cereal crops.","C":"Region P's yields rose because its farmers moved to shifting cultivation.","D":"Region P's population fell, so each farmer had more land to work.","E":"Green Revolution seeds and inputs were designed mainly for irrigated wheat and rice, so Region P gained far more."},"answer":"E","explanation":"Region P's yield more than doubled (1.0 to 2.3 tonnes per hectare, up 130%). Region Q's rose only 25% (0.8 to 1.0). The Green Revolution's high-yield seeds were mostly wheat, rice, and maize, and they work best with irrigation and fertilizer. Region P had those crops and inputs. Region Q's crops, and its lack of irrigation, fertilizer dealers, and roads, meant it gained much less.","whyNot":{"A":"The text says Region Q's farmers can't easily get fertilizer. Nothing says they chose to stop.","B":"Region Q does grow cereals (sorghum and millet), and the chart shows a yield there.","C":"The text says Region P grows mostly irrigated wheat and rice. Nothing describes a switch to shifting cultivation.","D":"Nothing in the chart or text describes Region P's population."},"vocab":["Green Revolution","high-yield varieties (HYVs)","yield"]},{"id":"U5-P16","topic":"5.6","lo":"PSO-5.C","skill":"1.D","difficulty":"easy","stem":"A large farm in Brazil plants only soybeans every year and sells the entire harvest to export companies. This farm is an example of which agricultural practice?","options":{"A":"Subsistence farming","B":"Commercial monocropping","C":"Shifting cultivation","D":"Pastoral nomadism","E":"Mixed crop and livestock farming"},"answer":"B","explanation":"Commercial farming grows crops to SELL, not to feed the farm family. Monocropping means growing the same single crop on the same land year after year. A huge soybean farm selling everything for export is both. Your AP course guide says production regions are defined by whether they are subsistence or commercial, including monocropping or monoculture.","whyNot":{"A":"Subsistence farmers grow food mainly to feed their own families. This farm sells everything.","C":"Shifting cultivation moves to new forest clearings every few years. This farm stays put.","D":"Pastoral nomadism is herding animals from place to place, not growing soybeans.","E":"Mixed farming raises crops AND livestock together. This farm grows only one crop."},"vocab":["commercial agriculture","monocropping","subsistence agriculture"]},{"id":"U5-P17","topic":"5.6","lo":"PSO-5.C","skill":"1.B","difficulty":"medium","stem":"According to bid-rent theory, why is farmland closest to a large city usually farmed more intensively than land farther away?","options":{"A":"Soil is always more fertile near cities than in rural areas.","B":"Land near the city costs more, so farmers must earn a lot from each acre to afford it.","C":"Governments ban extensive farming within city limits.","D":"Farmers near cities have fewer customers, so they must grow more food.","E":"Transportation costs are higher for land close to the city than for land far away."},"answer":"B","explanation":"Bid-rent theory says people bid more for land that is close to the market, because being close saves money on transportation. Higher land prices mean a farmer near the city has to squeeze a lot of value out of every acre, like vegetables or dairy. Farther out, land is cheap, so low-value uses that need lots of land, like grazing, make sense. Your AP course guide says intensive and extensive practices are decided partly by land costs (bid-rent).","whyNot":{"A":"Soil quality is not what the theory is about, and it is not always better near cities.","D":"Farmers near cities have MORE nearby customers, not fewer.","E":"It is the opposite: transportation costs rise as you move AWAY from the city.","C":"Bid-rent is about land prices, not laws."},"vocab":["bid-rent theory","intensive agriculture","land cost"]},{"id":"U5-P18","topic":"5.6","lo":"PSO-5.C","skill":"3.C","difficulty":"hard","stimulus":{"type":"bar","title":"NET RETURN PER HECTARE BY DISTANCE FROM A CITY MARKET (HYPOTHETICAL DATA)","categories":["0–20 km","20–50 km","50–100 km","100–200 km"],"series":[{"name":"Fresh vegetables (dollars per hectare)","values":[2400,1500,400,0]},{"name":"Cattle grazing (dollars per hectare)","values":[300,280,260,240]}],"yLabel":"Net return (dollars per hectare)","yMax":2500,"text":"Net return is the money a farmer earns from one hectare after paying for labor, seed, feed, and transporting the product to the city.","source":"Hypothetical data"},"stem":"Which statement is best supported by the chart?","options":{"A":"Cattle grazing earns a higher net return than fresh vegetables at every distance from the city.","B":"Vegetable farming earns its highest net return in the zone farthest from the city market.","C":"Both land uses lose net return at about the same rate as distance from the city increases.","D":"Vegetables earn far more near the city, but their return falls faster with distance than grazing's does.","E":"Distance from the city market has no effect on the net return from either land use."},"answer":"D","explanation":"Near the city, vegetables earn $2,400 per hectare and cattle only $300. But vegetables are perishable and costly to ship, so their return drops fast: $1,500, then $400, then $0. Cattle grazing barely drops. Beyond about 100 km, grazing wins. That is bid-rent at work: the intensive, high-value use takes the land near the market, and the extensive use takes the land far away.","whyNot":{"A":"Vegetables earn more in the first three distance zones.","B":"Vegetables earn the LEAST far from the city ($0 at 100–200 km).","C":"Vegetables fall by $2,400 while grazing falls by only $60. Not the same rate.","E":"Both returns fall with distance, vegetables most of all."},"vocab":["bid-rent theory","intensive agriculture","extensive agriculture"]},{"id":"U5-P19","topic":"5.7","lo":"PSO-5.C","skill":"1.D","difficulty":"easy","stem":"A single company owns chicken hatcheries and feed mills, signs contracts with farmers to raise its chickens, and runs its own processing plants and delivery trucks. This is an example of","options":{"A":"subsistence agriculture","B":"shifting cultivation","C":"vertical integration in agribusiness","D":"the Columbian Exchange","E":"community-supported agriculture"},"answer":"C","explanation":"Agribusiness means farming run like a big business, with large companies involved at many steps. Vertical integration means one company controls several steps of the chain: here it owns the chicks, the feed, the processing, and the trucks, and farmers raise the birds under contract. The U.S. poultry industry works this way.","whyNot":{"A":"Subsistence farmers grow food for their own families, not for a corporation.","B":"Shifting cultivation is clearing and farming forest plots for a few years, then moving on.","D":"The Columbian Exchange was the swap of crops and animals after 1492.","E":"Community-supported agriculture connects local customers directly to a small farm."},"vocab":["agribusiness","vertical integration","commodity chain"]},{"id":"U5-P20","topic":"5.7","lo":"PSO-5.C","skill":"1.D","difficulty":"medium","stem":"Which development best illustrates technology increasing the carrying capacity of farmland?","options":{"A":"Farmers abandon fields after the soil loses its fertility.","B":"A region converts farmland into new housing subdivisions.","C":"Center-pivot irrigation and improved seeds let the same acreage feed more people.","D":"Herders move their animals to new pastures each season.","E":"A farm stops using tractors and other machinery and returns to plowing its fields with animals."},"answer":"C","explanation":"Carrying capacity is how many people the land can support. If the same acres produce more food, the land can feed more people. Irrigation brings water to dry fields, and better seeds grow bigger harvests. Your AP course guide says technology has increased economies of scale in agriculture and the carrying capacity of the land.","whyNot":{"A":"Abandoning worn-out fields lowers how many people the land supports.","D":"Seasonal herding is a traditional practice, not new technology raising output.","E":"Plowing with animals takes more labor, and it does not show more food coming from the same land.","B":"Turning farms into housing removes farmland. It does not raise its output."},"vocab":["carrying capacity","economies of scale","center-pivot irrigation"]},{"id":"U5-P21","topic":"5.7","lo":"PSO-5.C","skill":"3.C","difficulty":"medium","stimulus":{"type":"table","title":"FARMS IN COUNTRY Z, 1950–2020 (HYPOTHETICAL DATA)","columns":["Year","Number of farms (millions)","Average farm size (acres)","Total farmland (millions of acres)"],"rows":[["1950","5.4","215","1,161"],["1980","2.4","425","1,020"],["2020","2.0","445","890"]],"source":"Hypothetical data"},"stem":"The trend in the table best illustrates which of the following?","options":{"A":"Farm consolidation into fewer operations with a larger average size","B":"A shift from commercial farming to subsistence farming","C":"A rapid increase in the total amount of land being farmed","D":"The breakup of large estates into many small peasant farms owned by individual families","E":"A return to shifting cultivation as farmers move to new land"},"answer":"A","explanation":"The number of farms fell from 5.4 million to 2.0 million, while the average farm grew from 215 to 445 acres. Fewer but bigger farms is called consolidation. Your AP course guide says large-scale commercial operations are replacing small family farms; this table fits that pattern, but it does not show who owns the farms or exactly how the change happened.","whyNot":{"B":"The table shows farm numbers and size, not whether farms grow food mainly for sale or for the household.","C":"Total farmland FELL, from 1,161 to 890 million acres.","D":"Farms got bigger and fewer, the opposite of breaking up estates.","E":"The table gives no evidence that farmers clear new plots and leave older plots to rest."},"vocab":["agribusiness","economies of scale","family farm"]},{"id":"U5-P22","topic":"5.8","lo":"PSO-5.D","skill":"1.A","difficulty":"easy","stem":"In von Thünen's model of agricultural land use, which activity is located in the ring closest to the market city?","options":{"A":"Market gardening and dairying","B":"Livestock ranching","C":"Grain and field crops","D":"Forestry for firewood and lumber","E":"Unused wilderness"},"answer":"A","explanation":"Von Thünen said the most perishable and expensive-to-ship products go closest to the city. Fresh vegetables and milk spoil fast, so they were grown right next to the market (in the 1820s, there were no refrigerated trucks). Then came forest, then grain, then ranching, with wilderness beyond.","whyNot":{"B":"Ranching is in the outermost farming ring, because it needs lots of cheap land and animals can walk to market.","C":"Grain is in the third ring. It keeps well, so it can travel farther.","D":"Forest is in the second ring, close because wood is heavy and costly to haul.","E":"Wilderness lies beyond all the rings."},"vocab":["von Thünen model","market gardening","perishable"]},{"id":"U5-P23","topic":"5.8","lo":"PSO-5.D","skill":"4.C","difficulty":"medium","stimulus":{"type":"rings","title":"VON THÜNEN'S MODEL OF RURAL LAND USE","center":"Market city","rings":[{"label":"1"},{"label":"2"},{"label":"3"},{"label":"4"}],"outer":"Wilderness","description":"Four rings surround a single market city on a flat, uniform plain. Ring 1 touches the city; ring 4 is farthest away. Farmers haul their own goods to the city, so transportation cost rises with distance.","source":"Simplified from von Thünen, The Isolated State (1826)"},"stem":"In von Thünen's model, simplified in the diagram, which land use occupied ring 2, and why?","options":{"A":"Ranching, because cattle can walk to the city on their own","B":"Grain, because wheat spoils quickly and must be sold within a day","C":"Market gardening, because vegetables need the most land per farm","D":"Forestry, because wood for fuel and building was heavy and costly to haul","E":"Dairying, because milk could be stored for months without spoiling"},"answer":"D","explanation":"This surprises people: von Thünen put FOREST in ring 2, right after the vegetable and dairy ring. In the 1820s, cities burned wood for heat and cooking and built with lumber. Wood is heavy and bulky, so hauling it far by horse cart cost too much. Grain (ring 3) keeps well and is lighter for its value. Ranching (ring 4) needs the most land.","whyNot":{"A":"Ranching is the outermost ring (ring 4).","B":"Grain is in ring 3, and it keeps a long time. It does not spoil in a day.","C":"Market gardening is ring 1, and it uses SMALL plots, not the most land.","E":"Dairying is in ring 1 because milk spoils fast."},"vocab":["von Thünen model","transportation cost"]},{"id":"U5-P24","topic":"5.8","lo":"PSO-5.D","skill":"1.E","difficulty":"hard","stem":"Which observation most challenges the usefulness of von Thünen's model for explaining agricultural land use today?","options":{"A":"Dairy farms are still common on the edges of some large metropolitan areas in North America.","B":"Land prices near a large city are usually much higher than land prices far from it.","C":"Refrigerated ships and air freight let fresh grapes from Chile reach stores in North America and Europe.","D":"Cattle ranching is still common in thinly populated areas located far from major cities.","E":"Many farmers still consider transportation cost when they decide which crops to grow."},"answer":"C","explanation":"Von Thünen's model depends on transportation cost rising steeply with distance, so perishable foods must be grown close to the market. Refrigeration and fast, cheap shipping break that rule: fresh grapes can travel thousands of miles from Chile and reach stores during the Northern Hemisphere's winter, when local grapes are out of season. Your AP course guide notes that specialty farming regions do not always fit the rings.","whyNot":{"A":"Dairying near cities fits the model.","B":"Higher land prices near the market match bid-rent and the model.","D":"Ranching far from cities fits the outer ring of the model.","E":"That supports the model's main idea, transportation cost."},"vocab":["von Thünen model","time-space compression","specialty agriculture"]},{"id":"U5-P25","topic":"5.9","lo":"PSO-5.E","skill":"1.B","difficulty":"easy","stem":"Countries whose export earnings depend heavily on one agricultural commodity, such as coffee or cocoa, are especially vulnerable to","options":{"A":"falling birth rates","B":"declining tourism and hotel construction in their largest cities","C":"the loss of their official language","D":"sharp drops in the world price of that commodity","E":"an increase in the number of manufacturing jobs"},"answer":"D","explanation":"If most of a country's money from exports comes from one crop, its whole economy rides on that crop's price. When world cocoa or coffee prices fall, the country earns much less, and farmers, workers, and the government all have less money. Your AP course guide says some countries have become highly dependent on one or more export commodities.","whyNot":{"A":"Birth rates are not tied to dependence on one crop export.","B":"Tourism is a separate part of the economy.","C":"Language has nothing to do with commodity dependence.","E":"More manufacturing jobs would REDUCE dependence on one crop, not threaten the country."},"vocab":["commodity dependence","export commodity","global supply chain"]},{"id":"U5-P26","topic":"5.9","lo":"PSO-5.E","skill":"3.C","difficulty":"medium","stimulus":{"type":"table","title":"TRADE PROFILE OF FIVE COUNTRIES (HYPOTHETICAL DATA)","columns":["Country","Top export","Top export's share of export earnings (%)","Share of food supply that is imported (%)"],"rows":[["Country A","Machinery","18","15"],["Country B","Cocoa","45","20"],["Country C","Natural gas","60","85"],["Country D","Wheat","25","5"],["Country E","Electronics","30","40"]],"source":"Hypothetical data"},"stem":"All other things being equal, which country's food supply is most exposed to a sharp rise in the price of imported food?","options":{"A":"Country A","B":"Country B","C":"Country C","D":"Country D","E":"Country E"},"answer":"C","explanation":"Look at the last column: how much of each country's food comes from other countries. Country C imports 85% of its food, the most in the table, so a rise in the price of imported food would hit the biggest part of its food supply. (Real food security also depends on things the table does not show, like income and food reserves.) This shows how food links countries together in a global system.","whyNot":{"A":"Country A imports only 15% of its food.","B":"Country B depends on cocoa EXPORTS, which is a different risk. It imports only 20% of its food.","D":"Country D imports only 5% of its food, the smallest share in the table.","E":"Country E imports 40% of its food. That is a real risk, but less than Country C's 85%."},"vocab":["food security","global supply chain","interdependence"]},{"id":"U5-P27","topic":"5.9","lo":"PSO-5.E","skill":"2.B","difficulty":"hard","stem":"In 2022, the war in Ukraine blocked grain shipments from Ukraine's Black Sea ports, and bread and flour prices rose in wheat-importing countries such as Egypt and Lebanon. This example best illustrates which concept?","options":{"A":"Global food distribution networks are affected by political relationships and trade routes.","B":"Von Thünen's model predicts where wheat farming will be located within a single country such as Egypt.","C":"The Green Revolution ended wheat imports in North Africa and Southwest Asia.","D":"Subsistence farmers are the main suppliers of wheat to global markets.","E":"Food prices are set only by local weather in the country where food is eaten."},"answer":"A","explanation":"Egypt and Lebanon buy a lot of wheat from abroad, much of it from Ukraine and Russia. When the war blocked ships from leaving Ukraine's Black Sea ports, those countries could not get the grain as easily, so prices rose. A conflict in one place hurt food prices in another. Your AP course guide says global food distribution is shaped by political relationships, infrastructure, and patterns of world trade.","whyNot":{"B":"Von Thünen explains land use around one market, not a war disrupting global trade.","C":"These countries still import large amounts of wheat. That is why prices rose.","D":"Most wheat on world markets comes from large commercial farms, not subsistence farmers.","E":"Prices rose because of a war in another country, not local weather."},"vocab":["global supply chain","food security","interdependence"]},{"id":"U5-P28","topic":"5.10","lo":"IMP-5.A","skill":"1.A","difficulty":"easy","stem":"Which of the following best describes soil salinization?","options":{"A":"The washing away of topsoil by heavy rain or wind on bare, unplanted fields","B":"The planting of a different crop in a field each year to restore soil nutrients","C":"The clearing of forest land for farming by cutting and then burning the vegetation","D":"The spread of desert-like conditions into dry grasslands after vegetation is lost","E":"The buildup of salts in soil, often from irrigating fields in dry climates"},"answer":"E","explanation":"All water carries a little bit of salt. When farmers irrigate in a hot, dry place, the water evaporates and leaves the salt behind. Year after year the salt builds up until crops can't grow well. This has happened in parts of Pakistan, Iraq, Australia, and California's Central Valley.","whyNot":{"A":"That is soil erosion.","B":"That is crop rotation, a conservation practice.","C":"That is slash and burn.","D":"That is desertification."},"vocab":["soil salinization","irrigation"]},{"id":"U5-P29","topic":"5.10","lo":"IMP-5.A","skill":"1.D","difficulty":"medium","stem":"Rice terraces carved into steep hillsides in the Philippines and on the Indonesian island of Bali best illustrate which of the following?","options":{"A":"Desertification caused by overgrazing on hillsides","B":"Farmers changing the landscape to create flat fields and control water on steep slopes","C":"Land left as forest because it is too steep to farm","D":"The long-lot survey system dividing land along a river","E":"Shifting cultivation, in which farmers move from one hillside to another every few years as the soil wears out"},"answer":"B","explanation":"Rice paddies need flat, flooded fields. Farmers on steep mountains built terraces, like giant stairs, so each step holds water and soil. Terraces slow down rain running downhill, which cuts erosion. Your AP course guide lists terraces as an agricultural practice that alters the landscape.","whyNot":{"A":"Terraces are for crops, and they fight erosion. They are not caused by overgrazing.","C":"The hills ARE farmed. That is the whole point of terraces.","D":"Long lots are strips along rivers in French areas, not hillside steps.","E":"Terraces are permanent. Farmers use the same terraces for generations."},"vocab":["terrace farming","landscape modification"]},{"id":"U5-P30","topic":"5.10","lo":"IMP-5.A","skill":"3.C","difficulty":"medium","stimulus":{"type":"table","title":"LAND COVER IN A TROPICAL FRONTIER REGION (HYPOTHETICAL DATA)","columns":["Year","Forest (% of region)","Cattle pasture (% of region)","Cropland, mostly soybeans (% of region)"],"rows":[["1990","82","10","2"],["2005","70","19","6"],["2020","61","25","11"]],"source":"Hypothetical data"},"stem":"Which conclusion is best supported by the data in the table?","options":{"A":"Forest in the region expanded as farmland was abandoned.","B":"Cropland in the region was converted back into forest.","C":"Forest was cleared and replaced mainly by cattle pasture and soybean fields.","D":"Cattle pasture in the region decreased by more than half.","E":"Land cover in the region stayed about the same over the 30 years shown in the table."},"answer":"C","explanation":"Forest fell from 82% to 61% of the region, a loss of 21 percentage points. Over the same time, pasture rose 15 points and cropland rose 9 points. So the forest was cut down and turned into ranches and soybean farms. This is land cover change, an environmental effect of agriculture listed in your AP course guide, and it matches what has happened in parts of the Amazon.","whyNot":{"A":"Forest SHRANK, from 82% to 61%.","B":"Cropland grew, from 2% to 11%.","D":"Pasture more than DOUBLED, from 10% to 25%.","E":"Every row changed by many percentage points."},"vocab":["deforestation","land cover change"]},{"id":"U5-P31","topic":"5.11","lo":"IMP-5.B","skill":"1.A","difficulty":"easy","stem":"Which of the following best describes a food desert?","options":{"A":"An area where residents have limited access to affordable, healthy food such as fresh produce","B":"A dry region where crops can be grown only with the help of large irrigation projects","C":"A farming region that produces much more food than its own population can eat","D":"A large commercial farm that grows only one crop each year for export","E":"Land that has been damaged by overgrazing and gradually turned into desert"},"answer":"A","explanation":"A food desert has nothing to do with sand. It is an area where getting affordable, healthy food is hard: the nearest full-service grocery store may be far away, and some people may not have a car or good bus service. Food deserts happen in both city neighborhoods and rural areas. Your AP course guide lists food deserts as a challenge to feeding people.","whyNot":{"B":"That describes a dry farming region, not a food desert.","C":"That is a food surplus region.","D":"That is monocropping for export.","E":"That is desertification."},"vocab":["food desert","food insecurity"]},{"id":"U5-P32","topic":"5.11","lo":"IMP-5.B","skill":"1.D","difficulty":"easy","stem":"Families pay a nearby farm at the start of the growing season and then pick up a box of fresh produce from that farm every week. This arrangement is an example of","options":{"A":"plantation agriculture","B":"agribusiness vertical integration","C":"pastoral nomadism","D":"community-supported agriculture","E":"the Green Revolution"},"answer":"D","explanation":"In community-supported agriculture (CSA), customers buy a \"share\" of a local farm's harvest ahead of time. The farmer gets money up front, and the families get fresh, local food each week. It is part of the local-food movement listed in your AP course guide.","whyNot":{"A":"Plantations grow cash crops on large estates, usually for export.","B":"Vertical integration is one big company controlling many steps of food production.","C":"Pastoral nomadism is moving herds of animals to find pasture.","E":"The Green Revolution spread high-yield seeds and chemicals in developing countries."},"vocab":["community-supported agriculture (CSA)","local-food movement"]},{"id":"U5-P33","topic":"5.11","lo":"IMP-5.B","skill":"3.C","difficulty":"medium","stimulus":{"type":"table","title":"THREE COUNTIES NEAR A FAST-GROWING METROPOLITAN AREA (HYPOTHETICAL DATA)","columns":["County","Distance from city center (miles)","Farmland 2000 (acres)","Farmland 2020 (acres)","Population growth 2000–2020 (%)"],"rows":[["North County","15","220,000","120,000","+140"],["West County","35","310,000","250,000","+60"],["Far County","70","400,000","395,000","+5"]],"source":"Hypothetical data"},"stem":"The data in the table best illustrate which challenge of contemporary agriculture?","options":{"A":"Farmland lost to suburbanization as a metropolitan area expands","B":"Soil salinization caused by heavy irrigation of farmland in the counties nearest the city","C":"Loss of biodiversity from genetically modified crops","D":"Growth of shifting cultivation near large cities","E":"Food deserts forming in remote rural counties"},"answer":"A","explanation":"The county closest to the city grew the fastest (+140%) and lost the most farmland (100,000 acres, almost half). The far county barely grew and kept almost all its farmland. As the city spreads, houses, roads, and shopping centers are built on farmland. Your AP course guide lists land lost to suburbanization as a challenge to feeding a growing population.","whyNot":{"B":"The table shows nothing about irrigation or salt.","C":"The table shows nothing about crop types or biodiversity.","D":"The table gives no evidence that farmers clear new plots and leave older plots to rest.","E":"The table measures farmland and population, not access to grocery stores."},"vocab":["suburbanization","urban sprawl","farmland loss"]},{"id":"U5-P34","topic":"5.12","lo":"IMP-5.C","skill":"2.B","difficulty":"medium","stem":"In many rural regions where men migrate to cities or other countries for wage work, the role of women in agriculture tends to","options":{"A":"decline, because most women migrate to the cities along with the men","B":"grow, because women take on more of the farm work and decision-making","C":"shift mainly to factory work in nearby towns","D":"stay exactly the same, because migration by men has little effect on who does farm labor","E":"become limited to large mechanized wheat farms"},"answer":"B","explanation":"When men leave to work in cities or other countries, the family still needs food. So women do more of the farm work. They also make more of the farm decisions. This happens in parts of South Asia, Africa south of the Sahara, and Central America. Experts call it the \"feminization of agriculture.\" Women's farm roles change from place to place, depending on the kind of farming.","whyNot":{"A":"Women usually stay and take over more of the farm work; farms are rarely abandoned.","C":"The farm work still needs doing, and rural regions often have few factory jobs.","D":"Migration changes who does the farm work.","E":"Families affected by this migration are mostly small farms, not large mechanized wheat farms."},"vocab":["feminization of agriculture","rural-to-urban migration"]},{"id":"U5-P35","topic":"5.12","lo":"IMP-5.C","skill":"3.D","difficulty":"medium","stimulus":{"type":"bar","title":"WOMEN'S ROLE IN AGRICULTURE IN FOUR COUNTRIES (HYPOTHETICAL DATA)","categories":["Country 1","Country 2","Country 3","Country 4"],"series":[{"name":"Women as % of agricultural workers","values":[48,42,30,25]},{"name":"Women as % of agricultural landholders","values":[15,12,20,18]}],"yLabel":"Percent","yMax":60,"source":"Hypothetical data"},"stem":"Which conclusion is best supported by the chart?","options":{"A":"In every country, women make up more than half of agricultural landholders.","B":"Country 4 has the highest percentage of agricultural workers who are women.","C":"In every country, women make up a larger percentage of agricultural workers than of agricultural landholders.","D":"In Country 3, women's percentage of agricultural landholders is greater than their percentage of agricultural workers.","E":"Women make up more than half of agricultural workers in every country."},"answer":"C","explanation":"Compare the two bars for each country. Women's percentage of farm workers is always bigger than their percentage of landholders: 48 vs. 15, 42 vs. 12, 30 vs. 20, and 25 vs. 18. (The chart counts people. It does not show hours worked or how much land each person holds.) This gap matters because people who do not hold land often have a harder time getting loans, seed, and fertilizer.","whyNot":{"A":"Women make up 12% to 20% of agricultural landholders, below half in every country.","B":"Country 4 has the SMALLEST share (25%). Country 1 has the largest (48%).","D":"In Country 3, women are 30% of workers but only 20% of landholders.","E":"No country reaches 50%. The highest is 48%."},"vocab":["women in agriculture","land tenure"]},{"id":"U5-P36","topic":"5.12","lo":"IMP-5.C","skill":"2.D","difficulty":"hard","stem":"Which statement best explains why women's roles in food production differ between small-scale subsistence farming regions and highly mechanized commercial farming regions?","options":{"A":"Women do most of the work on mechanized farms, while men do most of the hand labor on subsistence farms.","B":"Subsistence farming uses so much heavy machinery that women's hand labor is rarely needed in the fields.","C":"Women's roles in food production depend mainly on a region's climate rather than on the type of farming.","D":"Subsistence farms rely on hand labor, often done by women, while mechanized farms need few workers and are more often run by men.","E":"Mechanized commercial farms employ more women than subsistence farms do, because machines need many operators."},"answer":"D","explanation":"On small subsistence farms, growing food takes lots of hand work, and in many regions women do much of the planting, weeding, harvesting, and food processing for the family. On big mechanized farms, machines do most of the work, so far fewer workers are needed, and owners and operators have more often been men. Women's roles change with the TYPE of farming, which is exactly what your AP course guide says.","whyNot":{"A":"This reverses the pattern: women often do much of the hand labor on subsistence farms, and mechanized farms are more often run by men.","B":"Subsistence farming uses very LITTLE machinery and lots of hand labor.","C":"Your AP course guide says roles depend on the type of production, not mainly on climate.","E":"Mechanized farms need far fewer workers of any gender, not more."},"vocab":["women in agriculture","subsistence agriculture","commercial agriculture"]}],"exam":{"title":"Unit 5 Practice Exam: Agriculture and Rural Land-Use Patterns and Processes","timeMinutes":25,"questionCount":25,"directions":"Each of the questions or incomplete statements below is followed by five suggested answers or completions. Select the one that is best in each case. Your score is based only on the number of questions answered correctly, so answer every question. Work quickly without losing accuracy, and come back to any question you skipped if time allows.","stimulusCount":10,"questions":[{"id":"U5-E01","n":1,"topic":"5.1","lo":"PSO-5.A","skill":"1.A","difficulty":"easy","stem":"Which of the following best describes the difference between intensive and extensive agriculture?","options":{"A":"Intensive agriculture produces food for the farm family, whereas extensive agriculture produces food for sale.","B":"Intensive agriculture is practiced in developed countries, whereas extensive agriculture is practiced in developing countries.","C":"Intensive agriculture grows crops, whereas extensive agriculture raises livestock.","D":"Intensive agriculture uses many inputs per unit of land, whereas extensive agriculture uses few inputs per unit of land.","E":"Intensive agriculture relies on rainfall, whereas extensive agriculture relies on irrigation."},"answer":"D","rationales":{"A":"Incorrect. Both kinds can be subsistence or commercial. Wet-rice farming is intensive subsistence; a large market garden is intensive commercial; nomadic herding is extensive subsistence; ranching is extensive commercial.","B":"Incorrect. Both are found in developed and developing countries, for example ranching in the United States and Argentina and intensive rice farming in Japan and Bangladesh.","C":"Incorrect. The distinction is about inputs per unit of land, not crop versus livestock. Dairying is intensive livestock farming; shifting cultivation is extensive crop farming.","D":"Correct. Intensive agriculture uses high inputs of labor or capital per unit of land to produce a high output from that land. Extensive agriculture uses relatively few inputs per unit of land, often over large areas, as in ranching, nomadic herding, and shifting cultivation.","E":"Incorrect. Water source does not define the two categories; many intensive and extensive systems are rain-fed, and some of each are irrigated."},"explanation":"Intensive farming puts more labor or money into each acre (vegetable farms, rice paddies, dairies). Extensive farming puts fewer inputs into each acre and often covers a large area (ranching, nomadic herding, shifting cultivation). The test is inputs per acre, not the farm's total size, rich or poor countries, or crops versus animals."},{"id":"U5-E02","n":2,"topic":"5.2","lo":"PSO-5.B","skill":"1.A","difficulty":"easy","stem":"A rural settlement pattern in which farm families live together in a village and walk out to fields that surround it is called a","options":{"A":"clustered settlement","B":"dispersed settlement","C":"linear settlement","D":"long-lot settlement","E":"township-and-range settlement"},"answer":"A","rationales":{"A":"Correct. Clustered (nucleated) settlements group homes together in a village, with farmland around it. They are common in much of Europe, Asia, and Africa, often for defense, shared water, or community services.","B":"Incorrect. In dispersed settlements, each family lives on its own farm, separated from neighbors, as in much of the U.S. Midwest.","C":"Incorrect. Linear settlements string homes along a river, road, or canal.","D":"Incorrect. Long lot is a survey method that usually produces a linear pattern along a river, not a central village.","E":"Incorrect. Township and range is a survey method; it usually produces a dispersed pattern of isolated farmsteads."},"explanation":"Clustered = everyone's house is together in a village, and the fields are around the outside. Dispersed = every farmhouse sits alone on its own land. Linear = houses in a line along a river or road."},{"id":"U5-E03","n":3,"set":"vonthunen","topic":"5.8","lo":"PSO-5.D","skill":"4.E","difficulty":"easy","stimulus":{"type":"rings","title":"LAND USE AROUND A MARKET CITY ON AN ISOLATED, UNIFORM PLAIN","center":"Market city","rings":[{"label":"W"},{"label":"X"},{"label":"Y"},{"label":"Z"}],"outer":"Wilderness","description":"Four rings, labeled W, X, Y, and Z, surround a single market city. Ring W touches the city; ring Z is farthest away. The plain is flat with equal soil everywhere, there are no roads or rivers, and farmers carry their own goods to the city.","source":"Based on the model in von Thünen, The Isolated State (1826)"},"stem":"According to von Thünen's model, which ring in the diagram would most likely be used for growing grain and other field crops?","options":{"A":"Ring W","B":"Ring X","C":"Ring Y","D":"Ring Z","E":"The market city"},"answer":"C","rationales":{"A":"Incorrect. Ring W, nearest the city, is for perishable, high-value products such as vegetables and milk.","B":"Incorrect. In von Thünen's original model, the second ring is forest for firewood and lumber, which were heavy and costly to haul.","C":"Correct. Grain and field crops occupy the third ring. Grain keeps well and is worth enough to be hauled a moderate distance, but it needs more land than ring W uses.","D":"Incorrect. Ring Z, the outermost farming ring, is for livestock ranching, which needs the most land and the cheapest land.","E":"Incorrect. The city is the market, where farm products are sold, not where field crops are grown."},"explanation":"Remember the order from the city out: 1) vegetables and dairy, 2) forest, 3) grain, 4) ranching. Ring Y is the third ring, so it is grain."},{"id":"U5-E04","n":4,"set":"vonthunen","topic":"5.8","lo":"PSO-5.D","skill":"1.B","difficulty":"medium","stem":"According to von Thünen's model, which of the following best explains why ring Z is used for livestock ranching?","options":{"A":"Ranching produces the most valuable output per hectare of any land use, so ranchers can afford to pay the highest land rent.","B":"Ranching needs very large areas of land, land rent is lowest far from the city, and animals can be walked to market.","C":"Cattle must be kept close to the city because meat spoils within hours.","D":"The soil in ring Z is poorer than the soil in the other rings.","E":"Government rules in the model prohibit ranching near the city."},"answer":"B","rationales":{"A":"Incorrect. Ranching earns relatively little per hectare, which is why it is pushed to the outer ring where land rent is lowest.","B":"Correct. Ranching needs a lot of land. Far from the market, land rent is low, and livestock can walk to the city instead of being hauled, which lowers transport costs over long distances.","C":"Incorrect. In the model, live animals walk to market, so distance matters less for them, not more.","D":"Incorrect. The model assumes the same soil everywhere on a uniform plain. Differences come from distance to market, not soil.","E":"Incorrect. The model is based on economics (land rent and transport cost), not government rules."},"explanation":"Ranching takes a LOT of land and does not earn much per acre, so it goes where land is cheapest: far from the city. And cattle can walk themselves to market, so the long trip costs less than hauling heavy crops would."},{"id":"U5-E05","n":5,"set":"vonthunen","topic":"5.8","lo":"PSO-5.D","skill":"2.C","difficulty":"hard","stem":"Suppose a navigable canal were built from the market city straight out through rings W, X, Y, and Z. Based on von Thünen's reasoning, which change would most likely occur?","options":{"A":"All four rings would disappear because farmers would move into the city.","B":"The rings would shrink toward the city because transport costs would rise along the canal.","C":"Each ring would stretch outward along the canal because shipping goods by water lowers transport costs.","D":"Ranching would move into ring W because cattle could no longer walk to the market.","E":"The order of the rings would reverse, with ranching located nearest the city and vegetables grown farthest out."},"answer":"C","rationales":{"A":"Incorrect. A canal would make farming farther from the city more profitable, not end it.","B":"Incorrect. Cheap water transport lowers transport costs, so the rings would extend, not shrink.","C":"Correct. Von Thünen himself showed that a navigable river distorts the rings. Lower transport costs along the waterway let each land use extend farther from the city in a band along the canal, so the circles stretch into elongated shapes.","D":"Incorrect. Cattle could still walk or be shipped; nothing in the change would push ranching onto the highest-rent land.","E":"Incorrect. The canal lowers costs along one line; it does not change which products are most perishable or most valuable per hectare."},"explanation":"The rings exist because hauling goods costs more the farther you go. A canal makes shipping much cheaper along its route. So farmers along the canal can grow each product farther from the city, and each ring stretches out along the water like a tongue. Von Thünen showed this with a river in his own book."},{"id":"U5-E06","n":6,"topic":"5.3","lo":"SPS-5.A","skill":"1.A","difficulty":"easy","stem":"Which of the following correctly pairs an early hearth of domestication with crops first domesticated there?","options":{"A":"Mesoamerica (Central America) — rice, soybeans, and green tea","B":"Southeast Asia — maize and potatoes","C":"Fertile Crescent — cassava and sweet potatoes","D":"Northern Europe — coffee and cacao","E":"Mesoamerica (Central America) — maize, beans, and squash"},"answer":"E","rationales":{"A":"Incorrect. Rice, soybeans, and tea were first domesticated in East and Southeast Asia, not Mesoamerica.","B":"Incorrect. Maize comes from Mesoamerica and potatoes from the Andes of South America.","C":"Incorrect. The Fertile Crescent is known for wheat, barley, lentils, sheep, and goats. Cassava and sweet potatoes come from the Americas.","D":"Incorrect. Northern Europe was not an early hearth. Coffee was first cultivated in the Ethiopia-Yemen region, and cacao in the Americas.","E":"Correct. Mesoamerica (Central America and southern Mexico), one of the hearths named in the AP course framework, domesticated maize, beans, and squash, often grown together as the \"three sisters.\""},"explanation":"Mesoamerica gave the world maize (corn), beans, and squash, often grown together as the \"three sisters.\" The Fertile Crescent gave wheat, barley, sheep, and goats. Southeast and East Asia gave rice."},{"id":"U5-E07","n":7,"topic":"5.3","lo":"SPS-5.B","skill":"2.B","difficulty":"medium","stem":"After the potato arrived in Europe from the Americas, it contributed to population growth in places such as Ireland and northern Europe in the 1700s and 1800s mainly because it","options":{"A":"was grown mostly on large commercial plantations for export","B":"produced many calories per acre and grew well in cool, wet climates","C":"could be stored for several years without spoiling","D":"was first domesticated in Ireland, so farmers already knew how to grow it","E":"replaced all other foods in the European diet within a few years"},"answer":"B","rationales":{"A":"Incorrect. Potatoes were grown widely on small family plots, which is one reason they fed so many poor households.","B":"Correct. As part of the Columbian Exchange, the Andean potato reached Europe, where it produced more food energy per acre than grains and thrived in cool, damp climates. More food from small plots supported population growth.","C":"Incorrect. Potatoes keep for months, not years; their advantage was high calories per acre in cool, wet climates.","D":"Incorrect. Potatoes were domesticated in the Andes of South America.","E":"Incorrect. Potatoes became very important, especially in Ireland, but they did not replace all other foods across Europe."},"explanation":"The potato came from the Andes Mountains in South America through the Columbian Exchange. It grows lots of food on a small patch of ground and likes cool, wet weather, which is exactly what Ireland and northern Europe have. More food meant more families could survive and grow."},{"id":"U5-E08","n":8,"topic":"5.4","lo":"SPS-5.C","skill":"1.D","difficulty":"medium","stem":"The enclosure movement in Britain during the Second Agricultural Revolution most directly resulted in","options":{"A":"the division of large estates into many small plots that were then handed out to poor, landless peasant families","B":"the return of large areas of farmland to forest in order to protect wildlife habitat","C":"a decline in national food production as the newly enclosed farms became less efficient","D":"a shift from commercial farming back to subsistence farming on most British farms","E":"the consolidation of scattered strips and common land into enclosed farms under individual ownership or tenancy"},"answer":"E","rationales":{"A":"Incorrect. Enclosure did the opposite, combining small strips and common land into larger private holdings.","B":"Incorrect. Enclosed land was used for more efficient crops and pasture, not returned to forest.","C":"Incorrect. Consolidated farms adopted new methods such as crop rotation and selective breeding, and output rose.","D":"Incorrect. Enclosed farms grew more crops and livestock for sale to growing towns and cities, so farming became more commercial, not less.","E":"Correct. Enclosure consolidated scattered strips and common land into individually controlled farms, often reducing rural households' access to shared resources. Larger enclosed farms adopted new methods such as crop rotation and selective breeding."},"explanation":"Enclosure combined scattered farm strips and shared \"common\" land into fenced fields controlled by one owner or tenant. Bigger farms could use new methods. Families who lost the common land often had to find other ways to earn a living, such as wage work on farms or in towns."},{"id":"U5-E09","n":9,"set":"greenrev","topic":"5.5","lo":"SPS-5.D","skill":"3.C","difficulty":"medium","stimulus":{"type":"table","title":"WHEAT FARMING IN COUNTRY M, 1960–1990 (HYPOTHETICAL DATA)","columns":["Year","Wheat yield (tonnes per hectare)","Cropland that is irrigated (%)","Fertilizer used (kg per hectare)","Population (millions)"],"rows":[["1960","0.8","18","3","450"],["1975","1.4","25","20","610"],["1990","2.3","32","70","850"]],"source":"Hypothetical data"},"stem":"Which conclusion is best supported by the data in the table?","options":{"A":"Wheat yields rose as irrigation and fertilizer use increased, consistent with the Green Revolution.","B":"Wheat yield increased by a smaller percentage than population did between 1960 and 1990.","C":"Irrigation decreased steadily over time because the new high-yield wheat varieties needed much less water.","D":"Fertilizer use stayed about the same from 1960 to 1990 while wheat yields rose.","E":"Population growth stopped soon after wheat yields began to rise in the 1960s."},"answer":"A","rationales":{"A":"Correct. Yield nearly tripled (0.8 to 2.3 tonnes per hectare) while irrigated cropland rose from 18 to 32 percent and fertilizer use rose from 3 to 70 kg per hectare. This pattern is consistent with the Green Revolution, although the table does not identify the seed varieties used.","B":"Incorrect. Wheat yield increased by about 188 percent, while population increased by about 89 percent.","C":"Incorrect. The irrigated share rose in each period.","D":"Incorrect. Fertilizer use rose more than twentyfold.","E":"Incorrect. Population kept growing, from 450 to 850 million."},"explanation":"Wheat yield almost tripled. The irrigated share of cropland rose from 18% to 32%, and fertilizer use jumped from 3 to 70 kilograms per hectare. More water and fertilizer with rising yields is the pattern the Green Revolution produced."},{"id":"U5-E10","n":10,"set":"greenrev","topic":"5.5","lo":"SPS-5.D","skill":"2.C","difficulty":"hard","stem":"Which of the following is a likely negative consequence of the changes shown in the table?","options":{"A":"Lower wheat yields caused by the loss of irrigation","B":"A shortage of fertilizer that forced farmers back to subsistence farming","C":"Falling groundwater levels and water pollution from fertilizer runoff","D":"Rapid growth of forests on abandoned wheat fields","E":"An end to wheat exports because farmers grew only vegetables"},"answer":"C","rationales":{"A":"Incorrect. The table shows irrigation expanding and yields rising.","B":"Incorrect. Fertilizer use rose sharply; nothing suggests a shortage.","C":"Correct. Irrigation can lower groundwater levels if pumping exceeds recharge, and much heavier fertilizer use can pollute surface water through runoff and groundwater through seepage. These environmental costs accompanied the Green Revolution in places such as Punjab.","D":"Incorrect. The table provides no evidence that wheat fields were abandoned or that forests expanded.","E":"Incorrect. The table shows rising wheat yields, not a switch to vegetables."},"explanation":"If farmers pump groundwater faster than rain and rivers refill it, water levels fall. Fertilizer can also wash into rivers or seep into wells. These are possible environmental costs of growing more food."},{"id":"U5-E11","n":11,"topic":"5.4","lo":"SPS-5.C","skill":"1.B","difficulty":"medium","stem":"The Second Agricultural Revolution was closely linked to the Industrial Revolution because","options":{"A":"factories replaced farms as the main source of the food eaten in growing industrial cities","B":"efficient farms freed workers for factories, while factories made better farm tools","C":"governments banned the use of machinery on farms in order to protect new factory jobs in cities","D":"industrial cities grew most of their own food on rooftops, so rural farms were no longer needed","E":"the Industrial Revolution began in rural farming areas and only later spread into cities"},"answer":"B","rationales":{"A":"Incorrect. Food still came from farms; factories processed some of it later.","B":"Correct. The two revolutions reinforced each other. Productive farms needed fewer workers and fed growing cities, supplying labor and food for industry, while industrial products such as steel plows, reapers, and later tractors and fertilizer made farms more productive still.","C":"Incorrect. Farms adopted more machinery, not less.","D":"Incorrect. Cities depended on farms in the countryside for food.","E":"Incorrect. Some early mills were built in the countryside near water power, but that does not explain the link: farms supplied workers and food to industry, and industry supplied tools to farms."},"explanation":"The two revolutions helped each other. Better farming meant fewer farmers could feed everyone, so extra people could work in factories. And factories built new farm tools like steel plows and reapers, which made farms even more productive."},{"id":"U5-E12","n":12,"topic":"5.6","lo":"PSO-5.C","skill":"1.D","difficulty":"medium","stem":"Large estates in tropical regions that grow a single cash crop, such as bananas, sugarcane, or oil palms, mainly for export to distant markets are an example of","options":{"A":"shifting cultivation","B":"pastoral nomadism","C":"subsistence agriculture","D":"plantation agriculture","E":"market gardening"},"answer":"D","rationales":{"A":"Incorrect. Shifting cultivation clears small forest plots for a few years of food crops, then moves on; it is mostly subsistence.","B":"Incorrect. Pastoral nomadism is moving herds to find pasture.","C":"Incorrect. Subsistence agriculture grows food mainly for the farm family's own use, not for export.","D":"Correct. Plantations are large commercial estates, often in tropical regions, that specialize in one export crop (monoculture). Many began with colonial investment, and the AP course framework classifies plantation agriculture as intensive.","E":"Incorrect. Market gardening grows a variety of fruits and vegetables for nearby city markets."},"explanation":"A plantation is a big farm in a warm, tropical place that grows one crop to sell to faraway countries: bananas, sugarcane, coffee, or palm oil. It is commercial (for sale), monoculture (one crop), and intensive (lots of workers and money)."},{"id":"U5-E13","n":13,"topic":"5.6","lo":"PSO-5.C","skill":"1.D","difficulty":"hard","stem":"Dairy farms historically surrounded large cities such as New York and Chicago in zones known as \"milksheds.\" Bid-rent theory best explains this pattern because","options":{"A":"dairy cattle need much more grazing land per animal than beef cattle raised on open ranges","B":"milk keeps fresh for months, so it can be shipped very long distances at very low cost","C":"land near large cities was usually much cheaper than land in remote rural areas","D":"city governments required all milk sold in the city to be produced inside city limits","E":"fresh milk spoiled fast and was costly to ship, so dairies could pay high rents near the city"},"answer":"E","rationales":{"A":"Incorrect. Dairying is usually more intensive than ranching, using less land per unit of output.","B":"Incorrect. Fresh milk spoils quickly, which is why it was produced near consumers before modern refrigeration.","C":"Incorrect. Bid-rent theory predicts land is more expensive closer to the market.","D":"Incorrect. The pattern reflects land rent and transport costs, not a law requiring production inside the city.","E":"Correct. Because fresh milk was perishable and expensive to ship, producers close to the city could earn more per acre, so dairying outbid less intensive uses for the high-rent land near the market."},"explanation":"Fresh milk goes bad fast, and moving it far used to be hard and expensive. So dairy farmers near the city could make more money per acre than, say, grain farmers. That let them pay the high price of land close to the city. That is bid-rent: whoever earns the most from being close wins the close land."},{"id":"U5-E14","n":14,"set":"exports","topic":"5.9","lo":"PSO-5.E","skill":"3.C","difficulty":"medium","stimulus":{"type":"table","title":"EXPORT EARNINGS OF FIVE COUNTRIES (HYPOTHETICAL DATA)","columns":["Country","Largest export","Share of export earnings from largest export (%)","Second-largest export","Share from second-largest export (%)"],"rows":[["Country P","Coffee","62","Bananas","9"],["Country Q","Automobiles","14","Coffee","3"],["Country R","Copper","48","Coffee","11"],["Country S","Coffee","21","Textiles","19"],["Country T","Software services","25","Coffee","6"]],"source":"Hypothetical data"},"stem":"Assuming export quantities and all other prices stay the same, which country would have the largest percentage drop in its total export earnings if the world price of coffee fell by 40 percent?","options":{"A":"Country P","B":"Country Q","C":"Country R","D":"Country S","E":"Country T"},"answer":"A","rationales":{"A":"Correct. Coffee provides 62 percent of Country P's export earnings. With export quantities and other prices unchanged, a 40 percent coffee-price decline reduces its total export earnings by 24.8 percent (0.62 × 0.40), the largest percentage decrease shown.","B":"Incorrect. Coffee is only 3 percent of Country Q's export earnings.","C":"Incorrect. Coffee is 11 percent of Country R's earnings; its larger exposure is to copper prices.","D":"Incorrect. Coffee is Country S's largest export, but at 21 percent its earnings are more diversified than Country P's.","E":"Incorrect. Coffee is only 6 percent of Country T's export earnings."},"explanation":"Find the country that gets the biggest share of its export money from coffee: Country P, at 62%. If coffee prices fall 40%, Country P loses 0.62 × 0.40 = 0.248, about a quarter (24.8%) of all its export earnings. Country S, next highest, would lose only 8.4% (0.21 × 0.40)."},{"id":"U5-E15","n":15,"set":"exports","topic":"5.9","lo":"PSO-5.E","skill":"3.E","difficulty":"hard","stem":"The table best illustrates which aspect of the global system of agriculture?","options":{"A":"Most countries grow all of their own food and have no need to export agricultural goods.","B":"Some countries depend heavily on a few export commodities, tying their economies to world prices.","C":"Commodity prices are set by each producing country's government and do not change.","D":"Coffee is grown mainly in countries with cold winters and sold mostly to tropical countries.","E":"Countries with diversified exports are more affected by changes in a single crop's price."},"answer":"B","rationales":{"A":"Incorrect. Every country in the table exports coffee, so these countries do sell agricultural goods abroad.","B":"Correct. Countries P and R receive about half or more of their export earnings from one primary commodity, so their export earnings are sensitive to that commodity's world price. The table does not show how much exports contribute to total national income. The AP course framework notes that some countries are highly dependent on one or more export commodities.","C":"Incorrect. Commodity prices are set on world markets and can change sharply.","D":"Incorrect. Coffee is a tropical crop, and the largest consumer markets include the United States and Europe.","E":"Incorrect. A more diversified export mix reduces the direct effect of a single crop's price change on total export earnings, all other factors being equal."},"explanation":"Some countries make most of their export money from one product, like coffee or copper. The price is set by buyers and traders all over the world, so a price drop somewhere else can hurt that whole country's economy. That is what it means to be part of a global system."},{"id":"U5-E16","n":16,"set":"timeuse","topic":"5.12","lo":"IMP-5.C","skill":"3.D","difficulty":"medium","stimulus":{"type":"bar","title":"AVERAGE HOURS PER WEEK SPENT ON FOOD-RELATED WORK, BY SEX, IN A RURAL REGION (HYPOTHETICAL DATA)","categories":["Growing food crops for the household","Growing cash crops for sale","Processing and preparing food","Selling at local markets"],"series":[{"name":"Women (hours per week)","values":[18,6,14,6]},{"name":"Men (hours per week)","values":[9,16,2,3]}],"yLabel":"Hours per week","yMax":20,"text":"In this region, most land titles and most bank loans for farming are held by men.","source":"Hypothetical data"},"stem":"Which conclusion is best supported by the chart?","options":{"A":"Men spend more time than women on every one of the four types of food-related work shown.","B":"Women spend more hours per week than men growing cash crops that are sold for income.","C":"Women and men spend about the same number of hours processing and preparing food.","D":"Women spend more time on household food crops and processing; men, on cash crops.","E":"Neither women nor men in the region spend any time selling food at local markets."},"answer":"D","rationales":{"A":"Incorrect. Women spend more time than men in three of the four categories.","B":"Incorrect. Men spend 16 hours on cash crops; women spend 6.","C":"Incorrect. Women spend 14 hours processing and preparing food; men spend 2.","D":"Correct. Women average 18 hours on household food crops and 14 on processing, compared with 9 and 2 for men, while men average 16 hours on cash crops compared with 6 for women.","E":"Incorrect. Women spend 6 hours and men 3 hours per week selling at local markets."},"explanation":"Compare the pairs of bars. Women's bars are taller for household food crops (18 vs. 9), processing food (14 vs. 2), and selling (6 vs. 3). Men's bar is taller only for cash crops (16 vs. 6)."},{"id":"U5-E17","n":17,"set":"timeuse","topic":"5.10","lo":"IMP-5.A","skill":"2.B","difficulty":"hard","stem":"Which factor could help explain the division of work shown in the chart and the note?","options":{"A":"Women in the region are not allowed to work outdoors.","B":"Cash crops require no labor, so most of the work goes into household food crops.","C":"Gender roles and unequal access to land and farm loans influence how farm and household work is divided.","D":"Food processing in the region is fully mechanized, so most of women's processing hours are spent operating and repairing machines.","E":"Men in the region have left farming entirely for jobs in distant cities."},"answer":"C","rationales":{"A":"Incorrect. Women spend more hours than men on field work for household food crops.","B":"Incorrect. Men spend 16 hours per week on cash crops, so they do require labor.","C":"Correct. Gender roles and access to farming resources can shape work assignments. The chart and note are consistent with this explanation, but they do not establish who controls cash income. The AP course framework lists the role of women in agricultural production as a societal effect of agricultural practices.","D":"Incorrect. The chart reports processing time but gives no information about machinery or how that time is used.","E":"Incorrect. Men still spend many hours on farm work, especially cash crops."},"explanation":"Women and men spend their time on different tasks, and the note says men hold most land titles and farm loans. Gender roles and unequal access to land and loans can help explain who does which work. But the chart cannot tell us who controls the money."},{"id":"U5-E18","n":18,"set":"timeuse","topic":"5.12","lo":"IMP-5.C","skill":"3.F","difficulty":"hard","stem":"Which of the following is a limitation of the chart for understanding women's role in agriculture in the region?","options":{"A":"It shows hours worked, but not who decides what to grow or who keeps the income.","B":"It compares the work of women and men who live in the same rural region.","C":"It includes several different types of food-related work instead of only one.","D":"It measures the time spent on each type of work in hours per week.","E":"It shows the work of both women and men rather than only one group."},"answer":"A","rationales":{"A":"Correct. Hours worked do not show control over land, decisions, or income. Two groups can work similar hours with very different power over resources, so the chart alone cannot show who benefits from the work.","B":"Incorrect. Comparing women and men in the same region is a strength of the chart, not a limitation.","C":"Incorrect. Including several types of work gives a fuller picture, which is a strength.","D":"Incorrect. Hours per week is a clear, appropriate unit for time use.","E":"Incorrect. Showing both groups allows comparison, which is a strength."},"explanation":"The chart tells us how many HOURS each group works. It does not tell us who makes the decisions or who gets to keep the money. That missing piece matters a lot for understanding women's role in farming."},{"id":"U5-E19","n":19,"topic":"5.7","lo":"PSO-5.C","skill":"1.D","difficulty":"medium","stem":"Since the mid-1900s, the number of farms in the United States has fallen sharply while the average size of a farm has grown. Which of the following best explains this trend?","options":{"A":"Farmers across the country shifted from commercial farming back to subsistence farming.","B":"Government programs divided large farms into many small plots for new farm families.","C":"Shifting cultivation became the main farming method across most of the Midwest.","D":"Most of the nation's farmland was converted back into forest after about 1950.","E":"Mechanization and economies of scale helped large farms expand as many smaller ones closed."},"answer":"E","rationales":{"A":"Incorrect. U.S. agriculture became more commercial, not less.","B":"Incorrect. Farms consolidated into fewer, larger units.","C":"Incorrect. Shifting cultivation is not practiced in the U.S. Midwest.","D":"Incorrect. Most farmland stayed in production; the change was in how many operations controlled it.","E":"Correct. Mechanization lets fewer workers farm more land, and spreading machinery and other fixed costs over more acres lowers average costs (economies of scale). These advantages encouraged consolidation. The AP course framework says large-scale commercial operations are replacing small family farms."},"explanation":"A big farm can spread the cost of a $500,000 combine over thousands of acres, so the machine costs less per acre. That advantage helped big farms grow while many smaller farms closed or sold their land. So there are fewer farms, and the average farm is bigger."},{"id":"U5-E20","n":20,"topic":"5.7","lo":"PSO-5.C","skill":"1.D","difficulty":"medium","stem":"Coffee beans grown on small farms in Colombia are sold to an exporter, roasted in a plant in New Jersey, packaged, shipped to a distribution center, and sold in a café in Chicago. This sequence best illustrates","options":{"A":"a food desert in the city of Chicago","B":"the von Thünen model of land use in concentric rings around a single market city","C":"subsistence agriculture practiced by the coffee farmers","D":"the Second Agricultural Revolution in Colombia","E":"a commodity chain linking places of agricultural production and consumption"},"answer":"E","rationales":{"B":"Incorrect. Von Thünen's model explains land use around one local market; this example crosses countries and involves processing and distribution steps.","C":"Incorrect. The coffee is grown for sale, not for the farmers' own consumption.","D":"Incorrect. The example describes a modern global supply chain, not the 1700s–1800s agricultural changes in Europe.","E":"Correct. A commodity chain is the linked series of steps (growing, buying, processing, packaging, distributing, and selling) that connects a product's producers to its consumers, often across several countries. The AP course framework says complex commodity chains link production and consumption of agricultural products.","A":"Incorrect. A café selling coffee says nothing about residents' access to affordable, healthy food."},"explanation":"Follow the coffee from farm to cup: grown in Colombia, sold, roasted in New Jersey, packed, shipped, and sold in Chicago. That chain of steps connecting the farmer to the customer is a commodity chain."},{"id":"U5-E21","n":21,"topic":"5.10","lo":"IMP-5.A","skill":"2.B","difficulty":"medium","stem":"In parts of the Sahel region of Africa, which human activity has most contributed to desertification during periods of drought?","options":{"A":"Overgrazing and cutting trees and shrubs, which leaves dry soil exposed to wind erosion","B":"Building terraces on steep hillsides in order to grow flooded rice paddies","C":"Converting large areas of desert into irrigated rice paddies along the region's major rivers","D":"Planting long belts of trees across the region to block the dry winds","E":"Rotating crops each season in order to restore nutrients to the soil"},"answer":"A","rationales":{"A":"Correct. When too many animals graze, or trees and shrubs are cut for fuel and farmland, the protective plant cover is lost. During droughts, bare soil dries out and blows away, and the land becomes desert-like. Climate variability plays a large role, but these land uses make the damage worse.","B":"Incorrect. Terracing is a conservation practice that reduces erosion, and the Sahel is not a hillside rice region.","C":"Incorrect. Irrigated rice covers only s
