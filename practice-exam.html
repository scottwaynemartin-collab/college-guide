  --focus:#FFC83D;
  /* unit palette: the FRQ Tutor hub's unit hue order mapped onto GeoArcade tokens */
  --u1:#2F6FED;--u1-soft:#E4ECFF;--u1-deep:#1F4FB8;
  --u2:#EC4899;--u2-soft:#FCE1EF;--u2-deep:#BE185D;
  --u3:#16A34A;--u3-soft:#DCFCE7;--u3-deep:#15803D;
  --u4:#FFC83D;--u4-soft:#FFF3CC;--u4-deep:#A16207;
  --u5:#FF6A3D;--u5-soft:#FFE7DD;--u5-deep:#B74320;
  --u6:#7C3AED;--u6-soft:#EEE4FF;--u6-deep:#5B21B6;
  --u7:#EF4444;--u7-soft:#FEE2E2;--u7-deep:#B91C1C;
  /* stimulus colors (maps, charts, tables) */
  --stim-water:#DCEAF9;--stim-land:#EDE6D3;--stim-land-stroke:#B9AF93;--stim-power:#D8D2E6;--stim-small:#FBF7EA;
  --zone-0:#8DB4F0;--zone-1:#ADCAF5;--zone-2:#CDDFF9;--zone-3:#E8F0FD;
  --pc-blue:#CFE0FF;--pc-orange:#FFD9C7;
  --bar-1:#2F6FED;--bar-2:#FF6A3D;--chart-grid:#E8E2D6;
  --claim-a:#2F6FED;--claim-b:#7C3AED;--lane:#1F1B3A;--conflict:#D7263D;--base-n:#5B21B6;--base-s:#0F766E;
}
html.dm{
  --green-deep:#7EDBA0;--red-deep:#F79A9A;--amber:#F6B544;--amber-soft:#3F3210;--amber-line:#7A6529;
  --u1-soft:#1B2A5E;--u1-deep:#A3C0FF;--u2-soft:#4A1A3B;--u2-deep:#F8A3CC;--u3-soft:#163B25;--u3-deep:#7EDBA0;
  --u4-soft:#3F3210;--u4-deep:#FFD66B;--u5-soft:#4A2418;--u5-deep:#FFA98E;--u6-soft:#311F62;--u6-deep:#C9ADFF;--u7-soft:#4B1D1D;--u7-deep:#F79A9A;
  --stim-water:#172B4D;--stim-land:#3A3550;--stim-land-stroke:#6B668A;--stim-power:#3B3560;--stim-small:#2A2548;
  --zone-0:#3B64B8;--zone-1:#2F5096;--zone-2:#263F76;--zone-3:#1E3058;
  --pc-blue:#28407A;--pc-orange:#6B3A26;
  --bar-1:#7FA6FF;--bar-2:#FF9A78;--chart-grid:#312C5F;
  --claim-a:#7FA6FF;--claim-b:#C9ADFF;--lane:#F2EFFF;--conflict:#FF7A8A;--base-n:#C9ADFF;--base-s:#63D6C9;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
html,body{margin:0;background:var(--paper)}
body{color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,.disp{font-family:var(--display);font-weight:600;letter-spacing:-.01em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
a{color:var(--l1-deep)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700}
.skip:focus{top:12px}
.app{min-height:100%;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:22px 20px 56px}
@media (max-width:640px){main{padding:14px 14px 48px}}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(251,248,242,.88);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
html.dm .bar{background:rgba(16,13,36,.85)}
.bar-in{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;min-height:60px}
@media (max-width:640px){.bar-in{padding:8px 12px;gap:8px}}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:19px;color:var(--ink);text-align:left;min-height:44px;padding:0 4px;border-radius:12px}
.brand svg{width:32px;height:32px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);line-height:1;margin-bottom:3px}
.brand .bt{line-height:1.05}
.bar-ctx{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-2);font-size:14px;min-width:0}
.bar-ctx{flex:0 1 auto}.bar-ctx .ellip{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sp{flex:1}
.bar-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.brand .bt{display:none}.brand small{display:none}.bar-ctx{font-size:13px}}

/* unit pill used in the bar and cards */
.upill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--uc-soft);color:var(--uc-deep);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.02em;white-space:nowrap}
.upill i{width:8px;height:8px;border-radius:50%;background:var(--uc);display:inline-block}

/* ---------- buttons ---------- */
.act{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;font-weight:700;font-size:15px;line-height:1.2;border:2px solid transparent;transition:transform .12s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;white-space:nowrap;text-decoration:none}
.act:active{transform:translateY(1px)}
.act:disabled{opacity:.45;transform:none}
.act.primary{background:var(--ink);color:#fff;box-shadow:var(--sh)}
.act.primary:hover:not(:disabled){box-shadow:var(--sh-lg);transform:translateY(-1px)}
html.dm .act.primary{background:#F2EFFF;color:#100D24}
.act.blue{background:var(--l1);color:#fff;box-shadow:var(--sh)}
.act.blue:hover:not(:disabled){background:var(--l1-deep);transform:translateY(-1px)}
html.dm .act.blue{color:#fff}
.act.unit{background:var(--uc);color:var(--uc-text,#fff);box-shadow:var(--sh)}
.act.unit:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--sh-lg)}
.act.ghost{background:var(--card);color:var(--ink);border-color:var(--line-2)}
.act.ghost:hover:not(:disabled){border-color:var(--ink-3);transform:translateY(-1px)}
.act.soft{background:var(--paper-2);color:var(--ink-2)}
.act.soft:hover:not(:disabled){background:var(--line)}
.act.quiet{background:transparent;color:var(--ink-2);padding:8px 12px;font-weight:700}
.act.quiet:hover:not(:disabled){background:var(--paper-2)}
.act.sm{min-height:40px;padding:8px 14px;font-size:14px}
@media (pointer:coarse),(max-width:899px){.act.sm,.seg button,.tchip{min-height:44px}}
.act.wide{width:100%}
.act .ic{width:18px;height:18px;flex:none}
.act[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts.center{justify-content:center}
.acts.between{justify-content:space-between}
.acts.end{justify-content:flex-end}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:7px;border:1px solid var(--line-2);background:var(--paper-2);font:700 12px/1 var(--mono);color:var(--ink-2)}

/* ---------- surfaces ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
@media (max-width:640px){.panel{padding:16px;border-radius:16px}}
.panel.flat{box-shadow:none}
.eyebrow{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.tag-meta{display:inline-flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.tag-meta b{font-weight:800;color:var(--ink-3)}
.note{font-size:13.5px;color:var(--ink-3);line-height:1.5}

/* ---------- start screen ---------- */
.hero{text-align:center;padding:26px 0 22px;position:relative}
.hero h1{font-size:clamp(34px,6vw,54px);font-weight:600;color:var(--ink);letter-spacing:-.02em}
.hero h1 .gl{background:linear-gradient(90deg,var(--l1),var(--l3) 55%,var(--l2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin:10px auto 0;max-width:620px;font-size:17px;color:var(--ink-2)}
.kpis{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0 6px}
.kpi{display:flex;flex-direction:column;align-items:center;min-width:132px;padding:12px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.kpi .v{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;color:var(--ink)}
.kpi .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}
.ucd{position:relative;min-width:0;display:flex;flex-direction:column;gap:12px;padding:20px 20px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.ucd::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--uc)}
.ucd.live:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.ucd .uh{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ucd .un{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--uc-soft);color:var(--uc-deep);font-family:var(--display);font-weight:600;font-size:18px}
.ucd h3{font-size:21px;line-height:1.15;color:var(--ink)}
.ucd .best{font-size:12.5px;font-weight:800;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.ucd .best .ok{color:var(--green-deep)}
.ucd .ubtns{display:grid;gap:8px;margin-top:auto}
.ucd .ubtns .act{justify-content:space-between;padding:10px 14px;min-width:0;white-space:normal;flex-wrap:wrap;text-align:left;row-gap:2px}
.ucd .ubtns .act small{font-weight:600;font-size:12.5px;opacity:.85;white-space:nowrap}
.ucd.soon{background:var(--paper-2);border-style:dashed;box-shadow:none;opacity:.78}
.ucd.soon::before{opacity:.5}
.ucd.soon .soonpill{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);color:var(--ink-3)}
.resume{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);padding:5px 10px;border-radius:999px}
.how{margin-top:26px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;align-items:stretch}
@media (max-width:860px){.how{grid-template-columns:1fr}}
.how .panel{display:flex;flex-direction:column;gap:8px}
.how h3{font-size:19px}
.how .stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--l1-soft);color:var(--l1-deep);font-family:var(--display);font-weight:600;font-size:15px}
.how p{color:var(--ink-2);font-size:14.5px}
.note-line{margin-top:16px;text-align:center;font-size:13.5px;color:var(--ink-3)}
.foot{padding:22px 20px 26px;text-align:center;font-size:13px;color:var(--ink-3);font-weight:600;border-top:1px solid var(--line)}
.foot a{color:var(--ink-2)}

/* ---------- practice ---------- */
.phead{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.phead h2{font-size:26px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 13px;border-radius:999px;background:var(--card);border:1.5px solid var(--line-2);color:var(--ink-2);font-weight:700;font-size:14px;transition:.15s;text-align:left}
@media (pointer:coarse){.tchip{min-height:44px}}
.tchip:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.tchip .n{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-3);font-size:12px;font-weight:800}
.tchip .id{font-family:var(--display);font-weight:600;color:var(--uc-deep)}
.tchip[aria-pressed="true"]{background:var(--uc-soft);border-color:var(--uc);color:var(--ink)}
.tchip[aria-pressed="true"] .n{background:var(--uc);color:#fff}
.prog{height:10px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.prog > span{display:block;height:100%;width:0;border-radius:999px;background:var(--uc);transition:width .35s ease}
.prog-row{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:800;color:var(--ink-3)}
.prog-row .prog{flex:1}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:24px;max-width:860px;margin:0 auto}
@media (max-width:640px){.qcard{padding:16px;border-radius:16px}}
.stem{font-size:18px;line-height:1.5;color:var(--ink);margin:14px 0 18px;font-weight:500}
.qn{font-family:var(--display);font-weight:600;color:var(--ink-3);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.qn:focus,.qn:focus-visible{outline:none}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;width:100%;min-height:56px;padding:12px 14px;text-align:left;border-radius:14px;border:2px solid var(--line-2);background:var(--card);color:var(--ink);font-size:16px;line-height:1.45;transition:transform .12s,border-color .15s,background .15s,box-shadow .15s}
.opt .ltr{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:17px}
.opt .mk{font-weight:800;font-size:14px;white-space:nowrap;display:none;align-items:center;gap:6px}
.opt:hover:not(:disabled){border-color:var(--uc,var(--ink-3));transform:translateY(-1px);box-shadow:var(--sh)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.6}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ok .ltr{background:var(--green);color:#fff}
.opt.ok .mk{display:inline-flex;color:var(--green-deep)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .ltr{background:var(--red);color:#fff}
.opt.bad .mk{display:inline-flex;color:var(--red-deep)}
@media (max-width:480px){.opt{grid-template-columns:34px 1fr;padding:10px 12px;font-size:15px}.opt .ltr{width:34px;height:34px;font-size:15px}.opt .mk{grid-column:2;justify-self:start}}
.fbk{margin-top:18px;border-radius:16px;padding:16px 18px;border:1.5px solid;display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:start}
.fbk.ok{background:var(--green-soft);border-color:#9ED9B3;color:var(--ink)}
.fbk.bad{background:var(--red-soft);border-color:#F3A7A7;color:var(--ink)}
html.dm .fbk.ok{border-color:#297A41}html.dm .fbk.bad{border-color:#7A2929}
.fbk .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff;font-weight:900;font-size:20px;position:relative}
.fbk.ok .ico{background:var(--green)}
.fbk.bad .ico{background:var(--red)}
.fbk h4{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2;margin-bottom:4px}
.fbk .exp{font-size:16px;line-height:1.55;color:var(--ink)}
.fbk .body{min-width:0}
.whynot{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.5;color:var(--ink-2)}
.whynot b{color:var(--ink)}
html.dm .whynot{background:rgba(255,255,255,.06)}
details.more{margin-top:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);overflow:hidden}
html.dm details.more{background:rgba(255,255,255,.04)}
details.more summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;font-size:14.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-height:44px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-left:2px;flex:none}
details.more[open] summary::before{transform:rotate(45deg)}
details.more .inner{padding:0 14px 14px;display:grid;gap:10px}
.wn{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.wn .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.wn.correct .ltr{background:var(--green);color:#fff}
.pnext{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.pnext .hint{font-size:13px;color:var(--ink-3);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (pointer:coarse){.pnext .hint{display:none}}
/* celebration (practice correct) */
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--c);animation:burst .7s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}}
/* summary */
.sumhead{text-align:center;padding:10px 0 18px}
.sumhead .big{font-family:var(--display);font-weight:600;font-size:54px;line-height:1;color:var(--ink)}
.sumhead .big small{font-size:24px;color:var(--ink-3)}
.sumhead p{color:var(--ink-2);margin-top:6px}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(110px,1.3fr) 2fr auto;align-items:center;gap:12px;font-size:14px}
@media (max-width:560px){.row{grid-template-columns:1fr auto;gap:6px 10px}.row .lbl{grid-row:1}.row .cnt{grid-row:1;grid-column:2}.row .trk{grid-column:1/-1;grid-row:2}}
.row .lbl{font-weight:700;color:var(--ink-2);min-width:0}
.row .lbl b{font-family:var(--display);font-weight:600;color:var(--ink);margin-right:6px}
.row .trk{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.row .trk > span{display:block;height:100%;border-radius:999px;background:var(--green)}
.row .trk > span.mid{background:var(--sun)}
.row .trk > span.low{background:var(--red)}
.row .cnt{font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- exam (calm) ---------- */
.exam main{max-width:1200px}
.xtop{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.xtop-in{max-width:1200px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;min-height:58px}
@media (max-width:640px){.xtop-in{padding:6px 10px;gap:8px}}
.xtop .who{font-weight:700;color:var(--ink-2);font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.xtop .qpos{font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink);white-space:nowrap}
.short{display:none}
@media (max-width:640px){.xtop .who .ellip,.xtop .upill{display:none}.xtop .long{display:none}.xtop .short{display:inline}.xtop .qpos{font-size:17px}.xtop .act.sm{padding:8px 11px}.xtop .timer{padding:0 10px;font-size:16px}.xtop .timer svg{display:none}}
@media (max-width:360px){.xtop .who{display:none}}
.timer{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--paper-2);color:var(--ink);font:700 18px/1 var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums;border:1.5px solid transparent}
.timer svg{width:16px;height:16px}
.timer.warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.timer.crit{background:var(--red-soft);color:var(--red-deep);border-color:#F3A7A7;animation:tick 1s steps(2) infinite}
html.dm .timer.crit{border-color:#7A2929}
@keyframes tick{50%{border-color:var(--red)}}
.xintro{max-width:720px;margin:0 auto;display:grid;gap:18px}
.xintro h2{font-size:30px}
.xintro .facts{display:flex;flex-wrap:wrap;gap:8px}
.xintro .facts span{padding:7px 12px;border-radius:999px;background:var(--paper-2);font-weight:700;font-size:13.5px;color:var(--ink-2)}
.xintro .dir{font-size:16px;line-height:1.6;color:var(--ink);padding:18px 20px;border-left:4px solid var(--ink);background:var(--card);border-radius:0 14px 14px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.xintro ul{margin:0;padding-left:20px;color:var(--ink-2);font-size:15px;display:grid;gap:6px}
.xwrap{display:grid;gap:22px;align-items:start}
.xwrap.has-stim{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.xwrap.has-stim{grid-template-columns:minmax(0,11fr) minmax(0,10fr)}}
.xq{max-width:760px;margin:0 auto;width:100%}
.xwrap.has-stim .xq{margin:0}
.scol{min-width:0}
@media (min-width:900px){.scol .sticky{position:sticky;top:72px;max-height:calc(100vh - 84px);overflow:auto;padding-right:2px}}
.setlabel{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-2);margin-bottom:10px}
.stoggle{display:none}
@media (max-width:899px){.stoggle{display:inline-flex;margin-bottom:10px}.scol.off .stimwrap{display:none}}
.xq .qn{margin-bottom:4px}
.xq .stem{font-size:17.5px;margin:10px 0 18px}
.xopts{display:grid;gap:10px}
.xopt{display:grid;grid-template-columns:36px 1fr;align-items:center;gap:14px;width:100%;min-height:52px;padding:12px 14px;text-align:left;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);font-size:16px;line-height:1.45;transition:border-color .15s,background .15s,box-shadow .15s}
.xopt .ltr{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:15.5px;background:var(--card);transition:.15s}
.xopt:hover{border-color:var(--ink-3)}
.xopt[aria-checked="true"]{border-color:var(--ink);background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--ink)}
.xopt[aria-checked="true"] .ltr{background:var(--ink);border-color:var(--ink);color:var(--card)}
html.dm .xopt[aria-checked="true"]{background:rgba(255,255,255,.06)}
.xnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.xnav .mid{display:flex;gap:8px;flex-wrap:wrap}
.flagged-note{font-size:13px;color:var(--amber);font-weight:800}
/* navigator drawer + modal */
.veil{position:fixed;inset:0;background:rgba(31,27,58,.42);z-index:40;display:flex;justify-content:flex-end;animation:fade .15s ease}
.veil.center{justify-content:center;align-items:center;padding:16px}
@keyframes fade{from{opacity:0}}
.drawer{width:min(380px,92vw);height:100%;background:var(--card);box-shadow:var(--sh-lg);padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.drawer h3{font-size:20px;display:flex;justify-content:space-between;align-items:center}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.navq{position:relative;display:grid;place-items:center;min-height:46px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink-2);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.navq.ans{background:var(--ink);border-color:var(--ink);color:var(--card)}
.navq.cur{box-shadow:0 0 0 3px var(--l1-soft),0 0 0 5px var(--l1)}
.navq.flag::after{content:"⚑";position:absolute;top:-7px;right:-5px;font-size:13px;line-height:1;color:var(--amber);background:var(--card);border-radius:50%;padding:1px 2px}
.navq.flag{border-color:var(--amber-line)}
.navkey{display:grid;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.navkey span{display:flex;align-items:center;gap:8px}
.navkey i{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--card);display:inline-block}
.navkey i.ans{background:var(--ink);border-color:var(--ink)}
.navkey i.flag{border-color:var(--amber);background:var(--amber-soft)}
.sheet{width:min(520px,100%);background:var(--card);border-radius:var(--r);box-shadow:var(--sh-lg);padding:22px;display:grid;gap:14px;animation:rise .18s ease}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.sheet h3{font-size:22px}
.sheet .list{display:grid;gap:8px;font-size:15px;color:var(--ink-2)}
.sheet .list b{color:var(--ink)}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums span{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:9px;background:var(--paper-2);font-weight:800;font-size:13.5px;color:var(--ink-2)}
.nums span.f{background:var(--amber-soft);color:var(--amber)}
/* score report */
.score{max-width:900px;margin:0 auto;display:grid;gap:18px}
.score-hero{text-align:center;padding:26px 20px 22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);position:relative;overflow:hidden}
.score-hero .big{font-family:var(--display);font-weight:600;font-size:72px;line-height:1;color:var(--ink);letter-spacing:-.02em}
.score-hero .big small{font-size:28px;color:var(--ink-3);font-weight:600}
.score-hero .pct{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink-2);margin-top:4px}
.score-hero .sub{margin-top:8px;color:var(--ink-3);font-size:14px;font-weight:600}
.apbadge{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:16px auto 0;padding:12px 22px;border-radius:16px;background:var(--sun-soft);border:1px solid var(--amber-line)}
.apbadge .n{font-family:var(--display);font-weight:600;font-size:36px;line-height:1;color:var(--ink)}
.apbadge .l{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.apbadge .d{font-size:12px;color:var(--ink-3);font-weight:600;max-width:320px;line-height:1.4;margin-top:4px}
.score .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.score .two{grid-template-columns:1fr}}
.score h3{font-size:19px;margin-bottom:12px}
.copybox{display:grid;gap:8px}
.copybox textarea{width:100%;min-height:160px;font:13px/1.45 var(--mono);padding:12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--paper-2);color:var(--ink);resize:vertical}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
/* review */
.review{max-width:900px;margin:0 auto;display:grid;gap:16px}
.rvhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rvhead h2{font-size:26px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line)}
.seg button{min-height:38px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.rv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;border-left-width:5px}
.rv.ok{border-left-color:var(--green)}
.rv.bad{border-left-color:var(--red)}
.rv.skip{border-left-color:var(--line-2)}
@media (max-width:640px){.rv{padding:16px}}
.rv header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rv .rn{font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink)}
.rvb{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-weight:800;font-size:12.5px}
.rvb.ok{background:var(--green-soft);color:var(--green-deep)}
.rvb.bad{background:var(--red-soft);color:var(--red-deep)}
.rvb.skip{background:var(--paper-2);color:var(--ink-3)}
.rv .stem{font-size:16.5px;margin:10px 0 12px}
.rvopts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rvopts li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;font-size:15px;line-height:1.45;color:var(--ink-2);border:1px solid transparent}
.rvopts li .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.rvopts li .mk{display:block;font-size:12.5px;font-weight:800;margin-top:2px}
.rvopts li.is-correct{background:var(--green-soft);border-color:#9ED9B3;color:var(--ink)}
.rvopts li.is-correct .ltr{background:var(--green);color:#fff}
.rvopts li.is-correct .mk{color:var(--green-deep)}
.rvopts li.is-pick{background:var(--red-soft);border-color:#F3A7A7;color:var(--ink)}
.rvopts li.is-pick .ltr{background:var(--red);color:#fff}
.rvopts li.is-pick .mk{color:var(--red-deep)}
html.dm .rvopts li.is-correct{border-color:#297A41}html.dm .rvopts li.is-pick{border-color:#7A2929}
.rv .fbk{margin-top:14px}
.rat{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.rat .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.rat.correct .ltr{background:var(--green);color:#fff}
.rv details.more summary{font-size:14px}
.empty{text-align:center;padding:30px;color:var(--ink-3);font-weight:600}

/* ---------- stimulus ---------- */
.stim{margin:0 0 6px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;display:grid;gap:12px;min-width:0}
.stim>*{min-width:0;max-width:100%}
.exam .stim{border-color:var(--line);box-shadow:none}
.practice .stim{background:var(--paper-2);border-color:transparent}
html.dm .practice .stim{background:rgba(255,255,255,.04)}
.stim-title{font-family:var(--body);text-transform:uppercase;font-weight:800;letter-spacing:.06em;font-size:12.5px;color:var(--ink);line-height:1.45}
.stim-source{font-size:12px;color:var(--ink-3);font-style:italic}
.stim-text,.stim-note,.stim-desc{font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.stim-note{padding:10px 12px;border-radius:10px;background:var(--paper);border:1px dashed var(--line-2)}
html.dm .stim-note{background:rgba(255,255,255,.04)}
.stim.unavail{align-items:center;justify-items:center;text-align:center;padding:22px;border-style:dashed;color:var(--ink-3);font-weight:700}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.stab{border-collapse:collapse;width:100%;min-width:320px;font-size:14px;line-height:1.4}
.stab th,.stab td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.stab thead th{font-weight:800;color:var(--ink);background:var(--paper-2);border-bottom:2px solid var(--line-2);font-size:13px}
.stab tbody th{font-weight:700;color:var(--ink)}
.stab tbody tr:nth-child(even) td,.stab tbody tr:nth-child(even) th{background:var(--paper)}
html.dm .stab tbody tr:nth-child(even) td,html.dm .stab tbody tr:nth-child(even) th{background:rgba(255,255,255,.03)}
.stab td,.stab th{color:var(--ink-2)}
.stab tbody th{color:var(--ink)}
.dresults .stim-title{font-size:13.5px}
/* chart */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2);font-weight:600;align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:7px}
.legend .sw{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.08)}
.legend .sw.s0{background:var(--bar-1)}
.legend .sw.s1{background:var(--bar-2);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)}
.legend svg{width:22px;height:16px;display:block;flex:none}
.chart{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scrollhint{font-size:12px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin:-6px 0 -4px}
.scrollhint::before{content:"↔";font-size:14px}
.chart svg{display:block;width:100%;min-width:460px;height:auto;font-family:var(--body)}
.chart .grid{stroke:var(--chart-grid);stroke-width:1}
.chart .axis{stroke:var(--ink-3);stroke-width:1.2}
.chart .tick,.chart .cat{fill:var(--ink-2);font-size:13px;font-weight:600}
.chart .ylab{fill:var(--ink-3);font-size:12.5px;font-weight:700}
.chart .val{fill:var(--ink);font-size:12.5px;font-weight:800}
.chart .bar.s0{fill:var(--bar-1)}
.chart .bar.s1{fill:var(--bar-2)}
.chart .bar{stroke:none}
/* district maps */
.dplans{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.dplan{margin:0;display:grid;gap:6px;justify-items:center;flex:0 1 250px;max-width:100%}
.dplan svg{width:100%;height:auto;display:block}
.dplan figcaption{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink)}
.dmap .pc{stroke:var(--card);stroke-width:1.5}
.dmap .pc.blue{fill:var(--pc-blue)}
.dmap .pc.orange{fill:var(--pc-orange)}
.dmap .pval{fill:var(--ink);font-size:15px;font-weight:800;font-family:var(--body)}
.dmap .dline{stroke:var(--ink);stroke-width:4;stroke-linecap:square;fill:none}
.legend .sw.pblue{background:var(--pc-blue)}
.legend .sw.porange{background:var(--pc-orange)}
.legend .sw.dline{height:0;border:0;border-top:4px solid var(--ink);border-radius:0;width:18px}
/* schematic maps */
.smap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.smap svg{display:block;width:100%;min-width:560px;height:auto;font-family:var(--body);border-radius:12px;border:1px solid var(--line)}
.smap .water{fill:var(--stim-water)}
.smap .land{fill:var(--stim-land);stroke:var(--stim-land-stroke);stroke-width:1.5}
.smap .land.power{fill:var(--stim-power);stroke:#8E85B0}
.smap .land.small{fill:var(--stim-small);stroke:#9A917A}
html.dm .smap .land.small{stroke:#6B668A}
.smap .island{fill:var(--stim-land);stroke:var(--stim-land-stroke);stroke-width:1.5}
.smap .lbl{fill:var(--ink);font-weight:700;font-size:15px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;font-family:var(--display)}
html.dm .smap .lbl{stroke:#100D24}
.smap .lbl.big{font-size:19px}
.smap .lbl.sm{font-size:12.5px;font-family:var(--body);font-weight:700}
.smap .sub{fill:var(--ink-2);font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round;text-anchor:middle}
html.dm .smap .sub{stroke:#100D24}
.smap .zone{stroke:var(--ink-3);stroke-width:1}
.smap .zone.z0{fill:var(--zone-0)}.smap .zone.z1{fill:var(--zone-1)}.smap .zone.z2{fill:var(--zone-2)}.smap .zone.z3{fill:var(--zone-3)}
.smap .hatchline{stroke:var(--ink-2);stroke-width:1.6}
.smap .bracket{stroke:var(--ink);stroke-width:2;fill:none}
.smap .claim.a{fill:var(--claim-a)}
.smap .claim.b{fill:var(--claim-b)}
.smap .claim-hatch{stroke:var(--claim-b);stroke-width:3}
.smap .line{stroke:var(--ink);stroke-width:2;fill:none}
.smap .lane{stroke:var(--lane);stroke-width:3;fill:none}
.smap .conflict{fill:var(--conflict);stroke:#fff;stroke-width:1}
.smap .baseN{fill:var(--base-n);stroke:#fff;stroke-width:1.2}
.smap .baseS{fill:var(--base-s);stroke:#fff;stroke-width:1.2}
.smap .arrow{stroke:var(--ink);stroke-width:3;fill:none}
.smap .arrowhead{fill:var(--ink)}
.smap .scale{stroke:var(--ink);stroke-width:2}
.smap .scalelbl{fill:var(--ink);font-size:12px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:3px}
html.dm .smap .scalelbl{stroke:#100D24}
.legend .sw.power{background:var(--stim-power)}
.legend .sw.small{background:var(--stim-small);border-color:#9A917A}
.legend .sw.land{background:var(--stim-land)}
.legend .sw.generic{background:var(--line-2)}

/* ---------- misc ---------- */
.toastmsg{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--sh-lg);z-index:70;animation:fade .2s}
html.dm .toastmsg{background:#F2EFFF;color:#100D24}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .burst{display:none}
}
@media print{.bar,.xtop,.act,.dm-tg{display:none!important}}

/* ---------- Unit 5: ring diagram + house/road symbols ---------- */
.smap .house{fill:var(--ink);stroke:var(--card);stroke-width:1.2}
.legend svg .house{fill:var(--ink)}
.smap.rings svg{min-width:0;max-width:560px;margin:0 auto}
.smap.rings .rbg{fill:var(--paper)}
.smap.rings .ring{stroke:#8E85B0;stroke-width:1.6}
.smap.rings .ring.r0{fill:#DDF2E3}.smap.rings .ring.r1{fill:#E3EEDB}.smap.rings .ring.r2{fill:#F6EDCC}.smap.rings .ring.r3{fill:#F3E3D3}
.smap.rings .rline{fill:none;stroke:#8E85B0;stroke-width:1.6;stroke-dasharray:6 5}
.smap.rings .rcity{fill:var(--ink);stroke:var(--card);stroke-width:2}
.smap.rings .rcl{fill:var(--card);font-family:var(--display);font-weight:600;font-size:13px;text-anchor:middle}
.smap.rings .rlbl{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:19px;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.smap.rings .rout{fill:var(--ink-3);font-weight:700;font-size:13px;font-style:italic}
html.dm .smap.rings .ring.r0{fill:#1F3A33}html.dm .smap.rings .ring.r1{fill:#26392B}html.dm .smap.rings .ring.r2{fill:#3A3524}html.dm .smap.rings .ring.r3{fill:#3B2C27}
html.dm .smap.rings .rcity{fill:#E9E5FF;stroke:#100D24}html.dm .smap.rings .rcl{fill:#100D24}
html.dm .smap.rings .rlbl{stroke:#100D24}
</style>
</head>

<script>window.PE_DATA={"units":{"4":{"unit":4,"title":"Political Patterns and Processes","examWeighting":"12–17% of the AP Exam multiple-choice section","version":"2026-11-05f","calibration":"Modeled on the format of the College Board 2020 AP Human Geography Practice Exam and the Course and Exam Description (5 answer choices, set-based stimulus questions, skills 1–5). All questions, stimuli, and data are original or compiled from public facts; no College Board items are reproduced.","checked":"Reviews applied Nov 5, 2026: Claude checker agent (arithmetic/geometry verified by script), ChatGPT Extra High, ChatGPT Pro full pass (19 min), ChatGPT Pro pass on the six stimulus practice items (16 min). P13 tagged 4.5/IMP-4.B.1 per the CED; E15 kept at skill 1.D (no stimulus).","schemaNotes":{"stimulus.type":"table | bar | districtMap | schematicMap (see renderNotes inside each stimulus)","practice[].explanation":"6th-grade-level reason the answer is right (show this first)","practice[].whyNot":"one line per wrong option","exam.questions[].rationales":"College Board-style note on every option A–E","exam.questions[].explanation":"6th-grade-level version for the review screen","set":"questions sharing a stimulus carry the same set id; the stimulus object lives on the first question of the set"},"topics":[{"id":"4.1","name":"Introduction to Political Geography","lo":"PSO-4.A"},{"id":"4.2","name":"Political Processes","lo":"PSO-4.B"},{"id":"4.3","name":"Political Power and Territoriality","lo":"PSO-4.C"},{"id":"4.4","name":"Defining Political Boundaries","lo":"IMP-4.A"},{"id":"4.5","name":"The Function of Political Boundaries","lo":"IMP-4.B"},{"id":"4.6","name":"Internal Boundaries","lo":"IMP-4.B"},{"id":"4.7","name":"Forms of Governance","lo":"IMP-4.C, IMP-4.D"},{"id":"4.8","name":"Defining Devolutionary Factors","lo":"SPS-4.A"},{"id":"4.9","name":"Challenges to Sovereignty","lo":"SPS-4.B"},{"id":"4.10","name":"Consequences of Centrifugal and Centripetal Forces","lo":"SPS-4.C"}],"practice":[{"id":"U4-P01","topic":"4.1","lo":"PSO-4.A","skill":"1.A","difficulty":"easy","stem":"Which of the following best describes a stateless nation?","options":{"A":"A country whose central government has collapsed and can no longer control its territory","B":"A group of people with a shared culture and identity who do not have a sovereign state of their own","C":"A sovereign state that contains two or more large cultural groups","D":"A territory that is governed by another country and lacks full independence","E":"A region that has been given limited self-government by the state it belongs to"},"answer":"B","explanation":"A nation is a group of people who share a culture, language, or history and feel like one people. A stateless nation is a nation with no country of its own. The Kurds are the classic example: 30 to 40 million people spread across Turkey, Iraq, Iran, and Syria with no Kurdish state.","whyNot":{"A":"That describes a failed state (Topic 4.10), not a stateless nation.","C":"That is a multinational state, such as Russia or Nigeria.","D":"That is a dependent territory, such as Puerto Rico or Greenland.","E":"That is an autonomous or semiautonomous region."},"vocab":["stateless nation","nation","state"]},{"id":"U4-P02","topic":"4.1","lo":"PSO-4.A","skill":"1.D","difficulty":"easy","stem":"Japan has a sovereign government, clearly defined borders, and a population that overwhelmingly shares one language and ethnic identity. Japan is best classified as which type of political entity?","options":{"A":"Multinational state","B":"Stateless nation","C":"Multistate nation","D":"Autonomous region","E":"Nation-state"},"answer":"E","explanation":"A nation-state is a state (a country with its own government and borders) whose people are mostly one nation (one shared culture). Japan fits because almost everyone living there shares Japanese language and culture, and Japan governs itself. Iceland is another common example.","whyNot":{"A":"A multinational state has several large nations inside it, like Canada (English and French speakers plus Indigenous nations).","B":"A stateless nation lacks a sovereign state of its own; Japan has a sovereign state that largely matches the Japanese nation.","D":"An autonomous region is part of a bigger state, like Greenland within Denmark.","C":"A multistate nation is one people split across several countries, like Koreans in North and South Korea."},"vocab":["nation-state","sovereignty"]},{"id":"U4-P03","topic":"4.1","lo":"PSO-4.A","skill":"1.D","difficulty":"medium","stimulus":{"type":"table","title":"SELECTED POLITICAL ENTITIES","columns":["Entity","Description"],"rows":[["European Union","An organization of 27 independent states that cooperate on economic and political matters"],["Russia","A sovereign state with more than 100 ethnic groups and over 20 ethnic republics"],["Korean people","One people sharing a language, history, and culture, divided into two separate states (North Korea and South Korea) since 1948"],["Greenland","A self-governing territory within the Kingdom of Denmark"],["Iceland","A sovereign island state with a predominantly Icelandic-speaking population and a growing immigrant minority"]],"source":"Compiled from publicly available country data"},"stem":"Based on the table, which entity is best classified as a multistate nation?","options":{"A":"European Union","B":"Russia","C":"Greenland","D":"Korean people","E":"Iceland"},"answer":"D","explanation":"A multistate nation is ONE nation (one people) that is spread across MORE THAN ONE state (country). The Korean people are one nation, but they live in two separate countries: North Korea and South Korea. Before 1990, Germans in East and West Germany were another example.","whyNot":{"A":"The European Union is an organization of states, not one nation divided between states.","B":"Russia is one state with many nations inside it: a multinational state.","E":"Iceland is a nation-state: one nation, one state.","C":"Greenland is an autonomous region inside Denmark."},"vocab":["multistate nation","multinational state","autonomous region","supranational organization"]},{"id":"U4-P04","topic":"4.2","lo":"PSO-4.B","skill":"1.A","difficulty":"easy","stem":"The concept of self-determination is best defined as","options":{"A":"the ability of a state to defend its borders without outside help","B":"the process by which a colony is administered by a distant imperial power","C":"the transfer of power from a central government to regional governments","D":"the legal right of a state to claim the resources in its territorial waters","E":"the right of a people who share a national identity to govern themselves and choose their own political status"},"answer":"E","explanation":"Self-determination means a people get to decide their own political future. They might form their own country or choose how they are governed. After the two World Wars, this idea drove independence movements. Those movements broke up the European colonial empires.","whyNot":{"A":"That is closer to the idea of sovereignty and national defense, not self-determination.","C":"That is devolution (Topic 4.8).","D":"That is part of the United Nations Convention on the Law of the Sea (Topic 4.5).","B":"That describes colonialism, which self-determination movements fought against."},"vocab":["self-determination","sovereignty","nation-state"]},{"id":"U4-P05","topic":"4.2","lo":"PSO-4.B","skill":"2.C","difficulty":"medium","stem":"At the Berlin Conference of 1884–1885, European powers set the rules by which they divided Africa among themselves, with no African representatives present. Which of the following is the most significant long-term political effect of these decisions on Africa today?","options":{"A":"Most African states became nation-states with a single dominant culture.","B":"African boundaries were redrawn after independence so that each state matched a single ethnic homeland.","C":"Colonial-era boundaries were largely abandoned when African colonies gained independence.","D":"African states adopted federal systems that eliminated ethnic conflict.","E":"Many African states are multinational states whose boundaries split some ethnic groups and combine rival ones."},"answer":"E","explanation":"The Berlin Conference of 1884–1885 set the rules for European colonial expansion in Africa. Over the next decades, European powers drew colonial boundaries with little regard for where African ethnic groups actually lived. When African colonies became independent in the 1950s–1970s, they mostly kept these superimposed boundaries. The result is many countries that contain groups who did not choose to live together, and groups that were split between countries, which pulls those states apart (centrifugal forces).","whyNot":{"A":"Most African states contain many nations, not one.","B":"Most new African states kept the colonial boundaries rather than redrawing them.","D":"Some African states are federal (Nigeria, Ethiopia), but federalism has not eliminated ethnic conflict.","C":"The colonial boundaries were largely kept at independence, which is why the problem continues."},"vocab":["Berlin Conference","superimposed boundary","multinational state","centrifugal force"]},{"id":"U4-P06","topic":"4.2","lo":"PSO-4.B","skill":"3.E","difficulty":"easy","stimulus":{"type":"table","title":"YEAR OF INDEPENDENCE FOR SELECTED AFRICAN STATES","columns":["State","Year of independence","Became independent from"],"rows":[["Ghana","1957","United Kingdom"],["Algeria","1962","France"],["Angola","1975","Portugal"],["Eritrea","1993","Ethiopia"],["South Sudan","2011","Sudan"]],"source":"Compiled from publicly available country data"},"stem":"Which TWO states in the table gained independence through secession from another African state rather than through decolonization from a European power?","options":{"A":"Ghana and Algeria","B":"Algeria and Angola","C":"Angola and Eritrea","D":"Eritrea and South Sudan","E":"Ghana and South Sudan"},"answer":"D","explanation":"Look at the third column. Ghana, Algeria, and Angola broke away from European empires. That is decolonization. Eritrea broke away from Ethiopia, and South Sudan broke away from Sudan. Those two are cases of secession: a region of an existing African country became its own country after years of conflict.","whyNot":{"A":"Both became independent from European colonial powers.","B":"Both became independent from European colonial powers.","C":"Angola became independent from Portugal, a European power.","E":"Ghana became independent from the United Kingdom, a European power."},"vocab":["decolonization","independence movement","devolution","secession"]},{"id":"U4-P07","topic":"4.3","lo":"PSO-4.C","skill":"1.A","difficulty":"easy","stem":"Which of the following best describes a choke point?","options":{"A":"A region of small, unstable states caught between competing larger powers","B":"A boundary that has stopped functioning but is still visible on the landscape","C":"A narrow passage such as a strait or canal that controls the movement of ships, giving whoever controls it great strategic power","D":"A maritime zone where a state has special resource rights extending up to 200 nautical miles from its coastal baseline","E":"The point where the borders of three states meet"},"answer":"C","explanation":"A choke point is a narrow place that lots of traffic must squeeze through. Think of the Strait of Hormuz, the Suez Canal, or the Strait of Malacca. A big share of the world's oil ships pass through Hormuz. Whoever controls or threatens a choke point has power far beyond their size. That is why these places are watched so closely.","whyNot":{"A":"That is a shatterbelt.","B":"That is a relict boundary (Topic 4.4).","D":"That is an exclusive economic zone (Topic 4.5).","E":"That is a tripoint, not a narrow passage that traffic must squeeze through."},"vocab":["choke point","political power","territoriality"]},{"id":"U4-P08","topic":"4.3","lo":"PSO-4.C","skill":"1.D","difficulty":"medium","stem":"A former colonial power continues to dominate the economy of a now-independent country through loans with strict conditions, control of the country's main export industry by its corporations, and trade agreements that favor the former colonizer. This situation is best described as","options":{"A":"neocolonialism","B":"irredentism","C":"devolution","D":"supranationalism","E":"self-determination"},"answer":"A","explanation":"Neocolonialism means a powerful country controls a weaker country without officially ruling it. Instead of soldiers and governors, it uses money: debt, control of key industries, and one-sided trade deals. The weaker country is independent on paper, but it is not fully free to make its own economic choices.","whyNot":{"C":"Devolution is a central government giving power to regions inside the same country.","D":"Supranationalism is countries joining together in organizations like the EU.","E":"Self-determination is a people choosing their own political future; this scenario limits that.","B":"Irredentism is claiming territory in another country because your people live there."},"vocab":["neocolonialism","political power"]},{"id":"U4-P09","topic":"4.3","lo":"PSO-4.C","skill":"4.E","difficulty":"medium","stem":"Which geographic concept best describes the regional pattern shown on the map?","options":{"A":"Nation-state","B":"Shatterbelt","C":"Exclusive economic zone","D":"Buffer state","E":"Supranational organization"},"answer":"B","explanation":"A shatterbelt is a region with serious internal divisions and conflict where rival outside powers compete for influence. The map shows armed conflict in several of the small states and military bases belonging to both great powers. Put together, those features make shatterbelt the best answer. Eastern Europe during the Cold War and Southeast Asia in the 1960s–1970s are the classic real-world examples.","whyNot":{"C":"An exclusive economic zone is a maritime zone, not a political region on land.","D":"A buffer state is a single country sitting between rivals (like Mongolia between Russia and China); a shatterbelt is a whole fractured region.","E":"A supranational organization is a voluntary group of states, like the EU.","A":"A nation-state is a country whose borders mostly match the homeland of one nation, a people with a shared national identity. The map shows a region of several countries."},"vocab":["shatterbelt","buffer state","political power"],"stimulus":{"type":"schematicMap","title":"REGION OF SEVEN STATES BETWEEN TWO RIVAL GREAT POWERS (HYPOTHETICAL)","canvas":{"width":800,"height":420},"features":[{"kind":"land","name":"Great Power North","polygon":[[0,0],[800,0],[800,110],[0,110]],"labelAt":[400,55],"style":"power"},{"kind":"land","name":"Great Power South","polygon":[[0,310],[800,310],[800,420],[0,420]],"labelAt":[400,365],"style":"power"},{"kind":"land","name":"State 1","polygon":[[0,110],[160,110],[160,210],[0,210]],"labelAt":[80,160],"style":"small"},{"kind":"land","name":"State 2","polygon":[[160,110],[330,110],[330,210],[160,210]],"labelAt":[245,160],"style":"small"},{"kind":"land","name":"State 3","polygon":[[330,110],[560,110],[560,210],[330,210]],"labelAt":[445,160],"style":"small"},{"kind":"land","name":"State 4","polygon":[[560,110],[800,110],[800,210],[560,210]],"labelAt":[680,160],"style":"small"},{"kind":"land","name":"State 5","polygon":[[0,210],[260,210],[260,310],[0,310]],"labelAt":[130,260],"style":"small"},{"kind":"land","name":"State 6","polygon":[[260,210],[520,210],[520,310],[260,310]],"labelAt":[390,260],"style":"small"},{"kind":"land","name":"State 7","polygon":[[520,210],[800,210],[800,310],[520,310]],"labelAt":[660,260],"style":"small"},{"kind":"marker","name":"Armed conflict since 2000","points":[[245,185],[445,185],[130,285],[660,285]],"symbol":"conflict"},{"kind":"marker","name":"Military base of Great Power North","points":[[80,135],[680,135]],"symbol":"baseN"},{"kind":"marker","name":"Military base of Great Power South","points":[[390,290],[520,290]],"symbol":"baseS"},{"kind":"arrow","name":"Great Power North influence","from":[300,100],"to":[300,140]},{"kind":"arrow","name":"Great Power South influence","from":[600,320],"to":[600,280]}],"legend":[{"swatch":"power","label":"Rival great powers"},{"swatch":"small","label":"Small states"},{"swatch":"conflict","label":"Armed conflict since 2000"},{"swatch":"baseN","label":"Military base of Great Power North"},{"swatch":"baseS","label":"Military base of Great Power South"}],"renderNotes":"Two large bands (north and south) in muted colors, seven small states in a lighter fill with thin borders, conflict symbols (small starbursts) and base symbols (small squares in each power's color) at the given points, two short arrows pointing from each power into the small states. Legend under the map; stack on phones.","source":"Hypothetical map"}},{"id":"U4-P10","topic":"4.4","lo":"IMP-4.A","skill":"1.D","difficulty":"easy","stem":"Much of the boundary between the United States and Canada follows the 49th parallel of latitude in a straight line across the Great Plains and Rocky Mountains. Because this section follows a line of latitude rather than a physical or cultural feature, it is best classified as a","options":{"A":"relict boundary","B":"geometric boundary","C":"superimposed boundary","D":"consequent boundary","E":"subsequent boundary"},"answer":"B","explanation":"A geometric boundary is a straight line drawn using latitude, longitude, or other measurements instead of following rivers, mountains, or where cultural groups live. The 49th parallel is a line of latitude, so this is geometric. Many boundaries in the Sahara (like Egypt–Libya) are geometric too.","whyNot":{"A":"A relict boundary no longer functions but is still visible, like the old East–West Germany line.","C":"A superimposed boundary is forced on an area by outsiders without regard to existing cultures.","E":"A subsequent boundary is drawn after people settled, to fit the cultural landscape that developed.","D":"A consequent boundary is drawn to separate cultural groups."},"vocab":["geometric boundary"]},{"id":"U4-P11","topic":"4.4","lo":"IMP-4.A","skill":"1.D","difficulty":"medium","stem":"Which type of boundary is created when an outside power draws a line across an area without regard to the cultural groups already living there, as European powers did across Africa in the late 1800s?","options":{"A":"Superimposed","B":"Antecedent","C":"Relict","D":"Consequent","E":"Geometric"},"answer":"A","explanation":"Superimposed means 'placed on top.' A superimposed boundary is forced onto a place by outsiders, ignoring the people already there. Many boundaries imposed by European powers during the partition of Africa (most of them drawn in the decades after the Berlin Conference) are the textbook examples. Many of these lines split one ethnic group between two countries or threw rival groups into the same country.","whyNot":{"C":"A relict boundary has stopped working but is still visible.","D":"A consequent boundary is deliberately drawn to match cultural differences; superimposed boundaries ignore them.","E":"Some superimposed lines are also geometric (straight), but the key idea in this question is that outsiders ignored existing cultures.","B":"An antecedent boundary is drawn BEFORE an area is heavily settled, like parts of the Malaysia–Indonesia border on Borneo."},"vocab":["superimposed boundary","antecedent boundary","Berlin Conference"]},{"id":"U4-P12","topic":"4.4","lo":"IMP-4.A","skill":"1.D","difficulty":"hard","stem":"Which of the following correctly pairs a type of boundary with an example?","options":{"A":"Superimposed boundary — a border negotiated by neighboring communities to follow their existing cultural divide","B":"Antecedent boundary — borders imposed during the late-nineteenth-century European partition of Africa","C":"Consequent boundary — the 49th parallel between the United States and Canada","D":"Geometric boundary — the Pyrenees Mountains between France and Spain","E":"Relict boundary — the former border between East Germany and West Germany"},"answer":"E","explanation":"A relict boundary is a 'leftover' boundary. It no longer separates two states, but you can still see it on the landscape. Germany reunited in 1990, so the East–West line is gone politically, yet differences in buildings, income, and even voting patterns still mark where it ran.","whyNot":{"B":"Many colonial boundaries were imposed on already inhabited areas, making them superimposed rather than antecedent.","C":"The 49th parallel is a geometric boundary, not one drawn to separate cultural groups.","D":"The Pyrenees form a physical (natural) boundary, not a geometric straight line.","A":"That describes a consequent boundary: the line follows an existing cultural division and was negotiated by the people affected."},"vocab":["relict boundary","physical boundary","geometric boundary"]},{"id":"U4-P13","topic":"4.5","lo":"IMP-4.B","skill":"1.A","difficulty":"easy","stem":"Two states have agreed to a boundary in a treaty and drawn it on official maps. Crews are now placing fence posts and concrete markers along the line on the ground. This step in creating a boundary is called","options":{"A":"definition","B":"demarcation","C":"delimitation","D":"administration","E":"annexation"},"answer":"B","explanation":"Boundaries go through steps. First they are DEFINED in a legal document like a treaty. Then they are DELIMITED, meaning drawn on a map. Then they are DEMARCATED, meaning marked on the actual ground with fences, posts, or walls. Finally they are ADMINISTERED, meaning the state manages how people and goods cross. Fence posts on the ground = demarcation.","whyNot":{"A":"Definition is the written legal description in a treaty.","D":"Administration is managing the boundary (border crossings, customs, patrols).","E":"Annexation is one state taking over another's territory; it is not a step in boundary-making.","C":"Delimitation is drawing the boundary on a map."},"vocab":["defined boundary","delimited boundary","demarcated boundary","administered boundary"]},{"id":"U4-P14","topic":"4.5","lo":"IMP-4.B","skill":"4.A","difficulty":"medium","stem":"The diagram shows the maritime zones a coastal state may claim under the United Nations Convention on the Law of the Sea (UNCLOS). Assume the state claims the maximum zones shown and no other state's claims overlap them. Which numbered zone is specifically established to give the coastal state rights to use and manage natural resources such as fish, oil, and seabed minerals, while foreign ships keep freedom of navigation?","options":{"A":"Zone 1","B":"Zone 2","C":"Zone 3","D":"Zone 4","E":"Internal waters, landward of the baseline"},"answer":"C","explanation":"UNCLOS measures sea zones from a coastal baseline, usually the low-water line along the coast. Out to 12 nautical miles is the territorial sea. The state has sovereignty there, almost like on land, but foreign ships have a right of innocent passage. Beyond that, the exclusive economic zone (EEZ) can reach 200 nautical miles from the same baseline. In the EEZ the state has special rights to the fish, oil, and other resources, but ships from other countries keep freedom of navigation. High-seas waters lie outside every country's EEZ and other national waters; separate rules can still give a coastal state rights to seabed resources farther out.","whyNot":{"A":"Zone 1 is the territorial sea, where the state has full sovereignty and foreign ships have only a limited right of innocent passage.","B":"Zone 2 is the contiguous zone, where the state has limited enforcement powers over customs, tax, immigration, and health laws. It overlaps the EEZ, but resource rights in those waters come from the EEZ rules shown as Zone 3.","D":"Zone 4 is the high seas, which are not any coastal state's exclusive fishing zone; separate continental-shelf rules can give a state rights to seabed resources beneath them.","E":"Internal waters (bays, harbors, rivers) are fully controlled by the state, including who may enter."},"vocab":["UNCLOS","territorial sea","contiguous zone","exclusive economic zone","high seas"],"stimulus":{"type":"schematicMap","title":"MARITIME ZONES UNDER THE UN CONVENTION ON THE LAW OF THE SEA (NOT TO SCALE)","canvas":{"width":800,"height":300},"features":[{"kind":"land","name":"Coastal state (land)","polygon":[[0,0],[120,0],[120,300],[0,300]],"labelAt":[60,150]},{"kind":"zone","name":"Zone 1","polygon":[[120,0],[260,0],[260,300],[120,300]],"labelAt":[190,150],"sublabel":"baseline to 12 nautical miles"},{"kind":"zone","name":"Zone 2","polygon":[[260,0],[380,0],[380,300],[260,300]],"labelAt":[320,150],"sublabel":"12 to 24 nautical miles"},{"kind":"zone","name":"Zone 3","polygon":[[260,0],[660,0],[660,300],[260,300]],"labelAt":[520,150],"sublabel":"12 to 200 nautical miles from the baseline; overlaps Zone 2"},{"kind":"zone","name":"Zone 4","polygon":[[660,0],[800,0],[800,300],[660,300]],"labelAt":[730,150],"sublabel":"beyond 200 nautical miles"},{"kind":"line","name":"Coastal baseline","line":[[120,0],[120,300]],"dashed":true}],"legend":[],"renderNotes":"Draw Zone 3 first, from x=260 to x=660. Draw Zone 2 as transparent diagonal hatching over x=260 to x=380 so the overlap stays visible. Keep the Zone 1 and Zone 4 bands. Keep the Zone 3 label at [520,150] and add a bracket along the bottom spanning its full width from x=260 to x=660. Print all distance sublabels. Draw the dashed coastal baseline. Do not print the zones' legal names (the question asks students to identify them).","source":"Diagram based on UNCLOS zone limits"}},{"id":"U4-P15","topic":"4.5","lo":"IMP-4.B","skill":"1.D","difficulty":"medium","stem":"Two neighboring states agree on exactly where their boundary runs, but they disagree about who has the right to pump oil from a large oil field that lies beneath the boundary. This disagreement is best described as which type of boundary dispute?","options":{"A":"Definitional","B":"Locational","C":"Operational","D":"Allocational","E":"Irredentist"},"answer":"D","explanation":"An allocational dispute is about how to divide (allocate) a resource that crosses a boundary, such as oil, natural gas, water in a river, or fish. Here, both states agree on the line itself; they argue over who gets the oil under it. In July 1990, Iraq accused Kuwait of taking oil from the shared Rumaila field; the wider Iraq–Kuwait dispute also involved territorial claims.","whyNot":{"A":"A definitional dispute is about what the legal words of a treaty mean.","B":"A locational dispute is about where the line actually sits on the ground or map; here both agree on the location.","C":"An operational dispute is about how the boundary works, such as rules for migration or trade across it.","E":"Irredentism is a claim to territory where your co-nationals live, not a dispute over a shared resource."},"vocab":["allocational dispute","locational dispute","definitional dispute","operational dispute"]},{"id":"U4-P16","topic":"4.6","lo":"IMP-4.B","skill":"1.A","difficulty":"easy","stem":"Gerrymandering is best defined as","options":{"A":"requiring voters to show identification before casting a ballot","B":"redistributing seats in a legislature among states after a census","C":"transferring power from a national government to state governments","D":"dividing a country into administrative regions of equal land area","E":"redrawing electoral district boundaries to give one political party or group an unfair advantage"},"answer":"E","explanation":"Gerrymandering happens when the people drawing voting district lines shape them on purpose to help their own side win more seats. The oddly shaped districts that result are a clue. The name comes from Massachusetts Governor Elbridge Gerry, whose 1812 district looked like a salamander, so a newspaper called it a 'Gerry-mander.'","whyNot":{"B":"That is reapportionment, which happens every 10 years after the U.S. census.","C":"That is devolution.","D":"Districts are drawn by equal POPULATION, not equal land area, and this choice does not involve unfair advantage.","A":"Voter ID rules are election rules, not boundary-drawing."},"vocab":["gerrymandering","redistricting","reapportionment"]},{"id":"U4-P17","topic":"4.6","lo":"IMP-4.B","skill":"1.D","difficulty":"medium","stem":"In U.S. states with more than one seat in the House of Representatives, state legislatures or commissions redraw congressional district boundaries after each census. Which of the following best explains why this redistricting is required?","options":{"A":"Federal law requires that every district be the same size in square miles so that rural and urban areas are treated alike.","B":"The Supreme Court requires each district to be shaped as a compact square.","C":"The president appoints new representatives every 10 years.","D":"Populations shift over time, and districts within the same state must contain nearly equal numbers of people so representation stays balanced.","E":"States lose their congressional seats if they do not redraw lines."},"answer":"D","explanation":"People move. Some cities boom while other areas shrink. After each census (every 10 years), the 435 seats in the U.S. House are divided among the states by population (reapportionment). States with more than one House seat then redraw their districts so each district within that state has nearly the same number of people. If districts were not redrawn, a person in a crowded district would have less voting power than a person in a shrinking one.","whyNot":{"A":"Districts are equal in population, not land area; rural districts are often huge.","C":"Representatives are elected by voters every two years, not appointed.","E":"Seats are gained or lost through reapportionment based on population, not as a penalty.","B":"Courts have struck down some extreme shapes, but there is no square-shape requirement."},"vocab":["redistricting","reapportionment","census"]},{"id":"U4-P18","topic":"4.6","lo":"IMP-4.B","skill":"3.E","difficulty":"easy","stem":"Which gerrymandering technique is illustrated by the change from Plan 1 to Plan 2 in its effect on Orange Party voters?","options":{"A":"cracking","B":"packing","C":"reapportionment","D":"devolution","E":"annexation"},"answer":"A","explanation":"There are two main gerrymandering moves. CRACKING spreads the other side's voters across many districts so they win fewer seats than they otherwise might. PACKING crams the other side's voters into a small number of districts so they win those by a landslide but have little strength anywhere else. Plan 2 puts one Orange-majority precinct with two Blue-majority precincts in each district. Because every precinct casts the same number of votes, Blue gets about 56.7 percent and Orange about 43.3 percent in every district, so Orange wins no seats. Splitting Orange's strongest areas among districts this way is cracking. Under Plan 1, Orange wins one of three seats (33.3 percent of the seats) with about 43.3 percent of the county's votes.","whyNot":{"C":"Reapportionment is dividing seats among states after a census; it is not a gerrymandering technique.","D":"Devolution is a transfer of power to regional governments.","E":"Annexation is adding territory to a state or city.","B":"Packing concentrates opposing voters into as few districts as possible, the opposite of spreading them out."},"vocab":["cracking","packing","gerrymandering"],"stimulus":{"type":"districtMap","title":"TWO DISTRICT PLANS FOR A NINE-PRECINCT COUNTY (HYPOTHETICAL)","note":"The county has nine precincts of equal population arranged in a 3 × 3 grid; for this simplified model each precinct casts the same number of votes. Each precinct is labeled with the expected percentage of votes for the Blue Party; the rest go to the Orange Party. The county must be divided into three districts of three precincts each, and each district elects one representative.","grid":{"rows":3,"cols":3,"blueShare":[[30,70,70],[30,70,70],[30,70,70]]},"plans":[{"name":"Plan 1","districts":[[[0,0],[1,0],[2,0]],[[0,1],[1,1],[2,1]],[[0,2],[1,2],[2,2]]]},{"name":"Plan 2","districts":[[[0,0],[0,1],[0,2]],[[1,0],[1,1],[1,2]],[[2,0],[2,1],[2,2]]]}],"resultsTable":{"title":"SEATS WON UNDER EACH PLAN","columns":["Plan","Districts won by Blue","Districts won by Orange"],"rows":[["Plan 1","2","1"],["Plan 2","3","0"]]},"regionWideBlueShare":57,"renderNotes":"Two 3×3 grids side by side; precincts tinted light orange when Blue share < 50 and light blue otherwise, with the number printed; thick district outlines (Plan 1 = columns, Plan 2 = rows). Region-wide Blue share = (3×30 + 6×70)/9 ≈ 57%. Plan 1: left column 30% Blue → Orange wins; other columns 70% → Blue. Plan 2: every row = (30+70+70)/3 = 57% Blue → Blue wins all three.","source":"Hypothetical data"}},{"id":"U4-P19","topic":"4.7","lo":"IMP-4.C","skill":"1.A","difficulty":"easy","stem":"Which of the following best describes a unitary state?","options":{"A":"A state in which most political power is held by the central government, and regional governments mainly carry out its decisions","B":"A state in which power is shared between a national government and strong regional governments, each with its own constitutional powers","C":"A state made up of several independent states that have joined together for defense","D":"A state whose borders contain only one nation","E":"A state that has given full independence to its former regions"},"answer":"A","explanation":"Unitary means 'one unit.' In a unitary state the national government in the capital makes most of the decisions. Regions, provinces, or departments exist, but they mostly carry out what the center decides. France, Japan, and China are unitary states. Unitary systems exist in both small and large countries; what defines them is that the central government holds the main political authority.","whyNot":{"C":"That is a confederation or an alliance.","D":"That is a nation-state, which is about culture, not about how power is organized.","E":"That describes the breakup of a state, not a form of governance.","B":"That is a federal state, such as the United States, Canada, Germany, or Brazil."},"vocab":["unitary state","federal state"]},{"id":"U4-P20","topic":"4.7","lo":"IMP-4.D","skill":"3.E","difficulty":"medium","stem":"Which of the following statements is best supported by the table?","options":{"A":"Unitary states are always smaller in population than federal states, because small populations need less local government.","B":"Among the states listed, the large, culturally diverse states use federal systems, which give regions control over many local matters.","C":"Federal systems are required for states with more than one official language.","D":"Unitary states cannot grant any powers to regional governments, so all public services are run from the capital.","E":"France's unitary government results from having fewer ethnic groups than Nigeria."},"answer":"B","explanation":"Canada, India, and Nigeria are the three largest states listed. All three use federal systems, and their descriptions name several cultural groups. Federal systems split governing powers between national and regional governments, which lets regions handle many local needs. France and Japan are unitary states. The table shows a pattern among these examples, but it does not measure cultural diversity the same way for every country, and it does not prove that size or diversity decides a country's form of government.","whyNot":{"A":"The table gives total area, not population, so it cannot support a claim about which states have larger populations.","C":"No such requirement exists; Canada chose federalism, but bilingual states can be unitary.","D":"Unitary states can devolve powers to regions, as the United Kingdom has done.","E":"The table gives no ethnic-group count for France and does not establish what caused either country's form of government."},"vocab":["federal state","unitary state","devolution","centripetal force"],"stimulus":{"type":"table","title":"TERRITORY, CULTURAL DIVERSITY, AND FORM OF GOVERNANCE, SELECTED STATES","columns":["State","Total area (approx. km²)","Selected language and cultural characteristics","Form of governance"],"rows":[["Canada","9,985,000","English and French official languages; many Indigenous nations","Federal"],["India","3,287,000","22 scheduled languages; many religions","Federal"],["Nigeria","924,000","More than 250 ethnic groups","Federal"],["France","552,000 (metropolitan)","French is the official language; regional languages are also spoken","Unitary"],["Japan","378,000","Largely one language and ethnic identity","Unitary"]],"source":"Compiled from publicly available country data"}},{"id":"U4-P21","topic":"4.7","lo":"IMP-4.D","skill":"1.D","difficulty":"hard","stimulus":{"type":"table","title":"FORM OF GOVERNANCE, SELECTED STATES","columns":["State","Form of governance","Note"],"rows":[["France","Unitary","Regions carry out national policy"],["Germany","Federal","16 Länder (states) with constitutional powers"],["Japan","Unitary","47 prefectures administered under national law"],["Brazil","Federal","26 states plus a federal district"],["United Kingdom","Unitary","Scotland, Wales, and Northern Ireland have their own parliaments or assemblies created by acts of the UK Parliament"]],"source":"Compiled from publicly available government data"},"stem":"The United Kingdom is listed as a unitary state even though Scotland, Wales, and Northern Ireland have their own legislatures. Which concept best explains this?","options":{"A":"Devolution: the central government has transferred some powers to regional governments but keeps ultimate sovereignty and could legally take those powers back.","B":"Irredentism: the UK claims territory belonging to neighboring states.","C":"Federalism: the regions have powers guaranteed by a written constitution that the central government cannot change alone.","D":"Supranationalism: the regional parliaments were created by the European Union.","E":"Self-determination: each region has already voted to become an independent state."},"answer":"A","explanation":"Devolution is when the national government hands some of its powers down to regions. But the national government still has the final say. The UK Parliament created the Scottish Parliament and the Welsh and Northern Irish assemblies in the late 1990s. In theory, it could change or remove them by passing a law. That is different from a federal system like Germany's. There, the regions' powers are locked into the constitution.","whyNot":{"C":"In a true federal system the regions' powers are protected by the constitution; in the UK they come from ordinary acts of Parliament.","D":"The regional legislatures were created by the UK Parliament, not by the EU.","E":"Scotland voted against independence in 2014; none of the regions is an independent state.","B":"Irredentism is about claiming land in another country; it does not apply here."},"vocab":["devolution","unitary state","federal state"]},{"id":"U4-P22","topic":"4.8","lo":"SPS-4.A","skill":"1.A","difficulty":"easy","stem":"Irredentism is best defined as","options":{"A":"a region's demand for greater control over its own schools and taxes","B":"the peaceful division of a state into two new states","C":"the forced removal of an ethnic group from an area so that another group can control it","D":"the use of violence against civilians to achieve political goals","E":"a state's claim to territory in a neighboring state where its co-nationals live or that it once held"},"answer":"E","explanation":"Irredentism is when a country says, 'That land over there should be ours because our people live there' (or 'because it used to be ours'). It is a devolutionary factor because it threatens the sovereignty of the state that currently holds the land. Example: Somalia's claim in the 1970s to the Ogaden region of Ethiopia, where many ethnic Somalis live.","whyNot":{"A":"That is a demand for autonomy or devolution.","C":"That is ethnic cleansing.","D":"That is terrorism.","B":"That describes the peaceful breakup of a state, such as Czechoslovakia in 1993."},"vocab":["irredentism","devolution"]},{"id":"U4-P23","topic":"4.8","lo":"SPS-4.A","skill":"1.D","difficulty":"medium","stem":"A mountainous island province lies far from the national capital and is cut off from the mainland by a wide strait. Over time its people developed their own dialect and identity and now demand their own regional government. This case best illustrates which devolutionary factor?","options":{"A":"Ethnic cleansing by the national majority","B":"Terrorism by a separatist militia","C":"Division of groups by physical geography","D":"Irredentism by a neighboring state","E":"Supranationalism"},"answer":"C","explanation":"When mountains, water, or deserts separate part of a country from the rest, the people there can grow apart culturally and feel ignored by a far-away capital. That distance makes them more likely to push for self-rule. Islands and mountain regions are common examples, such as Sardinia and Corsica in the Mediterranean.","whyNot":{"A":"No group is being forced out of the area.","B":"No violence against civilians is described.","D":"No neighboring state is claiming the island.","E":"Supranationalism involves countries cooperating through an international organization; this scenario is about geographic separation inside one country."},"vocab":["devolution","physical geography","autonomy"]},{"id":"U4-P24","topic":"4.8","lo":"SPS-4.A","skill":"3.E","difficulty":"hard","stimulus":{"type":"table","title":"POPULATION AND ECONOMIC OUTPUT BY REGION, HYPOTHETICAL COUNTRY X","columns":["Region","Share of national population","Share of national GDP","Share of national tax revenue paid"],"rows":[["North","15%","35%","38%"],["Central (capital)","35%","35%","34%"],["South","50
