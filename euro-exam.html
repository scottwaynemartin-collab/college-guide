their confidence and their hope on it alone, acquired the intimate conviction of the necessity of settling the rules to be observed by the Powers, in their reciprocal relations, upon the sublime truths which the Holy Religion of our Saviour teaches:","They solemnly declare that the present Act has no other object than to publish, in the face of the whole world, their fixed resolution, both in the administration of their respective States and in their political relations with every other Government, to take for their sole guide the precepts of that Holy Religion, namely, the precepts of Justice, Christian Charity, and Peace …","Art. I. Conformably to the words of the Holy Scriptures, which command all men to consider each other as brethren, the three contracting Monarchs will remain united by the bonds of a true and indissoluble fraternity, and, considering each other as fellow-countrymen, they will, on all occasions and in all places, lend each other aid and assistance; and, regarding themselves towards their subjects and armies as fathers of families, they will lead them, in the same spirit of fraternity with which they are animated, to protect Religion, Peace, and Justice. …","Art. III. All the Powers who shall choose solemnly to avow the sacred principles which have dictated the present Act … will be received with equal ardor and affection into this Holy Alliance."],"attribution":"Treaty of the Holy Alliance, signed by Francis I of Austria, Frederick William III of Prussia, and Alexander I of Russia, Paris, September 1815","translation":"English text as printed in James Harvey Robinson and Charles A. Beard, Readings in Modern European History, vol. 1 (Boston, 1908); adapted","glossary":[{"t":"Trinity","d":"in Christian belief, God as Father, Son, and Holy Spirit"},{"t":"Divine Providence","d":"God's care and guidance"},{"t":"reciprocal relations","d":"dealings with one another"},{"t":"sublime","d":"noble and inspiring"},{"t":"precepts","d":"rules for behavior"},{"t":"conformably to","d":"following"},{"t":"brethren","d":"brothers"},{"t":"indissoluble fraternity","d":"brotherhood that cannot be broken"},{"t":"avow","d":"openly declare"}]},"P14":{"type":"passage","paragraphs":["In the evening I went very unwillingly to a society in Aldersgate-street,* where one was reading Luther's preface to the Epistle to the Romans. About a quarter before nine, while he was describing the change which God works in the heart through faith in Christ, I felt my heart strangely warmed. I felt I did trust in Christ, Christ alone, for salvation: and an assurance was given me, that he had taken away my sins, even mine, and saved me from the law of sin and death. …","In the evening I reached Bristol, and met Mr. Whitefield** there. I could scarce reconcile myself at first to this strange way of preaching in the fields, of which he set me an example on Sunday; having been all my life (till very lately) so tenacious of every point relating to decency and order, that I should have thought the saving of souls almost a sin, if it had not been done in a church. …","At four in the afternoon, I submitted to be more vile, and proclaimed in the highways the glad tidings of salvation, speaking from a little eminence in a ground adjoining to the city, to about three thousand people."],"attribution":"John Wesley, English priest of the Church of England, journal entries for May 24, 1738 (first paragraph), March 31, 1739 (second paragraph), and April 2, 1739 (third paragraph)","translation":"Text from The Journal of the Rev. John Wesley, vol. 1 (London: Wesleyan Conference Office, 1903); adapted","footnotes":[{"mark":"*","text":"A small religious meeting held in a house on Aldersgate Street in London."},{"mark":"**","text":"George Whitefield, a fellow English preacher and friend of Wesley's."}],"glossary":[{"t":"Luther's preface to the Epistle to the Romans","d":"Martin Luther's introduction to a book of the New Testament"},{"t":"assurance","d":"a feeling of certainty"},{"t":"scarce reconcile myself","d":"hardly accept"},{"t":"tenacious","d":"holding firmly"},{"t":"vile","d":"low; humble"},{"t":"glad tidings","d":"good news"},{"t":"eminence","d":"rise in the ground; small hill"}]},"P15":{"type":"passage","paragraphs":["Their* object should have been to reconcile to religion, not the sophists, but those whom they were leading astray. They had been seduced by being told that Christianity was the offspring of barbarism, an enemy of the arts and sciences, of reason and refinement; a religion whose only tendency was to encourage bloodshed, to enslave mankind, to diminish their happiness, and to retard the progress of the human understanding.","It was, therefore, necessary to prove that, on the contrary, the Christian religion, of all the religions that ever existed, is the most humane, the most favorable to liberty and to the arts and sciences; that the modern world is indebted to it for every improvement, from agriculture to the abstract sciences—from the hospitals for the reception of the unfortunate to the temples reared by the Michael Angelos and embellished by the Raphaels. It was necessary to prove that nothing is more divine than its morality—nothing more lovely and more sublime than its tenets, its doctrine, and its worship; that it encourages genius, corrects the taste, develops the virtuous passions, imparts energy to the ideas, presents noble images to the writer, and perfect models to the artist … In a word, it was necessary to summon all the charms of the imagination, and all the interests of the heart, to the assistance of that religion against which they had been set in array."],"attribution":"François-René de Chateaubriand, French writer, The Genius of Christianity, published in Paris in April 1802","translation":"Translated by Charles I. White (Philadelphia and Baltimore, 1856); adapted","footnotes":[{"mark":"*","text":"\"Their\" refers to earlier writers who had defended Christianity."}],"glossary":[{"t":"reconcile to","d":"bring back to"},{"t":"sophists","d":"Chateaubriand's critical label for writers he believed used misleading arguments"},{"t":"seduced","d":"tricked into going the wrong way"},{"t":"retard","d":"slow down"},{"t":"humane","d":"kind"},{"t":"temples reared by the Michael Angelos … Raphaels","d":"churches built and decorated by great artists such as Michelangelo and Raphael"},{"t":"tenets","d":"beliefs"},{"t":"set in array","d":"lined up for battle"}]},"P16":{"type":"passage","paragraphs":["I once heard an orator, in the days when we had political assemblies,* call administrative centralization \"that noble conquest of the Revolution which Europe envies us.\" I am willing to admit that centralization was a noble conquest, and that Europe envies us its possession; but I deny that it was a conquest of the Revolution. It was, on the contrary, a feature of the old regime, and, I may add, the only one which outlived the Revolution, because it was the only one that was suited to the new condition of society created by the Revolution. …","Let no one again express surprise at the wonderful ease with which centralization was re-established in France at the beginning of this century. It had been overthrown by the men of 1789; but its foundations were deep in the minds of its very destroyers, and upon these it was rebuilt anew stronger than ever. …","But when … the bewildered nation began to grope around for a master, immense facilities were offered for the restoration of absolute government; and it was easy for the genius of him who was destined both to continue and to destroy the Revolution to discover them. … Centralization was raised from its tomb and restored to its place; whence it happened that, all the checks which had formerly served to limit its power being destroyed, and not revived, there sprang out of the bosom of a nation which had just overthrown royalty a power more extensive, more detailed, more absolute than any of our monarchs had ever wielded."],"attribution":"Alexis de Tocqueville, French writer and former government minister, The Old Regime and the Revolution, 1856","translation":"Translated by John Bonner (New York: Harper, 1856); adapted","footnotes":[{"mark":"*","text":"Tocqueville published this book in 1856, during the Second Empire of Napoleon III, after Louis-Napoleon's coup of 1851."}],"glossary":[{"t":"administrative centralization","d":"a system in which officials in the capital control government in every region"},{"t":"the old regime","d":"France's government and society before 1789"},{"t":"grope around for","d":"search blindly for"},{"t":"immense facilities","d":"great opportunities"},{"t":"checks","d":"limits on power"},{"t":"wielded","d":"used; held"}]}},"practice":[{"id":"E5-P01","set":"P1","topic":"5.2","lo":"B","skill":"3.A","difficulty":"easy","stem":"Mahan's main argument in the passage is that Britain","options":{"A":"won the Seven Years' War mainly because its navy and sea trade gave it wealth and reach","B":"won the Seven Years' War mainly because its army was larger than the armies of its enemies","C":"won the Seven Years' War by building a large alliance of European powers against France","D":"lost much of its overseas trade during the Seven Years' War to stronger French fleets"},"answer":"A","explanation":"Mahan says the one real winner used the sea to grow rich in peace and ruled the sea in war. Trade paid for the war, and the navy protected the trade.","whyNot":{"B":"Mahan credits sea power, not the size of Britain's army. Britain's army was small compared with those of France and Austria.","C":"Mahan quotes a historian who says Britain won \"almost without allies.\" Its main helpers were Prussia and Hanover.","D":"Mahan says the opposite: no one could \"dispute the sea\" with Britain."},"hint":"Mahan answers the French historian with \"Yes! but …\" What does he add after \"but\"?"},{"id":"E5-P02","set":"P1","topic":"5.3","lo":"C","skill":"2.C","difficulty":"hard","stem":"Which limitation should a historian consider when using this passage as a complete explanation of Britain's victory?","options":{"A":"Mahan quotes a French historian, so his account mainly reflects how the French saw the war.","B":"Mahan wrote over a century after the war, when few written records from the 1750s and 1760s survived.","C":"Mahan's naval background may have led him to stress sea power more than other military or diplomatic factors.","D":"Mahan relies on claims made by Prussia and Hanover, which wanted credit for the victory."},"answer":"C","explanation":"Mahan's career as a naval officer may help explain why he puts sea power first. To judge why Britain won, a historian should also look at evidence about land war, money, and Britain's allies, such as Prussia.","whyNot":{"A":"Quoting Henri Martin does not make Mahan's account a French view. Mahan answers Martin with his own argument about sea power.","B":"Many records of the war survived. Historians in 1890 could use printed letters, reports, and earlier histories, and Mahan even quotes Henri Martin's history.","D":"Mahan does not rely on Prussia or Hanover. He mentions them only as Britain's helpers."},"hint":"Which choice describes something that is actually true of Mahan or of the passage, and that would also leave the explanation incomplete?"},{"id":"E5-P03","set":"P1","topic":"5.1","lo":"A","skill":"4.B","difficulty":"medium","stem":"The developments Mahan describes are best understood in the context of","options":{"A":"religious wars between Catholic and Protestant states over the faith of their subjects","B":"competition among European sea powers for colonies and trade in the Atlantic world and Asia","C":"efforts by Britain and France to end the Atlantic slave trade in the 1750s","D":"the spread of factories and steam power across Britain and western Europe"},"answer":"B","explanation":"In the 1700s Britain, France, Spain, and the Dutch Republic competed for colonies and trade. Their rivalry shaped their diplomacy and led to wars fought in Europe, North America, the Caribbean, and India.","whyNot":{"A":"Religious wars mark the 1500s and early 1600s. Mahan's war was fought over trade, colonies, and power.","C":"Britain did not end its slave trade until 1807, and France later still. In the 1750s both powers were still trading in enslaved Africans.","D":"Factories and steam power spread mostly after 1780. Mahan's war was fought from 1756 to 1763."},"hint":"Mahan mentions North America, India, Spain's empire, and bases \"scattered over the globe.\" What were the European powers competing for?"},{"id":"E5-P04","set":"P2","topic":"5.4","lo":"D","skill":"3.A","difficulty":"easy","stem":"Which of the following best describes the demands in the cahier?","options":{"A":"The Third Estate wants no tax exemptions and more say in government, under the king.","B":"The Third Estate wants the Estates-General to replace the king as the maker of France's laws.","C":"The Third Estate wants the Church's lands sold to pay off the king's debts.","D":"The Third Estate wants the nobles to keep their offices in return for paying higher taxes."},"answer":"A","explanation":"The cahier asks that no group be free from taxes, that votes be counted by head, and that offices be open to talent. It also shows loyalty to the king and the Catholic Church.","whyNot":{"B":"Article 8 asks that laws and taxes be ratified by the nation, but the cahier still praises \"a beloved monarch\" and wants \"the stability of the monarchy.\"","C":"The cahier does not mention Church lands, and Article 1 asks that Catholic worship be protected. The National Assembly, not this cahier, took over Church lands in November 1789.","D":"Article 12 asks that offices held by nobles be opened to members of the Third Estate."},"hint":"Look for what the cahier asks to change and what it wants to keep."},{"id":"E5-P05","set":"P2","topic":"5.4","lo":"D","skill":"4.B","difficulty":"medium","stem":"The demand in article 10 is best understood in the context of","options":{"A":"the king's plan to raise new taxes without calling the Estates-General","B":"a dispute over whether the Estates-General would vote by order or by head","C":"the nobles' demand that the Third Estate's number of deputies be doubled","D":"a royal order that the three estates meet in one hall and vote as one body"},"answer":"B","explanation":"If each estate voted as one body, the clergy and nobles could outvote the Third Estate two to one. Counting votes by head would give the Third Estate, with half the deputies, a real chance to win.","whyNot":{"A":"Louis XVI had already agreed to call the Estates-General. The cahiers were written for that meeting.","C":"In December 1788 Louis XVI's government, on Necker's advice, doubled the Third Estate's deputies. Doubling did not settle whether votes would be counted by order or by head.","D":"On June 27, 1789, the king told the remaining clergy and nobles to join the National Assembly. This came after the cahiers had been written."},"hint":"Article 10 talks about how votes \"should be taken and counted.\" Why would the Third Estate care how votes were counted?"},{"id":"E5-P06","set":"P2","topic":"5.4","lo":"D","skill":"5.A","difficulty":"medium","stem":"Which of the following developments shows the Revolution going furthest beyond the demands in this cahier?","options":{"A":"The National Assembly declared that citizens would pay taxes on an equal basis.","B":"The Estates-General met in 1789 for the first time since 1614.","C":"The National Convention abolished the monarchy and declared France a republic in 1792.","D":"The National Assembly opened government offices to men of talent, whatever their birth."},"answer":"C","explanation":"In spring 1789 the Third Estate of Carcassonne praised the king and wanted to keep the monarchy. In September 1792 the National Convention abolished the monarchy and set up a republic, going far beyond these demands.","whyNot":{"A":"Equal taxes were exactly what article 11 asked for.","B":"The meeting of the Estates-General was what the cahier was written for, and article 9 asks for more meetings.","D":"Opening offices to talent was the goal of article 12."},"hint":"Three choices match demands in the cahier. Which one does the cahier not ask for?","reasoning":"Continuity and Change"},{"id":"E5-P07","set":"P3","topic":"5.4","lo":"D","skill":"1.B","difficulty":"easy","stem":"The decree is best described as an effort to","options":{"A":"make France's clergy independent of both the pope and the government","B":"strengthen the pope's power to choose and approve French bishops","C":"put the Catholic Church in France under the control of the state","D":"return to the Church the lands the National Assembly had taken in 1789"},"answer":"C","explanation":"The decree made bishops and priests elected officials supported by the nation, fit dioceses to the new departments, and required newly elected bishops to swear loyalty. These rules put the Church in France under much greater state control.","whyNot":{"A":"The decree makes the clergy swear loyalty to the nation and takes their pay from the nation. It ties them to the government.","B":"Article XIX says a new bishop \"may not apply to the pope\" for approval. The decree cuts the pope's power.","D":"The decree pays priests salaries from the nation instead. The Church's lands were being sold."},"hint":"Who chooses the bishops under this decree, and who pays them?"},{"id":"E5-P08","set":"P3","topic":"5.4","lo":"D","skill":"4.B","difficulty":"medium","stem":"The promise that the clergy \"shall be supported by the nation\" is best understood in the context of","options":{"A":"the National Assembly's seizure of Church lands to help pay the government's debts","B":"the pope's offer to pay French priests if the Assembly let him keep naming bishops","C":"a new tithe that the Assembly ordered French households to pay to their bishops","D":"the nobles' promise to pay priests' salaries in return for keeping their privileges"},"answer":"A","explanation":"In November 1789 the Assembly put the Church's lands at the nation's disposal, and sales began in 1790 to help with the debt crisis. The state then took on the job of paying the clergy.","whyNot":{"B":"The pope made no such offer. He condemned the decree in 1791.","C":"The Assembly abolished the tithe in August 1789. It did not create a new one.","D":"The nobles lost their privileges in August 1789. They made no such deal."},"hint":"Before 1789, where did the Church get the money to pay its priests? What happened to that money in 1789?"},{"id":"E5-P09","set":"P3","topic":"5.4","lo":"D","skill":"5.B","difficulty":"medium","stem":"The carrying out of this decree, including a later rule that serving clergy take an oath, contributed most directly to which of the following?","options":{"A":"strong support for the Revolution among Catholic peasants in western France","B":"the pope's approval of the election of French bishops by voters","C":"a drop in the number of nobles leaving France to oppose the Revolution","D":"a split among the clergy, as many priests refused to swear the required oath"},"answer":"D","explanation":"In November 1790 the Assembly required serving clergy to swear an oath to the new system. About half of the parish priests and nearly all bishops refused. The clergy split, and many Catholics turned against the Revolution.","whyNot":{"A":"Many peasants in the west stood by priests who refused the oath. In 1793 the Vendée region rose in revolt against the Revolution.","B":"Pope Pius VI condemned the Civil Constitution in 1791.","C":"More nobles left France after 1790, not fewer, and many priests who refused the oath went into exile too."},"hint":"Look at Articles XIX and XXI. How would Catholics who stayed loyal to the pope view a Church run this way?","reasoning":"Causation"},{"id":"E5-P10","set":"P4","topic":"5.4","lo":"D","skill":"3.A","difficulty":"easy","stem":"In Source 1, Michelet's main point about the events of October 1789 is that","options":{"A":"the women of Paris wanted to overthrow the monarchy and set up a republic","B":"deputies of the National Assembly had planned the march to Versailles in advance","C":"women took the leading part in bringing the king from Versailles to Paris","D":"the women of Paris marched mainly to punish the queen for her spending"},"answer":"C","explanation":"Michelet compares two great events of 1789: men stormed the Bastille in July, and women brought the king to Paris in October. He gives women the credit for the second.","whyNot":{"A":"The women want the king \"amongst them\" so they will be \"safe from famine.\" They are not trying to end the monarchy.","B":"Michelet calls the event \"sudden, unforeseen, and truly popular,\" not planned by deputies.","D":"Michelet mentions only \"some jests\" about the queen. The women's concern is bread."},"hint":"Look at the last sentence of Source 1. What comparison does Michelet make?"},{"id":"E5-P11","set":"P4","topic":"5.4","lo":"D","skill":"4.B","difficulty":"easy","stem":"The crowd's name for the king, \"the baker,\" most directly reflects","options":{"A":"the belief that a king could cure the sick by touching them","B":"anger over the high price and short supply of bread in Paris in 1789","C":"support for the king's plan to sell grain from royal storehouses abroad","D":"the rise of a new class of factory workers in French cities"},"answer":"B","explanation":"Poor harvests and high bread prices strained many Paris households. The women hoped that bringing the king to Paris would help secure the city's food supply.","whyNot":{"A":"The old belief in the royal touch was about curing disease, not about bread.","C":"Selling grain abroad would have made bread even scarcer. The crowd wanted grain kept in Paris.","D":"The march was driven by worries about bread and about the king's response to the Revolution, not by the rise of a large industrial working class."},"hint":"What are the women carrying, and what do they hope to be \"safe from\"?"},{"id":"E5-P12","set":"P4","topic":"5.6","lo":"F","skill":"3.C","difficulty":"medium","stem":"Taken together, the two sources best illustrate which pattern of the years from 1789 to 1804?","options":{"A":"The Civil Code adopted the Catholic Church's rules on marriage and ended divorce in France.","B":"Women took part in revolutionary politics, but Napoleon's law confirmed men's authority over wives.","C":"Napoleon's Code copied English law, which let married women manage and sell their own property.","D":"Women's role in the October march led the National Assembly to fix low bread prices by law in 1789."},"answer":"B","explanation":"Source 1 stresses women's part in revolutionary action. Source 2 shows that the Civil Code kept husbands' authority in marriage: wives owed obedience and needed their husbands' consent for many property dealings.","whyNot":{"A":"The Code allowed divorce, though it made divorce harder for wives than for husbands. France did not ban divorce until 1816, after Napoleon fell.","C":"The Code drew on French and Roman law, not English law. English law also gave a husband control of his wife's property.","D":"The march brought the king to Paris, but the National Assembly passed no such law. Price limits on grain across France came only with the Convention's Maximum laws of 1793."},"hint":"Compare what women do in Source 1 with what the law allows wives to do in Source 2.","reasoning":"Continuity and Change"},{"id":"E5-P13","set":"P5","topic":"5.4","lo":"D","skill":"2.B","difficulty":"medium","stem":"The proclamation in Source 1 was most likely intended to","options":{"A":"assure the rulers of nearby countries that France would not spread its revolution","B":"persuade the nobles of other countries to give up their privileges on their own","C":"win the support of common people in lands that French armies had entered","D":"call on French nobles who had fled abroad to come home and serve the Republic"},"answer":"C","explanation":"The Convention promised to end feudal dues, tithes, and hated taxes wherever French troops went. It hoped ordinary people would welcome the French as liberators.","whyNot":{"A":"The proclamation says France has \"driven out your tyrants.\" It does the opposite of reassuring kings.","B":"The proclamation itself abolishes privileges. It does not ask nobles to act.","D":"The Convention treated the émigrés as traitors. A law of October 1792 banished them for life and ordered death for any who returned."},"hint":"Who is the proclamation addressed to, and what does it promise them?"},{"id":"E5-P14","set":"P5","topic":"5.4","lo":"D","skill":"5.B","difficulty":"medium","stem":"Policies like those in the two sources contributed most directly to","options":{"A":"the restoration of the Bourbon monarchy in France in 1793","B":"a long period of peace between France and the Austrian Habsburgs","C":"the formation of a coalition of European powers, including Britain, against France","D":"Britain's decision to stay neutral in the wars of the French Revolution"},"answer":"C","explanation":"The promise to overthrow \"tyrants\" scared Europe's rulers. Then France executed its king in January 1793. Britain, the Dutch Republic, Spain, and others soon joined Austria and Prussia in the war against France.","whyNot":{"A":"The Bourbon monarchy was not restored until 1814. In 1793 the Convention executed Louis XVI.","B":"France and Austria fought on and off from 1792 until 1815.","D":"Britain joined the war against France in 1793 and was France's most constant enemy."},"hint":"Source 2 says France will treat as enemies any people who keep their prince. How would kings react?","reasoning":"Causation"},{"id":"E5-P15","set":"P5","topic":"5.6","lo":"F","skill":"5.A","difficulty":"medium","stem":"The policies in Source 1 are most similar to which later action?","options":{"A":"Napoleon's spread of his Civil Code and legal equality to lands he conquered","B":"the Congress of Vienna's return of many lands to the families that had ruled them before 1789","C":"Britain's use of its navy to blockade the ports of France and its allies","D":"the Holy Alliance's promise that its rulers would govern by Christian principles"},"answer":"A","explanation":"Like the Convention, Napoleon brought revolutionary changes to conquered lands. He ended feudal dues and introduced his Code in places such as the Rhineland and northern Italy.","whyNot":{"B":"Restoring old ruling families did not share the proclamation's goal of replacing privileged institutions, though some Napoleonic reforms survived after 1815.","C":"A naval blockade was a weapon of war. It did not reform the laws of other lands.","D":"The Holy Alliance aimed to protect monarchs, not to abolish their privileges."},"hint":"What does the proclamation abolish, and in whose lands? Look for a later action with the same goal.","reasoning":"Comparison"},{"id":"E5-P16","set":"P6","topic":"5.4","lo":"D","skill":"4.B","difficulty":"easy","stem":"The decree was issued mainly in response to","options":{"A":"the king's attempt to flee France and join foreign armies","B":"foreign invasion and revolts inside France in 1793","C":"the Prussian invasion that ended with the French victory at Valmy","D":"Napoleon's call for troops to invade the British Isles"},"answer":"B","explanation":"By the summer of 1793, armies from Austria, Prussia, Britain, Spain, and other states were attacking France. At home, the Vendée and several cities had risen in revolt. The Convention called on the whole nation to fight.","whyNot":{"A":"The king's flight to Varennes was in June 1791, two years earlier. By 1793 the king had been executed.","C":"Valmy, in September 1792, turned back that invasion almost a year earlier. In 1793 France faced new and larger attacks.","D":"Napoleon planned to invade Britain in 1803–1805, ten years later."},"hint":"The decree says it lasts until \"the enemy shall have been driven from the soil of the Republic.\" What was happening in France in 1793?"},{"id":"E5-P17","set":"P6","topic":"5.8","lo":"I","skill":"1.B","difficulty":"medium","stem":"The decree's call for the aged to \"preach the hatred of kings and the unity of the Republic\" best illustrates","options":{"A":"the old monarchies' reliance on small professional armies and limited warfare","B":"a return to the religious motives that had driven Europe's wars in the 1500s","C":"the Catholic Church's growing influence on the government's war policy","D":"the use of strong emotion and national loyalty to rally a whole people for war"},"answer":"D","explanation":"The Revolution turned war into a cause for the whole nation. Speeches, songs, and decrees like this one stirred feelings of patriotism and hatred of kings. This showed the emotional power of mass politics and nationalism.","whyNot":{"A":"The decree calls up the whole nation, not a small professional army fighting a limited war.","B":"The decree asks people to fight for the Republic, not for a religion.","C":"In 1793 the Revolution was attacking the Church, not following its lead."},"hint":"The decree gives every age group a job. What is the job of the oldest citizens, and what feelings does it aim to stir?"},{"id":"E5-P18","set":"P6","topic":"5.4","lo":"D","skill":"5.B","difficulty":"medium","stem":"The decree contributed most directly to which of the following?","options":{"A":"the collapse of the French army as many soldiers deserted to join the Vendée revolt","B":"armies large enough to drive back the invaders and then conquer nearby lands","C":"a decline in France's population that forced the Convention to end the draft in 1794","D":"an alliance between France and Britain against the Austrian Habsburgs"},"answer":"B","explanation":"The levée en masse gave France the largest armies in Europe. By 1794 French forces had pushed the invaders back, and they soon took the Austrian Netherlands and the left bank of the Rhine.","whyNot":{"A":"The army grew, not collapsed. By 1794 France had about 750,000 men under arms.","C":"The Convention did not end the draft in 1794. Later French governments kept drafting soldiers.","D":"Britain and France fought one another through the Revolutionary and Napoleonic Wars, apart from brief periods of peace."},"hint":"Think about how big an army the decree would create. What could France do with it?","reasoning":"Causation"},{"id":"E5-P19","set":"P7","topic":"5.4","lo":"D","skill":"3.A","difficulty":"easy","stem":"Desmoulins's main argument in the passage is that the government should","options":{"A":"speed up trials so that enemies of the Republic could be punished more quickly","B":"admit that the Revolution had failed and allow the monarchy to return","C":"set aside the Declaration of Rights until France had won the war","D":"release people held on suspicion and show mercy, which would strengthen the Revolution"},"answer":"D","explanation":"Desmoulins wants the suspects set free and a \"Committee of Clemency\" set up. He thinks mercy, not terror, would make the Republic stronger.","whyNot":{"A":"Desmoulins calls mass executions \"madness\" and asks that suspects be released. He argues for legal protections and mercy, not faster punishment.","B":"Desmoulins calls mercy \"a Revolutionary measure\" that \"will complete the Revolution.\" He does not want a king.","C":"Desmoulins uses the Declaration of Rights to argue for freeing the suspects."},"hint":"What does Desmoulins want done with the prisons, and what kind of committee does he ask for?"},{"id":"E5-P20","set":"P7","topic":"5.4","lo":"D","skill":"4.B","difficulty":"medium","stem":"The \"citizens whom you call suspects\" had most likely been arrested under","options":{"A":"the Le Chapelier Law of 1791, which banned guilds and workers' associations","B":"the Concordat, which allowed the government to remove disloyal priests","C":"a 1793 law letting committees jail people for their views or ties","D":"the Brunswick Manifesto, which threatened Paris with destruction"},"answer":"C","explanation":"The Law of Suspects of September 1793 let local committees arrest people seen as enemies of the Revolution because of their conduct, words, connections, or social rank. Desmoulins attacks holding people on suspicion instead of for a proven offense.","whyNot":{"A":"The Le Chapelier Law banned workers' groups, but it did not fill the prisons with suspects.","B":"The Concordat was signed in 1801, long after 1793.","D":"The Brunswick Manifesto was a threat from Prussia's commander, not a French law."},"hint":"Desmoulins says there should be no \"prisons for suspicion.\" When did the government begin arresting people because of what they said or who their friends were?"},{"id":"E5-P21","set":"P7","topic":"5.4","lo":"D","skill":"5.A","difficulty":"hard","stem":"Desmoulins's views in the passage most closely match those of","options":{"A":"Georges Danton and his allies","B":"Jacques Hébert and his followers","C":"Saint-Just and the Committee of Public Safety","D":"Edmund Burke and other British critics"},"answer":"A","explanation":"Danton and Desmoulins were known as the Indulgents because they wanted mercy. Robespierre turned against them, and both were executed in April 1794.","whyNot":{"B":"Hébert's group wanted more arrests and executions, the opposite of Desmoulins.","C":"Saint-Just, Robespierre's close ally on the Committee of Public Safety, defended the Terror and helped bring Danton and Desmoulins to trial.","D":"Desmoulins supports the Revolution and the Republic. Burke opposed them."},"hint":"Desmoulins wants clemency but still supports the Republic. Which group fits both of those views?","reasoning":"Comparison"},{"id":"E5-P22","set":"P8","topic":"5.5","lo":"E","skill":"4.B","difficulty":"medium","stem":"Source 1 is best understood in the context of","options":{"A":"Britain's abolition of slavery in its own colonies in the Caribbean","B":"a massive revolt by enslaved people in the French colony of Saint-Domingue","C":"pressure from British abolitionists, who had already ended Britain's slave trade","D":"the Declaration of the Rights of Man's clear ban on slavery in 1789"},"answer":"B","explanation":"In 1791 enslaved people in Saint-Domingue rose up. To keep the colony and win the rebels to their side, French officials freed the enslaved there in 1793, and the Convention ended slavery in all French colonies in 1794.","whyNot":{"A":"Parliament passed Britain's Slavery Abolition Act in 1833. It took effect in 1834, and forced \"apprenticeship\" lasted in the Caribbean until 1838.","C":"Britain did not end its slave trade until 1807, thirteen years after this decree.","D":"The Declaration of 1789 did not abolish slavery. The assemblies debated slavery and the rights of free people of color before the Convention ended slavery in 1794."},"hint":"What had been happening in France's richest Caribbean colony since 1791?"},{"id":"E5-P23","set":"P8","topic":"5.6","lo":"F","skill":"2.B","difficulty":"medium","stem":"Napoleon most likely supported the law in Source 2 in order to","options":{"A":"win the support of free Black leaders in Saint-Domingue","B":"obey the terms of the Treaty of Amiens, which required the return of slavery","C":"protect France's plantation colonies by keeping enslaved labor","D":"reward Toussaint Louverture for keeping Saint-Domingue loyal to France"},"answer":"C","explanation":"Napoleon wanted to protect and rebuild France's colonial economy. The law kept slavery in colonies where the 1794 abolition had not taken effect and allowed the slave trade to supply them, including colonies in the Indian Ocean.","whyNot":{"A":"Bringing back slavery turned free Black leaders against France.","B":"The treaty returned islands to France, but it did not require France to bring back slavery. That was France's own choice.","D":"Napoleon sent an army to remove Toussaint. Toussaint was captured in 1802 and died in a French prison."},"hint":"Source 2 returns the colonies to the rules \"in force prior to 1789.\" What did French colonies produce before 1789, and who did the work?"},{"id":"E5-P24","set":"P8","topic":"5.5","lo":"E","skill":"5.B","difficulty":"medium","stem":"Napoleon's wider effort to keep or restore colonial slavery, shown in Source 2, contributed most directly to which of the following?","options":{"A":"the defeat of French forces in Saint-Domingue and the independence of Haiti in 1804","B":"the end of the French slave trade by order of Napoleon in 1803","C":"Napoleon's decision to name Toussaint Louverture governor of Saint-Domingue for life","D":"a successful revolt by enslaved people in Britain's colony of Jamaica in 1803"},"answer":"A","explanation":"The May 1802 law kept slavery in colonies where the 1794 abolition had not taken effect, such as Martinique. French forces also restored slavery in Guadeloupe in 1802. News of that strengthened resistance in Saint-Domingue, where people feared losing their freedom. Fighting and yellow fever destroyed the French army. Napoleon gave up his plans for America and sold Louisiana to the United States in 1803. Haiti declared independence on January 1, 1804.","whyNot":{"B":"Source 2 brings the slave trade back. Napoleon did not ban it until 1815, during his brief return to power.","C":"Toussaint named himself governor for life in 1801. Napoleon rejected this and sent an army against him.","D":"There was no successful revolt in Jamaica in 1803. Slavery there lasted until the 1830s."},"hint":"How would people who had been freed in 1794 react to news that slavery was coming back?","reasoning":"Causation"},{"id":"E5-P25","set":"P9","topic":"5.3","lo":"C","skill":"3.A","difficulty":"easy","stem":"The cartoonist most likely intended to suggest that","options":{"A":"Britain and France were ready to share the world peacefully and end their long war","B":"Britain's navy was too weak to keep Napoleon from taking control of the oceans","C":"Pitt was defending Britain fairly, while Napoleon alone was greedy for land","D":"both Britain and France were greedy for power, Britain at sea and France in Europe"},"answer":"D","explanation":"Gillray shows each leader taking the part of the world where his country was strongest: Pitt takes the oceans and Napoleon takes Europe. The title pokes fun at both men's hunger for power.","whyNot":{"A":"The title says the globe is \"too small to satisfy such insatiable appetites.\" Gillray mocks both men's greed, not their peaceful sharing.","B":"Pitt carves the slice marked \"Ocean.\" The cartoon shows Britain claiming the seas, not losing them.","C":"Gillray draws both men grabbing big slices, and the title calls both \"State Epicures\" with \"insatiable appetites.\" He mocks his own prime minister too."},"hint":"Look at which slice each man is cutting and at the words of the title."},{"id":"E5-P26","set":"P9","topic":"5.3","lo":"C","skill":"4.B","difficulty":"medium","stem":"The cartoon is best understood in the context of","options":{"A":"the Congress of Vienna, where the great powers redrew the map of Europe","B":"the alliance of Britain and France against Russia during the Seven Years' War","C":"Britain's loss of its thirteen American colonies with French help","D":"the renewed war between Britain and France after the Peace of Amiens"},"answer":"D","explanation":"Britain and France made peace at Amiens in 1802, but war began again in 1803. In early 1805 Napoleon, now emperor, was planning to invade Britain, and Pitt was building a new coalition against him. In January 1805 Napoleon also wrote to George III offering peace, and the cartoon mocks both sides' appetite for power.","whyNot":{"A":"The Congress of Vienna met in 1814–1815, ten years after this cartoon.","B":"Britain and France were enemies in the Seven Years' War. Russia fought against Britain's ally, Prussia, for most of that war.","C":"The American war ended in 1783, more than twenty years before the cartoon."},"hint":"The cartoon was published in February 1805. What was happening between Britain and France at that time?"},{"id":"E5-P27","set":"P9","topic":"5.6","lo":"F","skill":"3.D","difficulty":"medium","stem":"Which developments in 1805 most directly support the contrast between British and French power suggested by the cartoon?","options":{"A":"Britain's naval victory at Trafalgar and Napoleon's victory on land at Austerlitz","B":"Napoleon's landing in southern England after his fleet won control of the English Channel","C":"Britain's defeat of Napoleon's armies in the long war in Spain and Portugal","D":"Russia's entry into the war on France's side against Britain"},"answer":"A","explanation":"At Trafalgar in October 1805, the British navy decisively defeated the combined French and Spanish fleet. At Austerlitz in December, Napoleon defeated Austrian and Russian forces. These victories fit the cartoon's contrast between British power at sea and French power on land.","whyNot":{"B":"Napoleon gave up his plan to invade Britain in 1805. His fleet never controlled the Channel.","C":"The British fought the French in Spain and Portugal from 1808 to 1814, not in 1805.","D":"In 1805 Russia fought against France. It made peace with Napoleon only in 1807."},"hint":"Pitt carves the ocean and Napoleon carves Europe. Which events showed each country winning in its own part of the world?"},{"id":"E5-P28","set":"P10","topic":"5.6","lo":"F","skill":"2.B","difficulty":"easy","stem":"Napoleon's main purpose in issuing the decree was to","options":{"A":"protect the ships of neutral countries from being stopped by the British navy","B":"weaken Britain by cutting off its trade with the European continent","C":"prepare the way for a French army to land on the British Isles","D":"force Britain to hand over its colonies in India and the Caribbean"},"answer":"B","explanation":"Napoleon could not beat Britain at sea, so he tried to ruin its trade. If Britain could not sell its goods in Europe, he hoped it would run short of money and make peace.","whyNot":{"A":"Napoleon complains about Britain's blockade, but Article VII shuts out any ship that has visited Britain, so neutral ships were hurt too.","C":"The decree aims to cut Britain off economically. Its articles ban trade and shipping; they do not order an invasion.","D":"The decree targets British trade in Europe. It does not demand Britain's colonies."},"hint":"Read Articles II, V, and VII. What do they forbid, and whom would that hurt most?"},{"id":"E5-P29","set":"P10","topic":"5.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"The decree failed to defeat Britain mainly because","options":{"A":"Prussia and Austria refused to join the system and kept their ports open to British ships","B":"Britain made peace with France in 1807 and won back the right to trade in European ports","C":"Napoleon canceled the decree in 1808 after French merchants complained that it hurt their own trade","D":"Britain's navy controlled the seas, and smuggling of British goods was widespread"},"answer":"D","explanation":"Britain kept trading with the rest of the world, including Latin America. On the continent, merchants and even officials smuggled British goods. Smuggling, overseas markets, and uneven enforcement kept the system from forcing Britain to make peace.","whyNot":{"A":"Prussia was forced to close its ports to British goods by the Treaty of Tilsit in 1807, and Austria was also pressed into the system.","B":"Britain stayed at war with Napoleon from 1803 until 1814. It never made peace to reopen European trade.","C":"Napoleon tightened the system with new decrees in 1807 and 1810 and kept it until his empire fell. He sold some trading licenses but never canceled the decree."},"hint":"Check each choice against what actually happened between 1806 and 1814. Did Prussia, Austria, Britain, and Napoleon really act the way the choices say?","reasoning":"Causation"},{"id":"E5-P30","set":"P10","topic":"5.6","lo":"F","skill":"5.B","difficulty":"medium","stem":"The system created by the decree contributed most directly to which of the following?","options":{"A":"Britain's decision to seek peace with France after its trade with Europe collapsed in 1807","B":"the end of the Holy Roman Empire and the creation of the Confederation of the Rhine","C":"Russia's break with the system and Napoleon's invasion of Russia in 1812","D":"Spain's request for French troops to defend its coasts against British raids"},"answer":"C","explanation":"Limits on British trade hurt Russia's economy. In late 1810 the tsar relaxed enforcement and let in neutral ships. This dispute raised tensions with Napoleon and helped lead to his invasion of Russia in 1812.","whyNot":{"A":"Britain's trade did not collapse, and Britain stayed at war with Napoleon until 1814 and again in 1815.","B":"The Holy Roman Empire ended and the Confederation of the Rhine was formed in the summer of 1806, before the Berlin Decree.","D":"In 1807 Spain let French troops cross its land for a joint invasion of Portugal. Napoleon then widened the occupation and removed Spain's royal family in 1808. Spain never asked France to defend its coasts."},"hint":"Which large country found that the ban on British trade hurt its own economy? What did Napoleon do about it?","reasoning":"Causation"},{"id":"E5-P31","set":"P11","topic":"5.6","lo":"F","skill":"3.B","difficulty":"easy","stem":"In Source 1, which of the following does Napoleon use as evidence that Spaniards should accept his rule?","options":{"A":"He says he has brought reforms that free the people and limit royal power.","B":"He claims that Spain's bishops have asked him to protect the Church from the English army.","C":"He promises to give Spain's colonies in the Americas their independence.","D":"He promises to return the old Spanish royal family to the throne."},"answer":"A","explanation":"Napoleon presents his constitution and decrees as proof that his rule will free Spaniards from old restrictions. His claim must be read alongside his threat to treat Spain as conquered land.","whyNot":{"B":"Napoleon does not mention any request from the bishops. In fact, the decrees in Source 2 abolish the Inquisition.","C":"Napoleon says nothing about the colonies in the passage.","D":"Napoleon had removed the old royal family. He threatens to treat Spain as \"conquered provinces\" and put his brother on \"another throne.\""},"hint":"Look at the second paragraph of Source 1. What does Napoleon say he has already done for Spain?"},{"id":"E5-P32","set":"P11","topic":"5.6","lo":"F","skill":"5.A","difficulty":"medium","stem":"The decrees in Source 2 are most similar to","options":{"A":"the return of Church lands and privileges under the Concordat of 1801","B":"the reforms of Spain's Bourbon kings, who relied on the Inquisition","C":"the Holy Alliance's promise that rulers would govern by Christian principles","D":"reforms that the National Assembly made in France in 1789–1790"},"answer":"D","explanation":"The National Assembly attacked legal privileges in August 1789 and took over Church lands in November 1789. Some feudal dues had to be bought out until 1793. Napoleon's decrees in Spain likewise attacked inherited privileges and Church institutions.","whyNot":{"A":"The Concordat did not return the Church's lands, which had been sold during the Revolution. Napoleon's Spanish decrees attack old Church privileges, such as the Inquisition.","B":"Spain's Bourbon kings kept the Inquisition. Napoleon abolished it.","C":"The Holy Alliance, formed in 1815, defended monarchs and religion. It did not abolish old privileges."},"hint":"What do feudal rights and the Inquisition have in common? Which earlier government attacked the same kinds of privileges?","reasoning":"Comparison"},{"id":"E5-P33","set":"P11","topic":"5.6","lo":"G","skill":"5.B","difficulty":"medium","stem":"Many Spaniards rejected Napoleon's proclamation mainly because they","options":{"A":"saw his reforms as foreign rule forced on them by a conqueror","B":"preferred the constitution that a Spanish assembly had already written at Cádiz","C":"expected Russia to send an army to restore Spain's royal family","D":"hoped to join the Holy Roman Empire under the Austrian Habsburgs"},"answer":"A","explanation":"Many Spaniards, led by priests and local leaders, fought a guerrilla war against the French. They fought for their king, their Church, and their country against a foreign conqueror, even when he offered reforms.","whyNot":{"B":"The Cortes of Cádiz wrote Spain's own liberal constitution in 1812, more than three years after this proclamation.","C":"In 1808 Russia was Napoleon's ally under the Treaty of Tilsit. It did not go to war with France again until 1812.","D":"The Holy Roman Empire had ended in 1806, and Spain had never been part of it."},"hint":"The proclamation is dated December 1808. Check each choice against what had and had not happened in Europe by then.","reasoning":"Causation"},{"id":"E5-P34","set":"P12","topic":"5.6","lo":"G","skill":"3.A","difficulty":"easy","stem":"Fichte's main argument in the passage is that Germans","options":{"A":"form one nation through their shared language and must rouse themselves to stay free","B":"should accept French rule in exchange for the reforms the French had brought","C":"should develop a separate language for each German state to protect its freedom","D":"should rebuild the Holy Roman Empire under the leadership of the Austrian emperor"},"answer":"A","explanation":"Fichte says that wherever German is spoken, people belong to one fatherland. He urges Germans to wake up and resist so that their nation and language will not disappear.","whyNot":{"B":"Fichte warns that if Germans do nothing, \"all the evils of slavery\" and \"the scorn and arrogance of the conqueror\" await them.","C":"Fichte says the German language joins all Germans into one \"common fatherland.\"","D":"Fichte does not mention Austria or the emperor in the passage. He speaks to the German nation as a whole."},"hint":"What does Fichte say joins all Germans together, and what does he say will happen if they \"drift along\"?"},{"id":"E5-P35","set":"P12","topic":"5.6","lo":"G","skill":"4.B","difficulty":"medium","stem":"Fichte's lectures are best understood in the context of","options":{"A":"the unification of the German states into one empire led by Prussia","B":"Prussia's defeat by Napoleon and the French occupation of Berlin","C":"Austria's victory over Napoleon's army at Austerlitz","D":"Prussia's leadership of the Confederation of the Rhine against France"},"answer":"B","explanation":"Napoleon's forces defeated Prussia at Jena and Auerstedt in 1806 and occupied Berlin. Fichte gave these lectures in the occupied city, urging Germans to see themselves as one nation.","whyNot":{"A":"Germany was unified under Prussia in 1871, long after Fichte.","C":"Austria lost at Austerlitz in 1805. Napoleon won.","D":"Napoleon created the Confederation of the Rhine in 1806 as a league of German states under his own protection. Prussia never joined it."},"hint":"Fichte warns of \"the scorn and arrogance of the conqueror.\" Who was the conqueror, and what had he just done?"},{"id":"E5-P36","set":"P12","topic":"5.6","lo":"G","skill":"5.B","difficulty":"medium","stem":"Ideas like Fichte's contributed most directly to which of the following?","options":{"A":"the Congress of Vienna's creation of a single German nation-state in 1815","B":"Prussia's decision to send troops to help Napoleon invade Russia in 1812","C":"the spread of Napoleon's Civil Code to Prussia and Austria","D":"German nationalism in the war of liberation against Napoleon in 1813"},"answer":"D","explanation":"In 1813 Prussia turned against Napoleon, and students and other volunteers joined the fight. They saw it as a war to free the German nation, an idea that writers like Fichte had spread.","whyNot":{"A":"The Congress of Vienna created a loose German Confederation of 39 states, not a nation-state.","B":"Prussia sent troops in 1812 because Napoleon forced it to, not because of German nationalism.","C":"Prussia and Austria did not replace their legal systems with Napoleon's Code, and the Code's spread under French rule had nothing to do with Fichte's call for national resistance."},"hint":"Fichte calls on Germans to \"rouse\" themselves. What might Germans who took his message to heart do in the years that followed?","reasoning":"Causation"},{"id":"E5-P37","set":"P13","topic":"5.7","lo":"H","skill":"2.B","difficulty":"medium","stem":"The rulers who signed the treaty most likely intended to","options":{"A":"join Europe's Catholic, Protestant, and Orthodox churches under one leader","B":"create a single Christian empire ruled by the tsar of Russia","C":"spread the ideas of the French Revolution in a religious form","D":"base their alliance on Christian principles to help keep order in Europe"},"answer":"D","explanation":"The three rulers promised to act as Christian fathers and to help one another. In practice, the alliance stood for kings, religion, and order, and against revolution.","whyNot":{"A":"The rulers promise to follow Christian \"precepts.\" They do not join the churches together.","B":"Each ruler keeps his own state. The treaty speaks of \"their respective States\" and calls the rulers \"fellow-countrymen\" joined by \"fraternity,\" not one empire.","C":"The treaty supports kings and cooperation based on religion. It does not proclaim the sovereignty of the people or revolutionary equality."},"hint":"Who signed the treaty, and what had they just finished fighting against?"},{"id":"E5-P38","set":"P13","topic":"5.7","lo":"H","skill":"4.B","difficulty":"easy","stem":"The \"great events which have marked the course of the three last years in Europe\" most likely refers to","options":{"A":"the outbreak of the French Revolution and the fall of the Bastille","B":"the Peace of Amiens, which ended the war between Britain and France","C":"Napoleon's defeat and the peace settlement of 1814–1815","D":"the war between Britain and the United States that ended in 1815"},"answer":"C","explanation":"Between 1812 and 1815, Napoleon's invasion of Russia failed, the allies took Paris, and the Congress of Vienna redrew the map of Europe. The signers saw their victory as a blessing from God.","whyNot":{"A":"The Revolution began in 1789, more than twenty-five years before the treaty.","B":"The Peace of Amiens was signed in 1802 and broke down in 1803, more than a decade before the treaty. None of the three signers was a party to it.","D":"That war was fought in North America and at sea, and none of the three signers took part in it. The treaty speaks of events \"in Europe.\""},"hint":"The treaty was signed in 1815. What happened in Europe from 1812 to 1815?"},{"id":"E5-P39","set":"P13","topic":"5.7","lo":"H","skill":"2.C","difficulty":"hard","stem":"Which conclusion about cooperation among the monarchs is best supported by the treaty as a historical source?","options":{"A":"It records an acceptance of elected governments, but it does not say who would be allowed to vote.","B":"It records an agreement to form a joint army, but it does not name the army's permanent commander.","C":"It records a promise of cooperation, but it does not prove that the rulers kept that promise.","D":"It records a plan to unite their three states, but it does not give the new state's borders."},"answer":"C","explanation":"An official treaty is good evidence of what rulers promised. To learn whether they kept those promises, a historian needs other evidence about what they later did.","whyNot":{"A":"The treaty never mentions elections or elected governments. It speaks of rulers who act as \"fathers of families.\"","B":"The treaty promises \"aid and assistance\" but sets up no joint army.","D":"The treaty keeps \"their respective States\" separate. It joins the rulers in \"fraternity,\" not their lands."},"hint":"First check each choice against the treaty's actual words. Then ask what kind of evidence a single treaty can and cannot give."},{"id":"E5-P40","set":"P14","topic":"5.8","lo":"I","skill":"3.A","difficulty":"easy","stem":"Wesley's account of May 24, 1738, emphasizes","options":{"A":"the value of church ceremonies performed by bishops and priests","B":"a personal, emotional experience of faith rather than a reasoned argument","C":"the use of reason to prove God's existence from the order of nature","D":"his decision to leave the Church of England and start a new church"},"answer":"B","explanation":"Wesley describes a moment of feeling: his heart was \"strangely warmed,\" and he felt sure that God had forgiven him. Methodists stressed this kind of inner experience of faith.","whyNot":{"A":"Wesley's change comes at a small meeting in a house, not during a church ceremony.","C":"Wesley says nothing about proof. He says he \"felt\" his \"heart strangely warmed.\"","D":"Wesley remained a Church of England priest all his life, and this entry does not announce a new church."},"hint":"Find the words Wesley uses to describe what happened inside him."},{"id":"E5-P41","set":"P14","topic":"5.8","lo":"I","skill":"4.B","difficulty":"medium","stem":"Wesley's journal is best understood as part of","options":{"A":"the Catholic Reformation's effort to win English Protestants back to Rome","B":"deism, which saw God as a creator who does not take part in human affairs","C":"the Puritan movement that overthrew the English monarchy","D":"a religious revival that challenged the Enlightenment's stress on reason"},"answer":"D","explanation":"The Methodist revival stressed personal religious experience and the feeling of being saved. This challenged the idea that a religion based mainly on reason was enough, without rejecting reason itself.","whyNot":{"A":"Wesley was a Protestant priest of the Church of England, not a Catholic.","B":"Deists kept God at a distance. Wesley feels God at work in his own heart.","C":"The Puritan revolution took place in the 1640s, almost a century before Wesley."},"hint":"Which words show Wesley treating an inward experience as evidence of his faith?"},{"id":"E5-P42","set":"P14","topic":"5.8","lo":"I","skill":"5.B","difficulty":"medium","stem":"Wesley's decision to preach outdoors most likely allowed him to","options":{"A":"avoid government officials who had made Methodist meetings illegal","B":"address large crowds beyond the usual reach of parish services","C":"follow the orders of bishops who wanted more services held outdoors","D":"raise money from the crowds to build Methodist churches in the American colonies"},"answer":"B","explanation":"Field preaching brought crowds of thousands, including coal miners and other workers who had little contact with the Church. Methodism grew quickly among working people.","whyNot":{"A":"The passage presents field preaching as a way to reach a large audience. Methodist meetings were not banned, and Wesley was a priest of the official church.","C":"Many bishops disliked field preaching. Wesley himself first thought it was nearly \"a sin.\"","D":"Wesley says he \"proclaimed … the glad tidings of salvation.\" He was preaching, not raising money for buildings overseas."},"hint":"How many people heard Wesley on April 2, 1739? Who might come to hear a preacher outdoors but not inside a church?","reasoning":"Causation"},{"id":"E5-P43","set":"P15","topic":"5.8","lo":"I","skill":"2.B","difficulty":"easy","stem":"Chateaubriand's main purpose in the passage is to","options":{"A":"defend Christianity by appealing to beauty, imagination, and feeling","B":"prove Christianity true mainly by checking the historical accuracy of biblical events","C":"argue that the Church should give up its political power in France","D":"call for a return to the Civil Constitution of the Clergy"},"answer":"A","explanation":"Chateaubriand answers Christianity's critics by stressing its kind teachings, its gifts to art and learning, its beauty, and its appeal to the imagination and the heart.","whyNot":{"B":"The passage praises Christianity's cultural and moral effects. It does not test whether biblical events actually happened.","C":"Chateaubriand does not discuss the Church's political power in the passage.","D":"Chateaubriand defends the Christian religion itself. He does not mention the Civil Constitution."},"hint":"Look at the last sentence. What does Chateaubriand want to \"summon\" to help religion?"},{"id":"E5-P44","set":"P15","topic":"5.8","lo":"I","skill":"4.B","difficulty":"medium","stem":"The book's publication in 1802 is best understood in the context of","options":{"A":"a revival of religious feeling after the Revolution's attacks on the Church","B":"the French bishops' public support for the Reign of Terror and its war policies","C":"the pope's condemnation of Romantic writers as enemies of the faith","D":"the spread of deism as the official religion of Napoleon's France"},"answer":"A","explanation":"The book came out as Napoleon put the Concordat of 1801 into effect. It belongs to the revival of public Catholic life after the Revolution's attacks on the Church. The Concordat made peace between the French state and the pope and set the Church's place in France.","whyNot":{"B":"The Terror closed churches and attacked priests. The bishops did not support it.","C":"The pope did not condemn Chateaubriand. The book was welcomed by Catholics.","D":"Napoleon restored Catholic worship. Robespierre's deist cult had ended in 1794."},"hint":"What had happened to the Church in France during the 1790s? How might people feel about religion afterward?"},{"id":"E5-P45","set":"P15","topic":"5.8","lo":"I","skill":"4.A","difficulty":"medium","stem":"The \"sophists\" whom Chateaubriand criticizes most likely included","options":{"A":"priests who had refused to swear the oath to the Civil Constitution","B":"Romantic poets who praised nature and strong feeling","C":"Enlightenment philosophes such as Voltaire who attacked the Church","D":"Protestant reformers such as Luther and Calvin"},"answer":"C","explanation":"The \"sophists\" said Christianity was an enemy of reason and learning. Voltaire and other philosophes of the 1700s made this charge.","whyNot":{"A":"Priests who refused the oath stayed loyal to the pope. Chateaubriand would see them as defenders of the faith.","B":"Chateaubriand shared the Romantics' love of feeling and beauty. He was not attacking them.","D":"Luther and Calvin were Christians who lived in the 1500s, more than two centuries before this book. They did not call Christianity an enemy of reason."},"hint":"What did the \"sophists\" say about Christianity? Which group in the choices would have said that?"},{"id":"E5-P46","set":"P16","topic":"5.9","lo":"J","skill":"3.A","difficulty":"medium","stem":"Tocqueville's main argument in the passage is that","options":{"A":"the Revolution created a centralized government in France for the first time in its history","B":"Napoleon restored the local liberties that the Revolution had destroyed","C":"the provinces of the old regime governed themselves without royal officials","D":"Napoleon rebuilt the old regime's central government after the Revolution swept away its limits"},"answer":"D","explanation":"Tocqueville says strong central government began under the kings before 1789. The Revolution swept away the things that had held it in check. So Napoleon could rebuild it even stronger.","whyNot":{"A":"Tocqueville says the opposite: centralization was \"a feature of the old regime.\"","B":"Tocqueville says Napoleon built a power \"more absolute than any of our monarchs had ever wielded.\"","C":"Tocqueville says centralization was already part of the old regime, so the provinces were run from the center."},"hint":"Find what Tocqueville will \"deny\" about centralization. Then see what he says happened to it after the Revolution.","reasoning":"Continuity and Change"},{"id":"E5-P47","set":"P16","topic":"5.9","lo":"J","skill":"5.A","difficulty":"medium","stem":"Tocqueville's description of the man \"destined both to continue and to destroy the Revolution\" best fits which of Napoleon's policies?","options":{"A":"giving back the nobility's tax exemptions while keeping elected local councils","B":"returning the Church's lands while ending state salaries for priests","C":"dividing France into self-governing provinces while giving up the title of emperor","D":"keeping the end of tax privileges while ending free elections and a free press"},"answer":"D","explanation":"Napoleon kept important legal changes from the Revolution, such as the end of inherited tax privileges. But he strengthened his own power and silenced opposition and the press. His Civil Code also kept wives unequal to husbands.","whyNot":{"A":"Napoleon kept equal taxation, and his prefects ran local government instead of elected councils.","B":"Napoleon did not return the Church's lands, and under the Concordat the state paid priests.","C":"Napoleon ran France through prefects appointed in Paris, and he crowned himself emperor in 1804."},"hint":"Tocqueville calls Napoleon the man \"destined both to continue and to destroy the Revolution.\" Find the choice that keeps one part of the Revolution and ends another.","reasoning":"Continuity and Change"},{"id":"E5-P48","set":"P16","topic":"5.9","lo":"J","skill":"2.C","difficulty":"hard","stem":"How might the political situation described in the footnote have influenced Tocqueville's interpretation?","options":{"A":"He may have stressed centralization to argue that France needed a more powerful emperor.","B":"He may have stressed centralization to explain why one-man rule kept returning in France.","C":"He may have stressed centralization to show that revolutionary assemblies first created it after 1789.","D":"He may have stressed centralization to argue that France should bring back the absolute monarchy of the old regime."},"answer":"B","explanation":"Living under a second Napoleon could explain Tocqueville's interest in why strong central power kept coming back. That context helps explain his emphasis. It does not by itself prove or disprove his argument.","whyNot":{"A":"Tocqueville warns that Napoleon's state had a power \"more absolute than any of our monarchs had ever wielded.\" He is not calling for more of it.","C":"Tocqueville says centralization was \"a feature of the old regime,\" not something the Revolution invented.","D":"Tocqueville blames the old regime's centralization for making despotism easy. As a liberal, he wanted checks on central power, not a return to absolute kings."},"hint":"Read the footnote. What kind of government ruled France when Tocqueville wrote, and how might that shape his questions?"}],"exam":{"title":"Unit 5 Practice Exam: Conflict, Crisis, and Reaction in the Late 18th Century","timeMinutes":25,"questionCount":25,"directions":"Each set of questions refers to a source: a primary source, a historian's writing, an image, or data. For each question, choose the best answer. Use the source and your knowledge of European history from c. 1648 to c. 1815. There is no penalty for guessing. Some sources use historical labels or words for groups of people that are no longer used; these words show the language of their time.","questions":[{"id":"E5-E01","set":"X1","topic":"5.4","lo":"D","skill":"4.B","difficulty":"medium","stem":"The scene Young describes is best understood in the context of","options":{"A":"food shortages and rural unrest following the poor harvest of 1788","B":"the end of the crown's money troubles after the nobles agreed to pay new taxes","C":"the fear of foreign invasion that followed France's declaration of war on Austria","D":"the public debate that followed the opening of the Estates-General in May 1789"},"answer":"D","rationales":{"A":"Incorrect. Poor harvests and high bread prices did add to the anger of 1789, but Young describes political pamphlets and speeches in Paris, not food shortages or unrest in the countryside.","B":"Incorrect. In 1787 the nobles in the Assembly of Notables refused to accept new taxes. The money crisis was still not solved in 1789.","C":"Incorrect. France declared war on Austria in April 1792, almost three years after Young's visit.","D":"Correct. Louis XVI called the Estates-General because the crown was nearly out of money. Once it met, Parisians argued over how much power the Third Estate should have."},"explanation":"In June 1789 the deputies of the Third Estate were demanding that votes be counted by head. Paris followed every step. Pamphlets and speakers attacked the clergy and the nobles, and the king's officials did little to stop them."},{"id":"E5-E02","set":"X1","topic":"5.4","lo":"D","skill":"2.C","difficulty":"medium","stem":"Young's account would be most useful to a historian studying","options":{"A":"how the royal court planned to respond to the demands of the Third Estate","B":"how political pamphlets and public debate circulated in Paris in June 1789","C":"how peasants in the provinces felt about the taxes and dues they paid to lords","D":"how the clergy and nobility defended their privileges in pamphlets and speeches"},"answer":"B","rationales":{"A":"Incorrect. Young was a visitor who stood in the crowds. He says the court took \"not the least step,\" and he had no view of its private plans.","B":"Correct. Young visited the pamphlet shops and coffee-houses himself and reports how many new pamphlets were appearing.","C":"Incorrect. Young is in Paris. He mentions the provinces only in passing, with the words \"they say.\"","D":"Incorrect. Young says he could find only \"two or three\" works on that side worth knowing. His account tells us little about how the privileged orders made their case."},"explanation":"Young reports how many new pamphlets were appearing and describes crowds listening to political speakers in Paris. His journal is strong evidence of political print and debate in the city, but it does not measure the views of all French people."},{"id":"E5-E03","set":"X1","topic":"5.4","lo":"D","skill":"5.B","difficulty":"medium","stem":"The \"spirit\" that Young says was being \"raised among the people\" contributed most directly to which of the following?","options":{"A":"the Tennis Court Oath sworn by deputies of the Third Estate","B":"Louis XVI's dismissal of his popular finance minister, Necker","C":"the storming of the Bastille by armed crowds in Paris","D":"the National Assembly's decision to take over the Church's lands"},"answer":"C","rationales":{"A":"Incorrect. The deputies took the Tennis Court Oath at Versailles on June 20 after being locked out of their hall. It grew out of their struggle inside the Estates-General, while Young describes crowds in Paris.","B":"Incorrect. The king chose to dismiss Necker on July 11. The news set off protests in Paris, so it was a cause of the unrest, not a result of it.","C":"Correct. Parisians who had been stirred up by speeches at the Palais Royal seized weapons and attacked the royal fortress on July 14.","D":"Incorrect. The Assembly took over Church lands in November 1789 to deal with the government's debts. It was a lawmakers' decision about money, not a direct result of crowds in Paris."},"explanation":"On July 12, 1789, speakers at the Palais Royal called on Parisians to arm themselves after the king dismissed Necker. Two days later, crowds stormed the Bastille, a royal prison.","reasoning":"Causation"},{"id":"E5-E04","set":"X2","topic":"5.5","lo":"E","skill":"3.C","difficulty":"medium","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Burke treats liberties as an inheritance from the past, while Paine says each generation may decide its own government.","B":"Burke defends rule by an absolute king, while Paine defends a monarchy whose powers are limited by a parliament.","C":"Burke rejects the idea that society is a contract, while Paine builds his whole case on that idea.","D":"Burke praises the reforms of the National Assembly, while Paine condemns them as too violent."},"answer":"A","rationales":{"A":"Correct. Burke calls English liberties \"an entailed inheritance\" from \"our forefathers.\" Paine says \"Every age and generation must be as free to act for itself\" as the ones before it.","B":"Incorrect. Burke defends a monarchy limited by Parliament, not an absolute king. Paine's passage argues that each generation may choose its own government; it does not defend any particular form of government.","C":"Incorrect. Burke writes, \"Society is, indeed, a contract,\" though he describes it as a contract between generations.","D":"Incorrect. Burke attacked the National Assembly's reforms, and Paine defended them."},"explanation":"Burke says rights are handed down like family property and should be kept, not remade. Paine answers that the dead have no right to bind the living.","reasoning":"Comparison"},{"id":"E5-E05","set":"X2","topic":"5.5","lo":"E","skill":"2.B","difficulty":"medium","stem":"Burke most likely wrote Source 1 in order to","options":{"A":"persuade Louis XVI to give up his throne and leave France for his own safety","B":"urge Parliament to give the vote to many more British men, as France had just done","C":"warn British readers against following the example set by the French revolutionaries","D":"call on Britain to go to war to restore the power of Louis XVI"},"answer":"C","rationales":{"A":"Incorrect. Burke defended the French monarchy. He did not want Louis XVI to give up the throne.","B":"Incorrect. Burke warns against \"innovation.\" He did not call for more British men to vote.","C":"Correct. Burke wrote after some British radicals praised the French Revolution. He argues that Britain's liberties come from tradition, not from new theories.","D":"Incorrect. Burke's passage defends Britain's inherited constitution. It says nothing about sending British forces to restore Louis XVI."},"explanation":"Burke wrote in 1790, after a London minister named Richard Price praised the French Revolution in a sermon. Burke wanted Britons to value their old constitution. He warned that tearing down old institutions was dangerous."},{"id":"E5-E06","set":"X2","topic":"5.5","lo":"E","skill":"3.D","difficulty":"medium","stem":"Which later development in France would Burke's supporters most likely have pointed to as evidence that overturning inherited institutions was dangerous?","options":{"A":"the French army's defeat at Valmy, which let the Prussian army march on to Paris","B":"a civil war that broke out in 1790 after Louis XVI refused to accept the Declaration of the Rights of Man","C":"the execution of the king and the mass arrests and killings of the Reign of Terror","D":"the National Assembly's seizure of private land, which it divided equally among the peasants"},"answer":"C","rationales":{"A":"Incorrect. The French won at Valmy in September 1792, and the Prussians retreated. Paris was not taken until 1814.","B":"Incorrect. Louis XVI accepted the Declaration in October 1789, and no civil war broke out in 1790. The great revolts, such as the Vendée, began in 1793.","C":"Correct. Burke warned that throwing away tradition would lead to disorder and tyranny. Bloodshed in 1793–1794 seemed to prove him right.","D":"Incorrect. The Declaration of 1789 protected property as a sacred right. The National Assembly took and sold the Church's lands, but it did not seize private land. Later governments sold émigrés' lands, but they never divided land equally among the peasants."},"explanation":"Burke warned that tearing down inherited institutions and rebuilding the state from theories would lead to disorder. Conservative critics later pointed to the king's execution and the Terror as proof that he was right."},{"id":"E5-E07","set":"X2","topic":"5.9","lo":"J","skill":"5.B","difficulty":"medium","stem":"The ideas expressed in Source 1 most directly contributed to which of the following in the early 1800s?","options":{"A":"the growth of liberalism, which called for written constitutions and free trade","B":"the spread of utopian socialism, which planned new communities with shared property","C":"the rise of nationalism that called on peoples to form new states of their own","D":"the growth of conservatism, which defended tradition, religion, and slow change"},"answer":"D","rationales":{"A":"Incorrect. Liberals drew more on ideas like Paine's. Burke distrusted rights based on theory rather than tradition.","B":"Incorrect. Utopian socialists wanted to build new societies from a plan. Burke opposed remaking society by a plan.","C":"Incorrect. Burke defended existing states and their traditions. He did not call for peoples to break away and form new nations.","D":"Correct. Burke's defense of inherited institutions became a model for conservative leaders after 1815."},"explanation":"Burke is often called the father of modern conservatism. After Napoleon fell, conservative leaders used ideas like his to defend kings, the Church, and the old social order.","reasoning":"Causation"},{"id":"E5-E08","set":"X3","topic":"5.6","lo":"G","skill":"4.B","difficulty":"medium","stem":"The event shown in the painting is best understood in the context of","options":{"A":"the Spanish monarchy's harsh response to peasant revolts against high taxes","B":"Spanish resistance to French troops as Napoleon seized Spain's throne","C":"a liberal revolt that forced the Spanish king to accept a constitution","D":"the British army's capture of Madrid from French forces during the war"},"answer":"B","rationales":{"A":"Incorrect. The men in the painting were not shot by Spain's own king. Goya shows the punishment of an uprising against foreign troops.","B":"Correct. Spaniards in Madrid rose up against French troops on May 2, 1808. The next day, French firing squads shot many of them.","C":"Incorrect. Liberal army officers forced Spain's king to accept a constitution in 1820, after the painting was made.","D":"Incorrect. British forces did enter Madrid in 1812, but they did not shoot the people of the city."},"explanation":"In 1808 French troops occupied Spain, and Napoleon forced Spain's royal family to give up the throne. Madrid rose up against the French on May 2, and French troops shot captured rebels the next day. In June Napoleon made his brother Joseph king. Goya painted the scene in 1814."},{"id":"E5-E09","set":"X3","topic":"5.8","lo":"I","skill":"1.A","difficulty":"medium","stem":"The style and subject of the painting most clearly reflect which artistic movement?","options":{"A":"Neoclassicism","B":"Romanticism","C":"Baroque","D":"Realism"},"answer":"B","rationales":{"A":"Incorrect. Neoclassical painters such as Jacques-Louis David modeled their work on ancient Greece and Rome and often showed heroes acting from duty. Goya shows unnamed victims of a recent massacre.","B":"Correct. Goya uses dramatic light, a man with arms spread wide, and sympathy for ordinary victims to stir the viewer's emotions. These features fit Romanticism.","C":"Incorrect. The Baroque style was at its height in the 1600s, long before Goya painted this scene in 1814.","D":"Incorrect. Realism grew in the middle of the 1800s, decades after Goya painted this scene in 1814."},"explanation":"Goya uses dramatic light, expressive gestures, and sympathy for ordinary victims to heighten emotion. These features support calling the painting Romantic, although dramatic light and emotional subjects are not found only in Romantic art."},{"id":"E5-E10","set":"X3","topic":"5.6","lo":"G","skill":"5.B","difficulty":"medium","stem":"Resistance like that shown in the painting contributed most directly to which of the following?","options":{"A":"a long war in Spain that drained Napoleon's armies and money","B":"Napoleon's decision to give up the Continental System in order to win over Spain","C":"France's conquest of Portugal, which became a French province by 1810","D":"Britain's decision to ma
