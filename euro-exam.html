monly produce some refinements in the liberal … The same age which produces great philosophers and politicians, renowned generals and poets, usually abounds with skilful weavers, and ship-carpenters. …","The more these refined arts advance, the more sociable men become … They flock into cities; love to receive and communicate knowledge; to show their wit or their breeding; their taste in conversation or living, in clothes or furniture. Curiosity allures the wise; vanity the foolish; and pleasure both. Particular clubs and societies are everywhere formed: both sexes meet in an easy and sociable manner; and the tempers of men, as well as their behaviour, refine apace. … Thus industry, knowledge, and humanity, are linked together, by an indissoluble chain, and are found, from experience as well as reason, to be peculiar to the more polished, and, what are commonly denominated, the more luxurious ages.","Nor are these advantages attended with disadvantages that bear any proportion to them. The more men refine upon pleasure, the less will they indulge in excesses of any kind; because nothing is more destructive to true pleasure than such excesses."],"attribution":"David Hume, Scottish philosopher and historian, \"Of Refinement in the Arts,\" essay first published in 1752 under the title \"Of Luxury\"","translation":"Text from Hume's Essays Moral, Political and Literary (London: Oxford University Press, World's Classics, 1904); adapted","glossary":[{"t":"industry","d":"hard work and making things"},{"t":"the arts","d":"here, skills and crafts of every kind"},{"t":"mechanical arts","d":"practical crafts, such as weaving"},{"t":"the liberal","d":"the liberal arts: learning, science, and literature"},{"t":"allures","d":"attracts"},{"t":"apace","d":"quickly"},{"t":"humanity","d":"kindness and good manners"},{"t":"indissoluble","d":"unbreakable"},{"t":"attended with","d":"followed by"},{"t":"bear any proportion to","d":"come close in size to"}]},"P10":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/Jacques-Louis_David%2C_Le_Serment_des_Horaces.jpg/960px-Jacques-Louis_David%2C_Le_Serment_des_Horaces.jpg","width":960,"height":740,"alt":"A painting of three young men in ancient Roman armor stretching out their arms toward three swords held up by an older man, while women and children sit grieving at the right, in a stone hall with three arches.","caption":"In a plain stone hall with three arches, three brothers in ancient Roman helmets and armor stand side by side and stretch out their arms toward three swords. Their father holds the swords up in the center. At the right, the women of the family sit slumped together, weeping, while a woman in the back holds two small children close.","attribution":"Jacques-Louis David, French painter, The Oath of the Horatii, oil painting, dated 1784; completed and shown in Paris in 1785. The painting shows a scene from early Roman history","credit":"Musée du Louvre, Paris. Public domain image via Wikimedia Commons.","description":"A large oil painting with a sharp, clear style. The background is a simple stone hall with three round arches held up by plain columns. On the left, three young men in helmets with crests, short tunics, and cloaks stand close together in a line, one behind another. Each stretches an arm out straight toward the center; the man in front holds a spear in his other hand. In the center, an older bearded man in a red cloak raises three swords in one hand and lifts his other hand toward them. On the right, separate from the men, two young women sit slumped against each other with their heads bowed. Behind them, an older woman in a dark blue robe holds two small children."},"P11":{"type":"passage","paragraphs":["A propos of distempers, I am going to tell you a thing that will make you wish yourself here. The small-pox, so fatal, and so general amongst us, is here entirely harmless, by the invention of ingrafting, which is the term they give it. There is a set of old women, who make it their business to perform the operation, every autumn, in the month of September, when the great heat is abated. … the old woman comes with a nutshell full of the matter of the best sort of small-pox, and asks what vein you please to have opened. She immediately rips open that you offer to her, with a large needle, (which gives you no more pain than a common scratch) and puts into the vein as much matter as can ly upon the head of her needle …","The children or young patients play together all the rest of the day, and are in perfect health to the eighth. Then the fever begins to seize them, and they keep their beds two days, very seldom three. … Every year thousands undergo this operation … There is no example of any one that has died in it; and you may believe I am well satisfied of the safety of this experiment, since I intend to try it on my dear little son.","I am patriot enough to take pains to bring this useful invention into fashion in England; and I should not fail to write to some of our doctors very particularly about it, if I knew any one of them that I thought had virtue enough to destroy such a considerable branch of their revenue, for the good of mankind."],"attribution":"Lady Mary Wortley Montagu, English writer and wife of the British ambassador to the Ottoman Empire, letter to a friend in England, written from the Ottoman city of Adrianople (Edirne), April 1, 1717 (Old Style); first published in 1763","translation":"Text from Letters of the Right Honourable Lady M—y W—y M—e (London, 1790); adapted","glossary":[{"t":"A propos of distempers","d":"speaking of diseases"},{"t":"abated","d":"lessened"},{"t":"matter","d":"pus taken from a sore"},{"t":"ly","d":"an old spelling of \"lie\""},{"t":"to the eighth","d":"until the eighth day"},{"t":"revenue","d":"income"}]},"P12":{"type":"passage","paragraphs":["Yet the change between 1700 and 1800 was astonishing. England not only produced food for a population that had doubled itself, as well as grain for treble the number of horses, but during the first part of the period became, as M. de Lavergne* has said, the granary of Europe. … The standard of living improved. Instead of the salted carcases of half-starved and aged oxen, fresh meat began to be eaten by the peasantry. …","The great changes which English agriculture witnessed as the eighteenth century advanced, and particularly after the accession of George III. (1760), are, broadly speaking, identified with Jethro Tull, Lord Townshend, Bakewell of Dishley, Arthur Young, and Coke of Norfolk. With their names are associated the chief characteristics in the farming progress of the period, which may be summed up in the adoption of improved methods of cultivation, the introduction of new crops, the reduction of stock-breeding to a science, the provision of increased facilities of communication and of transport, and the enterprise and outlay of capitalist landlords and tenant-farmers. … Without the substitution of separate occupation for the ancient system of common cultivation, this agricultural progress was impossible. But in carrying out the necessary changes, rural society was convulsed, and its general conditions revolutionised. The divorce of the peasantry from the soil, and the extinction of commoners, open-field farmers, and eventually of small freeholders, were the heavy price which the nation ultimately paid for the supply of bread and meat to its manufacturing population."],"attribution":"Rowland E. Prothero (later Lord Ernle), British historian and politician, English Farming, Past and Present, 1912","translation":"Adapted","footnotes":[{"mark":"*","text":"Léonce de Lavergne, a French writer on farming in the 1800s"}],"glossary":[{"t":"treble","d":"three times"},{"t":"granary","d":"storehouse for grain"},{"t":"stock-breeding","d":"raising farm animals"},{"t":"outlay","d":"money spent"},{"t":"separate occupation","d":"farms held and worked by a single owner or tenant"},{"t":"common cultivation","d":"the old village system in which each family farmed scattered strips of land side by side with its neighbors"},{"t":"convulsed","d":"shaken violently"},{"t":"commoners","d":"villagers with rights to graze animals and gather wood on village land"},{"t":"freeholders","d":"farmers who owned their own land"}]},"P13":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/William_Hogarth%2C_Gin_Lane%2C_1751%2C_NGA_30433.jpg/960px-William_Hogarth%2C_Gin_Lane%2C_1751%2C_NGA_30433.jpg","width":960,"height":1150,"alt":"A crowded black-and-white engraving of a London street with ruined buildings. In front, a drunken woman sitting on steps lets her baby fall over a railing. Around her, people drink, fight, pawn their goods, and lie ill.","caption":"A crowded street in a poor part of London. In front, a woman with sores on her legs sits on a stairway, taking snuff as her baby falls over the railing. Below her, a very thin man slumps against the wall with a cup in his hand. At the upper left, people hand over tools and a kettle at a pawnbroker's shop. Behind, a crowd drinks and fights outside a shop with a sign shaped like a mug, buildings fall apart, and a body is laid in a coffin in the street. A sign over a cellar door at lower left reads \"Drunk for a Penny, Dead drunk for two pence, Clean Straw for Nothing.\" A church steeple rises in the distance. Lines of verse under the picture begin \"Gin, cursed Fiend, with Fury fraught, / Makes human Race a Prey.\"","attribution":"William Hogarth, English painter and printmaker, Gin Lane, etching and engraving published in London, 1751","credit":"National Gallery of Art, Washington. Public domain image via Wikimedia Commons.","description":"A detailed black-and-white engraving of a London street. In the front center, a half-dressed woman with sores on her legs sits on a staircase taking snuff as her baby slips out of her arms and falls over the stair railing. At the bottom right, a skeleton-thin man sits slumped with a cup and a basket. At the bottom left, a man and a dog gnaw on the same bone, and a large mug labeled \"Gin Royal\" hangs over a cellar door with a sign about being drunk for a penny. At the upper left, a carpenter and a woman hand a saw and a kettle to a pawnbroker. In the middle of the street, crowds drink and fight, and a woman's body is laid in a coffin. On the right, houses are falling down, and in an upper room of a ruined house a body hangs from a beam. In the distance, a church steeple stands above the rooftops. Verses are printed under the picture."},"P14":{"type":"passage","paragraphs":["We have remarked that men have granted preeminence to one of their equals, in expectation that he should do them certain services. These services consist in the maintenance of the laws, a strict execution of justice, an employment of his whole powers to prevent any corruption of manners, and defending the State against its enemies. It is the duty of this magistrate to pay attention to agriculture; it should be his care that provisions for the nation should be in abundance, and that commerce and industry should be encouraged. He is a perpetual sentinel, who must watch the acts and the conduct of the enemies of the State. …","Princes and monarchs, therefore, are not invested with supreme authority that they may, with impunity, riot in debauchery and voluptuousness. …","But neither politics nor the army can prosper if the finances are not kept in the greatest order, and if the prince himself be not a prudent economist. …","The monarch is only the first servant of the State, who is obliged to act with probity and prudence, and to remain as totally disinterested as if he were each moment liable to render an account of his administration to his fellow-citizens."],"attribution":"Frederick II, king of Prussia from 1740 to 1786, \"Essay on the Forms of Government and on the Duties of Sovereigns,\" written in French in 1777","translation":"Translated by Thomas Holcroft in Posthumous Works of Frederic II, King of Prussia, vol. 5 (London, 1789), as printed in James Harvey Robinson and Charles A. Beard, Readings in Modern European History, vol. 1 (1908); adapted","glossary":[{"t":"preeminence","d":"the highest rank"},{"t":"corruption of manners","d":"bad behavior and loss of good morals"},{"t":"magistrate","d":"here, the ruler"},{"t":"sentinel","d":"guard"},{"t":"with impunity","d":"without being punished"},{"t":"debauchery and voluptuousness","d":"wild living and a love of pleasure"},{"t":"probity","d":"honesty"},{"t":"disinterested","d":"not acting for his own gain"}]},"P15":{"type":"passage","paragraphs":["In almost all the towns the exercise of the different arts and trades is concentrated in the hands of a small number of masters, united in corporations, who alone can, to the exclusion of all other citizens, make or sell the articles belonging to their particular industry. Any person who, by inclination or necessity, intends following an art or trade can only do so by acquiring the mastership … after a probation as long and vexatious as it is superfluous. By having to satisfy repeated exactions, the money he had so much need of in order to start his trade or open his workshop has been consumed in mere waste. …","Citizens of all classes are deprived both of the right to choose the workmen they would employ, and of the advantages they would enjoy from competition operating toward improvements in manufacture and reduction in price. …","Thus the effects of these establishments are, first, as regards the state, a vast tyranny over trade and industrial work; second, as regards the great body of the people, a loss of wages and the means of subsistence; third, in respect to the inhabitants of towns in general, a slavery to exclusive privileges equivalent to a real monopoly …"],"attribution":"Anne-Robert-Jacques Turgot, controller general of finances for King Louis XVI of France, preamble to the royal edict abolishing the guilds, February 1776","translation":"Translated in James Harvey Robinson and Charles A. Beard, Readings in Modern European History, vol. 1 (1908); adapted","glossary":[{"t":"arts and trades","d":"crafts and businesses"},{"t":"corporations","d":"guilds: groups of master craftsmen who controlled a trade in a town"},{"t":"mastership","d":"the rank of master in a guild"},{"t":"probation","d":"a period of testing"},{"t":"vexatious","d":"annoying and troublesome"},{"t":"superfluous","d":"not needed"},{"t":"exactions","d":"fees that are demanded"},{"t":"subsistence","d":"the things people need to live"}]},"P16":{"type":"passage","paragraphs":["There are some who say that, if we treated with paternal indulgence those erring brethren who pray to God in bad French [instead of bad Latin], we should be putting weapons in their hands, and would once more witness the battles of Jarnac, Moncontour, Coutras, Dreux, and St. Denis*. I do not know anything about this, as I am not a prophet; but it seems to me an illogical piece of reasoning to say: \"These men rebelled when I treated them ill, therefore they will rebel when I treat them well.\" …","The Huguenots, it is true, have been as inebriated with fanaticism and stained with blood as we. But are this generation as barbaric as their fathers? Have not time, the progress of reason, good books, and the humanising influence of society had an effect on the leaders of these people? And do we not perceive that the aspect of nearly the whole of Europe has been changed within the last fifty years? …","The rage that is inspired by the dogmatic spirit and the abuse of the Christian religion, wrongly conceived, has shed as much blood and led to as many disasters in Germany, England, and even Holland, as in France. Yet religious difference causes no trouble to-day in those States. The Jew, the Catholic, the Greek, the Lutheran, the Calvinist, the Anabaptist, the Socinian, the Memnonist, the Moravian, and so many others, live like brothers in these countries, and contribute alike to the good of the social body. …"],"attribution":"Voltaire, French writer, Treatise on Toleration, 1763","translation":"Translated by Joseph McCabe in Voltaire, Toleration and Other Essays (New York, 1912); the words in brackets are McCabe's; adapted","footnotes":[{"mark":"*","text":"battles fought between Catholics and Huguenots (French Calvinists) from 1562 to 1587, during the French Wars of Religion, which lasted until 1598"}],"glossary":[{"t":"paternal indulgence","d":"the gentle patience of a father"},{"t":"erring brethren","d":"brothers who have gone wrong"},{"t":"inebriated","d":"drunk"},{"t":"fanaticism","d":"wild, extreme belief that does not listen to reason"},{"t":"the Greek","d":"a member of the Greek Orthodox Church"},{"t":"Socinian, Memnonist, Moravian","d":"members of small Protestant groups; \"Memnonist\" is a variant spelling referring to a Mennonite"}]}},"practice":[{"id":"E4-P01","set":"P1","topic":"4.2","lo":"B","skill":"3.C","difficulty":"easy","stem":"Which of the following best describes a difference between the two sources?","options":{"A":"Bacon builds up from observed facts to general rules, while Descartes reasons step by step from clear ideas.","B":"Bacon trusts the ancient philosophers as guides, while Descartes rejects the teachings of the ancient writers.","C":"Bacon says mathematics is the key to knowledge, while Descartes says knowledge must come from experiments.","D":"Bacon writes to defend religious faith, while Descartes writes to show that faith and reason cannot agree."},"answer":"A","explanation":"Bacon wants people to climb \"gradually\" from facts gathered by the senses to general rules. This is called induction. Descartes wants to accept only what is clear beyond doubt and then reason in small steps, as in geometry. This is called deduction.","whyNot":{"B":"Bacon does not praise the ancients. He calls the way \"now in use\" the wrong way and offers a new one.","C":"This mixes up the two writers. Descartes praises the \"chains of simple and easy reasonings\" used in geometry.","D":"Neither excerpt is about faith. Both are about how to find true knowledge."},"hint":"Look at where each writer begins. Does Bacon start with facts or with big ideas? What does Descartes start with?"},{"id":"E4-P02","set":"P1","topic":"4.2","lo":"B","skill":"3.C","difficulty":"medium","stem":"Both authors would most likely agree that","options":{"A":"knowledge of nature should be studied mainly in the universities that trained the clergy and lawyers of Europe","B":"mathematics is of little use to people who want to understand how nature works","C":"scholars should follow a careful new method instead of accepting what earlier authorities taught","D":"the senses are the most reliable guide to knowledge and do not need to be checked by reason"},"answer":"C","explanation":"Bacon and Descartes each offered a new way to find truth. Both refused to simply trust Aristotle and other old writers. That break with the past helped start the Scientific Revolution.","whyNot":{"A":"Neither writer praises the universities of his day. Bacon says the usual way of finding truth is the wrong one.","B":"Descartes builds his method on the reasoning of geometers, so he would not agree.","D":"Descartes says to accept only what is clear beyond doubt, and Bacon's bee \"works and fashions\" what it gathers. Both want reason to check the senses."},"hint":"Both men describe a way of thinking. What were they both trying to replace?","reasoning":"Comparison"},{"id":"E4-P03","set":"P1","topic":"4.7","lo":"I","skill":"5.B","difficulty":"medium","stem":"The methods described in the two sources contributed most directly to","options":{"A":"the development of the scientific method, which joined careful observation and experiment with mathematics","B":"a revival of Aristotle's ideas about nature in the universities of Europe during the 1700s","C":"the Catholic Church's decision to accept the idea that the Earth moves around the Sun in the 1630s","D":"the end of interest in alchemy and astrology among educated Europeans by the late 1600s"},"answer":"A","explanation":"Later scientists, such as Newton, used experiments, as Bacon urged, and mathematics, as Descartes urged. Together these ideas shaped the scientific method.","whyNot":{"B":"Thinkers who used these new methods turned away from Aristotle's ideas about nature.","C":"In 1633 the Church put Galileo on trial for teaching that the Earth moves. It did not accept the idea then.","D":"Many educated people, including Isaac Newton, kept studying alchemy after 1650. Interest in it faded slowly."},"hint":"One writer stresses facts from the senses and the other stresses math. What happens when you put them together?","reasoning":"Causation"},{"id":"E4-P04","set":"P2","topic":"4.2","lo":"B","skill":"3.B","difficulty":"easy","stem":"In the passage, which evidence does Harvey use to support his idea that the blood moves in a circle?","options":{"A":"Galen's writings describe the heart as a pump that moves blood through the whole body.","B":"The heart sends out more blood in a short time than the food a person eats could make.","C":"Patients who had been bled by doctors reported that their pulse grew stronger afterward.","D":"Ancient texts teach that blood, like water and air, follows the circular motion of the heavens."},"answer":"B","explanation":"Harvey thought about how much blood passes through the heart and how fast. Food could not make that much new blood. So he decided that the same blood must return to the heart again and again.","whyNot":{"A":"Galen did not describe the heart as a pump; Harvey's own studies showed that it works like one. In the passage, Harvey does not use Galen to support his idea.","C":"Harvey does not mention patients or bleeding. He reasons about how much blood the heart moves.","D":"In the passage, Harvey supports his idea with his own reasoning about the amount of blood, not with ancient texts. He calls his idea \"novel and unheard-of.\""},"hint":"Reread the long sentence in the second paragraph. What did Harvey think about \"the quantity of blood\"?"},{"id":"E4-P05","set":"P2","topic":"4.2","lo":"B","skill":"5.A","difficulty":"medium","stem":"Harvey's conclusion most directly challenged which earlier idea?","options":{"A":"Vesalius's drawings of human anatomy, which were based on his own dissections of bodies","B":"Paracelsus's view that sickness should be treated with medicines made from minerals","C":"Galen's teaching that the liver keeps making new blood from food, which the body then uses up","D":"Copernicus's argument that the Earth and the other planets move in circles around the Sun"},"answer":"C","explanation":"Galen, an ancient Greek doctor, taught that the liver made new blood from food and the body used it up. For about 1,400 years, doctors accepted his idea. Harvey showed that the same blood circulates.","whyNot":{"A":"Vesalius also learned from dissections, as Harvey did. Harvey built on his work rather than challenging it.","B":"Paracelsus's medicines are a different topic. Harvey is writing about how blood moves.","D":"Copernicus wrote about the heavens, not the body. Harvey's \"circle\" is the path of the blood."},"hint":"Harvey says food could not supply all that blood. Whose idea about where blood comes from does that go against?","reasoning":"Comparison"},{"id":"E4-P06","set":"P2","topic":"4.1","lo":"A","skill":"4.A","difficulty":"medium","stem":"Harvey's fear that \"mankind at large\" will be his enemies is best explained by","options":{"A":"a ban by the Catholic Church on cutting open human bodies for medical study","B":"Parliament's power to decide which books English physicians could publish and sell in London","C":"the respect that physicians and universities still gave to ancient medical writers","D":"a law in England that made it illegal to experiment on living animals"},"answer":"C","explanation":"In Harvey's time, doctors still learned medicine mostly from Galen and other ancient writers. Harvey says \"wont and custom\" and \"respect for antiquity\" shape what people believe. So he expected doctors to reject a new idea.","whyNot":{"A":"Anatomists cut open human bodies in public lessons in this period. Vesalius had done so in Padua in the 1530s and 1540s.","B":"In Harvey's time, the Crown and Church officials, not Parliament, licensed books in England, and Harvey had this book printed in Frankfurt, Germany. His stated worry is respect for ancient teachings.","D":"No such law existed. In his book, Harvey describes his own experiments on living animals."},"hint":"Reread the words Harvey uses for why people will resist him: \"wont,\" \"custom,\" and \"antiquity.\""},{"id":"E4-P07","set":"P3","topic":"4.3","lo":"D","skill":"2.B","difficulty":"medium","stem":"Voltaire's main purpose in comparing the treatment of Descartes and Newton was most likely to","options":{"A":"criticize France by praising the freedom that English thinkers enjoyed","B":"prove that Descartes's ideas about the universe were better than Newton's","C":"urge the French king to found a scientific academy like England's Royal Society","D":"persuade scientists to stay out of arguments about religion"},"answer":"A","explanation":"Voltaire shows that England buried Newton like a king, while Descartes was falsely called an atheist. He says Newton was lucky to live \"in a country of liberty.\" Readers in France would see the contrast with their own country.","whyNot":{"B":"Voltaire calls Newton the \"destroyer of the Cartesian system.\" He sides with Newton's ideas.","C":"France already had a royal Academy of Sciences, founded in 1666. Voltaire compares how freely each country let its thinkers work and how it honored them.","D":"Voltaire does not tell scientists to avoid religion. He says Descartes was unfairly attacked by religious critics."},"hint":"Voltaire was a French writer. How would his French readers feel when he praised England?"},{"id":"E4-P08","set":"P3","topic":"4.7","lo":"I","skill":"5.B","difficulty":"medium","stem":"Writers such as Voltaire contributed most directly to the Enlightenment by","options":{"A":"carrying out the careful experiments that first proved Newton's laws of motion were correct","B":"founding the Royal Society in London to pay for Newton's research","C":"persuading the Catholic Church to teach Newton's physics in its schools in the 1730s","D":"spreading Newton's ideas to a wide reading public and using them to question tradition"},"answer":"D","explanation":"Voltaire explained Newton's science in lively, easy language. He used it to show that reason could replace old beliefs. Writing like his helped carry the Scientific Revolution into the Enlightenment.","whyNot":{"A":"Voltaire did carry out some scientific experiments, but the contribution shown here is his explaining and promoting Newton's ideas for readers.","B":"The Royal Society was founded in 1660, before Voltaire was born.","C":"The passage shows ideas spreading through writing, not a change in what Catholic schools taught. In fact, Voltaire's Letters were banned and burned in Paris in 1734."},"hint":"How could a writer help scientific ideas reach people who did not do scientific research themselves?","reasoning":"Causation"},{"id":"E4-P09","set":"P3","topic":"4.2","lo":"B","skill":"1.A","difficulty":"easy","stem":"The \"attraction\" that Voltaire says Newton used to explain nature refers to","options":{"A":"magnetism, which Kepler thought might steer the planets in their paths around the Sun","B":"inertia, a body's tendency to keep moving in a straight line","C":"universal gravitation, a force by which all bodies pull on one another","D":"the crystal spheres that carried the planets in Aristotle's universe"},"answer":"C","explanation":"Newton said the same force, gravity, pulls the Moon toward the Earth and the sea toward the Moon. Voltaire mentions the tides as an example. One set of laws explained motion on Earth and in the heavens.","whyNot":{"A":"Kepler did wonder if a magnetic force moved the planets, but Newton's attraction is gravity.","B":"Inertia is one of Newton's ideas, but it is not a pull between bodies. It does not explain the tides.","D":"Crystal spheres were part of the old picture of the heavens that Newton's work replaced."},"hint":"Voltaire links Newton's \"attraction\" to the Moon and the tides. Which of Newton's ideas explains how the Moon can pull on the sea?"},{"id":"E4-P10","set":"P4","topic":"4.3","lo":"D","skill":"3.A","difficulty":"easy","stem":"Locke's main argument in the passage is that","options":{"A":"kings receive their power directly from God and answer to God, not their subjects, for how they rule","B":"governments get their power from the people's consent and lose it if they abuse that power","C":"people living without a government follow no rules and have no rights that others must respect","D":"a ruler with complete power is needed to keep people from falling into a constant war against one another"},"answer":"B","explanation":"Locke says people are born \"free, equal, and independent.\" They join a government only by their own consent, to protect their lives, liberty, and property. If rulers attack those rights, the people may set up a new government.","whyNot":{"A":"This is the divine-right idea of writers like Bishop Bossuet. Locke says power comes from \"consent.\"","C":"Locke says the state of nature has \"a law of nature to govern it.\"","D":"This is close to Thomas Hobbes's view. Locke says the people may resist rulers who use \"arbitrary power.\""},"hint":"Find the word Locke uses for how a person comes under someone's political power."},{"id":"E4-P11","set":"P4","topic":"4.1","lo":"A","skill":"4.B","difficulty":"medium","stem":"Locke's ideas in the passage were most directly shaped by","options":{"A":"the Thirty Years' War between Catholic and Protestant states in the Holy Roman Empire","B":"Louis XIV's efforts to bring the French nobles under his control at Versailles","C":"conflicts in England over whether Parliament or the Stuart kings held supreme power","D":"the revolt of the Dutch provinces against the rule of the Spanish king in the 1500s"},"answer":"C","explanation":"England fought a civil war in the 1640s over the king's power. During the Glorious Revolution of 1688–1689, James II fled England, and Parliament offered the crown to William and Mary in 1689. Locke's book, published in 1690, was used to defend that change.","whyNot":{"A":"The Thirty Years' War ended in 1648. Locke's arguments respond to quarrels between English kings and Parliament.","B":"Louis XIV built strong royal power in France. Locke is answering a question that divided England.","D":"The Dutch Revolt began in the 1560s, more than a century before Locke wrote. English events of the 1600s mattered far more to him."},"hint":"Locke was English, and his book came out in 1690. What had just happened to England's king?","reasoning":"Causation"},{"id":"E4-P12","set":"P4","topic":"4.7","lo":"I","skill":"5.B","difficulty":"easy","stem":"Ideas like those in the passage were later used most directly to justify","options":{"A":"the American and French revolutions in the late 1700s","B":"Frederick II's claim that a king is the first servant of the state","C":"Louis XIV's decision to end the toleration of French Protestants","D":"Catherine II's plan for a new law code to strengthen her rule"},"answer":"A","explanation":"Locke's ideas about natural rights and consent show up in the Declaration of Independence of 1776. They also show up in France's Declaration of the Rights of Man of 1789. Both revolutions claimed the people could replace a government that broke their trust.","whyNot":{"B":"Frederick kept full power for himself. He did not say the people could replace their ruler.","C":"Louis XIV took rights away from Protestants in 1685. That is the kind of rule Locke opposed.","D":"Catherine kept absolute power for herself. Locke argued that rulers who abuse their power can be replaced."},"hint":"Locke says the people may set up \"a new legislative.\" Which later events did people defend with that idea?","reasoning":"Causation"},{"id":"E4-P13","set":"P5","topic":"4.3","lo":"C","skill":"3.A","difficulty":"easy","stem":"According to Montesquieu, liberty depends on","options":{"A":"giving the powers of government to a single assembly elected by the people","B":"letting judges make the laws so that kings cannot act like tyrants","C":"keeping the powers to make, carry out, and judge laws in separate hands","D":"placing power in the hands of a wise prince who governs by reason and justice"},"answer":"C","explanation":"Montesquieu describes three powers: making laws, carrying them out, and judging cases. He says that when one person or group holds them all, tyranny follows. This idea is called the separation of powers.","whyNot":{"A":"Montesquieu warns against giving the three powers to one body, \"whether of the nobles or of the people.\"","B":"He says there is \"no liberty if the judiciary power be not separated from the legislative and executive.\" Judges who made laws would join two powers.","D":"He says there is \"no liberty\" when one person holds both the lawmaking and the executive powers."},"hint":"What does Montesquieu say happens when the powers are \"united\"?"},{"id":"E4-P14","set":"P5","topic":"4.3","lo":"C","skill":"2.B","difficulty":"medium","stem":"Montesquieu most likely uses the example of \"Turkey\" in order to","options":{"A":"warn European readers that concentrating power could threaten their own liberty","B":"show that liberty depended on a ruler's Christian rather than Muslim faith","C":"justify rulers' control of the courts as a safeguard against tyranny","D":"demonstrate that large, expanding empires required stronger central governments than small states"},"answer":"A","explanation":"Montesquieu uses the sultan as an example of a ruler who holds all three powers. The example supports his warning that liberty is in danger whenever making, carrying out, and judging laws are combined. Many European writers of his time pictured Asian empires this way.","whyNot":{"B":"Montesquieu ties oppression to how power is combined, not to the ruler's religion.","C":"Montesquieu says the opposite: there is \"no liberty\" when the judging power is joined to the other powers.","D":"In this passage, Montesquieu does not discuss the size of empires. He blames the sultan's oppression on joining all three powers in one person."},"hint":"Montesquieu writes for European readers. What lesson did he want them to draw from the sultan's power?"},{"id":"E4-P15","set":"P5","topic":"4.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"Montesquieu's ideas in the passage most directly influenced","options":{"A":"Catherine II's decision to share her power with an elected Russian assembly","B":"the Physiocrats' call to free the grain trade from government rules in France","C":"the English Parliament's decision after 1689 to let the king make laws without its approval","D":"the writers of the United States Constitution, who divided power among three branches"},"answer":"D","explanation":"The United States Constitution of 1787 split power among Congress, the president, and the courts. Its writers often quoted Montesquieu. They hoped that dividing power would protect liberty.","whyNot":{"A":"Catherine's 1767 commission only gave her advice on laws. She kept her absolute power.","B":"The Physiocrats wrote about trade and farming. Montesquieu writes about how to divide the power of government.","C":"Parliament did not give up its lawmaking power. After 1689, kings needed Parliament's approval for laws."},"hint":"Think about which later lawmakers said they had read The Spirit of the Laws.","reasoning":"Causation"},{"id":"E4-P16","set":"P6","topic":"4.3","lo":"C","skill":"1.B","difficulty":"medium","stem":"Beccaria's argument best reflects the Enlightenment belief that","options":{"A":"punishments should match how sinful a crime is in the eyes of God and the Church","B":"the best laws are the oldest ones, because custom shows what has worked over time","C":"people accused of crimes should be tried by courts made up of nobles and clergy","D":"laws and punishments should be judged by reason and by how well they serve society"},"answer":"D","explanation":"Beccaria asks what punishment is for. He says its purpose is to prevent crime, not to cause pain. He uses reason to show that torture and the death penalty do more harm than good.","whyNot":{"A":"Beccaria does not judge crimes as sins. He asks what punishment is useful for society.","B":"Beccaria judges punishments by whether they prevent crime, not by how old they are. He asks whether it is not \"absurd\" for the law to put people to death.","C":"Beccaria says nothing about who should sit on the courts. He writes about the purpose of punishment."},"hint":"Beccaria asks whether punishments are useful. What does that tell you about how he tests a law?"},{"id":"E4-P17","set":"P6","topic":"4.6","lo":"G","skill":"2.B","difficulty":"medium","stem":"Beccaria's praise of the \"benevolent monarchs\" on Europe's thrones suggests that he hoped","options":{"A":"the people would overthrow kings who refused to change the laws","B":"judges would be free to choose punishments case by case, using their own sense of justice","C":"powerful rulers would use their power to make his reforms","D":"elected assemblies would soon replace kings as the lawmakers of Europe's states"},"answer":"C","explanation":"Many Enlightenment writers hoped that strong rulers would make reforms from the top. Beccaria calls Europe's kings \"fathers of their people.\" He wanted them to rewrite the laws.","whyNot":{"A":"Beccaria praises Europe's monarchs. He does not call for revolution.","B":"Beccaria wanted clear, fixed laws made by lawmakers. He did not want judges to decide punishments by their own opinions.","D":"Beccaria praises the monarchs themselves. He does not ask for assemblies to take their place."},"hint":"Reread the last paragraph. What does Beccaria say would make mankind \"happy,\" and whom does he see on Europe's thrones?"},{"id":"E4-P18","set":"P6","topic":"4.6","lo":"G","skill":"5.B","difficulty":"medium","stem":"Which of the following most directly reflects the influence of ideas like Beccaria's?","options":{"A":"Frederick II's order bringing back torture in Prussian courts during the Seven Years' War","B":"Louis XV's use of royal orders to jail critics in France without any trial","C":"England's increase in the number of crimes punished by death in the 1700s","D":"Joseph II's law code of 1787, which ended the death penalty for most crimes in Austria"},"answer":"D","explanation":"Beccaria's book was read across Europe. Enlightened rulers changed their laws. Leopold of Tuscany ended the death penalty in 1786, and his brother Joseph II limited it in Austria in 1787.","whyNot":{"A":"Frederick II abolished torture in most cases soon after he became king in 1740. He did not bring it back.","B":"Jailing people without trial goes against Beccaria's rule that no one is a criminal until found guilty.","C":"England's harsh laws went in the opposite direction from Beccaria's ideas."},"hint":"Beccaria opposed torture and the death penalty. Did each ruler follow or reject that advice?","reasoning":"Causation"},{"id":"E4-P19","set":"P7","topic":"4.3","lo":"D","skill":"1.A","difficulty":"easy","stem":"The gatherings Marmontel describes are best understood as an example of","options":{"A":"scientific academies, whose members met formally to discuss research","B":"Masonic lodges, where members swore to keep their meetings secret","C":"salons, where hosts brought writers, artists, and nobles together to talk","D":"lending libraries, which let readers borrow books for a small fee"},"answer":"C","explanation":"In Paris, wealthy women hosted salons in their homes. Writers, artists, and nobles met there to share and debate ideas. Madame Geoffrin's salon was one of the most famous.","whyNot":{"A":"Academies were formal bodies with elected members and rules. Madame Geoffrin's dinners were private gatherings in her own home.","B":"Marmontel describes private dinners hosted by Madame Geoffrin, not a lodge with formal membership and secret rituals.","D":"A library lends books. Marmontel describes dinners where guests talked."},"hint":"Who is the host, and where do the guests meet?"},{"id":"E4-P20","set":"P7","topic":"4.3","lo":"D","skill":"3.A","difficulty":"medium","stem":"Marmontel suggests that Madame Geoffrin's main skill as a host was","options":{"A":"keeping the talk lively while making sure it stayed within limits","B":"explaining the newest scientific theories to her guests over dinner each week","C":"protecting her guests from arrest by the king's censors","D":"writing reviews of her guests' books for Paris journals"},"answer":"A","explanation":"Marmontel says her \"great art\" was \"presiding\" over guests who loved freedom. With a word or a gesture she pulled back anyone who went too far. She let people talk but kept order.","whyNot":{"B":"Marmontel says she had \"no knowledge either of the arts or of literature.\"","C":"The passage does not mention censors or arrests.","D":"Marmontel does not say she wrote anything. He praises how she ran the conversation."},"hint":"Find the words \"her great art.\" What does Marmontel say comes next?"},{"id":"E4-P21","set":"P7","topic":"4.3","lo":"D","skill":"5.B","difficulty":"medium","stem":"Gatherings like the ones Marmontel describes contributed to the Enlightenment mainly by","options":{"A":"giving some wealthy women a leading role in sharing new ideas","B":"replacing printed books and journals as the main way new ideas reached readers","C":"letting artisans and shopkeepers debate new ideas as equals with nobles and writers","D":"ending the French government's censorship of books and newspapers"},"answer":"A","explanation":"Salon hostesses chose the guests and guided the talk. Women such as Madame Geoffrin helped spread new ideas this way. At the time, French women could not attend universities or hold government offices.","whyNot":{"B":"Salon guests discussed books and journals. Salons added to print; they did not replace it.","C":"Salons were private, invitation-only gatherings of writers, artists, and nobles. Artisans and shopkeepers met in taverns, clubs, and coffeehouses instead.","D":"France still censored books. The Encyclopédie was banned in 1759."},"hint":"Who came to these dinners, and who did not? How could talk at such dinners spread new ideas?","reasoning":"Causation"},{"id":"E4-P22","set":"P8","topic":"4.5","lo":"F","skill":"3.A","difficulty":"easy","stem":"Macaulay's main claim about the coffee houses is that they","options":{"A":"took over Parliament's job of making laws for London while no Parliament was sitting","B":"were meant for nobles and great merchants who could pay high prices for coffee","C":"were places where public opinion took shape when other ways to voice it were limited","D":"served mainly as offices where merchants arranged trade with the Ottoman Empire"},"answer":"C","explanation":"Macaulay argues that coffee houses gave Londoners key places to share news and voice political opinions when other outlets were limited. His mention of \"the modern newspaper\" compares the 1680s with the press of his own time, the 1800s. Newspapers such as the official London Gazette already existed in England.","whyNot":{"A":"Macaulay says the coffee houses voiced public opinion, not that they made laws. The Court even tried to close them.","B":"Macaulay says anyone who paid \"his penny at the bar\" could come in.","D":"The first coffee house was started by a Turkey merchant, but Macaulay says people came to discuss the news."},"hint":"Look at the end of the first paragraph. What does Macaulay call the coffee houses?"},{"id":"E4-P23","set":"P8","topic":"4.1","lo":"A","skill":"4.A","difficulty":"medium","stem":"The rise of the coffee houses Macaulay describes was made possible in part by","options":{"A":"the Agricultural Revolution, which had freed most English workers from farm labor by the 1680s","B":"the growth of European trade with Asia, Africa, and the Americas, which brought new goods","C":"the repeal of the Navigation Acts, which had limited the goods that could enter England","D":"the restoration of Charles II in 1660, which ended a Puritan ban on coffee drinking"},"answer":"B","explanation":"Coffee came to Europe through trade with the Ottoman Empire, and later from colonies in Asia and the Americas. Growing trade made coffee, tea, sugar, and tobacco cheap enough for many people. That helped coffee houses spread.","whyNot":{"A":"In the 1680s most English people still worked on farms. The big changes in farming came later.","C":"The Navigation Acts stayed in force until 1849.","D":"There was no Puritan ban on coffee. London's first coffee houses opened in the 1650s, when England was a Puritan-led republic."},"hint":"Where did the coffee come from? How did it get to London?"},{"id":"E4-P24","set":"P8","topic":"4.3","lo":"D","skill":"5.B","difficulty":"medium","stem":"In the 1700s, places like the coffee houses Macaulay describes contributed most directly to","options":{"A":"a decline in London's importance as a center of trade and banking","B":"the end of censorship in most countries of continental Europe","C":"the growth of Puritan opposition to the Church of England","D":"the spread of Enlightenment ideas through print and conversation"},"answer":"D","explanation":"Coffee houses kept newspapers and journals for customers to read. People there discussed new books and ideas. This helped carry the Enlightenment beyond a small group of thinkers.","whyNot":{"A":"London grew as a center of trade and banking in the 1700s. Merchants often did business in coffee houses.","B":"Censorship lasted in France, Austria, and other countries through the 1700s.","C":"Macaulay says every religious group had its own coffee houses, but the Puritans' main fight with the Church of England came earlier, in the 1600s."},"hint":"What did people do in the coffee houses besides drink coffee?","reasoning":"Causation"},{"id":"E4-P25","set":"P9","topic":"4.5","lo":"F","skill":"3.A","difficulty":"medium","stem":"Hume's main argument is that","options":{"A":"a love of comfort and fine goods makes people more hard-working, sociable, and knowledgeable","B":"luxury makes people lazy and selfish and in time weakens the nation that allows it","C":"governments should limit the import of foreign luxury goods to protect their own workers","D":"learning grows best in simple farming societies where people live apart from one another"},"answer":"A","explanation":"Hume says industry, knowledge, and humanity are \"linked together.\" When people make and buy fine goods, they also meet in clubs, share ideas, and treat one another better. He defends luxury against those who called it sinful.","whyNot":{"B":"Hume argues the opposite. He says the \"luxurious ages\" are the ones with the most industry and humanity.","C":"Hume does not discuss trade rules or imports.","D":"Hume says people grow more sociable and learned when they \"flock into cities.\""},"hint":"Hume names three things that are \"linked together.\" What are they?"},{"id":"E4-P26","set":"P9","topic":"4.5","lo":"F","skill":"4.B","difficulty":"medium","stem":"Hume's essay is best understood in the context of","options":{"A":"new guild rules in British towns that limited how many goods craftsmen could make and sell","B":"a consumer revolution in which more families bought goods such as mirrors and porcelain","C":"laws in Britain that limited silk and other costly fabrics to the nobility","D":"a long drop in British trade caused by the wars of Louis XIV against the Dutch"},"answer":"B","explanation":"In the 1700s, more middle-class families could buy new goods for their homes, such as porcelain dishes, cotton cloth, and mirrors. Hume mentions people showing their taste \"in clothes or furniture.\" His essay defends this new way of living.","whyNot":{"A":"Guilds were losing power in Britain in the 1700s. Trade and crafts were growing more free.","C":"Laws like this, called sumptuary laws, had mostly faded in Britain by the 1700s, as more people bought fine goods.","D":"British trade grew after 1713. Hume writes about a time of growing wealth."},"hint":"Hume mentions \"clothes or furniture.\" What was happening to what people bought in the 1700s?"},{"id":"E4-P27","set":"P9","topic":"4.5","lo":"F","skill":"3.D","difficulty":"medium","stem":"Which of the following, if true, would most challenge Hume's claim that refinement leads people to \"indulge\" less in excess?","options":{"A":"Reading clubs and debating societies spread to many British towns and cities during the 1700s.","B":"Britain fought several costly wars against France for colonies and trade during the 1700s.","C":"Potters such as Josiah Wedgwood made fine plates and vases for middle-class buyers across Britain.","D":"Wealthy Londoners who bought fine goods and joined fashionable clubs often drank and gambled heavily."},"answer":"D","explanation":"Hume says that the more people refine their pleasures, \"the less will they indulge in excesses of any kind.\" If the very people who enjoyed fine goods and polite clubs also drank and gambled heavily, that would go against the link he describes.","whyNot":{"A":"Reading clubs fit Hume's claim that \"clubs and societies are everywhere formed.\"","B":"These wars are true, but they do not show whether refined people grew more or less excessive in their habits.","C":"Fine pottery for middle-class buyers fits Hume's picture of refined taste spreading."},"hint":"Identify the link Hume predicts. Which choice would show the opposite link among the people he describes?"},{"id":"E4-P28","set":"P10","topic":"4.5","lo":"F","skill":"1.A","difficulty":"easy","stem":"The painting is an example of which artistic style?","options":{"A":"Baroque","B":"Neoclassicism","C":"Romanticism","D":"Rococo"},"answer":"B","explanation":"Neoclassical artists copied the clean lines and plain settings of ancient art. David chose a story from early Rome. The brothers' oath shows citizens putting their country first.","whyNot":{"A":"Baroque art of the 1600s used swirling motion, rich color, and dramatic light, often to glorify the Church and kings. David's figures stand still in a plain, orderly space.","C":"Romantic painters came later, in the early 1800s, and stressed strong feeling, wild nature, and the individual. David shows a planned, orderly scene of duty.","D":"Rococo paintings show light, playful scenes of aristocrats. David's painting is serious and stern."},"hint":"Look at the clothing, the setting, and the story in the title. What time period do they come from?"},{"id":"E4-P29","set":"P10","topic":"4.5","lo":"F","skill":"3.A","difficulty":"medium","stem":"The contrast between the brothers and the grieving women most directly supports which message?","options":{"A":"The comforts of private family life matter more than public affairs and politics.","B":"Women should take part in public life as equals of men.","C":"Religious faith gives people the courage to face death in battle.","D":"Duty to one's country can demand sacrifices that bring suffering to families."},"answer":"D","explanation":"The brothers' firm, straight arms contrast with the women's slumped bodies and tears. The contrast shows the personal cost of serving the state. The French royal government paid for the painting, so its message about civic duty did not mean that David opposed the monarchy.","whyNot":{"A":"The painting shows the women's grief, but the men turn away from the family to take their oath.","B":"The painting sets the women apart in private grief while the men act for the state. Like many works of its time, it treats public duty as men's role.","C":"The brothers swear on swords held by their father, not on a cross or holy book. Neoclassical art stressed duty to the state, not religious faith."},"hint":"Compare the two groups. What are the men doing, and how do the women react?"},{"id":"E4-P30","set":"P10","topic":"4.5","lo":"F","skill":"5.B","difficulty":"medium","stem":"Compared with Baroque paintings of the 1600s, this painting places greater emphasis on","options":{"A":"the glory of the French king, shown through ancient heroes who stood for the monarch himself","B":"rich color and dramatic contrasts of light and shadow","C":"intense emotion, shown through the weeping women at the right","D":"civic duty, shown through a plain setting and an orderly classical composition"},"answer":"D","explanation":"David uses an ancient Roman story and a strongly ordered design to stress public duty and sacrifice. This change did not end religious art, royal commissions, or strong emotion in painting.","whyNot":{"A":"Baroque artists often showed kings as gods or ancient heroes. David's brothers swear an oath to their country, not to a king, so the painting stresses royal glory less, not more.","B":"Baroque painters such as Caravaggio and Rubens used even stronger contrasts of light and dark and richer color. David's color and light are controlled and serve a clear, orderly design.","C":"Baroque artists such as Bernini and Rubens stressed intense emotion and movement even more. David sets the women's grief off to one side of a strictly ordered scene."},"hint":"Think about what many Baroque works celebrated. What does David's painting celebrate instead, and how is it arranged?","reasoning":"Continuity and Change"},{"id":"E4-P31","set":"P11","topic":"4.4","lo":"E","skill":"1.B","difficulty":"easy","stem":"The practice Montagu describes is most directly connected to which 18th-century development?","options":{"A":"the disappearance of the plague as a major epidemic disease in western Europe","B":"the use of quarantine to keep ships away from ports where smallpox had broken out","C":"the spread of inoculation, which lowered the number of deaths from smallpox","D":"Harvey's discovery that the heart pumps blood around the body"},"answer":"C","explanation":"The practice was smallpox inoculation, also called variolation. Matter from a smallpox sore was put into a small cut. People who survived were usually protected from catching smallpox again. It was less dangerous than catching smallpox naturally, but it could still cause serious illness or death and could spread the disease. It was different from Jenner's later vaccination with cowpox. Montagu helped bring it to England in the 1720s.","whyNot":{"A":"Plague did fade in the 1700s, but Montagu is writing about smallpox.","B":"Montagu describes giving people a mild case on purpose, not keeping the sick away from others.","D":"Harvey's work on the blood came about 90 years earlier and is not about smallpox."},"hint":"What does the old woman put into the cut? What happens to the patients afterward?"},{"id":"E4-P32","set":"P11","topic":"4.4","lo":"E","skill":"3.A","difficulty":"medium","stem":"Montagu's comment about English doctors suggests that she expected them to","options":{"A":"reject the practice because it came from the Muslim Ottoman Empire","B":"resist the practice because it would cut their income","C":"ask the Church of England to ban the practice as sinful","D":"urge Parliament to make the practice a legal requirement"},"answer":"B","explanation":"Montagu says smallpox is \"a considerable branch\" of doctors' \"revenue.\" Treating smallpox earned doctors money. She doubted they would support a practice that might put an end to the disease.","whyNot":{"A":"Some critics did call inoculation a foreign custom. But Montagu says the doctors would lose money.","C":"Montagu does not mention the Church. She talks about the doctors' \"revenue.\"","D":"Montagu expects the doctors to oppose the practice, not to demand it."},"hint":"Reread the last sentence. What does Montagu say doctors would lose?"},{"id":"E4-P33","set":"P11","topic":"4.5","lo":"F","skill":"4.A","difficulty":"medium","stem":"Montagu's letter is an example of how, in the 1700s,","options":{"A":"European rulers sent doctors to study medicine at universities in Asia and North Africa","B":"travel writing showed British readers Ottoman customs and could challenge ideas of European superiority","C":"European scientists rejected any medical practice that did not appear in ancient Greek texts","D":"Ottoman sultans spread new medical practices to Europe through official treaties with Britain"},"answer":"B","explanation":"Montagu describes a practice she saw in Ottoman society and urges the English to adopt it. Her letter shows how travel writing could question the idea that European ways were always better.","whyNot":{"A":"The letter does not describe any mission sent by a government to study at foreign universities.","C":"Many Europeans were curious about practices from other places. Inoculation spread in Britain in the 1720s.","D":"Montagu learned of the practice from local people, not from the sultan or any treaty."},"hint":"Where was Montagu living, and who was she writing to?"},{"id":"E4-P34","set":"P12","topic":"4.4","lo":"E","skill":"3.A","difficulty":"easy","stem":"Prothero's main argument about English farming in the 1700s is that it","options":{"A":"produced far more food, but at a heavy cost to small farmers","B":"changed very little until farm machines came into use in the middle of the 1800s","C":"improved mainly because peasants gained secure ownership of the land they farmed","D":"fell into crisis as the new methods caused repeated famines across England"},"answer":"A","explanation":"Prothero praises the new crops, methods, and animal breeding that fed a growing population. But he says the changes pushed small farmers and villagers off the land. That was \"the heavy price\" of more food.","whyNot":{"B":"Prothero calls the change between 1700 and 1800 \"astonishing.\"","C":"Prothero says the opposite: the peasantry was divorced \"from the soil.\"","D":"Prothero says England produced more food and became \"the granary of Europe.\""},"hint":"Prothero praises the changes but also names a \"heavy price.\" Find both parts."},{"id":"E4-P35","set":"P12","topic":"4.4","lo":"E","skill":"1.A","difficulty":"easy","stem":"The change from \"common cultivation\" to \"separate occupation\" that Prothero describes refers to","options":{"A":"enclosure","B":"the end of serfdom in England","C":"the putting-out system","D":"the Norfolk four-course crop rotation"},"answer":"A","explanation":"Enclosure reorganized who held the land. It limited or ended villagers' shared rights to open fields and commons, and it often joined scattered strips into separate farms. Fences were part of it, but fencing alone does not define it. Landowners often got Parliament to pass enclosure acts.","whyNot":{"B":"Serfdom had faded in England centuries earlier, by about 1500.","C":"The putting-out system was about making cloth, not about who farmed the land.","D":"Crop rotation was one of the new methods, but it is not a change in who held and worked the land."},"hint":"Is the passage describing a change in land rights, in farming methods, or in making goods?"},{"id":"E4-P36","set":"P12","topic":"4.4","lo":"E","skill":"5.B","difficulty":"medium","stem":"The \"divorce of the peasantry from the soil\" that Prothero describes contributed most directly to","options":{"A":"the emigration of most displaced villagers to Britain's colonies in North America","B":"the creation of England's first poor laws to help people who had no work","C":"the spread of serfdom to farm workers in Britain and other parts of western Europe","D":"the movement of rural people into towns and cities in search of work"},"answer":"D","explanation":"When villagers lost their land and common rights, many had to work for wages. Farms now needed fewer workers. So many people moved to towns and cities, where new industries needed workers.","whyNot":{"A":"Some people did emigrate, but most rural people who lost land moved to English towns and industrial areas to find wage work.","B":"England's main poor law was passed in 1601, and earlier ones date from the 1500s, long before these changes.","C":"Serfdom spread in eastern Europe, not western Europe, and it had grown there earlier."},"hint":"If people lost their land, how would they earn a living? Where could they go?","reasoning":"Causation"},{"id":"E4-P37","set":"P13","topic":"4.4","lo":"E","skill":"2.B","difficulty":"easy","stem":"Hogarth most likely made this print in order to","options":{"A":"argue that beer was as harmful to London's poor as gin","B":"support efforts to limit the sale of cheap gin to London's poor","C":"argue that the poor should be moved out of London to farms","D":"criticize the Church of England for ignoring the city's poor"},"answer":"B","explanation":"Hogarth shows gin causing neglect, poverty, and death. He made the print in 1751, the year Parliament passed a law to raise taxes on gin and limit who could sell it. He wanted his print to push people to support that law.","whyNot":{"A":"Hogarth published Gin Lane with a companion print, Beer Street, which shows beer drinkers as healthy and busy. He blamed gin, not beer.","C":"The print shows the harm of drinking. It does not suggest moving people to farms.","D":"A church steeple appears in the distance, but the print blames gin for the ruin in the street."},"hint":"Is anything in the picture going well? What does Hogarth blame?"},{"id":"E4-P38","set":"P13","topic":"4.4","lo":"E","skill":"4.B","difficulty":"medium","stem":"The scene in the print is best understood in the context of","options":{"A":"the return of the plague to London in a great outbreak in the 1740s","B":"the collapse of English farming in the decades after the Seven Years' War","C":"the rapid growth of cities, which drew poor migrants from the countryside","D":"the destruction of much of London by the Great Fire of 1666 and the slow rebuilding"},"answer":"C","explanation":"In the 1700s, many poor people moved from the countryside to London to find work. The city grew crowded, and many lived in poverty. Cheap gin spread quickly in these crowded neighborhoods.","whyNot":{"A":"London's last great plague was in 1665. Plague faded from western Europe in the 1700s.","B":"The Seven Years' War began in 1756, after this print, and English farming grew in this period.","D":"The Great Fire came almost a century earlier. The ruined houses in the print show poverty and neglect."},"hint":"Who lived in the crowded streets of London? Where had many of them come from?"},{"id":"E4-P39","set":"P13","topic":"4.4","lo":"E","skill":"5.B","difficulty":"medium","stem":"Worries like those shown in the print most directly led to","options":{"A":"greater efforts by governments and reformers to police and control the urban poor","B":"the British government taking over the gin distilleries of London and running them itself","C":"a British law of the 1750s that set up free public schools in London","D":"a sharp drop in the number of people moving from the countryside to London"},"answer":"A","explanation":"Crowded cities made poverty, crime, and drinking easy to see. In response, Parliament passed laws on gin, and London set up stronger watchmen and magistrates. Reformers also opened workhouses and charities to control the poor.","whyNot":{"B":"Parliament taxed and licensed gin sellers. It did not take over the distilleries.","C":"Britain did not set up free public schools for all children until the late 1800s.","D":"People kept moving to London and other cities for work. London kept growing."},"hint":"The print shows crime and disorder. What would leaders want to do about it?","reasoning":"Causation"},{"id":"E4-P40","set":"P14","topic":"4.6","lo":"G","skill":"1.A","difficulty":"easy","stem":"Frederick's description of a ruler's duties best reflects","options":{"A":"constitutional monarchy, in which an elected parliament limits the power of the king","B":"divine-right monarchy, in which the king is responsible to God and not to his subjects","C":"enlightened absolutism, in which a ruler with full power claimed to serve the state","D":"republicanism, in which citizens choose their leaders and can vote them out"},"answer":"C","explanation":"Frederick kept full control of Prussia. But he said a king must serve the state: keep the laws, help farming and trade, and spend taxes wisely. Rulers who mixed full power with Enlightenment ideas are called enlightened absolutists.","whyNot":{"A":"Frederick does not mention a parliament or any limits on his power.","B":"Frederick bases royal power on men who chose \"one of their equals,\" not on God.","D":"Frederick defends monarchy. He does not want citizens to elect their leaders."},"hint":"Does Frederick share power with anyone? What does he say the ruler is for?"},{"id":"E4-P41","set":"P14","topic":"4.6","lo":"G","skill":"5.A","difficulty":"medium","stem":"Frederick's idea that rulers were first chosen by \"their equals\" differs from older defenses of royal power in that it","options":{"A":"says that the nobles should elect each new king when the old king dies","B":"bases royal power on an agreement among people rather than on God's choice","C":"denies that a king has any right to collect taxes from his subjects","D":"argues that the Church must approve each new king before he can rule"},"answer":"B","explanation":"Older writers, such as Bishop Bossuet, said kings got their power from God, though they also said kings had duties. Frederick says people agreed to give power to one ruler so he would serve them. He calls the king \"the first servant of the State.\"","whyNot":{"A":"Frederick describes how rulers first gained power long ago. He does not say nobles should choose each new king; he himself inherited the throne.","C":"Frederick says the army and government need money. He wants taxes used wisely, not ended.","D":"Frederick does not mention the Church. His argument is based on service to the state."},"hint":"Where does Frederick say a ruler's power came from? Where did Bossuet say it came from?","reasoning":"Comparison"},{"id":"E4-P42","set":"P14","topic":"4.6","lo":"H","skill":"4.B","difficulty":"medium","stem":"Frederick's focus on the army, finances, and the \"enemies of the State\" is best understood in the context of","options":{"A":"Prussia's rise as a military rival to Austria in a divided Holy Roman Empire","B":"Prussia's loss of its eastern lands to Russia at the end of the Great Northern War in 1721","C":"the Habsburgs' loss of Hungary to the Ottoman Empire after the siege of Vienna in 1683","D":"the Diplomatic Revolution of 1756, in which Prussia joined France against Britain"},"answer":"A","explanation":"After 1648, the princes of the Holy Roman Empire ran their own states. Prussia's kings built a large army and a careful tax system. Frederick seized Silesia from Austria in 1740 and kept it, which made Prussia a great power.","whyNot":{"B":"Prussia did not lose its eastern lands to Russia. It gained land in the 1700s.","C":"After the Ottoman defeat at Vienna in 1683, the Habsburgs brought most of Hungary under their rule by 1699.","D":"In 1756 Prussia allied with Britain, while Austria allied with its old enemy, France."},"hint":"Prussia was small but had a very large army. Who did Frederick fight, and why did he need money?"},{"id":"E4-P43","set":"P15","topic":"4.3","lo":"D","skill":"3.A","difficulty":"medium","stem":"Turgot's main criticism of the guilds is that they","options":{"A":"trained so many new workers that wages fell for skilled craftsmen in France's towns and cities","B":"shut most people out of the trades and denied buyers the lower prices that competition brings","C":"allowed foreign merchants to take control of the trades in France's largest cities","D":"let the king tax craftsmen more heavily than he taxed nobles and clergy"},"answer":"B","explanation":"Turgot says guild masters alone could make or sell goods in their trade. Everyone else was shut out, and buyers lost the benefits of competition. He calls this \"a real monopoly.\"","whyNot":{"A":"Turgot says the opposite. Guilds limited who could enter a trade, after a probation \"as long and vexatious as it is superfluous.\"","C":"The preamble does not mention foreign merchants. It says guilds kept out \"citizens\" who were not masters.","D":"The preamble does not discuss royal taxes on craftsmen. It discusses the guilds' own fees and rules."},"hint":"Turgot names harms to the state, to working people, and to town dwellers. What do they have in common?"},{"id":"E4-P44","set":"P15","topic":"4.3","lo":"D","skill":"1.B","difficulty":"medium","stem":"Turgot's arguments in the preamble most closely reflect the ideas of","options":{"A":"mercantilists such as Colbert, who used regulations to build up a nation's industries","B":"German cameralists, who wanted rulers to manage their states' economies closely","C":"utopian socialists, who wanted workers to own and run workshops together","D":"the Physiocrats and Adam Smith, who wanted trade freed from government limits"},"answer":"D","explanation":"Turgot was a friend of the Physiocrats, French economists who argued that trade should be free of government limits. Adam Smith, whose Wealth of Nations also appeared in 1776, made similar arguments against guilds and monopolies. Both challenged mercantilist controls.","whyNot":{"A":"Colbert used state rules and strengthened the guilds to build French industry. Turgot attacks those rules.","B":"Cameralists wanted officials to direct the economy. Turgot wants to remove controls on trades.","C":"Utopian socialists wrote in the early 1800s, after this edict. Turgot defends free competition, not shared ownership."},"hint":"Turgot praises competition and attacks monopoly. Which choice names thinkers with the same goals, and which name their opponents?"},{"id":"E4-P45","set":"P15","topic":"4.6","lo":"G","skill":"5.B","difficulty":"medium","stem":"Which of the following best explains why the reform described in the passage was reversed within a few months?","options":{"A":"The Estates General met in 1776 and voted to bring the guilds back.","B":"Philosophes such as Voltaire attacked the edict as a threat to skilled work.","C":"France's entry into the American War of Independence left the king no money to pay guild masters for their losses.","D":"Privileged groups, such as guild masters and the Parlement of Paris, fought reforms that cut their rights."},"answer":"D","explanation":"The Parlement of Paris resisted Turgot's edicts, and Louis XVI had to force it to register them. Guild masters, nobles, and courtiers turned against Turgot. The king dismissed him in May 1776, and the guilds were restored that August. Enlightened reform from above had clear limits in France.","whyNot":{"A":"The Estates General did not meet between 1614 and 1789.","B":"Voltaire and many other philosophes supported Turgot's reforms.","C":"France did not enter that war until 1778, two years after the guilds were restored."},"hint":"Who lost privileges under the edict? How could they fight back?","reasoning":"Causation"},{"id":"E4-P46","set":"P16","topic":"4.3","lo":"D","skill":"3.A","difficulty":"easy","stem":"Voltaire's main argument in the passage is that","options":{"A":"Protestants should be forced to become Catholics so that France would have one religion","B":"France could safely tolerate its Protestants, because Europe had changed since the religious wars","C":"tolerating Protestants would bring back civil wars like those of the 1500s","D":"French Protestants should leave France and settle in Holland or England, where they would be safe from persecution"},"answer":"B","explanation":"Some French people feared that Protestants would rebel if treated well. Voltaire says times have changed. He points to countries where people of many faiths live in peace.","whyNot":{"A":"Voltaire wants the opposite. He asks for \"paternal indulgence,\" or patience, toward Protestants.","C":"Voltaire calls this fear \"an illogical piece of reasoning.\"","D":"Voltaire praises Holland and England as examples. He wants Protestants tolerated in France, not forced to flee, as many had been after 1685."},"hint":"What do some people fear, and how does Voltaire answer them?"},{"id":"E4-P47","set":"P16","topic":"4.3","lo":"D","skill":"3.D","difficulty":"medium","stem":"Which of the following best supports Voltaire's claim that people of different faiths could live together peacefully in Holland and England?","options":{"A":"Louis XIV ended the toleration of Protestants in France when he revoked the Edict of Nantes in 1685.","B":"The Dutch Republic tolerated several faiths, and England's 1689 Toleration Act let many Protestant dissenters worship.","C":"The Peace of Augsburg in 1555 let each German prince choose whether his lands would be Catholic or Lutheran.","D":"Spanish rulers used the Inquisition to punish Protestants in the Spanish Netherlands in the 1500s."},"answer":"B","explanation":"These developments show that religious variety could exist alongside peace and order. They did not give equal rights to every group: England's Toleration Act left out Catholics, for example. So they support Voltaire's general point more than his sweeping description.","whyNot":{"A":"This is about France, and it shows less toleration, not more.","C":"The Peace of Augsburg settled relations between Catholic and Lutheran rulers in the Holy Roman Empire. It did not create the broad toleration Voltaire describes in Holland and England.","D":"This shows persecution, and it happened long before Voltaire wrote."},"hint":"Supporting evidence must show different faiths living side by side in peace. Check where and when each choice took place."},{"id":"E4-P48","set":"P16","topic":"4.6","lo":"G","skill":"5.B","difficulty":"medium","stem":"Arguments like Voltaire's contributed most directly to which development by the 1780s?","options":{"A":"The Peace of Westphalia's grant of equal legal status to Calvinists in the Holy Roman Empire","B":"The Catholic Church's decision to recognize Protestant churches as its equals","C":"Maria Theresa's expulsion of the Jews from the city of Prague","D":"Edicts in Austria and France granting rights to religious minorities"},"answer":"D","explanation":"In 1781, Joseph II's Patent of Toleration let Lutherans, Calvinists, and Orthodox Christians in Austria hold private church services. It also let them take more jobs. In 1787, Louis XVI let French Protestants record their births, marriages, and deaths by law. These laws gave minorities more rights, but not full equality.","whyNot":{"A":"The Peace of Westphalia was signed in 1648, more than 100 years before Voltaire wrote.","B":"The Catholic Church did not recognize Protestant churches as equals in this period.","C":"Maria Theresa ordered the expulsion of Prague's Jews in 1744, before Voltaire wrote. That policy limited a religious minority rather than extending its rights."},"hint":"Think about laws that enlightened rulers passed about religion in the 1780s.","reasoning":"Causation"}],"exam":{"title":"Unit 4 Practice Exam: Scientific, Philosophical, and Political Developments","timeMinutes":25,"questionCount":25,"directions":"Each set of questions refers to a source: a primary source, a historian's writing, an image, or data. For each question, choose the best answer. Use each source and your knowledge of the Scientific Revolution, the Enlightenment, and related European developments. There is no penalty for guessing. Some sources use historical labels or words for groups of people that are no longer used; these words show the language of their time.","questions":[{"id":"E4-E01","set":"X1","topic":"4.2","lo":"B","skill":"3.A","difficulty":"easy","stem":"Which of the following best describes Galileo's main argument in the letter?","options":{"A":"Passages of the Bible should be read in ways that fit what the senses and proof show about nature.","B":"The Bible should be read word for word, since God is the author of both Scripture and nature.","C":"Disputes about the heavens should be settled by the Church's official interpreters of the Bible.","D":"The true laws of nature are best learned from the writings of the ancient Greek philosophers."},"answer":"A","rationales":{"A":"Correct. Galileo says that \"two truths can obviously never contradict each other,\" so wise readers must find the meaning of Scripture that agrees with proven facts about nature.","B":"Incorrect. Galileo agrees that God is the source of both, but he says the Bible often needs \"a different explanation from what seems to be the literal one.\"","C":"Incorrect. Galileo says Scripture's \"thousands of words\" allow \"various interpretations,\" and that the Bible says very little about astronomy.","D":"Incorrect. Galileo does not cite ancient writers. He points to \"the clear evidence of sense\" and \"necessary demonstration.\""},"explanation":"Galileo says the Bible teaches what people need for salvation. Questions about nature should be settled by observation and proof. When the two seem to clash, the Bible should be read in a way that fits the proven facts."},{"id":"E4-E02","set":"X1","topic":"4.1","lo":"A","skill":"4.A","difficulty":"medium","stem":"Galileo wrote the letter in the context of which of the following?","options":{"A":"The Council of Trent's decision to let ordinary Catholics read the Bible in their own languages","B":"Protestant reformers' demand that the heliocentric model be taught as a truth found in the Bible","C":"Debates over telescope observations that supported the idea that the Earth moves around the Sun","D":"Jesuit teachers' refusal to use mathematics in the study of the heavens and the Earth"},"answer":"C","rationales":{"A":"Incorrect. The Council of Trent affirmed the authority of the Latin Vulgate Bible and forbade interpretations on matters of faith and morals that went against the Church's judgment. It did not make the decision in this choice.","B":"Incorrect. Luther and other reformers did not support Copernicus. Many quoted the Bible against the idea that the Earth moves.","C":"Correct. After 1609, Galileo's telescope showed moons circling Jupiter and the phases of Venus. These findings backed Copernicus and set off arguments over whether the Bible says the Sun moves.","D":"Incorrect. Jesuit scholars, such as Christopher Clavius, taught mathematics and astronomy in their schools."},"explanation":"In 1610 Galileo published what he saw through his telescope. His findings supported Copernicus's idea that the Earth moves around the Sun. Critics answered with Bible verses, such as the one in which Joshua tells the Sun to stand still."},{"id":"E4-E03","set":"X1","topic":"4.7","lo":"I","skill":"5.B","difficulty":"medium","stem":"Galileo's letter contributed most directly to which of the following?","options":{"A":"Kepler's discovery that the planets move around the Sun in oval paths rather than in perfect circles","B":"The Council of Trent's ruling that the Church had the final say over the meaning of Scripture","C":"The founding of the Royal Society of London, which supported experiments and published papers by scientists from many countries","D":"Complaints to the Inquisition that helped bring Copernican teaching under official scrutiny in 1615–1616"},"answer":"D","rationales":{"A":"Incorrect. Kepler published his first two laws of planetary motion in 1609, before this letter, and he worked from Tycho Brahe's observations, not from Galileo's letter.","B":"Incorrect. The Council of Trent made that ruling in 1546, long before Galileo wrote.","C":"Incorrect. The Royal Society was founded in England in 1660. It grew out of English interest in Bacon's ideas, not this letter.","D":
