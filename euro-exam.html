"Correct. Copies of the letter reached the Inquisition in 1615. In 1616 Church authorities ruled that the Sun-centered idea went against Scripture."},"explanation":"Galileo's letter was copied and passed around, and in 1615 copies reached the Inquisition. It became evidence in the fight over Copernican teaching, which Church authorities condemned in 1616. Galileo's later trial in 1633 followed the publication of his Dialogue in 1632.","reasoning":"Causation"},{"id":"E4-E04","set":"X1","topic":"4.2","lo":"B","skill":"3.D","difficulty":"easy","stem":"Which of the following later developments would best support Galileo's claim that not \"everything that can be known in the world is known already\"?","options":{"A":"The Church's decision in 1616 to place Copernicus's book about the Earth's motion on its list of forbidden books","B":"Tycho Brahe's model, in which the planets circle the Sun while the Sun circles the Earth","C":"The teaching of Aristotle's physics in many European universities until the late 1600s","D":"William Herschel's discovery of the planet Uranus in 1781, a planet unknown to ancient writers"},"answer":"D","rationales":{"A":"Incorrect. This shows the Church resisting new ideas. It does not show that new knowledge was found.","B":"Incorrect. Tycho's model was an older attempt to keep the Earth at the center. It came before Galileo's letter.","C":"Incorrect. This shows how long old ideas lasted. It does not show new discoveries.","D":"Correct. Galileo says the Bible does not even list all the planets. Finding a new planet with a telescope shows that people could still learn new things about nature."},"explanation":"Galileo argues that the Bible says little about astronomy and that people can learn more by using their senses and reason. When Herschel used a telescope to find Uranus, he found a planet no ancient writer knew about."},{"id":"E4-E05","set":"X2","topic":"4.3","lo":"C","skill":"3.C","difficulty":"easy","stem":"The two sources differ most in their views about whether","options":{"A":"women should be educated at home by their parents or in schools run by the government","B":"women should take part in religious life or stay out of the affairs of the Church","C":"women should be raised mainly to serve men or should share the same natural rights as men","D":"women should work for wages outside the home or remain at home with their families"},"answer":"C","rationales":{"A":"Incorrect. Neither source compares home schooling and government schools.","B":"Incorrect. Neither source discusses the Church.","C":"Correct. Rousseau says a woman's education must be \"planned in relation to man.\" Condorcet says women, as reasoning beings, have \"necessarily the same rights\" as men.","D":"Incorrect. Neither source discusses paid work. Condorcet is writing about citizenship."},"explanation":"Rousseau believed a woman's purpose was to please men and raise children, so her education should prepare her for that. Condorcet said that women reason just as men do, so they deserve the same rights, including taking part in making laws.","reasoning":"Comparison"},{"id":"E4-E06","set":"X2","topic":"4.3","lo":"C","skill":"4.B","difficulty":"medium","stem":"Condorcet's essay is best understood in the context of","options":{"A":"the Physiocrats' campaign to free the grain trade from royal controls","B":"French revolutionary debates over who should have the rights of citizens","C":"Napoleon's Civil Code, which gave wives the same property rights as their husbands","D":"Joseph II's edicts granting toleration to Protestants and Jews in the Habsburg lands"},"answer":"B","rationales":{"A":"Incorrect. The Physiocrats wrote about trade and farming. Condorcet's essay is about women's political rights.","B":"Correct. Condorcet wrote in 1790, after the Declaration of the Rights of Man. He asked why rights given to men were denied to women.","C":"Incorrect. Napoleon's Civil Code came in 1804, after this essay, and it put wives under their husbands' control.","D":"Incorrect. Joseph II's edicts were about religious minorities in Austria. Condorcet writes about women's citizenship in France."},"explanation":"In 1789 France's National Assembly declared that men are born free and equal in rights. Condorcet asked why those rights did not apply to women. The Assembly gave the vote only to some men."},{"id":"E4-E07","set":"X2","topic":"4.3","lo":"C","skill":"5.B","difficulty":"medium","stem":"Which of the following best describes how French revolutionary governments responded to arguments for women's formal political rights in the 1790s?","options":{"A":"The National Assembly gave adult women the right to vote in the Constitution of 1791.","B":"The Convention adopted Olympe de Gouges's Declaration of the Rights of Woman as part of French law.","C":"The Constitution of 1793 gave women the vote, but it was not put into effect.","D":"They denied women the vote and closed women's political clubs in 1793."},"answer":"D","rationales":{"A":"Incorrect. The Constitution of 1791 gave the vote only to men who paid a certain amount in taxes.","B":"Incorrect. Lawmakers never adopted de Gouges's declaration as law.","C":"Incorrect. The Constitution of 1793 gave the vote to all adult men, not to women.","D":"Correct. Women did not gain the vote. In October 1793 the Convention banned women's political clubs. Ideas like Rousseau's were often used to justify this."},"explanation":"Women took an active part in revolutionary politics. They marched, petitioned, and formed clubs. But revolutionary governments denied them the vote and closed women's political clubs in 1793.","reasoning":"Continuity and Change"},{"id":"E4-E08","set":"X3","topic":"4.3","lo":"D","skill":"4.A","difficulty":"medium","stem":"The painting best illustrates which development in the 1700s?","options":{"A":"The Catholic Church's control over which experiments could be shown in public","B":"The use of experiments mainly by craftsmen working in workshops and mines","C":"A decline in public interest in science in the decades after Newton's death","D":"The spread of scientific knowledge to educated people outside the universities"},"answer":"D","rationales":{"A":"Incorrect. No church officials appear. Scientific shows like this one took place without Church approval in Britain.","B":"Incorrect. The people watching are a well-dressed family and guests, not craftsmen at work.","C":"Incorrect. Interest in science grew after Newton died in 1727. Paintings and lectures like this show how popular it was.","D":"Correct. Traveling lecturers showed experiments in homes, coffee houses, and public halls. Here a family and their guests watch one in a private home."},"explanation":"In the 1700s, science was not only for scholars. Lecturers traveled from town to town and showed experiments to paying audiences. Wright shows a family gathered at home to watch one."},{"id":"E4-E09","set":"X3","topic":"4.2","lo":"B","skill":"5.B","difficulty":"medium","stem":"The experiment shown in the painting most directly grew out of which earlier development?","options":{"A":"The work of Robert Boyle and others who used instruments to test ideas about nature","B":"Galen's theory that good health depended on a balance among the four humors of the body","C":"The alchemists' search for a way to change lead and other metals into gold","D":"Descartes's argument that knowledge must start from ideas that cannot be doubted"},"answer":"A","rationales":{"A":"Correct. Robert Boyle and others built air pumps in the 1650s and 1660s to test what happens without air. They followed Bacon's call for experiments.","B":"Incorrect. Galen's ideas about the humors were being challenged in this period. The air pump tests the air, not the humors.","C":"Incorrect. This choice is about changing one metal into another. The painting shows a test of what happens when air is removed. Experiments and interest in alchemy could exist side by side.","D":"Incorrect. Descartes stressed clear principles and step-by-step reasoning, though he also did experiments. He also taught that empty space could not exist, and empty space is what the air pump tried to create."},"explanation":"Scientists of the 1600s, following Bacon, used new instruments to test nature. Boyle's air pump showed that living things need air. A century later, lecturers repeated his experiment for audiences, as in this painting.","reasoning":"Causation"},{"id":"E4-E10","set":"X3","topic":"4.5","lo":"F","skill":"4.B","difficulty":"medium","stem":"Wright's choice of subject in this painting is best understood in the context of","options":{"A":"Baroque art that glorified kings and the Catholic Church with grand, dramatic, and richly colored scenes","B":"art that reflected the outlook and values of a growing commercial and professional middle class","C":"art paid for by the Church of England to warn that science threatened religious faith","D":"Rococo art that showed aristocrats enjoying games, flirtation, and leisure in elegant rooms"},"answer":"B","rationales":{"A":"Incorrect. Dramatic lighting appears in many kinds of art. Here the subject is a science demonstration in a home, not a celebration of royal or Catholic power.","B":"Correct. In the 1700s, more paintings reflected the outlook and interests of merchants, manufacturers, and professionals. Wright painted for buyers in England's growing commercial towns.","C":"Incorrect. The skull and candle may hint at death, but Wright painted for private buyers, not the Church. His subject is a science lesson for a family at home.","D":"Incorrect. Rococo art showed playful aristocratic leisure. Wright shows a serious scientific demonstration that frightens some of the watchers, painted for buyers in England's commercial towns."},"explanation":"The painting reflects interest in home life, polite company, and science among well-off families. Such subjects grew more important in the 1700s, alongside the religious and royal works that artists still made."},{"id":"E4-E11","set":"X4","topic":"4.5","lo":"F","skill":"4.B","difficulty":"medium","stem":"The trend shown in the chart is best explained by which of the following?","options":{"A":"The end of government censorship of the press in most countries of Europe","B":"Free public schools set up by the British government in English towns and villages","C":"The use of steam-powered printing presses in the print shops of London and other cities","D":"A growing reading public that followed the news in coffeehouses and clubs"},"answer":"D","rationales":{"A":"Incorrect. Censorship continued in France, Austria, and much of Europe. The chart shows only Britain.","B":"Incorrect. Britain did not set up free public schools for all children until the late 1800s.","C":"Incorrect. Steam-powered presses were not used to print newspapers until 1814, after the years in the chart.","D":"Correct. More British people could read, and many met in coffeehouses and clubs where newspapers were kept. The demand for news grew."},"explanation":"The yearly total more than doubled between 1753 and 1782. That fits a growing market for news, read and discussed in coffeehouses and clubs. The chart does not directly measure how many people could read or how many different people read the news."},{"id":"E4-E12","set":"X4","topic":"4.5","lo":"F","skill":"5.B","difficulty":"medium","stem":"The trend shown in the chart most directly contributed to which of the following in Britain?","options":{"A":"The decline of London's coffeehouses as places where people read and discussed the news","B":"Growing public debate over government actions, such as the arrest of John Wilkes","C":"Parliament's decision in the 1770s to forbid newspapers to report its debates","D":"The Church of England's new power to decide what newspapers could print"},"answer":"B","rationales":{"A":"Incorrect. Coffeehouses kept newspapers for customers, so more papers gave people more reasons to visit them. When some coffeehouses later declined, rising newspaper sales were not the main reason.","B":"Correct. Wilkes was arrested in 1763 for an article that attacked the king's speech. Newspapers spread the story, and crowds rallied behind Wilkes as a hero of free speech.","C":"Incorrect. It went the other way. After a fight with London printers in 1771, Parliament stopped punishing papers that reported its debates.","D":"Incorrect. The Church of England did not gain control over newspapers."},"explanation":"As more newspapers circulated, more people followed politics. Readers took sides in public quarrels, such as the fight over John Wilkes. Government leaders had to pay attention to what the public thought.","reasoning":"Causation"},{"id":"E4-E13","set":"X4","topic":"4.5","lo":"F","skill":"2.C","difficulty":"hard","stem":"Even if the yearly totals in the chart are accurate, why can they not be treated as counts of the number of different people who read newspapers?","options":{"A":"Some of the figures come from government tax records rather than from the newspaper owners.","B":"The chart does not show the price that readers paid for each newspaper.","C":"One person could read many copies, while a single copy could be read by several people.","D":"The chart begins in 1753, after London's first daily newspapers had appeared."},"answer":"C","rationales":{"A":"Incorrect. Government records can be useful evidence, but where they came from does not change the difference between counting copies and counting people.","B":"Incorrect. Prices could help explain demand, but they do not turn yearly copy totals into counts of different readers.","C":"Correct. Each figure counts copies over a year, not people. Some readers bought many issues, and some copies were read aloud or passed around.","D":"Incorrect. The start date does not affect what the numbers show about readers."},"explanation":"The chart counts copies in a year, not different people. Some people read many issues, and some copies reached several readers or listeners. Without knowing how often people reread and shared papers, the totals cannot tell us how many different people read the news."},{"id":"E4-E14","set":"X5","topic":"4.6","lo":"G","skill":"2.B","difficulty":"medium","stem":"Catherine's purpose in issuing the Instruction was most likely to","options":{"A":"justify her absolute power while proposing reforms inspired by Enlightenment ideas","B":"persuade the Russian nobles to share power with an elected parliament like England's","C":"announce that the serfs of the Russian Empire would soon be set free","D":"convince Orthodox Church leaders to end the official status of their church"},"answer":"A","rationales":{"A":"Correct. Catherine proposes ideas such as legal equality, toleration, and the end of torture. She also says \"The Sovereign is absolute.\"","B":"Incorrect. Catherine says that \"every other Form of Government\" would have ruined Russia.","C":"Incorrect. The Instruction does not free the serfs. Russia did not end serfdom until 1861.","D":"Incorrect. The Instruction asks for toleration of other religions, not an end to the Orthodox Church's official role."},"explanation":"Catherine combines plans for legal reform and religious toleration with a clear defense of her absolute power. The passage shows that combination. It does not, by itself, show whether she meant her reforms sincerely."},{"id":"E4-E15","set":"X5","topic":"4.6","lo":"G","skill":"5.A","difficulty":"easy","stem":"Catherine's view of torture in article 123 is most similar to the ideas of","options":{"A":"Cesare Beccaria, who argued that punishments should prevent crime with no needless suffering","B":"Thomas Hobbes, who argued that a powerful sovereign was needed to keep society out of civil war","C":"Bishop Bossuet, who argued that kings are responsible to God, not to their subjects","D":"Niccolò Machiavelli, who advised rulers that it is safer to be feared than loved"},"answer":"A","rationales":{"A":"Correct. Beccaria's On Crimes and Punishments (1764) attacked torture. Catherine read it and borrowed from it.","B":"Incorrect. This is about the power needed to keep order. It does not express Catherine's argument for ending torture.","C":"Incorrect. Bossuet defended divine-right monarchy. He did not write against torture.","D":"Incorrect. Machiavelli advised rulers on keeping power. He did not argue that torture goes against reason."},"explanation":"Catherine copied many articles of her Instruction from Montesquieu and Beccaria. Like Beccaria, she says torture goes against nature and reason.","reasoning":"Comparison"},{"id":"E4-E16","set":"X5","topic":"4.6","lo":"G","skill":"3.D","difficulty":"hard","stem":"Which of the following, if true, would most directly challenge the view that Catherine ruled according to the principles in the passage?","options":{"A":"She wrote letters to Voltaire and Diderot for many years and bought Diderot's library for a high price.","B":"She threatened serfs who petitioned her against their landlords with flogging and forced labor.","C":"Her armies won lands on the Black Sea coast from the Ottoman Empire.","D":"She allowed Muslims in her empire to build mosques and religious schools."},"answer":"B","rationales":{"A":"Incorrect. This fits her picture of herself as a friend of the Enlightenment.","B":"Correct. Article 34 says all citizens should be \"subject to the same Laws,\" but serfs who appealed to her against their masters faced harsh punishment.","C":"Incorrect. This is true, but winning wars does not show whether she followed the ideas in the Instruction.","D":"Incorrect. This fits article 494, which says forbidding other religions would endanger the peace."},"explanation":"A decree of 1767 shows the limits of Catherine's reform language. Landlords kept great power over their serfs, and serfs who appealed directly to the empress against them could be flogged and sent to forced labor. This gap between words and actions is why historians debate how enlightened she was."},{"id":"E4-E17","set":"X6","topic":"4.4","lo":"E","skill":"1.A","difficulty":"easy","stem":"The \"preventive check\" that Malthus describes is best understood as an example of","options":{"A":"the disappearance of the plague as a major cause of death in western Europe after 1720","B":"the rise in the number of children born to unmarried parents in the 1700s","C":"the European marriage pattern, common in western Europe, in which many people married late or never","D":"the use of smallpox inoculation to lower the death rate among children"},"answer":"C","rationales":{"A":"Incorrect. The end of plague let population grow. Malthus is describing something that slowed growth.","B":"Incorrect. Births to unmarried parents did rise in the 1700s, but that added to population. Malthus describes people choosing not to marry.","C":"Correct. Malthus says young men of every rank put off marriage until they can support a family. Late marriage meant fewer children.","D":"Incorrect. Inoculation lowered deaths, which made population grow. It is not a check on growth."},"explanation":"In western Europe, many people waited until their middle or late twenties to marry, and some never married. Malthus calls this the preventive check because it kept the number of births down."},{"id":"E4-E18","set":"X6","topic":"4.4","lo":"E","skill":"4.B","difficulty":"medium","stem":"Malthus's concern about population was most likely a response to","options":{"A":"a sharp drop in Britain's population caused by outbreaks of plague in the 1700s","B":"steady population growth in Britain in the 1700s as the food supply increased","C":"a collapse of British farming caused by the enclosure of open fields","D":"a fall in Britain's birth rate as more married couples used birth control"},"answer":"B","rationales":{"A":"Incorrect. Plague had disappeared from Britain after the 1660s. Britain's population grew in the 1700s.","B":"Correct. Better farming and the end of plague let Britain's population grow fast in the 1700s. Malthus feared it would outgrow the food supply.","C":"Incorrect. Enclosure helped farms produce more food, not less.","D":"Incorrect. Britain's birth rate was high in the late 1700s. Birth control did not become common there until much later."},"explanation":"By the late 1700s, Britain's population was growing faster than ever. Malthus warned that the number of people could grow faster than the food supply. He thought hunger and late marriage would keep growth in check."},{"id":"E4-E19","set":"X6","topic":"4.4","lo":"E","skill":"3.D","difficulty":"hard","stem":"Which finding, if true, would most directly challenge Malthus's claim that \"Subsistence increases only in an arithmetical ratio\"?","options":{"A":"The Irish famine of the 1840s killed about one million people after the potato crop failed.","B":"Many poor families in Britain's growing cities lived in crowded and unhealthy housing.","C":"Farm improvements let food production double in each of several 25-year periods in a row.","D":"Britain's Poor Law of 1834 made it harder for poor people who could work to get help from their parish."},"answer":"C","rationales":{"A":"Incorrect. This fits Malthus's warning that hunger would check population.","B":"Incorrect. Crowded, unhealthy cities fit Malthus's picture of the poor suffering when population grows.","C":"Correct. Malthus says food grows by adding the same amount each period. Food that doubled again and again would be growth by multiplying, which goes against his claim.","D":"Incorrect. This law reflected ideas like Malthus's. It does not test how fast food production can grow."},"explanation":"Malthus says food grows by addition (1, 2, 3, 4) while population grows by multiplication (1, 2, 4, 8). Food that kept doubling would grow by multiplication too. That finding would directly challenge his claim about food."},{"id":"E4-E20","set":"X7","topic":"4.5","lo":"F","skill":"4.A","difficulty":"medium","stem":"Diderot's description of the \"persecution\" he and his fellow writers faced most likely refers to","options":{"A":"his imprisonment by Catherine II while he was visiting St. Petersburg","B":"a Protestant campaign to stop the Encyclopédie from being printed in Geneva","C":"the Inquisition's trial of Diderot for teaching that the Earth moves around the Sun in his articles","D":"the French government's ban on the Encyclopédie and attacks on it by Church officials"},"answer":"D","rationales":{"A":"Incorrect. Diderot visited Catherine II in 1773, after this preface, and she treated him as an honored guest.","B":"Incorrect. The Encyclopédie was printed in Paris, not Geneva. Its main enemies were French officials and churchmen.","C":"Incorrect. That was Galileo's trial, more than 100 years earlier. Diderot was never tried by the Inquisition.","D":"Correct. The French government took away the Encyclopédie's permission to publish in 1759, and the pope condemned it the same year. Diderot's imprisonment in 1749 was for earlier writings and came before the Encyclopédie was published."},"explanation":"The Encyclopédie questioned old beliefs and praised reason. French censors and Church leaders tried to stop it. Diderot kept working in secret, and the last volumes came out together in 1765."},{"id":"E4-E21","set":"X7","topic":"4.6","lo":"G","skill":"5.B","difficulty":"medium","stem":"Diderot's hopes for \"the masters of the world\" were most fully reflected in which development of the later 1700s?","options":{"A":"Enlightened absolutism, in which rulers backed reforms but kept full power","B":"The partitions of Poland, in which Russia, Prussia, and Austria divided Polish lands","C":"Mercantilism, in which rulers controlled trade to build up their supply of gold and silver","D":"The rise of Methodism, a religious revival led by John Wesley among England's poor"},"answer":"A","rationales":{"A":"Correct. Diderot hopes rulers will spread education. Some rulers did support philosophes and reforms. Catherine II even invited Diderot to Russia.","B":"Incorrect. The partitions added land to the states that took part. They do not show the spread of education that Diderot hopes for.","C":"Incorrect. Mercantilism is a plan for trade and money. Diderot is writing about learning and reason.","D":"Incorrect. Methodism was a movement of preachers and believers, not of rulers. Diderot looks to \"the masters of the world.\""},"explanation":"Diderot says rulers decide how far knowledge spreads. He hopes they will see that educated subjects make them safer. Enlightened absolutists, such as Catherine II, Frederick II, and Joseph II, claimed to rule by such ideas.","reasoning":"Causation"},{"id":"E4-E22","set":"X7","topic":"4.3","lo":"D","skill":"1.B","difficulty":"medium","stem":"The goals Diderot describes in the last paragraph most directly reflect which Enlightenment idea?","options":{"A":"Religious toleration and reason should replace fanaticism as the basis of a peaceful society.","B":"Government power should be divided among separate branches to protect liberty.","C":"People should return to a simple, natural life free from the corruption of society.","D":"Free trade and markets would make nations richer than government control of trade."},"answer":"A","rationales":{"A":"Correct. Diderot wants people to \"tolerate one another\" and to trust \"universal reason\" over beliefs that \"inspire hate.\"","B":"Incorrect. This is Montesquieu's idea. Diderot does not discuss how government is divided.","C":"Incorrect. This choice criticizes the corrupting effects of society. Diderot instead argues that spreading knowledge can improve society.","D":"Incorrect. This is Adam Smith's idea. Diderot is not writing about trade."},"explanation":"Diderot blames \"blind fanatics\" for violence. He hopes the Encyclopédie will teach people to tolerate one another and to trust reason. Toleration and reason were central Enlightenment goals."},{"id":"E4-E23","set":"X8","topic":"4.3","lo":"D","skill":"3.A","difficulty":"easy","stem":"Tocqueville's main argument about French writers in the 1700s is that","options":{"A":"they held government offices that let them put their political ideas into practice","B":"their lack of experience in governing made them bold innovators","C":"they mostly avoided politics and wrote about literature and pure philosophy","D":"they wanted to bring back the old customs and privileges of France's nobility"},"answer":"B","rationales":{"A":"Incorrect. Tocqueville says they \"filled no public offices.\"","B":"Correct. Tocqueville says that because the writers had no part in government, public affairs were \"not only unknown to them, but even invisible.\"","C":"Incorrect. Tocqueville says this was true of writers in Germany, not France.","D":"Incorrect. Tocqueville says the writers wanted to replace \"traditional customs\" with rules \"deduced from reason.\""},"explanation":"Tocqueville says French writers had no part in running the government. Because they had never governed, they did not see how hard real change could be. So they made bold plans based on reason. This is Tocqueville's view, written in 1856."},{"id":"E4-E24","set":"X8","topic":"4.5","lo":"F","skill":"3.D","difficulty":"medium","stem":"Which of the following, if true, would best support Tocqueville's claim that the writers' ideas reached \"the ears and hearts of the people\"?","options":{"A":"The French government ordered copies of the Encyclopédie to be seized after it banned the work in 1759.","B":"Fewer than half of French brides and grooms could sign their names in marriage records in the 1780s.","C":"Cheap pamphlets explaining natural rights and attacking inherited privileges were widely read beyond elite circles.","D":"Philosophes such as Voltaire exchanged letters with rulers such as Frederick II and Catherine II."},"answer":"C","rationales":{"A":"Incorrect. Seizing books shows that the government feared the ideas. It does not show how far they spread.","B":"Incorrect. Signing a name is only a rough sign of whether someone could read. Ideas could also spread through reading aloud and talk, so this does not support the claim.","C":"Correct. Wide reading of works about natural rights and privilege would show the writers' kind of ideas reaching people far beyond a few philosophers.","D":"Incorrect. Letters to kings show that rulers paid attention, not that ordinary people did."},"explanation":"Tocqueville says the writers' ideas reached \"the ears and hearts of the people.\" Cheap works about natural rights and privilege, read widely beyond the elite, would show that ideas like the ones he describes spread. Both what the works said and how widely they were read matter."},{"id":"E4-E25","set":"X8","topic":"4.7","lo":"I","skill":"5.B","difficulty":"medium","stem":"Tocqueville's argument is best understood as an explanation for which of the following?","options":{"A":"The French revolutionaries' attempt after 1789 to rebuild society on reason, not tradition","B":"The success of enlightened absolutism in Prussia under Frederick II in the middle of the 1700s","C":"The spread of the Scientific Revolution's methods from Italy to England in the 1600s","D":"The growing power of the Catholic Church over French government in the decades before 1789"},"answer":"A","rationales":{"A":"Correct. Tocqueville says the writers wanted to replace \"complicated traditional customs\" with rules \"deduced from reason.\" He thought their ideas shaped the Revolution's sharp break with the past.","B":"Incorrect. Tocqueville is explaining France, and he contrasts French writers with German ones who stayed out of politics.","C":"Incorrect. Tocqueville is writing about political ideas in the 1700s, not about the spread of science in the 1600s.","D":"Incorrect. The writers Tocqueville describes criticized the Church. Its power was being challenged, not growing."},"explanation":"Tocqueville wrote in 1856, looking back. He asked why the French Revolution tried to sweep away old institutions all at once. His answer was that French writers, cut off from real politics, had taught the nation to trust bold plans built on reason.","reasoning":"Causation"}]}},"5":{"unit":5,"title":"Conflict, Crisis, and Reaction in the Late 18th Century","period":"c. 1648–1815","examWeighting":"10–15%","blurb":"Britain's rise in the wars with France, the French Revolution and its effects, Napoleon's empire and the reactions to it, the Congress of Vienna, and Romanticism.","version":"2026-11-08c","topics":[{"id":"5.1","name":"Contextualizing 18th-Century States","lo":["A"]},{"id":"5.2","name":"The Rise of Global Markets","lo":["B"]},{"id":"5.3","name":"Britain's Ascendency","lo":["C"]},{"id":"5.4","name":"The French Revolution","lo":["D"]},{"id":"5.5","name":"The French Revolution's Effects","lo":["E"]},{"id":"5.6","name":"Napoleon's Rise, Dominance, and Defeat","lo":["F","G"]},{"id":"5.7","name":"The Congress of Vienna","lo":["H"]},{"id":"5.8","name":"Romanticism","lo":["I"]},{"id":"5.9","name":"Continuity and Change in 18th-Century States","lo":["J"]}],"stimuli":{"X1":{"type":"passage","paragraphs":["The business going forward at present in the pamphlet shops of Paris is incredible. I went to the Palais Royal* to see what new things were published, and to procure a catalogue of all. Every hour produces something new. Thirteen came out to-day, sixteen yesterday, and ninety-two last week. … This spirit of reading political tracts, they say, spreads into the provinces, so that all the presses of France are equally employed. Nineteen-twentieths of these productions are in favour of liberty, and commonly violent against the clergy and nobility; … enquiring for such as had appeared on the other side of the question, to my astonishment I find there are but two or three that have merit enough to be known. Is it not wonderful, that while the press teems with the most levelling and even seditious principles, that if put in execution would overturn the monarchy, nothing in reply appears, and not the least step is taken by the court to restrain this extreme licentiousness of publication. It is easy to conceive the spirit that must thus be raised among the people. But the coffee-houses in the Palais Royal present yet more singular and astonishing spectacles; they are not only crouded within, but other expectant crouds are at the doors and windows, listening a gorge deploye to certain orators, who from chairs or tables harangue each his little audience: the eagerness with which they are heard, and the thunder of applause they receive for every sentiment of more than common hardiness or violence against the present government, cannot easily be imagined. I am all amazement at the ministry permitting such nests and hot-beds of sedition and revolt, which disseminate amongst the people, every hour, principles that by and by must be opposed with vigour, and therefore it seems little short of madness to allow the propagation at present."],"attribution":"Arthur Young, English farmer and writer on agriculture who traveled through France in 1787–1789, journal entry written in Paris, June 9, 1789, published in his Travels in France, 1792","translation":"Text from Arthur Young's Travels in France during the Years 1787, 1788, 1789, edited by M. Betham-Edwards (London, 1892); adapted","footnotes":[{"mark":"*","text":"The Palais Royal was a palace in Paris owned by the Duke of Orléans, a cousin of the king. Its gardens and arcades were filled with shops and cafés, and the royal police could not enter without the duke's permission."}],"glossary":[{"t":"procure","d":"get"},{"t":"tracts","d":"short pamphlets"},{"t":"levelling","d":"aiming to make everyone equal in rank"},{"t":"seditious","d":"stirring people to rebel against the government"},{"t":"licentiousness","d":"lack of restraint"},{"t":"crouded / crouds","d":"old spellings of crowded / crowds"},{"t":"a gorge deploye","d":"French for \"with mouths wide open\""},{"t":"harangue","d":"give loud, forceful speeches to"},{"t":"the ministry","d":"the king's chief officials"}]},"X2":{"type":"pair","items":[{"label":"Source 1","paragraphs":["You will observe, that, from Magna Charta to the Declaration of Right,* it has been the uniform policy of our Constitution to claim and assert our liberties as an entailed inheritance derived to us from our forefathers, and to be transmitted to our posterity,—as an estate specially belonging to the people of this kingdom, without any reference whatever to any other more general or prior right. … We have an inheritable crown, an inheritable peerage, and a House of Commons and a people inheriting privileges, franchises, and liberties from a long line of ancestors.","… A spirit of innovation is generally the result of a selfish temper and confined views. People will not look forward to posterity, who never look backward to their ancestors. …","Society is, indeed, a contract. … It is a partnership in all science, a partnership in all art, a partnership in every virtue and in all perfection. As the ends of such a partnership cannot be obtained in many generations, it becomes a partnership not only between those who are living, but between those who are living, those who are dead, and those who are to be born."],"attribution":"Edmund Burke, Irish-born member of the British Parliament, Reflections on the Revolution in France, 1790","translation":"Text from The Works of the Right Honourable Edmund Burke, vol. 3 (London: John C. Nimmo, 1887); adapted","footnotes":[{"mark":"*","text":"Magna Charta (Magna Carta, 1215) and the Declaration of Right (1689) were English documents that limited the powers of the king."}],"glossary":[{"t":"entailed inheritance","d":"family property that must be passed down to heirs and cannot be sold off"},{"t":"posterity","d":"people of future generations"},{"t":"peerage","d":"the titled nobility"},{"t":"franchises","d":"special rights"},{"t":"innovation","d":"making something new"},{"t":"confined","d":"narrow"}]},{"label":"Source 2","paragraphs":["The English Parliament of 1688 did a certain thing, which, for themselves and their constituents, they had a right to do, and which it appeared right should be done. But, in addition to this right, which they possessed by delegation, they set up another right by assumption, that of binding and controlling posterity to the end of time. …","There never did, there never will, and there never can, exist a Parliament, or any description of men, or any generation of men, in any country, possessed of the right or the power of binding and controlling posterity to the \"end of time,\" or of commanding for ever how the world shall be governed, or who shall govern it … Every age and generation must be as free to act for itself in all cases as the age and generations which preceded it. The vanity and presumption of governing beyond the grave is the most ridiculous and insolent of all tyrannies. … It is the living, and not the dead, that are to be accommodated. …","I am contending for the rights of the living, and against their being willed away and controlled and contracted for by the manuscript assumed authority of the dead, and Mr. Burke is contending for the authority of the dead over the rights and freedom of the living."],"attribution":"Thomas Paine, English-born writer who had supported the American Revolution, Rights of Man, Part 1, 1791","translation":"Text from The Writings of Thomas Paine, vol. 2, edited by Moncure D. Conway (New York, 1894); adapted","glossary":[{"t":"constituents","d":"the people a lawmaker represents"},{"t":"by delegation","d":"because voters gave it to them"},{"t":"by assumption","d":"by simply claiming it"},{"t":"posterity","d":"people of future generations"},{"t":"presumption","d":"taking more than one has a right to"},{"t":"accommodated","d":"served"},{"t":"willed away","d":"given away in a will, as if they were property"}]}]},"X3":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_thin_black_margin.jpg/1280px-El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_thin_black_margin.jpg","width":1280,"height":989,"alt":"A dark night scene painted in oil. On the right, a tight line of soldiers with their backs to the viewer aim guns at close range at a group of men on the left. A man in a white shirt kneels with his arms raised. Bodies lie bleeding on the ground, and a large lantern lights the scene. A town with a church tower stands in the background.","caption":"On the right, a line of soldiers in long coats and tall hats stand shoulder to shoulder and aim their guns. Their faces cannot be seen. On the left, a group of men faces them. In the center, a man in a white shirt and yellow trousers kneels with his arms spread wide. Others cover their faces or pray. Dead men lie in pools of blood in the foreground, and more men wait in line behind them. A large square lantern on the ground lights the scene. A town with a church tower sits in the dark background.","attribution":"Francisco de Goya, Spanish painter, The Third of May 1808 in Madrid, oil painting completed in 1814","credit":"Museo del Prado, Madrid. Public domain image via Wikimedia Commons (file: El Tres de Mayo, by Francisco de Goya, from Prado thin black margin.jpg).","description":"A large oil painting of a night scene on a bare hillside outside a city. On the right side, about six soldiers stand in a tight line, leaning forward with guns raised to their shoulders and fixed bayonets pointing at the men in front of them. Their backs are to the viewer, and swords hang at their sides. A large box-shaped lantern sits on the ground between the soldiers and their targets and throws strong light on the left half of the picture. On the left, the men facing the guns are dressed in ordinary clothes. The brightest figure, a man in a white shirt and yellow trousers, kneels with both arms raised wide. Beside him a man in a dark cap stares at the guns, a monk kneels and prays, and another man clenches his fists. In the foreground, several bodies lie twisted on the ground in red pools of blood. Behind the group, more men walk up the slope, some covering their faces with their hands. In the dark background are the walls of a town, a church tower, and a few dim figures.","glossary":[{"t":"1808 in Madrid","d":"Madrid is the capital of Spain"}]},"X4":{"type":"bar","title":"Total Debt of the British Government at Selected Dates, 1689–1817","categories":["1689","1702","1714","1727","1763","1775","1784","1793","1817"],"series":[{"name":"Debt (millions of British pounds)","values":[0.7,16.4,54.1,52.1,138.9,128.6,249.9,239.4,840.9]}],"yLabel":"Millions of British pounds","text":"The figures are the total debt the government owed (funded and unfunded), rounded to the nearest £0.1 million. The source gives the debt in 1689, when William III became king; in 1702, 1714, and 1727, when Anne, George I, and George II took the throne; and in 1763, 1775, 1784, and 1793. Earlier figures are for England and then Great Britain. The 1817 figure includes Ireland's debt: the British and Irish treasuries were merged in January 1817, and the source gives the debt on February 1, 1817.","source":"The Statesman's Year-Book, 1871 (London: Macmillan, 1871), table of the British national debt, p. 224"},"X5":{"type":"passage","paragraphs":["Question. What are the duties of Christians toward those who govern them, and what in particular are our duties towards Napoleon I, our emperor?","Answer. Christians owe to the princes who govern them, and we in particular owe to Napoleon I, our emperor, love, respect, obedience, fidelity, military service, and the taxes levied for the preservation and defense of the empire and of his throne. We also owe him fervent prayers for his safety and for the spiritual and temporal prosperity of the state.","Question. Why are we subject to all these duties toward our emperor?","Answer. First, because God, who has created empires and distributes them according to his will, has, by loading our emperor with gifts both in peace and in war, established him as our sovereign and made him the agent of his power and his image upon earth. To honor and serve our emperor is therefore to honor and serve God himself. …","Question. Are there not special motives which should attach us more closely to Napoleon I, our emperor?","Answer. Yes, for it is he whom God has raised up in trying times to reestablish the public worship of the holy religion of our fathers and to be its protector; he has reestablished and preserved public order by his profound and active wisdom; he defends the state by his mighty arm; he has become the anointed of the Lord by the consecration which he has received from the sovereign pontiff, head of the Church universal.","Question. What must we think of those who are wanting in their duties toward our emperor?","Answer. According to the apostle Paul, they are resisting the order established by God himself and render themselves worthy of eternal damnation."],"attribution":"Imperial Catechism, a book of questions and answers for teaching religion, issued for use in all Catholic churches of the French Empire, April 1806","translation":"English translation in James Harvey Robinson, Readings in European History, vol. 2 (Boston, 1906); adapted","glossary":[{"t":"catechism","d":"a book that teaches religion through questions and answers, often memorized by children"},{"t":"fidelity","d":"loyalty"},{"t":"temporal","d":"having to do with this world rather than with heaven"},{"t":"anointed of the Lord","d":"a ruler blessed by God through a holy ceremony"},{"t":"consecration","d":"the religious ceremony that blessed him as emperor in 1804"},{"t":"sovereign pontiff","d":"the pope"},{"t":"wanting in","d":"failing in"},{"t":"damnation","d":"punishment in hell"}]},"X6":{"type":"passage","paragraphs":["The world desires to be governed by facts and according to justice, not by phrases and theories; the first need of society is to be maintained by strong authority (no authority without real strength deserves the name) and not to govern itself. … The first and greatest concern for the immense majority of every nation is the stability of the laws and their uninterrupted action—never their change. Therefore let the governments govern, let them maintain the foundations of their institutions, both ancient and modern; for if it is at all times dangerous to touch them, it certainly would not now, in the general confusion, be wise to do so.","Let the governments announce this determination to their people, and demonstrate it by facts. Let them reduce the doctrinaires to silence within their States, and show their contempt for them abroad. … Let them be precise and clear in all their words, and not seek by concessions to gain over those parties who aim at the destruction of all power but their own, whom concessions will never gain over, but only further embolden in their pretensions to power. …","Let them maintain religious principles in all their purity, and not allow the faith to be attacked and morality interpreted according to the social contract or the visions of foolish sectarians.","Let them suppress secret societies, that gangrene of society.","In short, let the great monarchs strengthen their union, and prove to the world that while it exists, it is beneficent, and insures the political peace of Europe; that it is powerful only for the maintenance of tranquillity at a time when so many attacks are directed against it; that the principles which they profess are paternal and protective, menacing only the disturbers of public tranquillity."],"attribution":"Klemens von Metternich, foreign minister of Austria, \"Political Confession of Faith,\" a private memorandum sent to Tsar Alexander I of Russia, December 1820","translation":"English translation from Memoirs of Prince Metternich, vol. 3 (1881), as printed in James Harvey Robinson and Charles A. Beard, Readings in Modern European History, vol. 1 (Boston, 1908); adapted","glossary":[{"t":"doctrinaires","d":"people who want to remake society to fit a theory"},{"t":"concessions","d":"things given up to satisfy an opponent"},{"t":"embolden","d":"make bolder"},{"t":"pretensions","d":"claims"},{"t":"sectarians","d":"people strongly attached to a religious or political group; used critically here"},{"t":"gangrene","d":"rotting flesh that spreads through the body"},{"t":"beneficent","d":"doing good"},{"t":"tranquillity","d":"calm and order"}]},"X7":{"type":"passage","paragraphs":["The principal object then which I proposed to myself in these Poems was to make the incidents of common life interesting by tracing in them, truly though not ostentatiously, the primary laws of our nature … Low and rustic life was generally chosen because in that situation the essential passions of the heart find a better soil in which they can attain their maturity, are less under restraint, and speak a plainer and more emphatic language; … and lastly, because in that situation the passions of men are incorporated with the beautiful and permanent forms of nature. …","For all good poetry is the spontaneous overflow of powerful feelings; but though this be true, Poems to which any value can be attached, were never produced on any variety of subjects but by a man who being possessed of more than usual organic sensibility had also thought long and deeply. …","For a multitude of causes unknown to former times are now acting with a combined force to blunt the discriminating powers of the mind, and unfitting it for all voluntary exertion to reduce it to a state of almost savage torpor. The most effective of these causes are the great national events which are daily taking place, and the encreasing accumulation of men in cities, where the uniformity of their occupations produces a craving for extraordinary incident which the rapid communication of intelligence hourly gratifies."],"attribution":"William Wordsworth, English poet, preface to Lyrical Ballads, a book of poems by Wordsworth and Samuel Taylor Coleridge, second edition, 1800","translation":"Text from Lyrical Ballads, with Other Poems, 1800, vol. 1 (Project Gutenberg edition of the 1800 text); adapted","glossary":[{"t":"ostentatiously","d":"in a showy way"},{"t":"rustic","d":"of the countryside"},{"t":"emphatic","d":"strong and clear"},{"t":"incorporated with","d":"joined to"},{"t":"spontaneous","d":"happening naturally, without planning"},{"t":"organic sensibility","d":"a natural ability to feel deeply"},{"t":"discriminating powers","d":"the ability to judge carefully"},{"t":"torpor","d":"a dull, sluggish state"},{"t":"encreasing","d":"an old spelling of increasing"},{"t":"intelligence","d":"here, news"}]},"X8":{"type":"passage","paragraphs":["… The truth is these wars* group themselves very symmetrically, and the whole period stands out as an age of gigantic rivalry between England and France, a kind of second Hundred Years' War. …","… the explanation of that second Hundred Years' War between England and France which fills the eighteenth century is this, that they were rival candidates for the possession of the New World, and the triple war** which fills the middle of the century is, as it were, the decisive campaign in that great world-struggle. …","But now it is most important to observe further that not only in America, but in Asia also, France and England in that age advanced side by side. … And I find, when I study the English conquest of India, that we were actuated neither by ambition nor yet by mere desire to advance our trade, but that from first to last, that is, from the first efforts of Clive to the time when Lord Wellesley, Lord Minto and Lord Hastings established our authority over the whole vast peninsula, we were actuated by fear of the French."],"attribution":"John Robert Seeley, British historian at the University of Cambridge, The Expansion of England, a book of lectures, 1883","translation":"Text from the first edition (London: Macmillan, 1883); adapted","footnotes":[{"mark":"*","text":"Seeley means England's wars with France from 1689 to 1815, which he lists just before this sentence. The first Hundred Years' War was a series of wars between England and France from 1337 to 1453."},{"mark":"**","text":"By the \"triple war,\" Seeley means a war that began with Spain in 1739 and turned into a war with France, the Seven Years' War (1756–1763), and the war over American independence (1775–1783), which France joined in 1778."}],"glossary":[{"t":"symmetrically","d":"in a balanced pattern"},{"t":"the New World","d":"the Americas"},{"t":"actuated","d":"moved to act"},{"t":"Clive, Wellesley, Minto, Hastings","d":"British leaders in India between the 1750s and the 1820s"},{"t":"peninsula","d":"here, India"}]},"P1":{"type":"passage","paragraphs":["… Mistress now of North America, lording it in India, through the company whose territorial conquests had been ratified by native princes, over twenty millions of inhabitants,—a population larger than that of Great Britain and having a revenue respectable alongside of that of the home government,—England, with yet other rich possessions scattered far and wide over the globe, had ever before her eyes, as a salutary lesson, the severe chastisement which the weakness of Spain had allowed her to inflict upon that huge disjointed empire. …","\"For the first time since the Middle Ages,\" says M. Martin,* speaking of the Seven Years' War, \"England had conquered France single-handed almost without allies, France having powerful auxiliaries. She had conquered solely by the superiority of her government.\"","Yes! but by the superiority of her government using the tremendous weapon of her sea power. This made her rich, and in turn protected the trade by which she had her wealth. With her money she upheld her few auxiliaries, mainly Prussia and Hanover, in their desperate strife. Her power was everywhere that her ships could reach, and there was none to dispute the sea to her. …","The one nation that gained in this war** was that which used the sea in peace to earn its wealth, and ruled it in war by the extent of its navy, by the number of its subjects who lived on the sea or by the sea, and by its numerous bases of operations scattered over the globe. …"],"attribution":"Alfred Thayer Mahan, United States naval officer and historian, The Influence of Sea Power upon History, 1660–1783, 1890","translation":"Text from the first edition (Boston: Little, Brown, 1890), pp. 326–329; adapted, with one misprint corrected as in later printings","footnotes":[{"mark":"*","text":"Henri Martin, a French historian of the 1800s."},{"mark":"**","text":"The Seven Years' War, 1756–1763."}],"glossary":[{"t":"bases of operations","d":"ports and forts where ships and troops can be supplied"},{"t":"auxiliaries","d":"allies who give military help"},{"t":"dispute","d":"challenge"},{"t":"the company","d":"the British East India Company"},{"t":"ratified","d":"formally approved"},{"t":"revenue","d":"income from taxes"},{"t":"salutary","d":"useful, even if unpleasant"},{"t":"chastisement","d":"punishment"}]},"P2":{"type":"passage","paragraphs":["Cahier of the grievances, complaints, and protests of the electoral district of Carcassonne, drawn up by the commissioners named by the general assembly of the third estate …","The third estate of the electoral district of Carcassonne, desiring to give to a beloved monarch, and one so worthy of our affection, the most unmistakable proof of its love and respect, of its gratitude and fidelity … declares that the happiness of the nation must, in their opinion, depend upon that of its king, upon the stability of the monarchy, and upon the preservation of the orders which compose it and of the fundamental laws which govern it …","1. Public worship should be confined to the Roman Catholic apostolic religion, to the exclusion of all other forms of worship …","8. … the nation should hereafter be subject only to such laws and taxes as it shall itself freely ratify.","9. The meetings of the Estates General of the kingdom should be fixed for definite periods …","10. In order to assure to the third estate the influence to which it is entitled in view of the number of its members, the amount of its contributions to the public treasury, and the manifold interests which it has to defend or promote in the national assemblies, its votes in the assembly should be taken and counted by head.","11. No order, corporation, or individual citizen may lay claim to any pecuniary exemptions. … All taxes should be assessed on the same system throughout the nation.","12. The due exacted from commoners holding fiefs should be abolished, and also the general or particular regulations which exclude members of the third estate from certain positions, offices, and ranks which have hitherto been bestowed on nobles either for life or hereditarily. A law should be passed declaring members of the third estate qualified to fill all such offices for which they are judged to be personally fitted."],"attribution":"Cahier (list of grievances) of the Third Estate of the district of Carcassonne, in southern France, written in the spring of 1789 for the meeting of the Estates-General","translation":"English translation in James Harvey Robinson and Charles A. Beard, Readings in Modern European History, vol. 1 (Boston, 1908); adapted","glossary":[{"t":"grievances","d":"complaints about unfair treatment"},{"t":"third estate","d":"everyone in France who was not a member of the clergy or the nobility"},{"t":"fidelity","d":"loyalty"},{"t":"orders","d":"the three estates: clergy, nobility, and commoners"},{"t":"ratify","d":"approve"},{"t":"counted by head","d":"counted one vote per deputy"},{"t":"corporation","d":"an organized group, such as a town or guild"},{"t":"pecuniary exemptions","d":"freedom from paying money, such as taxes"},{"t":"due exacted from commoners holding fiefs","d":"a fee charged to commoners who owned land that came with feudal rights"},{"t":"hereditarily","d":"passed down from parent to child"}]},"P3":{"type":"passage","paragraphs":["The National Assembly, after having heard the report of the ecclesiastical committee, has decreed and do decree the following as constitutional articles:","Title I, Article I. Each department* shall form a single diocese, and each diocese shall have the same extent and the same limits as the department. …","IV. No church or parish of France nor any French citizen may acknowledge upon any occasion, or upon any pretext whatsoever, the authority of an ordinary bishop or of an archbishop whose see shall be under the supremacy of a foreign power, nor that of his representatives residing in France or elsewhere; without prejudice, however, to the unity of the faith and the intercourse which shall be maintained with the visible head of the universal Church, as hereafter provided. …","Title II, Article I. Beginning with the day of publication of the present decree, there shall be but one mode of choosing bishops and parish priests, namely that of election. …","XIX. The new bishop may not apply to the pope for any form of confirmation, but shall write to him, as to the visible head of the universal Church, as a testimony to the unity of faith and communion maintained with him.","XXI. Before the ceremony of consecration begins, the bishop elect shall take a solemn oath … to be loyal to the nation, the law, and the king, and to support with all his power the constitution decreed by the National Assembly and accepted by the king. …","Title III, Article I. The ministers of religion, performing as they do the first and most important functions of society … shall be supported by the nation."],"attribution":"Civil Constitution of the Clergy, law passed by the National Assembly of France, July 1790","translation":"English translation in James Harvey Robinson, Readings in European History, vol. 2 (Boston, 1906); adapted","footnotes":[{"mark":"*","text":"In 1790 the National Assembly divided France into 83 new units called departments, each with its own elected officials."}],"glossary":[{"t":"ecclesiastical","d":"having to do with the church"},{"t":"diocese","d":"the area under one bishop"},{"t":"see","d":"the district governed by a bishop or archbishop"},{"t":"supremacy","d":"highest authority"},{"t":"without prejudice to","d":"without harming"},{"t":"intercourse","d":"communication"},{"t":"confirmation","d":"official approval"},{"t":"consecration","d":"the ceremony that makes a priest a bishop"}]},"P4":{"type":"pair","items":[{"label":"Source 1","paragraphs":["… Women carried large loaves of bread on pikes; others had branches of poplar, already yellowed by October. They were very joyous and amiable in their way, saving some jests addressed to the queen. \"We are conducting,\" they cried, \"the baker, the baker's wife, and the little journeyman.\" They all thought they were safe from famine, if they had the king amongst them. …","The revolution of the 6th October* was necessary, natural, and lawful; if it was sudden, unforeseen, and truly popular, it belonged especially to women, as that of the 14th July to men. Men took the Bastille, and women took the king."],"attribution":"Jules Michelet, French historian, The Women of the French Revolution, 1854","translation":"Translated by M. R. P. (Philadelphia: Henry Carey Baird, 1855); adapted","footnotes":[{"mark":"*","text":"On October 5, 1789, thousands of Paris women marched to the royal palace at Versailles. The next day the crowd forced the royal family to move to Paris."}],"glossary":[{"t":"pikes","d":"long poles with metal points, used as weapons"},{"t":"amiable","d":"friendly"},{"t":"saving","d":"except for"},{"t":"jests","d":"jokes"},{"t":"the baker, the baker's wife, and the little journeyman","d":"the crowd's nicknames for King Louis XVI, Queen Marie Antoinette, and their young son (a journeyman is a trained worker who has finished an apprenticeship)"}]},{"label":"Source 2","paragraphs":["8. Every Frenchman shall enjoy civil rights. …","213. The husband owes protection to his wife, the wife obedience to her husband.","214. The wife is obliged to live with her husband, and to follow him to every place where he may judge it convenient to reside: the husband is obliged to receive her, and to furnish her with every thing necessary for the wants of life, according to his means and station. …","217. A wife, although non-communicant or separate in property, cannot give, alienate, pledge, or acquire by free or chargeable title, without the concurrence of her husband in the act, or his consent in writing."],"attribution":"Civil Code of the French (the Napoleonic Code), law code issued in France in 1804, articles 8, 213, 214, and 217","translation":"Translated by a barrister of the Inner Temple, The Code Napoleon; or, The French Civil Code (London, 1824); adapted","glossary":[{"t":"civil rights","d":"rights under private law, such as owning property and making contracts"},{"t":"station","d":"rank in society"},{"t":"non-communicant or separate in property","d":"married under an agreement that keeps her property apart from her husband's"},{"t":"alienate","d":"sell or give away"},{"t":"by free or chargeable title","d":"as a gift or by paying for it"},{"t":"concurrence","d":"agreement"}]}]},"P5":{"type":"pair","items":[{"label":"Source 1","paragraphs":["The French people to the people of ——; brothers and friends:","We have conquered our liberty and we shall maintain it. We offer to bring this inestimable blessing to you, for it has always been rightly ours, and only by a crime have our oppressors robbed us of it. We have driven out your tyrants. Show yourselves free men and we will protect you from their vengeance, their machinations, or their return.","From this moment the French nation proclaims the sovereignty of the people, the suppression of all civil and military authorities which have hitherto governed you and of all the taxes which you bear, under whatever form, the abolition of the tithe, of feudalism, of seigniorial rights and monopolies of every kind, of serfdom, whether real or personal, of hunting and fishing privileges, of the corvée, the salt tax, the tolls and local imposts, and, in general, of all the various kinds of taxes with which you have been loaded by your usurpers; it also proclaims the abolition among you of all noble and ecclesiastical corporations and of all prerogatives and privileges opposed to equality. You are, from this moment, brothers and friends; all are citizens, equal in rights, and all are alike called to govern, to serve, and to defend your country."],"attribution":"Proclamation of the National Convention of France, to be published in lands occupied by French armies, December 15, 1792","translation":"English translation in James Harvey Robinson, Readings in European History, vol. 2 (Boston, 1906); adapted","glossary":[{"t":"inestimable","d":"too great to be measured"},{"t":"machinations","d":"secret plots"},{"t":"sovereignty","d":"the highest power to rule"},{"t":"hitherto","d":"until now"},{"t":"tithe","d":"a tax of one-tenth of a harvest or income, paid to the Church"},{"t":"seigniorial rights","d":"payments and services that peasants owed to their lords"},{"t":"corvée","d":"unpaid labor that peasants were forced to do, such as road work"},{"t":"imposts","d":"taxes"},{"t":"usurpers","d":"people who take power they have no right to"},{"t":"ecclesiastical corporations","d":"church organizations such as monasteries"},{"t":"prerogatives","d":"special rights"}]},{"label":"Source 2","paragraphs":["The French nation declares that it will treat as enemies every people who, refusing liberty and equality or renouncing them, may wish to maintain, recall, or treat with the prince and the privileged classes …"],"attribution":"Article 11 of the decree of the National Convention to which the proclamation in Source 1 was attached, December 15, 1792","translation":"English translation quoted in a note in James Harvey Robinson, Readings in European History, vol. 2 (Boston, 1906); adapted","glossary":[{"t":"treat with","d":"make agreements with"}]}]},"P6":{"type":"passage","paragraphs":["1. From this moment until that in which the enemy shall have been driven from the soil of the Republic, all Frenchmen are in permanent requisition for the service of the armies.","The young men shall go to battle; the married men shall forge arms and transport provisions; the women shall make tents and clothing and shall serve in the hospitals; the children shall turn old linen into lint; the aged shall betake themselves to the public places in order to arouse the courage of the warriors and preach the hatred of kings and the unity of the Republic.","2. The national buildings shall be converted into barracks, the public places into workshops for arms, the soil of the cellars shall be washed in order to extract therefrom the saltpetre. …","7. Nobody can get himself replaced in the service for which he shall have been requisitioned. The public functionaries shall remain at their posts.","8. The levy shall be general. The unmarried citizens and widowers without children, from eighteen to twenty-five years, shall march first …"],"attribution":"Decree for the levée en masse (mass levy), passed by the National Convention of France, August 23, 1793","translation":"English translation in Frank Maloy Anderson, The Constitutions and Other Select Documents Illustrative of the History of France, 1789–1907, 2nd ed. (Minneapolis, 1908); adapted","glossary":[{"t":"in permanent requisition","d":"required to serve until enemy forces had been driven from France"},{"t":"provisions","d":"food and supplies"},{"t":"lint","d":"soft cloth fibers used to dress wounds"},{"t":"betake themselves","d":"go"},{"t":"saltpetre","d":"a mineral used to make gunpowder"},{"t":"get himself replaced","d":"arrange for someone else to do his assigned service"},{"t":"public functionaries","d":"government officials"},{"t":"levy","d":"a call-up of people for military service"}]},"P7":{"type":"passage","paragraphs":["Would you have me recognize this liberty, have me fall at her feet, and shed all my blood for her? Then open the prison doors to the two hundred thousand citizens whom you call suspects, for in the Declaration of Rights no prisons for suspicion are provided for, only places of detention. Suspicion has no prison, but only the public accuser; there are no suspects, but only those accused of offenses established by law.","Do not think that such a measure would be fatal to the republic. It would, on the contrary, be the most revolutionary that you have adopted. You would exterminate all your enemies by the guillotine! But was there ever greater madness? Can you possibly destroy one enemy on the scaffold without making ten others among his family and friends? …","I am of a very different opinion from those who claim that it is necessary to leave Terror on the order of the day. I am confident, on the contrary, that liberty will be assured and Europe conquered so soon as you have a Committee of Clemency. This committee will complete the Revolution, for clemency is itself a Revolutionary measure, the most efficient of all when it is wisely dealt out."],"attribution":"Camille Desmoulins, French journalist and member of the National Convention, in his newspaper Le Vieux Cordelier, issue 4, December 20, 1793","translation":"English translation in James Harvey Robinson and Charles A. Beard, Readings in Modern European History, vol. 1 (Boston, 1908); adapted","glossary":[{"t":"suspects","d":"people arrested because officials suspected them of opposing the Revolution"},{"t":"detention","d":"holding someone in custody"},{"t":"public accuser","d":"the official who brings charges against a person in court"},{"t":"scaffold","d":"the platform where executions took place"},{"t":"on the order of the day","d":"as a current priority or course of action"},{"t":"clemency","d":"mercy"}]},"P8":{"type":"pair","items":[{"label":"Source 1","paragraphs":["The National Convention declares that negro* slavery in all the colonies is abolished; in consequence, it decrees that all men, without distinction of color, who are domiciled in the colonies are French citizens and shall enjoy all the rights guaranteed by the constitution.","It sends again to the Committee of Public Safety to prepare for it immediately a report upon the measures to be taken in order to assure the execution of the present decree."],"attribution":"Decree of the National Convention of France, February 4, 1794","translation":"English translation in Frank Maloy Anderson, The Constitutions and Other Select Documents Illustrative of the History of France, 1789–1907, 2nd ed. (Minneapolis, 1908)","footnotes":[{"mark":"*","text":"\"Negro\" was a common word for Black people in 1794 and in 1908, when this translation was published. It is now considered offensive."}],"glossary":[{"t":"domiciled","d":"living"},{"t":"execution","d":"here, carrying out"}]},{"label":"Source 2","paragraphs":["1. In the colonies restored to France in fulfillment of the treaty of Amiens* … slavery shall be maintained in conformity with the laws and regulations in force prior to 1789.","2. The same shall be done in the other French colonies beyond the Cape of Good Hope.","3. The trade in the blacks and their importation into the said colonies shall take place in conformity with the laws and regulations existing prior to the said date of 1789.","4. Notwithstanding all previous laws, the government of the colonies is subject for ten years to the regulations which shall be made by the government."],"attribution":"Law passed in France under Napoleon Bonaparte as First Consul, May 20, 1802","translation":"English translation in Frank Maloy Anderson, The Constitutions and Other Select Documents Illustrative of the History of France, 1789–1907, 2nd ed. (Minneapolis, 1908); adapted","footnotes":[{"mark":"*","text":"In the Treaty of Amiens (March 1802), Britain agreed to return to France several Caribbean islands, such as Martinique, that British forces had captured during the war."}],"glossary":[{"t":"in conformity with","d":"following"},{"t":"the trade in the blacks","d":"the translation's words for the trade in enslaved Africans to the colonies, in both the Atlantic and the Indian Ocean"},{"t":"notwithstanding","d":"in spite of"}]}]},"P9":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Caricature_gillray_plumpudding.jpg/1280px-Caricature_gillray_plumpudding.jpg","width":1280,"height":916,"alt":"A hand-colored cartoon of two men in military uniforms seated at a table, each slicing into a large globe on a platter. The man on the left uses a carving knife and fork; the man on the right, in an enormous feathered hat, uses a sword and fork.","caption":"Two men sit across a table from each other and carve a large steaming globe on a gold platter. On the left, British prime minister William Pitt, tall and thin, uses a carving knife and fork to cut a wide slice from the side of the globe marked \"Ocean.\" On the right, Napoleon Bonaparte, drawn as a much smaller figure and wearing a huge feathered hat, uses a sword to cut off a smaller piece marked \"Europe,\" with places such as France, Holland, and Spain written on it. The title at the top reads \"The Plumb-pudding in Danger; or, State Epicures Taking un Petit Souper,\" followed by the line \"the great Globe itself and all which it inherit, is too small to satisfy such insatiable appetites.\"","attribution":"James Gillray, British cartoonist, The Plumb-pudding in Danger, hand-colored etching published in London, February 26, 1805","credit":"Library of Congress, Prints and Photographs Division (digital ID cph.3g08791). Public domain image via Wikimedia Commons (file: Caricature gillray plumpudding.jpg).","description":"A hand-colored etching. A round table with a white cloth stands in the middle. On it is a gold platter holding a large globe drawn like a steaming Christmas pudding, with lines of latitude and longitude. On the left, a thin man in a red coat with gold shoulder pieces and a tall black hat sits on a chair decorated with a lion and a red cross. He leans forward and slices off a large curved section of the globe with a long carving knife, holding it steady with a fork. The section reads \"Ocean.\" On the right, a small man in a blue and red uniform and a very large hat with red and blue feathers sits on a chair with a crown on its back. He uses a sword to cut away a smaller piece marked \"Europe,\" where France, Holland, Spain, and other names appear. Each man has an empty gold plate in front of him. Steam rises from the globe into the sky. The title and a quotation run across the top, and the date and publisher appear in the upper left corner.","glossary":[{"t":"plumb-pudding","d":"plum pudding, a rich English dessert served at holidays"},{"t":"epicures","d":"people who love fine food"},{"t":"un petit souper","d":"French for \"a little supper\""},{"t":"insatiable","d":"impossible to satisfy"}]},"P10":{"type":"passage","paragraphs":["Napoleon, emperor of the French and king of Italy, in consideration of the facts: …","5. That this monstrous abuse of the right of blockade has no other aim than to prevent communication among the nations and to raise the commerce and the industry of England upon the ruins of that of the continent. …","We have consequently decreed and do decree that which follows.","Article I. The British Isles are declared to be in a state of blockade.","II. All commerce and all correspondence with the British Isles is forbidden. …","III. Every individual who is an English subject, of whatever state or condition he may be, who shall be discovered in any country occupied by our troops or by those of our allies, shall be made a prisoner of war. …","V. Trade in English goods is prohibited, and all goods belonging to England or coming from her factories or her colonies are declared a lawful prize. …","VII. No vessel coming directly from England or from the English colonies, or which shall have visited these since the publication of the present decree, shall be received in any port."],"attribution":"Napoleon Bonaparte, emperor of the French, decree issued at Berlin, Prussia, November 21, 1806","translation":"English translation in James Harvey Robinson, Readings in European History, vol. 2 (Boston, 1906); adapted","glossary":[{"t":"in consideration of","d":"because of"},{"t":"blockade","d":"an attempt to cut off an enemy's trade; a naval blockade uses warships, while this decree orders ports under French control to shut out British trade"},{"t":"commerce","d":"trade"},{"t":"correspondence","d":"letters"},{"t":"lawful prize","d":"property that may legally be seized"},{"t":"vessel","d":"ship"}]},"P11":{"type":"pair","items":[{"label":"Source 1","paragraphs":["Spaniards, you have been seduced by perfidious men. They have involved you in a mad conflict and induced you to rush to arms. … In a few months you have been subjected to all the horrors of popular faction. The defeat of your armies was the affair of a few marches. I have entered Madrid. The right of war authorizes me to make a terrible example and to wash out with blood the outrages committed against me and my nation. But my only thought is of clemency. … I will speedily expel from the peninsula that English army which has been dispatched to Spain, not to aid you, but to inspire in you a false confidence and to deceive you. …","Spaniards, your destiny is in my hands. … I have destroyed everything which stands in the way of your prosperity and greatness. I have broken the fetters which hampered the people. I have given you a liberal constitution, and, in the place of an absolute, I have given you a limited and constitutional monarchy. … But if all my efforts should prove useless and if you do not respond to my confidence, nothing will remain for me except to treat you as conquered provinces and to place my brother upon another throne.* …"],"attribution":"Napoleon Bonaparte, emperor of the French, proclamation to the people of Spain issued at Madrid, December 7, 1808","translation":"English translation in James Harvey Robinson, Readings in European History, vol. 2 (Boston, 1906); adapted","footnotes":[{"mark":"*","text":"In 1808 Napoleon removed Spain's royal family and made his brother Joseph king of Spain."}],"glossary":[{"t":"perfidious","d":"untrustworthy"},{"t":"popular faction","d":"political divisions and conflict among the people"},{"t":"clemency","d":"mercy"},{"t":"the peninsula","d":"Spain and Portugal"},{"t":"fetters","d":"chains"}]},{"label":"Source 2","paragraphs":["To date from the publication of the present decree, feudal rights are abolished in Spain. …","The tribunal of the Inquisition is abolished, as inconsistent with the civil sovereignty and authority. …","To date from January 1 next, the barriers existing between the provinces shall be suppressed. The custom houses shall be removed to the frontiers and there established."],"attribution":"Decrees issued by Napoleon at Madrid, December 4, 1808","translation":"English translation in James Harvey Robinson, Readings in European History, vol. 2 (Boston, 1906); adapted","glossary":[{"t":"the Inquisition","d":"a church court that tried people accused of heresy (beliefs against Church teaching)"},{"t":"civil sovereignty","d":"the government's power to rule"},{"t":"custom houses","d":"offices where taxes on traded goods are collected"}]}]},"P12":{"type":"passage","paragraphs":["As far as the German language extended, every one who saw the light within its domain could regard himself as a citizen in a two-fold sense, partly of his natal city, to whose immediate protection he was recommended; and partly of the entire common fatherland of the German nation. …","Let the various conditions among which you must choose pass before you. If you drift along in your torpor and your heedlessness, all the evils of slavery await you—deprivations, humiliations, the scorn and arrogance of the conqueror; you will be pushed about from pillar to post, because you have never found your proper niche, until, through the sacrifice of your nationality and of your language, you slip into some subordinate place where your nation shall sink its identity. If, on the other hand, you rouse yourselves, you will find, first of all, an enduring and honorable existence, and will behold a flourishing generation which promises to you and to the Germans the most glorious and lasting memory. Through the instrumentality of this new generation you will see in spirit the German name exalted to the most glorious among all nations; you will discern in this nation the regenerator and restorer of the world."],"attribution":"Johann Gottlieb Fichte, German philosopher, Addresses to the German Nation, lectures given in Berlin in 1807–1808","translation":"Translated by Louis H. Gray, in The German Classics of the Nineteenth and Twentieth Centuries, vol. 5 (New York, 1914); adapted","glossary":[{"t":"saw the light","d":"was born"},{"t":"domain","d":"area"},{"t":"natal city","d":"the city where a person was born"},{"t":"torpor","d":"a dull, sluggish state"},{"t":"heedlessness","d":"not paying attention"},{"t":"niche","d":"place"},{"t":"subordinate","d":"lower in rank"},{"t":"instrumentality","d":"means; help"},{"t":"exalted","d":"raised up and honored"},{"t":"regenerator","d":"someone who gives new life"}]},"P13":{"type":"passage","paragraphs":["In the name of the Most Holy and Indivisible Trinity.","Their Majesties the Emperor of Austria, the King of Prussia, and the Emperor of Russia, having, in consequence of the great events which have marked the course of the three last years in Europe, and especially of the blessings which it has pleased Divine Providence to shower down upon those States which place
