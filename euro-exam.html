<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF7EE">
<meta name="description" content="Euro Atlas AP Practice Exam: source-based AP European History practice by topic, then a timed multiple-choice exam built like the real one.">
<title>AP Practice Exam · AP European History · Euro Atlas</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><rect width='100' height='100' rx='22' fill='%230F1B33'/><circle cx='50' cy='50' r='27' fill='%231A2D52' stroke='%23D4B05E' stroke-width='5'/><ellipse cx='50' cy='50' rx='11' ry='27' fill='none' stroke='%23D4B05E' stroke-width='3.5'/><path d='M23 50h54' stroke='%23D4B05E' stroke-width='3.5'/><path d='M20 74C10 62 9 40 20 26M80 74C90 62 91 40 80 26' fill='none' stroke='%23D4B05E' stroke-width='5' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap">
<style>/* ===================================================================
   Euro Atlas · AP Practice Exam (AP European History)
   Tokens first (light, then html.dm dark), then components, then the
   Euro Atlas theme layer and the source (passage/image) styles.
   Light tokens follow the live Euro Atlas pages (navy, brass, cream,
   Fraunces + DM Sans); dark tokens follow the Euro Atlas dark-mode add-on.
   =================================================================== */
:root{
  --navy:#1A2D52;--navy-deep:#0F1B33;--navy-soft:#2E4373;
  --brass:#B8923A;--brass-ink:#7C6327;--brass-display:#9E7D32;--brass-light:#D4B05E;--brass-soft:#F4EBD3;
  --cream:#F7F1E5;--cream-warm:#EFE6D2;
  --paper:#FBF7EE;--paper-2:#F2EBDB;--card:#FFFDF8;
  --ink:#1A1A1A;--ink-2:#4F5562;--ink-3:#626875;
  --line:#DDD3BD;--line-2:#CBBEA2;
  --l1:#1A2D52;--l1-soft:#E8ECF4;--l1-deep:#1A2D52;
  --l2:#B8923A;--l2-soft:#F4EBD3;--l2-deep:#7C6327;
  --l3:#8B2A2A;--l3-soft:#F4E5E3;--l3-deep:#8B2A2A;
  --sun:#B8923A;--sun-soft:#F4EBD3;--mint:#2C6E6B;--mint-soft:#E2EFEE;--pink:#8B2A2A;--pink-soft:#F4E5E3;
  --red:#8B2A2A;--red-soft:#F4E5E3;--green:#3E6B4F;--green-soft:#E6EFE7;
  --red-line:#D9ABA5;--green-line:#A9C7B2;
  --r:4px;--r-sm:4px;--r-lg:4px;
  --sh:0 1px 2px rgba(26,45,82,.05),0 6px 18px rgba(26,45,82,.07);
  --sh-lg:0 14px 32px rgba(26,45,82,.10);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --green-deep:#2F5A40;--red-deep:#7A2222;--amber:#7C5A12;--amber-soft:#F6ECCF;--amber-line:#D9BD76;
  --focus:#B8923A;
  /* unit palette: the Euro Atlas home page colors units by period
     (Period 1 red, Period 2 navy, Period 3 forest, Period 4 plum) */
  --u1:#8B2A2A;--u1-soft:#F4E5E3;--u1-deep:#8B2A2A;
  --u2:#8B2A2A;--u2-soft:#F4E5E3;--u2-deep:#8B2A2A;
  --u3:#2E4373;--u3-soft:#E6EAF3;--u3-deep:#2E4373;
  --u4:#2E4373;--u4-soft:#E6EAF3;--u4-deep:#2E4373;
  --u5:#2E4373;--u5-soft:#E6EAF3;--u5-deep:#2E4373;
  --u6:#3E6B4F;--u6-soft:#E6EFE7;--u6-deep:#335A42;
  --u7:#3E6B4F;--u7-soft:#E6EFE7;--u7-deep:#335A42;
  --u8:#6B3A5B;--u8-soft:#F1E6EE;--u8-deep:#6B3A5B;
  --u9:#6B3A5B;--u9-soft:#F1E6EE;--u9-deep:#6B3A5B;
  /* stimulus colors */
  --stim-water:#DCE5EF;--stim-land:#EDE3CC;--stim-land-stroke:#B9AB8B;--stim-power:#D9D3E3;--stim-small:#FBF6EA;
  --zone-0:#8DB4F0;--zone-1:#ADCAF5;--zone-2:#CDDFF9;--zone-3:#E8F0FD;
  --pc-blue:#CFE0FF;--pc-orange:#FFD9C7;
  --bar-1:#1A2D52;--bar-2:#B8923A;--chart-grid:#E7DFCD;
  --claim-a:#2E4373;--claim-b:#8B2A2A;--lane:#1A1A1A;--conflict:#8B2A2A;--base-n:#6B3A5B;--base-s:#2C6E6B;
  --psg-bg:#FFFDF8;--psg-rule:#B8923A;
}
html.dm{
  color-scheme:dark;
  --navy:#0A1020;--navy-deep:#0A1020;--navy-soft:#A9B9E6;
  --brass:#C9A54F;--brass-ink:#E2C782;--brass-display:#DDBB6A;--brass-light:#E8D394;--brass-soft:#3A3014;
  --cream:#F7F1E5;--cream-warm:#1B243E;
  --paper:#0F1527;--paper-2:#161E36;--card:#1B2440;
  --ink:#EDE8DC;--ink-2:#C4CBDD;--ink-3:#A3ACC4;
  --line:#2F3A5A;--line-2:#3E4B72;
  --l1:#C9A54F;--l1-soft:#223457;--l1-deep:#E2C782;
  --l2:#C9A54F;--l2-soft:#3A3014;--l2-deep:#E8D394;
  --l3:#F0A0A0;--l3-soft:#3A1F22;--l3-deep:#F0A0A0;
  --sun:#C9A54F;--sun-soft:#3A3014;
  --red:#C0504A;--red-soft:#3A1F22;--green:#3F7A55;--green-soft:#173125;
  --red-line:#7A3434;--green-line:#3A6A4D;
  --green-deep:#8CD1A6;--red-deep:#F0A0A0;--amber:#E6C46A;--amber-soft:#3A3014;--amber-line:#7A6629;
  --sh:0 1px 2px rgba(0,0,0,.35),0 6px 18px -6px rgba(0,0,0,.55);
  --sh-lg:0 2px 4px rgba(0,0,0,.35),0 18px 40px -14px rgba(0,0,0,.7);
  --u1:#A23B3B;--u2:#A23B3B;--u3:#3D5592;--u4:#3D5592;--u5:#3D5592;--u6:#3F7553;--u7:#3F7553;--u8:#84476F;--u9:#84476F;
  --u1-soft:#3A1F22;--u1-deep:#F0A9A9;--u2-soft:#3A1F22;--u2-deep:#F0A9A9;
  --u3-soft:#1E2A4A;--u3-deep:#B9C8F0;--u4-soft:#1E2A4A;--u4-deep:#B9C8F0;--u5-soft:#1E2A4A;--u5-deep:#B9C8F0;
  --u6-soft:#173125;--u6-deep:#8CCBA0;--u7-soft:#173125;--u7-deep:#8CCBA0;
  --u8-soft:#2F1D2B;--u8-deep:#D4A4C6;--u9-soft:#2F1D2B;--u9-deep:#D4A4C6;
  --stim-water:#172B4D;--stim-land:#2E3550;--stim-land-stroke:#5E6788;--stim-power:#3B3560;--stim-small:#262C48;
  --bar-1:#A9B9E6;--bar-2:#D4B05E;--chart-grid:#2F3A5A;
  --claim-a:#A9B9E6;--claim-b:#E07A7A;--lane:#EDE8DC;--conflict:#E07A7A;
  --psg-bg:#151D33;--psg-rule:#A8822F;
}


/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
html,body{margin:0;background:var(--paper)}
body{color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,.disp{font-family:var(--display);font-weight:600;letter-spacing:-.01em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
a{color:var(--l1-deep)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
/* a.skip only: the review cards use .skip for unanswered questions */
a.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:4px;font-weight:700}
a.skip:focus{top:12px}
.app{min-height:100%;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:22px 20px 56px}
@media (max-width:640px){main{padding:14px 14px 48px}}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}

.bar-in{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;min-height:60px}
@media (max-width:640px){.bar-in{padding:8px 12px;gap:8px}}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:19px;color:var(--ink);text-align:left;min-height:44px;padding:0 4px;border-radius:12px}
.brand svg{width:32px;height:32px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);line-height:1;margin-bottom:3px}
.brand .bt{line-height:1.05}
.bar-ctx{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-2);font-size:14px;min-width:0}
.bar-ctx{flex:0 1 auto}.bar-ctx .ellip{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sp{flex:1}
.bar-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.brand .bt{display:none}.brand small{display:none}.bar-ctx{font-size:13px}}

/* unit pill used in the bar and cards */
.upill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--uc-soft);color:var(--uc-deep);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.02em;white-space:nowrap}
.upill i{width:8px;height:8px;border-radius:50%;background:var(--uc);display:inline-block}

/* ---------- buttons ---------- */
.act{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;font-weight:700;font-size:15px;line-height:1.2;border:2px solid transparent;transition:transform .12s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;white-space:nowrap;text-decoration:none}
.act:active{transform:translateY(1px)}
.act:disabled{opacity:.45;transform:none}
.act.primary{background:var(--ink);color:#fff;box-shadow:var(--sh)}
.act.primary:hover:not(:disabled){box-shadow:var(--sh-lg);transform:translateY(-1px)}
html.dm .act.primary{background:var(--brass);color:#0F1527}
.act.blue{background:var(--l1);color:#fff;box-shadow:var(--sh)}
.act.blue:hover:not(:disabled){background:var(--l1-deep);transform:translateY(-1px)}
html.dm .act.blue{color:#fff}
.act.unit{background:var(--uc);color:var(--uc-text,#fff);box-shadow:var(--sh)}
.act.unit:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--sh-lg)}
.act.ghost{background:var(--card);color:var(--ink);border-color:var(--line-2)}
.act.ghost:hover:not(:disabled){border-color:var(--ink-3);transform:translateY(-1px)}
.act.soft{background:var(--paper-2);color:var(--ink-2)}
.act.soft:hover:not(:disabled){background:var(--line)}
.act.quiet{background:transparent;color:var(--ink-2);padding:8px 12px;font-weight:700}
.act.quiet:hover:not(:disabled){background:var(--paper-2)}
.act.sm{min-height:40px;padding:8px 14px;font-size:14px}
@media (pointer:coarse),(max-width:899px){.act.sm,.seg button,.tchip{min-height:44px}}
.act.wide{width:100%}
.act .ic{width:18px;height:18px;flex:none}
.act[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts.center{justify-content:center}
.acts.between{justify-content:space-between}
.acts.end{justify-content:flex-end}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:7px;border:1px solid var(--line-2);background:var(--paper-2);font:700 12px/1 var(--mono);color:var(--ink-2)}

/* ---------- surfaces ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
@media (max-width:640px){.panel{padding:16px;border-radius:16px}}
.panel.flat{box-shadow:none}
.eyebrow{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.tag-meta{display:inline-flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.tag-meta b{font-weight:800;color:var(--ink-3)}
.note{font-size:13.5px;color:var(--ink-3);line-height:1.5}

/* ---------- start screen ---------- */
.hero{text-align:center;padding:26px 0 22px;position:relative}
.hero h1{font-size:clamp(34px,6vw,54px);font-weight:600;color:var(--ink);letter-spacing:-.02em}
.hero h1 .gl{background:linear-gradient(90deg,var(--l1),var(--l3) 55%,var(--l2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin:10px auto 0;max-width:620px;font-size:17px;color:var(--ink-2)}
.kpis{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0 6px}
.kpi{display:flex;flex-direction:column;align-items:center;min-width:132px;padding:12px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.kpi .v{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;color:var(--ink)}
.kpi .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:22px}
.ucd{position:relative;min-width:0;display:flex;flex-direction:column;gap:12px;padding:20px 20px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.ucd::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--uc)}
.ucd.live:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.ucd .uh{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ucd .un{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--uc-soft);color:var(--uc-deep);font-family:var(--display);font-weight:600;font-size:18px}
.ucd h3{font-size:21px;line-height:1.15;color:var(--ink)}
.ucd .best{font-size:12.5px;font-weight:800;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.ucd .best .ok{color:var(--green-deep)}
.ucd .ubtns{display:grid;gap:8px;margin-top:auto}
.ucd .ubtns .act{justify-content:space-between;padding:10px 14px;min-width:0;white-space:normal;flex-wrap:wrap;text-align:left;row-gap:2px}
.ucd .ubtns .act small{font-weight:600;font-size:12.5px;opacity:.85;white-space:nowrap}
.ucd.soon{background:var(--paper-2);border-style:dashed;box-shadow:none;opacity:.78}
.ucd.soon::before{opacity:.5}
.ucd.soon .soonpill{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);color:var(--ink-3)}
.resume{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);padding:5px 10px;border-radius:999px}
.how{margin-top:26px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;align-items:stretch}
@media (max-width:860px){.how{grid-template-columns:1fr}}
.how .panel{display:flex;flex-direction:column;gap:8px}
.how h3{font-size:19px}
.how .stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--l1-soft);color:var(--l1-deep);font-family:var(--display);font-weight:600;font-size:15px}
.how p{color:var(--ink-2);font-size:14.5px}
.note-line{margin-top:16px;text-align:center;font-size:13.5px;color:var(--ink-3)}
.foot{padding:22px 20px 26px;text-align:center;font-size:13px;color:var(--ink-3);font-weight:600;border-top:1px solid var(--line)}
.foot a{color:var(--ink-2)}

/* ---------- practice ---------- */
.phead{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.phead h2{font-size:26px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 13px;border-radius:999px;background:var(--card);border:1.5px solid var(--line-2);color:var(--ink-2);font-weight:700;font-size:14px;transition:.15s;text-align:left}
@media (pointer:coarse){.tchip{min-height:44px}}
.tchip:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.tchip .n{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-3);font-size:12px;font-weight:800}
.tchip .id{font-family:var(--display);font-weight:600;color:var(--uc-deep)}
.tchip[aria-pressed="true"]{background:var(--uc-soft);border-color:var(--uc);color:var(--ink)}
.tchip[aria-pressed="true"] .n{background:var(--uc);color:#fff}
.prog{height:10px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.prog > span{display:block;height:100%;width:0;border-radius:999px;background:var(--uc);transition:width .35s ease}
.prog-row{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:800;color:var(--ink-3)}
.prog-row .prog{flex:1}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:24px;max-width:860px;margin:0 auto}
@media (max-width:640px){.qcard{padding:16px;border-radius:16px}}
.stem{font-size:18px;line-height:1.5;color:var(--ink);margin:14px 0 18px;font-weight:500}
.qn{font-family:var(--display);font-weight:600;color:var(--ink-3);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.qn:focus,.qn:focus-visible{outline:none}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;width:100%;min-height:56px;padding:12px 14px;text-align:left;border-radius:14px;border:2px solid var(--line-2);background:var(--card);color:var(--ink);font-size:16px;line-height:1.45;transition:transform .12s,border-color .15s,background .15s,box-shadow .15s}
.opt .ltr{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:17px}
.opt .mk{font-weight:800;font-size:14px;white-space:nowrap;display:none;align-items:center;gap:6px}
.opt:hover:not(:disabled){border-color:var(--uc,var(--ink-3));transform:translateY(-1px);box-shadow:var(--sh)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.6}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ok .ltr{background:var(--green);color:#fff}
.opt.ok .mk{display:inline-flex;color:var(--green-deep)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .ltr{background:var(--red);color:#fff}
.opt.bad .mk{display:inline-flex;color:var(--red-deep)}
@media (max-width:480px){.opt{grid-template-columns:34px 1fr;padding:10px 12px;font-size:15px}.opt .ltr{width:34px;height:34px;font-size:15px}.opt .mk{grid-column:2;justify-self:start}}
.fbk{margin-top:18px;border-radius:16px;padding:16px 18px;border:1.5px solid;display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:start}
.fbk.ok{background:var(--green-soft);border-color:var(--green-line);color:var(--ink)}
.fbk.bad{background:var(--red-soft);border-color:var(--red-line);color:var(--ink)}
.fbk .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff;font-weight:900;font-size:20px;position:relative}
.fbk.ok .ico{background:var(--green)}
.fbk.bad .ico{background:var(--red)}
.fbk h4{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2;margin-bottom:4px}
.fbk .exp{font-size:16px;line-height:1.55;color:var(--ink)}
.fbk .body{min-width:0}
.whynot{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.5;color:var(--ink-2)}
.whynot b{color:var(--ink)}
html.dm .whynot{background:rgba(255,255,255,.06)}
details.more{margin-top:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);overflow:hidden}
html.dm details.more{background:rgba(255,255,255,.04)}
details.more summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;font-size:14.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-height:44px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-left:2px;flex:none}
details.more[open] summary::before{transform:rotate(45deg)}
details.more .inner{padding:0 14px 14px;display:grid;gap:10px}
.wn{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.wn .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.wn.correct .ltr{background:var(--green);color:#fff}
.pnext{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.pnext .hint{font-size:13px;color:var(--ink-3);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (pointer:coarse){.pnext .hint{display:none}}
/* celebration (practice correct) */
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--c);animation:burst .7s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}}
/* summary */
.sumhead{text-align:center;padding:10px 0 18px}
.sumhead .big{font-family:var(--display);font-weight:600;font-size:54px;line-height:1;color:var(--ink)}
.sumhead .big small{font-size:24px;color:var(--ink-3)}
.sumhead p{color:var(--ink-2);margin-top:6px}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(110px,1.3fr) 2fr auto;align-items:center;gap:12px;font-size:14px}
@media (max-width:560px){.row{grid-template-columns:1fr auto;gap:6px 10px}.row .lbl{grid-row:1}.row .cnt{grid-row:1;grid-column:2}.row .trk{grid-column:1/-1;grid-row:2}}
.row .lbl{font-weight:700;color:var(--ink-2);min-width:0}
.row .lbl b{font-family:var(--display);font-weight:600;color:var(--ink);margin-right:6px}
.row .trk{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.row .trk > span{display:block;height:100%;border-radius:999px;background:var(--green)}
.row .trk > span.mid{background:var(--sun)}
.row .trk > span.low{background:var(--red)}
.row .cnt{font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- exam (calm) ---------- */
.exam main{max-width:1200px}
.xtop{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.xtop-in{max-width:1200px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;min-height:58px}
@media (max-width:640px){.xtop-in{padding:6px 10px;gap:8px}}
.xtop .who{font-weight:700;color:var(--ink-2);font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.xtop .qpos{font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink);white-space:nowrap}
.short{display:none}
@media (max-width:640px){.xtop .who .ellip,.xtop .upill{display:none}.xtop .long{display:none}.xtop .short{display:inline}.xtop .qpos{font-size:17px}.xtop .act.sm{padding:8px 11px}.xtop .timer{padding:0 10px;font-size:16px}.xtop .timer svg{display:none}}
@media (max-width:360px){.xtop .who{display:none}}
.timer{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--paper-2);color:var(--ink);font:700 18px/1 var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums;border:1.5px solid transparent}
.timer svg{width:16px;height:16px}
.timer.warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.timer.crit{background:var(--red-soft);color:var(--red-deep);border-color:var(--red-line);animation:tick 1s steps(2) infinite}
@keyframes tick{50%{border-color:var(--red)}}
.xintro{max-width:720px;margin:0 auto;display:grid;gap:18px}
.xintro h2{font-size:30px}
.xintro .facts{display:flex;flex-wrap:wrap;gap:8px}
.xintro .facts span{padding:7px 12px;border-radius:999px;background:var(--paper-2);font-weight:700;font-size:13.5px;color:var(--ink-2)}
.xintro .dir{font-size:16px;line-height:1.6;color:var(--ink);padding:18px 20px;border-left:4px solid var(--ink);background:var(--card);border-radius:0 14px 14px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.xintro ul{margin:0;padding-left:20px;color:var(--ink-2);font-size:15px;display:grid;gap:6px}
.xwrap{display:grid;gap:22px;align-items:start}
.xwrap.has-stim{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.xwrap.has-stim{grid-template-columns:minmax(0,11fr) minmax(0,10fr)}}
.xq{max-width:760px;margin:0 auto;width:100%}
.xwrap.has-stim .xq{margin:0}
.scol{min-width:0}
@media (min-width:900px){.scol .sticky{position:sticky;top:72px;max-height:calc(100vh - 84px);overflow:auto;padding-right:2px}}
.setlabel{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-2);margin-bottom:10px}
.stoggle{display:none}
@media (max-width:899px){.stoggle{display:inline-flex;margin-bottom:10px}.scol.off .stimwrap{display:none}}
.xq .qn{margin-bottom:4px}
.xq .stem{font-size:17.5px;margin:10px 0 18px}
.xopts{display:grid;gap:10px}
.xopt{display:grid;grid-template-columns:36px 1fr;align-items:center;gap:14px;width:100%;min-height:52px;padding:12px 14px;text-align:left;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);font-size:16px;line-height:1.45;transition:border-color .15s,background .15s,box-shadow .15s}
.xopt .ltr{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:15.5px;background:var(--card);transition:.15s}
.xopt:hover{border-color:var(--ink-3)}
.xopt[aria-checked="true"]{border-color:var(--ink);background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--ink)}
.xopt[aria-checked="true"] .ltr{background:var(--ink);border-color:var(--ink);color:var(--card)}
html.dm .xopt[aria-checked="true"]{background:rgba(255,255,255,.06)}
.xnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.xnav .mid{display:flex;gap:8px;flex-wrap:wrap}
.flagged-note{font-size:13px;color:var(--amber);font-weight:800}
/* navigator drawer + modal */
.veil{position:fixed;inset:0;background:rgba(15,27,51,.5);z-index:40;display:flex;justify-content:flex-end;animation:fade .15s ease}
.veil.center{justify-content:center;align-items:center;padding:16px}
@keyframes fade{from{opacity:0}}
.drawer{width:min(380px,92vw);height:100%;background:var(--card);box-shadow:var(--sh-lg);padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.drawer h3{font-size:20px;display:flex;justify-content:space-between;align-items:center}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.navq{position:relative;display:grid;place-items:center;min-height:46px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink-2);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.navq.ans{background:var(--ink);border-color:var(--ink);color:var(--card)}
.navq.cur{box-shadow:0 0 0 3px var(--l1-soft),0 0 0 5px var(--l1)}
.navq.flag::after{content:"⚑";position:absolute;top:-7px;right:-5px;font-size:13px;line-height:1;color:var(--amber);background:var(--card);border-radius:50%;padding:1px 2px}
.navq.flag{border-color:var(--amber-line)}
.navkey{display:grid;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.navkey span{display:flex;align-items:center;gap:8px}
.navkey i{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--card);display:inline-block}
.navkey i.ans{background:var(--ink);border-color:var(--ink)}
.navkey i.flag{border-color:var(--amber);background:var(--amber-soft)}
.sheet{width:min(520px,100%);background:var(--card);border-radius:var(--r);box-shadow:var(--sh-lg);padding:22px;display:grid;gap:14px;animation:rise .18s ease}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.sheet h3{font-size:22px}
.sheet .list{display:grid;gap:8px;font-size:15px;color:var(--ink-2)}
.sheet .list b{color:var(--ink)}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums span{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:9px;background:var(--paper-2);font-weight:800;font-size:13.5px;color:var(--ink-2)}
.nums span.f{background:var(--amber-soft);color:var(--amber)}
/* score report */
.score{max-width:900px;margin:0 auto;display:grid;gap:18px}
.score-hero{text-align:center;padding:26px 20px 22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);position:relative;overflow:hidden}
.score-hero .big{font-family:var(--display);font-weight:600;font-size:72px;line-height:1;color:var(--ink);letter-spacing:-.02em}
.score-hero .big small{font-size:28px;color:var(--ink-3);font-weight:600}
.score-hero .pct{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink-2);margin-top:4px}
.score-hero .sub{margin-top:8px;color:var(--ink-3);font-size:14px;font-weight:600}
.apbadge{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:16px auto 0;padding:12px 22px;border-radius:16px;background:var(--sun-soft);border:1px solid var(--amber-line)}
.apbadge .n{font-family:var(--display);font-weight:600;font-size:36px;line-height:1;color:var(--ink)}
.apbadge .l{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.apbadge .d{font-size:12px;color:var(--ink-3);font-weight:600;max-width:320px;line-height:1.4;margin-top:4px}
.score .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.score .two{grid-template-columns:1fr}}
.score h3{font-size:19px;margin-bottom:12px}
.copybox{display:grid;gap:8px}
.copybox textarea{width:100%;min-height:160px;font:13px/1.45 var(--mono);padding:12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--paper-2);color:var(--ink);resize:vertical}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
/* review */
.review{max-width:900px;margin:0 auto;display:grid;gap:16px}
.rvhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rvhead h2{font-size:26px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line)}
.seg button{min-height:38px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.rv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;border-left-width:5px}
.rv.ok{border-left-color:var(--green)}
.rv.bad{border-left-color:var(--red)}
.rv.skip{border-left-color:var(--line-2)}
@media (max-width:640px){.rv{padding:16px}}
.rv header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rv .rn{font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink)}
.rvb{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-weight:800;font-size:12.5px}
.rvb.ok{background:var(--green-soft);color:var(--green-deep)}
.rvb.bad{background:var(--red-soft);color:var(--red-deep)}
.rvb.skip{background:var(--paper-2);color:var(--ink-3)}
.rv .stem{font-size:16.5px;margin:10px 0 12px}
.rvopts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rvopts li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;font-size:15px;line-height:1.45;color:var(--ink-2);border:1px solid transparent}
.rvopts li .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.rvopts li .mk{display:block;font-size:12.5px;font-weight:800;margin-top:2px}
.rvopts li.is-correct{background:var(--green-soft);border-color:var(--green-line);color:var(--ink)}
.rvopts li.is-correct .ltr{background:var(--green);color:#fff}
.rvopts li.is-correct .mk{color:var(--green-deep)}
.rvopts li.is-pick{background:var(--red-soft);border-color:var(--red-line);color:var(--ink)}
.rvopts li.is-pick .ltr{background:var(--red);color:#fff}
.rvopts li.is-pick .mk{color:var(--red-deep)}
.rv .fbk{margin-top:14px}
.rat{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.rat .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:14px}
.rat.correct .ltr{background:var(--green);color:#fff}
.rv details.more summary{font-size:14px}
.empty{text-align:center;padding:30px;color:var(--ink-3);font-weight:600}

/* ---------- stimulus ---------- */
.stim{margin:0 0 6px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;display:grid;gap:12px;min-width:0}
.stim>*{min-width:0;max-width:100%}
.exam .stim{border-color:var(--line);box-shadow:none}
.practice .stim{background:var(--paper-2);border-color:transparent}
html.dm .practice .stim{background:rgba(255,255,255,.04)}
.stim-title{font-family:var(--body);text-transform:uppercase;font-weight:800;letter-spacing:.06em;font-size:12.5px;color:var(--ink);line-height:1.45}
.stim-source{font-size:12px;color:var(--ink-3);font-style:italic}
.stim-text,.stim-note,.stim-desc{font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.stim-note{padding:10px 12px;border-radius:10px;background:var(--paper);border:1px dashed var(--line-2)}
html.dm .stim-note{background:rgba(255,255,255,.04)}
.stim.unavail{align-items:center;justify-items:center;text-align:center;padding:22px;border-style:dashed;color:var(--ink-3);font-weight:700}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.stab{border-collapse:collapse;width:100%;min-width:320px;font-size:14px;line-height:1.4}
.stab th,.stab td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.stab thead th{font-weight:800;color:var(--ink);background:var(--paper-2);border-bottom:2px solid var(--line-2);font-size:13px}
.stab tbody th{font-weight:700;color:var(--ink)}
.stab tbody tr:nth-child(even) td,.stab tbody tr:nth-child(even) th{background:var(--paper)}
html.dm .stab tbody tr:nth-child(even) td,html.dm .stab tbody tr:nth-child(even) th{background:rgba(255,255,255,.03)}
.stab td,.stab th{color:var(--ink-2)}
.stab tbody th{color:var(--ink)}
.dresults .stim-title{font-size:13.5px}
/* chart */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2);font-weight:600;align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:7px}
.legend .sw{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.08)}
.legend .sw.s0{background:var(--bar-1)}
.legend .sw.s1{background:var(--bar-2);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)}
.legend svg{width:22px;height:16px;display:block;flex:none}
.chart{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scrollhint{font-size:12px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin:-6px 0 -4px}
.scrollhint::before{content:"↔";font-size:14px}
.chart svg{display:block;width:100%;min-width:460px;height:auto;font-family:var(--body)}
.chart .grid{stroke:var(--chart-grid);stroke-width:1}
.chart .axis{stroke:var(--ink-3);stroke-width:1.2}
.chart .tick,.chart .cat{fill:var(--ink-2);font-size:13px;font-weight:600}
.chart .ylab{fill:var(--ink-3);font-size:12.5px;font-weight:700}
.chart .val{fill:var(--ink);font-size:12.5px;font-weight:800}
.chart .bar.s0{fill:var(--bar-1)}
.chart .bar.s1{fill:var(--bar-2)}
.chart .bar{stroke:none}
/* district maps */
.dplans{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.dplan{margin:0;display:grid;gap:6px;justify-items:center;flex:0 1 250px;max-width:100%}
.dplan svg{width:100%;height:auto;display:block}
.dplan figcaption{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink)}
.dmap .pc{stroke:var(--card);stroke-width:1.5}
.dmap .pc.blue{fill:var(--pc-blue)}
.dmap .pc.orange{fill:var(--pc-orange)}
.dmap .pval{fill:var(--ink);font-size:15px;font-weight:800;font-family:var(--body)}
.dmap .dline{stroke:var(--ink);stroke-width:4;stroke-linecap:square;fill:none}
.legend .sw.pblue{background:var(--pc-blue)}
.legend .sw.porange{background:var(--pc-orange)}
.legend .sw.dline{height:0;border:0;border-top:4px solid var(--ink);border-radius:0;width:18px}
/* schematic maps */
.smap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.smap svg{display:block;width:100%;min-width:560px;height:auto;font-family:var(--body);border-radius:12px;border:1px solid var(--line)}
.smap .water{fill:var(--stim-water)}
.smap .land{fill:var(--stim-land);stroke:var(--stim-land-stroke);stroke-width:1.5}
.smap .land.power{fill:var(--stim-power);stroke:#8E85B0}
.smap .land.small{fill:var(--stim-small);stroke:#9A917A}
html.dm .smap .land.small{stroke:#6B668A}
.smap .island{fill:var(--stim-land);stroke:var(--stim-land-stroke);stroke-width:1.5}
.smap .lbl{fill:var(--ink);font-weight:700;font-size:15px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;font-family:var(--display)}
html.dm .smap .lbl{stroke:#0F1527}
.smap .lbl.big{font-size:19px}
.smap .lbl.sm{font-size:12.5px;font-family:var(--body);font-weight:700}
.smap .sub{fill:var(--ink-2);font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round;text-anchor:middle}
html.dm .smap .sub{stroke:#0F1527}
.smap .zone{stroke:var(--ink-3);stroke-width:1}
.smap .zone.z0{fill:var(--zone-0)}.smap .zone.z1{fill:var(--zone-1)}.smap .zone.z2{fill:var(--zone-2)}.smap .zone.z3{fill:var(--zone-3)}
.smap .hatchline{stroke:var(--ink-2);stroke-width:1.6}

/* ===================================================================
   Euro Atlas theme layer
   Matches the live Euro Atlas pages: Fraunces headings with italic
   brass accents, DM Sans text, letter-spaced uppercase eyebrows, square
   cards with a 3px period-colored tag, pill buttons, navy-deep hero.
   =================================================================== */
h1,h2,h3{font-weight:500;letter-spacing:-.015em}
h2 em,h3 em{font-style:italic;font-weight:400;color:var(--brass-display)}
.eyebrow{font-family:var(--body);font-weight:600;font-size:11.5px;letter-spacing:.22em;color:var(--brass-ink)}
.qn{font-family:var(--body);font-weight:600;font-size:11.5px;letter-spacing:.2em;color:var(--brass-ink)}
.opt .ltr,.xopt .ltr,.wn .ltr,.rat .ltr,.rvopts li .ltr,.navq,.tchip .id,.upill{font-family:var(--body);font-weight:700}
a{color:var(--navy-soft)}
html.dm a{color:var(--brass-light)}
/* top bar: the Euro Atlas sticky nav (paper, hairline rule, brass accent) */
.bar,.xtop{background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(26,45,82,.06);backdrop-filter:none;-webkit-backdrop-filter:none}
html.dm .bar,html.dm .xtop{box-shadow:0 1px 0 rgba(255,255,255,.04)}
.brand{color:var(--ink);gap:11px}
.brand svg{width:38px;height:38px}
.brand small{color:var(--brass-ink);font-weight:600;font-size:10px;letter-spacing:.22em}
.brand .bt{font-family:var(--display);font-weight:500;font-size:20px;color:var(--navy);letter-spacing:-.01em}
html.dm .brand .bt{color:var(--ink)}
.bar-ctx{color:var(--ink-2);font-weight:600}
.xtop .who{color:var(--ink-2)}
.xtop .qpos{color:var(--ink);font-family:var(--body);font-weight:700;font-size:15px}
.xtop .timer{background:var(--card);border-color:var(--line-2)}
/* buttons: pills, like the site's filter and link buttons */
.act{border-radius:100px;font-weight:600;letter-spacing:.005em}
.act.primary{background:var(--navy);color:#F7F1E5;box-shadow:none}
.act.primary:hover:not(:disabled){background:var(--navy-soft);box-shadow:var(--sh)}
html.dm .act.primary{background:var(--brass);color:#0F1527}
html.dm .act.primary:hover:not(:disabled){background:var(--brass-light)}
.act.gold{background:var(--brass);color:#0F1B33;box-shadow:none}
.act.gold:hover:not(:disabled){background:var(--brass-light);transform:translateY(-1px)}
.act.ghost{border-width:1px;background:var(--card)}
.act.ghost:hover:not(:disabled){border-color:var(--brass)}
.act.unit{box-shadow:none}
.act.unit:hover:not(:disabled){filter:brightness(1.12);box-shadow:var(--sh)}
.act.quiet:hover:not(:disabled){background:var(--paper-2)}
.act[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
/* square surfaces, like the site's cards */
.qcard,.panel,.stim,.fbk,.whynot,details.more,.phint,.gloss,.opt,.xopt,.rv,.score-hero,.sheet,.copybox textarea,.stim-note,.imgbox,.smap,.smap svg,.elim,.navq,.navkey i,.nums span,.kbd,.rvopts li,.wn .ltr,.rat .ltr,.rvopts li .ltr{border-radius:4px}
.xintro .dir{border-radius:0 4px 4px 0}
.panel,.qcard,.rv{box-shadow:none}
/* home: hero band (full width, navy-deep with the site's brass rings) */
.hero{text-align:left;padding:0;margin:0;background:var(--navy-deep);color:#F7F1E5;border-radius:0;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border:1px solid rgba(212,176,94,.20);border-radius:50%;pointer-events:none}

.hero-in{max-width:1160px;margin:0 auto;padding:54px 20px 46px;display:flex;align-items:center;gap:44px;position:relative;z-index:1}

.hero h1 em{font-style:italic;font-weight:400;color:#D4B05E}

.hero .kpi{background:none;border:0;box-shadow:none;border-radius:0;padding:0 34px 0 0;margin:0 34px 0 0;border-right:1px solid rgba(212,176,94,.18);min-width:0;align-items:flex-start}
.hero .kpi:last-child{border-right:0;margin-right:0;padding-right:0}

}
main.home{padding-top:40px}
/* period headings: italic brass numeral, eyebrow with dates, Fraunces title */
.period{margin:0 0 42px}

/* unit cards: the site's card (square, 3px tag in the period color) */
.ugrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:0}

   =================================================================== */

<script>window.PE_DATA={"units":{"5":{"unit":5,"title":"Conflict, Crisis, and Reaction in the Late 18th Century","period":"c. 1648–1815","examWeighting":"10–15%","blurb":"Britain's rise in the wars with France, the French Revolution and its effects, Napoleon's empire and the reactions to it, the Congress of Vienna, and Romanticism.","version":"2026-11-08c","topics":[{"id":"5.1","name":"Contextualizing 18th-Century States","lo":["A"]},{"id":"5.2","name":"The Rise of Global Markets","lo":["B"]},{"id":"5.3","name":"Britain's Ascendency","lo":["C"]},{"id":"5.4","name":"The French Revolution","lo":["D"]},{"id":"5.5","name":"The French Revolution's Effects","lo":["E"]},{"id":"5.6","name":"Napoleon's Rise, Dominance, and Defeat","lo":["F","G"]},{"id":"5.7","name":"The Congress of Vienna","lo":["H"]},{"id":"5.8","name":"Romanticism","lo":["I"]},{"id":"5.9","name":"Continuity and Change in 18th-Century States","lo":["J"]}],"stimuli":{"X1":{"type":"passage","paragraphs":["The business going forward at present in the pamphlet shops of Paris is incredible. I went to the Palais Royal* to see what new things were published, and to procure a catalogue of all. Every hour produces something new. Thirteen came out to-day, sixteen yesterday, and ninety-two last week. … This spirit of reading political tracts, they say, spreads into the provinces, so that all the presses of France are equally employed. Nineteen-twentieths of these productions are in favour of liberty, and commonly violent against the clergy and nobility; … enquiring for such as had appeared on the other side of the question, to my astonishment I find there are but two or three that have merit enough to be known. Is it not wonderful, that while the press teems with the most levelling and even seditious principles, that if put in execution would overturn the monarchy, nothing in reply appears, and not the least step is taken by the court to restrain this extreme licentiousness of publication. It is easy to conceive the spirit that must thus be raised among the people. But the coffee-houses in the Palais Royal present yet more singular and astonishing spectacles; they are not only crouded within, but other expectant crouds are at the doors and windows, listening a gorge deploye to certain orators, who from chairs or tables harangue each his little audience: the eagerness with which they are heard, and the thunder of applause they receive for every sentiment of more than common hardiness or violence against the present government, cannot easily be imagined. I am all amazement at the ministry permitting such nests and hot-beds of sedition and revolt, which disseminate amongst the people, every hour, principles that by and by must be opposed with vigour, and therefore it seems little short of madness to allow the propagation at present."],"attribution":"Arthur Young, English farmer and writer on agriculture who traveled through France in 1787–1789, journal entry written in Paris, June 9, 1789, published in his Travels in France, 1792","translation":"Text from Arthur Young's Travels in France during the Years 1787, 1788, 1789, edited by M. Betham-Edwards (London, 1892); adapted","footnotes":[{"mark":"*","text":"The Palais Royal was a palace in Paris owned by the Duke of Orléans, a cousin of the king. Its gardens and arcades were filled with shops and cafés, and the royal police could not enter without the duke's permission."}],"glossary":[{"t":"procure","d":"get"},{"t":"tracts","d":"short pamphlets"},{"t":"levelling","d":"aiming to make everyone equal in rank"},{"t":"seditious","d":"stirring people to rebel against the government"},{"t":"licentiousness","d":"lack of restraint"},{"t":"crouded / crouds","d":"old spellings of crowded / crowds"},{"t":"a gorge deploye","d":"French for \"with mouths wide open\""},{"t":"harangue","d":"give loud, forceful speeches to"},{"t":"the ministry","d":"the king's chief officials"}]},"X2":{"type":"pair","items":[{"label":"Source 1","paragraphs":["You will observe, that, from Magna Charta to the Declaration of Right,* it has been the uniform policy of our Constitution to claim and assert our liberties as an entailed inheritance derived to us from our forefathers, and to be transmitted to our posterity,—as an estate specially belonging to the people of this kingdom, without any reference whatever to any other more general or prior right. … We have an inheritable crown, an inheritable peerage, and a House of Commons and a people inheriting privileges, franchises, and liberties from a long line of ancestors.","… A spirit of innovation is generally the result of a selfish temper and confined views. People will not look forward to posterity, who never look backward to their ancestors. …","Society is, indeed, a contract. … It is a partnership in all science, a partnership in all art, a partnership in every virtue and in all perfection. As the ends of such a partnership cannot be obtained in many generations, it becomes a partnership not only between those who are living, but between those who are living, those who are dead, and those who are to be born."],"attribution":"Edmund Burke, Irish-born member of the British Parliament, Reflections on the Revolution in France, 1790","translation":"Text from The Works of the Right Honourable Edmund Burke, vol. 3 (London: John C. Nimmo, 1887); adapted","footnotes":[{"mark":"*","text":"Magna Charta (Magna Carta, 1215) and the Declaration of Right (1689) were English documents that limited the powers of the king."}],"glossary":[{"t":"entailed inheritance","d":"family property that must be passed down to heirs and cannot be sold off"},{"t":"posterity","d":"people of future generations"},{"t":"peerage","d":"the titled nobility"},{"t":"franchises","d":"special rights"},{"t":"innovation","d":"making something new"},{"t":"confined","d":"narrow"}]},{"label":"Source 2","paragraphs":["The English Parliament of 1688 did a certain thing, which, for themselves and their constituents, they had a right to do, and which it appeared right should be done. But, in addition to this right, which they possessed by delegation, they set up another right by assumption, that of binding and controlling posterity to the end of time. …","There never did, there never will, and there never can, exist a Parliament, or any description of men, or any generation of men, in any country, possessed of the right or the power of binding and controlling posterity to the \"end of time,\" or of commanding for ever how the world shall be governed, or who shall govern it … Every age and generation must be as free to act for itself in all cases as the age and generations which preceded it. The vanity and presumption of governing beyond the grave is the most ridiculous and insolent of all tyrannies. … It is the living, and not the dead, that are to be accommodated. …","I am contending for the rights of the living, and against their being willed away and controlled and contracted for by the manuscript assumed authority of the dead, and Mr. Burke is contending for the authority of the dead over the rights and freedom of the living."],"attribution":"Thomas Paine, English-born writer who had supported the American Revolution, Rights of Man, Part 1, 1791","translation":"Text from The Writings of Thomas Paine, vol. 2, edited by Moncure D. Conway (New York, 1894); adapted","glossary":[{"t":"constituents","d":"the people a lawmaker represents"},{"t":"by delegation","d":"because voters gave it to them"},{"t":"by assumption","d":"by simply claiming it"},{"t":"posterity","d":"people of future generations"},{"t":"presumption","d":"taking more than one has a right to"},{"t":"accommodated","d":"served"},{"t":"willed away","d":"given away in a will, as if they were property"}]}]},"X3":{"type":"image","src":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_thin_black_margin.jpg/1280px-El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_thin_black_margin.jpg","width":1280,"height":989,"alt":"A dark night scene painted in oil. On the right, a tight line of soldiers with their backs to the viewer aim guns at close range at a group of men on the left. A man in a white shirt kneels with his arms raised. Bodies lie bleeding on the ground, and a large lantern lights the scene. A town with a church tower stands in the background.","caption":"On the right, a line of soldiers in long coats and tall hats stand shoulder to shoulder and aim their guns. Their faces cannot be seen. On the left, a group of men faces them. In the center, a man in a white shirt and yellow trousers kneels with his arms spread wide. Others cover their faces or pray. Dead men lie in pools of blood in the foreground, and more men wait in line behind them. A large square lantern on the ground lights the scene. A town with a church tower sits in the dark background.","attribution":"Francisco de Goya, Spanish painter, The Third of May 1808 in Madrid, oil painting completed in 1814","credit":"Museo del Prado, Madrid. Public domain image via Wikimedia Commons (file: El Tres de Mayo, by Francisco de Goya, from Prado thin black margin.jpg).","description":"A large oil painting of a night scene on a bare hillside outside a city. On the right side, about six soldiers stand in a tight line, leaning forward with guns raised to their shoulders and fixed bayonets pointing at the men in front of them. Their backs are to the viewer, and swords hang at their sides. A large box-shaped lantern sits on the ground between the soldiers and their targets and throws strong light on the left half of the picture. On the left, the men facing the guns are dressed in ordinary clothes. The brightest figure, a man in a white shirt and yellow trousers, kneels with both arms raised wide. Beside him a man in a dark cap stares at the guns, a monk kneels and prays, and another man clenches his fists. In the foreground, several bodies lie twisted on the ground in red pools of blood. Behind the group, more men walk up the slope, some covering their faces with their hands. In the dark background are the walls of a town, a church tower, and a few dim figures.","glossary":[{"t":"1808 in Madrid","d":"Madrid is the capital of Spain"}]},"X4":{"type":"bar","title":"Total Debt of the British Government at Selected Dates, 1689–1817","categories":["1689","1702","1714","1727","1763","1775","1784","1793","1817"],"series":[{"name":"Debt (millions of British pounds)","values":[0.7,16.4,54.1,52.1,138.9,128.6,249.9,239.4,840.9]}],"yLabel":"Millions of British pounds","text":"The figures are the total debt the government owed (funded and unfunded), rounded to the nearest £0.1 million. The source gives the debt in 1689, when William III became king; in 1702, 1714, and 1727, when Anne, George I, and George II took the throne; and in 1763, 1775, 1784, and 1793. Earlier figures are for England and then Great Britain. The 1817 figure includes Ireland's debt: the British and Irish treasuries were merged in January 1817, and the source gives the debt on February 1, 1817.","source":"The Statesman's Year-Book, 1871 (London: Macmillan, 1871), table of the British national debt, p. 224"},"X5":{"type":"passage","paragraphs":["Question. What are the duties of Christians toward those who govern them, and what in particular are our duties towards Napoleon I, our emperor?","Answer. Christians owe to the princes who govern them, and we in particular owe to Napoleon I, our emperor, love, respect, obedience, fidelity, military service, and the taxes levied for the preservation and defense of the empire and of his throne. We also owe him fervent prayers for his safety and for the spiritual and temporal prosperity of the state.","Question. Why are we subject to all these duties toward our emperor?","Answer. First, because God, who has created empires and distributes them according to his will, has, by loading our emperor with gifts both in peace and in war, established him as our sovereign and made him the agent of his power and his image upon earth. To honor and serve our emperor is therefore to honor and serve God himself. …","Question. Are there not special motives which should attach us more closely to Napoleon I, our emperor?","Answer. Yes, for it is he whom God has raised up in trying times to reestablish the public worship of the holy religion of our fathers and to be its protector; he has reestablished and preserved public order by his profound and active wisdom; he defends the state by his mighty arm; he has become the anointed of the Lord by the consecration which he has received from the sovereign pontiff, head of the Church universal.","Question. What must we think of those who are wanting in their duties toward our emperor?","Answer. According to the apostle Paul, they are resisting the order established by God himself and render themselves worthy of eternal damnation."],"attribution":"Imperial Catechism, a book of questions and answers for teaching religion, issued for use in all Catholic churches of the French Empire, April 1806","translation":"English translation in James Harvey Robinson, Readings in European History, vol. 2 (Boston, 1906); adapted","glossary":[{"t":"catechism","d":"a book that teaches religion through questions and answers, often memorized by children"},{"t":"fidelity","d":"loyalty"},{"t":"temporal","d":"having to do with this world rather than with heaven"},{"t":"anointed of the Lord","d":"a ruler blessed by God through a holy ceremony"},{"t":"consecration","d":"the religious ceremony that blessed him as emperor in 1804"},{"t":"sovereign pontiff","d":"the pope"},{"t":"wanting in","d":"failing in"},{"t":"damnation","d":"punishment in hell"}]},"X6":{"type":"passage","paragraphs":["The world desires to be governed by facts and according to justice, not by phrases and theories; the first need of society is to be maintained by strong authority (no authority without real strength deserves the name) and not to govern itself. … The first and greatest concern for the immense majority of every nation is the stability of the laws and their uninterrupted action—never their change. Therefore let the governments govern, let them maintain the foundations of their institutions, both ancient and modern; for if it is at all times dangerous to touch them, it certainly would not now, in the general confusion, be wise to do so.","Let the governments announce this determination to their people, and demonstrate it by facts. Let them reduce the doctrinaires to silence within their States, and show their contempt for them abroad. … Let them be precise and clear in all their words, and not seek by concessions to gain over those parties who aim at the destruction of all power but their own, whom concessions will never gain over, but only further embolden in their pretensions to power. …","Let them maintain religious principles in all their purity, and not allow the faith to be attacked and morality interpreted according to the social contract or the visions of foolish sectarians.","Let them suppress secret societies, that gangrene of society.","In short, let the great monarchs strengthen their union, and prove to the world that while it exists, it is beneficent, and insures the political peace of Europe; that it is powerful only for the maintenance of tranquillity at a time when so many attacks are directed against it; that the principles which they profess are paternal and protective, menacing only the disturbers of public tranquillity."],"attribution":"Klemens von Metternich, foreign minister of Austria, \"Political Confession of Faith,\" a private memorandum sent to Tsar Alexander I of Russia, December 1820","translation":"English translation from Memoirs of Prince Metternich, vol. 3 (1881), as printed in James Harvey Robinson and Charles A. Beard, Readings in Modern European History, vol. 1 (Boston, 1908); adapted","glossary":[{"t":"doctrinaires","d":"people who want to remake society to fit a theory"},{"t":"concessions","d":"things given up to satisfy an opponent"},{"t":"embolden","d":"make bolder"},{"t":"pretensions","d":"claims"},{"t":"sectarians","d":"people strongly attached to a religious or political group; used critically here"},{"t":"gangrene","d":"rotting flesh that spreads through the body"},{"t":"beneficent","d":"doing good"},{"t":"tranquillity","d":"calm and order"}]},"X7":{"type":"passage","paragraphs":["The principal object then which I proposed to myself in these Poems was to make the incidents of common life interesting by tracing in them, truly though not ostentatiously, the primary laws of our nature … Low and rustic life was generally chosen because in that situation the essential passions of the heart find a better soil in which they can attain their maturity, are less under restraint, and speak a plainer and more emphatic language; … and lastly, because in that situation the passions of men are incorporated with the beautiful and permanent forms of nature. …","For all good poetry is the spontaneous overflow of powerful feelings; but though this be true, Poems to which any value can be attached, were never produced on any variety of subjects but by a man who being possessed of more than usual organic sensibility had also thought long and deeply. …","For a multitude of causes unknown to former times are now acting with a combined force to blunt the discriminating powers of the mind, and unfitting it for all voluntary exertion to reduce it to a state of almost savage torpor. The most effective of these causes are the great national events which are daily taking place, and the encreasing accumulation of men in cities, where the uniformity of their occupations produces a craving for extraordinary incident which the rapid communication of intelligence hourly gratifies."],"attribution":"William Wordsworth, English poet, preface to Lyrical Ballads, a book of poems by Wordsworth and Samuel Taylor Coleridge, second edition, 1800","translation":"Text from Lyrical Ballads, with Other Poems, 1800, vol. 1 (Project Gutenberg edition of the 1800 text); adapted","glossary":[{"t":"ostentatiously","d":"in a showy way"},{"t":"rustic","d":"of the countryside"},{"t":"emphatic","d":"strong and clear"},{"t":"incorporated with","d":"joined to"},{"t":"spontaneous","d":"happening naturally, without planning"},{"t":"organic sensibility","d":"a natural ability to feel deeply"},{"t":"discriminating powers","d":"the ability to judge carefully"},{"t":"torpor","d":"a dull, sluggish state"},{"t":"encreasing","d":"an old spelling of increasing"},{"t":"intelligence","d":"here, news"}]},"X8":{"type":"passage","paragraphs":["… The truth is these wars* group themselves very symmetrically, and the whole period stands out as an age of gigantic rivalry between England and France, a kind of second Hundred Years' War. …","… the explanation of that second Hundred Years' War between England and France which fills the eighteenth century is this, that they were rival candidates for the possession of the New World, and the triple war** which fills the middle of the century is, as it were, the decisive campaign in that great world-struggle. …","But now it is most important to observe further that not only in America, but in Asia also, France and England in that age advanced side by side. … And I find, when I study the English conquest of India, that we were actuated neither by ambition nor yet by mere desire to advance our trade, but that from first to last, that is, from the first efforts of Clive to the time when Lord Wellesley, Lord Minto and Lord Hastings established our authority over the whole vast peninsula, we were actuated by fear of the French."],"attribution":"John Robert Seeley, British historian at the University of Cambridge, The Expansion of England, a book of lectures, 1883","translation":"Text from the first edition (London: Macmillan, 1883); adapted","footnotes":[{"mark":"*","text":"Seeley means England's wars with France from 1689 to 1815, which he lists just before this sentence. The first Hundred Years' War was a series of wars between England and France from 1337 to 1453."},{"mark":"**","text":"By the \"triple war,\" Seeley means a war that began with Spain in 1739 and turned into a war with France, the Seven Years' War (1756–1763), and the war over American independence (1775–1783), which France joined in 1778."}],"glossary":[{"t":"symmetrically","d":"in a balanced pattern"},{"t":"the New World","d":"the Americas"},{"t":"actuated","d":"moved to act"},{"t":"Clive, Wellesley, Minto, Hastings","d":"British leaders in India between the 1750s and the 1820s"},{"t":"peninsula","d":"here, India"}]},"P1":{"type":"passage","paragraphs":["… Mistress now of North America, lording it in India, through the company whose territorial conquests had been ratified by native princes, over twenty millions of inhabitants,—a population larger than that of Great Britain and having a revenue respectable alongside of that of the home government,—England, with yet other rich possessions scattered far and wide over the globe, had ever before her eyes, as a salutary lesson, the severe chastisement which the weakness of Spain had allowed her to inflict upon that huge disjointed empire. …","\"For the first time since the Middle Ages,\" says M. Martin,* speaking of the Seven Years' War, \"England had conquered France single-handed almost without allies, France having powerful auxiliaries. She had conquered solely by the superiority of her government.\"","Yes! but by the superiority of her government using the tremendous weapon of her sea power. This made her rich, and in turn protected the trade by which she had her wealth. With her money she upheld her few auxiliaries, mainly Prussia and Hanover, in their desperate strife. Her power was everywhere that her ships could reach, and there was none to dispute the sea to her. …","The one nation that gained in this war** was that which used the sea in peace to earn its wealth, and ruled it in war by the extent of its navy, by the number of its subjects who lived on the sea or by the sea, and by its numerous bases of operations scattered over the globe. …"],"attribution":"Alfred Thayer Mahan, United States naval officer and historian, The Influence of Sea Power upon History, 1660–1783, 1890","translation":"Text from the first edition (Boston: Little, Brown, 1890), pp. 326–329; adapted, with one misprint corrected as in later printings","footnotes":[{"mark":"*","text":"Henri Martin, a French historian of the 1800s."},{"mark":"**","text":"The Seven Years' War, 1756–1763."}],"glossary":[{"t":"bases of operations","d":"ports and forts where ships and troops can be supplied"},{"t":"auxiliaries","d":"allies who give military help"},{"t":"dispute","d":"challenge"},{"t":"the company","d":"the British East India Company"},{"t":"ratified","d":"formally approved"},{"t":"revenue","d":"income from taxes"},{"t":"salutary","d":"useful, even if unpleasant"},{"t":"chastisement","d":"punishment"}]},"P2":{"type":"passage","paragraphs":["Cahier of the grievances, complaints, and protests of the electoral district of Carcassonne, drawn up by the commissioners named by the general assembly of the third estate …","The third estate of the electoral district of Carcassonne, desiring to give to a beloved monarch, and one so worthy of our affection, the most unmistakable proof of its love and respect, of its gratitude and fidelity … declares that the happiness of the nation must, in their opinion, depend upon that of its king, upon the stability of the monarchy, and upon the preservation of the orders which compose it and of the fundamental laws which govern it …","1. Public worship should be confined to the Roman Catholic apostolic religion, to the exclusion of all other forms of worship …","8. … the nation should hereafter be subject only to such laws and taxes as it shall itself freely ratify.","9. The meetings of the Estates General of the kingdom should be fixed for definite periods …","10. In order to assure to the third estate the influence to which it is entitled in view of the number of its members, the amount of its contributions to the public treasury, and the manifold interests which it has to defend or promote in the national assemblies, its votes in the assembly should be taken and counted by head.","11. No order, corporation, or individual citizen may lay claim to any pecuniary exemptions. … All taxes should be assessed on the same system throughout the nation.","12. The due exacted from commoners holding fiefs should be abolished, and also the general or particular regulations which exclude members of the third estate from certain positions, offices, and ranks which have hitherto been bestowed on nobles either for life or hereditarily. A law should be passed declaring members of the third estate qualified to fill all such offices for which they are judged to be personally fitted."],"attribution":"Cahier (list of grievances) of the Third Estate of the district of Carcassonne, in southern France, written in the spring of 1789 for the meeting of the Estates-General","translation":"English translation in James Harvey Robinson and Charles A. Beard, Readings in Modern European History, vol. 1 (Boston, 1908); adapted","glossary":[{"t":"grievances","d":"complaints about unfair treatment"},{"t":"third estate","d":"everyone in France who was not a member of the clergy or the nobility"},{"t":"fidelity","d":"loyalty"},{"t":"orders","d":"the three estates: clergy, nobility, and commoners"},{"t":"ratify","d":"approve"},{"t":"counted by head","d":"counted one vote per deputy"},{"t":"corporation","d":"an organized group, such as a town or guild"},{"t":"pecuniary exemptions","d":"freedom from paying money, such as taxes"},{"t":"due exacted from commoners holding fiefs","d":"a fee charged to commoners who owned land that came with feudal rights"},{"t":"hereditarily","d":"passed down from parent to child"}]},"P3":{"type":"passage","paragraphs":["The National Assembly, after having heard the report of the ecclesiastical committee, has decreed and do decree the following as constitutional articles:","Title I, Article I. Each department* shall form a single diocese, and each diocese shall have the same extent and the same limits as the department. …","IV. No church or parish of France nor any French citizen may acknowledge upon any occasion, or upon any pretext whatsoever, the authority of an ordinary bishop or of an archbishop whose see shall be under the supremacy of a foreign power, nor that of his representatives residing in France or elsewhere; without prejudice, however, to the unity of the faith and the intercourse which shall be maintained with the visible head of the universal Church, as hereafter provided. …","Title II, Article I. Beginning with the day of publication of the present decree, there shall be but one mode of choosing bishops and parish priests, namely that of election. …","XIX. The new bishop may not apply to the pope for any form of confirmation, but shall write to him, as to the visible head of the universal Church, as a testimony to the unity of faith and communion maintained with him.","XXI. Before the ceremony of consecration begins, the bishop elect shall take a solemn oath … to be loyal to the nation, the law, and the king, and to support with all his power the constitution decreed by the National Assembly and accepted by the king. …","Title III, Article I. The ministers of religion, performing as they do the first and most important functions of society … shall be supported by the nation."],"attribution":"Civil Constitution of the Clergy, law passed by the National Assembly of France, July 1790","translation":"English translation in James Harvey Robinson, Readings in European History, vol. 2 (Boston, 1906); adapted","footnotes":[{"mark":"*","text":"In 1790 the National Assembly divided France into 83 new units called departments, each with its own elected officials."}],"glossary":[{"t":"ecclesiastical","d":"having to do with the church"},{"t":"diocese","d":"the area under one bishop"},{"t":"see","d":"the district governed by a bishop or archbishop"},{"t":"supremacy","d":"highest authority"},{"t":"without prejudice to","d":"without harming"},{"t":"intercourse","d":"communication"},{"t":"confirmation","d":"official approval"},{"t":"consecration","d":"the ceremony that makes a priest a bishop"}]},"P4":{"type":"pair","items":[{"label":"Source 1","paragraphs":["… Women carried large loaves of bread on pikes; others had branches of poplar, already yellowed by October. They were very joyous and amiable in their way, saving some jests addressed to the queen. \"We are conducting,\" they cried, \"the baker, the baker's wife, and the little journeyman.\" They all thought they were safe from famine, if they had the king amongst them. …","The revolution of the 6th October* was necessary, natural, and lawful; if it was sudden, unforeseen, and truly popular, it belonged especially to women, as that of the 14th July to men. Men took the Bastille, and women took the king."],"attribution":"Jules Michelet, French historian, The Women of the French Revolution, 1854","translation":"Translated by M. R. P. (Philadelphia: Henry Carey Baird, 1855); adapted","footnotes":[{"mark":"*","text":"On October 5, 1789, thousands of Paris women marched to the royal palace at Versailles. The next day the crowd forced the royal family to move to Paris."}],"glossary":[{"t":"pikes","d":"long poles with metal points, used as weapons"},{"t":"amiable","d":"friendly"},{"t":"saving","d":"except for"},{"t":"jests","d":"jokes"},{"t":"the baker, the baker's wife, and the little journeyman","d":"the crowd's nicknames for King Louis XVI, Queen Marie Antoinette, and their young son (a journeyman is a trained worker who has finished an apprenticeship)"}]},{"label":"Source 2","paragraphs":["8. Every Frenchman shall enjoy civil rights. …","213. The husband owes protection to his wife, the wife obedience to her husband.","214. The wife is obliged to live with her husband, and to follow him to every place where he may judge it convenient to reside: the husband is obliged to receive her, and to furnish her with every thing necessary for the wants of life, according to his means and station. …","217. A wife, although non-communicant or separate in property, cannot give, alienate, pledge, or acquire by free or chargeable title, without the concurrence of her husband in the act, or his consent in writing."],"attribution":"Civil Code of the French (the Napoleonic Code), law code issued in France in 1804, articles 8, 213, 214, and 217","translation":"Translated by a barrister of the Inner Temple, The Code Napoleon; or, The French Civil Code (London, 1824); adapted","glossary":[{"t":"civil rights","d":"rights under private law, such as owning property and making contracts"},{"t":"station","d":"rank in society"},{"t":"non-communicant or separate in property","d":"married under an agreement that keeps her property apart from her husband's"},{"t":"alienate","d":"sell or give away"},{"t":"by free or chargeable title","d":"as a gift or by paying for it"},{"t":"concurrence","d":"agreement"}]}]},"P5":{"type":"pair","items":[{"label":"Source 1","paragraphs":["The French people to the people of ——; brothers and friends:","We have conquered our liberty and we shall maintain it. We offer to bring this inestimable blessing to you, for it has always been rightly ours, and only by a crime have our oppressors robbed us of it. We have driven out your tyrants. Show yourselves free men and we will protect you from their vengeance, their machinations, or their return.","From this moment the French nation proclaims the sovereignty of the people, the suppression of all civil and military authorities which have hitherto governed you and of all the taxes which you bear, under whatever form, the abolition of the tithe, of feudalism, of seigniorial rights and monopolies of every kind, of serfdom, whether real or personal, of hunting and fishing privileges, of the corvée, the salt tax, the tolls and local imposts, and, in general, of all the various kinds of taxes with which you have been loaded by your usurpers; it also proclaims the abolition among you of all noble and ecclesiastical corporations and of all prerogatives and privileges opposed to equality. You are, from this moment, brothers and friends; all are citizens, equal in rights, and all are alike called to govern, to serve, and to defend your country."],"attribution":"Proclamation of the National Convention of France, to be published in lands occupied by French armies, December 15, 1792","translation":"English translation in James Harvey Robinson, Readings in European History, vol. 2 (Boston, 1906); adapted","glossary":[{"t":"inestimable","d":"too great to be measured"},{"t":"machinations","d":"secret plots"},{"t":"sovereignty","d":"the highest power to rule"},{"t":"hitherto","d":"until now"},{"t":"tithe","d":"a tax of one-tenth of a harvest or income, paid to the Church"},{"t":"seigniorial rights","d":"payments and services that peasants owed to their lords"},{"t":"corvée","d":"unpaid labor that peasants were forced to do, such as road work"},{"t":"imposts","d":"taxes"},{"t":"usurpers","d":"people who take power they have no right to"},{"t":"ecclesiastical corporations","d":"church organizations such as monasteries"},{"t":"prerogatives","d":"special rights"}]},{"label":"Source 2","paragraphs":["The French nation declares that it will treat as enemies every people who, refusing liberty and equality or renouncing them, may wish to maintain, recall, or treat with the prince and the privileged classes …"],"attribution":"Article 11 of the decree of the National Convention to which the proclamation in Source 1 was attached, December 15, 1792","translation":"English translation quoted in a note in James Harvey Robinson, Readings in European History, vol. 2 (Boston, 1906); adapted","glossary":[{"t":"treat with","d":"make agreements with"}]}]},"P6":{"type":"passage","paragraphs":["1. From this moment until that in which the enemy shall have been driven from the soil of the Republic, all Frenchmen are in permanent requisition for the service of the armies.","The young men shall go to battle; the married men shall forge arms and transport provisions; the women shall make tents and clothing and shall serve in the hospitals; the children shall turn old linen into lint; the aged shall betake themselves to the public places in order to arouse the courage of the warriors and preach the hatred of kings and the unity of the Republic.","2. The national buildings shall be converted into barracks, the public places into workshops for arms, the soil of the cellars shall be washed in order to extract therefrom the saltpetre. …","7. Nobody can get himself replaced in the service for which he shall have been requisitioned. The public functionaries shall remain at their posts.","8. The levy shall be general. The unmarried citizens and widowers without children, from eighteen to twenty-five years, shall march first …"],"attribution":"Decree for the levée en masse (mass levy), passed by the National Convention of France, August 23, 1793","translation":"English translation in Frank Maloy Anderson, The Constitutions and Other Select Documents Illustrative of the History of France, 1789–1907, 2nd ed. (Minneapolis, 1908); adapted","glossary":[{"t":"in permanent requisition","d":"required to serve until enemy forces had been driven from France"},{"t":"provisions","d":"food and supplies"},{"t":"lint","d":"soft cloth fibers used to dress wounds"},{"t":"betake themselves","d":"go"},{"t":"saltpetre","d":"a mineral used to make gunpowder"},{"t":"get himself replaced","d":"arrange for someone else to do his assigned service"},{"t":"public functionaries","d":"government officials"},{"t":"levy","d":"a call-up of people for military service"}]},"P7":{"ty
