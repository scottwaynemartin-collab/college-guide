ke peace with France and pull its army out of Spain"},"answer":"A","rationales":{"A":"Correct. Spanish guerrilla fighters and a British army tied down hundreds of thousands of French soldiers from 1808 to 1814.","B":"Incorrect. Napoleon kept the Continental System until his empire fell. Spain's revolt did not make him drop it.","C":"Incorrect. British and Portuguese forces held Portugal. The French were driven out by 1811.","D":"Incorrect. Britain kept fighting in Spain. Its general, Wellington, drove the French out of Spain by 1814."},"explanation":"Napoleon never crushed the Spanish revolt. The long war cost him soldiers and money that he needed elsewhere, such as in Russia in 1812.","reasoning":"Causation"},{"id":"E5-E11","set":"X4","topic":"5.3","lo":"C","skill":"5.A","difficulty":"medium","stem":"Based on the chart and your knowledge of Britain's wars, which statement best describes the link between war and the government's debt?","options":{"A":"Britain paid back most of what it had borrowed within a few years after each war ended.","B":"Britain's debt grew at a fairly steady rate from the 1690s to the 1810s.","C":"The debt grew across periods that included major wars and dipped only a little across periods of peace.","D":"Britain borrowed more during the reign of Queen Anne than in any later period."},"answer":"C","rationales":{"A":"Incorrect. The debt fell by only about 10 million pounds from 1763 to 1775 and from 1784 to 1793, a small part of the total.","B":"Incorrect. The bars jump in some periods and dip in others. The largest rise, after 1793, is far bigger than any earlier one.","C":"Correct. The big jumps come in periods that included wars, such as 1727–1763, 1775–1784, and 1793–1817. In peacetime, such as 1763–1775, the debt fell only slightly.","D":"Incorrect. The debt grew by about 38 million pounds under Anne, but by about 600 million pounds from 1793 to 1817."},"explanation":"Britain paid for its wars by borrowing. The debt rose with each war against France and dipped a little in peacetime. The debt grew most during the long wars with revolutionary and Napoleonic France.","reasoning":"Causation"},{"id":"E5-E12","set":"X4","topic":"5.3","lo":"C","skill":"1.B","difficulty":"medium","stem":"Britain's ability to borrow such large sums is best explained by","options":{"A":"Parliament's steady taxes and the Bank of England's credit system","B":"large shipments of silver from mines in Britain's colonies in South America","C":"the king's power to collect taxes without needing the consent of Parliament","D":"the sale of lands taken from the Church of England during the 1700s"},"answer":"A","rationales":{"A":"Correct. After 1689, Parliament approved taxes to pay the interest on government loans, and the Bank of England (1694) helped manage the debt. Lenders trusted that they would be paid.","B":"Incorrect. Britain had no silver-mining colonies in South America. Spain held the great silver mines.","C":"Incorrect. After 1689, British kings could not tax without Parliament. Parliament's control made lenders trust the debt.","D":"Incorrect. The Church of England kept its lands in the 1700s. Its monasteries had been closed in the 1530s."},"explanation":"Parliament's taxes and new institutions for managing the debt gave lenders confidence that Britain would pay the interest on its loans. This let Britain keep borrowing heavily during its wars."},{"id":"E5-E13","set":"X4","topic":"5.1","lo":"A","skill":"5.A","difficulty":"hard","stem":"A historian could best use the chart to help explain which difference between Britain and France in the late 1700s?","options":{"A":"Britain could keep borrowing for long wars, while war debts pushed the French monarchy into crisis.","B":"Britain stayed at peace with France after 1763, while France fought costly wars against Austria.","C":"British taxpayers paid less per person than the French, so Britain needed to borrow more.","D":"Britain lost its Caribbean islands in 1783, while France won back Canada in North America."},"answer":"A","rationales":{"A":"Correct. Britain's debt kept growing without a collapse. France's debts from wars, including its help to the Americans, helped force Louis XVI to call the Estates-General, which met in 1789.","B":"Incorrect. Britain and France fought each other again from 1778 to 1783, and the chart shows Britain's debt rising in those years.","C":"Incorrect. Britons actually paid more in taxes per person than the French. Parliament's taxes helped make British debt safe for lenders.","D":"Incorrect. In 1783 Britain lost thirteen American colonies but kept Canada and nearly all its Caribbean islands. France did not win back Canada."},"explanation":"The chart shows how much Britain borrowed. It has no French figures, so the comparison also needs outside knowledge: Britain's tax and banking system let it keep borrowing, while the French crown's money crisis helped start the Revolution.","reasoning":"Comparison"},{"id":"E5-E14","set":"X5","topic":"5.6","lo":"F","skill":"2.B","difficulty":"medium","stem":"The catechism was most likely intended to","options":{"A":"prepare French Catholics to elect their own priests and bishops under Napoleon's new church laws","B":"persuade Protestants and Jews in Napoleon's empire to convert to the Catholic faith","C":"teach French children that Emperor Napoleon would keep the Church out of the state's affairs","D":"use the restored Catholic Church to teach loyalty and obedience to Napoleon"},"answer":"D","rationales":{"A":"Incorrect. Electing priests was part of the Civil Constitution of 1790. Under Napoleon's agreement with the pope, bishops were named by the government and approved by the pope.","B":"Incorrect. The catechism is written for Catholics and ties obedience to Napoleon to religious duty. It does not call on Protestants or Jews to convert.","C":"Incorrect. The catechism joins church and state. It says serving the emperor is serving God.","D":"Correct. The catechism tells Catholics they owe the emperor \"love, respect, obedience\" and taxes, and that failing him is a sin."},"explanation":"Children learned the catechism by heart in church. Putting duties to Napoleon into it let the government use the Church to teach obedience."},{"id":"E5-E15","set":"X5","topic":"5.6","lo":"F","skill":"4.B","difficulty":"medium","stem":"The catechism's claim that Napoleon acted \"to reestablish the public worship of the holy religion of our fathers\" most directly refers to","options":{"A":"the Civil Constitution of the Clergy of 1790","B":"the Cult of the Supreme Being of 1794","C":"the Concordat signed with Pope Pius VII in 1801","D":"the Revocation of the Edict of Nantes, which outlawed Protestant worship"},"answer":"C","rationales":{"A":"Incorrect. The National Assembly passed the Civil Constitution in 1790, before Napoleon came to power. It split the clergy and angered the pope.","B":"Incorrect. Robespierre's Cult of the Supreme Being was a new civic religion, not the Catholic faith, and it came before Napoleon took power.","C":"Correct. The Concordat, agreed in 1801 and put into effect in 1802, made peace between the French state and the pope. It allowed public Catholic worship under rules set by the government.","D":"Incorrect. Louis XIV revoked the Edict of Nantes in 1685, more than a century before Napoleon."},"explanation":"During the Revolution many churches were closed and priests were attacked. Napoleon made peace with the pope in the Concordat, which helped him win the support of French Catholics."},{"id":"E5-E16","set":"X5","topic":"5.9","lo":"J","skill":"5.A","difficulty":"hard","stem":"The catechism's explanation of why people owe duties to the emperor shows the most continuity with","options":{"A":"the divine-right ideas used to support absolute kings such as Louis XIV","B":"the social contract ideas of Enlightenment writers such as Rousseau","C":"the Declaration of the Rights of Man's claim that power comes from the nation","D":"Montesquieu's idea that power should be divided among separate branches"},"answer":"A","rationales":{"A":"Correct. Like Louis XIV's supporters, the catechism says God himself chose the ruler and made him \"his image upon earth.\"","B":"Incorrect. Rousseau said power comes from the people's general will. The catechism says it comes from God.","C":"Incorrect. The Declaration of 1789 said power comes from the nation. The catechism says God \"established him as our sovereign.\"","D":"Incorrect. The catechism gives the emperor's power one source and asks for obedience to him. It says nothing about dividing power."},"explanation":"Napoleon's officials based this lesson on a catechism written under Louis XIV. Though Napoleon came to power through the Revolution, he used the old idea that rulers are chosen by God.","reasoning":"Continuity and Change"},{"id":"E5-E17","set":"X6","topic":"5.7","lo":"H","skill":"3.A","difficulty":"medium","stem":"Metternich's main argument in the passage is that","options":{"A":"Europe's rulers should undo the changes made since 1789 and bring back the old regime","B":"Europe's rulers should stand together to resist demands for political change","C":"the great powers should take over smaller states whose rulers are too weak to keep order","D":"the Church, rather than governments, should lead the fight against secret societies"},"answer":"B","rationales":{"A":"Incorrect. Metternich tells governments to keep their institutions \"both ancient and modern\" and warns that it is \"dangerous to touch them.\" He does not ask them to undo the changes made since 1789.","B":"Correct. Metternich wants governments to keep their institutions, silence reformers, and \"strengthen their union.\"","C":"Incorrect. Metternich wants each government to rule its own state firmly (\"let the governments govern\"). He asks the monarchs to work together, not to take over other states.","D":"Incorrect. Metternich tells the governments to \"suppress secret societies.\" He wants rulers to protect religion, not hand the job of keeping order to the Church."},"explanation":"Metternich wanted kings to work together against revolution and to keep their power. Elsewhere in the memo he said governments should be very careful about making even real improvements. What he would not do was give in to revolutionary groups."},{"id":"E5-E18","set":"X6","topic":"5.7","lo":"H","skill":"4.B","difficulty":"medium","stem":"Metternich's concerns in the passage are best understood in the context of","options":{"A":"fear that revolutionary ideas would spark new revolts against restored kings","B":"fear that Napoleon would escape from the island of Elba and return to power in France","C":"Russia's plans to take over the Habsburg lands in Italy and the Balkans","D":"the spread of workers' parties calling for an end to private property"},"answer":"A","rationales":{"A":"Correct. After 1815 the victors restored many old rulers. Metternich feared that liberal and nationalist groups, inspired by the French Revolution, would overthrow them.","B":"Incorrect. Napoleon escaped from Elba and was finally defeated in 1815. By 1820 he was held on the island of St. Helena.","C":"Incorrect. Metternich is writing to the tsar to strengthen their alliance. He is worried about revolution, not about Russia.","D":"Incorrect. Large socialist workers' movements came later in the 1800s. In 1820 Metternich feared liberals, nationalists, and secret societies."},"explanation":"The French Revolution and Napoleon had overturned thrones across Europe. In 1820 new revolts broke out in Spain and Italy, and Metternich wanted the great powers to stop such movements before they spread."},{"id":"E5-E19","set":"X6","topic":"5.7","lo":"H","skill":"5.A","difficulty":"medium","stem":"Which decision made at the Congress of Vienna (1814–1815) most directly supported the goal Metternich states in his last paragraph?","options":{"A":"requiring restored rulers to grant constitutions with ministers answerable to elected assemblies","B":"creating unified German and Italian nation-states to replace their many separate rulers","C":"leaving France the strongest power on the continent in return for accepting British rule of the seas","D":"redrawing borders and strengthening France's neighbors to restore a balance of power"},"answer":"D","rationales":{"A":"Incorrect. The Congress did not require restored rulers to grant constitutions. Metternich warns governments not to make \"concessions\" to reformers.","B":"Incorrect. The Congress kept Germany and Italy divided. It set up a loose German Confederation of separate states and gave Austria lands in northern Italy.","C":"Incorrect. The Congress aimed to keep France from dominating Europe again. It did not leave France the strongest power on the continent.","D":"Correct. The peacemakers enlarged states around France, such as the Netherlands and Prussia's lands on the Rhine, so that no one power could dominate Europe again. A stable balance served Metternich's goal of keeping \"the political peace of Europe.\""},"explanation":"The Congress of Vienna redrew the map of Europe to restore a balance of power, so that no single country could dominate the continent as Napoleon had. Metternich hoped that this balance and the union of the great monarchs would keep the peace and protect the old order."},{"id":"E5-E20","set":"X7","topic":"5.8","lo":"I","skill":"1.B","difficulty":"medium","stem":"The ideas in the passage most directly reflect which development of the late 1700s and early 1800s?","options":{"A":"the Enlightenment's confidence that reason could uncover the laws of society","B":"Neoclassical writers' imitation of the balanced forms of Greek and Roman poets","C":"the spread of the scientific method, with its careful observation and experiment","D":"the Romantic movement's stress on emotion, nature, and common people"},"answer":"D","rationales":{"A":"Incorrect. Wordsworth speaks of \"the primary laws of our nature,\" but he means the laws of feeling, not rules found by reason.","B":"Incorrect. Wordsworth wants plain language from common life, not polished forms copied from ancient poets.","C":"Incorrect. Wordsworth is writing about poetry and feeling, not about experiments.","D":"Correct. Wordsworth calls poetry \"the spontaneous overflow of powerful feelings\" and chooses \"Low and rustic life\" close to nature."},"explanation":"Wordsworth presents poetry as joining powerful feeling with long, deep thought, and he looks to ordinary country life and nature. This fits Romanticism's challenge to relying on reason alone."},{"id":"E5-E21","set":"X7","topic":"5.8","lo":"I","skill":"4.A","difficulty":"medium","stem":"Wordsworth's concern about readers' \"craving for extraordinary incident\" is best explained by which development?","options":{"A":"the Act of Union that joined Great Britain and Ireland as one kingdom","B":"the upheaval and wars that followed the French Revolution","C":"Parliament's long debate over ending the British slave trade","D":"the spread of Methodist preaching in English villages and towns"},"answer":"B","rationales":{"A":"Incorrect. The Act of Union was passed in 1800, but it was one law. Wordsworth means a steady stream of events that fed a hunger for exciting news.","B":"Correct. By 1800 Europe had seen a decade of revolution in France and war between France and its neighbors, including Britain. News of these events arrived constantly and was eagerly read.","C":"Incorrect. The slave trade debate lasted for years, but it did not bring \"daily\" news that created a \"craving for extraordinary incident.\"","D":"Incorrect. Methodist preaching was a religious movement, not a series of \"great national events.\""},"explanation":"Revolution and war supplied a steady stream of dramatic news. Wordsworth worried that this news, along with crowded cities, was dulling people's minds and feelings."},{"id":"E5-E22","set":"X7","topic":"5.8","lo":"I","skill":"5.A","difficulty":"medium","stem":"Wordsworth's view of feeling and nature is most similar to the ideas of","options":{"A":"Jean-Jacques Rousseau, author of Émile","B":"Voltaire, author of Candide","C":"Isaac Newton, author of the Principia","D":"Adam Smith, author of The Wealth of Nations"},"answer":"A","rationales":{"A":"Correct. Rousseau taught that feeling and a simple life close to nature were better guides than refined society. Wordsworth praises rural life for the same reasons.","B":"Incorrect. Voltaire is best known for using reason and wit to attack intolerance. That does not match the passage's stress on country life, feeling, and poetry.","C":"Incorrect. Newton described physical nature with mathematical laws. Wordsworth stresses human feeling and life in the countryside.","D":"Incorrect. Smith's case for free markets does not deal with country life, feeling, and poetry, which are the passage's focus."},"explanation":"Rousseau said reason was not enough and praised feeling and nature. Romantic poets like Wordsworth took these ideas further.","reasoning":"Comparison"},{"id":"E5-E23","set":"X8","topic":"5.3","lo":"C","skill":"3.A","difficulty":"medium","stem":"Seeley's main argument in the passage is that","options":{"A":"the wars between Britain and France in the 1700s were fought mainly over religion","B":"the English conquered India mainly because their merchants wanted more trade there","C":"France pulled ahead of Britain in both North America and India by the middle of the 1700s","D":"Britain and France fought many wars in the 1700s mainly as rivals for empire overseas"},"answer":"D","rationales":{"A":"Incorrect. Seeley explains the wars by the contest for the New World and India, not by religion.","B":"Incorrect. Seeley says the English were moved \"neither by ambition nor yet by mere desire to advance our trade,\" but by fear of the French.","C":"Incorrect. Seeley does not say France pulled ahead. He calls the wars in the middle of the century \"the decisive campaign\" of the struggle, and the Seven Years' War ended in 1763 with Britain taking Canada and gaining the upper hand in India.","D":"Correct. Seeley says Britain and France were \"rival candidates for the possession of the New World\" and competed in Asia too."},"explanation":"Seeley sees the wars of the 1700s as one long fight, a \"second Hundred Years' War.\" He says the real prize was empire in America and Asia."},{"id":"E5-E24","set":"X8","topic":"5.2","lo":"B","skill":"1.B","difficulty":"medium","stem":"The rivalry Seeley describes led most directly to which outcome in 1763?","options":{"A":"France's gain of Louisiana and the Mississippi valley from the British","B":"France's loss of Canada to Britain and its weaker position in India","C":"the division of the Dutch trading empire in Asia between Britain and France","D":"Spain's loss of its colonies in South America to the British navy"},"answer":"B","rationales":{"A":"Incorrect. France gave up Louisiana in 1762–1763. The land west of the Mississippi went to Spain.","B":"Correct. In the Treaty of Paris (1763), France gave up Canada to Britain. France got back its trading posts in India, but British power there was now much stronger.","C":"Incorrect. The Dutch kept their trading empire in the East Indies. It was not divided in 1763.","D":"Incorrect. Spain kept its South American colonies. It gave Florida to Britain but received Louisiana from France."},"explanation":"The Seven Years' War ended in 1763 with Britain stronger in North America and India. France gave up Canada and got back its trading posts in India, but it could no longer keep troops or forts in Bengal. The treaty did not give Britain control of all of India."},{"id":"E5-E25","set":"X8","topic":"5.3","lo":"C","skill":"3.D","difficulty":"medium","stem":"Which of the following, if true, would most directly support Seeley's explanation of why the English conquered India?","options":{"A":"The East India Company earned large profits from the taxes it collected in Bengal after 1765.","B":"British forces kept conquering Indian states long after French power in India had ended.","C":"The East India Company often went to war with Indian rulers who had formed alliances with the French.","D":"Britain's navy defeated a French fleet near the coast of France at Quiberon Bay in 1759."},"answer":"C","rationales":{"A":"Incorrect. Tax profits show what the conquest gained, but they do not show what caused the wars. Seeley's claim is about motive: fear of the French.","B":"Incorrect. Wars that went on after the French threat was gone would weaken the claim that fear of France drove the conquest.","C":"Correct. If the Company fought rulers because they were allied with France, that would fit Seeley's claim that the English acted out of \"fear of the French.\"","D":"Incorrect. This battle mattered in Europe and the Atlantic. It says nothing about why the English fought in India."},"explanation":"Seeley claims the English were driven by \"fear of the French.\" Evidence that British wars in India were aimed at France's Indian allies would back him up. Profits show what the conquest gained, not why it began, and wars after the French were gone would cut against his claim."}]}}}};</script>
<script>/* Euro Atlas · AP Practice Exam · stimulus renderer
   Everything here is driven by the JSON stimulus object; nothing is hard-coded per question.
   Supported stimulus.type: passage | pair | image | table | bar (plus the GeoArcade map types, kept for later units).
   Anything else -> "source unavailable" card. render(stim, {glossary:true}) adds the practice-only "Words to know". */
window.PE_STIM = (function () {
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let uid = 0;
  const nid = () => 'st' + (++uid) + '_' + Math.random().toString(36).slice(2, 6);
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : (parseFloat(v) || 0);
  const fmt = v => Number.isInteger(v) ? v.toLocaleString('en-US') : (+v).toLocaleString('en-US', { maximumFractionDigits: 1 });
  const r1 = v => Math.round(v * 10) / 10;

  function render(stim, opt) {
    if (!stim || typeof stim !== 'object') return unavailable();
    opt = opt || {};
    try {
      switch (stim.type) {
        case 'passage': return passage(stim, opt);
        case 'pair': return pair(stim, opt);
        case 'image': return image(stim, opt);
        case 'table': return table(stim);
        case 'bar': return bar(stim);
        case 'districtMap': return districtMap(stim);
        case 'schematicMap': return schematicMap(stim);
        case 'rings': return rings(stim);
        default: return unavailable(stim.type);
      }
    } catch (e) {
      if (window.console && console.warn) console.warn('stimulus render failed', e);
      return unavailable(stim.type);
    }
  }

  function unavailable(type) {
    return `<figure class="stim unavail" role="note"><div>⚠︎ Source unavailable${type ? ` <span class="muted">(${esc(type)})</span>` : ''}</div><div class="small muted">You can still answer the question. Tell your AP European History teacher which question this is.</div></figure>`;
  }
  const title = t => t ? `<figcaption class="stim-title">${esc(t)}</figcaption>` : '';
  const source = s => s ? `<div class="stim-source">Source: ${esc(s)}</div>` : '';


  /* ---------- text sources (AP history) ---------- */
  // Paragraph text is plain; a "\n" inside a paragraph is a line break (poems). Footnote marks stay inline (e.g. "kaan*").
  const para = t => `<p>${esc(t).replace(/\n/g, '<br>')}</p>`;
  function glossaryHTML(g) {
    if (!g || !g.length) return '';
    return `<details class="gloss"><summary>Words to know <span class="n">${g.length}</span></summary><dl>${g.map(x => `<div><dt>${esc(x.t)}</dt><dd>${esc(x.d)}</dd></div>`).join('')}</dl></details>`;
  }
  function passageBody(s, opt, label) {
    const fns = (s.footnotes || []).map(f => `<div class="fn"><span class="m">${esc(f.mark || '*')}</span>${esc(f.text)}</div>`).join('');
    return `${label ? `<div class="psg-lbl">${esc(label)}</div>` : ''}${s.title ? `<div class="psg-title">${esc(s.title)}</div>` : ''}
      <blockquote class="psg-text${s.verse ? ' verse' : ''}">${(s.paragraphs || []).map(para).join('')}</blockquote>
      ${fns ? `<div class="fns">${fns}</div>` : ''}
      <div class="attr">${s.attribution ? `<span class="who">${esc(s.attribution)}</span>` : ''}${s.translation ? `<span class="tr">${esc(s.translation)}</span>` : ''}</div>
      ${opt.glossary ? glossaryHTML(s.glossary) : ''}`;
  }
  function passage(s, opt) {
    return `<figure class="stim psg" aria-label="Source">${passageBody(s, opt, s.label || '')}</figure>`;
  }
  function pair(s, opt) {
    const items = s.items || [];
    return `<div class="pairset">${items.map((it, i) => `<figure class="stim psg" aria-label="${esc(it.label || 'Source ' + (i + 1))}">${passageBody(it, opt, it.label || ('Source ' + (i + 1)))}</figure>`).join('')}</div>`;
  }
  function image(s, opt) {
    const id = nid();
    const ratio = s.width && s.height ? ` style="aspect-ratio:${num(s.width)}/${num(s.height)}"` : '';
    return `<figure class="stim simg" aria-label="Image source">${s.title ? `<div class="psg-title">${esc(s.title)}</div>` : ''}
      <div class="imgbox"${ratio}><img src="${esc(s.src)}" alt="${esc(s.alt || '')}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.closest('.imgbox').classList.add('broken')"><div class="imgfail" role="note"><b>The image didn't load.</b> ${esc(s.description || s.alt || '')}</div></div>
      ${s.caption ? `<p class="icap">${esc(s.caption)}</p>` : ''}
      <div class="attr">${s.attribution ? `<span class="who">${esc(s.attribution)}</span>` : ''}${s.credit ? `<span class="tr">${esc(s.credit)}</span>` : ''}</div>
      ${s.description ? `<details class="gloss"><summary>Image description</summary><p class="idesc" id="${id}">${esc(s.description)}</p></details>` : ''}
      ${opt.glossary ? glossaryHTML(s.glossary) : ''}</figure>`;
  }

  /* ---------- table ---------- */
  function tableHTML(t, caption) {
    const cols = t.columns || [], rows = t.rows || [];
    return `<div class="tscroll"><table class="stab"${caption ? ` aria-label="${esc(caption)}"` : ''}><thead><tr>${cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  function table(s) {
    return `<figure class="stim stim-table">${title(s.title)}${tableHTML(s, s.title)}${s.text ? `<p class="stim-text">${esc(s.text)}</p>` : ''}${s.note ? `<p class="stim-note">${esc(s.note)}</p>` : ''}${source(s.source)}</figure>`;
  }

  /* ---------- grouped bar chart (inline SVG) ---------- */
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const f = raw / p;
    const m = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return m * p;
  }
  function bar(s) {
    const cats = s.categories || [], series = s.series || [];
    const maxV = Math.max(1, ...series.flatMap(sr => (sr.values || []).map(num)));
    const yMax = num(s.yMax) > 0 ? num(s.yMax) : niceStep(maxV / 5) * 5;
    const W = 640, H = 380, m = { t: 20, r: 18, b: 56, l: 70 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const step = niceStep(yMax / 5);
    const y = v => m.t + ph - (v / yMax) * ph;
    const gw = pw / Math.max(1, cats.length), n = Math.max(1, series.length);
    const bw = Math.min(58, (gw * 0.72) / n), groupW = bw * n;
    const id = nid(), tid = id + 't', did = id + 'd';
    let grid = '';
    for (let v = 0; v <= yMax + 1e-9; v += step) {
      grid += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${r1(y(v))}" y2="${r1(y(v))}"/><text class="tick" x="${m.l - 9}" y="${r1(y(v) + 4)}" text-anchor="end">${fmt(v)}</text>`;
    }
    let bars = '';
    cats.forEach((c, ci) => {
      const x0 = m.l + ci * gw + (gw - groupW) / 2;
      series.forEach((sr, si) => {
        const v = num((sr.values || [])[ci]);
        const x = x0 + si * bw, h = Math.max(0, ph * (v / yMax));
        bars += `<rect class="bar s${si}" x="${r1(x + 3)}" y="${r1(y(v))}" width="${r1(bw - 6)}" height="${r1(h)}" rx="3"><title>${esc(c)} · ${esc(sr.name)}: ${fmt(v)}</title></rect>`;
        if (si === 1) bars += `<rect x="${r1(x + 3)}" y="${r1(y(v))}" width="${r1(bw - 6)}" height="${r1(h)}" rx="3" fill="url(#${id}h)" pointer-events="none"/>`;
        bars += `<text class="val" x="${r1(x + bw / 2)}" y="${r1(y(v) - 6)}" text-anchor="middle">${fmt(v)}</text>`;
      });
      const cx = r1(m.l + ci * gw + gw / 2), lines = String(c).split('\n');
      bars += `<text class="cat" x="${cx}" y="${H - m.b + 22}" text-anchor="middle">${lines.map((ln, li) => `<tspan x="${cx}" dy="${li ? 15 : 0}">${esc(ln)}</tspan>`).join('')}</text>`;
    });
    const axes = `<line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t + ph}"/><line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ph}" y2="${m.t + ph}"/>`;
    const ylab = s.yLabel ? `<text class="ylab" transform="translate(16 ${r1(m.t + ph / 2)}) rotate(-90)" text-anchor="middle">${esc(s.yLabel)}</text>` : '';
    const legend = `<div class="legend" aria-hidden="true">${series.map((sr, i) => `<span class="lg"><i class="sw s${i}"></i>${esc(sr.name)}</span>`).join('')}</div>`;
    const desc = `Grouped bar chart with ${cats.length} categories and ${series.length} series. ` + cats.map((c, ci) => `${String(c).replace(/\n/g, ' ')}: ` + series.map(sr => `${sr.name} ${fmt(num((sr.values || [])[ci]))}`).join(', ')).join('. ') + '.';
    const srTable = `<div class="sr-only"><table><caption>${esc(s.title || 'Chart data')}</caption><thead><tr><th scope="col">Category</th>${series.map(sr => `<th scope="col">${esc(sr.name)}</th>`).join('')}</tr></thead><tbody>${cats.map((c, ci) => `<tr><th scope="row">${esc(String(c).replace(/\n/g, ' '))}</th>${series.map(sr => `<td>${fmt(num((sr.values || [])[ci]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    return `<figure class="stim stim-bar">${title(s.title)}${legend}<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid} ${did}"><title id="${tid}">${esc(s.title || 'Bar chart')}</title><desc id="${did}">${esc(desc)}</desc><defs><pattern id="${id}h" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,.55)" stroke-width="2"/></pattern></defs>${grid}${axes}${bars}${ylab}</svg></div>${srTable}${s.text ? `<p class="stim-text">${esc(s.text)}</p>` : ''}${source(s.source)}</figure>`;
  }

  /* ---------- district maps ---------- */
  function districtMap(s) {
    const g = s.grid || {}, R = num(g.rows) || (g.blueShare || []).length, C = num(g.cols) || ((g.blueShare || [])[0] || []).length;
    const bs = g.blueShare || [];
    const cell = 50, pad = 4, W = C * cell + pad * 2, H = R * cell + pad * 2;
    const plans = (s.plans || []).map((p, pi) => {
      const dmap = {};
      (p.districts || []).forEach((d, di) => d.forEach(rc => { dmap[rc[0] + ',' + rc[1]] = di; }));
      let cells = '', borders = '';
      const X = c => pad + c * cell, Y = r => pad + r * cell;
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        const v = num((bs[r] || [])[c]);
        const blue = v >= 50;
        cells += `<rect class="pc ${blue ? 'blue' : 'orange'}" x="${X(c)}" y="${Y(r)}" width="${cell}" height="${cell}"/><text class="pval" x="${X(c) + cell / 2}" y="${Y(r) + cell / 2 + 5}" text-anchor="middle">${fmt(v)}</text>`;
        const me = dmap[r + ',' + c];
        const diff = (rr, cc) => rr < 0 || cc < 0 || rr >= R || cc >= C || dmap[rr + ',' + cc] !== me;
        if (diff(r - 1, c)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r)}" x2="${X(c) + cell}" y2="${Y(r)}"/>`;
        if (diff(r, c - 1)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r)}" x2="${X(c)}" y2="${Y(r) + cell}"/>`;
        if (diff(r + 1, c)) borders += `<line class="dline" x1="${X(c)}" y1="${Y(r) + cell}" x2="${X(c) + cell}" y2="${Y(r) + cell}"/>`;
        if (diff(r, c + 1)) borders += `<line class="dline" x1="${X(c) + cell}" y1="${Y(r)}" x2="${X(c) + cell}" y2="${Y(r) + cell}"/>`;
      }
      const did = nid();
      const desc = (p.districts || []).map((d, di) => `District ${di + 1}: ` + d.map(rc => `row ${rc[0] + 1} column ${rc[1] + 1} (${fmt(num((bs[rc[0]] || [])[rc[1]]))}% Blue)`).join(', ')).join('. ');
      return `<figure class="dplan"><svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${did}"><title id="${did}">${esc(p.name || 'Plan ' + (pi + 1))}. ${esc(desc)}</title><g>${cells}</g><g>${borders}</g></svg><figcaption>${esc(p.name || 'Plan ' + (pi + 1))}</figcaption></figure>`;
    });
    const legend = `<div class="legend"><span class="lg"><i class="sw pblue"></i>Majority Blue Party (≥ 50)</span><span class="lg"><i class="sw porange"></i>Majority Orange Party (&lt; 50)</span><span class="lg"><i class="sw dline"></i>District boundary</span></div>`;
    return `<figure class="stim stim-dmap dmap">${title(s.title)}${s.note ? `<p class="stim-note">${esc(s.note)}</p>` : ''}<div class="dplans">${plans.join('')}</div>${legend}${s.resultsTable ? `<div class="dresults">${title(s.resultsTable.title)}${tableHTML(s.resultsTable, s.resultsTable.title)}</div>` : ''}${source(s.source)}</figure>`;
  }

  /* ---------- schematic maps ---------- */
  const pts = poly => (poly || []).map(p => `${r1(num(p[0]))},${r1(num(p[1]))}`).join(' ');
  function bbox(poly) {
    const xs = poly.map(p => num(p[0])), ys = poly.map(p => num(p[1]));
    return { x1: Math.min(...xs), y1: Math.min(...ys), x2: Math.max(...xs), y2: Math.max(...ys) };
  }
  const contains = (a, b) => a.x1 <= b.x1 && a.y1 <= b.y1 && a.x2 >= b.x2 && a.y2 >= b.y2 && (a.x2 - a.x1) * (a.y2 - a.y1) > (b.x2 - b.x1) * (b.y2 - b.y1);
  function wrap(text, max) {
    const words = String(text || '').split(/\s+/), lines = []; let cur = '';
    words.forEach(w => { if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
    if (cur) lines.push(cur);
    return lines;
  }
  function star(cx, cy, R, r, n) {
    let d = '';
    for (let i = 0; i < n * 2; i++) {
      const a = Math.PI / n * i - Math.PI / 2, rad = i % 2 ? r : R;
      d += (i ? 'L' : 'M') + r1(cx + rad * Math.cos(a)) + ',' + r1(cy + rad * Math.sin(a));
    }
    return d + 'Z';
  }
  function ownerKey(owner) { return String(owner || '').replace(/\s*\(.*$/, '').trim() || 'owner'; }

  function schematicMap(s) {
    const cv = s.canvas || {}, W = num(cv.width) || 800, H = num(cv.height) || 400;
    const feats = Array.isArray(s.features) ? s.features : [];
    const id = nid();
    const L = { claims: '', zones: '', hatchZones: '', land: '', lines: '', markers: '', labels: '', arrows: '', scale: '', brackets: '' };
    const owners = [];
    const ownerIdx = o => { const k = ownerKey(o); let i = owners.indexOf(k); if (i < 0) { owners.push(k); i = owners.length - 1; } return i; };
    const claimShapes = {};
    const zones = feats.filter(f => f.kind === 'zone' && Array.isArray(f.polygon));
    const zb = zones.map(z => bbox(z.polygon));
    const descBits = [];

    feats.forEach((f, fi) => {
      const kind = f.kind;
      if (kind === 'land' && Array.isArray(f.polygon)) {
        const cls = f.style === 'power' ? 'power' : f.style === 'small' ? 'small' : '';
        L.land += `<polygon class="land ${cls}" points="${pts(f.polygon)}"><title>${esc(f.name || 'Land')}</title></polygon>`;
        if (f.labelAt && f.name) {
          const lb = bbox(f.polygon), perChar = f.style === 'power' ? 10.5 : 8.5;
          const lines = wrap(f.name, Math.max(8, Math.floor((lb.x2 - lb.x1 - 8) / perChar)));
          const lh = f.style === 'power' ? 22 : 18, y0 = num(f.labelAt[1]) + 6 - (lines.length - 1) * lh / 2;
          lines.forEach((ln, i) => { L.labels += `<text class="lbl ${f.style === 'power' ? 'big' : ''}" x="${r1(num(f.labelAt[0]))}" y="${r1(y0 + i * lh)}">${esc(ln)}</text>`; });
        }
        descBits.push(f.name);
      } else if (kind === 'territorialSea') {
        const oi = ownerIdx(f.owner);
        let shape = '';
        if (f.circle && f.circle.center) shape = `<circle cx="${r1(num(f.circle.center[0]))}" cy="${r1(num(f.circle.center[1]))}" r="${r1(num(f.circle.radius))}"/>`;
        else if (Array.isArray(f.polygon)) shape = `<polygon points="${pts(f.polygon)}"/>`;
        (claimShapes[oi] = claimShapes[oi] || []).push(shape);
        descBits.push(`${f.owner || 'claim'} territorial sea claim`);
      } else if (kind === 'island' && f.center) {
        const cx = r1(num(f.center[0])), cy = r1(num(f.center[1])), rr = r1(num(f.radius) || 10);
        L.land += `<circle class="island" cx="${cx}" cy="${cy}" r="${rr}"><title>${esc(f.name || 'Island')}</title></circle>`;
        if (f.name) L.labels += `<text class="lbl sm" x="${cx}" y="${r1(cy + rr + 15)}">${esc(f.name)}</text>`;
        descBits.push(f.name);
      } else if (kind === 'zone' && Array.isArray(f.polygon)) {
        const zi = zones.indexOf(f), b = zb[zi];
        const inside = zb.some((o, j) => j !== zi && contains(o, b));
        const holds = zb.some((o, j) => j !== zi && contains(b, o));
        const shade = Math.min(3, zi);
        if (inside) L.hatchZones += `<polygon class="zone hatch" points="${pts(f.polygon)}" fill="url(#${id}zh)"><title>${esc(f.name || 'Zone')}</title></polygon>`;
        else { const poly = `<polygon class="zone z${shade}" points="${pts(f.polygon)}"><title>${esc(f.name || 'Zone')}</title></polygon>`; L.zones = holds ? poly + L.zones : L.zones + poly; }
        if (holds) L.brackets += `<path class="bracket" d="M${r1(b.x1 + 3)},${r1(b.y2 - 16)} v9 H${r1(b.x2 - 3)} v-9"/>`;
        if (f.labelAt) {
          const lx = r1(num(f.labelAt[0])), ly = r1(num(f.labelAt[1]));
          L.labels += `<text class="lbl" x="${lx}" y="${ly}">${esc(f.name || '')}</text>`;
          if (f.sublabel) wrap(f.sublabel, Math.max(10, Math.min(30, Math.floor((b.x2 - b.x1 - 10) / 6.6)))).forEach((ln, i) => { L.labels += `<text class="sub" x="${lx}" y="${ly + 17 + i * 14}">${esc(ln)}</text>`; });
        }
        descBits.push(`${f.name}${f.sublabel ? ' (' + f.sublabel + ')' : ''}`);
      } else if ((kind === 'line' || kind === 'shippingLane') && Array.isArray(f.line)) {
        const dash = f.dashed ? ` stroke-dasharray="${kind === 'shippingLane' ? '14 9' : '7 6'}"` : '';
        L.lines += `<polyline class="${kind === 'shippingLane' ? 'lane' : 'line'}" points="${pts(f.line)}"${dash}><title>${esc(f.name || kind)}</title></polyline>`;
        descBits.push(f.name || kind);
      } else if (kind === 'marker' && Array.isArray(f.points)) {
        f.points.forEach(p => {
          const x = r1(num(p[0])), y = r1(num(p[1]));
          if (f.symbol === 'conflict') L.markers += `<path class="conflict" d="${star(x, y, 11, 5, 8)}"><title>${esc(f.name || 'Conflict')}</title></path>`;
          else if (f.symbol === 'baseN' || f.symbol === 'baseS') L.markers += `<rect class="${f.symbol}" x="${x - 7}" y="${y - 7}" width="14" height="14" rx="2"><title>${esc(f.name || 'Base')}</title></rect>`;
          else if (f.symbol === 'house') L.markers += `<path class="house" d="M${x - 7},${y + 6} V${y - 1} L${x},${y - 7} L${x + 7},${y - 1} V${y + 6} Z"><title>${esc(f.name || 'House')}</title></path>`;
          else L.markers += `<circle class="baseN" cx="${x}" cy="${y}" r="6"><title>${esc(f.name || 'Marker')}</title></circle>`;
        });
        descBits.push(`${f.name || 'markers'} at ${f.points.length} location${f.points.length === 1 ? '' : 's'}`);
      } else if (kind === 'arrow' && f.from && f.to) {
        L.arrows += `<line class="arrow" x1="${r1(num(f.from[0]))}" y1="${r1(num(f.from[1]))}" x2="${r1(num(f.to[0]))}" y2="${r1(num(f.to[1]))}" marker-end="url(#${id}ah)"><title>${esc(f.name || 'Arrow')}</title></line>`;
        descBits.push(f.name || 'arrow');
      } else if (kind === 'scaleBar' && f.from && f.to) {
        const x1 = r1(num(f.from[0])), y1 = r1(num(f.from[1])), x2 = r1(num(f.to[0])), y2 = r1(num(f.to[1]));
        L.scale += `<line class="scale" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="scale" x1="${x1}" y1="${y1 - 5}" x2="${x1}" y2="${y1 + 5}"/><line class="scale" x1="${x2}" y1="${y2 - 5}" x2="${x2}" y2="${y2 + 5}"/>${f.label ? `<text class="scalelbl" x="${r1((x1 + x2) / 2)}" y="${y1 - 8}">${esc(f.label)}</text>` : ''}`;
      }
    });
    Object.keys(claimShapes).forEach(oi => {
      const i = +oi, cls = i === 0 ? 'a' : 'b';
      L.claims += `<g class="claim ${cls}" opacity="${i === 0 ? '.38' : '.34'}">${claimShapes[oi].join('')}</g>`;
      if (i === 1) L.claims += `<g fill="url(#${id}ch)" opacity=".9">${claimShapes[oi].join('')}</g>`;
    });
    const legend = Array.isArray(s.legend) && s.legend.length ? `<div class="legend">${s.legend.map(item => `<span class="lg">${swatch(item.swatch)}${esc(item.label)}</span>`).join('')}</div>` : '';
    const tid = id + 't', did = id + 'd';
    const desc = (s.description ? s.description + ' ' : '') + 'Map features: ' + descBits.filter(Boolean).join('; ') + '.';
    const svg = `<div class="smap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid} ${did}"><title id="${tid}">${esc(s.title || 'Map')}</title><desc id="${did}">${esc(desc)}</desc><defs><pattern id="${id}zh" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><line class="hatchline" x1="0" y1="0" x2="0" y2="9"/></pattern><pattern id="${id}ch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(-45)"><line class="claim-hatch" x1="0" y1="0" x2="0" y2="10"/></pattern><marker id="${id}ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="water" x="0" y="0" width="${W}" height="${H}"/>${L.zones}${L.hatchZones}${L.claims}${L.land}${L.lines}${L.brackets}${L.markers}${L.arrows}${L.labels}${L.scale}</svg></div>`;
    return `<figure class="stim stim-smap">${title(s.title)}${svg}${legend}${s.description ? `<p class="stim-desc">${esc(s.description)}</p>` : ''}${s.note ? `<p class="stim-note">${esc(s.note)}</p>` : ''}${source(s.source)}</figure>`;
  }
  /* ---------- von Thünen-style concentric ring diagram ---------- */
  function rings(s) {
    const rs = Array.isArray(s.rings) ? s.rings : [];
    const W = 640, H = 420, cx = 320, cy = 210, r0 = 46, step = Math.max(28, Math.floor((190 - r0) / Math.max(1, rs.length)));
    const id = nid(), tid = id + 't', did = id + 'd';
    let body = '', labels = '';
    for (let i = rs.length - 1; i >= 0; i--) {
      const R = r0 + step * (i + 1);
      body += `<circle class="ring r${i % 4}" cx="${cx}" cy="${cy}" r="${R}"><title>${esc('Ring ' + (rs[i].label || i + 1))}</title></circle>`;
    }
    rs.forEach((rg, i) => {
      const mid = r0 + step * i + step / 2;
      [[cx + mid, cy], [cx - mid, cy], [cx, cy - mid], [cx, cy + mid]].forEach(([x, y]) => {
        labels += `<text class="rlbl" x="${r1(x)}" y="${r1(y + 6)}">${esc(rg.label || String(i + 1))}</text>`;
      });
    });
    const outerR = r0 + step * rs.length;
    const outer = s.outer ? `<text class="rout" x="${W - 14}" y="${H - 14}" text-anchor="end">${esc(s.outer)}</text><text class="rout" x="14" y="26" text-anchor="start">${esc(s.outer)}</text>` : '';

    }
  }
  function viewReview() {
    const r = E.result, unit = E.unit, f = S.rvFilter || 'all';
    const list = E.qs.map((q, i) => ({ q, i })).filter(o => f === 'all' || E.answers[o.q.id] !== o.q.answer);
    const seenSets = {};
    const items = list.map(({ q, i }) => {
      const pick = E.answers[q.id], ok = pick === q.answer, state = !pick ? 'skip' : ok ? 'ok' : 'bad';
      const st = stimOf(unit, q); let stimHTML = '';
      if (st) {
        const lbl = setLabel(E.qs, q, st);
        if (seenSets[q.set]) stimHTML = `<details class="more"><summary>Show the source again (${esc(lbl.replace(/\s*refers? to.*$/i, ''))})</summary><div class="inner">${STIM.render(st, { glossary: true })}</div></details>`;
        else { stimHTML = `<div class="setlabel">${esc(lbl)}</div>${STIM.render(st, { glossary: true })}`; seenSets[q.set] = true; }
      }
      return `<article class="rv ${state}" id="rv${i + 1}"><header><span class="rn">Question ${i + 1}</span><span class="rvb ${state}">${state === 'ok' ? '✓ Correct' : state === 'bad' ? '✗ Missed' : '– Not answered'}</span>${metaTag(unit, q)}</header>${stimHTML}<p class="stem">${esc(q.stem)}</p>
        <ol class="rvopts" aria-label="Answer choices">${LETTERS.map(L => { const isC = L === q.answer, isP = L === pick; const cls = isC ? 'is-correct' : isP ? 'is-pick' : ''; const mk = isC && isP ? '✓ Your answer · correct' : isC ? '✓ Correct answer' : isP ? '✗ Your answer' : ''; return `<li class="${cls}"><span class="ltr" aria-hidden="true">${L}</span><div><span class="sr-only">${L}. </span>${esc(q.options[L])}${mk ? `<span class="mk">${mk}</span>` : ''}</div></li>`; }).join('')}</ol>
        <div class="fbk ${ok ? 'ok' : 'bad'}"><div class="ico" aria-hidden="true">${ok ? '✓' : '✗'}</div><div class="body"><h4>${ok ? 'Why this is right' : `The answer is ${q.answer}`}</h4><p class="exp">${esc(q.explanation)}</p>
        ${q.rationales ? `<details class="more"><summary>Notes on every choice</summary><div class="inner">${LETTERS.map(L => `<div class="rat ${L === q.answer ? 'correct' : ''}"><span class="ltr" aria-hidden="true">${L}</span><div><b>${L}.</b> ${esc(q.rationales[L] || '')}</div></div>`).join('')}</div></details>` : ''}</div></div></article>`;
    }).join('');
    return topbar(`${upill(unit)}<span class="ellip">Review</span>`, `<button class="act quiet sm" data-act="x-back-score">← Score report</button>`) + `<main id="main"><div class="review"><div class="rvhead"><h2>Review · ${r.correct}/${r.total}</h2><div class="seg" role="group" aria-label="Filter"><button data-act="x-review-filter" data-arg="all" aria-pressed="${f === 'all'}">All ${r.total}</button><button data-act="x-review-filter" data-arg="missed" aria-pressed="${f === 'missed'}">Missed only (${r.missed.length})</button></div></div>
      ${items || `<div class="empty">Nothing missed. Every answer was correct.</div>`}
      <div class="acts center"><button class="act ghost" data-act="x-back-score">← Score report</button><button class="act ghost" data-act="x-retake">Retake</button><button class="act soft" data-act="home">Back to units</button></div></div></main>`;
  }

  /* ---- celebration (score report only; practice uses a tiny CSS burst) ---- */
  function confetti() {
    if (reducedMotion()) return;
    let cv = document.getElementById('confetti');
    if (!cv) { cv = document.createElement('canvas'); cv.id = 'confetti'; cv.setAttribute('aria-hidden', 'true'); document.body.appendChild(cv); }
    const ctx = cv.getContext('2d'); if (!ctx) return;
    cv.width = innerWidth; cv.height = innerHeight;
    const cols = ['#B8923A', '#D4B05E', '#1A2D52', '#8B2A2A', '#3E6B4F', '#6B3A5B'];
    const ps = Array.from({ length: 110 }, () => ({ x: innerWidth / 2 + 240 * (Math.random() - .5), y: innerHeight * .3, vx: 13 * (Math.random() - .5), vy: -11 * Math.random() - 4, g: .3 + .2 * Math.random(), r: 4 + 5 * Math.random(), c: cols[Math.random() * cols.length | 0], a: 6.28 * Math.random(), va: .3 * (Math.random() - .5) }));
    const t0 = performance.now();
    (function frame(t) {
      const k = (t - t0) / 1700; ctx.clearRect(0, 0, cv.width, cv.height);
      if (k >= 1) { cv.remove(); return; }
      ps.forEach(p => { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k * k); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); });
      requestAnimationFrame(frame);
    })(t0);
  }

  /* =================================================================
     render + events
     ================================================================= */
  function view() {
    switch (S.screen) {
      case 'ptopics': return viewTopics();
      case 'practice': return viewPractice();
      case 'psummary': return viewSummary();
      case 'xintro': return viewIntro();
      case 'exam': return viewExam();
      case 'xscore': return viewScore();
      case 'xreview': return viewReview();
      default: return viewHome();
    }
  }
  function render() {
    document.body.classList.toggle('exam', /^x|^exam$/.test(S.screen));
    document.body.classList.toggle('practice', /^p/.test(S.screen));
    app.innerHTML = view();
    keepStim();
    markScrollables();
    if (S.screen === 'exam') {
      if (E.navOpen) { const f = app.querySelector('.drawer .navq.cur') || app.querySelector('.drawer button'); if (f) f.focus(); }
      else if (E.confirm) { const f = document.getElementById('cfback'); if (f) f.focus(); }
    }
  }
  // Keep the same source element while moving between questions of one set, so highlights stay put.
  const stimCache = new Map();
  function keepStim() {
    if (S.screen !== 'exam' && S.screen !== 'practice') return;
    const w = app.querySelector('.stimwrap[data-set]'); if (!w || !w.dataset.set) return;
    const key = S.screen + ':' + w.dataset.set, old = stimCache.get(key);
    if (old && old !== w) w.replaceWith(old); else stimCache.set(key, w);
  }
  /* ---- highlighter (passages only), like Bluebook's highlight tool ---- */
  let hlBtn = null;
  function hlRange() {
    const sel = window.getSelection && window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
    const r = sel.getRangeAt(0);
    const p1 = r.startContainer.parentElement && r.startContainer.parentElement.closest('.psg-text p');
    const p2 = r.endContainer.parentElement && r.endContainer.parentElement.closest('.psg-text p');
    if (!p1 || p1 !== p2 || !app.contains(p1) || !p1.closest('.scol')) return null;
    if (!r.toString().trim()) return null;
    return r;
  }
  function placeHl() {
    const r = hlRange();
    if (!r) { if (hlBtn) hlBtn.hidden = true; return; }
    if (!hlBtn) {
      hlBtn = document.createElement('button'); hlBtn.type = 'button'; hlBtn.className = 'hlbtn'; hlBtn.textContent = '🖍 Highlight';
      hlBtn.addEventListener('mousedown', e => e.preventDefault());
      hlBtn.addEventListener('click', () => { const rr = hlRange(); if (rr) { const m = document.createElement('mark'); m.className = 'hl'; m.title = 'Tap to remove highlight'; m.appendChild(rr.extractContents()); rr.insertNode(m); window.getSelection().removeAllRanges(); announce('Highlighted'); } hlBtn.hidden = true; });
      document.body.appendChild(hlBtn);
    }
    const b = r.getBoundingClientRect();
    hlBtn.hidden = false;
    hlBtn.style.left = Math.max(8, Math.min(innerWidth - 130, b.left + b.width / 2 - 60)) + 'px';
    hlBtn.style.top = Math.max(8, b.top - 46) + 'px';
  }
  document.addEventListener('mouseup', () => setTimeout(placeHl, 0));
  document.addEventListener('touchend', () => setTimeout(placeHl, 250));
  document.addEventListener('selectionchange', () => { if (hlBtn && !hlBtn.hidden && !hlRange()) hlBtn.hidden = true; });
  window.addEventListener('scroll', () => { if (hlBtn) hlBtn.hidden = true; }, true);
  app.addEventListener('click', ev => {
    const m = ev.target.closest && ev.target.closest('mark.hl'); if (!m) return;
    const sel = window.getSelection(); if (sel && !sel.isCollapsed) return;
    const par = m.parentNode; while (m.firstChild) par.insertBefore(m.firstChild, m); m.remove(); par.normalize(); announce('Highlight removed');
  });

  // Charts and tables keep a minimum width so labels stay legible; on phones they scroll sideways.
  function markScrollables() {
    app.querySelectorAll('.scrollhint').forEach(h => h.remove());
    app.querySelectorAll('.chart, .smap, .tscroll').forEach(el => {
      if (el.scrollWidth > el.clientWidth + 4) {
        const h = document.createElement('div'); h.className = 'scrollhint'; h.textContent = 'Swipe sideways to see the whole ' + (el.classList.contains('chart') ? 'chart' : el.classList.contains('smap') ? 'map' : 'table');
        el.parentNode.insertBefore(h, el);
      }
    });
  }
  let rsz = null;
  window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(markScrollables, 150); });
  app.addEventListener('toggle', ev => { const d = ev.target; if (d && d.dataset && d.dataset.hint && P) P.hints[d.dataset.hint] = d.open; }, true);
  const actions = {
    'home': () => { S.screen = 'home'; S.showCopy = false; render(); window.scrollTo(0, 0); },
    'ptopics': arg => { S.unit = +arg; S.screen = 'ptopics'; render(); window.scrollTo(0, 0); },
    'p-start': arg => startPractice(S.unit, arg),
    'p-pick': arg => pPick(arg),
    'p-next': () => pNext(),
    'p-stim': () => { P.stimOff = !P.stimOff; render(); const b = document.querySelector('.stoggle'); if (b) b.focus(); },
    'p-topics': () => { S.unit = P ? P.unit : S.unit; S.screen = 'ptopics'; render(); window.scrollTo(0, 0); },
    'p-missed': () => { const r = scoreSet(P.qs, P.answers); const lbl = P.label; startPractice(P.unit, P.topic, r.missed); P.label = 'Missed questions · ' + lbl; render(); },
    'xintro': arg => { S.unit = +arg; S.screen = 'xintro'; render(); window.scrollTo(0, 0); },
    'x-start': arg => { store.del('exam:' + arg); startExam(+arg, false); },
    'x-resume': arg => startExam(+arg, true),
    'x-pick': arg => xPick(arg),
    'x-elim': arg => xElim(arg),
    'x-prev': () => xGoto(E.i - 1),
    'x-next': () => xGoto(E.i + 1),
    'x-goto': arg => xGoto(+arg),
    'x-flag': () => xFlag(),
    'x-timer': () => { E.hideTimer = !E.hideTimer; const el = document.getElementById('tmr'); if (el) el.classList.toggle('hid', E.hideTimer && E.endsAt - Date.now() > 300000); const b = document.querySelector('.tmr-tg'); if (b) { b.textContent = E.hideTimer ? 'Show' : 'Hide'; b.setAttribute('aria-pressed', String(E.hideTimer)); } },
    'x-stim': () => { E.stimOff = !E.stimOff; render(); const b = document.querySelector('.stoggle'); if (b) b.focus(); },
    'x-nav': () => { E.navOpen = true; E.confirm = false; render(); },
    'x-nav-close': (arg, el, ev) => { if (ev && ev.target.closest('[data-stop]') && !ev.target.closest('[data-act="x-nav-close"]')) return; E.navOpen = false; render(); const b = document.getElementById('navbtn'); if (b) b.focus(); },
    'x-submit-ask': () => { E.confirm = true; E.navOpen = false; render(); },
    'x-confirm-close': (arg, el, ev) => { if (ev && ev.target.closest('[data-stop]') && !ev.target.closest('[data-act="x-confirm-close"]')) return; E.confirm = false; render(); const b = document.querySelector('[data-act="x-submit-ask"]'); if (b) b.focus(); },
    'x-submit': () => submitExam(false),
    'x-review': arg => { S.rvFilter = arg || 'all'; S.screen = 'xreview'; render(); window.scrollTo(0, 0); },
    'x-review-filter': arg => { S.rvFilter = arg; render(); },
    'x-back-score': () => { S.screen = 'xscore'; render(); window.scrollTo(0, 0); },
    'x-copy': () => copyResults(),
    'x-retake': () => startExam(E.unit, false)
  };
  app.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = actions[el.dataset.act]; if (fn) fn(el.dataset.arg, el, ev);
  });
  document.addEventListener('keydown', ev => {
    if (ev.defaultPrevented || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const tag = (ev.target && ev.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'input' || tag === 'select') return;
    const k = ev.key, L = k.length === 1 ? k.toUpperCase() : '';
    if (k === 'Escape' && E && S.screen === 'exam' && (E.navOpen || E.confirm)) { actions[E.navOpen ? 'x-nav-close' : 'x-confirm-close'](); return; }
    if (S.screen === 'practice' && P) {
      const q = P.qs[P.i];
      if (LETTERS.includes(L) && !P.answers[q.id]) { ev.preventDefault(); pPick(L); }
      else if (P.answers[q.id] && (k === 'ArrowRight' || L === 'N' || (k === 'Enter' && tag !== 'button' && tag !== 'summary' && tag !== 'a'))) { ev.preventDefault(); pNext(); }
    } else if (S.screen === 'exam' && E && !E.navOpen && !E.confirm) {
      if (LETTERS.includes(L)) { ev.preventDefault(); xPick(L); }
      else if (k === 'ArrowRight' && E.i + 1 < E.qs.length) { ev.preventDefault(); xGoto(E.i + 1); }
      else if (k === 'ArrowLeft' && E.i > 0) { ev.preventDefault(); xGoto(E.i - 1); }
      else if (L === 'F' && tag !== 'button') { ev.preventDefault(); xFlag(); }
    }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && E && !E.submitted && S.screen === 'exam') tick(); });
  window.addEventListener('pagehide', () => persistExam());

  // test hooks (used by the headless test run; harmless in production)
  window.PE = { state: () => ({ S, P, E }), setRemaining(sec) { if (E && !E.submitted) { E.endsAt = Date.now() + sec * 1000; persistExam(); tick(); } }, store };

  render();
})();
</script>
<style id="dm-css">
/* dark-mode toggle (shared) */
:root{--dm-tg-bg:#FBF7EE;--dm-tg-fg:#0F1B33;--dm-tg-b:rgba(15,27,51,.22);--dm-tg-font:'DM Sans',system-ui,-apple-system,sans-serif}
html.dm{--dm-tg-bg:#151D33;--dm-tg-fg:#D4B05E;--dm-tg-b:#2E3957}
.dm-tg{position:fixed;right:14px;bottom:14px;z-index:2147483000;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 10px;border-radius:999px;border:2px solid var(--dm-tg-b);background:var(--dm-tg-bg);color:var(--dm-tg-fg);font:600 13px/1 var(--dm-tg-font);letter-spacing:.01em;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.22);transition:transform .15s,box-shadow .15s,opacity .2s;-webkit-tap-highlight-color:transparent;opacity:.96}
.dm-tg:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.28);opacity:1}
.dm-tg:active{transform:translateY(0) scale(.97)}
.dm-tg:focus-visible{outline:3px solid #B8923A;outline-offset:3px}
.dm-tg svg{width:18px;height:18px;display:block}
.dm-tg .dm-sun{display:none}

@media (max-width:620px){.dm-tg{right:10px;bottom:10px;height:38px;padding:0 10px}.dm-tg .dm-lbl{display:none}}
@media print{.dm-tg{display:none !important}}
</style>
<script id="dm">
/* Dark mode add-on (GeoArcade / World Compass / Euro Atlas / Lang Studio). Follows the device setting, with a per-page toggle. */
(function(){
  if (window.__dmInit) return; window.__dmInit = 1;
  var d = document.documentElement, KEY = 'dm:pref', pref = null;
  try { pref = localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch (e) {}
  var mq = null; try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) {}
  function sys() { return !!(mq && mq.matches); }
  var on = pref ? pref === 'dark' : sys();
  d.classList.toggle('dm', on);
  var btn;
  function paint() {
    d.classList.toggle('dm', on);
    if (btn) {
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.setAttribute('title', on ? 'Switch to light mode' : 'Switch to dark mode');
      var l = btn.querySelector('.dm-lbl'); if (l) l.textContent = on ? 'Light' : 'Dark';
    }
    try { var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', on ? '#0F1527' : '#FBF7EE'); } catch (e) {}
  }
  function set(v, remember) {
    on = v; paint();
    if (remember) { try { localStorage.setItem(KEY, v ? 'dark' : 'light'); } catch (e) {} try { sessionStorage.setItem(KEY, v ? 'dark' : 'light'); } catch (e) {} }
  }
  function build() {
    if (btn || !document.body) return;
    btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'dm-tg'; btn.id = 'dmToggle';
    btn.setAttribute('aria-label', 'Toggle dark mode');
    btn.innerHTML = '<svg class="dm-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 14.6A8.5 8.5 0 0 1 9.4 3a1 1 0 0 0-1.1-1.3A10.5 10.5 0 1 0 22.3 15.7 1 1 0 0 0 21 14.6z"/></svg>'
      + '<svg class="dm-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg>'
      + '<span class="dm-lbl">Dark</span>';
    btn.addEventListener('click', function () { set(!on, true); });
    document.body.appendChild(btn);
    paint();
    // keep the button last in <body> so nothing re-renders over it
    new MutationObserver(function () { if (btn && document.body && document.body.lastElementChild !== btn && btn.isConnected) document.body.appendChild(btn); if (btn && !btn.isConnected) document.body.appendChild(btn); }).observe(document.body, { childList: true });
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', function (e) { if (!pref) set(e.matches, false); });
  else if (mq && mq.addListener) mq.addListener(function (e) { if (!pref) set(e.matches, false); });
  if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);
  window.__dm = { set: function (v) { set(!!v, true); }, get on() { return on; } };
})();

</script>
